################################################################################
#
#   CONFIGURATION FILE
#   This file contains all of the configuration options for the game.
#   You can change these options to customize the game to your liking.
#
#   Note: If you decide to use a custom config.yaml, it is recommended that you
#   copy only the properties you want to change of this file into your own
#   config.yaml.
#   When running the server, use the environment variable: CONFIG_PATH like so:
#   CONFIG_PATH=../mudfiles/config.yaml to specify where your custom config file
#   can be found.
#
#   This way when you update the server, your custom config file will not be
#   overwritten.
#
#   Note: The name/value pairs are hierarchical, nested under other values.
#   This means you must tab out values that belong under a namespace.
#   For example: MudName is tabbed out two spaces from Server
#   Alternatively, you can specify it using a dot-syntax in your overrides file:
#   Server.MudName: "GoMud"
#
################################################################################

################################################################################
#
#   SERVER CUSTOMIZATIONS
#   Small changes such as login commands and the seed can ensure your mud has
#   differences from others on the same code base.
#
################################################################################
Server:
  # - MudName -
  #   Display name of the MUD.
  #   This will be used a few places by default (such as the web pages).
  MudName: "DOGMud"
  # - Seed -
  #   The seed used for certain types of content generation
  #   To prevent certain secrets or content from being spoiled, you can set this
  #   to a random string.
  #   Note: Once the Mud has been played and data saved, changing this will
  #   probably break certain things that get saved to files, such as user KeyRings,
  #   so only set it before the first time you run the server.
  Seed: "DOGMud-Chrysalis-2026"
  # - MaxCPUCores -
  #   Maximum CPU cores to use. 0 for all available cores.
  #   Most of the game is single threaded, but there are a few things that can
  #   benefit from multiple cores, such as the web server and telnet server.
  MaxCPUCores: 0
  # - OnLoginCommands -
  #   Commands to run when a user logs in. These commands are run by the user
  #   and can be anything they have access to.
  OnLoginCommands:
  - 'emote @appears before you in a flash of <ansi fg="yellow-bold">⚡l<ansi fg="white-bold">i</ansi>gh<ansi fg="white-bold">tn</ansi>i<ansi fg="white-bold">n</ansi>g⚡</ansi>!'
  - print
  - motd
  - print
  - online
  - print
  - inbox check
  - print
  - mudletmap
  - checkclient
  # - Motd -
  #   Message of the day. This is displayed when the motd command is run.
  Motd: '{{ t "Please report bugs using the bug command!" }}'
  # - NextRoomID -
  # This number is auto-updated to the highest number of rooms in the game.
  #   If creating your own rooms but don't want to risk an update conflicting,
  #   update this to a large number (like 100000), so that as new rooms are
  #   created they will be far beyond the range of any room id's expected through
  #   a code update.
  NextRoomId: 1002
  # - Locked -
  #   All config names defined here are immutable to the `server set` admin
  #   command. They can only be changed by editing the config file directly.
  #   It is a good idea to lock configs related to folder/file paths to prevent
  #   accidental changes that could break the game.
  Locked:
  - FilePaths
  - Server.CurrentVersion
  - Server.NextRoomId
  - Server.Seed
  - Server.OnLoginCommands
  - Server.BannedNames

################################################################################
#
#   MEMORY/CPU OPTIMIZATIONS
#   Changes that can help reduce memory and CPU usage.
#
################################################################################
Memory:
  # - MaxMobBoredom -
  #   How many rounds a mob can go without seeing a player before a mob despawns.
  #   This is mainly a resource management feature to keep the game from getting
  #   bogged down with too many mobs in memory. If you want mobs to stick around
  #   indefinitely, set this to 0. Certain mobs may never despawn, however.
  MaxMobBoredom: 250
  # - MobUnloadThreshold -
  #   Do not unload any bots if the in-memory count is under this threshold.
  MobUnloadThreshold: 100
  # - RoomUnloadRounds -
  #   How many rounds must pass without a visitor before a room is considered
  #   for unloading from memory.
  RoomUnloadRounds: 450
  # - RoomUnloadThreshold -
  #   Do not unload any rooms if the in-memory count is under this threshold.
  RoomUnloadThreshold: 200

################################################################################
#
#   LOOT GOBLIN CONFIGURATIONS
#   This is a special mob that cleans up items and gold left on the ground.
#   It portals in from a special zone and when it can't find any items or gold
#   to pick up, it portals back.
#   Players can actually chase the goblin to its realm and possibly find some
#   treasure.
#
################################################################################
LootGoblin:
  # - RoomId -
  #   The room the loot goblin spawns in (per its spawninfo). Also the room it returns
  #   to to drop off loot it finds. If zero (0), no loot goblin spawning.
  RoomId: 139
  # - RoundCount -
  #   How often the Loot Goblin will spawn. It is a good idea to keep this
  #   number low to keep the game from getting bogged down with too many items
  #   on the ground. At 4 seconds per round, 900 rounds is 1 hour.
  RoundCount: 900
  # - MinimumItems -
  #   How many items there must be on the room to attract the loot goblin
  MinimumItems: 3
  # - MinimumGold -
  #   How much gold there must be on the room to attract the loot goblin
  MinimumGold: 100
  # - IncludeRecentRooms -
  #   If true, the loot goblin will also clean recently visited by players rooms
  #   If allowed, this could create a situation where a lot of loot drops and the
  #   suddenly the goblin shows up.
  IncludeRecentRooms: true


################################################################################
#
#   ENGINE TIMING
#   Fine tuning for input throttling, round time, day length etc.
#
################################################################################
Timing:
  # - TurnMs -
  #   How many milliseconds per turn. While lower is generally better, this can
  #   greatly increase overhead on the server - a command per mob or user is
  #   processed per turn. This is not the same as rounds, which is how often the
  #   mobs choose their actions, but if multiple actions are queued up, they will
  #   be processed in order once per turn.
  #   50 is a good balance between handling input from players and not bogging
  #   down the server.
  #   Note: If your automapper/walker seems slow, this is probably the culprit.
  TurnMs: 50
  # - RoundSeconds -
  #   How many seconds per round. Anything gated by rounds will be affected by
  #   this. This is the main setting for controlling the pace of the game.
  RoundSeconds: 4
  # - RoundsPerAutoSave -
  #   How often the server will automatically save the game state. This is a
  #   backup feature in case the server crashes. The game state is also saved
  #   whenever the server is shut down.
  RoundsPerAutoSave: 225
  # - RoundsPerDay -
  #   How many rounds are in a day? This is used to calculate the time of day.
  #   The lower this number, the faster the day/night cycle will be.
  #   A 4 second round and a 900 round day means the day/night cycle is 1 hour.
  RoundsPerDay: 900
  # - NightHours -
  #   How many hours of each 24 hour day will be nighttime?
  NightHours: 8

################################################################################
#
#   FILEPATH CONFIGURATIONS
#   Relative or absolute filepaths, and sometimes URI's
#
################################################################################
FilePaths:
  # - WebDomain -
  #   This can be mysite.com, or www.mysite.com, etc.
  #   Do not include the protocol such as http:// or https://
  WebDomain: "localhost"
  # - WebCDNLocation -
  #   Optional alternative location to serve static files from such as audio
  #   Example: http://files.gomud.net
  #   Leave blank if no CDN config or similar desired
  WebCDNLocation: ""
  # - DataFiles -
  #   The folder where all datafiles reside.
  #   If you are planning to create your own world, copying the current folder
  #   and its entire tree of content is a good place to start.
  DataFiles: _datafiles/world/dogmud
  # - PublicHtml -
  #   The folder where all web html files/templates reside.
  PublicHtml: _datafiles/html/public
  # - PublicHtml -
  #   The folder where all web ADMIN files/templates reside.
  AdminHtml: _datafiles/html/admin
  # - CarefulSaveFiles -
  #   If true, save files will be written to a temporary file and then saved over
  #   the actual file. This takes longer, but helps prevent file corruption if
  #   the server crashes during a save.
  CarefulSaveFiles: true
  # - HttpsCertFile/HttpsKeyFile -
  #   Used to negotiate TLS/https requests
  HttpsCertFile: ""
  HttpsKeyFile: ""

################################################################################
#
#   GAMEPLAY CONFIGURATIONS
#   These modify the way the game players, the pace/speed of the game, etc.
#
################################################################################
GamePlay:
  # ============================================================================
  # - RollSpread -  *** THE MASTER RANDOMNESS KNOB ***
  #
  #   Controls the standard deviation for EVERY stat-based dice roll in the
  #   game: all attacks, defenses, spell checks, grapples, bash/trip/kick, and
  #   skill/stat checks.  A single number that governs how chaotic or
  #   skill-dominant the entire game feels.
  #
  #   Formula: stdDev = stat_value * RollSpread
  #   At the human baseline (stat = 100): stdDev = 100 * RollSpread
  #
  #   GAMEPLAY FEEL BY VALUE:
  #     0.05  Very tight rolls. High-stat characters win ~99% of even matches.
  #           Almost no upsets. Feels deterministic; newcomers get crushed.
  #     0.10  Low variance. Skill/stat clearly dominates. Upsets are rare.
  #           A 20-point advantage translates to ~92% win rate.
  #     0.15  DEFAULT — recommended balanced spread.
  #           A 20-point advantage => ~78% win rate.
  #           A weaker fighter still has a ~16% chance if they're 30pts behind.
  #     0.20  Higher variance. Upsets are common. Combat feels dynamic.
  #           A 20-point advantage => only ~67% win rate.
  #     0.30  Chaotic. Luck rivals skill. Not recommended for competitive play.
  #           A 20-point advantage => barely 57% win rate.
  #
  #   CRIT / FUMBLE RATES:
  #     Unaffected by this setting. Crits trigger when a roll's z-score is
  #     >= +2.0 standard deviations above mean, which is always ~2.3% per roll
  #     regardless of the absolute stdDev value.
  #
  #   Valid range: 0.05-0.50. Values outside this range default to 0.15.
  #   Requires a server restart to take effect.
  # ============================================================================
  RollSpread: 0.15
  # - AllowItemBuffRemoval -
  #   Whether to allow the removal of buffs assigned by items using spells etc.
  #   By default, once an item has buffed a player, the player cannot remove the
  #   buff unless they removing the item. However, if set to true, players can
  #   temporarily remove the buff with spells, items, etc. and the buff will not
  #   return until the player re-equips the item, or logs out and back in.
  AllowItemBuffRemoval: false
  # Death settings
  Death:
    # - EquipmentDropChance -
    #   The chance that a player will drop a piece of worn/backpack equipment when
    #   they die. This is a percentage, so 0.5 is 50% chance.
    EquipmentDropChance: 0
    # - AlwaysDropBackpack -
    #   If true, players will always drop their backpack contents when they die.
    #   If false, it will failover to EquipmentDropChance.
    AlwaysDropBackpack: false
    # DOGMud death penalties (Stage 20.1)
    StatDecayMin: 1            # Min Training loss on 1 random stat
    StatDecayMax: 2            # Max Training loss on 1 random stat
    SkillRustCount: 1          # Number of skills to decay
    SkillRustAmount: 1         # Skill ranks lost per decayed skill
    SkillRecencyThreshold: 50  # Use count above which skills are protected
    DeathsShadowBuffId: 25     # Buff ID for Death's Shadow debuff
    # - ProtectionSkillRanks -
    #   Players with total skill ranks at or below this value are protected
    #   from death penalties. Gives new players a grace period.
    ProtectionSkillRanks: 10
    # - PermaDeath -
    #   If true, players lose their character if they die with zero lives left.
    PermaDeath: false
    # - CorpsesEnabled -
    #   If set to true, corpses are left behind by players or mobs that are killed.
    CorpsesEnabled: true
    # - CorpseDecayTime -
    #   How long until corpses crumble to dust (Go away).
    #   See ShopRestockRate comments for time format.
    CorpseDecayTime: 1 hour
  # - LivesStart -
  #   (Req: PermaDeath) How many lives players start with before being reset.
  LivesStart: 3
  # - LivesMax -
  #   (Req: PermaDeath) The maximum lives a player can have.
  LivesMax: 3
  # - PricePerLife -
  #   (Req: PermaDeath) If non-zero, players can buy extra lives for this amount.
  PricePerLife: 1000000
  # - ShopRestockRate -
  #   The default time for a shops to restock 1 item. This can still be
  #   overriden in character shop definitions if desired.
  #   Should be in the format of: {num} {unit}
  #   Unit can be: rounds, hours, days, weeks, months, years
  #   Default is in-game time, not real time. To use real time, use the following
  #   format: {num} real {unit} - Example: 1 real day
  ShopRestockRate: 6 hours
  # - ContainerSizeMax -
  #   Maximum number of objects a container can hold before stuff overflows
  ContainerSizeMax: 10
  # - MaxAltCharacters -
  #   How many characters beyond their original character can they create? Players
  #   can swap between characters and work on them independently if this is set
  #   greater than 0. Otherwise they are locked to a signle character and have to
  #   sign up with a new user login if they intend to create a new character.
  MaxAltCharacters: 3
  # - ConsistentAttackMessages -
  #   If true, each weapon ID will consistently use the same message for each type
  #   of attack. If false, it will randomize messages. Setting this to true gives
  #   each weapon a more consistent feel in battle, though combat may feel less
  #   varied.
  #   Note: see _datafiles/combat-messages/*
  ConsistentAttackMessages: false
  # - PVP -
  #   Possible Values:
  #     enabled   - PVP is enabled everywhere
  #     disabled  - PVP is disabled eveywhere
  #     limited   - PVP is enabled for all players but only in PVP enabled rooms
  PVP: limited
  # - PVPMinimumSkillRanks -
  #   Total skill ranks required to engage in PVP combat.
  PVPMinimumSkillRanks: 15
  # - MobConverseChance -
  #   Chance in 100 that the mob will attempt to converse when idle.
  MobConverseChance: 3
  # - UseSkillProgression -
  #   If true, skill and stat usage will trigger progression chance checks.
  UseSkillProgression: true
  # - DualProgressionMode -
  #   If true, successful progression checks grant actual skill/stat increases.
  #   Requires UseSkillProgression to be true. When enabled, progression
  #   checks grant actual skill/stat increases.
  DualProgressionMode: true
  # - SpellConvictionCostMultiplier -
  #   Global multiplier for spell conviction costs. Default 1.0 means no scaling.
  #   Set to 0.5 for half cost, 2.0 for double cost, etc.
  SpellConvictionCostMultiplier: 1.0
  # - SpellHealthCostMultiplier -
  #   Global multiplier for spell health costs (life-force magic). Default 1.0.
  #   Increase to make life-force magic more risky, decrease to make it safer.
  SpellHealthCostMultiplier: 1.0
  # ── Defense Stamina Costs ──
  # These ONLY affect how much stamina each defense costs. They do NOT
  # change how effective the defense is at avoiding hits.
  # Formula: cost = baseCost × multiplier  (dodge base=2, parry=4, block=5)
  # Example: DodgeMultiplier 0.9 → dodge costs floor(2×0.9) = 1 stamina
  # Example: BlockMultiplier 1.5 → block costs floor(5×1.5) = 7 stamina
  # To change defense EFFECTIVENESS, see Prone penalties below or add
  # equipment with higher ParryRating / BlockRating.
  DodgeMultiplier: 0.9           # Stamina cost multiplier for dodge (base: 2 SP)
  ParryMultiplier: 0.9           # Stamina cost multiplier for parry (base: 4 SP)
  BlockMultiplier: 0.9           # Stamina cost multiplier for block (base: 5 SP)
  #
  # ── Defense Effectiveness ──
  # MULTIPLIER on the defense score BEFORE the opposed roll. Applied in
  # all situations (standing, prone, grappled) — stacks with prone penalties.
  # Defense scores: Dodge = Dex + UnarmedSkill, Parry = Dex + WeaponSkill
  #   + ParryRating, Block = (Str+Dex)/2 + WeaponSkill + BlockRating.
  # 1.0 = no change. 1.2 = 20% stronger. 0.8 = 20% weaker.
  # Example: defender Dex 100, skill 10, DodgeEffectiveness 1.2:
  #   dodge score = (100 + 10) × 1.2 = 132 (vs attacker's ~110)
  DodgeEffectiveness: 0.97
  ParryEffectiveness: 1.0
  BlockEffectiveness: 1.02
  #
  # MinDefenseChance: Minimum probability that any defense succeeds, even
  #   when the attacker's score vastly outclasses the defender's. Acts as a
  #   floor so fights never feel like guaranteed hits. 0.15 = 15% minimum.
  #   Range: 0.0–0.50. Set to 0 to disable the floor entirely.
  MinDefenseChance: 0.15
  #
  # MinAttackHitChance: Minimum probability that any attack hits, even
  #   when the defender's score vastly outclasses the attacker's. Symmetric
  #   counterpart to MinDefenseChance. 0.15 = 15% minimum hit rate.
  #   Range: 0.0–0.50. Set to 0 to disable the floor entirely.
  MinAttackHitChance: 0.15
  #
  # ── Prone Condition Effects ──
  # When a character is knocked prone, these modify combat scores.
  # Defense scores are: Dodge = Dex + UnarmedSkill, Parry = Dex + WeaponSkill
  #   + weapon ParryRating, Block = (Str+Dex)/2 + WeaponSkill + BlockRating.
  #
  # ProneAttackMultiplier: MULTIPLIER on the attack score of a character
  #   attacking WHILE prone. Lower = harder to hit from the ground.
  #   Example: attacker score 110, multiplier 0.80 → score 88.
  ProneAttackMultiplier: 0.80
  #
  # ProneDodge/Parry/BlockPenalty: MULTIPLIER on the defense score of a
  #   prone DEFENDER. This is how much of their defense they keep.
  #   1.0 = full defense (no penalty). 0.50 = half defense. 0.0 = no defense.
  #   Example: defender has dodge score 100. At 0.90 → score 90. At 0.50 → 50.
  ProneDodgePenalty: 0.9        # Prone defender keeps 90% of dodge score
  ProneParryPenalty: 0.9        # Prone defender keeps 90% of parry score
  ProneBlockPenalty: 0.9        # Prone defender keeps 90% of block score
  #
  # ProneDamagePenalty: MULTIPLIER on damage dealt by a character attacking
  #   WHILE prone. 0.80 = deals 80% of normal damage from the ground.
  ProneDamagePenalty: 0.80
  #
  # ProneVulnerabilityMultiplier: MULTIPLIER on attack score when the
  #   TARGET is prone. Stacks with the defense penalties above.
  #   Example: attacker score 110, multiplier 1.15 → score 126.5.
  ProneVulnerabilityMultiplier: 1.15
  #
  StandStaminaCost: 0.15         # Fraction of max stamina to stand up (0.15 = 15%)
  StandMinStamina: 0.15          # Must have this fraction of max SP to stand
  #
  # ── Grapple Vulnerability ──
  # MULTIPLIER on defense score when attacked by a third party while
  # grappling. 0.70 = defender keeps 70% of defense. Only shield (block)
  # defenses are available; dodge/parry are stripped entirely.
  ThirdPartyGrapplePenalty: 0.70
  #
  # ── Special Combat Moves (bash, trip, kick) ──
  # All three share a cooldown so players can't spam knockdowns.
  SpecialMoveCooldown: 4         # Rounds between special moves
  #
  # DamagePercent: fraction of a normal melee hit's damage this move does.
  #   0.50 = deals half a normal swing's damage. 1.0 = full damage.
  # KnockdownChance: base % chance to knock the target prone on hit.
  #   Modified by attacker Str vs defender Str in the actual roll.
  BashDamagePercent: 0.50        # Bash: 50% of normal swing damage
  BashKnockdownChance: 50        # Bash: 50% base knockdown chance
  TripDamagePercent: 0.25        # Trip: 25% of normal swing damage
  TripKnockdownChance: 60        # Trip: 60% base knockdown chance
  KickDamagePercent: 0.40        # Kick: 40% of normal swing damage
  KickKnockdownChance: 35        # Kick: 35% base knockdown chance
  #
  # Coup de Grâce: rounds a mob waits before finishing a downed player.
  # 0 = disabled (mob walks away like before).
  CoupDeGraceRounds: 1

################################################################################
#
#   BALANCE
#   Every numeric gameplay-balance constant, grouped by subsystem.
#   All values here are the current defaults — change without recompiling.
#   Use "server set Balance.FieldName value" to override at runtime.
#
################################################################################
Balance:
  # ── COMBAT ──────────────────────────────────────────────────────────────────
  # These two are global panic buttons. 1.0 = no change. Not yet wired
  # into code — reserved for future "server set" runtime tuning.
  GlobalDamageMultiplier: 1.0
  GlobalDefenseMultiplier: 1.0
  #
  # Legacy unarmed knobs — still used by GetDefaultDistributionDamage()
  # for attack count and crit buff calculation. Actual unarmed damage is
  # controlled by UnarmedDamageMultiplier below.
  UnarmedBaseDamage: 2.0         # Legacy: base damage for attack count calc
  UnarmedStrengthDivisor: 25.0   # Legacy: Str / this = damage bonus
  UnarmedSkillDivisor: 10.0      # Legacy: UnarmedSkill / this = damage bonus
  UnarmedBaseVariance: 3.0       # Legacy: randomness of unarmed hits
  #
  # UnarmedDamageMultiplier: the "weapon multiplier" used when fighting
  # with bare fists. Works like a weapon's damage_multiplier field.
  # Also used as the fallback when a weapon has no multiplier set.
  # Example: Str 100, skill 0, MeleeDamageScale 0.05:
  #   raw = 100 × 1.0 × 0.30 × 0.05 = 1.5 (fists are weak)
  # A weapon with damage_multiplier 1.0 would do:
  #   raw = 100 × 1.0 × 1.0 × 0.05 = 5.0
  UnarmedDamageMultiplier: 0.30
  #
  # ── Per-Channel Damage Scales ──
  # All channels use the same formula:
  #   raw = stat × SkillMultiplier(rank) × itemMult × ChannelScale
  #
  # MeleeDamageScale: master knob for ALL physical (melee/ranged) damage
  #   for both players AND NPCs. Stats are ~100, so this directly sets
  #   the per-swing baseline at skill 0 with a 1.0x weapon.
  #   Examples at Str 100, skill 0, weapon 1.0x:
  #     0.05 →   5 raw damage per swing (current — low, needs MobDamageMultiplier)
  #     0.15 →  15 raw damage per swing
  #     0.30 →  30 raw damage per swing (original default)
  MeleeDamageScale: 0.05
  #
  # MobDamageMultiplier: extra multiplier applied ONLY to NPC melee
  #   damage. Lets you keep player damage low while making NPCs threatening.
  #   Example: MeleeDamageScale 0.05, MobDamageMultiplier 4.0:
  #     Player Str 100 → 100 × 1.0 × 1.0 × 0.05 = 5 raw (unchanged)
  #     Mob Str 100    → 100 × 1.0 × 1.0 × 0.05 × 4.0 = 20 raw
  MobDamageMultiplier: 4.0
  #
  # SpellDamageScale: multiplier on ALL spell damage output (players + NPCs).
  #   1.0 = no scaling. Example at Wil 100, skill 0, spell mult 1.0:
  #     1.0 → 100 raw,  1.5 → 150 raw,  0.5 → 50 raw
  SpellDamageScale: 1.5
  #
  # RhetoricDamageScale: multiplier on taunt/conviction damage output.
  #   Taunt uses itemMult 0.5 as base. Example at Cha 100, skill 0:
  #     1.0 → 50 raw,  2.0 → 100 raw
  RhetoricDamageScale: 2.0
  #
  # SkillMultiplierBase/Max: controls how much skill rank affects damage.
  #   At rank 0 the multiplier is Base, at soft cap (50) it's Max.
  #   Curve: mult = Base + (Max - Base) × sqrt(rank / 50)
  #   Example: rank 0 → 1.0x, rank 12 → 1.98x, rank 25 → 2.41x, rank 50 → 3.0x
  SkillMultiplierBase: 1.0
  SkillMultiplierMax: 3.0
  #
  # Mitigation caps: maximum % damage reduction from armor for each channel.
  # 0.75 = armor can block at most 75% of incoming damage in that channel.
  PhysicalMitigationCap: 0.75
  MagicalMitigationCap: 0.75
  ConvictionMitigationCap: 0.75
  #
  # ── Resource Depletion Penalties ──
  # As HP/SP/CP drain, combat effectiveness gradually decreases.
  # Formula: mult = 1 - maxPenalty × (1 - ratio)^curve
  #
  # ResourcePenaltyCurve: exponent controlling curve shape. Higher values
  #   make the penalty kick in later (closer to empty). At 2.0:
  #     100% resource → 0% penalty      50% → 7% penalty
  #      25% resource → 16% penalty      5% → 25% penalty
  #       0% resource → 28% penalty (= maxPenalty)
  ResourcePenaltyCurve: 2.0
  #
  # Per-pool max penalty (at 0% resource). Each pool affects different things:
  #   Health    → melee damage output (wounded = weaker swings)
  #   Stamina   → attack count + melee hit rate (exhausted = slower/sloppier)
  #   Conviction → taunt hit/damage + spell damage (demoralized = weaker magic)
  HealthPenaltyMax: 0.28         # At 0% HP: melee damage reduced by 28%
  StaminaPenaltyMax: 0.28        # At 0% SP: attacks/hit rate reduced by 28%
  ConvictionPenaltyMax: 0.28     # At 0% CP: taunt/spell reduced by 28%

  # ── REGEN RATES (fraction of pool max per tick; 0.01 = 1%) ────────────────
  PlayerHealthRegenPct: 0.01     # Player HP regen per tick (1% of HealthMax)
  PlayerStaminaRegenPct: 0.02    # Player stamina regen per tick
  PlayerConvictionRegenPct: 0.01 # Player conviction regen per tick
  MobHealthRegenPct: 0.01        # NPC HP regen per tick (1% of HealthMax)
  MobStaminaRegenPct: 0.01       # NPC stamina regen per tick
  MobConvictionRegenPct: 0.01    # NPC conviction regen per tick

  # ── STAMINA & CONVICTION ────────────────────────────────────────────────────
  MovementBaseStaminaCost: 2.0   # Flat cost to move on normal terrain
  MovementMaxStaminaCost: 20.0   # Ceiling for any single move action
  UnarmedAttackStaminaCost: 4    # Stamina per unarmed attack

  # ── RESOURCE MAXIMUMS ───────────────────────────────────────────────────────
  HealthBase: 5                  # Flat HP before stat contribution
  HealthPerStrength: 1           # Strength multiplier toward HealthMax
  HealthPerVitality: 4           # Vitality multiplier toward HealthMax (primary)
  StaminaBase: 5                 # Flat stamina before stat contribution
  StaminaPerStrength: 1          # Strength multiplier toward StaminaMax
  StaminaPerWillpower: 1         # Willpower multiplier toward StaminaMax
  StaminaPerVitality: 3          # Vitality multiplier toward StaminaMax (primary)
  ConvictionBase: 5              # Flat conviction before stat contribution
  ConvictionPerWilCha: 2         # (Wil+Cha) multiplier toward ConvictionMax

  # ── PROGRESSION ─────────────────────────────────────────────────────────────
  SkillSoftCap: 50               # Virtual ranks where progression slows sharply
  StatSoftCap: 150               # Stat value where progression slows sharply
  UsesPerRank: 25                # Skill/stat uses that equal one virtual rank
  BaseProgressionChance: 0.30    # Starting chance to progress at rank 0
  ProgressionDecayBelowCap: 3.0  # Exponential steepness below soft cap
  ProgressionDecayAboveCap: 2.0  # Exponential steepness above soft cap
  StatSoftCapThreshold: 105      # Raw stat value where adjusted formula kicks in
  StatSoftCapMultiplier: 2.0     # Multiplier in: 100 + sqrt(raw-100) * this

  # ── PER-STAT PROGRESSION MULTIPLIERS ────────────────────────────────────────
  # Scales the progression chance for each stat independently.
  # 1.0 = normal rate. Dexterity is 0.5 because weapon-combat and
  # unarmed-combat both map dexterity as their primary stat, firing
  # OnStatUse("dexterity") multiple times per combat round.
  StatProgressionMultipliers:
    strength: 1.0
    dexterity: 0.5
    perception: 1.0
    vitality: 1.0
    willpower: 1.0
    charisma: 1.0

  # ── PER-SKILL PROGRESSION MULTIPLIERS ───────────────────────────────────────
  # Overrides the hardcoded skill progression multipliers in skills.go.
  # Combat skills fire many times per round (low mult), utility skills
  # fire rarely (high mult). Only skills listed here override the defaults.
  SkillProgressionMultipliers:
    weapon-combat: 0.3
    unarmed-combat: 0.3
    ranged-combat: 0.3
    spellcasting: 0.5
    rhetoric: 0.5
    tracking: 2.0
    bartering: 2.0
    foraging: 2.0
    first-aid: 2.0
    stealth: 2.0
    blacksmithing: 2.0
    alchemy: 2.0
    tailoring: 2.0
    cooking: 2.0
    jewelcrafting: 2.0
    enchanting: 2.0

  # ── MOB PROGRESSION ──────────────────────────────────────────────────────────
  # When enabled, mobs gain stats and skills through combat just like players.
  # Mobs that survive longer become more dangerous. Progression resets when
  # the mob dies and respawns from its template.
  MobProgressionEnabled: true
  # How fast mobs progress relative to players. This multiplies the base
  # progression chance. At 0.5, mobs have half the chance per combat action
  # to gain a stat or skill point compared to a player doing the same action.
  # Range: 0.01-1.0. Lower = slower mob growth. 1.0 = same rate as players.
  MobProgressionRate: 0.5
  # Hard ceiling on any single stat a mob can reach through progression.
  # Prevents runaway growth if a mob survives many fights. The mob's base
  # stat from its template StatPool is NOT counted against this cap -- only
  # the final computed stat value matters. Default 200 (double human baseline).
  MobStatCap: 200
  # Maximum skill level a mob can reach through use-based progression.
  # Player soft cap is 50; mobs are intentionally much lower since they
  # fight constantly. At rank 3, the SkillMultiplier curve gives ~1.77x
  # damage -- meaningful but not overwhelming. Range: 1-50.
  MobSkillCap: 3

  # ── CHARACTER CREATION ──────────────────────────────────────────────────────
  StatRollMean: 100.0            # Target average for all stats at character creation
  StatRollStdDev: 15.0           # Standard deviation for stat rolls
  StatRollMin: 70.0              # Minimum stat value from rolls
  StatRollMax: 130.0             # Maximum stat value from rolls
  StartingHealth: 10             # Initial health points assigned at character creation

  # ── CRAFTING ────────────────────────────────────────────────────────────────
  CraftingBaseSuccessChance: 50  # % chance before skill adjustment
  CraftingSkillBonusPerLevel: 5  # +% per skill level above recipe minimum
  CraftingMinSuccessChance: 5    # Floor — never lower than this
  CraftingMaxSuccessChance: 95   # Ceiling — never higher than this

  # ── RECIPE DISCOVERY ──────────────────────────────────────────────────────
  RecipeDiscoveryBaseChance: 10.0   # Base % to discover a new recipe per successful craft
  RecipeDiscoveryDecayRate: 0.1    # Decay per known recipe: chance = base / (1 + known*this)

  # ── MUTATIONS ───────────────────────────────────────────────────────────────
  MutationBaseProgress: 50.0         # Progress needed for first mutation
  MutationProgressScale: 1.5         # Each additional mutation costs Scale^n more
  MutationMaxCount: 5                # Max simultaneous mutations per character
  MutationMaxLevel: 3                # Max level any single mutation can reach
  MutationProgressGainPerRound: 1.0  # Progress added per combat round
  MutationLevel2Multiplier: 1.5      # Effect scaling at mutation level 2
  MutationLevel3Multiplier: 2.0      # Effect scaling at mutation level 3

  # ── SPELLCASTING ──────────────────────────────────────────────────────
  SpellDiscoveryBaseChance: 10.0        # Base % to discover a new spell per successful cast
  SpellDiscoveryDecayRate: 0.1         # Decay per known spell: chance = base / (1 + known*this)
  SpellInitiationBase: 60              # Base % chance to initiate a spell
  SpellInitiationWillpowerDivisor: 4   # Willpower / this = initiation bonus
  SpellInitiationSkillFactor: 5        # Spellcasting level * this = initiation bonus
  SpellConcentrationBase: 50           # Base % concentration chance when struck
  SpellFoldsSkillFactor: 25            # Skill * this in folds-per-round calculation
  SpellAttackSkillFactor: 3            # Skill * this in spell attack mean
  SpellProficiencyCastsPerPoint: 50    # Casts needed per 1 proficiency point

  # ── ENCHANTMENTS ────────────────────────────────────────────────────────────
  EnchantTierUpBaseChance: 0.02     # Chance per use to advance tier once threshold met (2%)
  EnchantTierUsesBase: 25           # Uses needed for tier 0→1
  EnchantTierUsesScale: 2.5         # Multiplier per tier for uses threshold
  EnchantRemovalPenaltyRounds: 50   # Rounds of withdrawal after disenchant
  EnchantMaxTier: 4                 # Maximum tier enchantments can reach

  # ── MOON PHASES ─────────────────────────────────────────────────────────────
  MoonStatModMax: 0.05  # Max fractional stat modifier from moon phases (±5% at full/new moon)

################################################################################
#
#   LLM
#   Optional local LLM integration via Ollama for NPC dialogue.
#   Set Enabled to true and point Endpoint at your Ollama instance.
#
################################################################################
LLM:
  Enabled: true
  Endpoint: "http://localhost:11434"
  Timeout: 10

################################################################################
#

#   ANALYTICS
#   Combat analytics subsystem. When enabled, records combat events to a
#   ring buffer and periodically flushes aggregated summaries to a JSONL log.
#   Opt-in: set Enabled to true for data-driven balance tuning.
#
################################################################################
Analytics:
  Enabled: true
  MaxEvents: 250000
  FlushIntervalSec: 300
  LogPath: "_datafiles/logs/combat-analytics.jsonl"

################################################################################
#
#   INTEGRATIONS
#   Special settings for third party integrations such as discord messages
#
################################################################################
Integrations:
  # - Discord settings -
  Discord:
    # Optional webhook URL to send mud event messages to, such as joins/disconnects
    # Can also be set via environment variable: DISCORD_WEBHOOK_URL
    WebhookUrl: ''


################################################################################
#
#   TEXT FORMATS
#   Basic text strings that occur often, and may need customization
#
################################################################################
TextFormats:
  # - Prompt -
  #   Default prompt formatting.
  #   See: "help prompt" in game to learn more about this.
  Prompt: '{8}[{t} {255}HP:{hpbar} {255}SP:{stbar} {255}CP:{cvbar}{8}]{239}{h}{8}:'
  # - FightPrompt -
  #   Default fight prompt (shown during combat). Players can toggle individual
  #   elements with "set fprompt tog <name>" or set a fully custom string with
  #   "set fprompt <string>". See "help set-prompt" in game for all options.
  FightPrompt: '{8}[{t} {255}HP:{hpbar} SP:{stbar} CP:{cvbar}{pos}{8}] {255}» {target}{8}[{targetpos}{8}|{targethealth}{8}] {255}{tank}{tankpos}{tankbar}{239}{h}{8}:'
  # - TimeFormat -
  #   When real world time is shown, what format should be used?
  #   This uses a Go time format string, which is kinda weird.
  #   See: https://go.dev/src/time/format.go
  Time: 'Monday, 02-Jan-2006 3:04:05PM'
  # - TimeFormatShort -
  #   Same as TimeFormat, but shorter form
  TimeShort: 'Jan 2 ''06 3:04PM'
  # - EnterRoomMessageWrapper -
  #   Decorate entrance text with this. Put a %s where the message should be.
  EnterRoomMessageWrapper: "   <ansi fg=\"enters-message\"> >>> </ansi>%s\n"
  # - ExitRoomMessageWrapper -
  #   Decorate exit text with this. Put a %s where the message should be.
  ExitRoomMessageWrapper: "   <ansi fg=\"leaves-message\"> >>> </ansi>%s\n"

################################################################################
#
#   TRANSLATION SETTINGS
#   Custom game language translation settings.
#
################################################################################
Translation:
  # - DefaultLanguage -
  # Specify the default game language (fallback)
  DefaultLanguage: 'en'
  # - Language -
  # Specify the game language
  Language: 'en'
  # - LanguagePaths -
  # Specify the game language file paths
  LanguagePaths:
    - '_datafiles/localize'
    - '_datafiles/world/default/localize'

################################################################################
#
#   NETWORK SETTINGS
#   Custom network settings for the server. If you are running the server
#
################################################################################
Network:
  # - MaxTelnetConnections -
  #   The maximum number of telnet connections the server will accept.
  MaxTelnetConnections: 100
  # - TelnetPort -
  #   The port the server listens on for telnet connections. Listen on multiple
  #   ports by separating them with commas. For example, [33333, 33334, 33335]
  TelnetPort: [33333, 44444]
  # - LocalPort -
  #   A port that can only be accessed via localhost, but will not limit based on connection count
  LocalPort: 9999
  # - HttpPort -
  #   The port the server listens on for web requests
  #   0 (zero) means none.
  HttpPort: 80
  # - HttpsPort -
  #   The port the server listens on for web requests
  #   Note: Must have a cert/key file (See FilePaths)
  #   0 (zero) means none.
  HttpsPort: 0
  # - HttpsRedirect -
  #   If true, will send all http traffic to https with a redirect
  #   Requires both Http and Https to be working.
  HttpsRedirect: false
  # - AIPort -
  #   Dedicated port for AI client connections. Set to 0 to disable.
  AIPort: 55555
  # - MaxHumanConnections -
  #   Maximum number of human (non-AI) telnet connections.
  MaxHumanConnections: 80
  # - MaxAIConnections -
  #   Maximum number of AI client connections.
  MaxAIConnections: 20
  # - AICommandsPerRound -
  #   Maximum commands per game round for AI connections.
  #   Rounds are 4 seconds (configurable via Timing.RoundSeconds).
  AICommandsPerRound: 2
  # - AfkSeconds -
  #   If this many seconds pass without player input, they are flagged as afk
  #   Set to zero to never mark anyone as AFK
  AfkSeconds: 120
  # - MaxIdleSeconds -
  #   How long players can go without any input, before being kicked.
  #   A value of 0 (zero) means never kick inactive players.
  #   1800 seconds = 30 minutes
  MaxIdleSeconds: 1800
  # - TimeoutMods -
  #   Whether Admin/Mod users get timed out when reaching MaxIdleSeconds
  #   If set to false, Admins & Mods never get force disconnected.
  TimeoutMods: false
    # - ZombieSeconds -
  #   How many seconds a character stays active/in game after a network connection
  #   is lost. Set to 0 to instantly log out characters (exploitable).
  ZombieSeconds: 60
  # - LogoutRounds -
  #   How many rounds of meditation a player must complete before they are
  #   logged out. If interrupted, they must start over.
  LogoutRounds: 3

################################################################################
#
#   SCRIPTING
#   Configurations to put limits on run away scripts etc.
#
################################################################################
Scripting:
  # - LoadTimeoutMs -
  #   When a script is first loaded, compiled, and run, it is given this long to
  #   complete. If it takes longer, it is killed. This includes the onLoad() function
  #   in scripts. Allowing a script to take longer to load might be okay to prepare some
  #   heavier data.
  LoadTimeoutMs: 1000
  # - RoomTimeoutMs -
  #   How long a room script can run before it is killed. This is a safety feature to
  #   prevent long running scripts from bogging down the server.
  RoomTimeoutMs: 50

################################################################################
#
#   Special Rooms
#   You probably won't need to change these.
#
################################################################################
SpecialRooms:
  # - StartRoom -
  #   This is the default starting room for the game. It only matters when there
  #   is code that explicitely tries to send the player to the "starting room"
  #   The default of 1 is Town Square
  StartRoom: 113
  # - DeathRecoveryRoom -
  #   This is the room players are sent to when they die.
  #   This should have some way of healing them and (eventually)
  #   sending them back into the main world.
  DeathRecoveryRoom: 75
  # - TutorialRooms -
  #   This should be an array of all room id's for the pre-start tutorial.
  #   The first one on the list is the room they will be placed in when beginning
  #   Rooms 900-999 are a special range of RoomId's that tell GoMud the user is
  #   in a tutorial.
  #   Sanctum Basin replaces the old tutorial zone; TutorialRooms is intentionally empty.
  TutorialRooms: []

################################################################################
#
#   Validation
#   Special rules or filters for validation purposes
#
################################################################################
Validation:
  # - NameLengthMin / NameLengthMax -
  #   Min/Max size of names allowed.
  NameSizeMin: 2
  NameSizeMax: 32
  # - PasswordSizeMin / PasswordSizeMax -
  #   Min/Max size of passwords allowed.
  PasswordSizeMin: 4
  PasswordSizeMax: 16
  # - EmailOnJoin -
  #   Whether to ask for email addresses on signup.
  #   Can be "required", "optional", "none"
  #   Default: "optional"
  EmailOnJoin: optional
  # - NameRejectRegex -
  #   A special pattern to reject usernames that match it.
  #   (This is a regular expression, you must understand how to create them)
  #   Set to empty to disable. If the regex is invalid it will revert to the
  #   default of '^[a-zA-Z0-9_]+$'
  NameRejectRegex: '^[a-zA-Z0-9_]+$'
  NameRejectReason: "Must only contain Alpha-numeric and underscores."
  # - BannedNames -
  #   Names that are not allowed to be used by players. This is a good place to
  #   put names that are used by the game itself, such as "admin".
  #   Note: This is not case sensitive.
  #   You can add a * to the end of a name to ban all names that start with that
  #   name. For example, "admin*" would ban "admin", "administrator", etc.
  #   You can also use * at the beginning of a name to ban all names that
  #   end with that name. For example, "*admin" would ban "admin", "superadmin",
  #   Finally, you can use * at the beginning and end of a name to ban all names
  #   that contain that name. For example, "*admin*" would ban "admin", "superadmin",
  #   "administrator", etc.
  BannedNames:
  - "*admin*"
  - "*moderator*"
  - "player*"
  - "user*"
  - "me"
  - "myself"
  - "self"
  - "us"
  - "you"
  - "them"
  - "everyone"
  - "someone"
  - "anyone"
  - "nobody"
  - "somebody"
  - "anybody"
  - "none"
  - "nothing"
  - "something"
  - "anything"
  - "everything"
  - "all"
  - "north*"
  - "south*"
  - "east*"
  - "west*"
  - "up"
  - "down"
  - "chest"
  - "door"
  - "new"
  - "join"
  - "register"

################################################################################
#
#   Roles
#   Roles are string identifiers that map to a number of command names.
#   They are used to determine what admin commands a player has access to.
#   Two roles are build in and cannot be changed:
#     - "user" - Has no admin commands
#     - "admin" - Has all admin commands
#   Role sub-commands should be separated by a dot: room.info
#   Roles are more permissive the more they prefix.
#   Example: room prefixes room.info so would permit that action as well.
#   Role checks must be implemented wherever role-based restriction is desired:
#   if user.HasRolePermission(`room`) { /* Do something */ }
#
################################################################################
Roles:
  builder: ["room.info", "build"]
  helper: ["paz", "teleport.playername", "locate"]


################################################################################
#
#   Modules
#   Empty here. Modules provide data for this.
#
################################################################################
Modules: {}
