spellid: repair-pulse
name: Arc-Weld Repair
description: >
  Directs a raw current through failing servos and cracked plating,
  forcing damaged construct systems to knit themselves whole again.
  Mob-castable only — this is a construct maintenance routine, not a
  spell any living caster could learn.
type: helpsingle
schools:
  - vital
cost: 15
waitrounds: 1
difficulty: 10
primarystat: willpower
base_folds: 2
effect_type: heal
effect_magnitude: 8
cast_user_text: "Arc-light gathers between your manipulators."
cast_room_text: "{source} crackles with hard blue-white arc-light, current arcing toward {target}."
