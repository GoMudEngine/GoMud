spellid: raise-golem
name: Raise Flesh Golem
description: Weaves multiple corpses together through brutal necromantic
  surgery, stitching flesh, bone, and sinew into a massive construct
  driven by a single animating will. The flesh golem is the most
  durable servant a necromancer can field, but the raw material
  demands are immense — only the most potent remains will suffice.
type: neutral
schools:
  - manifestation
cost: 100
waitrounds: 16
difficulty: 50
primarystat: willpower
base_folds: 16
target_defense_type: none
effect_type: none
effect_magnitude: 0
cast_user_text: >-
  You begin the brutal stitching-work — not resurrection but
  construction, forcing flesh and sinew to knit according to
  your will...
cast_room_text: >-
  {source} gestures over the remains with sweeping, surgical
  motions. The ground shudders faintly with each pass of their
  hands.
wait_user_text: >-
  The ground trembles as flesh begins to knit and bulk,
  assembling into something vast and purposeful. The air reeks
  of raw meat and ozone...
