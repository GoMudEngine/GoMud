spellid: core-discharge
name: Core Discharge
description: >
  A ruinous vent of raw power torn straight from a guardian construct's
  core -- a room-wide detonation of cold light and crushing force that
  scours everything standing in the open. Mob-castable only; the
  buildup would kill any living caster before release.
type: harmarea
