# Aliases for keywords when typing: help <keyword>
# Key is the target keyword, value is the list of aliases
help-aliases:
  skullduggery:     [stealth, surprise attack, surprise]
  combat:           [fighting, battle]
  cooldowns:        [cooldown]
  defense:          [dodge, parry, block, defenses]
  prone:            [knockdown, knocked-down, knocked down]
  stamina:          [endurance, energy]
  bank:             [deposit, withdraw]
  mutations:        [mutation, chrysalis, mutate]
  craft:            [crafting, recipes, recipe, make, create]
  blacksmithing:    [blacksmith, smith, smithing, forge, metalwork]
  alchemy:          [alchemist, potion, potions, brewing, brew, herbalism]
  foraging:         [forage, gather, gathering, harvest, harvesting]
  tailoring:        [tailor, sewing, weaving, clothwork]
  cooking:          [cook, baking, food, meals]
  jewelcrafting:    [jeweler, jewelry, gemwork, gemcutting, jewel]
  manifestation:    [manifest, summon, conjure, necromancy, raise]
  enchanting:       [enchant, enchantment, enchantments, imbue]
  disenchant:       [unenchant, remove-enchant, strip-enchant]
  storage:          [store, unstore]
  strength:         [str]
  vitality:         [vit]
  dexterity:        [dex, speed, spd, spe]
  willpower:        [wil, will, mysticism, mys, myst]
  charisma:         [cha, smarts, smt, sma]
  perception:       [per, percep, percept]
  health:           [hp]
  species:          [race, races]
  picklock:         [pick]
  picklock-example: [pick-example]
  keyring:          [key, keys]
  equip:            [wear, wield, hold]
  status:           [score, info]
  set-prompt:       [prompt]
  set-wimpy:        [wimpy]
  colors:           [color, ansi]
  killstats:        [kills, kd]
  bartering:        [barter, haggle, trade]
  pets:             [pet]
  macros:           [macro]
