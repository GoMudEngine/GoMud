  title:            [jobs, job, profession, class, titles, archetypes, archetype]
  about:            ['gomud', 'dogmud', 'dog', 'lore', 'world', 'setting', 'background']

# Default aliases for commands
# For example: inv -> inventory
# They can be command + argument aliases
# Key is the target command, value is the list of aliases
command-aliases:
  say:                ['.']
  broadcast:          ['`']
  status:             ['sta', 'stat', 'stats', 'score', 'info']
  inventory:          ['i', 'inv', 'eq']
  look:               ['l', 'examine']
  go:                 ['enter']
  map:                ['m']
  conditions:         ['c', 'cond', 'conds']
  skills:             ['sk', 'skill', 'exp', 'xp', 'progression']
  scribe:             ['scribble', 'write']
  equip:              ['wear', 'wield', 'hold']
  remove:             ['rem', 'unequip', 'unwear', 'unwield']
  throw:              ['toss']
  attack:             ['a', 'k', 'kill', 'fight']
  get:                ['g', 'take']
  command:            ['cmd']
  macros:             ['=?', 'macro']
  sneak:              ['sn']
  spells:             ['spellbook']
  backstab:           ['bs']
  killstats:          ['kills', 'kd', 'killstat']
  title:              ['jobs', 'job', 'profession', 'class', 'titles']
  mutations:          ['mutation']
  quests:             ['q', 'quest']
  shout:              ['yell', 'scream', 'holler']
  picklock:           ['pick', 'lockpick']
  keyring:            ['key', 'keys']
  whisper:            ['/w']
  unlock:             ['open']
  buy:                ['hire']
  trash:              ['junk']
  put:                ['place']
  history:            ['log']
  noop:               ['wake']
  syslogs:            ['syslog']
  'party chat':       ['pchat', 'psay']
  'bank deposit':     ['deposit']
  'bank withdraw':    ['withdraw']
  'storage add':      ['store']
  'storage remove':   ['unstore']
  'rank back':        ['backrank']
  'rank front':       ['frontrank']
  'help about':       ['about']
  'set screenreader': ['screenreader']
  
  # Direction aliases
direction-aliases:
  n:  north
  s:  south
  e:  east
  w:  west
  u:  up
  d:  down
  nw: northwest
  ne: northeast
  sw: southwest
  se: southeast

# Special map symbols that will always show this exact text if found on a map.
# Group under zone names.
# '*' entries apply everywhere, unless overridden by a zone entry
legend-overrides:
  '*':
    '$': 'Shop'
    '★': 'Bank'
    'G': 'Gate'
    '✗': 'Target'
    '%': 'Trainer'
    '?': 'Secret'
  'Frostfang':
    '!': 'Throne Room'
