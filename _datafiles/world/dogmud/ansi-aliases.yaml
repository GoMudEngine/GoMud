# === Messaging Framework Categories ===
# Spec: docs/superpowers/specs/2026-05-19-messaging-framework-design.md
# Test these in-game; values are first-pass approximations.

# Combat — damage bands (each band uses a visually distinct code so
# multi-weapon characters see per-swing colors)
  hit-melee: 173         # dusty rose — slashing / cleaving / stabbing (swords, spears)
  hit-blunt: 130         # warm orange-brown — bludgeoning / slam (hammers, maces)
  hit-natural-sharp: 95  # dark red-brown — claws / bite / sting / gore
  hit-ranged: 110        # light sky blue — shooting / whipping (bows, whips)
  hit-caster: 146        # lavender — wand / sceptre / staff melee
  hit-unarmed: 215       # sandy brown — explicit unarmed / fist

# Combat — defense
  dodge: 108
  parry: 143
  block: 71

# Combat — grapple / submission / death / summary
  grapple-flow: 94
  grapple-high: 130
  submission: 169
  death: 8
  combat-summary: 248   # neutral gray — per-round compact tally (light verbosity)

# Combat — special moves
  surprise: 9
  kick: 11
  trip: 214
  bash: 172
  rally: 14
  warcry: 9
  taunt-success: 169
  taunt-resist: 2
  taunt-failure: 11

# Combat — anonymized observer (infrared)
  combat-anon: 196

# Spells — fold + 5 schools + disruption
  spell-fold: 152          # pale steel-cyan — cast/fold preparation
  spell-disruption: 214    # warning amber — fizzle/backfire/deflect
  spell-elemental: 160     # red3 — fire/ice/lightning damage (distinct red, not the warm-orange shared with gold)
  spell-enhancement: 179   # warm gold — buffs / shields / enchantments
  spell-mental: 146        # lavender — psionics / charm / illusion
  spell-vital: 108         # sage mint — heal / cure / restore
  spell-manifestation: 169 # rose pink — summon / raise / bind

