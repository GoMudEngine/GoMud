roomid: 426
zone: Watchers Crossing
title: Under the Bridge
description: Beneath the old bridge the river narrows and deepens, channeled between
  moss-covered stone pilings that rise like pillars into the shadowed arch above. The
  air is cold and damp here, and the sound of the water echoes off the stonework in
  a way that makes it hard to hear anything else. Debris has collected against the
  pilings -- branches, rags, the occasional bone. The riverbed drops away sharply
  on the downstream side, and the water there is black and still in a way that suggests
  depth. Claw marks score the stone where something has been climbing in and out of
  the water.
biome: water
