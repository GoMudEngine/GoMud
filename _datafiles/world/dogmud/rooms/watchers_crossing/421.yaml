roomid: 421
zone: Watchers Crossing
title: The Tollhouse
description: A squat stone building sits beside the road, its single door facing the
  bridge approach to the east. A wooden counter extends from one wall, creating a booth
  where travellers must stop before crossing. The building is well-maintained despite
  its age -- the mortar is fresh, the shutters oiled, and a small herb garden grows
  in a box beneath the window. A hand-lettered sign above the counter reads "BRIDGE
  TOLL -- 5 GOLD" in careful block letters. Stacks of paper and a heavy ledger sit
  on the counter behind the booth.
