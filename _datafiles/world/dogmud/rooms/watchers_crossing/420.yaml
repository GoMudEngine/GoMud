roomid: 420
zone: Watchers Crossing
title: Watchers Crossing, West Approach
description: The dusty road from the west widens as it approaches a cluster of low
  stone buildings huddled around a river crossing. The air changes here -- drier wind
  gives way to the smell of water and mud, and the sound of a river running over stones
  carries from the east. A weathered signpost at the road's edge lists destinations
  in faded paint. Wagon ruts deepen in the softer ground, and the buildings ahead show
  the wear of a waystation that has served travellers for longer than anyone remembers.
