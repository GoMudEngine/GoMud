nouns:
  reeds: Tall river reeds grow in dense clumps along the waterline, their tops heavy
    with seed. Small birds flit between the stalks, chirping. The reeds would provide
    decent cover for anything lurking at the water's edge.
  stones: The riverbed is carpeted with smooth, flat stones in shades of grey and
    brown. Some are perfect for skipping. A few larger ones break the surface,
    creating small eddies where debris collects.
