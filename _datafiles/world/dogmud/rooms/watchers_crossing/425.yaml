roomid: 425
zone: Watchers Crossing
title: River Bank
description: A muddy path leads down from the road to the river's edge, where the
  water runs wide and shallow over a bed of smooth stones. Reeds grow thick along the
  bank, and the ground is soft and damp underfoot. This is where the locals draw water
  and where children come to skip stones on quiet afternoons. The bridge is visible
  upstream, its arches dark with moss and river spray. Downstream, the water deepens
  and the current quickens, pulling at anything that strays too far from shore.
  A narrower track branches south from the river bank, marked by a leaning
  signpost.
biome: water
