roomid: 422
zone: Watchers Crossing
title: The Old Bridge
description: A stone bridge spans the river here, wide enough for two carts to pass
  abreast. The construction is old -- centuries old, by the style of the dressed stone
  and the deep grooves worn into the surface by uncounted wheels and boots. The bridge
  arches high over the water, and looking over the southern rail you can see the river
  sliding dark and fast beneath, carrying leaves and debris from upstream. The stonework
  is solid but not without concern -- a crack runs along the eastern rail, and several
  capstones have been replaced with newer, lighter-coloured stone. Watchtowers stand
  at each end, their upper windows dark and empty.
biome: river
