roomid: 424
zone: Watchers Crossing
title: Trading Post
description: A timber-framed building with wide shutters thrown open to the air,
  displaying goods on shelves that face the road. The trading post is part shop, part
  warehouse -- crates and barrels are stacked along the back wall, and a long counter
  runs the length of the room. The merchant has organized her wares with a precision
  that borders on obsessive -- dried goods to the left, tools in the center, sundries
  to the right. A scale and a set of weights sit on the counter beside an abacus
  whose beads have been worn smooth.
biome: river
exits:
  west:
    roomid: 423
nouns:
  shelves:
    look: The shelves display a practical selection -- rope, candles, flint and steel,
      dried meat, small clay pots of salve. Nothing fancy, but everything a traveller
      might need. Prices are chalked on small slate tags.
  crates:
    look: The crates bear shipping marks from several settlements. Most are addressed
      to "M. Brecca, Watchers Crossing" in various hands. Some have been opened and
      partially unpacked.
  scale:
    look: A brass balance scale, well-maintained and true. The weights are stamped
      with official marks. The abacus beside it shows signs of heavy daily use.
spawns:
  - mobid: 85
idlemessages:
- The merchant shifts a crate behind the counter, reorganizing stock.
- Dust motes drift in the sunlight streaming through the open shutters.
- The abacus clicks softly as accounts are tallied.
