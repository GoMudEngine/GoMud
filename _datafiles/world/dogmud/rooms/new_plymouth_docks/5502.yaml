zone: New Plymouth Docks
title: The North Quay
description: >
  The noise falls away as the quay curves outward from the main
  landing and the crowd thins to almost nothing. Here the dock
  planking is older, bleached silver-grey, the gaps between boards
  wide enough to show the green-black water moving beneath. A lone
  figure sits at the far end with a line in the water, apparently
  unconcerned with the commerce going on two hundred paces behind
  him. Gulls have claimed the piling-tops in ones and twos and
  watch the water with the focused patience of professionals. The
  relative quiet out here has a quality to it — you notice the
  river sound more when the shouting isn't covering it. A heavy
  coil of <ansi fg="tarred rope">tarred rope</ansi> sits coiled
  against a cleat near the quay's midpoint, and at the far western
  end the dock terminates at a <ansi fg="chained shipyard">chained
  shipyard</ansi> gate, padlocked shut and clear about its
  intentions.
