title: The Tar Yard
description: >
  The smell announces the yard before the entrance does — hot tar
  and hemp and the resinous warmth of cordage that has been baking
  in the sun, a compound that sits on the skin and takes its time
  leaving. Two cast-iron <ansi fg="itemname">tar kettles</ansi>
  squat on fire-clay stands at the yard's center, their surfaces
  moving with the slow thick bubbles of material kept just below
  working temperature. Beyond them a frame of lashed poles carries
  the current batch of <ansi fg="itemname">drying nets</ansi>
  spread wide for treatment — the mesh black with fresh tar, stiff
  and crackling at the edges where it has set. Workers pass through
  without particular urgency; this is repetitive work and has long
  since found its own pace. East leads back to the outer lane;
  north to the customs shed; west to the wharf steps.
