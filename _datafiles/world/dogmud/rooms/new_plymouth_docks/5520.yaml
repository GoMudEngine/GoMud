nouns:
  rotten pilings: The dock's foundations — heavy timber driven into
    the riverbed long enough ago that the wood has gone dark to the
    core. At the waterline a pale brine-mark rings each piling where
    the tide has been and retreated. Below it the wood is soft in
    places, swollen and fibrous; you could press a thumb in if you
    wanted to, and you do not want to. Tied off in the deepest
    shadow between two pilings, a small flat-bottomed skiff sits
    motionless — no oars visible, no name, and nobody aboard that
    you can see in this light.
  bilge channel: A cut in the stone floor along the far wall, two
    hand-spans wide and kept full by the slow seep of river water
    through the dock foundations. The color of the water is not
    worth thinking about closely. Small things move in it that are
    better left unidentified. The channel disappears under the far
    wall without apparent destination; whatever it drains into,
    the draining takes its time.
idlemessages:
- Something drips from a board-joint above and hits the water
  with a sound that carries too far in the close dark.
- The skiff shifts a half-inch against the piling and settles —
  river movement, or something that prefers not to be seen.
- The waterline knock against the stone comes in a slow long
  rhythm, lower and more patient than the sound of open water.
- From somewhere to the east the dark carries a faint sound —
  footstep, or water moving around something — and then nothing.
- The bilge channel seeps past with the particular indifference
  of water that has been underground a long time.
