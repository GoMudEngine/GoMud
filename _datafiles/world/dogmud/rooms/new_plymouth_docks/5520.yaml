roomid: 5520
zone: New Plymouth Docks
title: The Underdocks
description: >
  The smell arrives before you finish the last step — not the brine
  of the open waterfront above but something closed and concentrated,
  the river turned inward and going nowhere — bilge water and black
  mud and rotting timber that has been wet long enough to mean
  something else. The ceiling is the underside of the dock planking,
  close enough to brush with a raised hand, dripping at every joint
  where the boards have spread. Between the <ansi fg="itemname">rotten pilings</ansi> the river surface runs in dark
  strips, the waterline working the stone in a slow patient knock
  you do not hear from above. A <ansi fg="itemname">bilge
  channel</ansi> runs along the base of the far wall, ankle-deep
  and brown, draining nothing in particular — west, it slips
  beneath a low stone arch into an older dark that the docks
  never paved, where the buried canal of the Old Quarter lies
  dead and waiting. The passage east continues into the dark
  between the piles. The stair is behind you.
