zone: New Plymouth Docks
title: The Chandlery
description: >
  The chandlery announces itself before you reach the door —
  tar-pitch and linseed and lamp-oil mixing into a smell that
  coats the back of the throat and stays. Inside it is dark by
  design: the goods here are not displayed, they are stacked.
  <ansi fg="tar barrels">Tar barrels</ansi> line the near wall
  in a row of six, their lids sealed with clay, the floor beneath
  them stained black in permanent rings. Bolts of <ansi
  fg="spare canvas">spare canvas</ansi> stand in a rack along the
  far wall, each one bound with twine and tagged with a weight
  and weave designation in chalk — and beside them, coiled rope
  in three weights hangs from wooden pegs, the heaviest stuff as
  thick as a man's forearm and smelling of the tar that has been
  worked into its fibers. The chandler moves among these things
  with the efficiency of someone who has not needed to think about
  where anything is for many years. A ship's master who needs to
  refit can find nearly everything here; a traveler can find lamp-
  oil, rope, and canvas that serves on land as well as water.
