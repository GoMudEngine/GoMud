nouns:
  shelves: Three walls of shelving, the boards bowed in the
    middle from the weight they have held so long. The
    inventory follows no system a stranger could immediately
    identify — a coiled rope next to a hand mirror next to a
    set of wax-sealed pots with no label, then mismatched
    chisels, then kidskin gloves in a hatbox. Everything has
    a small chalked card with a price. Everything looks as
    though someone needed to sell it quickly and has not
    come back to buy it back.
  scales: Brass, triple-beam, cleaned recently and kept level
    on a wedge of cork that compensates for the counter's
    slight tilt. The weights sit in a compartmented box
    beside it — a full set, from grain-weights to the heavy
    pound. They are used for everything here that can be
    weighed, and some things that strictly cannot.
idlemessages:
- The shelves creak once as the building settles.
  Nothing falls.
- Old Sable appears briefly at the curtain dividing the shop
  from the back, confirms something by looking, and retreats.
- A dock-hand comes in with something wrapped in cloth, sets
  it on the counter, and begins a conversation already in
  progress.
- From the back of the shop comes the sound of something
  being moved carefully onto a shelf — suggesting it is
  either very heavy or very fragile.
- The scales remain balanced. The door-bell clapper remains
  wrapped. The prices on the cards do not change, though
  the cards themselves sometimes do.
