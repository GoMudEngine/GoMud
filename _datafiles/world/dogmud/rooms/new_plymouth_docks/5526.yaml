nouns:
  stock ledger: A bound account book, current year, open to a
    page of cargo manifests and their tallied values. The columns
    add up — until you check the sub-totals against the totals,
    at which point they do not. The corrections in the margin are
    in a different hand than the primary entries, and they reroute
    the discrepancy rather than fixing it. The book is used every
    day; someone has been managing this problem for some time.
  floor-board: A plank that sits a thumbnail's width higher than
    its neighbors — the gap on one side is deliberate, the edge
    chamfered smooth by many careful lifts. There is no ring or
    pull-handle; this is meant to look like a settling board to
    anyone who is not already looking for it. Beneath it, a cutout
    in the sub-floor holds something. Whether that something is
    still there depends on who has been in this room recently.
idlemessages:
- The ledger sits open on the desk with the look of something
  that has been closed and re-opened several times today.
- A floorboard elsewhere in the room settles with a soft tick —
  not the proud one; a different one, which is less interesting.
- From below, through the floor, the constable's post is quiet —
  either empty or conducting itself quietly at the desk.
- A ship's bell from the harbor carries up through the window,
  one long note, and then the working day resumes.
- The tidiness of the room has a managed quality — maintained
  to a standard rather than arrived at naturally.
