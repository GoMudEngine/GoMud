roomid: 5505
zone: New Plymouth Docks
title: Warehouse Row
description: >
  The air is different here — stiller, drier, cut through with the
  smell of sawdust packing and pine-resin and something sweetly
  chemical from a crate near the eastern end that nobody has
  thought to label in a language available to you. A row of import
  storehouses runs the length of the block, their walls close-
  boarded and their doors iron-hinged and padlocked during off-
  hours; right now two of them stand open and men move in and out
  with barrow-loads in the steady rhythm of work that does not
  stop for conversation. Against the near wall a stack of
  <ansi fg="stacked crates">stacked crates</ansi> rises to chest
  height, each one stenciled with a port-mark and a count. On the
  end wall a <ansi fg="manifest chalkboard">manifest chalkboard</ansi>
  spans the full width of the board, its chalk columns dense with
  arrivals and tallies — the docks' memory of what came in and
  what has yet to move on.
