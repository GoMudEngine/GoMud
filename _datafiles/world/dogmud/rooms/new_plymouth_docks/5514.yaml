title: Aldric's Public House
description: >
  A lodging house that takes horses and charges less than it
  could for the privilege — which means a yard, a trough,
  and a man at the gate who neither asks your name nor forgets
  your face. Aldric's is the kind of establishment that has
  existed in every port since ports existed — the place that
  offers a bed and a meal and a studied incuriosity about the
  people who pass through. The yard opens to the right, where
  a <ansi fg="itemname">horse trough</ansi> of painted
  iron takes up the near wall and the packed earth is soft
  from years of hooves. Inside, through the low door, the
  common room centers on a
  <ansi fg="itemname">common table</ansi> scarred with
  the history of every knife that has ever been set down on
  it — which is evidently all of them. The keeper's eyes
  meet yours briefly, find nothing requiring comment, and
  return to what they were doing. North runs up to the lane;
  west back to Dock Street.
