nouns:
  tavern sign: A salt-cellar — the small covered vessel for
    table salt — painted in faded ochre on a panel of grey
    board above the door. The painting is not especially
    skilled but it is clear, and someone has touched up the
    outline in charcoal recently. Below it, in a different
    hand, someone painted "EST. OLD" and beneath that a date
    that is no longer readable, the lower half of the sign
    having been used as a boot-scraper too many times.
  door lantern: An iron bracket and a glass-sided lantern,
    both older than anything else on the building's face.
    The glass has a faint green tint from age or from the
    manufacture, and the flame inside burns lower than it
    should for the oil remaining — which is never quite out.
    The lampman who services it, if there is one, leaves
    no evidence of having been here.
idlemessages:
- The sounds from inside swell briefly as the door swings
  open, then cut off as it falls shut.
- A pair of dock-hands emerge from inside, squinting into
  the evening air, and go their separate ways.
- The door lantern gutters once in a crosswind and then
  steadies, as it has reportedly been doing for forty years.
- From inside comes a single note of laughter, too loud,
  cut short; then the ordinary sound of a room at ease.
- Someone has chalked an arrow on the cobblestones pointing
  at the door. It could be recent or it could be old — it
  has been walked over enough that it is hard to say.
