roomid: 5511
zone: New Plymouth Docks
title: The Salt Cellar
description: >
  A building that leans slightly into the street as if
  listening — the Salt Cellar has been here long enough that
  the cobblestones around its foundation have been reset
  twice and the building remains, unmoved and unsurprised.
  By day its face is ordinary — stained timber, a broad door,
  the faint persistent smell of beer soaked into old wood.
  But after the dock-shift ends, the place becomes the
  <ansi fg="itemname">tavern sign</ansi>'s promise made
  good — voices and light and the kind of warmth that means
  people who work hard in cold wet places have found each
  other for the evening. A
  <ansi fg="itemname">door lantern</ansi> hangs from an
  iron bracket to the right of the entrance, guttering
  inside its glass in a way that somehow never goes out.
  Stairs lead down to the taproom and up to the lodging;
  north leads deeper into the quarter, west to the cookshop,
  south back to Dock Street.
