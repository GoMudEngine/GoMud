roomid: 5523
zone: New Plymouth Docks
title: Marn's Fabric-Remnants Shop
description: >
  A narrow shop, the kind that has occupied this slot in the
  building-line long enough you would not think to notice it —
  cut-rate cloth ends, a smell of unfinished textile and old
  wood, a proprietor who does not press you to stay. The front
  tables hold bins of <ansi fg="remnant bolts">remnant bolts</ansi>
  — ends and offcuts in practical weights, cheap because they are
  what is left when the useful part has been used, and still worth
  buying if you know what you need. At the back wall, past the
  shelving, a <ansi fg="cupboard door">cupboard door</ansi> stands
  half in shadow. The shelves around it carry the ordinary stock
  of a fabric shop; the door itself carries the evidence of hands
  that have worked the latch many more times than restocking
  shelves would require. To the north a low stone footbridge is
  visible over a canal cut — a span connecting this quarter's edge
  to the Crafting Quarter beyond. The far approach is closed off;
  what lies that way is not yet reachable. South returns to the
  outer lane; enter to go further inside.
