nouns:
  remnant bolts: Bins of cut-end cloth in a range of weights and
    colors, none of them particularly fashionable and all priced
    accordingly. Wool homespun in grey and brown. A length of
    canvas too short for sail-use. Several pieces of linen once
    dyed indigo and faded to something quieter. The cloth is
    honestly described by its price — not quite useful enough to
    have been kept, not quite useless enough to throw away.
    Someone has been through the front bin recently; the edges
    of the pile are disturbed in a way that suggests hurry.
  cupboard door: A door set flush into the back wall, plain-
    fronted and continuous with the shelving on either side —
    at a glance, a storage cupboard for stock. The latch-plate
    is worn bright at its working edge in a way that does not
    match the rest of the room. The hinge side is marked where
    the door has been opened very many times, a shadow worn into
    the paint. Whatever is behind it has been accessed more
    often than shelf-storage requires, by more people than a
    bolt-count would warrant.
idlemessages:
- The shop is quiet — fabric shops usually are — but the quiet
  here has a quality of attention in it.
- A customer browses the remnant bins with the focus of someone
  who knows exactly what they need and has not found it yet.
- The proprietor straightens a stack of cloth at the front
  table without looking up or offering assistance.
- From somewhere behind the back wall, a sound — movement, or
  a voice kept deliberately low — surfaces briefly and stops.
- The footbridge to the north catches afternoon light at a
  particular angle; the far end remains in shadow.
