nouns:
  impounded cargo: Crates and bales in various sizes along both
    walls, each tagged with a wax-paper slip in the assessor's
    hand. Most tags note a discrepancy — weight variance, seal
    mismatch, manifest description that does not match the
    contents on inspection. A few crates have a second tag
    added in a different hand, more recent. The crates whose
    weights do not match their manifests are heavier than
    declared; none of them are lighter.
  customs manifest: A document pinned to the central post and
    updated in a careful, regular hand — item, origin, date
    held, stated reason for hold. Reading across the column
    of stated reasons a pattern emerges that the individual
    entries do not announce — most of the flagged cargo came
    in on the same three vessels, on rotating schedules,
    across the last four months. The assessor has not noted
    this in the manifest. It is possible the assessor has
    not noticed. It is also possible the assessor has been
    instructed not to note it.
idlemessages:
- The shed is quiet in the way of places where things are
  waiting — a specific, held quality of stillness.
- A tag on the nearest crate lifts in a draft through the
  roof-gap, turns over, and settles face-down.
- From outside, south, the tar yard's smell arrives in a
  wave — hot and sharp — and then recedes.
- Something in one of the back crates shifts with a dry
  sound that suggests settling, or something alive settling.
- The manifest flutters at its edge where the pin has
  worked loose; it stays on the post but only just.
