roomid: 5519
zone: New Plymouth Docks
title: The Dockworker Tenements
description: >
  Four storeys of brick and timber above a narrow street,
  windows so close together the rooms behind them must be
  barely wider than the beds they hold. The tenements house
  the dock-shift workers — the people who make the docks
  function at the level where no record is kept of their
  names, only their hours. Evidence of their living is strung
  between the buildings above you:
  <ansi fg="itemname">washing lines</ansi> carry the
  quarter's laundry overhead in a dense canopy of linen and
  wool and practical things washed flat. Below, on the
  building's front step, a worn
  <ansi fg="itemname">stoop</ansi> holds the usual arrangement
  of people with nowhere particular to be — off-shift,
  resting, watching the street with the ease of those who
  know exactly what is ordinary here. Hard against the
  tenement's east wall, a blank-faced warehouse presents a
  barred door and a guard who does not invite conversation.
  From within comes the sound of heavy machinery, low and
  rhythmic — not a sound the quarter discusses. South leads
  back to the Salt Cellar; west to the pawnshop; north the
  street gives out at the ward's frayed outer edge.
