nouns:
  washing lines: Hemp lines strung between iron brackets
    bolted into both buildings at each floor — a permanent
    infrastructure for the daily laundry of several dozen
    people. The current load spans everything from work
    smocks to children's things to one heavy blanket that
    is taking longer to dry than its owner expected. Water
    drips from the lowest-hung items in a sporadic pattern
    that has worn small channels in the cobblestones beneath.
  stoop: Three broad steps worn hollow at the center from
    years of use, the stone gone smooth and pale where boots
    have walked it. Three people currently occupy the stoop
    in the arrangement of those who are not together but
    have agreed to share the space — each with their own
    angle to the street, their own pace of blinking, their
    own way of not quite watching you arrive.
idlemessages:
- Laundry drips from the washing lines overhead in a slow
  percussion on the cobblestones.
- Someone on the stoop says something that the others
  receive without comment — which is also a kind of answer.
- From the direction of the sealed warehouse comes a deep
  rhythmic thud — machinery, or something moved by
  machinery — and then silence.
- A window opens on the second floor; a face looks out,
  confirms the hour by some private measure, and withdraws.
- The guard by the barred warehouse door does not look at
  you but is aware of you in a way that is professionally
  managed.
