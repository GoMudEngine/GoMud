nouns:
  scratched tally-marks: Cut into the piling face with something
    narrow and pointed — the marks run in groups of five, most
    crossed through at the fifth. Whatever was being counted went
    on for a long time; there are more groups than a casual eye
    bothers to finish. The wood around each mark is slightly lighter
    in color, the exposed timber not yet blackened by the damp,
    which means this is not as old as it looks, or someone has been
    adding to it recently. The last group has four marks and no
    fifth.
  spent wax wrapper: A fold of pale wax cloth, small enough to
    close in one hand, carrying the copper-flower smell even now.
    It is the packaging, not the contents — whatever it held is
    long gone. The wax is thin and slightly iridescent where the
    fold has cracked, and the smell at close range is stronger than
    it has any right to be given how little remains. The dockworkers
    who come to this corner call the substance the Bloom, if they
    call it anything at all. They do not use the name in front of
    anyone who might write it down.
idlemessages:
- The copper-flower smell intensifies for a moment on a shift of
  the underground air, then recedes to its background level.
- Somewhere behind the bilge-stink the sweetness is always
  present, once you have learned to notice it.
- A sound from west — footstep on the stair, or water — surfaces
  briefly and then the quiet of the underdock resumes.
- The tally-marks catch the edge of whatever light reaches this
  corner and hold it, one cut at a time.
- The wax wrapper shifts slightly in a current that has no
  obvious source.
