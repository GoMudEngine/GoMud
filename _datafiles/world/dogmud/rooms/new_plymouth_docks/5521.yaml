roomid: 5521
zone: New Plymouth Docks
title: The Pilings Haunt
description: >
  The smell shifts before anything else changes — the bilge-stink
  thins and beneath it something else surfaces, faint but distinct —
  a sweetness like copper held in a warm hand, and under that a
  trace of flowers, and under both of those something that does not
  have a name but that the body recognizes and the mind does not
  quite want to follow. The corner is a dead end — a pinch between
  two piling bents where the planking overhead sags low and the
  floor is dark with accumulated damp. On the nearest piling face,
  at about shoulder height, <ansi fg="itemname">scratched
  tally-marks</ansi> have been worked into the timber — someone has
  been counting something here, one cut at a time, for a long time.
  Below them, half-buried in the silt, a <ansi fg="itemname">spent wax wrapper</ansi> still carries a ghost of that
  copper-flower smell. The only way out is west.
biome: city
