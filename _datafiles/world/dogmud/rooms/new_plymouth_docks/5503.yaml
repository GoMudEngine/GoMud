zone: New Plymouth Docks
title: The Long Quay
description: >
  Sound is the first fact here — the wooden groan of the
  <ansi fg="itemname">cargo crane</ansi> under load, the slap
  of cargo nets against a hull, voices cutting across each other
  in a dozen registers of urgency. The Long Quay is the main
  working platform of the docks: wide enough for two carts to pass,
  long enough that the far end blurs in the spray and the morning
  haze, and every pace of it occupied with something being moved
  from somewhere to somewhere else. Men and women pass you without
  looking — the kind of passing that means you are either working
  or in the way. Chalked notices cover the face of the
  <ansi fg="itemname">hiring board</ansi> nailed to the crane-
  post near the quay's center, and beneath it a compact, weathered
  man with a dock-foreman's deliberate manner keeps one eye on the
  board and both hands free — the type who has hired and fired from
  this spot so many times the ground beneath his feet knows the
  shape of his boots.
