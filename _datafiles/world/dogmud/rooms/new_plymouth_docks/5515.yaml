zone: New Plymouth Docks
title: Cutter's Lane
description: >
  The lane is a dead end — twenty paces of narrowing alley
  between two building-backs that lean toward each other as
  it goes, until the far end is a matter of shoulders turned
  sideways. Something has died here at some point and been
  left where it fell; the smell has absorbed into the stone
  and will not leave quickly. What the lane is used for,
  given it goes nowhere, is apparent from the
  <ansi fg="refuse heap">refuse heap</ansi> that has claimed
  the left wall — a long season's worth of things that
  needed to be somewhere out of sight and this was available.
  At the far corner, half-hidden under a wedge of cobbles
  and a scrim of old litter, a
  <ansi fg="loose grate">loose grate</ansi> sits over a
  black gap in the earth. The underdocks, by the smell of
  it — a way down that nobody here discusses openly. The
  grate is loose enough to lift with one hand. That is all
  that can be said for certain. The only way back is south.
