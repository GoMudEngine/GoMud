nouns:
  refuse heap: Everything a working street discards that is
    too large or too wrong for the gutter — broken barrel
    staves, a boot missing its sole, two chairs with the
    seats gone, a tangle of rope not worth re-splicing, a
    quantity of cloth too far gone to name. The heap has
    been added to from both sides of the lane; you can see
    where different hands have pitched things from different
    heights. Somewhere inside, something catches the light
    oddly, as if reflecting from within.
  loose grate: An iron grate, perhaps two feet square,
    sitting over a shaft cut through the dock-level stone.
    The fixing bolts have rusted through and the grate lifts
    with one hand — which is how you know this without
    trying. The shaft goes down into darkness and the smell
    of old water and something metallic. A rope, old but not
    rotten, has been tied to the grate's frame and drops
    into the black. The way down is there for those who want
    it. Nobody in the lane will confirm it exists.
idlemessages:
- The alley smells more at certain times of day than others.
  This is one of the other times, and it still smells.
- From the grate comes a sound — water, or something moving
  in water — and then nothing.
- A cat materializes at the alley's mouth, takes one step
  in, reconsiders, and leaves.
- The refuse heap shifts slightly in the wind, or for some
  other reason that does not require close examination.
- Somewhere above, on one of the building-backs, a shutter
  opens and closes without anyone appearing at it.
