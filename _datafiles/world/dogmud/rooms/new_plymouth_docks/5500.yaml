nouns:
  milepost: A stone post, salt-pitted and leaning a few degrees
    toward the river, the carved lettering half-legible. "New
    Plymouth" it says — the distance worn to nothing, but then you
    are already here and do not need the number. Someone has wedged
    a dried cornflower into a crack in the stone. It has been there
    long enough to lose its color.
  tide wrack: A dark stripe along the bank where the river has
    receded and left its accounting — kelp-strands, a split cork,
    a sandal with its strap gone, the skeleton of a small fish
    spread flat and translucent as paper. Somewhere in the tangle
    a crab picks at something with systematic patience.
idlemessages:
- The river smell thickens for a moment on a gust, then settles back
  to its ordinary weight.
- A gull drops something onto the road, inspects it, and leaves it
  where it fell.
- From the west comes the creak of rope and the flat thud of cargo
  meeting wood.
- A traveller passes you on the road heading south, pack high, pace
  deliberate — someone who has seen what they came to see.
- The river laps at the bank below with the small indifferent sound
  of a city that has been here a very long time.
