zone: New Plymouth Docks
title: River Road Landing
description: >
  The smell arrives before anything else — brine and tar and the
  sweetness of rotting wood that has soaked in seawater for
  decades, and under it a warm animal undercurrent from somewhere
  inland. The river road bends here out of the empty scrubland and
  delivers you without ceremony into the working edge of the city.
  To the west the Lower Wharf opens up in a sprawl of pilings and
  rope and shouted orders; to the south the road runs back the way
  you came. Gulls wheel overhead in tight circles, indifferent.
  At the road's turning stands a <ansi fg="itemname">milepost</ansi>
  — the last one on this road, or the first, depending on your
  direction — and below it, where the bank drops to the water,
  a line of <ansi fg="itemname">tide-wrack</ansi> marks the
  morning's high water in a dark stripe of weed and river-rubbish.
