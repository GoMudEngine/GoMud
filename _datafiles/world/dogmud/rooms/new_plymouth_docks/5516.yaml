roomid: 5516
zone: New Plymouth Docks
title: The Cookshop
description: >
  Hot and loud and smelling of the
  <ansi fg="cookpot">cookpot</ansi> that has been going since
  before dawn — that dense warm smell of something thick with
  grain and salt and whatever was available. The cookshop
  serves the dock-shift meal — fast, cheap, and filling, with
  no ceremony about it. A wooden counter takes up most of the
  space, and behind it a broad woman in a stained apron moves
  with the economy of someone serving their three-hundredth
  bowl of the day. The
  <ansi fg="bread tray">bread tray</ansi> on the counter
  holds a diminishing stack of dock-loaves — the dense, dark
  kind that takes a morning dip without falling apart — and
  a ladle rests on the pot-rim with the patient readiness of
  something that has not been set down in several hours. A
  transaction happens here every few minutes if you count
  them, each one quick and unremarkable by design. North
  leads to the pawnshop; south to the hiring office; east
  to the Salt Cellar.
