nouns:
  cookpot: A cauldron of iron, old enough that the metal
    has gone dark through to the core — not rust, not soot,
    just the color of iron that has been hot most of its
    life. The contents are thick and brown and smell of
    salted grain, root vegetables, and something that was
    once a bone and has given everything it had. The ladle
    resting on the rim has a long handle, worn smooth where
    it is gripped, and the bowl of it is stained the same
    particular brown as everything else in this room.
  bread tray: A wooden tray with a raised edge holding
    dock-loaves in a diminishing stack — the dense, dark
    kind baked from coarse flour that does not pretend to
    be anything else. They are still warm at the center.
    The tray bears the impressions of a thousand previous
    loaves along its base, compressed into a permanent
    record of all the meals served here and not recorded
    anywhere else.
idlemessages:
- The pot bubbles once, slowly, and settles.
- A dock-hand comes in, receives a bowl without asking
  for it, pays without counting, and leaves at the same
  pace they arrived.
- The woman behind the counter refills the bread tray
  from a basket below the counter without slowing her
  other work.
- The smell from the pot shifts slightly near midday —
  something has been added, or something has finished
  cooking.
- Two people eat standing at the counter, close enough
  to be talking if they were talking, which they are not.
