nouns:
  boundary stone: A dressed stone block perhaps two feet high,
    its face bearing the dock ward's designation in letters that
    have been re-cut at least once over whatever was there before.
    The most recent cutting is shallow and already softening at
    the edges. Below the ward name, a secondary line gives an
    ordinance number that nobody living can date. The upper
    corner has been used as a step by generations of people
    taking a shortcut across it; the stone there is worn smooth
    and lower than the rest.
  handcart ruts: Two parallel grooves in the cobblestone surface,
    worn by the weight and repetition of laden carts crossing this
    junction. Each is deep enough to catch a boot-toe at the wrong
    angle. They run at a slight diagonal — the natural path of the
    carts was never quite the straight line the street's geometry
    would imply; the drivers knew something about the slope that
    the layout does not show.
idlemessages:
- A loaded handcart crosses the junction, its wheels dropping
  into the ruts with a familiar clunk and climbing out again.
- The smell from the tar yard drifts east across the lane in
  a brief warm wave and disperses.
- Someone pauses at the boundary stone, reads the lettering
  for reasons of their own, and moves on without comment.
- The sound from the tenements to the south drifts up the
  lane — voices, laundry in the wind, ordinary living.
- A gull drops into the lane, investigates the ruts, finds
  nothing to its purpose, and lifts off again.
