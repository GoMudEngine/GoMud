roomid: 5509
zone: New Plymouth Docks
title: The Underdock Stair
description: >
  The light drops the moment you step onto the landing — the
  chandlery's lamp-glow at your back is the only source of it,
  and it reaches perhaps four steps down before the dark beyond
  refuses it. The stair itself is stone, old stone, cut from the
  same material as the pilings' foundations before the dock-
  planking was laid over them. Every step is wet. The wood above
  sweats brine through its joints and the <ansi fg="slick
  steps">slick steps</ansi> catch the moisture and keep it; you
  can hear your own boot-sole not quite gripping. At the stair's
  foot — as much as you can see of it — the dock-pilings rise
  from <ansi fg="black water">black water</ansi> in a colonnade
  of dark timber, the waterline slapping at the stone in a rhythm
  that sounds different down here, lower and more patient, as if
  the river has a different voice when there is a ceiling over it.
  The passage continues into the dark beyond what the stair
  reveals. You do not go that way. Not yet.
