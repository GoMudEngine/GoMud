nouns:
  slick steps: Stone steps carved from the same grey-brown bedrock
    as the old piling foundations — you can see the chisel-marks
    under the brine film if you crouch and bring a light. Every
    surface that could drain has drained; every surface that could
    not has not. The first three steps are the worst — the gap
    between the dock planking above and the stair is narrow enough
    that water runs directly down the wall and across the step
    face before it can disperse. Lower down, past the reach of the
    light, the steps presumably continue. The sound of them dripping
    is very clear.
  black water: The river, from underneath. At this angle and in
    this light — which is to say, almost no light — it has no color
    at all, only a surface that moves and catches nothing. The gap
    between the lowest visible step and the waterline is perhaps
    two feet; at high tide it would be less. The pilings descend
    into it without visible end. Something moves below the surface
    near the nearest piling — probably a fish, working the shadow.
    The space beyond the pilings, where the low ceiling meets the
    dark water and the passage narrows, is not a place that invites
    further investigation.
idlemessages:
- Water drips from a gap in the planking above and hits the stair
  in a slow, metronomic count.
- The waterline slaps a piling and the sound travels through the
  stone of the step under your feet.
- A smell rises from the dark below — river mud and old timber
  and something older than both.
- From up through the stair-head the chandlery's tar-and-linseed
  comes in a warm wave, then is replaced by cold damp again.
- Something moves in the black water at the stair's foot.
  The surface closes over it and tells you nothing.
