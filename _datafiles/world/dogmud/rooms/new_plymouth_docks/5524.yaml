nouns:
  wax-sealed crates: Wooden crates of two or three sizes, each
    sealed at the joint with a thick bead of dark wax that carries
    no maker's stamp and no label. The wood is dry, the crates
    well-made — not the rough joinery of common cargo. The stacking
    is efficient and deliberate, the work of someone who has done
    this particular arrangement many times. A faint smell rises
    from them, dried and sweet and not quite identifiable. None
    of them rattle when you move them. None of them feel empty.
  thick wall: The shared wall between this building and its
    neighbor — old construction, the mortar set hard over many
    years. You put a hand against it and feel a faint vibration,
    as if the wall conducts sound rather than muffling it. Fragments
    come through — a word, a pause, a chair moved, a door closing.
    None of it resolves into anything you can act on; all of it
    suggests people with reasons to keep their voices down.
idlemessages:
- From the wall at the far side, a voice — low, brief, inconclusive —
  surfaces and drops back into the building noise.
- The crates sit in their arrangement with the patience of things
  that have waited here in exactly this way before.
- A creak from the shop floor beyond the door — the proprietor
  moving, or a new customer entering from the lane.
- The smell of old wax intensifies for a moment on a shift
  of air, then returns to its background level.
- Somewhere in the stack, a crate settles with a faint tick
  that could be temperature change or something inside shifting.
