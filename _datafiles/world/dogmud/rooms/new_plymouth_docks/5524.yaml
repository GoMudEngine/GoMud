roomid: 5524
zone: New Plymouth Docks
title: Marn's Back Room
description: >
  The cupboard door swings inward on a space that is smaller than
  expected — a narrow room running the depth of the building, low
  ceiling, no windows, and a smell that is different from the shop
  outside — sawdust and old cloth in the background, and under
  that something dried and faintly waxy that you cannot quite
  place. Along the right wall, <ansi fg="wax-sealed crates">wax-sealed
  crates</ansi> are stacked two and three high, none of them marked
  with a maker's name or a point of origin — the kind of crates
  that travel without paperwork and store without questions.
  Against the far side, the <ansi fg="thick wall">thick wall</ansi>
  of the adjoining building sits very close; sounds come through
  it in fragments — half-conversations, the scrape of furniture,
  things not meant to cross but that old stonework does not know
  how to stop. The only way out is back through the door.
