title: Dock Street
description: >
  The street behind the wharves carries a different register
  of noise from the quay — not the organized shouting of
  cargo work but the unmanaged ordinary of a quarter going
  about its business. The smell is still brine, still tar,
  but beneath it someone is frying something in lard and a
  carter is settling a dispute with a woman over his wheel
  ruts in her doorstep. At the north corner a stick driven
  into a gap between cobblestones has become the
  <ansi fg="itemname">sellers post</ansi> — plastered
  thick with broadsheets and chalk notices that overlap and
  peel and are replaced so fast the post itself is a kind
  of wall, always fresh on top, always older underneath.
  Along the building-faces the <ansi fg="itemname">open
  gutter</ansi> carries the street's accounting — dishwater,
  fish-wash, the particular slow brown of a neighborhood
  that has been cleaning itself into the same channel for
  as long as anyone can say. North leads to the Salt Cellar;
  west and east to the hiring office and the lodging house.
