zone: New Plymouth Docks
title: The Fish Market
description: >
  The smell here is categorical — fish cut and gutted and salted
  and smoked and newly-caught all braided together at volume, and
  underneath it the cold mineral sharpness of the river itself.
  It does not lessen when you stop noticing it; it simply becomes
  the new fact of the air. Low timber racks stand in rows, each
  one hung with split fish in various stages of curing, from pale
  and recent to dark amber and nearly jerked-dry, swaying slightly
  in the river breeze. At the market's center a broad stone
  <ansi fg="itemname">gutting slab</ansi> runs the length of
  the central aisle — salt-crusted, scaled-over, stained in the
  particular irreversible way of surfaces that have been their
  function for a generation. The <ansi fg="itemname">drying
  racks</ansi> are worth a look if you want to know what the river
  gives up this time of year; the variety is the season's testimony.
