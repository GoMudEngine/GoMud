nouns:
  drying racks: Low timber frames, each rack-bar strung with split
    fish hung through their tails on iron hooks. The skins of the
    older fish have stiffened and darkened to a deep amber; you
    could crack one like bark. Newer catches hang pale and wet,
    dripping into the packed earth below. A rack near the end holds
    something unfamiliar — long, flat, iridescent — that the gulls
    are eyeing from what they apparently judge to be a safe distance.
    It is not a safe distance.
  gutting slab: Stone, not wood — someone made the right choice
    when this market was built, because no wood would have survived
    what this slab has absorbed. It is nearly white with salt and
    the dried scale-film of ten thousand catches, and the surface
    is concave at the center from years of blades being drawn
    across it. A curved gutting knife rests in a notch at the
    near end, its edge kept up, its handle worn smooth. The drain
    groove along the slab's far side runs to a gap in the planking
    and the river takes what it's given.
idlemessages:
- A gull drops from the market eave and snatches something from
  below the lowest rack before anyone can object.
- The salt in the air sits on your lips inside of a minute.
- A vendor adjusts the hang of a rack, testing the weight and
  spacing of each fish with quick professional fingers.
- From the gutting slab comes the flat sound of a knife drawn
  across scale — practiced, two strokes, done.
- The market smell shifts when the tide turns — more brine, less
  smoke, as if the river is reasserting itself.
