title: Jesset's Hiring Office
description: >
  A ground-floor office with the door kept open and the light
  kept on — the dock foreman's operation runs before dawn and
  the door is never locked during working hours, which are
  most of them. The room is small and purposeful — a desk, a
  stool, and the
  <ansi fg="itemname">job ledger</ansi> laid open to the
  current page, the day's hires tallied in a dense, legible
  hand. In the corner an iron
  <ansi fg="itemname">strongbox</ansi> sits bolt-anchored to
  the floorboards — the heaviest thing in the room by the
  way the boards sit around it. The foreman, Jesset, is large
  and weathered, with a handshake people do not forget — an
  extra joint in each finger, which gives his grip an uncanny
  range. He takes on day labor here each morning and settles
  accounts each evening. Everything in between is recorded
  in the ledger with a precision that does not require a tidy
  hand to be legible. North leads to the cookshop; east to
  Dock Street.
