nouns:
  job ledger: A thick-spined book, the current volume in a
    series that lines a shelf above the desk. The open page
    shows today's entries in a dense, consistent hand —
    names or initials, tasks, hours, marks paid. Some entries
    have a small check beside them; others have a dash. Two
    names are crossed through. The margins hold running
    tallies, summed twice, the second sum beside the first
    where they agree and written over it where they did not.
  strongbox: An iron box, bolt-anchored to the floor through
    a plate itself anchored through the boards — a commitment
    to permanence that the rest of the room does not make.
    The hinges are heavy and external, the lock a double-turn
    mechanism of the kind made in the Crafting Quarter a
    generation ago. The box is large enough to hold a week's
    payroll, which is generally what it does.
idlemessages:
- From above the office comes the sound of boots on bare
  floorboards — someone moving through the rooms above.
- The ledger's pages are held open by a river stone that
  has been used as a paperweight long enough to leave a
  permanent impression in the binding.
- A dock-hand appears in the doorway, states a name and a
  number, and is answered with a nod and a mark in the
  ledger before leaving.
- The strongbox does not move or make any sound.
  It does not need to.
- From the street outside comes the ordinary sound of the
  dock morning — carts, voices, the distant creak of rope
  under load.
