roomid: 5525
zone: New Plymouth Docks
title: The Dock Constable's Post
description: >
  A converted storage room that has served as the dock ward's
  constabulary station long enough to accumulate the specific
  atmosphere of such places — close, paper-scented, with the
  compressed patience of a room where people sit and wait for
  things to be reported or resolved. Two desks, a lamp that burns
  through the day shift and is left burning through the night,
  and a <ansi fg="notice board">notice board</ansi> fixed to the
  east wall where current matters are posted in the constable's
  hand. At the back of the room, behind a short run of iron bar,
  a <ansi fg="holding cell">holding cell</ansi> occupies what was
  once a grain closet — just large enough to stand in, or to sit
  on the single bench if you fold your knees right. It is empty
  at present, which is something. West returns to the outer lane;
  north leads to the foreman's office above.
