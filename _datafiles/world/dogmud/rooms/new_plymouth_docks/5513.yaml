roomid: 5513
zone: New Plymouth Docks
title: The Salt Cellar Rooms
description: >
  The upper floor is low and narrow, the ceiling close enough
  to require a duck where the roofline meets the stair-head.
  Eight doors on one side of a corridor, each fitted with a
  latch that works and a lock that has been broken long enough
  that nobody fixes it. The kind of lodging that asks only
  that you are gone by morning-bell and have left the linen
  approximately where you found it. A row of
  <ansi fg="cots">cots</ansi> occupies the open space at the
  corridor's end — the overflow provision when the rooms are
  full, which they often are. At the far wall a
  <ansi fg="washbasin">washbasin</ansi> sits on an iron
  bracket, cracked along one side and sealed with a line of
  grey wax that holds well enough. The water in it is from
  this morning or possibly yesterday; it is hard to say.
  The stairs go back down to the taproom.
