nouns:
  cots: Three rope-frame cots at the corridor's end, each
    with a folded blanket and a thin ticking mattress that
    has been restuffed at least once and not recently. The
    blankets are different patterns — one striped, one plain,
    one that was once a garment of some kind and has been
    cut down and hemmed. All of them smell of the people
    who have slept here before, but not unpleasantly; just
    human, and used, and ordinary in the way that shared
    sleep eventually becomes.
  washbasin: A ceramic basin, pale with a blue-painted band
    at the rim, cracked in a diagonal line from the lip to
    within an inch of the drain. The crack is sealed with
    wax, grey and smooth, applied by someone who knew what
    they were doing. A bar of soap sits on the bracket
    beside it, worn to a thin wedge. The water is clean
    enough if you do not examine it too closely.
idlemessages:
- From below the sound of the taproom rises and falls like
  something breathing.
- A door at the corridor's end opens a crack, considers
  the hallway, and closes again.
- The floorboards settle in a slow sequence from the stair-
  head toward the far wall — the building adjusting its
  weight as it always does at this hour.
- The smell of the driftwood fire comes up through the gaps
  between boards, faintly salt and faintly strange.
- Someone in one of the rooms coughs once and does not
  cough again.
