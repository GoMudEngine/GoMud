title: Tailor's Cottage
description: >
  The clack and slide of a heavy floor loom fills the long
  front room of a cottage at the town's northern edge —
  Linny Greaves at her work, weaving the wool blanket
  trade Stillwater is quietly known for among the road's
  travelers. A heavy oak <ansi fg="itemname">loom</ansi>
  dominates the southern half of the room, the warp
  threads stretched taut in long parallel rows and the
  shuttle currently parked mid-pass. A long working
  <ansi fg="itemname">bench</ansi> against the western
  wall holds the day's hand-stitching — a folded shirt
  needing collar-work, a pile of mended fishing-net,
  three pairs of patched trousers awaiting collection. A
  rack of finished <ansi fg="itemname">cloth</ansi>
  stands ready by the door — bolts of plain wool, a
  shorter row of cattail-down lined cloaks for the cold
  travel north, and a small folded stack of dyed lake-mint
  green that the temple's acolyte has bought twice and
  may yet buy a third time.
