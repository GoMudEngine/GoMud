roomid: 4111
zone: Stillwater
title: North Gate
description: >
  The road out of town narrows again as it passes through a
  simple <ansi fg="itemname">arch</ansi> set across the
  road's northern shoulder. Beyond the arch, the paving
  gives way to pressed gravel, and the road runs northward
  into rolling country before bending out of sight. A
  weathered <ansi fg="itemname">milestone</ansi> stands at
  the road's shoulder under the arch — its inscribed face
  turned northward, naming a destination most travelers in
  this town will never see. The lake-wind comes harder
  through the gap here than it does in the square. A faint
  scent of woodsmoke drifts back from a campsite somewhere
  out of sight.
