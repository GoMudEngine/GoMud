zone: Stillwater
title: Reedy Foreshore
description: >
  Frogs croak unevenly across a marshy stretch of shallows
  where a small creek drains south into the lake — the
  reeds reach over your head in places, and the path
  threads between them on a series of flat plank
  duckboards. The smell is wet earth, marsh-sage, and the
  faint sweet rot of last year's growth. Tall stands of
  <ansi fg="itemname">cattails</ansi> dominate the wet
  ground, their seedheads fat and brown. Slender grey
  <ansi fg="itemname">marsh willow</ansi> saplings rise
  from the firmer hummocks, their bark traditionally
  stripped for poultice work. Closer to the path, a
  <ansi fg="itemname">lake mint</ansi> patch crowds the
  edge of the duckboards — bruise a leaf and the smell
  doubles in the air.
biome: swamp
