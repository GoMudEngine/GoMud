roomid: 4117
zone: Stillwater
title: Net Yard
description: >
  The creak of timber drying-frames swaying in the lake-wind
  fills the small fenced yard north of the docks — a long
  open space with two rows of tall A-shaped
  <ansi fg="itemname">frames</ansi> spread with mended
  fishing nets stretched taut to dry. Wooden
  <ansi fg="itemname">shuttle</ansi>-needles and balls of
  waxed twine sit in a basket beside a low working
  <ansi fg="itemname">bench</ansi>, where the day's mending
  is done in long patient sessions. A bucket of
  <ansi fg="itemname">tallow</ansi> stands ready for
  sealing knots. The yard smells of pitch and fish-oil and
  the dry sweet must of cured cordage.
