nouns:
  anvil: A solid block of forged iron mounted on an oak
    stump as thick as a person, the working face polished
    to a soft grey gleam from years of work. The horn
    bears half a dozen scarring rings where rope was bent
    against it. A small scuttle of water sits at the
    stump's base for tempering.
  forge: A waist-high stone-and-clay hearth set into the
    eastern wall, the bellows hung on a wooden arm at its
    side. Even when banked, the coals breathe out a dry
    steady warmth that you can feel across the room. The
    chimney above is dark with old soot, the bricks at its
    base discoloured pale from the heat.
  stock: A long timber rack along the northern wall,
    sorted with the kind of order that comes from knowing
    exactly what every customer asks for — fishing-hooks
    in graduated sizes, gaff-rings, net-needles, hinges,
    latches, small chain by the yard. A separate rack in
    the back holds longer flat-stock and a few finished
    blades wrapped in oilcloth.
  bellows: A pair of large leather lung-bags hung on a
    pivoting wooden arm beside the forge, the handle
    polished smooth by use. A single pump from a grown
    person's weight raises a noticeable tongue of flame
    in the coals.
  scuttle: A wide iron bucket of water at the base of the
    anvil-stump, the surface filmed with grey ash and a
    faint iridescence from quenched oil. Used for
    tempering hot work.
idlemessages:
- A coal in the forge cracks softly and settles deeper into the bed.
- The bellows-arm creaks faintly even at rest, swaying in the heat-currents.
- A hammer rings on iron — three measured blows, then silence.
- The lake-wind shifts and a draft pulls the forge-smell briefly toward the door.
- A finished hook drops into the cold-bin with a small bright clink.
