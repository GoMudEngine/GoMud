roomid: 4106
zone: Stillwater
title: Brindle's Smithy
description: >
  The hammer-strikes ring before you reach the door — three
  measured blows, then silence, then three more. The smithy
  is a low timber-framed building open along its southern
  wall to vent the forge-heat, the air inside shimmering
  faintly above an <ansi fg="itemname">anvil</ansi> set on
  a thick oak stump near the center. The
  <ansi fg="itemname">forge</ansi> itself takes the eastern
  wall, banked low with grey ash even when no one is
  working it. Most of the iron <ansi fg="itemname">stock</ansi>
  racked along the northern wall is small — fishing-hooks,
  gaff-rings, net-needles, a dozen kinds of hinge. A few
  longer pieces in the back say the smith can do other work
  when she is asked.
