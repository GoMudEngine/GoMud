roomid: 4124
zone: Stillwater
title: Temple Garden
description: >
  Behind the temple, a small walled <ansi fg="itemname">garden</ansi>
  catches the southern sun and shelters from the
  lake-wind — narrow gravel paths between raised
  <ansi fg="itemname">beds</ansi> of culinary and medicinal
  herbs, each bed labelled in a careful round hand. The
  smell is layered — rosemary and thyme dominant near the
  wall, marsh-sage and lake-mint in the wetter beds nearer
  the back, and something sweeter that resolves itself into
  late-flowering elderberry along the eastern fence. A
  small stone <ansi fg="itemname">bench</ansi> sits in the
  shade of an old crab-apple. The temple's acolyte tends
  the garden when not otherwise occupied; visitors are
  welcome to walk the paths in quiet.
