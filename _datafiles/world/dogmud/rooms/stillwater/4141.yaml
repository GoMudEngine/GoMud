title: Sluice Pond
description: >
  A wide quiet <ansi fg="itemname">pond</ansi> opens out
  above the watermill where the creek pools behind a
  low timber sluice-gate before being diverted to drive
  the water-wheel below. The water is glass-still in
  fair weather, mirroring the sky and the line of
  willows along the western bank. A wooden
  <ansi fg="itemname">sluice gate</ansi> at the southern
  end controls the flow to the mill, raised half a
  hand's breadth at the moment to keep the wheel
  turning at a working pace. Closer to the bank, a
  small accumulation of dark heavy nodules glints under
  the shallow water — <ansi fg="itemname">lake iron</ansi>,
  precipitated out by some process of the marsh and the
  creek's slow movement, the kind of forage the smith
  in town pays a premium for.
