roomid: 4100
zone: Stillwater
title: Stillwater Gate, Southern Approach
description: >
  A low arch of mortared lake-stone marks the southern edge
  of town. A length of tarred twine strung with a dozen
  glass <ansi fg="itemname">fishing floats</ansi> hangs from
  the keystone — pale greens and ambers tapping softly
  against each other in the lake-wind, ringing further than
  you would expect. The road firms beneath your feet here,
  the gravel laid fresh and the verge trimmed back. North of
  the arch the air shifts: woodsmoke and fish-smoke, tallow,
  the iron-clang of a smithy somewhere deeper in. A weathered
  cedar <ansi fg="itemname">notice board</ansi> leans askew
  against the western pillar, its postings layered three-deep
  in faded ink.
