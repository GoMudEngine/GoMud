title: North Square
description: >
  A second, smaller square — half the size of the lakefront
  one, paved in the same blue-grey
  <ansi fg="itemname">flagstone</ansi> but feeling much more
  domestic. A <ansi fg="itemname">dovecote</ansi> on a tall
  wooden post stands at the center, the wood weathered
  silver, the slate roof streaked white with bird droppings.
  The square is hemmed by the back walls of shops on its
  southern side and the stone faces of small
  <ansi fg="itemname">houses</ansi> on the others. A worn
  flagstone path leads east to the constabulary's front
  door; the road continues north to the gate.
