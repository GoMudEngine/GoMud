title: Wardstone Circle
description: >
  Seven tall standing <ansi fg="itemname">wardstones</ansi>
  of weathered basalt rise in a ragged circle on a low
  rise above the town, each stone roughly twice a person's
  height, each leaning slightly inward toward the
  circle's centre. The grass within the circle is short
  and cropped close in a way no goat could account for.
  At the centre, a flat carved <ansi fg="itemname">altar slab</ansi>
  of darker stone bears a long tight spiral worn deep
  enough to fit a finger into — the carving older than
  the wardstones around it, and the wardstones are old.
  A small simple
  <ansi fg="itemname">hut</ansi> of split timber and
  thatched reed leans against the southernmost wardstone,
  smoke threading up steady from a small chimney. Renn
  the Wardweaver lives here; he speaks little and works
  the old ward-craft when asked.
