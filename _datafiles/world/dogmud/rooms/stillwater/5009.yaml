roomid: 5009
zone: Stillwater
title: The Counting House
description: >
  A low building of pale lake-stone squeezed into the lane
  between the general store and the constabulary road, its
  narrow facade marked by a single carved
  <ansi fg="itemname">anchor-and-scales</ansi> above the
  door. Inside, the room is small and deliberate — a
  scarred <ansi fg="itemname">counter</ansi> of dark pine
  spans the width of the space, and behind it a
  floor-to-ceiling <ansi fg="itemname">rack</ansi> of
  pigeonholes holds folded documents secured with cord and
  wax. Most of the seals visible from the public side are
  inked with the silhouette of a pearl in an open shell.
  The air smells of beeswax, old paper, and the faint
  brine that always finds its way inland when the lake
  wind shifts. A heavy
  <ansi fg="itemname">strongbox</ansi> of lake-iron sits
  bolted low to the floor behind the counter, and a
  ledger the size of a small door lies open on the
  writing slope beside it. This is the town's bank -- not
  vaulted marble but a working counting house, built for
  fishing skiffs and pearl merchants, not emperors.
