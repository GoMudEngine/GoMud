roomid: 4107
zone: Stillwater
title: Coalsmoke Alley
description: >
  The alley between the smithy's western wall and the
  cottages behind it is barely wide enough for two people
  to pass without turning sideways. The smithy's stone
  <ansi fg="itemname">wall</ansi> on your right radiates a
  dry baked heat even at this distance from the forge, and
  a film of dark soot blacks the lower courses of the
  cottages opposite. A <ansi fg="itemname">slag heap</ansi>
  takes up most of the alley's far end — the smithy's
  accumulated tailings, cooled to glassy black lumps. Wooden
  <ansi fg="itemname">crates</ansi> of charcoal stacked
  shoulder-high crowd one wall, the topmost lids cracked
  open. The light is poor here even at noon.
