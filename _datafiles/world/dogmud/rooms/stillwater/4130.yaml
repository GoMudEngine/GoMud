roomid: 4130
zone: Stillwater
title: Bone Shoals
description: >
  A small dry alcove off the cave's western branch, the
  floor a low gravel <ansi fg="itemname">shoal</ansi>
  rising clear of the water. The alcove is rimmed and
  scattered with <ansi fg="itemname">bones</ansi> — fish
  bones mostly, picked clean and small, but among them
  the longer pale arc of what might be a wading-bird's
  leg, and one or two pieces too large or oddly shaped
  to identify confidently. A small basalt
  <ansi fg="itemname">cairn</ansi> at the back of the
  alcove looks placed rather than natural — someone, or
  something, has been here long enough to make habits.
biome: cave
coord:
  x: -15
  y: 6
  z: -1
exits:
  east:
    roomid: 4127
