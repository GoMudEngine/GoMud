title: The Bakehouse
description: >
  Bread — the smell hits before the sight, warm and yeasty
  and almost solid in the air around a low stone-built
  bakehouse with smoke rising steady from a tall stone
  <ansi fg="itemname">chimney</ansi> at the back. The
  shopfront is just a wide sill and a wooden serving
  <ansi fg="itemname">counter</ansi> facing the lane, with
  the day's bake stacked behind glass — round country
  loaves, a few darker rye rounds, hand-shaped buns, a
  short row of small pastries. Through the open door
  behind the counter a brick <ansi fg="itemname">oven</ansi>
  glows orange in the gloom, its iron door propped open
  with a long peel. The baker's slate hangs above the
  counter listing the prices in copper — bread is cheap
  here, kept that way deliberately.
