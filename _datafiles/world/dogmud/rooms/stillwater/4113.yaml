zone: Stillwater
title: Lake-View Promenade
description: >
  The lane east of the square opens into a long stone
  promenade running along the top of the lake's eastern
  retaining wall — and from this height the lake itself
  spreads enormous to the horizon, flat and silver in the
  day, the far shore lost in haze. A waist-high
  <ansi fg="itemname">retaining wall</ansi> of dressed
  basalt drops two human-heights to the water and the
  fishing docks below. A weathered iron
  <ansi fg="itemname">lamp post</ansi> stands at the
  promenade's midpoint, its glass smoke-blackened. A
  worn stone <ansi fg="itemname">bench</ansi> faces the
  lake — generations of travelers have sat here to make
  the same calculations about distance and time.
