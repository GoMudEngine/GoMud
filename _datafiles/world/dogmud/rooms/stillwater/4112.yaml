title: Stable Yard
description: >
  Hay and horse — that is the smell of the place, warm and
  sweet and animal. The yard is packed earth gone to dust
  in the high traffic-paths, fenced on three sides by a
  three-rail timber paddock and on the fourth by the long
  flank of a low <ansi fg="itemname">stable</ansi> building.
  A <ansi fg="itemname">water trough</ansi> of mossed stone
  stands against the stable's wall, kept full from a hand
  pump worked by whoever is on stable duty that hour. A
  <ansi fg="itemname">hayloft</ansi> hangs out over the
  stable's front, the loose straw of last winter's bedding
  still littering the loft's edge.
