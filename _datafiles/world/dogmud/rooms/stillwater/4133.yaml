roomid: 4133
zone: Stillwater
title: Mill Creek Footbridge
description: >
  A narrow timber <ansi fg="itemname">footbridge</ansi> of
  three planks wide spans a clear running
  <ansi fg="itemname">creek</ansi> at the western edge of
  town — Mill Creek, fed from the sluice pond above the
  watermill and running south here to empty into the lake
  beyond. The bridge's hand-rails are worn smooth where
  generations of millers and water-haulers have leaned
  against them. The water below is shallow and clear, the
  bottom dark with peat. A stone <ansi fg="itemname">bench</ansi>
  sits at the western end of the bridge for the older
  miller's wife who used to stop here on her water-runs.
  The watermill yard rises just to the north.
