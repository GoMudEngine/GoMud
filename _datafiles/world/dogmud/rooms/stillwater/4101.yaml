roomid: 4101
zone: Stillwater
title: South Approach
description: >
  The road runs straight here for the last short stretch
  before reaching the square, hemmed in by the back walls of
  cottages and the long flank of a coopering yard. Slate
  roofs lift left and right, with pale grey woodsmoke
  drifting from a half-dozen kitchen chimneys at this hour.
  The road's loose gravel gives way underfoot to dark
  blue-grey <ansi fg="itemname">flagstone</ansi> laid in a
  long-ago paving — the seams worn deep, holding rainwater
  in their grooves. A wet, mineral coolness slips between
  the cottages from somewhere east; the lake is closer than
  it sounds. A waist-high <ansi fg="itemname">milestone</ansi>
  stands at the road's shoulder, half-buried in moss.
