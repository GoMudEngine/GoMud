nouns:
  milestone: A waist-high block of dressed lake-stone, the
    inscribed face turned toward the road. The carving names
    the distances to towns most travelers will already have
    walked through — Ashwick (south), Watchers Crossing
    (south-east), Thornwall (east). The northward face is
    blank — Stillwater stops being a milestone-worth here.
    The base is wrapped in moss thick enough that a finger
    sinks in.
  flagstone: Dark blue-grey paving stones, set in a herringbone
    pattern that has long since gone uneven. The seams hold
    standing water from the last rain, and a pale film of
    algae glazes the joints. Whoever paved this road did it
    once and did it well; whoever has maintained it since has
    done less.
  cottages: Modest single-story houses of plank and mortar,
    backs turned to the road. Kitchen-smoke threads up from
    half a dozen chimneys. Through one open shutter, a woman
    is humming as she works dough on a board.
idlemessages:
- A woman's voice, low and tuneless, drifts from a kitchen window — a working-song without words.
- Pale woodsmoke catches the breeze and bends sideways above the slate roofs.
- A tabby <ansi fg="mobname">cat</ansi> watches from a window-ledge, tail flicking once at your passing.
- The wet mineral cool of the lake reaches you between the cottages, then is gone.
- A door bangs in the distance and someone calls a name — too far to make out, too brief to need an answer.
