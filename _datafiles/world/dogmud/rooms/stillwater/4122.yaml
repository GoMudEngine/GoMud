title: Temple Approach
description: >
  A short flagged <ansi fg="itemname">path</ansi> runs east
  from the promenade between two tall lake-stone
  <ansi fg="itemname">pillars</ansi>, weathered and
  lichen-streaked, that frame the approach to the temple
  beyond. Above the further door, a worn carved
  <ansi fg="itemname">inscription</ansi> in the lintel
  reads STILL THE WATERS, STILL THE HEART — the temple's
  founding prayer. The air here is quieter than the
  promenade behind you; even the lake-wind seems to drop
  half a degree when it reaches the pillars. Worshippers
  pass through this approach in a slow steady trickle from
  dawn to dusk.
