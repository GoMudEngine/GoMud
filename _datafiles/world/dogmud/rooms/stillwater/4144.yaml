roomid: 4144
zone: Stillwater
title: Old Chapel Ruin
description: >
  The broken stone foundation of a small chapel sits in a
  mossy hollow west of the wardstone circle — three
  surviving courses of mortared lake-stone and a single
  intact corner where a doorpost still stands. The
  <ansi fg="itemname">foundation</ansi> outlines a single
  modest room perhaps fifteen paces across, the floor
  long given to grass and creeping moss. A weathered
  carved <ansi fg="itemname">altar stone</ansi> remains
  at the eastern end, the surface inscribed with a long
  tight spiral inside an outer circle — the work of a
  hand that long predates the present temple, in a
  carving style no current mason in town would
  recognise. The lake-wind passes through the broken
  doorframe with a low even sound. Nothing else moves
  here; the chapel was abandoned generations before
  anyone alive remembers, and the present temple in town
  carefully does not discuss what stood here before.
