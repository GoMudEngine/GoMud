roomid: 4118
zone: Stillwater
title: Boat Rental Pier
description: >
  Three flat-bottomed <ansi fg="itemname">skiffs</ansi> are
  drawn up at a short timber pier east of the net yard —
  light shallow craft built for one or two persons, with
  oars stowed inboard and a single small sail furled at the
  mast. A small painted <ansi fg="itemname">sign</ansi>
  nailed to the pier's outer post lists the day rate in
  copper. A bronze <ansi fg="itemname">bell</ansi> hangs
  from a wooden frame near the pier's landward end — the
  way travelers summon the boatman from his cottage when he
  is not at the pier himself. The water here is calm and
  clear enough to count the gravel on the bottom. A stubby
  berth at the pier's end serves the passage boats — the
  Lakewind Packet and the Grey Heron take their turns tying
  up here — where a painted <ansi fg="itemname">sailings
  board</ansi> lists their comings and goings and the
  <ansi fg="mobname">ferry agent</ansi> keeps a locked
  strongbox close at hand.
