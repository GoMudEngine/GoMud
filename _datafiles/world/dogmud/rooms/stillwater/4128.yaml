roomid: 4128
zone: Stillwater
title: Pool Chamber
description: >
  The cavern opens into a wide low-ceilinged chamber
  half-filled by a deep, very still
  <ansi fg="itemname">pool</ansi> of black water, the far
  edge lost in the dark. A narrow stone
  <ansi fg="itemname">ledge</ansi> runs around the pool's
  near margin, just wide enough to walk on. The pool's
  <ansi fg="itemname">surface</ansi> ripples occasionally
  without wind, and pale moving things glide just below it
  — too fast to follow, too pale to identify, never quite
  breaking the water. A passage continues north into
  darker stone; another opens west across a tighter
  watery gap.
biome: cave
