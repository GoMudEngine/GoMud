title: Stillwater Cemetery
description: >
  A small walled <ansi fg="itemname">cemetery</ansi> sits
  at the western edge of town, perhaps forty
  <ansi fg="itemname">graves</ansi> arranged in patient
  rows along narrow gravel paths. The wall is low and
  mossy, the gate iron and propped open. The wind here
  comes off the lake unobstructed, and the silence under
  it is the kind small towns reserve for their dead. Most
  of the markers are small carved lake-stone slabs,
  weathered to varying degrees, the names sometimes still
  readable. A larger central
  <ansi fg="itemname">monument</ansi> bears a longer list
  — the lake's drowned, the sailors and fishermen the
  water has taken back over the years. Near the eastern
  wall, set apart, a smaller plot holds a single newer
  marker — Elgar Voss's empty grave, no body ever
  recovered, the name carved in a hand the grief in which
  is still legible.
