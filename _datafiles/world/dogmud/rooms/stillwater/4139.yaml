title: Tannery Shed
description: >
  A long low timber shed built apart from the residential
  cottages — the smell explains the distance, sharp with
  oak-bark tannin and the underlying organic note of
  curing hide that the Stillwater wind never quite carries
  away. Stretched <ansi fg="itemname">hides</ansi> hang on
  upright wooden frames along the western wall in
  graduated stages of cure, from raw fresh-skinned at one
  end to fully tanned russet leather at the other. A long
  <ansi fg="itemname">vat</ansi> of tannin solution
  dominates the centre of the shed, the surface dark with
  oak-bark steeped to its working strength. A
  <ansi fg="itemname">scraping bench</ansi> against the
  northern wall holds the half-fleshed lake-eel hide that
  the cave-divers brought in last week — the latest in a
  long row of unusual hides Garth Peltman has been quietly
  building a private market for.
