roomid: 4115
zone: Stillwater
title: Crab-Trap Beach
description: >
  Pebbles roll and click underfoot on a narrow strand of
  black basalt and water-rounded gravel, the lake lapping
  in slow tongues at your boots. A row of lobed wicker
  <ansi fg="itemname">crab traps</ansi> sits drying along
  the high-water line, woven from soaked withies and weighted
  with stones — the local way of catching the freshwater
  crayfish that scuttle through the shallows here. The
  <ansi fg="itemname">water line</ansi> is marked with a
  long ribbon of dried weed and small bleached bivalve
  shells, evidence of richer days. A single weathered grey
  <ansi fg="itemname">log</ansi> of driftwood, smoothed
  glass-pale by the lake, lies just beyond the high water.
biome: water
