title: The Pike & Lantern
description: >
  Warm yellow lamplight, the smell of frying butter, and the
  low murmur of voices fill the inn's common room — a long
  low space under a beamed ceiling, with a long pine
  <ansi fg="itemname">bar</ansi> running the northern wall
  and a stone <ansi fg="itemname">hearth</ansi> on the
  eastern that radiates heat across the room even at midday.
  Half a dozen <ansi fg="itemname">tables</ansi> of mixed
  sizes scatter the dark-plank floor, with a slate of the
  day's fare hung beside the bar. The front door stands open
  onto the inn's <ansi fg="itemname">yard</ansi> — a
  packed-earth waiting space hung with weathered fishing-net
  bunting and bordered by a hitching rail, a carved
  <ansi fg="itemname">sign</ansi> of a leaping pike swaying
  over the threshold. A plank
  <ansi fg="itemname">stair</ansi> climbs the southwestern
  corner toward the lodging loft above.
