zone: Stillwater
title: Tinder & Tackle
description: >
  Pitch and twine and the dry-paper smell of stored
  provisions — the general store fills the western half of
  a long timber building, the bait-and-tackle counter taking
  up the eastern half where the lake-wind can carry the
  smell of fish-scraps out the back. A wall of
  <ansi fg="itemname">tackle</ansi> hangs on iron pegs from
  floor to ceiling along the eastern wall, hooks of every
  gauge sorted into shallow cedar drawers. The western wall
  holds the dry stock — sacks of meal, jars of preserves,
  ropes of dried apple, oilcloth-wrapped salt. A scarred
  plank <ansi fg="itemname">counter</ansi> divides the
  room, the <ansi fg="itemname">slate</ansi> behind it
  scrawled over with the current prices.
