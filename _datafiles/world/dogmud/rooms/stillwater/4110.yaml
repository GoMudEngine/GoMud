roomid: 4110
zone: Stillwater
title: Constabulary
description: >
  A low building of mortared lake-stone with a slate roof
  and an iron-banded door propped open in fair weather. The
  air inside smells of old paper, ink, and the lake-cool
  draft from a high western <ansi fg="itemname">window</ansi>.
  A long pine <ansi fg="itemname">counter</ansi> divides the
  room front-to-back, and behind it a heavy iron
  <ansi fg="itemname">strongbox</ansi> sits bolted to the
  floor in the corner. The northern wall is a layered
  patchwork of <ansi fg="itemname">postings</ansi> — wanted
  notices, bounty offers, public-record entries, faded
  curling sheets that no one has been bothered to take down.
  The back of the room is closed off by a row of thick iron
  <ansi fg="itemname">bars</ansi>, with a single barred door
  at their center, separating the office from a small
  one-person <ansi fg="itemname">cell</ansi> furnished with
  a plank bench, a wooden slop bucket with a fitted lid, and
  clean straw on a packed-earth floor.
