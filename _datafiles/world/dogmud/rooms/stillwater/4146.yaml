title: Boat-Builder's Yard
description: >
  Hot pitch and shaved oak — the smell of a working
  boat-yard hits before the sight of the half-finished
  <ansi fg="itemname">hull</ansi> on its slipway dominates
  the open work-yard east of the fishing docks. The hull is
  a new lake-skiff in mid-build, the keel laid and the
  ribs raised but the planking only halfway up. Wood
  <ansi fg="itemname">shavings</ansi> drift across the
  yard in any breeze. A long working
  <ansi fg="itemname">bench</ansi> against the northern
  wall holds the day's tools — drawknives, planes, a row
  of carved wooden patterns for the boat's curves. A
  small <ansi fg="itemname">brazier</ansi> in the corner
  keeps the pitch warm in a hanging iron pot. Pell Halt
  builds boats here; his brother Efren rents them out at
  the pier when they are finished.
