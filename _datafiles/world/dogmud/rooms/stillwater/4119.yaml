title: Lakeshore North
description: >
  The shore opens out and the air goes a degree colder as
  the wind comes off the open water unobstructed by docks
  or buildings. The flagstone path gives way to a
  pebbled <ansi fg="itemname">strand</ansi> of small dark
  stones, with a low rocky <ansi fg="itemname">cairn</ansi>
  raised at the path's bend by some long-passed pilgrim
  marking the spot where the lake first comes into clear
  view from the north. A grey <ansi fg="itemname">log</ansi>
  of bleached driftwood lies beyond the high water. The
  lake here is more itself — fewer skiffs, fewer voices,
  more wind, more sky.
