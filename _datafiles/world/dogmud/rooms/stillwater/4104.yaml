title: The Pike & Lantern, Lodging Loft
description: >
  The smell up here is altogether different — clean linen,
  beeswax candle, and the faint mineral cool of lake-air
  through a half-shuttered <ansi fg="itemname">window</ansi>
  in the eastern gable. The loft runs the long axis of the
  inn beneath a steep timbered roof, the rafters hung with
  drying <ansi fg="itemname">herbs</ansi> and a tarred rope
  long enough to lower a trunk down to the yard. Plain
  rope-strung <ansi fg="itemname">bedsteads</ansi> stand in
  two rows, each with a folded grey blanket and a small
  lockable travel-chest at its foot. A
  <ansi fg="itemname">washstand</ansi> against the southern
  wall holds a chipped enamel basin and a clay jug. The
  plank floor is swept and the boards creak honestly.
