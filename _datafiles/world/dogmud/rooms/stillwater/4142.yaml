zone: Stillwater
title: Travelers' Camp
description: >
  A flat trampled <ansi fg="itemname">clearing</ansi> just
  outside the town's north gate, where wagon parties
  paused for years now have worn the grass to bare earth
  in three or four predictable circles. Two
  <ansi fg="itemname">fire rings</ansi> of fieldstone are
  spaced along the clearing's edge, each holding a bed of
  cold grey ash with a flat stone at the lip for cooking.
  An old wooden <ansi fg="itemname">hitching post</ansi>
  stands at the southern end, iron rings driven into its
  side at three different rope heights. A peddler's
  painted <ansi fg="itemname">wagon</ansi> is currently
  parked at the western edge of the clearing — a
  high-walled cart of seasoned timber with shutters that
  unfold into a small selling counter, hitched to a quiet
  grey mule cropping the verge.
