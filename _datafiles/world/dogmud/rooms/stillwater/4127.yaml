roomid: 4127
zone: Stillwater
title: Dripping Antechamber
description: >
  Cold dark water is suddenly ankle-deep around your boots
  inside the cave's first chamber, and the only sound is
  the steady measured <ansi fg="itemname">drip</ansi> of
  water from somewhere in the dark ahead. The ceiling is
  low enough to stoop, the walls slick black basalt with
  a thin film of cold water running steadily down them. A
  faint <ansi fg="itemname">light</ansi> reaches in from
  the cave-mouth above and behind you, enough to make out
  the chamber's shape but not its details. The
  <ansi fg="itemname">passage</ansi> continues north into
  deeper darkness, and a smaller side passage opens west,
  the water there shallower.
biome: cave
