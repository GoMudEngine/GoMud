title: Temple of Stillwater
description: >
  The sound is the first thing — a steady soft trickle of
  water from a dark stone <ansi fg="itemname">font</ansi>
  set into the temple's western wall, the basin overflowing
  in a thin sheet to a runnel below that returns the water
  somewhere out of sight. The sanctuary is a single high
  stone room with arched <ansi fg="itemname">windows</ansi>
  set high in the eastern and northern walls and a worn
  flagstone <ansi fg="itemname">mosaic</ansi> on the floor
  depicting a leaping pike inside a circle. A simple stone
  <ansi fg="itemname">altar</ansi> stands at the eastern
  end with three white candles burning even at midday. A
  narrow plank <ansi fg="itemname">stair</ansi> climbs the
  southern wall to a small upper room. A side door north
  leads into the healer's alcove; a door south opens onto
  the herb garden behind. A worn iron-banded
  <ansi fg="itemname">lockbox</ansi> sits half-hidden
  behind one of the altar's flanking columns.
