roomid: 4125
zone: Stillwater
title: Healer's Alcove
description: >
  A small side room off the temple's northern wall, smelling
  of herbs and beeswax — a low plank <ansi fg="itemname">cot</ansi>
  along the western wall, a long working
  <ansi fg="itemname">bench</ansi> opposite, and a row of
  small earthenware <ansi fg="itemname">bowls</ansi> on a
  shelf above the bench, each labelled in the same careful
  round hand that labels the garden beds. A single tall
  beeswax candle burns in an iron holder beside the bench,
  giving steady warm light even when the temple's high
  windows do not. A copper kettle hangs from a hook above
  a small banked brazier in the eastern corner.
biome: city
