roomid: 4121
zone: Stillwater
title: Cave Mouth
description: >
  Cool wet air sighs steadily out of a dark slot at the
  base of the basalt ledge — a smell of old water and
  stone-cold mineral, the kind of air that has not seen
  the sun. The opening is only just wide enough to enter
  at a stoop, half-flooded, the water pooling deeper just
  inside. A snarl of frayed
  <ansi fg="itemname">fishing line</ansi> tangled around
  a snag at the cave's lip suggests something has dragged
  netting in here. A small constabulary
  <ansi fg="itemname">notice</ansi> nailed to a wooden
  board beside the entrance reads SOMETHING IN HERE.
  BOUNTY DOUBLED. ASK CONSTABLE. Beneath it is a
  hand-drawn sketch of a torn net.
biome: cave
