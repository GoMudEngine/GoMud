roomid: 4126
zone: Stillwater
title: Pearl-Carver's Garret
description: >
  A small upper room under the temple's slate roof, lit by
  a pair of tall north-facing gable
  <ansi fg="itemname">windows</ansi> that catch the cool
  steady light a jeweler needs for fine work. A long
  cluttered working <ansi fg="itemname">bench</ansi> runs
  the length of the eastern wall, its surface a quiet
  organized chaos of small tools and half-finished pieces.
  A glazed display <ansi fg="itemname">case</ansi> stands
  against the southern wall, holding a small but striking
  collection of finished work — pendants, rings, a single
  finely-worked clasp. A high tall stool sits at the bench;
  a smaller chair waits at the case for a customer. The
  smell is beeswax polish and the faint metallic tang of
  freshly-filed silver.
