roomid: 5106
zone: Stillwater
title: Holding Cell
description: >
  A single stone cell behind the constabulary's iron bars, barely wide
  enough to pace. The walls are mortared lake-stone gone green at the
  joints, and the only light comes from a narrow
  <ansi fg="itemname">window</ansi> slit set high near the ceiling, too
  small for anything but a wrist. A low wooden
  <ansi fg="itemname">bench</ansi> runs along one wall, a fitted slop
  <ansi fg="itemname">bucket</ansi> in the corner, and clean straw
  scattered on the packed-earth floor. Someone has left their mark in
  the mortar — faint <ansi fg="itemname">scratches</ansi> of tally-counts
  and a small carved fish, patient work from a previous occupant's long
  afternoon. The barred door is the only way out, and it opens only from
  the office above.
