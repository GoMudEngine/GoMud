title: Cooper's Lane
description: >
  The rasp of an adze against oak, then a long pull of a
  drawknife, then the same rasp again — Hodge the cooper
  works on a half-finished <ansi fg="itemname">barrel</ansi>
  on a low working trestle in front of his shop, and the
  sound has set the rhythm of this stretch of street for
  thirty years. Cooper's Lane runs west off the main road,
  a narrow paved residential lane with the cooper's open
  shop-front on the southern side and three small
  <ansi fg="itemname">cottages</ansi> opposite. Stacked
  finished casks and racks of bent <ansi fg="itemname">staves</ansi>
  line the southern frontage. The smell here is sweet
  shaved oak and the faint mustiness of barrel-pitch.
