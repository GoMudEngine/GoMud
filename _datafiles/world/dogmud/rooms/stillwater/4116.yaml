roomid: 4116
zone: Stillwater
title: Fishing Docks
description: >
  Brine, wet wood, fish-oil, and tar — the working dock's
  smell hits before the sound of mooring rope creaking
  against bollards reaches you. Three plank
  <ansi fg="itemname">wharves</ansi> jut into the shallows
  on rust-flaked iron pilings, fishing-skiffs moored two and
  three to a wharf, the lake-light bouncing under their
  hulls. A long oak <ansi fg="itemname">table</ansi> on
  trestles serves as the fishmonger's gutting and selling
  bench, sluiced clean with lake water at the end of every
  day. A row of <ansi fg="itemname">drying racks</ansi> at
  the southern end of the dock holds rows of split fish
  curing in the lake-wind. Most striking — and most
  troubling — is the bundle of torn <ansi fg="itemname">nets</ansi>
  laid out on the planks for inspection, the tears too clean
  and too wide to be ordinary wear.
