roomid: 4102
zone: Stillwater
title: Lakefront Square
description: >
  The square opens out around you — a broad apron of
  flagstone wider than it is long, hemmed by a low retaining
  wall on the eastern side that drops two human-heights to
  the lakeshore. From this height the lake spreads enormous
  to the horizon, flat and silver in the day, the far shore
  lost in haze. A <ansi fg="itemname">stone well</ansi>
  stands square in the center of the open paving, its bucket
  on a rope and a long-handled iron dipper hung from a hook
  on the rim. The smell here is the lake's smell: cold
  stone, brackish reed, the faint sweetness of fish drying
  on racks somewhere east. A slate
  <ansi fg="itemname">map board</ansi> on the well's eastern
  face names the roads that run from this square.
