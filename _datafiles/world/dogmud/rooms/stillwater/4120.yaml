roomid: 4120
zone: Stillwater
title: Lake Path Bend
description: >
  The path narrows to a single-file passage where the
  lakeshore is pinched between the open water and a low
  basalt <ansi fg="itemname">ledge</ansi> rising twice a
  human's height on the landward side. The ground
  underfoot turns from pebbled strand to bare wet stone
  scoured by the lake's higher seasons. A long
  driftwood <ansi fg="itemname">log</ansi> wedges across
  the lake-side of the path here, a slip-or-step decision
  that locals know to navigate without thinking. East,
  the basalt ledge curves out to meet the water and a
  dark slot opens at its base — the cave the constabulary
  has placed a bounty on.
biome: water
