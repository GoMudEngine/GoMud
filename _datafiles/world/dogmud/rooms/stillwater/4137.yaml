title: Ulla's Parlor
description: >
  A neat sparsely-furnished room — the kind of order kept
  by someone who has decided to live alone and chosen to
  do so well. A single carved
  <ansi fg="itemname">chair</ansi> sits by the small
  hearth, a folded grey shawl draped over its back. A
  weaving <ansi fg="itemname">loom</ansi> stands at the
  southern window where the light is best, a half-finished
  wool blanket in mid-row. A clean swept slate floor, a
  row of carved wooden <ansi fg="itemname">birds</ansi>
  along the mantelpiece — each one a different species,
  each one her late husband's work — and a worn plank
  <ansi fg="itemname">stair</ansi> climbs the eastern wall
  to a half-landing and up to the workshop above. Ulla
  rarely leaves this room, and when she speaks her voice
  is quiet enough that the loom's clack is the loudest
  thing in the parlor most days.
