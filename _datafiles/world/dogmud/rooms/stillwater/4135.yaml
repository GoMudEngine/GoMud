roomid: 4135
zone: Stillwater
title: The Watermill
description: >
  The deep slow rumble of a working millstone fills the
  stone-built mill from the moment you step into its open
  yard — a low constant grinding that the millers'
  children grow up sleeping through. A great wooden
  <ansi fg="itemname">water wheel</ansi> turns slowly on
  the building's western wall, fed by the creek's diverted
  flow through a moss-slick wooden flume. Through the wide
  open door the
  <ansi fg="itemname">millstones</ansi> are visible at
  work, the lower stone a slow steady rotation under the
  upper, fine pale flour drifting in the air. Sacks of
  ground meal stand stacked along the eastern wall;
  unground <ansi fg="itemname">grain</ansi> waits in the
  yard outside in heavy canvas-wrapped bundles. The
  miller's slate above the door names the prices for the
  current sack-weights.
