zone: Stillwater
title: Crier's Step
description: >
  A single broad slab of lake-stone sits at the corner where
  the square's eastern lane begins to narrow toward the
  promenade. Generations of standing have polished its upper
  face glassy. A small iron
  <ansi fg="itemname">notice frame</ansi> bolted to the
  wall beside it holds the day's posted reading — currently
  a half-page of constabulary notices weighted with a small
  brass pin. This is where the town crier stands at noon
  and again at sunset to read out the day's news. At other
  hours, the <ansi fg="itemname">step</ansi> is just a step,
  and a good place for travelers to sit and watch the square
  go about its business. East of here the lane bends toward
  the lake.
