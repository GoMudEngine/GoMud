title: Healer's Cottage
description: >
  The smell hits as you cross the threshold — drying herbs
  layered over the sharper resinous edge of tinctures
  brewing somewhere on the back wall. Mistress Vella
  Thorne's cottage is a single long room that doubles as
  her front office and her stillroom — patients waiting on
  a low padded <ansi fg="itemname">bench</ansi> by the
  hearth, the working <ansi fg="itemname">bench</ansi> with
  its mortar and pestle and brass scales running the
  northern wall, and the alchemy
  <ansi fg="itemname">still</ansi> standing on a slate
  shelf by the hearth where the smoke can carry off the
  vapour. Bunches of <ansi fg="itemname">herbs</ansi> hang
  from every rafter — marsh-sage, lake-mint, willow-bark,
  elderberry, a dozen others — and a row of small labelled
  earthenware <ansi fg="itemname">jars</ansi> lines the
  shelf above the hearth.
