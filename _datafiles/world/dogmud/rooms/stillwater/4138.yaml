roomid: 4138
zone: Stillwater
title: Uncle's Workshop
description: >
  Sawdust — fine and grey and undisturbed for years — coats
  every surface in the small upper workshop above Ulla's
  parlor. The room runs the length of the cottage beneath
  a steep timbered roof, lit by a small dust-grimed gable
  window in the western wall. A heavy oak working
  <ansi fg="itemname">bench</ansi> with a built-in
  bench-vise stands against the southern wall, tools racked
  above it in the same patient order in which they were
  left. A half-finished carved wooden
  <ansi fg="itemname">bird</ansi> sits in a clamp, the
  detail-work on one wing complete and the other still
  blocked rough. Ulla's husband died — the neighbors say —
  twelve years ago, on a fishing trip east. Nothing in this
  room has been moved since.
biome: city
