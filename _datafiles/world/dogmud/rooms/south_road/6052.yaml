zone: South Road
title: The Dryside Track
description: >
  The contrast hits you like two different countries laid edge to edge. On
  the western hand the watered land runs on, deep green and humming; but on
  the eastern hand, where the road's bank cuts the fields off from the main
  leat, the farmland is going dry — the barley there stands short and
  yellowing, the soil between the rows cracked into a crazed pale crust
  that crunches and puffs dust at a footfall. The
  <ansi fg="itemname">boundary ditch</ansi> that should water this side runs
  empty, its bed silted and weed-choked, and you can see how recently the
  green failed: the dying crop is still half-green at the roots, killed
  within the season. A hand-lettered <ansi fg="itemname">notice board</ansi>
  has been driven into the verge where the track turns off east toward the
  thirsty fields.
