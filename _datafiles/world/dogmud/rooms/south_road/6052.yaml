nouns:
  boundary ditch: >
    A field-channel that has not carried water in weeks. Its
    bed is caked and cracked, threaded with the wiry stems of weeds that
    only grow where the flow has stopped, and the little sluice at its head
    stands not merely closed but choked with packed clay, as though someone
    upstream did more than simply drop the board. On the dry side, the
    crop is dying row by row in the order the water used to reach it.
  notice board: >
    A plank nailed to a post, weathering fast, scrawled in tar
    by an angry hand: "WATER STOPPED 3 WKS. THE DRYSIDE GOES TO RUIN WHILE
    SOME DRINK THEIR FILL. ASK AT THE FARM WHO HOLDS THE GATE." Below, in a
    different hand and fresher tar, someone has added a single word:
    "AYRES." It has not been crossed out.
  crop: >
    Barley that started the season green and is ending it short and
    sere, the heads light and half-filled, the leaves curling from the tip
    back. It dies in stripes that follow the dry channels, a slow map of
    where the water no longer goes — proof, if any were needed, that
    drought here is a thing done by a person, not the sky.
idlemessages:
- A dry-soil wind lifts a curl of pale dust off the cracked field and walks
  it across the road.
- A single magpie picks over the failing barley, finding nothing, and rattles
  off in disgust.
