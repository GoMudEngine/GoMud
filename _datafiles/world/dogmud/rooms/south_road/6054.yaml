roomid: 6054
zone: South Road
title: Valley Gate
description: >
  The road levels, the dust gives way to swept cobble underfoot, and the
  noise of a town reaches you all at once — voices, cartwheels, a smith's
  ringing somewhere ahead, the busy human sound you have not heard since
  the crossroads far above. This is where the South Road ends and Amber
  Valley begins: a broad stone <ansi fg="itemname">gateway</ansi> stands
  across the way, its arch worn but its gates flung wide, and beyond it the
  pale walls and crowded orange-tiled roofs of the valley town rise close
  enough now to count the chimneys. Orchards press right up to the walls,
  and the great gathered channels of the valley run in beneath them. By the
  gate a <ansi fg="itemname">toll keeper's lodge</ansi> sits in the shade,
  and a last weathered <ansi fg="itemname">boundary marker</ansi> closes
  the road that brought you down.
biome: land
