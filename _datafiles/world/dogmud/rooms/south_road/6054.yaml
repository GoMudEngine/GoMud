nouns:
  gateway: >
    A broad arch of honey-coloured valley stone spanning the road,
    old enough that its keystone carving has weathered to a smooth lump and
    its gates, iron-studded oak, have plainly not been closed in a
    generation. Travellers stream through it both ways without a glance.
    Beyond, the road runs on as a proper paved street into the bustle of
    the town, and the warm valley air is thick with cooking and dust and
    voices.
  toll keeper's lodge: >
    A small flat-roofed booth of mud-brick set in the
    gate's shade, a shuttered window at counter height. A board beside it
    lists the tolls — a copper a cart-wheel, free for those on foot — but
    the shutter is up and the stool inside empty, the keeper off about some
    other business and the gate left to mind itself in the heat.
  boundary marker: >
    A final road-stone at the gate's foot, twin to the one
    far up at the verge where this road began. Its valley face bears the
    wheat-sheaf of Amber Valley, freshly cut and proud; its northward face,
    the worn apple of the orchard country you have left a long hot day
    behind you. You have walked the whole seam, top to bottom, and here it
    closes.
idlemessages:
- A laden cart rumbles in through the gateway from the town, the carter
  nodding to no one in particular.
- The mingled smells of the town roll out under the arch — bread, dung,
  hot stone, and somewhere close, frying fish.
