nouns:
  drystone fold: >
    A round pen of mortarless fieldstone, chest-high, built to
    hold a flock against the night and the wolves the high country still
    remembers. Inside it is empty now but well used, the ground churned and
    rich; in the lee of the wall a shepherd has stowed gear out of the
    weather — a coil of rope, a battered tar-pot for marking fleeces, and a
    crook leaned in the corner. Whoever keeps it is nearby, and means to
    come back.
  whitethorn: >
    A solitary hawthorn bent permanently downhill by the valley
    wind, its bark polished glassy-smooth at sheep height where ten
    thousand flanks have scratched an itch against it. Tufts of greasy wool
    snag in the lower thorns, pale as the flowers it carried in spring.
  pasture: >
    Sweet short turf running down the western slope, cropped to a
    lawn by the flocks and starred with the yellow of tormentil. From up
    here the sheep look like scattered chalk; their bells carry better than
    they do, a sound that means someone, somewhere below, is watching them.
idlemessages:
- A scatter of sheep-bells swells as the flock shifts, then settles back to
  its lazy clonking.
- A buzzard wheels high over the pasture, tilts, and slides off down the
  valley on the heat.
