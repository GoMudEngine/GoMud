roomid: 6053
zone: South Road
title: The Dryside Farmstead
description: >
  A dog barks itself hoarse somewhere behind the buildings, the frantic
  note of a place on edge. The road passes close by a small farmstead on
  the dry eastern side — a low mud-brick house, a leaning barn, a yard of
  beaten earth — and everything about it speaks of a holding fighting to
  stay alive on water it no longer gets. Wilted bean-rows sag in the kitchen
  garden; a row of stoppered pots stands ready by the well to ration what
  little is drawn. Running past the house and on into the parched fields
  beyond is the farmstead's <ansi fg="itemname">dried channel</ansi>, cut
  off and silted to a hard grey scar. A weary <ansi fg="itemname">farmwife
  </ansi> watches from the doorway as you pass, and a <ansi fg="itemname">
  cracked cistern</ansi> stands empty in the yard.
biome: land
