nouns:
  side path: >
    A narrow track threading north among the
    frost-split boulders below the ridge — not made
    by design but by repeated use, the stone worn
    faint with the passage of feet over a long
    period. It leads toward the low overhang visible
    to the north, where the rock cuts back far enough
    to offer some protection from the weather. The
    path is not wide. It is not marked. It goes where
    it goes and ends at the overhang.
  rock overhang: >
    A low shelf of old stone projecting from the
    north face of the ridge, far enough back from
    the open pass to break the wind. The ground
    underneath is dry where the surrounding stone is
    damp, and there is ash there — deep and old, but
    the fire that made it is not out. A thin thread of
    smoke still lifts from beneath the shelf, and the
    ground is worn smooth by long use. Someone lives up
    the short scramble to the north, and has for a long
    time.
idlemessages:
- The wind runs through the gap steady and loud,
  absorbing everything smaller than itself.
- The side path to the north is faint but worn —
  more feet than you can easily count have used it.
- A gust hits the gap harder than the baseline wind
  and passes through in a note too low to hear
  cleanly.
- The eastern plateau opens from here, the way onto
  it plain enough in the flat light.
- The overhang to the north is the only shelter
  visible from the gap in any direction.
