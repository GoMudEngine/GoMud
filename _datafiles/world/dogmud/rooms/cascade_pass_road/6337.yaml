roomid: 6337
zone: Cascade Pass Road
title: The Wind-Gap
description: >
  The pass cuts through at its narrowest here — a
  gap in the mountain spine where the terrain funnels
  the wind into something continuous and loud. It
  does not gust here. It runs. The sound of it is
  constant and absorbs smaller sounds entirely.

  There is no shelter at the gap itself. A faint
  <ansi fg="itemname">side path</ansi> runs north
  among frost-split boulders toward the shape of a
  <ansi fg="itemname">rock overhang</ansi> set back
  from the main pass — the kind of place a traveller
  caught by weather would be glad of. The main way
  continues east, where the ground opens onto the
  grey plateau beyond the pass.

  The wind does not stop for the gap. It treats it
  as what it is — a hole in the mountain that belongs
  to the wind.
