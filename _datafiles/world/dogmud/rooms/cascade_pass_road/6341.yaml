roomid: 6341
zone: Cascade Pass Road
title: The Plateau Edge
description: >
  The pass gives out here. The ground stops climbing
  and the view opens without warning — grey highland
  running east past the limit of sight, flat-topped
  ridgelines beyond that, and beyond those, more of
  the same. The
  <ansi fg="itemname">eastern reach</ansi>
  is vast in a way that is difficult to hold in the
  eye at once. The scale is wrong — too large, too
  open, too still. The sky presses down on it without
  feature. Wind comes off the plateau from somewhere
  further east, steady and cold, without the variable
  gusts of the pass below. It does not carry anything
  recognizable. The
  <ansi fg="itemname">road</ansi>
  ends where the pass does — the last cut stone buried
  under highland drift a few paces back. East of here
  is not road. East of here is ground.
biome: mountains
