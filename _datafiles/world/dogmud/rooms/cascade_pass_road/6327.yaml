roomid: 6327
zone: Cascade Pass Road
title: The Lumber Camp
description: >
  The clearing is a working camp — rough and functional,
  organized the way men organize a place they expect to
  spend weeks in, not live in. Sawpits are cut into the
  level ground, the soil piled back from the edges. To one
  side, cut timber stands in ranked rows to season — all of
  it carried in from the western slope. A lean-to has been
  built against a standing tree at the clearing's north
  edge, and at its foot a
  <ansi fg="itemname">cook-fire</ansi> is banked and smoking
  over old coals. The <ansi fg="itemname">woodcutter</ansi>
  works at the nearest <ansi fg="itemname">sawpit</ansi>,
  pulling a frame-saw through a squared trunk with the
  movement of a man who has been at it since first light.
  The <ansi fg="itemname">foreman</ansi> stands at the
  timber-stack with a piece of chalk, marking board-faces
  in a shorthand of his own. The eastern slope is visible
  from here through the trees — good timber, close. No
  trail leads into it from this camp.
biome: forest
