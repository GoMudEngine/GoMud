roomid: 6332
zone: Cascade Pass Road
title: The Foot of the Climb
description: >
  The trees thin here — not gradually but with an
  abruptness, as if the forest has an edge it will not
  cross. Ahead the <ansi fg="itemname">treeline</ansi>
  is visible, a ragged boundary where the great trunks
  give out and the sky reappears, wide and grey. Below
  the treeline the soil begins to fail —
  <ansi fg="itemname">bare rock</ansi> pushes up in
  sheets and ridges, pale stone breaking the roothold
  the trees need. The road ends here without
  announcement, its last stones buried under a slide of
  scree and thin soil. Beyond it a faint line continues
  upward — not a path, exactly, but the remembered shape
  of one — steep enough to need both hands in places.
  Wind comes off the heights carrying cold stone and
  altitude. The forest is below. The climb is ahead.
  There is nothing in between.
