nouns:
  treeline: >
    The boundary where the timber gives out is ragged and
    irregular — individual trees standing ahead of the
    main canopy line, then gaps, then nothing but low
    scrub and bare rock above. From here the transition
    looks sudden, dense green below and grey-brown above
    with only a narrow band of struggling growth between
    them. The air coming down from above the treeline is
    noticeably colder and tastes of altitude and
    rain-washed stone.
  bare rock: >
    Old pale stone, fine-grained, weathering to a chalky
    surface. It has pushed up through the soil in long
    ridges and flat sheets — the kind of exposure that
    happens when thin mountain earth simply washes away
    over centuries. The surface is mostly clean, a little
    lichen on the north-facing edges, the cracks filled
    with wind-blown grit and almost no plant life. The
    rock is solid underfoot where you test it. Cold, and
    very old, and indifferent to the distinction.
idlemessages:
- Wind comes off the heights in a long cold pulse, moves
  through the scrub at the treeline, and passes.
- Somewhere above, a stone shifts loose and falls. The
  sound is small and clear and then gone.
- The sky above the treeline is flat grey, giving
  nothing away about what the weather is doing up there.
- The last trees creak once in the wind from above
  and are still.
- Looking back, the deep timber is already dark. Looking
  forward, the bare rock holds what light there is and
  gives back less.
