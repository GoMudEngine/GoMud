nouns:
  old trunks: >
    These are not the largest trees in the world but they
    are old enough that the distinction barely matters.
    The bark is channelled deep, the ridges rounded by
    weathering, the wood beneath as hard as stone where
    you press a thumb to it. Lichen has built up on the
    north-facing sides in thick pale layers, each layer
    representing years of slow growth undisturbed by
    brush or tool. The roots spread over the surface in
    great arcing plates, high enough to step over.
    Nothing has scratched or carved these trunks. There
    is no sign that anyone has stood here before.
  forest floor: >
    Deep leaf-litter piled between the root-plates in
    an even, undisturbed layer — years of it, probably
    decades. The topmost leaves are still whole and
    unbroken, which means nothing walks here to grind
    them underfoot. No animal burrows. No insect sign.
    No dropped feathers, no worn hollow where a deer has
    lain. The ground under the litter is black and rich
    and has not been disturbed in a very long time. The
    forest floor would tell you something lived here, if
    anything did. It is silent on the subject.
idlemessages:
- Somewhere in the upper canopy a bird calls once —
  a single note, cut short — and does not call again.
- The silence is complete enough that your own breathing
  sounds too loud, and then even that fades.
- A leaf detaches from far overhead and falls in a slow
  spiral to the litter below, landing without a sound.
- Something distant begins a sound and stops it, as if
  reconsidering.
- The highest branches shift once — slow, without
  noise — and are still.
