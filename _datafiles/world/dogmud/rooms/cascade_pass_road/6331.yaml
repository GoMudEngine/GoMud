roomid: 6331
zone: Cascade Pass Road
title: Under the Old Trees
description: >
  The timber here is the oldest you have walked under —
  the <ansi fg="itemname">old trunks</ansi> stand like
  columns in a hall without walls, their bark furrowed
  deep and pale where it has scaled away over centuries,
  the canopy so high and dense that the sky is entirely
  gone. The light is green and faint and sourceless. The
  <ansi fg="itemname">forest floor</ansi> between the
  roots is covered in leaf-litter undisturbed by wind or
  animal passage — a deep unbroken layer, the topmost
  leaves still holding their shape. No birds. No insects.
  The silence here is not the silence of an empty place.
  It is the silence of a place that has decided not to be
  inhabited, and the decision has held for a very long
  time.
