roomid: 6323
zone: Cascade Pass Road
title: The Hedge-Gap Trail
description: >
  The hedge-gap here is old — the thorn-cut pressed back on
  both sides and healed over along new lines, the passage
  wide enough for something large to pass without turning.
  A <ansi fg="itemname">farm-gate</ansi> hangs on its post
  but is never latched — the latch-hasp worn bright from
  handling, the habit of closing long gone. The
  <ansi fg="itemname">trail</ansi> that comes through it
  runs east and does not look like a farm track — no wagon
  ruts, no churned verge where teams back and turn. What has
  worn it is repetition — a path made by something that
  crosses here at the same angle, every time. The fields
  fall away behind and the grain-smell thins. At the far
  end of the gap, where the verge-grass gives out, there
  are <ansi fg="itemname">prints</ansi> in the soft earth —
  wide-spaced, the stride longer than a man's, the weight
  heavy at the fore.
