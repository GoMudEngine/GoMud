nouns:
  farm gate: >
    The gate hangs on good ironwork — well-made, the post
    set deep and true — but the latch-hasp has not been
    seated in a long time. The striker plate is worn bright
    on its inner face. The latch bar is not. Someone, or
    something, passes through this gate often enough to
    keep the hardware bright but does not latch it behind.
  trail: >
    No wagon ruts. No churned mud where a team backs and
    turns. The trail is worn by something that moves east on
    foot each time — the grass pressed down on both sides
    of a central line, the verge earth packed at the
    crossing. Farm tracks are busy and irregular. This one
    is deliberate, and entirely the wrong shape for farm
    traffic.
  prints: >
    Wide-spaced in the soft earth at the gap's eastern
    margin, where the verge-grass gives out and the clay
    holds a print. The stride is longer than a man's by
    a clear measure, the fore-print heavier than the heel —
    something large, moving at a walk, pointing east. The
    most recent are not fresh, but they are not old either.
idlemessages:
- From the vale behind, a farm bell carries easily on the
  open air — and then the gap swallows the sound.
- A crow lights on the hedge-top above the gate, watches
  east for a moment, and lifts off without cause.
- The grass on the vale side of the gap is thick and green.
  On the east side it grows sparse, pressed flat through
  the crossing.
- Wind moves across the open fields and reaches the gap
  with less force than it should — the hedge-wall blocks
  it, and the trail ahead is still.
- There is no bird noise from the eastern scrub. The hedge
  beside you is busy with movement. Ahead it is not.
