roomid: 6334
zone: Cascade Pass Road
title: The Exposed Switchback
description: >
  The path narrows to a ledge of bare rock, the
  mountain face rising close on one side and falling
  away sharply on the other. The drop is long and
  the bottom of it is not visible from where you
  stand. The <ansi fg="itemname">handholds</ansi>
  cut into the rock face are worn smooth and shallow
  — not by recent use, but by something older. The
  stone where hands have gone is polished to a
  different colour than the weathered rock to either
  side. This path was used before the farms were
  fields, before anyone thought to call it a road.

  Above, a <ansi fg="itemname">raptor</ansi> turns
  slow circles on a thermal, very high, dark against
  the flat sky. It has been there as long as you
  have been climbing. It has not descended and shows
  no sign of doing so. The wind here has an edge.
biome: cliffs
