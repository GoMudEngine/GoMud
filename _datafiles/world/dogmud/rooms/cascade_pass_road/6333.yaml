nouns:
  bent pines: >
    Small, gnarled trees, their trunks leaning under
    decades of unbroken wind. The branches grow long
    and ragged to leeward and are stripped almost bare
    on the windward face. The bark is tight and pale,
    the needles a dark grey-green. The trees look like
    arguments the wind has been winning for a very
    long time. They end here. Nothing grows above them
    on the bare rock.
  settled valley: >
    From this height the valley below is compressed to
    something complete and composed — greens of field
    and pasture, the darker mass of managed timber,
    pale roads running between them. Smoke from
    distant hearths rises thin and straight where there
    is no wind to push it. The light on it is softer
    than the light up here. It is already smaller than
    it was an hour ago, and it will be smaller still.
idlemessages:
- The wind arrives off the bare rock above in long
  cold pulses, carrying nothing but altitude.
- Looking back down through the last trees, the valley
  is a green distance, quiet and already small.
- The bent pines creak once together and go still.
  Nothing above them moves.
- The air up here is thinner. The body notices it
  before the mind catches up.
- A pebble comes loose somewhere above, clatters twice
  on bare rock, and stops.
