nouns:
  erosion gullies: >
    Narrow channels cut into the route where rain has
    stripped the thin soil and exposed the rock
    beneath. The sides are not vertical — they slope
    outward under the scrub at the edges, so the drop
    begins further back than the visible rim suggests.
    Some crossings are straightforward. Others require
    care about where the weight goes and how fast.
  scored boulder: >
    A large block of grey mountain stone, too heavy
    to have moved recently but not seated in a way
    that suggests it has always been where it is.
    The face turned toward the route is marked — long
    parallel gouges, each the width of a spread hand,
    running at a downward angle from upper left to
    lower right. The cuts are irregular in spacing
    but consistent in depth. The stone is hard. What
    made those marks was harder, and pressed.
idlemessages:
- A loose stone shifts underfoot and settles at a
  different angle. The ground here does not hold
  its shape.
- The wind moves through the scrub without sound.
  In the silence after it passes, nothing moves on
  the exposed rock.
- The scored boulder sits in the open with its
  marked face turned toward the route. Not hidden.
- The scrub at the gully lips is pressed down in
  places — not by weather, by weight, repeatedly
  applied to the same spots.
- The cold coming off the exposed stone here is
  different from the wind's cold. It rises from
  below, from the rock itself.
