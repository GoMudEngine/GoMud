roomid: 6340
zone: Cascade Pass Road
title: The Broken Ground
description: >
  The highland scrub takes hold in the gaps between
  rock — low, dry, clinging where there is enough
  soil and giving up where there is not. The ground
  looks more solid from a distance than it proves
  underfoot, and the route is crossed by
  <ansi fg="itemname">erosion gullies</ansi>
  where thin soil has washed away and the exposed
  rock below gives no reliable edge. To one side a
  large
  <ansi fg="itemname">scored boulder</ansi>
  sits in the open — its face marked by long parallel
  gouges, each the width of a hand, running at a
  slight downward angle. At the boulder's base, wedged
  into a crack in the stone, the remains of something
  have been cached — pressed flat, covered with smaller
  stones, undisturbed. The country here requires
  attention.
biome: mountains
