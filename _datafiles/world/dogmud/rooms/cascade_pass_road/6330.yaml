roomid: 6330
zone: Cascade Pass Road
title: The Reclaimed Road
description: >
  The forest is taking the road back. The old
  <ansi fg="itemname">paving stones</ansi> are still
  visible between the tree-roots — pale grey, squared
  and laid by someone who expected this road to matter —
  but root-pressure has buckled them across their full
  width, heaving some vertical and sinking others below
  the surface until the roadbed is more rubble than
  pavement. Moss covers most of what remains. Ahead a
  <ansi fg="itemname">game trail</ansi> crosses the old
  road at a right angle — fresh, well-used, hoof-prints
  clear in the soft ground on both sides. The trail comes
  out of the western forest without hesitation. On the
  eastern side it bends sharply north within a few paces
  of the road's edge, curving away from the slope ahead.
  The deer that made it came this far east and no further.
