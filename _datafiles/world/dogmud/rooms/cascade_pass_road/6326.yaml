roomid: 6326
zone: Cascade Pass Road
title: The Lumber-Camp Track
description: >
  The path arrives at a junction, and the two branches that
  open from it are not equal. The
  <ansi fg="itemname">camp track</ansi> runs south — churned
  by boots and hooves and timber-cart wheels, the
  verge-brush beaten back by constant use, the ruts deep
  from heavy loads hauled uphill to the road. From below
  comes the irregular thud of axes and the creak of a weight
  shifting in the trees. The
  <ansi fg="itemname">eastern road</ansi> continues ahead —
  narrower, the centre-grass partly recovered, the surface
  less-traveled but not accidental. It does not look like a
  game trail. Someone made it and someone still uses it,
  though not often.
