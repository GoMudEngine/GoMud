roomid: 6324
zone: Cascade Pass Road
title: The Forest Edge
description: >
  The <ansi fg="itemname">treeline</ansi> begins here with
  an abruptness that field-country never has. The open sky
  closes off within a few paces — the
  <ansi fg="itemname">canopy</ansi> is old and high and
  dense, the light beneath it different in kind, not merely
  in degree. The <ansi fg="itemname">old trees</ansi>
  flanking the road have not been young second-growth in
  living memory — the trunks too wide for a man to span,
  the bark furrowed deep and grey-black, roots lifting the
  road-edge in slow lobes. Behind you the sounds of the
  vale cut off as cleanly as a door closing. The road
  continues east into the shade. Nothing moves in the
  canopy. There are no birds.
biome: forest
