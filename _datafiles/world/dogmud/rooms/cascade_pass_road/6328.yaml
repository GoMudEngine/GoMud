roomid: 6328
zone: Cascade Pass Road
title: The Deep Timber
description: >
  The last axe-mark is somewhere behind you. The trees
  here have never been worked — old-growth trunks too
  broad to reach around, the canopy fused overhead into
  a vault that dims the light to a sourceless green. No
  wheel-ruts in the road. No verge-cuts. The bare earth
  between the root-buttresses underfoot is the only
  evidence of prior passage, and even that looks old.
  Against one of the great trees a set of
  <ansi fg="itemname">claw marks</ansi> rake the bark
  from above head-height to the base of the trunk —
  four parallel gouges, the exposed wood still pale and
  not yet hardened. Nearby a
  <ansi fg="itemname">picked-clean bone</ansi> rests in
  the leaf-litter, its joints cracked open and emptied.
  Whatever ate here was in no hurry to leave. The forest
  around it is quiet in the way that has nothing to do
  with peace.
