nouns:
  claw marks: >
    Four parallel gouges score the bark from well above
    your reach to the root-flare at the base of the
    trunk. Each gouge is as wide as a finger, cut clean
    through the bark into the pale wood beneath. The
    edges are not torn but drawn — something braced
    against the trunk and dragged downward with real
    force. The exposed wood has not yet greyed. The moss
    around the base of the tree is disturbed in a wide
    arc, pressed flat in places, as if something large
    circled the trunk before or after.
  picked-clean bone: >
    A large leg-bone, probably deer, stripped of every
    scrap of hide and tissue. The joint-ends have been
    cracked open — not shattered but split with
    something that understood the geometry — and the
    marrow cavities are empty and clean. The bone is
    not old. The exposed surfaces are still pale, barely
    weathered. It was dropped here, in this spot, and
    nothing moved it afterward. The leaf-litter around
    it carries the faint sweet-rank smell of recent
    feeding.
idlemessages:
- The canopy overhead is absolutely still. No wind
  reaches the ground here.
- Something moves through the undergrowth at the far
  edge of sight — a slow rustle, unhurried — and stops
  before it resolves into a shape.
- A branch pops deep in the timber to the east. Nothing
  follows it.
- The leaf-litter where you are standing does not shift.
  Even your breathing seems briefly too loud.
- The light filtering through the canopy is even and
  green and absent of movement.
