title: The Ruined Waypoint
description: >
  A travellers' shelter once stood here — you can read
  its shape in what remains. The
  <ansi fg="itemname">collapsed roof</ansi> has fallen
  inward, the timber rafters rotted through at the eaves
  and lying now in a moss-covered tangle across the
  floor. Against the back wall a
  <ansi fg="itemname">cold hearth</ansi> survives mostly
  intact, its fieldstone courses still mortared, the
  firebox choked with years of old bird-nesting and bark
  fall. Beside the entrance a
  <ansi fg="itemname">name board</ansi> leans against the
  stonework — the kind once posted at road stations to
  list the settlements ahead with their distances. The
  western entries are still legible under fading paint.
  The eastern entries have been gouged out — not worn,
  not faded, but worked over deliberately with something
  sharp until the wood below the paint is nothing but
  raw, unreadable grooves. East of the shelter the road
  narrows to a thread and the forest closes in on both
  sides.
