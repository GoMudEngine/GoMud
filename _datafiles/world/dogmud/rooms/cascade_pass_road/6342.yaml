nouns:
  highland: >
    Grey and immense, the reach continues east from
    the threshold without interruption. The scrub is
    low and the stone is exposed in long flat outcrops
    between patches of grit and thin soil. There is
    no path — only open ground that becomes other
    open ground. At a certain distance the detail
    resolves into texture and the texture into a
    single uniform grey, and at that point it becomes
    impossible to judge how far it goes. Far enough
    that the question stops feeling useful.
  eastern ground: >
    The ground at the threshold edge is undistinguished —
    the same mountain rock as behind you, the same
    scrub, the same grey grit in the cracks. There
    is no wall, no barrier, no visible reason the
    passage east should be what it is. And yet
    standing here and looking at it, the body does
    not volunteer to go. Something about the scale,
    or the silence, or the quality of the air. The
    mind catches up eventually. By then you are
    usually already looking west.
idlemessages:
- The wind off the eastern reach arrives without
  warning and passes without diminishing.
- Nothing moves out there. The highland holds
  whatever it holds at a distance the eye cannot
  close.
- The cold at this edge is constant and sourceless.
  It does not vary. It does not let up. It is
  simply present.
- Standing at the threshold, the sounds of the pass
  behind you feel very distant. They are not distant.
  This is the wrong kind of quiet.
- The eastern ground catches light in a way that
  makes distance hard to read. What looks close
  is not close.
