nouns:
  sawn stumps: >
    Cut flat at knee height, the exposed heartwood pale
    and still faintly sticky with pitch. The work is clean
    — a good saw, level cuts, the grain exposed without
    tearing. Recent enough that the heartwood has not
    silvered yet. Some are still bleeding a thin line of
    pitch at the cut. The cutters have taken everything
    workable on the western slope and left nothing they
    could use.
  drag marks: >
    Long parallel gouges in the softened earth at the
    roadside, where timber was hauled downhill and west
    toward the camp. The marks are fresh enough to hold
    their shape — the soil lifted in ridges at the sides,
    the base compressed to a smooth track. The drag-lines
    all run west. None of them run east.
  eastern trees: >
    The trees on the eastern side of the road are visibly
    larger than what the cutters have taken on the west —
    the trunks broader, the bark more deeply channelled,
    the wood heavier and darker at the exposed root-collar.
    They have not been marked for cutting, not blazed,
    not ringed. There is no indication of why.
idlemessages:
- A wood-chip lies pale-side-up in the verge grass, still
  fresh enough to smell of pitch when you pass it.
- The drag-marks in the earth all run downhill and west.
  Nothing on the eastern side of the road has been moved.
- A branch somewhere above and to the west cracks under
  its own weight and settles. The eastern side of the road
  is still.
- The road surface is firmer underfoot here — the slope
  is drawing the loose earth together, pressing it down
  by the gradient.
- The cutters have worked methodically on the west verge,
  back to where the grade flattens. The east side they
  have not touched.
