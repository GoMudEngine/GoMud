roomid: 6325
zone: Cascade Pass Road
title: The Climbing Road
description: >
  The road narrows as it climbs, the verge-grass giving way
  to bare earth on both sides. To the west the cutters have
  been busy — <ansi fg="itemname">sawn stumps</ansi> cut
  flat and clean at knee height, bark-shreds scattered
  across the ground, and long
  <ansi fg="itemname">drag-marks</ansi> in the softened
  earth where heavy timber was hauled back down the slope.
  The taking has been recent and methodical. But the eastern
  side of the road is untouched. The
  <ansi fg="itemname">eastern trees</ansi> there are larger
  than anything the cutters have taken — the bark darker,
  the trunks heavier, the crowns closing over the road and
  reaching no further east. The wood is better. No one has
  laid an axe to it.
