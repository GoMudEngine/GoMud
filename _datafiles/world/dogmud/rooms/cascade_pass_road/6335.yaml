roomid: 6335
zone: Cascade Pass Road
title: The High Shoulder
description: >
  The climb ends here. The ground levels on a broad
  shoulder of exposed rock and the pass opens in both
  directions at once.

  Behind and below, the way you came —
  <ansi fg="itemname">settled country</ansi> spread
  out in its greens, the fields and forest small and
  warm under a sky that looked softer when you were
  in it. Distance makes it orderly. You can see the
  farms and the roads and the smokes of habitation,
  and none of it reaches this height. It is already
  somewhere else.

  Ahead, to the east, the
  <ansi fg="itemname">grey highland</ansi> runs
  broken and flat toward a hard horizon. The colour
  is gone from it — ash and slate and pale stone,
  the shapes on it too far to read clearly. The
  ground out there has a character the body notices
  before the mind names it. Old. The word arrives
  without a source.
