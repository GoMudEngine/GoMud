title: The Crumbling Watchtower
description: >
  A <ansi fg="itemname">watchtower</ansi> stands
  here — or the remains of one. The far wall has
  fallen outward in a low spread of
  <ansi fg="itemname">drystone</ansi>, the courses
  long since separated and scattered, the individual
  stones sitting where they landed and having been
  there long enough to have lichen on them now. What
  remains upright is half a cylinder of old masonry,
  enough to enclose a space barely wide enough to
  stand in.

  The one intact feature is a narrow
  <ansi fg="itemname">window</ansi> in the east wall
  — a single vertical slot cut clean through the
  stone, facing east. Not toward the road behind you,
  not toward the settled country below — east, onto
  the grey highland ahead. The slot is deliberate and
  precise, the stonework around it better-finished
  than the rest, as though whoever built this knew
  exactly what they were watching and wanted nothing
  to interrupt that line of sight.

  No one remembers who built it. No one remembers
  when.
