nouns:
  watchtower: >
    Old drystone construction, circular, now largely
    collapsed. The standing section is roughly half
    the original circuit, the fallen section spread
    in a low arc to the west — stones displaced
    outward, settled long enough to have lichen thick
    on their north-facing surfaces. The masonry is
    functional but careful — no mortar, the courses
    fitted close enough to have stood for an immense
    span of time before the fall. No carving, no
    symbol, no inscription on any surviving face.
    The tower predates any record of this road.
  drystone: >
    The collapsed section has spread its stones
    outward in a low arc, each course now separate
    — the top courses farthest out, the bottom
    courses still roughly in place. The stones are
    pale and fine-grained, the same rock as the
    surrounding mountain, quarried close and fitted
    without mortar. They have been lying here long
    enough that lichen has established itself on
    every north-facing surface. The fall was not
    recent.
  window: >
    A narrow vertical slot cut through the east wall
    — a single opening, precise and deliberate, the
    edges well-finished where the surrounding
    stonework is rougher. Standing at it you look
    directly east across the grey highland, the
    broken plateau running to the hard horizon. The
    slot gives no view to the west, none to the
    north or south — only east. Whoever chose this
    orientation chose it with intention. What they
    were watching for, from this height, looking east
    — that question has no answer anyone living can
    supply.
idlemessages:
- The wind finds the narrow window and passes through
  it in a low sound that does not quite become a note.
- The collapsed stones of the fallen wall have lichen
  thick on them. They have been lying here a long
  time.
- The window faces east. It has always faced east.
  The settled country behind is not visible through
  it.
- A stone in the fallen section shifts slightly —
  frost working at it, or the wind, or nothing at all.
- From inside the standing section, looking through
  the window, only the grey highland ahead is visible.
