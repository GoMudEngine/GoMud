roomid: 6358
zone: Eastern Highlands
title: The Impossible Length
description: >
  You have walked a long way with the
  <ansi fg="itemname">surface</ansi>
  at your side, and it has not ended. That is the fact the
  mind keeps arriving at and keeps refusing. Somewhere behind
  you it ran on grey and seamless and buried in the rock, and
  it runs on ahead the same, and it does not stop, and the
  refusal itself is the dread — because a thing this long
  cannot be, and it is. The scale will not resolve into
  anything the eye is built to hold. There is no grain in it,
  no joint, no place where one part was set against another.
  Only the one continuous
  <ansi fg="itemname">flank</ansi>
  sunk into the highland, immense past the point where immense
  means anything, ancient the way the rock is ancient except
  that the rock was never made and this was. The mind offers
  words for it and takes them all back. Nothing this world
  knows how to make is this long.
