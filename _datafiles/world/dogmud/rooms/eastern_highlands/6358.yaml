nouns:
  surface:
    >
    Smooth and grey and without feature, the surface holds the
    same everywhere the eye lands on it — no seam, no joint, no
    place where the making shows itself as a making. It could
    be a single unbroken piece and probably is, though the mind
    balks at the size that would require. Running a hand near it
    the air feels different, cooler and stiller, as though the
    surface keeps its own weather. It has been buried here long
    enough to become part of the country. It has not become
    part of the country.
  flank:
    >
    The buried flank runs north and south from where you stand
    and gives no sign of ending in either direction. Following
    it with the eye toward the north, it diminishes and does not
    stop. Following it south, the same. The length refuses to
    be measured. At a certain distance the mind quietly declines
    to keep counting and the eye lets the whole of it blur into
    one grey line that has no end that anyone here could walk to.
idlemessages:
- The surface runs on north and it runs on south. Neither
  direction offers an end. The mind keeps reaching for one
  anyway.
- Something in the length of it presses on the chest. Not the
  cold. The fact of it. A made thing does not go on this far.
- The eye tries to take the surface as a cliff face and fails.
  Cliffs have grain. This has none.
- You have walked a long way. The surface has not changed. It
  will not, ahead or behind. The knowledge sits wrong.
- The wind comes down the length of it and carries no sound
  back, as if there were nothing along all that distance to
  make one.
