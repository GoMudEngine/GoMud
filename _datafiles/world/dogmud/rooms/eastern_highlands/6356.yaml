roomid: 6356
zone: Eastern Highlands
title: The Curve
description: >
  The
  <ansi fg="itemname">surface</ansi>
  bends away to the south and keeps bending, and in the bending
  the mind is finally made to do the thing it has been refusing.
  It grasps the
  <ansi fg="itemname">scale</ansi>.
  Not a boulder shrugged half out of the hillside. Not an outcrop
  worn round. The curve is too shallow, too even, too patient — it
  is the curve of something so large that this near stretch reads
  as very nearly straight, and to see it bend at all you have to
  accept how far off the far side of that bend must lie. It goes
  on. It goes on under the soil to the south past any point the
  eye can carry it, and the not-seeing of the end is not a matter
  of distance but of amount — there is simply that much of it,
  more than the country was shaped to hold. To keep with the grey
  you must turn south now and take the
  <ansi fg="itemname">bend</ansi>,
  keeping the surface off your left hand, and the walking will
  not shorten what you are walking beside.
biome: cliffs
