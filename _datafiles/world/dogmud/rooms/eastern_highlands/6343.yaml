roomid: 6343
zone: Eastern Highlands
title: The Edge of the Reach
description: >
  The pass is behind. This is the highland —
  the same grey the threshold promised, but here
  the grey has no edge within sight and the scrub
  extends on every side without interruption or
  reduction. The
  <ansi fg="itemname">highland floor</ansi>
  is scoured to what the weather could not take —
  basalt and grit and thin root-work pressed into
  every crack, the whole surface low and old and
  indifferent to what passes over it. The
  <ansi fg="itemname">sky</ansi>
  is very large and completely empty. Nothing moves
  in it. Nothing moves anywhere the eye reaches.
  The cold from the threshold has not increased
  crossing into this, but it has changed — at the
  threshold it was the cold at the edge of a thing.
  Here it is the interior of that thing, and it
  does not vary in any direction.
biome: mountains
