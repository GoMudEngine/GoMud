roomid: 6364
zone: Eastern Highlands
title: The Approach Hollow
description: >
  The way opens into a worn
  <ansi fg="itemname">hollow</ansi>
  in the banked earth before the buried face, and the wrongness of
  the place is that it is not natural. The ground here has been
  disturbed — dug, shifted, cleared and cleared again — not by water
  and not by the slow hand of weather but by someone, patiently, a
  long time ago. There is a
  <ansi fg="itemname">worked ground</ansi>
  underfoot, packed flat where feet went back and forth, and the
  banks to either side have been cut and thrown up in a way no flood
  leaves. Someone stood here. Someone came back to this spot enough
  times to wear it smooth, and worked at the great grey surface that
  rises jointless out of the highland ahead, and the evidence of that
  working is everywhere and old. The
  <ansi fg="itemname">made thing</ansi>
  itself takes no notice — it is the same as it has been the whole
  way, vast and seamless and buried and unbothered — but the ground
  before it remembers a person, and the way bends south into their
  old ground where the labor was done.
biome: cliffs
coord: {x: 12, y: 55, z: 3}
exits:
