title: The Lightning-Split Cairn
description: >
  A cairn stands on a cleared shelf of stone — fieldstone,
  stacked with care, the kind of fixed marker a methodical
  surveyor builds to anchor a position. Something reached it
  at some point and clove it from cap to base, the stones
  on either side of the split tumbled outward and left where
  they fell. What remains of the
  <ansi fg="itemname">cairn</ansi>
  still stands, divided but not fully collapsed — old enough
  that the
  <ansi fg="itemname">lightning scar</ansi>
  has weathered smooth, the break face darkened to the same
  grey as the surrounding rock. Anyone following written
  directions into this country would recognise this landmark.
  Whoever wrote those directions did not come back.
