nouns:
  survey marker: >
    A standing column of dressed stone, set here
    to mark the boundary of a survey territory that
    extended east into country the surveyor did not
    return from. The lettering is still readable in
    the right light — distances and bearings, a
    naming of features in country that has since
    shed those names entirely. The column has stood
    here long enough that the ground has settled
    around its base and lichen covers the rough
    sides completely.
  nested rings: >
    Concentric rings cut into the flat face of the
    stone, under the survey lettering and older than
    it. The lines are clean and the spacing is
    deliberate — this was not decoration done quickly
    or casually. The stone was prepared flat to
    receive something, and these rings are what it
    received. There is no inscription alongside them,
    no label, no indication of what they mark or
    where the hand that cut them came from. The
    surveyor cut the territory notation directly over
    them rather than choosing a different face.
idlemessages:
- The wind crosses the marker and continues east.
  The column does not move. Nothing out here moves.
- The rings catch low light differently from the rest
  of the flat face — the cut lines hold shadow where
  the worn survey notation does not.
- The highland beyond the marker runs east without
  feature. The surveyor went that direction. The
  ground gives no account of what followed.
- The column stands where it can be seen from some
  distance to the west. It was set where it would
  be seen. Whatever that was meant to communicate,
  the highland has kept to itself.
