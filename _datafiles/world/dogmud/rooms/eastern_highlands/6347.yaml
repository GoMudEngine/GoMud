roomid: 6347
zone: Eastern Highlands
title: Reth's First Marker
description: >
  A column of dressed stone stands on a low rise —
  worked flat on one face, the other sides rough
  from the original quarry cut. The
  <ansi fg="itemname">survey marker</ansi>
  is old enough that the notation the surveyor cut
  into the flat face has worn to shadow, legible
  at low angles and barely at others. What remains
  reads as distances and bearings — a territory
  claimed in numbers, the furthest reach of
  someone who did not apparently come back from it.
  Under the survey notation, cut earlier and
  deeper and still present where the notation has
  nearly worn away, there are
  <ansi fg="itemname">nested rings</ansi>
  worked into the stone — concentric, the spacing
  even, the lines clean enough that the tool and
  the hand behind it both knew what they were doing.
  The stone was dressed flat to receive the survey
  marks over whatever these are. The surveyor saw
  them and worked around them rather than through.
biome: mountains
