roomid: 6355
zone: Eastern Highlands
title: Along the Flank
description: >
  The
  <ansi fg="itemname">surface</ansi>
  runs on. It goes under the soil to your left and rises out of it
  again ahead, the same seamless grey, curving so faintly that at
  a glance it looks flat and only the following of it with the eye
  gives away the bend. You are walking along the exposed shoulder
  of a thing that does not stop where the earth resumes — it only
  goes under, and comes up, and goes under. Close to the grey the
  <ansi fg="itemname">air</ansi>
  is wrong in a way the earlier wrongness only warned of. It
  crawls. It stings. It gets into the teeth and sets them on edge,
  gets into the blood and hums there, a menace you feel along the
  arms and in the back of the jaw and cannot point a finger at.
  It is worst where the ground lies barest and the
  <ansi fg="itemname">flank</ansi>
  stands nearest the open air. The body wants distance from it.
  The body is right to want it. And there is no distance to be had
  out here that the surface does not still run under.
biome: cliffs
