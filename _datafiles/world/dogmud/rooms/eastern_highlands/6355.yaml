nouns:
  surface: >
    Followed with the eye, it runs unbroken in both directions —
    into the soil one way and out of it the other, and always the
    same. No seam interrupts it. No joint marks where one part
    might meet another part, because there do not seem to be
    parts. It is one thing, continuing, and the continuing is
    steady and patient and does not care that you are here to
    watch it.
  air: >
    The air within a pace or two of the grey does not feel like
    air. It has a charge in it, a crawling prickle that finds the
    fine hairs on the arms and the wet of the eyes and the roots
    of the teeth. Stand in it and the blood seems to hum a note
    just under hearing. It does you no visible harm in a moment
    and yet everything in the body reads it as harm coming, harm
    that is only waiting on time. Step back and it eases. Step in
    and it returns at once.
  flank: >
    The near shoulder of the surface rises from the swept ground
    at a shallow lean, neither wall nor floor but the long curved
    side of something too large to be either. It is where the
    crawling in the air is strongest. It is also, somehow, the
    place the eye keeps going back to, as if looking might at last
    turn up the seam that would let the mind file the thing away
    and be done. There is no seam. There is only more of the
    flank, leaning on into the soil.
idlemessages:
- The crawling in the air lifts the fine hairs on your arms and
  holds them up, and does not let them down.
- Your teeth ache faintly, a low even ache with no cause you can
  bite down on and find.
- The surface runs on to either side without a mark on it, into
  the ground and out of it, the same every span of the way.
- The blood hums in the ears, one flat note under hearing, and
  stops the moment you step back from the grey.
- The silence over the flank is pressed flat, and into that
  flatness the stinging in the air is the only thing that moves.
