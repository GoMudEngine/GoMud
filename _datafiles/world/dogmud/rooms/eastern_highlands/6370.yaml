roomid: 6370
zone: Eastern Highlands
title: The Disc-Face Approach
description: >
  The ground rises the last short way and the buried face rises with it,
  filling the east — the vast grey flank of the made thing sheer and close
  now, and set into it, still a stone's throw ahead, the shape the whole
  road has been climbing toward. A
  <ansi fg="itemname">door</ansi>.
  You cannot make out its detail yet, only that the face carries something
  deliberate there, a great shut shape with a mark at its heart. But the
  last step east is not free. Strung across the final approach, between you
  and the door, lies a
  <ansi fg="itemname">ward</ansi> —
  the charged air gathered and narrowed here into a single taut line, the
  last defence of the threshold, and this one is not content to press and
  warn. This one would kill. It can be read, if the nerve holds. It can be
  found where it lies and eased apart by a careful hand. But it cannot be
  walked through, and the body knows it, and stops at the edge of it on its
  own.
biome: cliffs
