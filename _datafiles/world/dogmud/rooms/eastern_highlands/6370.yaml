nouns:
  door: >
    From here it is only a shape — a shut, deliberate thing set into the
    grey face ahead, too far yet to read in full. What carries across the
    gap is that it was meant, placed, made to be there, and that at its
    centre sits a mark the eye has met before on Reth's markers. The rest
    waits behind the ward. There is no reading it from here, and no
    reaching it without crossing the taut and lethal air between.
  ward: >
    The charge that filled the field behind you is gathered here into one
    narrow, singing line drawn across the approach — you can find its edges
    if you are still and patient, a seam in the air that hums against the
    teeth. It is not a wall and it is not a lock — nothing to pick, nothing
    to lift, nothing to still. It is the field itself drawn to an edge, and
    it bites at whatever crosses, worst of all here where it guards the
    door. You can cross it. You will feel it do its work as you go.
idlemessages:
- The narrow line of the ward sings faintly across the approach, low and
  steady, and does not falter.
- The door waits in the grey face ahead, shut and deliberate, its one mark
  too far to read and close enough to pull at you.
- The air along the final step stands taut as a drawn wire. Every instinct
  you own agrees on one thing, which is not yet.
- Something in the gathered charge shifts and settles, the way a set trap
  settles, patient, still armed.
