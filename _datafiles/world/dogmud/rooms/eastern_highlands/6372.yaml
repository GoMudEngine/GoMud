roomid: 6372
zone: Eastern Highlands
title: The Disc-Door
description: >
  This is the end of the road. There is no further east. The buried face
  stands sheer across the whole of the way ahead, and set into it, close
  enough now to touch, is a
  <ansi fg="itemname">door</ansi> —
  a great made shape, taller than a standing man and wider than the road,
  shut so perfectly into the grey that the line of its closing is less a
  seam than the memory of one. It does not open. There is no handle on it,
  no hinge the eye can find, no bar to lift and no lock to pick. At its
  centre, waist-high and plain, the smooth face is cut with a shallow
  <ansi fg="itemname">depression</ansi> —
  a round, dished hollow, shaped with the same seamless certainty as
  everything here, and pressed deep into the heart of it is a
  <ansi fg="itemname">symbol</ansi>
  you have seen before, on Reth's markers, all the long way here. The
  hollow is a shape meant to be filled. It is the shape of a disc, and it
  is empty, and it is waiting, and it will go on waiting. You press your
  hands to the door and the door does not care. You put your weight against
  it and there is nothing to push against, only the vast shut patience of a
  made thing that has been shut a very long time and was never going to
  open for hands. It opens for the disc. Only the disc. And at the foot of
  it, tending a small banked fire as though this were any hearth in the
  world, sits a lone
  <ansi fg="itemname">keeper</ansi> —
  who watches you the way the door will not, and who knows, it seems, how
  the thing is done.
biome: cliffs
