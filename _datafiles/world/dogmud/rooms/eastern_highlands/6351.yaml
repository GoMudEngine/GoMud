nouns:
  shelter: >
    The frame was built low — a set of poles lashed at
    the apex, whatever covered them entirely gone. What
    remains is the poles themselves, pale and dry as old
    bone, collapsed onto each other in a heap that no
    longer suggests the shape it once held. The lashings
    rotted long before the wood, it seems; one pole lies
    apart from the others as though it fell separately,
    later. Whoever built this built it to be used for
    some time. He chose a spot where the wind comes from
    the east without stopping. He chose it anyway.
  fire ring: >
    A ring of fist-sized stones, each chosen for flatness
    and set with the care of someone who intends to return
    to it. The interior is scoured clean — no ash, no
    char, no impression of repeated use except in the
    placement of the stones, which have not moved. The
    circle is intact. Someone made a fire here more than
    once and did not take the stones when he left. Whether
    he expected to come back or simply left in haste or
    simply did not make it back, the stones have been
    empty long enough that the distinction no longer
    leaves a trace.
  instruments: >
    There is nothing here that could still be called an
    instrument. On close examination, behind the fallen
    shelter, faint impressions remain in the rock dust
    where something flat-footed stood for a long time
    — the square shadows of where legs met stone. Whatever
    the surveyor used to fix his positions and build his
    record, it is gone. The dust remembers the shape of
    what stood in it. That is all that remains of the
    work he did here.
idlemessages:
- The fire ring holds no heat. It has not held heat for
  a long time.
- The poles of the collapsed shelter are dry as driftwood
  — no moisture, nothing left to decay further.
- The cold here is not the cold of altitude alone. It is
  the cold of a place that has been empty long enough
  that emptiness has become its condition.
- The fire ring is very carefully made. Someone thought
  he would use it again.
- Nothing has nested in the fallen shelter. Nothing has
  used this camp since it was last used.
