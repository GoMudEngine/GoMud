roomid: 6351
zone: Eastern Highlands
title: The Abandoned Survey Camp
description: >
  What is left here was a camp once. The
  <ansi fg="itemname">shelter</ansi>
  is collapsed — a set of lashed poles that has been lying on
  its side long enough to bleach grey and settle into the rock.
  A
  <ansi fg="itemname">fire ring</ansi>
  marks where someone kept a fire: flat stones arranged in a
  careful circle, undisturbed since the last fire burned in
  them, the ash long since taken by the wind. What remains is
  the arrangement — the deliberateness of it, the habit of
  someone who made camp methodically and expected to return.
  Whatever
  <ansi fg="itemname">instruments</ansi>
  he worked with did not survive the weather or were carried
  away. What is left is the shape of occupation without its
  content. He worked here. He does not anymore.
