roomid: 6361
zone: Eastern Highlands
title: The Sunken Course
description: >
  The way follows the made thing as it goes down, and you go
  down with it. Whether the ground is rising to meet the
  <ansi fg="itemname">surface</ansi>
  or the surface is sinking to meet the ground is a question the
  eye cannot settle — both look true and neither feels right.
  Either way the plateau line climbs above you as you walk,
  until you are moving in the
  <ansi fg="itemname">shadow</ansi>
  the buried flank throws, below the level of the open highland,
  close in against the seamless grey. Close, it is worse. Close,
  the smoothness has no scale to it at all, no feature to hang a
  size on, only the cool unbroken face rising past what the neck
  can crane to follow. The walls of rock and the wall of the
  surface pinch the way narrow, and the air comes thick and
  pressing, and every step takes you further under and further
  in. Nothing about it is comfortable. The wrongness is a
  weight here, and it leans.
