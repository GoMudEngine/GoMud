roomid: 6360
zone: Eastern Highlands
title: The First Recess
description: >
  Set into the buried surface here is a
  <ansi fg="itemname">recess</ansi>
  — a hollow shaped into the greyness, smooth-walled and
  deliberate, going in a short way before the light gives out.
  It is not a crack and not a wear-mark. Nothing weathers into
  a shape this exact. Something meant it to be here, in this
  form, for a purpose, and the purpose is closed to you — the
  eye reads the intention plainly and reads nothing of what the
  intention was. That not-knowing has a taste, and it is
  not one the body has a name for. The
  <ansi fg="itemname">air</ansi>
  standing over the hollow is colder than the air a pace back,
  and stiller, and it bites at the skin in a thin steady way
  that feels less like weather than like attention. Something
  about the recess watches. The way on drops away to the south,
  down past the shaped hollow, and the ground that direction
  does not feel like ground that wants you on it.
