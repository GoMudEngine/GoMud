nouns:
  columns: >
    Each column is dark grey basalt, cracked along vertical
    planes into irregular facets. The bases are wide and
    uneven, splaying where the stone came through the substrate.
    No two are the same height. The spacing between them is
    almost regular — almost, but not quite, which is the thing
    the eye caught from a distance and the mind kept misreading.
    Standing among them, they are entirely natural. The
    regularity is the kind of coincidence that happens in
    country where something slow and enormous shaped the rock
    into patterns it was not trying to make. The columns did
    not choose to stand in rows. They simply do.
  highland: >
    The reach continues east and south from the colonnade —
    grey rock, low scrub, the same flat cold light that has
    been present since the pass. The columns are the one
    vertical thing on this part of the ridge. Beyond them
    the ground falls away south toward other, stranger
    country. Nothing moves at any distance the eye can
    account for. The highland does not encourage accounting.
idlemessages:
- The wind passes between the columns in complete silence.
  This is not a sheltered space. There is no reason for
  the silence.
- Light falls on the dark stone at a flat angle — not dim,
  but flat, as though the surface absorbs the direction
  rather than reflecting it.
- A stone loosens somewhere above and strikes twice on its
  way down. The sound arrives sharp and then is entirely
  gone.
- From the right angle, standing still, the rows almost
  align into a passage. Move a few steps and they don't.
