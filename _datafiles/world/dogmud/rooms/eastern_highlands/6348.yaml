roomid: 6348
zone: Eastern Highlands
title: The Basalt Colonnade
description: >
  Columns of dark rock rise from the ridge in rough rows —
  close enough in height and spacing that the eye, approaching,
  arranges them into something deliberate. The mind goes there
  first. Then the bases come into view, each one splayed and
  uneven where the stone fractured up through the earth, and
  the spacing that looked even is not even, and what the mind
  assembled disassembles. The
  <ansi fg="itemname">columns</ansi>
  are what they are — cooled basalt, cracked along planes no
  hand directed, the heights irregular, the gaps between them
  almost but not quite consistent. Standing among them, they
  are entirely natural. Whatever shaped this
  <ansi fg="itemname">highland</ansi>
  also shaped these, by the same geological process along the
  same grain. The regularity is a coincidence. The wind moves
  between them without the change in pitch that wind makes when
  it moves between things, which is not a coincidence.
