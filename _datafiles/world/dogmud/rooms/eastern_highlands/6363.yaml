roomid: 6363
zone: Eastern Highlands
title: Where the Hull Enters the Ground
description: >
  Here is the place the whole approach has been bending toward. The
  <ansi fg="itemname">made thing</ansi>
  makes its last curve — the southeastern turn where the long grey
  flank stops running through the highland and goes down, in, under
  the rock, into the dark below the country. This is where it enters
  the earth. The ground has been heaved up around the
  <ansi fg="itemname">buried face</ansi>
  where it plunges, thrown into ridges and folds the way soil banks
  against a thing driven into it, and the surface itself does not
  care — it goes down smooth and seamless and sure, grey and
  jointless, the same at the lip of the earth as it was a long day's
  walk behind you. There is no mouth here, no opening, no way in that
  the eye can find. Only the vast made curve leaning down and the
  earth closing over the top of it, and the certainty, pressing in
  without a word, that it goes down a great deal further than you can
  follow and was down there long before anything alive came to look.
