nouns:
  made thing: >
    Close up, at the place it goes down, it refuses every test the
    eye has for one thing against another. There is no grain, no
    seam, no joint at the turning — the immense greyness simply
    leans into the earth as though it always meant to. It is not a
    shape the ground can make. It is not a shape the ground can be
    worn into. It was made, and it goes down, and it goes down
    smooth, and that is all it will tell you.
  buried face: >
    The surface where it enters the ground is banked all around with
    heaved earth — ridges and broken folds, soil thrown up the way
    it banks against anything driven deep into it. But the driving
    was not recent. The ridges are old, weathered, grassed over at
    their crowns. Whatever set this here did it long ago, and the
    country has had all the time there is to grow a skin over the
    scar and has not managed to hide it.
  earth: >
    The heaped ground here has been worked once by weather and once,
    higher up nearer the turning, by something with hands — you can
    see it if you look, a section where the banking is cut back
    cleaner than water ever leaves it. But that is off south and
    ahead. Here at the lip there is only the raw fold of the earth
    and the grey going down through it without a sound.
idlemessages:
- The made curve goes down into the earth and the ground closes over
  it, and there is no seam and no mouth and no way the eye can find.
- The heaped soil banks against the buried face the way earth banks
  against anything driven deep. It was driven deep a long time ago.
- Somewhere far below your feet the surface is still going down, grey
  and smooth and sure, and the thought of how far is not a good one.
- The cold coming up out of the disturbed ground is even and constant
  and does not answer to the wind above it.
- The silence at the lip is total, and in it the fact of the thing
  presses down without a single word to soften it.
