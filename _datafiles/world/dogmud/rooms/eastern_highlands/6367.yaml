roomid: 6367
zone: Eastern Highlands
title: The Fork Before the Door
description: >
  Here the way splits, and both ways lead to the made thing, and
  neither is a way back. To the east the buried face opens onto a
  great
  <ansi fg="itemname">disc-marked face</ansi>
  — a broad expanse of the grey set apart from all the rest by a
  vast ringed mark worked into it, the only marking the surface has
  shown in all these leagues, and everything about it says
  threshold, says door, says the way in is that way if there is a way
  in at all. To the south the grey folds down into a
  <ansi fg="itemname">sealed recess</ansi>,
  a deep-set hollow closed over and dark, and out of that dark comes
  the same cold watchfulness as the warded stretch behind you but
  heavier, older, concentrated — something still guards what is down
  there, and has never once stopped. This is the last
  <ansi fg="itemname">choice</ansi>
  before the threshold. East to the great ringed mark and whatever it
  is a door to. South to the sealed dark and the thing that keeps it.
  The made thing waits either way, seamless and vast and buried, and
  it has waited a very long time for someone to stand exactly here and
  have to decide.
