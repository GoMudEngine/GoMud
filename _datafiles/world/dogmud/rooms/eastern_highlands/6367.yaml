nouns:
  disc marked face: >
    East, the grey carries the one mark it has ever shown — a vast
    ring worked into the surface, a great circle set off from
    everything around it, smooth-edged and seamless as the rest yet
    plainly meant, plainly apart. It reads as a threshold the way a
    shut door reads as a door even to someone who has never seen its
    like. That is the way in, if in is a thing that can be done. The
    eye keeps going back to the ring and coming away no wiser and no
    calmer.
  sealed recess: >
    South, the surface folds down and inward into a deep-set hollow
    closed over and black, and the cold that pours out of it is the
    warded cold of the stretch behind you grown heavier and more sure
    of itself. Something is down there, and something keeps it, and
    the keeping has not lapsed in all the dark it has kept in. Every
    part of you that the recesses set on edge is set worse by this. It
    is guarded. It means to stay guarded.
  choice: >
    Two ways, both into the made thing, neither back. East to the
    ringed mark and the threshold it promises. South to the sealed
    dark and the watch that holds it. Standing between them you feel
    the whole long walk narrow to this single point, and you feel,
    too, that the thing has been waiting for exactly this — for
    someone to come this far and stand here and have to choose which
    of its silences to break.
idlemessages:
- East the great ringed mark holds the grey light without a flicker,
  patient as a shut door that has never once been opened.
- Out of the sealed recess to the south the cold comes heavy and
  watchful, and whatever keeps that dark has not stopped keeping it.
- The way splits and both halves lead in, and standing at the fork you
  feel how little of the choosing was ever going to be yours.
- The made thing waits east and waits south, seamless and vast, and
  gives no sign which silence is the worse one to break.
- This is the last place a person can still turn around, and the made
  thing knows it, and waits to see whether you will.
