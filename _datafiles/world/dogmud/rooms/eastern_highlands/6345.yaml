roomid: 6345
zone: Eastern Highlands
title: The Gully Head
description: >
  The ground opens here — an erosion cut running
  south from this point, steep-sided and deeper
  than it first reads from the rim. The
  <ansi fg="itemname">gully</ansi>
  is not large by the standards of gorges, but
  the walls are sheer at the top and the floor
  is shadow and loose material that would shift
  badly under any weight. The smell that comes
  up from it is old and sourced in what water
  left behind when it stopped running — not rot
  exactly, not damp exactly, but the residue of
  both after a long drying. The
  <ansi fg="itemname">gully rim</ansi>
  east holds firmer stone, and the way on runs
  there — along the edge where the ground is more
  continuous and the drop stays visible on one
  side. South descends into the cut. East continues
  along the rim toward country that offers nothing
  better than this.
