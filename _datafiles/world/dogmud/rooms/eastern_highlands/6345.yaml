nouns:
  gully: >
    An erosion cut running south from this point,
    carved by water that no longer runs anywhere
    in these highlands. The walls expose horizontal
    bands of different stone where the erosion worked
    through the surface material into what lies
    beneath — older, darker, denser. The floor is
    shadow and loose scree. The smell from it is old
    and sourced in stone that was wet for a long
    time and has been dry for longer.
  gully rim: >
    A stretch of more continuous rock along the
    gully's eastern edge, where the ground is firm
    enough to walk without testing each step. The
    drop to the gully floor stays visible on the
    south side. The highland continues on the north.
    The rim is not comfortable, but it is passable —
    which is the best the eastern reach has offered.
idlemessages:
- Wind finds the gully from somewhere below and rises
  from it carrying the smell of old stone.
- A loose piece of gully wall drops somewhere in the
  cut below. The sound travels up and then stops.
- The rim here is narrow enough that the gully drop
  stays present at the edge of vision going east.
- The sky above the gully is the same flat grey as
  the highland floor. The cut opens a slot in it
  from below.
- The far wall of the gully is shadow at every hour.
  Whatever the floor holds does not show from the rim.
