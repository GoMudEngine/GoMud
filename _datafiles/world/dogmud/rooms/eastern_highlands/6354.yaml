nouns:
  surface: >
    Close enough to touch, it refuses every test the eye has for
    telling one thing from another thing. There is no near texture
    that resolves into grain. There is no fine crack that becomes,
    on looking, a network of cracks. It is one continuous thing —
    the same at the reach of your arm as it is a long way off,
    grey and even and whole. Nothing in the country you crossed to
    get here is like it. Nothing you have ever set a hand to is
    like it. It is not a shape the ground can make and it is not a
    shape the ground can be worn into, and that leaves only the
    one thing the mind keeps trying not to arrive at.
  light: >
    The light on the surface does not behave. On stone the light
    breaks up — catches on grain, scatters off grit, throws small
    shadows into small hollows. Here it does none of that. It
    lies on the grey in one unbroken sheet and returns even,
    sourceless, as if the surface were lit from no direction and
    every direction at once. Standing before it you cannot tell
    where the light comes from or where it goes. It is simply
    held, and given back, and wrong.
  sheen: >
    The even grey of it has a faint depth, the way a still pool
    has depth, except there is nothing under the surface to give
    it one — no water, no ice, no clouded stone. The look of depth
    with nothing beneath it to be deep. The eye falls into it and
    finds no bottom and no flaw and no edge, and comes back with
    the same report every time, which is that there is nothing
    here it knows how to see.
idlemessages:
- The surface holds the light without a flicker. Nothing moves on
  it because there is nothing on it that can move.
- Your reflection is in the grey, faint and grey-washed and slow,
  and you look away from it before you mean to.
- The eye slides across the sheen looking for one seam to rest on
  and comes back each time with nothing, a little more unsettled
  than before.
- The cold coming off the surface is even and constant and does
  not vary with the wind. It is not weather. It never was.
- The silence here is total, and in the total silence the fact of
  the thing presses in without a single word to soften it.
