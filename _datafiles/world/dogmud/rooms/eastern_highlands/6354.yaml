roomid: 6354
zone: Eastern Highlands
title: The First Surface
description: >
  Here the earth has fallen away — or been shrugged off — and
  something that was under it stands open to the air. A
  <ansi fg="itemname">surface</ansi>.
  It comes up out of the ground smooth, a smoothness the world
  does not offer anywhere you have been, without grain, without
  seam, without the joint or fracture or bedding that every stone
  in every country carries somewhere on its face. It holds the
  <ansi fg="itemname">light</ansi> —
  not the way wet rock holds light and not the way ice does, but
  as though the light belonged to it, an even grey sheen that
  never catches on a flaw because there is no flaw for it to catch
  on. The eye keeps trying to make it stone. It reaches for grain
  and finds none. It reaches for a crack and finds none, and each
  time it fails it fails a little worse, and slides off the
  <ansi fg="itemname">sheen</ansi>
  with nothing to hold. The body understands first, the way it has
  understood things all through this country, and what the body
  understands is simple and complete. This was MADE. Not weathered
  into shape. Not chanced into smoothness. Made. The mind does not
  want to hold the word. The word does not need it to.
biome: cliffs
