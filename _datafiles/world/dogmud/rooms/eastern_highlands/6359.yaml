roomid: 6359
zone: Eastern Highlands
title: Where the Light Catches
description: >
  Here the ground turns and the
  <ansi fg="itemname">surface</ansi>
  turns with it, and at this one angle the light comes off it
  wrong. Not a glare — the highland has no strong sun to give
  one. It is the way the greyness takes the light and holds it,
  a depthless sheen with no bottom to it, a shine that belongs
  to no stone and no water and no living thing you have a name
  for. Rock scatters light. Water throws it back. This drinks
  it and returns something that is neither, a
  <ansi fg="itemname">sheen</ansi>
  the eye slides off and cannot fix. For the whole walk until
  now some part of you kept the thing filed as landscape — a
  strange scarp, a buried ridge, a trick of the country. The
  light ends that. Standing in it, watching the wrongness sit
  on the surface and not move, you cannot go on calling it
  landscape. It is not landscape. It never was. The knowing
  arrives and does not leave again.
