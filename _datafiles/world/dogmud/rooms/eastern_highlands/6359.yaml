nouns:
  surface:
    >
    At the angle the ground gives here, the surface presents a
    long smooth face to the light and gives back a shine that
    has no texture in it — no scatter, no sparkle, no grain to
    catch. Seamless and grey and cool, it looks the way still
    deep water looks except that water moves and this does not,
    and water has a color and this has only the absence of one.
    The eye keeps hunting for the flaw that would make it
    natural. There is no flaw. That is the flaw.
  sheen:
    >
    The sheen is the thing that will not let the mind rest. It
    lies on the surface without depth, a wrongness in how the
    light behaves that the body reads faster than the eye can
    argue with. Look straight at it and it seems almost
    ordinary. Look away and it stays, a cold shine at the edge
    of sight that no stone in this world was ever known to give.
    It does not flicker. It does not fade with the light. It is
    simply how the made thing meets the day.
idlemessages:
- The light shifts a little and the sheen shifts with it,
  always wrong, never resolving into anything the eye can call
  natural.
- For a moment it looks like stone. Only for a moment. The
  moment does not come back.
- The shine holds steady on the surface. Nothing in the
  highland shines like this. Nothing you have seen anywhere
  shines like this.
- It is not landscape. The thought has arrived and it will not
  go away now. It changes how the whole country looks.
- The eye slides off the sheen and finds no purchase. The body
  already knew. The body is ahead of the eye out here.
