roomid: 6366
zone: Eastern Highlands
title: The Warded Recesses
description: >
  Set into the buried face along this stretch are
  <ansi fg="itemname">recesses</ansi>
  — shallow even hollows in the grey, too regular to be anything the
  ground shaped, spaced along the surface with a sameness that makes
  the skin crawl. And something over them is awake. The
  <ansi fg="itemname">air</ansi>
  above the recesses bites — a thin sharp charge to it, a prickle
  along the arms and the back of the neck, the particular animal
  certainty of being looked at by a thing you cannot see. It is not
  weather. It does not come and go with the wind. It sits over the
  hollows steady and cold and attentive, an
  <ansi fg="itemname">attention</ansi>
  that has not switched off in all the long dark it has been down
  here, and it does not like you near. The made thing all around is
  the same seamless grey it has been the whole way — indifferent,
  buried, vast — but here, over these particular hollows, the
  indifference thins, and something behind the grey is watching, and
  the body knows it long before the mind will say the word, and every
  instinct in you wants to be past this place and not touching it.
