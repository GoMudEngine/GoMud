title: The Canal Mouth
description: >
  The bilge channel widens here into a dead canal that
  has not moved in living memory. The flow entering from
  the underdocks to the east spreads into that stillness
  and goes no further — you watch the <ansi
  fg="itemname">still canal</ansi> and nothing changes
  on its surface. The copper-flower smell from the
  pilings haunt thins as the passage opens westward,
  giving way to something older and more mineral —
  sealed air, damp stone, the smell of enclosure that
  has had more time than can be easily reckoned. The
  passage walls carry <ansi fg="itemname">pre-colonial
  stonework</ansi> here for the first time — fitted
  without mortar, each joint still tight under whatever
  the colony has piled above. A <ansi
  fg="itemname">bilge flow</ansi> enters from the east
  and is absorbed without ripple. The way west is the
  buried quarter.
