title: The Stone Footbridge
description: >
  Lintel Street ducks under a pre-colonial footbridge
  here — the <ansi fg="itemname">stone arch</ansi>
  comes low and you feel the change before you see it,
  the ceiling dropping to dressed stone a handspan above
  your head. The <ansi fg="itemname">bridge
  underside</ansi> is green with damp and cold to the
  touch — the cutting beneath the growth is fine enough
  that the joints are still visible. The bridge is older
  than the colony and was old before the colonists
  arrived; they paved over it and did not mark where it
  was. On the arch-face at eye level a thin band of
  <ansi fg="itemname">old waterline</ansi> deposit runs
  level across the stone — at some earlier period the
  canal stood higher than it does now. Below the arch
  the canal lies black and still. The street continues
  west through the bridge's shadow.
