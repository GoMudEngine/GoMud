zone: New Plymouth Old Quarter
title: A Drowned Court
description: >
  The passage opens into a court that has not been dry
  in any living memory — standing water covers the flags
  from wall to wall, shin-deep and black, perfectly
  still in the lampless air. The <ansi fg="itemname">
  standing water</ansi> has found the level of the
  buried canal and holds it; in a wet season it runs
  deeper. Around the court's edge, doorways open
  directly onto the flood — <ansi fg="itemname">drowned
  sills</ansi> where the stone threshold sits below the
  surface and the interior spaces beyond are dark and
  wet-floored. Above each doorway, a lamp or rush-light
  has been placed on a high ledge or hung from an iron
  peg, out of reach of the water — the one concession
  made to the people who live behind those doors. A
  <ansi fg="itemname">waterline band</ansi> runs level
  across every wall in the court at roughly chest height,
  recording the flood's highest historical reach in a
  thin pale band of mineral deposit.
