title: The Seven Steps
description: >
  Seven stone steps descend. They can be counted —
  there is nothing else to do here but descend them.
  The ceiling drops at the first step and does not
  rise again, the stone close above the head for the
  full length of the descent. Two <ansi
  fg="itemname">oil lamps</ansi> are fixed to the wall,
  one near the top of the stair and one near the bottom,
  both holding a low maintained flame that has not been
  snuffed. Their light fills the stairwell without
  reaching much beyond it. The <ansi
  fg="itemname">stone steps</ansi> are worn at the
  center — the wear of careful descent over a long
  period, the tread compressed where the foot finds
  its place in the dark. The cold deepens on the way
  down; by the seventh step the temperature has dropped
  several degrees and the air is completely still.
  The passage west opens at the bottom.
