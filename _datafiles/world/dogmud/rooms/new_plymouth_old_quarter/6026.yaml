nouns:
  oil lamps: Two clay lamps, one fixed above the
    first step and one above the seventh, each set
    in an iron bracket driven into the stairwell
    wall. Both are burning. Someone has been keeping
    them filled and trimmed, and whoever that was
    has not snuffed them on leaving. The flames are
    steady — this deep, there is no draft to trouble
    them. Their light makes the stairwell navigable
    and the world beyond it dark.
  stone steps: Seven steps, each cut from the same
    dark stone as the walls around them — pre-colonial
    work at this depth, the same tight-fitted courses.
    The center of each tread is worn smooth by use,
    the edges still sharp. The wear pattern is
    consistent — whoever used these steps came and
    went regularly, in the same careful pace, and
    did not rush on the descent.
idlemessages:
- The oil lamp at the stair top burns without
  flickering — no movement of air reaches this
  deep to trouble it.
- The seventh step produces a faint sound on its
  own when the temperature shifts in the stairwell.
- The cold from below rises in a thin current that
  the lamps do not dispel.
- The stairwell amplifies small sounds — a breath,
  a shift of weight on the stone.
- Seven steps. The count is exact and has always
  been exact, for whatever time this has been here.
