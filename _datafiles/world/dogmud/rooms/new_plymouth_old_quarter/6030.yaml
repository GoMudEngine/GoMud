zone: New Plymouth Old Quarter
title: Quill's Lamp-Walk
description: >
  The canal-side walk widens here — more room to pass
  than on Lintel Street proper, the old stone frontages
  set back slightly from the canal's edge. What marks
  this stretch apart from the rest of the buried quarter
  is the <ansi fg="itemname">lamp row</ansi> — four
  clay lamps at intervals along the wall at head-height,
  each trimmed and burning, each maintained with a care
  the rest of the quarter does not receive. The smell
  is different here — warm oil and live wick competing
  with the mineral cold, a small circle of warmth where
  warmth should not exist at this depth. The <ansi
  fg="itemname">canal edge</ansi> runs close along the
  outer side of the walk, the still black water a wrong
  step from the path. A <ansi fg="itemname">low door</ansi>
  in the old stone opens north into a private space
  beyond, and the walk continues west into the darker
  reaches of the buried quarter.
