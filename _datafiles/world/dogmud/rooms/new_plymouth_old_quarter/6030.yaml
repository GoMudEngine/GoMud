nouns:
  lamp row: Four clay lamps at intervals along the
    wall — not placed randomly but spaced with a sense
    of coverage, each gap between them exactly the
    distance that allows one lamp's light to reach
    the next. They are trimmed, all of them, the wicks
    cut to the same height and the oil levels maintained.
    Someone comes through this stretch regularly with
    an oil flask and attends to each lamp in turn. The
    route of the lamp-walk is laid out in the spacing
    of the lamps.
  canal edge: The canal runs alongside the walk here,
    the still black water separated from the path by
    a low stone lip — not quite a railing, not quite
    a wall, just the dressed edge of the cut. The
    canal's surface picks up the lamp row in four
    small points of orange light, perfectly still.
    Nothing in those reflections moves.
  low door: A door set into the old stone frontage —
    small, fitted to a pre-colonial opening, the frame
    worn smooth at the edges from regular use. A lamp
    burns on a shelf just inside the frame, visible
    through the gap where the door sits not quite
    flush against its stop. Someone tends this door
    the way the lamps are tended.
idlemessages:
- The lamp row holds its orange line through the
  canal-side dark — four small certainties in the
  buried quarter.
- The canal surface picks up the lamp reflections
  and holds them without distortion or movement.
- The smell of oil and warm wick is out of place
  here, and welcome for being so.
- A sound from the low door to the north — settling
  wood or someone shifting — and then the usual
  quiet returns.
- The walk is empty but it does not feel unattended.
  The lamps are evidence of someone's regular work.
