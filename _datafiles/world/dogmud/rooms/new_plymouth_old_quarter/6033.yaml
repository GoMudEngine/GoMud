roomid: 6033
zone: New Plymouth Old Quarter
title: Canal-side Hovels
description: >
  A cluster of doorways along the outer canal wall —
  the driest part of the court's margin, a stone ledge
  that stands a hand-span above the permanent flood.
  People have settled here accordingly. <ansi
  fg="itemname">Washing lines</ansi> run between the
  old stone piers above head-height, garments strung
  clear of the flood and close enough to the nearest
  lamp to take its warmth — a practical arrangement
  that has become a permanent feature of the space.
  Below the lines, the ledge is dry in patches and
  damp in others — the border of the flood shifts with
  the season and the residents know exactly where the
  line is. Against the walls and in the open doorways,
  the evidence of managed habitation accumulates — a
  bucket on a shelf, a <ansi fg="itemname">pair of
  boots</ansi> set upside-down on a peg to drain, the
  small practical arrangements of people who have been
  here a long time and expect to remain. The doors
  themselves are <ansi fg="itemname">salvaged
  timber</ansi>, fitted to pre-colonial openings they
  were not made for, hung on old iron that does not
  quite match.
