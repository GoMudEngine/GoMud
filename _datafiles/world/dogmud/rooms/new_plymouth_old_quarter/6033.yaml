nouns:
  washing lines: Strung between old stone piers at a
    height that puts the garments above any expected
    flood while keeping them in the warmth of the
    nearest lamp. The garments are not new — patched,
    faded, worn to the colors of long use — but clean.
    Someone is doing laundry at this depth, which
    requires carrying clean water down, or using what
    the court provides, which requires not thinking
    too carefully about its origins.
  pair of boots: Set upside-down on a wrought iron
    peg driven between two old stone courses — working
    boots, the leather gone soft from long use in wet
    conditions, the toes pointing at the wall in the
    manner of someone who knows exactly where to find
    them. The left boot has been mended at the sole
    with a strip of leather in a different color from
    the original. They are not new and they are all
    someone has.
  salvaged timber: Doors cut from whatever wood was
    available — not matched to their frames, not fitted
    the way a proper door is fitted. Each is held on
    iron hinges that were not made for this opening;
    the hardware was salvaged as surely as the timber.
    What they provide is not privacy exactly but the
    closed-door arrangement that gives people the
    sense of it, which is close enough down here.
idlemessages:
- The washing lines stir once — a draft from the
  court below — and then go still again.
- From behind one of the salvaged doors, the small
  sounds of someone going about what passes for
  normal at this depth.
- The boots on the peg are familiar enough to have
  been placed by someone who does it every time
  without making a decision about it.
- The ledge is dry here for now; the waterline mark
  on the wall below records where it is not always.
- The silence in the hovels is a habited silence —
  the particular quiet of people who have learned
  not to make unnecessary noise.
