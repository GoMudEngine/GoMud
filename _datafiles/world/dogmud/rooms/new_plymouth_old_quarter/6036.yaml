roomid: 6036
zone: New Plymouth Old Quarter
title: The Pre-Founding Stonework
description: >
  The cellar opens westward into a gallery of stonework
  older than the colony, older than the buried quarter
  above, older than any structure the colony has
  catalogued or acknowledged. The <ansi fg="itemname">
  dressed courses</ansi> are massive — each block a pace
  or more in length, fitted in dry courses without mortar
  on a geometry that does not correspond to anything
  above. The builders used a different module — different
  proportions, different corner logic — and what they
  built was organized around purposes the colonial plan
  does not share. The <ansi fg="itemname">vault</ansi>
  rises higher here than in the cellar, the cut clean
  and dry despite the depth and the flood at the floor.
  Along the base of the far wall, where the flood laps,
  a seam of <ansi fg="itemname">gray material</ansi>
  runs at the waterline — not stone, not metal, set into
  the lowest courses as a continuous element that passes
  through the joints and is not interrupted by them.
