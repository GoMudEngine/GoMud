roomid: 6039
zone: New Plymouth Old Quarter
title: A Silted Gallery
description: >
  The deepest and oldest accessible space in the buried
  city — a pre-Founding gallery where the gray material
  is not a seam or a vein but the primary surface of the
  <ansi fg="itemname">gallery walls</ansi>, continuous
  from the silt line to the vault above. This is, as far
  as any search of the deep has established, the source —
  the original interior of whatever structure the buried
  canal and the pre-Founding stonework were part of.
  The floor is not visible; <ansi fg="itemname">deep
  silt</ansi> covers it to boot depth, undisturbed except
  where careful searching has left probe-marks in the
  settled surface. The <ansi fg="itemname">gray
  facing</ansi> does not smell like stone when you stand
  close to it — not metal either, not any category
  available in the colony's vocabulary for material
  things. It does not yield to a blade or take a scratch.
  The lamp carried here does not seem to reach the
  gallery's full extent — the space feels larger than a
  lamp can confirm, or the dark at the far end is simply
  very complete.
