nouns:
  gallery walls: Faced entirely with the gray material —
    not stone with a seam of it, but the material itself
    as the surface, from the silt line at the base to
    the vault above. Whatever function this gallery had,
    the material was integral to it. The surface is
    smooth and cold to the touch and does not warm at
    the hand's contact the way stone does. Running a
    lamp along the wall, the material carries no
    inscription, no device — only the smooth gray facing,
    continuous and unbroken around the full interior.
  deep silt: The original pre-Founding floor is below
    this — somewhere beneath however much has accumulated
    in however long this gallery has been sealed under
    the colony. The silt surface carries the marks of
    searching — probe-lines, a few brushed patches where
    something was found and read — but no substantial
    finds have been removed. Either nothing substantial
    is down there or it has not been found yet. The silt
    is very old and very still.
  gray facing: Close to it, the smell is the detail
    that stays with you — not mineral, not organic,
    not metal. A smell that has no name in the colony
    because the colony has never encountered this
    material before. The facing does not yield to a
    blade, does not scratch, does not warm at touch or
    cool at depth in the way stone or metal would.
    Whatever it is, it was placed here — with evident
    precision, as a designed interior surface — by
    whoever built the original structure, for whatever
    the original structure was for.
idlemessages:
- The gray facing carries the lamplight without
  reflecting it — the surface absorbs the glow
  and returns nothing.
- The silt surface is undisturbed except where it
  has already been searched, carefully and more
  than once.
- The gallery extends farther west than the lamp
  confirms — or the dark at the far end is simply
  very complete.
- The silence here is the silence of the oldest
  accessible room in the buried city, which has
  had a long time to settle into itself.
- Close to the gray facing, the smell is something
  the colony has no word for, which is itself a
  kind of information.
