zone: New Plymouth Old Quarter
title: Lintel Street
description: >
  The street climbs slightly here — not enough to see
  but enough to feel underfoot, a few inches of grade
  that leave the worst of the standing water behind you.
  The <ansi fg="itemname">old lintels</ansi> continue
  in their row — wider here than at the lower end, the
  stonework a degree more deliberate, as though this
  part of the buried city was of slightly more
  consequence. Above each lintel the colony's later
  work fills in with rough <ansi fg="itemname">clay
  brickwork</ansi> — a different color and weight from
  the pre-colonial stone below, the two periods of
  building separated by burial and forgetting. Ahead
  a <ansi fg="itemname">sealed doorway</ansi> faces
  the street — pre-colonial stone blocked with colonial
  brick, shut since the burial. The street is quiet.
  From somewhere ahead the dark carries a quality of
  attention that is not quite emptiness.
