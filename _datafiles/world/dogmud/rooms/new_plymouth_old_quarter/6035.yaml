title: Gritta's Flooded Cellar
description: >
  A vaulted cellar at the base of the stair — the
  ceiling higher than anything in the buried quarter
  above, the stone differently cut and more precisely
  fitted, the vault's curve describing an older geometry
  than the colonial work it underlies. Knee-deep water
  fills the floor and has filled it long enough that the
  waterline mark on the vault walls is a settled band.
  On a raised stone shelf along one wall, a careful
  arrangement of <ansi fg="itemname">salvaged
  stone</ansi> — shaped pieces, carved edges, a fragment
  still carrying part of a decorative course — laid out
  in an order that implies study rather than collection.
  Beside them, a <ansi fg="itemname">silt probe</ansi>
  and a stiff brush stand in a clay jar, handles up,
  the tools of someone who searches the floor below the
  water for what the silt holds. An iron lamp hangs on
  a hook in the vault — burning. The passage west leads
  into the older, deeper structure beyond.
