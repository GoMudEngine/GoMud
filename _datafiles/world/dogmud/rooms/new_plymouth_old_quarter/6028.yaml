nouns:
  drain: Set in the center of the stone floor — a
    hand-span across, the edges dressed clean, the
    channel below slanting away at a deliberate angle.
    It is dry now. It has not always been dry; the
    stone around the rim shows the pale mineral deposit
    of regular wetting and drying over a sustained
    period of use. Whatever passed through it, the
    drain handled it efficiently and deliberately.
    The drain does not explain itself. It does not
    need to.
  pallet: A low wooden frame with canvas ticking —
    not a sleeping pallet, or not only that. The
    ticking carries the depression and discoloration
    of long, largely unmoving occupation — the outline
    of someone who stayed in one position for extended
    periods. There is no blanket. There is no pillow.
    There is a short iron ring set into the wall at
    the pallet's head, the iron worn bright on its
    inner surface. The pallet is empty. The person
    who was on it is gone.
  apparatus: Glass vessels in three sizes, clean and
    cold — the glass is good quality, the kind used
    by apothecaries who expect to be examined.
    Copper tubing connects the vessels at fitted
    joints, each joint sealed with soft metal worked
    smooth. Below the bench, in a wooden rack, wax-
    sealed clay pots are stacked in two even columns,
    the wax applied carefully around the full rim of
    each. The apparatus is cold and still and has the
    arrangement of something that was in regular use
    and simply stopped. The room does not smell of
    anything now.
idlemessages:
- The apparatus holds its arrangement in the lamp-
  light — glass and copper and wax, still in their
  last-used positions.
- The drain is dry. The stone around its rim is not
  quite as clean as the drain itself.
- The pallet shows the shape of someone who lay
  there for a long time without moving much.
- The cold in this room sits below the cold of the
  corridor — a sealed room at depth holds what it
  has been given, and holds it long.
- One of the clay pots in the rack has been moved
  and not replaced exactly — it sits a half-inch
  out of the line of the others.
