roomid: 6028
zone: New Plymouth Old Quarter
title: The Production Room
description: >
  A stone room, roughly eight paces by six — the
  dimensions of something measured before it was built,
  not found. The floor is bare stone except for a <ansi
  fg="itemname">drain</ansi> at the center, a hand-span
  across, cut into the flags with the same precision as
  everything else here. Against the near wall, a bare
  <ansi fg="itemname">pallet</ansi> — no blanket, no
  pad, the ticking marked with the outline of long
  unmoving occupation — pushed to one side as though
  the person who lay on it left without arranging it.
  Along the far wall, the <ansi
  fg="itemname">apparatus</ansi> remains in place —
  glass vessels of several sizes, copper tubing jointed
  and sealed with soft metal at every fitting, wax-sealed
  clay pots stacked in a wooden rack below the bench.
  Everything is cold. The apparatus is cold. The pallet
  is empty. Whoever belonged on it is not here. The
  drain is dry and clean in the particular way drains
  are clean when they have been used consistently and
  are now, suddenly, not being used at all.
