roomid: 6024
zone: New Plymouth Old Quarter
title: Upper Lintel Street
description: >
  The street reaches its highest and driest point here —
  still underground, still mineral-cold, but no standing
  water, no trace of the canal. The <ansi
  fg="itemname">old lintels</ansi> are grander at this
  end — wider spans, finer-dressed stone, the work of
  a neighborhood that had some standing when the colony
  buried it. Above the lintels the later houses crowd
  the passage from both sides; their <ansi
  fg="itemname">dark windows</ansi> are shuttered or
  open-dark, showing nothing within. At the base of one
  building face, a <ansi fg="itemname">worn threshold</ansi>
  opens onto interior dark — stone polished by use
  older than the colony. The character of the street
  changes here — not the emptiness of the lower reaches
  but something more deliberate, a quiet that comes from
  people who have chosen to be still. The far end bends
  into shadow beyond any lamp's reach.
