roomid: 6029
zone: New Plymouth Old Quarter
title: Deren's Ledger Room
description: >
  A small room immediately behind the iron door — low
  ceiling, no window, the air carrying old tallow and
  something papery that has had time to settle into the
  stone. A <ansi fg="itemname">desk</ansi> against the
  wall bears the wear of regular use stopped not long
  since — a surface scored by pen and ink-ring stains,
  a dry inkwell, a pen still in its holder as though
  set down mid-thought. On the desk, an open <ansi
  fg="itemname">ledger</ansi> in a close, careful hand;
  the last entry runs off mid-column without a closing
  line, the figures unfinished. In the desk's corner,
  a short <ansi fg="itemname">cord</ansi> lies coiled —
  the kind a key is worn on, day and night, by someone
  who does not care to set it down. A stair descends
  through the floor at the room's far end. The fourth
  step creaks. The seventh as well.
