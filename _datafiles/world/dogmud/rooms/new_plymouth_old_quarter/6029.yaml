nouns:
  desk: A working desk — plain, utilitarian, the kind
    that accumulates the marks of its use without
    ceremony. The surface carries pen-scoring, old ink
    rings, a depression from the heel of a hand used
    many times in the same place. The inkwell is dry
    and has been dry long enough that the residue has
    crusted at the lip. The pen in its holder is good
    quality. Someone who worked here paid for good
    tools and used them steadily over a long period.
  ledger: A bound ledger of columns and entries in a
    precise, compressed hand. Dates run down the left
    margin; figures and brief notations fill the
    columns to the right. The entries are in a coded
    shorthand — close enough to a standard commercial
    notation to pass a quick inspection, not close
    enough to be read directly. The last entry is
    half-finished, the final figure absent. The page
    has not been turned.
  cord: A length of thin cord, coiled in the desk
    corner, with a loop at one end sized for wearing
    around a neck. The cord is worn soft from long
    contact with skin; a small brass fitting at the
    loop end is bright from the same contact. The key
    it held is not here. Whatever lock that key served,
    the key went with its owner — or was surrendered.
idlemessages:
- The stair below is quiet — no sound comes up
  from the lower level.
- The ledger lies open as it was left, the last
  entry unfinished and the pen still in its place.
- The cord on the desk corner catches the eye;
  the absence it marks is harder to define.
- The air in the room is closed and used — the
  smell of a workspace that has been sealed awhile.
- The fourth step below produces a faint sound
  on its own when the temperature of the stairwell
  shifts in the cold.
