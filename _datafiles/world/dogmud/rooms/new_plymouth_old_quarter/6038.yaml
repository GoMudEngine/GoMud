roomid: 6038
zone: New Plymouth Old Quarter
title: The Deep Canal
description: >
  The buried canal ends here — the old channel meets a
  wall of dressed stone and goes no further west. Flood
  water fills the space to waist-height and deeper in
  the channel center, black and cold enough that the
  air above it carries a bitter chill. Along the base
  of the far wall, where the old courses meet the flood
  line, a seam of <ansi fg="itemname">gray material</ansi>
  is exposed — wider here than in the gallery to the
  south, running at the waterline in a continuous band
  of several hand-spans. Its surface is smooth where
  the water works it and does not wear; it does not
  corrode, does not stain. The <ansi fg="itemname">canal
  end wall</ansi> is dressed stone in the same pre-
  Founding style as the galleries — the courses tight,
  the fit exact, the work of builders who sealed this
  end of the canal on purpose and built it to remain
  sealed. At the upper right corner of the end wall,
  above the flood line, a small <ansi fg="itemname">carved
  mark</ansi> is incised into the stone — a single
  concentric ring, without the eight points. An earlier
  draft or a maker's mark or something else entirely.
