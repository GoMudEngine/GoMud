nouns:
  gray material: The seam is wider here than in the
    gallery to the south — not a thin vein but a band
    running continuously at the flood line for several
    hand-spans. Close to it, the smell of the water
    changes — still mineral, but differently so, the
    way a different kind of stone smells when wet. The
    surface of the material does not yield to a nail,
    does not scratch, does not take a mark. The flood
    has been working it for a long time and has not
    worn it at all.
  canal end wall: Dressed pre-Founding stone, sealed
    at every joint — the wall was not built as a
    temporary barrier but a permanent terminus. The
    courses above the flood line are clean and dry;
    below, the gray material seam runs across the
    base. The whole assembly reads as deliberate and
    complete — the canal was meant to end here, at
    this wall, and the wall was built for exactly that
    purpose.
  carved mark: A single concentric ring, incised at
    the upper corner of the end wall above the flood
    line — smaller than the symbol on the buried
    lintel, and without the eight points. Whether it
    is a maker's mark, a draft for a device not
    completed, or a notation entirely different from
    the lintel symbol is not determinable from the
    incision alone. It was placed precisely in this
    corner.
idlemessages:
- The canal water holds its level at the gray seam
  — rising no higher, going no further west.
- The canal end wall carries no sound through it.
  Whatever lies beyond it, if anything does, is
  perfectly quiet.
- The gray material at the flood line does not move
  when touched — it is fixed in the courses as
  though it is part of the original pour.
- The cold in this room is the cold of a dead end —
  the same water, going nowhere, for a very long
  time.
- The carved mark at the upper corner is visible
  when light is brought close; at general lamp
  distance it is easy to miss.
