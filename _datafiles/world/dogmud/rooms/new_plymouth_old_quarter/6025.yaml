zone: New Plymouth Old Quarter
title: 215 Lintel Street — the Iron Door
description: >
  A side passage off Upper Lintel Street opens onto a
  short stretch of worn stone ending at a doorway. The
  colonial number is scratched into the lintel above the
  frame — 215, in a plain hand, the kind of designation
  that means nothing unless you know to look for it.
  The <ansi fg="itemname">iron door</ansi> stands a few
  inches ajar, iron-banded across heavy dark timber that
  once required a pattern-knock to open; at fist-height
  on the banding the iron is worn bright by long regular
  use at exactly one point, the wear of knuckles finding
  the right sequence over many visits. The <ansi
  fg="itemname">house number</ansi> above the frame
  carries no name and no trade sign beside it. The <ansi
  fg="itemname">open threshold</ansi> beyond the door
  leads west into a low interior. Whatever once
  controlled entry here no longer does.
