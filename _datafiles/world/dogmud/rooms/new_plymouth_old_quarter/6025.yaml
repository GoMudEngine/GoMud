nouns:
  iron door: Iron-banded across heavy timber — the
    banding is not decorative but functional, the kind
    of reinforcement that is meant to resist forced
    entry rather than simply deter it. The iron itself
    is old and has been maintained; no rust at the
    joints, the hardware oiled. At fist-height on the
    right-side band, the metal is worn smooth and
    slightly bright — the work of knuckles returning
    to exactly this point in exactly this sequence for
    a long time. The door stands ajar. It opens inward.
  house number: 215, scratched into the lintel stone
    in plain colonial numerals — no flourish, no
    maker's mark, no trade designation beneath. The
    sort of address that appears in no directory and
    on no official register. The stone around the
    numbers shows no weathering — the designation was
    cut after the street was buried and has never
    seen open air.
  open threshold: The door was kept closed and is not
    closed now. Whatever arrangement controlled entry
    here — the pattern-knock, the recognition — has
    ended. The room beyond is low and dark and quiet,
    and the way into it stands open.
idlemessages:
- The iron door holds the position where it was
  left — not fully open, not quite closed, as
  though it was interrupted mid-swing.
- The worn place on the door banding catches what
  little light reaches this passage, a small
  bright point in the old iron.
- The number 215 above the frame says nothing and
  asks nothing. It has been saying nothing for
  some time now.
- A cold breath comes through the open threshold
  from the room beyond — stiller than the passage,
  and colder.
- The wear pattern on the door hardware reads as
  a record of regular use, though not a legible one.
