zone: New Plymouth Old Quarter
title: The Buried Lintel
description: >
  The passage narrows here. A single massive stone
  spans the full width of the corridor at head-height —
  a <ansi fg="itemname">lintel</ansi> cut from one piece
  of the same dark stone as the surrounding courses,
  seated without mortar at either end with no visible
  crack at either joint after however long it has held
  its position. Its underside is carved. The <ansi
  fg="itemname">symbol</ansi> covers most of that face —
  concentric rings, eight points at equal intervals,
  incised with a precision that required a drawing
  before it required a chisel. It is not a colonial
  device, not a navigational rose, not an emblem from
  any faith currently practiced in the settlement — it
  predates all of those. The partial device in the Noble
  gallery's oldest painting was a copy of something.
  You are standing beneath the something. The colony
  arrived here, found this, and wrote itself into the
  founding record as first. The lintel makes no argument
  against that version. It simply continues to be older.
