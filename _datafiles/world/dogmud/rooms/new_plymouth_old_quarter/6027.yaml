nouns:
  wall lamps: Two clay lamps at the corridor ends,
    both burning. They have been maintained — not
    abandoned with the operation. The flames are
    steady, the oil current. If what required this
    space has ended, no one came back to snuff these
    lamps before leaving. They will burn until the
    oil runs out and then the corridor will be dark.
  stone passage: Pre-colonial construction — the
    same dark, tight-fitted stone as the stairwell
    above, the joints still sharp and dry despite
    the depth. The corridor's dimensions are precise,
    not the rough proportions of a utility passage
    but the measured work of deliberate planning.
    Someone designed this space and built it to be
    exactly what it is.
  south opening: A doorway without a door — the
    stone cut cleanly at frame-width, no frame, no
    threshold feature. The lamp nearest it throws
    its light through the opening and does not
    illuminate much of what is inside; the room
    beyond requires its own lamp, which it has.
idlemessages:
- The two lamps burn at the same pace — the same
  flame height, the same oil level as each other.
- The corridor is entirely quiet. No sound comes
  through the south opening from the room beyond.
- The stone walls are cold to the touch, the cold
  of stone at depth that has held its temperature
  for a very long time.
- The lamplight does not reach the stairwell to
  the east; the corridor ends cleanly at the dark.
- The south opening does not move and does not
  sound. Whatever is in the room beyond it is still.
