zone: New Plymouth Old Quarter
title: The Stone Corridor
description: >
  The stairwell opens into a short corridor at the base
  of the descent — low ceiling continuing from the
  stair, the same mineral cold, no ventilation except
  what reaches down from the room above. Two <ansi
  fg="itemname">wall lamps</ansi> are fixed at the
  corridor's ends, mirrors of the ones in the stairwell
  above — clay in iron brackets, both burning at the
  same low maintained flame. They have not been snuffed.
  Between them, the <ansi fg="itemname">stone
  passage</ansi> is perhaps four paces — long enough
  to walk, short enough to see end to end in the lamp-
  light. The walls are pre-colonial work, tight-fitted
  without mortar, the same dark stone as everything
  below this depth. A <ansi fg="itemname">south
  opening</ansi> at the corridor's far end gives onto
  the room beyond — the lamps were lit to serve what
  lies through that opening.
