roomid: 6021
zone: New Plymouth Old Quarter
title: Lower Lintel Street
description: >
  The canal runs close on your right — a wrong step in
  the dark would put you in it. This is the lowest and
  wettest end of Lintel Street. The <ansi
  fg="itemname">old lintels</ansi> that name the street
  are here in their original form — massive pre-colonial
  door-headers spanning thresholds the rising damp has
  slowly claimed. The nearest has a <ansi
  fg="itemname">drowned threshold</ansi>, its sill a
  hand-span below the canal's edge, whatever once lay
  inside now silted over and sealed. Higher on the wall,
  above the water's reach, salvaged cloth and rope mark
  where people have taken up the dry doorways for
  shelter — the poorest end of the poorest quarter. A
  <ansi fg="itemname">guttering lamp</ansi> hangs from
  a peg in the old stone, its oil running low.
