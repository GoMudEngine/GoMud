nouns:
  alley window: Cut high in the back wall — a pre-
    colonial opening, narrow enough to have been
    further narrowed by old mortar and in any case
    too small and too high to serve as more than
    ventilation. Cold air comes through it steadily.
    Whatever it looks out onto, the view is not
    visible from inside the room. The lamp on the
    shelf was not positioned to light the window;
    the window is not the point of the lamp.
  sleeping pallet: A low frame with canvas, the kind
    of bedding that has been used long enough to carry
    the shape of its occupant. The blanket at one end
    is folded with a precision that looks automatic —
    the fold of someone who has done it every morning
    without thinking about it for a long time. The
    pallet is currently unoccupied.
  tending kit: An oil-flask, a wick-trimmer, a striker,
    and four spare flints — arranged on the shelf in
    the same order, each item touching the next. The
    flask is not full but not empty; it has been
    recently used and not yet refilled from whatever
    reserve keeps it current. The kit has the feel of
    professional equipment maintained to a standard
    rather than simply owned.
idlemessages:
- The lamp on the shelf burns without wavering —
  no draft reaches this room through the narrow
  window above.
- The tending kit sits in its arrangement on the
  shelf, each item where it always is.
- The fold of the blanket at the pallet's end is
  exact — the same fold, probably, every morning.
- Cold air comes through the alley window in a
  thin steady current that the lamp does not
  acknowledge.
- The room is quiet in the way a room is quiet
  when its occupant has stepped out and will
  return shortly.
