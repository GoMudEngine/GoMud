roomid: 6031
zone: New Plymouth Old Quarter
title: Quill's Hovel
description: >
  A single room in the old stone — low ceiling, one
  <ansi fg="itemname">alley window</ansi> cut high and
  narrow in the back wall, admitting cold air and a
  thin strip of the quarter's unlit dark. A clay lamp
  burns on a wall shelf — not guttering and not low,
  tended. Beneath it, a <ansi fg="itemname">sleeping
  pallet</ansi> with a folded blanket at one end, the
  blanket worn clean if not new, the fold deliberate.
  Along the opposite wall, the tools of a lamp-tender's
  work arranged on a low shelf — a <ansi
  fg="itemname">tending kit</ansi> of oil-flask, wick-
  trimmer, a striker and spare flints, each in its
  place with the order of someone who finds things in
  the dark by location rather than sight. The room is
  poor, and the poverty in it is managed — these are
  two different conditions, and the difference between
  them is visible in the arrangement of the shelf.
