zone: New Plymouth Old Quarter
title: The Flooded Stair
description: >
  A stone stair descends from the court's west edge
  into water — the upper steps are clear, the flood
  beginning on the third tread and deepening with each
  step below. The <ansi fg="itemname">water surface</ansi>
  at the stair's edge is level with the court flood to
  the east, but the stair continues below it; the lower
  treads vanish into a cold dark that the court's lamps
  do not reach. A breath of air rises from below —
  several degrees colder than the court above, carrying
  a mineral smell that is deeper and older than the
  buried quarter itself. The <ansi fg="itemname">iron
  rail</ansi> descends with the stair; below the
  waterline it carries a pale soft growth that does not
  mind the cold or the dark. The stairwell walls are
  <ansi fg="itemname">deep stonework</ansi> — a different
  cut and a different age from the colonial buildings
  at the court's rim. This stair was here before the
  court was built over it.
