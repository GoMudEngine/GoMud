roomid: 6095
zone: River Road
title: Broadwater Road
description: >
  The river has settled into its character here — wide, unhurried, the
  surface grey-green and barely ruffled. Willows lean over the far bank,
  their trailing branches stirring the current in long slow arcs. The
  road follows close to the water's edge, sometimes only a yard of
  trampled grass between the track and the bank. Insects hover over the
  shallows. The afternoon light lies flat on the broad water, and the
  only sound is the river and whatever moves through it.
biome: water
