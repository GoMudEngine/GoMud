roomid: 6105
zone: River Road
title: The Confluence Gates
description: >
  The road ends here at the city's river-ward approach: two broad stone
  gateposts, a river-warden's booth to one side, a sign in several hands
  nailed below the arch. The bar is up now, swung clear and hooked back
  against the post — the season has turned and the warden is returned to
  duty. Beyond the gate the road curves on under the first buildings of
  the Confluence, where three rivers and a city have been arriving at each
  other for a very long time, and the way south runs open into it at last.
biome: water
