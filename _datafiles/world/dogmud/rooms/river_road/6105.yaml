nouns:
  the gates: >
    Gateposts of squared river stone, the bar between them worn smooth
    from being lifted and set back a thousand times. It hangs raised now,
    hooked clear against its post, and the warden's booth is manned again.
    A brass fitting on the post shows where the lock goes when the bar is
    set in earnest, but the bar is up and the road is open: travelers pass
    through with a nod and a word, in and out of the city beyond.
  the road south: >
    A short span of old paving between the gate and the city's first
    buildings, the stones older than the bar across the road and older
    than the warden's booth. Through the open gate the city arrives all at
    once: street noise, river noise, the smell of a place built on moving
    water. The way runs south into it now, the gate raised and the season
    turned — the Confluence lies open ahead.
idlemessages:
- Beyond the gate, the sound of the city drifts over the bar.
- The river runs on both sides of the gate, paying the bar no attention.
- Someone has left a small ring of stones at the base of the gatepost.
