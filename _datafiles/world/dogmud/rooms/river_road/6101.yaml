zone: River Road
title: The River Road South
description: >
  Below the bluff the road carries on south, the joined river always in
  sight to the right. Here the traffic is thickening: foot-worn ruts and
  scattered evidence of recent passage — a broken sandal-strap pressed
  into the mud, a fire-ring of river stones beside the road, a handful
  of way-markers driven at the curve. Pilgrims, mostly. The road is old
  here but recently trodden, and the air has a settled, purposeful feel,
  like a place that knows where it is going.
