    respawnrate: "20 real minutes"
idlemessages:
- The hanging nets creak softly on the line, still damp from the river.
- The smell of fresh fish is sharp and metallic in the afternoon air.
- Flies circle over the catch-baskets, indifferent to the hand that waves.
