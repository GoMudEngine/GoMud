roomid: 6099
zone: River Road
title: The Smokehouse
description: >
  A low building open on the sides, its roof thick with soot where it
  hasn't been re-thatched in years. Within, split river fish hang on
  iron racks above beds of smoldering alder wood, going slowly amber.
  The smoke hangs motionless in the still air of the interior. Outside,
  a gutting table and the particular sharp smell of the work. At the far
  end of the building, through the sweet grey haze, a single figure
  tends the racks with the unhurried attention of someone who has done
  this for a very long time.
biome: water
coord: {x: -5, y: -43, z: 0}
exits:
  west: {roomid: 6098}
nouns:
  the smoke racks: >
    Iron rods spanning the smokehouse, hung with split fish at every
    hand's width. The older fish have gone deep amber, the flesh pulling
    at the bone; the newer hang pale and wet, smoke barely touching them
    yet. Everything here smells of alder and salt.
  the fish: >
    River fish — bream and roach and something longer, its scales still
    catching the smoky light. Split and laid open, each one weighed by
    the same hand before hanging, the cuts even and practiced. What you
    buy here will keep a long while on the road.
spawninfo:
  - mobid: 9413
    respawnrate: "20 real minutes"
idlemessages:
- Alder smoke drifts from the smokehouse and hangs low over the path.
- A crow sits on the gutting table, pulling at something, unbothered.
- Inside, the steady drip of rendered fat hitting the embers.
