roomid: 314
zone: Labyrinth of Low Tunnels
title: Stinking Den
description: The tunnels open into the largest chamber you have encountered down here,
  though the ceiling is still oppressively low and blackened with decades of soot.
  This is the heart of the warren. A crude hearth of fire-blackened stones dominates
  the center, ringed with gnawed bones and ash. The walls are covered in the densest
  concentration of scratched symbols yet -- overlapping, frantic, territorial. Crude
  bedding of matted hide and dried fungus lines the edges of the chamber in distinct
  clusters, each marked with crude totems. Tunnels branch in every direction. The air
  is so thick with smoke, sweat, and the reek of communal habitation that it feels
  like breathing through a damp cloth pressed against your face.
biome: cave
