  message: A second warrior emerges from one of the branching tunnels, rattling a flint spear.
  respawnrate: 10 real minutes
- mobid: 76
  message: A blind tunnel rat gnaws at a bone near the edge of the bedding.
  respawnrate: 12 real minutes
nouns:
  hearth: Blackened stones arranged in a rough circle, the ground around them crusted
    with layers of old ash and charred bone. The fire is out but the stones are still
    warm. This hearth has not been cold in a very long time.
  bedding: Distinct sleeping clusters separated by small cairns of stacked stone -- territorial
    markers. Each cluster has its own collection of crude possessions piled nearby. The
    bedding reeks.
  symbols: The scratched symbols here are denser and more complex than anywhere else in
    the tunnels. Some are repeated obsessively. Others have been scratched out and
    replaced. This is the record of something -- disputes, history, claims. You cannot
    read it.
idlemessages:
- Embers in the hearth stones glow faintly orange beneath the ash. The fire was recent.
- The territorial symbols on the walls seem to shift in the dim light, though nothing has moved.
- A low, keening sound drifts from one of the branching tunnels -- mourning, or a warning.
- The smoke-thickened air stings your eyes and coats the back of your throat.
- Something watches from a shadow near the bedding. Eyes catch the light, then vanish.
