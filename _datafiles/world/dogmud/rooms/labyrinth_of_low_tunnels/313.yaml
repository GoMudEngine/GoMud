idlemessages:
- The walls press in on both sides. Your own heartbeat seems amplified by the stone.
- Whispering from ahead. Or behind. The acoustics make it impossible to tell.
- Your armor scrapes against the passage walls with a sound that announces your position to everything nearby.
- The air is so close and warm you can taste it -- sweat, stone dust, and something alive.
