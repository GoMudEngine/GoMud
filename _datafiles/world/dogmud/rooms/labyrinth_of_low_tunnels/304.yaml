roomid: 304
zone: Labyrinth of Low Tunnels
title: Dripping Gallery
description: The southern passage opens slightly into a low gallery where water seeps
  steadily down the walls, pooling in shallow depressions worn into the floor. Crude
  clay bowls and hollowed stones have been placed beneath the heaviest drips to catch
  the water. Some are full and murky. Others have been knocked over, their contents
  spread across the stone in dark stains. The wet walls glisten faintly in whatever
  thin light reaches here, and the constant dripping echoes off the low ceiling in
  an uneven rhythm that makes it hard to hear anything else.
biome: cave
coord:
  x: -12
  y: 6
  z: -1
