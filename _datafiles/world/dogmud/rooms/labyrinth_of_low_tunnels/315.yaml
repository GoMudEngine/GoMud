  message: A flint spear leans against the trophy wall, apparently unclaimed.
  respawnrate: 15 real minutes
nouns:
  skulls: Animal skulls mostly -- rats, bats, something with a longer jaw that might
    be a cave lizard. But three of them, mounted highest and most prominently, are
    unmistakably human. They have been cleaned with care and arranged facing outward,
    as though on display for visitors.
  equipment: Scraps of gear taken from the dead or the fled. A bent knife. A torn
    strap. A boot. Nothing intact, nothing valuable. The useful parts have been
    stripped and repurposed. These are the leftovers -- mounted as warnings.
idlemessages:
- The empty eye sockets of the mounted skulls catch shadows and seem to follow movement.
- A strip of leather hanging from a bone peg sways gently, though there is no breeze.
- The white bone of the newest trophies gleams against the soot-blackened walls.
