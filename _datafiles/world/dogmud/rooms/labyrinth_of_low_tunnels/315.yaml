roomid: 315
zone: Labyrinth of Low Tunnels
title: Trophy Alcove
description: A shallow alcove branching west from the den, its walls lined with mounted
  trophies. Skulls -- mostly animal, some disturbingly not -- are wedged into cracks
  and crevices at eye level, staring inward with empty sockets. Scraps of salvaged
  equipment hang from bone pegs driven into the stone -- a rusted buckle, a torn
  leather strap, the bent remains of a belt knife, a boot with the sole chewed through.
  These are not decoration. They are proof. Proof that things wander into these tunnels,
  and proof that those things do not leave. Some of the trophies look recent. The bone
  is still white.
biome: cave
