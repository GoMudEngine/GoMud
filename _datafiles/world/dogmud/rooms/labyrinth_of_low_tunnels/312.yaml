roomid: 312
zone: Labyrinth of Low Tunnels
title: Carved Niche
description: A wider space where crude shelves have been gouged into the walls at
  various heights, all of them low. Clay pots sit on some <ansi fg="itemname">shelves</ansi>, sealed with wax
  and packed with dried fungus or something that smells like fermented grain. Others
  hold small totems -- figures twisted from bone and sinew, eyeless faces carved into
  knucklebones, bundles of teeth wrapped in strips of hide. This is a communal space,
  a storehouse and shrine both. The ceiling is black with soot, and the floor is worn
  smooth by the shuffling of many bare feet. The darkness presses in from every side,
  and the walls feel closer than they should.
