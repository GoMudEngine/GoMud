nouns:
  pots: Rough clay vessels, pinched and shaped by small fingers. Some are sealed tight
    with dark wax. Others have been opened and re-sealed many times. The contents
    smell sharp -- fermented, acrid, deliberately preserved.
  totems: Small figures made from bone, sinew, and teeth. They have no eyes. Some are
    arranged in groups, others stand alone on their shelves. A few have been broken
    and carefully repaired with strips of hide binding.
  shelves: Gouged directly into the basalt with crude tools, at heights ranging from
    knee-level to chest-level on a human. For whatever made them, these are at a
    comfortable reach.
idlemessages:
- A clay pot shifts on its shelf with a faint scrape. Nothing visible touched it.
- The soot on the ceiling is thick enough to flake. A piece falls and dissolves in the dark.
- The totems on the shelves seem to watch from their empty faces.
- Something scrabbles in the passage to the east, then goes quiet.
