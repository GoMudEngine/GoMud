roomid: 311
zone: Labyrinth of Low Tunnels
title: Worm-Eaten Shaft
description: A vertical crack in the rock, widened by something burrowing, connects
  the upper tunnels to this deeper level. The walls of the shaft are scored with
  parallel grooves -- claw marks from years of climbing traffic -- and coated with a
  greasy residue that makes the stone slick to the touch. At the bottom, the shaft
  opens into a low passage running west. The air down here is noticeably warmer and
  thicker, heavy with the smell of bodies and smoke. You can hear activity echoing
  through the stone -- guttural voices, the scrape of tools, the occasional sharp
  crack of something breaking.
biome: cave
