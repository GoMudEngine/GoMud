  message: A spore crawler clings to the greasy shaft wall, mandibles working.
  respawnrate: 10 real minutes
nouns:
  grooves: Parallel claw marks running vertically up the shaft walls, worn deep by
    years of traffic. The spacing is too narrow for human hands. Small creatures
    climb this shaft regularly, and fast.
  residue: A thin, greasy film on every surface -- body oil, accumulated over years
    of contact. It makes the stone treacherously slick for anyone without claws.
idlemessages:
- Guttural chattering echoes from below, distorted by the stone into something almost musical.
- The greasy walls of the shaft glisten faintly in the dim light.
- A shower of grit falls from above as something scrambles through the upper tunnels.
