roomid: 301
zone: Labyrinth of Low Tunnels
title: Low Junction
description: The descent levels out into a cramped junction where the tunnel splits
  in three directions. The ceiling is barely chest height -- standing upright is
  impossible. Every surface is covered in scratches, claw marks, and crude symbols
  gouged into the basalt with something sharp. A faint, greasy light flickers from
  somewhere down the southern passage, and the air is thick with the smell of unwashed
  bodies and rancid fat. This is not a natural cave. Something lives here, and has
  for a long time.
biome: cave
