  message: A hunched figure crouches at the edge of the junction, pale fungal growths pulsing faintly along its scalp. It watches the passage above with cautious, milky eyes.
  respawnrate: 5 real minutes
nouns:
  scratches: The marks are deliberate -- grouped in sets of four or five, slashed through
    with a diagonal. Tally marks. Hundreds of them, layered over each other in the
    dim light.
  symbols: Crude pictograms scratched into the stone. Shapes that might be figures,
    crude circles, angular slashes. A language, or something trying to become one.
idlemessages:
- The scratching sound is louder here, coming from more than one direction.
- Greasy smoke drifts through the junction from somewhere deeper in the tunnels.
- A pebble clatters in a side passage. Something small just moved out of sight.
- The air is close and warm despite the stone. Too many things breathing down here.
