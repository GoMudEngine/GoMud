spawninfo:
- mobid: 76
  message: A blind tunnel rat burrows through the refuse, tail dragging behind it.
  respawnrate: 10 real minutes
nouns:
  midden: Layers of waste packed down over what must be years. The bottom layers have
    compacted into a dark, putrid sludge. Occasionally a recognizable object protrudes
    -- a buckle, a broken blade, a cracked bowl. Nothing worth touching.
  tools: Broken handles, snapped flint blades, a hammer-stone split in two. The tools
    are crude but show deliberate craftsmanship. Whatever broke them did so through
    heavy use, not carelessness.
idlemessages:
- The buzzing of flies is constant here, a droning undertone to everything.
- Something shifts in one of the refuse mounds. Settling, probably. Hopefully.
- The stench intensifies as you disturb the refuse underfoot. Breathing through your mouth does not help.
