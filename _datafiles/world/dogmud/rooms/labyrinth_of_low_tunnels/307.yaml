roomid: 307
zone: Labyrinth of Low Tunnels
title: Refuse Heap
description: The tunnel widens into a low, stinking pit that serves as the warren's
  midden. Broken tools, cracked pottery, fouled rags, splintered bones, and rotting
  scraps of unidentifiable organic matter are heaped against the walls in mounds that
  nearly reach the ceiling. The stench is extraordinary -- a physical wall of decay
  that makes your eyes water and your gorge rise. Flies cluster in black clouds over
  the worst of it. Narrow paths have been stamped through the refuse, connecting the
  exits, but the footing is treacherous and foul.
biome: cave
