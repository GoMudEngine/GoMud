roomid: 306
zone: Labyrinth of Low Tunnels
title: Gnawed Chamber
description: A wider chamber where the ceiling rises just high enough to stand hunched.
  The walls are riddled with tooth marks -- deep gouges in the basalt where something
  has been chewing the stone itself, grinding it down in long parallel grooves. Strips
  of dried meat hang from bone hooks driven into cracks overhead, dark and stiff and
  crawling with pale cave insects. The floor is sticky with old grease and scattered
  with cracked bones that have been split lengthwise for the marrow. The smell of
  cured flesh and rancid fat is thick enough to taste.
biome: cave
coord:
  x: -11
  y: 6
  z: -1
exits:
  north:
    roomid: 303
  south:
