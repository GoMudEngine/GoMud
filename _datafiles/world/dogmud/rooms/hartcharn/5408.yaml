title: The Posting Yard
description: >
  The smell of horse and harness hits before anything else — warm and
  dense, laced with straw and the honest reek of dung. The posting yard
  stretches west of the coaching inn, its packed-dirt floor churned into
  ruts by iron-shod wheels and heavy hooves. Stabling lines the north
  wall, team horses standing in fresh bedding, heads low and still.
  Two heavy <ansi fg="itemname">coaches</ansi> sit idle beneath the lean-to,
  panels road-filmed, wheel-rims thick with mud from the last run south.
  Ostlers move without hurry, hauling water and checking cinches. A long
  <ansi fg="itemname">tack rack</ansi> by the stable door holds collars,
  traces, and spare leatherwork for the next team out.
