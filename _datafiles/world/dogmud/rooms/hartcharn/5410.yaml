nouns:
  forge: A wide stone forge built into the back wall, its firepot sunk
    deep to hold a long working heat. The bellows frame stands to one
    side, its leather worn supple from daily use. Coals glow red at the
    centre and orange at the edges, and the heat coming off them is
    enough to make the air shimmer an inch from the firepot wall.
  anvil: A heavy anvil set on an oak stump, its face worn flat and bright
    from long use. Hammer marks ring the horn and heel where hot iron
    gets its final shaping. The working surface is smooth as glass at
    the centre; the edges show the chips and dents of a working life.
  slack tub: A wide iron tub half-full of water beside the forge, its
    surface dark with scale and quench dust. When hot iron enters it,
    the hiss of steam carries across the yard.
idlemessages:
- The ring of hammer on iron fills the smithy and echoes off stone.
- Sparks scatter across the floor as hot metal meets the anvil.
- The bellows exhales and the forge coals surge briefly brighter.
- The slack tub hisses as hot iron is plunged in, a curl of steam rising.
- A finished horseshoe is held to the light and turned slowly, checked.
