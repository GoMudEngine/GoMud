nouns:
  flower boxes: Window boxes run the full length of the row, each sill
    holding a different arrangement. Some are crowded with late herbs
    gone ragged, others with dried flower stems left standing for the
    seed. One box has a pot of something still green set among the
    rest, tended more carefully than its neighbours. The boxes are
    plain timber, painted and repainted until the colours have merged
    into a general weathered grey.
  pump: The pump serves the whole row, its iron handle worn bright
    from daily use and its basin stained green at the waterline. A
    wooden yoke hangs on the post beside it, sized for two buckets.
    People stop here long enough to fill what they are carrying, and
    the conversation generated by this arrangement keeps the row well
    informed. Most of what is known on this street is first known here.
  shrine: A shallow recess in the plaster between two doorways — just
    wide enough for a clay shelf. Two candle stubs stand in pooled wax
    at the front, and a knot of dried lavender lies between them, its
    colour still faintly present. A small coin sits at the back of
    the shelf, placed there with enough care that it was clearly meant
    to be. Nobody has taken it. The deity being addressed is not named,
    but the regularity of the upkeep suggests they are listening.
idlemessages:
- A door opens along the row and a woman steps out, looks once up
  and down the street, and goes back inside.
- Someone draws water at the pump — the handle squeaks on the lift
  and the water falls loud into the bucket below.
- A cat picks its way along the cottage window sill, threading between
  the flower boxes without disturbing any of them.
- A front step is being swept with a short broom, the scrape of
  bristles carrying further in the still air than it should.
- Two neighbours talk across the lane between their front doors,
  voices low, the conversation clearly about someone not present.
