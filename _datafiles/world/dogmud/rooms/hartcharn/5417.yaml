title: Cottage Row
description: >
  The north street settles into view easily — a row of snug cottages
  in pale plaster and dark timber, their window sills crowded with
  <ansi fg="itemname">flower boxes</ansi> still holding the last
  colour of the season. Swept steps and a boot-scraper at every
  threshold. A shared <ansi fg="itemname">pump</ansi> stands at the
  row's midpoint, its basin green-stained and its handle worn to a
  shine, water standing dark in the bottom. Between two doorways,
  a small <ansi fg="itemname">shrine</ansi> sits recessed in the
  plaster — a clay shelf with two burnt-down candles and a knot of
  dried flowers left by someone who passes this way often. The
  tavern lies west at the corner; the back lane runs east.
