nouns:
  shelves: Shelves run floor to rafter on three walls, their boards thick
    and rough-cut, bowed in the middle from the weight they carry. What
    is stocked covers the full range of road needs — rope in coils from
    light cord to heavy hawser, lamp oil in clay jugs, dried beans and
    salt fish, tallow candles in bundles, oilcloth folded flat, wheel
    grease in small crocks, and the iron hardware a wagon-driver cannot
    do without. The storekeeper knows where everything is; the logic is
    not obvious to anyone else.
  barrel: A wide cooperage barrel near the door, its staves well-seasoned
    and its iron bands tight. A weighted wooden lid keeps the salted fish
    inside. The brine smell is strong enough to notice from a step away.
  scales: A set of brass pan scales at the counter, well-balanced and
    polished to a dull gleam. The weight set beside them runs from a
    quarter-ounce to two pounds. Dry goods sold by measure are weighed
    here — salt, dried beans, grain flour, and the like.
idlemessages:
- Something shifts on the shelves with a soft wooden knock, settling.
- The smell of lamp oil and rope drifts through the room in waves.
- Dust motes drift through the light from the front window, undisturbed.
- The weighted lid on the fish barrel lifts briefly, then settles back.
- The brass scales swing faintly on their pivot, finding their level.
