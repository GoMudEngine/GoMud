roomid: 5411
zone: Hartcharn
title: The General Store
description: >
  The mingled smell of the store hits at the threshold — rope, lamp oil,
  dried herbs, beeswax, and smoked meat all pressed together in a space
  too small for everything it holds. Bowed <ansi fg="itemname">shelves</ansi>
  line every wall from floor to rafter, creaking under the weight of
  crates, bundles, crocks, and sacks. A <ansi fg="itemname">barrel</ansi>
  beside the door holds salted fish under a weighted lid. A worn counter
  spans the far end of the room, and brass <ansi fg="itemname">scales</ansi>
  at the centre handle dry goods sold by measure — salt, beans, and
  grain weighed out to order.
biome: city
