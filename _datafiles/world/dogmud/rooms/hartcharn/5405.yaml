title: The Coachman's Rest
description: >
  The Coachman's Rest fills the whole north side of the market
  square — three storeys of heavy timber framing and whitewashed
  render, the upper floors cantilevered out on stout oak brackets
  above the entrance. A painted <ansi fg="itemname">sign</ansi> hangs
  from a wrought-iron arm over the arched doorway — a coach-wheel in
  gold leaf on deep green, the inn's name scrolled beneath in bold
  lettering. Brass lamp-brackets flank the broad door, each holding
  a glass-paned lantern whose flame keeps the threshold warm against
  the road-dust settling off the square. The deep murmur of voices
  and the scrape of benches press faintly through the walls. To the
  west, the coaching yard rings with iron-shod wheels on cobblestone
  and the calls of ostlers working teams free of their traces. The
  door east leads into the inn proper.
