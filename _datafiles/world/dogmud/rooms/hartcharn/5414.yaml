title: Weavers' Row
description: >
  The clack and thud of a loom reaches you before you are properly
  into the row — a working rhythm from the open door of the weaving
  cottage on your left, broken by the creak of the heddle and a
  brief pause before it picks up again. Weavers' Row is a plain run
  of townhouses built side by side on the west fringe of the street
  grid — whitewashed lower walls, tiled roofs pitched low against
  the wind, a shared alley between them that gets no sun. Lines of
  <ansi fg="itemname">washing</ansi> hang between the upper gables on
  both sides — shirts, linen, and heavier cloth all pegged out and
  moving slowly in the air. A <ansi fg="itemname">loom</ansi> sits
  visible through the open cottage door, its heddle raised mid-pass
  and a length of half-finished cloth across the breast beam. A
  tabby cat is stretched across a stone <ansi fg="itemname">step</ansi>
  in a patch of warmth, one ear tracking the street.
