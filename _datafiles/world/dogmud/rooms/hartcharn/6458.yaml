nouns:
  jeweler bench: A narrow workbench lit by the window above it, its
    surface scattered with tiny files, pliers, and a scattering of
    polished stone chips too small to bother sweeping up.
idlemessages:
- Light catches briefly on a tray of polished stones.
- A coil of fine wire glints where it rests on the bench.
- The magnifying lens sways very slightly on its brass stand.
- Somewhere a small file rasps once against metal, then stops.
