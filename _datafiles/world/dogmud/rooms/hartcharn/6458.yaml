title: The Gem Hut
description: >
  A tidy little hut with a single well-lit workbench set beneath the
  window. Trays of polished stones and coils of thin wire are arranged
  in careful rows, and a magnifying lens on a brass stand looms over
  the bench like a patient onlooker. The floor is swept bare of the
  usual hill-town grit, kept clean for the small, easily-lost pieces
  that pass across the bench each day.
