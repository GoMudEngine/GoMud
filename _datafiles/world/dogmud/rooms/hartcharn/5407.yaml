title: The Coachman's Rest, Lodging Wing
description: >
  Beyond the common room door, the noise drops to a murmur and then
  to almost nothing. The lodging wing runs east in a corridor of low
  ceilings and bare boards, a strip of worn runner-cloth down the
  center muffling footsteps. Numbered doors line both walls at close
  intervals — each one solid planked timber with a plain iron latch.
  The air holds clean linen and tallow wax, with an undersmell of
  sawdust and old rope that no amount of scrubbing quite shifts. A
  single lamp at the corridor's far end keeps the last few doors in
  soft amber half-dark. A <ansi fg="itemname">washstand</ansi> sits in
  the alcove beside the stairhead, its basin and ewer in plain white
  ceramic. A small <ansi fg="itemname">window</ansi> at the hall's end
  looks out over the coaching yard below.
