title: North Market Street
description: >
  The noise of the square softens as the street runs north — fewer
  stalls and fewer voices, the cobbles a little less worn underfoot.
  A mixed run of buildings lines either side — part shopfront, part
  dwelling, some hard to tell at a glance. A narrow cooper's shed
  sits behind patched gates; a chandler's has its shutters propped;
  two plain row-houses look out from upper windows over the street.
  A stone <ansi fg="itemname">trough</ansi> is set flush into the kerb
  on the east side, fed by a pipe in the wall that drips a slow thread
  of water — worn pale around the rim by daily use. A short
  <ansi fg="itemname">lane</ansi> cuts east between the end-gables, and
  a matching gap to the west opens between a close row of townhouses.
  The street pushes on northward into quieter residential blocks.
