nouns:
  trough: A long stone trough set into the kerb and fed by a pipe
    drilled through the wall of the house behind it — a slow drip
    keeps the basin from going dry. The rim is worn pale and smooth
    from years of hands guiding buckets and animals to drink. The
    water is clear enough at the centre; a film of dust and debris
    gathers at the near end, rinsed out when the flow is good.
  lane: The short lane east is barely a cart-width — cobbled for the
    first few yards and then earthen, bounded by the end-gable of the
    chandler's on one side and a garden wall on the other. It opens
    out toward a quieter spur off the main street. A good deal quieter
    here than the road itself.
  shopfronts: The buildings along this stretch of street mix commerce
    and home without much separation — a workshop running straight
    into living quarters above, a stall-front bolted shut against a
    house-wall that clearly still has people in it. The line between
    trade and residence dissolved here long before anyone thought to
    draw it.
idlemessages:
- A woman crosses the street with a yoke across her shoulders, two
  pails swinging, heading for the <ansi fg="itemname">trough</ansi>.
- A child darts out of a doorway, pelts north a few paces, then
  turns back as a voice calls from inside.
- A cat picks its way along the top of the garden wall to the west,
  pausing to watch the street below.
- The chandler's shutters bang once in a passing gust, then settle
  back against the wall.
- A cart comes south down the street, wheels loud on the cobbles,
  until the driver pulls over to let someone pass.
