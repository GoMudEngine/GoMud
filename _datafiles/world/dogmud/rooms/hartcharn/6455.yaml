nouns:
  loom: A broad standing loom, its heddles and treadles worn shiny where
    hands and feet have worked them for years. A half-finished length of
    grey wool cloth stretches taut across the beam, the shuttle resting
    where it was last set down.
idlemessages:
- The loom's treadles creak in a steady, practiced rhythm.
- A skein of wool sways gently on its peg in the draft.
- Lint drifts through a shaft of light from the open doorway.
- The shuttle clacks across the warp and back again.
