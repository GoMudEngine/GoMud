title: The Weaving Shed
description: >
  A long, low shed with a plank floor worn smooth by years of shuttling
  feet. The <ansi fg="itemname">loom</ansi> dominates the far wall, its
  frame dark with age and its heddles strung tight as fiddle strings.
  Skeins of undyed wool hang from pegs along the rafters, drying in the
  draft that slips under the eaves. The smell of raw fleece and warm
  timber fills the room, and a thin layer of lint drifts in the light
  from the open door.
