title: The Town Common
description: >
  The green opens wide at the town's north end — a broad patch of grass
  kept short by <ansi fg="itemname">geese</ansi> that work it in loose
  formations, honking at intervals with the easy authority of long custom.
  Children chase the flock through the middle and scatter as a drover
  shoulders past with a trailing rope and mild suffering in his face. At
  the center of the green stands an <ansi fg="itemname">elm</ansi> old
  enough that its lower bark has swallowed two branch-stubs whole, its
  trunk papered in notices and handbills nailed up in overlapping layers.
  Along the margins resting drovers sit beside staked animals — goats
  cropping what the geese left, mules ignoring everything. The arch of
  the north gate shows across the far end of the green; the well yard
  opens west, and the wagon camp's dust rises to the east.
