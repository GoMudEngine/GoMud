nouns:
  geese: A raucous mob of grey geese own the common by long precedent,
    moving wherever they choose and challenging anyone who crosses their
    path with outstretched necks and credible intent. The children of
    the north end treat them as both obstacle and sport. The geese do
    not acknowledge this arrangement.
  elm: The elm predates the wall by a generation — its lower branches
    were swallowed by the growing bark years ago, leaving smooth-edged
    scars in the trunk. Notices have been nailed up in overlapping layers,
    the oldest so weathered the writing has gone. A root arches away from
    the base, and the hollow beneath it holds a scatter of small stones
    placed by children, a weathered ribbon, and a folded scrap of oilcloth
    tucked into the dry earth inside.
idlemessages:
- A goose cuts straight across the common, scattering children from its path.
- Wind stirs the notices on the elm, one corner curling loose from its nail.
- A drover calls a name across the green — the mules do not look up.
- The geese drift to the far end of the common in a slow, complaining tide.
- A child works a stone free from the elm's hollow and is chased off at once.
