roomid: 5416
zone: Hartcharn
title: Back Lane
description: >
  The smell tells the story — midden, wet ash, and the green tang
  of moss on damp stone. This is the narrow cut behind the cottage
  row — the route for slop buckets, ash pits, and everything that
  belongs away from the front street. Into the angle of the nearest
  wall is stacked a <ansi fg="itemname">woodpile</ansi>, timber
  split and roughly sorted, the cut ends still pale. Farther along,
  a <ansi fg="itemname">crock</ansi> with a weighted stone lid sits
  under the overhang of a back door, the brine smell making its
  contents fairly plain. A dog chained to the far wall has been
  watching since you arrived.
