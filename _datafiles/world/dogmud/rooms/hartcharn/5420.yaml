roomid: 5420
zone: Hartcharn
title: The Well Yard
description: >
  The sound of the <ansi fg="itemname">well</ansi> reaches you before
  the yard does — the iron chain paying out, the bucket striking water
  far below, then the long groan of the windlass hauling it back heavy.
  The yard is a paved square off the common, its stones worn smooth and
  damp in the shadow of the surrounding buildings. A stone
  <ansi fg="itemname">trough</ansi> runs along the east wall for washing
  and watering animals, fed by a clay pipe that weeps at the join. Women
  of the north end have claimed the yard's benches and coping stones as
  their particular forum — gossip moves here the way freight moves on
  the road north, in both directions at once. A battered
  <ansi fg="itemname">basket</ansi> sits unattended on a bench near the
  trough, its owner presumably drawn off into the conversation.
