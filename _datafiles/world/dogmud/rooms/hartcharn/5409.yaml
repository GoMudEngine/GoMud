title: The Ferry and Coach Agent
description: >
  After the noise and smell of the posting yard, the agent's office is
  startlingly quiet. The room is small and low-ceilinged, its walls
  panelled in dark timber that has absorbed years of pipe smoke. The
  <ansi fg="itemname">routes board</ansi> covers most of the back wall
  — ink on aged linen, pinned flat with brass tacks, its columns recording
  fares and travel times in a small and precise hand. Below the window,
  a broad desk is heaped with <ansi fg="itemname">ledgers</ansi> and
  red-taped correspondence, the paper edges worn soft with handling. An
  iron strongbox sits padlocked to the floorboards beneath the desk,
  square and going nowhere.
