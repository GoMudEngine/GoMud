nouns:
  enchanting circle: A wide chalked circle covering most of the floor,
    its lines re-traced so many times over the years that the boards
    beneath have worn to a paler grain. Small scorch marks freckle its
    edge where a working has gone slightly wrong.
idlemessages:
- The chalk lines of the circle seem to catch the light strangely.
- A tray of chrysalis shards clicks faintly as one shifts against another.
- The thin blade of daylight from the window creeps slowly across the floor.
- Something smells faintly of scorched wax, though nothing is burning.
