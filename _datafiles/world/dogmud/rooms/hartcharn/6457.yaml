title: The Rune-Carver's Hut
description: >
  A dim, close hut smelling faintly of scorched wax and hot metal. A
  chalked <ansi fg="itemname">enchanting circle</ansi> covers most of
  the floor, its lines worn and re-drawn so many times the boards
  beneath show through in places. Shelves along the wall hold trays of
  chrysalis shards and coils of fine wire, each sorted with obsessive
  care. A single shuttered window lets in a thin blade of daylight that
  cuts across the circle's edge.
