roomid: 6459
zone: Hartcharn
title: The Cookhouse
description: >
  A warm, smoky room built around a wide stone
  <ansi fg="itemname">cooking fire</ansi>, its chimney drawing the
  worst of the smoke up through the thatch. Strings of dried herbs and
  hanging pots crowd the low rafters, and a scarred table along one
  wall holds a row of covered crocks. The smell of woodsmoke and
  simmering broth fills the room, thick enough to cling to a coat
  after only a few minutes inside.
biome: city
