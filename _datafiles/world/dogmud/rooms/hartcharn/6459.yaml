nouns:
  cooking fire: A wide stone hearth banked with glowing coals, a black
    kettle hung over it on an iron arm. Soot streaks the stone above it
    in a long dark fan reaching toward the chimney draw.
idlemessages:
- The cooking fire pops and settles beneath the kettle.
- Woodsmoke curls up toward the chimney draw.
- A covered crock on the table gives off a faint simmering smell.
- Something in the kettle bubbles once, low and slow.
