roomid: 5406
zone: Hartcharn
title: The Coachman's Rest, Common Room
description: >
  The smell arrives before your eyes adjust — woodsmoke and rendered
  tallow and the deep savour of something long on the boil, all of
  it worked so far into the beams overhead that it would take an age
  to air out. Long trestle tables fill the room in two close rows,
  every bench crowded with travelers, carters, and road-worn locals
  comparing the road south with the last place they slept. A great
  stone <ansi fg="itemname">hearth</ansi> dominates the far wall, its
  fire built high and hot, iron pots hanging on a spit-arm above the
  flames, grease dripping into the coals with a steady hiss. Behind
  a worn timber counter, an innkeeper moves without pause — filling
  cups, settling accounts, cutting bread from a long loaf with a
  blade worn smooth from use. A <ansi fg="itemname">board</ansi> is
  pinned to the pillar nearest the counter, thick with folded papers,
  road notices, and messages left for travelers passing through.
  The door east leads to the lodging wing.
