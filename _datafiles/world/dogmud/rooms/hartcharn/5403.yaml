title: Lower Market Street
description: >
  The street finds you by sound before you find it — a hawker
  calling prices over cart-noise and cobbles, the steady knock
  of a cooper's mallet from somewhere behind the shopfronts, and
  under it all the low constant murmur of a place that has its own
  business and does not need yours. Lower Market Street climbs
  north from the gate toward the square, a moderate pitch with a
  central gutter worn by rain and runoff. Canvas awnings shade
  trestle tables on either side — cured meats, dried pulses, rope,
  nails, cooking pottery, and the kind of rough clothing a traveler
  ruins in the first week and must replace. To the east, a painted
  sign marks the general store. A battered
  <ansi fg="itemname">handcart</ansi> sits against the wall to one
  side, its plank bed stacked with crated goods that still want
  unloading; the <ansi fg="itemname">stalls</ansi> on either side
  run on up the slope toward the square.
