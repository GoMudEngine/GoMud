title: The Apothecary's Hut
description: >
  A cramped, fragrant hut lined with shelves of jarred roots and bundled
  herbs. The <ansi fg="itemname">alchemy bench</ansi> takes up most of
  the floor space, its surface scarred by spilled tinctures and old
  burns. Dried bundles of hill sage and marsh-mint hang from the low
  rafters, and a kettle simmers quietly over a bed of coals in the
  corner. The air is thick with the smell of crushed leaves and
  something faintly medicinal underneath.
