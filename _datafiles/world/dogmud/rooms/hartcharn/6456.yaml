nouns:
  alchemy bench: A stained wooden bench crowded with mortars, pestles,
    and a rack of small clay jars. Dark rings mark where countless
    tinctures have been left to cool, and a set of brass scales sits
    bolted to one corner.
idlemessages:
- A kettle simmers quietly over the coals in the corner.
- The smell of crushed hill sage drifts from a bundle overhead.
- Something in a clay jar bubbles once, then settles.
- Dried herbs rustle faintly as the draft moves through the rafters.
