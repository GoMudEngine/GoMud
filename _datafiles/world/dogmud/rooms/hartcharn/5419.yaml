title: Hartcharn, North Gate
description: >
  The road passes through the gate arch and out of Hartcharn into open
  country that stretches north as far as the light allows. The town wall
  rises on either side of the <ansi fg="itemname">gate</ansi> — dressed
  stone and heavy timber, the gates banded in iron and built to close
  this end of town against anything short of a siege. A gatekeeper's
  booth stands to one side, its shutters open for the day's traffic.
  To the right of the arch, a <ansi fg="itemname">milestone</ansi> of
  dressed stone lists the distances ahead — TOLLFORD CROSSING at four
  leagues, NEW PLYMOUTH at eighteen — cut in capitals and filled with
  white lead so they hold in any weather. Beyond the gate the road runs
  straight, raised on a low berm above the flanking fields, and heads
  north toward the river country of Greywater Flats, which begins where
  the road drops below the horizon.
