title: Hartcharn, South Gate
description: >
  Woodsmoke reaches you before the gate does — rich and resinous,
  laced with something fatty on a fire and the warm yeast of bread.
  After the empty scrub-country, the smell alone is enough to loosen
  a knot you forgot you were carrying. The south gate of Hartcharn
  stands open in its mortared fieldstone arch, a low wall of fitted
  stone running east and west — not much of a fortification, just a
  line that means you have arrived somewhere real. Voices drift down
  from the streets above, and the creak of a laden coach carries from
  further in the town. To one side of the arch a gatekeeper's post
  holds a burning lantern. Beside it, a pine
  <ansi fg="itemname">toll board</ansi> is chalked with rates for
  carts, livestock, and trade goods. The <ansi fg="itemname">road</ansi>
  south falls away fast into the pale flat scrublands — you can still
  see the empty country you came through, already looking farther than
  it felt.
