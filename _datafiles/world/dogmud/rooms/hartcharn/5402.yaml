nouns:
  gate: A mortared arch of grey fieldstone, the jambs worn smooth
    where the gate's timber frame once swung — the hinges are still
    there, iron pintles sunk into the stone, but the doors themselves
    were long since taken for something else. The arch is low enough
    that a rider must duck. Lantern hooks flank it on both sides;
    one holds a burning lamp, the other is empty, its hook bright
    from handling.
  toll board: Wide pine boards nailed to a frame beside the gate,
    their surface chalked over and re-chalked until the wood has gone
    pale with ghost letters. The current hand is neat and deliberate
    — rates for two-wheel carts, four-wheel wains, and loose livestock
    by the head, with a line at the bottom for trade goods and sundry.
    Above the rates, older notices are tacked in layers — a lost grey
    mare from three weeks back, a note about road repairs north of
    town, and one small card that reads simply "New Plymouth — inquire
    within."
  road: Looking south through the gate arch, the road dwindles fast
    into the scrublands — a pale chalk line across pale flat earth,
    no trees, no shade, the horizon utterly empty. The town sounds
    fade the further your eye travels. You came a long way to get here.
idlemessages:
- A wagon rolls through the gate from the south, its axle groaning
  under a load of bundled hides.
- The lantern at the gatekeeper's post flickers as a breeze funnels
  through the arch.
- A dog noses at the base of the gate arch, then trots north into
  town without looking back.
- Voices from the streets above swell for a moment — someone calling
  a name, someone answering — then settle.
- A traveler passes through heading south, pack high and hat pulled
  low against the wind.
