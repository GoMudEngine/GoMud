title: The Tap and Trough
description: >
  The smell hits before your eyes adjust — stale ale worked into every
  board, cheap tallow smoke, and the warm fug of bodies under a ceiling
  that was never high. The Tap and Trough is the town's own place, not
  the coaching inn's annex, and it makes no effort to look otherwise.
  A <ansi fg="itemname">bar</ansi> of rough planks spans the far wall,
  the taps worn dull and the counter edge dark from a generation of
  elbows. Three men hold the far corner — a dice game on an upturned
  barrel, a running argument in voices too low to catch, the kind of
  disagreement that has been in progress for years. A scrawled
  <ansi fg="itemname">board</ansi> beside the entrance holds notices
  in a dozen hands — debts, scores, and grievances not yet settled.
