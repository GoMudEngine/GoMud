roomid: 5413
zone: Hartcharn
title: Temple Lane
description: >
  The smell of candle-wax and something faintly resinous reaches you
  before the shrine itself comes into view — carried on still air in
  a lane barely wide enough for two people walking abreast. Hartcharn's
  small <ansi fg="itemname">shrine</ansi> occupies a widened end at the
  lane's terminus — no grand temple, just a deep alcove cut into the
  stone and fitted with a vaulted canopy of weathered ashlar. Votive
  candles burn on a ledge inside — a handful at different heights,
  their light pooled together in the dim recess. The lane's worn
  <ansi fg="itemname">step</ansi> at the threshold is hollowed in the
  centre by generations of feet pausing here before entering. No
  sound carries in from the street beyond; the lane holds its quiet
  as though it always has.
