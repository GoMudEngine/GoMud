nouns:
  well: A circular well of mortared river-stone, chest-high, the
    cap worn into two smooth crescents where generations have leaned
    to work the rope. The bucket is of oak banded in iron — heavy
    enough not to wander — and a long-handled iron dipper hangs from
    a peg on the south face for anyone who needs only a drink.
    Looking down the shaft, the water is dark and still and closer
    than you expect.
  notice board: A broad frame of weathered pine on an iron post,
    its surface a palimpsest of chalked schedules, tacked notices,
    and cards pinned with small nails. A chalk column lists the coach
    departure times north toward New Plymouth and south toward the
    road into the empty country — updated each morning and amended
    through the day in a different hand. Below it, a wages column
    — road gangs, farm crews, a drover outfit short two hands.
    At the corner, a town notice warns of wolves seen on the north
    approach. One small card stands apart in a cleaner hand — passage
    rates to New Plymouth, with a room number at the coaching inn.
  coaching inn: The inn faces the square from the north end — a
    two-storey timber-and-stone building, wide as it is solid, with
    a painted sign above the broad door and a lamp burning in both
    front windows even at midday. A hitching post runs along its
    southern face. The smell of smoke and cooked meat drifts from
    the open door even at this distance.
  smithy: The source of the steady ringing from the east — a low
    stone building with wide doors thrown open to the square, the
    interior warm and orange with forge-glow. The hammering comes
    in triplets — two light, one heavy — then a pause, then again.
    Even at this distance you can feel the heat when the wind shifts.
idlemessages:
- A coach team swings into the square from the north road, its
  iron-shod wheels cracking loud on the cobbles.
- Someone at the well lets the bucket drop a little too fast — a
  crack of rope on stone, and water sloshes over the lip.
- The smithy's hammer rings east in three measured beats, then falls
  quiet for a long moment, then starts again.
- Two travelers stand at the notice board, one tracing a line with
  a finger while the other makes a note on a scrap of paper.
- A drover fills a leather cask at the well trough, talking to his
  horse in a low and steady murmur.
