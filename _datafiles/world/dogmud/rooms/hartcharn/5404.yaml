title: Market Square
description: >
  The square opens after the pinch of the street like a breath
  let out — cobblestones worn smooth by ten thousand wheels and
  twice that many boots, and above it a sky unbroken by rooflines
  for the width of a city block. This is Hartcharn's heart, the
  place everything converges. A stone <ansi fg="itemname">well</ansi>
  stands at the center, its capped lip polished bright by the lean
  of hauling arms, and it draws a slow steady traffic of townsfolk,
  drovers, and travelers filling cups, casks, and horse-troughs.
  The coaching inn stands to the north, its broad door propped open
  and a lamp burning in the noon window — the road's end for anyone
  who made it this far on foot. East, the ring of a smithy carries
  across the cobbles in measured triplets. West, a narrow door bears
  a painted coach-wheel above its lintel. Between the well and the
  north road, a heavy iron-posted
  <ansi fg="itemname">notice board</ansi> is papered and chalked
  with the business of the town.
