title: The Hartcharn Strongbox
description: >
  A small stone-walled room built into the hillside, cooler than the
  shops above it and smelling faintly of old iron. A squat
  <ansi fg="itemname">strongbox</ansi> sits bolted to the floor behind
  a plain counter, and a single narrow window lets in just enough light
  to read a ledger by. Hill-town gold does not amount to much, but what
  there is of it rests here, locked down tight and watched close.
