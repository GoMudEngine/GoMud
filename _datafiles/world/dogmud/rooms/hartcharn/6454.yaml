nouns:
  strongbox: A squat iron strongbox, its lock a heavy long-shank
    mechanism gone dull with age. It is bolted through the floorboards
    into the stone beneath, and does not budge when nudged.
idlemessages:
- The strongbox sits heavy and silent behind the counter.
- A narrow beam of daylight creeps slowly across the stone floor.
- Somewhere in the wall, the hillside settles with a faint tick.
- The counter's surface is cool and bare beneath one hand.
