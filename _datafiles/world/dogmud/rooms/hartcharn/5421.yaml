nouns:
  wagons: Heavy freight wagons built for distance rather than comfort —
    iron-rimmed wheels, thick timber sideboards, canvas covers lashed
    with hemp cord in a running knot. Chalk tallies on the boards mark
    the loads — most are northbound, carrying salt fish and woven cloth
    from the south, bound for the river towns past Tollford Crossing.
    One carries a crated something that its driver will not discuss.
  oxen: A string of broad-shouldered draught oxen standing in rope at
    the camp's far end — built for wagons rather than ploughing, their
    horns tipped with iron knobs to keep them from goring one another
    in harness. They look ancient, patient, and wholly indifferent to
    the activity around them.
  supply cache: A heap of road gear stacked against the wall near the
    cookfires — oilskin bags in various sizes, two iron-bound chests,
    spare wheel-hubs, and a coil of lashing cord. The larger chest has
    a dent suggesting it has served as a seat far more often than as a
    lockbox. It is not, at the moment, locked.
idlemessages:
- An ox shifts weight and the rope line creaks the length of the string.
- Woodsmoke drifts across the camp from the cookfires, smelling of pine.
- A teamster thumps a wheel-hub with a mallet, listening to the note it makes.
- Two drivers argue over road conditions north, neither conceding a point.
- Canvas snaps against a wagon frame as the wind catches a loose corner.
