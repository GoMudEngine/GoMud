zone: Hartcharn
title: The Wagon Camp
description: >
  The smell gets here first — ox and dung and woodsmoke and the sharp
  mineral edge of fresh axle grease. The wagon camp is a wide dusty lot
  just inside the north wall, its packed earth rutted by iron rims and
  the hooves of draught animals resting in the shadow of their loads.
  Heavy <ansi fg="itemname">wagons</ansi> stand in rows, canvas covers
  lashed tight over freight bound north, chalk tallies on the sideboards
  noting cargo and consignee. A string of broad-shouldered
  <ansi fg="itemname">oxen</ansi> stands in rope at the far end, switching
  tails with the patience of animals who have made this stop many times.
  Teamsters work between the rows — checking wheel-hubs, tightening lash,
  comparing notes on the state of the road. Near the wall a teamster's
  <ansi fg="itemname">supply cache</ansi> of oilskin bags and iron-bound
  chests sits between two cookfires already lit against the early chill.
