nouns:
  barrier: A weighted timber beam — a span of squared white-oak
    painted with alternating red and white bands, hung at one
    end on a pivot post and counterweighted with a leather sack
    of river stones at the other. The keeper raises it by a
    short pull on a rope; when released, the weight drops the
    beam back across the road in a single smooth arc. The paint
    at the middle is worn thin from ten thousand handholds —
    travelers steadying themselves while digging for coin. One
    band bears the painted word TOLL in black lettering, just
    legible under the weather-fade.
  strongbox: A heavy iron coffer bolted through the counter
    plank and into the tollhouse floor joists — it does not
    shift when you test it. The top has a coin slot wide enough
    for a stack of coppers and nothing more. The sides are plain
    hammered iron, no lock visible from outside; a second key
    and bottom access must come from inside the building. The
    surface is cold to the touch and worn bright at the edges
    where hands have brushed past it over many seasons of use.
  tollhouse: A single-room cedar building just wide enough for
    its counter, a stool, a ledger shelf, and a narrow sleeping
    bunk folded against the back wall. The shutter facing the
    road doubles as the service counter — propped up on a stick,
    it turns the opening into a window with a lip just right for
    resting your purse while you count coin. A candle lantern
    hangs from the rafter above. Worn into the door frame with
    long use is the carved shape of a hand holding three coins —
    the tollkeeper's guild mark, or a private joke.
idlemessages:
- The barrier swings up smoothly on its rope and drops back
  with a clack as a traveler clears through.
- The keeper makes a mark in the ledger without looking up,
  three coppers disappearing through the strongbox slot.
- A wagon driver argues the livestock rate for a moment, then
  pays without real conviction and flicks the reins.
- Flies work the warm air near the livestock lane below the
  barrier, circling the gate post.
- A road-worn traveler ahead of you shifts weight from foot to
  foot, one hand already working open a coin pouch.
