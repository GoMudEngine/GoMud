roomid: 5375
zone: North Road North
title: The Tollgate
description: >
  A striped <ansi fg="itemname">barrier</ansi> pole spans the
  road at chest height — red-and-white paint worn thin at the
  midpoint, its weighted end resting in a notched cradle beside
  the verge. The <ansi fg="itemname">tollhouse</ansi> is a
  narrow cedar building set against the west bank, barely wide
  enough for a counter and a stool; through the open service
  shutter a keeper works without fuss — two coppers per foot
  traveler, four per horse, eight per loaded wagon — and drops
  each coin through the slot of a heavy iron
  <ansi fg="itemname">strongbox</ansi> bolted to the counter
  board. A chalked toll board above the shutter repeats the
  figures in tall letters, legible from the back of the queue.
  A short line of travelers waits without argument; road dust
  and the warm smell of the livestock lane below the barrier
  mix in the still morning air.
