title: The Lake & Ladle, Common Room
description: >
  The noise finds you first — voices layered on voices, a hand
  of cards slapping down on the back table, the steady crack
  and sigh of the hearth fire. Then the warmth rolls in behind
  it, dense and low, carrying woodsmoke and rendered drippings
  and the heavy, meaty scent of a pot of stew that has been
  going since noon. The Lake and Ladle's common room is wide
  and low-beamed, its oak rafters dark with old smoke; trestle
  tables fill most of the floor, holding tonight's usual crowd
  — drovers eating without looking up, a pair of merchants bent
  over an unrolled map at the middle table, a lean traveler who
  has not moved from her seat by the wall since before dark.
  The <ansi fg="itemname">hearth</ansi> commands the far end of
  the room, wide enough to roast an ox, a cauldron swinging low
  over banked coals on an iron arm; the innkeeper works her
  <ansi fg="itemname">counter</ansi> just beside it, moving
  through the evening's orders with the efficiency of long
  habit. A broad <ansi fg="itemname">notice board</ansi> hangs
  beside the outer door, dense with traveler notices and a
  week-old market sheet from Thornwall.
