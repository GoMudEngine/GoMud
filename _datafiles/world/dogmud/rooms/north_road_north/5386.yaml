zone: North Road North
title: The Wind's Reach
description: >
  The wind hits here without warning and without end — a steady
  pressure against the chest, cold-edged despite the season,
  coming from the north across miles of unbroken country with
  nothing to slow it. It tugs at clothing and pulls at loose
  edges and fills the ears with a constant low tone that makes
  conversation difficult. The road crosses an exposed rise here,
  flat-topped and bare, the last of the sage thinned to
  knee-height by the wind-scour and the
  <ansi fg="itemname">basalt</ansi> showing through the thin
  soil in long grey shelves. A <ansi fg="itemname">marker
  post</ansi> leans at the road's edge, weathered down to bare
  grey wood, whatever painted sign it once held long since
  stripped by the wind and the freeze-thaw of high-country
  winters. There is no shelter here. There is no company. The
  road runs north and disappears into the wind.
