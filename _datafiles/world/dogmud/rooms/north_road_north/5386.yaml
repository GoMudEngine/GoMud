nouns:
  marker post: A post of old hardwood, grey and surface-checked
    from years of wind and freezing, leaning slightly south as
    though pressed there by the prevailing north wind. Whatever
    information it once carried has been stripped away — no
    paint, no lettering survives on the weathered grain. The
    post is anchored well, the ground-level wood rotted but the
    core still holding; it will stand another generation before
    it goes. Someone has looped a length of faded rope around
    it at head-height, the ends trailing, purpose unclear. The
    wind worries at the rope ends constantly.
  basalt: Long shelves of bare basalt push through the thin
    soil here, grey and lichen-patched, their surfaces broken
    into plates by generations of freeze-thaw. The wind blows
    clean across the exposed shelves, lifting a fine grit and
    carrying it south. In a wet year the cracks would hold
    moss; now they are dry and gritty, their edges sharp enough
    to cut. The south-facing surfaces carry a reddish iron
    staining, old as the basalt itself — the rock has always
    looked this way out here.
  wind: The wind here comes from the north across dozens of
    miles of open country before it reaches this road, unbroken
    and unslowed. It carries the cold of higher ground and the
    dry mineral smell of distance — dust and nothing, the scent
    of country no one lives in. It is not a gust; it does not
    stop between gusts. It is a constant steady pressure, the
    defining fact of this stretch of road. Travelers lean into
    it instinctively and correct their posture when they stop.
idlemessages:
- The wind rises for a moment, colder off the north country,
  then settles back to its constant baseline pressure.
- A piece of grit hits the face, sharp and brief, carried
  here from somewhere much further north.
- The rope ends on the marker post thresh back and forth in
  steady rhythm, driven by a wind that will not tire.
- A dust-devil spins up from the basalt shelf to the east,
  travels thirty feet, and collapses.
- Silence is not available here. The wind sees to that.
