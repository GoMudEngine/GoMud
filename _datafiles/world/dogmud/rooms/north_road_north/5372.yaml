nouns:
  hedgerow: Tall hawthorn and elder, chest-high and interlocked,
    woven into a dense wall along both verges. The hawthorn is
    past fruiting; what berries remain are dark and wrinkled,
    taken slowly by birds through the autumn. Old growth — some
    stems are thick as a wrist, and nothing pushes through
    without collecting thorns. A cold draft threads through the
    branches from the direction of the lake.
  lakeview: The gap in the eastern hedge gives a clean look back
    south — Stillwater's rooftops stepping down toward the shore,
    the lake itself a bright band of silver-grey, and the dark
    cedar arch of the North Gate half-visible at the road's
    southward bend. Another minute of walking north and the
    hedgerow closes and this view ends.
idlemessages:
- The town bell tolls the hour behind you, muffled and already
  farther away than it sounds.
- A cart rattles through the arch behind you, its wheels loud
  on the fresh gravel.
- The lake-wind pushes cold through the gap in the eastern
  hedge, carrying the smell of the water.
- Two <ansi fg="mobname">sparrows</ansi> chase each other through
  the hawthorn, scolding shrilly.
- The last sounds of the square fall away behind a bend in the
  hedgerow.
