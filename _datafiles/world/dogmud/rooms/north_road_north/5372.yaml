roomid: 5372
zone: North Road North
title: Stillwater's North Verge
description: >
  The sounds of Stillwater — the square's low murmur, the bell
  on the lakefront — thin quickly behind you once you clear the
  arch. The road is pressed gravel now, the town paving ending
  just south at the gate; here the lane runs between tall
  <ansi fg="itemname">hedgerows</ansi> of hawthorn and elder
  that close the verge to arm's reach on both sides. The
  lake-wind still pushes this far, carrying the cold iron smell
  of the water. A gap in the eastern hedge frames the last clear
  <ansi fg="itemname">lakeview</ansi> a northbound traveler
  gets — Stillwater's rooftops stepping down toward the shore,
  the water itself a band of silver-grey under the open sky.
