title: The Mire Cutoff
description: >
  The smell reaches you before the footing changes — cold water,
  black peat, and the sweet-rot edge of bog vegetation, pushed
  low by the draft from the reed beds along the west verge.
  Underfoot it gets worse: two parallel <ansi fg="itemname">ruts</ansi>
  pressed deep into clay that never fully drains, the ground
  between them poached to a soft grey paste by foot traffic and
  webbed with standing water. A dense stand of
  <ansi fg="itemname">reeds</ansi> crowds the western shoulder,
  their dry stems buzzing faintly with midges in the morning
  cold. A broken <ansi fg="itemname">wheel</ansi> lies half sunk
  in the ditch beside them — iron tire rusted, spokes rotting
  into the peat — a quiet argument for paying the two coppers
  instead. The tollgate is invisible behind the hedge from here
  but its barrier clacks faintly across the field each time it
  swings.
