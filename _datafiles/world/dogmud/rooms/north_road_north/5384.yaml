title: The Old Waystone
description: >
  The road runs straight here, a pale ribbon across open
  scrubland, and the eye catches on the waystone before anything
  else — it is the only vertical thing for half a mile in any
  direction. The stone stands at the road's east verge, waist-
  high and tilted slightly toward the south as though the earth
  beneath has been slowly shifting for centuries. Its surface
  is basalt-grey, its carvings worn nearly smooth by weather
  and hand-touch — symbols older than the road, their meaning
  lost, their outlines surviving only as shallow grooves traced
  more by feel than sight. Travelers have been leaving things
  at its base for as long as the stone has stood — a scatter
  of small <ansi fg="itemname">offerings</ansi> sits tucked
  against the stone's foot, smooth river pebbles and a
  tarnished coin and a stub of wax candle and a folded scrap
  of cloth with something written inside. Names and rough
  scratches crowd the lower face where the carvings end.
  Examine the <ansi fg="itemname">waystone</ansi> itself and
  the country around it stretches sage and still to every
  horizon.
