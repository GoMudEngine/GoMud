nouns:
  waystone: The stone is older than the road by a wide margin —
    basalt, worked into a rough column shape by hands that left
    no clear signature in their tools. The carvings began as
    symbols — a row of shallow chevrons near the top, a series
    of cup-marks below that, paired curved lines that might have
    been anything. All of it has been worn nearly smooth by
    centuries of weather and by every traveler who stopped to
    run their fingers across the marks. The lower portion is
    dense with scratched names and initials, some cut deep enough
    to outlast the rain, others already nearly gone. Who put it
    here, and why, is not recorded anywhere.
  offerings: Tucked against the stone's base and accumulated
    over years of travelers passing through — a half-dozen
    smooth river pebbles arranged with some care, a tarnished
    copper coin face-down in the dirt, a wax candle stub burned
    nearly to the wick and never relit, a folded square of cloth
    with something written on the inside in cramped lettering
    too faded now to read. Nothing here has market value. The
    custom of leaving something is old enough that it requires
    no explanation — you understand it or you do not.
  road: Out here the road is thinner and less maintained than
    the stretch south of the last farmstead. The gravel has
    spread, the drainage ditch along the east side has silted
    up and vanished, the verge has gone to sage and bunchgrass
    with no one to cut it back. There is no one on the road in
    either direction. No sound of a cart. No smoke on the
    horizon. This is the edge of the maintained world.
idlemessages:
- A hawk hangs motionless over the scrubland to the east,
  then slides sideways on the wind and is gone.
- Nothing moves on the road in either direction. The silence
  out here has weight to it — not absence but presence.
- A gust stirs the sage and passes through, carrying dust and
  the dry smell of warmed stone.
- The waystone casts a thin shadow across the road's edge in
  the afternoon light, pointing north.
- Somewhere out in the scrub a small animal moves through the
  brush, invisible, unhurried.
