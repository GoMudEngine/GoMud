title: The Lake & Ladle
description: >
  The smell of frying onions and woodsmoke comes first, drifting
  from the inn's chimney on the morning air, and under it the
  warm animal breath of the <ansi fg="itemname">stables</ansi>
  from the south end of the yard. You stand in the cobbled
  forecourt of the Lake & Ladle — the last properly respectable
  inn before the road gets lonely — a long two-storey building
  of whitewashed stone with candle lanterns still burning in
  the lower windows. A painted <ansi fg="itemname">sign</ansi>
  swings from a wrought-iron bracket above the entrance arch,
  its chain ticking softly against the iron. A
  <ansi fg="itemname">notice board</ansi> is nailed to the post
  beside the door, thick with pinned pages in various states of
  weather. The yard is busy: stable hands cross with buckets
  and barrows, two horses stand tied to the east rail, and a
  burst of laughter rolls out through the common-room door to
  the east every time it opens.
