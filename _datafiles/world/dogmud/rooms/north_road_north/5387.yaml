roomid: 5387
zone: North Road North
title: Basalt Shoulder
description: >
  The road climbs a bare shoulder where old basalt has pushed
  through the thin soil in slabs and columns, shouldering the
  verge back on both sides. The stone is black and sharp-edged —
  columnar-fractured, volcanic, old enough that the joints have
  opened into blade-thin seams — and nothing grows on it but a
  pale crust of lichen, ash-grey on the windward faces and rust-
  orange where moisture clings. Run a hand across the outcrop
  and it holds the sun's heat long after the air cools; meet
  an edge carelessly and it will find your skin before you find
  it. The land here has shed its pretense at soil altogether;
  for miles in every direction the scrub grows thin over more
  of the same stone, and this shoulder is simply a place where
  the covering gave out entirely. A deep
  <ansi fg="itemname">crevice</ansi> splits the outcrop's
  tallest slab, running back into the rock further than the
  darkness shows, its floor dry and littered with windblown
  grit and small pale bones. The <ansi fg="itemname">road</ansi>
  threads through on the west side, the gravel thinning where
  it crosses not good compacted earth but the basalt's own
  broken chips.
