nouns:
  gate: A heavy farm gate of squared ash planks hung on a thick
    gatepost, its iron pin-hinges dark with rust and long use.
    The gatepost is hollow at the top where the wood has
    checked and split — a gap deep enough to hide a fold of
    paper. Locals leave notes there for the farm family when
    the gate is down and the track is empty. The latch is a
    simple iron pin; the gate swings freely both ways.
  drystone walls: Low walls of unmortared fieldstone, knee-to-
    hip height, running straight across the grazing land in
    lines that must have taken months to lay. Each stone was
    picked from these same fields. The lichen on the north
    faces is thick and yellow-grey, unbothered by seasons.
    A few have tumbled gaps where livestock have pushed
    through, and not yet been reset.
  cattle: A scatter of brown-and-white cattle in the nearer
    field, grazing slowly or simply standing. They watch the
    road with the mild, incurious patience of animals that
    have seen wagons every day of their lives. One turns its
    head to follow your passage, then looks away.
idlemessages:
- The wind comes in low from the northwest, bending the
  roadside grass in long slow waves.
- A fully loaded wagon passes southbound, the driver nodding
  without slowing.
- Rooks wheel above the nearest drystone wall in a loose,
  noisy cloud before settling again.
- One of the cattle in the field stamps a foot and shakes
  flies from its ears.
- Somewhere past the rise to the north, a dog barks twice
  and goes quiet.
