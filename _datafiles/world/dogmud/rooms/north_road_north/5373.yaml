roomid: 5373
zone: North Road North
title: The Rolling Pasture Road
description: >
  The hedgerows fall back and the country opens out all at once —
  broad pasture rolling north and west, stitched together by low
  <ansi fg="itemname">drystone walls</ansi> and clipped hedge
  lines that stretch to the horizon. On the east shoulder a
  heavy wooden <ansi fg="itemname">farm gate</ansi> marks where
  a mud track cuts off into a grazed field. Brown-and-white
  cattle stand in the near distance, motionless as fence posts
  except for the slow turn of a head. The road curves gently
  north around a low rise, wagon ruts pressed deep into the
  verge — confirming this is real highway, freight road, not
  just a lane between farmsteads.
