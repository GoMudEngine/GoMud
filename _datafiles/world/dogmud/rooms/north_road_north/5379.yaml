roomid: 5379
zone: North Road North
title: Hedgerow Bend
description: >
  The road swings around a dense wall of hawthorn and elder —
  the hedgerow here has grown twice a person's height and
  doubled in width over the years, its outer face interwoven
  with old briar and dog rose, impenetrable as a wall of small
  thorns. Past the bend the view opens sharply: the tight belt
  of farmsteads that hugs the lakeshore road gives way to
  longer fields and wider sky, the furrows running further
  before they reach the next fence, the gaps between holdings
  growing perceptible. The road itself begins to feel less
  managed here — the gravel still good, but thinner, the
  verges more ragged. A waist-high
  <ansi fg="itemname">waymarker</ansi> of rough granite stands
  in the grass at the bend's outer edge, its top hollow scooped
  out by time or intention, a few travelers' offerings visible
  inside it. The <ansi fg="itemname">hedgerow</ansi> behind it
  is so thick that even leafless in winter it would screen
  what lies to either side. A rutted
  <ansi fg="itemname">track</ansi> angles off eastward toward a
  widening in the verge where drovers rest their animals.
