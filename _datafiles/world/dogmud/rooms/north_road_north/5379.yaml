nouns:
  waymarker: A waist-high block of unworked granite, older than
    the road itself — the stone's face is weathered past any
    carving that might once have been there, and the top holds
    a broad, shallow hollow, whether scooped by water or by
    deliberate hands is difficult to say. The hollow is dry and
    holds a small collection of travelers' leavings — a handful
    of dried flower heads, a copper coin with a thumb-worn face,
    a folded scrap of waxed cloth with something written inside
    in cramped private lettering. The custom of leaving
    something at the stone is old enough that no one remembers
    where it started.
  hedgerow: A massive joint growth of hawthorn and elder that
    has spread over decades into a nearly solid wall, its outer
    face chest-high in thorns interwoven with runners of dog
    rose and old man's beard. In late spring it would be white
    with hawthorn flower; now it is dense grey-green, the inner
    limbs still bare and the outer ones leafed out in thin new
    growth. The hedgerow's eastern tail has gone half-wild —
    no longer managed, the farms it once bordered having thinned
    enough that no one tends it. The briar has taken over at
    that end, thick and unruly.
  track: A rutted earth track that angles east off the road's
    shoulder, wide enough for a drover's cart but too narrow
    for a loaded wagon with any room to spare. The ruts are
    deep and recent. The track bends behind the hedgerow's
    ragged eastern end almost immediately and disappears from
    the road, but the sound of livestock carries back when the
    wind is right — the pull-off is not far.
  fields: Past the bend the farmland changes in character —
    longer rows, fewer buildings visible per stretch of road,
    the occasional hayrick standing alone in a field without
    a farmhouse in sight. The sky is wider here than it was
    in the tight-hedged country closer to Stillwater. A mile
    or two further north the last farm visible from the road
    ends, and the land beyond begins to look less deliberate,
    less tended, more open and unaccountable.
idlemessages:
- A blackbird scolds from deep inside the hedgerow, loud and
  indignant, then goes abruptly quiet.
- The wind off the open fields hits the face of the hedgerow
  and bends over it, carrying the smell of turned earth.
- A cart comes up from the south and takes the bend without
  slowing, the driver leaning into the turn by reflex.
- A copper coin catches the light inside the waymarker's
  hollow — left there by someone who passed this way earlier.
- The farms ahead are visibly thinner than they were an hour
  south. The road is losing its company.
