roomid: 5380
zone: North Road North
title: Drovers' Pull-off
description: >
  The smell reaches the road before the place does — dung and
  wet straw and the sharp lanolin note of sheep penned close
  together, layered over the mineral dustiness of earth beaten
  flat by generations of hooves. A wide scrubby area opens off
  the road's east side where the verge has been trampled bare;
  split-timber <ansi fg="itemname">hurdles</ansi> divide it
  into two rough pens, both empty now but showing recent use in
  the fouled ground and the tufts of caught wool on the lower
  rails. A long stone <ansi fg="itemname">trough</ansi> runs
  along the east edge, cracked at one end but still holding
  water, algae greening its lip in the wet season. At the
  pull-off's center a ring of blackened fieldstones marks the
  communal <ansi fg="itemname">firepit</ansi>, grey-ashed and
  cold, heaped with the charcoal stubs of many previous fires.
  This is where road-travelers and drovers have always
  exchanged news; the muddy ground holds the record of every
  passing herd.
