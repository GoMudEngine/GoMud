zone: North Road North
title: Lakeward Milepost
description: >
  Sun-warmed stone — the <ansi fg="itemname">milepost</ansi>
  at the road's west shoulder has been baking since midmorning,
  and when you lay a hand on its carved face the heat comes as
  a small, unexpected comfort. The post stands at a fork: the
  main highway continues north toward a tollgate named in the
  carving, while a rougher <ansi fg="itemname">track</ansi>
  branches northwest, muddier and narrower but packed hard by
  regular use — a locals' cutoff that bypasses the gate. The
  carved face gives the league-count to New Plymouth, a number
  large enough that a lake-town traveler must read it twice.
  Road dust hangs in the air here, dry and faintly earthy,
  stirred by every wagon that passes the fork.
