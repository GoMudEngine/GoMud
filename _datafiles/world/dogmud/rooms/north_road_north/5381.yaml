title: The Last Furlongs
description: >
  The fields on either side run thin here — the furrows
  shorter, the soil showing a paler shade of ochre where
  it breaks through the rows, the land giving quiet notice
  that its generosity is nearly spent. A lone
  <ansi fg="itemname">farmstead</ansi> sits back from the
  road on the western side, its yard still, a cart with a
  broken axle sagging beside the barn. The gravel is sparse
  in places and the verges have gone rough; the
  <ansi fg="itemname">fence</ansi> along the eastern field
  leans at intervals where posts have softened in the
  ground and never been replaced. A low
  <ansi fg="itemname">cairn</ansi> of flat pale stones
  marks the road's eastern shoulder — three deliberate
  tiers, their meaning private or long forgotten. To the
  north the green of the fields loses conviction fast, rows
  thinning to stubble and then to bare dry ground at the
  edge of sight.
