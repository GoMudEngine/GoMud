roomid: 5388
zone: North Road North
title: The Lonely Mile
description: >
  No roof, no fence line, no thread of smoke in any quarter of
  the sky — the country here empties itself of everything except
  scrub, wind, and the road running through it. The farmsteads
  that marked the way south have thinned and disappeared; what
  remains is open rain-shadow land, the ground too thin and dry
  for anything but coarse grass and scattered sage, the sky
  filling the upper three-quarters of the world with pale
  overcast. The silence is entire — not the silence of something
  held back, but of something simply absent. A breath of wind
  moves through the dry stems beside the road and that is the
  whole of the sound. There is no human voice or movement in
  any direction. A lone <ansi fg="itemname">milestone</ansi>
  stands in the east verge, leaning slightly north, its carved
  face turned toward anyone still coming up from the south. The
  <ansi fg="itemname">verge</ansi> on both sides is stripped
  bare — no shelter, no shade, the pale earth cracking in the
  dry season, the grass retreating to whatever patches it can
  still find a grip.
