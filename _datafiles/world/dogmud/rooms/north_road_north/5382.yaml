title: Where the Green Ends
description: >
  The wind finds the traveler here with a frankness it
  could not manage in the hedged country to the south —
  coming low and steady off the open north with nothing
  left to check it. The cause is plain in a single glance
  — on the south side the last rye runs up to a low bank
  of green <ansi fg="itemname">grass</ansi> that marks
  where cultivation ends; on the north side of that line,
  barely a step away, the ground shifts to pale dry earth
  and the first loose clumps of
  <ansi fg="itemname">sagebrush</ansi> push up between
  the stones. The change is sharp enough to seem deliberate
  — a boundary drawn in the soil itself, not on any map.
  The <ansi fg="itemname">sky</ansi> above opens wide, the
  cloud layer high and thin, the blue to the north clear
  and pale and carrying no promise of rain. The road
  continues north into the scrub, the gravel narrowing as
  the managed verges give out and dry bunchgrass takes
  their place.
