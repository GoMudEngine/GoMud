nouns:
  basalt: Exposures of dark grey basalt push through
    the thin topsoil in slabs and knuckles — the
    underlying rock is close to the surface now, the
    glacial till that once softened this terrain having
    thinned away. The stone's face is rough where it
    breaks from the ground and smooth where centuries
    of weather have worked it. On the flat upper faces
    a thin black crust of lichen has established
    itself, dark against the pale stone. The rock is
    noticeably warm to the touch on exposed surfaces —
    it holds the sun's heat well into evening in
    dry weather.
  wayshrine: A cluster of stones at the road's edge
    that has accumulated rather than been built —
    travelers have been adding to it long enough that
    it has taken on a rough structure, a low central
    cairn flanked by smaller offerings laid on the
    flat rock beside it. The items here are sun-
    bleached and dry — a small clay cup placed upright,
    two braided grass rings, a copper piece face-down
    on the stone, a short length of cord knotted in
    an elaborate pattern. Some offerings are clearly
    older than others. The cup is empty and clean,
    placed deliberately, as if left for someone who
    might need filling on the road ahead.
  cracks: The ground surface between the basalt
    exposures is a pale, close-grained clay-silt
    that has dried past hard to something close to
    ceramic. A network of shallow cracks runs through
    it in irregular polygons — the surface contracts
    as the moisture leaves and the fracture geometry
    follows the ground's own logic. The powdery edges
    of each crack are fine enough to stir in the
    wind. Press a palm flat to the ground here and
    the warmth comes through immediately, the stone
    beneath the thin soil giving back everything
    the sun put in.
idlemessages:
- Dust rises from the wheel-ruts in a low thin haze
  that settles almost before it lifts.
- The smell here is all dry stone and sage — no
  moisture in it, no green note at all. The farmland
  behind might as well be a day south.
- A lizard crosses the basalt face with unhurried
  precision and disappears into a crack without
  slowing.
- Wind across the open verge carries a fine grit
  that settles on the lips and teeth, pale and
  mineral.
- The road ahead bends slightly, then straightens
  and runs without variation into the distance.
