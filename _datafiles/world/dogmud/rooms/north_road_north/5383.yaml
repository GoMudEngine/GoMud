title: Cracked Verge
description: >
  The heat of the stone reaches the skin before anything
  else — the pale <ansi fg="itemname">basalt</ansi>
  pushing through the thin soil here catches the day's sun
  and holds it, giving back warmth long after the air has
  cooled. The ground is dry to the depth of a boot heel
  and further — surface <ansi fg="itemname">cracks</ansi>
  run between the rock exposures in a fine irregular
  network, the soil between them pale as ash and powdery
  underfoot. The road is little more than two wheel-ruts
  pressed into the hardpan, the gravel nearly gone, and
  traffic is scarcer here — the scrub grows unhurried to
  the road's very edge and the air carries the smell of
  sun-warmed sage and hot stone. At the eastern shoulder
  a cluster of stacked stones and sun-bleached offerings
  marks a <ansi fg="itemname">wayshrine</ansi> built up
  over many seasons — the kind of place where travelers
  leave small things before crossing unfamiliar country.
