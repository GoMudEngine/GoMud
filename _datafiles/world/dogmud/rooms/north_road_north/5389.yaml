title: Edge of the Empty Reach
description: >
  The road arrives here at the edge of what has been kept. The
  maintained gravel gives out and a beaten earth track takes its
  place, running northward into a country so open and dry that
  the eye follows it for what must be miles before losing it in
  the haze. There is nothing out there in any direction — no
  building, no smoke, no movement, no mark of deliberate human
  passage except the track itself pressed into the earth by
  whoever went before. The scrub thins to scattered saltbush
  and bare ground; the sky is enormous overhead; somewhere at
  the edge of the visible world a dark ridge sits on the
  horizon, far enough away that it might be stone or might be
  weather. This is where the road stops being maintained and
  starts being remembered. At the western edge of the verge a
  <ansi fg="itemname">boundary stone</ansi> stands with the
  air of something placed here to mean something — its face
  carved with a warning, or perhaps a benediction, for those
  who continue north. The <ansi fg="itemname">track</ansi>
  stretches away into the empty country, the last waymark
  behind you, the next one nowhere visible ahead.
