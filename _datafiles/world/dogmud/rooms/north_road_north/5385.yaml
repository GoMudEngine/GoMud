title: Sage Flats
description: >
  The smell arrives before anything else — sun-warmed sage,
  sharp and medicinal and clean, the defining scent of dry
  country, thick enough to taste when the wind is still. The
  road narrows to a pale scratch across an enormous flat of
  silver-green <ansi fg="itemname">sagebrush</ansi> and
  bunchgrass stretching to every horizon; the sky above takes
  up more of the world here than the land does, pale and wide
  and utterly cloudless. A person can walk this road and feel
  the particular loneliness of being fully visible — no hedges,
  no trees, no fold in the earth to step behind. The
  <ansi fg="itemname">horizon</ansi> is so flat and far in
  every direction that the eye keeps expecting something to
  appear at its edge, and nothing ever does. The bunchgrass
  moves in the wind in long slow rolls, like shallow water.
