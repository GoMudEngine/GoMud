roomid: 6271
zone: East Road to Greenford
title: The Lonely Milepost
description: >
  A carved stone post stands at the road's center, sunk deep
  and left when the road improvements moved on past it. The
  distance marks are worn but readable. Around the post the
  plateau is featureless — no cover, no walls, no shade of
  any kind. A carter's rig has stopped in the verge on the
  east side of the post, the draft horse standing with its
  head low in the heat. At the road's edge a fat snake has
  found a warm flat stone and settled onto it, absorbing the
  afternoon without any urgency.
biome: land
