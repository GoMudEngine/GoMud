nouns:
  web anchors: >
    Points of silk driven into the stone of the ceiling, dozens of
    them, every one paying out a strand toward the same knot at the
    chamber's center. The pattern radiates like a struck web seen
    from behind. Stand under the knot and you feel each line as a
    separate small tug on the air, all of them pulling inward, all of
    them pulling at you.
  passage: >
    The way out doubles back toward the vault -- and it is the same
    single passage that both the eastern and the western arch of that
    vault opened onto. Two mouths there, one throat here. Walk it and
    you will fetch up at the egg vault by whichever of its faces the
    weave prefers today.
idlemessages:
- The converging strands overhead draw a fraction tighter, all
  together, and the pull of them presses faintly against your chest.
- For an instant you are certain you entered this chamber from the
  other side, and the certainty passes without resolving.
- The pale rosette at the center turns a slow quarter-turn on nothing
  and settles again.
- A long leg reaches down from the knot overhead, tests the air above
  your head, and withdraws into the dark.
