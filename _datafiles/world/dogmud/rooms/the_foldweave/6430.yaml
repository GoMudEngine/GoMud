roomid: 6430
zone: The Foldweave
title: The Doubled Chamber
description: >
  A wide low chamber, and the first thing wrong with it is that you
  are sure you have already arrived here -- once from the left, once
  from the right, and the memory will not decide which came first.
  <ansi fg="itemname">Web-anchors</ansi> star the ceiling in a
  radiating pattern, all of them drawn taut toward a single point
  at the chamber's heart where the strands knot into a pale rosette,
  and standing under it the pull of all those converging lines is
  almost a sound. There is no clutter here, no bone, no sac -- only
  the anchors and their center, and the sense of being weighed. One
  <ansi fg="itemname">passage</ansi> leads back the way both ways
  came, and one climbs on, north and up, toward a deeper knot of the
  weave.
biome: cave
coord:
