nouns:
  bridge-strands: >
    Cables stretched across the deep in tiers, taut enough to walk if
    you dared and dense enough to make an architecture of the empty
    air -- galleries and spans and switchbacks of silk, all of it built
    to be moved through by something long-legged and sure. The far
    anchors are past the light. There is more structure here than the
    cavern has walls to anchor it to.
  sidepocket: >
    A pocket opening off the deep to the south, hung so as to promise
    an overlook of the whole hung architecture. The promise is a
    little false, by the slant of the strands -- the pocket shows you
    across without letting you cross.
idlemessages:
- The cold current of air moves steadily through the hung strands,
  going somewhere down and in, and the whole architecture sways with it.
- A tier of bridge-strands off in the dark takes a sudden weight, dips,
  and holds, and the weight moves on out of hearing.
- Far below, the knotted core draws a slow breath, and the current of
  air quickens toward it and then eases.
- Something crosses a high span against the last of the light, many
  legs and no sound, and is swallowed by the dark beyond.
