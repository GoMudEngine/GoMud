roomid: 6434
zone: The Foldweave
title: The Web-Hung Deep
description: >
  Down through the split the warren changes register. This is a great
  hung deep, a cavern whose true walls stand somewhere out past the
  reach of any light, and the space between is filled -- not choked,
  filled, deliberately -- with a scaffolding of
  <ansi fg="itemname">bridge-strands</ansi> stretched taut across the
  dark in tiers and galleries, a whole architecture of silk with room
  to move inside it. The cold sweet air is a current here, moving,
  going somewhere. To one side a <ansi fg="itemname">sidepocket</ansi>
  opens onto a false overlook; below, the strands draw together and
  down toward a knotted core where the current of air is coldest and
  the weave is oldest. Something down there has been spinning this
  place for a very long time, and spinning it larger than the stone
  that holds it.
biome: cave
