nouns:
  web-curtains: >
    Not woven so much as hung -- broad flat sheets of grey silk drawn
    taut between the walls, one behind the next, each softening the
    light that reaches the one beyond. Push a hand toward one and the
    air moving ahead of the hand sets the whole rank of them swaying
    in sequence, a wave passing back further than the gallery is long.
  web-felt: >
    The floor is matted silk trodden to a dense grey felt, soft and
    slightly warm. It swallows sound and returns it late. Where it has
    torn, the tear drops away into a shaft that the felt's edge
    curtains over, hiding how far down the fall would be.
idlemessages:
- The rank of web-curtains sways in slow sequence though no air stirred
  them, the last one moving long after the first.
- A weight shifts somewhere in the silk overhead, and a fine grey dust
  sifts down through the torchlight.
- Something long-legged crosses the felt in the dark ahead, unhurried,
  and the felt gives back no sound at all.
- A strand overhead draws suddenly tight with a low musical note, then
  slackens.
