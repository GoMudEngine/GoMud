roomid: 6427
zone: The Foldweave
title: Web-Choked Gallery
description: >
  Below the threshold the passage widens into a long gallery hung
  floor to ceiling with <ansi fg="itemname">web-curtains</ansi> --
  sheet after grey sheet of them, layered close enough that the
  torchlight dies three curtains deep and the far end of the gallery
  is only a rumor of paler dark. The floor underfoot is a matted
  felt of old silk, and it gives the wrong sound: a step here lands
  softer and later than the foot expects, as though the ground were
  a little further down than it looks. Two ways lead on from the
  gallery's throat -- one <ansi fg="itemname">north</ansi> through
  a slashed rent in the curtains, one dropping away steeply where
  the silk-felt has torn open over a shaft. Both smell of the same
  cold sweetness, and both, somehow, seem to lead deeper by the same
  amount.
biome: cave
