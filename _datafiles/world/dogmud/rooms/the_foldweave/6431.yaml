roomid: 6431
zone: The Foldweave
title: The Convergence Fold
description: >
  Two ways feed into this fold and the weave makes no secret of it:
  the strand-crawl comes up out of the floor here, and the doubled
  chamber comes down into it from above, and both deliver you to the
  same lip of the same drop. It is a junction the way a knot is a
  junction -- everything drawn through one narrow place. The walls
  are ribbed with <ansi fg="itemname">fold-ridges</ansi>, seams of
  silk laid so densely they have gone hard as horn, curving in ways
  that make the chamber seem to turn a corner it does not turn. West,
  a low <ansi fg="itemname">gap</ansi> breathes; below, a raw
  <ansi fg="itemname">chimney</ansi> drops toward the sweetest and
  coldest of the air. From here on the weave stops pretending the
  cave has a shape.
biome: cave
