nouns:
  fold-ridges: >
    Seams where silk has been laid over silk for so long it has set
    hard, ribbing the walls like the folds of a shut fan. Run a hand
    along one and it leads the hand around a curve, and around another,
    and the wall you end at is not where the wall you started at said
    it would be.
  gap: >
    A low breathing gap in the western wall, cold air pulsing out of
    it in slow even draughts. The passage past it does not run straight
    -- it circles, by the feel of the draught, back toward its own
    beginning.
  chimney: >
    A raw vertical drop in the floor, unspun and honest stone for once,
    falling toward the coldest sweetest reach of the air. Whatever the
    weave keeps deepest, it keeps down there.
idlemessages:
- Both feeds of the fold carry the same tremor at the same instant, up
  from the crawl and down from the chamber, meeting at your feet.
- A fold-ridge along the wall shifts under its own weight, and the room
  seems to turn a corner without your having moved.
- Cold air pulses from the western gap in slow even breaths, each one
  a fraction colder than the last.
- Deep in the chimney something large adjusts itself, and a run of
  loose silk sighs down the shaft.
