nouns:
  egg-sacs: >
    Fist-sized purses of layered silk, slung in clusters from the
    ceiling's every curve. The taut glossy ones are warm to stand
    near; the slack dark ones have already given up whatever they
    held. Put an ear near a full one and there is a sound inside it,
    a dry patient stirring, many small stirrings folded into one.
  arches:
    A pair of low silk-hung openings in opposite walls, left hand and
    right. They look away from one another. They do not lead away from
    one another. Whichever you take, the chamber it delivers you to is
    the same chamber, entered from the same side -- the vault keeps two
    mouths and one throat.
hidden_nouns:
  brood-cache:
    description: |
      Behind the slack dark egg-sacs, where the wall curves back on
      itself further than a wall should, a deeper pocket has been spun
      shut -- a hoard-purse, not a nursery-sac, packed tight with
      folded silk laid down in careful lengths and kept apart from the
      rest. The Foldweave stores something here it does not intend to
      hatch.
    hidden_description: |
      A pocket in the wall behind the dark sacs has been spun shut over
      a cache of stored silk.
idlemessages:
- One of the taut egg-sacs shivers on its silk, a small dry stirring
  turning over inside it, and stills.
- Warmth moves through the vault in a slow tide, as though the room
  itself were breathing shallow and even.
- A dark slack sac detaches without a sound and is not on the floor
  when you look for where it fell.
- From both arches at once comes the same faint skitter, in step, like
  one sound reaching you by two roads.
