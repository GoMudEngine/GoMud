roomid: 6428
zone: The Foldweave
title: The Egg Vault
description: >
  The rent in the curtains opens into a rounded vault whose walls
  are hung thick with <ansi fg="itemname">egg-sacs</ansi> -- pale
  grey purses the size of a curled fist, bunched in clusters and
  slung in hammocks of silk from every curve of the ceiling. Some
  are taut and glossy; some have gone slack and dark. The vault is
  quiet with the particular quiet of a nursery, and warm, warmer
  than the stone should allow. Two low <ansi fg="itemname">arches</ansi>
  lead out of it, one to the left hand and one to the right, set in
  opposite walls -- and there is something the eye keeps trying to
  correct and cannot: both arches, followed, spill you out into the
  very same chamber beyond. Leave by the west and you arrive where
  leaving by the east would have brought you, as though the vault
  had only one door wearing two faces.
biome: cave
