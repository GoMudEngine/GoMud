roomid: 6429
zone: The Foldweave
title: The Overlong Strand
description: >
  The shaft from the gallery drops into a tunnel so narrow it is
  barely a tunnel at all -- a crawl-height throat of stone with a
  single great <ansi fg="itemname">guide-strand</ansi> running its
  length, thick as a wrist, that you follow because there is nothing
  else to follow. And you follow it, and follow it. The
  <ansi fg="itemname">tunnel</ansi> is short: you can see its end,
  a low mouth of paler dark not twenty paces off. But the strand
  between here and there is long -- far longer than twenty paces,
  longer than the tunnel could contain if it were straightened out
  and measured -- and the walking of it takes longer than the seeing
  of it should. The mouth ahead does not come nearer for a while,
  and then all at once it does. Cold sweet air pours up the strand
  from below.
biome: cave
coord:
