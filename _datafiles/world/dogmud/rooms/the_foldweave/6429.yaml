nouns:
  guide strand: >
    A single cable as thick as a wrist, anchored the length of the
    crawl and glistening faintly with the damp. It is the only true
    line in the tunnel, and it runs longer than the tunnel does --
    pay it out hand over hand and the payout does not end where the
    stone ahead says it must. Something spun this to be walked, and
    spun more of it than the walking needs.
  tunnel: >
    A low throat of wet basalt, no more than twenty paces mouth to
    mouth by the eye. The eye and the legs disagree. The mouth ahead
    holds its distance, patient, and the strand keeps feeding through
    your hands long after twenty paces are spent.
idlemessages:
- The guide-strand tightens under your hand and hums a single low note
  that goes on longer than a note should.
- The far mouth of the tunnel holds exactly where it was, neither
  nearer nor further, for one breath and then another.
- Cold sweet air pushes up the strand from below, carrying a dry busy
  sound of many legs at work.
- A vibration travels the strand from somewhere deep, reaches your
  hand, and keeps traveling past you up the line.
