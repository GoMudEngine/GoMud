nouns:
  court: >
    A hall's-worth of packed silk, level and broad, ringed by the
    converging cables of the whole weave and roofed by a false sky of
    them. It has the stillness of a made and kept place -- a floor for
    holding court, for being approached across, for watching a long
    approach from the head of.
  fold gate: >
    A single passage at the court's head, hung with drawn silk like a
    curtain over a door, leading in and down. The air past it is the
    coldest and sweetest of the whole warren. This is the last fold,
    and the road ends past it.
idlemessages:
- The false sky of the canopy shifts as a single anchor-knot takes
  weight far overhead, and the pale points of light wheel a fraction.
- The pooled cold air stirs, once, as though something the size of the
  court had drawn one slow breath.
- Every converging cable that rings the court draws taut together for
  an instant, and the whole made place seems to lean inward.
- From past the fold-gate comes a dry deliberate sound of great legs
  settling, and then the court is still again.
