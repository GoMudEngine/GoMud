roomid: 6436
zone: The Foldweave
title: The Foldweaver's Court
description: >
  The bridge-strands of the deep draw together as they descend and
  become, here, a <ansi fg="itemname">court</ansi> -- a floor of
  packed silk broad and level as a hall, ringed by the great converging
  cables and roofed by a canopy of them so dense and so high that it
  makes a false sky, pricked with the pale points where anchor-knots
  catch the light. The cold sweet air stands almost still here,
  pooled, heavy. This is a made place, a throne-space, and everything
  in the warren above was only the road to it: every fold and circle
  and doubled door was a fold in the one long road that ends on this
  floor. A single <ansi fg="itemname">fold-gate</ansi> at the court's
  head leads in and down to the last and deepest fold. The floor is
  clean. Whatever holds court here does not leave its leavings where
  it sits.
