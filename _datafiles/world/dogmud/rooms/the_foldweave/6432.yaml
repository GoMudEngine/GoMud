nouns:
  mark: >
    A torn snag of grey fiber on the silk at eye height, frayed pale
    at the edges. You mark it the first time without meaning to, and
    the marking is a mercy: it is how you learn that north from here
    and north from the next chamber are the same north, circling, and
    that you have passed this snag before.
  circle: >
    The passage bends to one hand and keeps bending, never opening,
    the curve too even and too willing. Trust the bend and it will
    carry you around and around past the same torn mark, patient as a
    mill-wheel, for as long as you let it.
idlemessages:
- The same torn snag of grey fiber slides past at eye height, and you
  cannot say for certain whether it is the first time or the fourth.
- The passage bends again to the same hand, and the wall on your inner
  shoulder is the wall it has always been.
- Something paces you beyond the silk wall, matching the bend, keeping
  the ribbed sheet between you.
- A draught crosses the passage from no opening, cold and sweet, and
  is gone.
