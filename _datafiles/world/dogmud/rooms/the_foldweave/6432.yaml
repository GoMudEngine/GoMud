roomid: 6432
zone: The Foldweave
title: The Circling Passage
description: >
  A curving passage, silk-ribbed and close, that bends always to the
  same hand. You walk it expecting the bend to open out and it only
  bends again, the same bend, the wall on your inside shoulder always
  the wall on your inside shoulder. There is a
  <ansi fg="itemname">mark</ansi> on the silk at about eye height --
  a torn place, a snag of old grey fiber -- and you will come to know
  it, because the passage north leads you on to a place that looks
  like an onward chamber and is not, and returns you here to pass the
  mark again. Only the way <ansi fg="itemname">east</ansi>, back
  toward the fold, breaks the circle. The passage does not want you
  to take it. The passage would rather you kept walking.
biome: cave
coord:
