nouns:
  the records: >
    A long cedar chest, lid worn pale where hands lift it, holding the valley's
    written memory: the ceremony rolls listing every Blooming witnessed here back
    further than the ink stays legible, and bound among them the old water-rights —
    brittle agreements parceling out the channel-flow field by field, season by
    season, signed and counter-signed by farmers centuries dead. Reading the rolls,
    you notice the water-pacts and the ceremony lists were kept by the same hands,
    in the same books, as though in this valley a person's change and a person's
    share of the water were matters of equal and ordinary weight. Some of the
    older pacts divert flow to fields no map seems to show anymore.
  the dais: >
    A single low step of pale sandstone at the pavilion's heart, just high enough
    to lift one figure above the gathered benches. Its surface is worn to a soft
    sheen in a shape like two overlapping footprints — the spot where, generation
    after generation, the Blooming has stood to be seen. There is nothing else to
    it. The plainness is the point.
  the pillars: >
    Smooth columns of soft sandstone holding up the wide roof, and every reachable
    inch of them is covered in names — scratched, carved, pressed in with a
    thumbnail — the record of everyone the valley has watched change. Newer names
    crowd the lower stretches; the highest are worn almost smooth, ghosts of ghosts.
  the garlands: >
    Ropes of dried herb and everlasting flower looped along the rafters, gone
    dusty-fragrant with age. Rosemary, lavender, and a pale moth-winged blossom
    that grows only in the valley's high seeps. They are renewed before each Rite
    and left to fade between.
idlemessages:
- The breeze passes clean through the open pavilion, stirring the rafter garlands.
- A loose thread of dust turns slowly in a shaft of light over the dais.
- Somewhere outside, the channel-water murmurs against stone.
