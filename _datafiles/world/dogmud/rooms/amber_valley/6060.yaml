roomid: 6060
zone: Amber Valley
title: The Rite Pavilion
description: >
  Coolness folds over you the moment you step beneath the roof — deep shade after
  the bright lane, and with it a smell of beeswax, dried herbs, and old stone. The
  pavilion is open on all four sides, its broad tiled roof held up on smooth timber
  pillars, so the valley breeze drifts straight through and the green of the fields
  is always in view past the columns.

  This is where the Chrysalis Rite is held, where the valley gathers to witness its
  young come through their Blooming. The floor is worn flagstone, swept and waxed,
  with a low central dais ringed by stone benches polished by long use. There is no
  grandeur here, only care — the reverence of a people who have made peace with
  change and chosen to honor it. Garlands of dried herb hang from the rafters, and
  the names of those who have Bloomed are scratched, thousands of them, into the
  soft sandstone of the pillars.

  Along the eastern wall stands a cedar chest holding <ansi fg="itemname">the
  records</ansi>, and at the center waits <ansi fg="itemname">the dais</ansi>.
