roomid: 6086
zone: Amber Valley
title: The Grove Gate
description: >
  Two trees stand here older than any in the orchards, their trunks broad as
  doorposts and leaning faintly toward one another, and the path passes
  between them as through a gate that was never built but only grown. Set
  across the gap where their lowest boughs once met is a single span of gray
  stone, a worn <ansi fg="itemname">lintel-stone</ansi> laid by hands long
  gone, polished to a soft sheen along its underside by the brush of countless
  heads bowing as they pass beneath. To step under it is to feel the
  temperature of the air change, to feel watched in a way that is not
  unkind. The hush of the path deepens into something held, something kept.
  Carved shallow into one trunk, weathered nearly smooth, is an old
  <ansi fg="itemname">threshold mark</ansi> that the valley still renews each
  spring.
