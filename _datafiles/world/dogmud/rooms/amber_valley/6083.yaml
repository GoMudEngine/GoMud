roomid: 6083
zone: Amber Valley
title: The Cave — Deep
description: >
  This is the bottom of the dark, the last and deepest chamber, and the air here
  is thick with the rank, close reek of a <ansi fg="itemname">den</ansi> — fur
  and droppings and old kill, the smell of something that has lived here long and
  unbothered. The cold is absolute and the silence has teeth; every scuff you
  make seems an intrusion the dark resents. Yet the seeking was not for nothing.
  Where the back wall has split and weathered, a seam of bright metal glints in a
  cracked <ansi fg="itemname">ore-pocket</ansi>, and tucked into the dry rock
  beside it, out of the water's reach, someone long ago hid a small cache. Above,
  the only way is back the way you came.
biome: land
coord: {x: -12, y: -40, z: -3}
exits:
  up: {roomid: 6082}
nouns:
  the den: >
    The floor of the deep chamber is a beast's home — a worn hollow scraped in
    the gravel, ringed with the cracked, gnawed bones of things dragged down here
    out of the sun, and rank with the musk of a creature grown bold in a place
    nothing ever challenges it. Whatever keeps this den is not here this moment,
    or not where you can see it. That is no comfort. Down here, in the lightless
    cold, you are the thing that does not belong.
  the ore pocket: >
    The back wall has cracked along an old fault, and where it split it laid bare
    a seam of ore — a vein of dull bright metal threaded through the dark stone,
    crusted with the soft glitter of crystal where the dripwater has worked at it
    for ages. A patient soul with a chisel and a strong arm could win something
    real out of this cracked pocket. It is the kind of find that justifies a long
    walk into the dark.
  the cache: >
    Wedged into a dry niche above the high-water line, where neither flood nor
    beast was likely to reach, sits a small forager's cache — an oilcloth bundle
    gone stiff with age, tucked behind a wedged stone. Whoever left it here meant
    to come back. Whether they ever did, the cave is not saying. It has the look
    of a thing that has waited a very long time to be opened.
idlemessages:
- The den-stink thickens and thins as a draught turns in the dark.
- Crystal glints once in the cracked ore-pocket and is swallowed again.
- Something heavy shifts in the blackness and goes still, listening.
- A drip falls into the deep cold and the chamber holds its breath.
spawninfo:
  - mobid: 9409
    respawnrate: "15 real minutes"
