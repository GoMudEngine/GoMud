nouns:
  the thornbrush: >
    Waist-high clumps of grey, thorned scrub, leafless and stiff, the survivors
    of a country that gets too much sun and too little water. Sparrows and
    lizards shelter in the deep tangles. Snagged on the spines here and there
    are tufts of goat-hair and, once, a faded scrap of someone's sleeve — the
    foothills take a small tax off everything that passes.
  the cracked earth: >
    Between the brush the bare dirt has dried and split into a mosaic of curling
    clay plates, each edge lifted like an old scab. Nothing grows in it. In the
    deeper cracks you can see how thin the soil is here — a finger's depth of
    dust over the same pale bedrock that bones the whole rim.
  the old stone channel: >
    Up the slope to the north, half-buried in scrub, runs a straight cut line of
    fitted stone — the upper reach of an irrigation channel, old work, that once
    carried water down off the heights to the farms. From here you cannot tell
    if it still runs. The path climbs north toward it.
idlemessages:
- A dry wind hisses through the thornbrush and dies.
- Something small rustles deep in the grey scrub and goes still.
- The cracked earth ticks and pops faintly as it bakes.
