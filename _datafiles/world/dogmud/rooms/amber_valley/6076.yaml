roomid: 6076
zone: Amber Valley
title: Dry Scrub Slope
description: >
  The rim widens here into a long slope of thornbrush and sun-cracked earth, the
  kind of ground that grabs at your shins and gives back nothing but dust. Dry
  <ansi fg="itemname">thornbrush</ansi> stands in stiff grey clumps, each one
  ticking with insects, and the dirt between them has split into a crazed mosaic
  of curling plates. The path forks: it runs back east toward the green, climbs
  north toward an old stone channel cut into the higher ground, and the bare
  ridge carries on west toward the valley's dry edge.
biome: land
