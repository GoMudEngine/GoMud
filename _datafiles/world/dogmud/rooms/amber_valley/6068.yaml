roomid: 6068
zone: Amber Valley
title: The Irrigation Head-Gate
description: >
  Water talks here — a steady, important rushing, channelled and close. The
  valley's main irrigation channel comes down out of the hills in a stone-lined
  cut and reaches a fork at your feet, where one course bends east and another
  west to feed two different farms. The whole quarrel of the lower valley turns
  on the timber sluice planted in the splitting-stone: the
  <ansi fg="itemname">head-gate</ansi>. Tracks beat hard into the dirt come at
  this spot from every side, and not all of them were made walking calmly.
biome: land
coord: {x: -8, y: -36, z: 0}
