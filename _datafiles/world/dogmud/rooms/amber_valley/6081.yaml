roomid: 6081
zone: Amber Valley
title: The Cave — Gallery
description: >
  The chamber above narrows and lets you out into a long hall of stone that runs
  away into a dark deeper than any you have walked yet. Underfoot the rock is dry
  and ribbed; you feel rather than see the great sheets of
  <ansi fg="itemname">flowstone</ansi> that pour down the walls here, cool and
  smooth and faintly rippled, like a frozen waterfall under your palm. The air is
  utterly still and very old. Scattered along the gallery floor, your foot finds
  the dry, light, hollow shapes of <ansi fg="itemname">old bones</ansi> — small
  things that came down here once and did not climb back out. The dark thickens
  to the west.
biome: land
