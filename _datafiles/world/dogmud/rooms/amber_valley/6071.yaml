roomid: 6071
zone: Amber Valley
title: Valley's South Lane
description: >
  The lane reaches its southern edge, where the cultivated land falls away to
  open scrub and the long drop of country beyond. The
  <ansi fg="itemname">south road</ansi> runs on from here now — the wash-out
  bridged over at last, a fresh-cut roadbed angled down toward the river
  country below. New mortar still pales between the stones. West, a faint
  foot path climbs into the dry foothills. The wind comes uncombed off the
  open land, smelling of hot stone, distance, and the first faint breath of
  moving water.
biome: land
