nouns:
  the south road: >
    A new post stands where the old one leaned. The board reading WAY WASHED
    OUT — NO PASSAGE has been turned face-down in the scrub; a replacement
    reads: TO THE RIVER COUNTRY & THE CONFLUENCE — OPEN. Below the old
    scratched word SOON, a single heavy line has been scored through it and
    the word OPEN written beside it. The gully is bridged over with flat
    river stone and fresh mortar, the work clean if not elegant. The road
    drops away south, passable at last.
  the open country: >
    South past the repaired crossing, the land tilts away in long dry folds
    toward a far green seam of riverbank. The road runs on into it now —
    mended at last, the way to the Confluence finally open. That green country
    and its wide water lie ahead, no longer only a view.
  the foot path: >
    A thin pale track climbing west out of the lane into the foothills, beaten
    by goats and the people who chase them. It is the only way on that the
    flood didn't take.
idlemessages:
- The open wind gusts up over the lip of the valley, dry and restless.
- The new bridge stones pale against the old road, mortar not yet weathered.
- Far off to the south, a hawk hangs motionless on the heat.
