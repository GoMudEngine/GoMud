roomid: 6057
zone: Amber Valley
title: Pavilion Walk
description: >
  The din of the square falls away behind you, and what rises in its place is a
  hush — the kind that gathers in places people treat gently. Banners hang still
  in the warm air, long panels of undyed linen each painted with a single emblem:
  a moth, a budding branch, an opening hand.

  The walk is short and straight, paved with broad processional stones worn into
  soft hollows by bare feet. They are old, these stones, older than the houses,
  and they have been walked the same way so many times that the path almost steers
  you on its own. A faint smell of beeswax and crushed herbs drifts up from the
  pavilion ahead. Off to one side a woman sits mending a banner, her needle moving
  in a hand with one too many graceful fingers, and she hums as she works.

  <ansi fg="itemname">The banners</ansi> line the way, and underfoot lie
  <ansi fg="itemname">the processional stones</ansi>.
biome: land
