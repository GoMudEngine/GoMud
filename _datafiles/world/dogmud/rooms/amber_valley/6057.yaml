nouns:
  the banners: >
    Long panels of pale linen hung from cross-poles down both sides of the walk,
    each bearing one painted emblem in earth-reds and ochres: a moth with spread
    wings, a branch breaking into bud, a hand opening like a flower. They are the
    signs of Blooming, and the paint has been freshened so many times the cloth
    beneath has gone soft as a worn shirt.
  the processional stones: >
    Broad flat slabs laid end to end, their centers dished and polished by the
    passage of bare feet over more years than anyone counts. Walk them and you can
    feel the hollows guide your step — generations of folk have come this way to
    the pavilion, and the road remembers each of them a little.
  the mender: >
    A woman seated on a low stool with a half-stitched banner across her knees,
    drawing thread through linen with unhurried care. One hand carries an extra
    finger, long and deft, and she uses it to hold the cloth taut while the others
    sew. She hums something old and tuneless and pays you a friendly, unbothered
    glance.
idlemessages:
- A banner stirs, just barely, in a breath of warm air.
- The smell of beeswax drifts up from the pavilion.
- The mender's needle catches the light as it rises and dips.
