title: The Market Square
description: >
  Voices reach you before anything else — a braided, easy din of haggling and
  greeting and laughter, threaded through with the steady chuckle of water. The
  square opens wide and sun-flooded, its hard-packed earth swept clean and worn
  pale by generations of market days.

  At the center stands the old market cross, and around its base a low well-trough
  catches channel-water that townsfolk dip from in passing. Stalls ring the open
  space, fruit and cloth and pottery under faded awnings, and folk drift between
  them in no particular hurry. Two grizzled farmers have squared off near the
  trough, jabbing fingers at each other over some boundary ditch — a quarrel so
  well-worn it draws more grins than concern. A boy weaves through with a basket
  on his head, the soft pale down covering his arms catching the light like frost.

  <ansi fg="itemname">The market cross</ansi> rises at the heart of it all, and
  <ansi fg="itemname">the well-trough</ansi> circles its foot.
