nouns:
  the market cross: >
    Worn limestone, its four faces carved with the valley's old emblems: a sheaf,
    a vine, a sun, and a fourth that time has rubbed to a blur — folk argue
    whether it was a moth, a hand, or a face. The stone is polished smooth at
    shoulder height where countless people have leaned against it to gossip,
    and a sun-faded notice or two flutters from a nail driven near its base.
  the well-trough: >
    A circular stone trough rings the foot of the cross, fed by a thin pipe off
    the channel system so it never quite runs dry. The water is cool and clear;
    a tin dipper hangs on a chain for anyone who's thirsty, and a few green ferns
    have rooted in the damp seams of the stonework.
  the feuding farmers: >
    Two sun-leathered old men, red-faced and delighted to be furious, arguing
    over a boundary ditch their fathers argued over before them. Neither seems to
    want it settled. One has a second thumb on his left hand that he uses to
    great effect for jabbing; the other doesn't appear to notice or care.
  the stalls: >
    Trestle tables under patched awnings, heaped with the valley's plenty —
    apricots and plums, coiled rope, fired clay, bolts of plain dyed cloth.
    Nothing fancy, all of it good. The vendors call prices more out of habit
    than haggle, and slip an extra fruit to children without being asked.
idlemessages:
- The two old farmers' voices rise to a crescendo, then collapse into laughter.
- A dipper clinks against the rim of the well-trough.
- A vendor calls out the morning's price for apricots, then knocks it down for a child.
- Somewhere a hand-drum keeps a loose, lazy rhythm.
