nouns:
  the drying frames: >
    Tall wooden racks lashed from poles, each stretching a scraped hide taut to
    cure in the sun. The leather ranges from raw cream to deep oiled brown along
    the row, marking each skin's stage. A faint sweetish rot hangs about the green
    hides at the near end; the finished leather at the far end smells only of oil
    and sun.
  the dye-vats: >
    A line of half-sunken vats, each holding a different steeping color — madder
    boiling down to blood-red, woad gone deep indigo, a yellow weld bright as the
    sun overhead. The ground around them is stained in soft overlapping rings, a
    decade of spills layered into an accidental rainbow. Steam and a sharp vinegar
    smell rise off the hot ones.
  the young tanner: >
    A wiry young woman working the vats sleeves-up, the back of one forearm sheathed
    in thick overlapping scales gone slick and dark with dye-liquor. She reaches
    bare-armed into vats that would scald or burn an ordinary hand, fishing out
    hides one-handed, and grins at your glance like it's the best joke in the world —
    which, in this valley, it nearly is.
idlemessages:
- A hide slaps wetly onto a drying frame.
- Steam curls up off the hot madder-vat, sharp and red-smelling.
- Someone wrings out a dyed cloth, and blue water patters on the stained ground.
