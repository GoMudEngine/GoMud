roomid: 6063
zone: Amber Valley
title: Tanner's Row
description: >
  The smell announces this lane before you reach it — the sharp animal tang of the
  tannery, cut through with the bitter-green reek of dye-vats and the vinegar bite
  of mordant. It is not unpleasant so much as honest, the smell of a place that
  works with its hands. The row was set here on purpose, at the market's southern
  lee — downwind of the fruit-stalls just up the lane, on most days at least.

  Tanner's Row is the valley's grubby, vital underside, where hides become leather
  and plain cloth becomes color. Stretched skins dry on frames down one side; on
  the other, sunken vats of dye send up their fumes, the ground around them stained
  in overlapping rings of madder-red and woad-blue. Workers move between them with
  rolled sleeves and stained forearms, unhurried in the heat. A young tanner hauls a
  hide from a vat one-handed, the thick scaled hide running up the back of that arm
  gleaming wet — a Blooming that lets her plunge into the harshest liquor without a
  glove and laugh about it.

  <ansi fg="itemname">the drying frames</ansi> line one wall, and across the lane
  steam <ansi fg="itemname">the dye-vats</ansi>.
