nouns:
  the old well: >
    A ring of mossy fieldstone around a deep dark shaft, a worn rope on a wooden
    windlass dropping away into cool echoing black. It predates the channel system
    and was never filled in — the water that comes up is colder and sweeter than
    any in the valley, and folk still draw from it for the things that matter. Drop
    a pebble and the splash comes back a long, slow heartbeat later.
  the fig tree: >
    An old fig grown sideways over the yard wall, its trunk gone gray and gnarled,
    its broad leaves throwing soft moving shade across the well. Ripe figs split
    and drop unharvested onto the stones, where wasps and birds finish them. It
    scents the whole corner with a warm honeyed musk.
  the youth: >
    A young person seated on the well's rim, knees up, half-shaded, turning their
    hands slowly in the light. Beneath the skin a faint shifting iridescence is
    surfacing — the first hours of a Blooming, when a body decides what it will
    become. They watch you arrive with the guarded calm of someone in a fragile,
    private moment, neither hiding nor inviting. In this valley, the kindest thing
    is simply to let them sit.
idlemessages:
- Deep in the well, water drips and the sound comes back doubled.
- A ripe fig drops from the leaning tree and bursts soft on the stones.
- A single drowsy fly circles and settles in the warm quiet.
