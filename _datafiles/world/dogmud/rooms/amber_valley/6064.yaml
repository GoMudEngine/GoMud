roomid: 6064
zone: Amber Valley
title: The Old Well Yard
description: >
  The noise of the town thins to almost nothing here, and the quiet has a sound of
  its own — the slow drip and echo of deep water, the buzz of one drowsy fly, the
  rustle of a fig tree's broad leaves. The sun pools warm in this dead-end corner,
  held by old walls that have soaked up a thousand afternoons.

  The yard is a forgotten pocket behind the working lanes, paved in cracked stone
  with grass pushing up between. At its center stands the old well, older than the
  town's piped channels and long since left for the cool deep water it still gives.
  A gnarled fig leans over one wall, dropping soft fruit that nobody clears. On the
  well's low rim a youth sits with knees drawn up, half in shade, watching the
  surface of a drawn bucket — quiet, a little wary, a faint shimmer of new color
  rippling beneath the skin of their hands as a Blooming comes on. The valley gives
  such ones this corner, and lets them be.

  <ansi fg="itemname">the old well</ansi> waits at the center, and over the wall
  leans <ansi fg="itemname">the fig tree</ansi>.
biome: land
coord: {x: -7, y: -32, z: 0}
exits:
