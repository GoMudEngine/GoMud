roomid: 6088
zone: Amber Valley
title: The Markers' Walk
description: >
  A narrow path winds east among the old trunks, and it is lined on both
  sides with standing stones — the <ansi fg="itemname">memorial markers</ansi>
  of the valley's most remembered Bloomings. They are not graves. No one is
  buried here; the marked ones lived long lives and many are living still.
  The stones are remembrances, raised so the change each person carried is
  not forgotten when the person is gone. The light comes down dappled and
  gentle, moving over carved names and worn faces of rock, and the moss
  grows thick at every base. To walk here slowly, reading, is a kind of
  prayer the valley teaches without ever saying so. The stones nearest the
  clearing are gray with great age and their carving nearly smoothed away;
  the <ansi fg="itemname">newest markers</ansi>, set further along, are
  sharper-cut and still pale at the edges.
