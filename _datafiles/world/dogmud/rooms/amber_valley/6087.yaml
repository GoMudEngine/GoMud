nouns:
  naming stone:
    >
    A low round stone, waist-high and worn smooth on top by generations of
    laid-on hands, stands at the clearing's heart. Here the changed one is
    set before the gathered valley, and the keeper of the Rite names the
    Blooming aloud — not the person's old name, but the new thing the world
    has given them — and the valley answers, welcoming it. The top of the
    stone is warm even in shade, as though it has kept some heat of every
    hand that ever rested there.
  trees:
    >
    The trees that ring the clearing are the oldest living things in the
    valley, broad-trunked and slow, their roots gone deep into soil no plow
    has ever turned. The people here believe the trees remember every
    Blooming named beneath them, holding the memory the way heartwood holds
    the rings of dry years and wet. To stand among them is to feel held by
    something patient and very old.
  Blooming:
    >
    A Blooming is what the valley calls a mutation — the morning a body wakes
    changed, grown strange and new. Where others flinch from such changes,
    Amber Valley has built its whole faith around welcoming them: the world,
    they say, does not mark you idly. It marks those it means to use. To
    Bloom is to be chosen, set apart, asked to carry a gift whose purpose may
    not be clear for years. The grief and the fear are not denied — only held
    inside a larger gladness.
  markers:
    >
    East of the clearing, half-seen among the trunks, runs a path lined with
    standing stones — the memorial markers of the valley's most remembered
    Bloomings. Each names a person and the change that took them. The path
    invites a slow walk and a slower reading.
idlemessages:
- The high canopy shifts and the pooled gold light trembles across the moss without ever leaving it.
- A deep, resin-warm stillness settles over the clearing, as though the old trees had drawn a slow breath.
- Somewhere in the ring of trunks a bird tries one soft note, thinks better of it, and falls silent.
