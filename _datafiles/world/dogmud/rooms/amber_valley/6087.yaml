zone: Amber Valley
title: The Chrysalis Grove
description: >
  The trees open into a clearing, and the clearing holds the light like
  water held in cupped hands. Ancient trunks ring it round, their canopies
  knitting high overhead into a vault of leaf and gold, and the floor is soft
  with moss and years of fallen leaves gone to a quiet brown. The air is
  warm and still and smells of resin and sun-warmed bark, and the hush here
  is not emptiness but fullness — a held place, a kept thing. This is the
  heart of the valley's faith. When a child of Amber Valley wakes one
  morning changed — scaled or many-eyed, antlered or strange of voice, a
  Blooming come upon them in the night — they are brought here, into the
  ring of the old trees, and the valley gathers to name the change a gift.
  Other places, harsher places, would call such a marking a curse and the
  marked one cursed. Here they read it otherwise: that the world itself
  reached out and chose this person, set its hand on them, asked them to
  carry something the rest cannot. At the clearing's center stands a smooth
  <ansi fg="itemname">naming stone</ansi> where each new Bloom is welcomed,
  and a path of <ansi fg="itemname">markers</ansi> leads east among the
  trees.
