roomid: 6082
zone: Amber Valley
title: The Cave — Pool
description: >
  The gallery opens and the sound changes — a soft, vast, lapping hush — and you
  stand at the edge of water. A still black <ansi fg="itemname">pool</ansi>
  fills the floor of this chamber, so flat and dark it makes no surface at all
  until a drip falls and rings it with spreading silver. The cold here is a wet
  cold that gets into the bones. Off to one side a
  <ansi fg="itemname">dripstone basin</ansi> catches the ceiling's slow seep,
  brimming clear and cold. The water gives back no reflection, only depth. Beyond
  the pool the floor falls away, and the way down continues into the dark.
biome: land
