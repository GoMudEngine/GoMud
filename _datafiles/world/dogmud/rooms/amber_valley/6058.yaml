roomid: 6058
zone: Amber Valley
title: East Market
description: >
  The smell hits you full and sweet — ripe apricots split warm in the sun, the
  honey-edge of overripe plums, the green sharpness of cut melon. Bees move through
  it all in a lazy golden drift, and nobody troubles to wave them off.

  This is the fruit market proper, where the valley's real wealth is piled in
  baskets and crates and spread on cloth: apricots in tumbled heaps, figs going
  dark and soft, grapes still dusty with their own bloom, melons stacked like
  cannonballs. The vendors here keep up a constant gentle patter, splitting a fruit
  to let you taste, pressing a sample on a passing child. An old man tending the
  biggest stall has bark-rough skin across the backs of his hands, and he uses the
  toughened pads of his fingers to twist stems without ever bruising the flesh.
  When the wind swings round from the south it carries the sharp tang of the
  tannery up over the sweetness from Tanner's Row, just down the lane — the
  vendors only shrug and fan it off; in this valley the sweet and the sour have
  always lived as near neighbors.

  <ansi fg="itemname">the fruit baskets</ansi> crowd every surface, and a
  <ansi fg="itemname">straw beehive</ansi> sits humming at the lane's edge.
