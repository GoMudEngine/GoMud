nouns:
  the fruit baskets: >
    Wide shallow baskets woven from valley reed, each heaped with a single kind of
    fruit so the colors run in a long ribbon down the stalls — apricot gold, plum
    purple, fig brown, the pale green of underripe grapes. The smell is almost
    too much, rich and warm and faintly fermenting at the edges where the softest
    fruit has begun to give.
  the straw beehive: >
    A domed skep of coiled straw on a low stone shelf, set deliberately at the
    market's edge so the bees can work the fallen fruit. They come and go in a
    steady gold thread, fat and unhurried. A small crock of comb-honey sits beside
    it with a hand-lettered sign: "Take a taste. Leave the bees be."
  the fruit seller: >
    A broad old man presiding over the largest stall, his hands and forearms
    sheathed in skin gone bark-rough and brown — a Blooming he plainly counts a
    blessing, since the toughened pads let him twist stems and turn thorned canes
    bare-handed. He'll split an apricot with his thumbnail and hand you the better
    half before you've decided to buy.
idlemessages:
- A bee bumbles past, heavy with the day's work.
- Juice runs down someone's wrist as a vendor splits a ripe fig to offer a taste.
- The drowsy hum of the skep rises and falls.
