roomid: 6059
zone: Amber Valley
title: West Lane
description: >
  Sound defines this lane — the rhythmic knock of a mallet on a hoop, the wet slap
  of clay being thrown, the rasp of a drawknife peeling a curl of pale wood. The
  smells follow close behind: fresh-cut timber, fired earth, and the faint linseed
  tang of finishing oil.

  This is the craft lane, where the valley makes the things it can't grow. A cooper
  works under an open shed, raising a barrel from staves, his bare arms dusted to
  the elbow in shavings. Across the way a potter sits hunched at a kicked wheel, a
  long cool ribbon of clay rising under her hands. She has an extra joint in each
  finger, and they fold and steady the wet clay in ways an ordinary hand never
  could — she works half again as fast as anyone, and says so cheerfully to anyone
  who asks. Finished work leans and stacks along the walls, drying in the sun.

  <ansi fg="itemname">the cooper's shed</ansi> stands open on the left, and
  <ansi fg="itemname">the potter's wheel</ansi> turns on the right.
