nouns:
  the cooper's shed: >
    An open-fronted workshop hung with tools and ringed with barrels in every
    stage of making — bare staves, half-raised hoops, finished casks gleaming with
    oil. The floor is ankle-deep in fragrant curls of shaved wood, and a low fire
    smolders in a brazier the cooper uses to char the insides of his barrels. The
    whole place smells of resin and warm oak.
  the potter's wheel: >
    A heavy stone flywheel kicked steadily round by the potter's foot while her
    hands coax a vessel up out of the spinning clay. Drying ware crowds the shelves
    behind her — bowls, jugs, the wide shallow water-crocks every valley house
    keeps. Her double-jointed fingers move over the clay in a quick rippling
    fashion that's oddly hypnotic to watch.
  the finished work: >
    Rows of made things set out to dry and cure along the lane's sunny wall:
    tight little casks, stacked bowls, coils of rope, a cradle, a stack of clay
    pipe for the irrigation channels. Each piece carries a maker's mark scratched
    in the base — and beside several, a second small mark, the Blooming-sign of a
    crafter proud of the hands that made it.
idlemessages:
- A drawknife rasps, and a long pale curl of wood drops to the floor.
- The potter's wheel hums round, steady as a heartbeat.
- The cooper's mallet rings against an iron hoop, three quick strokes.
