zone: Greywater Flats
title: Where the Reeds End
description: >
  The smell tells you before your eyes do — the cold green rot of the marsh
  gives way all at once to turned earth and growing grain, warm and dry and
  clean. The reeds end here in a ragged last line, and beyond them the
  ground lifts into worked soil, the first proper hedged field with a stout
  <ansi fg="itemname">field gate</ansi> set in its corner. You step from the
  wild wet country onto the edge of the kept one. Behind you the flats lie
  grey and endless; ahead, the ordered green of a <ansi fg="itemname">crop</ansi>
  stands in straight drilled rows, fenced and ditched and unmistakably
  owned.
