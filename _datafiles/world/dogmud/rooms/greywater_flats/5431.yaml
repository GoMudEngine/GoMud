nouns:
  field gate: A five-barred gate of split oak hung on an iron pin, set in
    the corner of the first true field, latched with a loop of worn rope.
    The wood is silvered with weather and rubbed smooth at the top bar
    where field-hands have leaned to talk. A hollow in the gatepost holds
    a coil of spare twine and a forgotten clay pipe.
  crop: Young grain stands in the field beyond the hedge, drilled in
    dead-straight rows, green and even and well-tended — barley, by the
    look of the awns just forming. It is a different thing entirely from
    the wild reed and sedge behind you. Every stalk of it belongs to
    somebody.
  reeds: The last ragged line of them, marking the edge of the wet like a
    tide-line. Behind, they run unbroken to the grey horizon; ahead, not
    one. The boundary between marsh and field is as sharp as a drawn rule —
    the work of the ditches, draining the wild back acre by acre.
idlemessages:
- A skylark climbs invisibly overhead, pouring down a thin endless song.
- The warm dry smell of growing grain drifts off the field, strange after the marsh.
- The young barley ripples all one way as a gust crosses it.
- A hare lopes along the hedge-bottom, freezes at the sight of you, and is gone.
