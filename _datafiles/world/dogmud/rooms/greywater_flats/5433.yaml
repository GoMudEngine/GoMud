roomid: 5433
zone: Greywater Flats
title: Kingsbarrow March
description: >
  Here the flats are wholly behind you and the capital's granary country
  begins in earnest — rich hedged fields to the very horizon, the road
  running straight and well-metalled and purposeful toward a far smudge of
  roofs and the unmistakable bulk of distant <ansi fg="itemname">granaries</ansi>
  and mill-towers standing up above the green. You have left the wild
  country entirely. This is the breadbasket that feeds a city, and the city
  itself is no longer a rumour but a destination you are walking toward. A
  carved <ansi fg="itemname">march stone</ansi> at the roadside names the
  ground ahead and marks the bound of the Vale of Kingsbarrow.
