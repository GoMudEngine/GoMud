roomid: 5423
zone: Greywater Flats
title: Greywater Meadows
description: >
  The noise reaches you before anything else — a vast wet racket of
  waterfowl, thousands of them, calling and squabbling and beating up off
  the pools in sudden grey clouds. Wide water-meadows stretch to every
  horizon, tall reeds and sedge and standing pools bright as hammered
  pewter, the enormous sky doubled in the water so that you seem to walk
  along a seam between two skies. Beautiful and lonely and deafening with
  birds. A <ansi fg="itemname">half-sunk punt</ansi> lies abandoned at the
  road's edge where a wildfowler left it; the <ansi fg="itemname">reeds</ansi>
  shift and part with the movement of things you cannot see.
biome: shore
