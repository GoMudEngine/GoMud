roomid: 5427
zone: Greywater Flats
title: The North Bank
description: >
  You come up dripping onto the firmer north bank, the ford and its
  ledger-keeping post behind you, and the flats resume ahead — but
  changed. The reeds are cut back from the road in a clean margin, the
  verges trimmed, a <ansi fg="itemname">milestone</ansi> set square and
  upright where the south bank had only a drowned and forgotten one.
  Everything here is a degree more ordered, more kept, more watched. A
  <ansi fg="itemname">drying rack</ansi> hung with nets stands by a
  fisher's hut, and the road runs on north, straight and purposeful,
  toward the country the capital counts as its own.
