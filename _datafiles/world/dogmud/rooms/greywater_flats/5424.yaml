roomid: 5424
zone: Greywater Flats
title: The Causeway
description: >
  The road climbs onto a raised <ansi fg="itemname">causeway</ansi> of laid
  stone, lifting it dry across the boggy heart of the flats — and at once
  you are out in the middle of the wet with nowhere to step off. Grey
  water lies flat and still on both sides, close enough to touch, broken
  only by reed-clumps and the slow rings of rising fish. The causeway is
  old and well-built, its stones cambered to shed the rain, the work of
  some long-dead authority that wanted this road kept open. A
  <ansi fg="itemname">drowned milestone</ansi> stands canted in the water
  to one side, its base long since swallowed by the bog.
biome: swamp
