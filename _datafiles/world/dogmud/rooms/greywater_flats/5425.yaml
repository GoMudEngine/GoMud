roomid: 5425
zone: Greywater Flats
title: Ford Approach
description: >
  The causeway runs down off its bank onto firmer ground, and there ahead
  of you is the <ansi fg="itemname">river</ansi> — wide and slow and grey,
  the colour of the sky it carries, sliding past without a sound. The road
  drops to a churned mud landing where it runs down into the shallows of
  the ford, the bank trodden to black soup by years of crossings. A
  wagon waits its turn at the water's edge, the driver eyeing the current.
  A flat-bottomed <ansi fg="itemname">ferry-skiff</ansi> is drawn up on the
  mud for those who would rather not wet their boots, for a coin.
biome: land
