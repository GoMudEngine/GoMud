nouns:
  river: Broad and slow and silent, a sheet of moving pewter that gives
    back the grey sky almost whole. It is wider than it first looks — the
    far bank a low green line softened by river-mist — and the smooth skin
    of it hides a steady, patient pull. Where the road meets it the water
    runs shallow and braided over a paved bottom, the ford.
  ferry skiff: A broad flat-bottomed punt drawn up on the landing, a coil
    of rope and a long pole beside it. A board nailed to a stake gives the
    fare for a crossing — a copper for a person, more for a beast or a
    load. The ferryman is somewhere about, in no hurry.
  landing: The bank where the road meets the water, churned to a black
    glistening mud by uncounted crossings, printed over with the marks of
    hoof and wheel and boot. A discarded broken trace and a single lost
    boot lie trodden half into it.
idlemessages:
- The waiting wagon's oxen shift and blow, unhappy at the water's edge.
- The river slides past without a sound, smooth and grey and endless.
- A coot paddles out from the reeds, thinks better of it, and turns back.
- River-mist drifts low over the far bank, softening it to nothing.
