zone: Greywater Flats
title: The Drying Flats
description: >
  The land firms underfoot, the reeds thinning to rough wet pasture
  stitched across with more of the ruler-straight <ansi fg="itemname">ditches</ansi>,
  each one bleeding a little more of the wild out of the ground. A few
  lean beasts graze the tussocky grass, and here and there a first proper
  hedge has been laid to mark a field that does not quite exist yet. The
  marsh is losing and knows it. Ahead the ground rises into the clean
  geometry of worked land — the capital's farmland, beginning. A
  <ansi fg="itemname">drainage marker</ansi> stuck in the turf numbers
  this acre against some distant ledger.
