nouns:
  ditches: A grid of dug channels ruled across the drying ground, the
    newest of them still raw, the older ones already greening at the lip
    and carrying a thin steady trickle away toward the great cut. Between
    them the ground is no longer marsh and not yet field — a wet
    in-between, grazed by whoever can drive a beast onto it.
  drainage marker: A short stake of tarred wood driven into the turf,
    numbered and lettered on a tin plate nailed to its top. It means
    nothing to the eye and everything to a clerk — this acre, drained and
    measured and entered in a book in some far office, waiting to become
    somebody's field and somebody's rent.
  beasts: A handful of lean cattle and a few rough sheep, grazing the
    tussocky in-between ground, splashed to the hock with grey mud. They
    lift their heads to watch you pass with the slow suspicion of animals
    that see few strangers, then go back to the grass.
idlemessages:
- A thin trickle of marsh-water runs steadily down one of the new ditches.
- A muddy beast lifts its head, regards you without interest, and grazes on.
- The wind has lost its reed-hiss here and carries instead the smell of turned earth.
- A lapwing tumbles overhead with a thin wailing cry, guarding some hidden nest.
