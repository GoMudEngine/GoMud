zone: Greywater Flats
title: The Fen Road
description: >
  The smell changes first — Hartcharn's woodsmoke and bread fall away
  behind you and the air turns cool and green and faintly rotten, the
  smell of standing water and crushed sedge. The road runs out of the
  town's firm fields onto low ground, the verges softening to black peat
  where the first <ansi fg="itemname">reeds</ansi> lean in the wind. Ahead
  the country opens flat and wet and enormous, all grey water and greyer
  sky, with no high ground anywhere in it. A leaning <ansi fg="itemname">boundary
  marker</ansi> at the roadside names the edge of the town's land.
