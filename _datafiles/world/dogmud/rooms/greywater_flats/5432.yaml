roomid: 5432
zone: Greywater Flats
title: The First Furlongs
description: >
  Proper farmland now, and a great deal of it — big hedged fields of grain
  rolling away north in ordered green squares, a well-worn cart track
  joining the road, a <ansi fg="itemname">farmstead</ansi> standing among
  its barns and ricks a half-mile off. This is settled, productive,
  watched-over country, every furlong of it ploughed and drilled and
  counted. The abundance of it is its own kind of statement after the wild
  flats. A weathered <ansi fg="itemname">field shrine</ansi> stands where
  the cart track meets the road, hung with a few ears of last year's grain
  in thanks or in hope.
