title: The Survey Post
description: >
  Where the road crosses a dead-straight drainage cut, a tall
  <ansi fg="itemname">survey post</ansi> stands planted in the soft ground
  — a squared pillar carved with the capital's seal and crowned with a
  weathered proclamation, the unmistakable mark of land the bloodline
  counts as its own. The wild flats are being made to heel here: the
  <ansi fg="itemname">drainage cut</ansi> runs ruler-straight to the
  horizon, a stone sluice set in its bank to bleed the marsh dry an acre
  at a time. The water is grudging and the work is slow, but the intent is
  plain — the capital is reaching out to drain the wet and count what it
  drains.
