roomid: 5426
zone: Greywater Flats
title: Tollford Crossing
description: >
  Cold grey water closes around your boots as the road runs down into the
  river — the ford is a paved causeway laid just below the surface, marked
  by withy stakes, shallow enough to wade or cart across if you keep to the
  line. The current pushes steady and cold against your shins, smelling of
  silt and cold stone. On the far landing stands a small toll-and-survey
  post, and on it the first hard sign of who governs this country — a
  <ansi fg="itemname">survey marker</ansi> cut with a seal you do not yet
  know, and beside it a posted <ansi fg="itemname">notice</ansi> in the
  flat language of authority. A bored official keeps a ledger of who
  crosses, and where they are bound.
