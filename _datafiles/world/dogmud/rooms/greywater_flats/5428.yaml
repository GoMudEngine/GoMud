roomid: 5428
zone: Greywater Flats
title: Heron Marsh
description: >
  Here the noise of the open meadows falls away into a deep green
  stillness. A backwater marsh lies beside the road, screened by alder and
  reed-mace, its still water skinned with weed and floating lily — and in
  the shallows the grey <ansi fg="itemname">herons</ansi> stand, one and
  another and another, motionless as carved posts, each waiting on its own
  patience. Frogs creak. A dragonfly stitches the air. Nothing hurries
  here; the wild has simply set itself to wait. A rotting <ansi fg="itemname">duckblind</ansi>
  leans half-collapsed at the water's edge, slowly going back to the marsh
  that made it.
biome: swamp
