nouns:
  herons: Grey herons, a half-dozen of them spaced across the shallows,
    each standing on one folded leg as still as a thing made of stone and
    old smoke. They do not acknowledge you, or each other. Then one, with
    no warning, uncoils and stabs and lifts a struggling silver thing, and
    is still again, as if it had never moved.
  duckblind: A fowler's hide of woven withies and reed-thatch, set at the
    water's edge a long time ago and long since abandoned, the roof fallen
    in, the whole thing settling back into the marsh. A few rusted hooks
    and a rotted coil of net still hang inside, and something small has
    made a nest in the dry corner.
  backwater: Still, dark green, its surface a quilt of duckweed and lily
    pad broken only where a fish or frog disturbs it. Dragonflies hang and
    dart above it. It looks shallow and is not; an alder branch thrust in
    finds no bottom.
idlemessages:
- A heron stabs the shallows and comes up with something silver and writhing.
- Frogs creak in slow chorus from the weed, fall silent, then begin again.
- A dragonfly hangs glittering before your face, then flicks away.
- A lily pad tips and rights itself as something passes beneath it.
- The deep green stillness settles back, patient and unhurried, after the heron's strike.
