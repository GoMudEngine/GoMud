title: The Void
description: Darkness in every direction -- no floor, no edge, no sound but the
  echo of your own breath. There is a weight to the black, and a patient, ancient
  awareness somewhere in it, watching. You are not quite here yet. Not quite
  anywhere. The world is waiting for you to step into it.
