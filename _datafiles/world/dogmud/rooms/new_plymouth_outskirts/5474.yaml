nouns:
  barrows: A mixed fleet of market carts and handbarrows, ranging
    from heavy two-wheel pushers to improvised trays on salvaged
    wheels, all loaded with goods of uncertain provenance — handled
    glassware, used tools, cloth of no clear origin, stoppered
    bottles without labels, and wrapped bundles that shift and
    clink when touched. A buyer who pays attention to which
    questions go unanswered will be better placed than one who
    asks where the goods came from.
  corner: Not a shop and not a seller, exactly. A man stands in
    the back-wall corner with no visible goods and no tray, but
    a steady traffic of brief exchanges, hand meeting hand and
    separating again with practised speed. He watches the yard
    between transactions with the patience of someone who has no
    pressing reason to be anywhere else.
  children: A loose and shifting group ranging from perhaps seven
    to perhaps fourteen, some visibly employed in carrying messages
    or small parcels, others apparently employed in nothing visible
    at all. All move with the particular alertness of those whose
    income depends on noticing things before being noticed.
idlemessages:
- A hawker adjusts a cloth over his barrow as a nearby hand lingers too long.
- A knot of <ansi fg="itemname">children</ansi> scatter from the corner and reform two stalls over.
- Two men transact something at the <ansi fg="itemname">corner</ansi> too quickly to follow.
- A woman at a loaded tray names a price that sounds too low to be honest.
- Dust rises from the yard's packed earth as a barrow is wheeled to a new spot.
