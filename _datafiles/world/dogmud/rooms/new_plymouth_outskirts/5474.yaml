title: The Hawkers' Yard
description: >
  Dust and noise together — that is the first impression the yard
  gives, a packed-earth clearing where a dozen <ansi fg="itemname">barrows</ansi>
  and loaded trays have mustered at odd angles, all of them talking
  at once. The goods on offer have a look about them, an uncertainty
  of origin that the sellers do not invite questions about. Against
  the back wall a knot of men occupies a narrow space where a
  different sort of trade runs quiet and quick at the <ansi fg="itemname">corner</ansi>.
  Threaded through the whole scene a shifting cluster of
  <ansi fg="itemname">children</ansi> from roughly seven to roughly fourteen carry
  messages, run parcels, and occasionally carry something else that
  did not belong to them a moment before.
