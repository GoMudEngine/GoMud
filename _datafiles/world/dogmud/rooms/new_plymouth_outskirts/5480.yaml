nouns:
  river road: A working track worn into the riverbank mud — unpaved,
    undrained, showing wheel-ruts and boot-scour. It connects the
    ford crossing to the dock district without passing through any
    checkpoint. The city maintains it by ignoring it. The people
    who use it appreciate the arrangement.
  masts: The upper rigging of ships moored in the dock-basin shows
    above the wall — bare spars, furled canvas, the tangle of rope
    and tackle that means active trade. How many ships, and what
    they carry, cannot be seen from here. The smell of tar and rope
    and brine can.
  stash: A flat stone near the base of the wall, different from its
    neighbors by the way it sits slightly proud of the ground —
    moved and replaced enough times to settle in a groove.
    Underneath, a shallow scrape holds a folded oilskin and a hollow
    reed sealed with a wax plug. The reed contains a small rolled
    note, and the note contains instructions in a hand that takes
    care to stay anonymous.
idlemessages:
- The tar-smell sharpens when the wind comes off the water.
- A rope coil lies at the path's edge — recent, dry, left in a hurry.
- Gulls call from somewhere above the wall, over the dock-basin.
- The masts above the wall shift slightly in a river-wind that does not reach the road.
- Somewhere ahead, water slaps against a hull in a slow, patient rhythm.
