title: River Road
description: >
  Brine and tar reach you first — salt and pitch and the cold
  mud-smell of a working river growing stronger as the dock-basin
  draws nearer. A rough track follows the city wall north along the
  water's edge, the riverway widening and darkening as the current
  slows. Above the wall-top, <ansi fg="itemname">masts</ansi> show
  against the sky — bare spars and rigging that tell you the city's
  trading heart is close on the other side of the stone. The
  <ansi fg="itemname">river road</ansi> runs on toward the docks,
  unpaved and rarely inspected, the route for goods that travel
  without declaring themselves. The dock quarter and the Temple
  District lie beyond the wall — the docks open now to the north up the road, the Temple still sealed beyond.
