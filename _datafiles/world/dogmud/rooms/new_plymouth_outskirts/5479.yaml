zone: New Plymouth Outskirts
title: The Ford
description: >
  You hear the ford before you see it — a shallowing rush of water
  over flat stone, the river spreading wide and going quiet. The
  crossing is knee-deep at most, the riverbed a litter of flat grey
  slabs gone slippery with weed. The banks on both sides are churned
  dark, and the <ansi fg="itemname">ford</ansi> itself bears the
  traffic of those who would rather cross cold than present themselves
  at the gate. The city wall looms close on the far bank, looking
  nowhere in particular. Under a leaning willow on the near side, a
  <ansi fg="itemname">skiff</ansi> is moored and a man sits wrapped
  in a heavy coat, watching the crossing without appearing to. He
  will ferry the wet-shy for a coin and ask nothing about the rest.
