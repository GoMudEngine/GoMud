nouns:
  ford: A river crossing shallow enough that most wade it without
    trouble — cold water to the knee, a slippery bottom of flat
    weed-covered stone, and no checkpoint on either bank. The wear
    on the mud is old and deep. This crossing has served as a
    gate-bypass for as long as the gate has had a fee. The city
    does not officially acknowledge it exists.
  skiff: A flat-bottomed river skiff moored to a willow root with
    a length of rope — small, unpainted, showing the scars of heavy
    use. The boatman makes no pitch and asks no questions. The fare
    is whatever he names. He names it once.
  marker: A notch cut into the willow's bark at eye level — a
    cross-stroke inside a circle, no bigger than a thumbnail. Below
    it, someone has pushed a small oilskin packet into the gap
    between root and bank, sealed with wax. For those who know what
    the mark means, there may be something inside worth finding.
idlemessages:
- The river moves over the ford stones in a low, constant sound.
- A boot-print fills with river water at the bank's edge and slowly levels.
- The boatman turns a coin over in his fingers without looking at it.
- Someone crosses the ford ahead — steady, unhurried, not looking back.
- A heron stands knee-deep in the shallows upstream, perfectly still.
