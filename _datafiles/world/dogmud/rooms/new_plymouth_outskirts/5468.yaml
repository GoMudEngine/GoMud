nouns:
  shady stalls: The goods here are harder to look at directly —
    not because they are hidden but because their sellers have
    arranged them to be overlooked by those not seeking them.
    Trays of keys in uncertain condition. Carved seals and
    signet rings. What appears to be military equipment sold
    by someone who acquired it informally. A cloth-covered
    table holds a chained strongbox — the seller names a price
    that assumes specific need. Most goods have no clear origin
    and most sellers have no name. Items may be left here in
    storage at a half-copper per day, no questions offered.
  shanties: The structures lining these lanes began as stalls
    and accumulated. Poles became frames, oilcloth became
    planking, and what was a single season's pitch became a
    decade of occupation. The result tilts at angles no
    building permit would allow, rooflines joining each other
    in ways that create unexpected interior spaces. People
    live in some of them as well as trade from them. Windows
    are squares of oilskin. Smoke finds its way out through
    the boards.
  crowd: The people moving through this part of the market move
    differently — tighter, more aware of the bodies around
    them, faces angled to see without appearing to watch.
    There are travellers with the road still on them, refugees
    with everything they own in a bundle, and people whose
    purpose here is unclear and who prefer it that way. The
    crowd has its own patterns and is not entirely welcoming
    to those who cannot read them.
idlemessages:
- A hooded figure leans against a shanty wall and watches the
  lane without appearing to watch anything in particular.
- Something near one stall is leaking — a dark puddle spreading
  slowly across the packed earth floor.
- A beggar rattles a tin cup in the press of the crowd, her
  appeal swallowed by the general noise around her.
- A sharp argument breaks out two stalls to the east — voices
  rising fast, then cutting off just as suddenly.
- The smell of burning fat from an unseen fire drifts through
  the lane, thick enough to taste.
