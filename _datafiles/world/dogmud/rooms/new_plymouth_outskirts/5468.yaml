title: Market Sprawl
description: >
  The smell reaches you first — the accumulated reek of too
  many people in too little space, sharpened by frying fat and
  the sweet rot of refuse piled against the leaning walls. The
  market thickens here into narrower lanes between crooked
  structures that are half tent and half shed, the
  <ansi fg="itemname">shady stalls</ansi> offering goods that
  are harder to identify and sellers less willing to have them
  examined closely. Hands stay near purses without anyone
  admitting why. Above the roofline of the
  <ansi fg="itemname">shanties</ansi>, the city wall fills the
  sky to the north — massive and indifferent — and the
  unlicensed inn called the Broken Gate opens its low door to
  the west. Every gap between the stalls holds somebody —
  sheltering, watching, waiting for something not yet arrived.
