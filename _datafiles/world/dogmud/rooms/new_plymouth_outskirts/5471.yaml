nouns:
  portcullis: Iron bars thicker than a man's wrist, latticed and secured
    in their grooves by chains running into the wall's machinery above.
    Decades of grime and rust-streaks mark the iron, but the mechanism
    is evidently maintained — the chains are oiled, the grooves clear.
    Something in the towers above can drop the whole assembly in seconds.
  guardpost: A low stone hutch at the tunnel's inner mouth, its counter
    window facing the gate traffic. A duty sergeant sits behind a ledger
    and a stamp. Papers go in; a mark goes on them; people go through.
    The ledger is very thick. Each entry in it is someone's crossing.
idlemessages:
- A guard holds out a hand — papers, not a greeting.
- A traveller argues at the checkpoint, then accepts the answer and steps aside.
- From beyond the tunnel the city exhales — noise, smoke, a thousand voices.
- A pigeon sails out of the tunnel mouth, indifferent to the queue behind it.
- The portcullis chains groan in a draught that finds the tunnel mouth.
