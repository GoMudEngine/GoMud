roomid: 5471
zone: New Plymouth Outskirts
title: The East Gate
description: >
  The gate-tunnel is ten paces of dressed stone, its ceiling lost in
  shadow, the iron teeth of the <ansi fg="portcullis">portcullis</ansi>
  raised overhead on chains as thick as your arm. Guards in the
  bloodline's livery flank both ends of the passage and work the middle
  of it — stopping every person, checking every paper and parcel, waving
  the approved through and turning back the rest with a brevity that
  admits no appeal. You are not yet through. Beyond the far mouth of the
  tunnel the city reveals itself in glimpses — packed streets, smoke
  rising from a hundred hearths, a tower above the roofline, and the
  <ansi fg="guardpost">guardpost</ansi> hut where the duty sergeant sits
  with a stamp and a heavy ledger. Behind it all comes the sound, felt as
  much as heard — the low continuous roar of a hundred thousand lives,
  pressing right up to the wall from the inside.
biome: city
