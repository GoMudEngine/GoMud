zone: New Plymouth Outskirts
title: The Broken Gate
description: >
  The smell finds you before your eyes have adjusted — cheap ale,
  old smoke, and the close press of too many bodies in a room with
  low beams and no ventilation worth mentioning. The common room of
  the Broken Gate resolves out of the dimness as a low-ceilinged
  space of rough tables, mismatched stools, and a <ansi fg="itemname">bar</ansi> of raw
  timber spanning one end. A <ansi fg="itemname">board</ansi> beside the door is thick
  with pinned notices in several hands. The <ansi fg="itemname">corners</ansi> are
  already occupied by those who paid for a spot on the floor and
  the right to sleep on it without questions. A copper buys a night
  here, and no questions asked is part of the arrangement.
