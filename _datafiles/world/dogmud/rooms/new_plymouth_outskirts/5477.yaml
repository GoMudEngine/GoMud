title: Workshop Warren
description: >
  The reek of solvent and hot metal and something sulfurous drifts
  out of the narrow gap between buildings — this is a working warren
  tucked against the wall where the inspectors do not reliably come.
  <ansi fg="itemname">Workshops</ansi> crowd shoulder to shoulder — a
  back-street smith hammering behind a half-shut door, a still
  bubbling in an open lean-to, a counterfeiter's establishment
  presenting only a nailed-shut shutter and a smell of wax and acid.
  A <ansi fg="itemname">crate</ansi> of goods with no shipper's mark
  stands wedged against the nearest door. The trades here pay no
  guild-dues and answer no summons — they work in the margin between
  the city's attention and its indifference, and the margin is narrow
  enough to keep them alert.
