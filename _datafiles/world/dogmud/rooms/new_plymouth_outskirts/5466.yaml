title: The City Road
description: >
  The kilns and yards of the works fall behind and the road
  broadens into a proper paved avenue. Ahead — filling the
  northern sky from edge to edge — the
  <ansi fg="itemname">city walls</ansi> of New Plymouth rise
  in smoke-crowned stone, taller and vaster than anything on
  the long road, the grey face pressing the horizon flat
  beneath the great gatehouse and the slow dark plume of the
  city's own smoke above it. Traffic surges around you without
  pause — laden carts grinding south, foot passengers shouldering
  north toward the gate, pedlars working the crowd's edges with
  trays of cheap goods. At the road's edge a worn
  <ansi fg="itemname">waystone</ansi> marks the city's formal
  boundary, smoothed by a thousand passing hands. After the
  long empty miles, the press and noise and smell of the crowd
  is a physical thing. You have arrived at the capital.
