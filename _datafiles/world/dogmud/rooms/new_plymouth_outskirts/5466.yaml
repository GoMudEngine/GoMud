nouns:
  city walls: The walls of New Plymouth are not decorative —
    they are the product of centuries of civic will, dark grey
    ashlar rising to a height that makes the road below feel
    incidental. The near face is stained by the city's own
    smoke, stratified in soft bands from the base to the high
    battlements. A great gatehouse interrupts the wall to the
    north, traffic funnelling into its shadow in a continuous
    stream. The sheer scale of it is not easy to hold in a
    single look.
  waystone: A squat column of worn granite stands at the road's
    edge, older than the paving around it — its face barely
    legible beneath the grease of a thousand coins and wishes
    pressed there by travellers entering and leaving the city.
    The top has been hollowed into a shallow basin. It holds a
    few copper coins left as offerings, a folded scrap of paper
    wedged under a stone, and a dried sprig of something aromatic.
    Other offerings are pushed into the crack at the base.
    Someone has scratched a small hand pointing north into the
    stone below the old inscription.
idlemessages:
- A hawker with a basket of hot pies shoulders through the
  crowd, calling prices in a voice pitched to carry over the noise.
- A heavy wagon loaded with barrels grinds slowly north, its
  driver cursing at the foot traffic pressing in around it.
- A city guard in dull iron livery stands at the road's edge,
  watching the flow with the bored vigilance of long practice.
- Someone's dog threads the crowd at ankle height, nimble and
  purposeful, and vanishes under a passing cart.
- A family rests at the road's verge — packs and bundles stacked
  around them, two children asleep on the baggage.
