title: The Shambles
description: >
  The smell reaches you before the sight does — tallow-fat, woodsmoke,
  and beneath those the sour reek of a tannery working somewhere to the
  west without licence or ventilation. The lane ahead is a warren of
  <ansi fg="tenements">tenements</ansi> pressed so tightly against one
  another that their upper storeys lean across the way, washing lines
  strung at every height and heavy with patched linen and children's
  things. The city wall closes the north end of the lane — massive, grey,
  indifferent to everything heaped against its base. Wedged beside a
  doorstep, a <ansi fg="handcart">handcart</ansi> piled with salvage and
  dry goods holds up the passage while its keeper haggles through an open
  door, oblivious to the press of bodies edging around it.
