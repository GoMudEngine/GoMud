nouns:
  tenements: Buildings jammed against the city wall and one another, their
    timbers bowed outward with decades of settlement. Upper floors are
    reached by external stairs bolted on as afterthoughts. Every flat
    surface holds something — a flower pot, a rope coil, a candle burning
    in a cracked pane. They list slightly toward the lane as though the
    wall behind them is pushing gently forward.
  handcart: A two-wheeled cart heaped with salvage — cracked timber, a
    coil of rope, sealed clay jars, rags bundled by type. It is the
    Shambles rendered in miniature, everything useful that no one else
    wanted. Something worth having may well be buried in the pile.
idlemessages:
- A child darts between adult legs and vanishes through a ground-floor door.
- From above, two neighbours shout at each other about a shared wall.
- The irregular ring of an unlicensed hammer carries on the close air.
- A thin dog works the gutter with systematic hope.
- Somewhere overhead, something fries — the smell lasts a moment, then is gone.
