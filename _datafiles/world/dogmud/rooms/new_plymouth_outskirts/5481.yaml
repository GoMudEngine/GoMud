roomid: 5481
zone: New Plymouth Outskirts
title: The Doss-House
description: >
  The smell greets you before the door does — unwashed bodies, old
  straw, tallow smoke, and the particular sour sweetness of too many
  people sleeping in too small a space. The <ansi fg="itemname">rope-beds</ansi>
  run in rows across the low room, most of them occupied by shapes
  beneath thin blankets. Between the rows, others have paid for
  floor-space only and lie wrapped in their own coats. The turnover
  is brisk and the linen is not changed between tenants. At a raised
  desk near the door, the keeper sits behind a
  <ansi fg="itemname">lockbox</ansi> and a ledger, watching the room
  with the flat attention of someone who has heard every story and
  trusts none of them. This is where those who cannot afford to wait
  outside, and cannot get further in, sleep.
biome: city
