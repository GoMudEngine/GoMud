roomid: 5473
zone: New Plymouth Outskirts
title: Stalls Row West
description: >
  Your eye catches the western row before anything else — heaps and
  tangles of second-hand goods piled without sorting on every flat
  surface, overflow spilling from crates to the ground. This is the
  shabby end of the outer market, where the desperate sell and the
  careful poor buy. A knife-grinder works his stone wheel at one
  corner, sparks falling in a steady drizzle of orange light. A
  charm-seller has spread his <ansi fg="itemname">tray</ansi> with knotted amulets and
  dried-herb bunches of dubious curative worth. The bulk of the row
  is the rag-and-bone trade — a long <ansi fg="itemname">salvage</ansi> heap of bent
  metal, cracked leather, old fabric, and broken tools, presided over
  by a seller who will name a price for anything a hand touches.
biome: city
