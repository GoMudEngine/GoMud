nouns:
  lean tos: Bent branches and salvaged timber draped with sacking
    and torn canvas, pressed close for warmth. Each shelter is
    barely high enough to sit upright in. Inside, rolled bundles
    line the back wall — a dented pot, a tied cloth of belongings,
    items carried from somewhere far to here and no further. A
    smell of packed damp and old smoke rolls from each one.
  alms bowl: A clay bowl set on a flat stone at the camp's margin,
    holding a scatter of copper pieces and a few crusts of bread.
    A rough wooden ladle rests across it. Whoever tends the bowl
    does so without ceremony — it is passed between the fires at
    mealtimes. There is not much in it. There is never much in it.
  families: Mothers with children folded against them for warmth.
    Old men who stare at the gate with the look of those measuring
    a diminishing chance. Younger men who take care not to draw
    notice from the wall guards. Every face carries the same
    arithmetic — tired and waiting and not yet done waiting.
idlemessages:
- A child reaches toward a cookfire and is pulled back by a quiet hand.
- Smoke shifts in the wind and stings the eyes before drifting on.
- A man near the wall coughs at length and then is silent.
- Low voices carry from inside a lean-to — too quiet to make out, too steady for argument.
- A crow drops from overhead, takes something small from the ground, and lifts away before anyone stirs.
