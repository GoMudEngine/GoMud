zone: New Plymouth Outskirts
title: The Refugee Camp
description: >
  Smoke from a dozen cookfires hangs low and acrid, carrying the
  smell of burned bone-broth, damp wool, and bodies pressed too
  close together. The strip of ground between the city wall and the
  outer track is claimed entirely by <ansi fg="itemname">lean-tos</ansi>
  of bent timber and salvaged sacking — close-packed, canvas sides
  touching. Small families squat at fires too little for the cold.
  The old and the sick lie near the wall on spread cloth, and
  children move between the shelters with the quiet, pinched look
  of those who have learned not to ask. These people reached the
  city and found it shut. They wait at the wall because they have
  nowhere else to wait — and the gate has not opened for them yet.
