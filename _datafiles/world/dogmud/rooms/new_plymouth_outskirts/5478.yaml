nouns:
  path: A narrow track worn into the riverbank mud — unpaved,
    unmarked, connecting nowhere official to nowhere official. The
    boot-prints in the soft ground come in all sizes, and none of
    them are a guard's boots. Whoever keeps this route does so
    without declaring it a route — it is just a path, if the wrong
    person asks.
  cache: A bundle of oilcloth wedged between the reeds and the
    base of the wall, pushed just far enough under the water's edge
    to vanish in a quick glance. Empty now, or recently emptied —
    but the fold-marks show it has been used and used again.
    Someone checks this regularly and does not want to be observed
    doing so.
  wall: The city wall runs north here — close and featureless, no
    postern, no guard-walk visible from below. From the river side
    the wall is simply a fact. Someone has scored a mark into the
    stone at shoulder height — four lines and a cross-stroke, the
    kind left by those who need to know where they are without asking.
idlemessages:
- The river sounds closer here — a low, patient moving.
- A heron lifts from the reeds without sound and goes upstream.
- Water moves around something ahead — a log, a mooring-post, or a boot.
- The city wall shows no movement above — no watch, no light.
- A figure comes around the bend, clocks you, and slows slightly before continuing on.
