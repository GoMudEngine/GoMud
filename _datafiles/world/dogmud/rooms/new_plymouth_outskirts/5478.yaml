title: Riverside Path
description: >
  The smell of river-mud and reed-rot comes first — a grey, cold,
  mineral smell that tells you the gate-apron is behind you and the
  river is ahead. A rough track branches from the approach road and
  runs north along the base of the city wall, following the waterway.
  The <ansi fg="itemname">path</ansi> is unpaved and shows its traffic —
  packed mud, boot-prints, a groove worn by something dragged
  repeatedly. The wall rises on the right hand, tall and close and
  unwatched from this angle. Reeds and scrub press in on the left.
  This is the way taken by those who would rather not be counted at
  the gate — and the path does not judge.
