title: Stalls Row East
description: >
  The sellers' cries run together here into a solid wall of noise —
  price on price, pitch layered over pitch, the whole row speaking
  at once until the words lose their meaning and what remains is
  pure market. A double rank of stalls fills the lane, their canvas
  awnings sun-bleached and re-patched, loaded with bolts of cheap
  cloth, stacked clay pots, tin trinkets, smoked fish, and spice
  bundles. At the lane's far end a food-seller tends an iron
  <ansi fg="itemname">grill</ansi>, smoke hanging low and drawing flies to the meat.
  The <ansi fg="itemname">stalls</ansi> press so close that the crowd must turn sideways
  to pass between them — a shuffling press of householders, workers,
  and sharpers, every second exchange a price and every third a counteroffer.
