nouns:
  queue: A slow shuffle toward the gate arch — merchants with manifests,
    farm families with handcarts, lone travellers with papers already
    out. The mood is patient resignation laced with low anxiety. The
    guards move the line when they feel like it, and the line has learned
    to wait.
  noticeboard: A board on a heavy post set into the cobbles, covered in
    layers of posted paper. Gate regulations sit at the top, then tariff
    schedules for commercial goods, then a column of wanted notices with
    rough descriptions and offered rewards. Someone has added a small
    caricature at the bottom that no one officially acknowledges.
idlemessages:
- A guard waves a cart out of the line for a closer inspection.
- A tout presses a folded pamphlet into the hand of anyone who slows.
- A child runs the length of the queue selling water from a clay jug.
- A family counts coins quietly at the back of the line, heads together.
- The gate bell rings once — the line shuffles forward three steps.
