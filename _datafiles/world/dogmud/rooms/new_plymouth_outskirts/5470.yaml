roomid: 5470
zone: New Plymouth Outskirts
title: Gate Approach
description: >
  The lane breaks open onto a wide cobbled apron and you see it at last —
  the east gate of New Plymouth, two towers of dressed stone flanking a
  deep archway, the portcullis raised, the city wall running away on both
  sides as far as you can see. Filling the apron between gate and lane is
  a <ansi fg="queue">queue</ansi> — a slow press of travellers, carts,
  merchants with manifests and families with everything they own on their
  backs, all inching forward as the guards process each in turn. Hawkers
  and beggars and touts work the waiting crowd from the margins without
  sentiment. Near the gate arch, a <ansi fg="noticeboard">noticeboard</ansi>
  fixed to a heavy post displays gate rules, tariff schedules, and a
  column of wanted notices. The wall above makes everything here feel low
  and watched.
