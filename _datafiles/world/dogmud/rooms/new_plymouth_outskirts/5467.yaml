nouns:
  market stalls: The stalls run east and west in rough lanes,
    selling everything the city sells inside but cheaper —
    bolts of rough cloth, trays of second-hand tools, jars of
    unidentified preserved goods, herbs and spices of uncertain
    provenance. The quality varies wildly between neighbours.
    Prices are chalked on boards and change mid-conversation.
    The press of buyers is constant and the sellers work the
    crowd hard without pause or apology.
  cookpot: A wide iron pot hangs over a fire-basket at the
    food-seller's pitch — whatever is in it has been cooking
    for a long time, its smell somewhere between stew and
    something older and richer. The seller ladles portions into
    rough clay bowls for a copper each. The pot is deep and its
    contents shift under the ladle in ways that suggest more
    than is visible. A wooden box beside the fire holds the
    day's supply of bowls and a tin of coarse salt.
idlemessages:
- A hawker climbs onto a barrel and shouts about his imported
  spices, drawing a ring of curious onlookers around his pitch.
- A quick hand moves through the press near the food stalls —
  a purse is gone before the owner turns to look.
- Two stallholders argue across the gap between their pitches,
  grievances escalating through two languages at once.
- A child ducks under a stall counter and emerges on the far
  side holding an apple, already sprinting for the crowd.
- The showman's drum stops mid-beat, then restarts at a faster
  tempo — the pitch is building to something.
