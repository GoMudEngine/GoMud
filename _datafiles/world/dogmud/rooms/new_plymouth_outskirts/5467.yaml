title: The Outer Market
description: >
  The noise hits before the stalls do — a wall of sound built
  from a thousand simultaneous transactions. Hawkers cry prices
  over each other. Bargainers argue in half a dozen tongues.
  Somewhere close a drum marks a showman's pitch with a steady
  beat. The Outer Market fills the broad ground outside the
  walls where no licence is required and no toll is paid —
  rows of <ansi fg="itemname">market stalls</ansi> running
  east and west in rough corridors, selling everything the
  city sells inside but cheaper and without the pretense of
  care. A food-seller's <ansi fg="itemname">cookpot</ansi>
  breathes its steam into the foot traffic nearby, a copper
  a bowl, contents unspecified. The smell is extraordinary —
  spice and grease and wet canvas and the sweet rot of
  vegetable refuse trodden underfoot. Everything is for sale
  and everyone here knows it.
