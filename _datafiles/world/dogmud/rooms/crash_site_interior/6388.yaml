roomid: 6388
zone: Crash Site Interior
title: Collapsed Junction
biome: cave
description: >
  Here the deeper place has come apart. What was once a clean crossing of
  ways has collapsed inward, the grey folded and split into a low maze of
  half-passages, and the charge that runs the ruined machinery in the
  walls crawls loose across the breaks — thin blue-white threads jumping
  the gaps, silent and quick, biting at anything that stands where they
  want to go. Four ways still open off the wreck: west to the landing,
  north up a corridor that runs straight and grim, east where the grey
  folds down to a single sealed conduit, and south into a nest of the
  broken passages. Grey shapes hold the junction, more than one, moving
  through the arcing light with the flat certainty of things that were
  set here and have not left. Nothing about this crossing is easy now.
exits:
  west:
    roomid: 6382
  north:
    roomid: 6391
