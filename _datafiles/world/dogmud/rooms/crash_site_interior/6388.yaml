nouns:
  maze: >
    The collapsed crossing, folded and split into a low tangle of
    half-passages where the grey came down on itself. It was a clean
    junction once; now it is a wreck you pick through stooped, and the
    loose charge crawls the breaks, and the grey shapes that keep it know
    the tangle better than you ever will.
  charge: >
    Thin blue-white threads jump the folds and breaks of the ruin,
    silent and fast, gone the instant they arc. Where one passes near the
    air draws tight and the skin prickles. It does not aim at you. In a
    place this broken it does not have to.
idlemessages:
- A thread of blue-white jumps a fold in the wreck and is gone; the air stings.
- Grey shapes move through the arcing light, unhurried, keeping the collapse.
- The four ways run off the ruin, and only the sealed east conduit hums back.
- The loose charge crawls the breaks and will not settle in the folded grey.
