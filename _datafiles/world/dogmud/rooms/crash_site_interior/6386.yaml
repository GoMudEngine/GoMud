nouns:
  door: >
    A fitted way worked flush into the grey and shut deliberately —
    unlike the collapsed and ajar ways elsewhere, this one was closed on
    purpose and has stayed closed. It hums faintly under the hand, live
    where nothing else here is live, and it does not mean to be opened by
    the careless.
  conduit: >
    The lock's fittings run back into the wall through threads of the dead
    machinery, the charge coiled patient behind them. Work the mechanism
    cleanly and the door gives; slip, and the coiled charge finds the
    slip. It is an old and simple bargain, and the place has kept its half
    of it for ten thousand years.
  lock: >
    A worked mechanism set into the humming door, fine and deliberate,
    threaded through with the live machinery of the place. A careful hand
    can read its working. A careless one wakes what waits in the fittings.
    The choice, and the risk, are yours alone.
idlemessages:
- The sealed door hums faintly east, live where the rest of the grey lies dead.
- Under the palm the grey around the lock carries a patient, waiting thrum.
- The way west stands open and quiet; the way east keeps its coiled bargain.
