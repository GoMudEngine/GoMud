roomid: 6378
zone: Crash Site Interior
title: The Navigation Alcove
biome: cave
description: >
  The passage widens into a low alcove built around a single thing: a
  display set into the grey, still lit, still moving, after everything.
  Above a shallow basin of dark the cold light gathers itself into shapes
  — four pale rounds turning in slow order about a center, tracing paths
  worn smooth by ten thousand years of the same patient wheeling. Three
  turn clean and bright. The fourth is broken — dark down one side, its
  arc stuttering where the others run true, dragging a little at each pass
  as though it hurt the whole figure to carry it. You do not know what the
  shapes are. You know, watching them, that something went wrong, and that
  the place has been turning the wrong of it over and over ever since,
  unable to stop, unable to mend it.
