roomid: 6396
zone: Crash Site Interior
title: The Command Deck
biome: cave
description: >
  Past the vault the grey opens into a broad low room that was plainly the
  mind of the whole place — a deck ringed with worked stations, panels of
  dark glass set at a standing height, the cold light running clean and
  even here as though this room at least had never been let fall into
  ruin. Nothing keeps it now. The keepers are behind you, spent against
  the vault, and what is left is only the quiet of a place that has
  finished its guarding and waits to be understood. From here the deep
  interior spreads to every hand: east a chamber of ranked stones and
  still panels; west a gallery from which a strange living light spills
  across the floor toward you; north a shut side-hold where the light runs
  wrong. This was the nerve of the buried thing, the room from which it
  was steered and known, and it is yours now to walk unhindered, if you
  can bear what the walking shows.
