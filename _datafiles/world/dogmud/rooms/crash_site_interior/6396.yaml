nouns:
  stations:
    A ring of worked posts and dark-glass panels set at standing height
    around the deck, each plainly made for a watcher who is not here. They
    are cold and dark now, their purpose stopped, but their shape is the
    shape of a place from which the whole made thing was steered — the
    hands that stood here are ten thousand years gone, and the posts have
    kept their places since.
  deck: >
    The mind of the buried place, broad and low and ringed with stations,
    the cold light even and unbroken as nowhere else below. From here the
    whole thing was steered and watched and known. It is quiet now, its
    guarding done, and every deeper room opens off it, waiting.
  gallery: >
    West the grey gives onto a long room from which a light spills that is
    not the steady cold glow — it moves, and it has colours in it, and it
    lays a stir of pale radiance across the deck floor toward your feet.
    Whatever is in there is lit as nothing else below is lit.
idlemessages:
- The cold light runs clean and even here, as though this room never fell.
- From the west gallery a strange living light spills pale across the floor.
- The ringed stations stand cold and dark, their watchers long gone.
- Nothing keeps this room now; it waits only to be walked and understood.
