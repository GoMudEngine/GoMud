roomid: 6399
zone: Crash Site Interior
title: The Signal Array
biome: cave
description: >
  North of the gallery the grey rises into a tall narrow room full of
  reaching shapes — slender arms of the pale material folded up against
  the ceiling, ranked dishes and fine bright filaments gathered toward a
  single seat at the room's heart, all of it aimed, or made to aim, at
  something far past the hull. This was the voice of the buried thing: the
  place from which it could call out and be heard across the patient dark,
  across the gulf the gallery showed you, all the way to whatever else is
  out there. And there is something else out there. The array knows it —
  the one panel still faintly lit holds three steady marks high above the
  world, three points that keep their places in the wheeling dark far too
  well and too still to be stars, waiting, patient, near enough to call if
  the call could be made. You cannot say what they are. You can only feel
  the weight of them, and the plain wrongness of three fixed things where
  nothing should be fixed, and the certainty that this room was built to
  speak to them. But the array is broken. The filaments hang dark and the
  seat is cold and the reach is folded and still, and press what you will,
  nothing wakes; the voice was silenced in the fall and what would raise it
  is not here, not yet. East the grey gives onto a sealed bay. South lies
  the gallery.
exits:
