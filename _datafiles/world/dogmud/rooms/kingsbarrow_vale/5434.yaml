nouns:
  grain fields: The fields stretch north and east from the road's
    slight crest, row after row of barley and wheat standing
    chest-high on the stalk, heads heavy and gold, trembling
    where the breeze catches them in long running shivers.
    Thorn-hedges divide the belt into great blocks — a half-mile
    or more across each — and the depth of the planting suggests
    a harvest sufficient to fill district granaries twice over.
    The wealth flows north from here; the scale of the fields
    makes that plain without any sign being needed.
  harvest shrine: A low drum of worked stone at the road's verge,
    broad enough to hold offerings, worn smooth at the centre by
    long use. Someone has laid cut grain across it in a neat fan
    — pale barley, a sprig of red campion between the stalks —
    and wedged below the grain a flat river-stone with a crude
    sun pressed into its face. The rim carries lettering, old
    and partly worn, petitioning for an abundant harvest and
    safe storage. The shrine's base is hollow, and the gap at
    its foot holds a small scattering of coins left by travellers
    — copper mostly, one worn silver piece among them.
idlemessages:
- A farm cart passes heading south, its flatbed piled with empty
  grain sacks, the driver nodding from the bench without slowing.
- Skylarks rise from the field edge in a sudden spiral, their
  calling bright and rapid above the hedgerow line.
- The warm smell of the grain deepens as the breeze shifts from
  the north — thick with the particular sweetness of ripe barley.
- Somewhere in the fields ahead a voice calls out, a field hand
  directing a team, the words too faint to make out from here.
- A bee crosses the road low and with purpose, heading into the
  flowering weeds at the base of the nearest thorn-hedge.
