roomid: 5434
zone: Kingsbarrow Vale
title: The Vale Road
description: >
  The smell changes before the sight does — the cold rot of
  the river flats drains away down the slope behind you, and
  in its place the warm breath of the breadbasket arrives,
  grain and turned earth heavy in the air, a richness that
  belongs to country feeding cities rather than merely keeping
  itself. The road crests a low swell and the vale opens wide
  to the north — hedged fields of ripening barley and wheat
  rolling away to the horizon, golden and immense, ordered
  behind tight thorn-hedges, the scale of the farming only
  apparent from this slight height. At the road's verge a low
  stone <ansi fg="itemname">harvest shrine</ansi> stands draped
  with cut grain and braided field-flowers, and the great
  <ansi fg="itemname">grain fields</ansi> spread away on both
  flanks, the crop heavy and gold, a long way from the marsh
  below.
