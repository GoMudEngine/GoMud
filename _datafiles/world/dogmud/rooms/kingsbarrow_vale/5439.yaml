zone: Kingsbarrow Vale
title: Mill Street
description: >
  You hear the mill before you see the millstream — a low
  continuous rumble underfoot and in the air at once, the groan
  of the great wheel turning and the heavier percussion of the
  millstones behind it, a sound so settled into this street that
  the people working along it have stopped noticing it entirely.
  The lane runs north from the green between close-set workshops,
  a cooper's yard to the left with fresh staves stacked in
  fragrant fans against the wall, and a wheelwright's open shed
  to the right where a rim is being fitted over a smoking fire.
  Between the workshops and the eastern turning, handcarts line
  the roadway, each loaded with bulging <ansi fg="itemname">grain
  sacks</ansi> — some inbound for the mill, some outbound and
  sealed with twine, waiting for the morning's first cart north.
  The <ansi fg="itemname">millstream</ansi> runs past the east
  end of the lane, fast and brown and purposeful, the wheel's
  backwash churning the water downstream into a white froth
  before it steadies into the drainage cut.
