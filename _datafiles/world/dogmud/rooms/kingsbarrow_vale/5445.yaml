zone: Kingsbarrow Vale
title: The Great Tithe Barn
description: >
  The cold arrives first — a drop into the tithe-barn's
  interior well below the heat of the harvest fields, thick
  walls and ancient thatch holding a chill the sun cannot
  reach. Then the eyes adjust and the scale arrives. The
  building is cathedral-huge, its arched timber roof soaring
  above a floor that runs from end wall to end wall with the
  gathered wealth of the vale. The <ansi fg="itemname">grain
  store</ansi> fills that floor — sacks stacked four high in
  ordered columns, loose grain mounded in the central aisle,
  the whole mass banked to the first tie-beams, the tithe of
  everything the vale grows, gathered here to be carted north
  before the frost. The <ansi fg="itemname">great frame</ansi>
  above is the building's real statement, curved oak principals
  rising from sill-beams to a ridgeline lost in the gloom,
  the old timber smoke-darkened and massive, the joinery
  precise and confident. Here and there the capital's
  wheatsheaf seal is painted on the principals in red —
  marking whose grain this is and where it ends up. A quiet
  lives in this space that the bright fields outside do not.
