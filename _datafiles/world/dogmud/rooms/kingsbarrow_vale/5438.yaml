zone: Kingsbarrow Vale
title: Kingsbarrow Green
description: >
  The lane opens onto a broad worn common — the heart of
  Kingsbarrow, unimproved and ancient, its grass cropped short
  by generations of geese and passing livestock. At the green's
  centre the <ansi fg="itemname">market cross</ansi> stands
  on three shallow steps of mossy stone, its carved shaft older
  than any other stonework in the village, one arm chipped at
  the finial and never repaired. A <ansi fg="itemname">duckpond</ansi>
  pools at the green's north corner, ringed with trampled mud
  and willow-herb, a raft of ducks riding it in a loose cluster.
  Geese move across the common in pairs and loose gangs, pulling
  at the grass with the unhurried authority of creatures that
  know they own the ground. On the east side of the green the
  great stone granary fills its entire frontage — wide, solid,
  its doors iron-banded and shut — and on the west the squat
  church crouches behind a lych-gate, its tower barely higher
  than the granary's eaves. Between the two the village has
  arranged its whole existence for a thousand years, grain and
  prayer balanced against each other across thirty yards of
  common ground.
