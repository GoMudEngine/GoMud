roomid: 5449
zone: Kingsbarrow Vale
title: The Sheaf and Sickle
description: >
  Warmth and the smell of brewing reach you as the door swings
  — woodsmoke first, then the round dark smell of ale that has
  been pouring in this room long enough to be part of the
  plaster, then something sweeter beneath both of them, the
  smell of bread from the inn's own oven through the back wall,
  close enough to warm the stone. The room is small and low,
  its ceiling crossed by <ansi fg="itemname">beams</ansi> so
  close to head height that anyone tall bends without thinking,
  their undersides hung with dried hops and bundles of sage
  and marjoram, brown and papery, their scent mingling with
  the smoke. A long settle runs the near wall, its wood black
  with decades of use, and to the right the bar occupies a
  deep alcove — three barrels on its low shelf, a row of
  thick-walled cups turned upside down beside them, waiting.
  At the far end the <ansi fg="itemname">hearth</ansi> holds
  a slow, steady fire, its flue drawing well, the hearthstone
  warm enough to dry a pair of boots set close to the grate.
  A <ansi fg="itemname">notice board</ansi> is nailed beside
  the bar, crowded with papers and tallies and a hand-drawn
  map of the vale road that someone added and no one has
  taken down. Far humbler than a coaching inn, and warmer
  for it.
