title: The Tithe Road
description: >
  The road runs between the fields and the capital's authority
  marks it at every furlong — squat stone posts cut with the
  New Plymouth seal and a parish number, each one squared and
  true and set to outlast the hedgerows that frame them on
  either side. These are the <ansi fg="itemname">tithe-stones</ansi>,
  and what they count is plain — the grain standing deep and
  gold in the fields around them, a real abundance being
  measured and claimed at once. A rutted <ansi fg="itemname">track</ansi>
  breaks west from the road toward the great tithe-barn whose
  ridge stands above the field line in the middle distance,
  the ruts scored deep by wagon wheels heading in both
  directions.
