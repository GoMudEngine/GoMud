zone: Kingsbarrow Vale
title: Barleywick Gate
description: >
  The road bends and the estate resolves — tips of a great
  tithe-barn's roof above the poplar windbreak first, then the
  gateposts of Barleywick themselves, paired columns of squared
  local stone capped with carved wheat-sheaves, set to declare
  the estate's standing to anyone walking this road. The fields
  press in on both sides here, the crop heavier and more even
  than along the approach, managed with the long care of a
  holding that has been productive for generations. A carved
  board on the eastern <ansi fg="itemname">gatepost</ansi>
  names the estate and states its obligations plainly, and a
  well-raked <ansi fg="itemname">drive</ansi> runs east from
  the gate into the farmyard, its poplar-lined verge trimmed
  to a straight line.
