nouns:
  granary roofs: The roofs rise above the apple crowns at the
    village's heart — three of them, you can see now, running in
    a row and built to a common plan, steep pale thatch over wide
    timber frames. The ridgelines are high enough to hold a season's
    worth of grain from the whole surrounding belt, and the walls
    below them are stone-mortared to the eaves. A crow rides the
    topmost ridge, watching the road south.
  roadside oven: A clay-and-stone oven set into a squared alcove
    at the verge, deep enough to shelter a fire from the wind and
    broad enough to hold four loaves on its base-stone. The ash
    banked at its mouth is fresh white, and the heat coming off the
    clay is steady and even. A round loaf sits cooling on the stone
    shelf above the fire door, its crust dark and split along the
    top — unbought and unclaimed, left for the road. A hook in the
    alcove wall holds a long-handled wooden peel, flour-dusty from
    recent use.
  cottages: Low, solid buildings of dark fieldstone, their thatch
    cut square at the eaves — each one has a kitchen garden pressed
    to its south wall and a chicken run fenced with hurdles along
    the lane. The windows are small and deep-set, many with dried
    herbs hanging inside the sills. There is nothing spare or
    ornamental about any of them; they are the homes of people
    whose work starts at first light and ends when the light goes.
idlemessages:
- A woman in a flour-dusty apron steps from one of the cottages,
  glances at the oven, and goes back inside without a word.
- A child runs along the fenceline ahead of you, trailing a stick
  through the hurdle-posts, then cuts between two cottages and
  vanishes.
- A hen works the road-verge with single-minded focus, scratching
  in the loose earth beside the oven alcove.
- The smell of the cooling loaf on the oven shelf thickens as the
  breeze shifts south — a warm, yeasty wave that rolls down the
  lane.
- An old dog lifts its head from the doorstep of the nearest
  cottage, regards you from the shadow, then settles its chin
  again onto its paws.
