zone: Kingsbarrow Vale
title: Kingsbarrow Approach
description: >
  The road widens at the crest of a low rise and the fields begin
  to thin, the first orchards of Kingsbarrow edging in among the
  barley — old apple trees and a row of plum, their branches
  reaching over the verge. Ahead the pale <ansi fg="itemname">granary
  roofs</ansi> of the village lift above the treeline, high and
  broad, the biggest buildings for miles, their scale alone
  advertising what this settlement exists to do. Woodsmoke reaches
  you before anything else, and behind it something sweeter — the
  warm heaviness of bread from a <ansi fg="itemname">roadside
  oven</ansi> set in a clay alcove at the road's edge, banked with
  ash and radiating a steady heat, a loaf cooling on its stone
  shelf. The first cottages of the hamlet follow the road on both
  sides now, their thatch low and well-kept, kitchen gardens
  pressed hard against the lane, hens scratching along the
  fenceline.
