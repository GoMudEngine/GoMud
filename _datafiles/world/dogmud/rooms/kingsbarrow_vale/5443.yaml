roomid: 5443
zone: Kingsbarrow Vale
title: Vale's End
description: >
  The grain thins at the ridge-top and gives out for good
  on the descending slope — the planting stops where the
  soil turns stony and pale, and from here north the
  country is rougher, the hedges gapped and unpruned,
  the verge-grass coarser. The breadbasket ends here.
  The road doesn't pause for it — the wheel-ruts press
  on north into territory that belongs to hammer and kiln
  rather than seed and harvest. Ahead the horizon is
  marked by a pale smear of stone-dust and grey smoke,
  low and wide across the north, rising from quarries
  and kilns still out of view beyond the ridge. The
  smell of the fields fades behind and something harder
  takes its place — hot stone on the wind, a faint acrid
  edge that the grain country didn't carry. At the road's
  verge a carved <ansi fg="itemname">march stone</ansi>
  marks the boundary, its face named and dated, its base
  worn by hands and the press of offerings over years.
  The <ansi fg="itemname">northern road</ansi> runs on
  from here into the haze, direct and purposeful, toward
  smoke that grows no closer as you watch it.
