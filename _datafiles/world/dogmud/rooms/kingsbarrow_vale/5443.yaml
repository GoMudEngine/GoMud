nouns:
  march stone: A boundary marker of dressed local stone,
    waist-high and square-sectioned, set at the road's
    verge where the granary lands of Kingsbarrow Vale give
    out and the works-country begins. The south face is
    carved with the vale's name and a harvest glyph — a
    sheaf inside a circle — and the north face names the
    territory ahead in plain block lettering — KILNREACH
    WORKS, and below that a distance mark in old units.
    The east face carries a founding date and a
    commissioner's mark. At the stone's base a shallow
    hollow has been worn smooth where travellers have
    rested their hands or left small things over years —
    a couple of copper coins, a stub of candle, a sprig
    of dried grain from the fields behind, placed face-down
    on the stone's foot.
  northern road: The road running north from this point
    is the same road that has carried grain wagons south
    through the vale for generations — but here its
    character changes. The surface is heavier-maintained,
    the wheel-ruts deeper and fresher, the verge cut back
    wider to accommodate larger loads coming south from
    the works. The road crests the near ridge and drops
    from view, the haze above the descent thickening with
    smoke and pale stone-dust. The sound of the grain
    country falls away almost at once. What replaces it
    is a low irregular percussion from distance — quarry
    work, or the stamp of mills, arriving on the wind
    in fragments.
idlemessages:
- The smoke above the northern horizon shifts in the wind
  and for a moment thickens, then disperses to a pale
  wash across the sky.
- A blast of wind from the north brings the smell of hot
  stone briefly clear, then the grain-fields behind take
  back the air.
- A lone cart comes up the road from the south, passes
  without stopping, and heads north into the haze with
  the driver not looking back.
- Something taps in the far distance — a rhythm too
  regular for weather, too faint to place from here.
- Two rooks land on the march stone, investigate its top
  surface briefly, then lift off heading south.
