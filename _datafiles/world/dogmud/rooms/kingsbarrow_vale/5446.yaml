title: The Granary
description: >
  The interior opens in orderly dim — low timber partitions
  divide the floor into numbered bays, each one labelled
  above its opening with a household's name and what it holds.
  Then the smell of the place arrives — a warm, dry exhalation
  of stored grain rising from the bins in a close breath,
  trapped by stone walls thick enough to hold the damp out.
  The building stands on <ansi fg="itemname">staddle-stones</ansi>,
  their mushroom caps visible below the sill on every side,
  lifting the floor clear of the ground and presenting a
  smooth rim that nothing with legs can climb. The <ansi fg="itemname">grain
  bins</ansi> of each numbered bay are labelled above the partition
  in careful script — household, quantity, type — the village's
  entire winter made legible in chalk and timber. The <ansi fg="itemname">granary
  doors</ansi> stand wide in the dry air, iron lock-bars resting
  in their brackets, each hasp stamped with the warden's mark.
