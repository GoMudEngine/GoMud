nouns:
  grain wagons: Three wagons in a loose train, each a
    heavy timber-sided farm-cart with iron-banded wheels
    scored by long road-use. The boards are loaded to
    their limit with hessian grain-sacks, piled two and
    three deep and roped down in a tight cross-pattern over
    the load. Each sack is stamped with a parish mark — a
    circle enclosing a grain-stalk — and the estate number
    it came from. The nearest wagon's tailboard is wedged
    open to let the load breathe, and the sacks behind it
    are braced with folded sacking. The lead driver keeps
    one eye on the road and one on the ropes, checking
    them without stopping.
  roadside hedge: Old thorn-and-hazel run tightly along
    both verges, grown to a wall of green above head-height,
    the hedge-top ragged where recent growth has not been
    laid. The bases are thick with tall grass, nettles, and
    trailing bramble stems, and the whole length is busy
    with small bird life — sparrows working the base, a
    wren moving fast through the interior. At one point the
    hedge has been opened with a clean cut and a
    post-and-rail gate installed for farm traffic, the gate
    currently standing open on its latch.
idlemessages:
- The nearest grain wagon jolts over a rut in the road,
  the sacks shifting with a dry rustle before settling.
- A sparrow explodes from the hedge-base beside the road,
  crosses the verge at speed, and vanishes into the crop.
- From the village behind, a bell rings twice, carrying
  easily through the open farm country.
- One of the wagon-drivers exchanges words with a figure
  at the hedge-gap — a farm hand leaning on a long-handled
  tool — then the wagon moves on without pausing.
- A merlin cuts north above the field line, low and
  direct, then tilts and drops into the crop out of sight.
hidden_nouns:
  old ruts:
    description: |
      Past the farm-gate the ground carries a set of ruts that
      have no business here — they run east, away from the road
      and the fields, worn deeper than a season of cart traffic
      could account for and older than any of it. Nothing to the
      east needs a cart. Whatever wore these went that way many
      times, and stopped coming a long while ago. A narrow track
      leads off through the gap in the hedge, into the rising
      ground and the tree-line beyond.
    hidden_description: |
      Beyond the farm-gate, a set of old ruts runs east through
      the hedge-gap — a track leading away from the fields.
