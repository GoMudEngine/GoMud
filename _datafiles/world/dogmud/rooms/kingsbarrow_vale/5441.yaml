title: North Vale Road
description: >
  The last garden-walls drop behind and the fields resume
  at once — wide and immediate on both sides of the road,
  the crop pressing close to the thorn-hedge line that
  keeps it from the verge. The road lifts here on a long
  gentle slope, and from the slight height the northern
  vale opens ahead, a sweep of ripening grain rolling
  away to the horizon, gold and dense, shivering where
  the breeze catches it in long running waves. Ahead on
  the road a string of laden
  <ansi fg="itemname">grain wagons</ansi> works north,
  the horses pulling steadily at the grade, the high-piled
  sacks roped down tight over the boards — all of it bound
  for the capital's granaries before the first frost. The
  <ansi fg="itemname">roadside hedge</ansi> runs unbroken
  on both flanks, old thorn and hazel grown head-high,
  the hedge-base loud with sparrows and the creak of small
  birds moving through dense cover.
