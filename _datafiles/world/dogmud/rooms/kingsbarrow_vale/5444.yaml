nouns:
  threshing floor: The broad central paving of Barleywick Yard
    is kept for one purpose — the flags are dressed flat and
    worn smooth by generations of this work, sloped fractionally
    toward drain-channels at the perimeter so the fine dust does
    not pool after rain. The morning's mound of unthreshed stalks
    waits at the centre, grain heads heavy and gold, and freed
    grain builds in a shallow drift around it as the flails work.
    At the floor's near corner a chalk tally-board on a post tracks
    the day's take — the count rising in marks wiped and rewritten
    each morning, the number significant.
  field barn: The long stone building along the north range
    stands open at both gable ends to let the carts come through.
    Inside the air is cool and dim, and the smell is close and
    sweet — the compressed warmth of a great deal of stored grain.
    Sacked barley and wheat are stacked floor to tie-beam on the
    wall-side, hundreds of sacks each marked with the estate's
    chalk stamp and a running count. Along the east wall a rack
    holds the yard's tools in order — flails and rakes and grain
    shovels and a brace of wooden buckets — and a half-mended
    harrow sits on its back in the middle of the floor, waiting.
    The rafters above vanish into the roof-dark long before the
    ridgeline.
  dovecote: A round tower of whitewashed stone rising from the
    yard's corner range, its walls honeycombed with nesting holes
    from sill-height to the eaves. The birds are a working flock —
    grey and rust and white, arriving in a constant low traffic
    from the grain fields, each one landing on its ledge with a
    soft wing-beat before folding in. Dung builds at the tower's
    base and is raked into a barrow that stands half-full nearby.
    The birds are grain-fed; the grain-fed birds are, in their
    season, eaten. Nothing goes to waste at Barleywick.
idlemessages:
- A threshing hand pauses mid-swing, shakes chaff from a
  leather apron, and lifts the flail again without a word.
- Two sparrows drop from a barn beam to pick at split grain
  on the cobbles — quick and quarrelsome, unmoved by the
  yard's traffic.
- The cart horse by the barn opening stamps one foreleg and
  blows a long slow breath into the warm yard air.
- A thin drift of chaff lifts from the threshing floor on
  the turning breeze, catches the light briefly, and settles
  wide across the far cobbles.
- From inside the field barn something heavy shifts with a
  slow wooden thump — someone stacking, or checking a count.
