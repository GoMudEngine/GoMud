roomid: 5444
zone: Kingsbarrow Vale
title: Barleywick Yard
description: >
  Grain dust is the first thing — it hangs in the light
  between the buildings and settles on every surface in a
  pale bloom, the sweet powdery smell of threshed barley
  announcing scale before the eye has time to measure it.
  The farmyard of Barleywick is a wide cobbled court running
  from the gateposts to a north range of barns and byres,
  alive with beasts and hands and the purposeful noise of a
  holding that feeds a long reach of countryside. At the
  centre the broad flagged <ansi fg="itemname">threshing
  floor</ansi> takes the full daylight — swept to its edges,
  heaped at the middle with the morning's cut stalks, two
  hands working flails in a steady alternating rhythm while
  a third rakes the freed chaff sideways into drifts. Against
  the north range a long <ansi fg="itemname">field barn</ansi>
  stands open at both gable ends, its interior dim and stacked
  with grain in sacking to the tie-beams, a cart backed up
  to the near opening and half-loaded. At the yard's far
  corner a round <ansi fg="itemname">dovecote</ansi> rises
  above the roofline, its whitewashed holes busy with birds
  arriving low and fast from the fields beyond the wall.
