title: The Market Cross
description: >
  The sound of the market reaches you before the square
  opens — voices at the stalls, the knock of a measure on
  a wooden counter, a running argument about weights done
  with enough laughter to show it is old between these
  two. The square is small and granite-sett paved, the
  stone worn to a polish at the centre that no one planned,
  just walked there over many years. From its broad plinth
  at the square's heart, the
  <ansi fg="itemname">market cross</ansi> rises four-sided
  in grey limestone, its weathered cap carved with a robed
  saint and at the plinth-base a ring of family names.
  A row of <ansi fg="itemname">market stalls</ansi> faces
  north along the square's edge, canvas awnings rigged on
  a fixed timber frame, their boards crowded with produce
  from the surrounding farms — sacks of flour, bundles of
  root vegetables, rounds of hard cheese. To the west the
  painted board of the Sheaf and Sickle hangs above a low
  lintel, the inn door propped open, bread-smell and voices
  finding their way across the square.
