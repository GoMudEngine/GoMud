nouns:
  market cross: Four-sided limestone on a broad plinth,
    stepped up from the square paving and smoothed where
    people lean against it to wait. The cross-cap is
    weathered to a roundness that blurs the carved saint on
    the south face to a stooped silhouette, though the
    carved wheatsheaf on the north face has fared better
    out of the weather's path. At the plinth base a wide
    ledge runs all four sides — used on market days for
    small offerings, the stone of the ledge worn hollow at
    each corner by long habit. A ring of family names
    encircles the plinth below the ledge, most still
    legible, two worn to near nothing, one carefully
    re-cut by a later hand.
  market stalls: A permanent run of three stalls built on
    stone footings along the square's north face, the
    timber boards and awning frame old enough to have
    settled without shifting. The canvas awnings are worn
    to a pale grey but sound, and the boards beneath hold
    the morning's trade — dried pulse in tied linen bags,
    firm rounds of cheese wrapped in cloth, root vegetables
    in muddy bundles, a flat basket of wax-capped jars with
    handwritten labels. On the nearest stall's end-board a
    chalk tally records the day's transactions, and a
    locked tin cash-box sits weighted on the counting shelf
    behind the goods.
idlemessages:
- A stallholder calls an offer across the square — the
  voice easy and practised, not expecting much argument.
- Two men work through an exchange at the plinth base, a
  ledger open between them, one marking figures while
  the other watches the chalk carefully.
- The inn door swings open and a brief warm sound and
  bread-smell crosses the square, then muffles as it
  shuts again.
- A child darts out from under one of the stall boards
  in pursuit of a chicken, both heading south at speed.
- A laden cart edges around the square's perimeter looking
  for a gap wide enough to pull up beside the stalls.
