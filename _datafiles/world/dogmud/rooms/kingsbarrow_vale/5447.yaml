zone: Kingsbarrow Vale
title: Kingsbarrow Church
description: >
  Cold stone and candle-wax reach you before anything else —
  the lych-gate closes behind you, shutting the noise of the
  green away, and the church holds its quiet like a kept thing,
  deliberate and old. The nave is low and plain, the original
  plaster mostly stripped to bare fieldstone, the wall darkened
  by centuries of damp and tallow-smoke. Four narrow lancets
  admit a grey, even light. At the far end the <ansi fg="itemname">harvest
  altar</ansi> carries the village's older faith alongside its
  newer one — a corn-dolly woven from the last sheaf of the
  previous season stands between two candle stubs, ringed by
  tied barley sheaves and a clay dish heaped with dried rosehips,
  coins, and a folded note no one has claimed. The altar stone
  is worn glass-smooth at the centre where hands have rested in
  supplication for as long as anyone has kept count. Outside,
  through the south doorway, the great <ansi fg="itemname">yew</ansi>
  fills the frame — its trunk split into three massive limbs
  above a root-mass the oldest graves have grown entirely around,
  its canopy too dense for much light to reach the ground. The
  <ansi fg="itemname">tower</ansi> opens through a narrow arch
  to your right, plain and cool, its rope hanging slack in the
  dark below the belfry.
