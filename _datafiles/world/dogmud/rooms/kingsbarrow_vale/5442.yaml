roomid: 5442
zone: Kingsbarrow Vale
title: Upper Fields
description: >
  The road reaches the high ground at the vale's top end
  and the crop grows richer for the elevation — these are
  the best fields of all, the grain heavy-headed and gold,
  the stalks thick and standing straight where the lower
  country needed staking. The drainage favours this ridge
  and the planting shows it. Northward the golden fields
  roll on to a long flat skyline, and above that skyline
  a smudge has appeared — low and grey, with pale threads
  of dust beneath it, too steady and too fixed to be
  weather. Something burns and builds ahead, still out of
  sight beyond the ridge, making itself known by smoke
  and dust and a low irregular sound the wind carries
  down when it comes from the north. At the field-edge
  a squared <ansi fg="itemname">boundary stone</ansi>
  leans into its setting, old enough to have weathered
  to the land's colour. Across the nearest field a tall
  <ansi fg="itemname">hay rick</ansi> stands thatched
  and square, a dark shape anchored in the gold.
