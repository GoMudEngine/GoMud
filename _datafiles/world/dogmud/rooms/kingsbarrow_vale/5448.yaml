zone: Kingsbarrow Vale
title: The Watermill
description: >
  The mill announces itself through the soles of your feet
  before you see it fully — the whole timber building trembles
  with the turning of the great wheel, a steady deep shudder
  that works up through the floorboards into your legs and
  chest, not unpleasant, like standing beside something with
  a heartbeat. The roar of the wheel-race fills every corner;
  conversation inside would mean leaning close and speaking
  plainly. Flour-dust coats every surface — the rafters, the
  window ledges, your own sleeve if you brush against anything
  — fine and white and rising in slow clouds when the timbers
  flex. The <ansi fg="itemname">millstones</ansi> occupy the
  central platform, two great discs of dressed stone turning
  against each other with a sound that runs beneath the
  wheel-noise the way a bass note holds beneath a melody. Along
  wall a row of <ansi fg="itemname">flour sacks</ansi> fills
  the shelving in various stages of fullness, tied with cord
  and stencilled in black with the miller's mark. Through the
  open side-hatch the <ansi fg="itemname">mill wheel</ansi>
  is visible beyond — vast and methodical, the paddles lifting
  and diving in the race, sheets of water dropping from each
  board as it crests, the motion hypnotic and relentless.
