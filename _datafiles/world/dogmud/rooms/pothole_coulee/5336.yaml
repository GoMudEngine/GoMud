nouns:
  stones: The windward stones are rougher than their eastern counterparts,
    their surfaces pitted into a texture that catches the fingertips.
    Whatever they were intended to look like when placed, the weather
    has had centuries to offer its own revision.
  marks: The marks on the inner faces here come in two distinct layers --
    newer weather-signs in a clear local tradition, and beneath them,
    at a different depth and angle, older symbols that predate the folk's
    memory of themselves. The boundary between the two layers is not
    always clean.
idlemessages:
- The wind strikes the outer faces of the <ansi fg="cyan">stones</ansi> and makes a
  low sound that carries into the ring, lower than the gaps in the
  eastern stones produce.
- Tracing the older <ansi fg="cyan">marks</ansi> with a finger, you find they run
  in a continuous line around the stone's girth -- not interrupted
  by the newer symbols but woven between them.
- One of the <ansi fg="cyan">stones</ansi> here leans more than the others, enough
  that its shadow at midday falls across the altar-stone to the east.
