roomid: 5336
zone: Pothole Coulee
title: Windward Stones
description: >
  On the windward western edge of the ring, the stones face the prevailing
  weather directly and show it. Their outer faces are pitted and streaked,
  the stone surface eroded back in layers to expose the grain beneath.
  Their inner faces are carved with a different vocabulary than the eastern
  stones -- older marks, some scholars claim, though the coulee has no
  scholars and the tradition-keeper calls them simply the weather-marks,
  the signs of where the folk came from before the coulee. Interspersed
  with the weather-marks are older symbols again, half-eroded, suggesting
  a wider world and older migrations: a range of mountains rendered in
  a dozen strokes, ships, a sun with rays that do not look like any local
  sun-sign. The stones here remember something further away than the
  coulee, and they are not entirely silent about it.
