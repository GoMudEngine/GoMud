zone: Pothole Coulee
title: Outwash
description: >
  The ground drops away to the east into a narrow gully scoured out
  by old floodwater, the banks undercut and steep, the floor packed
  smooth at the bottom. It dead-ends against a raw clay wall where
  the earth gave way and never recovered. Remains litter the gully
  floor in a long windrow — fur and bone and the odd hoof, things
  driven in here and not given room to turn around. The smell is
  thick. There is no way out but back the way you came.
