nouns:
  gully: A flood-scoured pocket with undercut banks and a dead end.
    The smooth clay floor and the remains pressed against the far
    wall tell you what this place is used for -- driving prey in and
    finishing them where they cannot turn. You are standing at the
    only exit.
  remains: A long windrow of fur, bone, and scattered debris pressed
    against the dead end of the gully. Whatever came in here did not
    leave. Some of it is old; some of it is not.
idlemessages:
- The clay walls show deep gouges where something scrabbled for
  purchase it never found.
- The gully holds the smell in. There is no wind to carry it away.
