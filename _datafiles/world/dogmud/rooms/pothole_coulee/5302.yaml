nouns:
  steps: Broad and spiraling, the steps were carved from the same pale
    limestone as the tower walls. Each one bears the shallow groove of
    long use -- a path worn deep by those who once climbed here with
    purpose.
  stone: The walls are dressed stone fitted without mortar at the joints,
    dark with age and stained by copper runoff from the instruments that
    once hung here. They radiate a cold that seeps through wool.
idlemessages:
- A distant wind moves through the tower above, a low moan that rises and fades.
- Dust motes drift down from somewhere overhead, catching the pale column of light.
- The <ansi fg="cyan">stone</ansi> beneath your feet holds a faint chill, as though the cold is very old.
