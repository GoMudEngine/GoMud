roomid: 5302
zone: Pothole Coulee
title: Observatory Base
description: >
  A spiral of broken steps rises into the guts of a ruined tower, each
  tread worn smooth by generations of feet and slick now with cold damp.
  The stone underfoot is black with old copper stain, and the air carries
  that mineral smell -- the breath of a building that has sat sealed and
  still for a very long time. Somewhere above, the structure opens; light
  falls down the stairwell in a pale column. Thick walls rise around you,
  mortared with care by hands that believed this place mattered.
