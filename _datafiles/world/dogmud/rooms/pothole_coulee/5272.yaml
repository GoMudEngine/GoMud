nouns:
  mudflat: Exposed dark mud, slick and with no purchase underfoot. The
    surface cracks in a mosaic pattern where it has dried at the edges,
    but the center is still wet and gives beneath your weight.
  gear: The remains of a leather pack, half-buried and listing sideways
    from the mud. The leather has gone black and stiff; the buckles are
    corroded beyond use. Whatever was inside is long gone.
idlemessages:
- The <ansi fg="itemname">mudflat</ansi> shifts and bubbles softly where
  something passes beneath the surface.
- A slow gas bubble rises through the mud near the sunken
  <ansi fg="itemname">gear</ansi> and breaks with a faint sulphur hiss.
