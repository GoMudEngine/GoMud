roomid: 5272
zone: Pothole Coulee
title: Mudflat
description: >
  The reeds fall back here and the marsh opens into bare mudflat, the
  exposed ground dark and treacherous underfoot — each step produces a
  liquid sucking sound and leaves a boot-shaped hole that slowly fills
  with black water. Nothing grows on the mudflat itself; even the reeds
  keep their distance. Near the center, a piece of old gear juts from
  the mud at an angle: a leather pack with its straps rotted away, the
  buckles gone green with verdigris. Whatever the mud swallowed, it
  keeps.
biome: swamp
