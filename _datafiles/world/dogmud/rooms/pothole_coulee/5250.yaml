roomid: 5250
zone: Pothole Coulee
title: Scree Field
description: >
  The slope opens here into a wide field of sliding rock, no wall on either
  side to give a handhold, the whole face exposed to the sky and the canyon
  wind. Grey basalt plates fan out in every direction, tilted and loose,
  some the size of flagstones and some no bigger than a fist. Moving across
  the field means choosing each step -- weight too far forward and a plate
  noses down, too far back and the one behind you kicks away. In the face of
  an exposed bluff to the north a seam of darker stone cuts a ragged diagonal
  -- basalt-iron, the local ore, showing in a raw vein where frost has
  prised the wall apart. The ore is close-grained and dark as bruised metal,
  and it bleeds a faint orange stain down the rock below it. The scree field
  runs east back toward the lower talus, and west the slope rises toward the
  high shoulder. South the ground drops into a pocket of richer rubble.
