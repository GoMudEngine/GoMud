nouns:
  vein: A ragged seam of basalt-iron cutting diagonally across the face
    of the bluff, prised open by frost so that the raw ore is exposed
    and close to hand. The rock here is close-grained and dark, heavier
    than it looks, and it leaves an orange mineral stain on everything
    below it. This is where the smithy gets its iron when the usual
    supply runs short.
  rock: Loose basalt plates spread across the open face in overlapping
    fans, each one riding on the next, the whole field in slow uneasy
    motion. Some plates are flagstone-wide and will bear weight; most
    are not. Learning which is which is what the slope teaches.
  bluff: The exposed stone face to the north where the vein shows, frost-
    cracked and dark, the broken wall of the coulee rim above. The ore
    seam runs a ragged line across it, orange-stained below, and loose
    plates have calved from it in fans across the scree.
idlemessages:
- A cluster of <ansi fg="itemname">rock</ansi> plates lets go somewhere to the south and the clatter echoes off the bluff before it dies.
- Wind drives across the open field and the orange stain below the <ansi fg="itemname">vein</ansi> glitters with mica dust shaken loose.
