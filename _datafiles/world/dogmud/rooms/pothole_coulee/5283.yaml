zone: Pothole Coulee
title: Steppe Edge
description: >
  A low rise lifts the ground here just enough to change what you can
  see. The steppe lays itself out to every side: pale grass and sage
  rolling away west into the flats, broken country beginning south where
  the ground starts to fold. Animal trails braid through the bunchgrass
  below the rise, pressed thin and clear by whatever moves across this
  country when no one is watching. It is a good place to stand and read
  the land before committing to it.
