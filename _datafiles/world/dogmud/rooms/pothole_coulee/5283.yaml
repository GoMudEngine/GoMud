nouns:
  rise: A gentle swell of ground, barely knee-high above the surrounding
    flat, but enough. The top is scoured bare by wind, the soil pale and
    hard-packed. Standing here, the steppe makes sense — the folds and
    rolls of it, the way the trails thread between them.
  trails: Thin lines pressed through the bunchgrass below, each one worn
    by the same small feet taking the same small routes, day after day.
    Hare, mostly, by the width and the way they jink. Some cross; some
    run arrow-straight toward the sage flat to the west.
idlemessages:
- A raptor hangs above the <ansi fg="itemname">rise</ansi>, riding the updraft without moving its wings.
- The <ansi fg="itemname">trails</ansi> below shift in the wind as the grass leans, then settle again.
