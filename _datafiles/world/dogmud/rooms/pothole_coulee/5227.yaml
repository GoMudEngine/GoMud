nouns:
  post: A stout practice post sunk deep in the packed earth, taller than a
    man and worn smooth at striking height. The top is splintered pale and
    soft, beaten near to pulp by years of patient drilling. This is the
    knocking the whole canyon hears.
  dummy: A practice dummy of straw bound in cracked leather, strung on a
    weighted pivot so a hard blow spins it round to swing back at you. Its
    stuffing leaks at every old gash. Strike it wrong and it will answer.
  yard: A wide circle of packed earth, swept flat and hard by years of
    drilling feet. Faint worn rings track where fighters have paced and
    turned. Nothing grows here -- the ground is given over to the work.
  ground: The earth is beaten so hard it rings faintly underfoot, scoured
    of every stone and weed. Old sweat and old blood have soaked it dark
    in patches near the post.
idlemessages:
- A breath of wind sets the <ansi fg="itemname">dummy</ansi> turning slow on its pivot, then stills it again.
