roomid: 5354
zone: Pothole Coulee
title: Echoing Narrows
description: >
  The canyon pinches here to its tightest point. The walls are close
  enough to touch on both sides simultaneously, and the sightline that
  opens to the north is startlingly clear -- a straight run of open
  floor all the way into the next chamber, pale stone and compressed
  shadow, a hundred feet of unobstructed kill-ground. Something moves
  in that far chamber. You can see it the way you see things at the edge
  of attention: a shift of silhouette, a quality of stillness that is
  not quite stillness. The narrows funnels every sound to a point. A
  whisper here becomes a shout at the chamber's far end. A bowstring
  loosed here would carry clean and true down the whole length of the
  slot -- and whatever is in that northern room would hear the draw long
  before the arrow arrived.
