nouns:
  sightline: A long clean line of open floor running north through the
    narrowest part of the canyon. The walls converge here and then open
    slightly beyond, but the corridor is straight and unbroken. A patient
    shooter with a clear eye could reach the far end of it without moving
    a step.
  narrows: The walls press in to arm's reach on each side. The stone is
    cold and slightly damp, sweating in the shadow. This is the tightest
    point in the whole canyon -- a chokepoint that anyone moving south
    must pass through, single-file, exposed.
idlemessages:
- The <ansi fg="cyan">narrows</ansi> carry sound in both directions without losing any of it.
- Something shifts at the far end of the <ansi fg="cyan">sightline</ansi> -- a shadow adjusting
  its weight from one foot to the other.
- Your own heartbeat returns to you from the stone walls, measured and
  unhurried.
- The slot amplifies a distant scrape of boot leather into something that
  sounds almost like a warning.
