roomid: 5253
zone: Pothole Coulee
title: Upper Talus
description: >
  The slope crests here at the high shoulder of the talus, the highest
  ground the scree field offers before the bluffs take over and the
  climbing becomes a different kind of work. The shoulder is a broad
  irregular bench of broken basalt, some plates tilted up on their
  edges like bad teeth and some laid flat and firm enough to stand on
  without checking each step. This is the best scavenging on the face
  -- wind and meltwater sweep debris up from below and pile it against
  the bluff behind, and pickers work the shoulder's accumulated drift
  for anything useful the talus has turned up. From here the whole
  coulee is visible, the pale thread of the wash far below, the hub
  smaller still, and the canyon walls running out to the sky. The cold
  draft from the west is sharper up here, a steady exhalation from
  somewhere deep in the dark ground ahead, smelling of wet stone and
  old air. East drops back to the scree field; west is the mine mouth.
