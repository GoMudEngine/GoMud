nouns:
  shoulder: The broad bench at the top of the talus, the high point
    of the scree field before the bluffs take over. Plates of basalt
    sit in all positions here -- some upright like kicked-over boards,
    some flat and firm, the whole bench the accumulated result of
    seasons of freeze and thaw working the slope apart.
  draft: A steady cold exhalation from the west, moving across the
    shoulder in a constant low breath that smells of wet stone, clay,
    and old air with no sun in it. It comes from underground, from
    somewhere deeper than the talus, and it is noticeably colder than
    the wind that crosses the open face below.
  drift: A long windrow of accumulated debris heaped against the bluff
    at the shoulder's back edge -- small ore fragments, lost tools,
    rope ends, and the general shed material of a working mine above.
    Pickers work it regularly. What remains is what no one has judged
    worth lifting yet.
  bluff: The basalt wall that ends the shoulder to the west, sheer and
    dark and cold to the touch. The mine mouth cuts through it at
    ground level. Above, the bluff runs up past sight without a seam
    or ledge worth attempting.
