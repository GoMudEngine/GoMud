title: Grove Edge
description: >
  The observatory rim drops behind you and the forest begins here, but wrong --
  trees that lean inward at angles the wind does not explain, bark pale and
  smooth as stripped bone. A low hum arrives at the edge of hearing, sourceless,
  steady, like a note held on a string wound too tight. Light filters through
  the canopy a half-breath behind where it should be, landing soft and slightly
  late, as though the grove remembers sunlight rather than receiving it.
