nouns:
  trees: Pale-barked and leaning without cause, they press closer than
    ordinary forest timber. The grain spirals in directions that make
    the eye slide away -- something about the pattern refuses to resolve.
  hum: Sourceless and low, it sits just below the threshold of sound you
    can name. Standing still, you notice it rises and falls on no wind,
    no breath -- as though the grove itself is sustaining a long exhalation.
idlemessages:
- The <ansi fg="cyan">hum</ansi> rises a half-step, then settles, as though acknowledging you.
- Light drifts down through the canopy a moment too late, pooling where you
  stood a breath before.
- One of the <ansi fg="cyan">trees</ansi> near the path's edge shifts almost imperceptibly, bark
  catching no wind.
