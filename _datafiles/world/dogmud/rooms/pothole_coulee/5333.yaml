nouns:
  circle: The ring of standing stones forms a near-perfect circle, each
    stone placed with a precision that implies long planning or surveying
    tools or both. The inner faces all carry carvings; the outer faces are
    comparatively plain, as if the circle was meant to be read from inside.
  altar: The altar-stone at the center is neither the largest nor the most
    decorated of the circle's stones, but everything in the arrangement
    points toward it. The worn convex surface holds the faint impressions
    of countless hands -- not carved, but pressed in over centuries.
idlemessages:
- The <ansi fg="cyan">circle</ansi> is quieter than the open land around it -- sound
  arrives here slightly shortened, as though the stones are keeping it.
- A breath of wind moves through the ring and stirs the offerings on
  the <ansi fg="cyan">altar</ansi>, lifting the edge of the folded cloth before setting
  it back down.
- The carvings on the inner faces of the stones catch the light at a
  low angle and resolve for a moment into a sequence before fading back
  to pattern.
- Somewhere in the arrangement of the <ansi fg="cyan">circle</ansi>, something is
  aligned -- sun or star or season -- that you cannot quite name.
