zone: Pothole Coulee
title: The Stone Circle
description: >
  The heart of the megalith ring opens around you -- a space both
  enclosed and exposed, roofed only by sky, walled by tall carved
  stones that stand in a near-perfect circle perhaps forty paces
  across. Each stone bears carvings along its inner face: spirals,
  stacked chevrons, handprints, and longer sequences of marks that
  suggest a system without yielding its meaning. At the circle's
  center stands the altar-stone, a weathered slab at waist height,
  its surface worn convex from generations of hands placed flat upon
  it. Fresh offerings rest there now -- dried flowers, a folded cloth,
  a small clay bowl with ash at its rim. Somewhere between the old
  rites this place was built for and the newer customs the coulee folk
  have folded into it, the circle has become simply where memory lives.
