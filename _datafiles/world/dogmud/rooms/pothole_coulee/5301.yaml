roomid: 5301
zone: Pothole Coulee
title: Carcass Pit
description: >
  A pit has been opened in the ground beside the den, the earth
  thrown up in a rim around it, and into it the pack has dropped
  everything it could not finish — carcasses in various states of
  decay, bones stripped or not, a reeking heap that has been building
  for a long time. The smell is extraordinary. And yet there is a
  glint somewhere in the heap — something catches what light reaches
  this place and throws it back wrong, the way metal does. Someone
  came here before you, with gear, and did not take it back with
  them. Whatever they had is buried in the carcasses now, waiting.
biome: forest
