nouns:
  pit: A deliberate excavation beside the den, rimmed with thrown
    earth, filled over time with what the pack dragged here and could
    not use. It is deep enough that the bottom is not visible. The
    smell from it is a physical force. Something glints from
    somewhere inside the heap.
  carcasses: A mass of stripped and partial remains, old and new
    layered together. The pit has been a dump site for long enough
    that the oldest layer at the bottom has compacted into something
    nearly solid. The glint of gear is somewhere in the middle of it,
    close enough to reach if you are willing to dig.
  gear: A flash of metal from somewhere in the carcass heap. Something
    a previous hunter carried into this territory. It went into the
    pit with everything else when the pack was done with them. It has
    been waiting here since.
idlemessages:
- The smell from the pit is remarkable. It carries a long way on
  still air.
- Something at the bottom of the heap shifts and settles with a soft
  sound. Decay, most likely.
