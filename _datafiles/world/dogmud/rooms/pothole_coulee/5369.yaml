roomid: 5369
zone: Pothole Coulee
title: Rimrock Rise
description: >
  Here the rim steepens and the trail climbs a short stony pitch toward the
  open steppe above. Slabs of pale rock step up out of the dry grass, worn
  to easy footing by weather if not by traffic, and the country ahead lifts
  clear of the coulee's edge entirely. The last of the mire's damp is gone
  from the air. Above the pitch the grass runs flat and unbroken to a far
  pale line of distance, and somewhere up there a second spring feeds the
  steppe the way the first one fed the swamp.
biome: land
