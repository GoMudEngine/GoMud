nouns:
  pitch: A short steep step in the rock where the rim climbs to meet the
    steppe, the slabs laddered and worn enough to climb without trouble.
    It is the last hard ground before the country goes flat and open.
  slabs: Pale weathered slabs of rimrock stepping up out of the grass,
    stacked by nothing but time, firm underfoot. They mark the seam where
    the low wet country ends and the high dry one begins.
idlemessages:
- Wind pours down the <ansi fg="cyan">pitch</ansi> from the steppe above, dry and steady and
  smelling of grass.
- A lizard suns itself on one of the warm <ansi fg="cyan">slabs</ansi> and does not stir as you
  pass.
