nouns:
  spring: Clean water welling from a crack in pale stone, cold and
    quick, running over gravel in a sound that is simply itself --
    no weight to it, no intent. After the hollow, it is startling
    how good water can smell.
  water: Bright and cold, nothing like the black mere behind you.
    It catches what light filters down and gives it back honestly,
    running clear over the gravel bed with no film, no stillness,
    no watching.
  trail: A faint track worn through the growth to the west, animal
    or older, leading into country not yet opened. It is narrow and
    unhurried, and whatever made it knew where it was going.
idlemessages:
- The <ansi fg="itemname">spring</ansi> runs on, cold and indifferent
  to what the swamp to the north has been doing.
- The <ansi fg="itemname">water</ansi> catches a glint of light and
  throws it across the pale stone, easy and clean.
