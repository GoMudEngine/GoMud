roomid: 5281
zone: Pothole Coulee
title: Clearwater Spring
description: >
  Here the rock rises clear of the mire and a spring wells up from a
  crack in the stone, water running cold and bright over a bed of pale
  gravel, sweet-smelling where moments ago the air was foul. The
  change is abrupt enough to feel like stepping through a door. The
  light reaches the ground without the green murk of the hollow above,
  and the sound of the spring is the first clean sound the swamp has
  offered. A faint game trail winds away to the west through ground
  not yet trodden, cutting into country that waits beyond the opened
  rock.
biome: water
coord:
  x: 47
  y: 14
  z: -1
exits:
