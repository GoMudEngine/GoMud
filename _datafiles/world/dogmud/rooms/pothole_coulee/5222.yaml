roomid: 5222
zone: Pothole Coulee
title: Reedwash Mouth
description: >
  Reeds choke the wash where it bends away east, the water beneath them
  gone still and green and thick with the smell of sweet rot and some
  sharp clean herb cutting under it. Flagged stakes march off into the
  growth, marking a line where someone is cutting a path through the
  tangle. The work is half-done, the far stakes still lost in the reeds.
biome: shore
