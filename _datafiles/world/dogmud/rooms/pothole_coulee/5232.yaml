nouns:
  wash: A wide floor of dry grey gravel running the length of the canyon,
    swept smooth by floodwater that comes only in the wet season. It is
    the road up to the tower, and it is held by people who do not welcome
    company.
  gravel: Rounded stones the size of knuckles and fists, packed and shifting
    underfoot. Every step grinds and announces you -- there is no walking
    this ground in silence, and whoever holds the wash knows it.
  fire pit: A ring of fire-blackened stones banked with cold ash. Someone
    cooked and slept here not long ago. The ash is dead now, but the camp
    was not abandoned in a hurry -- they left because they meant to come
    back.
  gear: The picked-over leavings of earlier passers -- a split pack, a
    frayed strap, a single worn boot. Whatever had worth is long gone.
    What remains is a quiet warning about how this wash treats strangers.
