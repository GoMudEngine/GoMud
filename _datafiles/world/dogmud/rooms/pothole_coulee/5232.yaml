roomid: 5232
zone: Pothole Coulee
title: Lower Wash
description: >
  The ground tips down and the safe shelf is behind you now. Underfoot the
  wash is a dry river of grey gravel, ground smooth by floods that come
  only in the wet, and the canyon walls lean up on either hand to close
  out half the sky. Off to one side a fire pit sits cold, a ring of
  blackened stones banked with old ash and a gnawed bone or two. Picked-
  over gear lies scattered past it -- a split pack, a strap, a boot with
  no mate -- the leavings of folk who took what was worth taking and left
  the rest. Nothing moves, and that is the wrong kind of quiet. Somewhere
  up the wash, someone has marked you stepping onto their ground. The
  gravel runs east and forks south; safe footing lies back west.
biome: cliffs
