title: Wickerwork Cottage
description: >
  The walls of this snug little cottage are woven, not built -- panels of
  silver willow wickerwork plaited tight and daubed at the seams, so the
  whole place creaks soft and breathing-like when the wind leans on it. A
  low hearth glows at the heart of the room, its smoke curling up through
  a hole in the thatch and hanging the air with the smell of burning herb
  and old fat. Charms crowd every surface and dangle from every cross-rod:
  knots of red yarn, holed stones, bird skulls, twists of straw -- and
  scattered among them, here and there, the plain tin medallions of the
  Church, fewer by far and half-lost in the older company. A clutch of
  remedies that predate the school sits steeping in clay crocks along the
  sill. It is warm here, and welcoming, and just strange enough that the
  hair stirs on your arms without your knowing quite why.
