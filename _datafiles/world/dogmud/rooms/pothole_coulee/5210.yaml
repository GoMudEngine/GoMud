nouns:
  charms:
    Charms hang from every rod and crowd every shelf -- red-yarn knots,
    holed river stones threaded on gut, the small skulls of birds, plaited
    straw figures with no faces. Among them, sparse and shy, hang the tin
    medallions the Church hands out, but they are badly outnumbered here
    and clearly the newcomers. The old woman who keeps this place trusts
    the older work, and the charms turn and tick against one another in
    the hearth-draft as though keeping their own slow count of you.
  wickerwork:
    The walls are wickerwork through and through, willow withies plaited
    in close diamond courses and daubed with river clay where the weather
    would otherwise whistle in. The whole shell of the cottage gives and
    settles when the wind pushes on it, creaking like a thing half awake.
    Run a hand along the weave and you feel the work of patient fingers in
    every crossing, tighter and older than anything the town carpenters
    raise.
  hearth:
    A low clay hearth burns at the center of the room, banked down to a
    red glow that never seems to want feeding. Bundled herb smoulders
    along the coals' edge, sweetening the smoke that drifts up and out
    through a soot-rimmed gap in the thatch. Crocks of dark remedy sit
    warming at its lip, older cures than the school across the water ever
    learned to brew, and the heat of it reaches every corner of the snug
    little room.
idlemessages:
- The wickerwork walls creak and settle as the wind leans on the cottage, then ease.
- A <ansi fg="itemname">charm</ansi> turns on its thread in the hearth-draft and taps softly against another.
