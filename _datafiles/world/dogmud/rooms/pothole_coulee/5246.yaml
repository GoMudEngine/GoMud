roomid: 5246
zone: Pothole Coulee
title: Ore Stall
description: >
  A lean-to of lashed poles and split planks runs along the western
  face of the smithy, open to the air on two sides, its sheltered
  interior given over entirely to raw materials. Stacked crates hold
  iron ingots in grey rows, each one stamped with a count-mark on the
  end. A row of burlap sacks bulges with coal, fine dust sifting from
  the seams onto the floor. Coils of leather strip hang from wooden
  pegs driven into the uprights -- cut and cured, ready for handle-
  wrapping, bellows-work, or strapping of any kind. Stacked planks of
  rough-cut timber fill the back. The air here is cool and dry, held
  against the forge-heat by the overhang above.
