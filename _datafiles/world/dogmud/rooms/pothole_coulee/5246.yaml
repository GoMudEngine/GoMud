nouns:
  ingots: Grey bars of iron, each one the same rough weight, stamped
    with a tally-mark cut by whatever forge cast them. They are cold
    and heavy and smell of the dark inside a furnace. Stack them; the
    work starts with these.
  coal: Burlap sacks of smithing coal, the chunks ranging from fist-
    sized to dust. The fine sift of it covers everything nearby in
    black powder and gets into every crease. Good fuel, patient fuel
    -- it holds heat better than wood and burns longer.
  leather: Coils of cured leather strip, pliable and dark, smelling
    of tannin and old grease. This is the kind used for handle-wrap
    and bellows-patch -- narrow, strong, and clean.
idlemessages:
- A bit of <ansi fg="itemname">coal</ansi> dust shifts and settles off the nearest sack in the still air.
