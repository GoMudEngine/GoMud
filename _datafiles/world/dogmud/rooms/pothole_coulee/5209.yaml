roomid: 5209
zone: Pothole Coulee
title: The Mending Hut
description: >
  The hut is low and warm and smells of green things drying, the kind of
  smell that loosens a clenched body before the mind catches up. Bunches
  of herbs hang head-down from every rafter -- bitter root, sweet leaf,
  grey moss -- turning slow in the heat off a banked fire. A row of cots
  stands made-up along the long wall, blankets squared and turned back,
  each one ready for whoever the water gives back next. Clean bandages
  sit rolled in a basket within arm's reach, white and soft and smelling
  of lye soap. The healer is not at her bench just now, but a pestle of
  half-ground salve waits there and the kettle is still warm, so she will
  not be long. Nothing in this room can harm you; this is the place the
  Opened are carried to be made whole again.
