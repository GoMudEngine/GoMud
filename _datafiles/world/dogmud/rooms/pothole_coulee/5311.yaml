nouns:
  veil: Invisible but palpable -- the thinning between worlds that the old
    adepts sought out deliberately, believing it sharpened focus to work
    in a place where the Folding pressed close. Here it presses very close.
  hollow: A natural depression in the grove floor, the hollow holds its
    cold and its rippling air independent of weather. The earth at the
    center is bare -- nothing grows in the space where the veil thins most.
idlemessages:
- The <ansi fg="cyan">air</ansi> at the <ansi fg="cyan">hollow</ansi>'s center ripples, slow and cold, then
  smooths again.
- Something dark shifts at the very edge of sight and is gone before
  you can name its shape.
- The <ansi fg="cyan">veil</ansi> here makes a sound, just below the hum -- a sound like
  very old paper under enormous pressure.
