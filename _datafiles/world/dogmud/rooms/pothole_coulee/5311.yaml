title: Veil Hollow
description: >
  The hollow sits where the veil between this world and the Folding has worn
  to something you could almost push a hand through. Cold air hangs here
  without drifting -- the kind of cold that does not come from wind or shade
  but from absence, from the fact that something on the far side of the veil
  draws warmth out of the air like a wick. The air itself ripples at the hollow's
  edge, slow distortions like heat-haze above summer stones, though the ground
  beneath your boots holds no heat at all. Shapes move in the corner of the
  eye -- dark suggestions that vanish when you turn, leaving only the still air
  and the faint impression that something turned with you.
