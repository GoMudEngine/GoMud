nouns:
  brush: Stems grown too dense to see through, interlocked overhead,
    pressing in from both sides as the trail narrows.
  tangle: The interlocked canopy of brush and branch that closes
    this corridor into shadow — cover for what waits below.
idlemessages:
- The tangle shifts on both sides without wind — a slow, deliberate
  movement that tracks your progress.
- Somewhere below, in the dark of the hollow, something exhales
  in a long, even breath.
