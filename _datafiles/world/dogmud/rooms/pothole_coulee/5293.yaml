zone: Pothole Coulee
title: Den Approach
description: >
  The brush thickens to a tangle here, stems interlocked above
  head height, the ground dropping away as the slope steepens
  toward the hollow below. Cover closes overhead and on both
  sides, narrowing the way forward into a corridor of branch
  and shadow. This is the last open ground before the land
  belongs to something else entirely. The tangle is full of
  sound — movement, breathing — that does not stop when you do.
