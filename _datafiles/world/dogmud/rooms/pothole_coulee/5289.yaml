roomid: 5289
zone: Pothole Coulee
title: Thornbrake
description: >
  A dense thornbrake fills the hollow, stems woven into a wall that
  neither wind nor larger animals push through cleanly. Small game
  has made a world of it — runs pressed low through the base of the
  thorns, pellets, tufts of fur snagged on barbs. The thorns catch
  at sleeves and skin as you press through, drawing thin lines of red.
