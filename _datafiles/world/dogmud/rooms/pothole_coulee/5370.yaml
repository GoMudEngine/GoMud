nouns:
  steppe: Open grassland running flat and wide to the horizon, the same
    high dry country the pack once hunted, quiet now and unheld. The wind
    owns it; nothing else moves on it that you can see.
  trail: The quiet path along the southern rim, dropping east behind you
    toward the mire and Clearwater Spring, climbing west ahead toward
    Wolfwater. Few have walked it; the grass closes over it between users.
idlemessages:
- The <ansi fg="cyan">steppe</ansi> wind takes the last of the coulee's damp off your skin and
  replaces it with sun.
- Westward the Wolfwater pool throws back a coin of bright sky, close
  enough to reach before the light shifts.
