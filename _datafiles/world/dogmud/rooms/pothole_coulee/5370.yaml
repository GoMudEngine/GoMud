roomid: 5370
zone: Pothole Coulee
title: Steppe Edge Trail
description: >
  The trail tops out onto open steppe, the coulee's rim dropping away
  behind and the grass running wide and unhindered to every horizon. The
  change in the air is total -- dry, moving, smelling of sun-warmed grass
  instead of cold stone or fouled water. Just west the ground dips to where
  a spring wells up at the foot of a limestone shelf, its pool catching the
  sky; that is Wolfwater, and the open steppe the wolves once ran. Behind
  and east, the thin trail you walked drops back toward the mire and the
  other, clearer spring. The two waters and their two countries, joined by
  one quiet path along the rim.
biome: land
