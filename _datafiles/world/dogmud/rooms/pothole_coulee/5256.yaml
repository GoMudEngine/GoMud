roomid: 5256
zone: Pothole Coulee
title: Timbered Drift
description: >
  The tunnel opens into a horizontal drift, wide enough here that two
  men could pass or a full fight could play out without wedging
  against the walls. A grid of old timbers shores the ceiling -- squat
  posts with cross-beams laid between them, the wood black with age
  and glistening where the rock seeps. They groan at intervals, a
  slow deep sound that travels the whole drift and comes back changed.
  The floor has been leveled by old work, a strip of reasonably flat
  stone down the center where the carts once ran, though the rails are
  long gone. The drift runs west to where it pinches back to a tunnel,
  and a side-branch drops away into the lower workings. East the way
  back up is still open.
biome: cave
