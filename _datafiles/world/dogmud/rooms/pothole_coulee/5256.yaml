nouns:
  timbers: The old shoring grid, posts and cross-beams, black with
    age and sweating where the rock breathes through them. They hold
    -- or have held -- but the groan they make when the mountain
    settles is the sound of something under load for too long. Each
    one is the only thing between the roof and your head.
  drift: The worked horizontal gallery, wider than the access tunnel
    east of it -- a proper working space once, where crews swung
    picks and ran carts down a rail now vanished. The flat center
    strip is the fighting ground -- wide enough to move in, the
    shoring posts spacing it into thirds that can be used for cover.
