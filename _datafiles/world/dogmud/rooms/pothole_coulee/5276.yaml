zone: Pothole Coulee
title: Sulphur Flats
description: >
  A pale crust covers the ground here, sulphur dried over black mud
  that shows through wherever a foot has broken the surface, wet and
  dark as an open wound. Vents split the crust at intervals, breathing
  out small hisses of foul gas and rings of discolored foam. To one
  side a sinkhole breaks the flat entirely, its edges crumbled and
  slick, dropping away into a sunken hollow below where the air goes
  green and close. The stench is sharp enough to sting the back of the
  throat.
biome: swamp
