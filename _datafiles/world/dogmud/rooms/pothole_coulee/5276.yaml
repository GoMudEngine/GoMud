nouns:
  crust: Sulphur dried to a pale mineral skin over the black mud
    beneath. It cracks underfoot with a sound like thin ice, and the
    mud that shows through is the color of something long dead.
  vents: Splits and holes in the crust where the ground exhales.
    Each one breathes a thin hiss and a reek that gets into the eyes.
    The foam they leave behind is pale yellow and does not last long.
  sinkhole: A ragged hole where the crust gave way entirely, its
    edges slick with seep-water. The drop below is short but the
    hollow it opens into smells of foul air and standing water.
idlemessages:
- One of the <ansi fg="itemname">vents</ansi> lets out a long hiss and
  goes briefly quiet, as though catching a breath.
- The <ansi fg="itemname">crust</ansi> groans beneath your weight, and
  a crack runs an arm's length toward the sinkhole.
