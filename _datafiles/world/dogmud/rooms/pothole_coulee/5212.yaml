roomid: 5212
zone: Pothole Coulee
title: School Shelf
description: >
  The basalt shelf runs out flat and open above the pool, a natural
  landing of dark stone scoured bare by the weather. A few plank benches
  sit in a rough half-ring near the lip, set out so a class can take its
  lessons under the open sky rather than cooped in the hall. From the edge
  the whole basin falls away below in one clear view -- the dark eye of
  the water, the stilt-houses up on their long legs, the gravel paths
  threading pale between them, all small and sharp as a thing seen in the
  bottom of a bowl. The wind comes steady off the steppe and snaps at
  loose pages and hair, carrying the cold breath of the water up from far
  down. It is a fine place to think and a hard place to drowse.
