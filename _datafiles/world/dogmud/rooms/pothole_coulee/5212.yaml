nouns:
  benches:
    Plain plank benches sit in a loose half-ring back from the edge,
    weathered silver-grey and bowed in the middle from long sitting. They
    are set to face outward over the basin, so that a teacher need only
    turn a row of children toward the world to make a lesson of it. Wind
    has worked the grain into soft ridges, and old jackknife letters mark
    the seats where bored hands have whiled away a dull morning.
  shelf:
    The shelf is a broad tongue of basalt thrust out flat from the bowl's
    upper wall, swept clean of soil by the wind and stained dark by old
    water. It makes a natural platform, steady underfoot and open to the
    sky, high enough that the noise of the town below never quite reaches
    it. At its lip the stone simply ends, and the air opens out over the
    long drop to the pool.
  view:
    From the edge the whole basin lies open below, near enough to read and
    far enough to hold all at once. The pool sits at the center, a flat
    dark eye; around it the stilt-houses stand on their legs, the paths
    run pale between the workshops, and the figures of the Opened move
    small and slow about their day. Seen from up here it all looks safe
    and whole, a single quiet place cupped in the broken land.
idlemessages:
- The wind gusts across the <ansi fg="itemname">shelf</ansi> and snatches at the empty benches.
- Far below, the basin lies spread and small, the pool a dark and unblinking eye.
