nouns:
  stair: The winding stone stair at its midpoint, narrowed here to a span
    that skirts the open drop on a ledge barely a boot wide. Below it falls
    back to the base; above it climbs the last turns to the crown. There is
    no rail and no margin -- the climb is all balance from here up.
  slits: Tall thin slots cut through the curved wall, made for archers to
    loose down on the wash without showing themselves. The dead left them
    empty; through them the canyon shows in pale slivers, the whole long
    climb small and far below. Anything posted here commands the approach
    blind.
  arrow slits: The same narrow loopholes pierced in the wall for bowmen long
    gone. They frame the wash in vertical slices of light and let the wind
    through with a low steady whistle. A bow set in one of these covers the
    climb and shows the archer to no one.
  drop: The black ragged hole where the shaft's center floor has fallen
    away, plunging straight down the throat of the tower to the broken stone
    far below. The stair skirts its very lip. A misstep here ends the climb
    the short way, and the dark gives back no bottom.
idlemessages:
- Wind moans low through the <ansi fg="itemname">slits</ansi> and the cold air off the drop pulls steadily at your back.
