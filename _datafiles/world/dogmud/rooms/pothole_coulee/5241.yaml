zone: Pothole Coulee
title: Tower Stair
description: >
  The stair winds you up to a landing midway, a narrow shelf of stone
  clinging to the curved wall where the climb pauses before it goes on.
  Arrow-slits pierce the wall here, tall thin wounds cut for archers long
  dead, and through them the wash shows far below in slivers -- the whole
  climb you made, laid out small and pale and a very long way down. The
  floor at the shaft's center has fallen clean through, leaving a black
  ragged drop straight down the throat of the tower to the rubble at its
  base; the stair skirts the edge of it on a span no wider than your boots.
  This is the held breath of the climb -- past it, only the top remains.
  The stair drops away below; it climbs on above toward the light.
