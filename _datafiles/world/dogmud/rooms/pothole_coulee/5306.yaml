nouns:
  dome: The dome overhead is a remarkable thing even in its current state
    -- great slabs of stone fitted to a curve, each one cut to angle just
    so, holding the arch by press and weight alone. The crack that runs
    through it is ragged at the edges and has shed fragments onto the floor,
    but the dome has not moved since.
  telescope: Fallen on its side, the telescope is still an impressive
    object -- brass rings along its length, a rotating mount at the base
    now bent and useless, a barrel that narrows toward the cracked lens
    end in careful graduated steps. It smells of old metal and something
    faintly like lamp oil.
  crack: The crack in the dome cuts a crooked line from somewhere above
    the center all the way to the rim, letting in a strip of sky that
    moves from dark to bright as the sun travels. At night, you could
    lie on the floor and watch a thin river of stars drift slowly past.
idlemessages:
- Wind passes over the <ansi fg="cyan">crack</ansi> in the dome and makes a low, hollow note.
- A fragment of stone the size of a thumbnail lets go of the dome's edge and clicks across the floor.
- The strip of sky visible through the <ansi fg="cyan">dome</ansi>'s crack shifts from pale gray to a clearer blue.
- The fallen <ansi fg="yellow">telescope</ansi> creaks once, very faintly, as the structure settles around it.
