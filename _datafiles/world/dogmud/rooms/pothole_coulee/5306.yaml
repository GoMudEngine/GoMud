roomid: 5306
zone: Pothole Coulee
title: Cracked Dome
description: >
  The observatory's dome still stands, but only just -- a long jagged
  crack splits it from near the apex to the lip, and through that gap
  the sky enters, a bright wound across the stone ceiling. The floor
  beneath the crack is pale with years of rainwash. Dominating the room
  is a great telescope that came off its mount long ago and lies on its
  side, its barrel as wide as a man's shoulders and running nearly the
  full width of the chamber. Copper and bronze fittings have gone green
  with age, and the lens at the far end -- cracked but still seated -- is
  glazed with a fine fur of oxidation. The air here is very still,
  insulated from the wind outside by those thick walls and the dome above.
