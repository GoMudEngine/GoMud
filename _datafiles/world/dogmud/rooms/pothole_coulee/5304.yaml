roomid: 5304
zone: Pothole Coulee
title: Fallen Orrery
description: >
  A side chamber off the main hall, and nearly the whole of it is taken
  up by the ruin of a great brass orrery that has come down from its
  mounting and lies in a tangle across the floor. Rings of every size --
  some wider than your outstretched arms, some no bigger than a bracelet
  -- nest and cross and lean against one another at impossible angles,
  and between them the spheres that once marked the turning heavens rest
  wherever they rolled and stopped. Brass the color of old honey, green
  at the joints where the metal has bloomed. The room is strangely peaceful
  for all the wreckage; there is something in the sprawl of rings and
  spheres that invites you to sit and simply look.
