nouns:
  orrery: The whole of the device must have stood taller than two men
    when it was whole. Even fallen, you can trace the logic of it --
    ring inside ring inside ring, each one tracking some body in the sky,
    the whole assembly meant to show the heavens turning in their courses.
  rings: Dozens of brass rings lie nested and crossed across the floor,
    each one engraved along its inner edge with a track of tiny script.
    The writing is too small to read standing, but the curves of it are
    very deliberate.
  spheres: Small brass spheres, some no bigger than a fist, some as wide
    as a pot, are scattered where they rolled when the orrery fell. Each
    one is etched with a pattern of lines -- a map of something, or a symbol
    of something, worn smooth at the poles from being handled.
idlemessages:
- One of the brass <ansi fg="yellow">rings</ansi> shifts a finger's width across the floor with a low metallic sigh.
- The silence here has a quality to it -- full, like a held breath, like something waiting to be understood.
- Light from the hall catches the <ansi fg="yellow">orrery</ansi>'s fallen curves and runs along them in a slow gleam.
