zone: Pothole Coulee
title: Sparring Circle
description: >
  A ring of half-buried stones marks out a sparring circle here, the
  ground inside it scuffed to fine pale dust by shuffling feet. Old chalk
  lines fan across the dirt -- guard marks, footwork tracks, the patient
  geometry of learning where to stand and when to move. The dust still
  holds the scuffs of the last pair to drill here, heel and toe and the
  long drag of someone giving ground. The yard lies south; the wash
  climbs on toward the east.
