nouns:
  circle: A ring of stones set half into the earth, marking the bounds of
    the sparring ground. Step inside it and the rule is plain -- footwork,
    not flight. The dust within is beaten paler than the dirt around it.
  chalk: Faint chalk lines fan across the packed dust, redrawn so many
    times they ghost over each other. Guard stances, stride marks, the
    angles of a turn -- the drillmaster's silent teaching, written in dust.
  lines: The chalk lines trace where feet should fall -- a fan of strides
    and pivots, the careful geometry of holding ground against someone who
    means to take it from you.
  stones: Smooth river stones, half-sunk and worn flat on top, ringing the
    circle. Years of drilling feet have polished the ones along the
    common paths.
