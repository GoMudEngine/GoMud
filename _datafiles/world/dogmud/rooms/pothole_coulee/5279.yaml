nouns:
  mere: A wide, still body of black water, perfectly level, perfectly
    silent. The edges are indistinct -- the mire shades into the mere
    without a clear border, and the water does not announce itself
    until it is under your feet.
  water: Black and motionless, holding no reflection and giving
    nothing back. It has the quality of a held breath, of something
    choosing not to move rather than simply being still.
  surface: Flat as poured pitch, and darker. Nothing breaks it.
    Looking at it too long produces an unease that is not fear of
    drowning but something older and less nameable.
idlemessages:
- The <ansi fg="itemname">surface</ansi> of the <ansi fg="itemname">mere</ansi>
  does not move -- and somehow that is worse than if it did.
- The silence presses in from all sides, as though the swamp is
  listening to what you might do next.
