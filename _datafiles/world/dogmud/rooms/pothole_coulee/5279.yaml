roomid: 5279
zone: Pothole Coulee
title: The Black Mere
description: >
  The mere spreads wide and utterly still, black water holding the
  faint green murk of the hollow above without a ripple, without a
  sound. The surface is like dark glass -- not reflective, not
  transparent, simply absent of anything the eye can catch hold of.
  Nothing breaks it. No insect, no drift, no current. The silence
  here is not an absence of noise but a presence of its own, held
  in place by something that has not moved in a long time but is
  not sleeping. Whatever rules this swamp is very near.
biome: swamp
coord:
  x: 47
  y: 12
  z: -1
