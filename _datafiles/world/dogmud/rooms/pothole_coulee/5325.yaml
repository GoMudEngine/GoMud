roomid: 5325
zone: Pothole Coulee
title: The Longhouse
description: >
  The longhouse is a single long room with a central hearth running its
  length, the smoke rising through a ridge-vent that has darkened the
  rafters to deep amber over many years. Benches line both walls --
  plain timber, worn smooth at the seat -- and between them a low table
  holds the working materials of whoever last sat here. On a wide shelf
  near the far end, the folk-elder keeps the homestead's records -- a
  row of tally-sticks bundled in cord, a few worn ledger-books, and
  some loose sheets covered in a careful hand. These are the things
  worth remembering and the tools for doing it. The hearth is banked
  low but warm, ticking quietly in its stone surround. The room is the
  kind of place that makes it easy to sit down and think, and difficult
  to leave in a hurry. When you need to recall what you have learned,
  the records here and the help command are your surest references.
