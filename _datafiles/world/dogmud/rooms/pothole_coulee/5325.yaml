nouns:
  hearth: The hearth is long and low, built for warmth over many hours
    rather than a quick cook-fire. The stones at its edges are dark
    with use and faintly warm to the touch even when the fire is banked.
  records: The records on the shelf are a working archive -- tally-sticks
    for counts and trade, ledger-books for the seasons, loose sheets
    for things that did not fit neatly into either. They are worn but
    legible, consulted often and carefully maintained.
idlemessages:
- The <ansi fg="yellow">hearth</ansi> ticks as the banked coals settle, radiating a
  steady and unhurried warmth.
- One of the <ansi fg="yellow">records</ansi> on the shelf has been left open, a tally-stick
  resting across the page as a marker.
- The rafter-beams overhead are dark with old smoke, smooth where
  hands have steadied against them over the years.
