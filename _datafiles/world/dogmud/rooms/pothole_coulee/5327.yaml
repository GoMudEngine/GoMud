roomid: 5327
zone: Pothole Coulee
title: Kitchen Garden
description: >
  Behind a low fence of split palings, the kitchen garden runs in tidy
  rows from the yard's north edge to a low hedgerow. Root vegetables
  fill the inner beds -- turnip and carrot and parsnip, their feathery
  tops marking straight lines across the dark soil. Herbs crowd the
  border in a less orderly arrangement, each plant chosen for use rather
  than appearance. The soil between the rows has been turned recently,
  still loose and dark, and the smell of it is clean and mineral. Bees
  work the flowering herb border with a low, steady sound. Someone tends
  this garden every day -- the evidence is in the absence of weeds, the
  evenness of the rows, the way nothing has been allowed to sprawl or
  run to seed without intention. The well lies to the west, a short
  walk along the garden's edge.
