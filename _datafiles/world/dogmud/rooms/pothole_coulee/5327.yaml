nouns:
  rows: The planting rows are straight and evenly spaced, marked by
    a taut cord run between short stakes at either end. The work of
    keeping them this way is quiet and daily and never quite done.
  beds: The herb beds at the border are the one place in the garden
    where order yields to abundance -- plants crowding into each other,
    flowering at their own pace, kept only by regular harvest.
idlemessages:
- The <ansi fg="yellow">beds</ansi> hum with bees working the herb flowers in long
  looping passes.
- A row of carrot-tops trembles where something small moves along
  the soil between the <ansi fg="yellow">rows</ansi>.
- The smell of turned earth and growing things is strong here in
  the warm part of the afternoon.
