nouns:
  sage: Sage stands thick and deliberate across the flat, each shrub
    rounded by wind into a low grey-green mound. The leaves are small
    and pale, coated in fine hair that holds the oils. Crush a sprig
    between your fingers and the smell is the whole steppe at once.
  bees: Fat, slow, heavy with pollen, the bees move through the sage
    without any hurry. They have been working this flat longer than the
    trail to the east has existed. They pay you no attention at all.
idlemessages:
- The <ansi fg="itemname">bees</ansi> drone on, indifferent to the sun moving overhead.
- A breath of wind crosses the <ansi fg="itemname">sage</ansi> and the whole flat exhales its scent.
