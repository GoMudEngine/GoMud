roomid: 5285
zone: Pothole Coulee
title: Sage Flat
description: >
  The flat spreads broad and unhurried, thick with sage grown tall
  enough to brush your hip. Silver-green in the light, blue-grey in
  shadow, it runs wall to wall across this hollow in the steppe with
  only the occasional pale clump of bunchgrass breaking the pattern.
  Bees work the flat steadily, dropping from bloom to bloom, loud in
  the windless air. The smell of crushed sage rises from every footstep,
  clean and sharp, and the ground beneath is soft with years of leaf-fall.
