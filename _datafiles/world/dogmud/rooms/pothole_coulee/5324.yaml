zone: Pothole Coulee
title: The Commons Yard
description: >
  The heart of the homestead is a wide yard of packed earth, worn to
  a smooth hardness by years of daily crossing. The longhouse stands
  to the west, its timber walls dark with age, smoke-stained at the
  roofline where the central hearth breathes. The barn to the east is
  larger than it looks from the gate, its doors folded wide in the
  working hours. Ahead to the north a kitchen garden rows up neatly
  behind a low fence. The yard itself is neither tidy nor neglected --
  it has the settled appearance of a place where things are always
  in use and always exactly where they belong. The folk-elder of the
  homestead works from this yard most mornings, greeting those who
  come to learn or to trade or simply to ask after the old ways.
