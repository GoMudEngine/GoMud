nouns:
  yard: The yard has the density of long use underfoot -- not mud,
    not stone, but earth compressed to something close to either.
    Everything flows through here and leaves a trace of itself.
  longhouse: The longhouse is the oldest structure on the homestead,
    its roof-ridge bowed slightly with age but sound, the timbers
    well-jointed and maintained. A warm light shows at the door.
idlemessages:
- The <ansi fg="yellow">yard</ansi> holds the midday quiet between tasks, the air
  smelling of dry earth and recent work.
- From the <ansi fg="yellow">longhouse</ansi> to the west comes a low sound -- someone
  reading aloud, or recalling something to themselves.
- A crow lands at the center of the yard, considers its options,
  and departs again with evident purpose.
- The folk-elder moves through the yard on some unhurried errand,
  pausing to straighten a tool leaning against the wall.
