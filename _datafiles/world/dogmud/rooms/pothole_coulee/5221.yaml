nouns:
  talus: The talus is a steep apron of shattered rock fallen off the
    cliffs above, dark plates and wedges heaped loose and treacherous. It
    shifts and rings underfoot like cracked crockery. A cold forge-smell
    of iron and coal comes down through the gaps in it, hinting at heat
    and hammers somewhere above the slide.
  timbers: A stack of fresh-cut timbers lies beside the half-dug gap,
    pale and sticky with sap, brought in to shore the loose rock while a
    way is cut through. Someone has begun the work and left it for the
    day; the props lean ready against the talus, waiting for hands to set
    them.
