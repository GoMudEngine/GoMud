roomid: 5221
zone: Pothole Coulee
title: Talus Gap
description: >
  A long slope of broken talus piles up to the west, loose plates of dark
  rock that shift and clink underfoot. A cold smell rides down off it --
  iron and quenched coal and old ash, the breath of a forge somewhere up
  beyond the scree. Stacked timbers wait beside a half-dug gap where
  someone means to shore a way through the slide.
biome: cliffs
