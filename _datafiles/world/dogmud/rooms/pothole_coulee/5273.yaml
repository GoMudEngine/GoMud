nouns:
  pool: The water is perfectly still and very dark, the color of old tea.
    The bottom, if there is one, is not visible. The surface reflects the
    willows above like hammered iron.
  willows: Old trees with bark gone silver-grey and branches that droop
    low enough to trail in the pool. Their narrow leaves are pale on the
    underside and catch the light when the wind moves them.
idlemessages:
- A leaf drops from the <ansi fg="itemname">willows</ansi> and drifts
  on the <ansi fg="itemname">pool</ansi> without sinking.
- Something rises briefly in the dark <ansi fg="itemname">pool</ansi>
  — a bubble, or an eye — and is gone before you are sure of it.
