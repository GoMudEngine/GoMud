roomid: 5273
zone: Pothole Coulee
title: Black Pool
description: >
  A deep pool opens between the willows, the water so dark it might be
  stained with tannin or might have no bottom at all. The willows lean
  in from the bank, trailing their narrow leaves across the surface,
  and beneath them the richest herbs in the marsh grow thick along
  the waterline: marsh-mint in pale green mats, willow-bark peeling in
  long papery strips, water-hemlock keeping its distance in the shallows
  while safer plants crowd the verge. The air smells of green things and
  cold water, and it is very quiet here.
biome: swamp
