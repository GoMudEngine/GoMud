zone: Pothole Coulee
title: Mossy Verge
description: >
  The sheltered ground of the hollow gives out here at a ragged verge
  where the moss takes over, spreading thick and slick across stones
  that the spring-water has been working loose for longer than anyone
  can say. Southward the ground sags and darkens and the smell of sweet
  rot overwhelms the herb-scent of the pool behind you; the marsh does
  not wait long before it reasserts itself. At the edge of the moss a
  flat-topped marker stone has been set upright in the earth, its face
  worn smooth by weather and by hands. Travelers have used it for years
  as a place to fix a bedroll and take stock before pressing on or
  turning back.
