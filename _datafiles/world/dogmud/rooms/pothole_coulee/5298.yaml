nouns:
  hollow: A dug-out hollow under a thorn-choked bank, expanded over
    seasons by something that needed more room and took it. The walls
    are raked clay, the floor packed to near-stone hardness by
    constant use. Every surface carries the marks and the smell of
    long habitation. This is not an empty place.
  musk: The smell is layered — old blood beneath, musk above, both
    built up over seasons into something that settles on the tongue
    as much as the nose. It is the smell of something that sleeps
    here, eats here, and has done so for a very long time. The den
    is saturated with it.
idlemessages:
- The clay walls carry long furrows where something raked them flat
  and smooth over seasons of use.
- The compressed remnants on the den floor tell you what has been
  eaten here, and how much, and for how long.
