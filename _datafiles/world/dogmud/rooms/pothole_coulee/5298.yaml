roomid: 5298
zone: Pothole Coulee
title: The Den
description: >
  The ground drops under a low thorn-choked bank and opens into a
  dug-out hollow, the earth packed so hard by years of pacing that
  it has the quality of stone. The bank overhead is threaded with
  roots that have been worn smooth where they hang low enough to
  brush a passing back. The air is close and heavy with musk and old
  blood, a smell that has been built up over seasons into something
  physical. The walls of the hollow show the marks of digging — long
  furrows raked into the clay by something that enlarged this space
  over time and made it its own. The floor is littered with the
  compressed remnants of old kills. This is where the alpha lives.
  It has the feel of an occupied place.
biome: forest
