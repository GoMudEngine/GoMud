zone: Pothole Coulee
title: Weapon Rack Lean-to
description: >
  A lean-to of weathered canvas slung from poles leans against the canyon
  wall, throwing a band of shade across a long wooden rack. The rack holds
  the yard's loaner weapons -- carved wooden swords gone grey with handling,
  blunted spears with their points wrapped in leather, staves bound in
  fraying cloth so a hard rap stings but never breaks bone. Everything
  here is meant to be borrowed, used hard, and racked again. The yard
  lies back to the west.
biome: shore
