roomid: 5271
zone: Pothole Coulee
title: Cattail Stand
description: >
  A hummock of firmer ground rises just above the waterline, thick with
  cattails growing so dense they form a wall on three sides. Someone has
  made use of the shelter: a low frame of bent willow withes leans
  against the cattails, a rusted iron pot hangs from a tripod of sticks,
  and bundles of dried marsh-herbs are bound to the frame with strips of
  bark. The camp is cold and has been for some time, but the dried herbs
  still hold their sharp green smell.
biome: swamp
