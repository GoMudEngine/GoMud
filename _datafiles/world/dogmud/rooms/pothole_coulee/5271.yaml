nouns:
  cattails: A dense stand packed tightly around the hummock's edge,
    growing taller here than anywhere nearby — chest-high at least, their
    brown heads level with your face when you push through.
  hummock: A raised pad of matted root and peat that sits a hand's-width
    above the surrounding water. Firm underfoot, the ground here holds
    your weight without sucking.
  camp: A rough arrangement of bent-willow frames, a hanging pot, and
    bundles of dried marsh herbs. Whoever made it knew their plants;
    the herb bundles are sorted and carefully tied.
idlemessages:
- The dried <ansi fg="itemname">camp</ansi> herbs rustle when the breeze
  moves through the <ansi fg="itemname">cattails</ansi>.
- A dragonfly settles briefly on the hanging pot and is gone.
