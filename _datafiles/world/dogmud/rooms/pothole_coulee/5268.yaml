roomid: 5268
zone: Pothole Coulee
title: Still Shallows
description: >
  The pool spreads into a quiet arm here, shallow enough to wade without
  wetting your knees, its bottom a pale silt that holds no print for
  long. The water is glass-still in this sheltered corner, barely a
  tremor on its surface, and through it the silt glows faintly pale
  in the filtered light. Freshwater clams work themselves slowly into
  the mud along the margin, their shells the color of old ivory. At the
  waterline, mint has taken hold between the stones, growing in flat
  mats that release their smell the moment you brush them -- sharp and
  cool and immediate, cutting through the broader green weight of the
  marsh. These shallows are a quiet spot, easy to overlook, good for
  learning to look carefully at small things.
biome: water
