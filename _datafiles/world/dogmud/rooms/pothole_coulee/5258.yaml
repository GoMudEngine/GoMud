roomid: 5258
zone: Pothole Coulee
title: Lower Drift
description: >
  The shaft drops you into the lower level and the mine changes
  register entirely. The worked drift up top still carried the memory
  of the surface -- loose grit, borrowed light, air that moved. Here
  there is none of that. The basalt closes in columnar and close, the
  great hexagonal columns that make up the scabland bedrock showing
  their jointing lines raw in the walls and ceiling, packed so tight
  they look machined. The air is colder and older, untouched by any
  surface breath, and it has a weight to it that the drift above
  lacked. Watermarks stain the columns a darker shade at chest height,
  the tideline of past floods long since receded. Sound behaves
  differently here -- flat and near, swallowed at the walls. The
  lower workings run west.
