nouns:
  basalt: The native rock of this level, columnar and close-packed,
    the hexagonal columns of the scabland bedrock exposed in their
    raw jointing where the picks stripped the softer overburden away.
    The faces are glassy where they fractured clean; the joints
    between them are dark seams the width of a finger. This is old
    rock and very hard, and the effort it took to open even this
    small gallery shows in every chipped edge.
  columns: The great hexagonal pillars locked together in the walls
    and ceiling overhead, so tightly fitted they need no mortar and
    give no purchase for water or time to work on. They are the
    reason the mine goes where it goes -- the columns dictate the
    drift, not the other way around.
idlemessages:
- The air down here does not move; it simply sits against your skin, cold and old and without any memory of the surface.
- Water has stained the <ansi fg="itemname">columns</ansi> to chest height and no higher -- the tidemark of a flood that came and went and left its record.
