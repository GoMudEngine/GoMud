roomid: 5295
zone: Pothole Coulee
title: Bone Field
description: >
  The field is white with bones. Not scattered — laid down over years
  in a long accumulation, rib arches standing clear of the grass,
  skulls tilted at angles where they settled, long bones crossing in
  every direction. The ground crunches underfoot with the debris of
  the smaller pieces. This is the pack's long midden, the leavings
  of seasons of kills dragged back here and stripped and left. To the
  south the ground drops toward a dark gap under a thorn-choked bank
  — the den mouth. The field is a threshold. Stepping further into it
  means something.
biome: forest
