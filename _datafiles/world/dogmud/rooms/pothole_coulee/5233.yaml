nouns:
  bend: The sharp doubling-back of the wash around a shoulder of rock. You
    cannot see past it until you have stepped into it, and whoever knows
    this ground would wait for a stranger to do exactly that.
  scree: A fan of loose broken stone spilled down the inner wall, fine
    gravel over fist-sized rubble. It shifts and rattles under any weight
    -- treacherous footing for a fight, and loud enough to give you away.
  walls: The canyon sides draw in close at the bend, leaning high and grey
    overhead, hoarding the shadow. They funnel every sound and pen anyone
    caught here between rock and rock.
  jut: The shoulder of broken stone the wash wraps around, blunt and
    weathered, blocking the sightline. It is the whole reason the bend is
    blind, and the obvious place for an unkind welcome to wait.
idlemessages:
- Loose <ansi fg="itemname">scree</ansi> trickles down the inner wall with a dry whisper and settles again.
