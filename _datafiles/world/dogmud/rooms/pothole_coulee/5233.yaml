roomid: 5233
zone: Pothole Coulee
title: Gravel Bend
description: >
  Here the wash kinks hard, the gravel channel doubling back on itself
  around a jut of broken stone so that you cannot see what waits on the
  far side until you are already in it. It is a blind bend, the kind any
  fighter learns to mistrust -- a place built for an ambush by no hand at
  all, just water and time. Loose scree spills down the inner wall in a
  fan of rattling stone, ready to give underfoot and pitch a careless step
  onto its face. The walls press close and high, throwing the bend into
  shadow even at midday. The gravel runs back west the way you came and
  bends on east toward open ground.
biome: cliffs
