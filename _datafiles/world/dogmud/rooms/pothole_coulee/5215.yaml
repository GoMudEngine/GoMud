roomid: 5215
zone: Pothole Coulee
title: The Threshold House
description: >
  A low roof of weathered plank has been raised over this spot, less a
  house than a shelter built to keep weather off the thing it guards: a
  free-standing arch of basalt, older than the town, older maybe than the
  town's oldest stories. The arch stands rooted in the rock floor, its
  stones fitted by no hand anyone remembers, and from somewhere in it
  comes a faint, steady hum -- felt in the teeth more than heard in the
  ear. Step near and the air goes thin and tingling, the way it does
  before a storm or a held note. A plain three-legged stool sits beside
  the arch where a warden keeps watch over comers and goers. There is no
  menace here, only the deep patient wonder of something that has waited a
  very long time and is in no hurry to stop.
