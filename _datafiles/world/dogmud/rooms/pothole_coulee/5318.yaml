nouns:
  echo: The lagging image of yourself is not quite a reflection -- it
    moves with your gestures but the timing is wrong, delayed by a
    half-breath. When you raise your hand it raises its hand, when
    you step it steps, but always a beat behind, and its expression
    is not quite yours.
  space: The pocket here folds back on itself at the edges -- you
    cannot see where the walls are, only that walking toward them
    brings you no closer. Space has been compressed into a loop and
    the loop has been here long enough to wear grooves into the air.
idlemessages:
- Your <ansi fg="cyan">echo</ansi> pauses when you pause, its hands at its sides, watching you
  with your own eyes.
- The <ansi fg="cyan">space</ansi> near the west fold flickers -- for a moment there are two
  of everything, then one again.
- Something shifts in the corner of your sight. When you turn, only
  your echo is there, a half-step behind.
