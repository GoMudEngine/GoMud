roomid: 5318
zone: Pothole Coulee
title: Stuttering Space
description: >
  Space stutters here. You see yourself a half-step behind yourself, a
  ghost of your own motion lagging just out of reach -- your echo moving
  a breath after you move, wearing your face. The pocket of ground is
  small, a hollow among the floating slabs, and the walls of it are not
  walls but folds, places where the Folding has turned back on itself and
  pressed close. The air is thick with something you cannot name -- not
  smell, not sound, but a quality of wrongness the body recognizes before
  the mind does. This place does not want to be visited. It has been
  folded into itself for a long time, and something has been living
  comfortably in the repetition.
