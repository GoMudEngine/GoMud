nouns:
  path: The path has been worked by patient hands -- slag and cinder
    packed into every gap between the rock plates, giving solid footing
    where the loose talus offered none. It climbs steadily toward the
    smell of the forge.
  slag: Dark clinker and glassy forge-waste packed tight between the
    stone plates, turned underfoot to a crunching black gravel. It
    holds the slope together and announces the smithy before you see
    it.
  smoke: A thin column of grey-white smoke rises from somewhere above
    the talus, steady and deliberate -- not a fire out of control but
    a forge kept burning. It bends west in the canyon draft and
    vanishes.
idlemessages:
- A breath of forge-smoke drifts down the <ansi fg="itemname">path</ansi>, warm against the cold rock smell.
