roomid: 5244
zone: Pothole Coulee
title: Forge Path
description: >
  The talus draw narrows and steepens here, a worn path of slag-crusted
  stone threading up through the scree. Old clinker and cinder have been
  packed into the gaps between the plates, giving the footing more hold
  than the loose rock below but turning the path an ugly, burnt black.
  The smell sharpens with every step -- quenched coal and hot iron and
  the dry bite of ash, rolling down from somewhere above the slide to
  the west. A smudge of smoke rises against the sky ahead, close now.
