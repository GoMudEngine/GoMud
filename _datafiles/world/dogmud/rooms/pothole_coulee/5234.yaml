roomid: 5234
zone: Pothole Coulee
title: Squatter's Hollow
description: >
  A scoured pocket opens off the south side of the wash, a sheltered
  hollow where the canyon wall has caved back to leave a half-roofed
  recess out of the wind and the sightlines. Someone has made a fort of
  it. A barricade of wreckage walls the mouth -- a smashed cart laid on
  its side, axles up, the gaps stuffed with stone and splintered planking,
  scarred deep where blades have tested it and not gotten through.
  Behind the wreckage the dark of the recess holds a watchfulness; a
  battered shield is propped where a hand could reach it fast, and the
  ground is scuffed by someone who has held this spot a long time and does
  not mean to be moved. The wash lies back north; broken ground runs east.
biome: cliffs
