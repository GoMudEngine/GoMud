nouns:
  forge: A squat stone box built into the back wall, its interior
    banked with charcoal that glows orange-white at the heart. The
    heat off it is serious and immediate. This is where iron becomes
    something other than iron.
  anvil: The anvil is massive, set on a round of hardwood sunk deep
    in the floor. Its face is battered bright in a long oval where
    the hammer lands, the edges dark with old scale. Strike it bare-
    handed and it will sting you for a week.
  bellows: A great hide bellows hung on a pivot above the forge, its
    nozzle aimed down into the charcoal bed. When it drives air
    through the coals the whole smithy brightens. The hide is stiff
    with heat and age.
