roomid: 5245
zone: Pothole Coulee
title: The Coulee Smithy
description: >
  Stone and timber close in tight here, where the talus has been cut
  back and roofed with split logs to make a proper smithy. The forge
  squats at the center of the back wall -- a thick stone box packed
  with glowing charcoal, heat rippling off it in waves, a hide bellows
  slung on a pivot overhead to drive the air down through the bed. The
  anvil stands before it, its face scarred bright by uncountable
  strikes, ringing still with some resonance all its own. Iron tongs
  and hammers of three weights hang in order from a timber rack; a
  barrel of quench-water sits nearby, its surface still, smelling of
  iron and steam. Every surface is black with soot. This is a place
  where things are made.
