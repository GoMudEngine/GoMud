roomid: 5371
zone: Pothole Coulee
title: Coulee Rim
description: >-
  The coulee ends here -- not in a wall but in an opening, the basalt
  bluffs tapering and dropping away to either side until there is nothing
  left of them but low outcrops and then open sky. You stand on the last
  rise of the coulee floor, a shelf of packed earth and scattered shale
  where the protected ground of the ravine gives way to the exposed
  badlands beyond. The change is total: behind you the coulee's walls
  still hold warmth and shelter; ahead, the land falls open and raw,
  scrub-dotted and wind-cut, rolling west into the broad steppe. A rough
  trail -- more gap in the brush than path -- descends from this rim
  into the broken ground below. The mine mouth sits back east among the
  talus.
biome: mountains
