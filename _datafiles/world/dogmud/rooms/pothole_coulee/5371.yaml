nouns:
  trail: A worn gap in the rim scrub where travelers and animals have
    pushed through repeatedly -- not a maintained path but a remembered
    one. It drops steeply from the rim shelf into the broken terrain
    below, the packed earth of the descent scoured bare by wind and
    seasonal runoff.
  rim: The final shelf of coulee floor, a raised lip of packed earth
    and shale where the ravine's protective walls finally end. Standing
    on it you are neither in the coulee nor on the open steppe -- you
    are at the hinge between the two, exposed to the wind for the first
    time.
idlemessages:
- The wind off the steppe hits the rim full-force, cold and unbroken,
  carrying fine grit that stings where it finds skin.
- Looking west, the open badlands seem to go on without limit.
- The coulee's warmth falls away sharply at your back.
