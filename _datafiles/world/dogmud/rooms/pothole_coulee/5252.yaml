roomid: 5252
zone: Pothole Coulee
title: Ore Pocket
description: >
  The slope bends into itself here, a natural hollow where the hillside has
  caught and held what the talus gives up. The pocket is a chest-deep bowl
  of rubble -- broken plates of basalt-iron ore mixed with native scree and
  the spalled edges of the old cuts above, all pitched and tumbled together
  into a dense heap that shifts if you step into the middle of it. The ore
  in the rubble is richer than the loose scree above; chunks the size of
  a fist show the dark close-grained texture of workable iron, and the faint
  orange blush of oxide marks the better pieces. Salvagers work this pocket
  between proper mining runs, pulling out what the slope has already broken
  free. At the near edge of the bowl a flat plate makes a natural anvil
  stone, scored with the marks of work already done here. East is the
  collapsed cut; north climbs back to the scree field.
biome: mountains
