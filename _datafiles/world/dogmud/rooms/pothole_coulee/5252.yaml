nouns:
  rubble: A chest-deep bowl of mixed ore and native scree filling the
    natural hollow -- basalt-iron fragments, spalled cut-edges, loose
    plates, all tumbled together. The heap shifts underfoot, but the
    richer chunks sit on top where the lighter waste has settled around
    them. There is workable iron here for anyone willing to pick through.
  pocket: The hollow itself, the bend of the hillside that caught and
    held everything the slope discarded. It runs no more than a dozen
    paces across, but in that space the ore accumulates so that a short
    hour of picking fills a sack where the open scree above would take
    a day.
  ore: Dark, close-grained chunks of basalt-iron scattered through the
    rubble, heavier than the surrounding scree and distinguished from it
    by a faint orange oxide blush on the freshly broken faces. The best
    pieces are fist-sized and nearly black, the iron concentrated where
    the vein ran richest before the frost pulled it apart.
  anvil: A wide flat plate of basalt laid naturally at the pocket's edge,
    its upper face scored and dimpled from repeated use. Someone found
    it useful long before you did. It is not made for fine work, but
    for cracking ore to workable size it does the job.
