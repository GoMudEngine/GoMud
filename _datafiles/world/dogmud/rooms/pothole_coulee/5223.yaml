nouns:
  brush: Dry grey-green brush covers the rising ground to the south, low
    and tough and smelling of dust and crushed sage. Game trails braid
    through it, beaten thin by deer and hare and whatever else moves out
    on the steppe. Follow any one with your eye and it loses itself in the
    wide rolling country beyond.
  cairn: A hunter's cairn of flat stacked stones stands at the draw's
    mouth, the old way of marking a trailhead and a kill. Fresh rock lies
    heaped at its foot, half-set, where someone has lately set to building
    it taller -- a sign the way south is being opened to those who follow.
