zone: Pothole Coulee
title: Scrub Draw
description: >
  The ground lifts south out of the shallows into dry scrub steppe,
  grey-green brush threaded with the braided trails of game. A hunter's
  cairn of stacked stones marks the draw's mouth, fresh rock heaped beside
  it where someone is building the marker higher. Beyond, the trails run
  off into country no map has caught up to yet.
