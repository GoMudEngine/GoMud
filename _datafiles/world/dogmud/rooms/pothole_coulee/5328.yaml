roomid: 5328
zone: Pothole Coulee
title: The Well
description: >
  A stone well-head stands at the corner where the garden path meets
  the homestead's western edge, its coping worn smooth by the hands of
  everyone who has ever drawn water here. The bucket hangs on a rope of
  plaited hemp, darkened with use, the knot at the bail worn to a flat
  mat. When the bucket descends it takes a long moment before the sound
  of water rises back -- the well is deep, and cold. This is the
  gathering spot of the homestead, the place people naturally stop and
  linger. A word exchanged at the well is a word exchanged in full view
  of the yard, unhurried, with something useful to show for the time.
  Folk arrive here singly for water and leave in pairs having solved
  something, and the stones around the base have absorbed something
  of all those conversations over all those years.
