nouns:
  well: The well is old work, the coping stones fitted close and sealed
    with a mortar that has weathered to the color of the stones
    themselves. It holds cold clean water year round without fail.
  bucket: The bucket is worn smooth on its staves where wet hands have
    gripped it, the rope darkened and stiff with use. It descends
    the shaft with a familiar creak and comes back full.
idlemessages:
- The <ansi fg="yellow">bucket</ansi> turns slowly on its rope in a light air, the
  dripping from its last use long since dried.
- The stones of the <ansi fg="yellow">well</ansi> are warm on the sunny side, cool
  on the shaded side, in the way of things that have stood a long time.
- Voices carry clearly from the yard when someone calls, the
  well-corner open enough to catch sound from all directions.
