nouns:
  stair: The stair is no mason's work but a rough switchback hacked and
    worn into the rock, doubling back on itself up the steep bowl wall.
    Each tread dips in the middle where countless feet have ground it
    hollow. Going down it leads to the pool; going up, to the open shelf
    and the world beyond.
  basalt: The wall here is dark basalt, the same water-polished grey-black
    stone that lines the whole bowl. Ancient floods carved the coulee out
    of it and smoothed every edge they passed. Up close you can see the
    old chisel-scars where hands later cut the stair, softened now by
    weather and use.
idlemessages:
- Wind funnels up the cut stair with a low, hollow moan.
- A loose pebble skitters down a tread and ticks away into the water below.
