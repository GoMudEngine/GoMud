roomid: 5211
zone: Pothole Coulee
title: Basalt Stair
description: >
  A switchback stair has been cut straight into the basalt of the bowl
  wall, each tread worn shallow in the middle by the long press of
  climbing feet. Below, the pool sits dark and flat as poured glass;
  above, the open shelf of the steppe shows a strip of washed-out sky.
  Wind funnels up the cut, cool off the water, tugging at your clothes as
  it passes. The basalt is dark grey-black and water-stained, and your
  hand finds old grips polished smooth by everyone who climbed here before
  you.
biome: cliffs
