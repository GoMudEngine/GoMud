nouns:
  altar: The altar is a single slab of pale stone, thick as a man's
    torso is wide, its surface worn smooth except at the edges where
    centuries of hands have gripped and released. The layered stains
    read like rings in wood -- a record of use without legible names.
  roof: Where the roof has fallen the sky comes in at an angle. The
    surviving sections of rafter are dark with age and hung with
    nothing, stripped of whatever ornamentation once dressed them.
    The open patches let in weather and light equally.
idlemessages:
- The hermit moves to the <ansi fg="cyan">altar</ansi> and adjusts something
  on its surface -- you cannot quite see what -- then steps back and
  regards it for a moment.
- Light falls through the open <ansi fg="cyan">roof</ansi> in a slow-moving bar,
  crossing the altar face and continuing to the far wall.
- Wind moves through the shrine with more direction than it should
  have, as though the walls are guiding it somewhere specific.
- The hermit pauses her work and lifts her head, listening to
  something you cannot hear.
