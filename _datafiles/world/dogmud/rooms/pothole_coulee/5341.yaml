roomid: 5341
zone: Pothole Coulee
title: The Old Shrine
description: >
  The shrine's main floor is open to the sky where the roof has
  surrendered in sections, leaving great patches of cloud and light
  between the surviving rafters. Stone walls stand intact on three sides;
  the fourth has been patched with stacked rubble, inexpertly but with
  evident devotion. At the center a broad altar of pale stone bears
  the stains of long use -- wax, oil, ash, water -- layered into a
  patina that no cleaning would reach. The altar bears no inscription
  now; if one was carved here it has been worn past legibility by
  weather coming through the open roof. An old hermit moves quietly
  about the space, tending to the altar and to things only she seems
  to perceive. She does not startle. She has been here long enough
  that the shrine has shaped itself around her presence.
