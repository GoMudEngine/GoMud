nouns:
  spring: Clear water rising from the base of a limestone shelf,
    welling up cold and clean into a shallow pool that drains away
    into the grass. It has been here long before the pack and will
    be here after. The water is good. It tastes like nothing, which
    means it tastes like nothing is wrong.
  trail: A faint path worn into the steppe grass heading westward,
    too faint to say what made it or how long ago. It leads toward
    ground that has not been mapped yet, open and unheld, bending in
    the wind with nothing running through it.
idlemessages:
- The spring makes a small sound where the water meets the pool. It
  is the only sound here and it is a good one.
- The wind off the steppe carries nothing. No musk, no blood. Just
  grass and distance.
