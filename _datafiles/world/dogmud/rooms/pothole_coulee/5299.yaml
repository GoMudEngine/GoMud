roomid: 5299
zone: Pothole Coulee
title: Wolfwater Spring
description: >
  The bank gives way and the ground opens past the thorn into wide
  steppe, the sky unobstructed, the air moving freely again. A
  spring rises from the base of a limestone shelf at the edge of the
  open ground — clear water welling up into a shallow pool before it
  runs off into the grass. The oppression of the den country is gone
  as cleanly as if someone cut it with a blade. The steppe runs out
  in every direction, unheld and unhunted, and a faint trail runs off
  westward into ground not yet opened, where the grass bends in the
  wind without anything running through it. Just ground. Just air.
biome: land
