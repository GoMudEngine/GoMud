nouns:
  approach: A worn trough of packed earth, the ground compacted hard
    by seasons of paws moving along the same line. It funnels toward
    the den with the purposeful geometry of a thing that has been
    walked the same way ten thousand times. You are on the approach
    now, moving toward something that lives at the end of it.
  den: The smell comes from the east — musk and old blood and the
    deep animal closeness of an occupied place. Whatever made this
    approach lives at its end, and it has lived there long enough to
    wear a road to its own door.
idlemessages:
- The bones pressed into the path edges are from many different
  animals. None of them walked out.
- The smell on the air is stronger here. You are getting closer.
