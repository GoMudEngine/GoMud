zone: Pothole Coulee
title: Lair Approach
description: >
  The ground here has been beaten smooth by the passage of many paws
  over many seasons, the path worn into a shallow trough that funnels
  inward from the north and bends east toward what lies beyond. Bones
  have been pressed into the earth along the edges of the approach,
  half-sunk by the traffic above them, a border that was never
  arranged by intention but has become one regardless. The smell
  thickens as the path runs on — musk and old meat and the particular
  closeness of a den. Whatever you are walking toward knows this
  ground better than you do.
biome: forest
