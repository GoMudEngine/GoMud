nouns:
  stalls: The stalls are plank trestles and upturned crates, each one a
    small trader's whole livelihood set out for the day. One holds
    knapped tools and coils of cord, another smoked fish stacked like
    cordwood, a third odd salvage hauled up from the deep pools. Their
    keepers come and go, but the wares stay put under the awnings,
    minded by neighbors and the town's easy trust. No one is tending
    them to make a sale right now, though -- to actually buy or sell,
    seek out a craftsperson at their own stall, like Smith Rusk at the
    forge.
  awnings: The awnings are a motley of patched canvas and faded
    sailcloth, lashed from the house-eaves out to leaning poles to keep
    sun and squall off the goods. They sag where the rain has pooled and
    belly out when the wind funnels down the coulee. Their shade falls in
    long bright-edged stripes across the lane.
idlemessages:
- An awning bellies and snaps overhead as the breeze gusts down the bowl.
- Somewhere down the row two voices fall into the easy back-and-forth of haggling.
