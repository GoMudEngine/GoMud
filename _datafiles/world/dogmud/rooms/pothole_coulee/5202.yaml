nouns:
  path: This stretch of path is the same raked gravel as the west shore,
    but the feet that wear it here move slower -- folk leaning on each
    other, or carrying baskets of cut greens up from the water. It runs
    north and south between the pool and the workshops. The stones are
    pale and dry where they are not splashed.
  herbs: The smell of herbs comes and goes on the breeze from the east --
    crushed leaf, bitter root, something steeped a long while over low
    coals. It is the smell of a place where bodies get mended. Bundles of
    drying greens hang from a line strung near the path, swaying and
    shedding flakes when the wind picks up.
  crag: To the north, a crag of dark basalt rises out of the bowl wall,
    high enough to give a clear look down the whole pool. A worn trail
    switches up its near face. Folk climb it to sit and think where the
    noise of the workshops cannot follow.
