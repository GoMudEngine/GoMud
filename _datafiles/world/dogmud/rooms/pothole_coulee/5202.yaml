zone: Pothole Coulee
title: East Shore Path
description: >
  Gravel crunches along the east shore here, the same packed path as the
  far side but turned to other work. A drifting smell of crushed herbs
  rolls down from the Mending Hut eastward -- bitter-green and sharp, the
  smell of poultices and steeped roots. North, an overlook crag shoulders
  up out of the bowl wall, dark basalt against a bleached sky. This is the
  working side of the water, where the hurt and the worn-down come to be
  made whole again. The pool waits west, still and deep.
