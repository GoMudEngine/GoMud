roomid: 5315
zone: Pothole Coulee
title: Riven Ground
description: >
  The ground here has come apart. Stone slabs the size of barn floors float
  at varying heights, some tilted, some perfectly level, each one drifting
  with a slowness that seems deliberate. The gaps between them do not show
  earth -- they open onto sky, the same pale sky that is above you, as
  though the world has simply been cut loose from itself here and is
  rearranging the pieces. You came up from a tear in the grove below; the
  way back is still there, below your feet, but the ground you stand on
  is barely ground at all.
biome: cliffs
