nouns:
  slabs: Each slab moves on no current you can feel, rotating fractions
    of a degree and drifting sideways by thumb-widths. The stone is
    pale and finely grained -- clifftop limestone, or something that
    was limestone before this place unmade the ordinary rules.
  gaps: The gaps between the slabs should show soil, or the tops of
    trees, or rock face -- anything grounded. Instead they open onto
    a sky identical to the one above, as though cutting through the
    stone dropped you out the other side of the world.
idlemessages:
- One of the <ansi fg="cyan">slabs</ansi> shifts a hand's width to the left with no sound at all.
- Light arrives through the <ansi fg="cyan">gaps</ansi> from below, matching the light above perfectly.
- The stone underfoot tilts one degree, corrects, tilts again -- you widen
  your stance without meaning to.
