roomid: 5303
zone: Pothole Coulee
title: Observatory Hall
description: >
  The stairwell opens into a broad hall where the ruin holds its breath.
  Shelves of cracked limestone line three walls, and on them, rolled and
  stacked and pinned flat under fragments of broken lens, are star-charts
  yellowed to amber at their edges. A workbench salvaged from the rubble
  sits near the center of the room beneath a lamp of steady green flame;
  scattered across it, instruments of brass and bone catch that odd light
  and throw back glints. Someone has been at work here, patient and long.
  The hall smells of old paper, beeswax, and something faintly electric,
  like the air before a storm.
