nouns:
  chimney: A natural shaft in the rock, barely wide enough for a person
    carrying a pack. The handholds are worn and reliable -- someone has
    climbed this route many times. Looking up into it, you can see a
    disk of sky at the top, bright against the dark stone. The climb
    is steep but not technical; the danger is being caught halfway up
    by something that can still reach you from below.
  head: The end of the canyon is not a dramatic terminus -- just a
    narrowing, a rising of walls, a closure. The rock here has a
    finality to it. The whole slot funneled toward this point and the
    point goes nowhere except up.
idlemessages:
- Sound rises up the <ansi fg="cyan">chimney</ansi> and comes back down changed, pitched
  higher, stripped of its lower registers.
- The disk of sky at the top of the chimney shifts -- clouds moving fast
  above the bluff-top, invisible from down here.
- The <ansi fg="cyan">head</ansi> of the canyon is very quiet. The rockfall behind you
  absorbs the sounds that travel up from the slot below.
- Dust falls from somewhere high in the chimney and drifts slowly to
  the floor, catching the last of the light.
