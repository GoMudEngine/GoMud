roomid: 5358
zone: Pothole Coulee
title: Canyon Head
description: >
  The canyon ends here. The walls close in and rise, sheering upward into
  a chimney of stacked limestone that climbs thirty feet to the bluff-top
  above. Natural handholds mark the chimney's face -- worn smooth by use,
  spaced for someone who knows the route, impassable for someone who does
  not. The floor at the base is a tight half-circle of bare stone, the
  walls on three sides vertical and unyielding. There is nowhere else to
  go except up, or back south the way you came. The acoustic here is
  strange and total: sound rises into the chimney and is amplified rather
  than scattered, returning from above as though the bluff-top is
  listening. The whole canyon leads here. Every echo that the slot
  generates eventually arrives at this chamber and climbs the chimney
  into open sky. It is the head of the slot, and it feels like it -- a
  terminus that the rock built without planning and the raiders found
  without looking.
