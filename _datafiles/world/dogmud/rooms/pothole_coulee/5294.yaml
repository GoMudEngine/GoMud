roomid: 5294
zone: Pothole Coulee
title: Killing Ground
description: >
  The tree line pulls back here and the ground opens into a wide
  clearing — wide enough that a dozen things could come at you from
  every angle before you could reach cover. The grass has been
  flattened in broad arcs by something that runs in circles, and
  the earth is churned dark where it turns. Bones scatter the
  clearing floor in no particular order: ribs, long bones, things
  that are no longer identifiable. The smell of old blood has soaked
  into the ground. There is no safe way to stand still here; every
  direction offers line of sight and no cover.
biome: forest
