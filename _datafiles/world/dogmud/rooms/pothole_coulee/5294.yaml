nouns:
  bones: Scattered across the clearing floor — ribs, long bones,
    fragments past recognition. None of them belong to anything that
    won a fight here. The oldest are pale and dry; the newest still
    carry a faint dark stain where they meet the earth.
  clearing: Wide open ground with nothing to break a charge. The
    flattened arcs in the grass tell you what uses this space and
    how it moves — circling, cutting off retreat, running prey down
    from every angle. This is where hunts end.
idlemessages:
- Something has passed through here recently. The turned earth at the
  clearing's edge is still moist.
- The silence here is the silence of a place where things stop moving.
