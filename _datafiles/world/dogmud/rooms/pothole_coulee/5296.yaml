roomid: 5296
zone: Pothole Coulee
title: Scrub Tangle
description: >
  The brush here has grown into a near-solid wall of thorn and
  deadfall, old timber collapsed across living growth until the two
  have locked together into something you cannot push through and
  cannot see past. Sight lines collapse to a few paces in any
  direction. The tangle is threaded with narrow runs worn into the
  undergrowth at low height — passages sized for something that moves
  on four legs and knows exactly where it is going. The ground is
  soft enough here to hold a print. Something works the edge of this
  tangle, and it has been doing so for a long time.
biome: forest
