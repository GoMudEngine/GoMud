nouns:
  tangle: Thorn and deadfall grown into each other over years until
    neither is separable from the other. A barrier that stops a
    person cold but means nothing to something low and fast that
    knows its own runs through it. The runs are worn smooth by
    repeated passage — this is a working edge, not wild growth.
  deadfall: Old timber down across living thorn, the bark long since
    gone, the wood silver-gray and interlocked. It holds the tangle
    up where gravity would otherwise collapse it, and it makes the
    whole mass impenetrable to anything that can't go under it.
idlemessages:
- Something moves in the tangle just out of sight. You hear it
  before it stops.
- The narrow runs through the brush are at knee height. Whatever
  made them is watching from somewhere you cannot see.
