nouns:
  distance: The sensation is acute and disorienting -- the far looks near,
    the near recedes. You reach for a handhold and your arm falls short;
    you glance back and the way you came appears smaller than it should,
    already far away. Distance here is a suggestion the place is not
    committed to.
  ground: The ground is ordinary stone -- pale, cracked, the same floating
    scabland as before -- but it refuses to respond predictably to your
    weight. Each footfall lands and holds, but the next step does not
    follow in the direction you stepped.
idlemessages:
- Something at the far edge of your vision appears to be close enough to
  touch. It is not.
- Your shadow falls at the wrong angle, pointing toward the <ansi fg="cyan">distance</ansi>
  rather than away from the light.
- The <ansi fg="cyan">ground</ansi> beneath one foot briefly feels very far below you, then solid
  again, without moving.
