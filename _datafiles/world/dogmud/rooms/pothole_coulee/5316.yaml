roomid: 5316
zone: Pothole Coulee
title: Folded Distance
description: >
  Something is wrong with the distance here. The path ahead looks a stone's
  throw away, and the path behind looks the same, but walking forward takes
  you sideways, and walking sideways sometimes brings you closer to where
  you started. Far things appear near -- you could swear you see the details
  of the ground a hundred paces north as clearly as your own boots -- while
  near things feel remote, behind a gauze you cannot name. The ground itself
  seems reluctant to cooperate, each step landing somewhere slightly other
  than where you intended. You get the impression the Folding has crumpled
  this particular stretch of space like a map stuffed back into a pocket.
biome: cliffs
