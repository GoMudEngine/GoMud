roomid: 5278
zone: Pothole Coulee
title: Sunken Hollow
description: >
  The hollow sits below the level of the flats above, and daylight
  does not reach it cleanly -- what filters down turns green in the
  thick air, a murk that sits on the eyes like a film. The walls of
  the hollow are slick with seep and dark moss, and the ground is
  not quite ground but soft yielding mire that holds a boot and
  releases it with a sound like a slow exhale. The air here is
  close, foul, and still. The mire deepens further south, where
  the hollow opens toward something worse.
biome: swamp
