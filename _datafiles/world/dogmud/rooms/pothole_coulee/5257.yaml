nouns:
  sump: The flooded dead end, a knee-deep pool of black water filling
    the pocket wall to wall where the floor has dissolved away by
    years of seepage. There is no dry crossing and no telling where
    the bottom is past the near edge -- only the cold and the dark
    below the surface, and whatever lies in it.
  water: Black, still, and very cold, the sump pool carries no
    reflection worth reading. Below its surface the rock crevices
    are magnified and shifted and impossible to place. What glints
    down there is real enough -- but reaching it means going fully
    in, and staying in, in the cold and the dark with a guard
    that objects.
idlemessages:
- A single drop falls from the ceiling into the <ansi fg="itemname">sump</ansi> and the ripple crosses the whole surface before it dies.
- The <ansi fg="itemname">water</ansi> stirs faintly, as if something below it shifted, and then goes still.
