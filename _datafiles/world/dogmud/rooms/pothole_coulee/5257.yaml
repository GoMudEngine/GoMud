roomid: 5257
zone: Pothole Coulee
title: Flooded Sump
description: >
  The drift ends in a pocket where the rock pinched shut against all
  effort, leaving a dead-end chamber no bigger than a closet. The
  floor has been eaten away by long seepage into a shallow sump, and
  the black water that fills it reaches wall to wall -- there is no
  dry way around it and no bottom you can see. It is cold on the
  ankles and knees and colder still when you go in past that. Under
  the surface, where the water distorts the little light that reaches
  here, something glints in a crevice of the sump floor, dull but
  unmistakable -- the glint of worked metal catching the dark. Getting
  to it means going into the water and staying in it long enough to
  pry the thing loose, and something in this pocket does not intend
  for that to happen easily. The only way out is east.
biome: cave
