roomid: 5360
zone: Pothole Coulee
title: Overlook Rise
description: >
  The chimney delivers you onto the bluff-top with an abruptness that
  steals the breath. Wind arrives from every direction at once, a
  flat unbroken pressure that has nothing to push against up here --
  no trees, no walls, nothing between you and the sky in any
  direction. The coulee opens below in a long curved scar, every
  room of it visible from this height, every approach laid bare.
  The stone underfoot is pale and wind-scoured, stripped of anything
  loose by years of exposure. To the north the bluff continues its
  rise toward what looks like the highest ground on this whole
  stretch of country.
biome: cliffs
