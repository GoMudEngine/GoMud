nouns:
  wind: The wind up here is not a gust but a fact -- a constant
    lateral pressure that leans against you and does not stop. It
    carries grit and the smell of dry stone and something faintly
    metallic, the smell of altitude itself. It has been doing this
    for a long time.
  rise: The rise is the bluff-top's entry point, the place where the
    chimney delivers you from the coulee floor to the exposed height
    above. The stone here is pale and clean, scoured down to bare
    rock by wind that has had centuries to work.
idlemessages:
- The <ansi fg="yellow">wind</ansi> shifts a degree and presses harder against your left side,
  then settles back to its constant bearing.
- From here the whole coulee is a map. You can see every approach,
  every hollow, every place something might shelter or hide.
- A loose chip of pale stone skitters across the <ansi fg="white">rise</ansi> and drops off
  the eastern edge without a sound.
- The gusts carry faint sounds up from below -- distance blurs them
  into something indistinct, neither voice nor wind.
