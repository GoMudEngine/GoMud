nouns:
  loom: A treadle loom braced with wire where a leg split, its shuttle
    worn dark from hands that never stop moving it. Half-finished cloth
    hangs from the beam, the pattern honest and tight.
  cloth: Bolts of coarse coulee-weave lean drying in the tent's driest
    corner, rolled tight against the damp that finds its way in off the
    flats. Some bolts are dyed the color of dust, others left plain.
