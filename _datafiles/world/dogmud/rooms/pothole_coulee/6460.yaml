zone: Pothole Coulee
title: The Patch-Tent
description: >
  A canvas tent patched with more scrap than whole cloth, staked down hard
  against the coulee wind on the low ground south of Coulee Provisions. A
  treadle loom takes up half the floor, one leg lashed with wire where it
  split some winter back. Bolts of coarse cloth lean drying in the driest
  corner, and a line strung wall to wall carries mended shirts stiffening
  in the draft. A toad-shaped pincushion, worn smooth by years of thumbs,
  bristles with a dozen crooked pins.
