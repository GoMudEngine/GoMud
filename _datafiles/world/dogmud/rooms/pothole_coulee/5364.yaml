nouns:
  overlook: The overlook is the bluff's summit, the place where the
    ground runs out and the sky takes over. Standing here you are
    the highest thing on this stretch of country. The position is
    obvious and deliberate -- whoever holds this ground controls
    everything below, and they know it.
  stand: A marksman's stand in the truest sense -- open to every
    direction, no higher ground nearby to be shot from, every
    approach exposed. Taking this position means committing to it.
    Giving it up means crossing open ground under fire. It is not
    a position you abandon lightly.
idlemessages:
- The <ansi fg="cyan">overlook</ansi> gives you everything at once -- the whole coulee, the
  far walls, the country beyond. It is a great deal of world to
  hold in one view.
- The wind at this height has a low resonance, a vibration in the
  stone itself, as though the bluff is aware of the pressure.
- Nothing moves on any of the approaches. From the <ansi fg="white">stand</ansi> you would
  see it long before it reached you.
- The cold here is sharper than below, a dry clean cold that has
  nothing to do with shade. It is simply the cold of altitude.
