roomid: 5364
zone: Pothole Coulee
title: The Overlook
description: >
  The highest point of the bluff, and it announces itself. The stone
  here has a quality of finality -- the bluff does not rise further,
  the ground does not press higher, this is where it stops. From
  this overlook the sightlines run in every direction without
  obstruction:
  north to the far lip, south along the whole length of the bluff
  face, east and west to the coulee walls and the country beyond.
  It is a commanding stand, the kind of position an experienced
  marksman takes and does not give up easily. The wind at this
  height is a different thing entirely -- steadier, colder, with a
  resonance to it that the gusts below don't carry.
