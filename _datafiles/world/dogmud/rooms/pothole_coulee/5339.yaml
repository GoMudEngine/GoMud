nouns:
  path: Moss-covered and worn smooth at its center, the path shows long
    use. The stones beneath the moss are fitted, not random -- someone
    laid this way deliberately, and the earth has been slow to reclaim it.
  lintel: The carved face of the lintel presses into the turf, its
    inscription hidden from view. The edges of the break are old, weathered
    round. Whatever felled the gate did so long before living memory.
idlemessages:
- A grass-stem bends in the wind across the broken <ansi fg="cyan">lintel</ansi>,
  catches, and holds there.
- The <ansi fg="cyan">path</ansi> draws the eye upward toward the open gap where a
  roof should be.
- Wind moves through the fallen gateposts with a low, toneless hum.
