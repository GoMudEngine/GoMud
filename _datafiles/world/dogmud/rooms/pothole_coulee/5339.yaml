zone: Pothole Coulee
title: Shrine Approach
description: >
  A moss-grown path climbs the low rise from the standing stones below,
  narrowing as the ground steepens. At the top of the rise two gateposts
  have fallen -- one toppled entirely, one listing at a precarious angle
  -- and the lintel that once joined them lies across the path in two
  pieces, its carved face pressed into the earth. Whoever set these stones
  here did so with care; whoever knocked them down left without tidying.
  Beyond the broken gate the path continues toward a weathered structure
  whose roof shows open sky through its gaps. The place smells of old
  stone and wet grass and something faintly mineral, the way deep wells
  smell in dry seasons.
