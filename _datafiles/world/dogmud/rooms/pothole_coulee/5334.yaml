roomid: 5334
zone: Pothole Coulee
title: Fallen Menhir
description: >
  A great toppled menhir lies here face-up, its length running
  west to east, longer than three people end to end. It fell long ago --
  the turf has grown up around its sides and moss covers its base where
  it meets the earth -- but the fall did something the standing centuries
  could not: it exposed the carved face to direct light. The carvings cut
  into the stone -- spirals and figures both -- are legible here in a way
  the upright stones are not, sheltered from the worst of the weather by the
  ground. Folk histories in stone: hunting scenes, floods, the sun in
  different positions, figures gathered around a central shape that might
  be this circle itself. Anyone who takes the time to study them finds
  the coulee's deep past laid out in careful, patient sequence.
biome: land
