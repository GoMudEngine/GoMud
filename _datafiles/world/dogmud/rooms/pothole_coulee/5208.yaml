nouns:
  strongboxes: The strongboxes are squat chests of dark wood bound in
    riveted iron, stacked along the walls in patient rows from floor to
    waist. Each wears a heavy lock and a small tag, and not one of them
    rattles when you pass -- whatever they hold is packed careful and
    still. Between them they likely hold the larger part of the town's
    saved wealth, trusted to stone and iron and a keeper's word.
  ledger: The ledger is a thick book bound in worn hide, lying squared on
    its desk beneath the window. Closed though it is, you can tell it
    holds every coin in and coin out of this house set down in a careful
    hand, page after page of accounts that balance. An inkpot, a trimmed
    quill, and a stick of sealing-wax wait beside it for the next entry.
  door: The door is a single slab of coulee oak faced with iron straps,
    hung on hinges thick as your wrist and swinging shut on its own slow
    weight. It seals with a deep, final sound that you feel in the floor
    as much as hear. Shut behind you, it makes the room over into
    somewhere apart from the town, hushed and held.
