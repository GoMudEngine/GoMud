zone: Pothole Coulee
title: Strongbox House
description: >
  This squat blockhouse is built of fitted basalt thicker than anywhere
  else in town, and the air inside it goes cool and still the moment the
  heavy door swings shut behind you. Iron-banded strongboxes line the
  walls in stacked rows, each one studded and locked, holding the saved
  coin and kept treasures of folk who would rather not carry such things
  through a frontier. A ledger desk stands under the room's one shuttered
  window, its great book closed and squared, an inkpot capped beside it.
  Nothing here is loud or bright; the place is quiet the way a vault is
  quiet, faintly forbidding in a manner that turns, once you understand
  it, into something close to comfort. Whatever you set down here will be
  here when you come back.
