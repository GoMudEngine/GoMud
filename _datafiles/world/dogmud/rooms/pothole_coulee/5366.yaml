roomid: 5366
zone: Pothole Coulee
title: Sniper's Roost
description: >
  A tucked stone roost beside the overlook, angled east and slightly
  below the crest -- invisible from the main bluff line until you
  are already standing in it. The single shooting-line from here
  is exceptional: it runs east and down at a precise angle that
  covers a long stretch of the coulee floor that no other position
  on the bluff can reach. A raider who knew this spot would not
  share it. The footing is solid and narrow, the rock curved at
  the back to deflect wind away from the shooter's position. This
  is not a place you find by accident. This is a place you protect.
biome: cliffs
