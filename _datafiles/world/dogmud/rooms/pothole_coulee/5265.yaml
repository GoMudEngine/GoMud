nouns:
  pool: The spring-fed pool is perhaps a dozen paces across, its water
    clear enough to show every grain of pale silt on the bottom. It is
    cold enough to ache -- the kind of cold that only comes from deep
    underground.
  bench: A flat slab of stone set level at the water's edge and dressed
    smooth on its upper face. Worn edges and old stains in the stone
    suggest it has been in use for a very long time. A mortar and pestle
    sit at one end; glass bottles line the other.
  reeds: Dense reeds press in around three sides of the pool, their
    stalks thick and dark at the waterline, seed-heads brushing together
    overhead in a faint dry whisper. They make the hollow feel enclosed
    and private, cut off from the wider marsh.
idlemessages:
- The <ansi fg="itemname">pool</ansi> surface catches a slant of light and throws it across the reeds in a pale trembling web.
- Glass <ansi fg="itemname">bottles</ansi> on the bench chime softly against one another as the air stirs.
