zone: Pothole Coulee
title: The Sheltered Pool
description: >
  A cold, clear pool fills the heart of the hollow, spring-fed from
  somewhere below the pale silt bottom, its surface barely moving. Reeds
  ring it close on three sides, pressing in tall and dark and still, and
  the air here is cooler than anywhere above -- damp and clean, carrying
  a faint sweetness from the herbs that dry on the racks to the west.
  At the water's edge a flat slab of stone has been dressed level and
  set up as a bench: a mortar and pestle sit at one end, rows of glass
  bottles at the other, and between them, bundles of dried root and
  leaf and bark wait in careful order. This is a place for patient work.
