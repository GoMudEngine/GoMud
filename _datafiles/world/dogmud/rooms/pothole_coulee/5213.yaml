roomid: 5213
zone: Pothole Coulee
title: Chrysalis School Hall
description: >
  One long room under a sound plank roof makes up the whole of the school,
  and the whole of it is given to learning. Slate boards in chalk-dusted
  frames line the far wall, the slates half-wiped, ghosted with the
  morning's letters and sums. Desks crowd the floor in mismatched rows -- no two the
  same height, scavenged and mended and handed down -- their lids scarred
  by generations of restless penknives. By the door stands the
  notice-board, shingled deep with pinned cards and curling hand-bills,
  the busiest wall in the room. The air is warm and close and smells of
  chalk and lamp oil and the river-damp of children, an ordinary,
  patient, kindly sort of place for all its strange name.
