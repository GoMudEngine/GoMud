roomid: 6461
zone: Pothole Coulee
title: The Warder's Dugout
description: >
  Packed-clay steps drop down from Coulee Provisions into a room cut
  straight into the hardpan, braced overhead with squared timber against
  the weight of the coulee soil. A ring of scratched wards circles the
  floor, chalk and ash worked so deep into the packed earth no broom
  lifts it clean. Shelves cut into the dirt walls hold jars of glowing
  shard-dust and coils of binding wire, all of it catching a faint,
  sourceless light that owes nothing to any lamp in the room.
biome: house
station: enchanting_circle
