nouns:
  wards: A ring of scratched sigils worked into the dirt floor, chalk
    and old ash gone down past sweeping. They hold a faint warmth even
    when nothing else in the dugout is lit.
  shelves: Shelves cut straight into the clay wall, each one lined with
    jars of shard-dust that glow faint and steady, and coils of thin
    wire waiting to be bound into something with a purpose.
