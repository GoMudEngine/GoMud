roomid: 5239
zone: Pothole Coulee
title: Collapsed Barracks
description: >
  A barracks room opens off the gate, low and close and half-roofed, where the
  crew that holds the tower beds down. It is a lived-in ruin -- the smell of
  it hits first, woodsmoke and grease and unwashed sleep gone stale in
  stone that never airs. Bedrolls lie scattered across the floor in their
  own scuffed nests, a few flung straight as if their owners rose in a
  hurry, the rest crumpled where they were left. Against the back wall a
  battered strongbox squats, iron-cornered and scarred with pry-marks, the
  crew's shared hoard of whatever they have taken off the wash. This is the
  soft middle of the held line -- the gate keeps the door, and what sleeps
  here trusts it to. The only way back out is west, through the gate.
biome: fort
