nouns:
  nest: The nest is a natural hollow improved by use. The floor is
    worn smooth by boots and waiting. The opening angle was chosen
    deliberately -- whoever settled here could observe the perch and
    the eastern approaches without being visible from below or from
    the main line of travel across the bluff.
  rock: The split rock that forms the nest's walls is old work --
    frost and time, not tools. But the person who found it recognized
    what it offered. The stone is dark on one face where a small fire
    burned, once or many times, cupped from the wind by the hollow.
idlemessages:
- The <ansi fg="white">nest</ansi> holds a pocket of calm. Outside the opening the wind
  runs hard across the bluff; in here it barely whispers.
- The <ansi fg="yellow">rock</ansi> at the nest's back is faintly warm, sun-soaked stone
  that holds heat longer than the exposed face outside.
- Through the narrow opening the eastern face of the coulee is a
  long pale drop, every ledge and crack visible from this height.
- The worn floor and the fire-stain on the back wall are a record
  of someone's patient hours. They waited here a long time.
