roomid: 5363
zone: Pothole Coulee
title: Windward Nest
description: >
  The rock on the bluff's eastern face has split and heaved into a
  rough hollow -- not deep enough to be a cave, but sheltered enough
  to be worth something. The windward side catches and deflects the
  prevailing gusts, leaving the interior almost calm while the rest
  of the bluff roars. It is a sniper's roost, tucked out of the
  direct sightlines from below, with a narrow opening that looks
  back across the perch and down the eastern face of the coulee.
  The floor of the nest is worn smooth. Whoever used this spot used
  it often, and alone, and did not want to be found here.
biome: cliffs
