zone: Pothole Coulee
title: The Firing Range
description: >
  The first terrace is broad and flat, the stone worn smooth by long use.
  Down-range, a row of straw butts stands on timber frames, each one
  bristling with spent shafts that were never pulled. Distance-marks are
  scored into the terrace stone in a line from your feet toward the
  targets -- one mark, two marks, three, each interval denoting a
  meaningful step in the discipline of the bow. A rack of practice
  arrows leans against the bluff wall, their fletching ragged but their
  points still true. The lake and the town are fully visible below, laid
  out small and distinct. This is where newcomers are brought to learn
  the bow -- the range is safe, the marks are clear, and the wind here
  at the terrace lip is honest about what it intends.
