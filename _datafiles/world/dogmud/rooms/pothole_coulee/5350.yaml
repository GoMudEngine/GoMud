nouns:
  butts: The straw butts are packed tight and mounted on timber frames
    driven into gaps in the terrace stone. Each one is dense with
    practice shafts that were left in rather than pulled -- the outer
    ring of each target is the most heavily used, the center cleaner
    than it ought to be.
  range: The range is oriented to shoot east toward the terrace's far
    end, the distance-marks scored into the stone at measured
    intervals. Someone has painted the marks with red ochre so they
    read clearly even in flat light.
idlemessages:
- A spent shaft in one of the straw <ansi fg="cyan">butts</ansi> shifts in the wind and
  then is still.
- The distance-marks on the <ansi fg="cyan">range</ansi> floor catch the afternoon light
  at an angle that makes them easy to read.
- The lake below is still and bright, the town's rooftops catching
  the sun.
- Wind arrives across the terrace in a steady, readable line from
  the west -- useful to know.
