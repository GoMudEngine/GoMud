roomid: 5338
zone: Pothole Coulee
title: Stones' End
description: >
  At the northern edge of the ring the megaliths thin out -- three
  remaining stones, then two, then a gap where a fourth must have
  stood before it fell or was taken, and beyond that open rising ground.
  The turf here is rougher than the green to the south, less tended,
  and the sense of the circle's enclosure fades into something more
  exposed. At the top of the rise the ground levels briefly before
  dropping away, and there, half-collapsed into a confusion of fallen
  blocks, stands a ruin older than the stone ring itself. It is
  a shrine of some kind -- or was. Roofless, its lintel fallen across
  two remaining uprights, its interior open to the sky and filled with
  years of blown debris. The stone it is built from is different from
  the ring stones: darker, finer-grained, worked smooth in a way the
  megalith carvers did not work. Whoever built it is not remembered
  even in the tradition-keeper's deepest knowledge.
