nouns:
  stair: The stair is cut directly into the bluff face, each step worn
    to a gentle hollow by the passage of many feet. Chalked distance
    marks run alongside it, painted by whoever last maintained the
    range above.
  bluff: The bluff face is pale limestone, streaked with iron-brown
    where water has run down it over the years. Up close it smells
    faintly of dust and dry stone, warm from the afternoon sun.
idlemessages:
- The <ansi fg="cyan">stair</ansi> above disappears into a switchback, the top hidden from
  here.
- Wind carries the faint snap of a bowstring from somewhere above,
  then silence.
- The lake catches the light and throws it back in a long white line
  across the water.
- A chalked distance-mark on the <ansi fg="cyan">bluff</ansi> face has been partially
  worn away and carefully redrawn over the old ghost.
