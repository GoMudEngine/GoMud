roomid: 5347
zone: Pothole Coulee
title: Bluff Foot
description: >
  The bluff rises sharply here, its pale face cut by a stone stair that
  climbs in long switchbacks toward the shooting terraces above. You are
  one level up from the coulee floor -- the hub's broad steps are just
  below -- and already the perspective opens: the lake glitters in the
  middle distance, the town beyond it small and orderly, the whole of
  the coulee spread beneath a wide sky. The stair ahead is worn smooth
  by generations of feet. Chalked marks on the bluff face note distances
  measured from the terrace above -- numbers that mean nothing yet but
  will.
biome: cliffs
