nouns:
  cistern: A squat drum of old mortared stone sunk into the canyon floor, a
    catch-basin built to hold floodwater through the dry. Its bulk makes a
    wall as good as the canyon's own -- which is why the folk who hold this
    wash like to fight with their backs to it.
  water: A shallow pool of brackish water standing dark in the cistern's
    breach, skinned with green scum and ringed by a crust of salt. It is
    foul to look at and worse to drink, but it has not gone dry, and in
    this country that is reason enough to fight over.
  crack: A long split running the curve of the cistern wall, wide enough at
    its mouth to step through. The break that ruined the basin also opened
    the sheltered angle the squatters fort up in -- a flaw turned to use.
  angle: The defensible corner where the cistern's curve meets the canyon
    wall. A fighter wedged in here shows only their front and cannot be
    flanked -- the whole point of the spot, plain as a drillmaster's lesson.
  salt: The pale crust ringing the brackish pool, left where old water
    crept up the stone and dried. It crunches underfoot and tells how
    long this water has sat -- long enough that holding it became a habit.
