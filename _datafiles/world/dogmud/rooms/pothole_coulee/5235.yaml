roomid: 5235
zone: Pothole Coulee
title: Cracked Cistern
description: >
  An old flood-cistern squats half-buried in the canyon floor, a great
  drum of mortared stone built by some forgotten hand to hoard the wet
  season's water. The years have split it. A long crack runs the curve of
  its wall, and through the breach a shallow pool of brackish water sits
  dark and unmoving, skinned with scum, ringed by a crust of pale salt.
  The bandits favor this corner -- and it is easy to see why. The cistern
  drum walls one flank, the canyon wall the other, and a body forted in
  the angle between them can only be come at from straight ahead. It is a
  hard place to attack and an easy one to hold, a lesson written in stone.
  The hollow lies back west; the wash climbs away to the northeast.
biome: cliffs
