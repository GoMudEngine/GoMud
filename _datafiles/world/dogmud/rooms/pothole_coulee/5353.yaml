zone: Pothole Coulee
title: Canyon Mouth
description: >
  The open terraces fall away and the world narrows. Stone walls close in
  from both sides, squeezing the path down to a slot barely wide enough
  for two abreast, and the wind that moved freely above now funnels into
  a low moan that runs ahead of you into the dark. The canyon takes your
  footsteps and doubles them, returning each one a half-beat later from
  the far walls. A range-warden posts here at the mouth, watching the
  slot with the particular stillness of someone who knows that anything
  moving in the canyon ahead will be audible long before it is visible.
  The passage north opens into the first chamber -- a straight run of
  pale stone where the echo doubles every sound that enters it.
