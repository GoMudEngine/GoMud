nouns:
  walls: The canyon walls are pale limestone scoured smooth by old water
    and older wind. Up close the stone shows horizontal strata in bands
    of cream and grey, each layer compressed thinner than the last as
    you look upward. Sound leaves marks on nothing, but these walls carry
    it -- every word bounces back at you trimmed of its softer edges.
  echo: Not a single echo but a cascade of them, each repetition arriving
    from a slightly different angle as the sound finds new surfaces to
    return from. Voices gain a hollow authority in here. Footsteps become
    a crowd.
idlemessages:
- The <ansi fg="cyan">walls</ansi> send back the sound of your breathing, half a beat delayed.
- The range-warden tilts her head, listening to something deeper in the
  slot. After a moment she is still again.
- A faint <ansi fg="cyan">echo</ansi> moves through from north to south -- something disturbed
  the air up the canyon.
- The moan in the slot rises a note, then drops back to its low drone.
