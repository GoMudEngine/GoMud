zone: Pothole Coulee
title: Cleric's Study
description: >
  This small back room belongs to the cleric, and the cleric belongs to
  his books. They are everywhere -- shelved, stacked, splayed open
  face-down to hold a place, leaning in drifts against the legs of the
  desk. A kettle sits on a trivet over a low brazier in the corner, gone
  cold and forgotten more often than not while its owner reads. Across one
  whole wall, pinned in careful rows, hang charcoal rubbings lifted off
  some carved stone, all rings and curving arcs in soft smudged black. The
  light comes thin and dusty through a single shutter, the room is close
  with the smell of paper and old ink, and the quiet has the held,
  thinking weight of a place where someone has sat a long while chasing a
  thought he cannot put down.
