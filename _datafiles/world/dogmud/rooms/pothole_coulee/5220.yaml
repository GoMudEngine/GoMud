zone: Pothole Coulee
title: Dry Coulee Mouth
description: >
  The coulee floor runs out dry to the east, a wide gravel wash climbing
  away between bare stone shoulders. Far up the canyon a steady knocking
  carries down on the wind -- someone striking a post, over and over, with
  a fighter's slow patience. A crew has been digging at the fallen rock
  that chokes the mouth, and the way through is nearly clear.
