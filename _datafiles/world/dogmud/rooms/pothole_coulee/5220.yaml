nouns:
  wash: The dry wash climbs east between bare shoulders of stone, its
    gravel bed swept clean by floods that come only in the wet season.
    Half-cleared rockfall still narrows the throat of it, but a path has
    been picked through, and the canyon opens wide and inviting beyond.
  post: You cannot see the post from here, only hear it -- a far,
    rhythmic knocking, wood on wood, somewhere up the wash. Someone is
    drilling at it the way fighters do, hour on patient hour, and the
    sound carries clean down the canyon to the mouth.
