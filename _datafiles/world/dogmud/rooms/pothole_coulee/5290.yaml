roomid: 5290
zone: Pothole Coulee
title: Hunter's Hollow
description: >
  A natural hollow cups out of the bank here, sheltered from the
  prevailing wind on three sides. Someone has worked this camp for
  seasons: a banked fire pit ringed with flat stones, a drying-frame
  of lashed poles strung with rawhide cord, a flat butchering-stone
  worn smooth with use and stained dark. The hollow holds the smell
  of old smoke and rendered fat. It is quiet, and nothing has
  disturbed the camp since the last fire went cold.
