nouns:
  hollow: A natural cup of sheltered ground, cut off from the wind
    by the bank rising on three sides.
  camp: Fire-pit, drying-frame, butchering-stone — the bare essentials
    of a hunter working alone, far from town.
  fire pit: A ring of flat stones enclosing a deep bed of ash and
    cold char, banked by a careful hand.
idlemessages:
- The ash in the fire pit is cold, but the smoke-smell clings to
  the hollow like a second skin.
- Wind moves over the rim of the hollow without entering it, a
  steady mutter just overhead.
