zone: Pothole Coulee
title: Reed Jetty
description: >
  A short fishing jetty pushes out through the reeds, its weathered planks
  ending in open water where the green stalks thin and give way. A coracle
  of hide and bent willow rides tied to the last post, bobbing whenever
  the water remembers to move. Dragonflies stitch the air above the reeds,
  blue and copper, in no particular hurry to be anywhere. Nothing happens
  here fast; the jetty is a place for waiting on a line and letting the
  afternoon go by. The reeds whisper around you, hiding the path back
  south.
