roomid: 6463
zone: Pothole Coulee
title: The Cook-Fire
description: >
  A stone-ringed fire pit sits just east of Strongbox House, its smoke
  drawn off through a chimney hood built from scavenged tin. Skewers
  and a blackened kettle hang from an iron bar over the coals, and a
  plank counter nearby holds cutting boards scored deep from years of
  the knife. The smell of woodsmoke and rendered fat clings to
  everything this close to the strongbox wall, coin-guards and
  cook-fire sharing one patch of hard ground.
biome: house
station: cooking_fire
