nouns:
  fire pit: A ring of fitted stone banked with coals, a scavenged tin
    hood overhead drawing most of the smoke clear. The heat off it is
    steady even in a hard wind.
  kettle: A blackened kettle hung from an iron bar over the coals, its
    lid rattling faint whenever whatever is inside comes near a boil.
