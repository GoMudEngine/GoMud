zone: Pothole Coulee
title: Tower Approach
description: >
  The wash narrows again and tilts up, the gravel giving way to a steeper
  pitch of bare rock and rubble that climbs toward the head of the canyon.
  The walls crowd in to a throat, and beyond them, close now and looming,
  the bluff lifts the ruined watchtower into the light. This is the
  Pothole Watch, the broken tooth seen from the safe overlook far below --
  near enough at last to read the slumped flank, the crown burst open to
  the sky, the empty sockets where windows watched the wash. Whatever
  holds the high ground holds it from up there, and it has surely already
  marked you climbing. The pitch eases back west toward the open wash; the
  rubble climbs east toward the foot of the tower.
