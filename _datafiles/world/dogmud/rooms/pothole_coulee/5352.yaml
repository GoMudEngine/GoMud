roomid: 5352
zone: Pothole Coulee
title: High Terrace
description: >
  The terrace reaches its eastern end here, where the bluff top gives
  way to a canyon lip that drops sharply to the north. The range ends:
  there are no more targets beyond this point, no more distance-marks
  in the stone. The lip of the canyon is close, and the drop beyond it
  is significant -- the canyon cuts north from here into rougher country,
  and the bottom is not visible from where you stand. The sanctuary of
  the terraces ends at this edge. The wind is strongest here, coming up
  from the canyon below and mixing with the northern flow in a way that
  makes it harder to read than the wind further back along the shelf.
  The lake and the town are still visible to the southwest, very small
  now, the whole settled world of the coulee reduced to a view.
biome: cliffs
coord:
