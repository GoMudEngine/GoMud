nouns:
  lip: The canyon lip is a clean break in the bluff top -- stone one
    step, open air the next. The edge is not crumbling; it is simply
    where the rock stops. Looking down into the canyon from here
    shows only shadow and the pale canyon walls dropping away.
  canyon: The canyon runs north from this lip, cutting through the
    bluff in a slot that is narrower at the top than it appears
    from a distance. Wind rises out of it in irregular pulses,
    warm and carrying the smell of dry stone from deep below.
idlemessages:
- Wind rises from the <ansi fg="cyan">canyon</ansi> below in a warm pulse and crosses
  the terrace, carrying dust.
- The <ansi fg="cyan">lip</ansi> is very close. The bottom of the canyon is not visible
  from here.
- Southwest, the coulee lake is a thumb-nail of brightness set
  in the long green of the valley floor.
- The terrace range ends here. Whatever lies beyond the lip is
  outside its reach.
