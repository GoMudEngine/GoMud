roomid: 5201
zone: Pothole Coulee
title: West Shore Path
description: >
  A packed-gravel path runs along the west shore, crunching underfoot
  where countless feet have pressed it flat. To the south, stilt-houses
  perch on their long stilts over the shallows, washing strung between them
  and cookfire-smoke curling up. The reeds thicken to the north, green and
  rustling, hiding the jetty where the fishers tie up. This is the
  lived-in side of the bowl -- all cookpot-smell and the low murmur of
  folk who call the coulee home. The pool lies east, dark and patient
  behind you.
