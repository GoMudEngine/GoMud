nouns:
  path: The path is plain packed gravel, raked flat by years of coming
    and going between the houses and the water. It runs north and south
    along the shore, never far from the pool's edge. Small stones turn
    underfoot with a dry crunch that follows you the whole length of it.
  reeds: Tall green reeds crowd the shallows to the north, dense enough to
    swallow a wading body to the waist. They rustle and bow when the wind
    comes off the steppe above. Somewhere in among them a moorhen clucks
    and goes quiet again.
  stilts: South along the shore, the stilt-houses perch on long timber
    legs sunk into the mud of the shallows, lifting their floors clear of
    the water. Ropes and washing-lines sag between them, and a faint blue
    cookfire-smoke threads up from the gaps. The stilts have stood long
    enough that the tide-line on them has gone green with weed.
idlemessages:
- Cookfire-smoke drifts north along the shore, carrying the smell of a <ansi fg="itemname">pot</ansi> on the boil.
- A reed bows, springs back, and the moorhens go quiet all at once.
