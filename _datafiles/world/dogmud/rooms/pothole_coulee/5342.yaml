roomid: 5342
zone: Pothole Coulee
title: Collapsed Nave
description: >
  A side-hall of the shrine has given up most of its ceiling to time.
  The rubble of what fell lies where it landed, cushioned now by
  decades of drifted earth that has softened the edges of the stone
  into low mounds. Dust hangs in the air here even without wind to
  stir it -- the hall produces its own slow circulation, drawing
  from the open nave to the east and releasing it in a faint
  exhalation through gaps in the north wall. Niches cut into the
  walls stand empty, their edges worn where offerings were set and
  later removed or simply fell to the drift. The niches go deep.
  Some of them, if you pressed your hand to the back, might reveal
  a gap, a seam, a hollow that the rubble and dust have not
  entirely filled. The kind of place where things wait.
biome: fort
