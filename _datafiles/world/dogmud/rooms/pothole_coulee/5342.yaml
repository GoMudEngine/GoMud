nouns:
  rubble: The rubble is mixed -- ceiling stone, fallen mortar, the
    occasional timber rotted to a soft dark mass. It has settled into
    the hall over a very long time and the drift of earth between the
    pieces makes the floor uneven and yielding in places.
  niches: Cut into the wall at regular intervals, the niches are
    roughly palm-width and deep enough to have held something
    significant. Their floors are dusted with grit and old ash.
    The deepest ones are shadowed enough that the back wall
    is not clearly visible from a standing position.
idlemessages:
- Dust shifts in the air above the <ansi fg="cyan">rubble</ansi>, moving against no
  visible current.
- One of the <ansi fg="cyan">niches</ansi> exhales a faint, cool breath, as though
  connected to something deeper than the wall's thickness suggests.
- A piece of the ceiling mortar drops from a surviving section
  and disappears into a gap between two stones.
- The dust settles. Then, slowly, it rises again.
