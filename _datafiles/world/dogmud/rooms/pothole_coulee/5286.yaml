nouns:
  bone: A long bone, cracked along the shaft where something has levered
    it open with its teeth. The marrow has been taken cleanly. No scraps
    of hide or fur remain — whatever fed here was thorough. The bone is
    dry but not weathered. This was not old work.
  fringe: The ragged edge where the open steppe ends and the rough
    country begins. The grass pulls back, the sage grows lower and
    sparser, and the rocks start to show through. The transition is not
    a line so much as a slow loosening of the safe ground underfoot.
idlemessages:
- The <ansi fg="itemname">fringe</ansi> is quiet, but the quiet has a different quality than the open steppe behind you.
- Wind moves through the low scrub to the south, setting it rustling in a way the <ansi fg="itemname">bone</ansi> at your feet cannot account for.
