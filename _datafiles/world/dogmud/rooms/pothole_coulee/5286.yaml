roomid: 5286
zone: Pothole Coulee
title: Steppe Fringe
description: >
  The easy ground runs out here where the steppe begins to roughen and
  fold. The grass thins, the soil goes rocky underfoot, and the sign
  changes character. A gnawed bone lies at the fringe of the last sage
  clump, the ends cracked open for marrow and left where the feeding
  stopped. Larger prints press into a patch of bare earth nearby,
  broader than a hare, deeper than a fox. South, the ground breaks into
  cut country where the scrub grows dense and low and predators have the
  advantage. This is the last sheltered ground for a good while.
