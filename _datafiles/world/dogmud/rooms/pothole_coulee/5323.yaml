roomid: 5323
zone: Pothole Coulee
title: Farmstead Gate
description: >
  A broad timber gate is set into the drystone wall where the cartway
  meets the homestead boundary. The gate is well-made but much used --
  the latch worn smooth from ten thousand lifts of the same hand, the
  lower rail dark with the polish of animals brushing past. Beyond it,
  the packed earth of the yard opens wide, and the smell of the place
  comes through without impediment -- hay and woodsmoke and turned soil,
  the warm compound smell of a place where people have been working for
  a long time. The wall stretches to either side, low enough to see over
  but substantial enough to mean something. Crossing this threshold feels
  like being let in rather than simply walking through.
biome: farmland
