nouns:
  gate: The gate hangs true on its hinges and swings without resistance.
    Someone keeps it in good repair -- the timber is oiled, the iron
    fittings free of rust. It stands open during the day.
  wall: The drystone wall is old work, fitted without mortar, each stone
    chosen to lock against its neighbors. It has settled into itself
    over many years and does not shift or lean.
idlemessages:
- The <ansi fg="yellow">gate</ansi> stands open to the yard beyond, the latch resting
  easy in its keep.
- Wind comes over the <ansi fg="yellow">wall</ansi> carrying the smell of hay and
  something baking at a distance.
- From beyond the gate comes the sound of someone moving steadily
  through familiar work.
