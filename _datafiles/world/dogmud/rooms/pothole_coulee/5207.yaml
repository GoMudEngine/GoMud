nouns:
  shelves: The shelves run from the worn floorboards clear up to the
    rafters, every plank sagging a little under its load. Sacks and tins
    and crocks are stacked three deep, the high ones reached by a long
    hooked pole leaned in the corner for the purpose. There is an order to
    it that belongs to one mind only -- the keeper's -- and no map of it
    posted for anyone else.
  counter: The counter is a single slab of driftwood planed flat and set
    on barrels, its top burnished pale by a long history of coins, elbows,
    and parcels sliding across the grain. A set of brass scales and a
    much-thumbed tally-book sit at one end, ready for the next sale.
    Lean on it and you can feel how many bargains have been struck right
    here.
  goods: The goods are the plain wealth of a frontier town -- grain and
    salt, rope and twine, lamp oil and candle-tallow, fish-hooks, nails,
    needles, and a hundred small salvaged oddments besides. Some bear the
    mud and barnacle of having come up out of the pools; others arrived on
    the backs of traders down the coulee. Whatever a newcomer has
    forgotten to bring, the chances are good it waits somewhere on these
    shelves.
idlemessages:
- A bundle shifts on a high shelf and settles, and a fine drift of dust comes down through the lamplight.
