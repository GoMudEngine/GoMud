roomid: 5207
zone: Pothole Coulee
title: Coulee Provisions
description: >
  The store is one cramped room packed floor to rafter with everything a
  frontier body might need and a good deal it might only want. Shelves
  climb the walls all the way to the ceiling, crammed with sacked grain,
  coiled rope, tin lamps, jars of who-knows-what, and bundles hung
  overhead just out of reach. The air is thick with the mingled smell of
  hemp rope and rendered tallow and dry goods, a smell that means trade.
  A long counter worn pale and smooth fronts the back wall, its surface
  scuffed by years of coins and elbows and parcels slid across it. Whoever
  keeps this place clearly knows where every last thing sits in the
  glorious clutter, even if a stranger never could.
