roomid: 5292
zone: Pothole Coulee
title: Predator Sign
description: >
  The sign turns heavy and unmistakably fresh. Overlapping prints
  of broad paws cut the soft ground in every direction, some
  pressed so deep the toes show clearly. Scat lies in deliberate
  mounds. A carcass has been dragged and left half-eaten, the
  ribcage sprung and emptied, the hide peeled back and already
  going stiff. Many animals moved through here recently, and
  the sign says they will be back. The air is sharp and rank
  with their marking.
