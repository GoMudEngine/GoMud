nouns:
  prints: Broad paw-prints pressed deep into the soft ground, clear
    enough to count the toes — and there are many of them, overlapping.
  carcass: A half-eaten body dragged here and left; the ribcage
    sprung and emptied, the hide peeled to the limits of patience.
idlemessages:
- A long, low sound carries from somewhere close — not a howl,
  not yet, but the breath before one.
- The prints in the soft ground are wet-edged still, pressed
  within the last hour.
