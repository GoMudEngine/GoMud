nouns:
  switchback: The switchback is the tightest point on the climb -- the
    outer edge crumbles away to a short drop, and the inner wall is
    close enough to brush with your shoulder. Someone has driven an iron
    pin into the stone here as a handhold.
  scree: Loose chips of limestone have piled at the outer angle of the
    turn where the step edges have shed material over the years. The
    scree shifts underfoot and needs to be crossed with care.
idlemessages:
- Loose <ansi fg="cyan">scree</ansi> at the outer edge of the <ansi fg="cyan">switchback</ansi> shifts and
  ticks down the bluff face.
- The wind at this height finds every gap in your clothing and reminds
  you it is here.
- The coulee floor is visible in its entirety now -- a long oval of
  grass and water laid out below.
- A pebble loosens somewhere above and falls past you, rattling off
  the bluff face and gone.
