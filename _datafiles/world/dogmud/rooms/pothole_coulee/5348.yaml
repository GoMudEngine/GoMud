roomid: 5348
zone: Pothole Coulee
title: Bluffside Climb
description: >
  The stair bends here in a tight switchback, reversing direction up the
  bluff face. Loose scree has collected in the outer angle of the turn
  where the stone crumbles away from the steps, and you step carefully
  around it. The wind is picking up -- it funnels along the bluff face
  and finds you at every exposed stretch of the climb. Below, the full
  arc of the coulee has come into view: the lake, the town, the roads
  threading off through the grassland. The terraces are still above you,
  but the stair is straightening again and the top does not look far.
biome: cliffs
