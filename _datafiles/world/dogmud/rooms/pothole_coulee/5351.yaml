nouns:
  shelf: The shelf is the bluff's natural upper ledge, widened and
    leveled by hand at the inner edge but left raw at the outer --
    the stone simply ends in a clean drop to the coulee below. The
    floor is pale limestone, fine-grained and firm underfoot.
  wind: The wind on this terrace is the primary lesson. It does not
    blow steadily; it shifts by a few degrees between one breath
    and the next, and the targets at distance move just enough to
    make the shift matter. Watching the grass at the terrace edge
    is the oldest trick for reading it.
idlemessages:
- The <ansi fg="cyan">wind</ansi> crosses the <ansi fg="cyan">shelf</ansi> from the north and curls at the
  bluff wall, a pattern that repeats every few breaths.
- Grass at the outer terrace edge bends and releases, bends and
  releases, marking the wind's rhythm.
- The distant targets are small enough that the eye has to work
  to find the painted circles in the grain of the boards.
- Below, the lake's surface shows the wind in long, faint lines
  moving south across the water.
