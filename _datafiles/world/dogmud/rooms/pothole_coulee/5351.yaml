roomid: 5351
zone: Pothole Coulee
title: The Long Terrace
description: >
  The terrace extends further east along the bluff top, narrowing
  somewhat as the shelf thins. The targets at the far end of this stretch
  are smaller than the ones at the firing range -- painted circles on
  timber boards, set out at distances that require real commitment from
  the bow. This is where distance practice happens, and the wind is the
  reason. It comes off the open country to the north and crosses the
  terrace at varying angles and strengths -- a shooter who learns this
  shelf learns to read wind as a fact of the shot rather than an excuse
  for missing. Below the terrace edge, the coulee drops away to the
  lake and the town, both looking smaller than they did from the stair.
