nouns:
  steps: Each step is scored across its face with a shallow transverse
    groove cut deliberately for footing. The mortar patching the
    crumbled outer corners is newer than the stone -- someone tends
    these regularly.
  pitch: The pitch is steep enough that the step above is at chest
    height when you are standing on the one below. The bluff face
    is close enough to press your palm against, and it is warm
    from the day's sun.
idlemessages:
- The terrace edge above is a clean line against sky, close now.
- Wind crests the <ansi fg="cyan">pitch</ansi> and arrives at your face in a steady
  push, smelling of stone and open grass.
- The scored grooves in the <ansi fg="cyan">steps</ansi> are filled with pale dust
  from the bluff face.
- From here the coulee lake is a bright mirror set into the green
  below, the town reduced to its rooftops.
