roomid: 5349
zone: Pothole Coulee
title: Terrace Stair
description: >
  The last steep pitch of the climb. Stone-cut steps rise directly here
  without switchback, narrow and close to the bluff face, angled sharply
  enough that you lean into the stone with your hands for the final
  stretch. The steps are well-maintained -- someone keeps the crumbling
  edges patched with mortared rubble -- and each one is scored across its
  face with a shallow groove for grip. Above you, the edge of the first
  terrace is a hard line against open sky. Below, the whole climb falls
  away to the coulee floor. The wind comes over the terrace lip and hits
  you directly, steady and purposeful.
biome: cliffs
