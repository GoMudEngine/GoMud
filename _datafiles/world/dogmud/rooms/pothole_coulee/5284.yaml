roomid: 5284
zone: Pothole Coulee
title: Open Steppe
description: >
  The ground levels out here into open steppe where nothing obscures
  anything, and the animal sign comes into its own. Tracks press clear
  into the dust: the twin-punch of hare, the splayed pad of something
  heavier cutting diagonally across, the minute stippling of mice running
  the same route they always run. A line of tracks leads south, distinct
  and deliberate, pressed deep where the dust is finest. The steppe is
  full of stories written in this dirt. You just have to know how to read.
