title: Cracked Spur
description: >
  A spur of rock juts east from the main canyon wall at the bend, cracked
  nearly through along a diagonal fault that has been slowly separating
  for longer than anyone has been watching. The crack runs the full height
  of the spur and widens as it goes, letting in a blade of sky and a
  narrow view back west along the bend below. This is a sniper's dead
  end: you cannot go further, the spur offers no exit and no retreat, but
  the angle it provides over the rockfall bend is nearly unmatched. From
  the edge of the spur you can see the whole spread of the bend laid out
  below and to the west -- every boulder, every gap, every approach. A
  patient archer here can reach the sounding floor to the southwest and
  the chimney corridor to the northwest without moving, picking angles
  through the rockfall that close off one position at a time. The spur
  rewards patience and punishes anything that comes up from the bend
  without knowing it is occupied.
