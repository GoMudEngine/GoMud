nouns:
  spur: The spur extends perhaps fifteen feet east from the canyon wall,
    ending in a blunt face of fractured limestone. It is solid underfoot
    despite the crack running through it -- the fault is old and has
    stopped moving. The surface is rough and angled slightly downward,
    toward the bend below.
  crack: The diagonal fault runs from the spur's base to its top, widening
    as it climbs. At head height the gap is two fingers wide. Through it
    you can see a thin strip of the canyon beyond -- not enough to matter
    for cover, but enough to feel the wind from the far side of the
    stone, and to hear anything moving there.
idlemessages:
- The <ansi fg="cyan">crack</ansi> in the spur carries a thin whistle of wind from the
  east face of the canyon wall.
- From the edge of the <ansi fg="cyan">spur</ansi>, the full spread of the bend below is
  visible -- every approach, every piece of cover, every gap.
- The fault in the rock shifts a fraction under your weight, then holds.
  It has been holding for a long time.
- A shadow moves briefly across the sounding floor far below, visible
  through the gaps in the rockfall bend.
