nouns:
  table: A heavy timber table set square in the room, its scarred top
    scrawled over with a crude map of the wash -- the canyon scratched out
    in lines, with stones and chalked marks shifted across it like pieces in
    a long game. Someone has been planning from up here, reading the whole
    climb below and setting their crew against it. The marks are recent.
  war-table: The same scarred table, used for war -- the wash mapped on its
    top, the comings and goings of the canyon worked out in stones and
    scratches. Whoever sits to it commands the gate and the climb and the
    crew between, and means to go on doing so. A chair waits drawn up to it,
    lately filled.
  view: The whole canyon, taken in at a glance through the burst wall -- the
    wash unrolled from the lower throat to the gate at the tower's foot,
    pale and bare and every step of it visible. Nothing climbs this canyon
    unseen from here. It is the reason the tower was raised, and the reason
    it is still worth holding.
  wall: The great ragged breach where one wall of the crown has fallen
    away, stone torn open to the sky and the canyon beyond. It ruined the
    tower as a fort and made it perfect as a watch -- there is no better
    window on the wash than this wound, and the high seat is set to face
    straight out through it.
  breach: The same burst-open wall, a jagged mouth of broken courses
    framing the whole canyon below. Wind pours through it steadily. Whatever
    holds the high seat holds it looking out this gap, with the entire climb
    spread bare beneath -- forewarned of every soul that starts up.
  seat: A heavy chair drawn up facing the breach, set where the watcher can
    take in the whole wash at once -- the high seat, the keeper's seat, the
    won place of whoever holds this ground by force. It is empty for the
    moment, and the air around it has not yet gone cold.
idlemessages:
- Wind pours through the <ansi fg="itemname">breach</ansi> and stirs the chalked stones on the table, nudging one a hair across the map.
