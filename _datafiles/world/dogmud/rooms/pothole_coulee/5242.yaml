roomid: 5242
zone: Pothole Coulee
title: The Watch Room
description: >
  The last turns of the stair bring you up into the tower's crown -- the
  watch room, the highest held ground in the whole canyon. One wall has
  burst clean open, a great ragged breach where stone gave way, and through
  it the wash lies bare from end to end -- the gate below, the wide pan of
  the climb, the throat of the lower canyon, every step a comer must take to
  reach this height, all of it laid plain to a single watching eye. A heavy
  table stands square in the room, its top scarred and scrawled over with a
  rough map of the wash, stones and scratched marks set across it like a
  reckoning of who holds what. A seat faces the breach -- the best seat, the
  high seat, plainly the seat of whoever holds this ground. The air is still
  and waiting up here, the way a room is when its keeper has only just
  stood. There is no higher hold. The stair drops away below; a doorway
  opens east onto the broken top.
