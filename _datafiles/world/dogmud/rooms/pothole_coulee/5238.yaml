roomid: 5238
zone: Pothole Coulee
title: Broken Gate
description: >
  The climb ends at the foot of the Pothole Watch, where a collapsed
  gatehouse once barred the way. The arch has slumped, half its courses
  shed into a tongue of rubble that spills down the bluff, and the gate
  itself -- a slab of grey weathered timber bound in rust -- hangs forced
  open on one twisted hinge. This is the threshold of whatever holds the
  tower, and it is plainly the held line -- the rubble is shifted into low
  walls a body can crouch behind, the dust beaten flat by boots that come
  and go. The bluff falls away sheer behind you to the wash far below.
  Whoever keeps this ground keeps it here first, at the broken gate. The
  pitch drops back west; the gatehouse stands open east; a black doorway
  in the ruin leads north into the tower's base.
