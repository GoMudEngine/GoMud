nouns:
  gate: A slab of grey weathered timber, bound and studded with rusted
    iron, forced open long ago and left hanging askew on one wrenched
    hinge. It will never close again. It does not need to -- what holds
    this tower stands its line in the open mouth of the arch, not behind a
    door.
  rubble: Shed courses of the slumped arch, drifted down the bluff in a
    long tongue of broken stone. Someone has dragged the larger blocks into
    low crouching walls that flank the gap -- cover for a fight, set facing
    out at anyone climbing the last pitch. The flat-beaten dust between them
    is the worst ground to be caught on.
  gatehouse: The collapsed stub of the gate-tower, half its height sloughed
    away, the rest standing open and roofless to the sky. It was raised to
    bar this throat and it failed, and now it shelters the ones who broke
    it. Beyond its ragged mouth the tower's base waits east and north.
  bluff: The sheer shoulder of stone the tower stands on, dropping away
    behind you in one long fall to the pale wash below. There is no line of
    retreat here but the climb you came up -- a thing the gate's keepers
    know as well as you do.
