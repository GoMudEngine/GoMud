zone: Pothole Coulee
title: Thinning Wood
description: >
  The forest grows sparse here, trunks spaced further apart than they should
  be for the density of canopy that still somehow remains. The trunks themselves
  bend wrong -- not with the slow lean of trees seeking light, but sharply,
  at angles that pull the eye to follow and leave it confused about direction.
  Several curve back on themselves in tight arcs that should be impossible for
  living wood. The hum is louder now, resonant, filling the space between the
  sparse trees with a pressure that sits behind the ears. The light is thinner
  too, not dim exactly, but stretched, as though the grove is using light as a
  material and has nearly run out.
