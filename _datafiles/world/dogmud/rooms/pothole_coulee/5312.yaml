nouns:
  trunks: Bent and wrong-angled, the trunks of these trees have grown in
    directions that deny the physics of wood and weight. Following one curve
    with your eye produces a faint nausea -- the geometry offends something
    deep and instinctive.
  hum: Louder here than at the grove's edge, it has taken on a resonant
    quality, vibrating in the chest cavity. It does not feel like a natural
    sound. It feels like something calling attention to itself.
idlemessages:
- The <ansi fg="cyan">hum</ansi> swells briefly, then subsides, as though the grove drew breath.
- One of the bent <ansi fg="cyan">trunks</ansi> creaks without wind -- a dry, internal sound,
  like settling bone.
- The light between the trees stretches and snaps back, a blink of strange
  geometry that leaves an afterimage.
