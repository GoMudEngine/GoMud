roomid: 5345
zone: Pothole Coulee
title: Shrine Loft
description: >
  A stub of stair -- six broad steps of surviving stone -- climbs from
  the main floor to a ledge that runs along the shrine's east wall,
  open to the outside air through a gap where the upper course of
  masonry has long since fallen away. The ledge is wide enough for two
  people to stand abreast and look out. From here the standing-stone
  ring below is visible in its entirety, the stones casting long
  shadows at the right hours, the low coulee floor spreading out
  beyond them toward the steppe. The hermit comes up here, clearly --
  there is a worn place on the ledge's edge where hands have rested,
  and the gap in the masonry has been left clear of debris. A good
  place to see the whole of the land that the shrine overlooks. A
  short stair on the north wall climbs toward the open crown of
  the rise.
