nouns:
  ledge: The ledge is sound -- the wall below it is the intact section
    of the shrine, and the stone underfoot is solid. The worn patch at
    the edge has been smoothed by years of hands resting there, looking
    out. It is a comfortable place to stand and look at a large
    amount of sky.
  stair: Six steps, broad and low, climbing from the main floor. The
    treads are worn but not dangerously so. The stone handrail on the
    south side is intact; the north rail is gone, leaving the stair
    open on that side.
idlemessages:
- From the <ansi fg="cyan">ledge</ansi>, the stone ring below resolves into its full
  shape -- the arrangement becomes clear in a way it isn't from
  inside the circle.
- Wind arrives here unobstructed and stays for a moment before
  moving on toward the open rise to the north.
- The worn spot at the <ansi fg="cyan">ledge</ansi> edge is warm, as though recently
  occupied, though you are alone.
- A hawk crosses the sky above the coulee at eye level from here,
  close enough to see the tilt of its head.
