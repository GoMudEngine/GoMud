title: Tower Base
description: >
  Through the doorway the tower's base opens into its hollow heart -- a round
  shaft of grey stone climbing up into gloom, wide and empty at the floor.
  A broken stair spirals the inner wall, cut from the same stone and
  half-eaten by the years -- whole flights of it stand, then a span has
  fallen clean away, then it picks up again higher, winding toward a pale
  smudge of daylight far up the throat of the shaft. Loose stone shifts
  underfoot across the whole floor, shed from the stair and the courses
  above, treacherous and grinding -- there is no quiet way to cross it and
  no sure footing on the climb. The gate lies back south; the stair winds
  up into the dark.
