nouns:
  crown: The shattered top of the tower, courses fallen to a low broken rim,
    the floor cracked and sloping but firm enough to stand on. It is ruin
    made into a perch -- the highest place on the whole climb, with nothing
    above it but sky and nothing around it the eye cannot reach.
  top: The same broken crown, open to the weather, the wind unbroken across
    it. Whoever stands here stands over the entire canyon, the long fight up
    finished and the ground held. There is a stillness to it that the rooms
    below, packed with held breath and old smoke, never have.
  vista: The whole coulee laid out below in one long look -- the wash
    threading pale down the canyon to the hub sitting tiny and far at its
    foot, the climb you made dwindled to a thread. It is the reward of the
    height, the thing the watchtower was built to take and the thing you
    have just taken from it.
  rim: The low jagged ring of fallen courses bounding the broken top, worn
    enough to sit on, looking out over the drop on every side. Past it the
    eye runs clean to the far walls of the world, where the other canyon
    mouths cut their dark notches.
  mouths: Dark notches cut into the far stone walls of the scablands, each
    the throat of another canyon opening away to ground not yet walked.
    From this height they show plain, ways out into the wider country, every
    one of them a road still to take when the time comes.
