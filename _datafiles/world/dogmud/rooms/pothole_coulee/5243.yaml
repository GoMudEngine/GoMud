roomid: 5243
zone: Pothole Coulee
title: Tower Top
description: >
  A doorway off the watch room lets you out onto the broken crown of the
  tower, open to the whole wide sky. The top is shattered -- courses fallen
  away to a low jagged rim a body could sit on, the floor sloped and cracked
  but sound enough to stand and breathe. And the breathing is the point of
  it, because the vista from here stops you. The whole coulee lies unrolled
  below, the wash threading pale all the way down to where the hub sits tiny
  and far off at the canyon's foot, the long climb you made shrunk to a
  thread. And out along the rim of the world the other canyon mouths show
  themselves -- dark notches cut into the stone walls, each a throat opening
  away to ground you have not walked yet, ways out into the wider scablands.
  Two of those crests can be walked from here -- a rim-trail running off
  toward a lone marker-stone on a distant shrine-rise, and another north
  along the bluffs to a raider's overlook. It is quiet up here, won quiet,
  the high ground taken and the long view
  earned. The watch room lies back west, down out of the wind.
biome: cliffs
