zone: Pothole Coulee
title: Game Trail
description: >
  A worn trail cuts through the brush, beaten flat by generations
  of animals coming down to water. The path is narrow but clear,
  the ground to either side scuffed and tracked where things pause
  or turn. Tracks of every size cross and overlay — hoof, pad,
  claw. The brush crowds the edges, high enough to shelter a waiting
  shape. The trail is a gift and a trap in equal measure.
