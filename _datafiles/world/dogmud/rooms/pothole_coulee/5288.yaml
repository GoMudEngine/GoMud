nouns:
  trail: A hard-packed strip worn down by hooves, pads, and claws
    over many seasons — the easiest path, and the most watched.
  tracks: Prints of every shape and size pressed into the soft
    margins -- hoof, pad, claw, overlapping without order.
idlemessages:
- Fresh tracks press into the soft margin of the trail — large,
  evenly spaced, and recent.
- Something unseen moves parallel to the trail through the brush,
  keeping pace without showing itself.
