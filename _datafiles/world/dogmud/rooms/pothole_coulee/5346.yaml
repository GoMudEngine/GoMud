nouns:
  rise: The crown of the rise is perhaps twenty paces across, its
    surface close-cropped grass and exposed stone in roughly equal
    measure. Nothing grows tall here; the wind keeps everything low
    and honest. The edges fall away gradually in all directions,
    giving a sense of height that is greater than the actual
    elevation.
  marker: The marker stone is waist-high, set deep enough that it
    does not shift in the wind. Its cut faces are weathered smooth.
    Whatever was on it -- text, symbol, figure -- is gone. It
    stands facing northwest as though it is still watching for
    something that was expected to come from that direction.
idlemessages:
- The wind on the <ansi fg="cyan">rise</ansi> arrives from the northwest and holds
  steady. It carries nothing particular -- just space.
- The <ansi fg="cyan">marker</ansi> casts a short shadow at this hour, pointing
  back toward the shrine below as though indicating a direction.
- Far below, the coulee floor catches the light differently than
  the steppe beyond -- something in the soil, or the way the
  grass grows in the low ground.
- The sky up here feels closer. The horizon looks like a promise
  of something the land has not yet delivered.
