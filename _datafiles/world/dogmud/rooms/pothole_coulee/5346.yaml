zone: Pothole Coulee
title: Clearstone Rise
description: >
  The crown of the rise opens out of the stair into clear sky and
  wide view. The coulee spreads below in every direction -- the stone
  ring small and complete to the south, the shrine roof patchwork
  and open below your feet, the steppe rolling out in long grass
  toward distances that the eye is glad to have. The wind up here
  is steadier than anywhere on the approach, arriving without the
  interruptions of walls and stones. At the rise's highest point
  a single marker stone stands, clean-cut and pale, facing outward
  to the north and west. It bears no carving now, or none that the
  weather has left legible, but it was placed by someone who wanted
  a thing marked and permanent on this high ground. It looks toward
  country that lies beyond the coulee's edge -- toward paths not
  yet walked, distances not yet measured. One such path is plain
  from here: a faint crest-trail runs the rim east toward a broken
  watchtower on the far height. Standing beside it is
  enough to feel that the accounting of this place is not yet
  finished.
