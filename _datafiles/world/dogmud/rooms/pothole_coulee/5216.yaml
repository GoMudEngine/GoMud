nouns:
  boardwalk: The boardwalk is a run of weathered planks laid across the
    stilt-house pilings, just wide enough for two to pass. It gives a
    little underfoot with every step, springing over the water. Knots and
    nail-heads have worn proud of the soft grey wood where the grain sank
    around them.
  nets: Fishing nets hang from the railings and the house-eaves to dry,
    knotted from twine and weighted with smooth holed stones. Some are
    being mended where the water tore them; a half-finished one droops
    from an old woman's three patient hands. The smell of weed and fish
    clings to all of them.
  stilts: The houses stand on stilts -- long timber legs driven into the
    mud of the shallows, lifting each floor a body's height above the
    water. Green weed and pale barnacle crust the lower legs at the
    tide-line. Between them you can see straight down to the clear shallow
    bottom, where small fish hang in the shade.
idlemessages:
- A pot is scraped clean somewhere behind an open door, and a <ansi fg="itemname">song</ansi> trails off.
- Glass floats knock together on the railing as the breeze shifts.
