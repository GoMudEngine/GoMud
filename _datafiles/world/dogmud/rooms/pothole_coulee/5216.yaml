roomid: 5216
zone: Pothole Coulee
title: Stilt-House Walk
description: >
  A plank boardwalk threads between the stilt-houses, bouncing gently
  underfoot over the shallows on their long-legged supports. Nets hang
  drying from the railings, and glass floats knock together in the breeze,
  while the green water shows shallow and clear between the stilts below.
  An old woman with bark-grey skin and a slender third arm mends a net
  without looking up; a boy whose eyes shine like a cat's chases a dog
  past your knees. Home-sounds drift from the open doors -- a pot scraped,
  a song half-hummed, the plain noise of the Opened going about their day.
  Nobody here spares a strange-shaped body a second glance; on this walk,
  that is simply a body.
