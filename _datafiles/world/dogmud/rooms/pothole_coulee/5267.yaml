roomid: 5267
zone: Pothole Coulee
title: Drying Racks
description: >
  A cluster of wooden racks occupies this open arm of the hollow, their
  crossbars strung with root and stem and leaf hung in careful bundles
  to dry in the moving air. Healer's root, bitter thistle, marsh sedge,
  grey-cap mushroom -- the smell of them together is medicinal and dense
  and not entirely pleasant until you breathe it long enough for the
  individual notes to separate. Against the near wall a row of shelves
  holds empty bottles in graduated sizes, stopped with wax or cork,
  waiting to be filled. A second flat-stone worktable has been arranged
  here for practice, its surface stained with old tincture-work in rings
  of green and brown. Baskets on the ground hold the day's harvest,
  unsorted.
biome: swamp
