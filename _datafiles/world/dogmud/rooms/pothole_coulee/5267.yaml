    roomid: 5265
nouns:
  racks: Rough-hewn wooden frames, knee-high to overhead, their crossbars
    lashed with cord from which dozens of herb bundles hang at intervals.
    The wood is dark with age and fragrant from years of contact with
    what has dried on it.
  bottles: Ranks of glass bottles on the shelves range from thumb-sized
    vials to broad-bellied flasks, each one stoppered and waiting. A few
    are already faintly tinted -- green, amber, pale violet -- from
    whatever was last stored in them.
  baskets: Wide, low-sided baskets woven from split reed rest on the
    ground below the racks, heaped with the day's gathered roots and
    leaves. They smell of fresh-cut plant and dark earth.
idlemessages:
- A breeze stirs through the hollow and the herb bundles on the <ansi fg="itemname">racks</ansi> sway together, releasing a sharp green smell.
- One of the <ansi fg="itemname">bottles</ansi> catches the light at an angle, throwing a small amber patch across the stone wall.
