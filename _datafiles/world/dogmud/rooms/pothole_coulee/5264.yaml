roomid: 5264
zone: Pothole Coulee
title: Reedwash Descent
description: >
  The cut path drops away here, flagged stakes planted at intervals to
  mark the way where the reeds crowd in thick on either side. Trampled
  grass gives out to bare earth, then to soft mud that holds the shape
  of every boot that has passed before yours. The air shifts as you
  descend -- the raw smell of the wash above softening into something
  greener, cooler, threaded through with a faint herb-scent rising from
  the hollow below. The path bends south, worn smooth by use, and
  somewhere below the reeds the low murmur of still water waits.
biome: swamp
