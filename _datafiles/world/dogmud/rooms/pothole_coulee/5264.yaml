nouns:
  stakes: Lengths of pale wood driven into the soft earth at arm-span
    intervals, each one knotted at the top with a rag of faded cloth to
    mark the path through the reeds. Someone has kept them up for a long
    time.
  path: A track of bare, foot-packed earth that cuts through the reed
    beds, descending steadily into the hollow below. The mud at its
    center is soft and dark, pressed into gentle ridges by countless
    passing boots.
  reeds: Dense stands of tall, hollow-stemmed reed crowd the path on
    both sides, their seed-heads brushing together overhead in a dry
    whisper. Somewhere among them, water sits quiet and dark.
idlemessages:
- The <ansi fg="itemname">reeds</ansi> shiver along the path as a breath of cool air rises from the hollow below.
- Something moves softly in the reed beds -- a rustle, then stillness.
