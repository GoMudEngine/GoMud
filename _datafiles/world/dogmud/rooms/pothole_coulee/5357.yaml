nouns:
  rockfall: The boulders are old -- their edges have been rounded by
    decades of freeze and thaw, and the smaller rubble between them is
    half-buried by accumulated dust and grit. They fell from the canyon
    rim in some past collapse and have been here long enough to seem
    permanent. Some of the gaps between them are wide enough to step
    through. None of them are wide enough to sprint through.
  bend: The canyon changes direction here by perhaps forty degrees,
    enough to break the long sightlines from the south and create a
    shadow zone that neither end can fully cover. It is the kind of
    bend that benefits whoever knows it better.
idlemessages:
- Loose grit shifts somewhere in the <ansi fg="cyan">rockfall</ansi> -- weight redistributing
  through the settled mass of stone.
- The <ansi fg="cyan">bend</ansi> catches a current of air from the north and redirects it,
  hitting you from an unexpected angle.
- A small rock skips down the far side of a boulder and comes to rest
  without a sound.
- The acoustics here are muddled -- sounds arrive with no clear direction,
  reflected by too many surfaces at once.
