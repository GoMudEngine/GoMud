roomid: 5357
zone: Pothole Coulee
title: Rockfall Bend
description: >
  The canyon bends here and the floor is choked with old rockfall --
  boulders the size of wagons, slabs tilted against one another at steep
  angles, smaller rubble filling the gaps. The clean sightlines of the
  slot behind you end at this bend; the rockfall breaks them into a dozen
  shorter angles, each one covering only a wedge of the available space.
  Cover is everywhere and nearly useless, because every piece of it
  can be flanked from three directions. An east-facing spur of rock juts
  out beyond the main fall, offering a narrow view back down the slot
  toward the sounding floor. The canyon continues north through a gap
  between two of the largest boulders, tight but passable, leading
  toward the head of the canyon where the walls begin to rise and the
  light shifts. The bend is the most tactically complex stretch of the
  whole slot: nothing is certain here, and the rockfall makes every
  movement a decision.
