nouns:
  path: Worn but unreliable, the path carries the marks of boots in the
    soft earth -- yet their spacing is wrong, too wide in some places,
    overlapping in others, as though the walkers kept finding themselves
    elsewhere mid-stride.
  shadow: It pools in the low places independent of light source, dark
    and slightly more solid than shadow ought to be. Touch it and the
    cold goes deeper than the air accounts for.
idlemessages:
- The <ansi fg="cyan">path</ansi> ahead bends, and when you look away and back, the bend is
  somewhere different.
- <ansi fg="cyan">Shadow</ansi> shifts in a hollow near the tree roots -- not cast by anything
  you can locate.
- Something moves at the edge of the treeline, arriving from the direction
  you are walking toward.
