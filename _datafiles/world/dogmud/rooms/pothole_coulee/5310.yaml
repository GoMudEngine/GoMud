roomid: 5310
zone: Pothole Coulee
title: Sunken Path
description: >
  A path winds between the pale trees, but it does not behave the way paths
  should. Walk its length and you arrive not quite where the geometry promised
  -- a step west that deposits you slightly north, a turn that lands you facing
  the direction you came from. The ground dips here, sinking into shadow that
  pools in the low places regardless of where the sun is, shadow that has
  collected and thickened over time until it holds its shape without the dark
  to feed it. The air has a faint resistance, as though the space itself is
  gently correcting every movement.
biome: forest
