roomid: 6462
zone: Pothole Coulee
title: The Gem Stall
description: >
  A plank stall raised on stilts at the reed line, a canvas awning
  strung overhead to keep the sun and the coulee drizzle off the trays.
  Trays of raw stone and polished bead sit under thin muslin, and a
  small anvil block for setting wire is bolted to the counter's corner,
  dented from years of careful, patient taps. The reeds of Reedwash
  lean close on two sides, and the smell of wet green growth mixes odd
  with hot metal and rock dust.
biome: shore
station: jeweler_bench
