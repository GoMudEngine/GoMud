nouns:
  trays: Shallow wooden trays under thin muslin, sorted stone from
    bead from half-set wire. Nothing here is loud to look at, though
    some of it is worth more than the stall itself.
  anvil block: A fist-sized block of iron bolted to the counter's
    corner, its face dimpled from years of small, exact taps setting
    wire and stone into place.
