nouns:
  wash: The broad open pan of gravel where the canyon widens, the hub of
    all the foot-traffic on the climb. Everything the squatters do crosses
    this ground, which makes it the worst place to be caught alone.
  trails: Footworn threads beaten pale into the gravel, running off toward
    water and hollow and tower and back. They cross and tangle in the
    open -- a map of comings and goings, all of them belonging to people
    who would rather you were not reading it.
  camp signs: The scattered marks of long use -- cold fire-rings, gnawed
    bones, a grey brush lean-to, a notched tally-post. None of it is fresh,
    and all of it says the same thing -- this ground is lived on and held.
  post: A weathered stake driven into the gravel, its side scored with a
    row of cut notches. Someone has been counting something here -- days,
    or kills, or comers who never left. The tally is not short.
  lean-to: A low shelter of brush and stripped branches gone grey and
    brittle with weather, leaned against a fallen slab. It has sheltered
    rough sleepers through more than one season and will again.
