roomid: 5236
zone: Pothole Coulee
title: Upper Wash
description: >
  The canyon shoulders draw apart and the wash opens wide, a broad pan of
  gravel where the high walls fall back and the sky comes down. This is
  trodden ground -- the most-used squatter haunt on the whole climb.
  Trails are beaten into the gravel from every side, worn pale by feet
  going to water, to the hollow, to the tower above, the threads of them
  crossing and recrossing in the open. Camp-signs litter the ground --
  more cold fire-rings, picked bones, a lean-to of brush gone grey, a notched
  post where someone has been keeping a tally of something. It is the
  busiest, and so the most watched, stretch of the wash. Lower ground lies
  west; the cistern sits below to the southwest; the climb to the tower
  goes on east.
