nouns:
  threads: Long filaments of light and substance, pulled loose from the
    fabric of the place and drifting upward in spirals. They are warm
    to the sight if not the hand -- you do not reach for them, some
    instinct says do not touch what is coming free of the world.
  unraveling: The process is active but unhurried. Edges fray, threads
    lift, the air between solid things grows thin and uncertain. It
    is not destruction -- nothing is gone yet -- but the structure of
    the place is slowly becoming optional.
idlemessages:
- A new <ansi fg="cyan">thread</ansi> lifts free of the stone near your feet and spirals slowly
  upward, fading before it reaches eye height.
- The <ansi fg="cyan">unraveling</ansi> at the far edge intensifies for a moment -- more threads,
  brighter -- then settles back to its patient pace.
- The air between you and the east passage briefly goes transparent, a
  window into something that is not air.
