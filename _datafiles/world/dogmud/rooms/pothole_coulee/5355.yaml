roomid: 5355
zone: Pothole Coulee
title: Side Ledge
description: >
  A broken shelf of limestone juts from the canyon's east wall, elevated
  just enough to grant a clean angle back over the canyon mouth to the
  west. The ledge is a dead end -- the rock above is sheer and offers
  nothing to climb -- but as a perch it is nearly ideal. A shooter here
  has the canyon mouth laid out below and can loose into the slot with
  the wall at their back. The cover is genuine: a tilted slab on the
  ledge's north edge is thick enough to kneel behind, and the shadow it
  casts in the afternoon sun falls across anyone crouching here. Someone
  has used this spot before. There are scuff marks on the stone that
  suggest long hours of patient waiting, and a clear field of view west
  into the canyon mouth that a careful eye could use to great advantage.
