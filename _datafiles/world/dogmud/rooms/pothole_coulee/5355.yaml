nouns:
  ledge: A natural shelf of limestone, fractured away from the main wall
    and tilted slightly outward. It is wide enough to stand on comfortably
    and long enough to lie prone along. The stone underfoot is rough and
    offers solid purchase -- this is a platform built by accident and
    useful by design.
  cover: The tilted slab on the ledge's north edge is easily chest-high
    when you kneel. It is old stone, dense and unmoved by anything short
    of a siege weapon. The angle it creates means you can see west into
    the canyon mouth while presenting very little of yourself to anything
    coming from that direction.
idlemessages:
- From the <ansi fg="cyan">ledge</ansi>, the canyon mouth spreads out to the west -- every
  approach visible, nothing hidden.
- The <ansi fg="cyan">cover</ansi> casts a long shadow across the shelf. Someone crouching
  here would be very difficult to spot from below.
- Wind moves along the canyon wall and eddies around the slab, carrying
  sound up from the slot below.
- The scuff marks on the stone are old but unmistakable -- this vantage
  has been used, and used deliberately.
