nouns:
  stalls: The four stalls are swept and freshly bedded, the mangers
    filled with hay. They have the neat, purposeful look of a space
    that is cleaned and reset every morning without fail.
  loft: The loft is deep with baled hay, the bales stacked in
    interlocking rows that will not shift. The ladder to it is fixed
    and steady, worn smooth on the rungs from long use.
idlemessages:
- A shaft of light crosses the barn floor slowly, marking the hour
  as it moves from one wall toward the other.
- The <ansi fg="yellow">stalls</ansi> are quiet now, the animals out in the yard
  or the near field.
- Something moves in the <ansi fg="yellow">loft</ansi> overhead -- hay settling,
  or a small creature going about its business.
