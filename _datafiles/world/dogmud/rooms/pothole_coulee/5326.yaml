title: The Barn
description: >
  The barn is larger inside than the yard suggests -- a high-ceilinged
  space smelling of dry hay, animal warmth, and old timber. Four stalls
  run along the near wall, each swept clean, the mangers filled and the
  bedding fresh. A loft occupies the upper third of the building, reached
  by a fixed ladder nailed to the wall, bales stacked to the rafters
  above. Tack hangs on iron pegs along the opposite wall -- harness,
  rope, a few tools cleaned and racked with the same economy of motion
  that marks all the work here. Light falls through gaps in the siding
  in bright horizontal bars, moving slowly across the floor as the day
  progresses. A farmhand's daily work happens in this room -- the kind
  of repetitive, necessary labor that keeps everything else possible --
  and the barn holds the comfortable smell of that work done well.
