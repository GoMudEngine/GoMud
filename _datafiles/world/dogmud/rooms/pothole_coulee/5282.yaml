nouns:
  sage: The sage comes in low mounds, silver-grey and tough, filling every
    hollow between the grass clumps. Step near and the smell comes up sharp
    and clean, the smell of dry country. It stretches south farther than
    you want to walk without a reason.
  path: A track pressed into the earth by enough foot-traffic to matter,
    running south from the draw's mouth out across the flats. The dust is
    pale and fine. Whatever uses this way, uses it often.
idlemessages:
- A cloud shadow sweeps across the <ansi fg="itemname">sage</ansi> and moves on south.
- Wind comes off the flats carrying the smell of dry <ansi fg="itemname">grass</ansi> and distance.
