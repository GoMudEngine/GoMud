roomid: 5282
zone: Pothole Coulee
title: Scrub Mouth
description: >
  The coulee walls fall back here and the sky opens wide without warning.
  What was close and channeled becomes vast: rolling sage-flats running
  south to the horizon, grey-green and silver under the light, broken
  only by low swells of ground and the dark drift of cloud shadow. A
  path runs out from the draw's mouth into the grass and keeps going,
  thin and honest, worn by boots and hooves and the slow seasons.
