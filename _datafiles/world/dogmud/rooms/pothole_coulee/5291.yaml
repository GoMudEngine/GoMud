roomid: 5291
zone: Pothole Coulee
title: Carrion Flat
description: >
  An open flat of bare, sun-bleached ground where kills are dragged
  and stripped. Old bones litter the earth in scattered arcs,
  gnawed clean and beginning to whiten. Feathers in clumps mark
  where birds came down and were taken in turn. The carrion smell
  is not subtle — it is a weight in the air that coats the back
  of the throat. Scavengers work the edges; larger shapes move
  at the margins, unhurried, watching the flat the way a landlord
  watches his property.
