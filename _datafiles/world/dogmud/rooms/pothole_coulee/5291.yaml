nouns:
  bones: Old, gnawed bones scattered in arcs across the flat, some
    still articulated, most long since scattered by competing mouths.
  feathers: Loose clumps pressed into the dust where birds came down
    to feed and did not leave again.
  carrion: The reek of old kills, thick and particular, that marks
    this flat as something's private table.
idlemessages:
- A dark shape drops from the sky, lands at the far edge of the
  flat, and begins to feed without looking up.
- The carrion smell thickens for a moment on a gust, then
  settles back to its usual weight.
