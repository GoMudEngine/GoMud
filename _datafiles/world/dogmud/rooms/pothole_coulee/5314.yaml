roomid: 5314
zone: Pothole Coulee
title: Veil Tear
description: >
  The grove ends here at the edge of a tear in the world itself -- a seam of
  light that does not come from any sky, rising from the earth at an angle
  that has no name in ordinary geometry. The light at the tear's edge is wrong
  in color, neither warm nor cool but both at once, and it shifts without
  settling as though it cannot decide what it is meant to illuminate. The seam
  is perhaps a hand-width wide and taller than a standing person, and through
  it you can see something that is not the grove continued -- a scabland of
  exposed stone and thin air, reality-thin, where the Folding has bitten through
  entirely. The way up lies along the tear's edge, where the ground has heaved
  into a rough natural stair.
biome: forest
