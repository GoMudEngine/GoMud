nouns:
  tear: The seam in reality -- a vertical split in the air, taller than a
    person, glowing with light that has no proper source. The edges of the
    tear are crisp as cut cloth, and the air around them is colder than
    anything else in the grove.
  seam: Running from the earth upward at an angle that bends the eye,
    the seam marks where the Folding has finally broken through. Old
    scorch marks ring its base, evidence of what happened the last time
    someone stood too close without preparation.
idlemessages:
- The <ansi fg="cyan">tear</ansi> pulses once, light bleeding out and pulling back, like a slow
  and patient breath.
- Something moves in the other side of the <ansi fg="cyan">seam</ansi> -- too distant to name,
  too deliberate to be wind.
- The ground near the tear's base is warm despite the cold, faintly, as
  though what lies beyond runs hot.
