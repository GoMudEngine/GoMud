roomid: 5270
zone: Pothole Coulee
title: Sunken Path
description: >
  A causeway of old waterlogged logs threads through the marsh, half-
  swallowed by mud and years of neglect. Each log shifts slightly when
  you step on it, and the dark water presses up between them. Cattails
  crowd both edges in dense ranks, their brown seed-cylinders splitting
  apart and releasing slow drifts of white down. The air smells of mud
  and something faintly sweet — wild herbs somewhere close, where the
  ground is firmer.
biome: swamp
