nouns:
  causeway: Rotted logs lashed together with rope long since gone green
    with algae, the whole thing sinking unevenly into the marsh. In places
    the wood has gone spongy and gives dangerously underfoot.
  cattails: Brown-headed marsh reeds packed thick along the water's edge,
    their velvet seed-heads bursting open at the top. The white down
    catches in your clothes when you brush against them.
idlemessages:
- A drift of white <ansi fg="itemname">cattail</ansi> down floats past
  on a breath of air and settles on the water.
- One of the logs in the <ansi fg="itemname">causeway</ansi> shifts and
  settles with a wet groan.
