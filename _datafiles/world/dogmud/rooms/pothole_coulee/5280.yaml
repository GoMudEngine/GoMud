zone: Pothole Coulee
title: Heart of the Mire
description: >
  The mire is deepest here, and the water itself seems to gather
  rather than merely collect -- to arrive, as though called. The
  ground does not hold footfall so much as absorb it, and the slow
  pulse of the mire against boot-leather has the rhythm of something
  breathing. The air tastes of iron and sweetness together, wrong in
  a way the body recognizes before the mind does. Everything here
  leans inward, as though the heart of this place is a gravity of
  its own, patient and certain and very old. The silence has weight.
biome: swamp
