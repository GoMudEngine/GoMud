nouns:
  water: It gathers here as though drawn, pooling thick and dark
    around every low point, slow to move and reluctant to leave.
    The surface holds an oily sheen that shifts without wind, and
    the smell rising off it is both sweet and wrong.
  mire: The ground is more mire than earth at the heart, soft and
    deep and certain to swallow anything left still for long. It
    breathes in its slow way, and the rhythm of it is unsettling
    once noticed.
idlemessages:
- The <ansi fg="itemname">mire</ansi> exhales a long slow bubble that
  breaks the surface in silence and leaves a dark ring spreading.
- The <ansi fg="itemname">water</ansi> around your feet shifts without
  cause, as though something below has turned to regard you.
