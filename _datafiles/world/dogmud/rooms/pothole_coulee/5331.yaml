nouns:
  megaliths: Each outer megalith is a distinct block of local stone --
    no two quite the same colour or grain -- yet they share a quality of
    purpose, of having been placed rather than found here, and placed by
    someone who intended them to outlast themselves by a long margin.
  lichen: The lichen on the outer face of each stone grows in layered
    patches that suggest great age. Up close the patterns almost resolve
    into repeating motifs -- circles, spirals, angles -- before the eye
    loses the thread again.
idlemessages:
- The wind passes through the gaps between the <ansi fg="cyan">megaliths</ansi> and
  shifts pitch slightly as it does, a low note that fades as quickly
  as it arrives.
- A patch of <ansi fg="cyan">lichen</ansi> on the nearest stone seems a different colour
  than it was a moment ago -- though the light has not changed.
- Standing at the threshold between the outer stones, you feel the air
  inside the ring press back very slightly against you.
