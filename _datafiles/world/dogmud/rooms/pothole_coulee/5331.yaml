roomid: 5331
zone: Pothole Coulee
title: The Outer Ring
description: >
  The outermost megaliths of the great ring stand here in a wide arc,
  lichen-grey and leaning slightly inward as though pressed by centuries
  of the same west wind. Each stone is roughly twice the height of a
  person, their bases sunk deep, their upper faces pitted and streaked
  with pale lichen in patterns that the eye keeps trying to read as
  script. They are spaced like sentinels -- far enough apart to pass
  between freely, close enough that stepping through any gap has the
  unmistakable quality of a threshold. The scrubland ends here. Inside
  the ring the turf is different -- shorter, darker, faintly damp even
  in dry weather -- as though the stones have been tending it.
biome: land
