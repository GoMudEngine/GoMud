nouns:
  perch: The perch is a shooter's position, constructed and occupied
    by someone who knew their business. The windbreak drops you below
    the skyline -- you become difficult to see from below while the
    approaches below remain visible to you. It is a good position.
    It has been used.
  windbreak: Three courses of flat stone wedged into a low wall along
    the bluff's north face. The work is rough but the logic is sound
    -- the break cuts the constant lateral wind without blocking the
    sightlines to the south and east. Someone spent an hour on this.
    More than one arrow has been shot from behind it.
idlemessages:
- The <ansi fg="yellow">windbreak</ansi> cuts the worst of the gusts here. Behind it the air
  is almost still, a pocket of quiet in all the exposure.
- A spent shaft rolls against your boot -- light wood, grey fletching,
  the head snapped off at the neck.
- From the <ansi fg="white">perch</ansi> the approaches below are a clear map. Nothing reaches
  this height without crossing open ground first.
- Wind moves over the top of the windbreak and curls down behind it,
  carrying a faint smell of old fire and leather.
