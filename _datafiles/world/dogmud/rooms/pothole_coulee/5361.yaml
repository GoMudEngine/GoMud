roomid: 5361
zone: Pothole Coulee
title: Raider Perch
description: >
  Someone chose this spot with care. A low windbreak of stacked
  stone runs along the north face -- not neat work, but deliberate,
  the stones wedged and fitted to shed wind and drop a shooter below
  the skyline. Spent arrow shafts lie scattered across the rock, a
  dozen at least, some snapped, some merely dropped after the quiver
  ran dry. The angles from here are exceptional: south covers the
  rise and the chimney approach, east covers the long traverse below,
  and north holds clear sight of the high ground ahead. Whoever
  built this perch understood the bluff and meant to hold it.
biome: cliffs
