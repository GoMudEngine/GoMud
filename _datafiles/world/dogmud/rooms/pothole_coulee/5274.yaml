nouns:
  water: The surface here is wrong — a metallic sheen floats on it
    and the color beneath is too dark, too still. No insects touch it.
    No frogs call from its banks.
  reek: An underlying sulphur smell that rises in waves when the air
    is still. It sits at the back of the throat and does not leave
    quickly once you have breathed it.
  reeds: Grey-stalked and hollow, the reeds here have given up. They
    rattle against one another in the wind like dry bones, their
    seed-heads long since gone to nothing.
idlemessages:
- The <ansi fg="itemname">reek</ansi> rises stronger for a moment and
  then settles.
- One of the grey <ansi fg="itemname">reeds</ansi> snaps at the waterline
  and falls into the foul <ansi fg="itemname">water</ansi> without a sound.
