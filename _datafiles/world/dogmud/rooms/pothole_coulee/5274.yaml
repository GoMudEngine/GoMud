roomid: 5274
zone: Pothole Coulee
title: The Miasma Edge
description: >
  The clean ground ends here. The water ahead has gone the color of
  old bronze, filmed with an iridescent slick that catches the light
  wrong, and a reek of something between sulphur and rot lifts off it
  in faint wisps. The reeds along the bank are dying: the green has
  leached out of them, leaving grey stalks that rattle dryly in the
  wind. Nothing calls from the water. Nothing moves. The marsh south
  of this point smells of poison and old death, and the ground there
  cannot be trusted.
biome: swamp
