roomid: 5332
zone: Pothole Coulee
title: Scrub Verge
description: >
  Open windblown scrub marks the western edge of the stone ring's
  influence, the land here neither quite inside the circle nor fully
  free of it. Bent grass covers the ground in low mats, each clump
  angled away from the prevailing wind with the weary expertise of
  long habit. A single fallen stone lies here, half-sunk in the turf,
  its upper face still faintly smooth where once it stood upright and
  weather struck it flat-on. Whatever it was carved with is gone now --
  erosion or deliberate removal, impossible to say. The ring's nearest
  standing stones are visible to the east, and the pale sky above the
  coulee stretches wide and unobstructed in every other direction.
biome: land
