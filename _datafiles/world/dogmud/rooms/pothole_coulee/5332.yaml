nouns:
  scrub: The scrub here grows in low dense mats, each one a knot of
    stems bent in the same direction -- a record of prevailing wind
    written in living material, patient and illegible to anyone who
    has not stood here long enough to read the pattern.
  grass: Clumps of bent grass cover the ground between patches of bare
    earth. At the roots the soil is darker, almost black, rich with
    old organic matter -- this ground has been undisturbed for a very
    long time.
idlemessages:
- The wind crosses the open <ansi fg="cyan">scrub</ansi> and bends the grass in a long
  wave moving east, toward the ring.
- The fallen stone's smooth face catches the light and for a moment
  you think you see an outline in it -- a curve, a mark -- and then
  the angle changes and it is blank again.
- A small bird lands on the edge of the fallen stone, studies the
  <ansi fg="grass">grass</ansi> nearby, and departs without explanation.
