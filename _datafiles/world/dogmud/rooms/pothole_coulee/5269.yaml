roomid: 5269
zone: Pothole Coulee
title: Reed Beds
description: >
  Tall reeds press in from every side, their feathered heads closing
  overhead until the sky is just a pale smear between the stalks. The
  ground underfoot is soft and yields with a sucking pull at each step,
  mud welling up around your boots. Out in the dark water something
  disturbs the surface — a slow ripple spreading wide and then gone.
  The marsh proper begins here, and the air is thick with the smell of
  green rot and standing water.
biome: swamp
