nouns:
  reeds: Tall marsh reeds packed shoulder-to-shoulder, their stems pale
    gold at the base and darkening to deep green higher up. The feathered
    seed-heads brush your face when the wind stirs.
  water: Dark and still between the reed stems, the water here shows no
    bottom. The surface is faintly iridescent with a thin oil of decay.
idlemessages:
- Something disturbs the <ansi fg="itemname">water</ansi> out among the
  <ansi fg="itemname">reeds</ansi> — a slow ripple, and then silence.
- A frog calls once from deep in the <ansi fg="itemname">reeds</ansi> and
  falls abruptly quiet.
