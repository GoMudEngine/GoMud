nouns:
  steps: The stone steps are fitted work, old enough that the joints
    between them have grown nearly invisible under the moss. Each tread
    is worn slightly concave at its center by the accumulated passage
    of feet over what must be many generations.
  moss: The moss is a deep, almost black green here, thriving on the
    steady seep of moisture through the mound. It gives a little under
    a boot heel and springs back slowly, like something half-asleep.
idlemessages:
- Water collects in the hollow of a <ansi fg="cyan">moss</ansi>-filled step and holds
  there, perfectly still.
- The carved post shifts almost imperceptibly in a gust -- the lean
  at its base has gone a long way.
- The <ansi fg="cyan">steps</ansi> seem to absorb sound. Your footfall comes back
  muffled, softer than it should.
- A small beetle crosses the face of the carved post, following
  the groove of one of the three lines as though tracing a map.
