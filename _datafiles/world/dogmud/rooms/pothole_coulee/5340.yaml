roomid: 5340
zone: Pothole Coulee
title: Mossy Steps
description: >
  Broad stone steps climb the south face of the shrine mound, each tread
  thick with moss that has softened their edges to gentle curves. They are
  slick underfoot in the way of things that never fully dry -- the mound
  holds moisture the way old graves do, releasing it slowly into the air.
  At the turn of the steps a carved post leans outward at a worrying angle,
  its base undercut by seasons of runoff. The carving on the post is a
  repeated figure -- a circle crossed by three lines -- worn nearly flush
  with the stone by weather and by hands that have touched it in passing
  for longer than anyone now living can account for. The steppe opens wide
  to the south, and to the north the shrine waits above.
biome: land
