zone: Pothole Coulee
title: The Reliquary
description: >
  A small back-chamber, probably the oldest part of the structure.
  The wall-niches here are deeper than those in the nave and have been
  emptied with care -- no debris, no scatter of ash. Whatever stood
  in them was removed deliberately, taken or relocated. The ceiling
  is intact, which makes the room feel sealed, expectant. The
  flagstone floor is the thing that holds the eye. Several flags
  near the room's center have cracked and heaved upward as though
  something beneath them pushed, or settled unevenly, or simply
  shifted across a very long time. The disturbed section has been
  scratched clean of the grime that covers the rest of the floor --
  recently, or often, as though someone has been checking it. Press
  the stones or search the floor carefully and you might learn
  whether the disturbance has a cause that can be touched.
