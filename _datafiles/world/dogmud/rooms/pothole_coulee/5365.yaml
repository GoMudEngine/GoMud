roomid: 5365
zone: Pothole Coulee
title: Eagle's Reach
description: >
  The far lip of the bluff, and beyond it the world. The stone ends
  here at a clean edge, not crumbled or stepped but cut by long
  erosion into something almost deliberate, and past that edge there
  is nothing but sky and the deep quiet that follows a hard thing
  done. The coulee is behind you, the perch cleared, the overlook
  taken. From the lip the country beyond opens in every direction
  -- long pale distances, the broken watchtower on the next height a
  faint smudge against the horizon where a trail-stub runs off along
  the rim toward it. The wind here does not press. It lifts.
biome: cliffs
