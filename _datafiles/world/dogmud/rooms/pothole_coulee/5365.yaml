nouns:
  lip: The lip is the bluff's terminus, the clean edge where stone
    becomes sky. Standing at it you look out over a country that
    has no immediate claim on you. The rock here is slightly warm,
    catching afternoon light along its flat top, and the edge drops
    away in a long pale face below.
  sky: Past the lip the sky is enormous. Not merely big but present,
    a thing with weight and dimension, the kind of sky that only
    opens when there is nothing left to obstruct it. It is the
    reward at the end of the climb, and it is sufficient.
idlemessages:
- The <ansi fg="cyan">sky</ansi> past the <ansi fg="white">lip</ansi> is very large and very quiet. The wind
  lifts here rather than pushes, and carries nothing but altitude.
- On the horizon the next watch-post height is a dark smudge, a
  trail-stub running toward it and vanishing into uncertain ground.
- The silence here is the silence after effort -- not empty but
  earned, the kind that settles into a place once the hard thing
  is done.
- Light runs along the edge of the lip in a thin bright line and
  fades as the sun shifts. The stone holds the warmth a long while
  after.
