zone: Pothole Coulee
title: Stone Road
description: >
  A track worn smooth by generations of feet runs between the first outlying
  megaliths, the ground packed to near-clay hardness where pilgrims and
  neighbours alike have walked for longer than any living person can recall.
  The great stone circle looms ahead to the north, its tallest menhirs
  visible above the scrub like shoulders hunched against the wind. To either
  side the land opens into windblown grassland, thin and dry. The stones
  nearest the track are not carved -- or if they were, the weather has
  taken the detail -- but they lean with a deliberateness that suggests
  something more than settling. You are entering old ground.
