nouns:
  track: Worn to near-clay hardness by countless crossings, the track
    shows no single maker -- it belongs to all the feet that ever came
    this way and intends to outlast them all.
  megaliths: The first outlying stones stand at an irregular spacing
    that feels deliberate without being precise, like the spacing of
    old trees that remember when the land around them was young.
idlemessages:
- The <ansi fg="cyan">track</ansi> stretches north toward the ring, faint with old use.
- Wind moves through the scrub grass on both sides of the path and
  briefly the grass bends inward, toward the <ansi fg="cyan">track</ansi>, in unison.
- One of the nearer <ansi fg="cyan">megaliths</ansi> catches the light at an angle that
  makes it seem, for a moment, taller than it is.
