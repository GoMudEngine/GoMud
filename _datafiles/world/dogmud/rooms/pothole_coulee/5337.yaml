nouns:
  shadow: The tall stone's shadow is not quite where the sun would
    place it if the stone were perfectly vertical -- the slight lean
    of the menhir shifts it by a hand's breadth, enough to have been
    corrected for over the generations. Whether the lean was always
    there or has accumulated with time, nobody knows for certain.
  carvings: The carvings on the tall stone read from the ground up --
    earliest at the base, most recent at reach-height, the upper
    portion lost to weathering and distance. The narrative they tell
    is dense and detailed enough that the tradition-keeper spends time
    here most days, still learning it.
idlemessages:
- The <ansi fg="cyan">shadow</ansi> of the tall stone stretches north across the green
  and marks, briefly, the exact center of the mustering space.
- Running a hand along the lowest <ansi fg="cyan">carvings</ansi>, you feel the depth
  of the cuts -- these were made deliberately, meant to last, and
  they have.
- The wind at the base of the tall stone eddies in a tight circle,
  stirring dust and a few dry grass stems into a brief spiral before
  releasing them.
