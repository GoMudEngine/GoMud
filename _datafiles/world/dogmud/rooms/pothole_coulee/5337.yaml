roomid: 5337
zone: Pothole Coulee
title: The Tall Stone
description: >
  The tallest menhir of the ring stands here at the circle's northern
  focal point, rising perhaps five times the height of a standing person,
  its upper reaches tapering to a point that the wind has blunted but
  not entirely taken. Its shadow in the mornings falls northeast across
  the mustering green; in the afternoons it falls northwest across the
  fallen menhir beyond the circle's heart. The shadow-path it traces
  through the day is itself a kind of calendar, and the coulee folk have
  been reading it for as long as anyone has been recording. The carvings
  on this stone are the most complete in the ring -- spirals give way to
  figures give way to what reads as a continuous narrative running from
  ground level to as high as a person can reach, the rest lost to height
  and weather but the visible portion the most legible stone-record in
  the entire coulee.
