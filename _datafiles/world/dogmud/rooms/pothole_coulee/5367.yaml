zone: Pothole Coulee
title: Springhead Trail
description: >
  The faint game trail that leaves Clearwater Spring runs west along the
  foot of the risen rock, the foul air of the mire falling away behind with
  every step. Cold seep-water threads down the stone in bright little runs,
  feeding the spring back the way you came. Ahead the ground begins to open
  and lift, the green murk of the swamp giving over to bare pale stone and
  the first clean light. It is the kind of trail that knows where it is
  going even when you do not.
