nouns:
  trail: The track is faint but sure, worn by animals or by older feet,
    running west along the base of the rock away from the mire. It is
    narrow and unhurried and it does not double back.
  seep: Thin runs of cold seep-water thread down the pale stone, catching
    the light, feeding back toward the spring. They are clean -- the first
    clean water the south country offers.
idlemessages:
- The <ansi fg="cyan">seep</ansi> ticks down the rock in a dozen small voices, all of them
  saying the same patient thing.
- Behind you the mire-smell thins to nothing; ahead the air is only stone
  and cold water and distance.
