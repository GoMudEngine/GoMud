nouns:
  clearing: Open and mossy, the clearing holds a stillness that does not
    feel natural. Sound arrives slightly muffled here, as though the grove
    is listening harder than it lets on.
  circle: The meditation circle -- flat stones set flush with the earth in
    a ring no wider than a person lying outstretched. The center stone is
    worn concave, smooth from long use by those who knelt here to focus
    while the world worked against them.
idlemessages:
- The <ansi fg="cyan">trees</ansi> at the <ansi fg="cyan">clearing</ansi> edge lean together, and for a moment
  something almost resolves in the murmur.
- The moss at the center of the <ansi fg="cyan">circle</ansi> trembles faintly, though you feel
  no breeze.
- A spiral carved into one of the standing stones catches the light and
  seems, briefly, to move.
