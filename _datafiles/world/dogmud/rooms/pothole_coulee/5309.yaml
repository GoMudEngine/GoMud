roomid: 5309
zone: Pothole Coulee
title: Whispering Grove
description: >
  The trees thin and a clearing opens, floored with close-cropped moss and
  ringed by standing stones, each carved with a spiral that matches no script
  you have seen. At the clearing's center a circle of flat stones has been
  set in the earth with deliberate care -- the meditation circle of those who
  came before. The trees at the edge seem to lean in and murmur, syllables
  just shy of sense, as though they have been repeating something for so long
  it has worn smooth. The hum is quieter here, pressed down by the weight of
  what the clearing expects of anyone who stands at its center.
biome: forest
