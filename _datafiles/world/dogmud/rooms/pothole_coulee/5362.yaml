nouns:
  ground: The high stand is not flat by accident -- the stone has
    been worked here, chips cleared from the surface, a deliberate
    leveling that improved the footing and widened the field of
    fire. Someone prepared this position. The work is old but the
    intention is plain.
  angles: Every direction from this stand offers a clean line of
    sight. North to the overlook, south to the perch, down to the
    coulee floor on both flanks. A marksman here commands every
    approach to the upper bluff. The angles are the point.
idlemessages:
- There is nowhere to hide on this <ansi fg="white">ground</ansi>. The wind reminds you of
  it constantly, moving around you without obstruction in any
  direction.
- The <ansi fg="cyan">angles</ansi> are clean. You can see south to the rise and north to
  where the bluff crests. Nothing moves on either approach.
- A high thin sound crosses the stand -- wind finding the edge of
  something, a stone lip or a crack in the bluff face -- and fades.
- The stone underfoot is pale and featureless, warm from sun and
  scoured smooth by years of exposure.
