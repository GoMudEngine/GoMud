roomid: 5362
zone: Pothole Coulee
title: The High Stand
description: >
  Open ground, exposed on every side. The bluff-top widens here
  into a flat stretch with no cover and no feature to shelter behind
  -- nothing but pale stone and sky and wind working at you from
  every quarter. It is the kind of ground a marksman loves and a
  melee fighter hates: no walls, no shadows, no closing the distance
  without being seen and shot at the whole way. The angles from
  here are merciless. North and south both run straight and clear.
  Whatever holds this ground owns the approaches to both ends of
  the bluff, and it knows it.
biome: cliffs
