zone: Pothole Coulee
title: Farmstead's Edge
description: >
  The drystone wall comes to its far corner here, where the cultivated
  ground gives out entirely to windblown scrub and open sky. The grass
  inside the wall is kept; the grass outside is not, and the difference
  is stark at this boundary -- close-grazed earth on one side, knee-high
  stems and seedheads bending in the same wind that does not reach the
  yard. The wall itself is lower here at the corner, the topstones less
  carefully maintained, some shifted by frost over the winters. To the
  north, the land opens into rougher ground, and above the near rise
  the heads of distant standing stones are just visible against the
  sky -- old markers, older than the homestead by many lifetimes.
  You are still within the warmth and safety of the homestead's reach
  here, but the world beyond the wall has begun making its presence
  felt. The scrub to the north is country that asks something of you
  before it gives anything back.
