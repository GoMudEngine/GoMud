nouns:
  wall: The wall's far corner has settled and shifted slightly, a few
    topstones knocked free by frost and not yet reset. It still
    holds its line, but this end has been left to manage for itself.
  scrub: The scrub beyond the wall is open and windswept, a mix of
    dried grass and low thorny growth that shows no sign of tending.
    It stretches north toward the standing stones on the ridge.
idlemessages:
- The <ansi fg="yellow">scrub</ansi> north of the <ansi fg="yellow">wall</ansi> bends in a gust, then
  rights itself, indifferent to the direction.
- The heads of the standing stones to the north catch the light
  for a moment as the clouds shift, then fall back into shadow.
- At this corner of the wall the wind gets in from the north,
  carrying the smell of open ground and something older than grass.
