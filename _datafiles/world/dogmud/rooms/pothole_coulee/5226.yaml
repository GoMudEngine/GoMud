nouns:
  steps: The steps are flat slabs cut and stacked up the face of the
    bluff, climbing toward the shooting terraces above. The lower run is
    finished and firm; higher up the stair grows rough, raw blocks wedged
    and waiting where the work has not yet caught up. A snap of bowstrings
    drifts down from the terraces above.
  bolts: Spent practice bolts lie strewn in the dirt at the foot of the
    climb, gathered by the handful and dropped again -- shafts split,
    fletching frayed, iron points battered dull against the butts above.
    They are the leavings of long hours at the mark, swept down off the
    terraces where folk drill at their aim.
