roomid: 5226
zone: Pothole Coulee
title: Bluff Steps
description: >
  Rough steps climb the bluff to the north, cut and stacked from flat
  slabs, rising toward terraces where the wind carries a faint snap of
  loosed strings. Spent practice bolts lie scattered in the dirt at the
  foot of the climb, fletching frayed and points gone dull. The upper
  steps are still being set, raw stone wedged and waiting where the stair
  runs out.
