nouns:
  track: Wheel ruts run in two parallel channels the length of the slope,
    worn deep enough that grass has rooted in their centers. The track
    knows where it is going and has for a long time.
  ruts: The ruts are old -- deepened over many seasons by cartloads
    of hay and grain and timber. Grass grows between them in a low
    green ridge, undisturbed by recent wheels.
idlemessages:
- A breeze moves up the <ansi fg="yellow">track</ansi> from town, carrying the smell of cut
  grass and warm earth.
- The <ansi fg="yellow">ruts</ansi> here are soft with summer growth, the cartway quiet
  between loads.
- The rooflines of the farmstead are close now, solid and unchanged
  against the afternoon sky.
