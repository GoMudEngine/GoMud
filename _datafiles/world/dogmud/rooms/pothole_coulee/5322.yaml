roomid: 5322
zone: Pothole Coulee
title: The Cartway
description: >
  A cleared track climbs the low rise from the edge of town toward the
  farmstead on the hill, its deep grass-grown ruts marking seasons of
  cartloads hauled up this same slope. The verge has been freshly
  scythed back to shoulder width, the cut grass lying pale and fragrant
  in the sun. Ahead, the drystone wall of the homestead comes into view
  above the rise, and beyond it the thatched rooflines of the longhouse
  and barn sit solid against the sky. The track itself is soft going --
  packed earth giving slightly underfoot, the kind of road that has been
  walked so long it has worn itself comfortable.
biome: farmland
