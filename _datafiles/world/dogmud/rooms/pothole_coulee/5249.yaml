roomid: 5249
zone: Pothole Coulee
title: Lower Talus
description: >
  The forge path drops you off the packed slag and onto loose stone, and
  the difference is immediate. The scree shifts under every step, small
  plates of grey basalt riding on one another with a sound like cracking
  knuckles, the whole talus slope alive and unreliable. Above, the smithy
  ledge is a black line against the pale sky; below, the slope steepens
  and the coulee floor is still a long way down. Wind moves in gusts across
  the open face, carrying grit and the faint iron smell of ore baking in
  the sun. Someone has been through here already -- the scavenger's leavings
  show as a tumbled pile at the base of a frost-heaved slab, old bones of
  packs and bent tools, picked over and left to weather. There is no
  comfortable footing anywhere on this face. West runs deeper into the scree;
  south, the slope cuts down to where the old cuts begin.
