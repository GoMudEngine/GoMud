nouns:
  lantern: The Drowned Lantern that names the house is no ordinary lamp
    but a whole diving-bell, salvaged green and dented from the deep and
    hung from the central beam on iron chain. A flame burns caged in its
    throat, and the bronze throws the light back down strange and watery,
    so the whole room seems lit from under a pond. Folk say the bell came
    up from a wreck older than the town and chose to keep on shining.
  tables: The long tables are the inn's whole seating, meant for
    strangers to share elbows and a jug whether they came in together or
    not. Their tops are scrubbed soft and pale, ringed and ringed again by
    set-down cups, carved here and there with idle initials and a few
    older marks nobody can read. By evening every bench will be full; for
    now they wait, patient and worn.
  fire: A peat fire burns low in the stone hearth, more glow than flame,
    the cut bricks of earth crumbling slowly to ash. It gives off that
    particular brown-sweet smell of burning bog, and a steady warmth that
    fills the room without ever roaring. Someone keeps it fed -- the
    basket of dried peat beside the hearth is freshly stacked.
