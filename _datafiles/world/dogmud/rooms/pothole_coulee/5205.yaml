zone: Pothole Coulee
title: The Drowned Lantern
description: >
  The inn's common room wraps you in warmth the moment you step in out of
  the coulee air. Overhead the namesake hangs and glows: a salvaged
  diving-bell of green-tarnished bronze, hauled up from some sunk wreck
  and re-rigged as a great lantern, its caged flame throwing a soft
  underwater light across the room. Long shared tables run the length of
  the floor, their tops scrubbed pale and scarred with the rings of a
  thousand set-down cups. A peat fire mutters in the hearth, breathing out
  that low brown smell of burning earth, and the whole place has the
  settled, well-used hush of a town's evening heart waiting for evening to
  come. Stairs climb up into the dark toward the sleeping loft; the lane
  lies back out east.
