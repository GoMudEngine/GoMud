nouns:
  floor: The stone floor is smooth and pale, worn by old water into a
    nearly flat surface that tilts perhaps two degrees south. It is clean
    of debris -- anything dropped here would be immediately visible, and
    any sound made here would ring off it and find the walls in every
    direction.
  slot: The canyon here is a box with two long axes -- south toward the
    narrows, north toward the bend. Both directions are open and clear,
    which means you are visible from both directions simultaneously. The
    slot is a shooting gallery and you are standing in the middle of it.
idlemessages:
- A loose stone somewhere in the canyon produces a single tap. The
  <ansi fg="cyan">floor</ansi> sends back five versions of it from five different angles.
- The raider shifts position -- two steps left -- and the sound of it
  fills the chamber entirely before dying away.
- The <ansi fg="cyan">slot</ansi> carries a breath of air from the south, cool and clean,
  moving fast through the narrows and dispersing here.
- Your own shadow pools at your feet in the open floor, nowhere to go,
  nothing to hide behind.
