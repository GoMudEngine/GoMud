zone: Pothole Coulee
title: The Sounding Floor
description: >
  The canyon opens here into a wider chamber and the floor levels out
  to a stretch of bare pale stone worn smooth by the passage of water
  that no longer comes. Every sound in this chamber finds the walls and
  comes back changed -- a single footstep returns as four or five, the
  source confused, the direction scrambled. The sightline south through
  the narrows is open and long: the mouth of the canyon is a bright
  slot at the end of it, and anything entering from that direction will
  be visible the moment they clear the pinch. The sightline north is
  nearly as long, reaching toward the bend where the slot curves and
  the rockfall starts. A raider holds the center of this floor with the
  relaxed authority of someone who has already measured every angle. The
  chamber offers no good cover -- only the walls themselves, and reaching
  them means crossing open ground that carries every sound you make.
