nouns:
  collapse: The mass of fallen basalt that swallowed the back half of the
    prospect cut -- plates stacked on plates, grey and cold, the weight
    of the hill carried on the broken backs of the timbers that failed
    to hold it. The cut runs in only so far as the rock allows, and no
    further. Past the heap is silence and dark and no air.
  timbers: The shoring frames that were supposed to hold the cut open,
    each one snapped at the knee and shoved inward by the weight of the
    rock above. They jut from the collapse at useless angles, ends
    splintered bright, the fresh wood pale against the grey stone. They
    gave in order, one after another, and each failure made the next
    certain.
  hand: A hand reaching from the rubble, palm upward, fingers loosely
    curled, the knuckles grey with stone dust. Beside it a shoulder, and
    the back of a head. The chest underneath the heap rises and falls in
    a slow, shallow rhythm. Whoever is in there is alive, for now, and
    they cannot dig themselves out.
  cut: The remnant of the prospect cut, the open portion that survived
    the collapse -- a low tunnel driven into the hillside and then
    immediately ended. The walls are scored with pick marks, dark and
    damp, and the floor is covered in broken chips. The rest of the cut
    is behind the rubble, gone.
