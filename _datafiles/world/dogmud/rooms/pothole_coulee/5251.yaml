title: Collapsed Cut
description: >
  An old prospect cut has been driven into the hillside here and then given
  up to the mountain. The shoring timbers that held the walls apart have
  snapped and pivoted inward, and the ceiling came down behind them -- a
  grey mass of broken basalt plates heaped from wall to wall, the cut
  swallowed to half its depth and sealed. The air smells of clay and fresh
  stone, the cold mineral breath of something that has never seen light. At
  the near edge of the collapse, where the roof ran out of room to fall, a
  hand reaches from under the rubble, palm up, still. Beside it a shoulder,
  and the back of a head -- someone was in the cut when it closed, and the
  mountain did not quite finish the job. The chest moves. Barely, but it
  moves. Pried timber ends jut from the heap at odd angles, each one a
  failure in the making of this trap. North leads back up to the talus;
  west runs along the base of the slope toward a pocket of richer rubble.
