zone: Pothole Coulee
title: Deep Vein
description: >
  Past the den the mine opens one last time into a working face where
  the deepest gallery was cut before the ore ran out -- or rather,
  before it ran in, because this is where it ran. A broad seam of
  basalt-iron bisects the far wall at a diagonal, the vein dark and
  heavy and thick with locked mineral, glinting in a dozen shades
  where the crystals in it catch light. The picks left it half-won
  -- tools are still rusted into cracks where the last crew dropped
  them and did not come back for them. The ore is rich enough to see
  plain and dense enough to feel through the boot where it threads
  the floor. Beyond the working face the seam runs on into unbroken
  rock heading west, the vein continuing through stone that no pick
  has touched yet, into ground that waits on whoever drives the next
  gallery to meet it. The den lies back east; west is solid rock,
  for now.
