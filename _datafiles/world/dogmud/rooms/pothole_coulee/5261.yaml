nouns:
  vein: The broad seam of basalt-iron running diagonally across the
    working face, dark and dense and spangled with mineral crystal
    where the picks broke the surface open. It is thick -- a hand
    spread across it covers less than a third of its width -- and
    the ore quality shows at a glance in the weight of the color.
    The working face is only the near edge of it; the seam runs
    on west into untouched rock as far as any tool has probed.
  seam: The same mineral deposit followed from the first strike
    through the rock to this, the deepest gallery cut. It threads
    the floor and climbs the wall and exits through the ceiling
    to the west, going on into ground no one has opened yet. The
    rusted tools still wedged in its cracks are the record of the
    last crew to work it; the work they left unfinished is plain.
idlemessages:
- The <ansi fg="itemname">vein</ansi> catches whatever faint light reaches it and throws back a slow glitter, color shifting as the shadows move.
- Somewhere in the unbroken rock west of the working face the <ansi fg="itemname">seam</ansi> pops once -- thermal stress, or pressure, or the mountain settling into itself.
