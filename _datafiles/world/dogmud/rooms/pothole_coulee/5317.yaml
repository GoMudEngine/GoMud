roomid: 5317
zone: Pothole Coulee
title: Floating Stone
description: >
  This slab is wider than the others -- wide enough to walk the length of
  without reaching the edge, if you do not look down. It floats free of
  everything, rotating at a pace so gradual you only notice by watching
  the stars at the edge of the sky turn past the horizon. There is nothing
  beneath it. No chain, no column, no logic. The slab simply is here,
  adrift at height, and being here requires a particular quality of trust
  in the ground to remain ground. The stars that wheel past the edge as
  the slab turns are not stars you know the names of.
