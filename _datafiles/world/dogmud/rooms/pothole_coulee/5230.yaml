roomid: 5230
zone: Pothole Coulee
title: Yard Overlook
description: >
  A few worn steps cut into the canyon wall lift you clear of the yard
  dust to a shelf of bare rock. From here the whole wash lies open to the
  east, a pale gravel river climbing away between rising stone shoulders.
  Far up at its head, on a bluff that crowds the canyon shut, stands the
  ruin of an old watchtower -- the Pothole Watch, its crown broken open
  to the sky, leaning against the light. Whatever holds that ground now,
  it is a long hard climb from this safe step. The circle lies west.
