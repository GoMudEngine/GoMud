nouns:
  tower: The Pothole Watch -- a squat ruined watchtower far up the canyon,
    set on a bluff where the walls draw in tight. Its top is broken open
    and one flank has sloughed away, but it still commands the whole wash.
    Something keeps that high ground. The climb to it looks long and mean.
  watchtower: The same old ruin at the canyon's head, the Pothole Watch.
    From this distance it is a grey broken tooth against the sky, but a
    watcher up there would see every soul moving on the wash below.
  wash: A wide pale ribbon of gravel climbing east up the canyon, swept
    bare by floodwater that comes only in the wet. From this shelf you can
    read its whole length, rising step by step toward the distant tower.
  bluff: A shoulder of stone where the canyon narrows to a throat, lifting
    the ruined tower above the wash. Nothing reaches that height without a
    hard scramble up the climbing ground.
idlemessages:
