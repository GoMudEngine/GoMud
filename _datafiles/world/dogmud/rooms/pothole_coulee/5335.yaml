nouns:
  green: The mustering green is not quite level -- the southwest corner
    rises a hand's breadth above the rest, high enough to stand on and
    be seen. Over time this small elevation has become the speaking-place,
    the spot where announcements are made and arguments are put to the
    group.
  ash: The ring of fire-blackened stones at the green's center holds
    ash from the most recent gathering -- not yet rained away, which
    means it was not long ago. The char smell is faint but present,
    mixing with the scrub and the cold wind.
idlemessages:
- The bare patches on the <ansi fg="cyan">green</ansi> where stalls have stood so
  often are shaped by habit -- each one exactly the size of a thing
  people have brought here many times.
- Wind crosses the open <ansi fg="cyan">green</ansi> without obstruction and stirs
  the cold <ansi fg="cyan">ash</ansi> in the central fire ring into a brief small spiral.
- The ground here holds the sound of the stone circle differently --
  voices would carry clearly across this space.
