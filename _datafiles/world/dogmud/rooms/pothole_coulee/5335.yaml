title: The Mustering Green
description: >
  Inside the northern arc of the stone ring, a flat grassy green opens
  up -- trampled turf worn short and uneven by generations of gatherings.
  This is where the coulee folk come together for moots and seasonal
  markets, for the announcing of births and the settling of disputes, for
  the communal meals that happen when the harvest is in and there is
  something to celebrate. The evidence of those gatherings is everywhere:
  cold ash from old fires in a ring of blackened stones, the ghost of a
  worn path from the circle's heart south toward the track, bare patches
  where stalls or tents have stood often enough to discourage the grass.
  Empty now, the green holds the quiet of a place that knows it will be
  full again before long.
