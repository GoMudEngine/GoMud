zone: Pothole Coulee
title: The Stone Gallery
description: >
  The drift gives way to a natural gallery where the basalt columns
  failed and a broad void opened in the rock -- wide enough to lose
  the walls in the dark, the ceiling higher here than anywhere else
  in the mine, lost entirely above whatever light you carry. The
  gallery has a floor of loose fractured column-sections, shed from
  the ceiling over time, rough and unstable underfoot. And it has a
  presence. Something large breathes in the dark ahead -- you cannot
  see it but the gallery relays every sound as if it were a bell, and
  what you hear west is not dripping water and settling stone. It is
  slow and deep and deliberate, the respiration of something that
  has made this space its own for a long time. The footing will not
  let you move quietly and the dark will not let you see past twenty
  feet. The gallery continues west; the lower drift lies back east.
