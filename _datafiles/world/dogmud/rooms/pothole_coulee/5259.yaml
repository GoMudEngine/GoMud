nouns:
  gallery: The broad natural void opened in the basalt, wider than
    any worked space in the mine, high enough at the center that the
    ceiling is simply gone into the dark above. It amplifies every
    sound and sends it back -- a quality that cuts both ways, because
    whatever occupies the west end of it has the same advantage and
    has been listening to this ground far longer than you have.
  dark: The absolute black of the gallery beyond the edge of any
    light you carry -- flat walls swallowed, ceiling gone, the
    source of the breathing ahead unlocatable by sight. It is not
    emptiness. Something in the dark knows exactly where you are.
idlemessages:
- The <ansi fg="itemname">gallery</ansi> catches a sound from the west -- slow, deep, and patient -- and sends it back to you changed into something larger.
- In the <ansi fg="itemname">dark</ansi> ahead something shifts its weight and the fractured floor transmits it as a low grinding vibration under your feet.
