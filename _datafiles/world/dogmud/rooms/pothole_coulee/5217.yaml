roomid: 5217
zone: Pothole Coulee
title: North Shore Overlook
description: >
  The crag juts out over the water at the bowl's north edge, and from its
  worn lip the pool shows clearest of all -- straight down into the dark,
  where the deep light lies waiting far below. Up here the clatter of the
  houses falls away, and there is only wind and water and the slow
  patience of the depths. Folk come to this crag to sit and look and
  think, and the polished stone says many have come before. The light does
  not call to you, exactly. It simply waits, the way deep things do, and
  you find yourself loath to break the quiet.
biome: cliffs
