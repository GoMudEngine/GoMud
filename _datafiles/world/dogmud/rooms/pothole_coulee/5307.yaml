roomid: 5307
zone: Pothole Coulee
title: The High Rim
description: >
  The ruin opens at its northern face and you step out onto the coulee
  rim, the tower's broken wall at your back and the open coulee dropping
  away below. Wind comes up off the rock in slow rolling surges here,
  carrying the smell of sage and distance, and the sky is very large --
  the kind of sky that makes you aware of how much of the world there is.
  To the north a grove of pale-barked trees crowds the rim's edge, their
  canopy grown close and tangled, and even at this distance the air
  between their trunks looks different from ordinary shadow -- thicker,
  quieter, the wrong shade. The sanctuary ends here. Whatever waits in
  that grove, it waits just past its edge.
