roomid: 5260
zone: Pothole Coulee
title: The Den
description: >
  The gallery closes into a wide chamber that stinks of something
  animal -- musk and old meat and the iron trace of blood dried into
  rock. The floor has been worked over: loose stone pushed to the
  walls in rough piles, the center swept clean by dragging and
  turning and the long slow occupation of a body too heavy for the
  rock to shrug off. Bones are strewn across it, cracked and gnawed
  flat by a jaw that treats basalt as a tenderizer. Not the bones of
  prey alone -- there are tool hafts in the litter, a boot heel,
  the flat disc of a helmet dome with the bowl bitten in. Whatever
  holds this den has eaten things that arrived here armed and certain.
  The den opens west toward something glinting in the deep rock; the
  gallery lies back east and is the only way out if the den's keeper
  is away.
