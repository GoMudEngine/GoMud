idlemessages:
- The stink of the <ansi fg="itemname">den</ansi> thickens when the air stirs -- musk and old blood and something underneath that has no name.
- One of the <ansi fg="itemname">bones</ansi> rocks under a shifting column section and cracks against the wall, and the sound of it travels back through the gallery.
