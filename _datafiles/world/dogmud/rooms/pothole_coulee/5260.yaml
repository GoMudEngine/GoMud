nouns:
  den: The fouled inner chamber, swept clear at the center by the
    body that sleeps and turns and sleeps here, walls ringed with
    pushed rubble and the litter of many meals. It has the shape of
    a lair -- a place organized by instinct over a long time into
    something that serves the occupant perfectly and everything else
    not at all.
  bones: Cracked and gnawed across the den floor, the picked remains
    of the beast's meals. Most are animal -- the long bones of
    something hunted in the upper workings. But not all. A tool
    haft, a boot heel, a helmet dome with the bowl bitten through --
    these were carried in by things that walked upright and did not
    walk out again.
