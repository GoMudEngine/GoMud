nouns:
  track: The track is an old farm road run north over the rise, its
    wheel-ruts sunk deep and softened under a fur of grass, plain to the
    eye where nothing else marks the steppe. Someone has lately scythed
    the brush back along the near stretch of it, opening the way; past
    that the grass closes in again, unworked.
  stone: A standing stone lifts its weathered head over the crest of the
    rise, grey and lichen-spotted, carved once with marks the years have
    nearly worn smooth. From here you cannot make them out. It has the
    look of something set to be read, by anyone who climbs near enough to
    try.
