roomid: 5225
zone: Pothole Coulee
title: Old Field Track
description: >
  An old field track runs north over the rise, its cart ruts grown over
  with grass but still plain in the dirt. Just beyond the crest a standing
  stone shows its weathered head against the sky, too far yet to read. The
  track has been cleared of brush a little way on, the cut ends raw where
  the work has not reached the stone.
biome: farmland
