zone: Pothole Coulee
title: Drowned Thicket
description: >
  The thicket here is half-drowned, black water standing at the height
  of a man's knee among the stems, the branches overhead clawing
  together into a low canopy that shuts out what grey light the swamp
  allows. Dead wood leans against dead wood. Among the roots, where
  the tangle of old growth meets the waterline, something has caught
  -- a darker shape, still, threaded through by pale roots that have
  grown around and through it over the slow years. The water between
  the stems is deep and does not move.
biome: swamp
