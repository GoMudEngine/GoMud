nouns:
  thicket: A close press of dead growth, stems and branches locked
    together, the whole mass leaning over the standing water below.
    The footing between them is treacherous -- root, mud, and soft
    rot where solid ground ought to be.
  roots: Old root-mass, pale where the bark has gone, threaded
    through by newer growth that has had years to work. Something is
    caught there, held close to the waterline where the roots are
    thickest.
  branches: Bare and clawing, interlocked overhead into a canopy
    that lets nothing through cleanly. They creak in no wind, just
    the slow settlement of dead wood under its own weight.
idlemessages:
- Something moves in the water between the <ansi fg="itemname">roots</ansi>,
  slow and without ripple.
- The <ansi fg="itemname">branches</ansi> shift with a dry creak, though
  there is no wind here.
