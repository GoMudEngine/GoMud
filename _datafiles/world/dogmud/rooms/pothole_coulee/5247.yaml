roomid: 5247
zone: Pothole Coulee
title: Quench Shed
description: >
  A low shed roofed with overlapping split shakes stretches behind the
  main smithy, its ceiling close enough to make a tall person stoop.
  A second small forge occupies the near corner, modest and workmanlike
  -- less heat than the main, just enough for learning hands that do
  not yet need the full bed. Beside it a deep quench-trough of dark
  water runs the length of the back wall, iron-stained to a rust-brown
  at the waterline. A plain workbench of heavy plank sits between them,
  its surface gouged by chisels and marked by hammer-corners, every
  scar an old lesson. The air smells of wet iron and old steam. The
  smithy proper is to the south; a door leads west into the slope.
biome: fort
