nouns:
  trough: A long stone-lined trough sunk into the floor, filled with
    dark water that carries the color of iron rust. When hot metal
    goes in, the hiss and steam fill the whole shed. The waterline is
    stained a deep rust-brown at the iron mark.
  workbench: A heavy plank bench bolted to the shed wall, its top
    gouged and scorched and hammer-marked by years of apprentice work.
    No one bothers to plane it smooth anymore -- the scars are part of
    it now.
idlemessages:
- The surface of the <ansi fg="itemname">trough</ansi> shifts faintly, stirred by some unseen drip.
- The shed timbers tick with heat, expanding in the warmth off the small <ansi fg="itemname">forge</ansi>.
