nouns:
  marker: The boundary stone reads as a marker more than a wall -- a single
    upright slab planted at the lip of the safe ground. Whoever set it
    meant it as a promise -- this far, the coulee keeps you. No further.
  stone: A weathered upright slab, grey and lichen-spotted, its carved mark
    rubbed nearly featureless by wind and reaching hands. It marks the last
    safe footing before the open wash.
  edge: The exact lip where swept training ground gives way to raw canyon
    floor. One side is kept; the other is not. You can feel the difference
    in the air, the way a held breath feels different from a let one.
  wash: The gravel wash falls away east past the marker, climbing on toward
    the distant tower through ground no one here will promise to keep you
    safe in. Out there things fight back, and they do not pull the blow.
idlemessages:
- Wind off the open <ansi fg="itemname">wash</ansi> carries up cold and uncaring past the boundary stone.
