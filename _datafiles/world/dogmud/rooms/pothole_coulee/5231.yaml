roomid: 5231
zone: Pothole Coulee
title: The Last Safe Step
description: >
  The shelf narrows to a last firm ledge before the ground tips down into
  the open wash. A weathered boundary stone stands planted at the lip,
  its old carved mark worn nearly smooth, set here by whoever first claimed
  this coulee for safe ground. Behind you the yard breathes easy -- swept
  earth, blunted arms, the quiet of practice. Ahead the gravel falls away
  east into country no drillmaster keeps. Out there the wash is held by
  folk who fight back in earnest, and nothing wrapped in leather will
  answer for you. This is the edge. Past it, you are on your own.
