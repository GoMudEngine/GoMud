title: The Thinnest Place
description: >
  The Folding stands wide open here. The gap is not a gap in the stone --
  it is a gap in the world, a place where whatever separates the ordinary
  from the unordinary has worn through entirely. Light passes through it
  in colors that have no names. Air moves through it in directions that
  air does not move. The place is barely holding itself together -- the
  ground vibrates underfoot with the effort of remaining ground, and the
  edges of things fray and reseal and fray again in constant stuttering
  negotiation with stability. Something old has claimed this thinness for
  itself. You cannot see it directly, but the place knows it is here --
  the gap leans toward it, the fraying accelerates near it, the air
  draws back from where it rests.
