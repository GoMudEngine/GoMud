nouns:
  vault: The vault's visible walls taper toward one another in a
    slight inward lean, as though the whole chamber was designed to
    resist pressure from outside. It has worked. The stonework is
    intact under the accumulated earth. The original ceiling, where
    it shows above the soil line, is a single continuous arch.
  stonework: The crystalline grain in the stone catches light
    unexpectedly -- a flicker at the edge of vision when you move
    the angle of your head. The material is similar to the rest of
    the shrine's stone but not identical. Whoever quarried this knew
    what they were looking for.
idlemessages:
- The silence in the <ansi fg="cyan">vault</ansi> is complete. Sound stops at the
  threshold and does not resume.
- The <ansi fg="cyan">stonework</ansi> flickers faintly at the edge of sight as
  you shift your weight -- the grain catching, releasing.
- A thin trickle of earth slides down the fill slope and settles
  with a sound like a whisper.
- The air here is unchanged by the seasons. It has no smell.
  It is simply old.
