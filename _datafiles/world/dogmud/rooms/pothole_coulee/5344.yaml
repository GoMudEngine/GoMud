zone: Pothole Coulee
title: Buried Vault
description: >
  The passage narrows and the ceiling drops before opening into a
  chamber that is more earth than stone now -- fallen soil has filled
  the vault to roughly waist height at its deepest corner, leaving
  only a cramped corridor of open air along the east wall. What
  remains visible of the original stonework is the oldest in the
  shrine. The cutting is different here, tighter, the joints between
  blocks so fine that the seams are hard to trace by touch. The
  builder of this vault was not the builder of the hall above. The
  blocks are also older -- their surface has a texture that the
  upper shrine lacks, a faint crystalline grain that catches light
  at angles the eye does not expect. The vault goes no further west.
  Whatever was stored or sealed here is either still present beneath
  the fallen earth, or was removed so long ago that the earth has
  had centuries to forget the shape of its absence.
