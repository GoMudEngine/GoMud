zone: Pothole Coulee
title: The Last Worked Stone
description: >
  The dressed ground of the smithy gives out here at a single boundary-
  stone, a dressed block of dark basalt set firm and deliberate at the
  edge of the safe ground -- the last mark of someone's deliberate
  work before the talus goes loose and unworked again. Beyond the
  stone the slope falls away sharply, raw and unstable, shale plates
  tilted at angles that offer nothing solid. Further down the slope
  to the west, a low dark opening is cut into the hillside, timbers
  shoring its mouth -- a mine entrance, unlit, waiting. This ground
  is still held and safe, but the stone is a plain notice: past here,
  you are on your own.
