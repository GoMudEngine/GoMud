nouns:
  stone: A single block of dressed basalt set deep and level into the
    top of the slope, its faces cut square and its top worn smooth by
    hands and weather. It marks the edge of the smithy's kept ground.
    Past it, no one has done the work of making the slope safe.
  slope: Below the boundary-stone the talus falls away in loose,
    tilted shale, nothing cut or packed or shored. A foot placed wrong
    will shift three plates and you will go down fast. The mine mouth
    is visible lower on the slope to the west, its timbers the only
    worked thing down there.
idlemessages:
- A loose pebble cracks free on the <ansi fg="itemname">slope</ansi> below and skitters down out of sight.
