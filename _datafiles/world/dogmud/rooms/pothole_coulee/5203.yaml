nouns:
  square: The open square is the one flat, gathered place in a town
    otherwise pitched against the coulee walls. It is where folk drift to
    trade a rumor, settle an argument, or simply be seen. Something about
    the worn ground tells you feet have stood here, waiting and talking,
    far longer than the houses around it have stood.
  notice-post: &noticepost A stout post of grey driftwood stands at the
    square's center, its broad face crusted with notices nailed one atop
    another. The crier pins the fresh word here -- work wanted, strangers
    expected, a warning or a wedding -- and nobody troubles to pull the old
    ones, so the layers go down years deep. You could read the town's whole
    recent memory off it if you had the patience to peel.
  post: *noticepost
  notice: *noticepost
  notices: *noticepost
  slabs: The square is floored in great slabs of basalt, flood-laid and
    fitted close, their surfaces buffed to a dull shine by generations of
    passing feet. Rain pools in the shallow dishes worn into the busiest of
    them. Where the slabs meet, tough little weeds have found the seams and
    made a home.
