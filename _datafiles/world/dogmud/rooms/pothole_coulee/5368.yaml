roomid: 5368
zone: Pothole Coulee
title: The South Rim
description: >
  The trail tops a low rise and the whole southern edge of the coulee opens
  out, a long rim of pale broken rock dividing the wet country behind from
  the dry country ahead. To the south the ground falls away into haze; to
  the north the coulee's bowl holds its tangle of mire and stone and stand.
  The wind moves freely here for the first time in a long while, carrying
  grass-smell from somewhere west. Two waters rise along this rim within an
  easy walk of each other, though few have ever had cause to walk between
  them. You are walking it now.
biome: land
