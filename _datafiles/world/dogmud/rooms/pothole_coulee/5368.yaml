nouns:
  rim: The southern rim of the coulee, a long spine of weathered pale rock
    that holds the wet country apart from the dry. It runs east and west
    further than the eye follows, low and broken and old.
  wind: It comes off the open south with nothing to break it, steady and
    clean, carrying the smell of grass from country the coulee folk rarely
    cross into.
idlemessages:
- The <ansi fg="cyan">wind</ansi> crosses the <ansi fg="cyan">rim</ansi> in a long unbroken push, bending the dry
  grass all one way.
- From up here the mire and the steppe look like two different worlds with
  a single thin trail stitched between them.
