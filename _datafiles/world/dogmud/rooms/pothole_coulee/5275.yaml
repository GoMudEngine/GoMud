roomid: 5275
zone: Pothole Coulee
title: Fenrot Approach
description: >
  The path narrows between stands of dead trees, their bark peeled back
  to grey wood, their roots sucking at water the color of old bruises.
  An oily film rides the surface of every pool, catching light in sick
  rainbows that die before they reach the eye. The air here has
  substance -- rot-stink thick enough to taste, sweet in a way that
  turns the stomach. South the land flattens and the trees give out,
  and the poison swamp opens wide.
biome: swamp
