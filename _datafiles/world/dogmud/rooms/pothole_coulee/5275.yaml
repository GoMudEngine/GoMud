nouns:
  trees: Grey and bare, stripped of bark by something slow and wet.
    They lean at angles the living wood would not allow, as though the
    swamp has been pulling them down for years and has nearly won.
  water: Every low hollow holds a pool of it, still and the color of
    an old bruise, with an oily film riding the surface that catches
    the light wrong.
idlemessages:
- Something drips in the <ansi fg="itemname">trees</ansi> with a sound
  too wet and deliberate for rain.
- The <ansi fg="itemname">water</ansi> in the nearest pool shifts, slow
  and thick, though nothing visible disturbs it.
