roomid: 5313
zone: Pothole Coulee
title: Grove Heart
description: >
  The trees stop at the edge of a rough circle of old stones, each one
  waist-high and carved with the same close-packed spirals that appear
  throughout the grove, though here they are deeper, cut by someone who
  meant to make them permanent. At the center of the ring the ground is
  bare packed earth, worn flat and hard by long practice. This is where the
  adepts came to test their focus -- to sit or stand in the grove's heart
  while the thinning world worked at the edges of their concentration, and
  hold. The silence here is not restful. Thoughts fray at their edges, and
  the familiar sense of where you stand in the world loosens a degree more
  with each passing breath.
