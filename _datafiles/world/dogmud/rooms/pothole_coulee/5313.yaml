nouns:
  stones: Rough and waist-high, the stones of the ring are older than the
    grove's other carvings. Their spirals are deep-cut and filled with a
    dark mineral residue -- old incense, possibly, or something that burned
    here a very long time ago.
  center: The bare patch of packed earth at the ring's heart. Something about
    standing on it makes the edges of your thoughts feel slightly less
    anchored, like a knot worked loose but not yet untied.
idlemessages:
- The carved <ansi fg="cyan">stones</ansi> seem to hum in sympathy with the grove's note, a
  resonance felt in the teeth.
- At the <ansi fg="cyan">center</ansi> of the ring, the air shivers once and stills.
- A thought arrives fully formed and not quite yours, then dissolves before
  you can examine it.
