zone: Pothole Coulee
title: Brokenground
description: >
  The steppe buckles here into a maze of shallow draws choked with
  thornbrush, the ground heaved up and dropped in rough plates. Cover
  is everywhere — ledges too low to stand under, brush too thick to
  push through cleanly. Something moves through the draws with
  purpose. Tracks cut the clay in long, unhurried strides.
