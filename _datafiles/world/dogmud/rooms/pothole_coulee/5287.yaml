nouns:
  draws: Shallow gullies cut by old runoff, choked now with thornbrush
    and shadowed enough to hide something large.
  thornbrush: Stiff, grey-thorned stems that tear at cloth and skin with
    equal indifference.
  tracks: Long strides pressed into the clay — a single animal, big,
    and not hurrying.
idlemessages:
- Something shifts in the draws below — a sound between a step and
  a slide, then nothing.
- The thornbrush rattles once, sharply, with no wind to account for it.
