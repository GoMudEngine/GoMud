roomid: 5200
zone: Pothole Coulee
title: The Awakening Pool
description: >
  The coulee floor opens here into a wide stone bowl, its walls worn
  smooth by ancient floods. Dark water fills the pool nearly to the
  rim, flat and still as poured glass -- no ripple, no current, no
  sound. Far below the surface, something glows with pale blue-green
  light, steady and deep, like a coal that never burns out. The basalt
  rim is polished where countless hands have gripped it. This is where
  the Opened come back to themselves.
biome: water
