nouns:
  pool: Dark water fills the bowl to within a hand-span of the basalt
    rim, unmoving in a way that running water never is. The cold comes
    off it in waves even in the midday heat. Whatever feeds this pool
    flows in and out somewhere far below the surface, unseen.
  water: Up close the water is clearer than it has any right to be --
    you can see your own face in it, and behind your face, far down,
    the steady blue-green glow. Looking into it for long feels less
    like looking at a thing and more like being looked back at.
  basalt: The stone walls of the bowl are dark grey-black, water-polished
    to a near-gloss. Ancient floods carved this hollow out of the coulee
    floor over ages, and the same currents smoothed every sharp edge until
    the rock feels almost soft under the hand. Old scratch-marks near the
    rim suggest the place has served as an anchor for generations.
  light: Something gives off pale blue-green light from deep in the pool,
    too far down to make out a source. It does not flicker the way
    firelight does -- it simply is, steady and cold and patient. You
    cannot tell if it is stone, water, or something living down there.
