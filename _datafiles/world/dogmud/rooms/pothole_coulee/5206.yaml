roomid: 5206
zone: Pothole Coulee
title: Lantern Sleeping Loft
description: >
  Up under the inn's roof the sleeping loft lies low and close, the heavy
  beams near enough overhead to brush with a raised hand. Rows of straw
  ticks rest along the floor, plumped and turned and laid with thick
  folded wool blankets, and the warm peat-smell of the common room seeps up
  faintly through the boards to settle here as something softer. The light
  is dim and gold and kind, and the only sound is the slow tick of the
  cooling roof and your own breathing. After the long open coulee and the
  noise below, every line of this room is an argument for lying down. Your
  legs feel the day all at once, and the nearest of the beds is a body's
  length away.
