nouns:
  beds: The beds are simple straw ticks laid in rows on the plank floor,
    each one fat with fresh-stuffed straw and turned so the day's damp has
    aired out of it. They are not fine, but they are clean and dry and
    smell of cut grass, and the sight of them undoes something in the back
    of your knees. Lie down on one and the road would let go of you for a
    while.
  blankets: Folded squares of grey wool wait at the foot of each tick,
    thick and slightly rough and smelling of lanolin and woodsmoke. They
    have been mended at the corners more than once with patient yarn.
    Pulled up to the chin, one of these would keep the loft's chill an
    arm's length off all night.
  beams: The roof-beams run low across the loft, dark old timber pegged
    and notched without a nail in sight, close enough that a tall body
    learns to stoop. Bunches of dried herbs and a few glass floats hang
    from them on cord. They give the room the snug, held-in feeling of a
    boat's hull turned over for shelter.
idlemessages:
- The cooling roof ticks softly overhead, and the warm peat-smell drifts up through the boards.
