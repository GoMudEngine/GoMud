zone: Marches Spur Road
title: The Broken Yoke Inn
description: The common room of the Broken Yoke is warm and dim, lit by
  a stone fireplace that dominates the west wall and a handful of oil
  lamps hanging from the beams. Trestle tables fill the space, each one
  different -- some rough-hewn, some smooth with age, all bearing the
  scars of years of use. The bar is a wide plank laid across two barrels,
  bottles and jars lined up behind it on a shelf. The air smells of wood
  smoke, fresh bread, and the faint sweetness of ale. Travelers sit in
  small groups, eating and talking in low voices. This is a place where
  roads meet and news travels.
