nouns:
  fireplace: A broad fieldstone fireplace, soot-blackened from decades
    of use. The stones are river-worn and fitted without mortar, held
    in place by their own weight. On the mantel sits a clay jug stuffed
    with dried wildflowers and a carved wooden horse, its paint nearly
    gone. The fire burns low but steady, more for comfort than warmth.
  bar: A wide oak plank laid across two ale barrels, serving as the
    bar. Behind it, a rough shelf holds bottles of spirits, a bread
    board with a half-cut loaf, and a cast iron soup pot with a ladle
    hooked on the rim. The plank is worn smooth in the center where
    elbows have rested for years.
  tables: Trestle tables scattered around the common room, no two alike.
    One is dark oak, scarred with knife marks. Another is pale pine,
    newer, its legs still square. A third has been repaired so many
    times it is more patch than original. Each table tells a small
    history of the inn in its wood.
