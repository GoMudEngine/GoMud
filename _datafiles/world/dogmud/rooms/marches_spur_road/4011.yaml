roomid: 4011
zone: Marches Spur Road
title: Waypoint Inn Yard
description: The road opens into a packed-earth yard before a solid
  fieldstone-and-timber building. A painted wooden sign hangs above the
  door -- a yoke split in half, the two halves pointing in opposite
  directions. A hitching post stands near the entrance with two draft
  horses tied and dozing. A water trough sits beside the post, clean
  and recently filled. A notice board near the door is pinned with
  papers and hand-written notes. A firewood stack against the west
  wall reaches head-height, neatly split and seasoned.
biome: farmland
