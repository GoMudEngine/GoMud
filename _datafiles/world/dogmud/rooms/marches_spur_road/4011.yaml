nouns:
  sign: A painted wooden sign hanging from an iron bracket above the
    door. It depicts a yoke split cleanly in half, the two halves
    pointing in opposite directions. Beneath the image, in plain
    letters -- "The Broken Yoke." The paint is faded but maintained,
    touched up where the weather has worn it.
  board: A wooden notice board mounted beside the inn door, bristling
    with pinned papers. Job postings for farm labor, a road warning
    about washed-out bridges to the south, a faded bounty notice for
    someone called "Darrow the Lean." Among the official notices, a
    hand-written note in rough script asks if anyone has information
    about a missing freight shipment that never arrived from the north.
  horses: Two heavy draft horses stand at the hitching post, hipshot
    and drowsing in the warmth. Their coats are dusty from the road
    and their harness hangs loose. Working animals resting between
    pulls.
  trough: A stone water trough fed by a hand pump, the water clean and
    clear. A thin film of dust floats on the surface near the edges
    where the horses have not drunk. The overflow runs into a shallow
    channel that drains toward the fields.
idlemessages:
- One of the horses stamps and shifts at the hitching post.
- The inn door opens and closes as someone steps out, letting a gust of
  warm bread-scented air escape.
- A paper flutters on the notice board, tugging at its pin.
