nouns:
  cart: A sturdy two-wheeled peddler's cart, its bed covered with oiled
    canvas strapped down tight. One wheel is propped up on a flat stone
    to keep it off the damp ground -- a maintenance habit, not a repair.
    The axle is greased and the frame is solid. This cart is waiting, not
    stuck.
  firepit: A ring of stones around a shallow pit of ash and coals. The
    coals are still warm, a thin thread of smoke rising from the center.
    A blackened pot sits on a flat rock beside the pit, its lid slightly
    askew.
  crates: Wooden crates and canvas bundles stacked under the lean-to.
    The visible goods include coils of rope, clay jugs of lamp oil,
    packets of dried provisions, and a bundle of iron tools wrapped in
    sacking. Everyday supplies for farms and homesteads.
