roomid: 4003
zone: Marches Spur Road
title: Peddler's Camp
description: A cleared patch of ground sits just off the road, sheltered
  from the wind by a low rise on the north side. A canvas lean-to has
  been stretched between two poles, its edges weighed down with stones.
  A small firepit smolders nearby, and a peddler's cart rests with one
  wheel propped on a flat stone -- not broken, just resting. Crates
  and bundles of trade goods are stacked neatly beneath the lean-to.
  The whole camp has the organized look of someone who knows how to
  live on the road, and the settled feel of someone staying longer
  than they planned.
biome: land
