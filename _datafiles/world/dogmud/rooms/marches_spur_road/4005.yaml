nouns:
  posts: Old hardwood fence posts, gray and split from years of weather.
    They lean in different directions as if the ground has shifted beneath
    them. Some still bear carved notches -- property markers or boundary
    signs in a system nobody uses anymore. The wood is too weathered to
    burn well but too stubborn to fall.
  grass: The grass grows noticeably taller and thicker near the old fence
    line. At the base, the blades are green and lush -- the soil here is
    richer, darker, holding moisture that the open plain cannot. Whatever
    was planted here once has been replaced by wild growth, but the earth
    remembers cultivation.
