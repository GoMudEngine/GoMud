roomid: 4005
zone: Marches Spur Road
title: Old Fence Line
description: A line of rotting fence posts runs east to west across the
  grassland, crossing the road at an angle. The wire is long gone --
  scavenged or rusted away -- leaving only gray wooden posts leaning at
  odd angles like broken teeth. Someone's abandoned claim, marked and
  forgotten. The grass grows taller here, thick and green at the base
  where richer soil holds more moisture. Whatever this land was meant
  to be, the prairie is taking it back.
