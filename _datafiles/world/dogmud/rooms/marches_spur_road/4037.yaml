roomid: 4037
zone: Marches Spur Road
title: Cluttered Back Room
description: >
  Behind the grass curtain, a smaller chamber carved directly into
  the hillside. The air is cooler here, drier, and heavy with the
  mineral tang of chrysalis compound. Shelves line every wall from
  floor to ceiling, packed with sealed jars, wrapped bundles, and
  stoppered vials arranged in a system that makes sense only to
  whoever built it. A heavy oak table dominates the center, its
  surface scarred with burn marks and stained with reagent spills
  in colours that do not occur in nature. This is not a hermit's
  pantry -- it is a laboratory, maintained with the discipline of
  someone who has been doing serious work for a very long time.
biome: cave
