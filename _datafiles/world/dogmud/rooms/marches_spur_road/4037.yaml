nouns:
  shelves: >
    Floor-to-ceiling shelving carved into the hillside rock, each
    shelf packed tight with containers. The arrangement follows a
    logic -- similar shapes grouped together, labels in a personal
    shorthand scratched into the wood. Some jars pulse faintly
    with chrysalis energy. Others are deliberately sealed with
    wax and stored facing the wall.
  table: >
    A heavy oak table that has seen decades of use. The surface
    is a palimpsest of chemical burns, knife scores, and reagent
    stains. Faint circles mark where crucibles sat for long
    hours. A set of copper measuring tools hangs from hooks on
    the table's edge, tarnished green but precisely calibrated.
  vials: >
    Stoppered glass vials in wooden racks, each containing a
    different liquid or powder. The colours range from pale gold
    to deep violet to a black that seems to absorb light. None
    are labelled for an outsider. The stoppers are sealed with
    chrysalis resin -- airtight, permanent until broken.
  burn marks: >
    Scorch patterns on the table surface, some deliberate and
    some clearly accidental. The deliberate ones form geometric
    patterns -- containment circles, perhaps, or focusing guides
    for channeling chrysalis energy. The accidental ones are
    larger and more chaotic. Experiments that did not go as
    planned.
idlemessages:
- A sealed jar on the highest shelf pulses once with pale light,
  then goes dark.
- The mineral smell of chrysalis compound intensifies briefly,
  then fades.
- Something ticks inside one of the sealed containers -- a slow,
  irregular rhythm.
