roomid: 4014
zone: Marches Spur Road
title: Ashwick Crossroads
description: Three roads meet here on a broad circle of packed earth,
  worn hard by a thousand choices. A cluster of wooden signposts stands
  at the center, their arms pointing in every direction. North reads
  "Watchers Crossing, Thornwall." South reads "Amber Valley, the
  Confluence." East reads "Ashwick, the Basin Retreats." Southwest
  reads "Stillwater, New Plymouth." The ground is scuffed and rutted
  from every angle, wheel tracks overlapping in a pattern that would
  take a tracker hours to unravel. This is where the spur road ends
  and the wider world begins.
