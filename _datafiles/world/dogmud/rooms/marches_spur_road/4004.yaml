nouns:
  grassland: Tall dry grass grows thick on both sides of the road,
    reaching waist-high in places. The seed heads are heavy and golden,
    bending with each gust of wind. Walking through it would leave you
    dusted in pollen and seeds. Small paths have been worn through the
    grass by animals -- narrow trails leading nowhere obvious.
  horizon: The view stretches for miles in every direction. To the north,
    the dark shape of the crossing's bridge is just visible against pale
    sky. To the south, faint lines of fenced fields break the grassland
    into squares. East and west, nothing but open plain and sky.
