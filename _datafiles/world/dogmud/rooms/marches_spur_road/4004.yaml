roomid: 4004
zone: Marches Spur Road
title: Open Country
description: The scrub thins and the land flattens into broad, open
  country. Tall dry grass stretches in every direction, seed-heavy
  heads bending in the wind like a pale golden sea. The road is a
  narrow pale line drawn across the landscape, its edges blurred where
  grass encroaches. To the north, the crossing's bridge is barely
  visible as a dark line against the sky. To the south, the first
  suggestion of tilled earth appears -- faint geometric lines that
  hint at fenced fields and cultivation ahead.
biome: land
