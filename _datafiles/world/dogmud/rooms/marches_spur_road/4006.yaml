roomid: 4006
zone: Marches Spur Road
title: Farmland Transition
description: The scrubland is gone. The road passes between fallow fields
  of dark turned earth, neatly plowed in long furrows that stretch toward
  the horizon. The smell changes here -- dry sage replaced by the rich
  scent of loam and moisture. A farm track branches west through a gap
  in overgrown hedgerows, the shape of a structure barely visible through
  the tangled branches. The main road continues south toward the sound of
  distant activity.
biome: farmland
