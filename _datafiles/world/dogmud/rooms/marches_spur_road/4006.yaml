nouns:
  fields: Fallow fields stretch on both sides of the road, their soil
    dark and freshly turned. The furrows are straight and even -- someone
    is maintaining this land even if nothing is planted at the moment.
    Clods of earth sit in the sun, drying and crumbling.
  hedgerows: Overgrown hedgerows line the farm track to the west, their
    branches tangled and thick with years of unchecked growth. Through
    gaps in the foliage, the shape of a large building is visible --
    walls and a partial roofline, half-hidden by vines and brush.
