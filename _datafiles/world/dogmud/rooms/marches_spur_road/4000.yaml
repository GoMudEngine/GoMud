roomid: 4000
zone: Marches Spur Road
title: Spur Road, Southern Fork
description: The road forks here, the main track continuing north toward
  the river crossing while a narrower path splits south into open country.
  A weathered signpost stands at the junction, its arms pointing in both
  directions. The southern road is less traveled -- wagon ruts shallow and
  half-filled with dust, scrub grass crowding closer to the packed earth
  on either side. The air is drier here, the river's dampness fading with
  each step away from the water.
biome: plains
