roomid: 4002
zone: Marches Spur Road
title: Waypoint Shrine
description: A small stone shrine sits beside the road, knee-high and
  worn smooth by weather and the touch of countless hands. It marks a
  junction where a faint track branches west toward what looks like a
  camp, while the main road continues south. Dried flowers and small
  offerings cluster at the shrine's base, left by travelers seeking
  safe passage. The stone is old -- older than the road, perhaps --
  carved in a style that predates current Chrysalis iconography.
biome: land
