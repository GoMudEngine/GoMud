roomid: 4007
zone: Marches Spur Road
title: Ruined Barn
description: >
  The farm track ends at a collapsed barn, its north wall caved in and
  half the roof gone. Massive oak beams jut from the wreckage like the
  ribs of some great beast, and vines have climbed the remaining walls
  in thick green curtains. The interior is dim and smells of old hay
  and animal musk. The south half of the roof still holds, creaking in
  the wind. Someone has been here recently -- a firepit of fresh ash
  sits near the entrance, and boot prints track through the dust.
  Against the back wall, a stack of <ansi fg="itemname">crates</ansi>
  sits in shadow, their locks broken and road freight markings still
  visible on the wood.
biome: farmland
