nouns:
  roof: The north side of the roof has collapsed entirely, beams snapped
    and hanging at angles like broken ribs. Daylight pours through the
    gap, illuminating dust motes in the air. The south half still holds,
    but it groans and creaks with every gust of wind. It will not last
    many more seasons.
  firepit: A circle of stones around a pile of fresh ash, still faintly
    warm. Boot prints surround it -- two or three sets of different sizes.
    Someone has been sleeping here, and recently. A charred bone and
    the remains of a meal sit at the edge of the stones.
  crates: Wooden crates stacked against the back wall, partially hidden
    in shadow. The locks have been forced open and hang broken from their
    hasps. Road freight markings are stamped on the sides -- shipping
    labels from merchants along the spur road. These were not meant to
    end up in an abandoned barn.
