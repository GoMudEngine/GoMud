nouns:
  smoke: A steady column of chimney smoke rises from a building to the
    south, gray-white against the sky. It does not waver or gust --
    the air is calm here in the lee of the ridge. The smoke suggests a
    large hearth, well-fed, the kind that burns all day for cooking
    and warmth. An inn, most likely.
  signposts: Too far to read from here, but a cluster of wooden posts
    is visible at the crossroads to the south. Their arms point in
    several directions, marking the junction of multiple roads. The
    posts look weathered but maintained -- someone keeps them legible.
