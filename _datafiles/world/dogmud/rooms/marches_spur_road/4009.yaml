roomid: 4009
zone: Marches Spur Road
title: Ridge View
description: The road crests a gentle rise, and the land opens up ahead
  in a broad view south. Chimney smoke rises in a steady column from
  what must be an inn or waystation, its pale thread drawn straight up
  in the still air. Beyond it, a cluster of signposts marks a crossroads
  where several paths converge. This is the first real sign of the wider
  world beyond the crossing -- roads branching to destinations that are
  more than a name on a signpost.
