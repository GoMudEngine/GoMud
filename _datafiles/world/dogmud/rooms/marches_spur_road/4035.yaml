nouns:
  path: >
    A depression in the grass rather than a proper path. Someone walks
    this route regularly enough to keep it from vanishing entirely,
    but not often enough to wear it bare. The soil is soft underfoot,
    springy with root mat.
  fence posts: >
    The same rotting hardwood posts from the old fence line, but here
    they lean closer together. Vine and wild berry have woven between
    them, creating a loose natural wall on either side of the track.
  smoke: >
    Thin pale smoke rising from beyond the stone wall ahead. Wood
    smoke, with something herbal underneath -- not cooking, but
    something being dried or burned deliberately. The smell is
    pleasant from this distance.
idlemessages:
- A bird startles out of the tall grass and wheels away south.
- The smoke ahead thins for a moment, then thickens again.
- Wind pushes through the grass in long slow waves.
