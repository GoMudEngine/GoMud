roomid: 4035
zone: Marches Spur Road
title: Overgrown Path
description: >
  A narrow track leads west from the road through waist-high grass
  and wild scrub. The path is barely visible -- just a faint depression
  where feet have pressed the soil enough times to discourage new
  growth. Old fence posts from the abandoned claim line the way, leaning
  inward as if trying to close the gap. The grass thins ahead where
  a low stone wall comes into view, half-swallowed by creeping vines.
  Smoke rises from somewhere beyond it, thin and pale against the sky.
  Someone lives out here.
biome: land
