roomid: 4008
zone: Marches Spur Road
title: Wagon Ruts
description: The road widens here, its surface packed hard by heavy
  traffic. Deep wagon ruts score the earth in parallel lines, wide-set
  for the large freight wagons that serve the farms. Active farmland
  stretches on both sides -- low green crops in neat rows, fed by
  narrow irrigation ditches that glint with water. The road is better
  maintained in this stretch, with gravel packed into the worst ruts
  and drainage channels cut along the edges.
biome: farmland
