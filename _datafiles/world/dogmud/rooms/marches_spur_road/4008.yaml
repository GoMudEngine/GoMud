nouns:
  ruts: Deep ruts worn into the road by heavy wagon wheels, wide-set
    and running in parallel grooves. The spacing suggests large freight
    wagons, not the lighter carts of peddlers. Gravel has been packed
    into the worst sections to keep the road passable in wet weather.
  crops: Low green rows of some root vegetable stretch across the fields
    on both sides of the road, their leaves broad and dark. Narrow
    irrigation ditches run between the rows, carrying water from some
    unseen source. The plants have been recently tended -- weeded and
    hilled with fresh earth.
