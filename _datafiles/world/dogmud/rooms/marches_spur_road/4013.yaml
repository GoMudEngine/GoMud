roomid: 4013
zone: Marches Spur Road
title: South Road Approach
description: The road south of the inn carries steady traffic as it
  approaches the crossroads ahead. A farmer's cart sits at the roadside,
  its bed loaded with muddy root vegetables -- turnips and parsnips fresh
  from the field. The farmer glances at passersby without much interest,
  used to the flow of strangers. The road is wide and well-maintained
  here, packed earth with gravel patches, built for the volume of trade
  that a crossroads demands.
biome: farmland
