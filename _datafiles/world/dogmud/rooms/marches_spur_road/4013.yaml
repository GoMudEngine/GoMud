nouns:
  cart: A farmer's cart with solid wooden wheels, its bed heaped with
    freshly pulled root vegetables still caked in dark field soil.
    Turnips and parsnips, mostly, with a few misshapen beets. The
    farmer sits on the cart's bench, chewing something and watching
    the road with the patient disinterest of someone who has seen
    every kind of traveler pass.
  road: The road is broad and busy this close to the crossroads. Hoofprints
    and wheel ruts overlap in the packed earth, and the verges are worn
    bare from travelers stepping aside to let wagons pass. Small stones
    have been kicked to the edges by traffic.
