zone: Marches Spur Road
title: Descending Track
description: The road drops from the ridge in a long, gradual descent
  toward the inn below. The surface is well-packed and graveled, made
  for heavy traffic. A wagon passes heading north, its driver nodding
  without slowing. The sound of activity grows closer -- voices, the
  creak of harness, the thump of something being loaded or unloaded.
  The crossroads ahead draws traffic the way a river draws streams.
