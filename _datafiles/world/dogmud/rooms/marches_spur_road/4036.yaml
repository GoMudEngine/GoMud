roomid: 4036
zone: Marches Spur Road
title: The Hermit's Cottage
description: >
  A squat stone cottage with a sagging thatch roof, built into the
  lee of a low hill. The walls are rough fieldstone mortared with
  clay, patched in places with chrysalis resin that has hardened to
  amber. A fire pit outside holds banked coals under a drying rack
  hung with bundles of herbs and roots. The door stands open. Inside,
  the single room is cluttered with jars, drying racks, a straw
  pallet, and stacks of crumbling books. A curtain of woven grass
  hangs across a doorway at the back, blocking the view of whatever
  lies beyond. The whole place smells of woodsmoke, dried herbs, and
  old paper. It looks like it has been lived in for a very long time
  by someone who does not expect visitors.
biome: plains
