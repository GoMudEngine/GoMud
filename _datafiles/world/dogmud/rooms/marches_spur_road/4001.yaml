nouns:
  scrub: Dense clumps of silver-green sage and dry bunchgrass crowd the
    road's edges. The sage is knee-high and woody at the base, its leaves
    narrow and dusty. Bunchgrass grows in tight tufts between the bushes,
    seed heads rattling in the wind.
  rock: A slab of dark basalt, flat-topped and warm to the touch from
    hours of direct sun. A small lizard perches on its surface, throat
    pulsing, watching you with one bright eye. It does not seem inclined
    to move.
