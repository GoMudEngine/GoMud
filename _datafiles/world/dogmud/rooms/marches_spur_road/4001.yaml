roomid: 4001
zone: Marches Spur Road
title: Scrubland Bend
description: The road curves gently through dry scrubland, sage and
  bunchgrass pressing close on both sides. The air carries a sharp herbal
  scent -- bruised sage from where wagon wheels have clipped the bushes.
  The river's sound is gone now, replaced entirely by wind pushing across
  the open plain. A flat basalt rock sits beside the road, dark and
  sun-warmed, where a lizard watches passing travelers with ancient
  indifference.
biome: plains
