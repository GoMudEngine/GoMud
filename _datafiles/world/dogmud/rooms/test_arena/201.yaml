title: Training Yard
description: A large open-air yard with packed earth underfoot. Wooden training dummies
  stand in a row along the western wall, their surfaces scarred from countless blows.
  To the south, a roped-off sparring ring awaits challengers. An archery gallery
  stretches to the east, and a heavy iron gate to the west leads to the champion's
  pit. The arena entrance lies back to the north.
