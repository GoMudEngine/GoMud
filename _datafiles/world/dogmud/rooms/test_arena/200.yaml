description: A wide stone archway opens into a sunlit training compound. The clang of
  practice weapons and the shouts of sparring combatants echo from within. A wooden
  sign reads "Combat Training Grounds - All skill levels welcome." A weapons rack
  displays various training weapons, and a large barrel holds weighted training stones.
  The Town Square lies to the north, while the training yard beckons further south.
