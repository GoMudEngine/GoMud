title: Fernway, Western Trailhead
description: >
  The path widens again here, and the bracken pulls back to
  let the open road through. Ahead, the country opens out
  into rolling pasture and hedgerow — the cultivated fields
  the North Road runs through, with the smell of cut hay
  and grazing carrying back on the wind. A weathered cedar
  <ansi fg="itemname">trail marker</ansi> twin to the one
  at the Fernway's eastern end stands at the path's mouth,
  its painted arrow pointing back the way you came toward
  ASHWICK. A patch of late
  <ansi fg="itemname">elderberry</ansi> in heavy white
  bloom dominates the trailhead's southern verge.
