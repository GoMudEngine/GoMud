nouns:
  trail marker: A weathered cedar post twin to the one at
    the Fernway's eastern end, the painted arrow pointing
    back the way you came toward ASHWICK. The destination
    numeral has long faded out. Travelers add their thumb-
    smudges to the post in passing — the same small
    habit, the same patient cumulative mark.
  elderberry: A patch of mature elderberry occupies the
    southern verge of the trailhead, the broad creamy
    flower-heads heavy in late bloom. Foragers gather
    the flowers for cordial in early summer and the
    berries for jam in autumn. The healer in Stillwater
    pays well for either, in season.
  pasture: Beyond the trailhead, the country opens into
    rolling pasture and hedgerow — the cultivated fields
    the North Road runs through, sheep grazing in the
    middle distance and a wooden farmhouse roof
    visible perhaps a furlong west. The smell of cut
    hay carries on the wind from somewhere closer.
  road: The North Road itself begins where the Fernway
    ends — a wider track of packed earth and gravel
    visible past the trailhead, running west through
    open country toward the lake-town beyond.
idlemessages:
- A bumblebee works its slow careful way through the elderberry flowers.
- A breeze brings the smell of cut hay briefly across the trailhead from the west.
- A <ansi fg="mobname">sparrow</ansi> drops onto the trail-marker, considers you, and lifts away.
- The bracken behind you stirs in a longer gust and the green wall ripples.
