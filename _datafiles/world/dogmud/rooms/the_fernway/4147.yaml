roomid: 4147
zone: The Fernway
title: Fernway, Eastern Trailhead
description: >
  The packed-earth road from Ashwick narrows abruptly here
  to a single-file footpath winding into a country of
  shoulder-high <ansi fg="itemname">bracken</ansi> and
  scattered alder. The cultivated edge of the hamlet falls
  away within a dozen paces; the air smells suddenly of
  damp earth, fern-must, and the green-cool weight of leaf
  litter. A weathered <ansi fg="itemname">trail marker</ansi>
  of split cedar leans at the path's mouth, its painted
  arrow nearly faded out, the destination "STILLWATER" still
  legible. A scattering of last year's
  <ansi fg="itemname">alder cones</ansi> lies where the
  brush opens.
