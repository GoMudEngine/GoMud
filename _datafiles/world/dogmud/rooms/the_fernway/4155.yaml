title: Heron Pond
description: >
  The faint trail down from Heron Reach ends at the soft
  southern bank of the <ansi fg="itemname">pond</ansi>
  itself — a wider, more sheltered view of the same dark
  still water you saw from above. The bottom drops away
  quickly here; the water is deeper than at the trail-side
  view and darker still. Stands of
  <ansi fg="itemname">cattails</ansi> and bullrushes line
  the bank in dense clumps, and a flash of bright green
  along the waterline marks
  <ansi fg="itemname">marsh chamomile</ansi> in low
  flower. A flat <ansi fg="itemname">stone</ansi> by the
  bank has been worn smooth by generations of fishermen
  and forager's knees.
biome: swamp
