roomid: 4149
zone: The Fernway
title: Twin Oaks Bend
description: >
  Two enormous old <ansi fg="itemname">oaks</ansi> rise on
  either side of a sharp bend in the path — twins by the
  look of them, perhaps three centuries old apiece, their
  upper branches interlaced into a single canopy that
  throws cool dappled light onto the trail below. The
  understory is thinner here under the oaks' shade, the
  bracken giving way to ground-hugging
  <ansi fg="itemname">wood sorrel</ansi> and the occasional
  flash of <ansi fg="itemname">foxglove</ansi> in pink
  bloom. A small brown
  <ansi fg="itemname">side-track</ansi> branches south
  toward what looks like an old farmstead.
biome: forest
