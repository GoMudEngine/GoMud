roomid: 4148
zone: The Fernway
title: Stoneford Crossing
description: >
  A clear shallow <ansi fg="itemname">creek</ansi> cuts the
  trail at a stretch of flat water-rounded stones — the ford
  the path's name comes from. The water is ankle-deep at
  the crossing and slightly colder than the air, with a
  faint mineral-iron edge that suggests deeper springs
  somewhere upstream. Mossed
  <ansi fg="itemname">stepping stones</ansi> mark the dry
  passage for those who want to keep their boots clean.
  Patches of bright green <ansi fg="itemname">watercress</ansi>
  cluster at the creek's slower bends; small brown
  trout-shadows hold against the current near the deeper
  pools.
biome: forest
