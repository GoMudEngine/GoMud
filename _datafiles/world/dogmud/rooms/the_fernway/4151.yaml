roomid: 4151
zone: The Fernway
title: Bracken Mile
description: >
  The path runs flat and straight through the densest
  stretch of <ansi fg="itemname">bracken</ansi> for what
  feels like a long time — the fronds reach above
  shoulder-height on both sides, and the trail itself is
  little more than a beaten dark line through the green.
  The air here smells purely of fern-must and the slight
  bitter-green of crushed stems. A small clear patch of
  trail-side <ansi fg="itemname">wild thyme</ansi> grows
  where the bracken thins for a few paces — pungent and
  silvered-grey, releasing its smell at any brush. The
  path goes on and on at the same slow pace, and a
  walker's mind settles.
biome: forest
