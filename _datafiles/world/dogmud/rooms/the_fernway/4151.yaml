nouns:
  bracken: Shoulder-high bracken-fern dominates the
    stretch, the fronds dense enough that you cannot see
    more than a few paces into the green on either side.
    Crushed underfoot or brushed against, it releases a
    musty bitter-green smell that clings to clothes for
    hours. Forageable for fiddleheads in early spring;
    this late, only the smell.
  wild thyme: A small low-growing patch of wild thyme
    occupies a few paces of clear ground at the path's
    middle, the silvered-grey leaves and tiny pink
    flowers forming a soft cushion. Pinch a sprig and
    the smell jumps — sharper and cleaner than any
    garden-cultivated thyme. Cooks gather it for stews
    and roasts; healers use the oil for sore throats
    and a few other things.
  trail: The trail itself is little more than a beaten
    dark line through the green, the earth packed hard
    by long use but never widened. Two travelers cannot
    pass without one stepping into the bracken; one of
    them by long custom takes the southern side. The
    path goes on and on at the same slow flat pace.
  green: The walls of green close on both sides, the
    light filtered to a soft uniform glow. A walker on
    this stretch starts to feel they have been walking
    forever and will keep walking forever — pleasant
    rather than alarming, the kind of pace that lets
    the mind unspool.
idlemessages:
- A breeze ripples the bracken-tops into a long slow wave that runs the length of the trail.
- A small dry crackle from somewhere off the path — something small, moving.
- The smell of crushed wild thyme rises briefly underfoot.
- A late <ansi fg="mobname">cricket</ansi> starts up from the bracken and is answered by another.
