roomid: 4156
zone: The Fernway
title: Fox Den
description: >
  The southern earth-track from Foxglade dips into a small
  hollow where a low <ansi fg="itemname">embankment</ansi>
  rises along the path's western side — the kind of dry
  raised earth that foxes and badgers favor for their
  dens. A clear <ansi fg="itemname">den-mouth</ansi>
  opens in the embankment's face, the entry packed smooth
  by use and the earth around it printed with small
  pawprints in the soft ground. The musky
  <ansi fg="itemname">scent</ansi> of fox-marking is
  strong here — fresh and unmistakable. A patch of bone
  and small tufts of fur at the den's edge mark recent
  meals; the fox is at home.
biome: forest
