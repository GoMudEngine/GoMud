nouns:
  embankment: A low raised earth-bank rises along the
    western side of the small hollow, perhaps twice a
    person's height — the dry firm earth foxes and
    badgers prefer for digging. The embankment runs
    perhaps fifty paces north-south and is riddled with
    the dark mouths of small dens, most of them long
    abandoned and one or two clearly active.
  den-mouth: A single clear active den-mouth opens in
    the embankment's face, the entry roughly knee-high
    and packed smooth by use. The earth around it is
    printed with small pawprints in fresh soft ground;
    a pawprint or two is small enough to be a kit
    rather than a grown fox.
  scent: The musky scent of fox-marking is strong and
    fresh in the air around the den — recognizable to
    anyone who has spent time in country like this.
    Not unpleasant; just unmistakable. The marker
    has been here recently and will likely return.
  bones: A small scatter of bones at the den's edge
    marks recent meals — rabbit mostly, a few bird-
    bones, the long thin leg-bone of something larger
    that the fox dragged in from elsewhere. Tufts of
    grey-brown fur lie among the bones, some of it
    rabbit, some of it fox-shed.
idlemessages:
- A faint scratching sound comes from somewhere inside the den, then is quiet.
- A small puff of disturbed earth drifts from the den-mouth as something moves inside.
- A breeze brings the musky fox-scent strongly across the hollow and away again.
- A <ansi fg="mobname">sparrow</ansi> takes a quick drink from a small puddle at the embankment's foot and is gone.
