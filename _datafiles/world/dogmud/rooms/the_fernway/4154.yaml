roomid: 4154
zone: The Fernway
title: Old Weddell Farmstead
description: >
  The side-track from Twin Oaks Bend ends at a small
  abandoned <ansi fg="itemname">farmstead</ansi> — a
  collapsed cottage of timber and field-stone, the roof
  long gone, the walls open to the sky. The yard around it
  has gone back to wild grass and bracken, but the
  outline of an old <ansi fg="itemname">kitchen garden</ansi>
  is still visible in the regular rows of escaped herbs
  that have outlived the cooking they once served. A
  twisted old <ansi fg="itemname">apple tree</ansi> still
  bears small bitter fruit at the yard's eastern edge —
  the only thing the Weddells left that endures. The
  silence here is different from the trail's; this is the
  silence of a place once lived in.
biome: forest
