roomid: 4152
zone: The Fernway
title: Foxglade
description: >
  A small open clearing where the bracken thins and a
  patch of taller grass and scattered
  <ansi fg="itemname">foxglove</ansi> opens to the sky —
  the path's name comes from the small russet shapes that
  sometimes cross the glade at dusk. Pale
  <ansi fg="itemname">wild garlic</ansi> grows along the
  glade's western edge, the broad green leaves
  unmistakable and the smell unmistakable too. A faint
  musky <ansi fg="itemname">scent</ansi> hangs around the
  glade's southern verge — fox-marking, fresh enough to
  still be sharp. A small earth-track branches south
  toward what looks like a den-mouth.
