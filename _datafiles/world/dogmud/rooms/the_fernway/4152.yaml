nouns:
  foxglove: Tall pink-flowered foxglove stands in the
    glade's open ground, the same plant as the foxgloves
    near the Twin Oaks bend but here in greater
    numbers — perhaps fifty plants in a loose scatter.
    Beautiful, poisonous, and useful in small careful
    doses. The fox-glade gets its name from the
    flowers, by some accounts; from the foxes themselves,
    by others.
  wild garlic: Pale broad-leaved wild garlic carpets the
    glade's western edge, the bulbs hidden beneath but
    the smell rising at every touch. Foragers gather the
    leaves through spring and the bulbs through summer.
    The flavor is sharper and cleaner than cultivated
    garlic, much prized by inn-cooks who can get their
    hands on a basket.
  scent: A faint musky scent hangs in the glade's
    southern air — fresh fox-marking, recognizable to
    anyone who has spent time in country like this.
    Not unpleasant; just unmistakable. The marking
    gets stronger toward the southern edge of the
    glade.
  grass: Tall pale grasses grow where the bracken
    thins, the seedheads heavy and bowed in the
    afternoon light. Several patches show beaten-down
    impressions where deer have bedded — and a few
    smaller impressions where foxes have done the
    same.
idlemessages:
- The wind moves through the foxglove flowers and the bells nod in unison.
- A pheasant calls once from somewhere east in the glade and is silent.
- The smell of wild garlic strengthens briefly as a breeze stirs the western edge.
- A red-brown shape crosses the southern verge of the glade and is gone before you can fix on it.
