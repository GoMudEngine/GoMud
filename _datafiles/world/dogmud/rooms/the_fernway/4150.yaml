nouns:
  backwater: A slow widening of the creek where the
    current pools dark and still beneath overhanging
    willows — perhaps a long bowshot across, the bottom
    invisible. The water's surface reflects the canopy
    above and the rare patches of open sky between in
    perfect dark mirror. Frogs cluster in the shallows
    near the southern bank.
  heron: A tall grey heron stands one-legged at the
    pool's edge, neck curved into an S, head held still
    enough that water-flies land on it without protest.
    Its patience is total; its strike, when it comes,
    is faster than the eye can follow. Most travelers
    walk past without seeing it; the heron prefers it
    that way.
  tracks: The soft path-earth at the pool's edge is
    printed with crossing tracks — the long thin
    triangular print of the heron, the cloven small
    print of a roe deer drinking, a fox's narrow oval,
    and the cleated bootprint of someone whose stride
    suggests they were hurrying. The bootprint is
    fresh enough to still be sharp at the edges.
  willows: A line of grey-barked willows leans over the
    pool from the southern bank, their long silver-
    backed leaves trailing in the water. The bark is
    harvested by healers for pain-medicine; the
    flexible withies are cut by basket-weavers in
    spring.
idlemessages:
- The heron shifts its weight from one leg to the other and freezes again.
- A frog plunks into the shallows from somewhere on the southern bank.
- A willow-leaf drops from above and drifts slowly across the pool's surface.
- A small fish surfaces, takes a bug, and is gone.
