roomid: 4150
zone: The Fernway
title: Heron Reach
description: >
  The trail runs alongside a quiet
  <ansi fg="itemname">backwater</ansi> here — a slow widening
  of the creek where the current pools dark and still
  beneath overhanging willows. A long-legged grey
  <ansi fg="itemname">heron</ansi> stands one-legged in the
  shallows so still it could be mistaken for a stick of
  driftwood, head cocked to one side, watching the water
  with absolute patience. The path curves around the
  pool's edge, the soft earth printed with crossing tracks
  — heron, deer, fox, the cleated bootprint of someone who
  passed this morning. A faint trail south leads down to
  the water itself.
