zone: Kilnreach Works
title: The Timber Yard
description: >
  The pit-saws reach you before the gate does — a high raw
  shriek of steel biting into wet hardwood, and beneath it the
  thick resinous smell of fresh-sawn timber, clean and green
  and nothing like the rest of the Works. Inside, sawdust and
  wood-chip cover the ground to the ankle. Ranked rows of
  <ansi fg="itemname">timber stacks</ansi> fill the yard in
  both directions — sawn plank and hewn beam sorted by grade
  and seasoning, each course wedged and pegged, the end-grain
  chalked with a tally-mark and the inspector's mark. Along
  the far wall, open <ansi fg="itemname">sawpits</ansi> cut
  straight down into the earth, the long two-man saws hanging
  idle on their pegs above the drop when no shift is running.
  At the loading apron near the gate, heavy
  <ansi fg="itemname">drays</ansi> take on bound timber for
  the city's framers and builders — a tally-clerk marks each
  load off against a board nailed to the gate-post.
