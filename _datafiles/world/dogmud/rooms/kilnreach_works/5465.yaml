roomid: 5465
zone: Kilnreach Works
title: The Furnace and Flagon
description: >
  The noise hits before the door is half-open — a packed roar
  of voices, the clatter of tin cups, boots on a stone floor,
  all of it bound under a ceiling low enough to feel like a
  hand pressed down. The air is dense — pipe-smoke above, the
  sharp smell of spilled ale below, and under both the close
  and honest smell of working bodies after a long shift. The
  <ansi fg="itemname">bar</ansi> runs the full width of the
  far wall, a slab of scarred timber on brick piers, two iron
  taps and a row of tin cups turned face-down on the counter
  when not in use. Above the door on the left, a battered
  <ansi fg="itemname">notice board</ansi> holds a press of
  papers — work-gang rosters, shift schedules, and columns of
  names against numbers that look like the settling of wages
  and debts in written form. The
  <ansi fg="itemname">drinkers</ansi> at the benches are the
  hands of the Works — lime-dusted and red-fingered, drinking
  hard and fast to get ahead of the exhaustion. Rough here,
  but warm, and a traveller can find a drink and plain talk
  without much difficulty.
