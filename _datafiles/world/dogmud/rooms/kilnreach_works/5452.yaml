title: Kiln Row
description: >
  The air on Kiln Row is bitter and alkaline — not the soft
  woodsmoke of a hearth or the clean smoke of a cooking fire,
  but the pungent mineral burn of lime-kilns at full draw,
  permanent and inescapable, coating the inside of the mouth
  with the faint taste of chalk. The eye confirms what the
  nose has already given up on arguing with — everything is
  grey. The buildings are grey with it, the workers are grey
  with it, and the street surface carries a continuous fine
  pale powder that records every footfall and rises in slow
  drifts when the wind sets from the west. On that western
  side the kilns stand in a row — four great stone-built
  chambers, their arched fire-mouths glowing amber-white in
  the permanent controlled burn, their stacks sending grey
  columns straight up in the still intervals between gusts.
  Workers move on the access road beside them without pause,
  tending the fire-mouths and shifting fuel from the stacked
  wood-yard behind, checking draw and temperature by methods
  that look more like instinct than instrument. When the
  wind comes from the west the heat from that side is a
  dry wall across the full width of the street. Across the
  narrow way, on the eastern side, the rough
  <ansi fg="itemname">workers' cottages</ansi> of Slag Lane
  crowd close — low-walled, practical, their washing greyed
  before it dries and their window-shutters facing the kilns
  with a long, unsurprised familiarity. Between the two sides
  the street is barely wide enough for a laden cart to pass.
  Hard against the near kiln a
  <ansi fg="itemname">tally shed</ansi> has been built of
  reclaimed stone — squat, solid, a sliding shutter over
  its counter-window standing open, a lantern burning inside
  despite the daylight, visible through the gap.
