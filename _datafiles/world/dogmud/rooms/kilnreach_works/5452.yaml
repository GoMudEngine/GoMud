nouns:
  tally shed: A low stone shed built into the gap between the
    first and second kilns, its walls thick enough that the
    heat from either side does not make it uninhabitable —
    only uncomfortably warm. The sliding shutter over the
    counter-window faces the street, and through it the
    interior is visible — a lantern on a hook, shelves of
    bound ledgers black with handling along their spines,
    and a row of wooden pegs holding delivery tickets on
    cords, each peg labelled in chalk on a small board
    above it. A stack of tally sticks lies on the counter
    inside, and a set of iron weights sits on a shelf at
    the back alongside a balance beam hung level. The shed
    is where the lime output is recorded, weighed, allocated
    by destination, and entered into the Crown Works ledgers.
    The ledgers on the nearest shelf are marked by year and
    quarter. The current one is very thick. Outside the shed,
    nailed to the frame above the shutter, a handwritten note
    in a clipped administrative hand reads — and here the
    lime-dust has obscured the first word — all disputed
    short-weights must be re-weighed before the cart leaves
    the row. Non-compliant loads will not be cleared.
  workers' cottages: The cottages on the east side of Kiln
    Row are plain single-storey buildings, their stone the
    same pale grey as everything else in this quarter, though
    whether that is their natural colour or the lime-smoke's
    work is impossible to say. They stand close-packed with
    shared walls, each fronted by a low wall and a strip of
    yard just wide enough for a rain-barrel and a stack of
    fuel. Washing hangs between the upper windows on lines
    strung between iron hooks — grey-white and heavy in the
    still air, not drying quickly. The doors are solid and
    plain, mostly shut. From behind one of them a child's
    voice carries briefly through the street noise, then
    stops. The cottages' windows facing the kilns are small
    and set high — a practical choice, whether against the
    heat or the glare.
idlemessages:
- The wind backs from the west and the full weight of the
  kiln-heat comes across the street at once — dry and close,
  lasting only a moment before the air shifts again.
- A kiln-worker moves along the fire-mouth row tapping each
  arch-stone with a long iron rod, listening to what the
  sound tells him about the draw.
- From one of the cottages on the east side the smell of
  cooking crosses briefly through the lime-smoke — onions
  and something heavier — then the wind takes it again.
- A cart loaded with sacked lime creaks away to the north
  from the kiln yard, the driver's face and coat the same
  grey-white as his load.
- One of the kiln stacks pulses a thick grey-white gust as
  the fireman below opens a vent, then the draw settles
  and the column thins and steadies.
