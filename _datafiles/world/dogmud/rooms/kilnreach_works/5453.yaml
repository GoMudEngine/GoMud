nouns:
  notice board: A heavy timber board nailed to the shed-frame at
    eye height, its surface dense with papers — this week's wage
    sheet in the upper corner, below it a notice concerning the
    lime-slake pits and the rules for working near them, a list of
    missing hand-tools that someone clearly expects returned, and a
    foreman's handwritten orders from this morning, the ink still
    dark. Below those, the edges of older notices curl away from the
    wood, a palimpsest of the works' daily life stretching back
    months. The board itself is stained grey-brown with the general
    atmosphere of Kilnreach and leans slightly off plumb, which
    nobody has bothered to correct.
  ore wagons: The ore-wagons grinding through the muddy way are
    heavy, low-slung timber frames on iron-tyred wheels, built for
    weight rather than speed. They carry quarried stone from the
    north, pig-iron from the foundry yard, and raw timber in loads
    lashed down with rope and sheeting. Their wheels sink to the
    axle in the worst of the mire, and the teamsters work them free
    with a combination of whip, voice, and long experience. Every
    wagon that passes sends a slow ripple through the mud underfoot.
  work sheds: The sheds that line the muddy way are built for
    function and not an inch beyond it — heavy timber frames,
    corrugated iron roofing where the original thatch caught and
    burned, doors wide as barn-gates and thrown open on all but the
    worst weather. Through those open doors the individual trades of
    the Works are audible — hammering in one, the hiss of a
    quench-tank in the next, the grinding of a dressed wheel in
    the third. The walls of each shed are dark with smoke and age,
    and every surface within reach of a passing hand has been worn
    smooth by years of it.
idlemessages:
- One of the <ansi fg="itemname">ore wagons</ansi> grinds hub-deep
  into the mud, and the teamster drops from the seat to dig the
  wheel free with a broad-bladed spade.
- The foundry-roar to the east rises sharply for a moment — a new
  pour going in — then drops back to its usual bone-deep note.
- A labourer pushes through with a barrow of coal slack, not
  looking up, not slowing, leaving a black trail in the mud.
- Someone has pinned a new sheet to the
  <ansi fg="itemname">notice board</ansi> and is reading an old
  one as they walk away.
- The tannery-stench rolls across the crossroads as the wind turns,
  heavy and close, then passes as the air shifts back.
