zone: Kilnreach Works
title: Kilnreach
description: >
  The foundry's roar hits first — not a sound so much as a
  pressure, a low iron bellow from the east felt through the soles
  of your boots before it registers as noise. Cinder-reek and
  forge-heat come with it, soaking into cloth and hair within
  moments of arrival. From the west the tannery asserts itself in
  a different register entirely — lime and rendered fat and wet
  hide in a slow inescapable combination, settling over the
  crossroads like weather. Between those two extremes lies the wide
  muddy way at the heart of the Works, broad enough for two
  ore-wagons abreast and churned by the passage of ten thousand
  such loads into a grey-brown mire that is neither road nor field
  but something rawer than either. The
  <ansi fg="itemname">work sheds</ansi> crowd the way on both
  sides, squat timber-and-iron structures with their doors flung
  wide against the heat, smoke and noise spilling out in roughly
  equal measure. A
  <ansi fg="itemname">notice board</ansi> stands nailed to the
  frame of the nearest shed — its surface thick with wage sheets,
  hazard warnings in red ink, and a foreman's handwritten orders
  from this morning, the edges of older notices curling away
  beneath the new. The
  <ansi fg="itemname">ore wagons</ansi> come and go without pause,
  their wheels sinking hub-deep in the worst of the mud, their
  teamsters driving them with the grim purpose of men who have made
  this same crossing ten thousand times. Hard-bitten labourers fill
  the gaps between them, loading, hauling, shouting over the din.
  This is not a place built to be pleasant. It exists to make
  things for a city.
