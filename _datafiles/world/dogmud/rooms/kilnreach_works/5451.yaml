roomid: 5451
zone: Kilnreach Works
title: The Quarry Road
description: >
  The quarry announces itself before it comes into view — a deep
  concussive boom from the east, stone splitting at the bottom
  of a worked face, followed by the grinding crash of rubble
  falling and the rapid flat percussion of hammer-and-drill
  work resuming almost without pause. The ground underfoot
  transmits a faint resonance from it. When the road crests
  the slight rise the full extent of the workings opens to
  the east — a great open cut dropping tier by tier into
  pale stone, its floor busy with figures no larger than
  fingers at this distance, the shouting from the bottom
  levels barely rising to the rim. Above them
  <ansi fg="itemname">quarry wagons</ansi> move on
  iron-railed tracks set into the stone of the upper levels,
  loaded with rubble and ore and pushed by teams working
  without pause, tipped at the rim and returned empty in
  an unbroken rotation. The road itself is white — the
  rock-dust from the workings covers the surface in a fine
  layer that puffs softly at every footfall and settles
  on skin and cloth alike. A heavy plank
  <ansi fg="itemname">site board</ansi> has been spiked
  into the earth at the quarry's road-side entrance, facing
  the road at eye level, its lettering stamped and painted
  to outlast the weather. The dust here has no smell of
  grain or green in it. It is dry and mineral and faintly
  metallic, and it coats the back of the throat.
