nouns:
  quarry wagons: The wagons are heavy timber-and-iron
    constructions, their beds reinforced with iron plate on
    the floor and lower sides where the rubble loads bear
    hardest. Each runs on four flanged wheels set to the
    iron-railed gauge of the quarry's internal tramway and
    tips rearward on a pivot for emptying. The nearest
    wagon at the rim is tipped and standing empty — its
    bed is rough with abrasion and stained in the pale
    grey-brown of limestone dust, with darker patches of
    iron-bearing ore worked into the grain of the wood.
    A residue of crushed stone grit fills the corners
    where the tipping left it. The wagon's frame carries
    a painted number and a tare weight stencilled in black
    on the forward stanchion, and a chain-brake on the
    downslope wheel is locked and padlocked — standard
    precaution at a rim where losing a wagon on a slope
    would be catastrophic.
  site board: A thick plank of hardwood, twice arm's-length
    across, spiked into a pair of stout posts at the quarry
    entrance where the works road meets the main road.
    The board carries the claim authority in large stamped
    letters at the top — KILNREACH NORTH QUARRY, CROWN
    WORKS AUTHORITY, LESSEE BOUNDED AND LICENSED — and
    below that a column of numbered orders. Workers must
    report injuries before leaving the site. No fire
    within the marked bounds except at the forges on the
    third level. Powder charges are to be drilled and set
    by licensed hands only, not by day-labourers. At the
    board's base a smaller notice has been nailed more
    recently, hand-written and unvarnished — it names
    three men and instructs that they are not to be
    rehired in any capacity without the site overseer's
    written approval. No reason is given. The names are
    still legible.
idlemessages:
- A heavy boom rolls up from the quarry floor to the east,
  rattling the dust from the road verge — a charge going
  off somewhere in the deep levels.
- A gang of workers moves past heading for the quarry
  entrance, tools on shoulders, talking in low voices
  that stop when they reach the site board.
- The grinding of iron wheels on iron rails carries up
  from the quarry's upper level as a loaded wagon is
  pushed toward the rim for tipping.
- Fine rock-dust sifts down from the quarry lip on the
  east side, catching the light in a pale curtain before
  settling slowly onto the road.
- From deep in the quarry cut a voice shouts a sharp
  warning, then a moment later the crash of loosened
  stone follows — muffled by depth, but heavy.
