title: Works' End
description: >
  The northern sky is not blue here — it is a low amber-brown,
  pressed close to the horizon by the heat and smoke of a vast
  city, the collective exhaust of a hundred thousand hearths
  hanging in a slow permanent layer that gives the northern air
  its particular indoor colour. The industrial country ends at
  this point — kilns and grinding-sheds and brick-yards dropping
  behind you into their own haze, and ahead no tollgate, no wall,
  no declared edge, only the moment when the raw worked land of
  the works dissolves into the first thin scatter of city
  buildings pressing north — low sheds and soot-dark yards and
  rough-built bothies crowding up against the road as if the
  city is still deciding where to stop. You have crossed the
  whole long road, wilds and towns and flats and fields and
  works, and the city is no longer ahead of you but around you,
  beginning. The road runs north without hesitation, straight
  into all of it, and at the right-hand verge a
  <ansi fg="itemname">boundary stone</ansi> names the ground
  ahead in full, without abbreviation, the
  <ansi fg="itemname">city outskirts</ansi> already visible
  beyond it pressing up beneath the smoke-heavy sky.
