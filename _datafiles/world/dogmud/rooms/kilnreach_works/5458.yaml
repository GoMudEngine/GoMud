zone: Kilnreach Works
title: The Great Quarry
description: >
  The quarry rim opens without warning — you stand at its edge
  and the scale of the pit below arrests the eye before any
  other sense has a turn. The drop is sheer and enormous, the
  walls descending in broad terraced steps of pale grey limestone,
  each tier a working ledge wide enough to hold teams and
  equipment, the raw stone face exposed in horizontal bands of
  pale and darker material going down — and down — until the
  floor of the pit is far enough below that the rubble-wagons
  crawling across it look no larger than beetles and the workers
  between them are dots. The continuous noise of it rises from
  below in waves — the chinking of iron on stone, the deep
  periodic boom of charges splitting the rock face, the groan
  of the <ansi fg="itemname">cranes</ansi> at the rim as loaded
  stone-nets swing toward the ramp road. A low
  <ansi fg="itemname">powder store</ansi> stands back from the
  edge behind you, thick-walled and locked, and the open
  <ansi fg="itemname">quarry</ansi> drops away in front —
  an open wound in the land, dug for the capital's walls and
  roads, one detonation at a time.
