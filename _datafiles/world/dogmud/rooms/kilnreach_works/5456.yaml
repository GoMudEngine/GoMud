roomid: 5456
zone: Kilnreach Works
title: North Works Road
description: >
  The reek lifts with the gradient — coal-smoke and lime-dust
  dropping away below as the road climbs, until only a faint
  industrial memory of it reaches the nose when the wind turns
  south. Up here the air is clear enough for birdsong again,
  and the sky broadens where the slope breaks the works' low
  haze open. Behind, the smoke-columns of the kilns and the
  brick-dust pall mark the works district as plainly as a map
  — a dense, self-sustaining weather of their own making,
  staining everything south of the road's crest to a uniform
  grey-brown. Ahead, and far north, the horizon carries a
  different darkness altogether — a vast, slow-spreading smear
  of haze that is not storm-cloud, not hill-shadow, but the
  collective smoke of a hundred thousand hearths burning at
  once. New Plymouth. The <ansi fg="itemname">city haze</ansi>
  covers the whole northern sky-edge in a low amber-tinged
  layer, and a road-worn <ansi fg="itemname">milestone</ansi>
  at the verge confirms the leagues remaining, the number cut
  there now grown small.
