roomid: 5450
zone: Kilnreach Works
title: The Works Road
description: >
  The smell changes before the land does. The warm grain-sweetness
  of the vale falls away behind you and in its place something
  harder arrives — smoke and hot stone and the acrid alkaline
  lift of crushed lime thickening with every step north, carried
  on a wind that has crossed quarried ground before it reached
  you. This is a different country, and the nose knows it first.
  The hedged fields of the breadbasket thin and give out. To
  either side the earth has been broken apart and turned over,
  its skin stripped back to bare pale stone, and
  <ansi fg="itemname">spoil heaps</ansi> rise from the
  scarred ground like unburied bones — chalk-white and
  ragged-edged, patched with coarse grass at their flanks
  where wind-scatter has had time to seed. The road itself
  has changed with the country around it — rutted deep and
  wide, the wheel-marks of heavy ore-wagons pressed into
  compacted earth, the verge cut back to accommodate loads
  coming south. On the road's western verge a heavy
  <ansi fg="itemname">works boundary post</ansi> stands
  iron-banded and square-set, its faces hung with official
  notices of the Crown Works authority. Beyond it the road
  runs on into the pale haze ahead, and for the first time
  the sound arrives on the wind — a low irregular percussion
  from the north, too heavy and too rhythmic for weather,
  the distant hammer-and-drill of the quarries working.
