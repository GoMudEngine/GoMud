nouns:
  spoil heaps: The heaps are the discard of the quarries — waste
    rock and overburden stripped from working faces and tipped
    at the margins of the road where the ground was already
    broken. Up close they are larger than they appeared — each
    heap stands two or three times head-height, pale and
    blocky, the raw stone exposed on their upper faces not yet
    weathered to grey. At the base of the nearest, the debris
    is coarser — whole slabs and broken angles of limestone
    thrown together without order, the gaps between them
    collecting runoff in shallow pools the colour of watered
    milk. Nothing grows on the fresh faces. Farther from the
    road the older heaps have a thin skin of coarse grass and
    weed at their lower margins, but it is sparse and
    yellow-green and seems to be losing ground rather than
    gaining it.
  works boundary post: A heavy squared post of dressed stone,
    iron-banded at the top and set deep in the verge, facing
    the road from both sides. The north face carries a stamped
    iron plate engraved with the Crown Works device — a kiln
    above an open hand — and the words KILNREACH WORKS
    AUTHORITY. Below the plate a wooden board has been nailed
    and covered with printed and hand-written papers. There
    is a current levy schedule for outbound loads, a notice
    prohibiting unlicensed stone-working within the
    authority's bounds, and a hazard warning about the quarry
    road east of the next junction — a faded line of text
    at the bottom notes that the notice is renewed annually
    and that ignorance of its terms is not an admissible
    defence before the works magistrate. The board's lower
    edge is dark with weather and the papers at the bottom
    of the stack are too blurred to read, though their
    seals are still visible — red wax, and official.
idlemessages:
- A gust from the north brings the smell of hot stone sharp
  for a moment, cutting through everything else, then the
  wind shifts and it fades to its usual background note.
- A laden ore-wagon passes southward on the road, the
  draught-beast leaning hard into the collar, the driver
  sitting straight and not looking to either side.
- The hammering from the north swells briefly louder as
  the wind backs, then drops away again to a low irregular
  pulse at the edge of hearing.
- A thin column of pale smoke rises from beyond the nearest
  spoil heap, stands vertical in the still air for a moment,
  then leans south as the wind catches it.
- Two workers come past heading north, boots pale with
  stone-dust to the knee, one carrying a long-handled
  tool over his shoulder, neither speaking.
