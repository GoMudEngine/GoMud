title: The Tannery
description: >
  The smell announces the tannery before the gate does —
  a thick compound reek of ammonia and rotting hide and
  souring bark-liquor that presses into the nostrils and
  sits there, coating the back of the throat and bringing
  the eyes to water before a step has been taken inside.
  The yard is a grid of sunken <ansi fg="itemname">tan-pits</ansi>
  set into the earth, each brimming with brown steaming
  liquor, hides submerged at various stages of the long
  cure — some pale and swollen from the lime-rinse, some
  darkening through the tan, some near-finished and heavy
  with it. Tanners work the hides with long poles, keeping
  out of the liquor, their clothes and lower legs long ago
  surrendered to the stain, their faces set against the
  smell in the particular way of men who have stopped
  noticing it. Dressed hides hang dripping from timber
  frames at the yard's far end, slick and dark and reeking
  close up. A low stone building at the yard's near edge
  is the <ansi fg="itemname">bark-store</ansi> — its door
  propped wide for the next delivery, the resinous smell
  of ground bark cutting briefly through even the yard's
  general reek before the reek reasserts itself.
