zone: Kilnreach Works
title: The Brickfields
description: >
  Open ground spreads in every direction, covered from north to
  south in rank upon rank of raw brick laid out to dry on wooden
  pallets — clay-yellow where the sun reaches, darker where morning
  damp still clings to the lower courses. The scale of it is not
  immediately apparent and then suddenly is — there are thousands,
  and the kilns to the west are making thousands more, and this
  has been the condition of this field for as long as anyone in
  Kilnreach can remember. The
  <ansi fg="itemname">brick kilns</ansi> to the west breathe
  grey-white smoke into the low sky in a column that smells of
  scorched clay and mineral heat, and the ground between the
  pallet-rows is churned to red-brown mud where the clay-workers
  have wheeled their barrows back and forth until every trace of
  grass is long gone. At the field's northern edge the finished
  work accumulates — mountains of
  <ansi fg="itemname">drying brick</ansi> stacked chest-high,
  stamped with the Kilnreach mark, roped at intervals for transit,
  and tallied in chalk on the lead brick of each column. The
  <ansi fg="itemname">clay pits</ansi> are visible as raw gouges
  to the west of the pallets — open wounds in the red earth,
  surrounded by spoil-heaps and the deep parallel tracks of loaded
  barrows heading east. The raw material of New Plymouth's walls
  sits here drying under an open sky, unremarkable to everyone
  who made it.
