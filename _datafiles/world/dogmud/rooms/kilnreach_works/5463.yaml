nouns:
  brick kilns: Squat round towers twelve feet across and twice
    as high, built from the bricks they make — the walls thick
    enough to hold a week's heat of firing. Iron vent-doors
    ring the base for raking and drawing; at the crown a clay
    cap allows the smoke its slow release. The heat off the
    near kiln is a physical thing — you feel it on the face
    from three paces, and from two it starts to dry the eyes.
    A single firing fills a dray and more. The product of a
    season fills city walls.
  moulding sheds: Long timber-roofed sheds open on the
    working side — no walls, just roof and posts and the long
    row of moulding-boards running the shed's length. Each
    board is wet and red, an iron mould-frame stacked beside
    it. Clay is thrown into the frame by hand, struck level
    with a wire, and the green brick slid free in a single
    motion. The pace inside is relentless and the floor is
    ankle-deep in red clay-slip. The smell here is wet earth
    and closed air and the particular close warmth of bodies
    doing piece-work.
  drying racks: Rows of long open racks set between the sheds
    and the kilns, each one carrying freshly-struck green bricks
    set on edge so the air can reach all faces. They are not
    yet fired — press a thumb to one and it marks easily,
    still as yielding as the clay it came from. A chalked
    number on each rack-end records the count, the moulding
    date, and the intended firing-sequence. A fired brick will
    bear a man's weight; these will not — not until the kilns
    have them.
  clay pits: Wide open cuts in the red earth, their walls
    shored with heavy planking against collapse. Ochre-red
    water stands in the pit floors — seep from the surrounding
    clay, kept down as far as buckets allow. The smell from
    the pits is mineral and cold, the smell of deep earth,
    quite different from the red dust above. Rope rigs at the
    pit-rim haul the filled corves up to the moulding-sheds
    in a continuous slow chain.
idlemessages:
- A kiln vents a slow billow of pale smoke and the wind
  carries it flat across the yard.
- Red brick-dust settles on everything set down for more
  than a moment.
- The slap of clay against a moulding-board carries from
  inside the shed — steady, unresting, without variation.
- A moulder shifts a rack of drying bricks and steadies
  the course with one hand as it rocks.
- The clay-pits give off a cold mineral smell when the
  wind drops — deep earth, not surface.
