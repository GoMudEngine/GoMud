title: The Brickworks
description: >
  Red is the colour before anything else — dust on every flat
  surface, weathered streaks on every wall, the raw churned
  earth where the ground has been worked and walked to nothing.
  It settles on the tongue and the back of the throat before
  you have taken ten steps. The great
  <ansi fg="itemname">brick-kilns</ansi> stand at the north
  edge — squat round towers of their own fired product, each
  breathing pale smoke from its vents in a slow steady
  exhalation, the heat off them a physical weight from three
  paces. Between the kilns and the road, long open
  <ansi fg="itemname">moulding-sheds</ansi> run east to west,
  the rhythmic slap of clay against board carrying from within.
  Beyond them, <ansi fg="itemname">clay-pits</ansi> open in
  the earth — wide and red and wet, their walls shored with
  timbers, ochre water standing in the pit floors. In the open
  ground between the sheds and the kilns,
  <ansi fg="itemname">drying racks</ansi> carry hundreds of
  freshly-struck green bricks set on edge, waiting for the
  kilns to clear.
