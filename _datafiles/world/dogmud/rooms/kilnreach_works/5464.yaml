title: Slag Lane
description: >
  The lane is narrow enough to touch both walls at once — a
  cramped close of back-to-back
  <ansi fg="itemname">cottages</ansi> built from the works'
  own brick and roofed with its own tile, the brick long since
  gone grey with lime-wash and smoke. The smell here is
  overlaid — coal smoke above, boiled greens and wet mortar
  beneath, and under both the close animal warmth of too many
  people in too little space. Lines of
  <ansi fg="itemname">washing</ansi> hang between the upper
  windows on both sides, gone grey-white from the kilns'
  smoke and heavy enough with damp to drip on the lane below.
  At the midpoint, a cast-iron
  <ansi fg="itemname">standpipe</ansi> serves the whole row —
  the cobbles around its base mossy and worn hollow by the
  feet of the water-carriers. Doors are packed close together,
  each with its shallow step and its collection of boots and
  tools kept out of adult space. The works built this lane.
  The works uses the people who live in it.
