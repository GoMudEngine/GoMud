nouns:
  ironwork: A stack of recently cast iron pieces propped against
    the yard fence, still faintly warm where the thicker sections
    have not yet fully cooled. Flat grilles with a standard bolt
    pattern, right-angle mounting brackets for heavy timber beams,
    and a run of pipe-lengths in two bore-sizes, each piece chalked
    with a collection reference — a date, a mark, a short
    destination code — and stacked in rough order of collection
    sequence. Some pieces are still rough from the sand-mould and
    will need dressing before they can be fitted. All of them are
    bound for somewhere that is not Kilnreach Works.
  cinder ground: The lane-floor is built entirely from compacted
    cinder — ash from the foundry's furnaces, falling day after
    day and year after year until the original earth beneath is a
    distant memory. It is soft in a dead way, compressing under
    weight without offering traction, and where wagon-wheels have
    cut through it the compressed cinder has been pressed nearly
    solid in parallel black grooves. The cinder marks everything
    it touches with a faint grey-black print — boots, hems,
    barrow-legs — and in a narrow strip along the fence where the
    wind is blocked, it has drifted to ankle depth.
  sign: A battered length of timber hung above the western door
    on two short chains, rotating very slightly even when the air
    is still. The painted image of a furnace-grate beneath a flagon
    is mostly weather-stripped to bare wood now, but the carved
    lettering below — Furnace and Flagon — is still clear, cut deep
    enough that lime-dust and cinder-grime cannot entirely fill it.
    The sign has not been repainted in some time. Nobody who drinks
    at the Furnace and Flagon required a cleaner sign to find the
    place.
idlemessages:
- The timber yard's saws rise to a shriek, bite through something
  thick, and go briefly quiet before starting again.
- A group of workers pushes through the lane between shifts,
  exchanging no words, making no eye contact, cinders crunching.
- Laughter from inside the Furnace and Flagon — short, rough,
  stopping as quickly as it started.
- A boy hauls a handcart loaded with sand-moulds through the lane,
  his wheels cutting fresh tracks in the
  <ansi fg="itemname">cinder ground</ansi>.
- The foundry-clang sharpens, and a wave of heat rolls down the
  lane from the east a moment later.
