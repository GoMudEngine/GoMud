zone: Kilnreach Works
title: Foundry Lane
description: >
  Cinders crunch underfoot — the lane-floor is black with them,
  decades of ash-fall compacted under boot-traffic until it gives
  like something between gravel and soot, gritty and permanent,
  recording every footfall in a faint grey print that will not
  wash clean. The timber yard's saws cut from the east, a high
  bright note riding over the foundry-clang below, and from the
  west, through the planked door of the Furnace and Flagon, a low
  warm smell of spilled beer and woodsmoke reaches the lane along
  with the blurred sound of voices in low argument. The Furnace
  and Flagon is the works tavern — wedged between two of the
  foundry's outbuildings by the logic of wherever a building could
  go, not wherever a builder would want one. The lane itself is
  tight and shadowed, the outbuildings pressing close on the south
  side, the timber yard's plank fence making the north side a
  grey-split wall. A stack of cast
  <ansi fg="itemname">ironwork</ansi> leans against that fence —
  grilles, mounting brackets, and pipe-lengths fresh from the
  mould, chalked with collection dates, bound for the wagons at
  the crossroads south. Between shifts the lane is where the
  workers of Kilnreach come to exist for a moment outside the din,
  smoking short pipes and exchanging words they would not bother
  with on the floor.
