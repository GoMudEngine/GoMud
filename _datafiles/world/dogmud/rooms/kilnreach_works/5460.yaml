title: The Foundry
description: >
  The light registers first — the white-hot glow of the great
  <ansi fg="itemname">furnace</ansi> at the chamber's far wall,
  its brightness washing out shadow and colour alike, reducing
  everything near it to a trembling dazzle. The air shimmers
  in visible layers above the casting-sand, wavering with a
  heat so intense that breathing costs something, the weight
  of it pressing on every exposed surface of skin. Molten iron
  runs in glowing rivers from the tap-hole into clay-lined
  channels cut through the sand, pouring into prepared moulds
  with a fierce steady brilliance — sparks fountaining where
  the flow meets the mould-edge, scattering bright points
  across the floor. The clangour of the work is near-constant
  — hammers striking castings free, the shunt and scrape of
  blowpipes, the hiss of steam rising from cooling metal. A
  rack of finished <ansi fg="itemname">castings</ansi> stands
  to one side, cooled pieces in rough grey iron — axle-hubs,
  wheel-flanges, flat bar-stock — stacked on a heavy timber
  frame. The founders work without pause, blackened to the
  eyes, moving in the heat as though it were the only air
  they have ever known.
