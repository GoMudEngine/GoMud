title: The Lime Kilns
description: >
  The heat reaches you before the kilns do — a dry searing
  wall of it pressing against the face, stripping the air of
  moisture, carrying with it a caustic bitterness that settles
  in the throat and whitens the lips over time. A row of great
  stone <ansi fg="itemname">kilns</ansi> occupies the yard
  in a close line, their domed crowns black with soot, their
  burning throats fed without cease — limestone and charcoal
  tumbling in from above as lean-armed men work the loading
  ramps, the combustion roaring through the stonework, felt
  in the chest as much as heard. Lime-smoke drifts in thin
  white ribbons from the draw-holes, settling on skin and
  clothes and graying everything it touches, the caustic tang
  sharp enough to taste at the back of the throat. Along the
  yard's far wall a rough <ansi fg="itemname">tool-shed</ansi>
  leans against the kiln fence, its open shelves crowded with
  iron lime-rakes, long-handled shovels, and padded gauntlets
  blackened from long use. A man who works the kilns for a
  season looks a decade older than his years.
