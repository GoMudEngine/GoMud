nouns:
  kilns: The kilns stand close and massive — each a drum of
    dressed stone perhaps twelve feet across and twenty high,
    their interiors burning at temperatures that give limestone
    no peace. A loading port at each crown receives the fuel
    and feed; draw-holes at the base allow burned lime to be
    raked out when the cycle completes, though the kiln runs
    continuously, one section cooling while the rest burn.
    The heat radiating from the nearest kiln keeps anyone at
    arm's length without instruction. A fresh-burned load sits
    cooling in the nearest draw-bay — the lime white and fierce,
    still hot enough to blister, smouldering faintly at the
    edges where unburned stone gives way to the finished product.
  tool shed: A lean-to built against the kiln fence, its
    shelves running from the ground to the rafter-plate and
    crowded with the implements of the trade. Iron lime-rakes
    with their long ash handles, padded gauntlets for handling
    hot product, heavy canvas covers for the cooling draw-bays,
    a crate of marking chalk for batch tallies, spare loading
    poles bundled in the corner with cord. Everything is filmed
    with pale lime-dust — a white coating that settles into
    every crevice and sits there. The door has no latch; there
    is nothing here worth locking against a thief who would not
    rather have the gauntlets than anything else in the shed.
idlemessages:
- A man raking the nearest draw-bay pauses to wipe his face
  with a rag, then leans back into the heat without comment.
- A thin white ribbon of lime-smoke drifts across the yard
  and catches the light briefly before dispersing to nothing.
- The roar from the nearest kiln rises a note as a new charge
  of charcoal catches inside — a brief bright intensity, then
  settling back into its baseline thunder.
- Limestone dust settles on every flat surface — the tool
  ledges, the loading ramps, the back of an unguarded hand.
- A worker at the loading ramp swings a heavy canvas cover
  over the nearest draw-bay and ties it off without looking up.
