roomid: 4033
zone: Ashwick
title: Hidden Grove
description: >
  A deeper grove, less visited than the clearing to the south.
  The herbs here are untouched -- no harvest cuts, no trampled
  undergrowth. Older growth, rare varieties that an herbalist
  would recognize but not expect this close to a hamlet. And
  something is wrong. The colors are too vivid, greens deeper
  than they should be, edges of leaves carrying a faint
  bioluminescence visible even in daylight. Stems lean toward
  you as you pass, tracking movement like sunflowers track
  the sun. The Chrysalis is active in this soil. The air
  hums faintly, felt more than heard.
