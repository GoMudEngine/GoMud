roomid: 4029
zone: Ashwick
title: Forest Path
description: >
  A narrow path leads into the woods from Ashwick's eastern
  edge. The canopy closes overhead almost immediately --
  mixed hardwood and evergreen branches interlocking to filter
  the light into green-gold dapples that shift with the wind.
  The air is cooler here, heavy with the scent of leaf mold
  and damp earth. The path is well-worn by years of foot
  traffic, beaten smooth and clear of undergrowth. Behind
  you, the hamlet is still visible through the trees. Ahead,
  the forest deepens.
biome: forest
