nouns:
  path: A narrow but clear trail beaten into the forest floor
    by years of foot traffic. Foragers, herb-gatherers, and
    children playing in the woods have worn this track smooth.
    The soil is dark and packed, scattered with fallen leaves
    that are quickly trampled into the earth.
  canopy: Mixed hardwood and evergreen branches interlocking
    overhead, forming a nearly continuous ceiling of leaves
    and needles. Light filters through in shifting dapples --
    green-gold in the morning, deeper emerald as the canopy
    thickens. The effect is like walking into a room with a
    living roof.
