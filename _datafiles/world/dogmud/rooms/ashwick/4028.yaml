nouns:
  beds: Raised wooden beds with painted labels -- "comfrey,"
    "sage," "feverfew," "bitter-thistle," and others. The
    comfrey and sage beds are healthy, leaves broad and ready
    for harvest. The feverfew and bitter-thistle beds are
    stripped bare, cut down to root crowns with nothing left
    to take. The contrast is stark -- plenty of some, none
    of others.
  frame: A glass cold frame sheltering rows of tiny seedlings.
    The glass is clean, the frame well-maintained. Inside,
    feverfew and bitter-thistle sprouts push through dark
    soil -- weeks from being large enough to harvest. Someone
    is trying to regrow what was lost, but time is not
    cooperating.
idlemessages:
- Bees work the sage flowers methodically, ignoring the bare
  beds.
- Wind moves through the garden, stirring the herb-scented
  air.
- A painted label wobbles on its stake as the breeze catches
  it.
