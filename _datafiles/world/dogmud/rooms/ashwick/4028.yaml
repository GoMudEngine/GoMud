title: Delia's Garden
description: >
  A cultivated herb garden behind Delia's cottage, enclosed
  by a low fence. Raised wooden beds are arranged in neat
  rows, each labeled with small painted stakes. Comfrey and
  sage grow thick and healthy, their leaves broad and dark.
  But the feverfew and bitter-thistle beds are stripped bare
  -- harvested down to the root crowns, nothing left to cut.
  A glass cold frame protects rows of tiny seedlings, weeks
  from being harvestable. The garden is well-tended but
  clearly under strain, producing less than is needed.
biome: farmland
