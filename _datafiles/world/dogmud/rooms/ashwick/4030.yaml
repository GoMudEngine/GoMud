nouns:
  undergrowth: Dense ferns and bramble crowding the path from
    both sides. The growth is thick enough to be impassable
    off-trail without a blade. Thorns catch at clothing and
    exposed skin. The path itself stays clear -- walked
    regularly enough to keep the undergrowth at bay.
  breaks: Small branches snapped at waist height along the
    path's edge. The breaks are recent -- sap still beading
    on the exposed wood. Someone has been pushing through
    here carrying something bulky, probably bundles of herbs
    or gathered material. The snapped branches are consistent
    in height and direction, the same person making the same
    trip repeatedly.
