roomid: 4030
zone: Ashwick
title: Deep Woods
description: >
  The forest deepens here. The path narrows as undergrowth
  thickens on both sides -- dense ferns and bramble pressing
  close. Less light reaches the floor, the canopy heavier
  and more complete. Hamlet sounds are gone, replaced by the
  forest's own vocabulary of creaks, rustles, and bird calls.
  Something has been through here recently, breaking small
  branches at waist height -- someone pushing through
  carrying something bulky, like bundles of herbs. The breaks
  are clean and recent, sap still beading on the snapped
  ends.
biome: forest
