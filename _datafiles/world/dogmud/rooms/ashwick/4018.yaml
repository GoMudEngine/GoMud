title: Chapel Lane
description: >
  The road narrows here into a lane that runs east toward the
  chapel, its stone spire visible above the rooftops. The
  surface is better maintained than the main road -- someone
  sweeps it regularly. Houses on either side have their
  shutters closed, the stillness of homes whose occupants
  left or simply stopped opening the windows. A few flower
  boxes sit empty on windowsills. The chapel draws the eye
  forward, modest but deliberate in its placement at the
  lane's end.
