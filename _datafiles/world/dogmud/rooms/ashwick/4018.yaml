nouns:
  lane: Narrower than the main road, this lane has been swept
    clean of debris and loose stones. The surface is packed
    earth like the rest of Ashwick, but someone takes care
    of this stretch -- broom marks are visible in the dust.
    The lane runs straight east toward the chapel, aligned
    with its door as if by design.
  shutters: Several houses along the lane have their shutters
    closed and latched from inside. The wood is in good repair
    but the latches show no sign of recent use -- no oil on
    the hinges, no fingerprints in the dust on the sills.
    The stillness is not abandonment exactly, more like a
    slow withdrawal. These homes had people once.
