roomid: 4017
zone: Ashwick
title: Central Green
description: >
  The hamlet's heart -- a patch of green where roads converge
  from every direction. A spreading oak dominates the space,
  its canopy shading a worn wooden bench and a notice post
  bristling with pinned papers. The grass is trampled flat
  near the bench but grows thick under the tree's drip line.
  Houses face the green from the west and east, and a narrow
  lane leads south toward what might be a ritual circle. To
  the north, a tidy cottage with herb bundles visible through
  the window.
