nouns:
  oak: An ancient spreading oak, easily the oldest living thing
    in Ashwick. Its trunk is thick enough that two people could
    not link arms around it, and its canopy shades most of the
    green. Carved initials and dates mark the bark at waist
    height -- generations of lovers and children leaving their
    marks. The tree was here before the hamlet, and will likely
    outlast it.
  bench: A wooden bench beneath the oak, worn smooth by years
    of sitting. Carved initials cover the armrests and seat
    back -- some deep and old, others shallow and recent. The
    wood is silvered with age but solid. A comfortable place
    to rest and watch the hamlet go about its business.
  post: A wooden post driven into the ground near the bench,
    its surface bristling with pinned notices. A lost goat
    notice with a rough sketch. A reminder about market day
    in Watchers Crossing. And one older notice, its paper
    yellowed and curling, requesting that "unusual absences
    be reported to the deacon." No one has taken it down.
