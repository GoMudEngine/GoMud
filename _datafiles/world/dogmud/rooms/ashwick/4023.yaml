nouns:
  sign: A hand-painted "for sale" sign nailed crookedly to
    the door, its paint faded to a ghost of the original
    black. It has been here long enough that nobody in
    Ashwick expects it to work. The nail is rusted into
    the wood.
  door: Unlocked, the latch lifting easily as if left that
    way on purpose. The hinges protest with a thin squeal
    when moved. No one has locked this door since the
    occupant left.
  windows: Shuttered from inside, latched but not locked.
    One shutter has warped enough to leave a gap where thin
    light enters, cutting a bright line across the dusty
    floor. Cobwebs bridge the gap.
  shelf: A row of shelves along one wall, mostly bare. Dust
    outlines show where books once stood -- different sizes,
    a small library for a hamlet cottage. One book remains,
    spine cracked, a pressed fennel flower between its pages.
    The rest were taken deliberately.
  hearth: Cold and unused for years. Soot patterns on the
    stones suggest someone once sat very close, seeking warmth
    from a fire not lit -- the habit of cold comfort. A faint
    smell of old lamp oil lingers. The hearthstones are solid
    except for one near the base.
  stone: A loose stone near the hearth base, slightly displaced
    from its neighbors. It moves when pressed, shifting inward
    to reveal a small <ansi fg="itemname">cavity</ansi> behind
    it. The edges are worn smooth from being moved and replaced
    many times.
  cavity: A small hollow space behind the loose hearthstone,
    just large enough to hold a folded letter. The walls of
    the cavity are smooth -- this hiding spot was made on
    purpose, not found by accident.
  drawer: A drawer in the small bedside table, swollen with
    damp and stiff to open. The wood protests as it slides.
    Inside, a folded page of careful handwriting rests against
    the drawer bottom.
