roomid: 4023
zone: Ashwick
title: Maren's Cottage
description: >
  An abandoned cottage standing apart from the rest of Ashwick,
  its garden gone wild and a faded "for sale" sign nailed to
  the door. The shutters are closed from inside, though a gap
  in one lets a thin blade of light cut across the dusty
  interior. The silence here is specific -- not empty but
  vacated, the particular quiet of a place someone left on
  purpose. Inside, bare shelves line the walls with dust
  outlines where books once stood. A cold hearth sits against
  the far wall, its stone cut with a deliberate pattern of
  <ansi fg="itemname">hearth-marks</ansi> that no fire ever made.
  A loose stone near the hearth base looks slightly displaced.
  A small <ansi fg="itemname">bedside table</ansi> sits against the
  wall, its single drawer swollen with damp, and on its surface a
  field <ansi fg="itemname">journal</ansi> lies open, thick with the
  years of one careful hand.
