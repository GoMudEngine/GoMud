nouns:
  sign: A hand-painted "for sale" sign nailed crookedly to
    the door, its paint faded to a ghost of the original
    black. It has been here long enough that nobody in
    Ashwick expects it to work. The nail is rusted into
    the wood.
  door: Unlocked, the latch lifting easily as if left that
    way on purpose. The hinges protest with a thin squeal
    when moved. No one has locked this door since the
    occupant left.
  windows: Shuttered from inside, latched but not locked.
    One shutter has warped enough to leave a gap where thin
    light enters, cutting a bright line across the dusty
    floor. Cobwebs bridge the gap.
  shelf: A row of shelves along one wall, mostly bare. Dust
    outlines show where books once stood -- different sizes,
    a small library for a hamlet cottage. One book remains,
    spine cracked, a pressed fennel flower between its pages.
    The rest were taken deliberately.
  hearth: Cold and unused for years. Soot patterns on the
    stones suggest someone once sat very close, seeking warmth
    from a fire not lit -- the habit of cold comfort. A faint
    smell of old lamp oil lingers. The hearthstones are solid
    except for one near the base.
  stone: A loose stone near the hearth base, slightly displaced
    from its neighbors. The edges are worn smooth as if it has
    been moved and replaced many times. It looks like it could
    be pushed aside.
  table: A small bedside table with a single drawer, swollen
    with damp and stiff to open. The wood protests as it
    slides. Inside, a folded page of careful handwriting
    rests against the drawer bottom.
  journal: The field journal of the man who lived here -- page
    after page in a small, driven hand, ink of years laid down
    over years, and all of it one subject. A made thing, ancient
    and wrong, buried in the broken country to the east. He calls
    it only the thing, as though naming it further would give it
    more purchase on him than it already has. One mark recurs in
    his margins until the paper wears thin -- a ring struck through
    with a single line. Near the back, set apart and gone over many
    times, is a worked-out method -- what to do, and where, to wake
    the grey disc that is its key. In the very last entry, once and
    softly, a woman's name. Maren. Nothing of her but that he kept
    her.
  hearth-marks: A pattern cut deliberately into the face of the
    hearthstone -- not decoration, not a mason's device, but
    something nearer a diagram, its edges worn where a thumb has
    traced them again and again. It answers the last pages of the
    journal exactly. This is the focus of his method, and the place
    it is meant to be done -- the still center where the waking
    happens, if ever a hand brought the right thing to it. Cold now,
    and patient, and waiting to be used.
