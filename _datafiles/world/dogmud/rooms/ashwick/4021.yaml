title: Ritual Circle
description: >
  A circle of flat river stones set into the grass south of
  the central green -- the site of Ashwick's Autumnal Rite.
  The stones are worn smooth by generations of standing feet,
  arranged in a ring roughly ten paces across. Wooden poles
  stand at the cardinal points, draped with drying flower
  garlands -- chrysanthemums, sage bundles, dyed cloth in
  Chrysalis colors. One stone near the east edge bears a dark
  <ansi fg="itemname">scorch mark</ansi> that does not match
  any fire damage. The air here holds a faint charge, like
  the memory of something that almost happened.
biome: farmland
