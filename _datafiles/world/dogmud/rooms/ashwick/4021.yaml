nouns:
  stones: Flat river stones arranged in a circle, their
    surfaces worn smooth by generations of feet. Each stone
    is roughly knee-width, set flush with the ground so the
    grass grows tight against their edges. Most are unmarked
    grey river stone. One near the east edge is different --
    it bears a dark discoloration that draws the eye.
  scorch mark: A dark mark on one of the eastern stones,
    roughly hand-shaped -- fingers splayed as if someone
    pressed a burning palm to the rock. It is not soot or
    char from a fire. The discoloration goes into the stone
    itself, as if the rock was changed by heat from within.
    The surrounding stones are completely unmarked. Whatever
    caused this was precise and contained.
  garlands: Dried flower garlands draped on wooden poles at
    the circle's cardinal points. Chrysanthemums woven with
    sage bundles and strips of dyed cloth in Chrysalis
    ceremonial colors -- gold, green, and deep violet. They
    are from the most recent Autumnal Rite, drying slowly
    in the open air. A few petals have fallen to the grass.
idlemessages:
- Wind stirs the garlands on their poles, releasing a faint
  scent of dried sage.
- A petal detaches from a garland and drifts to the grass.
- The air above the circle seems to shimmer faintly, though
  it might be heat haze.
