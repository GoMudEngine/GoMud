title: Forager's Camp
description: >
  A hidden camp in a small clearing, screened from the path
  by dense undergrowth. A lean-to of branches and salvaged
  canvas stands against a fallen log, well-built for
  temporary shelter. A cold firepit sits in the clearing's
  center -- no smoke, no embers, ash scattered and buried
  after each use. Bundles of dried herbs are stacked neatly
  against a tree trunk -- feverfew, bitter-thistle, comfrey.
  Someone has been living here for weeks, quietly, tidily,
  invisibly. The camp is the work of a person who knows how
  not to be found.
