nouns:
  lean-to: A shelter of woven branches and salvaged canvas
    propped against a fallen log. The construction is skilled
    -- branches lashed tight, canvas stretched to shed rain,
    a bed of dry leaves and fern fronds inside. Temporary
    but well-made, the work of someone who has slept rough
    before and learned to do it properly. A blanket, thin
    but clean, is folded at one end.
  firepit: A circle of stones around a pile of cold ash,
    scattered and partially buried -- deliberately. No smoke
    has risen from this pit in daylight. The ash is buried
    after each use to prevent visible smoke trails. Boot
    prints circle the pit, and a few charred bones sit at
    the edge -- small game, eaten alone.
  herbs: Bundles of dried herbs stacked against a tree trunk,
    neatly tied with cord. Feverfew, bitter-thistle, comfrey
    -- the same herbs missing from Delia's garden beds back
    in the hamlet. The bundles are prepared with skill,
    harvested at the right time and dried properly. Whoever
    gathered these knows herbalism.
