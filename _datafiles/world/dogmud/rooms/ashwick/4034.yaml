nouns:
  hollow: A depression between the roots of an enormous old
    tree, perhaps the oldest in this stretch of forest. Thick
    moss carpets the hollow in a springy layer that swallows
    footsteps. Animal tracks -- wolf prints, clear and
    frequent -- circle the hollow but none enter it. Whatever
    instinct keeps the wolves away, it is consistent. The
    hollow breathes cool air upward, as if connected to
    something deeper underground.
  roots: Massive roots half-exposed by erosion, thick as a
    person's torso. Claw marks score the bark in parallel
    lines -- wolves use these roots as marking posts, dragging
    their claws to leave scent and visual territory markers.
    The marks are layered, old over older, generations of
    wolves claiming this tree as a boundary.
idlemessages:
- The hollow breathes cool air upward, carrying the scent of
  deep earth.
- Fresh wolf tracks press into the mud at the clearing's edge.
- A thin needle of light shifts across the moss as the canopy
  moves overhead.
