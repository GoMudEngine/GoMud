roomid: 4034
zone: Ashwick
title: Overgrown Hollow
description: >
  The deepest accessible point in the woods north of Ashwick.
  A natural hollow sits between the massive exposed roots of
  an ancient tree, carpeted with thick moss that muffles all
  sound. The canopy is almost complete overhead, admitting
  only thin needles of light. It is dark, damp, and cool --
  not hostile but clearly not meant for people. Animal tracks
  circle the hollow but do not enter it, as if by agreement
  or instinct. Wolf claw marks score the exposed roots. The
  path ends here. There is nowhere deeper to go.
biome: forest
