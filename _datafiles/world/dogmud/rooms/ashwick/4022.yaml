nouns:
  symbol: The Chrysalis spiral carved in stone above the door,
    the standard icon of the faith -- a spiral representing
    transformation and growth. But the carving sits atop older
    stonework, and where the chisel cut deepest, a different
    geometry is visible beneath. The inner orbit -- a circular
    pattern with concentric rings -- partially obscured by the
    later spiral. Someone built the Chrysalis over something
    that was here first.
  door: Heavy oak, its surface dark with age and polished
    smooth by countless hands on the handle. Always unlocked.
    Iron hinges, well-oiled, the door swings without sound.
    The threshold stone is worn into a shallow bowl by
    generations of entering feet.
  pews: Six wooden pews arranged in two rows of three, facing
    the altar. Prayer cushions on each seat, the fabric worn
    thin at the knees. The wood is old but cared for -- oiled
    and polished regularly. Hymnals rest in racks on the pew
    backs, their pages soft with use.
