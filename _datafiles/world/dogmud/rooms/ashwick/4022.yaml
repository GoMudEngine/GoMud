title: Deacon's Chapel
description: >
  A modest stone chapel at the end of Chapel Lane, its walls
  thick and its windows narrow. The Chrysalis spiral is carved
  above the heavy oak door -- but look closely and the oldest
  layer of stonework beneath the spiral shows different
  geometry, partially obscured by the later carving. Inside,
  six wooden pews face a simple altar. Candles burn in iron
  sconces, their light steady. The smell of incense hangs in
  the still air. It is a place that has been many things and
  is trying very hard to be only one.
