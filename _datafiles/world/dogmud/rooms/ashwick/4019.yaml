zone: Ashwick
title: East Edge
description: >
  The hamlet ends here with an abruptness that feels almost
  intentional. Behind you, the last house on Chapel Lane
  stands with its back to the wilderness. Ahead, dense mixed
  woodland begins past the last fence -- canopy dark and
  close, the transition from tended land to wild happening
  in a single step. A narrow path leads north into the trees.
  To the south, a cottage sits apart from the others, its
  garden overgrown and a faded sign on its door.
