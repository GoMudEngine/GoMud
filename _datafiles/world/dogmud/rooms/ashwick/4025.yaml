roomid: 4025
zone: Ashwick
title: South Fields
description: >
  Fallow fields stretch south of the village gate, open to
  the sky and flat to the horizon. The soil is dark and rich,
  plowed in neat furrows but not planted this season. No one
  works this land now, though it is ready -- someone turned
  the earth and then stopped. A line of stones marks the
  hamlet's southern boundary, beyond which the fields give
  way to wild grass. The quiet here is different from the
  hamlet -- wider, emptier, the silence of unused potential.
biome: farmland
