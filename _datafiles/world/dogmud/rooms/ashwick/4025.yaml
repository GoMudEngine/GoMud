nouns:
  fields: Fallow fields, plowed but not planted. The furrows
    are neat and even -- someone took the time to prepare the
    soil and then never returned to sow. Dark, rich earth
    sits exposed to rain and wind, slowly losing the shape
    of its rows. A season's food, unplanted. In a hamlet
    this small, that means something.
  boundary: A line of stones set into the ground marking the
    hamlet's southern limit. The stones are old, half-buried,
    covered in lichen. Beyond them, the plowed earth ends
    and wild grass begins. The boundary is more tradition
    than barrier -- everyone knows where Ashwick stops.
idlemessages:
- Wind sweeps across the empty fields, bending the wild grass
  beyond the boundary stones.
- A crow calls from somewhere over the fallow ground, harsh
  and lonely.
- Clouds move fast overhead, their shadows racing across the
  unplanted furrows.
