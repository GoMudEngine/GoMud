zone: Ashwick
title: Village Gate
description: >
  A low stone wall runs north and south along the hamlet's
  western edge, broken here by a wooden gate rusted permanently
  open on its hinges. Beyond it, the hamlet of Ashwick is
  visible -- small, tidy, unremarkable. Packed-earth road leads
  east between fieldstone houses. A faded sign hangs from a post
  beside the gate, swaying slightly in the wind. The wall is
  more boundary marker than defense, barely waist-high, the
  kind of barrier that keeps goats in rather than enemies out.
