nouns:
  gate: A wooden gate set into the low stone wall, its iron
    hinges rusted open in a permanent welcome. The wood is
    weathered grey and cracked along the grain, but the frame
    still stands solid. It has not been closed in years --
    perhaps decades. More boundary marker than barrier, it
    marks where the road becomes a hamlet.
  sign: A plain wooden sign nailed to a post beside the gate.
    "Ashwick" is painted in faded black letters, the strokes
    neat but old. Below the name, a date has been carved into
    the wood, but weather has worn the numbers smooth and
    unreadable. The sign tilts slightly on its post.
idlemessages:
- Wind funnels through the open gate with a low whistle.
- A dog barks somewhere deeper inside the hamlet.
- The sign creaks on its post as the breeze shifts.
