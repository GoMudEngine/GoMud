zone: Ashwick
title: Herb Clearing
description: >
  A natural clearing where a fallen tree opened the canopy
  years ago, letting sunlight pour onto the forest floor.
  The result is a dense carpet of medicinal herbs -- feverfew,
  bitter-thistle, healers-root -- growing richer here than
  in any tended garden. Signs of recent harvesting are
  everywhere: clean cuts on stems, bare patches where plants
  were taken at the root. Whoever is harvesting knows what
  they are doing -- the cuts are precise, leaving enough
  for regrowth. A path leads east to a camp and north
  deeper into the woods.
biome: forest
