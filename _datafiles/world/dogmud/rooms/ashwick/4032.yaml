nouns:
  herbs: Dense medicinal herbs thriving in the clearing's
    sunlight. Feverfew with its white daisy-like flowers,
    bitter-thistle with purple heads and sharp leaves,
    healers-root with its distinctive red-veined stems.
    Some patches have been recently harvested -- stems cut
    cleanly with a sharp blade, not torn. The harvester
    left enough root stock for regrowth. Skilled work.
  clearing: A natural gap in the forest canopy where a large
    tree fell years ago. The fallen trunk is moss-covered
    and decomposing, returning its substance to the soil.
    Sunlight feeds the herb growth here, producing plants
    richer and more potent than anything in Delia's garden.
    The clearing is perhaps fifteen paces across, a bright
    island in the dim forest.
