roomid: 4016
zone: Ashwick
title: Hamlet Road
description: >
  The main road through Ashwick runs east and west between
  rows of fieldstone-and-thatch houses. Packed earth underfoot,
  smooth from generations of use, a single set of cart ruts
  worn into the surface like old habit. Kitchen gardens peek
  over low walls, and the smell of cooking fires and animal
  dung mingles in the still air. It is quiet in the way that
  small places are quiet -- not empty, but unhurried. A
  farmstead lies to the south.
