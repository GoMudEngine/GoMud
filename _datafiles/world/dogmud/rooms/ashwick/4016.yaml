nouns:
  houses: Fieldstone-and-thatch houses line the road, well-
    maintained and sturdy. Low walls enclose kitchen gardens
    behind each one, neat rows of herbs and root vegetables
    visible over the stone. Smoke rises from several chimneys.
    The houses are built close but not crowded, each with its
    own space -- the architecture of people who value privacy
    but not isolation.
  road: Packed earth worn smooth by generations of feet and
    wheels. A single set of cart ruts runs down the center,
    the grooves deep and permanent. The surface is hard enough
    to shed rain but soft enough to show recent footprints --
    mostly boots, a few bare feet, and the small prints of
    chickens wandering freely.
