title: Old Well
description: >
  The hamlet's well stands north of the gate, a stone-ringed
  shaft with a wooden winch and frayed rope. The stones are
  old, older than most of the hamlet, and carvings run around
  the base -- water blessings in standard Chrysalis
  iconography, worn smooth by weather and touching hands.
  Among the blessings, one set of <ansi fg="itemname">marks
  </ansi> is different. Partially overgrown with moss, it
  predates the others by what might be generations. The well
  water is clean and cold, the winch functional if creaky.
  People still draw from this well daily.
