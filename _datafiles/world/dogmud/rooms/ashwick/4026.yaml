nouns:
  well: A stone-ringed well, deep enough that dropped pebbles
    take a long count before the splash. The water is clean
    and cold -- Ashwick's primary water source. The winch is
    wooden with an iron handle, the rope frayed but holding.
    Someone has tied a knot where the fibers are thinnest.
    The stone rim is worn into shallow grooves where buckets
    have scraped for generations.
  marks: Most carvings around the well base are water blessings
    in standard Chrysalis iconography -- spirals with wave
    motifs, prayers for clean water and good health. One mark
    is older, partially overgrown with moss. It is NOT a
    blessing. The inner orbit symbol -- concentric rings with
    radial lines -- the same geometry found on old maps and
    temple doorways. Someone carved it here long ago, before
    the Chrysalis blessings covered the rest of the stone.
idlemessages:
- The well rope creaks in the wind, swaying over the dark
  shaft.
- Water echoes from far below, a hollow and distant sound.
- Moss shifts on the old stones as the breeze dries its edges.
