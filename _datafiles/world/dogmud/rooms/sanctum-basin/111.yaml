title: The Alchemist's Workshop
description: A low building of basalt and clay houses the alchemist's workshop, its
  walls stained with decades of experimental compounds. Shelves of clay pots and glass
  vessels line every surface. The air smells of herbs, sulfur, and something sweetly
  metallic. Steam curls from a pot on a small iron stove where Alchemist Yenna works
  with quiet focus.
