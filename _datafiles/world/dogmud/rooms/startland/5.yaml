roomid: 5
zone: Startland
title: The Forge
description: >
  A low-ceilinged stone chamber thick with the smell of hot metal and coal smoke.
  A massive iron anvil dominates the center of the room, its surface pitted from
  years of hammer work. A cold forge sits against the far wall, its bellows still.
  Ore scraps and metal shavings litter the floor. This is a working smithy, or
  it was, before someone let it fall to ruin.
