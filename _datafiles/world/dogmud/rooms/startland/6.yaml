title: The Alchemist's Workshop
description: >
  A cramped side room that reeks of crushed herbs and old glass. Shelves sag under
  the weight of cracked vials, bundles of dried plants, and leather-bound notes
  scrawled in a cramped hand. A long workbench dominates one wall, its surface
  stained in a dozen colors. Whoever worked here clearly valued results over
  tidiness.
