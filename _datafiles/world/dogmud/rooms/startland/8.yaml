title: The Loom Room
description: >
  A narrow room with a large wooden loom dominating the far wall, its frame
  warped with age but still functional. Baskets of cloth scraps and leather
  offcuts sit beside a low stool. Bone needles and spools of coarse thread
  are scattered across a workbench. The air smells faintly of lanolin and
  old dye.
