title: The Cook Fire
description: >
  A shallow pit lined with fire-blackened stones sits in the center of this
  cramped alcove. A crude iron grate rests across the top, scored with grease
  and soot from countless meals. A few clay pots and a battered tin ladle hang
  from pegs driven into the wall. The air is warm and smells of smoke and
  rendered fat. Whoever built this place intended it for one thing -- turning
  raw provisions into something worth eating.
