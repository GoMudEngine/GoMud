title: The Long Gallery
description: >
  The passage runs out into a gallery — high, straight, and long,
  its walls carried upward in the grey dry-fitted
  <ansi fg="itemname">courses</ansi> until they pass out of the
  light. The line of it does not waver. Set into the stonework at
  intervals, flush with the wall face, are
  <ansi fg="itemname">fragments</ansi> of a paler grey material —
  not stone, not metal, cold under the hand where the wall around
  them is merely cool. They sit within the courses rather than
  between them; they pass through no joint and interrupt none. They
  were laid in when the wall was laid. The gallery continues
  southwest. The stair foot lies back east.
