nouns:
  courses: Grey blocks in level runs, dressed smooth and fitted
    dry, each joint closed to a hairline that holds no damp and
    grows no moss. The work is exact for as far as the light
    carries and gives every sign of being exact beyond it. Nothing
    in the city above is built to this standard, or in this stone.
  fragments: Flush with the wall face, smooth, a grey paler and
    colder than the stone that holds them. No tool mark shows on
    them or near them. A fingernail does not scratch them and the
    damp does not stain them, and each one ends cleanly at the
    stone, the two materials fitted to one another with the same
    care as block to block. What they are for is not apparent from
    looking, and looking is all they permit.
idlemessages:
- Your footsteps run ahead of you down the gallery and come back a
  long moment later, thinner.
- The moving air draws steadily out of the west along the wall,
  without eddy or pause.
- Light passing across one of the pale fragments returns nothing —
  no glint, no grain, only the flat, even grey.
