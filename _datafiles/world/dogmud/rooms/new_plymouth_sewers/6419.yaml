nouns:
  table: Heavy planks on trestle legs, scrubbed pale, standing
    dead level on a floor that was made level long before tables.
    The benches are drawn up neatly on both sides, seating for a
    small and orderly company. No papers, no carving, no initials
    — whoever meets here leaves the table exactly as they found
    it, every time.
  candle-stubs: A row of tallow stubs set in clay dishes, the wax
    pooled and cold, each burned down to a different height. The
    meetings run long some nights and short on others, and nobody
    wastes a fresh candle on a short one.
  cask: A small cask, tightly hooped, proper cooper's work and
    recently maintained. A chalk-tally on its head has been rubbed
    out and remade, the newest marks still sharp — an honest count
    kept of what gets drunk down here, by people who mean to go on
    trusting each other.
idlemessages:
- The quiet in this room is a different quality from the deep
  outside — a kept quiet, swept in with the floor.
- The candle dishes hold their small pools of cold wax, waiting
  on the next meeting.
- Chalk dust shows faint on the cask head where the tally was
  rubbed out and begun again.
