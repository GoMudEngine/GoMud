zone: New Plymouth Sewers
title: The Coopers' Room
description: >
  The door in the seam gives onto a small square room that has no
  business being this clean. The floor is swept — genuinely swept,
  down here, below the whole weight of the city — and everything in
  the room is sound and looked after. A heavy
  <ansi fg="itemname">table</ansi> stands square in the center with
  benches drawn up along both sides.
  <ansi fg="itemname">Candle-stubs</ansi> sit in clay dishes along
  the table's edge, burned to different heights on different
  nights. Against the wall rests a <ansi fg="itemname">cask</ansi>
  with a fresh chalk-tally on its head, and by the door stand a
  bundle of iron-tipped staves and a box of torch stubs — whoever
  comes down here comes armed and comes lit. Someone meets here, in the
  old deep, well below the notice of the city — meets, keeps
  count, and tidies up after. The way out is the door south.
