roomid: 6404
zone: New Plymouth Sewers
title: The Welded Grate
description: >
  The tunnel ends at a round <ansi fg="itemname">shaft</ansi> rising
  toward the grand quarter above. Iron rungs climb its wall to a
  <ansi fg="itemname">grate</ansi> at the top — and there the way
  stops, permanently. Heavy <ansi fg="itemname">weld-seams</ansi> run
  across every bar, laid down from the other side, the work of someone
  above who paid good coin to make certain this door would never again
  be a door. Sound still comes down where light barely does — a
  snatch of voices, measured footsteps on stone, once in a while the
  thin ghost of music from some high room. Whatever goes on up there,
  it goes on without reference to you. The only way out is back south.
biome: city
