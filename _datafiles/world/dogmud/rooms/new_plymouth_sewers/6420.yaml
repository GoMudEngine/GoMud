roomid: 6420
zone: New Plymouth Sewers
title: The Silt Run
description: >
  Water returns to the deep here, and in quantity. The passage
  runs knee-deep in soft <ansi fg="itemname">silt</ansi>,
  and over the silt the <ansi fg="itemname">water</ansi> moves west
  with intent — not the seep and stand of the sewers above, but a
  steady, continuous draw, going somewhere and taking the passage
  along with it. Each step sinks, holds, and comes free with a
  reluctant pull. The dry channel lies back east. The flow bends
  away southwest, and from that direction the sound of more water
  gathers to meet it.
