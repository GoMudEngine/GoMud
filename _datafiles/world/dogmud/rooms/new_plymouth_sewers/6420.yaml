nouns:
  silt: Soft, fine, and knee-deep, lying in long combed ridges
    that all point the same way the water goes. It takes your
    weight slowly and gives it back the same way, and every print
    you leave is already softening behind you.
  water: Cold, dark, and moving in one steady draw with no slack
    in it anywhere. It runs clean — cleaner than anything in the
    brick country above, filtered through half a city's depth of
    stone — and it tastes of the grey rock it came through.
idlemessages:
- The current lifts a long streak of silt off the bed and carries
  it away west.
- The sound of water deepens ahead to the southwest, where more
  of it gathers.
- Something small and waterlogged turns over in the flow, is
  carried past, and is gone.
