roomid: 6406
zone: New Plymouth Sewers
title: Lamp-Niche Passage
description: >
  At regular intervals along this stretch, someone has cut small
  <ansi fg="itemname">lamp-niches</ansi> into the brick at shoulder
  height — neat, deliberate work, each one just deep enough to shelter
  a flame from the tunnel's breath. Most hold <ansi
  fg="itemname">candle stubs</ansi> burned down to puddled heels, and
  above every niche a dark <ansi fg="itemname">soot fan</ansi> spreads
  up the wall, the accumulated breath of years of small fires. The
  smell of tallow hangs under the sewer's other smells like a signature.
  People use these tunnels. People have used them for a long time,
  carefully, and by the spacing of the niches they knew exactly how
  far one candle's light would carry to the next.
biome: city
