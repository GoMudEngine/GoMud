nouns:
  stonework: Grey blocks, dense and dark, dressed to a smooth face
    and set without mortar — the joints tight enough that your
    fingernail finds them before your eye does. There is no tool
    mark anywhere on the surface, no chisel line, no dressing
    scar. The brick above was laid by hands you could name the
    trade of. This was not.
  stair: The grey steps end here, each tread worn to a shallow
    hollow down its center line. Seen from below, the wear tells
    its story plainly — the traffic came up and down this stair
    long before the brick arrived to meet it, and the brick, when
    it came, simply stopped where the older work began.
idlemessages:
- The air draws westward along the passage, even and unhurried,
  never varying its pace.
- A drop of water falls somewhere up the stair shaft, in the brick
  country above, and arrives here as a very small sound.
- The cold coming off the grey stone deepens a fraction, then
  holds.
