roomid: 6412
zone: New Plymouth Sewers
title: The Stair Foot
description: >
  At the foot of the old stair, the brick city ends. The last course
  of colonial masonry stops in a ragged line partway up the stair
  shaft, and everything below that line is other work entirely —
  grey <ansi fg="itemname">stonework</ansi> fitted dry, block against
  block, the joints so close the wall reads as one continuous
  surface. Nothing about it continues anything from above. The air
  is cooler here, and quieter, and it moves — a slow, even travel
  out of the west, as steady as a pulse. The <ansi
  fg="itemname">stair</ansi> climbs back up toward the sewers you
  know. A passage opens west, into the dark that the moving air
  comes from.
