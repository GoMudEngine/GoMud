nouns:
  drain-cap: An iron cap made to sit flush in the yard above, pried up
    at some point and never seated properly again. It admits a column
    of grey daylight and, with it, the working noise of the tannery —
    the slop of vats, a dragged hide, a voice raised and answered.
    The rungs below it are slick with the same ochre film that stains
    everything else down here.
  channel: The water moves at a walking pace, opaque and faintly warm,
    carrying whatever the yards above have finished with. Bands of
    color mark the brick at its edge — ochre, rust, a chemical white —
    each one the record of a different day's work overhead.
  run-off: A steady dribble enters through a clay pipe high in the
    east wall, tinted the exact brown of the tanning vats. Where it
    strikes the channel it raises a thin steam that smells of lime
    and old hide. The brick beneath the pipe has been eaten soft.
idlemessages:
- The column of drain-light shifts as something passes over the cap
  in the yard above.
- A fresh gout of run-off enters from the pipe, and the smell of the
  tannery renews its claim on the air.
- The channel gives a low, continuous murmur, the sound of water that
  has somewhere to be.
