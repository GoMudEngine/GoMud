roomid: 6403
zone: New Plymouth Sewers
title: Beneath the Tanning Yard
description: >
  A brick barrel-vault runs north and south beneath the tanning yard,
  its curve close enough overhead that you walk stooped without deciding
  to. Grey light falls in a single column through the pried
  <ansi fg="itemname">drain-cap</ansi> above, catching motes and the
  slow steam of the water below. The <ansi fg="itemname">channel</ansi>
  itself is stained in bands of ochre and rust where the tannery
  <ansi fg="itemname">run-off</ansi> comes down — the smell of the
  yards has followed you into the dark, lime and hide and something
  sourer underneath, and it shows no sign of giving up the pursuit.
  The vault carries on north and south into a darkness the drain-light
  does not negotiate with.
