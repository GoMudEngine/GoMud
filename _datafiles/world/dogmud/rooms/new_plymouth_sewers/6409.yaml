roomid: 6409
zone: New Plymouth Sewers
title: The Outfall Channel
description: >
  The gathered water of the junction runs fast and deep here, headed
  for the harbor with real intent. The <ansi
  fg="itemname">channel</ansi> has cut itself a voice — a hard,
  hurrying rush that fills the tunnel and leaves no room for other
  sounds. The <ansi fg="itemname">walkway</ansi> narrows to a
  boot-width shelf along the east wall, forcing you to face the brick
  and mind your feet, and at intervals along it iron <ansi
  fg="itemname">hauling-rings</ansi> are set into the wall, their
  inner curves worn bright as new silver by rope. Cargo has come up
  this channel against that current, and more than once — enough
  times to polish iron.
