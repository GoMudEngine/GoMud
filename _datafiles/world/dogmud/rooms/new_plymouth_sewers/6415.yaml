nouns:
  wallow: The pool fills the low center of the chamber, dark and
    quiet, its rim worn to a polish by the passage of a body far
    heavier than yours. The water gives no account of its depth,
    and no account of what may be under it.
  silt-shelf: A raised bank of packed silt above the waterline,
    dry, broad, and flattened at its center into a long hollow the
    shape of something at rest. The bones are densest at its
    edges, as though pushed aside to keep the sleeping place
    clear.
  bones: Cracked for the marrow, every one. Rat, dog, gull, and
    larger — some of the larger ones you decide not to examine
    closely. None were washed here; there is no current on the
    shelf to wash them. They were carried, eaten, and dropped,
    in layers going down.
idlemessages:
- Somewhere under the water, a slow heavy sound moves once and
  stops.
- The still surface of the wallow holds a slow drip from the
  ceiling, ring after ring widening and gone.
- The smell off the silt-shelf thickens when the air turns.
