nouns:
  pool: Black past the first inch, and still in the way only deep
    water is still. The surface gives back your light as a flat
    sheen and gives back nothing else. Every so often it moves —
    a long swell rising from beneath and subsiding — and the
    movement settles any question of wading in before the question
    is fully formed.
  shelf: A ledge of the old grey stone running along the south
    wall, dry and sound underfoot, a comfortable width so long as
    you are not looking at the water. It is the only footing in
    the room, and it stays well back from the pool's edge the
    whole way along.
idlemessages:
- The surface of the pool swells once, without a sound, and
  settles.
- A ripple crosses the black water from somewhere along the north
  wall, where nothing shows.
- Water drips from the ceiling out over the pool, each drop
  landing with a sound too small for the room.
