nouns:
  walkway: A raised brick shelf running the tunnel's length, wide
    enough for one person walking carefully or two people who trust
    each other. Its surface is worn smooth down the center — feet
    have used this route for a long time, and not only rat feet.
  droppings: Drifted along the wall's base in quantities that suggest
    a population rather than a visitor. Some are old and grey, some
    are not old at all. The colony is large, established, and by all
    evidence thriving on the quarter's leavings.
  gnawed timber: A shoring post set by some past generation of sewer
    men, now chiseled to an hourglass waist by patient teeth. The
    tooth-marks overlap in layers, oldest darkened, newest pale.
    It still holds. It will not hold forever.
idlemessages:
- A skitter of small claws crosses the brick somewhere beyond the
  lamplight, hurried and then abruptly silent.
- A chorus of small scratching starts up inside the wall, runs for
  a moment, and stops.
- The channel carries something past — a rind, a rag — and a moment
  later, farther downstream, the water answers with a soft plop.
