roomid: 6405
zone: New Plymouth Sewers
title: The Northern Trunk
description: >
  The trunk tunnel runs broad and straight here, the main artery of
  the quarter's underside. A raised <ansi fg="itemname">walkway</ansi>
  of worn brick keeps you a hand's width above the channel, which
  slides past dark and businesslike on its way south. The rats own
  this stretch and have not troubled to hide it — <ansi
  fg="itemname">droppings</ansi> line the walkway's edge in drifts,
  the <ansi fg="itemname">gnawed timber</ansi> of an old shoring post
  has been chiseled nearly through by generations of teeth, and at
  the far edge of your lamplight something low and quick is always
  just finishing the business of leaving.
biome: city
