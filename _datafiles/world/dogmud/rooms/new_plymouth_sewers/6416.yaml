nouns:
  sealed slab: A single stone filling the doorway entire, its face
    dressed to the same finish as the wall that holds it. No seam
    runs around it that a knife-edge could find. There is no
    hinge, no pull, no keyhole, no gap for a bar — no sign that it
    was ever meant to move. Struck, it barely sounds
    at all. It was made to be closed, and it is closed.
  nested rings: Faint concentric circles, one within another, cut
    low on the slab and worn almost to nothing. It is a figure,
    not an accident of the stone — the spacing is too even for
    that — but nothing about it says what it is, or was, or meant.
    The incision is old past guessing. It is the only mark
    anywhere on the slab.
idlemessages:
- The slab carries no sound through it. The passage behind you is
  the loudest thing in the room.
- At the edge of your light the figure of nested rings comes and
  goes with the angle.
- The moving air of the deep ways does not enter this chamber. The
  stillness here is complete.
