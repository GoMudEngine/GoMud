zone: New Plymouth Sewers
title: The Sealed Chamber
description: >
  The passage ends at a doorway that is not a doorway any longer,
  if it ever was one. The opening is filled, jamb to jamb, by a
  single fitted <ansi fg="itemname">sealed slab</ansi> — one stone,
  without seam, hinge, or keyhole, dressed flush to the wall around
  it and closed with the same completeness as everything else the
  old builders finished. Low on its face, worn nearly away, a
  figure of <ansi fg="itemname">nested rings</ansi> is cut into the
  stone — faint circles, one inside another, the incision almost
  gone. The chamber holds nothing else. Whatever lies behind the
  slab, if anything does, has been behind it a very long time. The
  only way out is back north.
