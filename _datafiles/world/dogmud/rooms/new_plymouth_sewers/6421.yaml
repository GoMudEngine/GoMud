nouns:
  current: The gathered water of the deep, running west in one
    body now, quick and dark and shallow enough to wade. Every
    flow of the deep ways ends up in this bend, and the bend
    hands all of it on in a single direction.
  canal brick: Colonial brick, fired and mortared, worked into the
    old grey stonework in runs and wedges wherever the older
    courses had failed or fallen short. The bricklayers matched
    nothing — not the coursing, not the module, not the stone —
    they simply filled what needed filling and moved on. The
    joins between the two ages are plain as a scar.
idlemessages:
- The braided current parts around a fallen block and closes over
  again on the far side.
- Mortar grit trickles from a seam of the canal-brick and is
  taken west by the water.
- The sound of the current changes at the bend, deepening as the
  water finds its one direction.
