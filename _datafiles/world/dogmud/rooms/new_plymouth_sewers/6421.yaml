zone: New Plymouth Sewers
title: Where the Waters Turn
description: >
  The flows of the deep gather in this wide bend and turn west
  together, braiding into one <ansi fg="itemname">current</ansi>
  with one direction, running quick and dark and low. And here,
  for the first time since the stair foot, the walls begin to
  change. Runs of <ansi fg="itemname">canal-brick</ansi> appear in
  the old grey courses — patched in, toothed in, filling gaps and
  shoring corners — two ages of the city meeting in the same wall,
  neither one giving way entirely. The brick is rough and hasty
  beside the old work, and the old work makes no comment. The silt
  run lies back northeast. The current, and the passage with it,
  goes west.
