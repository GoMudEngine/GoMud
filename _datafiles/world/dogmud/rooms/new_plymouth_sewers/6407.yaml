title: Beneath Sweeper's Corner
description: >
  The tunnel floor dips here and the water has taken advantage —
  <ansi fg="itemname">standing water</ansi> spreads wall to wall,
  shin-deep and reluctant, going nowhere in particular. Above it, grey
  daylight seeps through the clogged <ansi
  fg="itemname">gutter-grate</ansi> of Sweeper's Corner, strained
  through the quarter's compacted leavings until what arrives is less
  light than the rumor of light. The street comes down with it — cart
  wheels on flagstone, a voice hailing another voice, the ordinary
  traffic of the Common overhead. The surface feels very close and
  very far at once, the way a shore feels from under water. The trunk
  continues north, and a lower passage angles away southwest.
