nouns:
  standing water: Shin-deep and still, skinned with a grey film that
    the falling drips punctuate without disturbing. The dip in the
    floor holds it the way a saucer holds spilled tea. Somewhere
    beneath your boots the drain that should carry it away is making
    its slow, losing argument with the quarter's debris.
  gutter-grate: Seen from below, the grate is a dark lattice packed
    with the street's castoffs — leaf-mash, grit, rag-ends — through
    which daylight arrives already exhausted. Now and then the mass
    shifts a fraction as the sweeper above rearranges his territory,
    and a fresh drip finds its way down.
  daylight: What passes for it — a grey suggestion filtering through
    the packed grate, enough to silver the water's surface and no
    more. It is the closest thing to open air this tunnel is offered.
idlemessages:
- Cart wheels cross the grate overhead with a sound like slow thunder,
  and grit sifts down onto the water.
- A voice in the street above says something brief and cheerful, and
  another voice answers it, and both move on.
- A single drip falls from the grate, rings once across the standing
  water, and the stillness closes over it.
