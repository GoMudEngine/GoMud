zone: New Plymouth Sewers
title: The Old Watercourse
description: >
  A dry channel runs through this reach of the deep — a watercourse
  that has not carried water in a long age, its
  <ansi fg="itemname">bed</ansi> floored in hard silt gone over to
  cracked plates. On the south wall the stone has failed. A
  <ansi fg="itemname">collapse</ansi> chokes what was once an
  opening there, the rubble part-cleared and then let alone, and
  through the gaps between the fallen blocks you can make out
  worked stone of a different character beyond — and feel a faint
  current of dry air moving through, from somewhere you cannot
  follow it to. The fall itself is total; no gap admits more than
  a hand. Across the bed a faint scuffed track shows in the silt,
  running toward the north wall and ending at it. The channel bed
  carries on east and west.
