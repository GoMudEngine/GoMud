zone: New Plymouth Sewers
title: Beneath Cutter's Lane
description: >
  The harbor announces itself before you see any way to reach it —
  salt and tar and fish-gut on the air, cut through the sewer's own
  smells like a knife through tallow. Overhead, a <ansi
  fg="itemname">loose grate</ansi> lets down a grey slot of alley
  light, and a <ansi fg="itemname">knotted rope</ansi> hangs from its
  bars, dark with the grip of many hands — an arrangement nobody
  official installed and nobody official has removed. Along the brick
  at chest height runs a crisp <ansi fg="itemname">barnacle
  line</ansi>, white and sharp as a chalk mark, showing exactly how
  far the tide reaches into the tunnel and how regularly it keeps the
  appointment. The trunk continues north; everything south of here
  belongs to the sea twice a day.
