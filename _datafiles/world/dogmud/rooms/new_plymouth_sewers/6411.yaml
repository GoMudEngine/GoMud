nouns:
  loose grate: A dock grate that sits in its collar without being
    fastened to it, lifting aside with a practiced shove. Its
    underside is worn smooth where hands have pushed it a thousand
    times. Through the gap come gull-noise and rigging-creak, carried
    in off the harbor close by, and a thin grey light with an alley's
    shadow already in it.
  knotted rope: Hemp gone grey-black with handling, knotted at
    forearm intervals for climbing, made fast to the grate's bars
    above. It is a tool in daily use — supple, sound, and not
    fraying — maintained by the same community of nobody that keeps
    the grate loose.
  barnacle line: A band of small white shells cemented to the brick
    in a line level as a mason's string. Below it the wall is
    sea-scoured and dark; above it, ordinary sewer brick. The tide
    comes exactly this far, every day, twice, and has done so long
    enough to grow its own boundary marker.
idlemessages:
- A gull's cry drops through the loose grate, absurdly bright
  against the tunnel's gloom.
- The water below stirs and rises a finger's width — somewhere out
  past the outfall, the tide is changing its mind.
- The knotted rope swings gently, touched by the harbor draught
  coming down through the grate.
