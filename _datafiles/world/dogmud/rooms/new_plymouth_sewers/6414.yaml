nouns:
  silt: A fine dark sediment laid evenly across the chamber floor,
    deep enough to hold a print. It records everything that
    crosses it, and what it records most is the traffic through
    the south passage — the same broad track, laid down over
    itself, again and again.
  drag-marks: Broad furrows pressed into the silt, deeper at the
    center than any boot or barrow could account for, all of them
    running through the south passage and none of them anywhere
    else. Something heavy goes that way, and comes back, and has
    been doing both for long enough to wear its road smooth.
idlemessages:
- The water sound from the west rises a little, then settles back
  to its steady register.
- The current of air crosses the junction, pauses, and resumes
  from a different quarter.
- From somewhere down the south passage comes a single low sound,
  not repeated.
