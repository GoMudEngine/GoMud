zone: New Plymouth Sewers
title: The Junction of the Deep Ways
description: >
  Three ways meet in a broad chamber of the old stonework — a
  junction that appears on no map the city keeps, marked by no
  survey pin, numbered by no engineer. It was here before there was
  anything above to map it. A current of air moves through the
  chamber with no source you can put a direction to, arriving and
  leaving on its own schedule. From the west comes the sound of
  water, low and continuous. The way south is different. The
  <ansi fg="itemname">silt</ansi> across its threshold is scored
  with long
  <ansi fg="itemname">drag-marks</ansi>, broad and repeated, and
  the air out of that passage carries a smell the other two do
  not. The gallery lies back to the northeast.
