zone: New Plymouth Sewers
title: The Old Landing
description: >
  The tunnel widens into a landing that serves two purposes, and
  neither of them is yours. Off the west wall opens a smuggler's
  <ansi fg="itemname">alcove</ansi> — tide-marks banded up its brick,
  a stack of empty <ansi fg="itemname">crates</ansi> with their lids
  set carefully back on, and a cold <ansi fg="itemname">lantern</ansi>
  hung on a nail, waiting for a hand that knows which nights to come.
  Somebody stages goods here between tides, and the whole arrangement
  says, politely, that it is none of your business. The second feature
  is harder to be polite about. In the south corner an <ansi
  fg="itemname">old stair</ansi> descends — steps of a grey stone
  that matches nothing else in the sewers, each tread worn hollow in
  the middle, plainly older than the brick, the landing, and the city
  that arranged itself on top of them. The tunnel itself continues
  north and south.
