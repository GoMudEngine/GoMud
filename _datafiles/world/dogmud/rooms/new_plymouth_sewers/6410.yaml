nouns:
  alcove: A dry pocket cut off the main tunnel, floored above the
    tide-marks with someone's care. The bands of high water climb
    its brick like rings in a bathtub, and everything stored here
    has been placed with reference to them. It is swept. Smugglers
    who sweep are smugglers with a long lease.
  crates: Empty, but honestly empty — lids set back square, straw
    packing shaken out and piled to one side for reuse. No shipping
    marks, no owner's brand, nothing burned or stenciled anywhere on
    them, which is itself a kind of signature.
  lantern: A tin storm-lantern hung on a nail driven between bricks,
    its glass clean, its reservoir full, its wick trimmed and cold.
    It is ready. Whoever it is ready for is not you.
  old stair: Steps of a dense grey stone descending into the dark,
    each one worn to a shallow hollow down its center line — the
    erosion of feet, in numbers and across a span of years that the
    sewers above cannot account for. The stone matches nothing in
    the vault, the brick, or the city. The stair was here first.
    It goes down.
idlemessages:
- Water laps at the tide-marks in the alcove, checking its old
  measurements.
- The lantern shifts a fraction on its nail, though no draught
  admits to moving it.
- Cold air rises off the old stair, carrying a mineral smell that
  belongs to somewhere much deeper.
