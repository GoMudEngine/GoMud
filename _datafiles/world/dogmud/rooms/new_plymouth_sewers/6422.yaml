roomid: 6422
zone: New Plymouth Sewers
title: The Canal Outfall
description: >
  The gathered water of the deep pours away through a wide
  <ansi fg="itemname">arch</ansi> in the west wall — canal-brick
  above, old grey stone below — and falls, quietly, into open
  black water beyond. Through the arch lies drowned country. A
  flooded <ansi fg="itemname">canal</ansi> runs off into the dark,
  cold air standing over it, the buried remains of another quarter
  of the city sunk along its banks. Stand a moment at the lip and
  the shape of the thing arrives on its own — the sewers, the deep
  ways, the drowned canals, all one connected dark under the
  city's floor, and anything that cared to move through it unseen
  could go very nearly anywhere at all. The bend of the waters
  lies back east. The arch opens west.
