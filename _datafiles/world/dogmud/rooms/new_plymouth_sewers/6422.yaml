nouns:
  arch: Wide and low, sprung in old grey stone with colonial
    canal-brick packed in above it — the two ages of the city
    sharing the load of everything overhead. The water passes
    through it in a smooth, even sheet and drops away into the
    canal with hardly a sound, as though it has made this exact
    exit so many times there is nothing left to remark on.
  canal: Beyond the arch the water opens out into a drowned
    channel running away westward into the dark — straight-sided,
    deliberate, built work, flooded to the height of a wading man
    and cold enough that the air above it bites. Somewhere out
    along it stand the sunken streets of the Old Quarter's deep
    level, and this outfall has been feeding their flood for
    longer than anyone above knows.
idlemessages:
- The sheet of water through the arch thins, thickens, and evens
  out again as the flows behind it shift.
- Cold air moves in off the drowned canal, carrying the flat
  mineral smell of deep standing water.
- Far out along the canal, something drips from a height into the
  flood, evenly, like slow footsteps.
