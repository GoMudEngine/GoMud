roomid: 6408
zone: New Plymouth Sewers
title: The Junction Vault
description: >
  Three flows meet beneath a brick <ansi fg="itemname">dome</ansi>
  here, and the vault gives their meeting a voice — a layered,
  continuous rush that arrives from every direction at once and makes
  a stranger of your own footsteps. Water enters from the northeast
  and from somewhere behind the west wall, folds together in a slow
  <ansi fg="itemname">confluence</ansi> at the chamber's center, and
  leaves southwest with its argument settled. Below the familiar
  colonial brick, at the waterline, runs a course of <ansi
  fg="itemname">old stonework</ansi> — grey
  blocks fitted without mortar, tight as a held breath, in a style
  that matches nothing above them. The brick was built on top of it,
  the way a thing is built on whatever was already there.
