nouns:
  the street: >
    College Row runs east to west as well as north
    and south here — the main artery of the
    residential quarter, where the faculty actually
    live rather than work. The cobbles are swept
    more carefully than the back lane; the residents
    take some pride in the row's appearance, and the
    narrowness of it means neighbours are aware of
    each other's choices. The tea house to the east
    and the quieter terrace to the west mark the
    character of the row: respectable, habituated,
    unhurried.
  the gardens: >
    Front gardens behind low walls and iron railings
    along both sides of the row — each modest enough
    that a serious gardener would call them
    forecourts, but tended with a care that says they
    matter to their owners. One has a clipped hedge;
    one has herbs in pots along the sill; several
    have a single large stone urn planted with
    something seasonal. The gardening here is the
    kind that happens in the margins of a working
    life, and shows it.
