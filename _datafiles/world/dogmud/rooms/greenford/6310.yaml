zone: Greenford
title: College Row
description: >
  The principal residential street of the upper
  town opens here — a wider cobbled way lined
  with terrace houses on both sides, their front
  gardens bounded by low stone walls and wrought-
  iron railings. A distinctive blue door at the
  near corner of the west terrace marks the first
  house on that side; through its front window,
  maps and folios are visible in mid-stack. To
  the east, the tea house has already opened, its
  window fogged with morning steam. The street
  continues south toward the quieter end. Examine
  the street or the gardens.
