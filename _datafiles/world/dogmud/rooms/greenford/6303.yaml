title: The Archive
description: >
  The archive is dim and deliberate — shelves
  deeper than those in the reading room, materials
  older, the air holding the mustiness of paper
  long undisturbed. Box-files and survey portfolios
  line the walls by region and date. The oldest
  runs carry a mark in their margins recurring
  across many decades of fieldwork: nested rings,
  drawn by different hands over different years,
  which the archive has never explained and not
  quite agreed to ignore. A
  <ansi fg="itemname">filed-survey</ansi>
  lies open on the reading-stand. The restricted
  collection is east. Examine the filed-survey or
  the shelves.
