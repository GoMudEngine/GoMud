roomid: 6283
zone: Greenford
title: The Boathouse
description: >
  A long timber building open at the river end, the
  interior divided between moored craft and stored gear.
  A skiff sits in the near slip, its hull tarred and its
  oars shipped on the thwarts — rigged and ready, waiting
  on a tide or a purpose. Nets hang from the rafters in
  dark swags, some mended with pale new cord, some still
  stiff with salt and river-silt. The smell is tar, rope,
  and old water. A vent in the far gable lets light in
  and the worst of the river-damp out. The nets overhead
  and the gear along the walls are worth examining — the
  boathouse runs a working trade.
biome: water
