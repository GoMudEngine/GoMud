title: The Cartographer's Rest
description: >
  The Cartographer's Rest is the kind of inn that
  has made no concessions to fashion in a long time.
  Woodsmoke and last night's cooking have settled
  into the ceiling beams; the tables are heavy oak
  and have been here since before the current
  innkeeper. A long settle along the north wall holds
  the regulars; the bar occupies the east end with its
  row of tapped barrels and a chalk-slate listing what
  is available. A stair from the south corner climbs
  to the lodging floor; a door beside it opens to the
  Guild Lane. Examine the hearth or the stair.
