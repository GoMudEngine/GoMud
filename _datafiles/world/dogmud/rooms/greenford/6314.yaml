roomid: 6314
zone: Greenford
title: The Quiet End
description: >
  The west lane narrows here toward its quieter
  end — the terraces more spare, their front
  gardens longer and left more to themselves.
  An older house sits close on the right, its
  front gate hanging open; the occupant is just
  visible at the window without appearing to
  watch. Ahead to the south, the lane closes
  on its last house, marked plainly by the
  spread of a large overgrown yew above the
  front wall. The lane runs east and north,
  and ahead to the south toward the yew.
  Examine the gardens or the lane.
biome: city
