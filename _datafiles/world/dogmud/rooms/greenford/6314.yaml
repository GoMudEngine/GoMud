exits:
  north: {roomid: 6311}
  east: {roomid: 6316}
  south: {roomid: 6315}
nouns:
  the gardens: >
    Front gardens behind the quieter terraces —
    longer than those on College Row, their
    planting less deliberate: grass between
    stepping stones, a climber that has not been
    directed in some years, a kitchen garden at
    the far end of one that looks genuinely used
    rather than decorative. These are the gardens
    of people with enough space to let things
    grow at their own pace. The one with the
    open gate has a lilac coming into its last
    week of flower.
  the lane: >
    The lane at its narrowest, the older terraces
    closing in on either side. Looking south:
    the lane ends in a clear stop, a large yew
    overhanging the last front wall, its branches
    spread well out into the lane. Looking north:
    the way back toward College Row. The lane is
    quiet enough here that birdsong from the
    gardens carries easily. Nothing moves quickly
    at this end of the residential quarter.
spawninfo:
  - mobid: 9528
    respawnrate: "20 real minutes"
idlemessages:
- The open gate at the near house moves a fraction in a breath of air and settles.
- Sparrows work the front hedges along the lane, indifferent to the morning.
- The overgrown yew at the lane's end catches a breeze; it moves slow and heavy.
