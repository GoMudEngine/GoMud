title: The Cloister Walk
description: >
  A covered walk of dressed stone running between
  the quadrangle to the north and the back college
  to the south — a narrow corridor of pillared
  arches opening onto a small garden court to the
  east, its stone-paved centre planted with a
  single old quince tree. The walk is cold even
  in mild weather, the stone drawing warmth from
  the air. Students and faculty cross it without
  lingering. Brennan's office is west; the reading
  room east; the college lane south. Examine the
  arches or the old quince.
