title: The Market Square
description: >
  The Town Stair gives out here onto the Market
  Square — the upper town spreading from the top
  of the climb. It is not large, the kind of square
  a market fills comfortably on a weekday morning
  with room to cross between the stalls. The
  Bookshop opens to the west; the Cartographer's
  Rest inn holds the east side, smoke already at
  the chimney. South, the Market Cross stands at
  the square's far end. Above the roofline the
  university tower is plainly visible now, squared
  against the sky, at its full height at last.
  Examine the stalls or the inn sign.
