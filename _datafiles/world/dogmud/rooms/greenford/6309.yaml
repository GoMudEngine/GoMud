nouns:
  the lane: >
    The short lane between the college's back gate
    and the first of the residential streets —
    cobbled here in a smaller stone than the college
    precinct uses, the surface well-maintained but
    not dressed for show. Tree-roots have worked at
    one edge of the cobbling without quite lifting
    it. The lane is narrow enough that two people
    with bags would need to turn sideways, and wide
    enough that they generally don't have to.
  the houses: >
    Narrow terraced houses on either side of the
    lane, their fronts flush with the cobbles: no
    forecourt, no front garden here at the gate
    end, just the stone face and the door. Faculty
    housing, built in an era when the university
    owned more of this quarter than it does now.
    The houses are well-kept, their paintwork
    maintained and their windows clean. Smoke begins
    at the nearer chimneys: someone is up.
idlemessages:
- Morning smoke rises straight from the chimney nearest the gate.
- A door in one of the terrace houses opens and closes; no one appears.
- The cobbles in the lane are damp from the night; the morning will dry them out.
