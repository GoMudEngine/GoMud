roomid: 6301
zone: Greenford
title: The Library
description: >
  The public stacks: a long room of shelved
  periodicals and reference works, the shelves
  running at right angles to the south wall in
  deep bays. The air is dry and cool and carries
  the compound of old paper and linen binding.
  Tall arched windows along the east face fill
  the room with good working light without heat.
  A returns-cart near the entrance holds volumes
  to be re-shelved; a card catalogue in oak cases
  stands beside the desk where the librarian
  works. The reading room is south. Examine the
  catalogue or the shelves.
biome: city
