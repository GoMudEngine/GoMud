nouns:
  the card catalogue: >
    A run of oak cases against the north wall, the
    drawer-fronts labeled in a clear hand: author,
    title, and subject, cross-referenced through
    three separate sequences. The system is precise
    and learned — the librarian's work, maintained
    over many years. Each drawer holds cards in a
    particular order that is not immediately evident
    to a new user but becomes legible with use. The
    catalogue covers everything in the public stacks.
    It does not cover the archive.
  the shelves: >
    The shelves run in deep bays at right angles to
    the south wall — older sections in dark wood,
    newer additions in a lighter pine not yet aged
    to match. The public stacks run heavy on
    periodicals in bound runs, reference works in
    geography and natural philosophy, and a long
    back-set of the university's own published
    papers. Everything is labeled at the bay end.
    The lower shelves are lending; the upper tiers
    are reference only.
  the returns-cart: >
    A low wooden trolley near the entrance, its
    platform loaded with volumes awaiting re-
    shelving: thick periodicals, a geography in
    two volumes, a pamphlet bound into a stiffened
    cover. The cart gets emptied and refilled on
    a daily cycle the librarian manages with
    visible efficiency. Today's returns suggest
    someone has been working in natural philosophy
    and the river survey literature.
  the windows: >
    Tall arched windows along the east face, their
    sills dressed in cut stone. The glass is clear
    and recently cleaned; the light is good and
    falls across the bay ends without casting shelf-
    shadows at the worst angles. On a clear morning
    the windows let in enough light that no lamp is
    needed at the desk until mid-afternoon. This
    was apparently a deliberate choice of the
    architect and is considered the building's best
    quality by the people who work in it daily.
