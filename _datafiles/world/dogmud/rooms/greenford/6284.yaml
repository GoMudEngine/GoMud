title: The Climbing Lane
description: >
  The lane begins its rise here, the packed-earth surface
  giving way to old cobble as the grade steepens away from
  the river. The buildings on either side press closer as
  the lane climbs — timber-framed fronts, shuttered windows,
  a carved lintel here and there that dates the street's
  age. The river smell fades behind you and something drier
  takes over: sun-warmed stone, beeswax from a candlemaker's
  uphill, a hint of library dust that must be coming from
  further above. Looking up, the square tower of the
  university is now fully visible above the rooflines,
  its upper stonework clear against the sky. The town
  is above you, and the lane goes up into it.
