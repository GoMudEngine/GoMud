zone: Greenford
title: The Town Stair
description: >
  The riverfront ends here at a broad stone stair rising
  from the lane into the town above. The stair is old —
  the treads hollowed by foot-traffic, the stone balustrade
  on the upper side worn smooth where hands have steadied
  themselves on the climb. From the foot of the stair the
  town is visible: a bookshop sign above a door on the
  right, a covered market at the stair's top where voices
  carry down on the still air, and beyond the market's
  edge the university tower clear against the sky, its
  full height finally apparent from this close. The stair
  goes up into all of it; the Market Square opens at
  the top.
