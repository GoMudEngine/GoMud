zone: Greenford
title: The Town Hall Steps
description: >
  The Town Hall is the upper street's largest building —
  a plain stone front with three narrow windows above
  the door and a flight of broad steps from the lane.
  The steps have settled unevenly over the years so that
  the third from the bottom rocks underfoot, which
  everyone in town knows and strangers invariably
  comment on. The door is heavy and has a brass knocker
  cast as a closed fist. A board to the left of the door
  carries civic notices in a formal hand: meeting records,
  rate schedules, public announcements. The lane continues
  south, climbing toward the university. Examine the
  board or the knocker.
