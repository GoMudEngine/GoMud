nouns:
  distance board: >
    A board of seasoned pine nailed to the south gatepost
    at eye height, the lettering painted in the road-
    warden's careful hand: COACHING STABLE, NORTH;
    WAYFARER'S SHRINE, SOUTH; NEW PLYMOUTH, THREE DAYS.
    Below, in smaller letters added later: ROAD MAINTAINED
    TO THE COUNTY MARK. The information is correct and
    periodically repainted. The board has been here long
    enough to have a wasp's nest in its upper right
    corner that the road-warden tolerates.
  the gateposts: >
    Two posts of dressed limestone, square-cut and set
    plumb in the verge on either side of the road —
    solid work, old enough that the mortar between the
    courses has weathered out and been repointed more
    than once. The pintles on the inner faces are empty:
    the gate was removed generations back, the posts
    kept as a boundary marker and a habit. Each post
    stands taller than a man by a handspan. The road-
    warden has carved a tally mark into the north post's
    base, its meaning private.
