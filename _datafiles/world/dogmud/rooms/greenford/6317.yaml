roomid: 6317
zone: Greenford
title: The West Gate
description: >
  The lane meets its western end at two dressed stone
  gateposts set square in the verge — no gate between
  them now, the pintles empty, the posts serving as a
  threshold rather than a barrier. The cobbles give out
  here; beyond the gateposts the surface shifts to packed
  earth and gravel, the road running clear and level west
  into the open country. A distance board is nailed to
  the south post in a steady hand. The warden's lean-to
  shelters against the north post, a log bench beside it
  worn flat with use. East, the lane returns to the hall
  steps and the square. Examine the
  <ansi fg="itemname">distance-board</ansi> or the gateposts.
