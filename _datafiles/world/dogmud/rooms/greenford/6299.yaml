zone: Greenford
title: The Quadrangle
description: >
  The university's central court: a wide paved
  quadrangle with a sundial on a sandstone plinth
  at its centre, gravel paths crossing it at right
  angles. The tower rises at the north end, the
  lecture-hall range runs west, the library east,
  the cloister walk opens south to the college's
  quieter precincts. Students cross the quad in
  the way people cross a space they cross every
  day — without looking at it. The air carries
  chalk, old stone, and the faint sweetness of
  the planted borders. Examine the sundial or
  the tower.
