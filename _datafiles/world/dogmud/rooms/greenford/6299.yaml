nouns:
  the sundial: >
    A sandstone plinth at the quad's centre, the
    bronze gnomon dark with age. The hour-lines
    are finely cut and still accurate. A small
    bronze plate on the plinth's south face carries
    a motto in the academic Latin most students
    here can read: Time counts what we choose not
    to. The plate is more recent than the sundial,
    added by some provost who felt the motto
    appropriate. The sundial was here before the
    motto and does not especially care either way.
  the tower: >
    The tower stands at the north end of the quad
    and makes the rest of the university look
    smaller than it is. Its base stones are broad
    and old; the upper courses are lighter — two
    phases of building that have spent enough time
    together to look intended. The arched openings
    at the crown let the sky through on all sides.
    In weather the tower catches wind first; the
    jackdaws up there have long since stopped
    being bothered.
  the planted borders: >
    Low border planting along the quad's inner
    edges — clipped box and a running ground-cover
    that has been here long enough to have its own
    formal shape. In the east border a single rose,
    very old, its canes thick as a thumb, currently
    not in flower. The gardener attends to it more
    carefully than to the rest. Some things are
    maintained out of respect for how long they
    have been there.
  the gravel paths: >
    The paths cross the quadrangle at right angles,
    raked to clean lines each morning. The crossing
    at the centre is where student traffic naturally
    converges; the gravel there is worn deeper and
    re-raked more often. Along the edges the borders
    are kept from the paths by thin stone kerbs, laid
    in the old way — slightly proud of the surface,
    to stop the gravel spreading.
