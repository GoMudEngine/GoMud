nouns:
  the counter: >
    A long counter of scrubbed oak, its surface pale from
    years of scouring. A small bell sits at one end for
    summoning the clerk, and a shallow ink-stain has soaked
    permanently into the grain near the ledger's usual
    resting place.
  the ledger: >
    A ledger the size of a cartwheel, lying open on a
    slanted writing desk behind the counter. Columns of
    figures run down every page in a careful, unhurried
    hand — rents, loan payments, grain-tithe accounts, and
    a few larger entries in red ink that carry no names.
  the strongbox: >
    A heavy iron strongbox bolted through the floorboards
    into the stone beneath. The lock takes a long-shanked
    key that never seems to leave the clerk's coat. The
    iron is dull and scarred, but sounds entirely solid
    when a knuckle taps it.
