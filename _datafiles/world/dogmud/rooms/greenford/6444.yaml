zone: Greenford
title: The Greenford Counting House
description: >
  The Counting House sits just off the Guild Lane, a squat
  building of the same grey stone as the town hall but with
  none of the civic flourish. A plain counter of scrubbed
  oak divides the room, and behind it a wall of pigeonholes
  holds tied bundles of paper. A strongbox is bolted to the
  floor in the far corner, and a ledger the size of a
  cartwheel lies open on a slanted writing desk. The smell
  is beeswax and old paper, with a faint mineral note from
  the strongbox iron. Examine the counter or the ledger.
