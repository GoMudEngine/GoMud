nouns:
  the fire: >
    A stone grate in the east wall, lit to a low
    working fire that takes the edge off the morning
    chill. The mantel is plain dressed stone; a
    small clock on it, wound to approximate accuracy.
    The logs in the basket to the left are cut to a
    particular length that fits the grate, which has
    been its fixed dimension since it was built. The
    fire-tongs and poker are both worn to a shine at
    their grips from long use. Nothing about this
    fireplace has changed in twenty years.
  the sideboard: >
    A wide sideboard along the north wall, its
    surface given over to the coffee service: a
    large pot with a flame underneath to keep it
    warm, an array of cups in varying states of
    use, a small jug of cream and a bowl of rough
    sugar. The service is old and mismatched,
    accumulated over many years of ordinary use.
    No one is responsible for it; everyone uses
    it. The cups are cleaned when there are no
    clean ones left.
  the chairs: >
    A circle of upholstered chairs around the grate,
    their arms worn to a lighter shade at the most-
    used spots. Each chair has shaped itself to one
    person's long habit — identifiable by department
    to those who know the room well. The
    draught near the window has been the subject of
    complaint for years; the chair nearest it is the
    one no one has claimed as a habitual seat. The
    upholstery is due for replacement. This has been
    true for some time.
  the books: >
    Books shelved between the chair-backs at
    irregular intervals — accumulated rather than
    collected. Half-works with the interesting parts
    already read, duplicates from office overstock,
    a bound run of a periodical nobody has requested
    back, a novel that has not been where it was
    placed for the past year. Some have been here
    long enough that their owners are no longer on
    the faculty. The books stay. The faculty change.
    The room keeps what it keeps.
