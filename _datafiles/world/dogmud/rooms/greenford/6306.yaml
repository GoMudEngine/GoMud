roomid: 6306
zone: Greenford
title: The Senior Common Room
description: >
  The faculty common room keeps its own pace —
  chairs with worn arms, a fire grate lit in all
  but the warmest months, a sideboard with a
  coffee service in daily use. Shelved between
  the chair-backs are books that arrived here by
  gradual drift: half-works, duplicates, the odd
  gift from a grateful former student. The room
  smells of wood-smoke and old upholstery and
  coffee grown cold in the cups on the side table.
  Faculty come here to be not-working. Examine
  the fire or the sideboard.
