roomid: 6293
zone: Greenford
title: The General Store
description: >
  The shelves run the full length of the room in
  three tiers: lamp oil and candles at eye-level,
  rope and leather-working supplies below, dry goods
  and small hardware at the top. The general store
  covers everything the market stalls and the
  specialist shops between them do not. A counter
  runs the front with a balance scale and a glass jar
  of boiled sweets that has occupied the same spot
  since before anyone now working here can remember.
  Resin and tallow and the dry-sweet smell of grain
  sacks — the smell of the place — follows you in.
  The store-keeper has the stock committed to memory.
  Examine the shelves or the counter.
