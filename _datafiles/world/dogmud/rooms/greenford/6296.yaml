title: The Upper Street
description: >
  The street steepens here, the cobbles giving way
  to shallow cut steps at the grade's worst. The
  buildings on either side are smaller and quieter —
  faculty houses and a few tradespeople catering to
  the university: a laundress with sheets on a line,
  a coal merchant with the hatch standing open, a
  bookbinder in a narrow shop on the far side. The
  university fills the top of the view now: the tower
  squared against the sky, the lecture-hall roof below
  it, the library's long run of arched windows across
  the upper face. The air smells of old stone and
  chalk-dust from the windows above. The university
  stair is just ahead. Examine the tower or the lane.
