nouns:
  the university tower: >
    The tower fills the view from here — not framed
    by rooftops but rising from the top of the lane,
    close enough now to see individual stones. The
    lower courses are dark with age; the upper work
    is lighter, the replacement clearly post-dating
    the original by at least a century. The arched
    openings at the top are wide — reading windows,
    probably, looking toward the river valley. At
    this distance the tower looks permanent in the
    way only very old, much-used things manage.
  the lecture hall: >
    A long low building beside the tower, its roof
    just visible from the lane — dark tile, a short
    stack, a gutter run repaired in several styles.
    The sound of a voice comes through a high window
    on the near face, the words indistinct from here
    but the rhythm of formal address unmistakable.
    The hall is in use. It usually is.
  the library windows: >
    A run of arched windows along the upper face of
    the building east of the tower — tall arches in
    pairs, the glass clear and new-looking against
    the older stonework. Inside: the dark suggestion
    of shelves, a lamp on a reading stand, the pale
    rectangle of an open folio. Someone is already
    in there at this hour. The library opens early.
    The students who get there first are the ones
    who need it most.
  the cut steps: >
    Where the grade exceeds what cobbles can safely
    take, the paving gives way to shallow cut steps —
    each tread wide, the stone worn to a safe grip
    from foot-traffic. The lane's center channel
    runs between them, still doing its drainage
    work. These steps are the town's acknowledgment
    that the hill continues to be steep regardless
    of what is built on it.
