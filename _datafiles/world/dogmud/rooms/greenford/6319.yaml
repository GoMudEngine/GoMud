nouns:
  the coach trunk: >
    A heavy iron-banded trunk in the yard's center — dark
    wood, the iron straps riveted at each corner and buckled
    across the lid. The lock is a good one. The trunk bears
    the marks of extended travel: scuff-lines at the lower
    corners, a repair where one strap pulled free and was
    re-riveted with newer iron. The name chalked on the
    side has been rained on and is no longer legible. The
    trunk is waiting collection or forwarding; the ostler
    does not speculate on its contents.
  the feed bin: >
    Three low wooden bins against the north wall, their
    lids raised on pegs: the first holds oats, heaped and
    dry, smelling of summer; the second coarse chaff for
    working horses; the third a compressed block of linseed
    cake for finishing stock. The bins are well-seasoned
    hardwood with iron hinges, made to last and showing it.
    A measure-scoop hangs from a peg between the first and
    second. The oats-bin is more than half full. The stable
    expects business.
  the harness: >
    A long rack of pegs along the east wall holds the
    stable's working harness in organized rows: breast
    collar, hames, traces, breeching — each set belonging
    to a specific horse and marked with a painted strip of
    color on the headstall. The leather is well-oiled and
    supple, the brass fittings clean. The ostler works the
    rack from right to left each morning, checking each
    set methodically. Some of the harness has been
    repaired; none of it has been neglected.
