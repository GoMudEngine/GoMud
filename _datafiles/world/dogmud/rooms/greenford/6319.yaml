title: The Coaching Stable
description: >
  Horse-smell and fresh hay — the coaching stable's yard
  is open to the road, a timber-framed structure on three
  sides enclosing a hard-packed surface swept clean this
  morning. Two coaches are berthed under the south lean-to,
  their traces stowed on wall-hooks. The ostler's bench
  runs along the east wall beside the harness rack and a
  lamp on a bracket. Feed-bins against the north wall hold
  oats and coarse chaff; a heavy coach-trunk strapped with
  iron banding sits at the yard's center, waiting a claim.
  The smell is layered: fresh straw, sweat-salt on leather,
  the dry-dust of summer oats. Examine the coach-trunk or
  the feed-bin.
