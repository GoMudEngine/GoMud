title: The Fishing Steps
description: >
  Stone steps cut directly into the riverbank, descending
  to a narrow ledge of gravel just above the current. The
  steps are dark and slick where the river-splash reaches
  them, dry and pale above. A line of crab pots rests on
  the ledge below, their willow-weave swollen from long
  use in the water; beside them, a pair of rod-holders
  cut into the bank hold two lines running out into the
  steady current. The river here is wide and deep-green.
  Good water. The crab pots will tell you what the river
  runs this season, if you examine them.
biome: water
