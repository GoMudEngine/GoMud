title: The College Lane
description: >
  The back lane of the college precinct — a narrow
  passage between the common-room range to the west
  and the rear wall of the library to the east,
  paved with the same flagging as the cloister walk
  but rougher-maintained: a service lane as much as
  a passage. The lane opens at its south end to the
  college's back gate, its timber planks standing
  open onto Back Gate Lane and the residential
  quarter beyond — faculty houses, quiet, morning
  fires already at the chimneys. The gate is
  unbolted; the streets begin on the other side.
  Examine the back gate or the lane.
