zone: Greenford
title: The Garden Wall
description: >
  College Row ends here at a broad stone wall —
  the boundary of a private garden behind one
  of the terrace houses, its top course capped
  flat and carrying a fringe of moss along the
  joints. The wall stretches east and west as
  far as the terrace backs allow, with no gate,
  no gap, and no continuation beyond it. The
  residential streets open north to College Row,
  east toward the walled garden, and west toward
  the quieter lane. Examine the wall or the
  lane-end.
