nouns:
  the wall: >
    A boundary wall of old stone, its mortar
    joints gone soft at the surface and taken
    moss. The top course is flat stone laid
    without mortar, the kind of capping that
    stays because the weight is right. The wall
    is high enough that whatever garden is behind
    it is not visible from the lane end. Nothing
    about the wall invites climbing; it does not
    need to. The garden behind it is private
    and has always been private, and the wall
    makes this clear without effort.
  the lane end: >
    The point where the cobbled lane runs out
    against the garden wall — the street simply
    ends here, giving no further passage. Looking
    back north along College Row, the row opens
    up toward the tea house and the blue-doored
    corner. Looking west, the quieter lane
    branches toward the last houses. This end
    of the street is where people turn back,
    not where they find a way through.
idlemessages:
- A sparrow picks at the moss on the top course of the wall, unconcerned.
- Nothing stirs on the other side of the wall; the private garden is quiet.
- A wren calls once from behind the garden wall, then is quiet again.
