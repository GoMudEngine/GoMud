roomid: 6292
zone: Greenford
title: "The Cartographer's Rest, Upstairs"
description: >
  The lodging floor is quieter than the common room
  below — a short corridor with four numbered doors,
  the boards underfoot muffled by a strip of old
  woven rug worn to its backing. The doors are solid
  timber, latched from inside; at least two rooms are
  occupied, judging by the boots set out in the hall.
  A window at the corridor's east end looks out over
  the lane and the square's edge below, the river a
  dark line visible between the far buildings. A shelf
  beside the window holds a small collection of things
  guests have left behind and no one has claimed.
  Examine the shelf or the window.
