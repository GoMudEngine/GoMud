nouns:
  the lost and found shelf: >
    A shallow shelf beside the corridor window,
    holding a row of unclaimed items: a leather glove
    missing its pair, a small compass in a cracked
    case, a handkerchief knotted around something
    small, a pocket almanac with the year's cover
    worn through. The innkeeper has kept them all
    against the chance of return. Most are probably
    not coming back for. The shelf is a quiet record
    of passing through.
  the window: >
    A window at the corridor's east end, the glass
    slightly wavy in the old pane. Below: the lane
    running east from the square, and beyond the
    near rooftops a clear view toward the river
    valley. In clear weather the far bank is visible
    and sometimes further — the hills above the
    ford, the road north. From here the town looks
    small and well-ordered. It probably is.
  the doors: >
    Four numbered doors along the corridor, solid
    timber on iron hinges, each latched from inside.
    Boots have been set out before two of them in
    the way of guests who intend to be seen as
    civilized. One pair is large; the other is a
    scholar's walking boot, the sole re-stitched at
    the toe. The corridor is otherwise quiet. The
    rooms are doing what lodging rooms do at this
    hour.
  the rug: >
    A strip of woven rug running the corridor's
    length, its pattern long since blurred to a
    general warmth of color. The backing shows at
    the center where the pile is gone. It is soft
    underfoot in the way of things worn to their
    final useful state. The inn has not replaced
    it, which is either economy or sentiment.
    Both are possible.
idlemessages:
- A floorboard creaks in the room behind the nearest door.
- Morning light shifts along the corridor floor from the east window.
- From below, the muffled sound of the common room carries on.
