station: loom
exits:
  west: {roomid: 6445}
  east: {roomid: 6447}
nouns:
  the loom: >
    A great wooden loom strung with an undyed length of
    wool, half-woven, the shuttle resting in the warp
    where it was last set down. The frame is old and worn
    smooth at every point a hand naturally falls.
  the baskets: >
    Baskets of carded fleece and spun thread along the
    wall, sorted by weight and colour more by habit than
    by any label. A few skeins show the faint tint of a
    dye-batch still drying.
  the window: >
    A wide front window angled to catch the morning light
    at the best working angle, its sill dusted with lint
    that never quite gets swept away.
