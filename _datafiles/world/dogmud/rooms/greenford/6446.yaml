roomid: 6446
zone: Greenford
title: The Weaver's Loft
description: >
  The Weaver's Loft is a bright, cluttered room a step up
  from the lane, its front window angled to catch the
  morning light. A great wooden loom takes up most of the
  floor space, half-strung with an undyed length of wool.
  Baskets of carded fleece and spun thread sit along the
  wall, sorted more by habit than by any visible system.
  The air smells faintly of lanolin and dye. Examine the
  loom or the baskets.
biome: city
