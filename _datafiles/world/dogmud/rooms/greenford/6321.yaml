nouns:
  the milepost: >
    A stone post at the road's edge, square-cut and well-
    set, the face dressed flat and lettered in incised
    capitals filled with lead paint now mostly weathered
    out: GREENFORD 1 MILE; NEW PLYMOUTH 3 DAYS. Below
    the principal destinations, added in a later cut:
    COUNTY BOUNDARY 4 MILES NORTH. The stone is the
    county's standard marker — the same post you find at
    every mile on this road west until the highland
    crossing. This one is the first, and in that sense
    the most important: it names the town you have left
    and the city you are going to.
  the verge: >
    The road's margin here is open country — the verge
    wide enough to rest a horse, the grass a mixed meadow
    growth of the kind that follows maintained roads.
    Looking west: the road curves slightly north, following
    the valley's upper edge, and the wooded highlands are
    clear on the horizon. Looking east: the Greenford
    treeline, the university tower distinguishable above
    the rest. The road connects them. The verge is the
    space between.
idlemessages:
- A laden cart passes east toward Greenford, moving well on the good road.
- The milepost stone leans a degree east; it has leaned there a long time.
- Wind crosses the rise with no building to break it.
