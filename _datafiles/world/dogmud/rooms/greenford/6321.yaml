roomid: 6321
zone: Greenford
title: The Milepost
description: >
  The road crests a gentle rise here, and for a moment
  the country is all around — the river valley east, the
  lowland fields north, the wooded highlands beginning to
  show west where the road is heading. A carved stone
  milepost stands at the verge, its face lettered in
  incised capitals: GREENFORD 1 MILE; NEW PLYMOUTH 3
  DAYS. The paint in the cuts is old and partly gone but
  the letters are still clear. Carts pass at intervals,
  traveling both ways — the road is in use, the Plymouth
  trade still running. Examine the milepost or the verge.
biome: wilderness
