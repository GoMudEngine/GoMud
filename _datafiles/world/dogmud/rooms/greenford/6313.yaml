roomid: 6313
zone: Greenford
title: The Walled Garden
description: >
  A walled garden behind the tea house — its
  stone walls old enough to carry a green tinge
  along the mortar lines, the planting inside
  them running to herbs and autumn vegetables
  in well-kept beds. A stone bench against the
  south wall, worn to a comfortable lean over
  many years. The space is small: street sounds
  carry over the walls, but the walls change
  them, and the garden holds a quality of quiet
  the row itself does not have. The tea house
  is north; the lane end is west. Examine the
  garden beds or the wall.
biome: city
