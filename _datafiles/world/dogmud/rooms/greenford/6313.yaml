nouns:
  the garden beds: >
    Raised beds along the east and south walls,
    their borders dressed with flat stone and
    their soil dark and well-worked. Herbs in
    the south beds — thyme, sage, something
    aromatic with small leaves — and taller
    plantings of chard and late greens along
    the east. The beds are tended: edges clear,
    no volunteers left to run. Someone works
    here regularly and knows what they are doing.
    Several of the herb plants have grown woody
    at the base from long seasons in the same
    ground.
  the wall: >
    Old stone walls on all four sides, their top
    courses capped with flat stone laid without
    mortar — the kind of capping that stays
    because it is done right. The walls are high
    enough to shelter the planting from the
    street wind and old enough to have developed
    their own small ecology: mosses in the
    joints, wall-plants at the base, the
    particular damp that comes from stone holding
    moisture. The south bench is positioned where
    the afternoon light will fall when the season
    is right for sitting out.
