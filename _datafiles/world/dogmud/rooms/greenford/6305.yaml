nouns:
  old maps: >
    A wall of survey sheets covering the region and
    its margins, pinned in overlapping layers and
    annotated in Brennan's hand and in others'.
    The maps span several decades of fieldwork —
    the older ones on heavier paper, their edges
    brown, their ink faded to a warm sepia. In the
    margins of several of the oldest maps, drawn by
    different surveyors in different hands across
    different years, the same mark recurs: a set of
    nested rings, small and precise. No legend
    explains it. A note in Brennan's hand, pinned
    beside one example, reads only: recurring — see
    archive. What it marks, or whether the different
    surveyors who drew it shared a reason, the maps
    do not say.
  the desk: >
    A broad, heavy desk of old oak, its surface
    occupied by the active work: two field journals
    open and cross-referenced, a run of indexed
    correspondence clipped in order, three rolled
    charts in their tubes labeled in the field
    notation. An inkwell at the corner, near-full.
    A magnifying glass for map-reading. A half-
    written letter to a colleague at another
    institution, paused at a sentence that seems
    to have required some thought. The desk does
    not look disorganised to someone who understands
    the work.
  the field journals: >
    Two journals open on the desk, their pages
    cross-referenced by a system of marginal
    numbers. Field notes from survey work in the
    eastern country: terrain, access, water sources.
    The notation is standard; the observations are
    careful and particular. One entry is circled in
    red ink and the number beside it appears on the
    margin of a map on the wall. The circle does
    not have an explanation attached.
  the correspondence: >
    A run of letters clipped in chronological order,
    the most recent on top: correspondence with
    colleagues at the Survey Office in the capital,
    with a factor in a town to the east, with two
    other university departments. The tone is careful
    and collegial. Several letters ask questions;
    the replies, where they appear, give answers
    that prompt further questions. The correspondence
    has the character of an ongoing inquiry rather
    than a concluded one.
