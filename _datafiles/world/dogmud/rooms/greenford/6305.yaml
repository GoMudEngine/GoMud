title: Brennan's Office
description: >
  A working office in the lecture-hall range —
  close enough to the hall to hear the bell and
  cramped enough to suggest the university does
  not value its surveyors' administrative comfort.
  A broad desk occupies most of the room, its
  surface productive-disordered: field journals,
  indexed correspondence, rolled charts in their
  tubes. The wall behind the desk holds
  <ansi fg="itemname">old-maps</ansi>
  — survey sheets covering the region and its
  margins, pinned and overlapping, annotated in
  several hands. Examine the old-maps or the desk.
