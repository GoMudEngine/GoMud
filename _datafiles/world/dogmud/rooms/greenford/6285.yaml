nouns:
  the elm: >
    An old elm, its trunk broader than two arms reaching,
    its lower branches removed long ago to keep the lane
    clear. The bark is deeply furrowed and grey. High
    in the crown the leaves are full and green, catching
    the river-breeze. The tree is older than the buildings
    around it. There was a green here before the town
    came down to meet it, and the elm was already here
    then.
  the stone: >
    A flat-faced river stone set upright in the green,
    its base sunk deep and surrounded by the root-work
    of the elm. The face carries shallow carvings worn
    nearly flat by weather — a crude fish and an eel in
    low relief, a mill-wheel scored below them by a
    different hand. River luck; a working life on the
    water. A bunch of river-mint has been laid at the
    base recently; the stems are still fresh. Whatever
    the stone marks, the riverfolk here have not stopped
    marking it.
  the river mint: >
    A fresh bunch of river-mint, stems still supple,
    laid at the base of the upright stone. Someone
    placed it this morning — the dew is still on it.
    It is not the first offering. Older stems, dry and
    grey, are pressed into the soil around the stone's
    base, left from earlier visits. The practice is
    clearly ongoing. No one seems to have organized it.
    It simply continues.
  the green: >
    A worn square of ground between the buildings, the
    grass thin and much-trodden in the center but
    persisting at the edges. Children play here in the
    mornings; the afternoon belongs to anyone who wants
    a moment out of the river noise. The elm makes the
    shade. The stone makes the focus. The rest is open.
