title: The Riverside Green
description: >
  A small square of open ground kept clear between the
  river buildings — grass worn thin in the center from
  use, but green enough at the edges. A gnarled elm
  stands at the far corner, its lower branches lopped
  flat where they would have blocked the river-light.
  Beneath the elm, a low stone set upright in the ground
  carries weather-worn carvings and a fresh bunch of
  something green laid at its base. This is an old
  marker, older than the surrounding buildings. The
  riverfolk still leave things at it. Examine the stone
  to read whatever the carving preserves.
