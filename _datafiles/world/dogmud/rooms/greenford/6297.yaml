zone: Greenford
title: The University Stair
description: >
  The lane meets the university boundary here —
  a low wall of dressed ashlar with an iron gate
  in it, both leaves hooked back on heavy iron
  rings. The graveled path beyond rises toward the
  main court. The tower is close now, squared above
  the wall, its arched openings at the crown open
  to the sky. Forecourt, halls, the long library
  windows — all plainly visible from the gate.
  The grounds are open. Go up to enter. Examine
  the gate or the grounds.
