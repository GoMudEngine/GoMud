title: The University Stair
description: >
  The lane ends here at the university boundary --
  a low wall of dressed ashlar with an iron gate in
  it, the graveled path beyond rising toward the
  main court. The tower is close now, squared above
  the wall, its arched openings at the crown open to
  the sky. You can see all of it from here --
  forecourt, halls, the long library windows. Today
  the lane ends at this wall; the way into the
  grounds lies further up the hill. Examine the gate
  or the grounds.
biome: city
