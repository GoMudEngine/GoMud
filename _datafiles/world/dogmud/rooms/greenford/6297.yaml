roomid: 6297
zone: Greenford
title: The University Stair
description: >
  The lane runs out here where the town's buildings
  give way to the university grounds — a low wall of
  dressed ashlar and an iron gate standing open onto
  a graveled path that rises toward the main court.
  The gate has been open since before anyone on the
  staff can remember. Beyond it the path runs between
  planted borders to a paved forecourt, and from
  there the lecture halls, the library's long arched
  windows, and the tower at the hill's crown are all
  plainly visible in the clear air. The university is
  just there now — the grounds through the open gate,
  the buildings a short climb above. Examine the gate
  or the grounds for a nearer look.
biome: city
