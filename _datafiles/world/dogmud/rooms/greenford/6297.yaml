nouns:
  the gate: >
    An iron gate in the ashlar wall, its leaves
    hooked back on iron rings set in the stone face.
    The iron is old and pitted, the hinges heavy
    castings of a type not made now. The latch plate
    carries the university's device in relief — a
    book and a measuring rod crossed, a legible
    statement of the institution's sense of itself.
    The gate is old and set in a wall that has been
    here longer than the town around it. Both leaves
    are hooked back. Go up to enter the grounds.
  the grounds: >
    Beyond the gate: a graveled path between planted
    borders of low shrub and ground-cover, kept trim.
    The path rises to the main forecourt — a broad
    paved space fronting the lecture-hall range.
    From the wall you can see the forecourt clearly
    and the figures crossing it: students, a lecturer
    in a dark gown, two groundskeepers with a cart.
    The grounds are open. Go up to walk in.
  the university tower: >
    From here the tower is close enough to feel
    large — the base stones as broad as a man's
    arm-span, the upper arches open to the sky.
    A flag at the very top, too faded to make out.
    Jackdaws on the parapet ledge, unconcerned.
    The tower is old and permanent and not
    especially interested in being looked at.
    It was here before the town reached up to
    meet it and will be here after.
  the forecourt: >
    The main forecourt is visible from the gate:
    a wide paved space fronting the lecture-hall
    range, with a sundial on a plinth at the center
    and benches along the east wall. A worn diagonal
    cuts the flags where foot traffic ignores the
    raked path — desire-line of a thousand crossings.
    The sundial is accurate. The benches are occupied
    in good weather. The forecourt does its job.
idlemessages:
- A scholar passes through the gate without slowing, eyes on a page.
- The tower bell sounds from the university above, clear in the still air.
- The graveled path beyond the gate is recently raked, smooth and even.
