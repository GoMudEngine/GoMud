title: The Guild Lane
description: >
  The Guild Lane is a short, quiet street that does
  its business without calling attention to itself.
  A scribe's shop on the west side has its shutters
  open; the sound of a pen on paper carries into the
  lane, along with the smell of fresh ink and drying
  sand. On the east side a chandler displays wax
  lengths in the window, from finger-thin tapers to
  full altar rounds, with sealing wax and lamp oil
  advertised on a card in the lower pane. The lane
  is narrow and well-swept. Past the chandler the lane
  continues east into a short row of craftsmen's shops,
  and a counting house does its quiet business just south
  of here. A pigeonhole board beside the scribe's
  door holds correspondence awaiting collection — a
  dozen slots, half of them full. Examine the scribe's
  shop or the board.
