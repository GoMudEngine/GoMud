title: The River Landing
description: >
  The quay is built of stone flags sloped toward the water,
  worn to a mirror-smoothness at the river's edge where
  barge hands have walked the same line for a generation.
  A flat-bottomed barge sits tied at the lower ring, its
  cargo of sawn timber and grain sacks half-unloaded onto
  the dock. The smell is river-mud and resin and wet hemp.
  West, the mill wheel turns behind its timber housing; the
  lane east carries into Riverside Row. Examine the mooring
  rings or the cargo to see what the river trade runs here.
