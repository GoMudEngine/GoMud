zone: Greenford
title: The Reading Room
description: >
  A quieter room than the main stacks: the reading
  room is fitted with long oak tables and fixed
  reading-stands, lamp-brackets along the walls
  supplementing the natural light. The hush here
  is a studied thing — kept by convention and by
  walls thick enough to take most of the noise
  from the quad. Readers work at the tables: one
  at a spread folio, one with a stack of pamphlets,
  one doing nothing visible but thinking. The
  cloister walk is west; the archive south. Examine
  the reading-stands or the tables.
