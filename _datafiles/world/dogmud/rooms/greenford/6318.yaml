nouns:
  stable gate: >
    A wide timber gate in the hedgerow north of the road,
    its bar lifted and swung back flat against the hedge —
    standing open for the morning traffic. Beyond it the
    coaching stable yard is visible: the hard-packed
    surface, the lean-to roof of the coach-house, the
    ostler's bench along the east wall. The smell of
    horse and hay carries through even from the road.
    The stable is north; the gate stands open.
  the verge: >
    The road's margins here are long grass and rough meadow
    growth — knapweed, yellow rattle, the coarse stems of
    cow parsley gone to seed. The field to the south is
    meadow hay, not yet cut; to the north, pasture with
    the hedgerow marking the stable yard's edge. Standing
    at the verge the town is already behind: no roof-line
    visible, just the university tower above the treeline
    east. West the country flattens out toward the wooded
    highlands on the horizon.
