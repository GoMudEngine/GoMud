zone: Greenford
title: The West Road
description: >
  Beyond the gate the road has freed itself from town —
  the last garden walls behind, the country opening on
  either side: rough verge, a hedged meadow north, the
  river valley distant in the east. The surface is well-
  maintained here, drainage channels cut on each side,
  the crowning slight and deliberate. The coaching
  stable opens to the north, its gate standing wide
  in the hedgerow; a traveler's shrine-post rises at
  the field's margin to the south, half in the long
  grass. The road bends on west toward the milepost.
  Examine the <ansi fg="itemname">stable-gate</ansi> or the verge.
