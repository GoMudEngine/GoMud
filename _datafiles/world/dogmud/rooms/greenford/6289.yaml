zone: Greenford
title: The Market Cross
description: >
  The Market Cross is the square's south end and its
  formal centre — a carved stone shaft on a worn
  plinth, the stone pale and smooth at hand-height
  where it has been touched in passing. The produce
  stalls ring it on three sides: greens and roots
  to the west, eggs and preserves to the east, salted
  cheese between. The smell is vegetables first, then
  cheese, then the sweet overlay of preserves. A
  notice board nailed to the cross's plinth carries
  this week's announcements in several hands. The
  town crier works the stalls on most mornings.
  Examine the cross or the board.
