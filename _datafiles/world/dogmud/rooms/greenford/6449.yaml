roomid: 6449
zone: Greenford
title: The Jeweler's Bench
description: >
  The Jeweler's Bench occupies the last shop on the row, a
  small, well-lit room built around a single sturdy bench
  fitted with files, pliers, and small setting-tools in
  their own pockets. A magnifying lens on a brass arm hangs
  over the bench, and a shallow tray of raw stones and wire
  sits within easy reach. The room is quiet, suited to close
  work. Examine the bench or the tray.
biome: city
coord: {x: 28, y: -77, z: 1}
station: jeweler_bench
exits:
  west: {roomid: 6448}
nouns:
  the jeweler bench: >
    A sturdy bench fitted with dozens of small pockets
    holding files, pliers, and setting-tools, each within
    easy reach of a seated hand. The surface is scarred
    with fine scratches from years of careful work.
  the tray: >
    A shallow tray holding raw stones, coils of wire, and
    a few polished settings not yet claimed, sorted by
    size rather than value.
  the lens: >
    A magnifying lens on a brass arm, swung over the bench
    and angled to the light. The glass is kept spotless;
    everything else in the room is merely tidy.
spawninfo:
  - mobid: 9594
    cooldown: 600 rounds
idlemessages:
- A gem is turned slowly between two fingers, catching the lamplight.
- The magnifying lens is swung down and back up again.
- A fine file rasps once against a setting and stops.
