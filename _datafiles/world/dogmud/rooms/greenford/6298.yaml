roomid: 6298
zone: Greenford
title: The University Gate
description: >
  The graveled path levels here at the inner gate —
  the porter's lodge is set into the boundary wall
  to the east, a low stone building with a window
  onto the path and a door standing open. The main
  court opens to the south, broader than it looked
  from below: the quadrangle, the tower above it,
  the ranges on three sides. The porter's board
  beside the lodge tracks visitors and hours. From
  the south the open quad carries faint voices —
  a lecture in progress, its words just out of reach.
  Examine the lodge or the board.
biome: city
