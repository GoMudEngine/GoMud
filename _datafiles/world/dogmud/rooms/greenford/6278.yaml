roomid: 6278
zone: Greenford
title: The Greenford Gate
description: >
  The toll-gate stands open at the river end of the bridge,
  the timber bar raised and hooked back clear of the road.
  The warden's booth is occupied — smoke from the brazier,
  the window unshuttered, a lantern bracket polished to a
  working shine. The gate has always been here; it has not
  always been staffed. Past it, the riverfront opens: low
  buildings close on the bank, the smell of fish and rope
  and wet stone, and behind it all the long slope of
  Greenford's hill rising toward the university tower at
  its crown. The sign above the arch carries the current
  toll-road notice.
