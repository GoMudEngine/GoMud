nouns:
  the gate: >
    A bar of squared oak, iron-shod at both ends, riding a
    pivot post and hooked back clear of the road. It has been
    raised and set here more times than anyone has counted.
    When the bar is set, the crossing is closed; hooked back
    as it is now, the gate is open and the road is yours.
    The pivot fittings are well-oiled. This gate is used
    regularly and maintained accordingly.
  the gatehouse: >
    A stone booth built for occupation: brazier outside,
    stool inside, a sliding shutter on the window currently
    standing open. A lantern bracket mounts outside for
    night duty, the bracket bright where the warden has
    kept it clean. Everything around the booth is worn to
    familiar use — a post that has been sat at through
    many seasons, in several kinds of weather.
  the sign: >
    Nailed below the arch: GREENFORD — ALL TRAVELERS
    SUBJECT TO TOLL AND WARDEN'S INSPECTION. Painted
    black on pale board, repainted more than once — faint
    edges of older lettering show beneath. A smaller
    addition in a different hand reads SCHOLARS AND
    UNIVERSITY STAFF EXEMPT. Someone added that later.
    No one has taken it down.
  the bridge: >
    The three arches crossing behind you carry the road
    over the Greenford river in long flat spans of dressed
    stone, the water fast and dark in the pier-shadows
    below. Standing at the gate you can look back across
    the whole crossing — the worn central notch where cart-
    wheels have struck the paving a thousand times, the
    stone rail at either side, the far bank where the East
    Road continues north. From here the crossing looks
    short. It is longer than it looks.
