roomid: 6322
zone: Greenford
title: The Plymouth Road
description: >
  The road bends here — a long westward arc the carter's
  maps call the Plymouth Turn. Beyond the bend the
  surface is maintained and clear: drainage cut, verge
  trimmed, the way marked at intervals by the county's
  half-buried stones. Nothing blocks it. Three days west
  and north, New Plymouth waits — the capital, the
  harbour, the river district and its trade. Greenford is
  behind now; the university tower is barely above the
  treeline in the east. This is where the town becomes
  a destination rather than where you stand. The road
  goes on. Examine the road ahead or the treeline.
biome: land
