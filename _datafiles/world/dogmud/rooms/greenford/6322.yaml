zone: Greenford
title: The Plymouth Road
description: >
  The road bends here — a long westward arc the carter's
  maps call the Plymouth Turn. Beyond the bend the
  surface is maintained and clear: drainage cut, verge
  trimmed, the way marked at intervals by the county's
  half-buried stones. Three days west and north, New
  Plymouth waits — the capital, the harbour, the river
  district and its trade. Greenford is behind now; the
  university tower is barely above the treeline in the
  east. This is a place you come back to with a pack and
  a reason — the road to New Plymouth is another journey
  for another day. Examine the
  <ansi fg="itemname">road-ahead</ansi> or the treeline.
biome: land
