nouns:
  the road ahead: >
    The road continues clearly west from the bend — the
    surface maintained, the drainage good, the verge-posts
    marking the county's responsibility at regular
    intervals. At the limit of clear sight the road curves
    north around a wooded rise and is gone from view.
    Beyond that: the highland plateau, the river crossings
    in the upland valleys, and three full days of travel
    to New Plymouth at a walking pace, two by horse. The
    road is there and open. It does not require anything
    further of you today. Come back with a pack and a
    reason.
  the treeline: >
    Looking east from the Plymouth Turn: the road running
    back toward Greenford, and above the treeline that
    marks the town's eastern edge, the university tower
    clear against the sky — the highest point of everything
    visible. Greenford from here is smaller than you might
    expect, tucked into its river valley. The tower gives
    it away; without the tower it would be invisible. You
    can see why travelers coming from the west miss the
    turn: the town hides. The road in is obvious, but the
    town itself is modest from distance.
idlemessages:
- The road bends away west, its surface clear and well-marked from here.
- A lone rider appears around the bend heading east, dusty from the road.
- Wind comes off the open country, steady and uninterrupted.
