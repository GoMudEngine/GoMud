zone: Greenford
title: The Lecture Hall
description: >
  The hall is tiered and long, its bench-rows
  rising from the demonstration floor in a shallow
  arc. A broad blackboard at the front carries the
  morning's working in chalk — natural philosophy,
  the figures dense and precise in the lecturer's
  hand. High windows along the south wall admit
  flat morning light without glare. The smell is
  chalk and old timber and the particular dust of
  textbooks stacked in the same room year after
  year. The quadrangle is east; Brennan's office
  is south. Examine the blackboard or the benches.
