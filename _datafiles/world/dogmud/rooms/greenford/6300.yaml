nouns:
  the blackboard: >
    A broad board of slated wood across the front
    wall, the morning's lecture in chalk: equations
    in natural philosophy, the steps of a derivation
    working left to right across three-quarters of
    the board's surface. The lecturer's hand is
    precise and small; the logic is dense. The final
    step is either very elegant or wrong — not
    immediately clear from the back rows. The board
    carries the ghosts of previous lectures in chalk
    haze below the current working.
  the benches: >
    Tiered bench-rows in a shallow arc rising from
    the demonstration floor — the kind of seating
    that assumes the audience will be attentive and
    gives them no particular comfort to encourage
    otherwise. The wood is worn smooth. At the ends
    of each row a small inkwell socket, most empty.
    Near the front, the benches carry more chalk-
    dust than further back, which is either because
    the attentive students sit there or because the
    lecturer gestures broadly.
  the demonstration floor: >
    The flat-floored front of the hall, where the
    lecturer stands: a deal table with an inkwell,
    a small bench of equipment — a pendulum bob,
    a set of weights, a glass prism — arranged for
    the morning's work. The chalk-tray is full.
    The floor is worn in a path between the table
    and the board, the particular wear of someone
    who thinks while moving.
  the windows: >
    A run of high windows along the south wall,
    their sills deep and their glass clear — a
    recent improvement that has made the hall
    markedly more useful. The light falls across
    the benches without throwing shadows at
    inconvenient angles. Before the windows were
    replaced the south rows were difficult after
    midday. The current students have no memory
    of that problem and are therefore not grateful.
