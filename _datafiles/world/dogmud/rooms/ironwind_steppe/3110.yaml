zone: Ironwind Steppe
title: Deep Passage
description: A narrow passage descending steeply into the earth. The
  walls are rough and natural, the stone changing from pale sandstone
  to darker, harder rock as you go deeper. The air is cold and damp,
  and condensation beads on the stone surfaces. The passage is barely
  wide enough for one person, and the ceiling is uncomfortably low.
  Claw marks on the walls show that larger creatures use this route
  regularly.
