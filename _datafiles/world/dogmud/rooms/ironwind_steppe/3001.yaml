nouns:
  posts: Weathered fence posts, most of them leaning or broken off at
    ground level. Whatever enclosure they once formed has long since
    collapsed. The wood is grey and cracked from exposure.
  ditch: A shallow ditch running roughly east-west, carrying a trickle
    of murky water from the city drainage system. The banks are muddy
    and trampled with animal tracks -- small paws and bird feet.
  bushes: Hardy scrub bushes with small grey-green leaves, growing in
    the poor soil alongside the track. They have been browsed by
    animals into low, rounded shapes.
