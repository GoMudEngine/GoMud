roomid: 3001
zone: Ironwind Steppe
title: Trampled Outskirts
description: The wagon track continues east through a stretch of flattened
  grass and bare earth where foot traffic from the city has beaten the
  ground hard. Broken fence posts mark where someone once tried to
  establish a garden or animal pen -- the effort clearly abandoned. A
  few scraggly bushes cling to life along the track's edges. To the
  south, a shallow drainage ditch carries runoff from the city wall.
