nouns:
  thicket: A dense tangle of mature sagebrush, the oldest and
    tallest on the flats. The bushes have grown together into
    a near-impenetrable mass that provides excellent cover for
    small and medium-sized animals.
  feathers: Scattered feathers caught on sagebrush twigs --
    brown and grey, probably from grouse or hawks. Mixed with
    tufts of grey and brown fur from rabbits and rodents.
