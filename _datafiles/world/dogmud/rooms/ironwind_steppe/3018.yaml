roomid: 3018
zone: Ironwind Steppe
title: Sage Thicket
description: The sagebrush grows unusually dense here, the bushes
  crowding together into a thicket that reaches chest-height. The
  narrow paths between the bushes are game trails, worn by animals
  pushing through the growth. Visibility is limited to a few paces
  in any direction. The sage scent is overwhelming, thick and
  medicinal, and the buzzing of insects fills the air. Feathers
  and tufts of fur caught on branches show this is heavily
  trafficked by wildlife.
biome: land
