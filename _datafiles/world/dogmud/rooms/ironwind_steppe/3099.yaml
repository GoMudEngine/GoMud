roomid: 3099
zone: Ironwind Steppe
title: Southern Wallow Edge
description: The wallowing grounds peter out here at the southern
  edge of the lowland. The ground rises slightly, becoming drier
  and firmer. The last muddy wallows are small and shallow, barely
  used. Beyond, the steppe grass reclaims the terrain in tufts
  and patches, gradually thickening into full coverage. This is
  the boundary of boar territory -- their tracks thin out and
  disappear to the south.
biome: land
exits:
  west:
    roomid: 3098
nouns:
  wallows: Small, shallow wallows at the territory's edge,
    barely used and half-dried. The mud is thin and cracked,
    evidence that the boars rarely venture this far south.
