nouns:
  barricades: Crude walls of stacked basalt blocks and sharpened
    wooden stakes, forming a rough defensive perimeter. The
    construction is haphazard but functional -- high enough to
    crouch behind and solid enough to stop a charge.
  stakes: Sharpened wooden stakes jammed between the barricade
    stones, angled outward. Some are decorated with animal
    skulls or bundles of feathers -- territorial warnings.
