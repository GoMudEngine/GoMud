title: Goblin Camp Perimeter
description: The coulee widens into a defended space ringed with crude
  barricades of piled stone and sharpened stakes. This is the outer
  perimeter of a goblin encampment. The barricades are chest-high
  and leave only narrow gaps to pass through. Goblin sentries patrol
  the perimeter, and the ground is littered with refuse -- bones,
  broken tools, and scraps of leather. Smoke rises from fires
  deeper in the camp.
