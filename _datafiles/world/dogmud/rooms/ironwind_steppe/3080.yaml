zone: Ironwind Steppe
title: Ravine Fork
description: The ravine splits here into two branches -- one
  continuing south deeper into wolf territory, the other
  angling southwest toward muddier, lower ground. The fork
  is marked by a massive boulder wedged between the ravine
  walls, its surface scored with claw marks from generations
  of wolves using it as a scratching post. The stream surfaces
  briefly here before vanishing underground again.
