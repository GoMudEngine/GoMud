nouns:
  boulder: A huge boulder jammed between the ravine walls,
    forming a natural bridge overhead. Its surface is deeply
    scored with claw marks -- wolves have used it for
    generations to mark territory and sharpen their claws.
  fork: The point where the ravine divides into two channels.
    The left branch descends toward wetter ground; the right
    continues straight and narrow deeper into wolf country.
