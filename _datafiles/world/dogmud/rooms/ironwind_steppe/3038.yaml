roomid: 3038
zone: Ironwind Steppe
title: Ridge Summit
description: The highest point of Ironwind Ridge, a broad dome of
  wind-scoured basalt where nothing grows. The rock is polished
  smooth by centuries of wind-driven grit and scored with shallow
  grooves that follow the prevailing wind direction. From here
  the entire steppe is visible -- every subregion laid out like
  a map. The wind at the summit is relentless and cold, driving
  tears from your eyes and stealing your breath. This is the
  place that gives the ridge its name.
