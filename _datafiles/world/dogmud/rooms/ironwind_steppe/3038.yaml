nouns:
  dome: A broad dome of dark basalt, perhaps thirty paces across,
    worn glassy-smooth by the constant abrasion of wind-carried
    grit. The surface is warm from the sun but the wind steals
    the heat instantly.
  grooves: Shallow channels carved into the stone by prevailing
    winds over uncountable years, running east to west. They
    are barely a finger's width deep but unmistakably deliberate
    in their alignment.
