zone: Ironwind Steppe
title: Southern Ridge Slope
description: The ridge's southern slope is gentler than the western
  face, descending through loose rock and scrubby vegetation toward
  the dry creek basin below. The footing is unstable -- gravel and
  small stones slide underfoot with every step. A few larger
  boulders provide anchoring points where soil has accumulated
  and grass has taken hold. The wind is blocked by the ridge
  crest above, making this slope relatively sheltered.
