nouns:
  slope: A gravel-covered slope descending southward, steep enough
    to require careful footwork. The loose stone shifts and slides,
    making the descent treacherous but the climb exhausting.
  boulders: Large stones embedded in the slope, providing stable
    footing and small sheltered spots where grass and wildflowers
    grow in the accumulated soil.
