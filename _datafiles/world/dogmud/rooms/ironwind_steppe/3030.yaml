roomid: 3030
zone: Ironwind Steppe
title: Ridge Approach
description: The ground tilts upward sharply as the sagebrush flats
  give way to the rocky base of Ironwind Ridge. Loose scree and
  broken stone replace the grass, and the footing becomes
  treacherous. Scrubby pines grow from cracks in the rock,
  their roots gripping the stone like clawed fingers. The wind
  is stronger here, funneled and accelerated by the ridge's
  bulk. Above, the dark spine of the ridge crest cuts across
  the sky.
