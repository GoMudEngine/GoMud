nouns:
  scree: Loose, broken stone covering the slope in a treacherous
    layer. Each step sends small rocks clattering downhill.
    The fragments are sharp-edged and dark, freshly broken
    from the ridge face above.
  pines: Wind-tortured pines clinging to rock cracks, their
    trunks twisted into corkscrews by years of relentless wind.
    Few are taller than a person.
