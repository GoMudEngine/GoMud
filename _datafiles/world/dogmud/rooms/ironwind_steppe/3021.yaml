nouns:
  boulders: Dark basalt boulders, each the size of a wagon or larger.
    Their surfaces are rough and pitted, colonized by lichen and
    moss. The stone absorbs heat during the day and radiates it
    at night, making these popular resting spots for wildlife.
  lichen: Patches of crusty lichen in shades of green, orange, and
    grey, covering the north faces of the boulders where moisture
    lingers longest.
