roomid: 3021
zone: Ironwind Steppe
title: Scattered Boulders
description: Several large boulders are scattered across the flats here,
  dark basalt stones rising from the grass like the backs of buried
  animals. Grass grows tall in the sheltered spaces between them,
  creating pockets of cover. Lichen paints the north-facing surfaces
  in pale green and orange. The boulders provide welcome windbreaks
  and the air in their lee is noticeably calmer.
