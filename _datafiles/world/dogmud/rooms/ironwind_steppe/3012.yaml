nouns:
  clay: Pale, cracked hardpan clay exposed where the topsoil has
    blown away. The surface is tessellated with drying cracks in
    a pattern that looks almost deliberate, like broken tiles.
  tumbleweeds: Dry, skeletal balls of dead plant matter, tangled
    in the sagebrush. They rattle in the wind, straining to
    break free and continue their rolling journey.
