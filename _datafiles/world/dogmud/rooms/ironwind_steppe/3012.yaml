roomid: 3012
zone: Ironwind Steppe
title: Windswept Flats
description: The wind is particularly fierce here, channeled across the
  open flats with nothing to slow it down. The sagebrush grows low
  and stunted, permanently bent in the direction of the prevailing
  gusts. Loose soil has been scoured away in patches, exposing the
  pale hardpan clay beneath. A few tumbleweeds lie tangled against
  a cluster of sagebrush, trapped until the next strong gust frees
  them. The ridge to the northeast is more visible now -- a dark
  spine of rock rising above the flat terrain.
