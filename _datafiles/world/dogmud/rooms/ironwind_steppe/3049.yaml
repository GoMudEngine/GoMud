roomid: 3049
zone: Ironwind Steppe
title: Undercut Bank
description: The creek has carved a deep undercut into the bank here,
  creating a shallow cave beneath an overhang of earth and roots.
  The hollow is large enough for an animal to shelter in, and the
  smooth floor shows signs of regular use -- packed earth, scattered
  fur, and gnawed bones. The creek bed below is narrow and rocky,
  the stones larger here where the current was once strongest.
biome: land
