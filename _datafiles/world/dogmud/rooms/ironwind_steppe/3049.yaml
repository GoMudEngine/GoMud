nouns:
  undercut: A hollow carved beneath the creek bank by flowing
    water, about four feet deep and wide enough for a large
    animal. Roots dangle from the ceiling and the earth walls
    are smooth and damp. Animal hair and droppings show
    regular occupation.
  bones: Gnawed bones scattered on the floor of the hollow --
    leg bones cracked for marrow, vertebrae, and a few skulls.
    Whatever uses this shelter is a predator.
