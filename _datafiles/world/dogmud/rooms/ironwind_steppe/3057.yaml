nouns:
  boulders: Large, smooth boulders in the creek bed, rounded by
    years of tumbling in floodwater. They are wedged tightly
    together, creating an uneven floor. Some are large enough
    to sit on.
  lines: Dark stains on the creek banks marking past flood
    levels. The highest lines are above your head -- testimony
    to the violence of the seasonal floods that carved this
    channel.
