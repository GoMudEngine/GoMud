roomid: 3057
zone: Ironwind Steppe
title: Deep Creek Bed
description: The dry creek bed cuts deep here, its banks rising well
  above head height. The floor is a jumble of rounded boulders and
  packed gravel, the leavings of powerful floods. The walls show
  distinct flood lines -- dark stains at various heights marking
  past water levels. It feels like walking through a narrow canyon.
  The sky is a ribbon of blue above the steep banks.
