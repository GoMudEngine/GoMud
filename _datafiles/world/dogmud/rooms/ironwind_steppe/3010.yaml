nouns:
  sagebrush: Low, woody bushes with silvery-green leaves and a strong
    aromatic scent. They grow in scattered clusters across the flats,
    providing the only cover for small animals in this open landscape.
  dust: Fine, pale dust that covers the hard-packed soil between the
    grass clumps. It rises in clouds with every gust of wind and
    coats everything in a thin gritty layer.
