roomid: 3010
zone: Ironwind Steppe
title: Western Sagebrush Flats
description: The steppe opens up into a vast expanse of flat grassland
  dotted with knee-high sagebrush. The bushes are silvery-green, their
  pungent scent sharp on the wind. Visibility is excellent in every
  direction -- the land is so flat you can see for miles. The sky
  overhead is enormous, dwarfing everything beneath it. Dust devils
  occasionally spin up from the dry soil, dancing across the flats
  before collapsing. The wagon track from the city has vanished
  completely, replaced by open, unmarked terrain.
