roomid: 3033
zone: Ironwind Steppe
title: Ridge Trail Junction
description: Two trails meet here on the ridge's western face -- one
  climbing from the south, another traversing from the north. The
  junction is a small flat area littered with loose stone and a
  few hardy tufts of grass. A cairn of stacked stones stands at
  the intersection, clearly placed by someone rather than formed
  naturally. The ridge crest is close above, and the wind whips
  past with enough force to stagger the unwary.
