nouns:
  roots: An enormous tangle of dead tree roots, still firmly
    anchored in the bank. The individual roots are as thick as
    a person's arm, twisted and interlocking. The gaps between
    them serve as shelters for small animals.
  trunk: A long mound of rotting wood, the remains of a massive
    tree. Bracket fungi grow in overlapping shelves along its
    length, and the wood is soft and spongy, crumbling at a
    touch.
