roomid: 3050
zone: Ironwind Steppe
title: Root Tangle
description: A massive, ancient tree once grew here on the creek bank.
  It has long since fallen, but its root system remains -- a wall
  of twisted, interlocking roots rising from the bank like a
  wooden cliff. Earth has washed away from between the roots,
  creating a maze of gaps and hollows that animals use as dens
  and shelters. The fallen trunk has been reduced to a long mound
  of rotting wood colonized by fungi.
