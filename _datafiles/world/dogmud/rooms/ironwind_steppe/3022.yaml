nouns:
  tree: A dead tree, bleached white by the elements, its bare
    branches spread like skeletal fingers. Hawks use it as a
    perch -- the branches are streaked with droppings and the
    ground beneath is littered with pellets and feathers.
  pellets: Compressed lumps of fur, bone, and insect shell,
    coughed up by raptors. Each is a record of a meal -- mouse
    skulls, beetle wings, and tiny rib cages compressed into
    dense grey cylinders.
