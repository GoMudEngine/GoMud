roomid: 3022
zone: Ironwind Steppe
title: Hawk Hunting Ground
description: The flats are unusually barren here -- short-cropped grass
  and bare soil stretching wide, with minimal sagebrush. This open
  space is a hunting ground for the hawks and raptors that nest on
  the ridge to the east. Pellets of compressed fur and bone litter
  the ground beneath a lone dead tree, and the sky overhead seems
  to always hold a circling silhouette. Small animals stay close
  to their burrows in this exposed killing field.
biome: land
