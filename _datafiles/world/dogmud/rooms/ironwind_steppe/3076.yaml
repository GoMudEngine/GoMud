roomid: 3076
zone: Ironwind Steppe
title: Upper Wolf Run
description: The ravine descends through dense scrub and exposed rock.
  The walls are close, barely three paces apart, and the brush
  crowds in from both sides, creating a tunnel of vegetation.
  Game trails thread through the undergrowth -- narrow paths worn
  by wolf paws, too low for comfortable human passage. The ground
  is soft earth littered with bones, fur, and wolf droppings. The
  sound of water is closer now, a thin trickle.
