nouns:
  trails: Narrow paths through the dense brush, worn by wolf
    traffic to smooth, packed earth. They twist and branch,
    connecting different parts of the ravine system. Most
    are too low for a person to walk upright.
  bones: Scattered remains of prey animals -- rabbit bones,
    bird skeletons, and the occasional larger specimen.
    These are the leavings of wolf kills, gnawed clean
    and left to bleach.
