nouns:
  fins: Narrow standing blades of soft sandstone and clay, carved by
    wind and water into irregular plates, some no thicker than a hand
    at the top. They cast hard-edged shadows across the basin floor and
    crumble at the edges when touched, leaving pale dust on the fingers.
  track: A faint line in the dust and gravel, barely wide enough to
    call a trail -- the compressed mark of those who have passed this
    way before. It fades in and out as the wind works on it, but the
    general direction holds.
idlemessages:
- Wind funnels through the rock fins with a low, hollow moan.
- A dust-devil spins up from a bare patch, climbs to knee height, then
  collapses.
- The coulee rim is visible behind you, already seeming far away.
