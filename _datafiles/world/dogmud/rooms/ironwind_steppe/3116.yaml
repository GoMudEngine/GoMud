roomid: 3116
zone: Ironwind Steppe
title: Badlands Crossing
description: >-
  The rim above is already behind you, lost behind a fold of broken
  ground. You are in open badlands now, the coulee's shelter stripped
  away, and the difference is immediate: the wind comes from every
  direction at once, or seems to, deflecting off low rock ridges and
  spilling down raw earth banks. The terrain is broken without pattern
  -- not the orderly ravine system of the deep steppe but the chaotic
  fringe where erosion has left standing fins of soft rock, shallow
  basins, and channels that drain to nowhere. A rough track threads
  east back toward the coulee rim. To the north the ground rises
  slightly before dropping again out of sight.
biome: cliffs
