roomid: 3106
zone: Ironwind Steppe
title: Mineral Vein
description: A passage where a thick vein of quartz runs through
  the sandstone walls, its crystalline surface catching and
  reflecting what little light penetrates this deep. The quartz
  vein is as wide as a person's arm in places, glittering with
  tiny crystal faces. The surrounding stone is softer and has
  been carved away by water, leaving the harder quartz protruding
  from the walls like the spine of some buried creature. Mineral
  dust glitters on the cave floor.
biome: cave
