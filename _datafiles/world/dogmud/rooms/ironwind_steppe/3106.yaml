  east:
    roomid: 3110
nouns:
  quartz: A thick vein of white quartz running through the cave
    wall, its surface a mass of tiny crystal faces that catch
    and multiply any light source. Some of the crystals are
    large enough to see individually -- clear, hexagonal prisms
    embedded in the milky matrix.
  dust: Fine mineral dust covering the cave floor, glittering
    with tiny fragments of quartz and mica. It sparkles faintly
    even in near-total darkness.
