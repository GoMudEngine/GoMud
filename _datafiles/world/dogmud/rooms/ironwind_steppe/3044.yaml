nouns:
  steps: Natural steps in the rock face, each a drop of a foot or
    two. The basalt has fractured in columnar patterns, creating
    blocky, stair-like formations that are rough but climbable.
  vegetation: Tough plants growing from every crack -- wiry grass,
    stunted sage, and a few determined wildflowers with yellow
    blooms. Life finds a way even on bare rock.
