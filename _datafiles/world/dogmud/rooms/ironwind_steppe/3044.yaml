roomid: 3044
zone: Ironwind Steppe
title: Ridge Southeast Descent
description: The ridge drops away to the southeast here in a series of
  steep, broken steps of dark stone. The descent is passable but
  rough, each step a scramble down fractured rock faces. Scrubby
  vegetation clings to ledges and cracks, and loose gravel makes
  the footing unreliable. The terrain below transitions from ridge
  rock to the dark volcanic stone of the basalt coulees, the
  landscape becoming increasingly broken and maze-like.
biome: cliffs
