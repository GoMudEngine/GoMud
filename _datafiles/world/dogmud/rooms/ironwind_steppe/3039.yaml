roomid: 3039
zone: Ironwind Steppe
title: Northern Ridge Descent
description: The ridge descends northward here, the spine of rock
  breaking into a tumble of broken boulders and gravel slopes.
  The terrain is rough and uneven, requiring careful navigation
  between house-sized rocks. The wind is channeled between the
  boulders, creating eddies that whip dust and debris in
  unpredictable directions. A faint trail picks its way through
  the gaps, heading down toward the cliff country to the north.
biome: cliffs
exits:
  west:
    roomid: 3038
  south:
    roomid: 3040
nouns:
  boulders: Massive blocks of broken basalt, tumbled from the
    ridge crest and piled in chaotic heaps. Some are taller
    than a person, leaning against each other at precarious
    angles. The gaps between them form narrow passages.
  trail: A faint trail threading between the boulders, marked
    by scuff marks on the rock and the occasional cairn of
    small stones. It descends northward toward the cave country.
