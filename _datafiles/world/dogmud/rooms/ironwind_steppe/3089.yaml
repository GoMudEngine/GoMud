zone: Ironwind Steppe
title: Eastern Grassland
description: Open grassland stretches east beyond the ravine and
  wallow systems, the terrain gradually rising toward distant
  hills. The grass is tall and golden, swaying in endless waves
  under the wide sky. This borderland sees occasional wolf and
  boar traffic but neither species holds territory here. It
  feels wild and empty, the steppe at its most primal -- just
  grass, wind, and sky.
