nouns:
  scrapes: Shallow depressions dug in the earth by canine paws,
    the dirt thrown back in sprays. Some are fresh, the soil still
    dark with moisture. Wolves digging for burrowing rodents.
  marks: Parallel claw marks gouged into the bark of sagebrush
    trunks, at about wolf shoulder-height. Territory markers,
    refreshed regularly.
