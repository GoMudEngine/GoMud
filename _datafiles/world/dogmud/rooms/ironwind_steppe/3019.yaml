roomid: 3019
zone: Ironwind Steppe
title: Wolf-Marked Flats
description: The sagebrush here is scarred with claw marks and the
  ground is pockmarked with shallow scrapes where wolves have dug
  at rodent burrows. Tufts of grey fur cling to low branches.
  This stretch of flats sits between the open grassland and a
  line of scrubby trees to the north -- a transition zone where
  predators patrol regularly. The air smells of dust and musk.
