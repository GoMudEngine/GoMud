    roomid: 3035
  north:
    roomid: 3040
  south:
    roomid: 3042
nouns:
  ledge: A narrow shelf of stone, barely wide enough for a person,
    running along the ridge face. Chunks have broken off and lie
    in the scree below. The remaining stone feels solid but the
    edges are crumbling.
  layers: The exposed rock face shows distinct layers -- dark
    basalt on top, then a thin band of red clay, then pale
    sandstone below. The layers tell of volcanic activity over
    older sedimentary stone.
