roomid: 3041
zone: Ironwind Steppe
title: Crumbling Ledge
description: A narrow ledge runs along the ridge's south face, the
  rock crumbling and unreliable underfoot. Parts of the ledge have
  broken away entirely, leaving gaps that require careful jumping.
  Below, the slope drops steeply toward the dry creek basin. The
  exposed rock face beside you is layered -- dark basalt over pale
  sandstone, the geological history of the region written in stone.
biome: cliffs
