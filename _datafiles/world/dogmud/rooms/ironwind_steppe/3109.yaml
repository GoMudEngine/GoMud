nouns:
  fungi: An extraordinary variety of cave fungi -- pale shelf
    mushrooms, delicate thread-like growths, and bulbous caps
    in shades of white, grey, and sickly yellow. Several
    species glow faintly blue-green, providing dim natural
    light.
  mycelium: A white mat of fungal threads covering the cave
    floor, soft and slightly springy underfoot. The mycelium
    connects all the visible fungi in an underground network.
