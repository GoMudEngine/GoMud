roomid: 3109
zone: Ironwind Steppe
title: Fungal Garden
description: A damp, warm cave chamber where pale fungi grow in
  profuse clusters on every surface. Shelf mushrooms line the
  walls in overlapping tiers, and delicate thread-like mycelium
  covers the floor in a white mat. Some of the larger fungi
  glow with a faint bioluminescence -- a ghostly blue-green
  light that provides just enough illumination to see shapes
  and movement. The air is thick with spores and smells of
  damp earth and decay.
