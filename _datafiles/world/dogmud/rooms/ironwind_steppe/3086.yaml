zone: Ironwind Steppe
title: Wolf Run South End
description: The ravine shallows and widens here as it approaches
  its southern terminus. The walls diminish to low banks, and
  the dense brush thins to scattered clumps. The game trails
  fan out, heading in multiple directions across the lower
  steppe. This is the boundary of active wolf territory --
  beyond here their patrols are less frequent. The terrain
  opens into rolling grassland.
