roomid: 3027
zone: Ironwind Steppe
title: Windbreak Hollow
description: A shallow depression in the steppe, sheltered on three
  sides by low earthen banks and a thick stand of sagebrush. The
  hollow is out of the worst of the wind, and the temperature is
  noticeably warmer. Flattened grass shows where animals bed down
  regularly, and the sheltered banks are riddled with burrow
  entrances. A natural gathering spot for wildlife seeking respite
  from the relentless steppe wind.
