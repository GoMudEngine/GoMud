nouns:
  hollow: A natural depression about knee-deep, protected from the
    wind by earthen banks. The grass on the bottom is thick and
    matted from use as a bedding area.
  burrows: Small holes in the earthen banks, leading to underground
    dens. The entrances are worn smooth by frequent use and the
    soil around them is packed hard.
