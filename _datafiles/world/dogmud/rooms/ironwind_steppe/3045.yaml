roomid: 3045
zone: Ironwind Steppe
title: Dry Creek Headwaters
description: A shallow ravine opens here where seasonal rains once
  fed a stream. The creek bed is dry now -- sun-bleached sand and
  smooth river stones baking in the heat. The banks are low but
  steep, cut into the steppe soil by years of water flow. Exposed
  tree roots reach across the banks like grasping fingers, and
  clumps of coarse grass grow wherever moisture lingers in the
  sand. The ravine winds south, deepening as it goes.
biome: land
