nouns:
  bed: A dry creek bed of pale sand and smooth, rounded stones.
    The stones range from pebble-sized to fist-sized, all worn
    smooth by water that no longer flows here. Dark watermarks
    stain the bank walls at various heights.
  roots: Exposed tree roots reaching across the eroded bank,
    their bark worn smooth by seasonal flooding. Some form
    natural handholds for climbing in and out of the ravine.
