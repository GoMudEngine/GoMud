nouns:
  ground: Torn-up earth and trampled grass marking past
    territorial disputes. Cloven hoofprints and wolf
    pawprints overlap, neither clearly dominant. Tufts
    of bristly boar hair and grey wolf fur lie scattered
    among the damaged grass.
