roomid: 3088
zone: Ironwind Steppe
title: Contested Ground
description: This stretch of open ground between Wolf Run and the
  Boar Wallows is disputed territory, traveled by both predator
  packs but claimed by neither. The grass is trampled and torn
  by frequent conflict, and dark stains on the earth speak of
  past encounters. Both wolf and boar tracks crisscross the
  area, and the tension in the air is palpable. Neither species
  has established dominance here.
biome: land
