nouns:
  crest: The narrow spine of the ridge, a blade of dark basalt
    worn smooth on top by wind and weather. The rock is warm
    underfoot from absorbed sunlight. On either side the slope
    drops away steeply.
  view: From the ridge crest, the entire Ironwind Steppe is laid
    out before you. To the west, the grey-green flats and the
    distant city. To the east, dark volcanic coulees and deep
    ravines. To the north, cliff faces hiding caves. The scale
    is humbling.
