roomid: 3035
zone: Ironwind Steppe
title: Ridge Spine
description: You stand on the narrow crest of Ironwind Ridge, the
  spine of dark basalt barely wide enough for two people abreast.
  The wind is savage here, a constant gale that tears at clothing
  and makes speech difficult. The view is spectacular -- to the
  west, the sagebrush flats stretch to the distant walls of
  Thornwall; to the east, the land drops away into broken coulees
  and ravines. The ridge runs north-south, its crest a jagged
  line of dark stone against the sky.
