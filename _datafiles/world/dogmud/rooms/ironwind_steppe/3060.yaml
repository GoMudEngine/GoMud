roomid: 3060
zone: Ironwind Steppe
title: Coulee Entrance
description: A narrow gap between two walls of dark basalt opens into
  the coulee system. The walls rise twice a person's height on
  either side, their surfaces rough and pitted with gas bubbles
  frozen in the ancient lava flow. The floor is flat stone, worn
  smooth by water and wind. The passage is barely wide enough for
  two people abreast, and the walls block the steppe wind, creating
  a sudden, oppressive stillness. Shadows pool in the narrow
  channel.
biome: cliffs
