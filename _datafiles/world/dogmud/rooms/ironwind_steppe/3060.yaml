nouns:
  walls: Dark basalt walls rising on either side, their surfaces
    pocked with small holes where gas bubbles were trapped as
    the lava cooled. The stone is rough enough to provide
    handholds but too hard to scratch.
  gap: The entrance to the coulee system -- a narrow split in
    the volcanic rock that could easily be defended by a single
    person. The edges are worn smooth by wind and water.
