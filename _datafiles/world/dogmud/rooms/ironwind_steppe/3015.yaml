roomid: 3015
zone: Ironwind Steppe
title: Northern Sagebrush Flats
description: The flats extend north here, the sagebrush growing denser
  and taller as if the soil is richer on this side. A few twisted
  juniper trees stand alone on the plain, their trunks gnarled by
  decades of wind. The ground is scattered with animal bones --
  small skulls, leg bones, vertebrae -- the remains of prey
  animals discarded by predators. Wolf territory, by the signs.
