nouns:
  junipers: Stunted, wind-twisted juniper trees with shaggy bark
    and dense blue-green foliage. They provide the only real
    shade on the flats. Birds nest in their branches.
  bones: Scattered animal bones, bleached white by sun and wind.
    Small skulls, rib cages, leg bones -- the leavings of
    predators who hunt the flats. Most are old and dry.
