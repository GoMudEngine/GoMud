  northwest:
    roomid: 3014
  south:
    roomid: 3047
nouns:
  sandbar: A wide deposit of fine sand on the inner bank of the
    creek bend, packed with overlapping animal tracks. Boar
    hoofprints dominate, but fox, hare, and bird tracks are
    mixed in.
  willows: Small, scraggly willows leaning over the creek bed,
    their narrow leaves dry and curling. The roots have been
    undercut by erosion, leaving the trees at precarious angles.
