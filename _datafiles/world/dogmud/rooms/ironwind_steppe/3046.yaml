roomid: 3046
zone: Ironwind Steppe
title: Sandy Creek Bend
description: The dry creek bends sharply here, the outer bank cut steep
  and high by the erosive force of seasonal floods. The inner bank
  is a wide sandbar dotted with animal tracks -- this is a popular
  crossing point. A few stunted willows grow along the bank, their
  roots half-exposed by erosion, trailing dried leaves. The sand is
  soft and deep, slowing your steps.
biome: land
