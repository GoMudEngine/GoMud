roomid: 3096
zone: Ironwind Steppe
title: Trampled Clearing
description: A wide clearing where the boars have destroyed all
  vegetation. The ground is bare, packed earth scarred by
  countless hooves. Boar droppings are thick on the ground
  and the smell is overwhelming. This is a gathering area
  where the sounder rests between wallowing sessions. Rubbing
  posts -- sturdy tree trunks worn smooth by bristly hides --
  stand at the clearing's edges, and deep ruts in the earth
  mark where boars have been rooting.
biome: land
