nouns:
  posts: Sturdy tree trunks -- the last survivors of whatever
    grew here before the boars moved in. The bark has been
    rubbed completely off at boar shoulder-height, leaving
    the wood smooth and polished by bristly hides.
  ruts: Deep furrows in the earth where boars have been
    rooting for grubs and tubers, their snouts plowing
    through the soil like organic plows.
