roomid: 3056
zone: Ironwind Steppe
title: Reed Marsh
description: The creek basin dips into a marshy depression where
  water collects year-round, supporting thick stands of cattails
  and rushes. The ground is soft and treacherous -- what looks
  like solid earth may be a thin crust over ankle-deep muck.
  Frogs croak from hidden pools, and dragonflies patrol the
  reeds. The marsh is a vital oasis on the dry steppe, drawing
  wildlife from all directions.
