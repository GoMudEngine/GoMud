nouns:
  cattails: Tall cattails rising above the marsh, their brown
    seed heads bobbing in the breeze. The stems are thick and
    spongy, growing in dense stands that block sight in every
    direction.
  marsh: A waterlogged depression thick with aquatic vegetation.
    Standing water glints between the reed clumps, and the
    ground quakes underfoot. The air is humid and warm,
    buzzing with insect life.
