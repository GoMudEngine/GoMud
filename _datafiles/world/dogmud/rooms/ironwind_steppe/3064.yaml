roomid: 3064
zone: Ironwind Steppe
title: Winding Coulee
description: The coulee twists through the volcanic rock in a
  serpentine course, the walls closing in and pulling back in
  an irregular rhythm. The floor is mostly smooth stone with
  patches of windblown sand collected in low spots. Rust-colored
  mineral stains streak the walls in vertical lines where water
  seeps during rains. The confined space amplifies every sound --
  footsteps echo off the walls and the wind above moans across
  the gap like breath over a bottle.
biome: cliffs
