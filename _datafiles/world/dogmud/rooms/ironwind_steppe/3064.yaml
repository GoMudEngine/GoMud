nouns:
  stains: Rust-red and orange mineral stains running down the
    coulee walls in vertical streaks. Iron deposits in the
    basalt leach out when wet, painting the stone in vivid
    colors that contrast sharply with the dark rock.
  sand: Patches of windblown sand trapped in depressions on
    the coulee floor. The sand is fine and pale, a stark
    contrast to the dark stone. Animal tracks show clearly
    in these sand patches.
