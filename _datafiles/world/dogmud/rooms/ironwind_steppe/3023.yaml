nouns:
  holes: Dozens of burrow entrances, each about the width of a fist,
    surrounded by low mounds of packed earth. The colony is a maze
    of interconnected tunnels extending deep underground.
  mounds: Low cones of sorted earth around each burrow entrance.
    The animals keep these clear and well-maintained, packing the
    soil smooth to prevent flooding.
