title: Prairie Dog Colony
description: The ground is riddled with small holes -- dozens of burrow
  entrances packed into a dense colony. Low mounds of excavated earth
  surround each hole, and the short grass between them has been
  cropped to stubble by the colony's residents. Alert rodent heads
  pop up at intervals, chirping alarm calls before ducking back
  underground. The colony sprawls across a wide area of flat,
  well-drained ground.
