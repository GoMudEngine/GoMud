roomid: 3111
zone: Ironwind Steppe
title: Bone Grotto
description: A grotto littered with bones -- not the small prey
  remains found near the surface, but larger, more disturbing
  specimens. Ribs, femurs, and skulls of animals as large as
  deer and boar lie scattered across the cave floor, many showing
  deep tooth marks. The ceiling is high here and lost in darkness.
  This is a feeding ground for something much larger than the
  crawlers and gnawers of the upper caves. The bones are arranged
  with an almost ritualistic neatness around the grotto's edges.
biome: cave
exits:
  south:
    roomid: 3108
  east:
    roomid: 3112
nouns:
  bones: Large animal bones -- boar ribs, deer leg bones, and
    skulls too large to be rodents. Many are cracked and
    gnawed, showing marks from something with powerful jaws.
    The bones are arranged along the grotto walls with a
    precision that suggests intelligence or instinct.
