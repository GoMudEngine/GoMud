nouns:
  anthills: Conical mounds of fine, sorted earth, each about the
    size of a dinner plate. Red ants stream in and out of the
    central opening, carrying bits of leaf and dead insect.
  sand: Patches of pale, fine-grained sand between the sagebrush
    clumps. The sand holds heat well and attracts basking insects
    and reptiles.
