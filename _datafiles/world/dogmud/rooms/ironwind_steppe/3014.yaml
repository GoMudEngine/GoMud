roomid: 3014
zone: Ironwind Steppe
title: Southern Sagebrush Flats
description: The sagebrush thins here as the soil becomes sandier and
  drier. Small anthills dot the bare patches between bushes, their
  conical mounds of fine earth standing a few inches high. The
  terrain slopes gently south toward a dry creek bed visible as a
  line of larger bushes and scrubby trees in the middle distance.
  Beetles and other insects are more common here, crawling across
  the warm sand.
