zone: Ironwind Steppe
title: Coulee Entrance
description: >-
  The coulee system begins here -- the first clear channel, shallow but
  definite, running roughly north-south and lined with coarser grass and
  the low, dense brush that follows seasonal water. The basalt that
  defines the deeper coulees is still absent; the walls here are packed
  earth and exposed sandstone, no taller than a person at their highest
  point. But the pattern is established: the land has begun to cut
  itself into channels, and travel will follow those channels from here
  on. The eastern approach trail arrives from the broken badland country
  and reaches the coulee floor here. To the west the coulee becomes the
  Eastern Coulee Edge, where the channel meets more defined volcanic
  terrain.
biome: land
