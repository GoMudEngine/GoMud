nouns:
  channel: The first definite coulee channel -- shallow compared to the
    deep basalt-walled coulees further west, but unmistakably a drainage
    cut into the steppe by persistent seasonal flow. The floor is packed
    silt over sandstone, damp in the shade and cracked in the open.
    The walls are low but vertical, the edges undercut slightly by runoff.
  brush: Dense, low brush colonizing the channel margins where seasonal
    moisture concentrates -- thorn-armed, close-branched, the kind that
    makes passage difficult if you leave the trail. Game paths thread
    through it at intervals, narrow and low.
idlemessages:
- The coulee air is cooler and damper than the open steppe above.
- Brush rustles along the channel margin as something small moves
  through it.
- The sandstone walls tick softly as the temperature shifts.
