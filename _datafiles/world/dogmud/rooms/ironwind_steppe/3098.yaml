roomid: 3098
zone: Ironwind Steppe
title: Boar Thicket
description: A dense thicket of thorny bushes that the boars have
  partially demolished but also use as shelter. The branches are
  broken and bent at boar-height, creating low tunnels through
  the vegetation. The interior is littered with bristly hair and
  boar bedding -- piles of crushed grass where the animals sleep.
  The thicket provides shade, shelter from wind, and a measure
  of security from the wolves that patrol nearby.
biome: land
