  west:
    roomid: 3096
  east:
    roomid: 3099
nouns:
  thicket: A dense tangle of thorny bushes, partially destroyed
    by boar traffic but still providing shelter. The branches
    form a canopy at about waist height, creating a cave-like
    space beneath.
  bedding: Piles of crushed grass and broken branches where
    boars have bedded down. The grass is matted flat and
    mixed with coarse bristly hair.
