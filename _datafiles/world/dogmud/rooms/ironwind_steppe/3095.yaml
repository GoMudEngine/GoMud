roomid: 3095
zone: Ironwind Steppe
title: Drinking Pool
description: A broad, shallow pool of brownish water persists here
  year-round, fed by underground seepage. The banks are trampled
  bare by the constant traffic of animals coming to drink. Boar
  tracks dominate, but wolf, fox, hare, and bird tracks all
  overlap in the soft mud. The water is not clean but it is wet,
  and on the dry steppe that is enough to draw every creature
  for miles. Watchful eyes observe from the surrounding cover.
