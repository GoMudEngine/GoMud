roomid: 3093
zone: Ironwind Steppe
title: Reed Bed
description: Thick stands of tall reeds grow from the waterlogged
  ground here, rising above head height and blocking sight in
  every direction. The ground is soft mud and standing water,
  impossible to cross without getting soaked to the knees. The
  reeds rustle and click in the wind, and the air is humid and
  warm, buzzing with mosquitoes. Boar trails cut through the
  reeds like tunnels, their floors churned to deep muck.
biome: land
exits:
  east:
    roomid: 3092
  northeast:
    roomid: 3086
nouns:
  reeds: Tall reeds growing in dense stands from the waterlogged
    soil, their stems as thick as fingers. They tower above your
    head and block sight completely. The rustling is constant and
    disorienting.
