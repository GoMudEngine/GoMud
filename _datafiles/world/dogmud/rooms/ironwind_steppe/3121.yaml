nouns:
  game trail: A compressed line in the coarse steppe grass, worn down
    by the passage of ungulates and predators that follow the coulee
    drainages for reliable water and cover. It is not cut deep -- the
    steppe does not hold impressions well -- but it reads clearly as
    the path of least resistance and that is enough.
  slopes: The long, moderate rises of packed earth and embedded stone
    that replace the sharp badland terrain. The grass here has a better
    hold -- longer roots, denser cover -- and the ground is firmer
    underfoot. The landscape is becoming country rather than terrain.
idlemessages:
- The game trail bends west, following the subtle draw of lower ground.
- A hawk circles overhead, riding the updraft off the warming slope.
- The grass here holds actual green in the low places where moisture
  lingers.
