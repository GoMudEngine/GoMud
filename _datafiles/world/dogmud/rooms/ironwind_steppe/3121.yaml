roomid: 3121
zone: Ironwind Steppe
title: Coulee Approach
description: >-
  The badland terrain begins to moderate here as the eroded fringe gives
  way to longer, more stable slopes of packed earth and coarse grass.
  The rock formations are still present but lower and more worn, embedded
  in the hillside rather than standing free, the angles softer. The path
  is more legible now -- a compressed line in the sparse vegetation,
  joining a faint game trail that runs roughly west. The coulee country
  proper, where channels cut predictable routes through the steppe, is
  near enough that its character is already apparent in the way the land
  begins to fold. East climbs back up toward the stone bench; west the
  trail descends toward the first definable coulee edge.
