nouns:
  stones: Large, rounded stones half-buried in the soil, their
    exposed surfaces worn smooth by centuries of wind and grit.
    Lizards bask on them during the warmest hours.
  tracks: A confusion of animal tracks in the dusty soil. Small
    round prints from hares, the delicate lines of bird feet,
    and the unmistakable four-toed pads of a canine -- probably
    wolf.
