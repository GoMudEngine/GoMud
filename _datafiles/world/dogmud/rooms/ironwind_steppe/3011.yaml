roomid: 3011
zone: Ironwind Steppe
title: Sagebrush Flats
description: Endless sagebrush flats stretch in every direction, the
  grey-green bushes standing in scattered rows like a neglected
  orchard. The grass between them is short and dry, crunching
  underfoot. A few large stones break the flat terrain, their
  surfaces pale and wind-worn. Animal tracks crisscross the
  bare soil -- the prints of rabbits, foxes, and something
  larger with padded paws.
