nouns:
  cliffs: Pale sandstone cliffs rising several stories above you,
    their faces sculpted by wind into smooth, organic shapes. Dark
    streaks of mineral staining run vertically down the face like
    tear tracks. The stone is layered, each stratum a different
    shade.
  openings: Dark cave mouths in the cliff face, ranging from
    narrow slits to openings wide enough for two people abreast.
    Cool air flows from each one, carrying the smell of deep
    stone and moisture.
