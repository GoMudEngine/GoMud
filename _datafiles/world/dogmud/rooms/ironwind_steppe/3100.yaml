roomid: 3100
zone: Ironwind Steppe
title: Cliff Base
description: The northern cliffs rise abruptly from the steppe here,
  a wall of pale sandstone streaked with dark mineral stains. The
  cliff face is pocked with wind-carved hollows and overhangs, the
  stone eroded into smooth, flowing shapes. At the base, fallen
  rocks have piled into a natural ramp leading up to several dark
  openings in the cliff face -- cave mouths, exhaling cool air that
  smells of stone and damp. Wind howls across the cliff face,
  creating an eerie, fluctuating moan.
biome: cliffs
