nouns:
  undergrowth: Dense, tangled vegetation filling the ravine
    floor -- thorny bushes, climbing vines, and saplings
    competing for the limited light. The growth provides
    excellent cover for wolves stalking through the ravine.
  seep: A muddy spot where groundwater oozes to the surface,
    keeping the earth perpetually damp. Moss grows on the
    wet stones and the air smells of wet earth.
