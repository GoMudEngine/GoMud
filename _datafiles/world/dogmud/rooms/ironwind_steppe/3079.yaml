roomid: 3079
zone: Ironwind Steppe
title: Deep Wolf Run
description: The ravine cuts deeper here, the walls rising high
  above your head and blocking most of the sky. The vegetation
  is thick and tangled -- vines, thorny bushes, and small trees
  growing in the sheltered depths. The stream from upstream has
  gone underground, leaving damp earth and the occasional muddy
  seep. Wolf trails branch in every direction through the
  undergrowth. The sense of being watched is constant.
biome: land
