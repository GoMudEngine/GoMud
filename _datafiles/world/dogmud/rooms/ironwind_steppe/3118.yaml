nouns:
  hardpan: The cracked caliche surface of the flat, pale and faintly
    chalky underfoot. The shrinkage cracks run several inches deep and
    are filled with wind-deposited silt. Pressing on the surface between
    the cracks produces a faint hollow tap, as if there is empty space
    beneath -- there may be. The mineral rings left by evaporated
    pooling describe the absent water's maximum extent.
  creosote: Low, widely-spaced shrubs clinging to the perimeter of
    the hardpan where a little soil accumulates. Their small leaves
    are coated in sticky aromatic resin -- in the heat of the day they
    release a sharp, medicinal smell. They are the first plants willing
    to live here, and nearly the last.
idlemessages:
- The hardpan crunches under your weight, each step ringing slightly
  hollow.
- The steppe wind crosses the flat with nothing to slow it.
- Dust lifts off the cracked surface in pale ribbons.
