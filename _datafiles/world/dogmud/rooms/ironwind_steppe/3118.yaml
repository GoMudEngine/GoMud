roomid: 3118
zone: Ironwind Steppe
title: Eroded Flats
description: >-
  The rough descent levels here into a brief flat of cracked caliche and
  pale hardpan, the surface patterned with deep shrinkage cracks that
  form rough polygons underfoot. Rain has pooled here in the past and
  evaporated, leaving rings of mineral deposit and a chalky crust that
  yields slightly underfoot like thin plaster over hollow ground.
  Nothing grows on the hardpan itself, but scraggly creosote and dry-
  land shrubs cluster at its edges where some soil accumulates. The
  flat is exposed in every direction; there is no cover and no shelter
  from the steppe wind. The slope you descended stands east, and the
  terrain begins to break up again to the north.
biome: land
