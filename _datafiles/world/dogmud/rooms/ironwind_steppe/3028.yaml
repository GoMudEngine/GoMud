    roomid: 3029
nouns:
  stones: Flat, dark stones arranged in a natural tumble, their
    surfaces smooth and warm to the touch. Faint grooves in the
    dust around them show where snakes have slithered between
    the gaps. Several stones overlap, creating narrow crevices
    perfect for a serpent's den.
