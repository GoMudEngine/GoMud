roomid: 3028
zone: Ironwind Steppe
title: Viper Stones
description: A tumble of flat stones lies half-buried in the steppe
  here, their dark surfaces absorbing the sun's heat. This is
  prime basking territory for vipers and other cold-blooded
  creatures -- the stones retain warmth well into the evening.
  The grass around the stones has been worn away by the sliding
  of scaled bodies, leaving bare patches of sandy earth. Step
  carefully here.
biome: land
