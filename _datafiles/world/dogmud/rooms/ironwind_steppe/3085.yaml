roomid: 3085
zone: Ironwind Steppe
title: Lower Wolf Run
description: The ravine deepens into a narrow, shadowed corridor
  where the walls are sheer packed earth and exposed stone. The
  air is cool and still, sheltered from the steppe wind. Dense
  moss grows on the damp lower walls, and the ground is soft
  with accumulated leaf litter and decomposing vegetation. This
  is the deepest part of Wolf Run, where the pack retreats
  during storms or extreme heat.
biome: land
