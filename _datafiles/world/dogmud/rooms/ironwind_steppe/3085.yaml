nouns:
  walls: Sheer ravine walls of packed earth and exposed stone,
    rising well above head height. The lower sections are damp
    and moss-covered, while the upper portions are dry and
    crumbling.
  moss: Thick green moss carpeting the damp lower walls, soft
    and spongy to the touch. It holds moisture and contributes
    to the cool, damp air of the deep ravine.
