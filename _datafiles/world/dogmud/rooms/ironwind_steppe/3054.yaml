zone: Ironwind Steppe
title: Creek Junction
description: Two dry creek beds converge here, their sandy floors
  meeting at a broad, flat junction littered with flood debris.
  Piles of driftwood, tangled brush, and smooth stones have
  accumulated where the currents once met. The combined channel
  continues south, wider and deeper than either tributary. The
  junction is a natural crossroads for the basin's wildlife,
  with trails leading in every direction.
