nouns:
  debris: Tangled piles of driftwood, brush, and flood refuse
    wedged into the junction. Some pieces are large -- whole
    tree trunks stripped of bark and polished by water. The
    piles provide shelter for small animals.
  junction: The meeting point of two dry creek channels, marked
    by a wider, flatter floor and deeper banks. The erosion
    patterns show where water once swirled and eddied.
