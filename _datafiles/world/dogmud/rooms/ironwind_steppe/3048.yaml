nouns:
  clay: Hard-packed clay scored with a network of drying cracks,
    each crack an inch or more wide. White salt crusts line
    some of the cracks, left by evaporating water. The surface
    is flat and firm underfoot.
  trails: Multiple game trails converging on this crossing point,
    worn smooth by generations of animals. The trails fan out
    in both directions on the far sides.
