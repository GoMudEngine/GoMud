roomid: 3048
zone: Ironwind Steppe
title: Creek Basin Crossing
description: The dry creek bed widens here into a broad, flat expanse
  of cracked clay and scattered stones. In wet season this would
  be a shallow ford; now it is just a dry crossing where the
  banks are low enough to walk across without climbing. Game
  trails converge from north and south, crossing the basin at
  this natural low point. The clay is tessellated with drying
  cracks and dusted with salt deposits.
biome: land
