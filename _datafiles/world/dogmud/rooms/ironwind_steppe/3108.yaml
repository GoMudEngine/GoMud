roomid: 3108
zone: Ironwind Steppe
title: Stalker's Gallery
description: A long, narrow gallery where the ceiling drops low
  enough to force you into a crouch. The walls are close and the
  darkness is absolute -- no light reaches this deep. The floor
  is smooth stone, worn by water and by the passage of creatures
  that navigate by sound and touch rather than sight. The air is
  still and cold, with a faint, musty animal smell. You have the
  persistent, uncomfortable feeling of being watched.
biome: cave
exits:
  south:
    roomid: 3105
nouns:
  ceiling: The gallery ceiling drops to within four feet of the
    floor, forcing anyone human-sized to crouch. The stone is
    smooth and slightly damp, cold to the touch. Scratch marks
    on the rock show where something with claws has passed.
