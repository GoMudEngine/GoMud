  south:
    roomid: 3110
  west:
    roomid: 3109
nouns:
  cistern: A natural pool of dark, still water filling the cave
    floor. The water is cold enough to numb exposed skin in
    seconds and so clear that the dark color comes from the
    depth rather than turbidity. The edges drop off steeply
    into blackness.
  ripples: Slow, deliberate ripples that cross the pool's surface
    with no visible cause. Something large moves in the deep
    water, disturbing the surface at irregular intervals.
