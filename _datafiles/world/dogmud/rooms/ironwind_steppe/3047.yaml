zone: Ironwind Steppe
title: Muddy Pool
description: A shallow pool of murky water persists here where the
  creek bed deepens into a natural basin. The water is brown and
  still, fed by underground seepage rather than surface flow. The
  banks are trampled to slick mud by the constant traffic of
  animals coming to drink. Insect larvae wriggle in the shallows,
  and water striders skate across the surface. This is the most
  reliable water source on the steppe.
