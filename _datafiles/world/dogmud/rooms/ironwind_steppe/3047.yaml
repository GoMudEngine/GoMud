nouns:
  pool: A shallow pool of muddy water, perhaps ten paces across
    and no deeper than knee-height at its center. The water is
    warm, still, and not particularly clean, but it is wet --
    which is what matters on the steppe.
  mud: Thick, dark mud churned by countless hooves and paws.
    The banks are so trampled that the mud extends several
    paces from the water's edge. It sucks at your boots with
    every step.
