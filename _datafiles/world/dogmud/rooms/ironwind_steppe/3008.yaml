roomid: 3008
zone: Ironwind Steppe
title: Dry Gully
description: A narrow gully cuts through the ground here, carved by
  seasonal rainwater running off toward the drainage ditch to the
  west. The gully is about waist-deep, with crumbling earth walls
  and exposed roots. The bottom is sandy and dry except after rain.
  Small animals have burrowed into the gully walls, leaving a
  network of holes. The surrounding steppe grass grows tall along
  the gully's lip, providing cover for anything hiding below.
biome: land
