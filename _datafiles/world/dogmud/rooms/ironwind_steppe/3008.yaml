nouns:
  gully: A natural drainage channel about four feet deep, with walls
    of packed earth. Tree roots poke from the sides in places. The
    bottom is a mix of sand and gravel, dry now but clearly a
    watercourse during heavy rains.
  holes: Small burrow entrances dot the gully walls -- round, clean-
    edged holes the width of a fist. Scratch marks around some of
    them suggest active use.
