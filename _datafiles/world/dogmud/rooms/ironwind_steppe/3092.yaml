roomid: 3092
zone: Ironwind Steppe
title: Central Wallows
description: The heart of the boar wallowing grounds -- a sprawling
  area of churned mud, standing water, and battered vegetation.
  The wallows here are the largest and deepest, some filled with
  enough water for a boar to submerge almost entirely. The mud is
  dark, rich, and ankle-deep even between the wallows. The stench
  is tremendous. This is where the biggest boars gather, the
  tusked patriarchs who have first claim on the best mud.
