roomid: 3090
zone: Ironwind Steppe
title: Wallow Approach
description: The terrain descends into a broad, muddy lowland that
  reeks of boar musk and standing water. The grass is trampled
  flat and the ground is soft, squelching with every step. Deep
  hoofprints mark the muddy earth in every direction, and the
  vegetation is battered and broken where boars have pushed
  through. This is the northern approach to the main wallowing
  grounds -- boar territory proper.
biome: land
exits:
