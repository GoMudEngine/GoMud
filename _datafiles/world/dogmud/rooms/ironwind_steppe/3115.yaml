roomid: 3115
zone: Ironwind Steppe
title: The Stone Circle
description: A ring of weathered standing stones rises from the grass
  at the base of the ridge, each stone twice the height of a person
  and dark with age. The stones are rough basalt, their surfaces
  carved with spiraling patterns so old they have nearly merged
  with the natural grain of the rock. The grass inside the circle
  is shorter and greener than the surrounding steppe, as if fed
  by something beneath the soil. The air here is different -- still
  and warm, humming with a faint resonance that seems to come from
  the stones themselves. Small offerings of bone, feather, and
  dried flowers are tucked into cracks at the base of each stone.
biome: land
