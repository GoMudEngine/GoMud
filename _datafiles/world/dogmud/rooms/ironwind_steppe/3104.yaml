roomid: 3104
zone: Ironwind Steppe
title: Crawler Nest
description: A low-ceilinged side chamber infested with cave crawlers.
  The walls and ceiling are covered with a thin layer of organic
  residue -- the crawlers' secretions, used to mark territory and
  trap small prey. The floor is littered with the hollow shells of
  consumed insects and the shed exoskeletons of growing crawlers.
  The air is thick with a sour, chemical smell. Multiple crawlers
  cling to the walls and ceiling, their segmented bodies pressed
  flat against the stone.
