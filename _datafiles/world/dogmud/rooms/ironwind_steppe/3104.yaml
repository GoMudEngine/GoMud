nouns:
  residue: A thin, glistening layer of organic secretion coating
    the cave surfaces. It is slightly sticky to the touch and
    has a sharp, sour smell. The secretion hardens over time into
    a brittle, amber-like crust.
  shells: Hollow insect shells and shed exoskeletons scattered
    across the cave floor -- the remains of crawler meals and
    growth cycles. Some are surprisingly large, suggesting the
    crawlers can grow to considerable size.
