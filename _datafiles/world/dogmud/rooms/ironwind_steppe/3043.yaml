zone: Ironwind Steppe
title: South Ridge Overlook
description: A broad, flat outcrop on the ridge's south face provides
  a natural viewpoint overlooking the dry creek basin and the land
  beyond. The basin is visible below as a winding line of greenery
  in the otherwise dry landscape -- the banks of the seasonal creek
  supporting denser vegetation. Further south, the terrain breaks
  into the boar wallows and wolf ravines. The wind is steady but
  not violent here, blocked partially by the ridge above.
