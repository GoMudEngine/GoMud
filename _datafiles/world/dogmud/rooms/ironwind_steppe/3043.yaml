nouns:
  outcrop: A flat slab of basalt jutting from the ridge face,
    about ten paces across and remarkably level. The stone is
    warm from the sun and the surface is etched with natural
    fracture patterns that look almost like a road map.
  basin: The dry creek basin spread out below, a winding channel
    of sandy banks and occasional green patches where water
    collects. Even from here you can see animal tracks along
    the banks.
