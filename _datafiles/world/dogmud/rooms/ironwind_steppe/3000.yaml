idlemessages:
- A gust of wind rattles a loose shutter on the gate tower.
- Dust swirls across the wagon track in a lazy spiral.
- A crow hops along the top of a refuse pile, tearing at something.
- The distant sound of the city fades behind you as the wind picks up.
