nouns:
  basalt: Dark volcanic stone, dense and heavy, breaking through
    the steppe soil in angular slabs. The surface is rough and
    pitted, dark grey to black, and noticeably warmer than the
    surrounding earth.
  lichen: Pale green and orange lichen colonizing the cracks and
    north-facing surfaces of the basalt outcrops. The lichen
    grows in slow, circular patches.
