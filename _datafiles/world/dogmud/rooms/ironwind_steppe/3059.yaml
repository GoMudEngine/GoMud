roomid: 3059
zone: Ironwind Steppe
title: Coulee Approach
description: The terrain changes abruptly here as soft earth gives
  way to dark volcanic stone. The basalt rises in broken slabs and
  low walls, the first outcroppings of the coulee system that
  dominates the eastern steppe. Cracks in the stone glow with
  lichen, and tough grass grows from every fissure. The rock
  absorbs heat, making the air shimmer above its dark surface.
  The way east leads into the maze of volcanic channels.
