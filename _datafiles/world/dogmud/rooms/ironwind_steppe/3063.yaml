nouns:
  overhang: A thick slab of basalt extending from the wall like
    a shelf, providing about ten paces of covered floor space.
    The underside is smoke-blackened and scratched with crude
    graffiti -- goblin clan marks, by the look of them.
  fires: The remains of several small campfires, each a ring
    of smoke-blackened stones surrounding a pile of cold ash.
    Gnawed bones and charred scraps are scattered around them.
