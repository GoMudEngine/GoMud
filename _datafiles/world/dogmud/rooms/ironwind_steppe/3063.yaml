roomid: 3063
zone: Ironwind Steppe
title: Basalt Overhang
description: A massive slab of basalt juts from the coulee wall,
  forming a natural overhang that shelters a broad area of flat
  stone. The ceiling is low -- barely above head height -- and
  the underside is blackened with old fire soot. This sheltered
  spot has clearly been used as a camp by goblin scouts. Bones,
  crude scratches, and the remains of small fires litter the
  ground. The overhang faces south, catching the warmth of the
  sun while blocking the northern wind.
biome: cliffs
