roomid: 3029
zone: Ironwind Steppe
title: Northern Steppe Edge
description: The sagebrush flats reach their northern extent here,
  the terrain rising into broken ground where grass gives way to
  scrub and exposed rock. To the north, the land climbs steadily
  toward distant cliff faces carved by wind and water. The soil
  is thin and stony, and the vegetation clings to whatever
  pockets of earth it can find. Animal trails converge here
  before branching into the rougher terrain ahead.
