nouns:
  cliffs: Distant cliff faces of pale stone, streaked with dark
    mineral stains. Wind-carved hollows and overhangs are visible
    even from this distance. The caves of the northern reaches
    begin somewhere in those cliffs.
  trails: Multiple animal trails converging from the flats to the
    south, merging into a few well-worn paths heading north into
    the broken ground. The traffic is considerable.
