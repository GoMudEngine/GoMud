roomid: 3117
zone: Ironwind Steppe
title: Badlands Descent
description: >-
  The ground drops here in a long, uneven shelf -- not a cliff but a
  series of natural steps, each a short scramble of loose stone and
  compacted silt. The descent faces northwest, and the wind comes up
  the slope full in the face at every step. Sparse dry grass grows
  in the sheltered angle of each step, brown and stiff, anchored by
  roots that look too small for the job. Below, the terrain continues
  to roll and break, revealing nothing of what lies further on.
  Behind you to the south the badlands flatten briefly before rising
  back toward the coulee country. To the west the shelf drops away
  to the next stretch of broken ground.
biome: cliffs
