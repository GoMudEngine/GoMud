nouns:
  shelf: The natural terracing of the slope, each step a compressed
    layer of different stone -- volcanic above, sandstone and pale
    silt below. The edges are crumbly and the faces are wind-polished
    smooth. Negotiating them requires care -- the drop between each
    step is easy enough to misjudge.
  grass: Short, wire-stiff stalks of brown steppe grass, dormant or
    simply resigned to the conditions here. The root masses that hold
    them in are disproportionately large, the visible part of a system
    that reaches deep in search of moisture.
idlemessages:
- Gravel skitters away underfoot and bounces down the step below.
- The wind comes hard up the slope, driving grit against your shins.
- The horizon to the west shows nothing but more broken country.
