roomid: 3016
zone: Ironwind Steppe
title: Ridgefoot Flats
description: The open sagebrush flats narrow here at the foot of the
  ridge. To the west the level grassland runs on toward the ridge
  approach, while to the east and north the dark mass of Ironwind
  Ridge breaks the skyline and the ground begins to climb. The wind
  is steady and warm, bending the grass in continuous rolling waves.
  A large boulder sits at the flats' edge, dropped here by some
  ancient glacial force. Southward the soil thins and the ground
  breaks into rock.
biome: land
