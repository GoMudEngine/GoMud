roomid: 3016
zone: Ironwind Steppe
title: Central Sagebrush Flats
description: A broad, open stretch of the sagebrush flats where the
  terrain is almost perfectly level. The horizon is a clean line in
  every direction except northeast, where the dark mass of Ironwind
  Ridge breaks the skyline. The wind is steady and warm, bending
  the grass in continuous rolling waves. A large boulder sits
  incongruously in the middle of the flats, dropped here by some
  ancient glacial force.
biome: land
exits:
  west:
    roomid: 3030
  south:
    roomid: 3017
nouns:
  boulder: An enormous grey boulder, taller than a person, sitting
    alone on the flat steppe. Its surface is covered with pale
    lichen and the scratches of sharpening claws. The wind has
    carved shallow grooves into the softer stone.
