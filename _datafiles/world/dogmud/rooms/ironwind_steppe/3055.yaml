roomid: 3055
zone: Ironwind Steppe
title: Basin Overlook
description: A low rise on the eastern bank of the creek basin provides
  a vantage point overlooking the drainage below. From here you can
  see the winding course of the dry creek, the muddy boar wallows,
  and the dark line of volcanic rock where the basalt coulees begin
  to the east. The transition between terrain types is stark -- soft
  earth and sand giving way abruptly to hard, dark volcanic stone.
biome: land
exits:
  east:
    roomid: 3060
  west:
    roomid: 3053
nouns:
  rise: A gentle hill on the basin's eastern edge, high enough
    to see over the creek banks. The grass on top is short and
    wind-cropped, and a few stones provide natural seats.
  coulees: The basalt coulees are visible to the east -- a dark,
    broken landscape of volcanic rock channels and overhangs,
    looking like the earth cracked and split apart. The
    contrast with the soft creek basin is dramatic.
