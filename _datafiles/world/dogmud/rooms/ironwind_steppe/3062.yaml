nouns:
  markings: Crude scratches on the basalt wall -- directional
    arrows, tally marks, and what might be a rough map of the
    coulee system. The marks are made with a lighter stone
    on the dark basalt. They look deliberately placed.
  chamber: An open area perhaps fifteen paces across, where
    multiple coulee channels converge. The walls pull back
    enough to let sunlight reach the floor. Gravel and debris
    have accumulated in drifts against the walls.
