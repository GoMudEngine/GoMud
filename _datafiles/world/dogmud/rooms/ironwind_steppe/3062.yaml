zone: Ironwind Steppe
title: Coulee Crossroads
description: Several coulees intersect here in a wider space where
  the basalt walls pull back to form a rough chamber open to the
  sky. The floor is littered with broken stone and gravel washed
  in from the surrounding channels. Passages lead in multiple
  directions, each disappearing into shadow between dark stone
  walls. Scratches and crude markings on the wall suggest someone
  or something uses this junction regularly.
biome: cliffs
