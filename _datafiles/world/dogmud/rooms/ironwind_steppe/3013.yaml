nouns:
  clearing: A patch of unusually lush grass in the midst of the dry
    flats. Some underground seep must feed the roots here. The grass
    is thick enough to hide a crouching animal.
  trail: A well-worn game trail, the grass beaten flat by regular
    traffic. Hoofprints and pawprints overlap -- boars, hares, and
    wolves all use this path.
