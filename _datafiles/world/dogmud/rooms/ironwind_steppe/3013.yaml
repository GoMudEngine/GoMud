roomid: 3013
zone: Ironwind Steppe
title: Sagebrush Clearing
description: A natural clearing in the sagebrush where the grass grows
  thicker and greener, fed by some underground moisture. The clearing
  is roughly circular, about thirty paces across, and the grass here
  reaches knee-height. Animal droppings and flattened patches show
  this is a regular grazing and resting spot for the steppe's
  wildlife. A game trail runs north-south through the clearing.
