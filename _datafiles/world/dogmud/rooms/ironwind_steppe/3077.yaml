roomid: 3077
zone: Ironwind Steppe
title: Wolf Run Stream
description: A thin stream of clear water runs along the ravine floor
  here, fed by an underground spring. The water is cold and clean,
  a precious resource on the steppe. The banks are worn smooth by
  the paws of wolves coming to drink, and the mud holds dozens of
  overlapping canine prints. The vegetation along the stream is
  greener and lusher than anything above, fed by the reliable
  moisture.
biome: land
