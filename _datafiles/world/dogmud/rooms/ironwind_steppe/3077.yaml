  east:
    roomid: 3083
nouns:
  stream: A narrow stream of clear water, barely a foot wide and
    only a few inches deep, running over a bed of smooth stones.
    Despite its small size, this stream is the lifeblood of the
    Wolf Run ecosystem.
  prints: Dozens of wolf pawprints in the soft mud along the
    stream banks, ranging from the small prints of juveniles
    to the massive pads of the alpha. The prints overlap in
    dense layers.
