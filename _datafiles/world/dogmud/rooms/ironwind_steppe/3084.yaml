zone: Ironwind Steppe
title: Wolf Lookout
description: A rocky ledge projects from the ravine wall here,
  forming a natural lookout point where wolves can survey the
  approaches below. The ledge is worn smooth by years of use,
  and piles of wolf droppings mark the edges. From here a wolf
  can see and scent anything approaching through the ravine for
  a considerable distance. The ledge is about shoulder-height
  above the ravine floor, accessible by a worn scramble.
