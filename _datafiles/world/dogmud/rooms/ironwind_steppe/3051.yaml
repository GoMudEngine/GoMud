nouns:
  driftwood: Sun-bleached branches and log sections, polished
    smooth by water and deposited along the basin floor by past
    floods. Some are wedged between boulders, others lie in
    loose piles against the banks.
  banks: Steep earthen banks rising on both sides, cut clean by
    water erosion. Layers of soil, clay, and gravel are visible
    in cross-section, each layer a different color and texture.
