roomid: 3051
zone: Ironwind Steppe
title: Creek Basin Floor
description: The dry creek basin broadens here into a wide, flat floor
  of packed sand and gravel. The banks on either side are head-height,
  creating a sheltered corridor out of the wind. The basin floor is
  crisscrossed with animal trails and scattered with sun-bleached
  driftwood -- branches and logs deposited by past floods. The air
  is warmer and stiller here, trapped in the basin's channel.
biome: land
