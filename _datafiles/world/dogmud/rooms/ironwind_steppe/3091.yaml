nouns:
  wallows: Broad, shallow pits scooped in the muddy earth by
    boar bodies, each large enough for a single animal. The
    mud inside is churned smooth and dark, mixed with bristly
    hair and the strong scent of musk.
  reeds: Flattened cattails and rushes, crushed by rolling
    boar bodies. The vegetation is battered into a muddy
    pulp around each wallow.
