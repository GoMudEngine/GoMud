roomid: 3091
zone: Ironwind Steppe
title: Outer Wallows
description: Broad, shallow pits of churned mud mark the outer
  wallowing grounds where boars coat themselves in earth. Some
  wallows are occupied, the boars lying half-submerged in the
  cooling mud with only their backs and ears visible. Others
  are empty, their surfaces drying and cracking in the sun.
  Trampled reeds and flattened grass surround each wallow in
  a ring of destruction.
