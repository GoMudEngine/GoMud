roomid: 3083
zone: Ironwind Steppe
title: Brush Tunnel
description: The ravine narrows drastically here, the vegetation
  closing in overhead to form a living tunnel of interlocking
  branches. The light is dim and green-filtered, and the air is
  cool and damp. The game trail threads through the tunnel like
  a vein through tissue, the only clear path through the dense
  growth. Wolf scent is everywhere -- this is a heavily traveled
  corridor between different parts of their territory.
