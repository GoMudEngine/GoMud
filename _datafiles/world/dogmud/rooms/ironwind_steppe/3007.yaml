nouns:
  mud: Dark, sticky mud that sucks at your boots. The surface is
    pockmarked with hoofprints, pawprints, and the drag marks of
    something heavy. A few bubbles rise and pop lazily.
  stones: Flat stones half-sunk in the mud, their tops worn smooth
    by use as stepping points. They form a rough path across the
    widest part of the depression.
