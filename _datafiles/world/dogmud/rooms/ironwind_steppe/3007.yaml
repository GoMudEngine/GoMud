roomid: 3007
zone: Ironwind Steppe
title: Muddy Depression
description: A low spot in the terrain collects rainwater and city runoff
  into a broad, shallow depression of dark mud. The edges are trampled
  heavily with animal tracks, and the surrounding grass is cropped short
  by grazing. A few flat stones break the surface of the mud, used as
  stepping stones by whatever creatures frequent this place. The air
  is thick with the smell of wet earth and the buzz of insects.
biome: land
