  south:
    roomid: 3007
nouns:
  cairn: A tumbled pile of stones that once stood waist-high, now mostly
    collapsed and overgrown. One flat stone near the base might bear
    faded carved letters, but erosion has made them illegible. It
    could be an old boundary marker for the city's jurisdiction.
  flowers: Small hardy wildflowers growing along the track edges --
    yellow buttercups and white clover, the kind that thrives in
    poor soil and full sun.
