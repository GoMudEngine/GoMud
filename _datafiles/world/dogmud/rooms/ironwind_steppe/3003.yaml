roomid: 3003
zone: Ironwind Steppe
title: Overgrown Track
description: The wagon track narrows here as grass encroaches from both
  sides. Wildflowers -- small yellow and white blossoms -- dot the
  verge where the soil is less trampled. The ground is still firm
  underfoot but the transition from city outskirts to open steppe is
  nearly complete. A collapsed stone cairn sits beside the track,
  perhaps an old waymarker or boundary stone half-swallowed by weeds.
biome: land
