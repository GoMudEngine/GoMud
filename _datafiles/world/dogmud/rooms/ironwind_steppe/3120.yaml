roomid: 3120
zone: Ironwind Steppe
title: Stone Bench Overlook
description: >-
  A wide ledge of flat volcanic rock protrudes from the hillside here,
  a natural bench several paces wide and nearly as deep, its surface
  scoured clean by wind and age. The view from the bench is long and
  westward -- open steppe rolling away to a low horizon, the land's
  character shifting from the broken badland fringe here to the broader
  grassland and coulee country beyond. From this height the distances
  are honest: there is still a great deal of empty ground between this
  place and anywhere. The bench itself is clear of brush and offers a
  moment of flat footing after the scrambled terrain below. Descent
  continues north toward lower ground; east the way climbs back into
  the wash country.
biome: cliffs
