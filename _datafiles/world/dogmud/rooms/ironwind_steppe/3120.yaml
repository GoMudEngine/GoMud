nouns:
  bench: The flat protrusion of volcanic rock, worn smooth on the upper
    surface and rough-fractured on its underside where it broke away
    from the hillside. It is solid underfoot -- a rare thing on this
    stretch of trail -- and wide enough to rest on without risk of a
    footing mistake. The surface is warm from the sun and holds the
    heat long after shade falls.
  steppe: The broad grassland and coulee country visible to the west
    from the bench -- a wide, rolling distance that shows the land's
    true scale. From here the separate elements resolve into a single
    thing -- a large, dry, open country that takes time to cross.
idlemessages:
- The wind is stronger on the exposed bench, coming level and steady.
- Looking west, the steppe seems to breathe -- grass and scrub moving
  in slow waves.
- The footing here is solid, a relief after miles of loose stone.
