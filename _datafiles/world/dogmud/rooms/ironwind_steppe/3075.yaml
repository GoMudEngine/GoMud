roomid: 3075
zone: Ironwind Steppe
title: Wolf Run Entrance
description: A narrow ravine opens in the steppe here, its walls of
  packed earth and exposed stone descending steeply into shadow.
  Dense brush grows along the ravine lip, and the game trail
  leading down is worn deep and smooth by heavy canine traffic.
  Wolf scent marks saturate the entrance -- this is clearly
  claimed territory. From below comes the sound of running water,
  a rarity on the dry steppe.
biome: land
