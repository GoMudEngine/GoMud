  south:
    roomid: 3076
nouns:
  ravine: A steep-walled ravine cutting into the steppe, about
    twice a person's depth and narrow enough to jump across at
    its widest. The walls are layered earth and stone, the
    exposed roots of steppe grass dangling from the upper edges.
  brush: Dense, thorny brush growing along the ravine lip,
    providing cover and concealment. The branches are scored
    with claw marks and draped with tufts of grey wolf fur.
