nouns:
  cracks: The mud surface is divided into hundreds of irregular
    polygons by deep drying cracks. Each section is slightly
    concave, its edges curling up. The pattern extends across
    the entire flat.
  tracks: Perfectly preserved animal tracks in the dried mud --
    cloven boar hoofprints, wolf pawprints, bird feet, and
    the dragging belly-marks of a large snake.
