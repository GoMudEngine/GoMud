roomid: 3094
zone: Ironwind Steppe
title: Mudflat
description: A broad, flat expanse of cracked mud stretching between
  the wallows and the higher ground. The surface is a mosaic of
  drying cracks, each section curling slightly at the edges. When
  wet, this is a shallow lake; now it is a hardpan flat baked by
  the sun. Boar and wolf tracks cross the flat in all directions,
  the hoofprints and pawprints preserved in the dried mud like
  fossils.
biome: land
