roomid: 3026
zone: Ironwind Steppe
title: Boar Wallow Path
description: A muddy, trampled path winds south through the sagebrush
  here, clearly made by heavy animals. The ground is torn up by
  hooves and the sagebrush along the path is broken and crushed.
  The mud is pocked with deep hoofprints and the air has a rank,
  musky smell. This is a regular route for boars moving between
  the wallows to the south and grazing grounds to the north.
