nouns:
  path: A broad track of churned mud and crushed vegetation made
    by the passage of large animals. The hoofprints are deep
    and cloven -- boar tracks, each the size of a palm.
  sagebrush: Sagebrush along the path has been broken, trampled,
    and rubbed against by passing animals. Some bushes have been
    uprooted entirely, leaving bare dirt.
