roomid: 3058
zone: Ironwind Steppe
title: Basin South End
description: The dry creek basin widens and shallows here as the
  terrain levels out toward the south. The banks diminish to
  gentle slopes, and the creek bed spreads into a broad wash of
  sand and gravel. Beyond, the land opens into the lower regions
  of the steppe -- boar wallows to the southwest and wolf ravines
  to the south. The ground is drier here, the sand pale and fine.
biome: land
