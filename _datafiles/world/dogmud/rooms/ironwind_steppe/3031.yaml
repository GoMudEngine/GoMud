nouns:
  trail: A narrow switchback trail worn into the ridge face by
    the passage of animals over many years. The surface is a mix
    of packed earth and exposed stone, worn smooth in places.
  view: The western view reveals the full expanse of the sagebrush
    flats, stretching back toward the distant pale line of
    Thornwall's city walls. The scale of the steppe is immense
    from this vantage.
