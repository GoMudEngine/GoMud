roomid: 3031
zone: Ironwind Steppe
title: Lower Ridge Trail
description: A narrow trail switchbacks up the western face of the
  ridge, carved by generations of animal traffic. The trail is
  barely a foot wide, with loose rock on one side and a steep
  drop on the other. Tough, low-growing plants cling to the
  rocky soil, and the occasional pine offers a handhold. The
  view to the west is already impressive -- the sagebrush flats
  spread out below like a rumpled grey-green carpet.
