roomid: 3074
zone: Ironwind Steppe
title: Eastern Coulee Edge
description: The easternmost coulee channel opens here onto a broad
  slope of broken rock and sparse grass. The basalt gives way to
  mixed stone -- volcanic rock and sandstone jumbled together by
  ancient geological forces. The view east shows more broken
  terrain, but the coulee walls end here. Below, a game trail
  winds south toward the wolf ravines. The ground is unstable,
  a mix of loose stone and packed earth.
biome: cliffs
exits:
  west:
    roomid: 3073
nouns:
  slope: A broad slope of mixed stone and earth, descending
    southeast toward lower terrain. The footing is uncertain,
    with loose rocks shifting underfoot. Tufts of grass grow
    in sheltered spots between the stones.
