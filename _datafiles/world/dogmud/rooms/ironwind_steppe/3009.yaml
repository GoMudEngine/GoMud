roomid: 3009
zone: Ironwind Steppe
title: Steppe Margin
description: The last of the city's detritus -- broken pottery, a
  rotting fence rail, a sun-bleached animal skull -- lies scattered
  in the grass here, marking the final edge of civilization's reach.
  Beyond this point the steppe is untouched, rolling eastward in
  long swells of silver-green grass under a vast sky. The ground
  is firm and dry, the soil thin over hardpan clay. A faint game
  trail threads southeast through the grass, worn by animals moving
  between the city fringe and the open plains.
