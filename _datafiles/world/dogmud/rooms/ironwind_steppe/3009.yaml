nouns:
  skull: A sun-bleached animal skull, probably a dog or large fox.
    The bone is white and dry, half-buried in the grass. One eye
    socket stares skyward.
  trail: A narrow game trail beaten into the grass by the passage
    of small animals. It winds southeast, disappearing into the
    taller grass of the open steppe.
  pottery: Fragments of broken clay pottery, the glazed kind used
    in Thornwall kitchens. Tossed out with the refuse, they have
    been scattered by weather and animals.
