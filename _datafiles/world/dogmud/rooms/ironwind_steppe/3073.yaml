zone: Ironwind Steppe
title: Coulee South Exit
description: The basalt coulees end here as the volcanic rock gives
  way to softer earth and grass. The dark stone walls diminish to
  low outcrops and finally submerge beneath the steppe soil. The
  transition is gradual -- dark stone fingers reaching into the
  grassland like the roots of some buried structure. To the south,
  the terrain descends into the ravine system of Wolf Run. The
  air feels fresher here, the wind returning after the sheltered
  coulee passages.
