zone: Ironwind Steppe
title: Dry Wash
description: >-
  The terrain here is cut through by a shallow wash -- a dry channel
  carved by seasonal runoff, its bed smooth-worn stone and bleached
  gravel, its banks two to three feet of exposed earth and root. The
  wash runs roughly north-to-south and the trail crosses it at the
  lowest point, where the banks have worn down to a shallow ford.
  Crossing is easy in the dry season; the waterline stains on the
  banks tell a different story when rain comes. Deadwood has caught
  in the bed upstream -- branches and root masses stripped from the
  banks in some past flood -- and now bleaches grey in the sun.
  The south bank leads back toward the hardpan flat; the west bank
  continues toward denser badland country.
