nouns:
  wash: The dry channel itself -- smooth-polished stone bed, undercut
    banks, and the ghost of a current marked in waterline stains and
    deposited gravel fans. It holds water only briefly after hard rain
    but what water comes moves fast and with enough force to shift the
    deadwood and cut the banks a little deeper with each passing year.
  deadwood: A tangle of bleached branches and root masses lodged against
    the upstream bank, deposited by some past flood and dried to grey
    bone in the sun. The wood is light and brittle, the bark long gone,
    the grain raised and split by sun and cold.
idlemessages:
- Your boot finds a loose stone in the wash bed and sends it skittering.
- The bleached deadwood pops faintly in the afternoon heat.
- The wash bed is cool underfoot compared to the open ground above.
