nouns:
  tunnels: Small tunnels gnawed into the cave walls by deep
    gnawers, each about the width of two fists. The edges are
    smooth, worn by the passage of many small bodies. Some
    tunnels show fresh gnaw marks where the creatures are
    expanding their network.
  marks: Deep scratches and gouge marks in the stone, made by
    gnawer teeth over many generations. The gnawers seem able
    to chew through even hard stone given enough time.
