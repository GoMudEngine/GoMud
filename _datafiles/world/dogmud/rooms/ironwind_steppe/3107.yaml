roomid: 3107
zone: Ironwind Steppe
title: Gnawer Warren
description: The cave walls here are riddled with small tunnels and
  chambers gnawed into the softer stone by generations of deep
  gnawers. The tunnels are too small for a person but large enough
  for the rat-sized creatures that made them. Gnaw marks score
  every surface -- the stone chipped and scraped by persistent
  teeth. The air smells of animal musk and stone dust. Scratching
  sounds come from the walls in every direction, an unsettling
  reminder that you are surrounded by unseen inhabitants.
biome: cave
