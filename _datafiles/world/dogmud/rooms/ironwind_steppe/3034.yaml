roomid: 3034
zone: Ironwind Steppe
title: Raptor Nesting Ledge
description: A series of narrow ledges on the ridge's east face where
  raptors have built their nests. Large nests of woven sticks and
  grass perch on precarious shelves of stone, cemented with mud
  and droppings. The adult birds are territorial and aggressive,
  circling overhead with sharp cries whenever anything approaches.
  Bones, feathers, and prey remains litter the ground below the
  nests. The stench is considerable.
biome: cliffs
