nouns:
  nests: Large nests of woven sticks, each as wide as a person's
    arm-span, perched on narrow stone ledges. The construction
    is rough but sturdy, built up over multiple seasons. White
    droppings streak the stone below each nest.
  bones: Scattered remains of prey animals beneath the nesting
    ledge -- rabbit skulls, rodent bones, snake vertebrae, and
    the occasional larger bone from something more ambitious.
