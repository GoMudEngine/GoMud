roomid: 5395
zone: The Empty Reach
title: The Abandoned Camp
description: >
  The smell finds you first — old ash and something beneath it,
  damp canvas and rot, the particular vacancy of a place that was
  once inhabited and no longer is. A ring of fire-blackened stones
  sits in a cleared patch of ground a few steps off the road, the
  ash in the center long since gone cold and gray.

  A <ansi fg="itemname">campsite</ansi> in its aftermath — the
  fire-ring, a scatter of stones arranged with quiet intention,
  a rusted tin left weighted with a flat rock. Some distance away,
  the remains of a <ansi fg="itemname">lean-to</ansi> have
  collapsed inward, the frame rotten at the lashing-points, a
  strip of mildewed canvas draped over the wreckage like a shroud.
  Someone stayed here long enough to build shelter. They did not
  stay long enough for the shelter to outlast them.
