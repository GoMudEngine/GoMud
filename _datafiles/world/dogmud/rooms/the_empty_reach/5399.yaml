roomid: 5399
zone: The Empty Reach
title: Scrub's Return
description: >
  The smell arrives before the eye makes sense of it — green
  and resinous and alive, sage-oil and something sweeter
  beneath it, the scent of plants with actual water at their
  roots. After the empty pan, it hits like a correction.

  The brush has thickened. Shoulder-high <ansi
  fg="itemname">sage</ansi> crowds the verge from both sides;
  off the east edge, where the slope drops into a shallow
  <ansi fg="itemname">draw</ansi>, a cluster of
  <ansi fg="itemname">stunted junipers</ansi> marks where
  runoff collects and lingers long enough to matter. The land
  is not lush by any honest measure. But it has stopped being
  punishing — the scrub is alive, the soil darker between the
  plants, the sky a fraction smaller than it was a mile back.
  The track runs on through the thickening brush.
