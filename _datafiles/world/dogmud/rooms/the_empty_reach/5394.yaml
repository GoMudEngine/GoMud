zone: The Empty Reach
title: The Long Flat
description: >
  The land opens here into something that takes a moment to fully
  see — a vast flat of grey-green scrub spreading to every horizon,
  bunchgrass and sage rolling out under a sky that is enormous and
  pale and everywhere. The track becomes a thin pale scar running
  north into a shimmer of risen heat, and then it is simply gone.
  The scale of it presses against you. There is very far yet to go.

  A lone <ansi fg="itemname">fencepost</ansi> stands at the road's
  edge — old, silvered by weather, tilting eastward. A strand of
  rusted wire loops from it into the scrub and vanishes. The
  <ansi fg="itemname">track</ansi> ahead dissolves into the heat-
  shimmer without ceremony, as though distance is simply what this
  land is made of. Somewhere northward the flat must end. You
  cannot see where.
