roomid: 5393
zone: The Empty Reach
title: Coyote Ground
description: >
  Something moves at the edge of hearing — a dry crackle in the
  chamisa, then a stillness that comes down too fast, the way
  stillness comes when it is chosen. The track narrows here
  through a press of sage and stiff bunchgrass, and the sense
  that you are being watched arrives the moment you do.

  Pale <ansi fg="itemname">bones</ansi> are scattered through the
  grass at the road's edge — sun-bleached, gnawed, and dropped
  without ceremony. A worn <ansi fg="itemname">trail</ansi> cuts
  across the track at a shallow angle, pressed into red clay by
  years of paws and hooves, heading from brush to brush with quiet
  authority. You have walked into someone else's country. The
  yellow-gray scrub to the east holds its breath. Something in it
  holds the same.

  Examine the <ansi fg="itemname">brush</ansi> if you want, though
  it will tell you nothing useful.
