nouns:
  bones: The bones are old and dry, bleached pale gray by years of
    sun. A long femur shows deep gnaw-marks at both ends. Smaller
    bones are scattered farther out, as though the meal was
    interrupted and pieces dragged off in several directions.
    Sifting through them you find a clump of dark coarse fur
    snagged on a sharp edge — not ancient at all. Something feeds
    here, and not long past.
  trail: A narrow path worn into red clay by years of animal use,
    cutting across the road on a shallow diagonal. The prints in
    the soft shoulder are layered — cloven deer, round coyote,
    something larger with blunt claws. The freshest set is on top.
    This crossing gets used every night.
  brush: The chamisa and sage press close and look perfectly still,
    but the stillness has a quality — alert rather than empty. The
    shadows between the stems are deep enough to hold a crouching
    shape. Nothing is visible. That is not especially reassuring.
idlemessages:
- Something shifts in the brush to the east. Then nothing.
- A fly makes slow circles above the nearest scatter of bones.
- The sage stands absolutely still. Nothing stirs it.
- Far out in the scrub, something exhales — dry and unhurried.
- Fresh tracks cross the road. They were not there before.
