zone: The Empty Reach
title: Basalt Badlands
description: >
  The track runs into old lava country — shattered basalt heaved
  up in black ridges, edges sharp enough to part boot leather or
  the skin beneath it. The rock soaks heat through the morning
  and gives it back in slow waves off the stone faces, baking the
  air above the flow field into something that wavers and stings.

  Nothing grows here. The land has been stripped to its bones, and
  those bones are volcanic and indifferent to passage. Every step
  off the track risks a turned ankle in the broken slabs. The
  silence is the silence of a place that burned out its sound a
  long time ago and never needed it back.

  Two <ansi fg="itemname">columns</ansi> of fractured basalt flank
  the track ahead, dark as cooled iron. At your feet, a long
  <ansi fg="itemname">fissure</ansi> cleaves the flow field — cool
  air rising from the dark below. The <ansi fg="itemname">track</ansi>
  picks its way through the worst of the broken slabs by long habit.
