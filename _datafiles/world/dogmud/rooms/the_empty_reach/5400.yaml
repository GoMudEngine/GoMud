roomid: 5400
zone: The Empty Reach
title: Distant Smoke
description: >
  The track lifts over a low fold in the ground — barely a
  rise, barely worth naming — and at the crest the view to the
  north opens. There, far out at the edge of the visible world,
  a thread of grey <ansi fg="itemname">smoke</ansi> rises
  against the pale sky in a line so thin it might be a scratch
  on glass. It climbs, bends once where a high wind catches it,
  and disperses. A second thread follows.

  A hearth. A chimney. People who lit a fire this morning and
  will light another tonight. After the empty country the sight
  lands like a promise — a half-day on still, further than it
  looks, but real. The coaching town has not yet shown itself,
  but it is burning wood. The <ansi fg="itemname">track</ansi>
  here shows more use than it did a mile back — the ruts
  fresher, the verge more worn. At the fold's crest an old
  <ansi fg="itemname">milestone</ansi> stands tilted at the
  road's west side, its face worn but readable.
