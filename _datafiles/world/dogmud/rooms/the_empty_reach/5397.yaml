roomid: 5397
zone: The Empty Reach
title: The Lookout Rise
description: >
  The track climbs onto the one high point for miles — a low
  basalt shoulder that lifts you above the scrub and the broken
  ground below. What opens from the top is not comforting.

  The Empty Reach rolls out to every horizon, brown and grey and
  pale under a sky that accounts for more of the world than the
  land does. The <ansi fg="itemname">road</ansi> north is a pale
  thread across the scrub that the distance swallows before it
  reaches anything. You cannot see New Plymouth. You cannot see
  anything ahead but more of the same vast patience, laid out flat
  and unhurried between you and wherever it ends.

  At the summit, a rough <ansi fg="itemname">cairn</ansi> of
  stacked stones marks what travellers have agreed to call the
  high point. The <ansi fg="itemname">view</ansi> south shows how
  far you have come. Neither distance is encouraging.
