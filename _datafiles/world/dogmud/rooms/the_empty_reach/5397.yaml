nouns:
  cairn: A heap of stones stacked by travellers over many years —
    each one added by someone who climbed this rise and felt the
    need to mark the moment. A few are scratched with initials or
    dates, the oldest mostly weathered past reading. Wedged into
    the base, wrapped tight in oilcloth, is a small tin box.
    Inside are folded notes, a stub of candle, one worn coin, and
    something small wrapped in cloth that clinks when the box
    shifts. Travellers keeping company with other travellers they
    will never meet.
  road: From up here the road is a pale thread laid across the
    scrubland with deliberate straightness — curving only where
    the terrain forced it. It runs north until the horizon and
    the haze conspire to end it. You cannot see what it leads to.
    You cannot see anything ahead but the scale of what remains
    between you and the capital.
  view: From the high point you can see the full breadth of the
    Empty Reach in every direction — scrubland and badland rolling
    out to the curved edge of the world. No smoke, no movement,
    no sign of anything built except the road. The sky accounts
    for more of the world than the land does. Standing here you
    understand why some travellers do not make this crossing twice.
idlemessages:
- The wind has nothing to break against up here. It passes straight through you.
- A hawk rides thermals high to the west, banking without apparent effort.
- The road north fades into haze long before it reaches anything.
- The cairn stones are warm from the sun and cool in their own shadow.
- The silence up here is wider than below — more sky in it.
