zone: The Empty Reach
title: Where the Road Gives Out
description: >
  The eye reaches north and finds nothing worth calling a
  landmark — gravel gives out within a few strides, replaced
  by pale earth pressed flat by passage, and the road stops
  being a road and becomes only the fact of having been
  walked. Sage and bunchgrass and bare basalt spread out on
  both sides; the sky is enormous overhead; no building, no
  smoke, no fence line in any direction. The rain-shadow
  country spreads itself fully here — dry, still, and
  indifferent, the silence the complete kind that has no
  held breath in it. This is where civilization ends its
  pretense. The last maintained surface is behind you;
  north is only open. At the edge of the old verge a low
  <ansi fg="itemname">boundary cairn</ansi> of stacked
  basalt slabs marks the threshold, built by travelers
  who needed to leave something at the edge of the empty.
  The <ansi fg="itemname">bare track</ansi> runs on
  northward into the Empty Reach, the last waymark behind
  you, the next nowhere visible.
