nouns:
  boundary cairn: A stack of flat basalt slabs at the verge's
    edge — not an official marker, but the accumulated work
    of travelers who paused here long enough to add a stone.
    The cairn stands knee-high, each layer set with careful
    hands that are long gone. At its base the earth has
    been hollowed by repeated kneeling into a shallow bowl;
    in that hollow someone has left small things — a corroded
    copper coin, a twist of dried sage, a scrap of cloth
    knotted once. The cloth is faded to no particular color.
    The sage has crumbled to dust. The coin bears a profile
    worn smooth past recognition. The stones balance; the
    offerings remain; no name has been carved anywhere.
  bare track: Where the gravel ends the earth takes over —
    pale and hardpacked, carrying the pressure of enough
    passage to make itself a road without anyone's help.
    The track runs due north, wide enough for a single cart,
    its surface cracked in the dry season into small plates
    that shift faintly underfoot. No drainage. No grading.
    No marker naming the distance to the next thing. Just
    the land shaped by use, running on into a country that
    offers nothing except more of itself — and, somewhere
    past the visible horizon, the distant capital waiting
    without urgency.
idlemessages:
- A hawk circles once above the track's first bend, drops
  a wing to look, and drifts south without descending.
- The wind moves through the sage — dry, faintly mineral,
  the smell of stone and open distance.
- Nothing moves in any direction. The silence holds without
  effort.
- The scrub on both sides stands still. No shadow crosses
  the pale ground between here and the horizon.
- A lizard appears on the cairn's top stone, considers the
  open country, and slips back into the basalt rubble.
