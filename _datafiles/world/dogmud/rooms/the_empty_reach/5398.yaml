nouns:
  wagon: The frame of a freight wagon, the wood bleached white
    and splitting along the grain. One wheel sank through the
    crust and pulled the bed down at an angle — the axle sheared
    at the hub, and whoever was driving never came back to fix
    it. Among the ruin are rusted barrel hoops, a tarpaulin gone
    stiff with salt, and under the tilted bed, sheltered from the
    worst of the sun, a leather satchel that has outlasted
    everything else here. It is not empty.
  crust: The alkali surface is thinner here, the plates lifting
    at their edges like peeling skin. Step too hard and your boot
    breaks through to soft grey mud beneath — cold, mineral-
    smelling, unsettling underfoot. The crust's edge is sharp
    enough to cut. Put your tongue to it if you want — intensely,
    immediately, unpleasantly salt. You will not want to do it
    twice.
  mirage: False water glimmers at the pan's edges in every
    direction, perhaps two hundred paces away — flat and clear
    and entirely convincing until you watch it move. It retreats
    at exactly the pace you advance. It has no depth and no
    source. It is bent light and a hot pale surface lying to your
    eyes, the same trick it has played on every traveller who
    crossed this pan and looked toward the edges hoping for water.
idlemessages:
- The alkali crust crunches and settles under your weight as you stand still.
- False water glimmers at the pan's edge, always the same distance away.
- Heat rises from the white crust below and falls from the sky above — both at once.
- A gust crosses the flats, carrying salt crystals that sting where they land.
- Nothing here casts a shadow worth having.
