roomid: 5398
zone: The Empty Reach
title: The Alkali Pan
description: >
  The road drops into a wide flat basin — an ancient lakebed, dry
  for longer than anyone's reckoning. The alkali pan stretches
  white and blinding in every direction, its dead bottom cracked
  into irregular plates that crunch underfoot like thin ice over
  hollow ground. The surface is pale as new bone. Boots break
  through in places, punching into soft grey mud that smells of
  minerals and very old standing water.

  At the pan's far edges, a <ansi fg="itemname">mirage</ansi> of
  false water glimmers on the horizon in every direction — flat
  and perfectly convincing, retreating at exactly the pace you
  approach. Heat reflects off the white crust in a second wave
  from below. The air is hot from both directions at once.
  Nothing lives here. Nothing has for a long time.

  Near the northern edge, a <ansi fg="itemname">wagon</ansi> lists
  half-sunk in the pan — an axle snapped, a frame bleached and
  splitting. The <ansi fg="itemname">crust</ansi> underfoot shows
  where the pan is thinnest, the salt plates lifting at their
  edges like something trying to peel away.
