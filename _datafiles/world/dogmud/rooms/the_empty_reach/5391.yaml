roomid: 5391
zone: The Empty Reach
title: The Wayside Shrine
description: >
  A waystone stands at the track's edge, half the height of
  a person and older than the road that passes it — rough-
  dressed granite worn smooth where uncounted hands have
  touched it before committing to the empty country ahead.
  The shrine leans slightly east, as if years of prevailing
  wind have nudged it, and its carved face is too worn to
  read with certainty. Scrub crowds close on three sides,
  the sage gray-green and knee-high, and beyond it the land
  opens into the same spare silence that has attended every
  step since the road gave out. There is no sound of water.
  No voice from any direction. Only the wind moving through
  the bunchgrass with the sound of something passing
  without stopping. The <ansi fg="itemname">shrine</ansi>
  carries the weight of every traveler who touched it and
  moved on — its stone face dark with handling, the deep
  niche at its base holding the small offerings of cautious
  hands. The <ansi fg="itemname">open scrub</ansi> to
  either side is the whole of the landscape — dry, vast,
  and complete in its indifference.
