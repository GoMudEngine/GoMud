roomid: 5392
zone: The Empty Reach
title: The Dry Wash
description: >
  The track drops into a gully and the world closes in —
  steep earth banks on both sides, near enough to feel
  confining after the open country above. Loose stones
  shift underfoot with the particular sound of ground that
  does not hold, and the wind, funneled hard between the
  cut banks, arrives here with a direction and a voice it
  lacked on the flats. This is a dry streambed, scoured by
  flash floods that come perhaps once a year and in those
  hours can kill the unwary. Now it is bone-dry — cracked
  pale mud, water-smoothed stones sorted by the violence
  that shaped them, the air carrying mineral earth and the
  cold memory of water. High on the east bank, well above
  the flood line, a mass of <ansi fg="itemname">flood
  debris</ansi> is wedged in the exposed roots — grey
  driftwood and smaller things the water brought and left.
  Below, the <ansi fg="itemname">dry streambed</ansi>
  floor shows its history plainly in cracked mud and
  water-cut walls and the patient accumulation of seasons.
