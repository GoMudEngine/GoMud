nouns:
  flood debris: A tangle of driftwood lodged high on the
    east bank — grey and sun-bleached, stripped of bark by
    the water that brought it, wedged against exposed roots
    far above the current channel. The tangle marks the
    high-water line of the last flood with the accuracy of
    a survey. Smaller objects are caught within it — a
    length of rope with its fibers stiffened by sun and
    dry air; a flat-sided wooden box, split along one edge
    but largely intact, wedged between two larger branches;
    a scatter of cloth scraps pressed flat and bleached to
    a uniform pale color. The box's split seam still holds.
    Whatever the flood took from somewhere upstream, some
    of it rode this far and stopped here, unclaimed.
  dry streambed: The channel floor is a record of the water
    that shaped it — cracked mud plates each the width of
    a hand, lifting at their edges in the heat; water-
    smoothed stones sorted by size and laid in the clean
    patterns that only moving water makes. The walls are
    cut steep and close, showing the layers of the land in
    thin pale strata. A groove worn into the east wall at
    knee height marks where the flood runs deepest each
    season. Between floods the channel holds nothing but
    dust and heat and wind and the slow expansion of its
    own cracks.
idlemessages:
- The wind runs down the gully between the cut banks and
  arrives with more force than it had on the flats above.
- A stone shifts somewhere underfoot and the sound of it
  carries hard in the narrow cut, then is gone.
- The debris on the east bank holds its position. The
  rope in it does not move. Nothing moves.
- A small lizard crosses the cracked mud in quick dashes,
  pausing between each one, and vanishes under a stone.
- The gully is quiet except for the wind. The wind is the
  only thing here with somewhere to be.
