roomid: 5401
zone: The Empty Reach
title: The Reach's End
description: >
  The first <ansi fg="itemname">fence</ansi> appears without
  ceremony — three weathered posts and a run of rusted wire
  at the track's right hand, the kind of boundary set when
  worked land meets land not yet worked. Nothing more than
  that quiet declaration, but it changes how the road feels
  beneath the boots. The empty country is behind you. This
  land belongs to someone.

  The track has widened and smoothed, the ruts deeper and
  more regular — daily use, both directions, more than one
  kind of wheel. A <ansi fg="itemname">marker stone</ansi>
  stands at the west verge where the fence line begins,
  carrying the district seal and the name of the road
  authority. Beyond the wire, the ground of the first
  <ansi fg="itemname">worked field</ansi> has been turned at
  some point and left to recover — darker soil, different
  weeds, the pattern of cultivation still visible in its
  fallow state. The road runs north through a gap in the
  fence line, toward Hartcharn, still out of sight beyond
  the next low ground. The wilds are over.
