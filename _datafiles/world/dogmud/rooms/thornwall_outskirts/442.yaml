roomid: 442
zone: Thornwall Outskirts
title: Old Dorn's Farm
description: A small but stubbornly well-kept farmstead sits at the end of the track,
  its fieldstone walls recently whitewashed and its thatch roof in good repair. A
  vegetable garden fills the yard between the house and a weathered barn, and a
  thin column of smoke rises from the chimney. The farm has the feel of a place that
  is tended by habit as much as hope -- everything in its place, nothing wasted. A
  low fence separates the yard from the overgrown plot next door, where waist-high
  weeds have swallowed what was once a cultivated field.
biome: farmland
