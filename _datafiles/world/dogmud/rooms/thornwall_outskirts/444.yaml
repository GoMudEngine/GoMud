nouns:
  mounds: Low mounds of freshly turned soil, each about the size of a fist. The
    burrows beneath connect in a network that riddles the field. Whatever is digging
    them is small, numerous, and very busy.
  stakes: Sharpened wooden stakes driven into the ground around the worst-damaged
    areas, their tips smeared with a dark paste that smells acrid and chemical. The
    pests seem to be ignoring them entirely.
  pots: Clay pots filled with smoldering herbs, placed at intervals along the
    furrows. The smoke is thin and acrid. A local remedy, apparently, and not a
    very effective one.
