roomid: 440
zone: Thornwall Outskirts
title: Outskirts, West Road
description: The road from Watchers Crossing climbs a gentle rise and the landscape
  changes. Scrubland gives way to tilled earth, the wild grass replaced by the
  stubble of harvested fields and the geometric lines of irrigation ditches. Stone
  walls run alongside the road, marking property boundaries with the finality of law.
  The air smells of turned soil and manure -- honest, agricultural smells that speak
  of a settled land. Ahead, the road forks between the farms to the north and the
  main city road to the east.
biome: farmland
