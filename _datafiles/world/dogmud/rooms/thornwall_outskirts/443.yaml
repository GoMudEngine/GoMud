roomid: 443
zone: Thornwall Outskirts
title: The Fallow Field
description: What was once a productive farm plot is now a tangled wilderness of
  waist-high weeds, dead crop stalks, and encroaching scrub. The stone walls that
  mark its boundaries are still intact, but everything within them has been abandoned.
  A collapsed tool shed sits in one corner, its timbers grey with weather. Near the
  road-side wall, a wooden post has been driven into the ground, and a notice has
  been nailed to it -- official-looking parchment bearing a wax seal. The field has
  the melancholy feel of something that was cared for once and then simply stopped.
biome: farmland
