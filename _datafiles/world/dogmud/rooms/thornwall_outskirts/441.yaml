nouns:
  farms: The working farms have the look of hard-won survival -- patched roofs,
    mended fences, gardens planted right up to the walls. The abandoned ones are
    already being reclaimed by weeds and weather. Doors stand ajar, windows are dark.
  gates: Simple wooden gates on iron hinges. The working farms keep theirs closed and
    latched. The empty ones hang open, their wood starting to warp.
