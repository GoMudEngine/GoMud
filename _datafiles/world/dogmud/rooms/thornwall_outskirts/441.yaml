roomid: 441
zone: Thornwall Outskirts
title: Farmstead Road
description: A dirt track winds north between low stone walls, connecting the
  scattered farmsteads that dot the outskirts. The farms here are modest -- small
  houses of fieldstone and thatch, with kitchen gardens and tool sheds clustered
  close. Some are well-kept, with smoke rising from chimneys and livestock in pens.
  Others sit dark and quiet, their fields untended and their gates hanging open.
  The contrast tells a story of a community under pressure, some holding on and
  others giving up.
biome: farmland
