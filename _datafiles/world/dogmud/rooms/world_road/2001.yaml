idlemessages:
- The road south disappears into the haze of the desert below.
- Dry badlands climb away to the north, trackless and pale.
- A dry wind comes down from the heights, carrying dust and the smell of sage.
- Cold, damp air seeps from the crack in the basalt, out of place in the dry heat.
