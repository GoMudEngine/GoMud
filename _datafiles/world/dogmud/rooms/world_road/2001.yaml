roomid: 2001
zone: World Road
title: The Northern Road
description: A weathered track of packed basalt dust runs south and east, descending
  into the wider world of Gaius -- untamed, unmapped, and waiting. To the north, dry
  badlands climb toward distant heights, trackless and pale. A narrow crack splits
  the basalt at the road's edge, breathing cold, damp air up from somewhere below.
biome: desert
