idlemessages:
- Fishing nets are spread across the flat ground here,
  drying in the afternoon air.
- A merchant has laid goods out in the sun, walking
  slowly along the rows checking each item.
- The city noise drops off noticeably here — the east
  quarter thins out quickly past the inn.
