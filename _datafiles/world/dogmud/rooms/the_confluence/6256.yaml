zone: The Confluence
title: The Drying Flats
description: >
  The land east of the travelers' inn where the river-
  country begins to lose its city manners — the paving
  gives way to compacted earth, the buildings thin out,
  and the scrub at the margins has a drier quality than
  the river-damp of the inner city. It is used for
  airing and spreading, the domestic and merchant
  labor that requires flat open ground without roof:
  drying nets, laying goods out in the sun, stretching
  hides. The city's edge draws close to the south;
  the inn is back to the west.
