roomid: 6160
zone: The Confluence
title: The Pilgrim Hall
description: >
  A wide low-ceilinged hall maintained by the temple
  for pilgrims who have traveled far to reach the
  Confluence. Long benches line the walls; a trestle
  table near the door holds a water-jug and cups for
  new arrivals. The floor is worn where the benches
  are, unworn where foot-traffic avoids the drafts
  from the door. A broad stair at the hall's north
  end climbs to the dormitory above. Keepers come
  through twice daily to see to those resting here
  and to answer questions about what comes next.
  The forecourt is back to the north.
