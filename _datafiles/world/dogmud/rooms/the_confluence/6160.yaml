idlemessages:
- A pilgrim on the bench nearest the door removes
  their sandals and examines a blister with resignation.
- The water-jug is refilled by a keeper moving through
  the hall on what is clearly a practiced routine.
- A low conversation runs along the far bench between
  people who appear to have met on the road here.
