nouns:
  the base: >
    The tower's lower courses are cut from a stone
    darker and closer-grained than the civic limestone
    above — the original foundation, incorporated when
    the tower was raised rather than cleared and
    replaced. The surface is smooth from years of rain
    and the occasional hand trailing along it. At the
    corner where the base-stone meets the Hall Steps
    paving, the face of the block is still legible even
    in weathered condition. Something has been cut into
    it, sheltered partly by the paving-overhang above.
  the symbol: >
    Carved into the corner face of the tower's old
    base-stone: concentric rings, the outer two clear,
    the inner circles more numerous and arranged at
    regular intervals around a central point. The
    stonecutter's lines remain sharp where the
    overhang has sheltered them from direct rain-wear.
    The shape is not a guild mark or a mason's counter-
    sign in any current form. The same shape — refined,
    symmetrical, made decorative — appears as carved
    ornament on the lintels and friezes of the newer
    buildings around the square: the cocoon-ring motif,
    a common touch in the more recently built parts of
    the Confluence. The old mark in the tower's base-
    stone and the ornament on the new frontages are
    plainly the same shape. No one appears to have
    remarked on this in writing.
idlemessages:
- The bell in the tower's upper frame rings the hour
  with a counted stroke — the sound close and full
  from directly below.
- The base-stone's dark courses are noticeably
  different from the paler civic limestone above them,
  especially in a raking light.
- A sparrow has a nest in the bell-frame's timbers
  above; it argues about the hour from up there.
