roomid: 6151
zone: The Confluence
title: The Bell-Tower
description: >
  The civic bell-tower stands older than the hall it
  serves, its lower courses built from a stone darker
  and closer-grained than the civic limestone above —
  as though a pre-existing foundation was found here
  and the tower raised up from it rather than clearing
  and starting fresh. The upper stage is later work,
  the bell in its open frame audible across the square.
  The
  <ansi fg="itemname">base</ansi>
  of the tower is worth examining — the original stone,
  whatever it was before the Confluence decided it
  needed a bell-tower here. The same ring-motif that
  appears on the newer civic building-fronts as carved
  ornament is present here too, in the original stone,
  worn and not ornamental at all.
