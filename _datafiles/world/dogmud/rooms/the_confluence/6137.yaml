roomid: 6137
zone: The Confluence
title: The Quay's South Gate
description: >
  The south edge of the Long Quay district, where the waterfront
  commerce gives way to the civic heart of the Confluence. Two stone
  posts mark the boundary, older than the buildings on either side,
  their surfaces carved with faded guild marks and merchant counter-
  signs accumulated over many years. The river sound is softer from
  here — the wharves are a fair walk back — and the air is a little
  less loud with spice and tar. The quay road runs on south from
  these posts toward Tri-Cross Square and the center of the city,
  a walk for another day.
biome: water
coord: {x: -5, y: -64, z: 0}
exits:
  north: {roomid: 6136}
nouns:
  the way south: >
    The road past the gateway posts runs south toward Tri-Cross
    Square, the Confluence's main civic meeting point — the municipal
    hall on its western face, the great inn on its east, the square
    itself wide enough to hold a market of its own on feast days.
    The three-district waterfront lies behind; what lies ahead is
    the deep city, the full weight of civic life at the rivers'
    crossing. The way is open and straight and not far, a walk
    for another day.
idlemessages:
- The old guild marks on the boundary posts are rubbed smooth at hand-height.
- The market sound is distant here; the quay road runs quiet to the south.
- "The river is a sound only from here, not a smell: the city has taken over."
