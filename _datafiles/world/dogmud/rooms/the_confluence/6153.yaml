nouns:
  the way south: >
    The road continues past the gate-piers into the
    Processional district — the broad ceremonial
    avenue of the Confluence, its paving wider than
    anything in the civic square behind you, the
    buildings on either side set deliberately back
    to give the approach its scale. The great temple
    is at the far end of this avenue, another
    district's worth of city away. The gate stands
    open and the road is clear, running straight
    into the Processional district.
idlemessages:
- Travelers pass through the gate-piers heading south,
  road-worn and purposeful.
- The gate-piers carry decades of chalked names and
  merchant counter-marks, worn almost to texture.
- The civic bell is audible from here, now behind
  you to the north, marking the hours.
