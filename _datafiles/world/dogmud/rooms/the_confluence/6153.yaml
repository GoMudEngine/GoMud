roomid: 6153
zone: The Confluence
title: Processional Gate
description: >
  The road reaches its last civic marker here at the
  gate-piers of the Processional approach — two columns
  of dressed stone, each carrying the Confluence's
  crest and the date of the piers' construction,
  flanking the road that runs on south. Beyond them
  the paving broadens and the buildings draw back, the
  avenue given room to breathe and to be seen from a
  distance. The civic square and the hall lie behind;
  what lies ahead is the full ceremonial weight of the
  Processional district, its great temple at the far
  end of the avenue. The gate stands open, as it has
  always stood.
  <ansi fg="itemname">The way south</ansi>
  runs on into the Processional district, the avenue
  open and well-maintained toward the great temple.
