idlemessages:
- A pair of pilgrims stand just inside the door, taking
  in the quiet before moving deeper into the nave.
- 'The oil-lamps in the wall-niches burn without flicker:
  the narthex is perfectly still.'
- A keeper stands near the inner arch, ready to answer
  questions from those entering for the first time.
