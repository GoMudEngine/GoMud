roomid: 6244
zone: The Confluence
title: The Functionary's Door
description: >
  A house at the edge of the tenement court,
  differentiated from its neighbors by a degree of
  maintained order that is slightly pointed in its
  precision. The
  <ansi fg="itemname">doorstep</ansi>
  is chalked white and swept, the window-boxes contain
  nothing that would get out of hand, and the knocker
  has been polished within the past week. A
  <ansi fg="itemname">placard</ansi>
  beside the door lists the occupant's former titles in
  a script too small to read comfortably from the
  street, which is almost certainly not an accident.
  The court is to the west.
biome: city
