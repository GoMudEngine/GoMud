    respawnrate: "20 real minutes"
nouns:
  the doorstep: >
    A chalk-whitened step, swept clean and squared at
    the edges with a care that implies regular
    maintenance. The chalk is fresh — either this
    morning's or last evening's. The step has been
    swept before the neighboring door was opened.
  the placard: >
    A small brass placard beside the door, its text in
    a flowing civic script too fine to read from the
    street without moving closer. It lists several
    former appointments in the municipal service — the
    offices are real and the length of service is
    accurate and the placard was commissioned by the
    occupant personally.
idlemessages:
- The doorstep has been swept so recently that the chalk
  marks are still sharp at the edges.
- A window above opens a precise two inches and is then
  adjusted to exactly that.
- The knocker has been polished so thoroughly that it
  reflects the light from the lane.
