idlemessages:
- The keeper at the portico answers a question about
  the symbol above the doors with practiced composure.
- The overhang holds the smell of old incense and
  candle-wax, the residue of many previous arrivals.
- 'The great doors do not open: they have been shut
  in this way since before anyone on staff can say.'
