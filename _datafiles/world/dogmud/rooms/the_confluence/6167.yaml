nouns:
  weathered-symbol: >
    The four-ring orbital mark cut into the keystone
    above the great doors — one ring enclosing the
    next, the outermost nearly flush with the stone's
    surface from long weathering. The portico columns
    beside it show far less wear. Whatever it was cut
    into, the Keepers have built around it. Their
    account is that it is the earliest rendering of
    the Chrysalis truth — the sealed soul, the ringed
    cocoon — set here by the first Founders. The stone
    it is cut into does not volunteer the same date.
  great-doors: >
    The great doors of the Confluence temple stand open
    through the day, folded back against the portico's
    inner wall so the cool of the nave reaches the top
    of the stair. Their timber is old, bound with iron
    fittings darkened near to black by years under the
    overhang. By day they are an invitation, the way in
    to the public temple; the Keepers bar them from
    within only after the last rite, when the temple is
    given back to the water and the dark.
spawninfo:
