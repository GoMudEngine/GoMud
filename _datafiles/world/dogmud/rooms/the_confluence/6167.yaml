nouns:
  weathered-symbol: >
    The four-ring orbital mark cut into the keystone
    above the great doors — one ring enclosing the
    next, the outermost nearly flush with the stone's
    surface from long weathering. The portico columns
    beside it show far less wear. Whatever it was cut
    into, the Keepers have built around it. Their
    account is that it is the earliest rendering of
    the Chrysalis truth — the sealed soul, the ringed
    cocoon — set here by the first Founders. The stone
    it is cut into does not volunteer the same date.
  great-doors: >
    The great doors of the Confluence temple are shut
    and barred from within. Their timber is old and
    bound with iron fittings, the wood darkened to
    near-black by years under the overhang. A brass
    panel to one side reads, in the Keepers' formal
    hand, that the public temple is not accessible
    from this approach — pilgrims are directed to the
    processional entrance on the island's far side.
    The doors give nothing else away.
