roomid: 6167
zone: The Confluence
title: The Temple Portico
description: >
  A grand entrance portico at the top of the temple
  stair — wide columns of pale river-stone, a deep
  shaded overhang, and between them the
  <ansi fg="itemname">great doors</ansi>
  of the temple, shut against the day. Cut into the
  keystone above the doors, plainly visible from the
  top of the stair, the
  <ansi fg="itemname">weathered symbol</ansi>
  is older than the portico around it — a four-ring
  mark, one ring enclosing the next, worn to near-
  smoothness at its edges while the stone on either
  side shows far less weathering. Beside the doors
  a keeper attends to pilgrims who arrive and wish
  to know more of the temple's history and practice.
  The stair descends to the north.
