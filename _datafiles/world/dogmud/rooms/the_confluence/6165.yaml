idlemessages:
- The island's retaining wall is visible here at near
  distance — well maintained, well fitted.
- A returning pilgrim passes coming the other way,
  making for the forecourt and the city beyond.
- The sound of the joining rivers is loudest here,
  directly at the island's upstream edge.
