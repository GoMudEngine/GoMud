nouns:
  consecration-record: >
    The temple's founding consecration record, bound in
    river-leather and kept flat on the stand under a
    glass plate. Its account is formal and careful -- the
    names of the first Keepers, the date of the first
    rite, the words spoken at the altar. What it does not
    explain is the phrasing of the central passage, which
    reads "consecrated the site" rather than "established
    the site" -- as though the ground had received a name
    it already answered to, and the rite was a recognition
    rather than a beginning.
