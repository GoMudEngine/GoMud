zone: The Confluence
title: The Chapter House
description: >
  A formal chamber where the senior Keepers convene, its
  walls hung with the seals of past Prioresses and the
  rolled names of the appointed. A long table of dark
  wood runs the room's length, its chairs stiff-backed
  and deliberate. On a slanted reading-stand at the head
  of the table, the temple's
  <ansi fg="itemname">consecration-record</ansi>
  lies open -- the formal account of the founding, the
  first Keepers' names, and the words of the consecration
  rite. Aldric presides here. The North Walk is back
  to the east.
biome: city
