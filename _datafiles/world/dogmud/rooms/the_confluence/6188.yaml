    respawnrate: "20 real minutes"
idlemessages:
- The seals on the walls are old enough that some names
  below them have worn to near-illegibility.
- 'Aldric sits at the head of the table with a folder of
  papers: a meeting adjourned, or one being prepared.'
- The chairs are pushed in to equal gaps -- a habit that
  speaks to the meetings held here.
