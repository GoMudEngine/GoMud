idlemessages:
- The pool surface breaks once where a leaf drifts
  in from the hedge, then stills again completely.
- The enclosure walls filter the sound of the city
  to a very low register from here.
- The stone rim of the pool is worn smooth on the
  near side, where hands have rested over many years.
