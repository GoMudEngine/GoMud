roomid: 6214
zone: The Confluence
title: The Sealed Door
description: >
  A doorway of unusual construction: the frame is cut
  from the same dense pre-Founding stone as everything
  around it, but the closure that once filled it -- a
  <ansi fg="itemname">sealed-door</ansi> of fitted
  slabs -- now stands propped open along the west
  wall, its locking bar set aside by whoever first
  reached this place and chose not to reseal it. The
  door is old enough that the Keepers' own records do
  not say who opened it or when. A vault opens to
  the south; the antechamber is back east; the
  chamber waits to the west.
