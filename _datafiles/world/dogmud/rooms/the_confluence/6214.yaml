nouns:
  sealed door: >
    Fitted stone slabs set in a frame and secured by
    a locking bar of the same material -- a single
    piece of pre-Founding construction built to close
    this space and keep it closed. It was opened, and
    the bar was set to the side, and whoever did it
    left no record the Keepers chose to preserve. The
    lock mechanism is intact; the door could be closed
    again. It has not been.
idlemessages:
- 'The door was made to seal completely: the fit of
  the slabs is precise enough to exclude air.'
- The bar mechanism is pre-Founding work; there is
  nothing like it anywhere in the temple above.
- 'Standing in the doorway, the chamber beyond is
  cold and dark and very quiet.'
