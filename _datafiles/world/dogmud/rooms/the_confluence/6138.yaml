zone: The Confluence
title: Cross Street
description: >
  The waterfront commerce falls away behind you as the
  road changes character — wider paving, dressed
  limestone in place of rougher harbour stone, joints
  set with a tighter margin and swept more deliberately,
  the upkeep here paid for by civic rents rather than
  guild dues. The river sound has gone entirely; the
  city has taken over from the wharves. Buildings to
  either side stand three storeys and have been standing
  three generations — plain, settled, maintained with
  the consistency that comes from no one being in a
  particular hurry to let things slide. The road runs
  south toward the square, open and broad.
