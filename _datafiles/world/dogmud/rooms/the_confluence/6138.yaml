idlemessages:
- A clerk in a good coat passes south without looking
  up from the sheaf of papers rolled under one arm.
- The distant note of the civic bell carries faintly
  from the west, once, and settles.
- Pigeons work the gutter along the limestone frontages,
  indifferent to foot-traffic.
