zone: The Confluence
title: South Quay Road
description: >
  The road broadens south of the old gateposts, the working-dock
  character of the Landings giving way to something more deliberate.
  The buildings here are taller and better-kept; a painted sign above
  a doorway, shutters that close square, stone-laid gutters running
  clear. The sound of the market comes from further ahead — a bell,
  voices carrying, the creak of wheels on stone — and the smell shifts
  from raw river mud toward spice and salt and something warm and
  pressed. The Long Quay begins here.
biome: water
