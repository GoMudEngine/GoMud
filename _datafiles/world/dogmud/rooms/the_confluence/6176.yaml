roomid: 6176
zone: The Confluence
title: Chapel of the Solt
description: >
  The southwesternmost chapel, given to the Solt -- the
  widest of the three rivers, which winds through low
  marsh and tidal flat before closing with the others
  at the island. The air here is warmer and heavier than
  in the Aldren chapel to the north; the walls are hung
  with woven reed panels, and the floor is inlaid with
  a <ansi fg="itemname">floor-mosaic</ansi> of dark and
  pale stone suggesting a river spreading across open
  ground. The Aldren chapel is
  back to the north; the sanctuary opens to the east;
  the sacristy is through the south door.
biome: city
