nouns:
  floor-mosaic: >
    The floor is laid in a mosaic of dark and pale stone, the
    pattern a single broad river fanning out across flat country
    -- the Solt as it nears the lowland, losing its banks and
    spreading wide before it reaches the island. Worshippers sit
    along its edges and follow the spreading water with their
    eyes. The tesserae underfoot are worn smooth where the
    pattern's mouth opens toward the chapel door.
idlemessages:
- The reed panels on the walls shift faintly, though
  there is no obvious draft to account for it.
- A worshipper sits on the floor mosaic, following the
  river-pattern with their eyes from west to east.
- 'The Solt chapel is warmer than the others: the stone
  here holds the heat longer than anywhere else.'
