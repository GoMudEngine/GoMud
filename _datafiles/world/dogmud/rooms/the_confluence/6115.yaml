roomid: 6115
zone: The Confluence
title: Cooper's Yard
description: >
  An open yard between the chandlery and the tavern, loud in the
  easy rhythmic way of craft work: the mallet on a barrel stave,
  the rasp of a drawknife on fresh wood. Barrel blanks are stacked
  against the west wall; finished barrels, hooped and tested, stand
  in a row ready for collection. A net-frame leans against the far
  fence, weighted floats hanging from the mesh. The pace here is
  quieter than the quay — dock work running on its own time.
biome: water
