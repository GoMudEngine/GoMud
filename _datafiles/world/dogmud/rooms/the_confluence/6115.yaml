nouns:
  the barrels: >
    Finished cooperage, standing upright and ready: staves fitted
    tight, hoops driven and clinched. The cooper tests each one
    with a mallet tap, listening for the note that says the fit
    is good. These go to the warehouses and to the barge dock
    both, packed with salt fish, lamp oil, or river tar depending
    on the bond.
