idlemessages:
- 'A pot hangs over the banked fire: not boiling yet,
  but building toward it.'
- Wood smoke drifts across the courtyard and out over
  the temple roofline.
- 'The cutting table shows the marks of years of the same
  work: precise, repeated, unhurried.'
