zone: The Confluence
title: The Kitchen Court
description: >
  A working kitchen and its small courtyard, open to the
  sky where the smoke can clear. The kitchen occupies the
  north half: a wide hearth, iron pot-cranes, a cutting
  table bearing the marks of years of use. The court to
  the south is paved with river-stone and holds the
  kitchen's water-trough and wood-store. The work here is
  ongoing -- bread, porridge, the simple regular food of
  the community's table. The refectory is back to the
  north.
