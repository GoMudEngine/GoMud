roomid: 6228
zone: The Confluence
title: The Copyists' Room
description: >
  The copy-work room: slanted desks along the windows
  where the natural light is best for close lettering,
  a line strung from wall to wall near the ceiling for
  drying freshly written sheets, and a shelf of
  ink-pots in various states of depletion. Completed
  copies hang on the line — survey transcriptions, a
  run of civic minutes, several pages of close tabular
  notation that looks like tidal records. The room
  smells of fresh ink and the linen of the drying
  sheets. A copyist works at the desk nearest the
  window, transcribing from a manuscript with the
  disciplined steadiness of someone whose skill is in
  the hand, not in the judgment of the text. Work
  accumulates; the copy-line is nearly full.
