nouns:
  the drying sheets: >
    Freshly copied sheets pegged to the drying line:
    a survey transcription in neat professional hand,
    two pages of civic minutes in a slightly smaller
    script, and a long run of close tabular notation
    whose headings suggest tidal timing over some
    stretch of the river's coast. The copies are
    accurate work; the copyist does not improvise.
    The ink on the near sheets is still dark and
    wet-bright; the far ones have dried to the faint
    brownish cast that fresh work always settles into.
  the ink-pots: >
    A shelf of ink-pots in four sizes: the tall bottle
    for ordinary black, a sealed pot of red for
    annotations, a small pot of faded brown nearly
    out and not yet replaced, and an unlabeled jar
    whose contents have dried to a solid plug. The
    shelf is stained from past spills wiped but not
    fully removed. The active ink is the tall bottle;
    its stopper sits to one side where the copyist
    placed it hours ago and has not replaced it,
    so the work goes faster.
idlemessages:
- The copyist's quill moves across the page with
  the even pace of someone who is not rushing.
- A freshly copied sheet on the drying line shifts
  in the light draught from the window.
- The ink-pot stopper sits to one side of the desk
  where the copyist set it and left it there.
