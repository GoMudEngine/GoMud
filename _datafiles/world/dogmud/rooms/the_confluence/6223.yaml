roomid: 6223
zone: The Confluence
title: The Cartographers' Room
description: >
  A room given over entirely to the making and revision
  of maps: two large draughting tables stand at angles
  to catch the best light, their surfaces marked with
  old ink stains and the ghost-impressions of rulers
  used in the same place for so long the wood has
  compressed. A rack along the east wall holds rolled
  surveys of the Confluence and the surrounding
  territory, each labeled in a careful hand and dated.
  Instruments hang on hooks beside the rack — dividers
  in three sizes, a brass protractor, a set of French
  curves worn smooth from handling, a surveyor's wheel
  missing its handle. The room smells of fresh ink and
  the chalk the cartographers use for draft-work before
  committing to vellum. A cartographer-scholar works
  at the larger table, draughting with the unhurried
  precision of someone who does not rush this kind
  of work.
