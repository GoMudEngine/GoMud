nouns:
  the instruments: >
    The cartographic tools hanging beside the survey
    rack: three pairs of dividers in different sizes,
    a brass protractor with degree-marks worn into the
    arc from long use, a set of French curves whose
    edges have acquired an oil-polish from handling,
    and a surveyor's wheel whose handle has been lost
    or removed and not replaced. The tools are clean
    and orderly despite the room's active state. These
    are working instruments; they are treated as such.
  the surveys: >
    The rolled surveys in the east-wall rack, each one
    labeled in a careful archival hand: dates, zones,
    the initials of the original surveyor where known.
    The oldest rolls have been pushed upward over time
    by the cartographers' habit of pulling newer
    material for reference. Most cover the river
    junction and its environs from a variety of periods
    and approaches. Rarely do two agree in every detail.
    The Margin keeps records of the disagreements.
idlemessages:
- The cartographer at the draughting table adjusts
  a divider setting without looking up from the work.
- A rolled survey shifts in its rack, settling further
  on the shelf as the building's warmth changes.
- The sound of a ruling edge drawn across vellum
  carries clearly in the room's close quiet.
