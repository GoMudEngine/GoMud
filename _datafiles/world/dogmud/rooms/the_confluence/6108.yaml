roomid: 6108
zone: The Confluence
title: The Quayhead
description: >
  The low building at the head of the main quay serves as customs
  office, weigh-house, and Dockmaster's desk all at once. A broad
  counter runs the front, faced with iron brackets and a sliding
  grate. Ledgers are stacked behind in good order, most of them
  open. Through the wide south door the quay proper begins: the
  smell of river water and fresh-cut plank comes in on every
  breath. The Barge Dock lies to the east; the warehouses are to
  the west.
biome: water
