nouns:
  the ledgers: >
    Stacked behind the counter and cross-indexed — this year's and
    last year's both open. Cargo manifests, barge arrivals, bond
    records, tonnage. The Dockmaster keeps them in a hand so neat
    it looks printed. A running total on the rightmost open page
    shows today's intake, already substantial.
  the counter: >
    A heavy timber counter faced with iron, a sliding grate on its
    upper sash that can close the whole front window with a clang.
    It is open now. A set of balance scales occupies one end, the
    brass pans polished by use.
spawninfo:
