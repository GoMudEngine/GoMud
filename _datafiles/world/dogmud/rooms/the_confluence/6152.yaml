    respawnrate: "20 real minutes"
idlemessages:
- The seal-press rings against the desk as a document
  receives its formal mark.
- Wax smoke drifts from the notary's work — a clean
  sharp smell, brief.
- A citizen waits on the bench near the door, a deed
  held carefully in both hands.
