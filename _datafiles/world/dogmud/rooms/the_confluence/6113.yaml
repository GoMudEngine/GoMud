roomid: 6113
zone: The Confluence
title: Warehouse Row
description: >
  A row of bonded warehouses lines the west side of the Landings,
  their great double doors banded with iron and chalked with lot
  numbers in white. Pallets of freight are stacked outside the
  nearest door, waiting on a tallymaster who has not yet arrived.
  The smell is the smell of stored goods: old sacking, vinegar,
  beeswax, and below it all the damp of the river held in the
  walls. The Quayhead lies to the east; the chandlery is south.
biome: water
