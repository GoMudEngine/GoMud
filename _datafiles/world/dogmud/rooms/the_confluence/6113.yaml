nouns:
  the warehouses: >
    Three of them in a row, identical in construction: timber-
    framed, river-stone lower walls, thatched roofs raised high to
    let the stored goods breathe. The doors are banded iron over
    heavy oak, chalked with lot numbers changed each season. What
    is inside shifts with the trade: grain, baled cloth, salted
    river catch, lamp oil, hides. The Quayfolk call the lot "the
    bond," and bonded goods cannot leave without a warden's mark.
idlemessages:
- The big warehouse doors creak in the river wind, their chains rattling.
- The smell of old sacking and vinegar seeps from under the warehouse doors.
- A rat runs the length of the pallet stack and vanishes into a gap.
