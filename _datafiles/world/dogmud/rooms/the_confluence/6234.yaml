spawninfo:
  - mobid: 9473
    respawnrate: "20 real minutes"
nouns:
  the barrels: >
    A row of finished barrels against the cooperage
    wall — river-trade sizes, tight-grained, the staves
    pale oak going dark at the char-line above the
    bottom hoop. Each has the cooperage's mark burned
    into the head.
  the staves: >
    Long, slightly curved lengths of split oak, bundled
    with cord and stacked under the overhang. The wood
    is still green in places and will need another
    month before it can be worked into a full cask.
idlemessages:
- The cooper sets a hoop around a new stave-ring and
  drives it down with quick mallet-strokes.
- The scent of charred oak settles over the street in
  a warm, resinous layer.
- A stack of finished barrel-lids leans inside the
  door, sorted by diameter.
