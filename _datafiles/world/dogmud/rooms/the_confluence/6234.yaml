roomid: 6234
zone: The Confluence
title: The Cooperage
description: >
  The cooperage takes up a wide, low-ceilinged building
  with a yard extending behind it, and spills into the
  street: a row of finished
  <ansi fg="itemname">barrels</ansi>
  stands against the outer wall, and loose
  <ansi fg="itemname">staves</ansi>
  are bundled and stacked in the passage beneath an
  overhang. Inside, the smell of cut oak and charring
  wood is specific and deep — the hoops are fired to
  bend, and the scorch is never entirely out of the
  timbers. A half-built cask sits on a stand near the
  door, waiting for its head. The row is east; the
  weaver's is south.
biome: city
coord:
  x: -15
  y: -68
  z: 0
exits:
