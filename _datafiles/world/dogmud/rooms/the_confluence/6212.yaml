roomid: 6212
zone: The Confluence
title: The Deep Landing
description: >
  The stair from the water gallery arrives here, at
  the lowest level the undercroft reaches. The stone
  is the same dense pre-Founding material as above,
  but it is dry here -- genuinely dry, not merely
  less wet than the seeping passage. The sound of the
  joined channel above is reduced to a low murmur,
  felt more than heard. The air is cold and utterly
  still. The stair is back above; the way west opens
  into a wider space.
