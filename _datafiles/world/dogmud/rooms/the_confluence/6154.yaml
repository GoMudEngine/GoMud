zone: The Confluence
title: Processional Avenue, North End
description: >
  Past the gate-piers the paving broadens into something
  deliberate — the avenue given scale by buildings set
  well back on both sides, their fronts reduced to narrow
  court-mouths and the occasional pillar. The openness is
  planned. At the far south end of the avenue, across the
  full length of the district, the temple sits on its
  island above the water, a pale stone presence at a
  distance. The Aldren runs off to the north, the river
  the road followed down, a low sound beneath the city
  noise. The gate-piers are
  behind; the avenue runs straight and long to the south.
