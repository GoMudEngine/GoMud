idlemessages:
- Pilgrims move south on the avenue with the purposeful
  step of those who have already walked some distance.
- The broad paving holds sound differently than the
  city's narrower streets — footsteps spread out here.
- A vendor calls from a side-court to the east, but
  the avenue itself is clear of stalls at this end.
