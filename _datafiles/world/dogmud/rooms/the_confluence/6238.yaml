nouns:
  the shelf: >
    The counter shelf holds today's baking in no
    particular order — round loaves side by side with
    smaller flat ones, and a tray of rolls that is
    already a third gone by midmorning. The baker does
    not label anything; regular customers know what
    they want before they come through the door.
idlemessages:
- The baker slides a long peel into the oven and draws
  out a row of dark-crusted loaves in one practiced
  motion.
- 'Flour hangs in the warm air: it settles on every
  shelf and never quite comes off the floor.'
- A child is sent in with a coin and leaves clutching
  a hot roll wrapped in cloth.
