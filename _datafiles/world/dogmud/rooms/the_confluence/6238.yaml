roomid: 6238
zone: The Confluence
title: The Baker's
description: >
  The warmest room in the quarter, and the best-
  smelling. Two brick ovens throw heat across a flour-
  dusted floor, and racks of cooling loaves line the
  wall behind a worn counter. The baker works here
  from before light, and the smell of it reaches
  halfway up the craft row by dawn. A wide
  <ansi fg="itemname">shelf</ansi>
  behind the counter holds today's batch — round loaves,
  flat loaves, a tray of rolls already a third gone by
  midmorning. The market is back to the east.
biome: city
