roomid: 6450
zone: The Confluence
title: The Confluence Exchange
description: >
  The Exchange occupies a squat building of river-stone just
  east off the Craft-Supply Stall, its single carved
  <ansi fg="itemname">anchor-and-scales</ansi>
  sign hung low enough for a barge-hand to read without
  craning. Inside, a scarred
  <ansi fg="itemname">counter</ansi>
  of dark river-oak spans the room, and behind it a wall of
  pigeonholes holds bundled paper tied off in cord. A
  <ansi fg="itemname">strongbox</ansi>
  of river-iron sits bolted through the floor in the corner,
  and a ledger the size of a cartwheel lies open on the
  writing-slope beside it. The air smells of beeswax, old
  paper, and the faint silt-smell that never quite leaves
  a building this close to three rivers. The stall is west.
biome: city
