idlemessages:
- The clerk turns a page of the ledger, smoothing the crease
  with a practised thumb.
- A wax seal cracks softly as a folded paper is slotted into
  its pigeonhole.
- The strongbox settles with a low tick as the building
  shifts against the river damp.
