nouns:
  the counter: >
    A long counter of dark river-oak, worn pale where hands
    and elbows have rested over many seasons. A small brass
    bell sits at one end for summoning the clerk, and a
    shallow groove near the ledger's usual place is stained
    faintly with old ink.
  the strongbox: >
    A heavy coffer of river-iron, squat and bolted through
    the floorboards into the stone beneath. The lock takes
    a long-shanked key the clerk keeps on a cord under their
    coat. The iron is dull from the river damp but sounds
    entirely solid when a knuckle taps it.
  the ledger: >
    An enormous ledger open on the writing-slope, its pages
    dense with columns in several different hands across
    several seasons — barge tolls, warehouse rents, a few
    larger entries in red ink that carry no names, only
    account numbers.
