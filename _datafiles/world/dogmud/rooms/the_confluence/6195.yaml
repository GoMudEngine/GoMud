roomid: 6195
zone: The Confluence
title: Aldric's Study
description: >
  A private room beyond the archive, smaller than the
  chapter house and unmistakably lived in: books at
  angles on the desk, a marked-up copy of the temple
  calendar, an extinguished lamp recently set down. The
  order here is a working order, not a formal one. The
  man who keeps this room has made his peace with
  something, though the room does not advertise what.
  The archive is back to the west.
biome: city
