    roomid: 6189
idlemessages:
- 'The desk holds a spread of papers: the head Keeper
  has been here recently, and will be back.'
- A thin mark has been pressed into the desk-wood by
  years of the same pen in the same place.
- 'The lamp is cold but not long cold: the room still
  holds a trace of its warmth.'
