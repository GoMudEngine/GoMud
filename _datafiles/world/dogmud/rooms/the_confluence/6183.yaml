title: The Inner Threshold
description: >
  A landing at the end of the east passage from the
  Brenn chapel, where the public portions of the temple
  end. The way forward is a heavy
  <ansi fg="itemname">warded-door</ansi>
  of iron-bound timber, set into an arch at the landing's
  far end; beyond it the cloisters lie east, the senior
  Keepers' domain, and deeper within, the stair down to
  what lies beneath. The Warden turns back the idle and
  passes those the Keepers have admitted. The Brenn
  chapel is back to the west.
