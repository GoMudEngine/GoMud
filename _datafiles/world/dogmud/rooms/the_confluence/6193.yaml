roomid: 6193
zone: The Confluence
title: The Infirmary
description: >
  A long room of plain cots, each with a folded blanket
  and a small shelf for a cup and a candle. The smell
  here is of dried herbs and beeswax, not illness; the
  infirmary has its own insistent good order. The
  infirmarian keeps a long table of medicines and
  dressings against the south wall, labeled in the same
  careful hand as the archive's drawers. The East Walk
  is back to the north.
