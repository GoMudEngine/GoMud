idlemessages:
- The infirmarian checks each cot in order, straightening
  a blanket or moving a cup without apparent urgency.
- 'The herbs on the south shelf are labeled simply:
  what each is, and what each does.'
- 'Several cots are prepared and waiting: the infirmary
  is kept ready at all hours.'
