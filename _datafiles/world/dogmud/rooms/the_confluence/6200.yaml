zone: The Confluence
title: The Undercroft Stair-Foot
description: >
  The stair arrives at a landing of old stone, dry and
  still. The lamplight from above reaches here, just:
  enough to show dressed blocks of two kinds set side
  by side -- the pale courses the temple uses on its
  upper floors, and darker, denser stone below the
  seam, clearly older, clearly something the temple
  was built on rather than built of. The air is cool
  and carries the smell of still water from the west.
  The stair goes back up; the undercroft opens west.
