idlemessages:
- The lamplight from the stairwell barely holds at
  this depth; beyond the landing, the west passage
  is dark.
- 'Two stones meet at the seam here, one pale and one
  dark: the line between what the temple built and
  what it found.'
- A draught from the west carries the smell of
  standing water and stone that is very old and cold.
