zone: The Confluence
title: The Brennside Wharf
description: >
  The east bank's working waterfront, a short stretch
  of timber-planked wharf running along the Brenn's
  right bank north of the gate. It handles lighter
  traffic than the great quays on the civic side —
  local boats, fishing craft, the occasional river
  trader who prefers the quieter east approach. The
  water is close here; the smell is fish and rope
  and the river-specific scent of wet timber drying
  in the sun. The eastern landing is further along
  the bank to the east; the gate is south.
