idlemessages:
- A fisherman pushes off from the wharf in a narrow
  flat-bottomed boat, heading upstream without hurry.
- The planking underfoot is worn in the paths of
  habitual use — the same routes, day after day.
- A tern drops on the river beyond the wharf's edge,
  rises again with nothing.
