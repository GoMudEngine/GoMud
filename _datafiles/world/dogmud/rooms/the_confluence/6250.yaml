nouns:
  milestone: >
    A dressed stone cylinder at the road's edge, its
    face carrying two incised lines: GREENFORD, and
    below it a distance in league-marks. The stone is
    old, its edges weathered, but the letters are
    clear enough. Beyond this marker the road runs
    into open country — it is a long walk, and people
    who travel it prepare first.
idlemessages:
- The paving runs east from the gate, firm and even,
  the road's first stretch out of the city well kept.
- A traveler at the milestone traces the letters with
  a finger, calculating distance.
- The country air comes in from the east here, drier
  and more open than the river-smell of the city.
