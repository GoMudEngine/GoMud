roomid: 6250
zone: The Confluence
title: The Greenford Road
description: >
  The paved road running east out of the Confluence,
  the gate arch behind to the west, the country opening
  ahead. This is the first stretch of the Greenford
  road beyond the city wall — the paving is maintained
  here, firm and even, kept by the same guild that
  tends the city's other arteries. A stone
  <ansi fg="itemname">milestone</ansi>
  stands at the road's edge, marking distance and
  direction. The road continues east from here into open country,
  toward the town of Greenford a full day's travel
  away. The world is larger than the city, and the
  east road goes there.
biome: city
