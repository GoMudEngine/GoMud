title: The Market Row
description: >
  The market row runs through here, stalls pressed in on both sides
  of a passage barely wide enough for a laden cart. Oilcloth awnings
  overhead cut the light and keep the rain off the goods displayed
  below — bolts of cloth, dried herbs, secondhand tools, cages of
  river-fowl, bags of spice decanted from the big Spice Quay
  shipments into smaller lots for household buyers. Hawkers move
  through the crowd in both directions. The noise is continuous,
  voices and cart-wheels and the occasional sharp note of the
  toll-bell from the weighhouse to the east.
biome: water
