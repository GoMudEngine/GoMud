nouns:
  the maps: >
    The wall-covering of survey copies and traced maps
    that constitutes the Margin's working record —
    sheets of varying age, quality, and scale, pinned
    wherever there is space and annotated in the
    margins by the scholars who have worked from them.
    Several bear marks in red: points of disagreement,
    places where two sources conflict, things the
    original survey-makers could not agree upon. The
    river junction appears on almost all of them. The
    annotations do not always agree with each other.
  the table: >
    A long trestle table that has served the Margin
    through years of sessions. The ends are worn
    smooth from habitual leaning; the middle is stained
    with old ink and shows the small scars of dividers
    and measuring tools used without proper backing.
    Near the east end, someone has carved a small
    notation into the wood — a surveyor's shorthand,
    or perhaps a coordinate — and then thought better
    of the impulse and left it anyway.
idlemessages:
- The senior scholar at the west end turns a page and
  pauses over something in the middle of it.
- Lamplight falls differently across the pinned maps
  as someone shifts position at the table.
- From the hall, a pause in all conversation — as if
  a point has been conceded, or a new one found.
y: 71
