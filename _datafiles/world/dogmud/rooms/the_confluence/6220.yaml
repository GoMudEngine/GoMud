title: The Margin Hall
description: >
  The Margin's meeting hall — the room where the
  community of scholars who study the old records
  convenes to argue about them. Survey copies and
  traced maps cover most of the wall space from floor
  to ceiling, pinned at irregular intervals and
  annotated in at least three different hands; older
  sheets overlap newer ones at the edges. A long
  trestle table runs the room's length, its surface
  worn pale at the ends where people habitually lean
  and rougher in the middle where the maps get spread
  out and the debate gets serious. The room smells of
  lamp oil, old ink, and argument. A senior scholar
  stands at the table's west end, turning pages in a
  large bound folio with the focused concentration of
  someone who has found something worth finding.
