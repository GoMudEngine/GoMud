nouns:
  the pump: >
    An iron hand-pump on a stone plinth, its spout
    aimed at a shallow drain that runs to the court's
    edge. The handle is dark and smooth from years of
    morning use; a tin cup hangs from the hook beside
    the spout, communal and no one's in particular.
idlemessages:
- A woman leans from a window to collect a half-dry
  shirt from the rope and takes in a neighbor's as well.
- The pump in the court is worked with a rhythmic squeak
  and then released; water sounds, then silence.
- Two conversations are audible at once from separate
  windows, neither requiring the other to stop.
