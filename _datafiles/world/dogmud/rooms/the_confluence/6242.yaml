roomid: 6242
zone: The Confluence
title: A Tenement Court
description: >
  Four houses face each other across a shared court no
  wider than two arm-spans at its narrowest, the paving
  worn to a rut in the center where feet have passed and
  passed again over the years. A communal
  <ansi fg="itemname">pump</ansi>
  stands at one end, its handle dark from use, a rusted
  tin cup hung from it on a hook that long predates
  anyone who lives here now. Washing hangs between the
  upper windows on ropes strung corner to corner — this
  court sees less sun than the lane and the cloth takes
  longer to dry. Voices carry easily from house to
  house; there is no privacy here that is not maintained
  entirely by consent. The lane is north; a functionary's
  door is east; the well-court is south.
