roomid: 6175
zone: The Confluence
title: Chapel of the Brenn
description: >
  A chapel off the crossing's east side, given to the
  Brenn -- the eastern river, broad and slow through the
  lowland stretches before it reaches the Confluence.
  The back wall is painted in tones of deep ochre and
  umber, a flat river running between dense reeds, the
  water dark with sediment and full of life. Each
  <ansi fg="itemname">offering-bowl</ansi> along the ledge
  holds dried flowers and small handfuls
  of river-clay left by those who made the journey along
  the Brenn's road. The crossing opens to the west; the
  east aisle connects to the north; a disused alcove
  opens to the south; a passage leads east to the inner
  threshold.
