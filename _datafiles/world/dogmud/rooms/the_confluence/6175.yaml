nouns:
  offering bowl: >
    Low bowls of fired clay set along a ledge at the
    back of the chapel, each holding whatever the last
    pilgrim left. Today's accumulation includes dried
    meadow-flowers, a pinch of river-clay pressed into
    a disc, and a few strands of reed tied at the center.
    They are not collected or cleared; they sit until
    time and weather reduce them, which takes longer in
    here than you might expect.
idlemessages:
- A pilgrim sets a handful of dried river-grass in one
  of the offering bowls and steps back without speaking.
- 'The painted Brenn on the back wall is cool to the
  touch: condensation gathers on the deep pigment.'
- A keeper polishes the offering ledge with unhurried
  attention, working around the things left there.
