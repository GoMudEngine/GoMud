roomid: 6227
zone: The Confluence
title: Scholars' Lodgings
description: >
  The residential wing of the Scholars' Quarter: a
  short corridor lined with narrow doors opening into
  cells barely large enough for a cot and a desk. Most
  cells are occupied in the sense that their occupants'
  belongings have claimed them, even when the scholars
  themselves are elsewhere at work. Books are stacked
  as furniture in the corridor — as footstools, as
  doorstops, as the base of an ad hoc side table. A
  scholar from the Margin sits on a cot in the nearest
  open cell, reading a pamphlet with the focused
  intensity of someone who expects to disagree with
  most of it. The lodgings smell of old paper, lamp
  oil, and the staleness of rooms where people live
  close together and read late.
biome: city
coord:
