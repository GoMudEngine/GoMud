    respawnrate: "20 real minutes"
nouns:
  the books: >
    The volumes stacked in the corridor as impromptu
    furniture: three form the base of a side table, two
    serve as a doorstop, one large atlas has been
    pressed into service as a footstool for so long
    that its cover has shaped itself to the purpose.
    The titles are mixed — survey texts, a language
    reference, a volume on instrument calibration, and
    at least two works of popular history that a scholar
    has not thought to return to wherever they came
    from. The corridor makes do with what it has.
idlemessages:
- The scholar in the near cell turns a page of the
  pamphlet and exhales softly in mild disagreement.
- Somewhere further down the corridor, a cot creaks
  as its occupant shifts without waking.
- The improvised side table of stacked books holds
  a cup and a lamp with equal confidence.
