roomid: 6440
zone: The Confluence
title: The Warded Corner
description: >
  A closet-sized room made colder by its own construction — the
  walls here are lined in a hatch-pattern of fine wire, and the
  floor is scored with concentric warding-lines in chalk gone
  permanent under repeated tracing. At the center, an
  <ansi fg="itemname">enchanting circle</ansi>
  is worked directly into the floorboards, its rings inlaid
  rather than painted over, and a low hum rides just under
  hearing whenever anything sits inside it. The air carries a
  faint tang, like the moment before a storm that never quite
  arrives. Whatever this room was built to contain before it
  became a workroom, it kept some of the old caution in its
  bones. The main workshop lies back to the west.
