nouns:
  enchanting circle: >
    Rings of pale inlay set into the floorboards themselves,
    fine as wire and laid with a precision no amateur hand
    could manage. The pattern does not repeat cleanly — small
    corrections and rerouted lines mark places where the design
    was fixed mid-work rather than planned from the start.
idlemessages:
- The wire lining the walls ticks faintly, though nothing here
  is warm enough to explain it.
- A chalk line on the floor has been retraced so many times it
  has worn a shallow groove into the wood.
- The low hum from the circle rises for a moment and settles
  again, as if something briefly leaned close.
