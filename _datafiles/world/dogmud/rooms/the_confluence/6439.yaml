roomid: 6439
zone: The Confluence
title: The Gem-Bench Nook
description: >
  A narrow side room, barely wide enough for the bench that
  fills it — a
  <ansi fg="itemname">jeweler's bench</ansi>
  bolted fast to the wall beneath a bracket of small lamps
  angled in close for fine work. Trays of loupes, tweezers, and
  setting burins sit within easy reach of the stool, and a
  shallow drawer beneath the bench holds a felt-lined row of
  stones sorted by some system a stranger could not guess at —
  not color, not size, something else entirely. The room's one
  window is hung with a heavy curtain, tied back only far enough
  to work by and no farther. The main workshop lies back through
  the door.
