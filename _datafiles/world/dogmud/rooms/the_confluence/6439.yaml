nouns:
  jeweler's bench: >
    A small, precise workbench, its surface a patchwork of tiny
    burn-marks and fine scratches from decades of careful work
    that predate whoever uses it now. The lamps clamped above it
    can be angled to a hair's width. Whoever sits here does not
    waste motion.
idlemessages:
- A loupe left on the bench catches the lamplight and throws a
  small bright coin of light on the ceiling.
- The felt-lined drawer sits very slightly open, just enough to
  show a glint of something uncut.
- A curtain over the window stirs with a draft that has no
  obvious source.
