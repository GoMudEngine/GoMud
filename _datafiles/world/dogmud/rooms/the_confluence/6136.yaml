zone: The Confluence
title: The South Market
description: >
  The market thins as the road runs south. The stalls here are more
  widely spaced, the awnings smaller, the sellers fewer and more
  deliberate in their calling. The goods are the kind that do not
  require a crowd to move — fine spice in small quantities, carved
  river-wood, a tailor working from a folding table. The bulk of
  the trade is behind and the sound of it is distant, the market
  bell a faint note from back at the Cross. The road ahead continues,
  the way opening south toward the city's center and the quieter
  civic life beyond the waterfront.
biome: water
