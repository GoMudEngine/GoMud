roomid: 6215
zone: The Confluence
title: The Chamber of the Old Sky
description: >
  The deepest room the stair reaches: a domed chamber
  of pre-Founding stone, dry where everything above
  it wept water. The whole of the far wall is given
  to a single great carving -- the
  <ansi fg="itemname">orbital-face</ansi>
  -- a map of the sky in concentric rings, cut by a
  hand that worked before the temple was a thought.
  The Keepers built three hundred years of doctrine
  in the rooms above this one. Down here, the wall
  keeps its own older count. Around the outermost ring
  runs a line of
  <ansi fg="itemname">ring-inscription</ansi>
  in a script that is not the temple's. The way back
  is east.
biome: city
