nouns:
  orbital face: >
    A carving that fills the wall: the night sky
    rendered as a set of nested rings about a central
    mark, precise as an instrument. Whoever cut it
    counted the rings with care -- there are four.
    The temple above keeps to three in everything it
    teaches. The stone does not argue; it simply
    shows what it was cut to show, and lets the
    difference sit there in the dark.
  ring inscription: >
    Around the outermost ring, cut in a script that
    is not the temple's script: a line of marks the
    Keepers have transcribed but not translated. They
    are not decorative. They were placed to be read
    by someone, at some time, for some reason the
    stone no longer explains.
idlemessages:
- The chamber is silent in a way the rooms above are
  not -- no water, no draft, only stone and the
  carving.
- 'A faint line of old pigment survives in one ring
  of the carving: it was painted, once, and meant
  to be seen.'
- 'The dome overhead is uncarved but smoothed: a
  deliberate finish, not raw stone.'
