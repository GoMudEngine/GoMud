nouns:
  the forge: >
    A coal forge against the smithy's back wall, its
    firepot glowing through a grate of thick iron bars.
    The fireback is dark with age and use; the outer
    bricks have been patched in a different clay from
    the original, sometime in the past generation.
  the anvil: >
    A heavy cast-iron anvil on its oak block, the face
    worn to a slight bow from years of hammer-work.
    The horn is dark from use; the heel shows the marks
    of chiseling work. The weight of it has pressed
    the block visibly into the earth below.
idlemessages:
- The hammer rings twice on the anvil-face, then once
  on the horn — a working rhythm that carries through
  the whole quarter.
- The forge-breath comes out the open door in a wave
  of heat when the bellows is worked.
- A bin near the door holds iron scrap waiting to be
  remelted — bent nails, broken hooks, worn barrel-rings.
