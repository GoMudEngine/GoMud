roomid: 6239
zone: The Confluence
title: The Smithy
description: >
  The heat from the forge reaches into the street before
  you reach the door. Inside, the
  <ansi fg="itemname">forge</ansi>
  glows a steady orange-white at the back of the room,
  with a broad leather bellows hung above it on a pivot
  arm. The
  <ansi fg="itemname">anvil</ansi>
  sits on its heavy oak block in the center of the
  floor, worn in the face from use and dark with scale.
  The smith works without ceremony — metal to the fire,
  metal to the anvil, back to the fire — and the hammer
  note rings out clearly into the market and the lane
  below. This is a small-work smithy: nails, hinges,
  hook-and-staple sets, barrel-hoops. The market is
  north; the supply stall is east; the lane is south.
