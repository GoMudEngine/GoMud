nouns:
  the boundary-stone: >
    A stone block half-sunk in the moss at the end of
    the garden walk, its surface weathered to a grey
    that no longer matches the surrounding wall-stone.
    It predates the Quarter's outer wall; the dressed
    building-stone runs to it rather than past it. The
    scholars' feet have worn the gravel clear around
    its base but no one tends the stone itself. On the
    face that leans toward the wall, sheltered from the
    worst of the weather, a pattern is still legible
    under the lichen.
  the mark: >
    Carved into the sheltered face of the old boundary-
    stone: concentric rings, the outermost clear, the
    inner circles arranged at intervals around a central
    point. The stonecutter's lines are finer than guild
    work and older than the Quarter's wall. The pattern
    is the same as others found in the old parts of the
    Confluence — on a foundation-stone in the customs
    house, on a mooring-block at the old mole, in the
    records room behind the Municipal Hall — though the
    scholars who walk this path daily have not made the
    connection in any record that survives. The moss
    grows up to the carved lines but not into them.
idlemessages:
- The gravel walk lies undisturbed; no one has come
  this way recently enough to leave a mark.
- Moss advances through the wall-joints slowly, in
  the unhurried way of things with no deadline.
- The boundary-stone leans at its slight angle, as
  it has for longer than the Quarter has stood.
