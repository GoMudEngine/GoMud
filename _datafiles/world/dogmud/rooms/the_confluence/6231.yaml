zone: The Confluence
title: The Garden Walk
description: >
  The far end of the garden walk, a gravel path between
  the court's western edge and the Quarter's outer wall
  — a secluded strip of ground that sees very little
  traffic. Moss grows in the joints of the wall-stones
  and in the spaces between the gravel where it has not
  been turned in some time. At the walk's end, half-
  sunk in the moss where the wall meets the ground-
  course, a weathered old
  <ansi fg="itemname">boundary-stone</ansi>
  leans slightly off-true, as if the ground has settled
  under it over a long period. The scholars who walk
  this path daily pass it without remarking on it.
  The quiet garden lies east.
