nouns:
  building-ledger: >
    The oldest of the temple's construction ledgers, its
    early pages accounting for stone, labor, and coin
    through the years of the raising. The records are
    meticulous -- and oddly silent on the lowest and
    oldest courses, as though the foundation were a thing
    received rather than built. A reader with a reason
    to look would find the silence louder than the
    figures.
