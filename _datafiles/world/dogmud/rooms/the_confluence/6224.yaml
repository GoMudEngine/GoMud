nouns:
  the slate: >
    A large dark slate mounted on the front wall of the
    lecture room, its surface covered with the partial
    remains of the last session's working: river diagrams
    in white chalk, the junction drawn three times at
    different scales, current directions indicated with
    arrows. A series of annotations crowds the right
    side, some in a larger hand, some in a smaller one
    — two people, or a correction added later. To one
    side, the smear of an erased diagram is still
    visible; whatever argument it represented was not
    pursued to a conclusion and was not kept.
idlemessages:
- The chalk dust on the front bench drifts slightly
  in the air and settles back undisturbed.
- The erasing cloth lies where it was dropped, its
  work only half finished.
- The diagrams on the slate wait with the patience
  that unfinished arguments always seem to manage.
