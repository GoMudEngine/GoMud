roomid: 6224
zone: The Confluence
title: A Lecture Room
description: >
  A small lecture room with tiered benches angled to
  face a low slate at the room's front wall. The
  benches are empty and the room is between sessions,
  but the slate has not been fully cleared from the
  last one: river diagrams remain in chalk, annotated
  with surveyor's notation and labeled with arrows
  indicating current direction. A second set of
  diagrams has been drawn to one side and then erased
  into a smear — an argument that was started, revised,
  and abandoned mid-revision. Chalk dust has settled
  on the front bench's surface; the erasing cloth lies
  on the floor beside the slate where it was dropped.
  The tiered rows hold the accumulated scuff-marks of
  years of shifting and leaning.
