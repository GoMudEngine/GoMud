idlemessages:
- The ventilation grate in the hall wall exhales a
  breath of old paper and lamp-oil into the lane.
- A hall clerk moves through quickly, not looking at
  the lane's walls, not slowing.
- The cobblestones carry the shadow of the hall's eave
  for most of the afternoon.
