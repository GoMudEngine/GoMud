idlemessages:
- The garden holds a stillness that the forecourt,
  with its pilgrim traffic, does not.
- A sparrow moves through the clipped hedges with
  more noise than the garden usually permits itself.
- A pilgrim sits on the stone bench, eyes closed,
  making use of the garden as it was designed.
