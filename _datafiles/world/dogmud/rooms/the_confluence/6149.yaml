roomid: 6149
zone: The Confluence
title: The Hall of Records
description: >
  The records room behind the Municipal Hall, its
  shelves running floor to ceiling on all four walls
  with the accumulated documentation of a city that
  has been keeping records for a long time. Bound
  folios of charter amendments, rolled surveys in
  ribbon, indexed ledgers of civic ordinance, and
  older materials in the far corner shelved by date
  rather than subject. The room smells of old paper,
  linseed, and the faint mineral undertone of the
  stone itself. On the north wall, a section known
  here simply as
  <ansi fg="itemname">the old wall</ansi>
  predates the building around it — darker stone,
  differently cut, the mortar of the current building
  running to it rather than through it. Something has
  been cut into its sheltered interior face. The records
  in this room do not appear to address it.
biome: city
