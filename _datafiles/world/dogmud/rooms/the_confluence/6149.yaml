nouns:
  the old wall: >
    A section of the records room's north wall in a
    stone darker and differently textured than the
    surrounding building-stone — an older block,
    sheltered from street-damp and the wear of foot-
    traffic by the building that went up around it.
    The mortar of the current structure runs to it
    rather than through it. The block predates the
    records room and predates the hall. On its interior
    face, something has been cut into the stone.
  the mark: >
    Cut into the interior face of the old north-wall
    block, sheltered from wear by the building around
    it: concentric rings, the outer two clear, the
    inner circles more numerous and arranged at regular
    intervals around a central point. The stonecutter's
    lines are still crisp. The mark predates the records
    room and has sat in the dark of this room while the
    records gathered on the shelves around it. Nothing
    stored here refers to it or appears to have been
    filed under any question about what it is or when
    it was cut.
idlemessages:
- The shelves carry the specific stillness of a room
  where old things are kept without urgency.
- A clerk enters briefly, pulls a folio from the
  middle shelves, and leaves with it under one arm.
- The old wall's stone is colder than the rest of
  the room — a mineral chill that the shelves around
  it do not share.
