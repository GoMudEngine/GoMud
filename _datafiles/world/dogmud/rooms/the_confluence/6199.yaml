nouns:
  descending stair: >
    Broad steps of pre-Founding stone turning down into the
    dark beneath the island, switching once before the
    lamplight gives out. The cut of the treads is older
    than the temple, worn shallow at the center by feet the
    records do not name. Cool, water-smelling air comes up
    them in a slow steady draught. They go down a long way.
idlemessages:
- 'Cool air comes steadily up the stair: below, the
  island sits directly on the water and the rock.'
- The lamplight does not reach far enough to show the
  bottom landing; the stair bends once and disappears.
- 'The stone of the stairwell is old and smooth: the
  same pre-Founding cut as the corridor behind you.'
