roomid: 6199
zone: The Confluence
title: The Descent Stairhead
description: >
  The east end of the older corridor opens onto a landing
  at the head of a stair: broad steps of the same pre-
  Founding stone descend into the dark beneath the island,
  switching once before the lamplight fails to follow.
  Cool air rises from below, carrying the smell of still
  water and deep stone. Whatever lies beneath is quiet.
  The <ansi fg="itemname">descending-stair</ansi> drops
  away into the dark below; the corridor is back to the
  west.
