roomid: 6236
zone: The Confluence
title: The Potter's
description: >
  Clay underfoot and clay on every surface — the
  doorstep has a permanent grey dusting of it that no
  amount of sweeping entirely removes. The shop front
  gives onto a workroom where a heavy
  <ansi fg="itemname">wheel</ansi>
  sits in the center of a tamped-earth floor, its head
  still damp from the morning's work. Rows of
  <ansi fg="itemname">greenware</ansi>
  — bowls, jars, narrow-necked bottles — stand on
  boards to either side, waiting for the dryness that
  precedes the
  <ansi fg="itemname">kiln</ansi>
  in the yard. The finished pieces on the front shelf
  are plain but good — the kind of work a household
  buys once and keeps for twenty years. The craft row
  is north; the weaver's is west; the market is south.
