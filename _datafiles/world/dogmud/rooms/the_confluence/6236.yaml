nouns:
  the wheel: >
    A heavy kick-wheel of old construction, its
    flywheel worn smooth at the kick-point. The head
    is damp and there is a small mound of worked clay
    resting on it, covered with a wet cloth to keep it
    from drying between sessions.
  the greenware: >
    Unfired clay pieces drying on boards — bowls in
    two sizes, jars with tight-fitting lids, and
    several narrow-necked bottles the purpose of which
    is not immediately clear. The clay is still dark
    where it is thickest, lighter where it has begun
    to dry out.
  the kiln: >
    A small domed kiln of fire-brick, visible through
    the workroom's rear passage, its mouth stopped
    with a clay plug. The bricks have taken the
    orange-brown of long use and the ground around
    the base is grey with old ash.
idlemessages:
- The potter's hands work a lump of clay on the wheel
  without apparent effort, the shape rising steadily.
- A cat sleeps on a high shelf between a row of drying
  pots, its tail hanging over the edge.
- The greenware on the drying board is arranged so
  evenly it looks as if it was set out with a rule.
