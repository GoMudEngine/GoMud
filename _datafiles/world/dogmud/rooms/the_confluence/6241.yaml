zone: The Confluence
title: Craftsmen's Lane
description: >
  The street narrows to a lane here, the houses pressed
  close on both sides — three storeys of plain whitewash
  and timber, the upper floors nearly touching across
  the gap. Washing-lines are strung at the second-floor
  level, and damp cloth hangs in the still air: shirts,
  work-rags, a pair of brown wool stockings. A child
  sits on a step at one of the doorways with the patient
  attention of a child who has been out here for a while
  and found the lane sufficient. The smithy is north;
  the riverman's house is west; the court is south.
