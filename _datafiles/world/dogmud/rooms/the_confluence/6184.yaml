title: The Cloister Gate
description: >
  A brief vaulted passage beyond the warded door, the
  cloister gate: the threshold between the public temple
  and the Keepers' own domain. The noise of the nave does
  not carry here. Stone benches line the passage walls,
  worn smooth by those who have waited; a single lamp
  above the east arch burns without guttering in still
  air. The inner temple lies back to the west; the
  Cloister Garth opens to the east.
