zone: The Confluence
title: The Travelers' Inn
description: >
  A low-eaved building facing the east gate road, its
  sign a painted boot above the door — the universal
  language of a house for travelers. The Travelers'
  Inn sits between the gate to the north and the
  common room to the south, with a stable entrance
  east for those arriving mounted or by cart. It is
  the kind of inn that has been here long enough to
  have a reputation among road traffic: not luxurious,
  but clean and reliable, and the keeper knows which
  rooms face the road and which face the quiet yard.
