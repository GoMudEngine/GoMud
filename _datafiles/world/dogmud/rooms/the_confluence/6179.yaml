idlemessages:
- A keeper folds a ceremonial cloth with the practiced
  precision of someone who has done it ten thousand times.
- 'The vessels on the long table are arrayed with care:
  each has its exact place, and the gaps show where
  others are in service.'
- Incense smoke drifts through the east door from the
  reliquary, thin and sweet.
