nouns:
  road east: >
    The road continues past the city's last ground
    into open country, its surface becoming less
    certain as the city's maintenance ends. Greenford
    is a full day's travel east by this road — a
    substantial journey into wider country. The road
    goes there. The city does not.
idlemessages:
- The wind from the east carries grass-smell and dust
  and the particular absence of city noise.
- A traveler pauses here, looking east down the road
  for a long moment before turning back.
- The city behind is still audible, but less certain
  out here — further away than the distance suggests.
