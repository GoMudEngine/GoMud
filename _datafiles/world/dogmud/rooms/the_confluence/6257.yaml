zone: The Confluence
title: The Eastern Edge
description: >
  The city's last ground — where the east quarter's
  paving gives out and the earth takes over, the road
  running on beyond this point into open country. There
  is no abrupt wall or marker here; the city simply
  ends, the way cities that have grown organically
  tend to end, in a thinning of buildings and a
  thinning of road-keeping and a final point where it
  is country, not city, underfoot. The
  <ansi fg="itemname">road east</ansi>
  continues beyond sight, toward Greenford and the
  wider world. The city is behind to the north.
biome: city
