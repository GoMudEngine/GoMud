nouns:
  the notice board: >
    A worn wooden board covered in overlapping pegged
    notices: duty rosters for porter shifts, a schedule
    of Margin reading sessions in the Great Archive, a
    handwritten reminder about borrowed dividers, and a
    short list of names headed Loans — Overdue. The
    notices have accumulated without being cleared; the
    oldest are legible only at their visible edges.
idlemessages:
- The Gate-Porter glances toward the eastern door and
  returns to the duty roster without comment.
- From the west, the faint scratch of a quill working
  on parchment — someone is writing something down.
- The vestibule holds the specific quiet of a threshold
  between the city's business and its scholarship.
