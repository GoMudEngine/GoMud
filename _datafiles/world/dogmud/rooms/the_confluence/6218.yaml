title: The Scholars' Gate
description: >
  The propped door from the Hall of Records opens here,
  letting in a thin draught of archive air and the
  occasional sound of a folio replaced on a shelf. The
  civic noise of the Municipal Hall falls away the
  moment the door swings to. What replaces it is the
  quieter atmosphere of the Quarter: ink, old paper,
  the specific stillness of rooms where people are
  thinking rather than talking. A short vestibule of
  pale dressed stone opens west into Inkwell Court; a
  porter's bench stands to one side of the entry, its
  occupant managing the easy traffic of scholars coming
  and going between the archive and the Quarter's halls.
  A wooden
  <ansi fg="itemname">notice-board</ansi>
  is pegged with rosters and duty schedules.
