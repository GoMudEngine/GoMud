roomid: 6225
zone: The Confluence
title: The Reading Room
description: >
  A quiet annexe off the upper end of the archive,
  fitted with its own locked reference shelves and a
  row of reading-desk carrels with wooden privacy
  screens between them. Most of the carrels are
  unoccupied; at the far end, a single reader sits
  with a large folio open flat on the desk surface,
  making notes on a loose sheet beside it. The locked
  shelves along the north wall hold reference materials
  that do not leave this room: atlases, concordances,
  several volumes of the Margin's own published
  findings, and a set of bound primary surveys that
  the archive will not release to general loan. The
  reader does not look up. The room earns its name.
