nouns:
  the locked shelves: >
    Reference shelves secured with a small bar-lock,
    their contents the materials the archive will not
    allow to circulate: atlases, the Margin's own
    published summaries going back four decades, a set
    of bound primary surveys that cannot be replaced if
    lost, and a handful of volumes flagged by the
    Archivist as too significant for ordinary loan. The
    bar-lock is not heavy, but it is enough — the
    scholars who use this room do not test it.
  the carrels: >
    A row of reading-desk carrels with low wooden
    screens between them, providing the degree of
    privacy that lets a scholar concentrate without
    being entirely alone. The screens are worn at
    their upper edges from years of hands resting on
    them; the desk surfaces are stained with the
    accumulated ghost-marks of ink that went through
    thin paper over many sessions. Most are empty.
    The one at the far end is occupied.
idlemessages:
- The reader at the far carrel makes a note without
  looking up from the folio.
- The locked shelves hold their contents in the same
  arrangement they have had for months.
- Only the faint scratch of the reader's quill marks
  the passage of time in this room.
