nouns:
  east gate: >
    The gate arch in the city's east wall, stone-
    framed and wide enough for a laden cart, its
    keystone carrying the Confluence's crest in
    relief. Gate guards stand beneath it. The road
    runs straight from the bridge foot to the gate
    passage and on east beyond the wall.
idlemessages:
- The road from the bridge runs straight to the gate
  arch, the guards visible at their post from here.
- A pair of travelers comes off the bridge behind
  you, road-packs on their backs, moving east.
- The east bank smells of river-damp and horse
  and the dry note of packed-earth road.
