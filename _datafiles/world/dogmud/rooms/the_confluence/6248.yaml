zone: The Confluence
title: The Brenn Bridge, East End
description: >
  The bridge's last arch sets down on the east bank,
  the stone giving way to tamped earth and then to
  the road's paving as the crossing ends. The east
  bank is lower than the civic side — less building
  piled on it, less height accumulated over time —
  and the difference gives the crossing a slight
  downward lean at its end. Behind to the west the
  city fills the sky above the bridge's profile. Ahead
  to the east the
  <ansi fg="itemname">east gate</ansi>
  arch is visible a short walk away, the road running
  straight from the bridge's foot.
