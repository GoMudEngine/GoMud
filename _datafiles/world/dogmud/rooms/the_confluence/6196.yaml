roomid: 6196
zone: The Confluence
title: The Prioress's Oratory
description: >
  A private chapel and study combined -- Prioress Crane's
  own room, set apart from the chapter house and the
  garth by the east wing's length. A small altar occupies
  the far wall, dressed without ornamentation; the desk
  faces it rather than the window. The room holds a
  quality of sustained attention -- the kind cultivated
  over years, not affected for an occasion. There is
  something in how the space is arranged that suggests
  a question long considered, not yet resolved. The East
  Walk is back to the west; the older corridor continues
  to the south.
