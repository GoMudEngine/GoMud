idlemessages:
- Prioress Crane is at her desk, reading something she
  turns face-down when another enters.
- 'The altar is plain: no image, no inscription, only
  the offering-stand and a lit oil lamp.'
- The room is very quiet; the garth's sounds do not
  reach it.
