zone: The Confluence
title: The Temple Forecourt
description: >
  A broad stone plaza at the water's edge — the full
  ceremonial width of the avenue arrives here and then
  stops, the paving ending at the joined rivers' near
  bank. To the east the causeway begins, a long bridge
  spanning open water to the temple island where the
  three rivers meet. The temple itself is visible on
  the island at the causeway's far end, pale stone
  above the water on all sides. Pilgrims gather here
  to prepare before the crossing, to arrange offerings,
  or to wait for others in their company. A meditation
  garden lies to the west; a rest-hall to the south
  for those who have traveled far.
