zone: The Confluence
title: The Temple Steps
description: >
  The causeway ends at the island's near bank where a
  broad stair rises from the water's edge to the portico
  above. The steps are wide dressed stone, each tread
  deep enough for two to ascend side by side without
  difficulty — a scale that expects procession. The
  island's stone retaining wall runs along the bank to
  either side of the stair-foot, the water moving at
  its base. The temple fills the southern view from
  here, its facade rising above the top of the stair.
  The causeway runs west back toward the city and
  the far bank.
