idlemessages:
- A pilgrim pauses at the stair-foot and looks up at
  the facade before beginning the ascent.
- The retaining wall is close at this end — the island
  is narrower here than it appears from the bank.
- The stone at the center of each tread is worn to
  a particular polish by the weight of arrivals.
