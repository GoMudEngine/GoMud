roomid: 6191
zone: The Confluence
title: The Refectory
description: >
  A long room given over entirely to the community's meals:
  two parallel tables of age-dark wood, benches worn to
  body-shapes by decades of the same Keepers in the same
  places. The room smells of bread and old timber. A small
  rostrum at the north end holds an open book; it is the
  custom here to read aloud during meals from the river-
  accounts or the records of the founding generation. The
  cellarer moves between the kitchen court to the south
  and the serving table against the wall. The South Walk
  is back to the east.
