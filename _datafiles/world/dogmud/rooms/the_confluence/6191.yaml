idlemessages:
- 'The tables are set for a meal: the same care in each
  placement, cup to the right, spoon across the bowl.'
- 'The reading-stand is open to a page of river-records:
  the passage is mid-account, paused mid-reading.'
- The cellarer goes between the serving table and the
  kitchen door without apparent haste.
