idlemessages:
- The Almoner counts candles into a basket with a
  practiced hand, neither slow nor hurried.
- A pilgrim accepts a small loaf from the counter and
  bows their head in brief acknowledgment.
- 'The room is warm and a little close: the press of
  people and the candle-heat together.'
