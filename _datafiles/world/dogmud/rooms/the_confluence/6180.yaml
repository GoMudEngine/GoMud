roomid: 6180
zone: The Confluence
title: The Almonry
description: >
  A small room off the narthex, maintained by the Almoner
  for the daily work of charity. A low counter holds
  baskets of bread and dried goods for those who arrive
  without means; beside it, racks of candles are
  available for the asking -- one to a pilgrim -- to be
  lit before the chapels or carried home. The room is
  warm from the candle-racks and from the steady press
  of people who pass through it. The temple entrance
  is back to the east.
biome: city
