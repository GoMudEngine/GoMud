idlemessages:
- A keeper murmurs the founding account to a small
  group of listeners, gesturing at the relief.
- 'Light from the high window crosses the plaque: brass,
  then shadow, then brass again.'
- A pilgrim traces the braided rivers on the relief
  with one careful finger, following them to the island.
