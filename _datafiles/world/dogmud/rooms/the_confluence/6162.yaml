nouns:
  founding relief: >
    The relief is old work, well kept: the three rivers
    shown as three braided lines drawing together, the
    temple rising on the island where they meet, robed
    figures gathered at the banks. The three rivers flow
    from north, east, and southwest respectively —
    Aldren, Brenn, Solt — and the raising is orderly,
    purposeful, the composition of a beginning told
    with full confidence in how it went.
  official plaque: >
    THE FIRST MARK, the plaque reads, is the earliest
    rendering of the Chrysalis truth — the sealed soul,
    the ringed cocoon, cut into the temple stone by the
    first Founders. It is given as settled doctrine, in
    the Keepers' formal lettering, earnest and unhurried.
    A careful reader who has seen the old river surveys
    might find the confidence a little too tidy to sit
    beside the evidence without question.
