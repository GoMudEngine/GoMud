zone: The Confluence
title: The Hall of the Founding
description: >
  A modest stone hall off the avenue, given over to the
  temple's account of its own beginning. A long carved
  <ansi fg="itemname">founding-relief</ansi>
  runs the length of one wall — the three rivers, the
  raising of the temple, the first Keepers at the
  water's edge. A brass
  <ansi fg="itemname">official-plaque</ansi>
  beneath it sets out, in confident lettering, what the
  oldest marks in the temple stone are held to mean.
  A keeper attends here through the day to explain it
  to whoever asks.
