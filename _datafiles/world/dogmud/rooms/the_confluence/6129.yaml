zone: The Confluence
title: The Weighhouse Yard
description: >
  A stone yard set back from the quay road, open to the sky, where
  the city takes its cut of the trade. Two great platform scales
  dominate the center, their iron arms balanced by counterweights
  bolted to the beam — large enough to weigh a cart's full load in
  one pass. A queue of carts and barrows winds back toward the road,
  drivers waiting their turn with the patient ease of people who
  have done this many times. A chalk-board by the weighhouse door
  shows the current tariff rates, updated when the Weighmaster
  sees fit.
biome: water
