zone: The Confluence
title: The Gallery Walk
description: >
  The gallery extends here above the crossing, the walk
  following the rail out to the edge of the great hall
  below. Through the rail the water-grate is visible
  directly underfoot, and from this height the sound
  of the joined rivers is different -- less felt and
  more heard, the three currents almost distinguishable
  for a moment before they close into one beneath the
  stone. The nave gallery is back to the north.
