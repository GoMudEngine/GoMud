idlemessages:
- 'From this height the water-grate is directly below:
  the joined rivers visible through the iron bars.'
- A visitor stands at the rail in silence, watching the
  crossing fill and empty with worshippers below.
- The three rivers can almost be told apart from here,
  before their voices close into a single sound.
