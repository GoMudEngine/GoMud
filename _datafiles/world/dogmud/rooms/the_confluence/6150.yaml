roomid: 6150
zone: The Confluence
title: The Civic Stores
description: >
  A general-provisions shop on the square's east side,
  occupying the ground floor of a narrow building that
  has been in this business long enough that the word
  STORES is cut into the stone above the door rather
  than painted on wood. A broad
  <ansi fg="itemname">counter</ansi>
  runs the shop's width, its surface marked with the
  accumulated business of years. Shelves behind run
  floor to ceiling with the sundry of city life —
  coils of rope, stacked paper, sticks of sealing wax,
  lamp-wicks by the bundle, candles in three grades,
  and dry goods in labeled jars. The prices are chalked
  on a board above the door. The shopkeeper knows what
  every office in the civic district needs and keeps it
  in stock without waiting to be asked.
