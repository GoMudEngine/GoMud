nouns:
  counter: >
    A timber counter running the shop's full width,
    its surface marked by years of candle-wax drips,
    twine-cuts, and the rings of ink bottles set down
    without care. Behind it, the shelving is dense
    and organized in the way of a shop that looks
    crowded but yields exactly what you ask for
    without the shopkeeper looking twice. The prices
    on the board above the door are reasonable in the
    specific way of a shop whose customers are the
    city's own offices and who would quickly hear
    about it otherwise.
