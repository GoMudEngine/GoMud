idlemessages:
- A civic errand-runner collects a wrapped parcel
  from the counter and tucks it under one arm.
- The lamp-wick smell — dry and faintly sweet —
  is the room's undertone beneath everything else.
- The bell above the door rings as someone leaves,
  and the shop settles back to its quiet industry.
