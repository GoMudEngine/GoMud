zone: The Confluence
title: The North Walk
description: >
  The covered walk along the garth's north side, open to
  the quadrangle through a row of low arches. The paving
  here is worn pale where feet have passed generations
  over it. Doors open from the walk's outer wall into
  the chapter house to the west and the archive to the
  east; the scriptorium lies north. The Cloister Garth
  is back to the south through the arcade.
