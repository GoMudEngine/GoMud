zone: The Confluence
title: The Stable
description: >
  The inn's stable, a long building east of the inn
  proper, its wide doors kept open during trading
  hours. Stalls line both sides, most occupied by road
  horses and pack animals — the stock of travelers who
  came in by the east gate and will leave by it again
  in the morning. The smell is hay and horse and clean
  straw, managed by a stablehand who keeps the place
  in the methodical order of someone who knows that
  an unhappy animal causes more trouble than a tidy
  stall saves. A tack wall runs the far end, hung with
  harness in various stages of repair.
