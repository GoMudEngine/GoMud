roomid: 6222
zone: The Confluence
title: A Study Hall
description: >
  A long room of reading desks arranged to catch north
  light through a row of narrow windows — the clearest
  light in the Quarter for close work, and the desks
  show it: each surface is worn smooth at the center
  and marked at the corners where tools have been
  rested and picked up again for years. The room is
  empty at this hour but the desks are not clean.
  Papers and open books are spread across three of
  them — a scholar's morning session abandoned rather
  than concluded, the notes still legible in the pale
  window light. A wooden rack near the door holds
  blank folio sheets and a small jar of drawing pins.
  The room's quiet is the kind that holds the shape
  of the people who were just in it.
