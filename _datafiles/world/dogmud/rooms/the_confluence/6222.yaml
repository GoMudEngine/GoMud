nouns:
  the abandoned notes: >
    The papers spread across the desk nearest the north
    windows: a series of traced shoreline segments,
    each one labeled with a date and a surveyor's
    initial, arranged in chronological order across
    the desk's surface. The latest trace is annotated
    in pencil with a question that has not yet been
    answered. The book the segments were traced from
    is still open to the relevant page, held with a
    folded strip of cloth. The scholar will return.
idlemessages:
- North light falls through the windows and across
  the empty desks in clean, useful angles.
- A page on the abandoned desk turns slowly in the
  draft from the door to the south.
- The notes left behind hold the shape of a question
  their author has gone away to think about.
