nouns:
  oldest relic: >
    A small river-worn disc of stone, dark and smooth,
    resting on the slab without a mount or label. The
    slab itself is of a different composition than the
    shelving around it -- older stone, darker, the same
    quality visible in the causeway's base courses and
    in the grate-stone at the crossing. The Sacristan
    will say that it was the first thing found on the
    island when the Founders chose the site: that it
    lay on the bare rock at the water's edge, as if it
    had been placed and was waiting. The temple account
    does not pursue the question of who placed it. The
    stone itself does not volunteer the answer.
spawninfo:
  - mobid: 9458
    respawnrate: "20 real minutes"
idlemessages:
- The Sacristan moves along the shelves with the ease
  of someone who has memorized every label in the room.
- 'The chamber is cooler than the rest of the temple:
  the stone here is thick, and the light is kept low.'
- A pilgrim stands before the oldest relic for a long
  moment, then steps back without touching the glass.
