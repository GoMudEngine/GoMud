roomid: 6178
zone: The Confluence
title: The Reliquary
description: >
  A small dedicated chamber beyond the sanctuary, kept
  dim and cool, its walls lined with stone shelves
  holding the temple's collected relics under glass and
  linen. River-stones smoothed in ancient channels,
  fragments of early Keeper vestments, a bound record
  of the first naming rites -- each labeled in careful
  script. At the center, on a slab of stone visibly
  older and darker than the shelving around it, the
  <ansi fg="itemname">oldest-relic</ansi>
  rests without label or explanation. The Sacristan
  attends here, prepared to speak to the newer pieces;
  the oldest one she describes as simply the first thing
  found on the island. The sacristy is to the west; the
  sanctuary is back to the north.
biome: city
