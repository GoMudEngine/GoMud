zone: The Confluence
title: The Three Waters — Lodging
description: >
  The upper floor runs the full width of the inn above
  the common room, its corridor quieter than the noise
  below would suggest — the Three Waters builds its
  guest floors to a standard. Four numbered doors open
  off the landing, their painted room-plates plain, their
  thresholds carpeted in a runner that has seen better
  decades but has been cleaned into a serviceable
  dignity. At the landing's end, a
  <ansi fg="itemname">window</ansi>
  looks out over Tri-Cross Square below — the monument
  at the square's center, the Municipal Hall's facade
  across the way, the ordinary foot-traffic of the city
  going about its afternoon. The stair descends from
  the near end of the landing back to the common room.
