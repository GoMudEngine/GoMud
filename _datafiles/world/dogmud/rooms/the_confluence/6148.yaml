nouns:
  window: >
    A wide sash window at the landing's end with a
    cushioned bench seat beneath it. The glass is
    good — the Three Waters has spent money where
    guests will notice it. Below, Tri-Cross Square is
    laid out in its full width: the worn paving flags,
    the civic monument, citizens crossing in all four
    directions, the Municipal Hall's broad approach
    stair and the bell-tower's squat silhouette beyond
    it to the west. Someone has left a cold cup on the
    bench. The view is better than the room below would
    prepare you for.
idlemessages:
- The corridor carries none of the common room's noise;
  the walls here are built with that purpose.
- One of the numbered doors along the landing is not
  quite fully latched — it does not open, but it does
  not close.
- A burst of laughter from the floor below reaches the
  landing as a murmur, and the corridor resumes its
  quiet.
