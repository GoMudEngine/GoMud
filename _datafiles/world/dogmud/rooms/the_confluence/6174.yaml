nouns:
  cold channel: >
    A shallow trough of stone running along the base of
    the relief wall, fed continuously from somewhere
    beneath the chapel floor. The water in it is cold --
    noticeably colder than the air in the rest of the
    temple -- and moves with a quiet purpose, entering
    from one end of the trough and disappearing into
    the other without any visible outlet. Pilgrims touch
    it on the way through, and some cup their hands
    briefly before moving on.
spawninfo:
  - mobid: 9462
    respawnrate: "20 real minutes"
idlemessages:
- A pilgrim kneels at the edge of the channel, touching
  the water and then pressing a wet hand to their face.
- 'The trough water is noticeably colder than the air:
  mountain-cold, even here.'
- The relief on the back wall has been touched so often
  that the gorge's high point is worn to a shine.
