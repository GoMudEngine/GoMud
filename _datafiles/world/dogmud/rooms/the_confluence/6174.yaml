roomid: 6174
zone: The Confluence
title: Chapel of the Aldren
description: >
  A chapel off the crossing's west side, consecrated to
  the Aldren -- the northern river, which comes down from
  the high country and arrives at the Confluence cold and
  fast and clear. The back wall carries a bas-relief of
  the Aldren's upper reaches: narrow gorge, high stone,
  water running white over exposed bedrock. A
  <ansi fg="itemname">cold-channel</ansi>
  of the same river-water, fed from a source beneath,
  runs in a shallow stone trough along the base of the
  relief wall and disappears back into the floor. The
  crossing is to the east; the west aisle connects to
  the north; the Chapel of the Solt is to the south.
biome: city
