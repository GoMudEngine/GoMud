roomid: 6208
zone: The Confluence
title: The Water Gallery
description: >
  A long gallery running east to west, its south side
  open along most of its length to a wide channel cut
  directly into the floor: the three rivers run here,
  joined into one, moving through this level as a dark
  and steady <ansi fg="itemname">joined-channel</ansi>
  before they find the earth and rock below. You are
  beneath the iron grate in the temple's great hall;
  what the hall presents as a religious monument is
  here simply a fact of water and stone. The hall is
  east; the passage continues west; a stair descends
  further below; a cell opens to the south.
