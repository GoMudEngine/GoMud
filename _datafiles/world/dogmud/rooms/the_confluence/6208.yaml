nouns:
  joined-channel: >
    The channel is cut into the floor along the south
    side of the gallery -- wide enough that you could
    not step across it, deep enough that the lamplight
    does not reach the bottom. Three rivers run in it
    as one: the Aldren, the Brenn, the Solt, meeting
    somewhere upstream and arriving here as a single
    current, black and steady. The water moves without
    haste. The Keepers above built an iron grate and
    called it holy. Down here it is only a river,
    going where water goes.
idlemessages:
- The sound of the joined channel is the loudest
  thing at this depth -- a low continuous motion
  of water, felt in the stone underfoot.
- 'The current in the channel is steady and does not
  vary: three rivers made into one, going somewhere
  below.'
- Cool air rises off the dark water and fills the
  length of the gallery.
