zone: The Confluence
title: The Foundation Vault
description: >
  A vaulted space beneath the temple's main structure,
  wider than the passage that leads in. The ribs of
  the vault overhead are the temple's work -- cut to
  the same standard as the nave above -- but they
  spring from piers of a different stone altogether:
  the same dark, dense pre-Founding material as the
  lower courses in the older corridor. Whatever was
  built here first, the Keepers built the temple's
  own foundations on top of it. The stair-foot is
  east; a passage continues west; a door opens south.
