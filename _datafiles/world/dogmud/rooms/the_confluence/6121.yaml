zone: The Confluence
title: South Quay Gate
description: >
  The quay road narrows here at the Landings' south edge, passing
  between a pair of old posts that no longer carry a bar. Beyond
  them the road runs on south into the Long Quay — more wharves, a
  longer market, the guild halls and counting houses where the
  city's river-trade does its real business. The crossing behind is
  the Quay Crossing, the heart of the Landings; ahead the waterfront
  only widens, the smell of rope and river mud giving way to spice
  and coin and the cries of a working market.
biome: water
