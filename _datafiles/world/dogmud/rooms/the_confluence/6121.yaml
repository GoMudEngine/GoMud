nouns:
  the way south: >
    The road continues past the gateposts into the Long Quay
    district, the bulk of the Confluence's waterfront trade. More
    wharves, more markets, the guild halls and counting houses of
    the city proper. It lies along the same river, the same smell,
    the same sound of moving water under the docks — just more of
    it, and deeper into the city. The road runs on south, open all
    the way.
idlemessages:
- The old gateposts cast short shadows across the road at midday.
- Somewhere south, down the quay road, a market bell rings twice.
- The river smell follows the road south; it never quite leaves you.
