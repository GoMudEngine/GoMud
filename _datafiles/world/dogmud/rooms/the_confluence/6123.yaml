nouns:
  the market bell: >
    A bronze bell hung from an iron crossbar on the junction post,
    its rim worn bright from use. It is rung at market-open and
    market-close, and again when a dispute needs the Weighmaster
    or the Guild Steward. The tone is deep and carries well down
    the quay road and out over the river. The hammer hangs from
    a chain on the post below it.
