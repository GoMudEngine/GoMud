zone: The Confluence
title: The Market Cross
description: >
  The broad junction at the heart of the Long Quay. A stone post
  stands at the center with a bronze bell hung from its crossbar,
  the rim worn bright where the market-keeper's hammer strikes.
  Traffic moves in four directions here: east to the great trade
  wharf, west to the market rows, north back toward the Landings,
  south deeper into the commerce of the city. Voices overlap — the
  calls of carriers, the low talk of factors and buyers, the count
  of coin — and underfoot the stone is worn to a shine from years
  of foot traffic and loaded carts.
biome: water
