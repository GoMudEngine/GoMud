    respawnrate: "20 real minutes"
idlemessages:
- A citizen pauses at the notice-board, reads two
  lines of a posting, and moves on without comment.
- The town crier's voice rings out the noon count
  from this corner — once, twice, then gone.
- A pair of children cut across the north end of the
  square chasing something that has escaped a basket.
