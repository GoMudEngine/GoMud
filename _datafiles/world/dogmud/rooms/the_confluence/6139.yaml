roomid: 6139
zone: The Confluence
title: The North Cross
description: >
  The north side of Tri-Cross Square opens here, the
  paving widening and the buildings to either side
  stepping back from the road to give the square its
  breathing room. A
  <ansi fg="itemname">notice-board</ansi>
  stands on a post at the corner, dense with handbills
  and civic postings pasted over one another in
  chronological layers. At the square's center,
  visible south, the civic monument rises above the
  worn stone of the crossing. The west side of the
  square carries the Municipal Hall's dressed-stone
  facade; the east holds the broad front of the great
  inn. A town crier works this corner at the noon-bell,
  voice pitched to carry to the inn-yard and back.
