nouns:
  notice board: >
    A board mounted on a square post at the corner,
    carrying notices in various stages of age: tide-
    table updates, an ordinance regarding cart-axle
    widths on the processional road, a ferry departure
    change, and several handwritten postings for
    goods for sale or lost items sought. Someone has
    pasted a new bill over the center of an older one
    without reading what was underneath. The board is
    full. It is always full.
