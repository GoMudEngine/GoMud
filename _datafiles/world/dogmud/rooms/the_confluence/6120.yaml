zone: The Confluence
title: Quay Crossing
description: >
  The central junction of the Landings, where Market Lane meets the
  main quay road running north to south. The crossing is always in
  motion: hand-carts and shoulder-loads moving in four directions,
  dockers calling ahead, a bell-post at the center for the shift
  changes that the Quayfolk run their day by. The smell here is
  all-of-it at once: tar, fish, bread, canvas, river mud.
  Cooper's Yard and the Chandlery lie west; the Long Wharf is east.
biome: water
