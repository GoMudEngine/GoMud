zone: The Confluence
title: Processional Avenue, South End
description: >
  The avenue reaches its end here where the stone
  broadens further into the great forecourt ahead.
  The buildings that have kept their distance along
  the whole processional approach give out entirely
  at this point, the city falling away to north and
  sides; what remains is the forecourt and the water
  beyond. To the east a low arch opens into the Hall
  of the Founding, the temple's account of its own
  beginning. The causeway and the island are visible
  ahead to the south across the forecourt's width.
