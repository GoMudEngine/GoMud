idlemessages:
- The avenue's final stretch is quieter than the
  stall-section behind — a deliberate transition.
- Small groups pause here before the forecourt,
  arranging offerings or gathering their party.
- A keeper at the eastern arch catches arrivals who
  look uncertain and directs them where they need to go.
