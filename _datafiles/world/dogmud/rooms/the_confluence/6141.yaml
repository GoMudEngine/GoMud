zone: The Confluence
title: The South Cross
description: >
  The south side of Tri-Cross Square, where the paving
  narrows again and the civic heart of the city begins
  to yield to the processional. A low stone curb and
  a pair of old worn posts mark the square's southern
  edge; the road between them runs on south toward the
  Processional Gate and the great temple district beyond.
  The posts have been here longer than most things in
  the immediate vicinity — their stone is different,
  their surface carved with marks that weather has
  made illegible. The inn's south lane opens east, the
  Municipal Hall's service lane west. The square's
  monument is visible north, centered in the paving.
