idlemessages:
- Citizens moving between the square and the
  processional road pass through here without pausing.
- The civic bell's note reaches even this corner
  of the square, a half-beat behind the west.
- A flower-seller with a handcart takes up a position
  near the south posts for the afternoon trade.
