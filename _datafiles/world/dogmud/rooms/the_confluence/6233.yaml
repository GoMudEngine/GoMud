nouns:
  the signboards: >
    Trade boards hung above the shopfronts: hoop and
    stave for the cooperage, a shuttle for the weaver,
    a clay wheel for the potter. Painted in the same
    basic scheme — dark ground, lighter image — by the
    same hand, years apart. Effective enough that a
    newcomer could find any shop on the row without
    asking.
idlemessages:
- A delivery man pulls up short outside the cooperage
  and checks a wax tablet before going in.
- The clatter of the cooperage mallet beats a steady
  rhythm down the row.
- Two women stop at the corner to talk, neither in any
  visible hurry to be somewhere else.
