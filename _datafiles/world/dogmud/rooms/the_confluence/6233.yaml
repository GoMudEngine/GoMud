roomid: 6233
zone: The Confluence
title: Upper Craft Row
description: >
  The street opens into the head of the craft row, a
  broader stretch than the lanes below it, paved in
  rough setts worn down by years of handcart traffic.
  Shopfronts to either side carry painted
  <ansi fg="itemname">signboards</ansi>
  — a hoop and stave for the cooperage, a shuttle for
  the weaver, a wheel for the potter — the trades
  announced in the shorthand of a street where everyone
  knows everyone and the boards exist more for strangers
  than for neighbors. The sound of work comes from every
  door: wood knocked, a loom's shuttle, someone calling
  through a yard. Tucked between two shopfronts, a
  narrow stair climbs to a shuttered upper workshop, its
  street-facing sign painted over in flat grey — no one
  seems to mind that it stays open anyway. The gate is
  east; the cooperage is west; the row runs south.
