zone: The Confluence
title: The Still Water
description: >
  A small chamber south of the sealed doorway, wholly
  given over to a pool that fills the floor from wall
  to wall -- shallow at the threshold, deeper toward
  the south end where the stone descends below the
  waterline. The water is motionless. The air above
  it is cold in a way that has nothing to do with
  temperature alone -- the quality of a place sealed
  against the world for a long time, come to hold
  a silence of its own kind. Nothing moves in it.
  The doorway is back to the north.
biome: city
