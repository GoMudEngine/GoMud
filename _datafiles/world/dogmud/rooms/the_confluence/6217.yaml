idlemessages:
- 'The surface of the pool is perfectly flat: no
  inflow, no outflow, no current.'
- The cold here has a quality the drowned vault does
  not -- stiller, and more complete.
- Nothing moves in the chamber; the pool seems to
  have been this way for as long as the stone.
