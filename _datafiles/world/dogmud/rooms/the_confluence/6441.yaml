roomid: 6441
zone: The Confluence
title: The Reduction Hearth
description: >
  The smallest of the annex rooms, given over almost entirely to
  a stone
  <ansi fg="itemname">cooking fire</ansi>
  vented through a crude chimney hacked through the workshop's
  original roof — a later addition, by the look of the
  brickwork, and not one anybody sanctioned. A rack of reduction
  pots hangs above the coals, each one blackened and thinned by
  years of scraping, and shelves along the back wall hold jars
  of concentrate boiled down from bulk goods into something
  small enough to carry in a pocket. The smell here breaks from
  the rest of the workshop — burnt sugar and bone broth instead
  of metal and spirit — but is no less part of the same quietly
  unlicensed trade. The main workshop lies back to the east.
biome: city
