nouns:
  cooking fire: >
    A low stone hearth built for reduction work rather than
    meals — no spit, no grill, just a bed of steady coals under
    a rack sized for pots, not pans. The chimney above it is
    patched brick, clearly punched through the roof well after
    the building went up.
idlemessages:
- A pot on the rack simmers down another degree, thickening
  toward whatever it is meant to become.
- The smell of scorched sugar catches for a moment before
  settling back into the room's usual mix.
- A jar of dark concentrate on the back shelf has been labeled
  and relabeled enough times that the original word is gone.
