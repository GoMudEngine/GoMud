zone: The Confluence
title: The Causeway, West Span
description: >
  The causeway begins at the forecourt's east edge,
  its stone wider than it first appears from the bank —
  wide enough for a column of pilgrims to cross without
  crowding. The bridge spans open water. Below and on
  both sides the rivers move, the Aldren and Brenn
  coming together from north and east, the Solt from
  the southwest, the three channels drawing toward one
  another beneath the span as they near the island.
  The island and the temple
  are ahead to the east, their scale growing perceptibly
  as the causeway climbs toward its crown. The forecourt
  is back to the west.
