idlemessages:
- The river's sound is immediately different out here —
  open on all sides, not channeled by walls.
- A pilgrim pauses near the west railing and looks
  down at the joined waters before continuing east.
- The causeway stone is wide and level, worn smooth by
  more crossings than could be counted.
