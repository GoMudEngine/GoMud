idlemessages:
- A stall-holder lights a bundle of incense to show
  a customer how cleanly it takes the flame.
- The smell of beeswax and dried reed is heavy here,
  warm and close, not unpleasant.
- A pilgrim counts coins carefully before deciding
  between two different grades of candle.
