roomid: 6155
zone: The Confluence
title: Processional Avenue, Votive Stalls
description: >
  The votive stalls begin here on both sides of the
  avenue — wood-framed and canvas-roofed, each one
  hung with what pilgrims require for the temple
  approach. Reed wreaths dyed in the Keepers' colors,
  beeswax candles in bundles of three, incense in clay
  sachets, folded votives printed with the ringed seal.
  The stall-holders call their wares in practiced half-
  voices, not loud enough to seem impious this close
  to the temple, loud enough to be understood. The
  avenue's full ceremonial width continues south toward
  the forecourt and the water.
