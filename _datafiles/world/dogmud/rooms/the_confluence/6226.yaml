title: The Bookseller's
description: >
  A cramped shop fitted into what was probably a small
  storage room: shelves floor to ceiling on three walls,
  more books stacked on the floor where the shelves ran
  out of space, a narrow path from door to counter. The
  bookseller's stock is eclectic — trade almanacs,
  printed pamphlets, second-hand academic texts, and
  oddments bought from estates and cleared offices.
  Near the counter, a small crate serves as a display
  for notable stock; among the papers and bound volumes
  in it, an old harbor
  <ansi fg="itemname">damaged-chart</ansi>
  is propped at an angle, its lower half badly stained
  but the junction rendering still visible past the
  damage. The bookseller knows what is in stock and
  does not need to be asked twice.
