nouns:
  damaged chart: >
    A harbor chart on heavy paper, water-damaged across
    its lower third where a brown stain has spread from
    one corner and consumed most of the inshore detail
    along the southern reach. The damage stops well
    short of the junction rendering: the river meeting-
    point is intact, the three main channels drawn in
    the standard professional convention of the period.
    And past the stain, in the area the damage has not
    reached, a fourth channel is drawn with the same
    professional care — narrow, distinct, its course
    running off to the southwest from the junction
    point. It is not a smear or an accident. It is a
    surveyor's line, given the same weight and
    character as the other three. The chart has no
    visible date; the cartouche is among the damaged
    areas.
idlemessages:
- The bookseller moves along the shelves behind the
  counter, pulling volumes to check their condition.
- The books stacked on the floor shift slightly when
  someone steps past them in the narrow aisle.
- The damaged chart in the display crate leans at
  its angle, the junction rendering still clear.
