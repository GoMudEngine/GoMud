zone: The Confluence
title: The Inn-Yard
description: >
  The Three Waters' yard occupies the space between
  the inn's north face and the square road — wide
  enough for a coach-and-four to turn in without
  difficulty, cobbles kept clean by yard staff who
  understand that the first thing a guest sees sets
  a tone. A
  <ansi fg="itemname">mounting-block</ansi>
  of dressed stone stands at the yard's entrance, its
  tether-ring recently re-mortared. The stable eaves
  run along the north side; the smell of horse and
  straw is present but managed. Arriving coaches and
  road-weary animals are handed off here with the
  practiced efficiency of a house that sees heavy
  traffic and has organized itself accordingly. The
  inn's common-room door opens south; the Civic Stores
  occupy the building to the east.
