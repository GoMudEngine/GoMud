nouns:
  mounting block: >
    Two steps of dressed stone, the top surface worn
    smooth by years of boot-leather. The iron tether-
    ring fixed beside it is set into a sound stone
    anchor and has been recently re-mortared — the
    new work is cleaner than the block around it.
    The yard keeps this in good order because it is
    the first thing a rider sees on arrival, and the
    Three Waters is a house that considers what its
    guests see first.
idlemessages:
- A stable-hand leads a road-weary horse under the
  eave stalls, speaking to it in low unhurried tones.
- A coach has recently arrived; the yard-cobbles still
  carry the scrape of wheel-iron on the stone.
- Pigeons work the yard's far corner, finding what
  the horses have missed.
