nouns:
  the gate: >
    A plain iron gate set into the outer wall of the
    Scholars' Quarter — bars worn dull, mortar cracked
    at the jamb, the lintel low enough to require
    attention. On the scholars' side it is an
    afterthought; on the craft side it is simply the
    door at the end of the block. It stands open most
    of the day.
idlemessages:
- A handcart loaded with staved timber passes through
  the gate heading west, the driver not slowing.
- The gate stands open; it is rarely closed, and the
  hinges show the fact.
- The smell of the working quarter seeps through the
  arch even when the gate is latched.
