roomid: 6232
zone: The Confluence
title: The Artisans' Gate
description: >
  The outer wall of the Scholars' Quarter closes this
  end of the garden walk, and the
  <ansi fg="itemname">gate</ansi>
  in its western face is plainer than any entrance the
  scholars would claim — iron-barred, set between
  dressed courses, the passage low enough that a tall
  man ducks. Past it, the city changes register: the
  paving underfoot becomes irregular, older, repaired
  in patches by whoever had material to hand rather
  than by civic order. The air carries the smell of
  cut timber, hot iron, and something charred, all at
  once. The garden walk is east; the craft quarter
  opens west.
biome: city
