nouns:
  the well: >
    A stone-coped well under a low wooden cover, the
    rope worn to a softness that suggests regular use
    spanning generations. The coping-stones are cut in
    an older style than the surrounding buildings —
    tighter joints, a harder stone. The water is still
    good; the old man will tell you this if you ask and
    sometimes if you do not.
idlemessages:
- The old man on the bench watches the lane without
  urgency; he has watched it for many years.
- The well rope hangs loose over the coping; whoever
  last drew water did not wind it back.
- A puddle of spilled water from the morning's drawing
  is drying slowly in the shade of the well-house.
