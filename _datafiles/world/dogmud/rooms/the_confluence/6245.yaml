title: The Well-Court
description: >
  The lane ends at a small court built around a covered
  <ansi fg="itemname">well</ansi>
  — older than the houses on any side, the stonework of
  the well-coping a different grade of cut from the
  tenement walls. The well still draws, though fewer
  people use it since the pump was added in the court
  above. An old man sits on the bench at the well's
  base in the particular way of someone who has sat
  there enough that the bench has come to mean him.
  Children bring water from the pump these days; the
  old man still draws from the well, and has his reasons.
  The court is to the north.
