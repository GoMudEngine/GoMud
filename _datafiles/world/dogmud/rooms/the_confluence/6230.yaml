roomid: 6230
zone: The Confluence
title: The Deep Stacks
description: >
  The western end of the archive, where the shelves
  grow closer together and the materials older. The
  lamp-light from the main room does not reach here
  without effort; the Archivist keeps a small oil lamp
  on the end-cap of the last row, its wick trimmed low
  between uses. The shelving here holds the oldest
  acquisitions: surveys that predate the current city's
  founding, field notes in hands no one living trained
  under, correspondence in at least one dialect no
  longer spoken at the junction. The floor is
  undisturbed; dust settles slowly and evenly between
  visits. Against the end wall stands a heavy
  <ansi fg="itemname">locked case</ansi>
  of iron and glass, its contents the most fragile
  holdings of the entire collection.
