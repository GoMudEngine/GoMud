nouns:
  the locked case: >
    A heavy case of iron-banded glass set into the end
    wall of the Deep Stacks — its double doors secured
    by a lock whose key is not kept in this room or in
    the archive proper. Inside: pre-Founding survey
    fragments, the most fragile pieces the Margin
    holds, some of them on material that would not
    survive being unrolled without careful preparation.
    The glass is thick enough to muffle the room's
    sounds. One fragment, pressed flat against the near
    panel, shows a portion of the river junction. The
    channel lines are difficult to make out through the
    glass without better light than the end-cap lamp
    provides. Access goes through the senior Margin.
    The key is not here.
idlemessages:
- The end-cap lamp burns low, its wick trimmed for
  waiting between uses.
- Dust settles undisturbed across the oldest shelves —
  the collection in here is consulted rarely.
- Through the glass of the locked case, the oldest
  survey fragments hold their shape without moving.
