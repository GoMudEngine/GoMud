roomid: 6211
zone: The Confluence
title: The Echoing Walk
description: >
  A passage that carries sound from the gallery
  strangely, compressing it and returning it changed.
  A footstep here comes back as something slightly
  wrong, from an angle that does not match the walls.
  The pre-Founding builders knew what they were doing
  with this stone; whether the echo is deliberate is
  not clear. The walls are uncarved, the floor clean
  and level. It has the shape of a passage -- but it
  ends here, at a blank wall of fitted stone, as though
  it once led somewhere that has since been closed off.
  The gallery is back to the east.
