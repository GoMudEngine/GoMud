idlemessages:
- 'A footstep echoes back after a pause: the timing
  is slightly off and the direction wrong.'
- The walk ends at a blank fitted wall: a passage that
  goes nowhere now, or once went somewhere since sealed.
- The sound of the gallery's channel arrives here
  as something lower and less distinct than the room
  behind you would suggest.
