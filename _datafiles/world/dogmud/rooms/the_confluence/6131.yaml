nouns:
  the charts: >
    Stacks of hand-copied harbor charts and river maps, the newer
    ones drawn clean on good parchment, the older on something
    stiffer and yellower. A few of the oldest show the junction
    area with more channel-lines than current maps carry — more
    water, differently distributed, the notation in a hand that
    predates the guild's current forms. Whether these reflect
    genuine older survey work, copyist error propagated through
    generations, or something else, the Scrivener cannot say with
    certainty. They are priced the same as the rest.
  old charts: >
    The oldest charts in the stall, on stiff yellowed stock in a hand
    that predates the guild's forms. Set against the current maps they
    disagree on one thing in particular: the count of waters at the
    junction. Where today's charts show three rivers meeting, several of
    these draw a fourth — a narrow channel running off to the southwest,
    struck through in some copies and re-marked in others, as though
    generations of copyists could not agree whether it belonged. One of
    the records the Margin would want compared.
