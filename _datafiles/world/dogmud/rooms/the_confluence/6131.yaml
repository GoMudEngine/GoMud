roomid: 6131
zone: The Confluence
title: The Scriveners' Stall
description: >
  A stall and back-room together at the Weighhouse Yard's western
  end, the Scrivener's trade stacked in bins and flat-cases under
  the counter. Trade charts, certified copy-work, river-guild forms,
  and a selection of <ansi fg="itemname">old-charts</ansi> fill the
  shelves. The charts are
  hand-copied, recopied from earlier copies, and some of the older
  ones show the river-junction here a little differently — more
  channels marked in, more detail at the confluence-point — in a
  way that may be error or may be older survey work. The Scrivener
  neither vouches for them nor dismisses them. They were sold
  with the rest.
