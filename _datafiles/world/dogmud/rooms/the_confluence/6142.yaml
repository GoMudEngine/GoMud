nouns:
  bell-tower: >
    The civic bell-tower stands west of the hall
    approach — shorter than the hall itself and older,
    its lower courses a darker stone than the civic
    limestone of the building beside it, as though
    found here and built around rather than raised
    fresh. The bell in the open upper chamber is
    visible from the steps: a substantial casting,
    green-patinated, hung in a timber frame. It rings
    the quarter-hours with a single note and counts
    the full hours plainly. The tower's base is worth
    examining more closely.
idlemessages:
- Citizens climb or descend the hall steps in the
  purposeful rhythm of civic appointment.
- The bell rings once from the tower to the west —
  a quarter-hour marked and passed.
- A pigeon has claimed the top step near the east
  column and is being largely ignored.
