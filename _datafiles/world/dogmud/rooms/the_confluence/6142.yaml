roomid: 6142
zone: The Confluence
title: The Hall Steps
description: >
  The broad approach stair to the Municipal Hall, carved
  from the same limestone as the hall's facing but worn
  considerably more — the outer edge of each tread
  rounded and hollowed by the passage of feet over a
  long civic life. The steps are wide enough to make the
  climb feel deliberate rather than merely necessary,
  which is the point of broad approach stairs. The hall's
  entrance above is flanked by plain stone columns, their
  capitals simple. To the west, the
  <ansi fg="itemname">bell-tower</ansi>
  rises squat and older than everything around it, the
  civic bell visible in its open upper stage. The square
  lies to the east; the hall's south service lane
  descends below.
biome: city
