roomid: 6213
zone: The Confluence
title: The Antechamber
description: >
  A broad, low room that opens between the landing
  and whatever lies further west. The walls here
  carry faint traces of something applied long ago --
  a pigment, or a gesso ground, too degraded to read
  but indicating that this space was once prepared
  and decorated. A few marks survive as ghost shapes:
  the arc of something, the edge of a line. The floor
  is swept clean, which means someone comes here; the
  dust should be deeper than this. The landing is
  east; the way west ends at a door; a vault opens
  to the south.
biome: city
