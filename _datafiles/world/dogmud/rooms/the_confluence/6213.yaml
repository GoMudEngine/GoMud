idlemessages:
- The ghost marks on the walls suggest preparation --
  a space between the ordinary and something else.
- 'The floor is clean for this depth: the dust has
  been disturbed more recently than the age implies.'
- A very faint smell of lamp oil lingers here --
  someone has been down with a light, not long ago.
