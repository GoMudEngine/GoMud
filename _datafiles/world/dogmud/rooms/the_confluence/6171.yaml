idlemessages:
- A pilgrim moves slowly south along the aisle, one hand
  trailing the pillar-bases as they go.
- 'The high windows on this side catch the early light:
  long pale bars across the floor, shifting through the
  morning.'
- A pair of worshippers confer in low voices near the
  aisle's far end, comparing notes on the chapel ahead.
