zone: The Confluence
title: The East Aisle
description: >
  The east aisle runs parallel to the nave on the
  temple's far side, quieter than the central walk and
  slightly shadowed under the high windows. A bracket
  of wrought iron holds candles at each pillar-base,
  and the floor near these is marked by generations of
  dripped wax now pressed smooth by foot-traffic. The
  nave is back to the west; the Chapel of the Brenn
  opens at the aisle's south end, on the crossing's
  east side.
