nouns:
  the notice post: >
    A worn post at the center of the market square,
    its surface too small for the amount posted to it
    — chalk boards overlapping, paper scraps pinned
    four deep in places. The oldest layers have gone
    entirely illegible, which does not stop new ones
    being added on top.
idlemessages:
- A boy ducks under a stall-table and comes up on the
  other side faster than the stallholder expected.
- The fish-seller calls a price down the row that no
  one appears to take up.
- Two buyers argue the quality of a string of onions
  with the focused urgency of people who have the
  morning free.
