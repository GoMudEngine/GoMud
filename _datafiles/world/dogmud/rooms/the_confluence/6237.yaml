roomid: 6237
zone: The Confluence
title: The Daily Market
description: >
  The row opens into a wider space where the quarter's
  daily market has been held since the quarter existed.
  Produce stalls line the north side — root vegetables,
  onions, river fish on beds of wetted grass, preserved
  olives in an open jar, a woman selling herb bundles
  by the armful. A
  <ansi fg="itemname">notice-post</ansi>
  occupies the center of the square, layered in chalked
  boards and pinned scraps: work wanted, goods for sale,
  a reward offered for a missing dog described in enough
  detail to suggest the reward is serious. Children move
  around the stalls at the speed of children who want
  something and have not been given it. The potter's is
  north; the baker's is west; the smithy is south.
