nouns:
  the wharf: >
    The Long Quay's main trading face, built of close-fitted stone
    and heavy timber, rebuilt and extended so many times the seams
    show different stone in different ages. Iron rings are set every
    four paces for mooring; at each one a vessel of some kind is
    always tied. The boards of the loading section are dark with old
    oil and river silt. The sound is constant — the creak of rope
    against iron, the thump of a bale going down, the water under
    the planking never quite still.
