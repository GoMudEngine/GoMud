roomid: 6124
zone: The Confluence
title: The Long Quay
description: >
  The great trade wharf that gives the district its name runs along
  the river's edge, wide enough for two laden carts to pass abreast.
  To the east the water, broad and quick-running; moored along the
  face are deep-keeled barges under the low creak of rigging and
  the smell of tar and river silt. Cargo moves in both directions —
  bales being swung up from holds, casks rolled down planks to
  waiting carts — and the factor's voice carries over it all, steady
  and carrying the full authority of the quay. The river works here.
  It always has.
biome: water
