idlemessages:
- 'One cell door stands open: inside, a neatly made cot,
  a shelf with a candle and a book, nothing else.'
- The corridor is empty and quiet; the cells here are
  for sleeping and for nothing louder.
- 'Footsteps approach from deeper in the corridor: a
  door closes, and the quiet returns.'
