roomid: 6194
zone: The Confluence
title: The Cells
description: >
  A plain corridor lined with the Keepers' sleeping cells,
  each behind a wooden door fitted with a simple latch and
  no lock. The doors are close together; the cells are
  narrow. There is nothing in the corridor to indicate
  whose cell is which -- no names, no marks -- but the
  Keepers know without looking. The South Walk is back
  to the north.
