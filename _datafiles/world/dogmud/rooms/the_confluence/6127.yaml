title: The River Market
description: >
  Market stalls line the western face of the quay here, packed in
  close under a shared run of awning-poles hung with oiled canvas.
  The goods are practical — salt and grain and rope and cooking
  oil, cured meat hung in loops, jars of river-honey, bundles of
  dried rivergrass for livestock bedding. The sellers call their
  prices with the tired ease of long habit. This is not where the
  grand trade of the quay gets done; this is where the city feeds
  itself, day by day, from boats that come down the Aldren and
  the Brenn and the Solt every morning.
