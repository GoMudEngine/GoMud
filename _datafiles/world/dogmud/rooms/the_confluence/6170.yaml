zone: The Confluence
title: The West Aisle
description: >
  A passage running alongside the nave on its west side,
  narrower than the central walk and quieter. Candle-
  racks stand at intervals against the outer wall, each
  holding many small flames left by those seeking the
  rivers' attention for one thing or another. The nave
  is back to the east; the Chapel of the Aldren opens
  at the south end of the aisle, where the passage
  gives onto the crossing-side chapels.
