idlemessages:
- A pilgrim lights a small candle at the rack and sets
  it carefully among the others before standing again.
- The aisle smells of beeswax and old stone, which is
  to say it smells of every hour the temple has stood.
- 'The candle-rack is crowded this morning: the names
  they are lit for are nowhere written down.'
