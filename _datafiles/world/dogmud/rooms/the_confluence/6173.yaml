nouns:
  altar flame: >
    A small fire burning in a bronze dish on the altar
    stone -- not showy, not ceremonial in its size, but
    present. The Keepers tend it continuously; it has
    not gone out, they will say, in the temple's full
    accounting of itself. Whether that is precise or
    simply what keepers say, the flame itself does not
    clarify.
idlemessages:
- A keeper tends the altar-flame, adding a measure of
  oil from a leather-covered flask without ceremony.
- 'The altar fire is steady and small: it does not
  perform; it is simply present, as it has been.'
- A worshipper in the sanctuary kneels on bare stone
  with the careful discomfort of genuine intention.
