roomid: 6173
zone: The Confluence
title: The Sanctuary
description: >
  Beyond the crossing, the temple narrows again into the
  sanctuary -- the innermost space open to the public,
  set a step above the crossing floor. At its center a
  stone altar holds a small
  <ansi fg="itemname">altar-flame</ansi>,
  burning in a bronze dish that the Keepers replenish
  through the day. The walls are plain dressed stone of
  the same age as the crossing, with shallow carving at
  the capitals. The Chapel of the Solt opens to the
  west; a disused alcove is set into the east wall; the
  reliquary lies deeper to the south.
