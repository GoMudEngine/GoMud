    respawnrate: "20 real minutes"
idlemessages:
- The scribe does not look up; the work requires a kind
  of deliberate forgetting of everything else.
- 'Quills and ink-stands are set out at every desk: the
  room is ready for more scribes than are here.'
- Light falls across the desks in long clean lines from
  the north windows.
