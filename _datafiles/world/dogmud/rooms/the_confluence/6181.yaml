zone: The Confluence
title: The Gallery
description: >
  A broad upper room above the nave, reached by the
  corner stair, with a low rail at its south edge looking
  out over the full length of the nave below. From here
  the geometry of the temple is clear at a glance -- the
  nave stretching back to the narthex doors in the north,
  the crossing visible beyond, the chapels flanking.
  The gallery walk continues south along the rail above
  the crossing. The stair descends to the nave below.
