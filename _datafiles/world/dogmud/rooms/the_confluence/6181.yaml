idlemessages:
- A visitor leans on the gallery rail, watching the
  worshippers move below without hurry.
- 'The view from here is instructive: the whole nave
  legible in one look, the crossing framed beyond.'
- The sound of the water from below rises here more
  clearly than anywhere in the nave itself.
