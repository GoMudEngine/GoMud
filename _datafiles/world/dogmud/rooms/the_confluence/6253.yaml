title: The Eastern Landing
description: >
  The eastern landing, where the Brenn's east bank
  widens enough for boats to draw up without using
  the wharf proper — a graveled shelf of bank, planked
  over at the water's edge, where smaller craft can
  unload without ceremony. The river runs along the
  landing's east side, visible and close; the Brennside
  wharf is a short walk west. The landing sees fewer
  people than the main wharf but handles the traffic
  that wants to avoid it — a quiet convenience at the
  edge of the east quarter.
