    respawnrate: "20 real minutes"
idlemessages:
- The barge shifts on its lines as the current nudges beneath the dock.
- Gulls circle the dock end, riding the river wind without moving their wings.
- A rope end trailing in the water wraps and unwraps around a dock piling.
