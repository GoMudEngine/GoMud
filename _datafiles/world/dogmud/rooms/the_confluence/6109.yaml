roomid: 6109
zone: The Confluence
title: The Barge Dock
description: >
  A timber dock juts east from the quay road, its planking worn
  grey and smooth. A broad flat-bottomed barge is moored alongside,
  hull dark from years on the river, cargo rings and rope coils on
  its deck. This is the regular run between the Confluence and New
  Plymouth — the barge works the river channel south, takes freight
  and passengers both, and knows the way by long habit. The smell
  of river mud is strong here, and tar, and old wet rope. A second
  mooring closer to the quay road serves passage only — the Grey
  Heron bound upriver for Stillwater, the Broadbeam down to New
  Plymouth — where a chalked <ansi fg="itemname">sailings
  board</ansi> is kept beside the <ansi fg="mobname">passage
  agent</ansi>'s crate.
biome: water
coord: {x: -4, y: -54, z: 0}
exits:
  west: {roomid: 6108}
  south: {roomid: 6110}
nouns:
  the barge: >
    A flat-bottomed river barge, wide and low, built for cargo and
    the patient pace of a slow river. Its hull is stained with
    years of river silt and calked fresh each spring; the deck
    planks are worn pale from boot and freight. A single sweep oar
    lies shipped, and a coil of dock rope is neatly set on the
    near bollard. The run south takes two days on a favoring
    current and three against one; the Barge Master knows every
    bend.
  sailings board: A weathered board propped against a piling near
    the passage agent's crate, its chalk columns marking passage
    upriver aboard the Grey Heron to Stillwater and downriver aboard
    the Broadbeam to New Plymouth, rewritten each time the current
    has its say.
