nouns:
  the river nets: >
    A spread of fine-mesh river net, the kind used from
    a flat-bottomed punt to catch small fish in the
    calmer bends. Three tears in the mesh have been
    marked with bright cord — the net is serviceable
    but in need of an afternoon's mending work.
idlemessages:
- A net is spread across the fence for inspection, the
  tears marked with a twist of bright cord.
- The flat-bottomed boat is not here; it is out on the
  water or stored elsewhere in the quarter.
- The smell of fresh river-clay and scale comes off
  the nets in the morning air.
