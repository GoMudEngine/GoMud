zone: The Confluence
title: The Riverman's House
description: >
  A single house at the end of a stub of lane, slightly
  wider than its neighbors, with a low fence that marks
  the boundary without keeping anything in or out. Nets
  of various sizes hang to dry from a frame in the small
  front yard —
  <ansi fg="itemname">river-nets</ansi>
  of the type set from a flat-bottomed boat with a long
  pole, now out of the water and in need of mending in
  several places. The house smells of river water and
  scale, which is the smell of a household where someone
  comes home from the water every morning. The lane is
  to the east.
