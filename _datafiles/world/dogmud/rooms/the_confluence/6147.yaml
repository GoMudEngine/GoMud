roomid: 6147
zone: The Confluence
title: Inn Lane
description: >
  A cobbled passage between the Three Waters' south wall
  and the row of buildings facing it — service access
  rather than street, carrying the people who need it
  and no others. The inn's kitchen hatch opens onto the
  lane here; the smell of stew-stock and woodsmoke comes
  through it in steady warm drafts, along with the
  occasional percussion of iron on iron from whoever is
  running the pots. A row of empty barrels stands against
  the inn's wall waiting for the dray. The lane connects
  the south edge of the square to the east through to
  the notary's building, and to the hall side west.
