idlemessages:
- The kitchen hatch opens briefly; a wash of steam and
  stew-smell rolls into the lane and the hatch closes.
- A potboy navigates the lane with a stack of empty
  pottery, going somewhere with purpose.
- The barrels against the inn wall have been here long
  enough that someone has chalked a running tally on
  one of them.
