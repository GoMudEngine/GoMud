zone: The Confluence
title: The South Walk
description: >
  The covered walk along the garth's south side, its
  arches facing north onto the garden and the well. The
  walk connects the refectory to the west with the cells
  to the south, the garth open through the arcade between
  them. By mid-morning the cloister keeper has usually
  finished the garden work, and the south walk is briefly
  empty between the breakfast bell and the midday office.
  The Cloister Garth is back to the north.
