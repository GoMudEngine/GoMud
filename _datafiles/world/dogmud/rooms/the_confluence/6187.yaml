idlemessages:
- 'The walk holds a trace of kitchen-smoke at this hour:
  the refectory is not far to the west.'
- Sunlight through the arcade falls across the paving
  in a line that moves through the morning.
- A door bangs somewhere in the cells corridor; someone
  is coming or going without haste.
