roomid: 6185
zone: The Confluence
title: The Cloister Garth
description: >
  The central quadrangle of the cloisters, open to the
  sky at its center and covered on all four sides by a
  low arcade of pale stone. A shallow
  <ansi fg="itemname">garth-well</ansi>
  stands at the middle of a garden plot, surrounded by
  herbs and river-plants in careful rows. A cloister
  keeper moves among them with quiet purpose. The whole
  of the inner temple's life turns around this space --
  the walks branch north, south, and east from the arcade
  columns, and the gate passage lies to the west.
