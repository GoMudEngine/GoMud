nouns:
  garth-well: >
    A well of plain dressed stone at the center of the
    garth, fitted with a wooden cover and a wind-worn
    rope. It serves the kitchen and the infirmary both;
    the rope's fraying tells how often. The water is
    cold and very clear.
spawninfo:
  - mobid: 9470
    respawnrate: "20 real minutes"
idlemessages:
- A cloister keeper passes through the garth at an unhurried
  walk, not pausing for the stranger.
- 'The arcade frames the sky in a square: a pale rectangle
  of open air above the herb-beds.'
- Bees work the river-plants in the garden, as unhurried
  as the Keepers themselves.
