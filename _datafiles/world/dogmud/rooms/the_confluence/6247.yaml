idlemessages:
- A laden cart rumbles past toward the east bank, the
  driver nodding without slowing.
- 'The wind on the bridge crown carries two smells: the
  river below, and dry country ahead to the east.'
- The Brenn slides by underneath, broad and unhurried,
  carrying the city's traffic of barges south.
