title: The Brenn Bridge, Crown
description: >
  The high point of the bridge, where the span levels
  over the middle of the Brenn. The eastern river runs
  broad and brown beneath, slower than the joined waters
  off the temple island and the wider for it. The city
  stands at your back to the west — roofs, the civic
  bell, the temple beyond; ahead to the east the far
  bank rises, lower and plainer, the road climbing away
  toward open country. The bridge runs on both ways.
