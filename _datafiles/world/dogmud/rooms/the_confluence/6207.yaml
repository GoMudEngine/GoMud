idlemessages:
- The piers cast deep shadows in the lamplight; the
  hall has more dark in it than light.
- 'The ceiling slabs are fitted without mortar: they
  hold by weight and the precision of the cut alone.'
- A low reverberation moves through the floor when
  you step -- the water is very near beneath.
