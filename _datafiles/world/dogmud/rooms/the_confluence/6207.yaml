zone: The Confluence
title: The Pillared Hall
description: >
  A hall of unexpected scale for the depth: eight
  square piers in two rows carry a ceiling of fitted
  slabs, each pier cut from the same dense stone as
  everything below the seam. The piers are not
  decorated, but they are precisely placed -- the
  spacing is exact, and the ceiling they carry has
  not shifted in whatever span of time they have been
  standing. This was built to last, by people who
  knew how. The landing is east; the way continues
  west; an alcove opens to the south.
