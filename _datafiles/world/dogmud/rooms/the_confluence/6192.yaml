idlemessages:
- Light from the garth falls through the arcade in
  long intervals between the columns.
- 'A Keeper passes through quickly, not pausing:
  the east wing has its own rhythm.'
- The worn tracks in the paving stone run true;
  the feet that made them knew where they were going.
