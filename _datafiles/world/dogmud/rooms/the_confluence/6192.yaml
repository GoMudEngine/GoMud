zone: The Confluence
title: The East Walk
description: >
  The covered walk along the garth's east side, its
  arches opening onto the garden and well. The walk
  connects the garth to the west with the prioress's
  wing to the east, and with the infirmary to the
  south. Keepers pass through at irregular hours; the
  stone is worn smooth in two tracks where feet have
  found their habit. The Cloister Garth is back to
  the west.
