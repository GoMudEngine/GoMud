roomid: 6161
zone: The Confluence
title: The Pilgrim Dormitory
description: >
  A plain room above the hall, given over to sleeping
  places — low wooden bunks with thin mattresses and
  folded blankets, each numbered in chalked figures
  that the keepers update as occupancy shifts. The
  room smells of travelers, which is to say of road-
  dust, damp wool, and the particular warmth of a
  space that is never long empty. A narrow window in
  the north wall looks down over the Processional
  Avenue — from here the full sweep of the ceremonial
  approach is visible, the avenue running north toward
  the gate-piers, the city's rooftops beyond. The stair
  descends to the hall below.
