idlemessages:
- A pilgrim on an upper bunk studies the ceiling with
  the concentration of the road-tired.
- The window shows the avenue below, busy enough at
  this hour to watch and quiet enough not to intrude.
- A pair of boots stands paired beside one bunk, set
  down with the precise care of exhaustion.
