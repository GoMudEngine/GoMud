roomid: 6221
zone: The Confluence
title: The Great Archive
description: >
  The Margin's library — a long, high-ceilinged room
  lined with shelving from floor to a gallery that
  runs along the upper walls, accessible by two rolling
  ladders on brass rails. The shelves hold the scholars'
  primary source materials: original surveys and field
  notes rolled and boxed and catalogued, old civic
  documents on loan from the Hall of Records, and the
  accumulated purchases of several decades of
  scholarship. The smell here is different from the
  meeting hall — older, dustier, the specific dry scent
  of old vellum stored correctly. The Archivist works
  the upper gallery with a lamp and a catalogue,
  pulling boxes and checking contents with the
  methodical efficiency of long practice. To the west,
  the shelving continues into the Deep Stacks, where
  the oldest materials are kept.
