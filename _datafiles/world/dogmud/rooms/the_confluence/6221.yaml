nouns:
  the shelves: >
    Rows of shelving in old dark-stained wood, their
    contents catalogued with a system of notched tags
    on each box or roll. The arrangement is densest
    near the top of the stacks — the Archivist's
    domain, accessible only by ladder — and more
    orderly at eye level, where materials in regular
    use live. A few shelves near the east door hold
    items flagged for return to the Hall of Records;
    the loans have been running for some years.
  the ladders: >
    Two rolling ladders on brass rails, allowing
    access to the upper gallery and the highest
    shelves. One is currently positioned below the
    Archivist; the other has been left at the south
    end of the room and not moved since. The rails
    show the particular wear of long use — smooth
    at the points where the ladders most often stop,
    lighter elsewhere. The brass has not been polished
    in some time and has taken on a warm brownish cast.
idlemessages:
- Above, the Archivist pulls a document box and
  checks the catalogue entry against its contents.
- The ladders make a faint metallic sound as they
  settle on the rails — no one has moved them recently.
- The archive holds a quiet denser than the court
  outside — the shelves themselves seem to absorb it.
