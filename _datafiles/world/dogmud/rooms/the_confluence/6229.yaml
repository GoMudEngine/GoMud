nouns:
  the fig tree: >
    A substantial fig tree in the court's center, its
    trunk the diameter of a large cask, its roots
    arching visibly where they have lifted the
    surrounding flagstones. The adjacent stones were
    relaid to accommodate the roots some years ago,
    with a slight gap left around the base. The tree
    is not in season; its leaves cast even shade, and
    its roots hold the accumulated moisture of the
    season in the yard's stone-and-soil base. It is
    the oldest living thing in the Scholars' Quarter.
  the bench: >
    A low stone bench set against the archive's south
    wall in the fig tree's afternoon shade. The surface
    is worn smooth from use — not dramatically smooth,
    not famous for it, simply used until the stone is
    no longer rough. The kind of smooth that accumulates
    without anyone deciding it. Scholars sit here
    between sessions when the weather permits; the bench
    asks nothing of them and they ask little of it.
idlemessages:
- The fig tree's leaves shift in a breath of air
  that does not reach the surrounding rooms.
- The city's noise arrives here muffled and gentle,
  at a distance that makes it easy to ignore.
- The worn stone bench holds the morning's warmth
  into the afternoon without effort.
