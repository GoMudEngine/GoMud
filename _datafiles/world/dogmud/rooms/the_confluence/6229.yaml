roomid: 6229
zone: The Confluence
title: The Quiet Garden
description: >
  A small courtyard enclosed by the archive's south
  wall and the backs of the lodgings and copyists'
  rooms, open to the sky with no passage to the wider
  city from here. A fig tree grows in the court's
  center, its roots lifting the nearest flagstones
  slightly; it has been here long enough that the
  stones were relaid around it rather than replaced.
  A stone bench worn smooth from use sits against the
  archive wall, shaded by the tree in the afternoon.
  The city's noise — carts, voices, the occasional
  barge-horn from the river — is audible here but
  distant, filtered by the walls to something
  manageable. A gravel walk extends west along the
  garden's far edge.
