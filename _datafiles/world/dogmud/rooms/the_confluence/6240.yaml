nouns:
  the clay: >
    Raw grey clay in rough-sewn sacks, sold by the
    pound. The sacks are open at the top; anyone can
    test the texture before buying. Good for wheel-work
    or general ceramic use; the potter down the street
    uses the same stock.
  the dye powder: >
    Dye powders in undyed cloth sacks labeled in the
    stall-keeper's cramped hand — weld yellow, woad
    blue, madder red, oak-gall black. The sacks sit
    in a row on the second shelf, each tied off with
    a different color of cord to speed identification.
  the thread: >
    Thread on card-wrapped bolts — linen thread in two
    weights, a wool thread in three, and one bolt of
    something finer that the label calls silk-weight
    cotton, which it almost certainly is not, but which
    the weaver up the street buys for finishing work
    and has not complained about.
idlemessages:
- The stall-keeper makes a note in a small ledger and
  tucks it back under the counter without comment.
- A craftsman from the row comes in and knows exactly
  which bin holds what without reading the labels.
- The clay sacks at the base of the shelf are worn
  smooth where hands have tested the weight.
