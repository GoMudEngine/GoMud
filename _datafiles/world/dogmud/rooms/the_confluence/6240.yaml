roomid: 6240
zone: The Confluence
title: The Craft-Supply Stall
description: >
  More a permanent stall than a shop — its front wall
  folds up entirely to reveal the shelving behind it,
  and the stock is arranged in the logic of whoever
  laid it in rather than any system a stranger might
  guess at. Bags of raw
  <ansi fg="itemname">clay</ansi>
  are stacked beside sacks of
  <ansi fg="itemname">dye-powder</ansi>
  in undyed cloth; nails sold by the handful from iron
  bins; bolts of undyed
  <ansi fg="itemname">thread</ansi>
  in various weights wound on card. The stall serves
  all of the trades in the quarter and knows it — the
  stock covers enough range that there is rarely a need
  to go further for basic materials. The smithy is to
  the west.
