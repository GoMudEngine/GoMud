idlemessages:
- The common room's talk runs under the creak of the
  settle-boards and the chink of pottery cups.
- A traveler by the fire asks the room whether the
  Solt ferry is running today and gets three different
  answers.
- The innkeeper moves behind the bar with the calm of
  someone who has had a full house before and is
  having one now.
