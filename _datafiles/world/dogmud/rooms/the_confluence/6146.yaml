roomid: 6146
zone: The Confluence
title: The Three Waters
description: >
  The common room of the Three Waters is wide and warm,
  its great
  <ansi fg="itemname">hearth</ansi>
  taking up most of the north wall, the settle nearest
  it already occupied by the time most people arrive.
  Long tables run the room's center in the habit of a
  house that regularly feeds a full house; smaller
  settle-tables line the walls for those who want to
  be heard only by the person across from them. The
  smell is stew and woodsmoke and the specific warm
  compound of a room that has been feeding people for
  years without interruption. The city's gossip moves
  through this room — who is coming, who has gone,
  what the morning tide brought in, what the hall
  decided about the river tariffs this quarter. The
  innkeeper keeps track of all of it from behind the
  bar. A broad
  <ansi fg="itemname">stair</ansi>
  climbs from the east corner to the lodging rooms
  above.
