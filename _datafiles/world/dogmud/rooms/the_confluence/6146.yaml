nouns:
  hearth: >
    A stone hearth deep enough to burn a full round of
    river-oak, its lintel smoke-blackened and its fire-
    basket wide. The settle nearest it has been worn to
    the shape of habitual occupancy — a cushion
    permanently depressed at its center, the back-rail
    polished by shoulders. On the mantelpiece: a tallow
    candle in a clay saucer, a pair of iron tongs on a
    hook, and a carved wooden fish that has been there
    as long as any member of staff can remember and
    that no one in the house has a story about.
  stair: >
    A solid stair of wide oak treads climbing from the
    room's east corner to the lodging floor above, its
    banister rail worn to a shine by ascending hands.
    A chalk board on the newel-post lists room
    availability in the innkeeper's round, unhurried
    hand. The stair is wide enough for guests carrying
    baggage to pass on it without difficulty, which is
    not always the case.
