nouns:
  gate-arch: >
    The arch in the city's east wall, dressed stone
    with the Confluence's crest at the keystone, wide
    enough for a laden cart. Through it the road
    continues east, the paving running level past
    the wall toward open country and the distant town
    of Greenford. The gate stands open, as the east
    gate has stood since the city was young.
