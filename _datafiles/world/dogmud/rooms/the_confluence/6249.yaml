idlemessages:
- A gate guard nods a traveler through, marking
  something in a ledger without breaking pace.
- A farmer's cart comes in from the east, the driver
  calling the load without being asked.
- The guards at the east gate change shift without
  ceremony, one set of eyes replacing another.
