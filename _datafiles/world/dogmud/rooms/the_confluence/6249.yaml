roomid: 6249
zone: The Confluence
title: The East Gate
description: >
  The east gate of the Confluence, a wide arch of
  dressed stone where the road from the Brenn bridge
  passes through the city wall and continues east
  toward open country. Gate guards keep the passage
  here — recording carts and noting travelers, working
  through the day without particular urgency. The road
  from the bridge comes in from the west; the way east
  through the
  <ansi fg="itemname">gate-arch</ansi>
  runs toward Greenford and the wider world. The
  Brennside wharf is a short walk north; the travelers'
  inn is to the south.
