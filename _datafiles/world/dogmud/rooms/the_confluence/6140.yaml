zone: The Confluence
title: Tri-Cross Square
description: >
  The square opens wide here — old worn paving in
  irregular flags, the joins between them dark with
  the grout of generations. Three roads converge on
  this crossing: the road from the north along which
  the Aldren River trade descends, the Brenn Road
  from the east where the ferry traffic joins it,
  and the Solt Way from the southwest where the river
  runs up from the lowlands. The Confluence was built
  here because this is where the roads were. At the
  center, the civic
  <ansi fg="itemname">monument</ansi>
  stands on its old stone plinth. The Municipal Hall
  occupies the square's west side, its dressed-stone
  face and broad approach stair giving the whole west
  end a settled authority; the Three Waters inn faces
  it from the east, a wide door and a hanging sign.
  Some of the newer building-fronts carry a carved
  cocoon-ring motif on their lintels and friezes — a
  common ornamental touch in the Confluence's more
  recently built quarters, present enough on the
  square to be unremarkable.
