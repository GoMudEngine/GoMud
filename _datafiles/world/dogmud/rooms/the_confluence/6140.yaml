nouns:
  the monument: >
    A four-sided plinth of old stone at the square's
    center, its faces carved with the names of the
    Confluence's founding trading families in letters
    that have been recut at least once over the years.
    Below the names, on each face, the same phrase is
    cut in a different hand: three rivers, one city.
    The top surface is flat and weathered. A winter-
    hazel wreath has been placed on it — dry now,
    held mostly by its wire frame, with no indication
    of who placed it or when. The plinth is old. The
    names cut into it are older than most of the
    buildings visible from where you stand.
