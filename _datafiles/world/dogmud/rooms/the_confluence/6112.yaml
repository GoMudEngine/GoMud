roomid: 6112
zone: The Confluence
title: Three-Rivers Overlook
description: >
  The wharf widens at its south end into a stone platform that juts
  over the channel, and here the view is everything. Three rivers
  come together below: the Aldren from the north, long and quick
  from the hill country; the Brenn pressing in from the east, wider
  and slower; and the Solt arriving from the southwest to complete
  the joining. At the meeting they lose their names and go on as
  one wide water toward the lowlands. Across the channel, close
  enough to see the stonework, the temple island rises from the
  water. The Quayfolk call this city the Tri-Cities and they mean
  it plainly, without ceremony: three rivers, one city.
biome: water
coord: {x: -4, y: -57, z: 0}
