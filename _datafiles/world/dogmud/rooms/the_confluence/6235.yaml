roomid: 6235
zone: The Confluence
title: The Weaver's
description: >
  A narrower shop than the cooperage, its front open
  to the street by wide folding shutters that are never
  fully shut in good weather. Three upright looms fill
  the room, the nearest dressed with a length of dark
  wool half-finished on the warp. Above them, finished
  <ansi fg="itemname">cloth</ansi>
  is draped across rods near the ceiling, airing or
  drying or waiting for collection. The cloth ranges
  from rough undyed linen to a tighter wool in a rust-
  and-cream stripe that seems to be a house specialty
  — it appears on the shutters as a painted stripe as
  well. The cooperage is north; the potter's is east.
