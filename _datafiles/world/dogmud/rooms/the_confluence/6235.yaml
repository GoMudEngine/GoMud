nouns:
  the cloth: >
    Bolts and lengths of cloth at various stages —
    undyed linen in rough rolls, a plain brown wool,
    and the rust-and-cream stripe that seems to be the
    weaver's signature work. The stripe is tighter and
    more consistent in the newer lengths; this is not
    the weaver's first season with it.
idlemessages:
- The shuttle runs across the warp with a wooden knock
  and the weaver's hand follows it back without pause.
- A length of cloth hangs from the rod above the door,
  turning slightly in a draft from the street.
- The smell here is wool and the faint oily smell of
  the finishing wax, not unpleasant.
