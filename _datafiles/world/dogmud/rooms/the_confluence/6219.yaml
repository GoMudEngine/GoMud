nouns:
  the fountain: >
    A dry stone fountain, its basin carved from a
    single piece of pale grey stone that matches the
    court's flagging. The water-feed was redirected
    some years ago and the basin has been dry long
    enough that someone has begun using it for storage.
    A stack of flat reference boards sits in the basin,
    the ones at the bottom already acquiring a faint
    dust-bloom on their edges. The fountain has become
    furniture without anyone formally deciding so.
idlemessages:
- A scholar crosses the court with a rolled survey
  under each arm and does not slow down.
- The student on the bench makes a note, crosses it
  out, and reads the passage again.
- A brief murmur of argument from the Margin Hall to
  the west — two voices, then quiet.
