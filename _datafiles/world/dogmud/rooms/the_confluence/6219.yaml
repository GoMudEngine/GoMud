roomid: 6219
zone: The Confluence
title: Inkwell Court
description: >
  The quarter's central court — a small paved space
  open to the sky through a gap in the roofline, its
  floor worn smooth by decades of foot traffic between
  the halls that open off it in every direction. A dry
  stone fountain stands at the court's center, its
  basin long unused for water and now holding a stack
  of flat reference boards someone left there
  temporarily and then forgot. Benches line two walls;
  a student sits at one of them with an open folio and
  the concentrated look of someone working through a
  problem. Scholars cross the court in ones and twos,
  arms full of papers, moving between the archive to
  the east and the halls further west. The smell of
  ink and old paper is always here, carried on
  everyone who passes through.
