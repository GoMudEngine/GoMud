roomid: 6169
zone: The Confluence
title: The Public Nave
description: >
  The long body of the temple runs from the narthex to
  the crossing, benches on either side and an open walk
  down the center where worshippers stand or kneel without
  order. The ceiling is high, the stone cool and faintly
  damp even in summer. Light enters from slit windows
  high above the aisles. Broad passages open east and
  west to the side aisles; a stone stair in the north
  corner climbs to the gallery above. To the south the
  nave widens into the crossing, where the sound of
  water rises from below the floor.
