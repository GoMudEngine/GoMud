idlemessages:
- A worshipper kneels in the center aisle, eyes closed,
  hands flat on the bench-back in front of them.
- The stone of the floor hums faintly with the water
  moving deep below -- barely perceptible, but present.
- 'A keeper moves along the west aisle, relighting
  candles: slow, unhurried work.'
