nouns:
  the painted-over sign: >
    Whatever trade this shopfront once advertised has been
    painted out in flat grey — twice, from the layering visible
    at the edges where weather has worn a thin line through to
    the coat beneath. No new sign has gone up in its place. On
    this street, that is its own kind of statement.
  alchemy bench: >
    A long workbench scarred by acid, scorching, and the honest
    wear of constant use, crowded with projects at every stage
    of completion. Nothing here looks finished, and nothing here
    looks abandoned either — the clutter has the particular
    order of a mind that knows exactly where everything is.
idlemessages:
- Something on the bench hisses softly and is ignored.
- A chain hanging from the beams above sways slightly, though
  nothing in the room is moving.
- The smell shifts a degree — metal fading, spirit-vinegar
  rising — as though someone just stepped between two half-
  finished projects.
- A drawer somewhere in the clutter slides shut on its own worn
  runners, the sound settling into the quiet.
