roomid: 6438
zone: The Confluence
title: Veyra's Workshop
description: >
  The stair from the craft row below ends at a door that was
  clearly meant to be a shopfront once — the frame is right, the
  lintel deep enough for a hung sign — except the sign itself
  has been painted over in flat grey, twice now by the look of
  the brushwork, and no name has replaced it. Inside, the room
  runs long and low under ceiling beams strung with drying
  herbs, coiled wire, and lengths of chain that do not obviously
  belong to anything yet. A cluttered
  <ansi fg="itemname">alchemy bench</ansi>
  takes up the near wall, its surface crowded with work at every
  stage of finish: a bandolier missing its buckles, a blade with
  no edge ground onto it yet, a housing waiting for whatever is
  meant to eventually sit inside it. The room smells of six
  trades layered on top of each other — hot metal, spirit
  vinegar, raw wool, something faintly ozone — none of them
  quite covering the rest. Doorways lead off to three smaller
  workrooms, and the stair descends back to the craft row below.
