roomid: 6202
zone: The Confluence
title: The Early Crypt
description: >
  A low rectangular chamber lined with niches cut
  into the walls at head height: an early crypt, used
  by the first few generations of Keepers to inter
  their own. Most niches are sealed with plain stone
  tablets bearing names and years incised with a
  simple tool. The tablets are the Keepers' work; the
  walls they are set into are not -- the whole chamber
  is of the same dark pre-Founding stone as the piers
  in the vault behind you. The Keepers found this
  space and made it their burial room. The
  <ansi fg="itemname">crypt-tablets</ansi>
  cover most of the visible wall. The vault is east;
  the passage continues west.
biome: city
coord:
