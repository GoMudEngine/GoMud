nouns:
  crypt-tablets: >
    Stone tablets sealed over the niches, each bearing
    a name and a pair of dates. The eldest entries are
    worn enough to read with effort; the most recent
    are still sharply cut. The names are those of
    Keepers -- a few honored with longer inscriptions,
    most given only their name and years. None of the
    tablets comment on the walls they are set into.
idlemessages:
- The niches go in three rows, floor to ceiling, on
  three sides of the chamber.
- 'The oldest tablet is nearly smooth: the name it
  carries has worn to an outline, legible only by
  light held at an angle.'
- The pre-Founding stone of the walls has been squared
  to accept the tablets; someone did careful work here
  long after the walls were first cut.
