zone: The Confluence
title: Quay Road South
description: >
  The spine of the Long Quay runs on south, the road wide enough
  for traffic to move in both directions without much argument.
  Shopfronts line the west side — shutters open, goods displayed
  on boards laid across barrels — and on the east the buildings
  give way to glimpses of water between them. Money-changers work
  from counters at ground level, coin weights and scales visible
  from the road. The smell of spice is layered here over the river
  smell, and the foot traffic is dense through the middle of the day.
biome: water
