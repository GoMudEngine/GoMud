roomid: 6107
zone: The Confluence
title: Gate Street
description: >
  A short street between the gate plaza and the first proper
  buildings of the Landings. The cobbles here are old and uneven,
  worn into gentle hollows by foot and wheel. To the south the road
  widens and the dock noise swells — rope-creak, gull-cry, the
  deep groan of a barge settling on its lines. To the west a side
  lane opens onto a small plaza. Buildings crowd both sides: a
  chandler's shutter is latched up, pallets lean against a wall,
  a cat watches from a window sill.
biome: water
