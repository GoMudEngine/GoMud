roomid: 6164
zone: The Confluence
title: The Causeway, Crown
description: >
  The causeway reaches its high point here, the water
  visible on both sides and the span stretching away
  in both directions. From the crown the island fills
  the eastern view — a great hall rising from the water
  above the joining of the rivers, built where the three
  channels finally become one. The bridge itself carries
  age in its lower courses. The
  <ansi fg="itemname">old stonework</ansi>
  at the crown's base is visibly different from the
  span above — older cut, darker with mineral years,
  the joints between blocks worn to smooth channels.
  One block near the east railing carries a worn ring
  pressed into its face. The western bank and the
  forecourt lie behind to the west.
