nouns:
  old stonework: >
    The base courses of the causeway crown are set
    differently from the span above — older stone,
    more darkly stained, the cut less precise but the
    blocks seated deeper into the river-bed. The joints
    between them have worn to smooth channels over a
    long count of years. One block near the east railing
    carries a ring pressed into its face, a circled
    groove worn to near-uniformity with the stone around
    it. It could be a maker's mark, or the scar of a
    mooring ring long since removed, or something older.
    The rest of the stonework does not remark on it.
idlemessages:
- The view from the crown takes in both banks and the
  open water running away to the southwest below.
- 'The wind is stronger at the crown: nothing between
  the causeway here and the open water on all sides.'
- A pilgrim stops at the east railing and looks at
  the temple ahead before continuing across.
