roomid: 6203
zone: The Confluence
title: The Seeping Passage
description: >
  The passage narrows and the walls close in:
  pre-Founding stone on all sides, no temple work
  visible at all. Water seeps through a crack in the
  south wall and runs in a thin line along the base
  of the west side -- the joined rivers are not far
  below, and here the water finds what paths it can.
  The floor is slick in patches. A side passage opens
  to the south; a stair cut into the floor itself
  descends further into the dark below. The crypt
  is back to the east.
