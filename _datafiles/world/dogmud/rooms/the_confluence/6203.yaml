idlemessages:
- 'Water runs along the base of the west wall in a
  thin steady trickle: the rivers are near.'
- 'The stair descending is the same cut as the walls:
  pre-Founding, older than the crypt behind you.'
- The passage smells of cold water and of stone that
  has been wet for a very long time.
