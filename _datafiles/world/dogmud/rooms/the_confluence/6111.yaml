roomid: 6111
zone: The Confluence
title: The Long Wharf
description: >
  The main cargo wharf of the Landings runs south along the river's
  edge, its planking broad enough for two carts abreast. Bales and
  crates are stacked in working rows down the center, chalked with
  lot marks on their end-boards. Stevedores move between them in
  a slow and practiced chain, lifting and setting with the economy
  of people who carry heavy things all day. At the south end the
  wharf widens into a stone platform; to the east an old stone
  jetty juts into the channel.
biome: water
