nouns:
  the freight: >
    Bales of cloth, crates of worked metal goods, barrels of oil
    and salt fish, bolts of canvas. All chalked with lot marks on
    the end-boards. Some of it is waiting for a barge; some of it
    just arrived on one. The stevedores move it in a chain without
    hurrying, shifting weight from back to boards to cart in one
    practiced motion.
