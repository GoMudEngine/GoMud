idlemessages:
- The hall-clerk handles a query at the counter
  without looking up from the ledger being annotated.
- The scholar at the margin table turns a page and
  makes a note with the precision of someone for whom
  the note is the important thing.
- The hall's ventilation carries a faint smell of old
  paper and the residue of official business.
