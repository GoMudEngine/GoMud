roomid: 6143
zone: The Confluence
title: The Municipal Hall
description: >
  The main chamber of the Confluence's civic hall — a
  room built to accommodate public business, with rows
  of benches for petitioners, a raised dais for the
  city's presiding officers, and the accumulated texture
  of a hall in long active use. Filing shelves line the
  walls between the windows. The floor is worn pale at
  the paths traffic takes most often. On the wall facing
  the benches, a large framed
  <ansi fg="itemname">map</ansi>
  of the Confluence and its three rivers is hung where
  all who wait may consult it. A hall-clerk manages the
  counter at the room's north end with the unhurried
  efficiency of someone who has heard most questions
  before; a scholar in a worn coat works one of the
  margin tables, surrounded by books and papers and
  apparently at home.
