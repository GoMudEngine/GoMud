nouns:
  the map: >
    A large framed chart of the Confluence's river-
    courses and district boundaries, hung on the wall
    in clear view of the waiting benches. The three
    rivers are drawn in clean professional ink: the
    Aldren from the north, the Brenn from the east,
    the Solt from the southwest, their courses meeting
    at the junction point at the chart's center. In
    one margin, in a hand older and less practiced
    than the chart-maker's, a fourth channel has been
    pencilled in — its course running south-southwest
    from the junction point. The line has been half-
    struck-through with a horizontal mark. A note
    beside it, in faded ink: the surveyors could not
    agree. No other annotation addresses it. The chart
    has hung here long enough that the staff do not
    remark on the marginal note.
