idlemessages:
- A carter steadies her horse at the bridge entrance,
  the animal hesitant at the hollow ring of hooves
  on stone over water.
- The bridge's iron railings are chipped at hand-
  height where travelers have gripped them crossing
  over the years.
- A fisherman below the first arch resets a line
  without looking up.
