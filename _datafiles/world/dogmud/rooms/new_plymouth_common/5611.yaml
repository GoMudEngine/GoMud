nouns:
  offering bowl: A shallow brass bowl on a stone shelf in
    the niche, its surface patinated dark from years of
    handling and weather. Inside it today — three copper
    coins, a wilted marigold from the flower stalls, and
    a folded slip of paper that someone has left and that
    it would not be right to unfold. The bowl's rim is
    noticeably smooth at two points where hands have
    rested, or gripped, or simply touched the same spot
    long enough to polish it.
  worn step: A single raised stone before the shrine niche,
    sunk into the lane's surface by a good inch — not
    through neglect but through use. The people of the
    Common do not make a ceremony of stopping here. They
    stop, briefly, for various reasons that are their own,
    and move on. The stone records all of it in the
    slight hollow of its center, too gradual to see year
    by year, visible now to anyone who looks.
idlemessages:
- A woman stops at the shrine, touches the rim of the
  offering bowl with two fingers, and continues on
  without breaking pace.
- Someone leaves a flower from the market in the bowl
  — a stem of something small and yellow — and is already
  gone around the corner.
- The noise of the cook-lane is audible from here but
  muffled, as though the corner itself absorbs a little
  of it.
- A child stops to look at the spiral carved in the stone,
  traces it with one finger, and is retrieved by a parent
  from around the corner.
- Two people pass through together, one touching the
  bowl's rim, one not, and neither remarking on the
  difference.
