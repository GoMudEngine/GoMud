roomid: 5611
zone: New Plymouth Common
title: The Common Shrine
description: >
  The quarter does not get quiet. But here, tucked into
  the angle where the cook-lane meets the flower market,
  there is something that passes for it — a slowing of
  foot-traffic, a drop in the general volume, as though
  the street agrees this particular corner does not want
  shouting. The Chrysalis street-shrine is built into the
  wall of the corner building — a niche cut in old stone,
  a carved shell-and-spiral worn to a smoothness that
  softens rather than erases it, and a brass
  <ansi fg="itemname">offering bowl</ansi> at the niche's
  base, its rim dark from hands and its interior holding a
  few petals from the flower stalls and a scattered handful
  of small coins. The
  <ansi fg="itemname">worn step</ansi> before the niche
  is lower than the surrounding cobbles — sunk, over years,
  by people stopping here for a moment that probably
  needed it.
