roomid: 5617
zone: New Plymouth Common
title: The Tanner's Yard
description: >
  The yard is a working space and looks it — packed
  earth, drains running grey, the flat percussion of
  scrapers on wet hide audible from the gate. The smell
  is the street's smell made more concentrated; you are
  in the process now rather than adjacent to it. A
  <ansi fg="itemname">scraping-beam</ansi> stands at
  the near edge of the yard, a curved timber canted at
  working height, its upper surface worn knife-bright
  where the hide goes and the blade comes across. Against
  the east-facing wall a row of
  <ansi fg="itemname">lime barrels</ansi> stand with
  their lids set askew — the caustic slaked-lime used
  to loosen hair from hides before the pit — their rims
  furred white with old residue. Workers move between
  them and the beam with the unhurried efficiency of
  people who have this sequence in their hands.
