title: The Back-Alley
description: >
  The alley narrows here to little more than a
  shoulder-width between buildings, the stone above
  close enough that it cuts the sky to a pale slot.
  It is the kind of place people arrive at when they
  have run out of other options — and someone has
  anticipated this. A
  <ansi fg="itemname">curtained door</ansi> breaks
  the north wall, a healer's mark chalked in a
  small careful circle beside the frame — the sign
  that whoever is inside does not ask where you have
  been or what put you in this condition. Above the
  lintel a bunch of dried herbs hangs by a loop of
  twine, the
  <ansi fg="itemname">herb-bunch</ansi> brittle now
  but still holding enough scent to be purposeful —
  a declaration of trade and a mild guarantee of
  competence. The alley continues east toward an
  iron gate and the muffled sound of a crowd below.
