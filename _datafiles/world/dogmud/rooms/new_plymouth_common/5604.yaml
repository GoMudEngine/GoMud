zone: New Plymouth Common
title: The Common Market
description: >
  Prices here are shouted rather than posted, and argued
  rather than accepted. The Common Market is what the
  Merchant Quarter's covered hall would be if you stripped
  out the roof, the fixed stalls, and the assumption that
  a price once named was a price once accepted — what you
  get instead is a compact press of
  <ansi fg="itemname">barrow-stalls</ansi> pushed into
  whatever space the morning's jostling has settled on,
  selling dried fish and cheap cloth and last-season root
  vegetables and a quantity of items that may have changed
  hands more than once before arriving here. The
  <ansi fg="itemname">weighing-beam</ansi> hung from a
  post near the center is the market's one official
  fixture, and there is almost always a dispute in progress
  somewhere in its vicinity — the beam, the weights, and
  the testimony of whoever was standing nearest all being
  interpreted differently by different parties.
