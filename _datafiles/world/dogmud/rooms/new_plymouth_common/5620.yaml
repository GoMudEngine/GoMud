roomid: 5620
zone: New Plymouth Common
title: Ysolde's Room
description: >
  The room is small and precise — the kind of tidiness
  that comes from working in confined space for years
  and learning to put things back. The smell of the
  alley does not follow you in; what replaces it is
  herb-warm and faintly medicinal, with a wood-smoke
  undertone from a small brazier in the corner that
  keeps the room above damp. A low
  <ansi fg="itemname">cot</ansi> stands against the
  near wall, the blanket folded flat and tight in the
  way of someone who expects to need it quickly and
  cannot afford to have it tangled. Across the room
  a shelf holds a row of
  <ansi fg="itemname">unlabeled jars</ansi> — stoppered
  clay and green glass and one of clear — all without
  markings, all evidently known by smell and position.
  No questions are asked here. The door is behind you.
