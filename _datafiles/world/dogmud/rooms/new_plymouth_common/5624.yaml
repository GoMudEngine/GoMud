title: The Old Foundation
description: >
  Cold before light — the temperature drops on the last
  three steps and does not recover. The foundation
  chamber is low-ceilinged and long, its walls cut from
  the same grey-blue stone as the lower stair, the joins
  between courses precise in a way that no current mason
  in New Plymouth can match and no one has asked them
  to replicate. Along the north-facing wall a
  <ansi fg="itemname">gray-material seam</ansi>
  runs at eye height, three hand-spans wide — not stone,
  not mortar, the surface too even, the edges too
  deliberate, as if poured or grown rather than cut. It
  does not reflect light the way the surrounding stone
  does. In the east-facing wall a
  <ansi fg="itemname">sealed niche</ansi> has been
  mortared shut with a careful hand — the mortar old
  and grey as the stone, the fill flush and squared.
  Whatever was placed in it was placed before the city
  above existed. The chamber is silent in a way that
  silence in occupied buildings is not.
