nouns:
  cistern lid: A heavy timber lid, iron-hinged on one
    side and iron-ringed on the other. Its surface has
    been worn smooth by hands and rough by rain until it
    is its own texture — neither raw wood nor polished,
    just used. Beneath it, water collected from the
    rooftops sits in a stone basin in the cold dark,
    flat and clear and cold enough to make the dipper
    handle sting. The iron dipper hanging beside it
    is bright from use and has someone's name scratched
    into the handle in shallow letters — too shallow
    to read without leaning in.
  washboards: A row of ridged stone-and-wood boards
    canted over a shared trough, most of them wet and
    in use. The women working them have the easy rhythmic
    conversation of people doing repetitive work together
    — voices rising and falling over the slap and scrub,
    one thread of talk moving from board to board along
    the row without losing itself. Two boards in the
    middle sit unoccupied. The trough water is grey and
    warm at the near end and grey and cooler at the far
    end, and the women have opinions about which end
    is better.
idlemessages:
- Wet cloth slaps the washboard in a hard rhythm, pauses,
  slaps again.
- Someone draws the dipper from the cistern and hands it
  down the line; it comes back empty.
- A conversation at the washboards erupts briefly in
  laughter and then subsides into the ongoing rhythm
  of the scrub.
- A child sits on the cistern lid, which is not permitted,
  and is redirected by three separate people in quick
  succession.
- The smell of lye-soap sharpens when someone lifts a
  newly-washed length of cloth to check it against
  the light.
