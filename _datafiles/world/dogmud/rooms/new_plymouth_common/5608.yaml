title: The Public Cistern
description: >
  The damp reaches you before the door does — a cold
  mineral smell mixed with lye-soap and the particular
  scent of fabric that has been wet and is becoming dry,
  which is never quite like either state. The cistern
  building is low and wide, open at the front, a
  corrugated clay-tile roof over the collection basin
  the city runs off the upper rooftops when it rains.
  The
  <ansi fg="itemname">cistern lid</ansi> is a hinged
  plank of seasoned timber fitted with an iron ring, and
  beside it hangs a long-handled iron dipper worn bright
  at the bowl. A rank of
  <ansi fg="itemname">washboards</ansi> occupies the
  outer wall — a dozen of them, different sizes, rigged
  over a trough of standing water — and at this hour most
  of them are occupied, the sound of wet cloth slapping
  stone underlining everything else anyone says here.
  The cistern is the quarter's other gathering point —
  the one where the conversation is horizontal and the
  work never stops.
