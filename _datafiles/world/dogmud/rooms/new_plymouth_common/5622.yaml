roomid: 5622
zone: New Plymouth Common
title: The Flophouse Steps
description: >
  The steps of the flophouse have become a kind of
  commons for the quarter's harder-luck cases — the
  ones who have nowhere pressing to be and have been
  at this long enough to make a skill of it. They sit
  from morning and move only for meals they may or may
  not manage. In the middle of the third step a
  <ansi fg="itemname">dice-scratched step</ansi>
  shows where a game has been running indefinitely —
  the corner worn to a smooth channel where the cup
  is set down, the marks of rules and debts scratched
  into the stone beside it in a rising palimpsest of
  sessions. An old man presides here with the gravity
  of an authority that has nowhere higher to be
  referred to. The flophouse
  <ansi fg="itemname">door</ansi> stands behind him —
  a cracked transom above it, a hand-lettered list of
  house rules nailed to the frame, two of the rules
  scratched out and replaced.
