roomid: 5623
zone: New Plymouth Common
title: The Undercroft Stair
description: >
  The stair is set back behind a low arch, easy to miss
  unless you know to look — the sweeper knows, and
  perhaps a handful of others. The
  <ansi fg="itemname">worn steps</ansi> descend below
  the level of the quarter's current cellars into a cold
  that has nothing to do with the season and an air that
  stopped moving some time before the city above was
  built. The materials change at the third step — the
  upper courses are the quarter's own construction,
  serviceable and grey; below the third step something
  older begins, the stone cut tighter and in a color
  different from anything quarried near New Plymouth.
  Above the arch a
  <ansi fg="itemname">carved lintel</ansi> frames the
  descent — a symbol deeply cut in the stone, worn to
  near-illegibility by age but still holding its shape.
  It is not the Chrysalis spiral. Whatever it is, it
  was here before the Chrysalis spiral existed to be
  compared to.
