title: Dockgate Street
description: >
  The change is in the sound first — the crash and
  shout of the working docks falling back as you cross
  west to east, replaced by something lower and more
  domestic — children, a woman calling through an upper
  window, the particular murmur of a street that has
  nowhere important to go and has settled into that fact.
  Dockgate Street is the seam between the two quarters,
  and it feels like one — the buildings on the dock side
  lean practical and weather-blasted; on the Common side
  they lean just as hard, but over doorsteps someone has
  swept and a pot of something is always cooking somewhere
  above. A worn
  <ansi fg="itemname">boundary stone</ansi> in the gutter
  marks the ward line, its lettering mostly gone, and a
  <ansi fg="itemname">ballad sheet</ansi> has been pasted
  to the corner post at eye level, still legible, already
  peeling at one corner.
