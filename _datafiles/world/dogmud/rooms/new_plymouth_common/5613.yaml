zone: New Plymouth Common
title: Tenement Row
description: >
  Tenement Row announces itself by sound — voices
  through thin walls, boot-steps on bare floors,
  something dragged across boards one story up. The
  buildings press close, upper stories leaning until
  the sky between them narrows to a stripe, and across
  that stripe the
  <ansi fg="itemname">washing lines</ansi> run level
  upon level, every household's week strung out
  overhead in grey and faded color. At street level a
  communal
  <ansi fg="itemname">stoop</ansi> fronts the nearest
  block, its steps worn hollow in the center by the
  same boot-weight landing for forty years. Behind
  the ground-floor entrance a
  <ansi fg="itemname">barricaded stairwell</ansi>
  blocks the way up — planks crossed, notice nailed —
  but the boards are working loose at one corner, and
  something above shifts its weight as if it has heard
  you arrive.
