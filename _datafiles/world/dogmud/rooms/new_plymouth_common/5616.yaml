title: The Tannery Street
description: >
  The smell reaches you before the street does — a
  compound assault with layers: the sharp cut of lime
  at the top, below that the deep animal weight of
  raw hide and fat, below that something sulfurous and
  organic you do not want to identify by name. You have
  entered the tannery trades. The street runs between
  the working fronts of three or four tanning operations,
  their
  <ansi fg="itemname">soaking pits</ansi> ranged along
  the building edges behind low stone walls — open vats
  of dark liquor with hides submerged and weighted down.
  On frames above them, past the pit stage, the
  <ansi fg="itemname">stretched hides</ansi> are pegged
  out flat and drying, their pale inner faces turned to
  the sky. Workers pass between pits and frames in oiled
  aprons, unhurried, accustomed to the smell in the way
  of people who stopped noticing it years before you
  arrived.
