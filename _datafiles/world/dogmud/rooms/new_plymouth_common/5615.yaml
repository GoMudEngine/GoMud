zone: New Plymouth Common
title: The Back Court
description: >
  The court is a gap between blocks rather than a
  planned space — a rectangle of flagstone where the
  buildings pulled back just enough to give the quarter
  somewhere to put its washing and its children. Both
  are here now, the former on lines strung building-to-
  building at head height, the latter running circuits
  and calling back and forth in the high shorthand of
  games you don't know the rules to. A
  <ansi fg="itemname">dry fountain</ansi> stands at
  the court's center, its basin long since stopped —
  someone has filled it with soil and planted herbs that
  look better than they have any right to. Worn into
  the flagstones nearby, a
  <ansi fg="itemname">chalk hopscotch</ansi> grid has
  been renewed so many times that the lines have pressed
  faintly into the stone itself, independent of whatever
  chalk is currently on them.
