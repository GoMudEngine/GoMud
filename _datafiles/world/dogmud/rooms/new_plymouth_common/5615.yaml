nouns:
  dry fountain: A low stone basin on a short pediment,
    the pipe at its center sealed long ago with mortar
    that has gone the same color as the stone. Someone
    has filled the basin with dark earth and planted
    what appears to be a mix of herbs — thyme, something
    broader-leafed, a cluster of chives heading toward
    flower. The planting is doing well. Whoever tends
    it has an arrangement with the building above or
    simply enough reach. A small clay fragment is
    balanced on the pediment's edge — a charm, or a
    child's marking, or something that blew in and
    happened to land upright.
  chalk hopscotch: Overlaid chalk on chalk — new marks
    over old over older, in at least three colors.
    Beneath the chalk the flagstone has been worn along
    the jumping line and the turn-squares into a faint
    groove that will outlast every version of this game.
    Two children are playing it now, the rules clearly
    modified from whatever the original was. One
    disputes the other's count. The dispute is not new.
idlemessages:
- The children's game reaches its disputed turn and
  breaks into a short argument, then resumes without
  resolution.
- A pair of pigeons land on the dry fountain's rim,
  eye the herb planting, and depart disappointed.
- Someone leans from a window above the court and calls
  a name — one of the children looks up, considers
  this information, and goes back to the game.
- The washing on the lines above shifts in a draft that
  does not reach the flagstones below.
- A cat enters the court from the south alley, crosses
  without interest in the children, and exits through
  a gap under the east-facing wall.
