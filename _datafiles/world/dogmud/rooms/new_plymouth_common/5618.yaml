zone: New Plymouth Common
title: Sweeper's Corner
description: >
  The quarter's gutters all run in the same direction
  and end somewhere — this corner is where they end,
  and the man who sweeps the street has made it his own.
  A dead pocket behind the tannery's north wall, it
  catches everything the morning current brings. The
  gutter run beside the seat of the
  <ansi fg="itemname">gutter-grate</ansi> at the
  corner's low point is packed thick with the
  quarter's leavings, dense enough that it has ceased
  to drain properly and the water stands in a shallow
  pool over run and grate alike. The sweeper keeps his findings arranged along
  the base of the wall — a
  <ansi fg="itemname">hoard</ansi> of salvaged things,
  sorted in a logic only he understands: lengths of good
  string, a bent copper spoon, a fragment of something
  grey and dense that sits differently from stone, as if
  it was made rather than quarried. He is not here now,
  but the arrangement has the clear air of a marked
  territory.
