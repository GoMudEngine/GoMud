nouns:
  gutter grate: An iron grate set into the corner
    flag, meant to admit the street drainage and
    prevent clogging. The clog has happened anyway —
    packed solid into the gutter run beside the
    grate's seat, leaf-mash, grit, rags too small to
    have value, a pebble that should never have been
    interesting to anyone and yet is here. The grate
    bars themselves stand clear of the muck, dark
    with the residue of years, and below them the
    drain descends into its undisclosed purpose. The
    grate lifts free of its seat, and a line of iron
    rungs goes down the shaft beneath.
    Something about the corner's standing water troubles
    the light in a way you cannot account for simply
    by its depth.
  grate: |-
    An iron grate set into the corner flag, its bars dark
    with the residue of years. It lifts free of its seat,
    and a line of iron rungs goes down the shaft beneath.
  hoard: Arranged along the base of the wall with the
    care of someone who takes their finds seriously —
    a coil of string of varying thickness, a copper
    spoon bent at the neck but otherwise usable, three
    buttons of different materials, a leather strap,
    and the fragment. The fragment is grey-white and
    sits on top of the arrangement as if honored or
    suspect. It is clearly not stone — too even in
    texture, too deliberate in its edges, as if formed
    rather than quarried. The sweeper has placed it
    separately from the other finds, which may mean
    nothing or may mean he agrees with that assessment.
idlemessages:
- The standing water above the gutter-grate shifts
  as the drain below makes a brief attempt and gives up.
- A current of air from the tannery's direction adds
  its contribution to the corner's accumulated smell.
- Something drops into the hoard from above — fallen
  from the wall, or thrown — and the careful
  arrangement absorbs it without apparent protest.
- The quiet here is different from the street's quiet —
  the corner's walls fold the noise of the quarter back
  on itself and leave a gap.
- A water-beetle crosses the surface of the standing
  pool, indifferent to the quality of the water.
