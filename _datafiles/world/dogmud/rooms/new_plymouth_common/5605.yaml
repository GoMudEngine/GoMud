nouns:
  braziers: A row of fire-points in different styles —
    clay pots with iron grill plates, a proper brazier
    on a forged stand, two fire-blackened bricks with
    a flat stone across them. Each one has a vendor and
    a smell — skewered meat on the left, root-vegetable
    broth in the center, flatbread blistering on the stone
    at the far end. The heat coming off the row is
    noticeable even from the center of the street. The
    vendors do not look up; they are working.
  trestle table: Four planks on sawhorses running the
    length of the food row — long enough that people at
    one end cannot hear what people at the other end are
    saying, which has led to several misunderstandings and
    at least one friendship. There are no chairs. People
    prop a foot on the crossbar below, eat, talk over the
    food, set their bowls back on the planks when done,
    and the vendor at the near end collects them with the
    steady rhythm of someone who has made this calculation
    a thousand times.
idlemessages:
- A vendor calls a price and then calls it again because
  the first time the noise ate it.
- Fat from a skewer falls into the brazier and flares;
  the vendor does not look up.
- Someone reaches across the trestle table to pass a
  companion a chunk of bread without interrupting the
  story they are telling.
- The smell of fresh flatbread briefly overwhelms
  everything else, then reintegrates.
- A dog sitting very still at the edge of the row is
  rewarded, eventually, with a piece of something it
  is impolite to examine too closely.
