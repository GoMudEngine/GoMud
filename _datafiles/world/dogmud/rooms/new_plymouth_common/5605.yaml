title: Cookshop Row
description: >
  The smell reaches two streets away at midday and pulls
  the quarter to it like a rope — fat on hot iron, cumin
  and pepper in the smoke, the sweetness of rendered bone
  broth that has been simmering since before dawn. Cookshop
  Row is not a fancy place but it is an honest one, and at
  the midday bell it is impossible to move through quickly.
  The
  <ansi fg="itemname">braziers</ansi> line both sides of
  the street — clay fire-pots, iron grills, a clay-capped
  oven at the far end that the woman who owns it is
  protective of — and between them the vendors work fast
  and loud. The long shared
  <ansi fg="itemname">trestle table</ansi> running down
  the center belongs to no one and everyone — people eat
  standing, set down their bowls to argue with their
  neighbors, and are gone again inside the quarter-hour.
