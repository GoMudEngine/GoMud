roomid: 5607
zone: New Plymouth Common
title: The Brimming Bowl Taproom
description: >
  The noise is the first thing and the constant thing —
  conversation in layers, the thump of cups on the table,
  someone near the back conducting an argument at volume
  that everyone else is ignoring, the squeal of a bench
  dragged to fit one more. The taproom is full in the way
  that feels intentional — as though the room was built
  for exactly this many people and someone fills it to
  specification each evening. The
  <ansi fg="itemname">benches</ansi> run the length of
  three long tables and every spot on them is either
  occupied or contested. At the far end the
  <ansi fg="itemname">bar</ansi> is a warped plank of
  pale wood on two barrels, its surface ringed from edge
  to edge with the ghost-marks of cups going back years.
  The barkeep works it at a pace that suggests she has
  never once been surprised by demand. Exit leads back
  outside.
biome: city
