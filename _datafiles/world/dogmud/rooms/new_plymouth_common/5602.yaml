nouns:
  well: A stone well-drum, old enough that the mortar
    between the courses has been repointed twice in living
    memory and the rope-groove worn into the crossbeam is
    deep enough to lay a finger in. The bucket hangs on a
    good hempen rope that someone changes every season. At
    this hour there is a small queue — people with pots and
    ewers, exchanging pleasantries in the way of people who
    have been queuing at the same spot together for years
    and have thoroughly run out of new things to say, but
    keep saying them anyway.
  flower stalls: Three wooden trestles along the rim of the
    rise, each carrying a row of heavy clay buckets full of
    cut flowers — bundles of field-marigold, stems of
    something blue and spiky, fat white heads that may be
    feverfew or may be something rarer; it is not always
    clear and the vendor of the middle stall is not
    forthcoming. They sell out well before midday. The
    vendor at the east end keeps a few dried bundles for
    the afternoon trade — people who need something to
    carry to a shrine.
idlemessages:
- The bucket descends into the well and returns, dripping,
  and a small argument begins about who was next.
- A vendor at the flower stalls calls something across the
  rise that makes the two women at the well laugh at once.
- A child is sent to fetch water and immediately becomes
  distracted by the flowers, which was probably predictable.
- Someone sets a pot down on the well's rim to fill it
  and the conversation around them folds in naturally,
  as though the pot were a regular attendant.
- The cluster of people at the well thins briefly, then
  refills; the well never seems to be empty of visitors.
