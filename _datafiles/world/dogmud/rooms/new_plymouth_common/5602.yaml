roomid: 5602
zone: New Plymouth Common
title: Carter's Rise
description: >
  The cobbles widen here at the top of the gentle rise
  and the street opens, briefly, into something almost
  like a square — enough room for people to stop moving
  and still leave space for others to pass, which is rare
  in the Common and has made this spot the quarter's
  unofficial exchange. The
  <ansi fg="itemname">well</ansi> stands at the center,
  a stone drum with a worn wooden crossbeam and a bucket
  on a good rope, and around it the day's talk happens
  — who is sick, who is hiring, what a deacon was heard
  to say at the south gate, whether the price of lamp oil
  is a scandal or a crime. The
  <ansi fg="itemname">flower stalls</ansi> ring the outer
  edge of the rise — three or four vendors with cut blooms
  in wooden buckets — the one bright, extravagant thing the
  quarter permits itself, and they sell out every morning.
