zone: New Plymouth Common
title: Upper Common Way
description: >
  The street rises here and the buildings straighten with
  it — the same tenement lean of the lower Common, but more
  deliberate, the stonework pointed more recently, the
  window-glass actual glass rather than oiled cloth. The
  quarter thins out as it climbs. The crowds belong to the
  Rise and the market below; up here foot-traffic moves with
  more purpose and less company. A
  <ansi fg="itemname">ward-post</ansi> set into the corner
  marks the upper boundary of the Common's jurisdiction
  — painted in the ward's faded colors, its placard listing
  the ward officer's name and a declaration of weights and
  measures that seems aspirational. Worn into the center
  of the rise, a
  <ansi fg="itemname">handcart track</ansi> cuts two pale
  parallel lines in the cobblestones — years of carts
  bringing goods down from the Merchant Quarter above. The
  road continues north, the buildings growing more careful
  as they climb, the Merchant Quarter visible and climbing
  beyond — but that passage is not yet open.
