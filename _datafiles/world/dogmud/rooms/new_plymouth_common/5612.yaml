nouns:
  ward post: A squared timber post sunk into the corner
    paving, its top carved with the ward seal in low relief
    — a wheel and a key, which is either deeply symbolic
    or was chosen by a committee that ran out of ideas.
    The post's painted colors — dark red and cream — have
    faded to something more nuanced. The placard below
    the seal lists the ward officer and a brief declaration
    of standards that the ward officer may or may not be
    aware of. Someone has hung a dried bunch of herbs from
    the post's upper bracket for no apparent reason, and
    it has been there long enough to be considered part
    of the fixture.
  handcart track: Two pale lines worn into the cobbles by
    generations of cart-wheels descending from the market
    above — the weight pressing down on the same path
    until stone itself gave way a little. The tracks are
    visible from twenty feet away if you know to look,
    and invisible if you don't, which is how most things
    in the Common work. They run from the north and curve
    slightly at the crest of the rise where the grade
    changes and drivers lean back on the handles.
idlemessages:
- A handcart comes down from above, wheels squealing
  slightly, driver leaning back against the grade.
- The noise of the lower Common carries up here on the
  right wind — someone at the market, a hammer from the
  lane below.
- A merchant's agent passes through heading downhill
  with a quick step, not looking at anything but the
  street ahead.
- The ward-post catches a crosswind briefly, the dried
  herbs on its bracket rattling once, then still.
- Up the road the buildings become more regular — more
  dressed stone, less character — and the quarter you
  are in becomes, gradually, another one.
