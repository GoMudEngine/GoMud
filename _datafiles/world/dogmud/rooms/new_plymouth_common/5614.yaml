title: Mother Brisk's Block
description: >
  There is a perceptible difference in front of this
  block — the stoop swept, the lower windows intact,
  the face-stone cleaner than its neighbors by a margin
  that speaks of regular attention. Mother Brisk runs
  the best-kept building in a hard part of the quarter,
  and it shows in small corrections: a bent downpipe
  straightened, a crack filled before it became a gap.
  The
  <ansi fg="itemname">rent-board</ansi> is mounted
  beside the entrance in a small glass-fronted case,
  chalk names and figures legible through the pane.
  Above the first landing, a
  <ansi fg="itemname">watchful window</ansi> looks down
  onto the street — someone is always there, at all
  hours, watching who comes and goes. Tenants feel
  looked-after. Visitors feel assessed.
