title: The Flower Market
description: >
  The smell reaches you before the stalls do — green
  water and crushed stems and the sweetness of flowers
  that were cut this morning, cut in someone's garden or
  a plot outside the walls, and are now arranged in
  dripping wooden buckets along both sides of the lane.
  The
  <ansi fg="itemname">cut flowers</ansi> run the full
  range of what the season allows — daisy-bundles tied
  with rush, waxy-petalled things in deep red, stems of
  something small and yellow whose name the vendor will
  tell you if you ask and has told you before and you
  have forgotten. At the lane's foot, where the foot
  traffic is heaviest off the Rise, a fortune-teller
  has claimed a corner with a folded cloth and a box
  for a seat, and the
  <ansi fg="itemname">reading-mat</ansi> spread on the
  cobbles before them is worn to threads at the center
  from the boots of people considering their futures.
