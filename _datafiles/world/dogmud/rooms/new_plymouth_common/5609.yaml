zone: New Plymouth Common
title: The Bathhouse
description: >
  Warm air pushes out around the edges of the entrance
  even before you go inside — a damp heat with the mineral
  smell of water heated in a stone basin, different from
  rain and different from the river. The bathhouse is a
  modest building of plain mortar, older than the street
  it sits on, and inside it the Common's usual sorting by
  means does not quite apply — dock-poor and shop-
  comfortable share the same bench and the same hot water,
  which produces an occasional awkwardness and a more
  occasional conversation. The
  <ansi fg="itemname">steam-room door</ansi> is a thick
  plank banded in iron to hold the heat in, its face dark
  with condensation. Beside the entrance, a
  <ansi fg="itemname">tally-slate</ansi> tracks bath
  tokens on a peg system — each token a copper disk,
  and the count determining the order of entry. The
  attendant manages this with the patience of someone
  who has mediated bath-token disputes more times than
  they care to number.
