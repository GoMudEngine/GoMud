nouns:
  steam-room door: A thick plank door banded in iron at
    the top, middle, and bottom — the banding to hold the
    swelling wood flat and the heat in. Its face is dark
    with condensation that runs and dries and runs again,
    tracing paths down the grain. When it opens, briefly,
    the steam comes out in a long exhale and the people
    waiting in the anteroom close their eyes automatically,
    the way people do when something warm and good is
    going to pass. Then it shuts again and the warmth
    retreats to the edges of the frame.
  tally-slate: A rectangular slate mounted beside the
    entrance on an iron bracket, with a row of wooden
    pegs below it holding copper disks — the bath tokens,
    each one stamped with a rough sunburst on one face.
    The numbering system is explained on a card pinned
    next to it. The card is not sufficient. The attendant
    explains it verbally to new arrivals with the air of
    someone who has simplified the explanation many times
    and has not yet achieved clarity.
idlemessages:
- Steam escapes in a long breath as the bath door opens,
  hangs in the cooler air of the anteroom, and slowly
  fades.
- Someone emerges from the interior looking a good deal
  more relaxed than when they went in.
- A brief disagreement about the bath token order is
  resolved by the attendant with a practiced finality
  that allows no appeal.
- Two men who clearly do not know each other emerge from
  the steam room in easy conversation, in the way that
  happens when people are hot and have nothing to prove.
- The warm air from the building's edge drifts across
  the street and is noticed by a passing child, who
  slows.
