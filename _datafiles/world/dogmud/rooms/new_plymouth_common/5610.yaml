title: Tinker's Lane
description: >
  The grinding is the first sound — a high sustained
  note that rises and falls as the pedal-driven
  <ansi fg="itemname">whetstone</ansi> catches iron at
  different angles. The knife-grinder's cart sits at the
  mouth of the lane and has been there long enough that
  the cobbles under the cart's wheels have worn slightly
  concave. Tinker's Lane is a side channel of the
  Common's working life — a narrow run of menders and
  fixers and people who attend to the things the quarter
  needs attended to but does not much think about. A
  cobbler works from an open doorway. A woman resews
  a coat's lining on a stool in the open air. At the
  lane's center, the barber has set up his
  <ansi fg="itemname">stool</ansi> and strop in the
  widest part of the way, a strip of worn leather
  hanging from the corner-post, and is conducting a
  haircut and a conversation with the simultaneous ease
  of someone who has never once confused them.
