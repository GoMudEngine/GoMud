nouns:
  whetstone: A circular stone mounted on a low wooden
    frame with a treadle below — the grinder pumps it
    with one foot while both hands guide the blade. The
    stone is the grey-blue of good grit and runs slightly
    wet from a drip-cup mounted above it. At speed it
    throws a fine cool spray. The grinder works with the
    unhurried efficiency of someone paid by the blade and
    not the minute — each edge is done right or done again.
    A short queue of people with things that need
    sharpening waits at a respectful distance from the
    spray.
  stool: A three-legged stool set in the widest part of
    the lane where the light is good. The barber's
    customer sits with a cloth around the shoulders and
    an expression of relaxed patience while the barber
    works at close range with shears and small scissors.
    The strop hangs from an iron peg in the corner-post
    — a length of worn leather, soft at the center and
    stiff at the hanging end, used between customers
    with a sound like a slow clock, patient and rhythmic.
idlemessages:
- The whetstone hums up as the grinder puts his foot to
  it; sparks trace a brief arc in the shadow under the
  cart.
- The barber says something to his customer that makes
  the customer want to turn and look, and is gently
  prevented from doing so.
- A woman hands a cobbler a shoe and explains what
  happened to it. He looks at the shoe, not her, and
  names a price.
- The grinder finishes an edge, tests it on his thumb,
  and slides the blade back across the whetstone once
  more before handing it over.
- The strop sounds — one slow stroke, then another — as
  the barber prepares between customers.
