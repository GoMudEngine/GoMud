title: The Fighting-Pit Gate
description: >
  The sound of a crowd rises here in a muffled continuous
  swell from somewhere below and behind the gate — the
  particular sound of people watching something with
  concentrated attention, the kind that goes briefly
  louder and then settles back to its steady level. The
  <ansi fg="itemname">iron gate</ansi> is set into a
  heavy frame of dressed stone, its bars thick and
  close-spaced, a lock the size of your fist bolted
  through the hasp. In front of it the
  <ansi fg="itemname">bouncer</ansi> stands with his
  arms folded and the settled look of a man who has had
  this same conversation with strangers many times today
  and has made his peace with repeating it. The fighting
  pit, wherever it is, does not take walk-ins. Fights
  are by invitation.
