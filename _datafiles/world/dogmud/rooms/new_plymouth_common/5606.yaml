title: The Brimming Bowl
description: >
  Even from outside you can tell it is doing well —
  the sound leaking around the door is the sound of
  people who have found each other at the end of the
  working day and intend to make something of that. The
  building occupies a corner plot and has been here long
  enough to look as though the street was built around it,
  which may be the case. Above the door, a painted sign
  shows a wooden bowl tilted just slightly past full —
  the
  <ansi fg="itemname">bowl sign</ansi>, faded but legible,
  repainted whenever someone gets around to it, which is
  every few years. The
  <ansi fg="itemname">doorway</ansi> is broad and worn,
  the lintel dark with the oils of ten thousand hands
  that have braced against it, and the doorstep is lower
  than the street by an inch — either the street rose or
  the building settled, and the distinction has been
  forgiven by both parties. The taproom lies down a few
  steps through the doorway.
