title: Lower Common Way
description: >
  Something is always cooking on Lower Common Way —
  the smell layers itself, pot-herbs above woodsmoke
  above the sour damp of old stone, and somewhere above
  that the sharp clean note of lye-soap drying on a sill.
  The street climbs gradually east toward the Rise, wide
  enough for a handcart, never quite wide enough for two
  carts at once, and the buildings on either side have
  long since made peace with each other by leaning slightly
  inward at the upper stories. A
  <ansi fg="itemname">gutter-channel</ansi> runs down
  the center of the cobbles carrying whatever the morning
  brought, and the
  <ansi fg="itemname">doorstoops</ansi> on both sides are
  worn hollow and occupied — people sitting, watching,
  mending things, exchanging words with whoever passes.
  Life is lived here as much as inside.
