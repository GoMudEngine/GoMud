nouns:
  maps: City maps annotated in a careful hand. Tunnel routes are traced in
    red ink, gate patrol schedules noted in the margins. Every approach to
    the city is mapped and timed. Whoever made these had access to official
    city surveyor records.
  strongbox: A heavy iron strongbox beneath the table, secured with a brass
    padlock. It is solidly built -- breaking it open without a key would
    take considerable effort and make a great deal of noise.
  table: A proper wooden table, out of place this far underground. Its
    surface is covered in papers, ink pots, and weighted-down maps.
idlemessages:
- Lamp light plays across the annotated maps on the wall.
- Papers rustle on the table, stirred by a faint draught.
