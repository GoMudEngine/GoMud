roomid: 498
zone: Thornwall City
title: Operations Room
description: >
  The heart of the smuggling operation. A large chamber carved from bedrock,
  well-lit by multiple oil lamps and furnished with a proper table, chairs,
  and shelving. Maps of the city and its tunnel system are pinned to a
  wooden frame against the north wall, annotated with routes, timings, and
  gate patrol schedules. A heavy iron <ansi fg="itemname">strongbox</ansi>
  sits beneath the table, secured with a brass lock. This is not a hideout
  -- it is an office, run with the efficiency of a legitimate business.
biome: cave
