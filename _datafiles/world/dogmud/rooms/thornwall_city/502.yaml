roomid: 502
zone: Thornwall City
title: Warded Corridor
description: >
  A low corridor where the ceiling forces a stoop. Chrysalis growths pulse
  along the walls in irregular clusters, their bioluminescence painting
  everything in dim blue-green. Thin filaments stretch across the passage
  at intervals -- some are natural mycelium threading between growths, but
  others are too regular, too deliberate, attached to small hooks driven
  into the stone. Crude ward symbols have been scratched into the walls
  at shoulder height, drawn in what looks like dried blood. Whatever lives
  deeper in this place wanted warning before visitors arrived.
biome: cave
