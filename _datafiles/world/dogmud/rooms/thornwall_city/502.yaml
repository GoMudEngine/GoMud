nouns:
  filaments: >
    A network of thin filaments stretching across the passage. The
    natural ones sag in irregular curves; the deliberately placed
    ones are taut, horizontal, attached at both ends to small iron
    hooks. Disturbing the taut ones would almost certainly make
    noise -- or worse.
  ward symbols: >
    Rough symbols scratched into the stone at intervals. They are
    not any recognized script -- more like a personal code, repeated
    glyphs that might mean "danger" or "home" or something with no
    word in common language. Each symbol has a small smear beneath
    it, darker than the stone.
  chrysalis growths: >
    Clusters of hardened chrysalis resin on the walls, shaped over
    time into irregular lumps and ledges. The bioluminescence pulses
    from within, as if something alive is still trapped inside each
    one. Up close, the surface is warm to the touch.
  blood marks: >
    The pigment used to draw the ward symbols. It is dark brown now,
    old and flaking at the edges. Recent additions are darker -- some
    still slightly tacky. Someone keeps maintaining these marks.
idlemessages:
- The filaments sway in an imperceptible draught, taut and trembling.
- Chrysalis growths pulse with cold light, irregular as a sleeping heartbeat.
- A ward symbol near the floor looks freshly touched up, the pigment darker.
