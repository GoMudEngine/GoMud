nouns:
  table: A heavy oak table scarred by knife marks and ink stains. Duty rosters are
    pinned under a mug, incident reports are stacked in rough piles, and a half-eaten
    loaf of bread sits next to an inkwell. This is where the daily business of
    keeping the peace is organized.
  racks: Wooden weapon racks holding city guard equipment -- spears, short swords,
    truncheons, and a few crossbows with quarrel pouches. Everything is maintained
    but well-used. A chalk board above lists equipment checked out and by whom.
  cells: Three iron-barred cells at the back of the room, each barely large enough
    for a cot and a bucket. They are empty now, their doors standing open. Scratches
    and stains on the walls suggest they see regular use.
  bounty board: A weather-worn corkboard stands beside the wall, papered with wanted
    notices and contract slips, recent ones still clean, older ones curling at the
    edges. Anyone with the will to read them can run "bounty list" anywhere in town
    to see what's open.
