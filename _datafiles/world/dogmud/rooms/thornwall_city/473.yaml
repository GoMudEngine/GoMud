roomid: 473
zone: Thornwall City
title: Guard Barracks
description: The city guard barracks is a solid stone building near the western gate,
  built for function without the slightest concern for aesthetics. The ground floor
  is a combination of duty room, armoury, and holding cells -- a long wooden table
  dominates the center, covered with duty rosters, incident reports, and the remains
  of someone's lunch. Weapon racks line the walls, holding spears, short swords, and
  a few crossbows. Iron-barred cells occupy the far end, currently empty. A
  weathered bounty board stands beside the wall, papered with wanted notices. The
  air smells of metal polish and stale bread.
biome: city
