roomid: 505
zone: Thornwall City
title: Chrysalis Den
description: >
  A roughly circular chamber where chrysalis growth covers every surface in
  overlapping layers, thick as quilting. The ceiling is hung with hammocks
  woven from strips of hardened resin, swaying gently in air currents only
  they can feel. A cookfire pit in the center holds cold grey ashes and a
  cracked iron pot still dark with old stew. Crude weapon racks lean against
  the south wall, holding blades in various states of repair. Stolen goods
  pile against the west exit -- merchant sacks, a broken loom still strung
  with half-finished cloth, a barrel of wine with a tap hammered through
  the side. This is home. Someone lives here, and they are almost certainly
  still nearby.
biome: cave
