roomid: 508
zone: Thornwall City
title: Chitin Throne
description: >
  A chamber that should feel grand and instead feels wrong. At its center
  stands a chair carved from a single massive piece of chrysalis chitin,
  its surface covered in iridescent whorls that shift colour when you move.
  No two angles show the same pattern. The air shimmers faintly with
  residual mutation energy -- a pressure behind the eyes, a sense that
  space here is slightly thinner than it should be. Trophies hang from
  the walls on iron hooks: guard badges from three different city watch
  units, a merchant guild seal still attached to its ribbon, a broken
  sword with a noble crest on the guard. Whatever sits in that throne
  has been active for a long time. The room smells of chrysalis and
  of something that is almost fear but is not quite.
biome: cave
