nouns:
  stalls: Wooden stalls with canvas roofs, each one displaying goods on planked
    counters. The food vendors keep their wares fresh under damp cloth, shooing
    away flies and pigeons with equal vigour.
  brazier: A portable iron brazier on wheels, its coals glowing orange. Skewered
    meat sizzles over the heat, the fat dripping and hissing. The smell is
    irresistible.
