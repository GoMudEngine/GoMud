zone: Thornwall City
title: Market Square, West
description: The western edge of Market Square is dominated by food vendors -- stalls
  selling bread, cheese, dried meat, and seasonal vegetables arranged in rows beneath
  canvas awnings. The square is paved with broad flagstones, worn concave in the
  centers from centuries of foot traffic. The noise is constant -- hawkers calling
  prices, customers haggling, cart wheels grinding on stone. A food vendor has set
  up a cart with a brazier, selling skewered meat and roasted roots to the market
  crowd.
