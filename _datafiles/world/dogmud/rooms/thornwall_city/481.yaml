nouns:
  hearth: A squat brick hearth built against the outer wall, venting through
    a hole knocked in the brickwork above. The cooking grate is iron, warped
    slightly by heat but still sturdy. Grease stains and soot coat the bricks
    around the firebox.
  table: A heavy wooden work table, its surface gouged and scored from years
    of knife work. Bowls, spoons, and a stone mortar sit in a rough cluster
    at one end.
idlemessages:
- Something pops and sizzles on the hearth grate.
- The smell of roasting meat drifts through the doorway to the tavern.
