roomid: 481
zone: Thornwall City
title: Tavern Kitchen
description: >
  A cramped back kitchen behind the Drowning Post, fitted out as a proper
  cooking workshop. A brick hearth dominates one wall, its iron cooking grate
  blackened by years of service. Bundles of dried herbs hang from the low
  ceiling, and a scarred wooden table holds knives, bowls, and a mortar and
  pestle. Shelves along the opposite wall hold jars of salt, rendered fat,
  and dried spices -- the raw materials of a working kitchen. The air is thick
  with the smell of grease, onions, and wood smoke. A narrow doorway opens
  east to the main tavern floor. A trapdoor in the floor leads down to the
  cellar.
