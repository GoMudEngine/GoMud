roomid: 481
zone: Thornwall City
title: Tavern Kitchen
description: >
  A cramped back kitchen behind the Drowning Post, barely large enough for
  two people to work without bumping elbows. A brick hearth dominates one
  wall, its iron cooking grate blackened by years of service. Bundles of
  dried herbs hang from the low ceiling, and a scarred wooden table holds
  knives, bowls, and a mortar and pestle. The air is thick with the smell
  of grease, onions, and wood smoke. A narrow doorway opens east to the
  main tavern floor.
biome: city
