nouns:
  houses: Narrow-fronted houses with shared walls, each one slightly different from
    its neighbours -- a different colour of shutter, a window box here, a carved
    doorframe there. The individuality is small but fierce, the only expression
    of personality available in such tight quarters.
  laundry: Lines of drying clothes span the street from upper windows -- shirts,
    sheets, stockings, all fluttering like flags of domesticity. The arrangement
    suggests an informal system where certain lines belong to certain households.
