roomid: 477
zone: Thornwall City
title: Residential Ward, North
description: North of the market, the city settles into a residential neighbourhood
  of narrow streets and close-built houses. The buildings are two and three stories
  tall, their upper floors jutting out over the street on timber brackets until the
  houses nearly touch across the gap. Laundry lines create a web of drying cloth
  overhead. The ward houses the city's working population -- labourers, clerks, junior
  merchants, and families who have lived in the same buildings for generations. It is
  quiet compared to the market, with the particular hush of a neighbourhood where
  people are either at work or sleeping.
biome: city
