nouns:
  post: A small stone building with an open door, staffed by city guards. A desk
    inside is covered with paperwork. A board on the wall lists recent incidents
    and patrol assignments.
  office: The customs office has a counter facing the gate traffic, staffed by a
    bored-looking clerk. Signs list tariffs for commercial goods. Most travellers
    walk past without stopping.
