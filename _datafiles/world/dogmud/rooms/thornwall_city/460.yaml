zone: Thornwall City
title: Gate Ward
description: Beyond the gate tunnel, Thornwall opens up around you. The Gate Ward is
  a broad cobblestoned space where the traffic of a city begins -- cart handlers
  shouting directions, porters hauling goods, travellers getting their bearings. The
  buildings here are functional rather than attractive -- a guard post to the left,
  a customs office to the right, and the wide avenue of Main Street running east into
  the city's heart. The city wall looms behind you, massive and reassuring from this
  side. Ahead, the noise and smell of civilization in all its dense, complicated glory.
