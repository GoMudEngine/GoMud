roomid: 509
zone: Thornwall City
title: The Stash
description: >
  A hidden compartment behind the throne chamber, its walls lined entirely
  in layered chrysalis resin to seal out moisture and preserve whatever
  is stored within. The lock mechanism on the entry is intricate -- multiple
  tumblers, each independently weighted, and the door frame smells of
  something acrid that clings to the nose. Velvet-lined shelves cover
  the back wall, their fabric dark with age but still soft. On them, the
  best of what has been taken: wrapped in oilcloth, stored with care,
  belonging to people who will never see them again. The room smells of
  chrysalis, old velvet, and the particular stillness of a place that
  has been sealed for a long time.
biome: cave
