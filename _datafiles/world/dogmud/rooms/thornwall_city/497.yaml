nouns:
  desk: A small writing desk, its surface stained with ink. Shipping
    manifests are stacked neatly -- dates, quantities, destinations.
    The handwriting is precise and educated.
  curtain: A heavy curtain of oiled canvas, hung from iron rings on a rod.
    It blocks both light and sound from the room beyond.
idlemessages:
- Oil lamps flicker in their wall niches, casting steady light.
- The curtain sways faintly, disturbed by a draught from below.
