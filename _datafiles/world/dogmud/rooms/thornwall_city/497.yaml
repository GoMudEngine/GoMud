zone: Thornwall City
title: Torvan's Anteroom
description: >
  The tunnel opens into a low-ceilinged anteroom lit by a pair of oil
  lamps set into wall niches. A heavy curtain of oiled canvas hangs across
  the southern exit, muffling sound from beyond. A small desk against the
  east wall holds a stack of shipping manifests and a pot of ink. This is
  the outer office of whoever runs the operation -- a place for receiving
  reports and issuing orders before visitors are allowed further in.
