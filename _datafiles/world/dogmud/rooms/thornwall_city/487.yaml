nouns:
  rubble: Fallen stone blocks, cracked timber supports, and packed earth.
    The collapse is thorough -- there is no way through. But the floor
    feels different near the east edge of the debris. Hollow, almost.
  floor: The stone floor near the base of the collapse is cleaner than it
    should be. No dust accumulation. The mortar seams look disturbed,
    as if something shifts through here regularly. A faint organic smell
    rises from somewhere below.
idlemessages:
- Dust sifts down from a crack in the ceiling.
- A stone shifts somewhere in the rubble, settling deeper.
- A warm, sweetish draft rises faintly from the floor near the debris.
