roomid: 487
zone: Thornwall City
title: Collapsed Passage
description: >
  The passage ends in a wall of fallen stone and splintered timber. Whatever
  this channel once connected to is buried under tons of rubble. Chunks of
  dressed stone jut from the debris at odd angles, and dust still sifts down
  from cracks in the ceiling above. The collapse looks old -- decades at
  least -- but the stone overhead creaks ominously. Nothing useful remains
  here except the faint impression that this tunnel once continued much
  further east, toward the outer wall.
biome: cave
exits:
  west:
    roomid: 486
nouns:
  rubble: Fallen stone blocks, cracked timber supports, and packed earth.
    The collapse is thorough -- there is no way through without serious
    excavation equipment and a death wish.
idlemessages:
- Dust sifts down from a crack in the ceiling.
- A stone shifts somewhere in the rubble, settling deeper.
