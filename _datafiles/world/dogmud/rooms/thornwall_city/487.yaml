roomid: 487
zone: Thornwall City
title: Collapsed Passage
description: >
  The passage ends in a wall of fallen stone and splintered timber. Whatever
  this channel once connected to is buried under tons of rubble. Chunks of
  dressed stone jut from the debris at odd angles, and dust still sifts
  down from cracks in the ceiling above. The collapse looks old -- decades
  at least -- but the stone overhead creaks ominously. A faint sweetness
  drifts up from the floor -- organic, warm, and entirely wrong for a dead
  end. The rubble is thorough, but the floor is not.
biome: cave
