zone: Thornwall City
title: Tailor's Workshop
description: >
  A tidy workshop occupies the ground floor of a narrow merchant house just
  off the market square. A heavy loom fills most of the back wall, flanked
  by shelves stacked with bolts of cloth and rolls of tanned hide. A cutting
  table stands in the center of the room, its surface scored with thousands
  of knife marks. The smell of sizing paste and fresh dye hangs in the air.
