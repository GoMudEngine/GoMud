roomid: 474
zone: Thornwall City
title: Back Alley, West
description: A narrow passage between the backs of buildings, barely wide enough for
  two people to pass. The cobblestones here are slick with runoff from kitchen drains,
  and the walls are stained with damp and less identifiable substances. This is the
  city's underbelly -- the space between the respectable facades where refuse collects,
  rats forage, and people who prefer not to be seen conduct their business. A doorway
  halfway along has been fitted with a heavy curtain instead of a door, suggesting
  commerce of the unofficial kind.
