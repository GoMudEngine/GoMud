roomid: 507
zone: Thornwall City
title: The Listening Post
description: >
  A narrow niche carved into the rock east of the den, separated from it
  by a thin wall with a horizontal slit at eye height -- enough to watch
  the entire chamber below without being seen. A crude speaking tube of
  fitted copper pipe runs up through the rock and terminates in a funnel,
  bringing sound from somewhere above. Maps of Thornwall's sewer system
  cover one wall, pinned with chrysalis resin tacks and annotated in a
  cramped, careful hand -- entry points circled, patrol routes marked in
  different inks, guard post locations crossed out and redrawn over months
  of changes. In the shadows at the far end, a hooded figure sits behind
  a low table, very still, waiting.
biome: cave
