roomid: 491
zone: Thornwall City
title: The Main Run
description: >
  The tunnel widens into what was clearly once a primary drainage channel,
  now repurposed. The water channel has been boarded over to create a flat
  walkway, and the walls are marked at intervals with chalk arrows pointing
  south. Scuff marks on the boards and fresh mud tracked along the passage
  confirm heavy foot traffic. A side passage opens west into a smaller
  chamber. The main tunnel continues south toward what sounds like voices.
