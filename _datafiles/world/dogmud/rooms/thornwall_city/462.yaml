roomid: 462
zone: Thornwall City
title: Main Street, Central
description: The center of Main Street is marked by a worn stone fountain that has
  not held water in years -- its basin is used as an informal message board, with
  notices and handbills tucked under stones along the rim. The street widens here
  into a small plaza where the major thoroughfares converge. To the north, the Temple
  District's spire is visible above the rooftops. To the south, a narrower street
  leads toward the Craftsmen's Quarter. The buildings here are better maintained --
  fresh paint, clean windows, the occasional decorative ironwork.
