nouns:
  fountain: A stone fountain in the classical style -- a central pillar topped with a
    worn figure too weathered to identify, surrounded by a circular basin. The
    plumbing failed long ago. The basin is dry, its floor covered in a layer of
    notices, lost buttons, and pigeon droppings.
