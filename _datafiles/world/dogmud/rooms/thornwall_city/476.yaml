nouns:
  shelves: Floor-to-ceiling shelves packed with ledgers, each one labelled by year
    and category. The oldest are leather-bound and crumbling at the spines. The
    newest are identical in format but the leather is fresh. The system is
    meticulous, if overwhelming.
  counter: A wooden counter with a brass bell for service, a stack of blank request
    forms, and an inkwell. A sign reads "All requests must be submitted in writing.
    Processing time varies. Do not ring bell more than once."
