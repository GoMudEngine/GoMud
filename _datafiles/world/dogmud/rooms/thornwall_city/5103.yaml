title: Olen's Chamber Above the Temple
description: A spare cell of a room above the temple, scarcely larger than the
  cot it holds. A worn breviary rests on a small shelf beside a clay basin. A
  single tall window admits a slant of pale light. Even here the air smells of
  beeswax and old incense.
