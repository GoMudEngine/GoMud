title: Enchanter's Circle
description: |
  A circular chamber carved from dark stone, its floor inlaid with a ring of pale, luminescent crystals that pulse with a slow, organic rhythm. The air hums with chrysalis energy — faint, persistent, and slightly unsettling. Diagrams of mutation patterns and binding sigils cover the walls in faded ink, their lines suggesting anatomies that are not quite human. A heavy iron stand in the center holds a shallow basin where catalysts are mixed and enchantments are born.
