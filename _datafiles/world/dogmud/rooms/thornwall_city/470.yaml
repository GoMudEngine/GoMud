roomid: 470
zone: Thornwall City
title: Craftsmen's Quarter, East
description: The eastern end of the Craftsmen's Quarter is dominated by a blacksmith's
  forge -- the largest workshop on the street, its double doors thrown wide to vent
  the heat. The forge fire glows orange through the doorway, and the smith's anvil
  rings with a steady, purposeful rhythm. This is where the city's tools, hardware,
  and weapons are made and repaired. The smithy also serves as an informal gathering
  place for the quarter's workers, who stop by to warm their hands and exchange news.
