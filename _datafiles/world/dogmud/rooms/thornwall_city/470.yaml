nouns:
  forge: A proper blacksmith's forge with a stone hearth, a bellows worked by a
    lever, and an anvil that has been beaten into a slight dish by years of use.
    The fire is banked but hot, its coals a deep orange. Tools hang on pegs along
    the walls -- hammers, tongs, punches, files -- each one worn smooth with use.
  anvil: A massive iron anvil, its face scarred and pitted from decades of
    hammering. The horn is worn smooth, and the hardy hole holds a cutting tool.
    This is the heart of the smithy -- everything in the shop exists to serve it.
