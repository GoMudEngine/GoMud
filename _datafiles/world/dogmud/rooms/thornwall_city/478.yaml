roomid: 478
zone: Thornwall City
title: Residential Ward, South
description: The southern edge of the residential ward borders the market square and
  the temple district, giving it a slightly more open feel than the cramped streets
  to the north. A small public well occupies a widening in the street, surrounded
  by a low wall where residents sit and gossip. The houses here are slightly better
  maintained -- proximity to the temple and market has kept property values stable
  even as the outer wards have declined. A message board nailed to a wall post holds
  neighbourhood notices and lost-and-found postings.
