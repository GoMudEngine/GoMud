roomid: 500
zone: Thornwall City
title: Sealed Drain Grate
description: >
  A rusted iron grate lies half-hidden beneath a crust of rubble and dried
  chrysalis residue. Scratch marks on the iron bars show it has been pried
  open before -- the hinges are newer than the frame, replaced after repeated
  forced entries. Chrysalis resin beads along the edges like dried amber,
  sealing the cracks where tunnel air once leaked upward. The shaft below
  breathes warm, stale air laced with something organic and sweet.
biome: cave
