nouns:
  grate: A rusted iron grate set into the floor. The bars are thick but old,
    the lock mechanism newer -- someone replaced it after the original was
    broken. Scratch marks around the frame show repeated forced entry.
  rubble: Loose stone and dried clay packed around the grate's edges,
    deliberately placed to make it look like a cave-in rather than an
    entrance. Some of the rubble is fake -- it sits too evenly.
  scratch marks: Deep gouges in the iron frame, made by tools or fingernails.
    Some are fresh. Something comes and goes through here often enough to
    wear the metal smooth on the underside of the bars.
  resin beads: Amber-coloured droplets of chrysalis resin, dried hard along
    the grate's edge. They fill the gaps between bars and frame like a
    secondary seal. Someone wanted this passage to hold scent in as well
    as intruders out.
idlemessages:
- Warm air seeps up through the grate, carrying a faintly sweet organic smell.
- The chrysalis resin along the bars glints faintly in any available light.
