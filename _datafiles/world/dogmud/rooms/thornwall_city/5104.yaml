roomid: 5104
zone: Thornwall City
title: Guard Barracks, Sleeping Quarters
description: >-
  The upper floor of the guard barracks is a long, low-ceilinged room
  lined with wooden bunks, each with a straw mattress, a coarse wool
  blanket, and a small shelf holding a guard's personal effects. Boots
  are lined up under each bunk in a soldier's habit too ingrained to
  break. The smell is familiar -- leather polish, sweat, and the faint
  tang of the city drifting up through the floor. A rack near the door
  holds off-duty tabards. A narrow window at the far end looks out over
  the Gate Ward below.
biome: city
