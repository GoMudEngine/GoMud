roomid: 467
zone: Thornwall City
title: Temple District
description: A quieter part of the city, set apart from the market's noise by a low
  wall and a row of ancient yew trees. The temple dominates the district -- a stone
  building of considerable age, its spire the tallest structure in Thornwall. Smaller
  buildings cluster around it -- a hospice, a scriptorium, and residences for the
  temple staff. The cobblestones here are cleaner than the rest of the city, swept
  daily by acolytes. The air smells of incense and old stone.
biome: city
