nouns:
  temple: The temple is built of pale limestone that has aged to a warm honey colour.
    Its architecture is old -- pointed arches, narrow windows, a spire that tapers
    to a weathervane. The doors are heavy oak, standing open during the day. A
    carved motto above the entrance has been worn nearly illegible by weather.
  trees: Ancient yew trees, their trunks thick and gnarled, their dark foliage
    creating pools of shade. They predate the temple and possibly the city itself.
    Birds nest in their upper branches, their calls oddly peaceful.
idlemessages:
- An acolyte sweeps the cobblestones with slow, methodical strokes.
- The smell of incense drifts from the temple's open doors.
- A bell in the spire chimes the hour, its tone clear and resonant.
