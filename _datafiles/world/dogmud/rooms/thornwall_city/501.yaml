roomid: 501
zone: Thornwall City
title: Resin-Slicked Shaft
description: >
  A near-vertical shaft drops away into darkness, its walls coated in a
  thick layer of hardened chrysalis resin that shimmers faintly with trapped
  bioluminescence. Hand- and footholds have been carved directly into the
  tacky surface -- rough, irregular, but workable. The air here is thick
  and warm, carrying the sharp sweetness of fresh resin. A rusted iron piton
  juts from the wall above, trailing frayed rope fragments. Someone rigged
  a climbing line here and abandoned it. Watch your step -- the footholds
  are slicker than they look, and the walls hide more than resin.
biome: cave
