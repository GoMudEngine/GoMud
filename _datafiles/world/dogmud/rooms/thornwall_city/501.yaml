nouns:
  resin: >
    The chrysalis resin coats every surface of the shaft in overlapping
    layers, each new coat slightly translucent over the last. Deep
    inside the hardened amber, you can make out the shapes of insects
    -- small ones, trapped and preserved like specimens in glass.
    Still. Watching.
  piton: >
    A rusted iron piton hammered into the wall above head height.
    Old work -- the metal has oxidised to dark brown against the
    amber resin. The rope fragments tied through its eye are frayed
    nearly to breaking.
  rope fragments: >
    Short lengths of frayed rope hanging from the piton above. They
    are too short to be useful now -- the rest was cut away or rotted
    through. The ends are raw, not cleanly cut.
  footholds: >
    Rough divots carved into the resin with something sharp. They
    are serviceable but coated in a thin film of fresh resin that
    oozes from the walls continuously. Every third hold has a smear
    of something dark -- old blood, or just mud.
idlemessages:
- The resin walls pulse faintly with trapped bioluminescence, slow as breath.
- A bead of fresh resin detaches from the wall and falls into the dark below.
- Warmth rises from the shaft below, carrying that sweet organic smell.
