- mobid: 372        # Halix, Steppe Forager (Stage 3.1)
idlemessages:
- Incense smoke curls upward from the altar bowl, vanishing into the vault above.
- A candle gutters and steadies, sending shadows dancing across the pillars.
- Somewhere in the temple, a voice murmurs in quiet prayer.
