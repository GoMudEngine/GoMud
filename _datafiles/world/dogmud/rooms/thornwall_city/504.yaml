roomid: 504
zone: Thornwall City
title: The Crawl
description: >
  A passage so low it forces you to your hands and knees. The walls are
  close enough to brush both shoulders, scored with long scratches -- some
  made by tools cutting footholds, but others look like fingernail gouges,
  made by someone dragged through unwillingly. A dark smear on the floor
  has been partially wiped but not entirely erased. Chrysalis residue is
  pressed into the scratches and dried brown. Scattered in the dust near
  the west entrance: a set of bone dice with carved pips, and a torn
  playing card showing a figure in a black mask.
biome: cave
