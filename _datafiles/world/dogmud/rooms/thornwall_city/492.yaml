nouns:
  shelf: A rough plank shelf holding pouches of dried herbs, coils of thin
    rope, and folded signal flags in dark colours. The herbs smell medicinal
    rather than culinary.
  goods: Bolts of undyed cloth, ceramic jars of oil or spirits, bundles
    wrapped tightly in oilskin. All of it is good quality -- this is not
    salvage or stolen goods but legitimate trade merchandise smuggled past
    the city tariffs.
idlemessages:
- The smell of oilskin and dried herbs hangs thick in the stale air.
- A crate lid sits slightly askew, as if recently opened and replaced.
