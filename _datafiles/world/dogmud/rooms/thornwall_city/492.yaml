roomid: 492
zone: Thornwall City
title: Stash Room
description: >
  A small chamber carved out of the tunnel wall, roughly rectangular and
  stacked floor to ceiling with goods. Wooden <ansi fg="itemname">crates</ansi>
  hold bolts of cloth, ceramic jars sealed with wax, and bundles wrapped
  in oilskin. None of it bears customs stamps or merchant seals -- these
  goods entered the city without passing through any gate. A rough shelf
  against the back wall holds smaller items: pouches, tally records, and
  what looks like a set of signal flags.
