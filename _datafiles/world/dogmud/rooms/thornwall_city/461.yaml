roomid: 461
zone: Thornwall City
title: Main Street, West
description: Main Street runs east through the city, wide enough for two carts and
  a stream of pedestrians between them. The buildings rise two and three stories on
  either side, their ground floors given over to shops and businesses while laundry
  lines crisscross the upper stories. The cobblestones are worn smooth by generations
  of traffic, and drainage channels run along the gutters. The western end has a
  rougher character than the city center -- the shops are smaller, the paint is
  peeling, and the people move with the hurried purpose of those who work for a living.
