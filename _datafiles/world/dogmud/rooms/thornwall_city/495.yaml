roomid: 495
zone: Thornwall City
title: The Split
description: >
  The tunnel reaches a fork where the original drainage channel splits.
  The eastern branch is sealed with a wall of loose-fitted stone -- blocked
  intentionally but not permanently. The western passage descends at a
  slight grade, the air growing warmer and drier as it goes. Chalk marks
  on the wall at the fork show a crude arrow pointing west, with a symbol
  beneath it that might be a key or a fish hook.
biome: cave
