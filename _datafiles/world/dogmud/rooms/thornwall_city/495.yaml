nouns:
  wall: A wall of loose-fitted stone blocking the eastern branch. The
    mortar is fresh -- this was sealed recently. Whatever lies beyond
    has been deliberately cut off.
  marks: Chalk marks on the stone. A crude arrow pointing west, and below
    it a symbol -- a curved line with a hook at the end. A signature or
    a warning.
idlemessages:
- The air is warmer here, rising from the western passage.
- Chalk dust clings to the wall where someone drew the arrow.
