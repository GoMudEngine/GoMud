roomid: 5105
zone: Thornwall City
title: Holding Cell
description: A cramped cell carved into the stone foundations beneath the guard
  barracks, reached by a short flight of worn steps. Iron bars set deep into
  the rock form the front wall, their lock heavy and well-oiled. A thin pallet
  of straw lies in one corner beside a battered tin bucket, and a high, narrow
  slit near the ceiling lets in a grudging bar of daylight. The air is cool and
  close, smelling of damp stone and old straw. Footsteps and muffled voices
  drift down from the duty room above.
biome: city
coord:
  x: 0
  y: 1
  z: -1
exits:
  up:
    roomid: 473
nouns:
  bars: Thick iron bars set into the stone, spaced too narrow to squeeze
    through and too solid to bend. The lock is a heavy iron affair, recently
    oiled -- these cells see regular use.
  lock: A heavy iron lock on the cell door, oiled and well maintained. Only the
    guards carry the key, and they open it on their own schedule, not yours.
  pallet: A thin pallet of straw in the corner, flattened by many previous
    occupants. It is the only concession to comfort in the cell.
  straw: Clean enough straw, recently changed. Someone takes the small trouble
    of keeping the cell from becoming a health hazard.
  bucket: A battered tin bucket in the corner. Its purpose requires no
    explanation, and one hopes the guards empty it between occupants.
  slit: A narrow slit of a window near the ceiling, too high and too small to
    be any use for escape, but it lets in a thin bar of daylight and a little
    air.
idlemessages:
- Footsteps cross the duty room floor above, then fade.
- A draft from the high window stirs the straw on the floor.
- Keys jingle somewhere beyond the bars, then recede.
- Muffled conversation drifts down from the barracks above.
