roomid: 465
zone: Thornwall City
title: Market Square, Center
description: The center of Market Square is the busiest place in Thornwall. A raised
  stone platform serves as an auction block, a performance stage, and an occasional
  soapbox for public announcements. The surrounding stalls sell everything -- cloth,
  tools, leather goods, pottery, imported luxuries from the eastern trade routes. The
  crowd is dense and diverse, a cross-section of the city's population jostling for
  position among the stalls. Pickpockets work the edges, guards patrol in pairs, and
  above it all the temple spire watches from the northwest.
