nouns:
  platform: A raised stone platform, about waist-high, worn smooth by use. Iron rings
    set into the corners suggest it once served a darker purpose, but now it is
    used for auctions and announcements. A merchant is currently showing bolts of
    dyed cloth to a small crowd.
