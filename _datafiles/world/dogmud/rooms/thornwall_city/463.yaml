roomid: 463
zone: Thornwall City
title: Main Street, East
description: The eastern end of Main Street opens into the approach to Market Square,
  the city's commercial heart. The buildings here are the most prosperous on the
  street -- merchant houses with carved lintels, a money-changer with iron bars on
  the windows, and a wine merchant whose casks line the pavement. The foot traffic
  thickens as the market draws near, and the air fills with the competing smells of
  spices, leather, and roasting meat from the square ahead.
