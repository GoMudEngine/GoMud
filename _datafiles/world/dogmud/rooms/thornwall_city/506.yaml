roomid: 506
zone: Thornwall City
title: Resin Armory
description: >
  A compact alcove packed with chrysalis-hardened equipment. Racks along
  both walls hold daggers with resin-coated blades and gauntlets studded
  with crystallized chrysalis nodes. A workbench dominates the center,
  its surface dusted with chrysalis shavings and gritty with cured resin
  powder. A small pot of binding paste sits open beside iron molds still
  bearing impressions of knuckle weapons. Everything here was made, not
  looted -- crafted to a standard by someone who knows exactly what they
  want their tools to do. The air smells of heated metal and the sharp
  mineral tang of chrysalis compound.
biome: cave
