roomid: 503
zone: Thornwall City
title: Fungal Nook
description: >
  A cramped side chamber where luminescent fungi grow in dense clusters on
  chrysalis-laced stone, filling every surface with soft blue-white light.
  The air here is humid and thick with spores, drifting in lazy spirals
  whenever the air stirs. A battered <ansi fg="itemname">chest</ansi> sits
  half-buried in a mound of fungal growth, its iron surface etched with crude
  ward symbols matching those in the corridor below. The growth has spread
  across the lid and begun creeping down the sides, as if trying to claim
  the chest for itself. A rough stone shelf protrudes from the east wall,
  holding a scatter of small objects barely visible under the fungi.
biome: cave
