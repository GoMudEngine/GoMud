roomid: 493
zone: Thornwall City
title: Guard Post
description: >
  A widened section of tunnel fitted out as a checkpoint. A heavy plank
  table blocks half the passage, and a stool sits behind it. A shuttered
  lantern hangs from a nail driven into the mortar between stones. The
  walls are marked with tally scratches -- boredom marks from someone
  counting hours on watch. A narrow passage opens east into a storage
  alcove, and the main tunnel continues south.
