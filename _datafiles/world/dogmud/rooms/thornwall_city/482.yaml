title: Jeweler's Workshop
description: >
  A small workshop tucked behind the tailor's shop, lit by a row of oil
  lamps angled to throw steady light across a heavy wooden workbench. A
  jeweler's bench dominates the center of the room, its surface scarred
  with tiny gouges and burn marks. Magnifying lenses on adjustable arms
  are clamped to the bench edges, and racks of fine pliers, files, and
  setting tools hang within easy reach. Trays of wire coils and pouches
  of mineral dust line the shelves along the back wall.
