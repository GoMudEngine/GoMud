zone: Newcomer Antechamber
title: The Threshold
description: >
  A figure of grey light waits here. 'Last lesson, and the kindest:
  you are not alone here. Out in the world, people and creatures
  answer when you speak to them -- so speak to me now, and that same
  breath will carry you through. Type  talk guide  to speak to me, or
  ask guide world  to ask a question. Either one sends you on. The
  real world is waiting.'
