roomid: 6262
zone: Newcomer Antechamber
title: The Proving
description: >
  A rough practice ring is scuffed into the grey floor, worn smooth by the feet
  of everyone who ever came through this way. At its center a straw effigy stands
  quiet on a fixed post, faceless but for two charcoal smudges where eyes might
  be. Dewey rolls both shoulders loose and nods you toward it.
biome: default
exits:
  north:
    roomid: 6467
spawninfo:
  - mobid: 9491
  - mobid: 9614
nouns:
  effigy: >-
    A man-shape of bound straw on a fixed post, charcoal smudges for eyes. It
    jerks and flails on its pivot when struck, but there is no strength behind
    it -- it could never land a blow worth feeling. The safest sparring partner
    you will ever have.
  ring: >-
    A rough circle scuffed into the grey floor by countless feet. Every soul
    who came through here learned to throw a punch, a spell, a shout in this
    same ring. The wear is oddly comforting.
  dewey: >-
    Dewey rolls both shoulders loose and nods you toward the effigy. 'No one
    ever died against this fellow. Best place there is to make your mistakes.'
idlemessages:
  - The effigy sways on its post and settles, straw whispering.
