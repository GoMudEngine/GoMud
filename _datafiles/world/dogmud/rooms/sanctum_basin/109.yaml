roomid: 109
zone: Sanctum Basin
title: The Forge
description: The clang of hammer on steel rings out from an open-sided smithy built
  against the eastern wall of the basin. The heat from the forge is intense in the
  already warm desert air. Basalt columns support a heavy roof of slate, and the walls
  are hung with tools, half-finished blades, and racks of metal stock. Blacksmith
  Korvath works here, a figure of soot and muscle.
