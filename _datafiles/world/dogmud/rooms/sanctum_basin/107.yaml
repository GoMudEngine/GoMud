roomid: 107
zone: Sanctum Basin
title: Town Square
description: You stand in the center of Sanctum Basin's small settlement -- a broad
  flagged square of dark stone surrounded by low buildings of basalt brick. A carved
  sign post stands at the center, hung with a painted map of the basin and its facilities.
  Citizens and initiates move through the square, their voices low in the dry air.
  Roads lead in all directions from this central hub.
biome: city
