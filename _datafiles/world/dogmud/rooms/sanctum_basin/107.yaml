idlemessages:
- A group of <ansi fg="mobname">initiates</ansi> crosses the square, deep in conversation.
- A <ansi fg="mobname">citizen</ansi> pauses to examine the <ansi fg="itemname">map</ansi> on the sign post.
- The sound of <ansi fg="mobname">hammer strikes</ansi> echoes faintly from the east.
- Two <ansi fg="mobname">apprentices</ansi> argue loudly about the correct pronunciation of a Fold invocation.
