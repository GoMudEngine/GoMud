title: Cave Path
description: A low tunnel of raw basalt opens here in the northern cliff face -- the
  entrance to a cave system that penetrates the plateau. The air inside is noticeably
  cooler, carrying the damp mineral smell of deep stone. The distant sound of wing-beats
  echoes from within. A lamp bracket is fixed to the wall beside the entrance, suggesting
  this is a known route.
