roomid: 115
zone: Sanctum Basin
title: East Copse
description: A dense tangle of scraggly desert trees and thorned brush occupies the
  eastern edge of the basin's upper tier. The air is cooler under the sparse canopy,
  and shadows flicker with the movement of cave bats roosting in the twisted branches.
  The undergrowth looks like it could conceal forage-worthy plants for those who know
  where to look.
biome: forest
exits:
  west:
    roomid: 114
  south:
    roomid: 110
idlemessages:
- Something rustles in the upper branches -- a <ansi fg="mobname">cave bat</ansi> shifting its grip.
- The thorned brush here is thick enough to slow any passage off the trail.
- The smell of dry earth and old wood is surprisingly pleasant.
spawninfo:
- mobid: 67
  message: A cave bat drops from the branches and swoops toward you.
  hostile: true
  respawnrate: 6 real minutes
