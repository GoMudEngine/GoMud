title: Market Street
description: A short cobbled street runs through the market district of Sanctum Basin.
  Open-fronted stalls display basic supplies -- trail rations, rope, lanterns, water
  skins. The merchants are a mix of gruff locals and traveling traders who supply
  the Chrysalis academy. The smells of spiced food and tanned leather mix in the dry air.
