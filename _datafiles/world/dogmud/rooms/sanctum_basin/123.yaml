roomid: 123
zone: Sanctum Basin
title: Desert Cookfire
description: >
  A ring of soot-stained stones marks a well-used campfire in a sheltered
  hollow between two basalt outcrops. The ashes are still warm. A flat rock
  beside the fire pit serves as a cutting surface, its top stained dark with
  old juices. Bundles of dried sage hang from a rope strung between the rocks,
  and a clay water jug sits in the shade. The site has the feel of a place
  that travelers return to again and again.
