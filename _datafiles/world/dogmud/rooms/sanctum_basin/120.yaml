description: The deepest chamber of the cave system is vast, its ceiling a dome of
  black basalt hung with mineral formations that catch the faint light. At the center
  crouches the Aberrant Chrysalis -- a creature that was once on the path to transformation
  but was overtaken by something wrong. It is larger than a person, its limbs jointed
  at impossible angles, radiating waves of distorted belief that make the air shimmer
  and the mind ache.
