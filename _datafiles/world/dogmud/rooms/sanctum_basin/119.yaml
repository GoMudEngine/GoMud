roomid: 119
zone: Sanctum Basin
title: Cave Depths
description: The cave tunnel opens into a broader chamber here, its ceiling lost in
  shadow. Bioluminescent lichen provides faint blue-green light along the walls. The
  cave goblins that have made this space their home have built crude furniture from
  scavenged wood and stone, and they regard newcomers with hostile suspicion. There
  is no way forward or back except through the tunnel to the west.
