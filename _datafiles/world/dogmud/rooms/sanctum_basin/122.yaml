roomid: 122
zone: Sanctum Basin
title: Weaver's Alcove
description: >
  A shaded alcove tucked behind the smithy, screened from the forge heat by
  a curtain of heavy canvas. A sturdy wooden loom stands against the back
  wall, strung with pale thread. Bolts of undyed cloth and strips of cured
  leather hang from pegs overhead. The clatter of the loom competes with
  the distant ring of the blacksmith's hammer.
