title: Academy Hall
description: The main hall of the Chrysalis Academy is a high-ceilinged building of
  basalt blocks, its walls hung with maps and hand-drawn diagrams. Long tables fill
  the interior, and at the far end stands a speaking dais. The Chrysalis Greeter waits
  near the entrance, ready to welcome new arrivals and explain the trials that await
  them in Sanctum Basin.
