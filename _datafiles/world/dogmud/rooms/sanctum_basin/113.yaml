roomid: 113
zone: Sanctum Basin
title: Academy Hall
description: The main hall of the Chrysalis Academy is a high-ceilinged building of
  basalt blocks, its walls hung with hand-drawn diagrams and annotated charts. Set
  directly into the floor near the entrance is a large mosaic map of the Windward
  Marches -- settlements picked out in pale marble, roads in dark basalt, and wide
  blank spaces left where surveys remain incomplete. Long tables fill the interior,
  and at the far end stands a speaking dais. The Chrysalis Priest waits near the
  entrance, still and unhurried, ready to perform the Awakening Rite for those who
  are newly arrived in Gaius.
