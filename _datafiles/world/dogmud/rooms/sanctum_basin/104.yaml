roomid: 104
zone: Sanctum Basin
title: Ridge Path
description: A thin trail winds east along the rim of the plateau, following the
  edge of the clifftop. To the south the land drops away in sheer faces of black
  basalt. To the north, the plateau spreads open into arid scrubland. The path is
  manageable but exposed -- the wind here is constant and biting.
biome: desert
exits:
  west:
    roomid: 103
  east:
    roomid: 105
idlemessages:
- The wind is relentless here, carrying grit that stings exposed skin.
- A loose stone tumbles off the cliff edge and disappears without a sound.
