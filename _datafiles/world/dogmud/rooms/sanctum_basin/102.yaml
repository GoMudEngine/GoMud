title: Basin Gate
description: A massive archway of black basalt spans the path here, carved with warding
  glyphs that glow faintly in the desert sun. The Basin Warden stands at attention
  beneath the arch, eyes sweeping the road. To the north lies the basin proper; to
  the south, a gated road leads down toward the wider world. A sign reads -- By order
  of the Chrysalis Council, no citizen may pass south without demonstrating readiness.
