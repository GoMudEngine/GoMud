zone: The Fernway South
title: Boar Wallow
description: >
  The ground west of the burn scar drops into a shallow hollow
  where the soil stays wet long after rain, and something has
  taken full advantage of that fact. The
  <ansi fg="itemname">wallow-mud</ansi> at the hollow's lowest
  point is churned grey-brown and knee-deep in the centre,
  stinking faintly of pig and old wet earth. The
  <ansi fg="itemname">hoof-prints</ansi> around the wallow's
  edge are cloven and deep-set in the softer ground, some of
  them fresh enough that the rim is still sharp. An old oak
  at the hollow's edge wears a long polished patch at boar-
  shoulder height — the <ansi fg="itemname">scratching-tree</ansi>,
  its bark smooth and dark where years of coarse-haired backs
  have worked against it. A persistent low cloud of small
  <ansi fg="itemname">flies</ansi> hangs over the wallow;
  brushed away, they return without hurry. Whether the pigs
  themselves are here or gone, the hollow is unmistakably
  theirs.
biome: forest
