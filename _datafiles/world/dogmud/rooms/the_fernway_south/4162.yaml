nouns:
  wallow mud: |
    Grey-brown and thick, the mud at the hollow's centre
    is churned to a soft paste by repeated use — it holds
    prints for days and smells of wet earth and pig both
    at once. The deepest part would take a boot to the
    knee without much argument.
  hoof prints: |
    Cloven-hoof prints ring the wallow in the softer earth
    around its edge — overlapping, various sizes, some older
    and softened and some recent enough that the pressed rim
    is still standing. At least two animals, by the spread
    of the tracks.
  scratching tree: |
    An old oak at the hollow's south edge has had its bark
    polished smooth at boar-shoulder height, the surface
    darkened and worn shiny by years of animals rubbing
    their backs against it. Long coarse hairs are caught
    in the few rough patches that remain.
  flies: |
    A loose cloud of small dark flies works the air above
    the wallow, drawn by the smell and the standing water.
    They take no particular notice of anything; brushed
    away they drift back without apparent annoyance.
