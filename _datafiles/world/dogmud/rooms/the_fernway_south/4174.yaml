roomid: 4174
zone: The Fernway South
title: Twisted Hawthorn
description: >
  The forest thins here to a last junction before the trees
  give out entirely, dominated by a single old
  <ansi fg="itemname">hawthorn</ansi> shaped by years of
  prevailing wind into a permanent south-leaning lean — the
  branches all bent the same way, as though the tree has been
  pressing into the wind for so long it has forgotten how to
  grow upright. Dark red <ansi fg="itemname">haws</ansi> hang
  in dense clusters from every branch end. For the first time
  in the zone the <ansi fg="itemname">south-wind</ansi> is
  felt rather than merely guessed at — a real dry breeze
  coming from below the treeline, carrying with it the first
  faint smell of open grass instead of leaf-mold. The
  <ansi fg="itemname">drying-soil</ansi> underfoot is noticeably
  sandier than the deep leaf-litter of the northern wood; the
  steppe is close. Trails branch west toward the earth-bank,
  east toward a pocket of wildflowers, and south toward open
  ground.
