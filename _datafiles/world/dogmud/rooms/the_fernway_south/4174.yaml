nouns:
  hawthorn: |
    A single old hawthorn, shaped by years of south wind into
    a permanent lean. The branches are dense with thorns and
    clustered red haws — the tree looks battered and stubborn,
    survivor of whatever weather comes up from the open steppe
    to the south.
  haws: |
    Dark red haws — small thorn-tree berries — cluster thickly
    on every branch end, heavy enough to bow the twigs. Cooked
    or pressed they yield jam, syrup, or medicine; eaten raw
    they are mealy and faintly bitter.
  south-wind: |
    The first real wind in the zone, coming from the south
    past the hawthorn — drier than the forest air and carrying
    a hint of grass-smell from the open steppe beyond the
    trees. It moves intermittently, not a constant breeze.
  drying-soil: |
    The soil underfoot is noticeably drier and sandier than
    the leaf-litter of the deeper forest — a sign the woodland
    is giving ground to the steppe. The top layer crumbles
    instead of compressing underfoot.
idlemessages:
