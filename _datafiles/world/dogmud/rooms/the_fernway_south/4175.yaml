exits:
  north:
    roomid: 4174
nouns:
  steppe: |
    The land south of the treeline is steppe — open, treeless,
    wind-scoured grass and stone stretching to the horizon under
    a wide pale sky. Nothing slows the wind. Nothing breaks the
    sightline. It is a different kind of world from the forest
    at your back.
  pale-grass: |
    Knee-high pale tan grass bends and rises in the constant
    south wind, the blades moving in long even waves like the
    surface of slow water. It feels wilder and older than
    forest grass — adapted to exposure, not shelter.
  scoured-stones: |
    Round stones scatter the steppe ground in all directions,
    weathered smooth by the wind over a long time. They sit
    in the grass without pattern — tumbled by water once,
    worn round by air since. Nothing to stop them rolling
    out here; nothing to catch them.
  south-horizon: |
    The horizon south is unbroken — a long pale line where
    the steppe meets the sky. The Dustwalk lies somewhere out
    there beyond sight. You do not go that way today; the
    forest path behind you leads back to safety.
idlemessages:
- south wind moves the pale-grass in long even waves
