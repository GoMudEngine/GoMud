roomid: 4175
zone: The Fernway South
title: Steppe Edge
description: >
  The trees give out abruptly here. One step the canopy is
  overhead; the next it is not, and the sky opens in all its
  width for the first time since entering the forest. The
  <ansi fg="itemname">steppe</ansi> begins at the treeline and
  runs south without interruption — treeless, windswept, a
  pale expanse of <ansi fg="itemname">pale-grass</ansi> and
  <ansi fg="itemname">scoured-stones</ansi> under a sky that
  feels very large after the close green of the wood. A
  constant south wind presses steadily against the face,
  drier and colder than the forest air, smelling of distance
  and old grass. The <ansi fg="itemname">south-horizon</ansi>
  is unbroken — a long pale line where the steppe meets the
  sky, the Dustwalk somewhere out beyond it. You do not go
  that way today. Behind you the forest stands in a dark wall;
  ahead, the world simply opens and keeps opening.
biome: plains
