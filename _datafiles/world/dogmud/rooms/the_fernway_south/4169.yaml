roomid: 4169
zone: The Fernway South
title: Salt Lick
description: >
  The deer ridge ends here at a low depression in the earth
  where the ground has been worked smooth by generations of
  tongues — a natural <ansi fg="itemname">lick</ansi> a few
  paces across, the surface dark and bare and faintly gleaming
  where the soil has been polished flat. The air carries a
  faint iron-salt tang from the
  <ansi fg="itemname">mineral-seep</ansi> beneath, a slow
  underground weep that brings salt and trace minerals to the
  surface and keeps this patch perpetually damp even in dry
  weather. The deer-sign is thickest here of any place on the
  ridge — <ansi fg="itemname">deer-trails</ansi> converge on
  the lick from every compass point, worn to bare earth by
  small regular feet, the trails narrow and purposeful. At
  the lick's edge, <ansi fg="itemname">lick-marks</ansi>
  groove the surface where the same worn channels have been
  worked at by tongues for so many years the earth shows
  the shape of them, long smooth depressions in the dark
  ground. There is no path further south; the cover closes
  in thick and trackless beyond the lick's far edge.
biome: forest
