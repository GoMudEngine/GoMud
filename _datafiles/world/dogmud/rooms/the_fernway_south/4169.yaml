nouns:
  lick: |
    A natural salt lick — a bare patch of dark earth a
    few paces across, licked smooth and faintly gleaming
    by generations of deer tongues. The surface is damp
    underfoot and gives slightly, the soil packed dense
    by years of small hooves gathering here.
  mineral-seep: |
    The ground here tastes faintly of salt and iron
    where the soil is damp — a slow underground mineral
    seep that brings trace salts to the surface year-
    round, keeping the patch wet and drawing deer even
    when salt is scarce elsewhere in the forest.
  deer-trails: |
    Narrow worn trails converge on the lick from every
    direction, the earth beaten bare by small regular
    feet — a network of purposeful paths through the
    surrounding cover, each one running straight to the
    lick as if the route has been memorized across
    generations.
  lick-marks: |
    Long grooved channels in the dark earth at the
    lick's edge show where tongues have worked the same
    spots for years — smooth depressions worn into the
    surface, the grain of the soil polished in the
    direction of each stroke, older and deeper at the
    center of the lick.
idlemessages:
- a doe and her fawn appear at the lick edge, then are gone
