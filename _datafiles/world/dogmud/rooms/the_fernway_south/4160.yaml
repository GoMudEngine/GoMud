zone: The Fernway South
title: Old Burn Scar
description: >
  The trail south of Briar Tangle opens abruptly where the canopy
  burned away years ago, and the light here is broad and flat —
  startling after the tangle's shade. The
  <ansi fg="itemname">burn-scar</ansi> itself is still legible in
  the charred faces of old stumps and the black streaks up the
  surviving oaks, though the fire was long enough ago that moss
  has softened the worst of it. Across the clearing,
  <ansi fg="itemname">downed-timber</ansi> from trees that fell
  in the heat lies in long grey rolls, half-rotted and bright with
  patches of pale-capped <ansi fg="itemname">mushrooms</ansi>
  running the full length of the damper undersides. A faint char
  smell persists on still days, old and dry, less a burning than
  a memory of one. Competing <ansi fg="itemname">saplings</ansi>
  — oak and birch both — crowd the gap with the urgency of things
  that know the light won't last. A woodpecker works somewhere
  in the standing timber at the clearing's edge, steady and
  unhurried.
