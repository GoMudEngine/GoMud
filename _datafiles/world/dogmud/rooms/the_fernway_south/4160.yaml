nouns:
  burn scar: |
    The blackened stumps and char-streaked oaks that mark the
    old fire's reach are still clear if you know what you're
    looking at — dark wedges low on the bark where the heat
    climbed, and a few standing deadwood spars too burnt to
    host a beetle. The years have softened it; moss runs
    across the charred faces and the smell is almost gone.
  downed timber: |
    Long grey logs lie across the clearing at the angles they
    fell, the bark long since gone and the wood going punky
    in patches where the ground is wet beneath them. Where
    the surface is still firm the grain is raised and smooth
    as old bone.
  mushrooms: |
    Pale-capped fungi run in clusters along the logs'
    damp undersides — shadowcaps mostly, with the cream-white
    gills and faint grey caps common in this kind of rotting
    pine and oak. A few stockier, darker-capped species among
    them that a careful forager would leave alone.
  saplings: |
    Young oaks and white birches have come up fast in the
    open light, some already shoulder-high, their canopy
    still too thin and scattered to shade out the competition
    below. In another decade they will close the gap; for now
    they race each other for the sky.
