nouns:
  bramble: |
    Old grey-stemmed bramble lines both shoulders of the
    path, the canes thick as a finger and set with curved
    thorns that catch at sleeves and pack-straps. It is
    densest along the eastern shoulder where the canopy
    break lets in enough light for it to reach chest-height.
  thorn windfall: |
    A storm-fallen bough — thorny-stemmed and once substantial
    — lies across the path, its bark long gone and the wood
    beginning to soften. Last year's leaves are still caught
    in its branches, brown and papery, and the thorn-hooks
    still work on anything that brushes them.
  deer track: |
    Beneath the bramble overhang the earth is packed hard and
    smooth by long use — a deer-trail that predates the path
    itself by the look of it. Fresh split-hoof prints in a soft
    patch near the windfall suggest the animals pass at night,
    regular as any road.
  leaf litter: |
    Last autumn's leaves have settled ankle-deep in the shelter
    the bramble provides, brown and curl-edged and damp
    underneath. The smell is of slow cold decay — not
    unpleasant, just the forest floor doing its work.
