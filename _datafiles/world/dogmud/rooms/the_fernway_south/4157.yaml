zone: The Fernway South
title: Briar Tangle
description: >
  South of Fox Den the earth-track narrows and the canopy
  tightens, and the path's shoulders are overtaken by old
  <ansi fg="itemname">bramble</ansi> — chest-high in places,
  grey-stemmed and thorn-heavy, closing in from both sides
  until the trail is barely a body's width. A storm or two
  ago something large came down across the path and the
  <ansi fg="itemname">thorn-windfall</ansi> was never cleared;
  it lies half-rotted and still snagged with last year's
  leaves, forcing a sideways step around it. The
  <ansi fg="itemname">deer-track</ansi> that runs beneath the
  bramble is packed firm and smooth — deer pass here far more
  often than people do. A smell of damp
  <ansi fg="itemname">leaf-litter</ansi> rises from the ground
  where the bramble has sheltered last autumn's fall from any
  wind, ankle-deep and brown and curl-edged.
