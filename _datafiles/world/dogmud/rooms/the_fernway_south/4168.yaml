roomid: 4168
zone: The Fernway South
title: Birch Stand
description: >
  A loose stand of paper birches fills this stretch of the deer
  ridge, their <ansi fg="itemname">birch-trunks</ansi> pale
  silver-grey among the darker oaks and beeches to the west —
  clean and almost luminous where sunlight reaches them, their
  slim shapes making the grove feel open and slightly exposed.
  Long <ansi fg="itemname">bark-strips</ansi> peel from the
  trunks in loose spirals, the inner surface smooth and faintly
  cream-colored, dry at the curl and papery between the fingers.
  Several trunks weep threads of clear
  <ansi fg="itemname">birch-sap</ansi> from old wounds at
  mid-height — sweet to smell, the sap-runs dried to thin amber
  rivulets down the bark. Where the trunks are smoothest, a
  series of <ansi fg="itemname">deer-rubs</ansi> shows at
  antler height: pale, polished patches where bucks have worked
  the velvet from new antler growth and the bark has been worn
  to bare wood beneath. The birches do not whisper the way
  oaks and beeches do; the stand is quiet save for the light
  clatter of leaves.
