roomid: 4167
zone: The Fernway South
title: Deer Browse
description: >
  East of the twin beeches the forest opens unexpectedly, the
  understory stripped back by generations of deer until the
  <ansi fg="itemname">browse-line</ansi> runs as clean and
  level as a trimmed hedge — every sapling-tip and accessible
  branch bitten off at exactly the same height, the height of
  a roe deer's reach. The ground-cover is cropped close and
  the sightlines are longer here than anywhere in the fernway,
  the thinned canopy letting in more light than the older
  stands allow. <ansi fg="itemname">Hoof-prints</ansi> press
  into the soft earth in overlapping sets — the same paths
  walked so often the prints have deepened into grooves. A
  <ansi fg="itemname">scrape</ansi> of bare earth near the
  nearest oak shows where a buck has pawed away the leaf-litter
  in some earlier season, and small piles of dark
  <ansi fg="itemname">droppings</ansi> dot the browse-line's
  edge in the tidy clusters deer leave behind.
