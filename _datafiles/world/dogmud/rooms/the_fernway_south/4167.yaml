nouns:
  browse-line: |
    Every sapling and young tree at deer-reach height has
    been browsed to a flat line — no upward twig escapes
    the reach, and none below it is spared. The regularity
    of it is almost architectural, a living fence made by
    years of small careful mouths.
  hoof-prints: |
    Cloven-hoof prints press clean and deep into the soft
    earth, narrower and smaller than the boar-sign north of
    here — roe deer, more than one, following the same
    routes so consistently the prints overlap into worn
    channels.
  scrape: |
    A patch of bare dark earth where the leaf-litter has
    been pawed away, the soil turned and packed smooth
    around the edges — a buck marking territory or seeking
    minerals, the sign old enough to be dry at the surface.
  droppings: |
    Small dark deer droppings in tidy clusters along the
    browse-line's edge — the neat, pellet-form sign of
    animals that passed through casually, grazing as they
    moved, unhurried.
idlemessages:
