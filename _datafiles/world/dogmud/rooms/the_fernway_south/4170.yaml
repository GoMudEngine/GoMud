roomid: 4170
zone: The Fernway South
title: Tangled Bracken
description: >
  The trail narrows here to a single dark line pressed through
  a wall of <ansi fg="itemname">bracken-wall</ansi> that rises
  well above head-height on both sides — green and dense and
  close, the fronds arching overhead until the sky is little
  more than a shifting green ribbon above the path. The smell
  is thick with fern-must and damp earth, the air greenish and
  still. Each <ansi fg="itemname">fern-frond</ansi> catches at
  sleeves and shoulders as you push through, leaving streaks of
  moisture where they brush skin. It is impossible to see more
  than a few paces ahead or behind; the <ansi fg="itemname">narrow-trail</ansi>
  simply vanishes into the green wall in both directions. Deep
  in the bracken the constant low <ansi fg="itemname">insect-hum</ansi>
  fills the silence — flies, beetles, and other things that
  live unseen in the tangle.
