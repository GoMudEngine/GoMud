roomid: 4176
zone: The Fernway South
title: Birdsong Glade
description: >
  After the cathedral hush of the Old Stand the glade hits
  like a opened window — <ansi fg="itemname">bird-chorus</ansi>
  fills the air from every direction at once, overlapping calls
  of finches and warblers and chickadees that seem to treat
  this clearing as common ground. A <ansi fg="itemname">sun-patch</ansi>
  in the clearing's center catches direct light for much of the
  day, warming the <ansi fg="itemname">long-grass</ansi> that
  grows knee-high where the canopy pulls back. Across the
  clearing a <ansi fg="itemname">fallen-log</ansi> — an old
  beech that came down years ago — lies half-grown-over with
  moss and bracket, the bark lifting in long dry sheets,
  offering a natural bench at the right height for a sitting
  rest. The forest resumes south of the glade, but here for a
  moment the sky is wide and the air is warm and the birds do
  not stop.
biome: forest
