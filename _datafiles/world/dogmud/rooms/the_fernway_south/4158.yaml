nouns:
  bee-tree: |
    A broad old oak whose hollow, a body's-length up the
    trunk, has been occupied long enough that the bark around
    the entry is dark with old wax and propolis. Bees come
    and go in a steady unbroken stream, each departure
    purposeful, each return loaded.
  swarm: |
    Hundreds of honeybees work the air around the tree and
    the hollow's flowering edges, wholly absorbed in the
    business of the hive. They take no particular notice of
    anything below; the work is everything.
  honeycomb: |
    The honeycomb is just visible at the lip of the bee-tree's
    hollow — darkened with layers of old wax, the cells
    packed close. The outermost edge is open to the air and
    the colour of dark amber.
  sun-patch: |
    A clear break in the canopy opens the hollow's centre to
    open sky, and the ground there is noticeably warmer than
    the shaded forest floor around it. The bees work the
    sun-patch's edge as much as the tree, gathering from the
    low clover that grows where the light reaches.
