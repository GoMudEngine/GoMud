roomid: 4158
zone: The Fernway South
title: Beewood Hollow
description: >
  The trail west of Briar Tangle opens without warning into
  a sunlit hollow where the canopy pulls back and the sky
  shows clear overhead. The warmth of the open patch is
  immediate and real. An old oak at the hollow's centre has
  a wax-darkened hollow a body's-length up its trunk — the
  <ansi fg="itemname">bee-tree</ansi> — and a steady traffic
  of honeybees comes and goes from its lip in a low constant
  stream. The air here carries a fat wax-warmth and the thin
  clean edge of honey — not sweet exactly, but close to it.
  A loose drift of the <ansi fg="itemname">swarm</ansi> hangs
  around the upper branches, wholly absorbed, paying no
  attention to the ground below. The
  <ansi fg="itemname">honeycomb</ansi> is just visible at the
  hollow's lip, darkened with years of old wax. The
  <ansi fg="itemname">sun-patch</ansi> at the hollow's centre
  is warm enough to stand in; the bees are drawn to it as
  much as to the oak.
biome: forest
