nouns:
  pool: |
    The brook slows here into a shallow pool perhaps three
    paces across — the current barely perceptible, the
    bottom pale and sandy and visible in every part, the
    water cold and perfectly clear.
  reeds: |
    Marsh-reeds crowd both banks in dense stands, their
    bases in the soft mud and their tips well above head
    height — close-packed enough to conceal a patient
    heron from anything not looking carefully.
  minnows: |
    Small silver fish hang in loose schools near the reedy
    margins, almost motionless against the current, and
    then flash away all at once at a shadow or a sound
    before slowly drifting back.
  heron track: |
    A single line of three-toed prints in the soft mud
    at the pool's southern edge — each impression wide-
    spaced and deliberate, the stride of a bird in no
    hurry. Recent enough that they have not filled with
    water.
idlemessages:
- minnows scatter and re-form in the pool
- ''
- a reed bends in a passing breeze
- ''
- somewhere distant, the rough croak of a heron
