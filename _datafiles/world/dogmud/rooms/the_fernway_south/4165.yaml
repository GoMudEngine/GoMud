roomid: 4165
zone: The Fernway South
title: Heron Pool
description: >
  The brook widens here where the ground levels and slows the
  current, spreading into a shallow <ansi fg="itemname">pool</ansi>
  three or four paces across, the water clear enough that the
  pale sandy bottom is visible in every part of it. Stands of
  <ansi fg="itemname">reeds</ansi> crowd both banks, their
  tips well above head-height and their bases lost in the
  soft mud where the water meets the shore. Small silver
  <ansi fg="itemname">minnows</ansi> move in schools near
  the reedy margins, hanging almost motionless against the
  current and then wheeling away as one. At the pool's
  southern edge, pressed into the soft mud in a single
  deliberate line, a set of
  <ansi fg="itemname">heron-track</ansi> prints runs to the
  water and stops — three-toed, wide-spaced, and recent
  enough that they have not yet filled with water.
