zone: The Fernway South
title: Watercress Bend
description: >
  The brook bends sharply here and loses most of its speed,
  curling into a slow <ansi fg="itemname">eddy</ansi> where
  the current barely moves and the surface is almost glass.
  A <ansi fg="itemname">watercress-mat</ansi> floats across
  most of the eddy, dense and ankle-deep at the bank's
  edge — the smell of it strong and peppery, the kind of
  green pungency that sharpens the nose. Along the muddy
  bank, where the watercress gives way to open ground,
  patches of dark red-brown
  <ansi fg="itemname">blood-moss</ansi> carpet the earth
  in low spreading mats — a dyer's ingredient and an
  alchemist's staple, found only where the ground stays
  perpetually wet. The <ansi fg="itemname">soft-mud</ansi>
  underfoot gives with every step and holds boot-prints
  clean and deep; the deer-trail does not continue south,
  and the brook disappears into a thicket of willow-scrub
  with no path through.
biome: forest
