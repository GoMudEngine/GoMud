nouns:
  eddy: |
    The brook curves and loses its speed here, pooling into
    a slow side-eddy where the surface barely turns — the
    kind of still water that collects whatever the current
    brings down and holds it.
  watercress mat: |
    A dense mat of watercress fills most of the eddy,
    floating thick at the surface and rooted in the mud
    below — pungent and peppery, ready to harvest by the
    handful, the leaves broad and dark green.
  blood moss: |
    Patches of dark red-brown blood-moss spread across the
    soft mud at the eddy's bank — low and flat, the color
    of old rust, keeping the soil together where the ground
    stays wet. Useful to alchemists and dyers both.
  soft mud: |
    The bank here is soft enough that every step leaves a
    clean deep print, the mud cold and heavy underfoot.
    The watercress roots hold the soil together where it
    grows, but beyond the mat's edge the ground is bare
    and gives freely.
