roomid: 4161
zone: The Fernway South
title: Pine Stand
description: >
  East of the burn scar the oaks give way without ceremony to
  a close stand of tall straight pines, the ground beneath
  them bare of undergrowth and carpeted instead with the
  <ansi fg="itemname">needle-carpet</ansi> — a dry, ankle-deep
  layer that mutes every footfall to nothing. The air shifts
  the moment you step in: resinous and sharp, the sweetness
  of warm sap over the cooler must of the forest floor. Along
  the nearest <ansi fg="itemname">pine-trunk</ansi> a long
  smear of old pitch has run and hardened, and close to eye
  level a half-dozen <ansi fg="itemname">pitch-beads</ansi>
  cling to the bark like amber drops — old wounds from a lost
  branch or a beetle's work, crystallized to something almost
  clear. Near the stand's interior, one trunk carries a
  different kind of mark: a long scrape at shoulder-height and
  a single tuft of grey-brown fur caught in the rough bark —
  the <ansi fg="itemname">wolf-sign</ansi> of something large
  that uses this stand for its own reasons. Where the largest
  pine has heaved a shoulder of ground up with its roots, a
  <ansi fg="itemname">root-tangle</ansi> makes a low dark
  hollow at its base, and the needle-carpet is thin and
  disturbed before it. The pines hold their quiet around it.
