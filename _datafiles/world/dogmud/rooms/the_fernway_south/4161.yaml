nouns:
  pine-trunk: |
    Tall and straight-boled, the pines here have shed their
    lower branches long ago and rise clean to a crown thirty
    feet up. The bark is thick, scaly in reddish-grey plates,
    and wept with old pitch wherever a branch has dropped or
    a beetle found its way in.
  pitch-bead: |
    Hardened amber-gold beads of pine pitch cling to the
    bark — the tree's old wounds sealed and crystallized,
    some nearly clear and some clouded with bark-dust and
    trapped insect parts. Smiths use the fresh-running
    kind; alchemists prize the aged.
  pitch-beads: |
    Hardened amber-gold beads of pine pitch cling to the
    bark — the tree's old wounds sealed and crystallized,
    some nearly clear and some clouded with bark-dust and
    trapped insect parts. Smiths use the fresh-running
    kind; alchemists prize the aged.
  needle-carpet: |
    Years of fallen pine needles lie ankle-deep and
    surprisingly dry beneath the stand's canopy — the
    pines shed enough water to keep the ground below
    almost parched. The carpet mutes footsteps
    completely and releases a faint resin-smell when
    pressed underfoot.
  wolf-sign: |
    A long scrape runs across the bark of one of the inner
    pines at shoulder-height, the kind made by a large
    animal marking territory — or stretching. A single
    tuft of coarse grey fur is snagged in the rougher
    bark below it, still soft, not old.
  root-tangle: |
    Where the great pine heaved a shoulder of ground up with
    its roots, a low dark hollow opens at its base — a snarl
    of thick roots over a gap in the earth. The needle-carpet
    before it is thin and pressed, disturbed by something that
    comes and goes. Cold air seeps out of the gap, and under
    the pine-resin there is a thread of a different smell,
    sweetish and wrong, rising from somewhere below the roots.
hidden_nouns:
  root-gap:
    description: |
      Down inside the root-tangle, behind the first snarl of
      roots, the earth does not close again — it drops. A gap
      wide enough for a large body to pass runs down under the
      pine, its edges worn smooth by use, and out of it pours a
      steady breath of cold, sweetish air that has never seen
      the sun. Whatever the wolf-sign belongs to does not den in
      this stand. It only passes through, on its way down.
    hidden_description: |
      Behind the roots of the great pine a worn gap drops away
      into the ground, breathing cold and sweetish air.
