  z: 0
exits:
  west:
    roomid: 4174
nouns:
  foxglove: |
    Foxgloves stand head-high in the clearing's center, tall
    purple-pink spikes beautiful and famously poisonous — every
    part of the plant toxic enough that animals who know better
    avoid it. The color deepens from near-white at the throat
    to dark purple at the outer petal edges.
  flower-spike: |
    Each foxglove sends up one or two tall flower-spikes laden
    with thimble-shaped blooms arranged in a long column, the
    lowest flowers fully open and the uppermost still tight buds.
    The spikes sway gently even in light air.
  bumblebees: |
    Heavy fuzzy bumblebees move slowly from flower to flower,
    half-disappearing into each thimble in turn and emerging
    dusted pale with pollen. They move without urgency, the
    methodical pace of creatures doing exactly what they came
    here to do.
  sun-warmth: |
    The clearing catches direct afternoon sun and holds it —
    a warmth that settles between the foxglove spikes and
    collects in the still air. It is a comfortable place to
    rest; the warmth is real and the smell is pleasant.
idlemessages:
- a bumblebee emerges from a foxglove and lands on the next one
- ''
- a foxglove spike sways under a bumblebee landing
- ''
- the sun-warmth holds steady through the afternoon
