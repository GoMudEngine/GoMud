roomid: 4173
zone: The Fernway South
title: Foxglove Clearing
description: >
  The trail east of the Twisted Hawthorn opens into a small
  wildflower meadow where tall <ansi fg="itemname">foxglove</ansi>
  spikes dominate the center of the clearing — head-high,
  deep purple shading to near-white at the throat, each
  <ansi fg="itemname">flower-spike</ansi> hung with a column
  of thimble-shaped blooms. The smell here is pleasantly
  floral, a light sweetness over green grass, entirely unlike
  the forest floor to the north. Heavy fuzzy
  <ansi fg="itemname">bumblebees</ansi> work the foxgloves
  methodically, half-disappearing into each thimble flower
  in turn and emerging again dusted pale. The clearing holds
  <ansi fg="itemname">sun-warmth</ansi> well into the afternoon,
  the direct light collecting between the foxglove spikes and
  warming the ground underfoot — a place to stand still and
  feel the day. There is no trail beyond the clearing's edge;
  dense cover marks the end of the way east.
biome: forest
coord:
  x: -13
