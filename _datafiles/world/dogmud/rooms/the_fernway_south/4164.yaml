nouns:
  brook: |
    The brook rises clear from a moss-rimmed crack in the
    bedrock, no wider than a forearm's span, and runs south
    through the hollow with the unhurried purpose of water
    that has always gone this way.
  spring-pool: |
    A small clear pool collects at the brook's source, no
    deeper than a forearm and cold enough to numb the hand
    in seconds — the stone below is pale and faintly sandy,
    every grain visible.
  moss: |
    Bright green sphagnum carpets every rock at the spring,
    packed so dense and moist it gives like a sponge underfoot
    — the kind of moss that holds water for hours after rain
    has stopped.
  watercress: |
    Watercress crowds the pool's overflow-edge in a thick,
    ankle-high mat — pungent and peppery, easy to harvest by
    the handful, and a clear sign that the brook runs clean.
idlemessages:
- a small leaf drifts on the brook and is carried south
