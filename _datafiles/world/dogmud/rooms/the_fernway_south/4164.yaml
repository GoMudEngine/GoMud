roomid: 4164
zone: The Fernway South
title: Brook Rise
description: >
  The deer-track west from Twin Beech Glade drops suddenly into
  a small hollow where the sound changes — the dry forest hush
  replaced by the quiet, constant voice of moving water. A
  <ansi fg="itemname">brook</ansi> rises here from a moss-rimmed
  crack in the bedrock, clear and cold, running a few paces
  south before it disappears into the leaf-litter. The air
  above the <ansi fg="itemname">spring-pool</ansi> is cooler
  than the surrounding wood by several degrees, and a faint
  mineral smell comes off the stone where the water emerges.
  Every exposed rock at the source is mantled in bright
  <ansi fg="itemname">moss</ansi> — deep sphagnum that holds
  the moisture and keeps the hollow damp even in dry weather.
  At the pool's edge, where the overflow spreads before it
  gathers itself south, a thick stand of
  <ansi fg="itemname">watercress</ansi> grows dense and
  peppery-scented, the first herb-territory in the valley.
biome: forest
