roomid: 4171
zone: The Fernway South
title: Old Stand
description: >
  The bracken gives way here to a cathedral hush. The
  <ansi fg="itemname">old-oak</ansi> trees that gather in this
  stand are the largest in the southern wood — trunks so thick
  three people could not reach around them, their roots
  spreading wide and deep into the dark earth underfoot. The
  canopy overhead is so dense that <ansi fg="itemname">deep-shade</ansi>
  holds even in full afternoon, the light reduced to a cold
  diffuse green that makes the ground look like the floor of a
  still pool. The <ansi fg="itemname">oak-bark</ansi> is deeply
  furrowed and grey-brown, centuries of weather worked into
  each ridge and crack. At the base of the largest tree a mass
  of exposed roots has curled and weathered into a natural
  <ansi fg="itemname">root-throne</ansi> that could seat a
  person comfortably — generations of foragers have rested
  there before pressing south.
biome: forest
