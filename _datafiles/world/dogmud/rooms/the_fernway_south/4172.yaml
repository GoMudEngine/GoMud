nouns:
  sett: |
    A steep earth-bank a body's height tall, riddled with the
    dark mouths of badger burrows — a long-established sett,
    the kind that has been occupied by successive generations
    of animals for more years than the trees nearby. The bank
    face is alive with excavated tunnels.
  burrow-entry: |
    Several burrow entries in the bank, all well-trodden, the
    largest big enough to crawl into if you had no better
    judgment. Fresh earth heaped at the thresholds shows recent
    digging — the sett is active and being maintained.
  badger-musk: |
    A heavy musky smell hangs over the sett, the kind of
    territorial warning every other forest animal recognizes.
    It gets stronger the closer you approach the bank. Not
    dangerous to smell — just unmistakably a warning.
  bone-pile: |
    Small bones lie scattered at the burrow entries — rabbit,
    hare, vole, a few bird-bones — the leavings of the sett's
    residents dragged in from the surrounding forest. Nothing
    wasted; nothing left in one piece.
