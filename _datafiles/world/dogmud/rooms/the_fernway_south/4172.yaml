roomid: 4172
zone: The Fernway South
title: Badger Sett
description: >
  The <ansi fg="itemname">badger-musk</ansi> reaches you before
  the sett does — a heavy, close animal smell that warns off
  everything with the sense to heed it. The trail west of the
  Twisted Hawthorn ends at a steep earth-bank a body's height
  tall, and the entire face of it is riddled with the dark
  mouths of the <ansi fg="itemname">sett</ansi>. The ground
  before the bank is bare-trodden earth, worn flat by the
  passage of heavy low bodies over many seasons. At several
  <ansi fg="itemname">burrow-entry</ansi> openings the earth
  is freshly turned, the dark soil heaped at the threshold
  like a small doorstep. A scatter of small
  <ansi fg="itemname">bone-pile</ansi> lies at the largest
  entry — rabbit bones, hare, something smaller — the leavings
  of recent meals dragged from hunting elsewhere. There is no
  trail beyond the sett; the bank and the dense cover behind
  it mark the end of the way west.
biome: forest
