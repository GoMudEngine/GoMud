roomid: 4163
zone: The Fernway South
title: Twin Beech Glade
description: >
  The forest opens here into a small glade commanded by two
  enormous beeches that have grown trunk-to-trunk, their
  canopies fused overhead into a single broad dome of
  <ansi fg="itemname">dappled-light</ansi> that shifts and
  breathes with every movement of the wind. The air beneath
  is cooler than the burn scar to the north — greener, with
  that particular still quality a glade takes on when the
  surrounding trees are old enough to muffle sound. The
  ground is thick with <ansi fg="itemname">beech-mast</ansi>
  — fallen nuts and husks and layers of the broad papery
  leaves from past autumns, packed into a surface that gives
  and rustles underfoot. The <ansi fg="itemname">twin-beech</ansi>
  trunks themselves are smooth silver-grey, scarred with a
  century of weather and marked low down with a few carved
  initials so old they have nearly weathered flat. Worn
  deer-tracks branch from the glade at the
  <ansi fg="itemname">path-junction</ansi>, one east, one
  west, one south — beaten deep into the leaf-litter by
  small feet over many seasons.
