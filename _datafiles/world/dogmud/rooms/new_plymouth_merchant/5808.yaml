title: Falk's Auction House
description: >
  The auction house floor runs wider than the frontage
  suggests — a double-depth room with high ceilings to
  hold the noise of a crowd, fitted rows of plain wooden
  benches facing a raised
  <ansi fg="itemname">auction-block</ansi>
  at the south wall, and a rail separating the viewing
  floor from the principals' area around the block.
  Goods of real value pass through Falk's — estate lots,
  merchant stock sold under obligation, single items of
  the kind that need a buyer found rather than a price
  named. To the left of the block, the
  <ansi fg="itemname">property-roll</ansi>
  is mounted in a glass frame where any interested party
  may inspect the record of what has moved through this
  room. Falk himself is seldom far from the block. He
  is a careful man with an excellent memory for who has
  bought what and at what price, and a less reliable
  memory, apparently, for whose name was not supposed
  to appear in the public roll. A stair at the rear
  leads to the auctioneer's room above; the room smells
  of good wood and handled paper.
