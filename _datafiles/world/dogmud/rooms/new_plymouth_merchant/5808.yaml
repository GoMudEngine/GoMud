nouns:
  auction-block: A raised platform of dressed hardwood,
    its surface worn pale at the presenter's position
    from years of standing and turning to face the
    crowd. The rail at the front edge has been gripped
    often enough to show it in the finish. Behind the
    block, a small door leads to a staging room where
    lots are held before presentation — the door is
    closed. A lot-number placard sits face-down on
    the block surface, meaning the current interval
    is between sales.
  property-roll: A ledger mounted in a glass-faced
    frame bolted to the wall beside the block — the
    public record of sales, open to inspection by any
    party seeking to confirm a transaction. Most entries
    are unremarkable — estate goods, quantities of
    trade stock, one or two personal effects of some
    value. But a recurring entry type repays careful
    reading — lots catalogued simply as "consideration,"
    buyer listed as "the arrangement," prices bearing
    no apparent relation to market rates for anything
    identifiable. The entries recur at irregular
    intervals. They are not highlighted. They are not
    hidden, either. Falk's hand is consistent
    throughout.
idlemessages:
- A prospective buyer examines the property-roll with
  the focused attention of someone who came here
  specifically to read it.
- The benches are half-occupied in the lull between
  lots — people waiting with the patience of those
  who have done their research.
- Falk passes through the principals' area with a
  sheaf of papers, nods at no one in particular, and
  goes through the side door.
- The auction-block is empty but has the quality of
  something about to be used.
- A lot from the morning's session remains under the
  block — a cloth-wrapped parcel, tagged and waiting.
