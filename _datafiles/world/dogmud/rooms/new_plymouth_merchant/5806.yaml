title: The Exchange
description: >
  The Exchange presents a narrow frontage to the Walk
  — a door of banded oak, a small inlaid plate with
  the name of the business in letters that are neither
  plain nor ostentatious — and opens behind it into a
  room considerably larger than the exterior suggests.
  The counting-house smell is immediate and particular
  — coin-metal and ledger-wax, dry paper, the faint
  tallow of lamps kept burning later than the
  surrounding shops. A long
  <ansi fg="itemname">transaction-table</ansi>
  runs the east wall, its surface divided into
  numbered stations by low iron rails; behind it a
  clerk or two handles the business that does not
  require the moneylender directly. Deeper in, past
  a low rail and a hinged gate, the floor rises a step
  to the
  <ansi fg="itemname">principals-counter</ansi>,
  where the significant transactions take place — loans
  assessed, liens placed, the kind of money that moves
  in this city's upper registers. The room smells like
  the inside of a decision made in the absence of
  urgency. A stair at the back leads to the counting
  room above.
