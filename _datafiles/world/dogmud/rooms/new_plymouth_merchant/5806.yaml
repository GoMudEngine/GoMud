nouns:
  transaction table: A counter of dark wood running
    the east wall, divided by low iron rails into five
    numbered stations — each with its own lamp, its
    own inkwell, and a worn leather pad for paperwork.
    The rails keep the business at each station
    separate in the way that convention makes physical
    when it cannot be made private. Three of the five
    stations are currently occupied. The queue for the
    others forms in a marked lane near the door.
  principals counter: A raised platform at the room's
    interior, behind the hinged rail, where a desk of
    considerable age and purpose stands. The desk is
    arranged with the precision of someone who returns
    to it daily and knows exactly where everything is.
    A single sealed document sits centered on the
    blotter, waiting for a signature or already past
    the need of one — from this distance, it is
    impossible to say which.
idlemessages:
- A clerk at the transaction-table counts coins with
  the flat quick movements of someone who has done
  nothing else all day.
- The sealed document on the principals-counter has
  not moved.
- The coin-smell in here is not ambient — it is
  specific, the product of metal handled in quantity.
- A patron in the numbered queue shifts weight and
  checks the light from the street door.
- Paper is shuffled. A stamp is applied. A clerk
  replaces the pen and moves to the next station.
