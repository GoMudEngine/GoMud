zone: New Plymouth Merchant
title: The Long Market — Merchant Approach
description: >
  The road jogs slightly and widens heading east toward
  the square, and with the widening the crowd density
  climbs — shoulders closer together, pace adjusted,
  each person navigating the press with the unconscious
  economy of daily habit. A costermonger has posted a
  <ansi fg="itemname">street-barrow</ansi> against the
  building to the left and is selling parcelled spice
  from it in rapid, repeated phrases; the wheel is
  chocked against rolling with a wedge of cut timber.
  The <ansi fg="itemname">cobbles</ansi> underfoot are
  worn to a dark gloss from the volume of daily passage,
  the mortar joints invisible under the polish of feet.
  East, the noise of the Central Square begins to
  separate itself from the general city sound — more
  layered, more various, the particular register of
  a place where everyone passes through.
