nouns:
  street-barrow: A two-wheeled cart painted in fading
    yellow, its frame loaded with small parcels of spice
    wrapped in brown paper and tied with string. Each
    parcel carries the same printed stamp — a small sun,
    or possibly a star, the ink gone slightly off-register
    from use. The costermonger has run this pitch at this
    spot long enough that the cobbles beside the wheel-
    chock are slightly more worn than the surrounding
    stones.
  cobbles: The paving here is old enough to have been
    relaid twice — original stone, then a darker
    replacement, then lighter again — each layer's edge
    visible where the mortar has worked loose. The center
    of the road is worn deepest, where foot-traffic
    concentrates. The polish is real, not decorative,
    accumulated from the pressure of thousands of
    crossings each day. In wet weather this stretch is
    known for its grip.
idlemessages:
- The crowd here has learned to flow around the barrow's
  obstruction without acknowledging that it exists.
- Someone calls a greeting to someone ahead of them;
  the voice carries well over the press of bodies.
- The costermonger repeats the same phrase for the
  fourth time in a minute without varying it at all.
- A broadsheet boy squeezes through the crowd heading
  south, earning complaints from two directions at once.
- The noise from the square ahead rises briefly — a
  shout, a bell, something indeterminate — and settles
  back to its steady hum.
