zone: New Plymouth Merchant
title: The Central Square
description: >
  The square opens with the suddenness of a breath
  released — a full city block of dressed stone where
  the Long Market and the Processional cross, and every
  edge of it dense with the apparatus of commerce.
  Stalls rim three sides of the open center, their
  awnings in a dozen competing colors, goods beneath
  them ranging from everyday provisions to items that
  have no apparent business being sold casually in
  daylight. At the center stands the
  <ansi fg="itemname">proclamation-post</ansi> — a
  thick oak column bound in iron rings, its surface
  layered with sealed official notices and public
  announcements nailed over them, the city's written
  voice accumulated in wax and paper. The
  <ansi fg="itemname">crossing-eye</ansi>, a circle
  of pale contrasting stone inset in the paving at the
  arteries' exact meeting point, is worn to a dull shine
  that has nothing to do with decoration and everything
  to do with the weight of years. The Processional runs
  its long grade away to the south, down toward the
  Common Quarter, and climbs to the north toward the
  palace district — but the press of the market keeps you
  here at the crossing for now. Certain
  eyes in this square have learned to note who lingers
  without evident business, and those eyes report to
  someone.
