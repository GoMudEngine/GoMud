nouns:
  proclamation post: A column of seasoned oak, perhaps
    a foot and a half across, banded at intervals with
    iron rings that keep it from splitting in the
    weather. The surface is entirely covered in posted
    material — official decrees with wax seals intact,
    guild announcements, a tax schedule from two seasons
    past, a missing-person notice that has been up long
    enough to lose its urgency. At the column's base
    someone has been chalking a running tally of something
    for months; the numbers make no obvious sense. A
    city clerk removes what is outdated and posts what
    is new every third day and has done so for years
    without missing.
  crossing eye: A circle of pale limestone set flush
    into the darker square paving, perhaps six feet
    across, marking the exact center of the two
    arteries' crossing. A compass rose was carved into
    it at installation — north, south, east, west in
    incised lines — but the relief is almost entirely
    worn smooth now. You can find the marks only by
    running your foot slowly across the surface. The
    stone is several shades lighter than the rest of
    the square from daily washing; it is understood to
    be the city's symbolic center, though that
    understanding is not written anywhere official.
idlemessages:
- A city crier at the proclamation-post reads a new
  notice aloud in a carrying voice; most of the square
  does not look up.
- The crossing-eye is briefly clear of foot-traffic
  and then the crowd closes over it again.
- A merchant's factor threads the press with a leather
  satchel held close to the body — the satchel is
  clearly heavier than it looks.
- From the south, the Processional delivers a small
  column of militia heading somewhere with the purposeful
  pace of people who have been given orders.
- The noise in the square is layered — argument,
  haggling, greeting, hawking, cart-wheels — and the
  city produces it without effort or interruption.
