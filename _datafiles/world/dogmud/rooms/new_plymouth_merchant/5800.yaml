nouns:
  ward arch: Wrought iron, spanning the road at a height
    that clears a loaded cart with room to spare. The
    scales in the crown are silver-painted and recently
    touched up — someone considers the arch's appearance
    part of the district's address. On the eastern pier
    a small square of text is set in brass, naming the
    Merchants' Guild and the year of the arch's
    construction. The year is older than most of the
    buildings on this street.
  threshold stone: A flat slab set into the road's center,
    the city crest carved into its face — the walled crown
    above three wavy lines. The relief is worn almost
    entirely smooth by the passage of feet, legible now
    only in raking light. Below the crest, in lettering
    still just readable, the old charter phrase — all who
    pass here are within our covenant. Few who cross it
    know it says anything.
idlemessages:
- A merchants' watch officer steps through the arch
  heading west, checking something in the Crafting
  Quarter beyond.
- The smell of the working quarter — sawdust and linseed
  — reaches the arch on a shift of wind and fades.
- Two porters with a laden barrow come north through the
  arch, wheel-rims loud on the dressed limestone.
- A traveller pauses under the arch and reads the brass
  inscription, lips moving slightly, then passes on.
- The threshold-stone is swept each morning. This
  morning's sweeping is already undone by foot-traffic.
