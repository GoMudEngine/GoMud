title: The Long Market — Merchant Gate
description: >
  The character of the street changes in a dozen steps —
  rougher Crafting Quarter granite giving way to dressed
  limestone set with tighter joints and swept more
  deliberately, the maintenance here funded by rents
  rather than guild dues. A wrought-iron
  <ansi fg="itemname">ward-arch</ansi> spans the road,
  the Merchant Quarter's mark worked into its crown — a
  pair of balanced scales in silver-painted metal — and
  beneath it a merchants' watch post stands unmanned in
  the daytime but visibly occupied each evening. The
  smell shifts too — less sawdust and linseed, more of
  the complex layered warmth of commerce, wax and spice
  and the faint paper-and-ink undertone of contracts. The
  <ansi fg="itemname">threshold-stone</ansi> set into the
  pavement at the arch's center carries the city crest,
  worn almost smooth by the crossing of feet. The Crafting
  Quarter falls away behind you to the west; north, the
  road opens toward the square.
