title: The Processional — North End
description: >
  The Processional widens north of the square and takes
  on a more deliberate character — the paving better-
  dressed, buildings running to cut stone rather than
  timber, ground floors given over to factors' offices
  and bonded warehouses whose signs are small and do
  not invite the general public. A row of
  <ansi fg="itemname">civic-lamps</ansi> lines the
  western side at measured intervals, each housing
  identical and freshly painted in the city's blue and
  silver, lit each evening by a lamplighter who begins
  at the square and works north. The
  <ansi fg="itemname">guild-seals</ansi> carved into
  the lintel of the nearest building are difficult to
  count from the pavement, but numerous enough to
  suggest an authority that has been accruing quietly
  over a long time. North, the Processional continues
  toward the Noble Quarter and the palace avenue; the
  northern stretch is gated during working hours,
  admitting only those carrying the correct papers,
  and the gateguards know their faces.
