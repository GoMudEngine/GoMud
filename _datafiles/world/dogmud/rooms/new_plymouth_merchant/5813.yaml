zone: New Plymouth Merchant
title: Above the Plate-Works
description: >
  The room above the plate-works holds the ambient
  warmth of the shop below — not forge-heat, but the
  steady temperature of a building in active daily
  use. Brun's domestic arrangements are simple — a
  bed against the north wall and a south work-table
  that handles the design side of the trade away from
  the shop floor. A long
  <ansi fg="itemname">pattern-shelf</ansi>
  runs the east wall, its surface crowded with wooden
  sizing patterns for every customer whose measurements
  Brun carries on file — the record of years of fitting
  work, labeled in chalk renewed as needed. The
  <ansi fg="itemname">design-drawings</ansi>
  covering the work-table are technical work —
  orthographic views of armor components, dimension
  annotations, material notes — the kind of drawings
  that exist to be used rather than preserved. The
  north window gives a clear view of the Porters' Dock
  and the tally-post in the yard below.
