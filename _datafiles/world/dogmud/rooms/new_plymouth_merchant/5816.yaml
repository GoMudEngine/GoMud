nouns:
  hallway table: A low side-table in dark wood, its
    surface holding the corridor lamp and a flat
    correspondence tray. One folded note rests there,
    unsealed, with nothing written on the outside.
    Whether it is for a guest who has not yet
    collected it or one who has not yet arrived is
    not settled by looking at the table.
  window seat: A padded bench in the far hall window,
    the cushion worn flat at the center from habitual
    use. Below, the Gilded Walk is visible — the clean
    paving, the costly window-fronts of the shops
    across the way, a porter moving with a covered
    basket. Someone has left a cup on the sill here,
    its interior stained by whatever was in it. Cold
    now.
idlemessages:
- The corridor carries no sound from the floor below
  — the inn's construction is deliberate about this.
- One of the numbered doors along the hall is not
  quite fully latched; it does not open, but it does
  not close.
- The timer-wick lamp on the hallway table will burn
  for another few hours.
- Behind a closed door, a brief cough — muffled —
  and then silence again.
- The window-seat at the end of the corridor catches
  the morning light better than anywhere else on
  this floor.
