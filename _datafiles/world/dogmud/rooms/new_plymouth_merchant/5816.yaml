title: The Gilt Threshold — Lodging
description: >
  The lodging floor runs the full width of the inn
  above the public room, its corridor low enough to
  encourage instinctive caution at the stair-head
  lintel. Four rooms open off the hall — their doors
  closed, their numbered plates small and plain. The
  hall itself is carpeted in a heavy runner that has
  seen better decades but has been cleaned into a kind
  of dignity anyway. A
  <ansi fg="itemname">hallway-table</ansi>
  against the north wall holds a lamp on a timer-wick
  and a flat tray carrying a folded note — unsealed,
  no name written on the outside, left for someone
  who has not yet collected it or has not yet arrived.
  At the far end of the corridor a
  <ansi fg="itemname">window-seat</ansi>
  looks out over the Gilded Walk below; someone has
  left a cup on the sill, cold now. The floor is quiet
  in the specific way that expensive walls make things
  quiet — sound absorbed rather than stopped, the
  absence of the city more present than the city
  itself.
