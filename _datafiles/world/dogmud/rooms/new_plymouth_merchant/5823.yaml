nouns:
  tally-post: A short bollard at the yard's center,
    capped with a rotating wooden head carrying a
    chalkboard surface on each of its four faces.
    The current face shows today's incoming tally
    in a system of marks and numbers — each line a
    delivery, each mark a shipper's code. The chalk
    is recent; the board was current as of this
    morning's first arrival. The marks are consistent
    and unintelligible without the key, which the
    tally-man carries in their head and has never
    been asked to write down.
  hand-carts: A row of wooden hand-carts along the
    east wall, their handles standardized to a single
    height and their beds designed for the boxes and
    crates that move through this yard regularly.
    The carts carry no marks of ownership — no house-
    colors, no branded handles — which is either an
    economy or a privacy measure, depending on whose
    goods they are moving when they are not parked
    here. Three carts carry dried mud on their wheels.
    Two are clean.
idlemessages:
- The tally-man updates the chalkboard without
  stopping the count — a mark for an incoming cart,
  the chalk back in a pocket.
- A porter collects a hand-cart from the ranked line
  and wheels it north toward the lane's mouth, then
  stops at the watcher's position and turns back.
- The yard is not loud, but it is active — movement,
  the rattle of cart-wheels on stone, quick exchanges
  in low voices.
- The Watched Lane entrance at the north end of the
  yard is a clear sightline. Whatever happens at that
  gate is visible from here.
- A delivery is being tallied in — a covered crate
  lowered from a wagon at the yard's south entrance,
  marked and cleared by the tally-man in under a
  minute.
