title: The Porters' Dock
description: >
  The Porters' Dock is the goods-handling yard behind
  the arms row — a paved-over gap between buildings
  where the supply side of the merchant block conducts
  its business without occupying the frontage. Hand-
  carts are ranked along the east wall, their handles
  facing out for quick access; the ground around them
  is worn smooth by the particular turning pattern of
  a cart maneuvered in a small space. A
  <ansi fg="itemname">tally-post</ansi>
  stands at the yard's center — a waist-high bollard
  with a rotating head carrying a chalkboard surface,
  used by the dock's informal tally-man to record
  incoming and outgoing loads for the day. The tally
  runs in a system of marks rather than names, each
  mark assigned to a regular shipper and known to the
  tally-man without reference to a written key. The
  Watched Lane is visible at the north end of the yard
  — its entrance, and the watcher at it — a clear
  sightline that the dock handles goods across regularly,
  including deliveries that stop at the watcher's
  position and turn back. The
  <ansi fg="itemname">hand-carts</ansi>
  know more about this block's supply lines than
  anything else here.
