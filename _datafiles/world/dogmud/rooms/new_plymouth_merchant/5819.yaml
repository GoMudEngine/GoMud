title: The Watched Lane
description: >
  The Watched Lane is a residential side-street off
  the Permit Office corner — short, quiet, and watched.
  It carries perhaps six buildings on its east side,
  each a rented dwelling of the kind taken by people
  who value privacy over proximity to the market, and
  it terminates at the walled gate of the northernmost
  house. The lane itself is clean but not serviced by
  the district's formal sweeping — someone keeps it
  clear, but that person is not on a city payroll. A
  <ansi fg="itemname">liveried-watcher</ansi>
  stands at the lane's entrance near the Permit Office
  corner — a figure in bloodline house-colors who
  neither explains their presence nor moves from the
  position. Foot-traffic with no evident business in
  the lane does not come in twice. The
  <ansi fg="itemname">lane-wall</ansi>
  at the far end, enclosing the private house to the
  north, is never unattended. The lane has the quality
  of deliberate quiet — the kind that is not natural
  to a city but can be maintained with enough
  consistent attention.
