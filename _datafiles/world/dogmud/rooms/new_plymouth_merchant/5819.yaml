nouns:
  liveried watcher: A figure in the bloodline's house-
    colors — a deep grey-and-blue that is not quite
    a uniform and is not quite civilian dress — standing
    at the lane's entrance without visible purpose.
    The watcher does not address arrivals unless
    necessary, and what "necessary" encompasses is
    a matter of judgment exercised without reference
    to anyone else. The eyes are attentive. The posture
    is permanent.
  lane wall: A wall of dressed stone at the lane's
    north end, perhaps eight feet high, with a
    wrought-iron gate set into it — closed, chained,
    and watched from inside by a second figure in
    the same house-colors. The house behind the wall
    is visible only as a roofline and an upper window.
    They do not respond to approach.
idlemessages:
- The liveried-watcher at the lane entrance holds a
  position that takes in both the lane and the Permit
  Office corner without appearing to watch either.
- The lane is quiet. From the main streets to the
  south and west, the market noise arrives as a
  distant undertone.
- A resident of one of the lane's middle buildings
  emerges, glances at the watcher, and goes south
  without eye contact.
- The gate at the north end of the lane has not
  opened in the time you have been standing here.
- The watcher's house-colors are freshly pressed.
  This is not a casual post.
