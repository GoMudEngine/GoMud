roomid: 5811
zone: New Plymouth Merchant
title: Above the Armoury
description: >
  Ostry's room above the armoury is not large and is
  not decorated — both facts consistent with her general
  approach to non-functional things. The floor is at
  the ambient temperature of the building, which the
  armoury below keeps warmer than the street. A
  <ansi fg="itemname">weapons-stand</ansi>
  in the east corner holds what are clearly personal
  arms — a short-blade, a buckler, and a longer piece
  in a worn leather scabbard — distinct from the shop
  inventory by the conspicuous absence of a price card.
  The desk along the north wall holds ordering records
  and a stack of
  <ansi fg="itemname">assay-notes</ansi>
  — Ostry's written evaluations of pieces brought in
  for valuation, filed in order and marked by outcome.
  The room is spare in the way of someone who spends
  most of their waking hours one floor below.
biome: city
