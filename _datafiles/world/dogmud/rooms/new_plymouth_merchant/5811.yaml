nouns:
  weapons stand: A wooden rack in the east corner,
    three pegs currently holding a short-blade in a
    plain scabbard, an off-hand buckler with a worn
    center-grip, and a longer piece — possibly a
    bastard sword — in leather that has been repaired
    at the throat twice and fits the blade well
    regardless. These are not shop stock. There is no
    price card, no lot number, no evaluation tag.
  assay notes: A stack of folded papers on the desk,
    each carrying a brief written evaluation of a
    weapon brought in for assessment — condition,
    grade, estimated value, recommendation. The most
    recent is on top. The handwriting is compressed
    and consistent; the judgments are short and carry
    no diplomatic padding. The bottom line of the top
    sheet reads "do not offer less" without elaborating
    on the consequences of the instruction.
idlemessages:
- The floor is quiet. From the shop below, faintly,
  the sound of metal against a mounting bracket.
- The weapons-stand is arranged with the precision of
  someone who knows exactly what is on it.
- The desk is organized but not tidy — a working
  surface, not a display.
- The window looks north over Coin Alley — a narrow
  view of the money-changers' stretch.
- The assay-notes stack has grown by one since
  whatever piece recently came in for valuation.
