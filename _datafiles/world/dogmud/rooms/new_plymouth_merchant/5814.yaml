title: The Gilt Threshold
description: >
  The Gilt Threshold occupies a corner plot where the
  Gilded Walk opens north toward the inn's quiet
  entrance — a building wide enough to carry weight
  and narrow enough to stay out of sight. The public
  room inside is low-ceilinged and warm, lit by good
  oil lamps set in iron brackets, the tables wiped to
  a cleanliness that costs more than it appears to.
  Somewhere in this city's social arithmetic, a
  certain class of person drinks here — merchants
  with letters of credit, factors with information
  to sell, and occasionally someone who sits with
  their back to the wall and watches the room without
  appearing to. The
  <ansi fg="itemname">hearth-bar</ansi> anchors the
  south wall behind a long timber counter, staffed by
  someone who pours without asking and does not repeat
  what they have heard. The
  <ansi fg="itemname">guest-ledger</ansi> sits on a
  stand beside the stair with its clasp fastened; the
  innkeeper opens it for some arrivals and not for
  others, and the criterion for this is not stated. A
  passage east leads to a private parlor; the stair
  climbs to lodging above.
