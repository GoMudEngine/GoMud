nouns:
  hearth-bar: A counter of dark-stained timber running
    the south wall, its surface worn smooth by years of
    cups and elbows. The shelving behind holds bottles
    arranged by height rather than label, which tells
    you something about who chooses the stock. The
    person serving does not catch your eye and has not
    failed to notice you — the distinction is a
    professional one, practiced here until it is
    seamless.
  guest-ledger: A heavy ledger in an oiled leather
    slipcase, its brass clasp fastened on the stand
    beside the stair. Guest registers in an inn of
    this kind do two things — accounting for who is
    present, and recording who would prefer not to be.
    The cover carries no title. The spine is worn from
    handling. Whose names appear in the current pages,
    and under what designation, is information the
    innkeeper controls.
idlemessages:
- A patron at the back table receives a folded note
  from the taproom boy, reads it without expression,
  and pockets it without haste.
- The oil lamps produce a steady even light that costs
  more than candles and announces it quietly.
- The room is not loud. The business conducted here
  moves at the volume that money finds natural.
- A server moves between tables with the calm of
  someone who has learned not to hear anything in
  particular.
- Footsteps on the stair above — an arrival or a
  departure — and then the room's low undertone
  resumes.
