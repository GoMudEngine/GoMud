nouns:
  velvet curtain: Deep garnet velvet on a polished
    brass rod, the fabric dense enough to muffle the
    taproom noise behind you to something close to
    silence. The curtain's edge carries a faint crease
    at shoulder height on the outer side — someone has
    braced a hand against the wall here, or stood with
    their ear close to the gap. The crease is not new.
    This curtain has been a useful piece of furniture
    to more than one person who was not inside the
    parlor.
  cup rings: Two overlapping marks on the walnut
    table where cups stood long enough to leave
    moisture. One ring is slightly larger than the
    other. The surface around them has been wiped
    but the rings themselves were not caught in the
    pass — whoever cleaned this table was quick about
    it, or was thinking of something else. The cups
    themselves are gone.
  paper scrap: A torn corner of paper, dropped or
    slid from the table and not retrieved. The visible
    face carries four words in a close, careful hand —
    "before the permit clears" — and nothing more.
    The edge is a clean tear rather than a scissors
    cut. The rest of whatever this came from is not
    in this room.
idlemessages:
- The velvet curtain shifts at the hem as someone
  moves in the corridor beyond.
- The lamp on the stand gutters once in a draft that
  has no obvious source, then steadies.
- A single word from the taproom is briefly audible
  through the curtain, then swallowed again.
- The room has a waiting quality — not empty, but
  between uses.
- The pipe-smoke smell is fading. Whoever was here
  was not here long ago.
