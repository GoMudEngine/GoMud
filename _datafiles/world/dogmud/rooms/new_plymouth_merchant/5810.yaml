title: Dame Ostry's Armoury
description: >
  The armoury floor opens full-width — no counter
  between the customer and the stock, no glass case,
  just racked weapons lining both long walls and a
  clear central aisle where a buyer can be handed a
  blade to assess without ceremony. The
  <ansi fg="itemname">sword-wall</ansi>
  to the west carries the most traded stock — short-
  blades, long-blades, fighting knives arranged by
  weight — each clipped to a rack, each with a card
  noting condition and price. The east wall carries
  <ansi fg="itemname">pole-arms</ansi>
  and heavier pieces, angled for display but still
  accessible. Dame Ostry moves through this space with
  a proprietary ease that is difficult to replicate —
  she handles every blade in inventory herself, and
  the extra arm descending from her left shoulder,
  a consequence of a mutation she has never explained
  and does not appear to find remarkable, allows her
  to hold three weapons at once during assessment. The
  floor is swept to the boards and the air carries the
  faint iron smell of oiled metal in quantity.
