nouns:
  sword wall: The west rack covers the full wall from
    chest height to well above reach — a spread of
    bladed weapons in individual clip-mounts, each
    spaced far enough for clear assessment. Price cards
    on small wire loops hang from each clip. The stock
    is not ceremonial — these are working weapons,
    selected for use rather than display. The rack has
    no gaps in its sequence; what is sold is replaced
    before the end of the day.
  pole arms: The east wall's heavier stock — spears,
    halberds, a pair of glaives, and several items
    that do not have standard names, hanging at angles
    from brackets sized for each piece. The bracket
    heights have been adjusted from the original
    installation; whoever rehung them understood the
    balance requirements of each weapon and positioned
    them accordingly. The highest pieces require asking
    Ostry, who manages the reach without moving the
    ladder.
idlemessages:
- Dame Ostry moves between the racks making small
  adjustments — a blade repositioned, a price card
  straightened — with the three-armed ease of someone
  for whom this space was designed around herself.
- The iron smell in here is particular — not rust,
  not heat — the dry specific scent of oiled metal
  in a closed room.
- A customer runs a thumb along a blade's flat, looks
  at Ostry for confirmation, and gets a brief nod.
- One of the pole-arms on the east wall is marked
  with a strip of red card — held for a buyer, or
  priced above idle browsing.
- Ostry assesses a piece brought in for valuation —
  holding it in two hands while the third makes notes
  on condition.
