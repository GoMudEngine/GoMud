nouns:
  filing racks: Three walls of open shelving divided
    by labeled sections — permit categories on the
    west, calendar years running north to south, and
    along the east wall a section whose labels have
    been covered with blank paper slips. The coverage
    is recent. What was written on the underlying
    labels can be faintly discerned if the lamp is
    held at the right angle — the letters are there
    but not legible at normal reading distance. The
    racks are full; overflow stacks are beginning to
    develop at floor level along the west wall.
  sealed cabinet: A cabinet of dark wood with two
    lockable drawer banks, its key-plate showing the
    small marks of regular use by a single key. The
    wood differs from the surrounding shelves — older,
    heavier, brought from somewhere else rather than
    built into the room. Whatever filing system the
    open racks use, this cabinet's contents are not
    indexed on any list visible in the room. The lock
    is good quality. The cabinet does not rattle.
idlemessages:
- The filing-racks hold more paper than the room's
  size would suggest — the system is efficient but
  the volume is considerable.
- The sealed cabinet against the north wall is quiet
  in a way that differs from the simple absence of
  sound.
- The lamp at the work-table has been in use recently
  — the oil is low and the glass is warm.
- The restricted-entry notice on the stair-head door
  faces inward as well as outward.
- A file folder on the work-table has been replaced
  in its rack but not quite aligned with its neighbors.
