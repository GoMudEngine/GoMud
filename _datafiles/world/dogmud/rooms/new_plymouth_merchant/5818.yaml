roomid: 5818
zone: New Plymouth Merchant
title: The Permit Office — Records
description: >
  The records room above the permit office is accessed
  through a door at the stair-head that carries a
  notice in the bloodline's typeface stating that entry
  is restricted to authorized personnel. The room is
  given over entirely to storage —
  <ansi fg="itemname">filing-racks</ansi>
  floor to ceiling on three walls, their contents
  divided by year, by permit type, and by a third
  category that is not labeled in any publicly visible
  way. The center of the room holds a small work-table
  with a lamp and a chair for reviewing files; the
  chair's cushion has the permanent depression of
  regular use. A
  <ansi fg="itemname">sealed-cabinet</ansi>
  stands against the north wall, separate from the open
  racks — its drawer handles are blank, its wood darker
  than the surrounding shelves, and it carries a lock
  of the kind that requires a key rather than a code.
  The room smells of the dry must of paper and wax seal
  accumulated over a long period of close and systematic
  documentation.
