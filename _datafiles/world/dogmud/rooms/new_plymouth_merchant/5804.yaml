title: The Central Square — Market Stalls
description: >
  The stall-stretch that spills east from the square is
  the loudest quarter-acre in New Plymouth — a dense
  press of open-front shops and temporary awnings where
  hawkers work their pitches with practiced urgency and
  delivery boys from three different provisioners cut
  through the crowd on overlapping routes. The
  <ansi fg="itemname">stall-row</ansi> nearest the
  Processional carries dry goods and small luxuries;
  further east it shades toward bulk provisions ordered
  by the quarter's inns and kitchen operations. A runner
  named Dobb is sometimes seen here between errands —
  recognizable by a patched green jacket and the habit
  of knowing which stall received a delivery before the
  stall-keeper does. The <ansi fg="itemname">red-awning</ansi>,
  a large permanent canvas structure in faded merchant-
  red, marks the stall-stretch's informal center and
  the place where the day's pricing is discussed, then
  argued about, then accepted.
