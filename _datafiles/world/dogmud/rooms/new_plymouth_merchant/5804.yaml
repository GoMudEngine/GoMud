nouns:
  stall-row: The stalls here are not temporary — they
    have permanent wooden frameworks, hinged shutters
    that fold down to form display counters, and
    weathered paint that has been refreshed enough times
    to show the history of color choices. Each stall is
    narrow, close to its neighbors, separated by
    convention rather than wall. The competition is not
    unfriendly; the stall-keepers know each other's
    names and each other's prices. On slow afternoons
    they talk across the gap.
  red-awning: Canvas on a frame of bent iron pipe, faded
    from what was probably a vivid red to something more
    like dried clay, patched in three places — each patch
    a slightly different shade of not-quite-matching red
    — and still serviceable. Under it a cluster of
    produce and provision stalls operates at greater
    density than anywhere else in the stretch. The
    awning's shadow is considered valuable real estate;
    the stall directly beneath the peak pays a nominal
    fee to the man who owns the frame.
idlemessages:
- Dobb cuts through the stall-stretch on some errand,
  nods to a stall-keeper, and is gone before you can
  be certain you recognized him.
- A hawker calls the price of something you cannot
  quite see, pauses, and calls it again louder.
- Two delivery boys from competing houses nearly
  collide between stalls and part with practiced
  indifference.
- The smell here is layered — spice, fresh bread,
  raw cloth, the warm undertone of too many people
  in too small a space.
- A stall-keeper pulls a cloth over their display and
  steps inside; the neighboring stall immediately fills
  the silence with its pitch.
