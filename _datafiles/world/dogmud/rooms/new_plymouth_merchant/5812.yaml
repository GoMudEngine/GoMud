nouns:
  plate-stands: Articulated wooden forms on adjustable
    posts, each holding a breastplate or partial suit
    assembly at body height. The adjustments on each
    stand have been set to a specific customer's
    measurements — the heights and shoulder angles
    differ from stand to stand in ways that are not
    random. Some pieces are finished and tagged;
    others carry chalk marks at adjustment points
    where the metal needs further work. The farthest
    stand holds a near-complete half-suit in polished
    steel, its surface showing the controlled curve
    of work done very carefully.
  fitting-space: A section of bare floor near the
    center of the shop, its boards marked with a
    painted outline of two boot-prints facing the
    north wall — where the fitting mirror stands. The
    space around it is kept clear for Brun's movement
    during measurement sessions. The mirror is plate-
    glass in an iron frame, bolted to the wall at an
    angle calculated for the customer's viewing rather
    than the fitter's convenience.
idlemessages:
- The tap of Brun's small hammer against a breastplate
  edge rings once and then stops — the adjustment was
  correct.
- A customer on the fitting-space stands very still
  while Brun makes a chalk mark and calls a number.
- The plate-stands along the east wall carry work in
  several stages of completion — some raw, some nearly
  done, one recently collected and not yet replaced.
- The smell of leather dressing from the strapping
  work mingles with the cooler metal-smell pleasantly.
- Brun does not speak much during fitting sessions.
  The measuring cord does most of the communicating.
