roomid: 5812
zone: New Plymouth Merchant
title: Brun's Plate-Works
description: >
  The plate-works smells of metal and leather dressing
  and the dry coolness of annealed steel that has gone
  cold on its rack. Brun operates a fitting and
  finishing shop here — the forging is done elsewhere,
  in the Crafting Quarter — but the critical work of
  sizing, adjusting, and certifying happens on this
  floor. A row of
  <ansi fg="itemname">plate-stands</ansi>
  runs the east wall, each holding a completed or
  in-progress chest piece at body-height for assessment
  — the stands articulate at the shoulder to simulate
  movement. The center of the floor is the
  <ansi fg="itemname">fitting-space</ansi>
  — a marked area of bare board where customers stand
  while Brun works around them with measuring cord and
  steel gauge. The sound in here is the ring of small
  adjustments — a hammer used for tapping rather than
  striking, files and fitted pieces. Brun's work is
  considered the best in the district for fit, which
  is the thing that makes the difference between armor
  that saves you and armor that does not.
