title: The Square Fountain
description: >
  The fountain plaza opens between the Gilded Walk and
  the auction house block — a roughly square space
  paved in the same dressed stone as the Walk, broken
  at the center by the
  <ansi fg="itemname">civic-fountain</ansi>
  that gives it its informal name. The fountain is
  older than the Walk — a four-sided basin of grey
  limestone with a central column that once carried a
  figure and now carries a civic seal on an iron bracket
  instead, the swap made during some change of
  administration and not reversed since. Water still
  runs from the column's base into the basin with a
  steadiness that makes the plaza feel cooler than the
  surrounding streets. A ring of stone benches surrounds
  the basin — the informal claim-staking of the midday
  crowd, who arrive early and use this space as the
  commercial district's meeting room without walls.
  A
  <ansi fg="itemname">carved-date</ansi>
  on the basin's south face is the oldest text in this
  part of the quarter; the event it commemorates has
  been forgotten but the date has not.
