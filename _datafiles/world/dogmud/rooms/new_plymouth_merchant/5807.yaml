nouns:
  strong box: Iron-banded wood, floor-bolted through
    a plate set into the boards — the kind of
    installation that required cutting the floor and
    was not done lightly. Two keyholes, a locking bar,
    and on the lid a scratch that someone has worked
    at with an abrasive and almost removed. The box
    shows no marks of tampering. This is simply where
    the significant money lives, in a room above the
    room where it moves.
  ledgers: A shelf-run of dated volumes in matching
    cloth binding — not ostentatious, but consistent,
    the mark of a business that has operated long
    enough to develop its own material culture. The
    spines are dated by season and year. There are no
    gaps in the sequence. The most recent volume is
    pulled slightly out from the shelf at a useful
    working angle.
idlemessages:
- From below, the muffled sounds of the transaction
  floor — coins, a stamp, a chair.
- The strong-box keyhole catches the lamplight at a
  particular angle and then loses it.
- A ledger on the desk is open to a middle page, a
  column of figures running in a hand more careful
  than quick.
- The counting room is quieter than the floor below,
  quieter than the street, quieter than it looks.
- The lamp on the desk is a good one — low-smoke,
  steady flame, maintained rather than merely replaced.
