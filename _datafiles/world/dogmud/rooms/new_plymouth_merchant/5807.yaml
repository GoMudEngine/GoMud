zone: New Plymouth Merchant
title: The Counting Room
description: >
  The stair from the Exchange floor leads up through
  a low door into the counting room — the moneylender's
  private workspace above the public trade floor, warm
  from the lamps below and quiet in the way of rooms
  where the work never stops but also rarely raises
  its voice. A
  <ansi fg="itemname">strong-box</ansi>
  occupies the north wall, iron-banded and floor-bolted,
  its double keyhole prominent and unadorned. The east
  wall runs entirely to shelving —
  <ansi fg="itemname">ledgers</ansi>
  stacked in chronological order, their spines dated
  in a small consistent hand going back more than a
  decade. The desk in the center of the room is the
  working heart of the space — papers, a lamp of good
  quality, and the particular organized disorder of
  someone who knows where everything is and has no
  interest in explaining the system to visitors. The
  window looks over the back of the Walk. The counting
  room does not receive visitors who have not been
  specifically expected.
