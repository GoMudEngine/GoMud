zone: New Plymouth Merchant
title: The Plymouth Exchange
description: >
  South of Falk's, the Exchange occupies a hall of quiet
  gravity — polished stone floor, brass rails, and a long
  counter of dark oak beneath a coffered ceiling that keeps
  every voice at a murmur. Clerks in identical grey coats
  move between the counter and a wall of numbered strongboxes
  set flush into the stone, each fitted with a lock too fine
  to have been made anywhere but a capital. A ledger-stand
  holds the day's open account book, chained to the counter
  by a short brass leash. The room does its business without
  ceremony, and without ever quite letting a visitor forget
  whose city this is.
