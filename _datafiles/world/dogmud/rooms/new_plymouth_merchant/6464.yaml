nouns:
  strongboxes: A wall of numbered strongboxes set flush into
    the stone, each door fitted with a lock of fine capital
    make. A small brass plate above each records a number and
    nothing else.
  ledger stand: A standing lectern holding the day's open
    account book, chained to the counter by a short brass
    leash. The pages are ruled in a hand too neat to belong
    to anyone but a career clerk.
idlemessages:
- A clerk in a grey coat squares a stack of receipts against
  the counter edge before filing them.
- The brass leash on the ledger-stand rattles softly as the
  book is turned to a fresh page.
- Someone's coin is counted twice before it is recorded,
  quietly, without comment.
- The coffered ceiling holds the room's voices to a murmur
  no matter how many people are waiting at the counter.
