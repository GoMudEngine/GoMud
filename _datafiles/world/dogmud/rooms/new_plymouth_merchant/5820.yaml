title: The Watched House — Gate
description: >
  The lane ends at a wall of dressed stone, eight feet
  high, and the heavy gate set into it. The gate is
  wrought iron — old work, its vertical bars spaced
  to allow inspection from either side — and it is
  closed and chained with a padlock whose key is not
  here and has not been offered. Beyond the bars the
  rented house is visible in outline — two stories,
  upper shutters drawn, ground-floor windows dark
  behind curtains, a lamp burning faint and steady
  behind one of them. A figure in bloodline house-
  colors stands inside the gate, close enough to be
  addressed and positioned so that addressing them is
  the first decision a visitor must make. The figure
  does not acknowledge approach. The gate does not
  open from this side. Whatever business the occupant
  of this house conducts is conducted on their terms
  and at their invitation, and you have not been
  invited. The
  <ansi fg="itemname">house-gate</ansi>
  and the watcher behind it are the full extent of
  what this side of the wall offers.
