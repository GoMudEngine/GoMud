nouns:
  house gate: Wrought iron on heavy stone piers, the
    bars old and solid — this gate has been here
    longer than the bloodline's current tenancy. The
    chain looped through the bars is newer, its links
    bright where the older ironwork has gone grey.
    The padlock is the quality that does not suggest
    it is available to negotiation. Through the bars,
    the house door is visible — closed — and to one
    side a small window showing light behind a curtain.
    Someone is home. The gate does not open from this
    side.
idlemessages:
- The watcher inside the gate holds a position three
  steps from the bars — close enough to speak, far
  enough to be deliberate about it.
- Through the gate, a lamp is visible behind the
  curtained ground-floor window. The light does not
  move.
- The chain on the gate is not for show. The weight
  of it against the bars carries the sound of a
  decision already made.
- The upper windows of the house are shuttered. The
  house is occupied but not open. The occupant
  considers these different things.
- The bloodline watcher inside does not look at you
  directly. This is also a form of attention.
