nouns:
  changers desk: A folding table under a fixed awning
    at the north wall — the table is set up and taken
    down daily, but the awning is permanent, which
    tells you something about the tenure of this
    operation. A clerk in an unremarkable coat sits
    behind the table with a locked cash-box, a scale,
    and a reference sheet for current exchange rates.
    The rates on the sheet differ from the Exchange's
    posted rates by an amount that is not unreasonable
    and in a direction consistently favorable to the
    clerk. The clerk does not advertise.
  drainage grate: A cast-iron grate set flush in the
    alley paving, its purpose ostensibly to manage
    runoff from heavy rain. The lip is worn smooth at
    one point — east side, near the corner — in a
    pattern inconsistent with foot-traffic or weather.
    The grate is hinged on one side and latches on
    the other. The latch is not locked. Whether
    anything lies beneath it at a given time is a
    question for someone who uses this alley regularly
    and has occasion to check.
idlemessages:
- The changers-desk clerk does a transaction without
  looking up — the rate is remembered, the coin
  assessed by weight and sound rather than inspection.
- Two porters navigate the alley's narrow pass with
  the brief courtesy of people who do this many times
  a day.
- The drainage-grate is clear at this moment.
  The latch is down.
- From the north, faint stamp-sounds from the permit
  office above.
- The alley does not smell of anything in particular,
  which in this city is an achievement.
