title: Coin Alley
description: >
  Coin Alley runs east-west between the fountain plaza
  and the Porters' Dock — a narrow thoroughfare of the
  kind that develops behind every row of commercial
  frontage, where secondary and unofficial business
  happens. The
  <ansi fg="itemname">changers-desk</ansi>
  operates here — a folding table under a permanent
  awning at the north wall, staffed by a clerk who
  provides a money-changing service that the Exchange
  across the Walk does not technically offer to
  customers below a certain account size. The Exchange
  does not formally acknowledge the desk's existence;
  the desk does not acknowledge the Exchange. The alley
  is narrow enough that two people passing require
  courtesy to manage, and the traffic of porters and
  factors through the day means the courtesy gets
  considerable exercise. A
  <ansi fg="itemname">drainage-grate</ansi>
  in the center of the alley paving serves its drainage
  function and additionally serves as an informal
  message-drop, its lip worn by a generation of specific
  use that is not its official purpose. The alley
  connects the four main draws of this block — the
  fountain, the dock, the armoury, and the permit office
  — and those who use it regularly know all four.
