title: The Gilded Walk
description: >
  The Gilded Walk runs east from the Gilt Threshold,
  a stretch of broad paving kept cleaner than the
  market behind it by the collective effort of the
  businesses facing it — each proprietor sweeps their
  own frontage, and the cumulative effect is a street
  that announces money without advertising it directly.
  The <ansi fg="itemname">window-fronts</ansi> here are glazed, a detail that
  costs more in a city this far inland than might be
  obvious, and the goods behind the glass are arranged
  with care rather than merely displayed. To the south
  the Walk descends toward the Exchange and the shops
  of the financial row; east it opens into the fountain
  plaza where the cross-traffic collects at midday. The
  <ansi fg="itemname">paving-seam</ansi>
  running the center of the street, where the original
  cobbles meet the later dressed stone, is the oldest
  thing on this block — everything else has been rebuilt
  around it. The Walk in the afternoon is a different
  place than the Walk at night, and both are different
  from the early morning hour when the glaziers' boys
  come to clean the windows before trade opens.
