nouns:
  window-fronts: Glazed shop windows in a city that mostly
    makes do with shutters — clear panes set in good frames,
    kept clean, the goods behind them laid out in considered
    arrangements rather than piled for volume. You cannot
    always tell what a given front is selling; that, too,
    seems to be the point. A window like this says the owner
    can afford to glaze it, and lets you draw the rest of the
    conclusion yourself.
  paving-seam: A line running the center of the Walk
    where two eras of construction meet — older
    cobblestone to the east, newer dressed limestone
    flags to the west, the join filled with a mortar
    that has been repacked twice and shows it. The
    seam is barely visible under foot-traffic but runs
    true from one end of the block to the other without
    deviation. Whatever the Walk was before it was the
    Gilded Walk, this is what is left of it.
idlemessages:
- A factor in a good coat moves along the Walk at the
  measured pace of someone who is both busy and aware
  of being seen.
- One of the glazed window-fronts catches the light
  at an angle that makes the interior impossible to
  read from the street.
- A delivery arrives at a side entrance further down
  the block — a covered cart, handled quickly and
  without ceremony.
- The Walk is wide enough here that two carts could
  pass; in practice the foot-traffic makes one
  deliberate.
- Someone has chalked a price on the pavement near
  the fountain end — legible, but without context.
