title: The Long Market — East Reach
description: >
  The Long Market east of the square takes on a settled
  tone — wider pavement, buildings with proper shop-
  fronts rather than stall-awnings, the kind of
  commercial street where the neighbors have a covenant
  about appearances and keep it. The
  <ansi fg="itemname">shop-fronts</ansi> carry carved
  signs in dark wood set with brass lettering, each
  presenting its trade with the quiet confidence of an
  establishment that expects customers to come to it
  rather than being lured in. A
  <ansi fg="itemname">lamp-bracket</ansi> jutting from
  the corner building holds a lantern that burns
  longer-oil — you can tell by the steadier, more
  golden waver of the flame through the glass. East,
  the Long Market continues toward the Temple district,
  the avenue running straight between the merchant
  houses and into a distance that carries the faint
  smell of incense on the right wind.
