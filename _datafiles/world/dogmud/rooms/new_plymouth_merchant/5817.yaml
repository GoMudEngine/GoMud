nouns:
  notice board: A board covering the east wall, its
    surface deep in layered notices — the current fee
    schedule pinned over an older one, permit categories
    reorganized twice in the last season, a set of new
    regulations in the bloodline's formal hand pinned
    over what they supersede. Nothing is removed;
    everything is added to. The effect is an archive
    of changes delivered without explanation, each one
    adjusting the cost or difficulty of conducting
    business in this quarter. The board is updated
    regularly. The queue arrives regularly.
  queue rope: A velvet rope on brass posts — the same
    furniture used in better hotels, which may be
    coincidence or may be a deliberate choice about
    what this interaction is supposed to feel like.
    The rope guides arrivals through a path to the
    correct window that is longer than the room's
    geometry requires. The extra length is not
    accidental. The clerks can see the queue from
    the counter; the queue cannot easily see the
    clerks until they arrive at the window.
idlemessages:
- A clerk at the counter reviews an application
  without expression and stamps it — approval or
  denial not immediately clear from the sound.
- The queue-rope holds five people in the current
  wait. None of them speak.
- A notice on the board carries a recent date and
  adjusts the quarterly tribute assessment for
  trading operations above a certain volume.
- Stamp-ink smells specific in closed rooms. This
  room has been stamping things for some time.
- A completed application is filed in the rack behind
  the counter — a slot already labeled for exactly
  that category of filing.
