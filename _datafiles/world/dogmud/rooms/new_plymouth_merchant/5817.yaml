title: The Permit Office
description: >
  The permit office occupies a building that was
  something else before the bloodline required a
  presence in this district — the repurposing is
  visible in a layout that does not quite fit its
  function, the service counter positioned where a
  window used to be, the queue-lane running at an
  angle to the original floor plan. A
  <ansi fg="itemname">notice-board</ansi>
  covers the east wall from floor to shoulder height
  — permit schedules, fee tables, and regulatory
  announcements in the bloodline's typeface, layered
  over each other in the order they were issued rather
  than any order of clarity. The counter runs the south
  end of the room, staffed by clerks who process
  applications with the precise unhurried efficiency of
  people working in an institution that does not need
  to hurry because the applicants cannot go elsewhere.
  The
  <ansi fg="itemname">queue-rope</ansi>
  guides arrivals to the correct window in a way that
  is not optional. The air smells of stamp-ink and the
  dry must of official paper accumulated in quantity.
  East, the Watched Lane leads toward the bloodline's
  private residence; the records room is above.
