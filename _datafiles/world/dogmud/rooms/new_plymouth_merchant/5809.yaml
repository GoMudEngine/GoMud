nouns:
  bid-book: The current auction ledger — a hardbound
    volume open on the desk at a page of registered
    bids with their associated lot numbers and buyer
    codes. The codes are not names; they are a
    shorthand that Falk has used long enough that the
    key to them exists only in his head and in a
    second ledger whose location is not obvious from
    this desk. Some codes appear more frequently than
    the lot calendar would suggest coincidence.
  lot-calendar: A ruled sheet mounted on a wooden
    backing, its columns laid out by week and its
    rows by lot sequence. Client codes appear in the
    margin beside items of interest to repeat buyers.
    One code — a simple double line with a small mark
    beneath — appears in the margins of seven of the
    next nine scheduled lots. It is not a code that
    appears anywhere in the property-roll downstairs.
idlemessages:
- The desk lamp is clean and well-trimmed — Falk has
  not left it to run low.
- From below, the acoustic rumble of the auction floor
  comes up through the boards.
- The lot-calendar margin has been annotated in at
  least two different hands.
- The armchair faces the window at an angle that
  catches the street without requiring leaning.
- A cup on the desk is cold — Falk has been elsewhere
  this morning.
