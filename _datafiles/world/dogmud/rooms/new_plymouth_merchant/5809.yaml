title: Above the Auction House
description: >
  Falk's room above the auction house occupies the
  north half of the building's upper story — the south
  half above the block is a staging loft with its own
  access, which Falk has not connected to his quarters
  by any door that visitors could find. The room is the
  workspace of a man who handles information as much as
  goods — a desk dominated by the current
  <ansi fg="itemname">bid-book</ansi>,
  shelves of indexed correspondence, and a wall-mounted
  <ansi fg="itemname">lot-calendar</ansi>
  where the next several weeks of scheduled sales are
  marked with client codes rather than names. A single
  armchair faces the street-side window, positioned for
  reading rather than watching, though it appears to
  serve both purposes. The room is tidier than the
  floor below and warmer; Falk works late.
