zone: New Plymouth Temple
title: The Chapel — Recovery Room
description: >
  The ward is kept quieter than the chapel — a
  quality enforced without force, by the character
  of the room and the understanding of everyone
  who enters it. Four beds along the south wall
  serve the mending; their occupants change with
  the city's need, the turnover higher in winter.
  The room smells of clean wool and the same
  medicinal herb that moves through the chapel's
  air. A <ansi fg="itemname">water-cabinet</ansi>
  against the north wall holds the healers' working
  materials — clean cloth, prepared compounds,
  a ceramic water jar refilled each morning. Small
  <ansi fg="itemname">recovery-notes</ansi> are
  tucked beside each occupied bed — not medical
  records but instructions for the recovering:
  when to rise, what to eat, what to return for.
  The healer's voice is present in these notes,
  even in the ones written for people who cannot
  read them yet. The almonry is reached by the
  north door for those recovered enough to move.
