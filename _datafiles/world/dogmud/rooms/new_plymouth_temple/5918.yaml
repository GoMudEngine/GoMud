title: The Restricted Collection — Door
description: >
  The passage ends at a door of iron-banded oak
  set in a frame that has been reinforced from
  this side with additional stone — a later
  addition, the mortar a slightly different color
  from the original wall. The door has no handle
  on this side. It has no visible keyhole on this
  side. It is not locked in the way that things
  that can be unlocked are locked — it does not
  open from this side, and the distinction matters.
  The <ansi fg="itemname">sealed-door</ansi> is the
  boundary. On the other side of it is the temple's
  Restricted Collection — materials gathered over
  three centuries of the faith's presence in this
  region, their subjects unknown to anyone not
  granted access by the canon, their existence
  acknowledged in the archive's public catalog only
  by a volume count and the notation: not in
  general circulation. The archivist has been asked
  about this door by every scholar who passes
  through the reading room and has given a complete
  answer to none of them. The only way forward is
  back.
