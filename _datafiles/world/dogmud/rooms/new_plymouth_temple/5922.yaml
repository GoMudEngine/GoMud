title: The Censer Court
description: >
  The court is barely large enough for its purpose
  — a walled enclosure open to the sky, its paving
  darkened by years of ash and fragrant residue
  from the offerings burned here. Several
  <ansi fg="itemname">censer-chains</ansi> hang
  from iron brackets set into three of the four
  walls — heavy brass censers on long chains,
  their surfaces engraved with the temple's mark,
  swung in full circles during the major devotions
  and left hanging in still, weighted rest between
  them. The air is thick with incense even at low
  use; the walls have absorbed it so completely
  that the smell is architectural rather than
  atmospheric. At the court's center, a low
  <ansi fg="itemname">offering-basin</ansi> of
  iron-black stone is set flush into the paving,
  its rim worn from the hands of those who deposit
  offerings before they are lit. What is burned
  here is between the offerer and the divine —
  the temple's records make note of volume, not
  content.
