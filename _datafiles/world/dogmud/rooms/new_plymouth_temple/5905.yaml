zone: New Plymouth Temple
title: The Bell Tower Base
description: >
  The tower narrows from the sanctuary's south exit
  into a rough stone chamber that smells of rope-oil
  and cold air from the shaft above. The great
  <ansi fg="itemname">bell-rope</ansi> descends from
  high in the tower — thick braided hemp, worn smooth
  at hand-height from daily pulling, its coiled lower
  end tied off at a wall-hook so the bell's weight
  does not work against the rope at rest. Above the
  rope's reach the tower becomes its own atmosphere —
  shadow, the residual ring of metal in cold stone,
  and the sounds of the city arriving at a distance
  and a remove that belong to height. The
  <ansi fg="itemname">tower-stair</ansi> begins here,
  spiraling right in a tight curve, each tread worn
  at the center, climbing past the bell chamber to
  the upper platform above the city's roofline. Two
  doorways open from the tower's base — passages
  reaching toward the temple chapel and the attached
  seminary — but both are closed at this hour, their
  corridors extending out of sight.
