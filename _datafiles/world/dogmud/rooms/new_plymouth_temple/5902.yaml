title: The High Altar
description: >
  The sanctuary narrows at its eastern end and the
  altar fills the space with a weight that has
  nothing to do with its dimensions. The
  <ansi fg="itemname">altar-table</ansi> is raised
  two steps above the nave floor — a great slab of
  pale stone, its surface covered in a layered cloth
  of deep amber and grey that has been replaced so
  many times the stone beneath has not been seen by
  anyone now living. The cloth is not ornate; the
  ornamentation is concentrated in the
  <ansi fg="itemname">dedicatory-panel</ansi>
  mounted above and behind it — three carved stone
  reliefs in the flat archaic style of the founding
  era, depicting the three moments the faith names
  at the heart of its teaching — the leaving, the
  passage, the return — worn near-smooth at the
  edges but still distinct at center where the
  chisel went deepest. The candles at the altar's
  four corners are always fresh. Someone sees to
  this before the first arrival of the day and
  after the last.
