nouns:
  repose-tree: A small tree of dense, slow-growing
    habit occupying the garden's northeast corner —
    old enough that its trunk has gone grey and
    furrowed, its canopy kept to a roughly spherical
    shape by careful seasonal pruning. The pruning
    has been performed for so many generations that
    the tree's current form has become its permanent
    character — it no longer grows toward its
    natural shape but maintains the pruned one.
    In spring it produces small white flowers that
    last about a week; in autumn the leaves go
    a warm yellow before falling. It does not do
    anything remarkable. It has been here for a
    very long time.
  garden-bench: A stone bench facing the repose-
    tree — plain, without back or inscription,
    wide enough for two people to sit with
    comfortable distance between them or one
    person to lie down. The sitting surface is
    worn slightly hollow at the center, a small
    compression from years of use. The bench is
    not assigned or designated; it is for whoever
    comes to sit in it, which includes novices
    in difficulty, senior keepers on intervals,
    the canon once a week in the early morning,
    and occasionally people with no particular
    connection to the temple who have found the
    garden gate unlocked and sat down without
    asking anyone's permission.
idlemessages:
- The garden is quiet in a way that is active —
  the walls doing work to produce the quiet,
  the city pressing against them from outside.
- The repose-tree's canopy holds still in the
  garden's sheltered air while the taller
  trees beyond the wall move in a gust.
- The gravel of the garden is raked in a simple
  pattern — parallel lines, no elaboration —
  that is repaired each morning and disturbed
  by each afternoon.
- From the dormitory window above, a face
  appears briefly in the glass and then is gone.
- The garden bench is empty. The impression
  in its surface records countless previous
  occupants without distinguishing between them.
