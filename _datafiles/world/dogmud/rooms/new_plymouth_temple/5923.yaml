zone: New Plymouth Temple
title: The Garden of Repose
description: >
  The garden is small and the quietest place in
  the temple precinct. The walls are high enough
  to block the immediate sounds of the street —
  the city is present as a murmur and a sense of
  density beyond the stone, not as noise. The
  planting is deliberate and low-maintenance —
  several dense herbs along the south wall, a
  small <ansi fg="itemname">repose-tree</ansi>
  whose species has been in this location for
  over a century, pruned to fit the space rather
  than allowed to fill it, and gravel in the
  remaining area, raked in a pattern that is
  simple and not decorative. A single
  <ansi fg="itemname">garden-bench</ansi> faces
  the tree. The bench has no inscription and no
  designation — it is for whoever needs to sit
  outside the seminary and think, or not think,
  in the one place the temple provides for that.
  The dormitory window is visible from here;
  occasionally a novice face appears in it and
  then withdraws.
