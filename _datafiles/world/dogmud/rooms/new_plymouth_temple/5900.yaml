title: The Eastern Processional
description: >
  The road changes underfoot as you leave the
  merchant yards behind — the utilitarian paving
  of the quarter gives way to dressed stone that
  has been maintained with different intention,
  swept clean to a pale uniform color rather than
  merely kept passable. The market noise falls off
  by degrees here; ahead, the grade climbs gently
  toward the pale stonework of the temple precinct.
  At the roadside a
  <ansi fg="itemname">waystone</ansi> stands where
  the pilgrim way begins in earnest — an old marker
  whose base has gone dark with the accumulation of
  small offerings set against it over many years,
  most of them dry and colorless now. The
  <ansi fg="itemname">road-paving</ansi> itself
  holds a record — worn in the center on the lower
  stretch, worn toward the edges on the upper, where
  pilgrims have tended to walk two abreast rather
  than single file. Whatever the road was built for,
  it has been a pilgrim way long enough to show it.
