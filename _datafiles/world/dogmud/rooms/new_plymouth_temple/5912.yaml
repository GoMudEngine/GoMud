nouns:
  canon ledger: An open book on the canon's desk —
    the formal record of this office's two primary
    functions. The left-side columns record
    blessings administered by date, recipient
    description, and nature of blessing. The
    right-side columns record archive access
    requests — date received, nature of the
    inquiry, determination, and a brief
    justification in the canon's hand. The
    determinations in the right-side column are
    more often a single word than a sentence.
    The justifications are in a compressed
    personal notation that is not quite a cipher
    but is not easily readable by anyone other
    than its author.
  canon volumes: A shelf of perhaps thirty volumes
    against the cell's east wall — all shelved
    spine-inward, their backs to the room. The
    shelf reveals only a row of page-edges —
    thin or thick, some worn with heavy use
    and some apparently little opened. There is
    no identifying information visible from the
    room. The practice of shelving volumes
    spine-inward is not common and is not
    explained here. The volumes are the canon's
    personal collection; their subjects are not
    a matter of public record. The shelf has
    been arranged this way since before the
    current canon held this office.
idlemessages:
- The canon-ledger lies open on the desk. Its
  columns hold the decisions of this office in
  the canon's compressed notation.
- The prayer-standing in the corner shows the
  wear of daily use — the wood smooth at knee
  height, the surface worn to a polish.
- The light in the canon's cell falls at a
  particular angle. You are not sure why it
  seems different from the light in the chapel.
- The volumes shelved spine-inward against the
  east wall hold their titles to themselves.
  The shelf has been arranged this way for
  longer than the current occupancy.
- The room is quiet in a way that includes
  the person currently in it, if anyone is.
