roomid: 5912
zone: New Plymouth Temple
title: The Canon's Cell
description: >
  The room is austere but not poor — a distinction
  the canon maintains precisely, and which is
  itself a form of communication. The furniture is
  spare: a desk, a chair on each side of it, a
  shelf of personal volumes, a prayer-standing in
  the corner whose wear indicates long daily use.
  On the desk, a <ansi fg="itemname">canon-ledger</ansi>
  lies open — the record of blessings administered
  and archive access granted or denied, kept in
  the canon's own hand. There is a quality to this
  cell that becomes apparent only after you have
  been in it for a moment — something in the way
  the light falls, or in the silence between
  words, or in the fact that the
  <ansi fg="itemname">canon-volumes</ansi> on the
  shelf are shelved spine-inward. The temple's
  faith holds that certain bloodlines carry a
  proximity to the divine that is inherited rather
  than earned. In this room, that belief is not
  argued — it is present as atmosphere, in the
  same way the warmth is present in the Keeper's
  Hall. You do not need to share it to feel it.
