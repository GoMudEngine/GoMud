zone: New Plymouth Temple
title: The Seminary — Study Hall
description: >
  The study hall is the room where the founding
  story is taught — where the canon or a senior
  keeper lays out the faith's account of its
  origins in this region, the revelation, the
  first settlement, the original compact between
  the temple and the city. The
  <ansi fg="itemname">teaching-lectern</ansi>
  stands at the room's east end, its wood worn
  at the grip-points by many hands. The row of
  benches facing it holds — in the middle section,
  second bench — a
  <ansi fg="itemname">question-scratch</ansi>:
  a small mark cut into the wood with something
  sharp and narrow, a single horizontal line that
  is not a word and not a symbol but which has
  been noticed and not removed. A first-year
  novice put it there. The founding story as
  given here is true in all its details. The
  question it represents — the one that cannot
  be asked at the lectern — is the question
  this room teaches its occupants how to carry.
  The study hall does not know it does this.
