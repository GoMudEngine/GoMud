nouns:
  cloister columns: Stone columns at regular intervals
    along the walk's open side, their capitals carved
    in the early style of the precinct — figures and
    patterns that have been worn by passing hands to
    a depth that obscures what the carver intended.
    You can read posture in some of them — a figure
    turning, an animal's shoulder — but the specific
    image is gone. The shafts themselves are smooth
    and cool to the touch, their stone a pale grey
    that goes warmer in strong afternoon light.
  cloister bench: A long stone bench set against the
    inner wall of the walk — flat-topped, wide enough
    to sit comfortably, running most of the walk's
    length without interruption. The sitting surface
    is worn hollow in the middle, slightly, from
    years of occupancy. The bench is for anyone —
    it has no designation, no reserved position —
    and it is used with that understanding — a place
    to sit without purpose being required. A faint
    handprint worn into the stone at one end marks
    where many hands have rested on the way down
    or up.
idlemessages:
- A novice passes along the walk at a purposeful
  pace, carrying folded cloth, eyes forward.
- Light through the cloister-columns makes long
  rectangles on the walk floor that shift as the
  day moves.
- From somewhere around the north bend, the soft
  sound of a door closing — further along the
  precinct than this reach of walk.
- Two birds work the enclosed garden visible
  between the columns, methodically investigating
  the gravel.
- The cloister-bench is empty at the moment. It
  carries the particular quiet of furniture that
  has been sat on for a very long time.
