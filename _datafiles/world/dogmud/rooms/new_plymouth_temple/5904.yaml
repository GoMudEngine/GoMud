title: The Cloister Walk
description: >
  The covered walk runs along the sanctuary's north
  wall, its columns spaced far enough apart to admit
  long rectangles of outdoor light and close enough
  to give the walk its character of enclosure without
  confinement. The stone underfoot is old and slightly
  uneven — repaired in sections by different hands
  across many years, each repair a shade different
  from the last. The
  <ansi fg="itemname">cloister-columns</ansi> carry
  carved capitals worn to near-abstraction by
  generations of hands running along their height —
  faces, knotwork, animals all softened to the
  suggestion of what they once were. Between the
  columns the enclosed garden of the precinct is
  visible — gravel and low plantings, tended, quiet,
  a private interior the walk frames without entering.
  Along the inner wall a
  <ansi fg="itemname">cloister-bench</ansi> follows
  the walk's length, worn smooth at the sitting
  surface by years of use. The walk bends further
  north — passages open toward the Keeper's House
  and the main precinct yard, still out of sight
  around the turn.
