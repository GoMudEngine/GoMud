title: The Keeper's House — Lodging
description: >
  The upstairs corridor runs along the house's
  upper story — a row of narrow doors, each giving
  onto a cell barely wide enough for a bed, a chair,
  and a small table. The cells are not individually
  assigned; they are taken in order of arrival and
  vacated in order of departure, and the keeper who
  slept in a given room last month is not the keeper
  who slept there last year. The
  <ansi fg="itemname">lodging-corridor</ansi> carries
  the quality of accumulated brief occupation —
  many different travel-worn packs, many single nights
  of sleep by people who came here for work and not
  for ease. A <ansi fg="itemname">corridor-window</ansi> at the corridor's end overlooks
  the courtyard below; in morning light the precinct
  board is legible from here. The stair descends
  to the hall below.
