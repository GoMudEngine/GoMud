nouns:
  lodging corridor: The upstairs passage of the
    Keeper's House — a plain stone corridor of
    close-set doors, each identical in proportion
    and fitting. The cell doors have latches but
    no locks, in keeping with the understanding
    that keepers in residence are guests of the
    institution rather than private tenants. Most
    cells carry the small residue of current
    occupancy through the door gaps — a pack
    against the wall, a coat on the hook, a
    candle-stub on the table. One cell at the far
    end has its door standing open and its cot
    made with the tightness of vacancy.
  corridor window: The window at the far end of
    the lodging corridor faces south and down into
    the courtyard. The glass is old — slightly
    wavy, the kind that distorts without obscuring —
    and the wooden frame is worn smooth at the
    sill where hands have rested to look out. From
    this height the courtyard's full shape is
    visible, and on clear mornings the precinct
    board on the archive wall is readable if you
    know what you are looking for. The window
    latch is stiff and requires both hands.
idlemessages:
- A keeper's door opens and closes along the
  corridor — the brief sound of someone organizing
  their things for the day.
- Morning light comes through the corridor window
  at a low angle, cutting across the floorboards.
- The lodging is quiet at this hour. What noise
  there is comes from below, through the floor.
- The smell up here is different from the hall —
  less hearth, more habitation, the mild residue
  of many different travelers.
