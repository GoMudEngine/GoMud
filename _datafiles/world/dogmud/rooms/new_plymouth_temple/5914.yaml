nouns:
  novice-beds: Close-set narrow beds in two rows
    down the dormitory's length — each with an
    identical undyed blanket folded and tucked
    with institutional precision, each with a
    small chest at the foot and a study-slate
    on the shelf above. The beds are assigned
    by seniority of entry into the seminary;
    the oldest novices are nearest the door,
    the newest furthest from it, near the
    garden window. The shelves above the newer
    beds have more chalk dust on them. The
    institutional precision of the bed-making
    is not consistently achieved — some tucks
    are tighter than others, and the novices
    nearest the door have learned that the
    difference matters.
  pushed-slate: Visible under the bed near the
    garden window — a study-slate pushed far
    enough back that it is not immediately
    apparent and not far enough back that it
    was forgotten. The slate holds not diagrams
    or copied passages but a series of questions
    written in a careful hand — not the
    compressed student hand of the other slates
    but a slow deliberate script, each question
    on its own line, each one a question about
    the founding story as taught in the study
    hall. The questions are not hostile. They
    are precise. The slate has no name on it.
idlemessages:
- The dormitory is quiet at this hour — the
  slates on the shelves holding the morning's
  incomplete work.
- Chalk dust in the dormitory air settles on
  the nearest surfaces in a fine pale coat.
- The garden window at the dormitory's end
  shows the repose garden — still, green,
  unreachable without going through the chapel.
- One slate on its shelf has a question in
  the corner, written small, that its owner
  has not erased.
- The beds near the door are made with greater
  precision than those at the far end. The
  difference took time to learn.
