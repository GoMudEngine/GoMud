title: The Seminary — Dormitory
description: >
  The novices' dormitory runs the length of the
  seminary's south wing — a long room of close-set
  beds, each with a small chest at its foot and
  a study-slate on the shelf above. The slates
  carry the evidence of learning in progress —
  diagrams of the faith's cosmology, copied
  passages in uneven hands, one slate bearing
  a question written very small in the corner
  that the owner has not erased. The
  <ansi fg="itemname">novice-beds</ansi> are
  narrow and identically made, their blankets
  tucked with a care that suggests either
  precision required or a desire to leave nothing
  open to correction. The room smells of chalk
  dust and close air. At the far end, a window
  looks into the Garden of Repose — the one
  green thing the novices have access to without
  leaving the seminary. Near that window, a
  second <ansi fg="itemname">pushed-slate</ansi>
  has been pushed under a bed; it is visible
  only if you look for it, its surface covered
  with questions rather than answers.
