title: The Keeper's House — Hall
description: >
  The hall is longer than its entrance suggests
  and warm in all seasons — the <ansi fg="itemname">hearth</ansi> at the
  far end has been maintained without interruption
  for longer than any current keeper can say, and
  its residual heat has worked into the walls so
  that the room holds warmth as a property of
  itself rather than a product of the current
  fire. The flagstone floor is covered at its
  center by a woven runner darkened and compressed
  by years of foot-traffic, the original colors
  still visible at the selvedge. A rack of
  <ansi fg="itemname">numbered-coats</ansi> along
  the east wall holds the house's stock of
  keeper-coats — heavy wool, iron-numbered at the
  collar, belonging to the building rather than
  to the individuals who wear them. They are hung
  here on arrival and retrieved on departure. The
  desk is through the door to the west; the
  warden's passage opens to the north; the
  lodging stairs go up.
