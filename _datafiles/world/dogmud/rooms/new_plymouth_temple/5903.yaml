nouns:
  gate arch: The arch over the precinct entrance is
    built from the same pale stone as the temple, its
    span wide enough for two carts to pass abreast
    though no cart has passed here in living memory.
    The keystone bears a wheel in low relief — the
    faith's central symbol, six spokes, the rim
    complete — worn at the base where hands have
    reached to touch it going in and going out.
    Whether touching the keystone is a formal
    observance or a habit that became one, no one
    now distinguishes between the two.
  alms bench: A long flat stone at the arch's foot,
    broad enough to sit on from either side, set low
    in the traditional manner for almsgiving at a
    sacred threshold. The top surface is smooth and
    slightly concave from years of coins and hands
    and whatever else passes between a figure at
    rest and a pilgrim who will not stop long. It
    carries no inscription. The custom of leaving
    something here is older than any text that
    records it.
idlemessages:
- A pilgrim stops before the gate-arch and touches
  the keystone briefly with the flat of the hand
  before passing through.
- The plaza is quiet for a moment; then a goods-
  runner from the market arrives at a trot and
  pauses to settle themselves before entering.
- A coin is placed on the alms-bench with the
  deliberate care of an exchange — set precisely,
  not dropped.
- The gate-arch frames the sanctuary's west doors
  at the far end of the nave — heavy, pale, standing
  open through the day's hours.
- The figure at the alms-bench does not move, and
  the plaza traffic moves around them with the
  ease of long habit.
