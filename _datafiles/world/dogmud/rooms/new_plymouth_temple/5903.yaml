title: The Temple Gate Plaza
description: >
  The road opens into a broad plaza of pale dressed
  stone — the traditional gathering point where
  pilgrims who have arrived late wait for the inner
  doors to open, where goods-runners pause to catch
  their breath before the final delivery into the
  precinct, and where the city's informal boundary
  between secular and sacred is most legibly drawn.
  The great <ansi fg="itemname">gate-arch</ansi>
  frames the east passage into the sanctuary, its
  keystone carved with the faith's wheel — worn
  smooth at the base from the hands of generations
  who have touched it in passing. Beside the arch's
  southern foot an
  <ansi fg="itemname">alms-bench</ansi> occupies
  the position it has occupied since the precinct
  was first walled — a flat stone set for the
  purpose, worn from years of use, beside which
  a figure keeps a patient watch with the settled
  quality of someone who has been part of this
  threshold for a long time and intends to remain
  so.
