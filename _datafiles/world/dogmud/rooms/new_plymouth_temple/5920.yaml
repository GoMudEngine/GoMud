roomid: 5920
zone: New Plymouth Temple
title: The Pilgrims' Rest
description: >
  The hostel room is plain by design — a long
  space of close-set cots under a low ceiling,
  built to accommodate a number of people in
  minimal comfort for a night before their purpose
  is completed. The <ansi fg="itemname">pilgrims-cots</ansi>
  are narrow and serviceable, their blankets a
  heavy undyed wool that is warm in the way of
  things made without interest in appearance. A
  rack near the entrance holds spare blankets and
  a row of hooks for outer clothing. The room
  smells of tallow and the mixture of bodies that
  comes from a space occupied by different people
  every night. There is a quality of transience
  here that is not uncomfortable — this room has
  always been a pause, not a residence, and it
  carries that understanding in the wood and stone
  of it. A small
  <ansi fg="itemname">hostel-window</ansi> looks
  out over the courtyard below.
