nouns:
  intake register: The current intake register —
    an open book of ruled columns on heavy paper,
    bound in dark leather. The columns record
    arrival date, keeper name, purpose of visit,
    cell assigned, and departure date when known.
    The departure column has entries still blank
    for keepers currently in residence. The hand
    that fills these columns is precise and even,
    with a characteristic abbreviation system for
    common purposes of visit. One entry from three
    weeks prior has been crossed through with a
    single ruled line — not erased, just voided —
    and the notation beside it is a single letter
    that is not an abbreviation in the standard
    system.
  register shelf: A shelf of bound volumes running
    the full width of the desk room's back wall —
    thirty years of intake registers, each labeled
    by year on the spine, each in the same leather
    binding in slightly varying states of age. The
    oldest volumes at the left end have spines that
    are cracking; the leather has gone from dark
    to a warm grey-brown. A gap exists between the
    volume from eleven years ago and the one from
    nine years ago. The gap is not labeled. The
    desk-keeper, asked about it, gives a complete
    answer about the shelf-numbering system.
idlemessages:
- The intake register lies open to the current
  page — a column of recent entries, the last few
  lines still fresh.
- The lamp at the register's edge burns without
  movement in the still air of the desk room.
- From the hall beyond the door, the sound of
  boots on flagstone, passing without stopping.
- The register-shelf carries thirty years in
  a row of spines. The oldest volumes have gone
  the color of old leaves.
