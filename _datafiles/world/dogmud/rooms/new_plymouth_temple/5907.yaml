title: The Keeper's House — Desk
description: >
  The desk room occupies the end of the house's
  west passage — a small, exact space whose purpose
  does not invite lingering. The
  <ansi fg="itemname">intake-register</ansi> lies
  open on the desk surface, its columns filled in
  a regular professional hand that changes only
  when the position changes and is immediately
  recognizable as having changed. Behind the desk,
  a <ansi fg="itemname">register-shelf</ansi> holds
  bound volumes of past registers going back three
  decades — the spines labeled by year, the
  lettering of the older labels fading toward the
  left end of the shelf. A small oil lamp sits at
  the register's left side, positioned to illuminate
  the page without glare. The room has a single
  function — the formal entry of arriving keepers
  into the record — and its arrangement reflects
  this without apology. Everything here is in its
  proper place. Nothing is pending.
