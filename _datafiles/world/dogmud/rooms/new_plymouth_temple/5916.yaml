title: The Temple Courtyard
description: >
  The courtyard opens between the cloister's north
  bend and the precinct buildings arranged around it
  — the Keeper's House to the west, the archive
  wing to the east, the pilgrims' hostel passage
  to the north. The paving is laid in an older
  pattern than the surrounding stonework, its rows
  angling slightly off-perpendicular to the
  buildings above them — a tell that this open
  space predates the current precinct's
  organization. A
  <ansi fg="itemname">precinct-board</ansi> on
  the archive wall carries chalked notices — the
  reading-room schedule, a roster of keepers in
  residence, a list of names some of which are
  marked with symbols whose meaning is not
  explained here. Beneath the board two scholars
  conduct a disagreement in the tone of people
  who have been at this particular point for
  longer than today. The
  <ansi fg="itemname">yard-well</ansi> at the
  courtyard's center has served the precinct
  longer than the buildings around it. Pilgrims
  cross diagonally without stopping, their
  purposes moving between the hostel and the
  cloister walk below. The city noise is present
  here in a way it is not inside — at the
  perimeter of the temple's stillness rather than
  within it.
