nouns:
  precinct board: A board of heavy planking fixed
    to the archive wall, its surface carrying
    chalked notices in several hands — some
    official, some clearly appended without
    authorization. The current notices include the
    reading-room schedule, a roster of keepers in
    residence with cell assignments, and a column
    of names with marks beside them that the
    board's official entries do not explain. The
    marks are not all the same. Some names appear
    more than once in slightly different forms. The
    board is wiped and rewritten each morning by
    the desk-keeper, but the morning's writing
    suggests familiarity with what was there before.
  yard well: The well at the courtyard's center is
    older than the precinct it serves — the stone
    of its coping is a different origin from the
    building stone around it, and the well-shaft
    goes deeper than a precinct well would need to.
    The water is cold and slightly mineral. The
    coping is worn at two grip-points where hands
    have reached over for the bucket — the wear
    asymmetric, one side more used than the other.
    A protective roof was added after the main
    precinct was built; its wood is maintained but
    not replaced, and the shingle has gaps.
idlemessages:
- The two scholars beneath the board reach a pause
  in their disagreement and then begin again from
  a slightly different position.
- A pilgrim crosses the courtyard at the diagonal,
  carrying something wrapped in cloth, not stopping.
- The bucket at the yard-well swings once in a
  gust and settles without completing the arc.
- From the archive's direction, a door closes with
  the deliberateness of someone who means it to
  stay closed.
- A novice crosses the yard with a stack of folded
  cloth, following a path worn into the paving by
  the same repeated crossing.
