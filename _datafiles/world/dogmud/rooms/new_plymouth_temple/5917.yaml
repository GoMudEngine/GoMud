nouns:
  reading-slope: A sloped reading surface fitted
    to each desk — a piece of polished hardwood
    hinged at the back, its angle fixed by a small
    peg through a series of notch-holes so it can
    be adjusted. The surface is worn smooth where
    volumes rest and where hands hold pages open.
    The wood is a warm mid-brown darkened further
    at the contact points. Small brass clips at the
    top of each slope hold open volumes without
    requiring a hand to keep the page — a detail
    that suggests whoever designed this room
    understood what extended reading actually
    requires.
  access-rules: A printed card on heavy stock
    mounted in a frame at the reading room's
    entrance — fourteen numbered rules for the
    use of the archive's general collection. The
    rules cover hours of access, handling of
    volumes, prohibition of copying without
    archivist approval, and the process for
    requesting items from the stacks. Rule
    fourteen — the longest — concerns the
    Restricted Collection and consists entirely
    of a description of the process by which
    access may be requested and the criteria
    by which such requests are assessed.
    The criteria are not enumerated. The rule
    ends with the sentence that the canon's
    determination in such matters is final.
idlemessages:
- A scholar at one of the reading desks turns
  a page without looking up, their attention
  entirely elsewhere from this room.
- The oil lamps along the reading desks burn
  steadily — the brass shields directing light
  precisely downward onto the slopes.
- From the northern passage, no sound. The door
  at its end is not a door that makes sounds.
- The smell of the reading room is specific —
  lamp-oil and the particular dust of volumes
  that have been opened many times by many hands.
- Someone has left a reading slope at its maximum
  angle, the brass clips empty. The desk is
  otherwise cleared, the lamp trimmed.
