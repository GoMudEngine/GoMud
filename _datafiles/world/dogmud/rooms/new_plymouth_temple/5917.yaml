title: The Archive — Reading Room
description: >
  The reading room is the archive's public face —
  a room of lamplit desks arranged in two parallel
  rows, each desk fitted with a brass-shielded oil
  lamp and a <ansi fg="itemname">reading-slope</ansi>
  of polished hardwood angled for someone who intends
  to work for several hours. The volumes on these
  desks are permitted volumes — the archive's general
  collection, accessible on request, their contents
  known and curated. The room smells of lamp-oil,
  beeswax, and a particular kind of learned dust
  that is not the same as ordinary dust. A printed
  <ansi fg="itemname">access-rules</ansi> placard
  stands at the room's entrance — fourteen rules,
  the fourteenth the longest, the second-to-last the
  most recently added, its ink slightly fresher than
  its neighbors. The stacks lie to the east; a
  northern passage leads to a door that does not
  open.
