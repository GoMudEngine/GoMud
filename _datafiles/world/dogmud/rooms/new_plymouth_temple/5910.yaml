nouns:
  healing altar: A low stone table against the
    chapel's east wall — pale limestone, its
    surface dressed smooth, its top covered in
    clean undyed cloth renewed on a regular
    rotation by the healers. Two oil lamps stand
    at the altar's corners; a shallow ceramic
    bowl holds water. The altar carries no
    divine image, no symbol beyond the temple's
    simple mark inlaid in the stone edge. It is
    a working surface as much as a sacred one —
    the cloth is practical, the lamps positioned
    for light. It has been used for tending the
    sick in this room long enough that the stone
    edge is worn where hands grip it.
  healer list: A running log on the chapel wall —
    columns of dates, brief descriptions of
    the care given, and initials rather than
    names. The initials belong to the healers,
    not the patients. The entries go back several
    years on this sheet; older sheets are kept
    elsewhere. The most recent entries are from
    this week. The descriptions are precise and
    practical — the language of people who care
    about outcomes rather than credit. No entry
    distinguishes the origin, standing, or means
    of the person tended.
idlemessages:
- The healing-altar lamps burn without moving,
  steady in the chapel's still air.
- The smell of the medicinal herb is present
  here even when the healers are not — soaked
  into the stone and cloth over many years.
- From the recovery ward to the west, the quiet
  sound of someone resting — breathing, no more.
- A person enters the chapel from the north door
  and sits on one of the south cots without
  speaking, hands in their lap.
- The healer-list on the wall holds hundreds of
  entries. Each one represents a decision to
  open the door.
