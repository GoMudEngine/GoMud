roomid: 5910
zone: New Plymouth Temple
title: The Healer's Chapel
description: >
  The chapel is openly so — in a way that other
  parts of the temple precinct are not. The door
  from the bell tower passage stands unlatched,
  the internal doors to the recovery ward and the
  canon's corridor are plainly visible, and the
  room offers its purpose without assessment.
  The <ansi fg="itemname">healing-altar</ansi>
  against the east wall is the chapel's own — a
  low table of pale stone with fresh cloth on it,
  oil lamps burning continuously, and a small
  bowl of water renewed each morning. The room
  smells of clean linen and a medicinal herb
  that the healers steep in the washing water —
  a smell distinct from the sanctuary's beeswax,
  belonging to this room only. Cots along the
  south wall are not for the sick but for those
  who need to sit before they can stand, or stand
  before they can walk. A
  <ansi fg="itemname">healer-list</ansi> on the
  wall beside the altar records who has been
  tended here and when, without assessment of
  their worth or standing. The offering of this
  place is given freely; there is no gate between
  need and tending.
