zone: New Plymouth Temple
title: The Sexton's Walk
description: >
  The walk is the maintenance lane along the
  temple's back wall — a plain service passage
  without ornament or pretension to it, its
  paving laid for durability rather than
  appearance. The sexton's domain runs here
  along the north side of the chapel and the
  almonry's back, and along it are the service
  fixtures of the building's daily operation —
  a <ansi fg="itemname">tool-rack</ansi> holding
  the sexton's equipment in documented order,
  a <ansi fg="itemname">water-barrel</ansi> under its iron spigot, a pitch-
  bucket and long brush for the stone-joints
  where water comes in at seasons. The walk
  smells of damp stone and pitch and working
  maintenance. It has no interest in being seen.
  The sexton moves through it before the first
  morning bell and after the last evening bell,
  and during those passes the temple's visible
  cleanliness is produced by work that no one
  attending services considers.
