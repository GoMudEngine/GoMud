title: The Grand Temple — Sanctuary
description: >
  The nave opens around you with a quality you do
  not immediately have a word for — wide enough that
  the columns at its edges are half-resolved in
  lamplight, high enough that the vault above
  dissolves into warm shadow, and the sound of the
  city stops at the west doors without apparent
  remainder. Every row of
  <ansi fg="itemname">nave-lamps</ansi>, hung on
  iron chains at twice head-height, burns with a
  steadiness untroubled by the slow drafts moving
  through the space; the light they produce seems to
  originate in the stone itself rather than in
  anything suspended from it. The floor carries its
  history in worn smooth paths — the lines of
  people who have arrived here and paused, uncertain
  where to put their feet next, while the rest of
  the room continued quietly around them. At the
  center of the nave the great
  <ansi fg="itemname">threshold-stone</ansi> sits
  flush with the paving — a wide circle of pale
  granite, polished to a faint luminance by the
  weight of accumulated arrivals, the place where
  in this faith's understanding the boundary between
  gone and present is at its thinnest. Along the
  lower courses of the north wall a row of
  <ansi fg="itemname">processional-reliefs</ansi> runs
  at waist height -- worn figures in slow procession,
  their hands held in postures too specific to be only
  devotion. The space
  does not ask anything of you; it receives. The
  altar passage opens to the east, the cloister
  walk to the north, and the bell tower to the
  south.
