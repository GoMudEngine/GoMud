nouns:
  nave lamps: Rows of iron-chained lamps filling
    the nave above head-height, each one a vessel
    of rendered tallow with a trimmed wick, replaced
    on a rotation by the temple's lamp-keepers
    without interrupting the burning. They are not
    identical — collected over centuries from
    donations and replacements — but at this height
    the variation disappears into the collective
    warmth they produce. The chains run in rows from
    east to west, and in certain light near the
    altar end they appear to converge. They have
    been burning in this space, in one form or
    another, without interruption for longer than
    the current building has stood.
  threshold stone: A circle of pale granite set
    flush into the nave floor at its center — perhaps
    ten feet across, its surface worn to a smoothness
    that catches light differently from the
    surrounding paving. There is no inscription.
    The faith holds that this is where the world
    is closest to whatever lies beyond it, and that
    those who have passed through that boundary in
    one direction may return through it in the
    other. The wear pattern on the stone is concentric
    — smoothest at the center, rougher toward the
    rim — as if the returning always begin at the
    same point, however they arrive.
  processional reliefs: A row of carved figures worked into the lower
    courses of the nave wall, much older than the smooth plaster above
    them -- a slow procession, each figure's hands held in a particular
    posture. The postures are not the gestures of any rite still
    practiced here. Read along the row, the hand positions have the
    deliberate look of a sequence someone meant to be counted, not
    merely admired.
idlemessages:
- The nave-lamps burn without visible flicker
  through a draft that should move them.
- Someone kneels at the threshold-stone for a long
  moment, then rises and continues toward the altar
  without looking back.
- A soft exchange of voices carries from the north
  cloister walk, too low to resolve into words.
- The west doors open briefly and the sounds of
  the plaza enter — then the doors close and the
  nave takes back its quiet.
- The smell of the sanctuary is beeswax and old
  stone and cool cloth — the accumulated smell of
  a place that has burned lamps in the same air
  for a very long time.
