roomid: 5921
zone: New Plymouth Temple
title: The Almonry
description: >
  The almonry is the temple's distribution point
  for its material obligation to the city's poor —
  a room of plain practical design whose purpose
  is evident from the long worn groove in the stone
  floor tracing the usual path of a queue that
  extends through the south door and back into the
  temple's south wing.
  A <ansi fg="itemname">distribution-counter</ansi>
  of heavy wood runs along the east wall, its
  surface scored by countless small exchanges —
  the setting down of bread, the counting of coin,
  the placement of wrapped packets. On the shelf
  behind the counter, loaves are arranged in rows,
  their number updated each morning by the temple
  bakehouse. The <ansi fg="itemname">almonry-ledger</ansi>
  at the counter's end records not names but numbers
  — how many received, at what date, in what
  quantity. The ledger does not record what was not
  given. The line that forms here each morning does
  not argue about that.
