title: The Warden's Cell
description: >
  The room is small and has been arranged once
  and not rearranged since. A
  <ansi fg="itemname">service-record</ansi> above
  the desk lists in columns the warden's formal
  duties and the dates of their last performance.
  The list is long. The current entry runs to
  nineteen years of unbroken service; the column
  edge has been extended twice to accommodate
  additional lines, the extensions ruled in a
  different ink from the original. The warden's
  desk is clean in the way of a person who
  resolves each day before sleeping — nothing
  pending, nothing left mid-task. A single
  <ansi fg="itemname">warden-chair</ansi> faces
  the desk across a bare working surface; an
  identical chair on the other side tells you
  something about how this room is used when
  others are in it. The room does not ask for
  notice. It has had nineteen years of quiet
  and takes the next moment the same way.
