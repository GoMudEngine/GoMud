zone: New Plymouth Temple
title: The Canon's Oratory
description: >
  The oratory is small enough that the word
  chapel does not fit — a prayer-room, a room
  whose purpose is the canon's own and not shared
  downward. It is reached by a steep stair through
  a trapdoor in the floor; the trapdoor is not
  locked. A
  <ansi fg="itemname">standing-cross</ansi> of
  dark wood against the east wall is the room's
  only furnished object; the rest is bare stone
  floor, low ceiling, and a single
  <ansi fg="itemname">oratory-window</ansi> of
  thick old glass that faces east toward morning
  light. The window's sill has been worn smooth
  by arms resting on it. Whatever the canon
  brings up here — the difficulty of a day's
  determinations, the weight of access granted
  and withheld — it does not come back down
  in visible form. The room smells of nothing
  but cold stone and the trace of someone else's
  long attention.
