title: The Archive Stacks
description: >
  The stacks room holds the public archive's
  permitted volumes on floor-to-ceiling shelves
  of age-darkened oak — several hundred items,
  organized by the archivist's system, which is
  not alphabetical and is not chronological but
  which the archivist insists is learnable. The
  smell here is thicker than the reading room —
  old paper, the particular dust of things stored
  for decades, and beeswax from the candles
  allowed in this room only in glass-enclosed
  holders. A <ansi fg="itemname">catalog-index</ansi>
  on a lectern near the entrance shows the holdings
  by subject heading. Several topics carry the
  notation — further volumes in restricted access —
  and the subjects are not uniform. Someone has
  penciled a small mark beside one of the headings;
  the mark has been erased but not completely.
  The <ansi fg="itemname">archive-shelves</ansi>
  themselves hold the weight of three centuries
  of permitted inquiry, which is not the same as
  three centuries of all inquiry.
