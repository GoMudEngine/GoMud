roomid: 4058
zone: North Road
title: Woodcutter's Track
description: >
  A narrow track breaks away from the main road heading east,
  cutting into the tree line. Fresh stumps crowd both sides —
  pale wood, not yet weathered, their cut faces still oozing
  sap that catches the light in amber beads. Deep drag marks
  score the track where logs have been hauled out, stripping
  bark and gouging the earth. The air here carries the sharp
  clean bite of split wood and pine resin. Further east, the
  forest closes in and the light goes green and close.
biome: forest
