nouns:
  stumps: Fresh-cut stumps line both sides of the track,
    their pale top faces bright against the dark soil.
    The cuts are clean — a sharp axe, well swung. Sawdust
    rings each stump in a fine yellow halo, and where the
    sap has run it has begun to crystallise into small
    amber drops along the cut edge. Insects have already
    found them.
  path: The track is narrow — wide enough for a man
    dragging a log, not wide enough for a cart. The earth
    is stripped bare and scored with long gouges where
    timber has been hauled through. Boot prints overlap in
    the soft ground, deep-heeled, heavy-footed. Whoever
    works here makes multiple trips each day.
idlemessages:
- The rhythmic thud of an axe carries from somewhere
  deeper in the trees, then stops.
- Resin-thick air settles around you, warm and sharp,
  like the inside of a pine box.
- A bird bursts from the top of a nearby stump and beats
  away through the branches, startled by nothing obvious.
