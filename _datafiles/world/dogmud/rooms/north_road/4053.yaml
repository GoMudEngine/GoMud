zone: North Road
title: Muddy Track
description: >
  Farmland gives way to rougher ground here. The road narrows,
  its edges no longer defined by field boundaries but by scrub
  and tussock grass pressing in from both sides. Cart ruts cut
  deep into the clay — recent rain has turned the track into a
  churned mess of mud and standing water. Somewhere ahead, just
  beyond hearing, is the faint sound of running water. The
  smell of it reaches before the sound does — cold, mineral,
  clean.
biome: farmland
