nouns:
  ruts: Wagon ruts pressed deep into red clay, some a full
    hand-width across. The spacing marks a heavy vehicle —
    a loaded cart, or a dray. A few of the ruts show the
    marks of iron-rimmed wheels slipping sideways where
    the mud gave way. Whoever drove through here last had
    a difficult crossing.
  stones: Rough fieldstones have pushed up through the mud
    along the road's edge — not placed deliberately, but
    heaved up by frost and the weight of repeated traffic.
    One large stone sits half-buried at an angle. Someone
    has scratched a small arrow into its face, pointing
    north.
idlemessages:
- A distant trickle of water carries on the wind from
  the north.
- Wind moves through the scrub grass with a dry hiss,
  bending the stalks flat.
- A crow lands in the mud ahead, eyes the road, and
  lifts off without finding anything worth staying for.
