roomid: 4046
zone: North Road
title: Kitchen
description: >
  The smell hits first — fat-smoke and old wood and the sharp
  green note of herbs hanging from the ceiling in dried bundles.
  A heavy work-table dominates the center, its surface scarred
  from years of chopping. Pots hang from iron hooks above a
  cooking hearth. A window on the south wall looks out onto the
  back yard — the sill is at chest height, a body-length drop
  to flagstones below. The sill has been scuffed recently, the
  grime disturbed by something gripping the edge.
biome: farmland
coord:
  x: -18
  y: -12
  z: -1
exits:
  north:
