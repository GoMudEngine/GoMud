nouns:
  signpost: A tall wooden post with three arms. North reads
    "Stillwater, 3 days." South reads "Amber Valley, 5 days."
    East reads "Ashwick, half day." The north-pointing arm has
    been repainted recently. Someone has scratched a crude skull
    into the wood beneath the Stillwater sign — a warning, or
    a joke.
  ruts: Deep wheel ruts scored into the packed earth, some fresh
    and sharp-edged, others softened by rain into shallow troughs.
    The heaviest traffic runs north-south. A few lighter tracks
    branch east toward Ashwick. Mixed in with the wheel marks are
    hoofprints — patrol horses, by the spacing.
  crate: |
    A heavy iron-banded oak shipping crate, its lid latched shut
    and its flanks burned with a caravan's seal. Foragers from the
    Fernway leave loads in it for the caravan to collect; the seal
    opens only to the caravan's hand.
idlemessages:
- A cold gust funnels down the highway, carrying the smell of
  distant rain.
- A crow settles on the signpost, regards you with one black eye,
  then launches itself north.
- Somewhere south, a wagon creaks along the road.
