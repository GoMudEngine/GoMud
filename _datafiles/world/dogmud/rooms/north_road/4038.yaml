roomid: 4038
zone: North Road
title: Road Fork
description: >
  The spur road from Ashwick meets the main highway here, the
  packed earth widening where two streams of traffic have worn
  the ground smooth. A weathered signpost stands at the fork,
  its arms pointing north and south along the highway, east
  back toward the hamlet. Wagon ruts cut deep grooves in the
  mud — heavier traffic than anything on the spur road. The
  air smells of turned earth and woodsmoke from a farmstead
  somewhere downwind. A heavy iron-banded <ansi
  fg="itemname">crate</ansi> sits in the lee of the crossroads
  marker, sealed with a caravan's burned-in mark.
biome: farmland
