roomid: 4057
zone: North Road
title: River Road, North
description: >
  Past the ford the road climbs a low rise and opens
  out. The river bends east, pulling away from the road,
  and the willows thin. The terrain here is more exposed:
  rolling scrubland broken by low rocky outcrops, the
  sky wide overhead. The road is heavier here — deeper
  ruts, a wider track, gravel that has been replenished
  recently. Traffic picks up north of the crossing. To
  the east, above the river valley, the faint rhythmic
  knock of axes carries on the wind.
biome: farmland
