    respawnrate: 4h
idlemessages:
- Wind moves across the open ground with a low steady
  push, bending the scrub flat.
- The rhythmic knock of axes carries from somewhere to
  the east, then fades.
- A cart passes in the distance to the north, its wheels
  rattling on the gravel before it disappears over the
  hill.
