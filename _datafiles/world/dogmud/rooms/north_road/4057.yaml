nouns:
  tracks: The ruts here are wider and deeper than those
    to the south — cut by heavier vehicles moving in
    both directions. Between the ruts, boot prints
    overlap in layers — broad working boots, narrower
    traveler's soles, a few with the rounded heel of
    riding boots. In the soft shoulder of the road,
    a set of prints where someone stepped aside to let
    a cart pass, then resumed walking north.
  view: From the top of the rise, the road opens north
    into rolling scrubland — rocky outcrops and bent
    thornbushes stretching toward low hills. To the
    south, the river valley is a dark line of willows.
    On the horizon to the north, barely visible, a grey
    smudge that might be smoke or distance haze or the
    rooflines of something larger.
spawninfo:
