nouns:
  hedgerow: A dense tangle of hawthorn and bramble, chest-high,
    running north-south between two fields. The berries are long
    gone but the thorns remain, sharp enough to discourage anyone
    from taking a shortcut through the fields. Small birds flit
    in and out of the branches.
  oak: A solitary oak standing in the harvested field, its trunk
    thick enough that two people could not join hands around it.
    Every leaf has fallen. A few withered apples lie in the grass
    at its base, brown and soft, filling the air with a cidery
    sweetness that the wind carries across the road.
idlemessages:
- Wind bends the stubble in the nearest field, rippling across
  it like water.
- A hawk circles high overhead, riding a thermal.
- The hedgerow rustles as something small moves through it.
