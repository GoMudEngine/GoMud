zone: North Road
title: Open Farmland
description: >
  Flat country stretches to the horizon in every direction,
  broken only by low hedgerows dividing fields of harvested
  stubble. The road runs straight and exposed through the
  center of it all. The wind carries the smell of turned earth
  and something faintly sweet — late apples rotting under a
  tree somewhere out of sight. A lone oak stands in the nearest
  field, its branches stripped bare by autumn, casting long
  skeletal shadows across the stubble.
biome: farmland
