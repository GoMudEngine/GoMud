nouns:
  prints: Boot prints and hoofprints pressed into the mud,
    overlapping in layers. Most are the broad, flat marks of
    working boots — farmers and traders. A few are narrower,
    heavier, with the precise spacing of riders who know
    exactly where they are going. These are newer than the
    rest.
  scrub: A thick stand of scrub oak and bramble crowding the
    western edge of the road. Dense enough to block the view
    beyond. A narrow gap in the undergrowth might be a path,
    or might be where a deer pushed through.
idlemessages:
- The figure near the scrub trees shifts position, glancing
  down the road.
- A magpie chatters from the scrub, then falls silent.
- Wind moves through the scrub trees with a dry rattle.
