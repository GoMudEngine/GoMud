roomid: 4043
zone: North Road
title: North Road
description: >
  The road north of the village is wider here, the packed earth
  showing the weight of regular wagon traffic. Boot prints and
  hoofprints overlap in the mud — travelers, farmers, and
  something heavier. Patrol horses, by the even spacing. A
  stand of scrub trees crowds the western side of the road,
  thick enough to hide in. A figure loiters near the treeline,
  watching the road with the studied casualness of someone
  pretending not to watch.
biome: farmland
