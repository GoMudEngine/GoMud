roomid: 4054
zone: North Road
title: Stone Bridge
description: >
  A low stone bridge carries the road over a fast-running
  creek. The stonework is old — fitted without mortar, each
  block worn smooth by weather and the endless passage of
  wheels. Grooves have been cut into the surface by iron
  rims over decades: two parallel channels, worn an inch
  deep into the stone. The creek runs loud beneath, brown
  with sediment from upstream rain. Cold spray drifts up
  from below when the current kicks against the pilings.
biome: farmland
