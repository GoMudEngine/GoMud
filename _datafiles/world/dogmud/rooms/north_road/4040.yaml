title: Hedgerow Bend
description: >
  The road curves north here around a dense hedgerow that has
  grown wild enough to block the view ahead. Farm gates line
  the eastern side, their posts leaning at comfortable angles.
  At the bend stands a boundary marker — a squat stone pillar,
  waist-height, carved with the Chrysalis spiral. The spiral's
  center has been worn smooth by years of hands laid on it in
  passing. The stone is warm to the touch even in the autumn
  chill.
biome: farmland
