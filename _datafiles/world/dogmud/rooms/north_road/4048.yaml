roomid: 4048
zone: North Road
title: Betta's Path
description: >
  A dirt track leads west from the road through a field of
  harvested turnip rows, the soil dark and freshly turned. A
  quarter-mile ahead, a low farmstead hunches against the wind,
  its stone walls the same grey as the sky. Sheep dot the near
  field, their wool thick for winter, heads down in the grass.
  The smell of lanolin and woodsmoke carries on the breeze.
  The track is narrow but well-worn — someone walks this path
  every day.
biome: farmland
coord:
