roomid: 4044
zone: North Road
title: Drainage Ditch
description: >
  An embankment runs alongside the road here, heavy with the
  dead scrub of late autumn. A drainage ditch cuts between
  the road and the fields to the east, its banks muddy and
  steep. In the scrub along the embankment, a narrow gap where
  the branches have been recently disturbed — someone crouched
  here, parting the dead growth to watch the road. A dirt path
  leads west toward a farmstead visible in the distance. The
  road continues north where the ground roughens and the
  sound of running water begins to build.
biome: farmland
