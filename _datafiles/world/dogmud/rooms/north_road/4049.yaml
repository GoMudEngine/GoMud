roomid: 4049
zone: North Road
title: Betta's Yard
description: >
  The farmhouse is stone-walled and low, built to endure weather
  rather than impress anyone. A front door of heavy oak faces
  the yard, and a side path leads around to a back door that
  is not visible from the approach. Chickens scratch in the
  packed dirt. A wooden bench sits by the front door, a
  half-finished whittling project resting on its seat — a
  small bird with its wings tucked. Smoke curls from the
  chimney in a thin, steady line. Everything here is
  maintained, nothing is new.
biome: farmland
