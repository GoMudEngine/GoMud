nouns:
  whittling: A half-finished carving resting on the bench — a
    small wooden bird, wings folded against its body, head
    tilted slightly as if listening to something only it can
    hear. The knife work is careful but unpolished, the marks
    of someone still learning the craft. Wood shavings litter
    the bench around it.
  door: A heavy oak door, its surface dark with weather and age.
    The iron handle is worn smooth. The threshold has been swept
    recently — a broom leans against the wall beside the door.
    The door is closed but not locked.
  chickens: Brown hens picking through the dirt, scratching for
    grubs with the focused intensity of creatures that have
    found their calling. A rooster perches on the low wall,
    looking offended by everything.
idlemessages:
- A chicken flutters up to the bench and is shooed away by
  an invisible hand from the doorway.
- The whittling knife catches a glint of light on the bench.
- Smoke from the chimney shifts direction as the wind changes.
