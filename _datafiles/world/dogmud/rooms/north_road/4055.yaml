nouns:
  willows: Old willow trees crowd the riverbank, their
    trunks twisted and knotted with age. The long trailing
    branches reach the water and drag in the current,
    waving slowly. The roots are exposed where the bank
    has eroded, forming a lattice above the waterline
    that birds use for nesting. The shade under the
    willows is dense enough that the ground beneath is
    bare and damp.
  river: Wide and brown, moving steadily north with the
    unhurried weight of deep water. The surface is smooth
    except where submerged rocks ripple it from below.
    The far bank is twenty yards away, lost in the shadow
    of more willows. A log drifts past, slow and deliberate,
    turning in the current.
