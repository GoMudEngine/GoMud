roomid: 4055
zone: North Road
title: River Road, South
description: >
  Past the bridge the road bends to follow a river, and
  the whole character of the terrain changes. Willow trees
  line the bank to the west, their long branches trailing
  in the current. The air is cooler here, carrying the
  smell of wet earth and slow water. The road itself is
  better maintained than the muddy stretch to the south —
  the river traffic brings enough coin to keep the gravel
  topped up. It is quieter too. The farmland noise drops
  away and there is only the water and the birds.
biome: farmland
