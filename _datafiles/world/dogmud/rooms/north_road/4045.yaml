roomid: 4045
zone: North Road
title: Common Room
description: >
  Low-ceilinged and warm, the air thick with woodsmoke and the
  yeasty smell of old ale soaked into the floorboards. A stone
  hearth dominates the far wall, its fire crackling behind an
  iron grate. Rough tables fill the room, most empty this time
  of day, their surfaces scarred by knife points and cup rings.
  A bar runs along the back wall where a heavyset man keeps
  his bottles in careful rows. The ceiling beams are dark with
  years of smoke. It is the kind of room that has absorbed a
  great many conversations and remembers none of them.
biome: farmland
