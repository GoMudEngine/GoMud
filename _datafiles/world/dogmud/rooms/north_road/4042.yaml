roomid: 4042
zone: North Road
title: Crossroads Village Square
description: >
  A handful of buildings huddle around a muddy square, the kind
  of place that exists because two roads cross and people need
  to eat. Smoke rises from the chimney of a stone-and-timber
  tavern on the western side. A well stands in the center, its
  bucket rope frayed to threads. The buildings are practical —
  stone foundations, timber upper floors, thatched roofs patched
  with varying degrees of care. A few chickens scratch in the
  mud. The village has no name posted anywhere, as if naming it
  would imply ambitions it does not have.
biome: farmland
