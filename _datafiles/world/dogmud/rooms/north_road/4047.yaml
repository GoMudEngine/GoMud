roomid: 4047
zone: North Road
title: Back Yard
description: >
  A small flagstone yard behind the tavern, hemmed in by a low
  wall on three sides. A few barrels lean against the wall,
  their staves dark with rain and age. The flagstones are uneven,
  one cracked where something heavy landed. Below the kitchen
  window, a faint scuff mark on the stone — someone landed here
  recently and stumbled left, catching themselves on the wall.
  The yard smells of old ale and wet stone. A gate in the south
  wall leads back to the road.
biome: farmland
coord:
