idlemessages:
- Water rushes cold and steady across the ford stones,
  a wide shallow sound.
- A stone shifts underfoot with a deep grinding scrape
  against the riverbed.
- Fine sand swirls up from the river bottom and drifts
  downstream in a slow cloud.
