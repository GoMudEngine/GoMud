nouns:
  ford: Flat stones laid across the riverbed, worn smooth
    on their upper faces. The spacing is deliberate —
    close enough to step between comfortably, though a
    few gaps have opened as stones shifted. Sediment has
    built up against the upstream face of each slab,
    forming small ridges. Two of the larger stones bear
    chisel marks on their edges, suggesting they were
    shaped rather than simply selected.
  water: Clear where the river runs shallow over the ford
    stones, the water shows its sandy bed in detail. Cold
    enough to be painful after a few seconds, with the
    hard mineral bite of snowmelt from somewhere higher
    up. Underwater, sand swirls between the stones in
    small eddies where each footstep disturbs the bed.
