roomid: 4056
zone: North Road
title: River Ford
description: >
  The road descends to the river and meets it directly.
  Flat stones have been laid in the riverbed to form a
  crossing: irregular slabs, some tilted, placed close
  enough together that a careful walker can cross dry.
  The water runs ankle-deep over the ford, cold enough
  to ache. It pulls at the stones with each step, and
  one or two shift underfoot with a grinding scrape.
  The smell here is all cold water and wet stone.
  Nothing decorative about this crossing — it is purely
  functional, and has been since someone first decided
  the creek needed a road over it.
