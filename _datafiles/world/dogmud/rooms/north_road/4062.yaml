roomid: 4062
zone: North Road
title: North Road End
description: >
  The road widens here, the gravel better laid and more
  recently topped than the stretch behind you. Wagon ruts
  run deep and close together — heavy, regular traffic in
  both directions. Fresh hoofprints overlap in the soft
  shoulder and standing water fills the deepest wheel
  grooves. On the horizon ahead, thin columns of grey smoke
  climb from too many sources to be a single homestead.
  The smell carries on the north wind — woodsmoke and fish,
  tallow and wet rope. Stillwater. The road continues, but
  this is as far as the wilds reach.
