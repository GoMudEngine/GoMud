nouns:
  smoke: Thin columns rise from the direction of Stillwater,
    bending north in the wind before dispersing. There are
    too many of them — a dozen at least, distinct sources
    spaced across the horizon. Cookfires, forge smoke, the
    heavier dark plume of a tallow works or a pottery kiln.
    A settlement large enough to generate that many fires
    does not appear from nothing. Stillwater has been here
    a long time.
  road: The road surface improves markedly here — fresh
    gravel laid in the wheel lines, the verge trimmed
    back. Deep ruts from heavy wagons run in both
    directions, some filled with standing water from
    recent rain. A set of large hoofprints in the soft
    shoulder suggests a draft horse passed this way this
    morning. The road ahead is maintained by someone with
    an interest in keeping it passable.
idlemessages:
- The wind from the north carries the smell of fish and
  woodsmoke — the unmistakable signature of a working town.
- Distant hammering drifts on the wind — steady, rhythmic,
  the sound of a smithy at full work.
- A wagon is visible on the road ahead, moving south toward
  you, growing slowly larger on the flat horizon.
