nouns:
  outcrop: A weathered mass of grey stone jutting from the
    hillside where the road bends around it. The rock is
    fractured in horizontal layers, each face dusted with
    pale lichen in shades of grey and orange. At the base,
    where soil has built up against the stone, ferns grow
    in a dark fringe. The outcrop is large enough that the
    road was routed around it rather than through it — no
    one bothered to quarry what could be avoided.
  milestone: A stone pillar, roughly knee height, set at
    the road's edge where the bend peaks. The carved text
    on its face has been worn by rain and rubbing hands —
    STILLWATER — II LEAGUES. Below the distance marking,
    someone has scratched a second line in a different
    hand — SAFE ROAD. Whether that is a reassurance or a
    warning is not clear.
spawninfo:
