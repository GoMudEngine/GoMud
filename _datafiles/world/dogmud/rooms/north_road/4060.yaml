    respawnrate: 4h
idlemessages:
- Wind rolls across the open hillside from the north,
  carrying the smell of cold grass and turned earth.
- Grass along the road's edge bends in a long ripple
  as a gust moves through, then snaps upright.
- A hawk wheels in a slow circle above the hill to the
  north, tilting on one wing, watching the ground below.
