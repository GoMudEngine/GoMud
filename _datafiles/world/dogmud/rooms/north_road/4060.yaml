roomid: 4060
zone: North Road
title: Wide Bend
description: >
  The road curves west around a grey rock outcrop that juts
  from the hillside like a blunt shoulder. Beyond the bend
  the terrain opens — low hills roll north in long grass,
  the sky wide and pale above them. The river valley falls
  behind, replaced by open country that smells of dry grass
  and cold wind. A worn stone milestone stands at the curve's
  apex, its carved face smoothed by weather but still legible.
  A hawk turns in a slow circle above the nearest hill, riding
  the updraft without effort.
biome: farmland
