roomid: 4061
zone: North Road
title: Travelers' Rest
description: >
  A flat stretch where the verge widens and the grass has
  been worn flat by repeated use. Three blackened fire rings
  are spaced along the shoulder — old campfire circles, well
  used, their stones dark with smoke. A hitching post stands
  at the road's edge: a rough-cut log set upright in the
  ground, iron rings driven into its side, the bark worn
  smooth by years of rope. The smell of old ash lingers.
  A lone figure sits near the nearest fire ring, watching
  the road north with the patient stillness of someone
  accustomed to waiting.
biome: farmland
