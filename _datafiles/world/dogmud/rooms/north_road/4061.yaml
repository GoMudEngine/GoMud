nouns:
  firepits: Three rings of fieldstone, each holding a
    bed of cold grey ash. The rings are well-made —
    stones chosen for flatness, set level, the ground
    inside cleared of grass. Each one has a flat stone
    at the edge that serves as a seat or a cooking
    surface, worn dark and smooth. The ash in the
    nearest ring is fresh enough to still be powdery.
    Someone stopped here last night.
  hitching-post: A peeled log, chest-high, set deep in
    the ground and braced with two angled stakes. Three
    iron rings are driven into its upper half at different
    heights, sized for different rope gauges. The bark
    where hands and rope have worked it is worn to pale
    bare wood, polished smooth. A short length of frayed
    rope dangles from the lowest ring, left behind by
    whoever was here last.
