idlemessages:
- Somewhere nearby, a horse shifts its weight and blows
  a long breath — you can hear it but not see it.
- A cinder pops in the cold ash of one of the fire rings,
  settling deeper into the grey powder.
- Wind moves through the long grass beyond the road with
  a low rushing sound, bending the stalks in slow waves.
