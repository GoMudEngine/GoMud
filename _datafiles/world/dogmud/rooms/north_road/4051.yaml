roomid: 4051
zone: North Road
title: Camp Approach
description: >
  A narrow track through dense scrub, barely visible from the
  road. The undergrowth has been cut back just enough for a
  person to pass single-file, the stumps freshly hacked. Boot
  prints press deep into the mud — multiple sets, heavy, coming
  and going with regularity. The scrub thickens overhead,
  blocking the sky and muffling sound. The smell of a cold
  campfire drifts from somewhere ahead. This is not a deer
  trail.
biome: farmland
coord:
