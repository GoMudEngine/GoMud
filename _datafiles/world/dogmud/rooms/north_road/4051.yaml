  west:
    roomid: 4052
nouns:
  prints: Boot prints pressed deep into soft earth — heavy,
    deliberate, the kind made by people carrying weight. Multiple
    sets overlap, all roughly the same size. These are not
    farmers. The freshest prints are only hours old, heading
    west toward the smell of smoke.
  stumps: Scrub branches hacked off at waist height, the cuts
    fresh enough to show pale wood. Someone has been maintaining
    this path — widening it, keeping it clear. The cut branches
    have been dragged aside and piled, not left where they fell.
    Organized.
idlemessages:
- A branch snaps somewhere deeper in the scrub.
- The smell of old smoke intensifies briefly as the wind shifts.
- Something moves in the undergrowth — too heavy for a rabbit.
