roomid: 6270
zone: East Road to Greenford
title: The Open Plateau
description: >
  The hamlet falls away and the plateau opens all at once —
  the wheat still running on either side but the field-walls
  gone, no buildings, no shade of any kind. The heat is
  different out here: heavier, more direct, with nothing to
  interrupt it. A dry wind moves across the crop in long
  travelling ripples, the wheat bending and recovering in slow
  sequence. The sky above is enormous and very blue. At the
  road's edge, a jackrabbit sits motionless in the verge,
  watching the road.
biome: land
coord: {x: 17, y: -67, z: 0}
