spawninfo:
  - mobid: 9499
    respawnrate: "20 real minutes"
nouns:
  the plateau: >
    Open land running to every horizon with no interruption
    but the crop and the sky above it. The flatness is
    almost disorienting after the confined road through the
    hamlet. No trees, no rises, no shade for a long way.
    The road is the only fixed thing in the middle of all
    that level wheat.
  the crop: >
    Wheat running on both sides of the road without the
    field-walls that defined it closer to the hamlet —
    open crop to the horizon in every direction, the heads
    heavy and gold, the stalks dry. On the plateau the
    wind that crosses it is unimpeded and the whole field
    moves at once.
idlemessages:
- The dry wind crosses the wheat with a papery, rustling sound.
- No shade anywhere. The heat presses down on the open road.
- A jackrabbit bolts from the verge and vanishes into the crop.
