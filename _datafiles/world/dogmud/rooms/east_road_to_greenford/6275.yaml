zone: East Road to Greenford
title: The Riverside Road
description: >
  The road follows the river here with only a low earth berm
  between the track and the water. The river is wide and
  steady at this stretch, a continuous low sound under the
  banks where the current quickens at the stones. Willows
  on the far bank trail their branches in the current in slow
  arcs. To the south the road continues along the river
  toward the bridge approach, following the river's curve.
  The silhouette of Greenford on its hill is visible from
  here, the university tower prominent above the roofline.
biome: farmland
