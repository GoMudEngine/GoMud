roomid: 6274
zone: East Road to Greenford
title: The River Valley
description: >
  The descent steepens and the smell changes all at once —
  wet ground, water-weed, the cool moving air that rises off
  a river in full run. After the open plateau the change is
  immediate and physical: the dust is gone, the air softer,
  the road surface darkening with moisture drawn up from the
  bank below. Willows line the lower verge and their shade
  falls across the road. In the hillside cut above the road
  a stone
  <ansi fg="itemname">niche</ansi>
  has been worked into the rock face — old road-craft,
  a waymark for travelers.
biome: farmland
