title: The Greenford Bridge
description: >
  The bridge spans the Greenford river in three long arches
  of dressed stone, the water running fast and cold through
  the pier-shadows below. Halfway across, the paving is
  notched where a cart-wheel has struck it at the same spot
  a thousand times — the mark of a working crossing. At the
  far end, the toll-gate stands open, its timber bar raised
  and hooked back clear of the road. The warden's booth is
  occupied — smoke from the brazier, the window unshuttered.
  Past the gate, the first streets of Greenford's riverfront
  open up: low buildings against the bank, the smell of
  fish and rope, and behind it all the long slope of the
  hill rising to the university tower at the crown.
