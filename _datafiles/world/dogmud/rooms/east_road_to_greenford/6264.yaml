nouns:
  the crop: >
    Wheat at full ripeness, the heads bent slightly forward
    under their own weight. The color is deep gold with green
    still in the lower stalk. Where the rows are thickest the
    wind cannot reach them and they stand perfectly still in
    their own heat. When the harvest comes this will all be
    gone in a week.
  the hawk: >
    A broad-winged shape working a thermal above the field,
    too high to make out clearly. It moves in slow banking
    circles without urgency, the loops wide and even. Whatever
    it watches below, it has time. It is not watching you.
idlemessages:
- The wheat moves in a long rolling wave when the wind takes it.
- The hawk's shadow crosses the road and slides into the crop.
- Heat shimmers off the road between the standing rows.
