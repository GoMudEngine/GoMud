roomid: 6264
zone: East Road to Greenford
title: The Wheat Country
description: >
  Wheat stands on both sides of the road, the crop at full
  height, the heads heavy and gold in the dry season. It has
  the density of a field tended for many years on the same
  land — the rows close, the stalks even. The road runs
  straight between them into the heat. High above, a hawk
  makes slow circles over the field, its shadow crossing the
  road at long intervals. The air smells of warm grain and
  dry dust even though nothing here has been cut. The crop
  waits. A figure moves in the wheat rows along the road.
biome: farmland
