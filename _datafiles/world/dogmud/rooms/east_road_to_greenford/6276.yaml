zone: East Road to Greenford
title: The Bridge Approach
description: >
  The road widens here into a small staging area at the
  riverbank — a flattened space where carts and travelers
  arrange themselves before the crossing. The bridge is
  ahead, its stone spans visible crossing the Greenford
  river, the piers squared and broad, the roadway worn
  smooth. A toll-booth stands on the far bank, its
  pipe-brazier smoking — the warden is at the post.
  The staging area's earth is cut with deep cart tracks
  from the traffic of many seasons.
biome: farmland
