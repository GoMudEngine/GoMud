roomid: 6267
zone: East Road to Greenford
title: The Village Approach
description: >
  The sound arrives before you do: voices, the complaint of
  a cart-wheel in need of grease, the busy clucking of a yard
  bird somewhere among the buildings. The road bends here and
  the first rooftops of a small hamlet come into view above the
  wheat line — thatched, close together, a smear of hearth smoke
  rising from one chimney. The dust on the road thickens where
  foot traffic has been working the approach. Ahead, the hamlet
  offers its shade between the close-set houses.
biome: farmland
