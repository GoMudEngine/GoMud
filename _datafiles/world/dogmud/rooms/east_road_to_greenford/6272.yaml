roomid: 6272
zone: East Road to Greenford
title: The Falling Ground
description: >
  The plateau tips here — not sharply, but you feel it in
  your legs after a mile of flat: the road is descending
  into lower country. The wheat continues on both sides but
  the crop here is different, the stalks shorter, the heads
  thinner, the color less committed. The soil is changing.
  Ahead, the horizon drops and the sky beyond it brightens
  with the quality that means water somewhere below. The dry
  wind that has followed you from the hamlet begins to ease.
biome: land
coord: {x: 19, y: -67, z: 0}
exits:
  west: {roomid: 6271}
  east: {roomid: 6273}
nouns:
  the descending road: >
    The road tilts east in a long even grade, the survey
    work careful — no sudden drop, just a steady declension
    that carries you down without effort. The road-builder
    knew what they were doing. Someone planned this descent
    from the top and laid it out so you would not notice it
    until you were already a third of the way down.
  the horizon: >
    A few degrees lower than the sky behind you, and the
    light coming off it is different — brighter, with more
    blue in it, the particular cast that means a river
    running on land that has not dried out. Somewhere below
    and ahead, water is doing its work on the landscape and
    the landscape is doing its work on the air above it.
idlemessages:
- The road tilts forward slightly. Your stride adjusts without thought.
- The wheat on the descending slope is shorter and less gold.
- Something in the air is shifting — less dust, more sky.
