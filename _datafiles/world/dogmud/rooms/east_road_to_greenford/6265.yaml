roomid: 6265
zone: East Road to Greenford
title: The Drovers' Stretch
description: >
  The road here has been worked over by hooves and cart-wheels
  until the gravel is ground away and only baked earth remains,
  the ruts cut deep and iron-hard in the dry season. The smell
  is animal — dung and road-dust and the oily residue of
  cart-grease on the tethering post at the roadside. The post
  carries a rope-ring worn smooth from use. Propped beside it
  in the shade, a
  <ansi fg="itemname">canvas sack</ansi>
  leans against the post, tied at the neck, left by someone
  who may not be coming back for it.
