title: The Sentry Walk
description: >
  The stretch between the Processional and the Palace
  gatehouse is known informally as the Sentry Walk —
  a name not carved anywhere but understood by anyone
  who has come this far. There is always someone in
  sight here. Not always the same someone, not always
  posted at the same point, but the geometry of the
  approach ensures that no position along this stretch
  goes unobserved for any meaningful interval. The
  <ansi fg="itemname">worn-posts</ansi> set into the
  paving at intervals are the quarter's original
  patrol anchor points — predating the current
  bloodline's tenancy of the Palace, worn smooth at
  shoulder height by generations of guards who rested
  arms against them during long watches. The gatehouse
  is visible ahead to the north, its stonework heavier
  than anything on the Processional. The approach to
  it is designed so that your silhouette is readable
  long before you reach it.
