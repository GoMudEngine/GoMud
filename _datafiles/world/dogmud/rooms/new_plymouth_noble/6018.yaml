nouns:
  worn-posts: Short square-section posts of grey
    basalt, set flush with the paving at measured
    intervals along the Walk's centerline. Each one
    is worn smooth at the top and on its south-facing
    face — the resting-point for a guard's forearm
    during a long watch. The wear is old, predating
    the current bloodline by at least two prior
    regimes. No one has replaced them. The posts
    serve no structural function now; their function
    is presence, and presence is what they have.
idlemessages:
- A watcher rounds from the garden side, walks
  the Sentry Walk at an even pace, and turns
  back toward the gatehouse without pausing
  or altering direction.
- The Sentry Walk is never quite empty. Even
  in the interval between watches, someone is
  passing through it in one direction or another.
- Your footsteps on this stretch carry ahead
  of you. The stone here is very flat and very
  hard.
- One of the worn patrol posts catches the
  low afternoon light along its rounded
  upper edge.
- From the Sentry Walk, the Palace gatehouse
  is visible in its full width — stone, iron,
  and the studied stillness of those who
  stand before it.
