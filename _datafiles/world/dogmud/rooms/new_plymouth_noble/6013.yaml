nouns:
  narrow-bed: An iron-framed bed just wide enough
    to sleep in without being wide enough to be
    comfortable about it, its mattress the household-
    issue straw tick topped with a blanket in the
    estate's grey wool. The bed is made with an
    exactness that exceeds any visible requirement —
    corners turned, pillow set, everything straight.
    The blanket's weave shows a pattern at the border
    that is not the standard estate pattern — a small
    variation, almost too subtle to notice, repeated
    at intervals. The blanket was made for someone,
    or by someone, before it was this bed's blanket.
  letter-case: The folded cloth on the high shelf
    serves as a holder for what it holds — folded
    papers whose edges are soft from being opened
    and refolded many times, and a dried flower head
    pressed flat between them. The cloth is a quality
    slightly better than the rest of the room's
    contents — a gift, or a salvage from something
    that wore out in another way. What the letters
    say is private. That they exist, and that she
    keeps them above eye-line from the door, is its
    own kind of information.
idlemessages:
- The window onto the service court admits
  the morning's sounds — carts, the specific
  voice of delivery, the rhythm of the
  Quarter's hidden work beginning.
- The room is exactly as it was left.
  It will be this way when she returns.
- The candle-stub on the high shelf has
  been replaced recently — the wax still
  pale, the wick barely used.
- The garret is quiet in the specific
  way of rooms that are only occupied
  at the margins of the day — very early,
  or very late, with the hours between
  belonging to somewhere else.
- The name scratched into the window
  sill is there if you know to check
  the inner edge — careful work,
  made in a moment of decision.
