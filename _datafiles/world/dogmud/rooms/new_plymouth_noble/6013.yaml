roomid: 6013
zone: New Plymouth Noble
title: Wenna's Garret
description: >
  The garret room under the eave is Wenna's — her
  name scratched into the wooden sill of the single
  window, at the inside edge where no visitor would
  think to look. The room is the size that a servant's
  room is in the Noble Quarter — enough for a
  <ansi fg="itemname">narrow-bed</ansi>, a clothes
  chest at its foot, a small shelf at head height
  with a cup and a candle-stub and a folded piece
  of cloth that serves as a
  <ansi fg="itemname">letter-case</ansi>. The window
  faces the service court below, which means the
  light is adequate in the mornings and the sounds
  of delivery and early loading arrive before the
  Quarter's official day begins. The room is very
  clean. The cleanliness has the quality of someone
  who has decided that this, at least, is under her
  control, in a situation where other things are not.
  The chest at the bed's foot is locked with a small
  padlock — the personal lock of someone who has
  decided that some things are hers.
