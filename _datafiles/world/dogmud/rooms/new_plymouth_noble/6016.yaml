title: The Palace Gatehouse
description: >
  The gatehouse closes the north end of the Sentry
  Walk with an architecture of deliberate finality —
  its stone twice the depth of anything on the
  Processional, its facing blocks dressed to a finish
  that absorbs light rather than reflecting it. The
  <ansi fg="itemname">palace-gate</ansi> is set between
  two towers whose height makes the gate itself seem
  almost modest; it is not modest. The iron is black
  and old, its verticals as thick as a man's wrist,
  and the chain across the center bar is not
  ceremonial. A guard-captain stands before the gate
  in full ceremonial dress — not making conversation,
  not accepting approach, present in the way an
  architectural feature is present, except that this
  one breathes. The gate does not open for inspection,
  for request, or for the merely curious. What lies
  beyond it — the Palace's inner court, the bloodline's
  residential half of the Quarter — is conducted on
  their terms and at their invitation, and that
  invitation has not been extended. The garden lies
  west; the barracks lie east. The gate stands north,
  and it is closed.
