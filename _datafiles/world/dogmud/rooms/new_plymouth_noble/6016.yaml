nouns:
  palace-gate: Black iron between two towers of
    dressed basalt, its vertical bars spaced to
    allow inspection from both sides — the gap
    deliberate, a statement that what is inside
    is not hidden, merely inaccessible. Through
    the bars the Palace's inner court is partially
    visible — a forecourt of the same pale stone
    as the Processional, wider than expected, its
    far end closed by doors whose scale is intended
    to make those approaching them aware of their
    own scale by comparison. The chain across the
    center bar is a newer addition to an older gate,
    its links bright against the old iron, the
    padlock the quality that does not suggest
    negotiation. The gate does not open from
    this side.
idlemessages:
- The guard-captain before the gate does not
  move, does not speak, and does not alter
  the direction of their attention.
- Through the palace-gate, the inner court
  is visible in the late light — the pale
  stone, the far doors, the distance between
  where you stand and where they are.
- The gatehouse towers alter the sound of
  the Sentry Walk behind you. The acoustics
  change at the point where the approach
  narrows between the two towers.
- The chain on the gate is the only thing
  here that looks new. Everything else has
  the quality of permanence that was
  intended from the first stone.
- The guard-captain's uniform carries no
  insignia beyond the bloodline cipher
  at the breast and shoulder — embroidered
  here in silver thread rather than painted.
