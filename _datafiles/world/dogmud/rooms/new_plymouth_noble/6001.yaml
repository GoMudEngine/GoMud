zone: New Plymouth Noble
title: The Watched Plaza
description: >
  The plaza opens at the Noble Quarter's heart, wide
  and clean in the way that money keeps things clean —
  dressed stone washed each morning, gutters empty, no
  stall or cart permitted inside the square's perimeter.
  The <ansi fg="itemname">central-basin</ansi>, a shallow
  oval of pale granite at the plaza's center, holds still
  water in which the upper stories of the surrounding
  buildings are reversed and clarified; they look more
  orderly in reflection than they do in fact. A pair of
  the Quarter's
  <ansi fg="itemname">liveried-watchers</ansi> stand at
  the northern side — blue-and-grey tabards, arms at
  rest, nothing visible but the fact of their attention
  — and they have already made note of your arrival.
  The upper windows of the buildings ringing the square
  are shuttered, but not all of those shutters are
  entirely closed, and some of the gaps are the right
  width for a person to stand in without being visible
  from below.
