title: The Processional — Noble Approach
description: >
  The Processional climbs its last block before the
  Noble Quarter's outer precinct, and the change
  announces itself without drama — dressed limestone
  underfoot where there was rougher work before,
  buildings whose shutters are hung square and painted
  in matching grey, a quiet that has displaced the
  market noise behind you without your quite noticing
  it happen. A pair of
  <ansi fg="itemname">precinct-posts</ansi> stand to
  either side of the passage, low iron standards capped
  in pale brass, marking the threshold without blocking
  it — no gate, but a clear line. Above the nearest
  doorway the <ansi fg="itemname">ward-cipher</ansi>,
  the Noble Quarter's administrative seal, has been cut
  into the stone in a careful hand; arriving here for
  the first time, you would register that you are in a
  different kind of place even before you had a name
  for the difference.
