nouns:
  stair marks: The accumulated evidence on the
    walls of long service — a dark band at hand
    height running the full length of the stair
    on the left side, the right side cleaner but
    with shoulder-marks near the landings where
    loads are shifted. At the mid-landing, a
    painted number — 3 — in white over an earlier
    number that has bled through the new paint,
    and beneath that a faint impression of
    something written in a different hand that
    has been painted over twice and is still not
    entirely gone. What it said is not fully
    recoverable. The shape of the last word
    suggests a name.
idlemessages:
- Quick footsteps on the stair from below —
  someone ascending from the service court,
  their tread practiced and fast.
- The stair is empty between passages, its
  worn treads and shoulder-marks waiting for
  the next transit.
- From the stair, the sounds of the service
  court below and the garret above are equally
  faint and equally purposeful.
- Someone left a small cloth bundle on the
  mid-landing and returned for it. It is gone.
- The painted number at the landing has
  been there long enough that the earlier
  number beneath it is becoming visible
  again as the newer paint wears.
