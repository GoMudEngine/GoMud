title: The Servants' Stair
description: >
  The servants' stair is the Noble Quarter's real
  circulation — the passage through which the work
  of the quarter moves while the quarter itself
  presents an uninterrupted face of order and ease.
  The stair runs between the service court below
  and the garret level above, its treads worn to a
  distinct shallow groove at the center — the groove
  of a foot placed in exactly the same position for
  many years, moving fast, carrying something. The
  walls are unplastered stone. The
  <ansi fg="itemname">stair-marks</ansi> accumulated
  on the walls at hand and shoulder height are the
  record of what has been moved through here — a
  dark band at hand height where people have steadied
  themselves under loads, a paler scuff at elbow
  height, a painted number at each landing that no
  longer corresponds to anything in the current layout
  but which no one has had occasion to remove.
  This stair is for staff. It is clean because it is
  maintained, not because it is impressive.
