title: The Gallery — Old Wing
description: >
  The old wing is where the gallery keeps the work
  it does not show. Not hidden — present, lit, on
  the wall in the same frames as everything else —
  simply never brought to the attention of anyone
  on the standard tour. The
  <ansi fg="itemname">old-canvases</ansi>
  here are the earliest material in the collection,
  predating the bloodline's acquisition of the Noble
  Quarter by several generations, and their subject
  matter belongs to an account of this region that
  the official history does not include. A settlement —
  not New Plymouth as built, but an older arrangement
  of structures, their geometry non-rectilinear, their
  placement on a promontory that no longer exists in
  its depicted form — appears in three separate works
  on the north wall, rendered in different hands and
  different decades but with consistent detail in
  certain elements. The
  <ansi fg="itemname">convergence-panel</ansi>
  at the wing's west end is the largest of these
  and the most complete in its depiction of what
  appears to be an assembly — figures gathered before
  a structure whose peak carries a mark the artist
  clearly considered important. The hall continues east.
