title: The Noble Way
description: >
  The Noble Way runs north from the plaza in a broad
  corridor of grey stone, the frontages on either side
  set behind high walls whose
  <ansi fg="itemname">gated-frontages</ansi> are closed
  and whose hinges show the dull gleam of frequent use.
  The <ansi fg="itemname">carriage-track</ansi> worn
  into the center of the paving is a precise record of
  the weight and routing habits of the families that
  live here — two parallel grooves, exact and unvarying,
  running north from the plaza's edge to beyond where
  your sight ends. Those who walk this far carry the
  specific confidence of people who have a reason to be
  here and are accustomed to that being understood.
  The Way continues north past where you stand, toward
  the galleries, the great estates, and the palace
  avenue — all held behind the Quarter's studied quiet,
  none of it yet visible from this end.
