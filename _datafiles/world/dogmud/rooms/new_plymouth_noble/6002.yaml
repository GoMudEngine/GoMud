nouns:
  gated-frontages: Iron-railed gates set in high
    stone walls at regular intervals along both sides
    of the Way, each one the same height and finish,
    each closed. The iron is painted a deep green that
    reads as black from any distance, and the hinges
    show wear that places them in regular use —
    opened and closed multiple times daily, without
    ceremony. What lies behind them is not visible
    from the street — no garden-edge, no courtyard,
    no sign of domestic life above the wall-line —
    which is probably the point.
  carriage-track: Two shallow grooves worn into the
    center of the Way's paving, perfectly parallel,
    the width of a coach's wheel-spacing. The wear
    runs the full visible length of the promenade in
    both directions, deepest near the plaza end where
    the turns are tightest, shallowing as it goes
    north. No gravel fill, no patch, no repair — the
    stone is simply worn, and the wear is the record
    of generations of regular passage by people who
    could afford coaches in a city where most could
    not.
idlemessages:
- A coach emerges from one of the northern gates,
  crosses the Way without hurry, and enters the gate
  directly opposite.
- The gated-frontages to either side are all closed.
  They have probably been closed since before dawn.
- Someone is cutting something inside one of the
  walled gardens; the clean sound of shears carries
  over the top of the stone.
- A child in expensive clothing stands at the near
  gate and watches you pass with no particular
  expression.
- The silence on the Way is of the kind that has
  been maintained, not the kind that arrived by
  accident.
