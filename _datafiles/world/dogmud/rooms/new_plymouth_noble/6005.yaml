nouns:
  central-worktable: A long table of dark hardwood
    running most of the office's east-west length,
    its surface worn to a flat polish by years of
    papers set down and lifted, seals pressed, and
    instruments unrolled across it. The invisible
    working zones are apparent to anyone who spends
    five minutes here — active correspondence to
    the right, the bloodline's city-facing ledgers
    to the left, the center kept clear for
    consultation. The table has no decorative
    elements. It does not require any.
idlemessages:
- Papers are moved from one end of the central
  table to the other in an order that is the
  order that matters — and then re-ordered
  again as circumstances change.
- A courier enters briefly from the Processional,
  delivers a sealed letter to the in-tray near
  the table's right end, and leaves without
  exchanging words.
- The office is cool at midday — the stone keeps
  the temperature even and does not care whether
  this is comfortable.
- The ledgers on the left side of the central
  table are current to the prior week. This
  week's entries are still loose pages waiting
  to be bound.
- From the northern door, the faint sound of
  the gallery is barely audible — quiet movement,
  or the particular near-silence of someone
  studying something closely.
