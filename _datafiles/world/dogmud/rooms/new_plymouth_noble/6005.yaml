title: The Administrative Office
description: >
  The bloodline's administrative seat in New Plymouth
  occupies a building of the same dressed stone as
  the Processional, its interior arranged for the
  expedient transmission of authority through paper.
  The <ansi fg="itemname">central-worktable</ansi>
  is long and undecorated, its surface divided by
  invisible convention into distinct working areas —
  correspondence to one end, ledgers to the other,
  rolled survey instruments in a rack at the far
  end that has not been touched today. The room's
  occupant — whoever holds the steward's post this
  season — conducts the bloodline's city-facing
  business from behind that table with the manner
  of someone who represents a power they did not
  originate and will not inherit. Everything here
  is competent and nothing here is warm. The gallery
  is accessible to the north; the antechamber lies
  west. The Processional is east. The office connects
  the Quarter's public axis to its institutional
  interior, and is aware of that function.
