nouns:
  processional paving: The pale stone underfoot is
    a different cut from the Noble Way — larger
    flags, tighter joints, fitted with a tolerance
    that does not permit settlement or weed. It has
    the quality of a surface maintained by people
    who understand that perfection is itself a
    message. The carriage-grooves of the Way do not
    continue here; coaches do not travel the
    Processional. Those summoned to the Palace
    arrive on foot, visible the entire length
    of the approach.
  bloodline cipher: The carved device above each
    corner pilaster — a closed form in two
    concentric rings, the inner ring divided at
    intervals by short radial marks, the outer
    plain. It appears on every formal surface in
    the Noble Quarter, though it is rendered with
    the most precision here, where the stone is
    newest and the carvers were best paid. The
    symbol does not appear in any of the faith's
    iconography at the Temple — but its concentric,
    radial-marked form is unmistakably the shape a
    careful eye finds half-hidden in the gallery's
    oldest paintings, the ones no tour stops at. No
    guide will draw the comparison. The bloodline
    considers the whole question unremarkable and is
    not pressed on it.
idlemessages:
- A pair of watchers in full quarter-livery
  pace the Processional from north to south —
  steady, unhurried, not looking at anything
  in particular, which is also a form of
  looking.
- The Processional holds a quiet that feels
  less like the absence of sound and more like
  a standing policy about it.
- A courier in dispatch-colors crosses from
  the administrative office to the east at a
  pace calculated to suggest urgency without
  implying alarm.
- The pale stone reflects afternoon light
  differently than the Noble Way below —
  cooler, less amber, the color of official
  business conducted without warmth.
- The corner pilasters at the intersection
  cast clean shadows across the paving at
  low sun. The cipher above each is
  briefly legible.
