title: The Palace Processional
description: >
  The Processional opens northward from the Noble
  Way as a different order of street — wider, emptier,
  the paving here a paler stone than the Way, dressed
  and fitted with a precision that carries the quality
  of deliberate statement. Nothing grows along it;
  no vendor cart, no planted tree, no wall broken by
  a gate or ordinary door. The
  <ansi fg="itemname">processional-paving</ansi>
  runs uninterrupted from here to the Sentry Walk
  ahead — a space that exists to conduct those who
  have been summoned toward the Palace and to ensure
  that anyone making that approach is visible the
  entire way. The
  <ansi fg="itemname">bloodline-cipher</ansi>
  is carved above each of the four corner pilasters
  at the intersections flanking this stretch — not
  decorative, or not only decorative — and the
  acoustic quality of the stone here returns sound
  in a way that makes ordinary speech audible at a
  distance one would not predict.
