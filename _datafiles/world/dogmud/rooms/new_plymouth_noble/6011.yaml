title: The Estate Lane — Gatehouse
description: >
  A gated passage connects the atelier's building
  to the private lane behind the estate holdings —
  a service route used by residents of the lane and
  their household staff, and no one else. The
  <ansi fg="itemname">lane-gate</ansi> ahead closes
  the northern passage — a solid iron affair, fitted
  with a deadbolt whose key is not kept at this post
  and a bell-pull mounted to the side that is used
  only by those who have been expected. A porter in
  liveried house-colors occupies the small gatehouse
  recess, their attention low and steady — not
  hostile, simply present in the specific way of
  someone whose entire function is to register who
  is here and confirm they belong here. You have not
  been confirmed. The lane beyond serves the residence
  households of this block — their private courts,
  their staff arrangements, the domestic fabric that
  the Quarter's public face prefers not to make visible.
  The gate does not open to inspection or persistence.
  The servants' passages behind the estate block
  are accessible to the east.
