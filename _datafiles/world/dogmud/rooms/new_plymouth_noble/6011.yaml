nouns:
  lane gate: Iron, solid-panel rather than barred —
    you cannot see directly through it. The lock
    is a double-keyed deadbolt, its keyhole the
    only element that invites close inspection, and
    close inspection confirms that the key is not
    present here and is not available at this post.
    The bell-pull to the gate's right is polished
    from frequent use and rings somewhere beyond
    the gate's solid face — a sound you have not
    heard, because you have not rung it, because
    you have not been expected. The gate does not
    open from this side without the key or the
    confirmation of a resident within.
idlemessages:
- The porter in the gatehouse recess notes
  your presence without acknowledging it
  verbally. This is the courtesy form.
- The lane-gate is closed. The lane beyond
  is not currently anyone's business except
  those who live behind it.
- The bell-pull beside the gate swings very
  slightly in the draft from the passage.
  It does not ring.
- The porter's tabard shows the estate
  block's household cipher — a different
  mark from the Quarter's general livery,
  narrower, more domestic in its form.
