roomid: 6003
zone: New Plymouth Noble
title: Guide Ferrol's Flat
description: >
  The flat is small and carefully ordered in the way
  of a space used for preparation rather than living —
  a narrow desk facing the window, the floor swept
  clean, the walls bare except for the
  <ansi fg="itemname">founding-history</ansi> displayed
  in a frame of polished wood above the desk — a
  broadsheet-sized printed account of New Plymouth's
  origins, its lettering crisp, its paragraphs
  arriving in the exact order that a founding history
  should. The desk holds a writing-case and a stack
  of the same account in smaller formats — the same
  version of events rendered in different sizes for
  different audiences, all of them arriving at the
  same conclusion. The <ansi fg="itemname">guide-desk</ansi>
  is positioned so that whoever sits at it faces the
  history directly; the arrangement suggests the text
  is consulted regularly, though its content presumably
  does not change.
