nouns:
  waiting bench: A bench of the same dressed stone
    as the walls, cut from a single piece and
    built into the north wall at seat height.
    There is no cushioning. The surface is smooth
    but not polished — there was never any intention
    to make it pleasant, only adequate. The bench
    holds three people with room between them, or
    four at close quarters. You can tell without
    sitting that it is cold. It has been cold
    for as long as the building has stood, and
    will continue to be.
idlemessages:
- The antechamber is empty at present.
  This does not mean the wait is over.
- The lamp in the wall bracket gives
  even, adequate light that casts no
  interesting shadows. This is also
  not an oversight.
- The office door to the east is closed.
  The sound from the other side is
  indistinct.
- The waiting bench is unoccupied. It
  will be occupied again today, as it
  is most days.
- Time passes at a consistent rate in
  the antechamber. The room makes no
  particular effort to make this less
  apparent.
