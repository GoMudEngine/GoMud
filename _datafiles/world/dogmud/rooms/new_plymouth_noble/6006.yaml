title: The Office Antechamber
description: >
  The antechamber exists for one purpose — to hold
  petitioners at a remove from the office proper
  while their business is considered, their
  paperwork checked, or their appointment confirmed.
  The <ansi fg="itemname">waiting-bench</ansi> along
  the north wall is the room's only furnishing that
  acknowledges human presence; the walls are bare
  dressed stone, the floor the same pale tile as the
  Processional approach, and there is no window.
  The lamp in the wall bracket gives adequate light
  and nothing more. There is nothing to read, nothing
  to examine, nothing that would make the wait feel
  shorter or longer than it is. This is not an
  oversight. The room communicates one thing with
  precision — the person in the office controls
  the pace of what happens next, and this is the
  space in which that becomes concrete. The office
  door to the east is closed.
