title: Modiste Aurel's Atelier
description: >
  The atelier occupies the ground floor of a building
  on the Processional's eastern side, its windows set
  high to give working light without street exposure.
  Bolts of cloth are ranked along the western wall
  on iron pegs — silks, a heavy brocade in the
  bloodline's blue-grey, wool in the finer weights —
  and the <ansi fg="itemname">cutting-table</ansi>
  at the room's center holds work in the middle of
  being worked, pinned and marked and partly assembled
  with the organized disorder of something being made
  by someone who knows exactly where everything is.
  The <ansi fg="itemname">modiste-mannequins</ansi>
  along the north wall carry garments at various
  stages of completion — a formal jacket half-finished,
  a commission in bloodline house-colors whose
  measurements are written on a card at its collar.
  Aurel's atelier is not a shop; it makes specific
  things for specific people who have arranged for
  them to be made, and those people have already
  been in contact. The service court is east; the
  estate lane gatehouse is north.
