nouns:
  cutting table: A table of hardwood at the
    atelier's center, its surface marked by decades
    of chalk-line and pin-hole at the edges but
    kept clean at the active working area. The
    current work — pinned and partly assembled —
    is a formal jacket in mid-weight wool, the
    kind of garment that serves all occasions of
    a certain type. Chalk marks indicate alterations
    beyond the standard cut; this has been measured
    for a specific person whose dimensions are noted
    on a card clipped to the near edge. The name
    on the card is not visible from where you stand.
  modiste mannequins: A row of adjustable forms
    along the north wall, each holding a garment
    at some stage of making. The commission in
    bloodline house-colors — blue-grey wool, silver
    buttons, collar of a pattern restricted to the
    Quarter's senior household — is nearest
    completion, its finishing work still pending.
    The card at its collar gives a date and a cipher
    that names a household rather than a person.
    The mannequin wears it well. It was not made
    for the mannequin.
idlemessages:
- The atelier is quiet in the way of rooms
  whose work requires concentration — the
  silence is not absence but intention.
- A length of thread lies at the cutting
  table's edge, trailing to the floor where
  it has been there long enough to be
  stepped over automatically.
- The bloodline commission on the north
  mannequin catches the working light in
  the silver of its buttons.
- From the back rooms beyond the north door,
  cloth is being moved — the sound of a
  bolt set down and a brief evaluation of
  something in hand.
- A basket of pins sits at the cutting
  table's right edge, its contents depleted
  on one side and restocked on the other —
  the record of a morning's work.
