roomid: 6014
zone: New Plymouth Noble
title: The Service Court
description: >
  The service court is where the Noble Quarter's
  real needs arrive — a back-court of plain stone,
  accessible from the atelier to the west and the
  servants' stair to the north, where deliveries
  are received away from the Processional's sight-
  lines. The <ansi fg="itemname">loading-platform</ansi>
  along the court's north wall is worn at the edge
  where crates are set down and lifted — a different
  kind of wear from the Processional's carriage-
  grooves, more vertical, the mark of weight borne
  and released. There is always something in transit
  here — bolts of cloth for the atelier, household
  provisions for the estate lane, the category of
  supply that the Quarter's public face prefers not
  to be seen receiving, though the Quarter requires
  it no less than anywhere else. A
  <ansi fg="itemname">service-roster</ansi> hangs
  in the alcove by the north door — today's
  deliveries, times, suppliers, the unpoetic
  logistics of keeping the Noble Quarter running.
  It is read, checked, and current.
