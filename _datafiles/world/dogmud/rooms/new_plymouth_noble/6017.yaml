title: The Gatehouse Barracks
description: >
  The barracks wing occupies the eastern tower of the
  gatehouse complex, its ground floor given over to
  the ceremonial guard's off-watch hours. The room is
  immaculate in the specific way that reflects standing
  orders rather than personal inclination — the
  <ansi fg="itemname">guard-kit</ansi> racked along
  the south wall in exact columns, the
  <ansi fg="itemname">duty-board</ansi> current and
  correctly initialed at every line. Nothing is out
  of place. A smell of oil and laundered wool and the
  particular polish applied to ceremonial boots is the
  room's dominant register — domestic and institutional
  at once, the smell of people required to maintain
  an appearance and trained to do it without visible
  effort. The guards who rotate through here are not
  performing comfort; they are performing readiness,
  and the room accommodates that with the same
  precision they bring to the gate outside.
