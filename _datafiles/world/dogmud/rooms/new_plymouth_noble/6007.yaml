title: The Art Gallery — Hall
description: >
  The gallery's main hall runs east-west, its walls
  hung with the Noble Quarter's collection — bloodline
  portraits in formal commission above the wainscoting,
  civic scenes in the panels between. The
  <ansi fg="itemname">bloodline-portraits</ansi> are
  what a visiting dignitary would be shown — recent
  work, excellent technical quality, subjects rendered
  in the correct poses with the correct objects and
  the correct expressions for their stations. Between
  them, set slightly lower and less prominently lit,
  are the <ansi fg="itemname">older-paintings</ansi> —
  not the collection's pride, not on the tour, and not
  easily dismissed once noticed. Their subject matter
  is, on the surface, the same as the newer work —
  landscapes of this region, early settlement scenes,
  a horizon or two — but the details in them do not
  match the history the newer paintings confirm.
  A stair at the hall's north wall leads up to the
  keeper's rooms above. The old wing continues west.
