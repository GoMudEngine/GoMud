title: The Gallery — Upper
description: >
  The keeper's rooms above the gallery are a working
  scholar's space in the way that implies the scholar
  has been at this for a long time. The
  <ansi fg="itemname">analysis-table</ansi> at the
  room's center holds the tools of close inspection —
  magnifying lenses in stands of various focal
  lengths, raking-light lamps whose angles can be
  adjusted precisely, annotated sketches reproduced
  from the collection's oldest works in a hand that
  is both careful and urgent, as if the notes were
  taken in the gap between other duties. The smell
  of the room is pigment and varnish and old paper,
  with something underneath those smells that takes
  a moment to identify — the quality of a room where
  someone has been thinking very carefully for a
  long time about something they cannot discuss.
  The <ansi fg="itemname">reference-shelves</ansi>
  along the east wall contain volumes whose spines
  have been turned inward on the lower two rows.
  The gallery below is accessed via the stair
  to the south.
