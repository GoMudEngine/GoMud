zone: New Plymouth Noble
title: The Tour Steps
description: >
  A low platform of dressed stone extends off the
  plaza's eastern edge, enclosed on three sides and
  open to the square, its northern face a clean
  balustrade offering an elevated sight-line over the
  plaza and the Noble Way beyond. The
  <ansi fg="itemname">viewing-rail</ansi>, waist-height
  coping worn smooth where hands have rested on it,
  runs the platform's full width; the view from here
  shows the plaza's formal geometry whole and the
  Noble Way running north with a clarity the
  ground-level perspective does not allow. At the
  platform's center the
  <ansi fg="itemname">founding-plaque</ansi> stands on
  a simple iron post — a panel of pale marble, lettered
  in incised capitals, presenting the city's origin in
  six tidy paragraphs. The text is confident, the
  account's edges are smooth, and the dates are
  precise; it is everything a founding history should
  be, which is a particular kind of thing to be.
