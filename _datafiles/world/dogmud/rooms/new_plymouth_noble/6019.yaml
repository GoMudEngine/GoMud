title: The Noble Garden
description: >
  The garden occupying the western approach to the
  Palace gatehouse is beautiful in the way that
  presupposes a viewer and controls what that viewer
  sees. The
  <ansi fg="itemname">gravel-paths</ansi> are pale
  stone chip, raked in a consistent direction at a
  consistent depth; the
  <ansi fg="itemname">formal-plantings</ansi> are
  composed of species that do not produce disorder —
  no fruit to drop, no flower past its precise moment
  of bloom, no branching that has not been anticipated
  and preempted. Nothing in the garden suggests that
  anything here is not exactly as intended. A garden
  attendant is sometimes visible at work in the
  borders, moving with the particular efficiency of
  someone whose task is to maintain a perfection they
  themselves may not enter socially. The garden does
  not invite lingering. It is too precisely itself
  for that.
