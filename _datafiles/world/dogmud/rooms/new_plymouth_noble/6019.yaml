nouns:
  gravel-paths: Fine pale stone chip, raked in
    straight parallel lines at a uniform depth
    across the garden's floor surface. The raking
    is directional — north-to-south along the main
    path, east-to-west on the side runs — and the
    meeting-points at the corners show the mark
    of someone who works the boundaries with care.
    There are no footprints in the gravel. You have
    not yet stepped off the border stones, and it
    is not clear you should.
  formal-plantings: Box hedge, clipped topiary in
    geometric forms — sphere and cone and a stepped
    pyramid at the garden's center — and borders of
    a grey-leafed herb whose name is not immediately
    apparent. Nothing flowers beyond its scheduled
    moment. The topiary at the center has been worked
    into a form that, from certain angles, suggests
    a sphere within a sphere — concentric, like a
    model of something orbital or cosmological. The
    hedge around it is recent work, still carrying
    the pale cut-marks of new shearing.
idlemessages:
- The gravel paths show this morning's raking
  undisturbed. No one has walked the garden
  yet today, or they have walked it without
  leaving a trace.
- The topiary at the garden's center is the
  one piece of work here that seems to have
  been enjoyed as much as maintained — its
  form deliberate, its upkeep careful beyond
  what duty alone would require.
- A garden attendant moves along the western
  border with a pair of shears, addressing a
  single overreaching branch with evident focus.
- The garden is quiet in the particular way
  that very controlled spaces are quiet —
  all the things that might make noise have
  been removed or contained.
- Light falls on the central topiary from
  the west at this hour, its nested spherical
  form casting a layered shadow on the
  raked gravel beneath it.
