  message: A scavenger bird drops from the sky and lands on the cairn, cocking its head to study you.
  respawnrate: 5 real minutes
nouns:
  cairn: A pile of flat stones stacked with deliberate care. The bottommost are large
    as dinner plates, the topmost no bigger than a fist. Each stone has been chosen
    for how it sits -- this was built to last. Travellers have added smaller stones
    over the years, making it lopsided.
  arrow: A crude directional mark scratched into pale stone. It points south along
    the road. Beneath it, someone has scratched what might be a word, but time and
    weather have made it illegible.
idlemessages:
- A scavenger bird wheels overhead, riding the thermals in lazy circles.
- The cairn stones click faintly as the day's heat expands the rock.
- Wind sweeps across the open ground, flattening the grass in travelling waves.
