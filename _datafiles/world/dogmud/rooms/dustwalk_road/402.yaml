roomid: 402
zone: Dustwalk Road
title: The Cairn
description: A stack of weathered stones marks the junction where a faint trail splits
  west from the main road. The cairn is old -- lichen covers the lower stones and the
  upper ones have been bleached pale by years of sun. Someone has scratched a crude
  arrow into the topmost rock, pointing south along the road. The scrubland opens up
  here into a wider vista of dry grassland, and the sky feels enormous overhead. Dark
  shapes circle lazily in the thermals above, riding the updraft from the warming earth.
