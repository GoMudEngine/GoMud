roomid: 405
zone: Dustwalk Road
title: Warden's Post
description: A small waystation stands beside the road -- a stone-walled shelter with
  a flat roof and an open front, built to give road wardens a place to rest and watch
  the traffic. A wooden signpost out front lists distances in faded paint, though most
  of the destinations are illegible. The shelter is well-maintained despite its remote
  location. A bedroll, a water skin, and a stack of patrol reports occupy the interior.
  Someone is stationed here, and takes the posting seriously.
