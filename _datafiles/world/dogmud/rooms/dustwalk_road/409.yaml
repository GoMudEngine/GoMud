nouns:
  marker: A squared stone pillar carved with an eye-and-tower emblem -- the seal of
    the Watchers. Below the seal, text reads "You enter watched ground. Conduct
    yourselves accordingly." The carving is sharp and recent. Someone maintains this.
  towers: Squat stone watchtowers on the horizon, spaced at regular intervals along
    a low ridge. They look functional rather than decorative -- built for observation
    and defense, not for show.
idlemessages:
- The road ahead is well-maintained, the brush cleared back from the edges.
- The distant watchtowers stand dark against the eastern sky.
- A patrol marker -- a cairn with a red-painted stone on top -- stands beside the road.
