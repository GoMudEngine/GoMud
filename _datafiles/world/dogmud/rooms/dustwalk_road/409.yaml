roomid: 409
zone: Dustwalk Road
title: Dustwalk Road, Eastern End
description: The eastern fork of Dustwalk Road levels out as it leaves the ridgeline
  behind and stretches toward a distant line of watchtowers on the horizon. The road
  is better maintained here -- the ruts are shallower, the brush has been cleared back
  from the edges, and there are signs of regular patrol. A boundary marker carved with
  the seal of the Watchers stands beside the road, marking the transition from open
  country into patrolled territory. The towers ahead grow larger with each step.
biome: plains
