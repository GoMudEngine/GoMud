roomid: 407
zone: Dustwalk Road
title: Abandoned Campsite
description: The road descends into a sheltered gully where someone has made camp --
  and left in a hurry. A fire ring of blackened stones sits cold, surrounded by
  scattered debris. Torn canvas, broken crate slats, and the stripped bones of a
  small animal litter the ground. Boot prints churn the dust in every direction,
  too many for one person. The gully walls rise on either side, cutting off the wind
  and the view. It would be easy to walk into this place without seeing what waited
  at the bottom.
