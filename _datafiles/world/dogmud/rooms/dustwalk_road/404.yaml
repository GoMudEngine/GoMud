roomid: 404
zone: Dustwalk Road
title: Dustwalk Road, Open Grassland
description: The road crosses a broad expanse of open grassland where the scrub has
  thinned to scattered tussocks and the ground is flat enough to see for miles. The
  grass is dry and golden, rippling in the wind like the surface of a slow river. To
  the south, a structure is visible against the horizon -- something built with purpose,
  standing where the road bends slightly west. The openness feels exposed after the
  scrubland. Anything on this road can be seen from a long way off.
