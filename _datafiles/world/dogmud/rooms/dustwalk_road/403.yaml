spawninfo:
- itemid: 40009
  message: A cluster of dustwalk herbs grows between the creek stones, leaves silvery in the light.
  respawnrate: 10 real minutes
nouns:
  herbs: Grey-green plants with narrow, aromatic leaves and tiny white flowers. They
    grow in the dampest patches of the creek bed where underground moisture seeps up
    through the gravel. The scent is sharp and clean, like crushed sage with an
    undertone of something bitter.
  stones: Smooth river stones, pale and dry. They were tumbled round by water that
    no longer flows here. Some still hold a faint coolness on their undersides.
idlemessages:
- The aromatic scent of wild herbs drifts up from the creek bed.
- A lizard suns itself on a flat stone, motionless except for the pulse at its throat.
- The dry creek bed is silent. Whatever water shaped these stones is long gone.
