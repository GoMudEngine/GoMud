roomid: 403
zone: Dustwalk Road
title: Dry Creek Bed
description: A narrow trail leads from the road to a shallow creek bed that has not
  seen water in weeks. The bed is lined with smooth, sun-bleached stones and the
  cracked remnants of dried mud. Hardy herbs have taken root in the damp soil beneath
  the stones, their leaves grey-green and aromatic. This is the kind of place a
  traveller might stop to forage or rest out of the wind. The banks of the creek
  provide modest shelter, and the herbs grow thick where the moisture lingers longest.
