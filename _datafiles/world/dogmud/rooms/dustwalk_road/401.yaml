  message: A lean, dust-coloured dog emerges from the scrub, hackles raised and teeth bared.
  respawnrate: 4 real minutes
idlemessages:
- Something rustles in the thornbush just off the road. Probably nothing large.
- Paw prints in the dust overlap in a confused tangle -- a pack has been through here.
- The wiregrass hisses in the wind like a slow exhalation.
