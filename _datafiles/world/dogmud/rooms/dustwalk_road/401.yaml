roomid: 401
zone: Dustwalk Road
title: Dustwalk Road, Scrubland Stretch
description: The road cuts through a stretch of low scrubland where thornbush and
  wiregrass crowd against the track. The vegetation is dense enough to hide anything
  smaller than a person, and the rustling never quite stops. Paw prints cross the
  road in several places, pressed deep into the sandy soil. Something has been hunting
  here recently. The road itself is well-worn but unmaintained -- no one has filled
  the ruts or cleared the encroaching brush in a long time.
biome: plains
