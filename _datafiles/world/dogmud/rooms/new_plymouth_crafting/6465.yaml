nouns:
  enchanting circle: A ring inlaid into the floorboards at
    the room's center, its lines gone dark with years of use
    and re-chalked before every working. Faint scorch marks
    radiate outward in a few places where a working did not
    go quite as intended.
  shelves: Shelves along the walls holding labeled trays of
    chrysalis shard, jars of binding paste, and settings not
    yet fitted to anything, each tray marked in a small,
    exacting hand.
idlemessages:
- The chalk lines of the circle are redrawn with slow,
  deliberate strokes.
- A faint ozone tang rises and fades as a shard is set down
  on its tray.
- Through the wall, the Tannery's noise carries faintly from
  the south.
- The high window admits a narrow, controlled measure of
  daylight onto the workbench.
