roomid: 6465
zone: New Plymouth Crafting
title: The Enchanter's Atelier
description: >
  North of the Tannery, the smell of hides gives way to
  something drier and stranger — chalk dust and the faint
  ozone tang that clings to worked chrysalis material. An
  <ansi fg="itemname">enchanting circle</ansi> is inlaid
  directly into the floorboards at the room's center, its
  lines gone dark with use and re-traced in fresh chalk before
  each working. Shelves along the walls hold labeled trays of
  shard, paste, and setting, organized with a precision that
  has nothing to do with the tannery-district's usual clutter.
  A single high window lets in a controlled measure of light.
  South, the Tannery's noise carries faintly through the wall.
