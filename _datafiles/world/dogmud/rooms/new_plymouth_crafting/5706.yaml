roomid: 5706
zone: New Plymouth Crafting
title: Orin's Bookstall
description: >
  A cramped stall with more merchandise than floor-space,
  its shelves running floor to ceiling along three walls
  and an overflow of map-tubes stacked in the corners.
  Orin sells books and maps here — used volumes alongside
  new, city charts alongside hand-copied regional surveys
  — and the stock smells of paper handled by many hands
  and taken seriously by most of them. A narrow <ansi fg="itemname">map-rack</ansi>
  dominates the east wall, its slots holding rolled
  charts in a system only Orin understands. The shelves
  to the north carry tightly packed <ansi fg="itemname">bound-volumes</ansi>
  — ledgers, histories, technical manuals — each labelled
  in Orin's consistent hand. A stair at the back rises
  to a low-lintel door; whoever lives above has made the
  bookstall into their own corridor.
