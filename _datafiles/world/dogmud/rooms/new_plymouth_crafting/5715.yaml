roomid: 5715
zone: New Plymouth Crafting
title: The Tailor's Shop
description: >
  The tailor's workroom takes up the building's full
  ground floor, lit by south windows and a high north
  skylight in the way the trade requires. Bolts of
  fabric range on deep shelves along the north wall —
  wool, linen, heavier canvas toward the back — and
  the <ansi fg="itemname">cutting-bench</ansi> at the
  room's center holds a half-finished piece pinned to
  a fresh cutting board. Along the south wall, the
  <ansi fg="itemname">pattern-wall</ansi> carries a grid
  of iron pegs from floor to near-ceiling, each peg
  holding a labeled paper pattern in a system entirely
  consistent within itself. A stair at the back leads
  to the rooms above. East, a door opens toward the
  tannery district, where the supply of leather and
  the trade in finished goods overlap. The room smells
  of chalk and cut cloth — the baseline scent of
  patient and careful work.
