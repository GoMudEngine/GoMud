nouns:
  cutting bench: A long hardwood table, its surface
    built up with replaceable cutting-board layers
    that scar and are replaced. The current board is
    well-used — a grid of fine lines from the cutting
    wheel across the whole surface, deeper score marks
    where the shears came down. A piece of dark wool
    is pinned to the board, cut out in pieces arranged
    and rearranged. A chalk line marks where the next
    cut should go.
  pattern wall: The south wall is covered in a grid
    of small iron pegs, each holding a folded paper
    pattern on a labeled tag — garment type, reference
    number, and body measurements in a consistent hand.
    Some patterns are old enough that the paper has
    gone amber and the labels are faded. Others are
    recent. The system has been in use for years without
    reorganization, which makes it larger and more
    comprehensive than most.
idlemessages:
- Fabric stirs slightly on the nearest bolt as someone
  passes outside the south window.
- The chalk line on the cutting-bench catches the
  window light at a shallow angle, precise and white.
- From upstairs — a short movement, the settling of
  floorboards, then quiet.
- The pattern-wall shifts in the draft when the east
  door opens — the paper labels turn on their pegs.
- A faint smell of chalk and cut cloth fills the room,
  the trade's particular and patient signature.
