title: The Tanning Yard
description: >
  The yard behind the tannery holds the vats in a row
  along the north wall — cut stone, watertight mortar,
  each filled with oak-bark tanning liquor at a different
  concentration. The <ansi fg="itemname">bark-vats</ansi>
  are the oldest part of the works, their coping stained
  deep brown through its full thickness, the smell from
  the dark-liquor vats thick and rich. At the south end
  of the yard, the <ansi fg="itemname">rinsing-rack</ansi>
  holds four hides stretched and hung to drain, their
  lower edges still dripping into the stone channel
  below. The yard floor is worn smooth from years of
  foot-traffic between door and vat and rack, the path
  worn as clearly as any road. A drain at the center
  was capped in fresh mortar, cleaner than the
  surrounding stone, but the cap has been levered
  aside — an open shaft drops below, iron rungs set
  into its wall. The tannery's effluent routes
  elsewhere now, toward the guild-approved channel.
