nouns:
  bark vats: Six stone-lined tanning vats in a row,
    each holding a liquor of varying concentration.
    The progression from pale at the east end to dark
    and dense at the west represents the hide's journey
    through the process. Each vat has a wooden probe
    rod laid across the top coping, used to push hides
    below the liquor surface. The stone is stained
    through its full depth in the older vats; in the
    newer ones, the staining is only surface-deep and
    will deepen in time.
  rinsing rack: A wooden frame of three poles with
    crossbars at the south end of the yard, designed
    to hang hides at full stretch for draining. Four
    hides hang from it now in various stages, their
    bottom edges still dripping slowly into the channel
    cut in the stone below. The rack's wood has the
    same dark color as the tannery's stretching-frames
    — it has been in this yard long enough to be
    saturated through.
idlemessages:
- The bark-vat liquor is still, dark brown at the
  surface, rich and particular in smell.
- A hide at the rinsing-rack turns slowly in a light
  draft, its bottom edge still dripping.
- The yard is quiet except for the dripping water
  from the rack and the occasional creak of its joints.
- Light comes over the south wall and catches the near
  vat's surface — clear enough to see the hide beneath.
- The opened drain sits in slightly cleaner mortar
  than the surrounding stone, its cap levered aside
  and left leaning against the near vat.
