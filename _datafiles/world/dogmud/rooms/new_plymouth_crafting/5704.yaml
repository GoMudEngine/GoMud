nouns:
  lamp-post: An iron post topped with an oil-lantern
    housing, the arm angled to throw light onto the
    junction. The lantern glass is clean, the wick
    trimmed — someone maintains it with attention. The
    post's base was recently re-set in fresh mortar
    after paving work; the mortar has not yet taken the
    weathered grey of the surrounding stone. At night
    this lamp marks the point where the Crafting Quarter
    ends.
  paste-residue: The wall carries an uneven skin of
    broadsheet layers — notice over notice, some still
    legible and some reduced to papery substrate. Guild
    announcements, a militia call from two seasons back,
    a tanner's advertisement repeated so often it has
    formed its own geological stratum. At the bottom of
    the column, barely readable under the rest, is a
    city surveyor's seal on what appears to be a public
    posting. The date is from before the last building
    work on the street. Someone was warning of something.
idlemessages:
- The junction at the east end is quieter than the stall-
  stretch — foot-traffic crosses rather than lingering.
- A broadsheet has come loose from the wall and skitters
  a few feet in a gust before catching on a boot-scraper.
- The lamp-post's housing rattles faintly in the wind,
  the lantern inside shifting on its pivot.
- A pair of merchants' agents stops at the junction,
  consults a written note, and turns back west without
  explanation.
- The road to the east ends at a fence-post and raw
  timber, the Merchant Quarter still taking shape beyond.
