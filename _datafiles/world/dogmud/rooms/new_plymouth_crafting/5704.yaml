title: The Long Market — East End
description: >
  The Long Market's eastern end is quieter — the last of
  the open stalls taper to a blank wall and a wider
  junction where the road continues toward the Central
  Square and the Merchant Quarter beyond, though that
  way is not yet open. A lone <ansi fg="itemname">lamp-post</ansi>
  stands at the junction, its iron arm angled to light
  the transition between districts, unlit now in the
  daytime. The wall beside it carries several seasons'
  worth of broadsheet notices and the <ansi fg="itemname">paste-residue</ansi>
  of older ones beneath, a stratigraphic record of the
  quarter's affairs printed in small runs and glued over
  one another without apology. West, the stall-stretch
  resumes its noise.
