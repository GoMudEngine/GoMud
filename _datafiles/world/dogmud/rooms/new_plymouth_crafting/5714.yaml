roomid: 5714
zone: New Plymouth Crafting
title: The Kiln Complex
description: >
  The hall behind the glassworks was built for expansion
  and never fully put to use. A second furnace stands
  cold against the north wall, its draw-port closed
  with a ceramic stopper — the structure is sound,
  only unlit. The <ansi fg="itemname">annealing-oven</ansi>
  at the east end of the same wall is still in service,
  its door standing open, a row of ceramic cooling
  pads visible on the interior shelf with the mark of
  a recently removed piece still warm on them. Along
  the south wall, the <ansi fg="itemname">cooling-bench</ansi>
  of heavy soapstone runs the room's full length, its
  surface a record of every piece set down hot here —
  ring upon overlapping ring. The new brickwork of the
  expansion is visible in the east wall and the ceiling
  is a handspan lower than the kiln-room next door,
  the join ungainly and unapologized for.
