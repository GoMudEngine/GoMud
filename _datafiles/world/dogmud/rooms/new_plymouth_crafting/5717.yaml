zone: New Plymouth Crafting
title: The Tannery
description: >
  The tannery's indoor workroom carries the trade's
  smell — tanning bark and oak liquor and the honest
  note of hides in process — and does not apologize
  for it. Wooden <ansi fg="itemname">stretching-frames</ansi>
  run both long walls, each holding a hide pinned taut
  at a different stage of curing; the range from pale
  new stock to deep finished tan is a visual record of
  the process. The <ansi fg="itemname">preparation-bench</ansi>
  at the center is wet at the edges from beaming and
  fleshing work, the tools racked above in the exact
  order of use. Beyond the east door, the yard and its
  vats. South, the way leads to the porter's yard and
  then toward the Common Quarter, where the tannery
  district continues in that direction — its smell
  rides over on any wind shift and tells you the trade
  is bigger than this one building.
