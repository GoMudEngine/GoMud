nouns:
  stretching-frames: Wooden frames of mortise-and-tenon
    construction, each adjustable along two axes to
    maintain tension as the hide shrinks during curing.
    The hides on them range from pale new stock to deep
    tan, each stage carrying its own particular smell.
    The frames' wood has been saturated by years of
    tanning residue and has gone to a uniform dark
    amber-brown throughout.
  preparation-bench: A wide-topped bench of heavy
    timber, its surface raised and edge-lipped to
    contain the liquids of beaming and fleshing work.
    The tools above it are racked from coarsest at
    the left to most precise at the right — beaming
    knife, fleshing knife, two scrapers, a slicker.
    They are clean and their edges are maintained.
    The bench surface carries the accumulated staining
    of the work, a layered record that no amount of
    washing fully removes.
idlemessages:
- The smell of the tannery is present and constant —
  tanning bark and hides in process and the labor.
- One of the stretching-frames ticks as the hide
  on it dries and contracts.
- From the yard east, the sound of vats being tended
  — a scrape and then a splash.
- Light through the east door falls on the near row
  of frames, illuminating different stages of curing.
- South, the smell of other tanneries carries on the
  wind from the direction of the Common Quarter.
