nouns:
  glory hole: The kiln's working port is set into the
    north wall at standing height — an arched opening
    faced with firebrick gone glassy from sustained
    heat. Even drawn down, the interior glows a steady
    orange and the heat coming off the face is a wall
    you feel several paces back. The port's lip is
    blackened and chipped from gather rods and blowpipes
    working against it. A ceramic stopper rests in a
    bracket beside the opening for when the kiln is
    fully banked; it has not been needed today.
  iron pipe rack: A horizontal rack of iron brackets
    above the east passage, holding blowpipes in
    graduated lengths — the shortest for small work,
    the longest for large gathers. The pipes are
    scorched at the tips and carry the wax-drip
    evidence of hot glass handled and set aside. They
    are mounted with the tip ends outward, ready to
    take rather than to give back, which is a habit
    that speaks to how often they are in use.
idlemessages:
- The glory-hole radiates heat in a continuous wave
  even with the kiln drawn down to working temperature.
- The smell of hot sand and minerals fills the room
  — a smell so particular it announces the trade.
- A blowpipe on the rack ticks softly as metal cools
  and contracts in the room's shifting heat.
- Sand on the floor catches the glory-hole's orange
  light at a low angle, granule by granule.
- From the east hall, the quieter warmth of the
  annealing oven bleeds back through the passage.
