roomid: 5713
zone: New Plymouth Crafting
title: The Glass Kiln
description: >
  The glassblower's kiln-room is organized entirely
  around heat and access to heat. The <ansi fg="itemname">glory-hole</ansi>
  in the north wall — the kiln's working port — radiates
  continuously even when drawn down, its firebrick face
  glowing an even orange; the wave of heat coming off
  it is the room's dominant experience. Sand is scattered
  thick on the floor, ground in by years of use, and
  the air smells of hot sand and the mineral sweetness
  of molten glass cooling on tool-ends and gather rests.
  Above the passage east, an <ansi fg="itemname">iron-pipe-rack</ansi>
  holds a dozen blowpipes in graduated lengths, their
  tips scorched and their lengths marked with the dripped
  evidence of working use. Through the east opening,
  the kiln complex continues into a larger and quieter
  hall.
