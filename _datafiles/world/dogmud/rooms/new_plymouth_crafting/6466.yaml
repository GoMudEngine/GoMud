nouns:
  jeweler's bench: A square bench set in the light of the
    room's single tall window, fitted with a ring of small
    drawers for wire, stone, and gem dust. Its surface is
    scarred with fine cross-hatching from years of careful
    work.
  display cloth: A velvet cloth folded at the bench's corner,
    its nap worn thin at the fold lines from being unrolled
    and rolled again more times than anyone has counted.
idlemessages:
- A loupe is lifted from the rack, checked against the light,
  and set back in its place.
- The cushioned stool creaks as its occupant leans in over
  the bench.
- The velvet display cloth is smoothed flat and then folded
  away again.
- Downstairs, the Tannery's noise rises faintly through the
  floorboards.
