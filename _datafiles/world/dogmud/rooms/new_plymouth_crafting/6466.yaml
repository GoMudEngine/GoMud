zone: New Plymouth Crafting
title: The Jeweler's Atelier
description: >
  Up a narrow stair above the Tannery, the air clears of hide
  and bark and turns instead to metal polish and lamp oil. A
  <ansi fg="itemname">jeweler's bench</ansi> sits square in
  the light from the room's single tall window, fitted with a
  ring of small drawers for wire, stone, and dust. A cushioned
  stool waits at the bench, worn to the shape of long sittings.
  Loupes and pliers hang from a rack within easy reach, and a
  velvet display cloth lies folded at the bench's corner,
  ready to be unrolled for a customer's inspection. The stair
  down returns to the Tannery floor below.
