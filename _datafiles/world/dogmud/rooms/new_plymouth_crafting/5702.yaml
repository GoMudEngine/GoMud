title: The Long Market — the Crossing
description: >
  The Long Market's main thoroughfare meets the Inkwalk
  lane here, and the intersection is busy with it — hand-
  carts loaded with incoming goods threading between foot-
  traffic, the air carrying both the market's working smell
  and a quieter drift of ink from the north. A painted
  <ansi fg="itemname">direction-board</ansi> stands on an
  iron post at the crossing's center, its arms lettered
  plainly for the quarter's main points. The <ansi fg="itemname">crossing-stones</ansi>
  around the post's base are worn to a shallow concavity
  from the weight of years of passage. The Long Market
  runs east into the stall-stretch and west toward the
  quieter end; the Inkwalk turns north.
