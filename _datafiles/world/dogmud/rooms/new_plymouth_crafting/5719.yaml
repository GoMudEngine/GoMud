title: The Abandoned Cooperage — Front
description: >
  The lane north of Craftwell Square ends at a cooper's
  building whose trade has closed. The front wall carries
  an <ansi fg="itemname">old-guild-mark</ansi> in faded
  paint beside the door — a stave and hammer, the cooper's
  symbol — and the door itself sits hung wrong on its
  upper hinge, the bottom edge dragging the threshold.
  A <ansi fg="itemname">hoop-rack</ansi> mounted to the
  outer wall still holds three iron barrel hoops on its
  pegs, left as if someone stepped away expecting to
  return and has not yet conceded that they will not.
  The window shutters are closed. The building sits in
  a particular stillness that is different from vacancy.
