nouns:
  old-guild-mark: Painted directly on the plaster beside
    the door — a barrel-stave crossed with a hammer.
    The paint is cracked and lifting, the original color
    a dark red that has gone to rust-brown. Below the
    mark, a date and a name have been painted in a
    smaller hand, but weather has reduced them to a year
    and the first letter of a name. The mark has not
    been removed, which is either because no one thought
    to or because someone decided they should not.
  hoop-rack: A bracket of iron pegs mounted to the wall
    at head height, with three iron barrel hoops hanging
    from separate pegs. The hoops are weathered to deep
    rust but structurally sound — they have been there
    long enough that the pegs have bent slightly under
    the weight. Two of the four mounting bolts have been
    replaced more recently than the others. Someone
    maintained this rack even after the workshop closed.
idlemessages:
- The front door shifts slightly in a gust, its broken
  hinge giving a soft scrape against the threshold.
- One of the barrel hoops on the rack sways and settles.
- The building is quiet — not the quiet of vacancy, but
  the quiet of a place that is waiting.
- A cat comes around from behind the building, looks
  at the front wall, and goes back the way it came.
- Passersby from the square tend to turn before reaching
  this point. The street here sees little foot-traffic.
