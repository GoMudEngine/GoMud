roomid: 5711
zone: New Plymouth Crafting
title: The Alchemist's Lab
description: >
  The alchemist's workshop is crammed to the ceiling
  with the working evidence of the craft. Tall <ansi fg="itemname">glassware-racks</ansi>
  line both long walls — retorts, flasks, connecting
  tubes in a system that looks improvised but functions
  — and the smell in here is complex and layered, burnt
  sulphur underneath, something sweet and chemical
  above, the warm amber note of the reagent-stone
  burner below everything. The <ansi fg="itemname">main-bench</ansi>
  runs the room's full center length, its surface
  scarred with heat marks and chemical stains in a
  palimpsest of past experiments, each zone of the
  bench informally demarcated by habit and long use.
  A narrow stair at the back wall leads to the rooms
  above; a door at the south opens to the service alley
  behind the building. To the north an archway breathes
  the hot mineral air of the glass kiln, and to the east
  the ring of the forge carries through the party wall.
  At the bench's center, a covered
  flask of something pale yellow is held at temperature
  on the reagent-stone burner — the work is ongoing.
  Pinned to the shelf-edge above it, a <ansi fg="itemname">consignment-slip</ansi>
  curls in the rising heat, marked for collection.
