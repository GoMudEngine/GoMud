nouns:
  glassware racks: Shelving of board-and-bracket
    construction, each shelf padded with cloth along
    the front edge against breakage from vibration.
    The glassware is in all stages of use — clean,
    dirty, mid-process with a cloudy residue at the
    bottom, set aside with a paper tab. Connecting
    tubes sealed at each joint with wax of different
    colors, a code that makes sense to the person who
    built it. Nothing here is decorative; all of it
    earns its shelf-space.
  main bench: A long workbench of heavy timber, the
    surface bearing years of chemical and heat work
    — pale rings where flasks stood, dark scorches
    from runaway heat, a long discoloration along
    the eastern third where something went wrong and
    was contained. The bench is wiped down regularly,
    which does not undo the stains but respects them.
    At the center, the reagent-stone burner sits on
    a heat-brick platform, flame low, maintaining
    the covered flask at a precise temperature.
  consignment slip: A standing-order slip in a clerk's
    neat hand, the kind a third party leaves when the
    payment is already settled. The reagent named is a
    refined extract; the quantity, a full case; the
    buyer, a cipher — no name, only a collection mark.
    In the margin, in a smaller hand and then half
    scratched out again, a single word remains legible
    — canal. Whoever wrote it did not set down where
    the goods truly go. Only where they suspected.
idlemessages:
- The reagent-stone burner gives off a low controlled
  heat and a faint sweet-chemical smell.
- Glass ticks somewhere in the rack as temperature
  shifts on a draft from the south door.
- The smell here has layers — you notice different
  notes depending on where in the room you stand.
- From the alley south, the sound of something set
  down heavily, then quiet.
- The stair at the back wall creaks once from above
  and then settles.
