title: The Porter's Yard
description: >
  A paved transit yard between the Long Market and the
  tannery district, used for staging and hand-off.
  Several <ansi fg="itemname">hand-carts</ansi> along the east
  wall wait without ownership — three of them, communal
  by long practice, in varying states of repair,
  available to whoever needs one and accountable to
  no one. Near the north entrance, a <ansi fg="itemname">tally-post</ansi>
  of painted timber carries this morning's chalk marks
  — consignment lines, delivery windows, quantities —
  in several different hands written over the remains
  of yesterday's entries, the chalk never fully cleaning.
  The yard stone is stained from years of wet goods
  set down here, and the smell coming down from the
  north is the tannery's, carried ahead of anyone
  walking up from the market. South, the Long Market's
  east end is a short walk.
