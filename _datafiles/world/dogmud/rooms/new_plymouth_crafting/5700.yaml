zone: New Plymouth Crafting
title: Bridge End
description: >
  The footbridge from the Docks deposits you onto a small
  flagged landing where the Crafting Quarter begins. Behind
  you the low stone <ansi fg="itemname">canal-span</ansi>
  crosses a narrow cut of still green water, its parapet
  worn smooth at hand-height from years of daily passage;
  ahead, the canal smell gives way to sawdust and linseed
  oil and the bright, clean edge of worked metal. A painted
  <ansi fg="itemname">ward-post</ansi> stands at the
  landing's north edge — rust-red and amber, the Crafting
  Quarter's colours — marking where the Docks jurisdiction
  ends and the guild streets begin. The lane opens north
  into the district proper.
