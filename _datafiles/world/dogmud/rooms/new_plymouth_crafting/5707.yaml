title: Above the Bookstall
description: >
  A low garret above the bookstall, the ceiling close
  enough to feel the weight of the roof-beams. The boards
  were used for something before they were used for living
  — dark stains along the north wall, a faint grid of
  ruled lines still visible on the floor beneath the
  current scatter of belongings. A tilted <ansi fg="itemname">writing-desk</ansi>
  occupies the best corner, angled to catch north light
  through a narrow window above it. A <ansi fg="itemname">lamp-bracket</ansi>
  is fixed to the wall at the desk's left side, its iron arm bent
  from long use into exactly the angle needed to swing
  a lamp over the work surface. Whatever happens here
  happens mostly at night, and in some volume.
