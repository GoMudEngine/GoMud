title: The Long Market — West End
description: >
  The Long Market quiets at its western end, trade thinning
  as the street narrows and the buildings press close on
  either side. A cooper's workshop occupies the ground
  floor to the north here — behind half-open shutters comes
  the muffled sound of a mallet on stave-wood, patient and
  even. The <ansi fg="itemname">street-gutter</ansi> runs
  grey today, carrying shavings and sawdust down from the
  workshops higher in the district. A <ansi fg="itemname">trade-board</ansi>
  is nailed to the cooper's wall, carrying the usual notices
  in uneven hand. To the west the lane runs on toward the
  canal-side buildings, though what lies that way is not yet
  open to you; east, the market returns to its full noise
  at the crossing.
