zone: New Plymouth Crafting
title: Above the Forge
description: >
  The room above the forge is warm through the floor
  as much as through the window — the hearth below
  heats the boards and the boards heat the room, and
  the smell of iron and coal-smoke rises with it. A
  rope-strung <ansi fg="itemname">bed-frame</ansi> takes
  up the north wall, made neatly in the efficient way
  of a small space, the wool blanket heavy and folded
  back. The south window looks down over the forge
  yard and the banked coals; someone has stood at
  this window in the morning more than once to check
  the state of yesterday's fire before going down. A
  growing collection of <ansi fg="itemname">tool-sketches</ansi>
  covers the east wall — charcoal on paper, each labeled
  with dimensions and material notes, the thinking of
  someone who works problems out on paper when they
  are not working them out at the anvil.
