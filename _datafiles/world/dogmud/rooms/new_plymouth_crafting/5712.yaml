nouns:
  reading table: A small table against the north wall
    below the window, its surface covered with pages
    and a working notebook. The handwriting in the
    notebook is compressed and regular — someone
    transcribing quickly without sacrificing precision.
    Annotations have been added in a different pen,
    and those annotations have their own annotations.
    The pages beside it appear to be references, some
    printed and some hand-copied, ordered in a way
    that only makes sense if you know what they are
    for.
  shelf by the bed: A plain shelf mounted at arm-reach
    beside the bed, holding a small collection of
    sealed glass vessels. Each is labeled in a hand
    identical to the notebook. One vessel holds a
    dark fluid kept flat, not moving when the shelf
    trembles. Another holds something amber, sealed
    with wax broken and re-sealed at least once. The
    shelf is old. The vessels are not. They have been
    moved here from somewhere more formal.
idlemessages:
- The chemical smell from below is faint but constant
  — it has settled into the grain of everything here.
- The window sash, cracked at the top, lets in a thin
  line of outside air that does not reach the bed.
- Light from the north window falls on the open
  notebook at a working angle.
- The floorboards carry the faint vibration of work
  at the bench in the lab below.
- The room is arranged by use rather than appearance
  — what is needed is within reach; the rest is not.
