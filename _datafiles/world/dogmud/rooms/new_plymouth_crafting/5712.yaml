zone: New Plymouth Crafting
title: Above the Lab
description: >
  The room above the alchemist's lab carries the smell
  of the work below — chemical traces filter up through
  the floorboards and have been absorbed by every
  surface. A <ansi fg="itemname">reading-table</ansi>
  in the north corner holds a lamp, a ledger open to
  a recent entry, and a tray of paper references in a
  hand that does not waste space on the page. The south
  window is cracked at the top — a permanent arrangement,
  apparently, to manage the air — and has faded at the
  upper sash differently from the lower where it never
  fully closes. A <ansi fg="itemname">shelf-by-the-bed</ansi>
  holds a small collection of sealed glass vessels,
  each labeled in the same careful hand as the ledger,
  arranged by some logic other than size or color. The
  room is functional; comfort has been adjusted around
  the work, not the reverse.
