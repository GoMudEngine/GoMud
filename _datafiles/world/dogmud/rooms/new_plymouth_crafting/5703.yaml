title: The Long Market — Artisan Stalls
description: >
  The stall-stretch is the busiest section of the Long
  Market — open-fronted workshops spill their displays
  onto trestle-tables along both sides of the street,
  and the noise and press of it is constant. Sea-import
  goods come up from the Docks most mornings; by midday
  the <ansi fg="itemname">stall-tables</ansi> hold a
  working mixture of raw materials and finished goods,
  priced in chalk on small boards and renegotiated
  constantly. Above the stalls, <ansi fg="itemname">canvas-awnings</ansi>
  in faded guild-stripes shade the merchandise and the
  buyers in equal measure, their ropes strung from
  bracket to bracket across the street. What is sold
  here today is different from last week and will be
  different again tomorrow — this is a market of
  process, not inventory.
