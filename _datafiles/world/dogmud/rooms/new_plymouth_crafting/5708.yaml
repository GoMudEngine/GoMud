roomid: 5708
zone: New Plymouth Crafting
title: Edvar's Shuttered Shop
description: >
  The west end of the Inkwalk terminates at a shopfront
  whose boards have been nailed across the windows and
  door with the thoroughness of someone who does not
  intend to return. Above the boards a painted <ansi fg="itemname">old-sign</ansi>
  still identifies the premises — a cartographer's compass-
  rose mark and a name, faded but legible. Through a gap
  where one board has warped from its nail, a dim interior
  is just visible — a <ansi fg="itemname">display-case</ansi>
  stands against the far wall, holding a row of pale
  objects that do not look like maps. The street here is
  quiet in a particular way, as if foot-traffic has learned
  to move around this building without quite deciding to.
