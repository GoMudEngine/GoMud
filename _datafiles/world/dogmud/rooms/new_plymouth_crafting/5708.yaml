nouns:
  old sign: A painted board above the boarded door, its
    colors bleached by weather but the forms still clear
    — a compass rose with eight points, rendered with a
    cartographer's precision, and below it in heavy
    lettering the name "Edvar" and a subtitle that time
    has reduced to the word "Surveys" and some other
    letters that are no longer letters. The compass rose
    carries a mark in its northwest quadrant that is not
    standard — a small symbol, possibly a glyph, possibly
    a maker's mark, possibly neither. The sign has been
    here long enough to belong to the building, which is
    not comforting.
  display case: Visible through the gap in the boards —
    a glass-topped display case standing against the back
    wall of the dim interior, its contents arranged in a
    row with a care that does not look like accident.
    Seven objects, each roughly palm-sized, pale in the
    bad light — the texture looks like stone, but the
    edges are too regular for natural stone, and the
    surface of each carries markings that might be
    scratched or might be carved. From here it is
    impossible to say more. The case has a lock on it.
    Dust has settled thick on the glass top; the objects
    inside are undisturbed.
idlemessages:
- The boarded door does not rattle in the wind the way
  boards do when they are just boards.
- Light moves across the gap in the planking as clouds
  pass overhead; the display-case inside catches it and
  holds it for a moment.
- From behind the wall, no sound at all. The silence
  has a quality of depth, as if the building contains
  more interior than the outside suggests.
- A cat crosses the shopfront at a wide angle, as if
  choosing not to go closer.
- The cartographer's sign rotates very slightly in a
  gust, the chain swinging once and settling. The
  compass rose points in all directions and none.
