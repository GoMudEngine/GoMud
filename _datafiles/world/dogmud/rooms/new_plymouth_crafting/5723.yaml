roomid: 5723
zone: New Plymouth Crafting
title: Tinpot Alley
description: >
  A narrow service passage behind the alchemist's lab,
  wide enough for a hand-cart and little else, ending
  at a timber wall with nothing behind it. The lab's
  back door opens here for deliveries and outbound
  stock, and a <ansi fg="itemname">lean-to</ansi> against
  the south face of the building provides the minimal
  shelter of someone who has been given just enough —
  a folding stool, a cup bleached by weather, the rest
  of it arrangement rather than comfort. Running both
  walls at shoulder height, <ansi fg="itemname">hook-strips</ansi>
  of tin and bent nails hold rope coils, empty reagent-
  frames, and a pair of leather gloves that have been
  forgotten for some time. The floor is uneven stone.
  The smell is the lab's chemical atmosphere diluted
  by the alley's open air — a thin version of what
  fills the workshop proper, still unmistakable.
