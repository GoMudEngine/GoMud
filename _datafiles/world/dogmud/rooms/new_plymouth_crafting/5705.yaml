nouns:
  stall-awnings: A run of narrow canvas panels mounted
    on wooden arms along the west side of the lane —
    an older style than the market's rope-hung awnings,
    and faded to the particular brown of canvas left out
    in weather for a decade or more. Under each, a
    different trade in text and image. A paper-seller.
    A copyist. An illuminator's shop with a small
    example piece hung in the window, the colors still
    precise in the shade.
  cobblestone-channel: A narrow groove running down the
    center of the lane, paved in smaller cobbles than
    the street surface to either side. It was laid,
    according to a faded notice at the south end, for
    drainage from the ink-works that once occupied the
    lane's full length. The works are gone — replaced
    by individual stalls — but the channel remains,
    dry now and serving as a visual seam down the middle
    of the Inkwalk. After heavy rain, someone says,
    it runs black.
idlemessages:
- The lane is quieter than the Long Market — voices
  here are kept moderate, which here passes for silence.
- A customer emerges from under one of the stall awnings
  with a wrapped parcel and holds it as if it matters.
- The smell of fresh ink is stronger today — someone is
  running a press somewhere close by.
- A loose page skips down the center channel in a small
  gust and catches against a step.
- From the west end of the lane, no sound at all. The
  shuttered building there absorbs what little noise
  reaches it.
