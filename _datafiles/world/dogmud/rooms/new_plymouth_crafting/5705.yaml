title: The Inkwalk
description: >
  A quieter lane turns north from the Long Market's
  crossing, where the trade in ink and paper settled long
  enough ago that the name stuck. The noise of the market
  drops away within a few steps — what reaches you here
  is the shuffle of pages, the smell of lamp-black ink
  and sizing, and the occasional murmur of someone
  reading aloud to verify a purchase. Low <ansi fg="itemname">stall-awnings</ansi>
  run along the west side of the lane, each one marking
  a small enterprise in ink or print. To the east,
  Orin's bookseller's stall projects slightly into the
  lane; to the west, a shuttered building with boards
  across the windows stands at the Inkwalk's end. A
  <ansi fg="itemname">cobblestone-channel</ansi> runs
  down the lane's center, dry now, laid when the
  ink-works here required drainage.
