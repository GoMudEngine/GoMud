roomid: 5716
zone: New Plymouth Crafting
title: Above the Tailor
description: >
  The room above the tailor's shop is small and used
  seriously. A <ansi fg="itemname">work-table</ansi>
  in the north corner doubles as a desk — lamp, ledger,
  and a tray of thread samples organized by color, the
  tray shallow so that nothing gets lost. The south
  window looks out over Craftwell Square; the view from
  the sill is of the well and the four converging lanes,
  which is the view of someone who lives in the middle
  of their own work. A <ansi fg="itemname">mending-basket</ansi>
  sits beside the bed, full of garments taken upstairs
  rather than back to the shop floor — the private side
  of the trade, where pieces too damaged or too personal
  for the bench get attention in the quiet hours. The
  room holds the smell of wool and sizing in its walls.
biome: city
