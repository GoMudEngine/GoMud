nouns:
  work-table: A narrow table set against the north wall
    below the window, used for close work and records
    both. The lamp is positioned to throw light across
    the left shoulder — the placement of someone who
    stitches by lamplight and is right-handed. The ledger
    beside it is open to a recent entry, the handwriting
    small and economical. Under the table, a box holds
    additional ledger volumes, the oldest at the back
    with faded spines.
  mending-basket: A deep wicker basket beside the bed
    holding garments at various stages of repair. This
    is not shop work — these are pieces brought up for
    attention during off-hours, below the threshold of
    formal commission. A pair of trousers half-restitched
    at the knee. A shirt with the collar being replaced.
    A child's coat folded at the bottom with a hem pin
    still in it. The basket fills at approximately the
    rate it empties.
idlemessages:
- The south window looks down onto Craftwell Square —
  the well and the converging lanes are visible.
- The ledger on the work-table is open. The most recent
  entries are in darker ink, written not long ago.
- From below — the sound of the cutting-bench being
  cleared, then quiet.
- The thread-sample tray catches the south window's
  light, each color distinct in the morning.
- The room holds the quiet of someone who spends their
  evenings doing the work that doesn't get done below.
