zone: New Plymouth Crafting
title: The Forge Yard
description: >
  A working blacksmith's yard opens west of Craftwell
  Square, proportioned to take the heat and noise of
  the trade. The <ansi fg="itemname">banked-forge</ansi>
  at the center is stone-built and low, its coals held
  at an orange glow — worked today and banked only for
  the midday pause, the tuyere pipe running below the
  yard floor to the bellows mount at the eastern face.
  Around the forge's base a dark ring of <ansi fg="itemname">forge-scale</ansi>
  has built up over years, flat and black as old leaves,
  and the yard stone is scorched in the pattern of long
  use. A narrow door on the outbuilding's north face
  leads to a stair; above, someone has made rooms in
  the space over the working floor. The heat coming
  off the coals is a constant low presence, filling
  the yard from center to wall.
