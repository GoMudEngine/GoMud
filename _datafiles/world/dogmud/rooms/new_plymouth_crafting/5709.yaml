nouns:
  banked-forge: A hearth of shaped firebrick and iron
    plate, open at the working face, flanked by the
    bellows mount. The brick is blackened to glassy
    in the hottest section. The current charge has been
    banked with ash across the top — a technique for
    holding temperature without burning fuel. The
    tuyere pipe runs below the floor; the stone around
    it is warm underfoot. This forge has not been cold
    in some time.
  forge-scale: Flakes and scale from metalwork that
    have built up in a dark ring around the forge base,
    accumulating over years of work. Flat and dull-dark,
    they scatter to the edges of the yard by degrees
    and pile against the walls. The fine black
    particulate from the forge's working has settled
    on every horizontal surface in the yard — thin
    enough to look like shadow until you run a finger
    across it.
idlemessages:
- The forge coals pulse orange in the banked center,
  a low thermal shimmer rising above the hearth.
- Metal cools somewhere in the yard — a faint tick as
  something settles in the heat and contracts.
- The smell of hot iron and quench-water hangs in the
  yard air even through the midday pause.
- From above, through the stair-door, the sound of
  movement on wooden boards — light and unhurried.
- Scale flakes near the forge edge catch the light
  flat and dark, blown there by the bellows exhaust.
