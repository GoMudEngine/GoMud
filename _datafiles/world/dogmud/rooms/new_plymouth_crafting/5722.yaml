roomid: 5722
zone: New Plymouth Crafting
title: Craftwell Square
description: >
  The craft quarter gathers at a public well where four
  lanes meet — forge to the west, tailor to the east,
  the Inkwalk turning south. The <ansi fg="itemname">well-housing</ansi>
  is old worked stone, the lip worn smooth by years of
  rope and hands; the bucket hangs free and the water
  is good and held in common. A <ansi fg="itemname">slate-bench</ansi>
  has been set into the nearest building's wall, long
  enough for three at rest, and in the working day it
  earns its place. Heat breathes from the forge yard
  to the west; from the east, on a shifting wind, the
  honest reek of the tannery arrives unmistakably. The
  square is not grand — a well, a bench, converging
  lanes — but it is the quarter's pause point, and
  pausing is what it is built for.
