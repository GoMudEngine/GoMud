roomid: 5721
zone: New Plymouth Crafting
title: The Boarded Cellar-Mouth
description: >
  A short passage off the cooperage floor ends at a
  descending stair-head, the opening filled floor to
  ceiling with planks. The <ansi fg="itemname">boarding</ansi>
  is heavy and cross-hatched, each layer of planks
  spiked in hard — the boards have been added to over
  time rather than replaced, as if each round of nails
  was someone's answer to a question the previous round
  had not settled. A <ansi fg="itemname">chalk-notice</ansi>
  chalked onto the topmost plank is old enough to have
  been renewed at least once. Below the boarding, a
  stair descends to a passage that once ran beneath
  the waterline into the Old Quarter — sealed from this
  side when the cellar took water and the way became
  more trouble than it was worth. The chalk says not
  to go down.
