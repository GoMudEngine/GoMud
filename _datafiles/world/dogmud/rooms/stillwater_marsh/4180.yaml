zone: Stillwater Marsh
title: Spring Pool
description: >
  The board-trail ends here at a ring of low
  <ansi fg="itemname">pilgrim-stones</ansi>, worn smooth at the top
  where hands have rested across more generations than the watermill
  below has existed. At the ring's centre the
  <ansi fg="itemname">spring-pool</ansi> rises from a
  <ansi fg="itemname">dark-fissure</ansi> in the stone bed — a small
  deep pool perhaps four paces across, the water rising clear and
  continuous from a vertical crack visible only as a deeper darkness
  below. The <ansi fg="itemname">cold-water</ansi> is a different order
  of cold from the marsh around it — aquifer-cold, numbing a hand
  within a count of ten — and the pool's surface stays so still that
  the sky reflects in it perfectly even when the reeds south of here
  are bending in wind. There is the same quality of quiet here that
  the oldest oaks carry in Fernway — not silence exactly, but a
  weight of time that makes ordinary noise seem rude.
