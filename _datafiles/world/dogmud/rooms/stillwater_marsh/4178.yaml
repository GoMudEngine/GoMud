nouns:
  cattail: |
    Tall cattails stand head-high on both sides of the trail,
    the brown sausage-shaped seed-heads ripe and splitting open
    in places — the silky down they release drifts slowly in
    any movement of air. Stillwater spinners work the down into
    thread for cold-weather cloak linings when the season brings
    enough of it.
  cattails: |
    Tall cattails stand head-high on both sides of the trail,
    the brown sausage-shaped seed-heads ripe and splitting open
    in places — the silky down they release drifts slowly in
    any movement of air. Stillwater spinners work the down into
    thread for cold-weather cloak linings when the season brings
    enough of it.
  cattail-down: |
    Drifts of soft cattail-down hang in the air at this time of
    season — released from split seed-heads and drifting slowly
    in any breath of wind. The tufts are fine and clinging; they
    settle on dark cloth and hair and do not brush free easily.
  lake-mint: |
    Patches of lake-mint grow at the verges where the cattails
    thin — low and persistent, the small leaves silver-green and
    pungent when crushed underfoot. The smell is sharp and clean
    against the background peat of the marsh.
  mud-track: |
    The board-trail gives over here to a packed-mud track,
    narrower and softer underfoot — the marsh swallows the boards
    if the millers do not replace them often enough, and this
    stretch has not seen new timber in some time.
idlemessages:
- a tuft of cattail-down drifts past at head-height
- ''
