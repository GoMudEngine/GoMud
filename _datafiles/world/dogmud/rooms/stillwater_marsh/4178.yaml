roomid: 4178
zone: Stillwater Marsh
title: Cattail Verge
description: >
  West of Marsh Track the board-trail narrows to a packed-mud
  track and the character of the marsh changes —
  <ansi fg="itemname">cattails</ansi> close in on both sides,
  standing head-high, their brown sausage-shaped seed-heads ripe
  and splitting where the season is furthest along. Tufts of
  <ansi fg="itemname">cattail-down</ansi> drift in the still air
  at eye-level, slow as cottonwood, settling on shoulders and
  hair. Where the <ansi fg="itemname">cattails</ansi> thin at the
  verges, ragged patches of <ansi fg="itemname">lake-mint</ansi>
  take hold — low and silver-green, releasing a sharp green smell
  with every step that crushes a leaf. The
  <ansi fg="itemname">mud-track</ansi> underfoot is darker and
  softer here than on the boards, the footing sound but yielding,
  and the peat-smell the marsh always carries is now joined by
  the pungency of the mint.
