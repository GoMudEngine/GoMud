roomid: 4189
zone: Stillwater Marsh
title: Sundew Hollow
description: >
  The marsh floor rises here to a low hollow of slightly drier
  peat — a <ansi fg="itemname">rim</ansi> of firm ground above
  the surrounding water, barely ankle-high but enough to keep
  the worst of the standing water out. The hollow's wet peat
  is colonized entirely by <ansi fg="itemname">sundews</ansi>
  — flat red-tinged rosettes the size of a coin, each leaf
  studded with <ansi fg="itemname">dewdrops</ansi> that sparkle
  in any light and are anything but gentle. Small insect bodies
  are visible stuck to the leaves all across the mat, each one
  in some slow stage of digestion. A network of small worn
  <ansi fg="itemname">rat-runs</ansi> leads in and out through
  the rim cover — marsh-rats, whose nests make use of the
  only dryish ground for thirty paces in any direction. The
  rats themselves stay out of sight but the runs show fresh
  use, the peat pressed firm where small feet have passed.
