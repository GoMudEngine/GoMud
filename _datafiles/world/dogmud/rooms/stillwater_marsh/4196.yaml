nouns:
  hidden spring: |
    A small clear spring rising silently in a pocket of
    bog-rim — perhaps a forearm deep at the source, the
    water visibly rising from a fissure in dark stone
    below. Cold and pure where the surrounding bog water
    is dark and acidic. The foragers fill their flasks
    here rather than at the black-pool.
  waxberry: |
    A low waxberry shrub at the spring's edge — small
    grey-blue waxy berries clustered at the branch-tips,
    edible and faintly sweet. A forager's reward for
    finding the pocket; the berries do not grow farther
    north in the wetter marsh.
  waxberries: |
    Low waxberry shrubs at the spring's edge — small
    grey-blue waxy berries clustered at the branch-tips,
    edible and faintly sweet. A forager's reward for
    finding the pocket; the berries do not grow farther
    north in the wetter marsh.
  bog myrtle: |
    A stand of bog-myrtle around the spring's edge,
    releasing a sweet aromatic smell when the leaves are
    brushed — used by the Stillwater brewer to flavour
    a particular season ale, and by the healer to ease
    the itching of bug-bites.
  pocket pool: |
    The small pool the spring forms at its source — perhaps
    two paces across at most, easy to miss in the reeds.
    Much smaller than the deeper Spring Pool to the north,
    and easier to overlook. The water is clear and still,
    the bottom visible as dark fissured stone.
idlemessages:
- a single bubble rises silently in the pocket-pool
