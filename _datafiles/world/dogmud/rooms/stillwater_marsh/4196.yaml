roomid: 4196
zone: Stillwater Marsh
title: Hidden Spring
description: >
  A small pocket south of Mossy Hummock where the bog-rim
  dips around a clear rising source — the
  <ansi fg="itemname">hidden-spring</ansi>, perhaps a
  forearm deep at the source, cold water rising visibly
  from a fissure in dark stone below the surface. The
  foragers know it; few others do. Low
  <ansi fg="itemname">waxberries</ansi> cluster at the
  rim in grey-blue bunches, faintly sweet, a small reward
  for anyone who finds the pocket. A stand of
  <ansi fg="itemname">bog-myrtle</ansi> surrounds the
  spring's edge, releasing a sweet aromatic smell when
  brushed that carries on even the lightest air — the
  Stillwater brewer uses the leaves in a particular
  season ale. The <ansi fg="itemname">pocket-pool</ansi>
  itself is small, perhaps two paces across at most,
  easy to walk past in the reeds if you do not know
  to look.
biome: water
