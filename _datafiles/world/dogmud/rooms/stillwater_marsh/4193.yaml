nouns:
  slate rim: |
    A low rim of dark flat slate-stones rising from the bog
    around the hollow — the only stone in this part of the
    marsh, weathered to a dull warm-grey. The stones hold
    heat well; on a clear afternoon they are noticeably
    warmer than the surrounding peat.
  slough skin: |
    A papery shed snake-skin on the stones — translucent
    and intricate, the scale-pattern visible in fine relief.
    Bog adder, moulted here in safety. Several seasons'
    worth lie scattered across the rim.
  slough skins: |
    Papery shed snake-skins on the stones — translucent
    and intricate, the scale-pattern visible in fine relief.
    Bog adder, moulted here in safety. Several seasons'
    worth lie scattered across the rim.
  bone pile: |
    Small bones scattered at the hollow's centre — rat
    ribs, frog skulls, the remains of the adder's hunting.
    Every bone is picked entirely clean. The pile has
    accumulated over a long time; the den has been in
    use for seasons.
  basking rock: |
    The largest flat slate stone in the rim, polished
    smooth by years of use — the adder's preferred
    sun-station. An oily sheen marks where the snake's
    scales have crossed it repeatedly. Approach the stone
    carefully.
  basking rocks: |
    The flat slate stones of the rim, the largest of which
    is polished smooth by years of use — the adder's
    preferred sun-station. An oily sheen marks where the
    snake's scales have crossed it repeatedly.
