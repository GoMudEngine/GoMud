roomid: 4193
zone: Stillwater Marsh
title: Adder Den
description: >
  A low hollow west of Dragonfly Glade where a rim of dark
  flat <ansi fg="itemname">slate-rim</ansi> stone rises from
  the bog, the only rock in this part of the marsh, holding
  warmth long after the surrounding water cools. The smell
  reaches you before anything else — a heavy reptile scent
  that sits low to the ground and does not dissipate. Shed
  <ansi fg="itemname">slough-skins</ansi> lie on the flat
  stones, translucent and papery, the fine scale-pattern of
  bog adder visible in relief. A scattered
  <ansi fg="itemname">bone-pile</ansi> at the hollow's
  centre marks the adder's hunting: small rat ribs, frog
  skulls, the remains of many meals picked entirely clean.
  The largest stone in the rim serves as a
  <ansi fg="itemname">basking-rock</ansi>, polished smooth
  by years of use and faintly oily where scales have passed
  over it again and again.
biome: water
