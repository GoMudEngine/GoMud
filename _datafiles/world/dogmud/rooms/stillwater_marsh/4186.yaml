zone: Stillwater Marsh
title: Clam Beds
description: >
  West of the otter bank the marsh shallows out entirely, the
  dark peat-water thinning to a hand's depth over pale
  <ansi fg="itemname">sand-bottom</ansi> — an unusual colour for
  the interior, fine and almost white, washed in over centuries
  from some upstream source. The
  <ansi fg="itemname">clam-beds</ansi> begin where the sand
  starts, the bottom dimpled all across with the small ridges of
  buried freshwater clams pressing up from below. Empty
  <ansi fg="itemname">clam-shells</ansi> lie at the bed's
  high-water edge in pale grey-blue drifts, the size of a
  thumbnail to the size of a palm. Three-toed
  <ansi fg="itemname">egret-track</ansi> crosses the wet sand
  near the southern edge, smaller and more delicate than the
  heron prints east — a snowy egret, working the shallows for
  small fish. This is the quietest corner of the marsh; the
  reeds do not reach this far west and the open sky is wide here.
