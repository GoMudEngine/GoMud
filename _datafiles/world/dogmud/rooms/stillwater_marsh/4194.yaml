nouns:
  bog: |
    True bog underfoot now — acidic, still, very different
    from the alkaline pond-marsh to the north. The plants
    here shift accordingly: cotton-grass, low cranberry,
    sphagnum dominant where the reeds thin out. The bog
    has its own smell, different from the marsh: darker
    and older.
  quaking ground: |
    The ground trembles slightly with every step — the bog
    is a thick floating mat of living plant matter over
    deeper water, and your weight moves the whole mat as
    one piece. Step too far from the firm edge and the
    mat could open. The foragers test ahead with a pole.
  acid water: |
    Tea-coloured water shows in every depression — strongly
    acidic from the sphagnum, undrinkable but famously
    preservative. Things lost in true bog do not rot; they
    survive for centuries, which is why the foragers are
    careful about what they drop here.
  sphagnum carpet: |
    Thick sphagnum-moss carpet covers the bog surface,
    deeper here than at the Mossy Hummock — bright green
    at the surface, darker and more compacted beneath,
    holding water like a saturated cloth. Step into it and
    cold water wells up around the boot.
