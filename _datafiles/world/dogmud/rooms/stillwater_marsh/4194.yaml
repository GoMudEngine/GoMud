zone: Stillwater Marsh
title: Bog Edge
description: >
  South of Dragonfly Glade the marsh shifts character
  without warning — the standing water gives way to
  <ansi fg="itemname">bog</ansi>, acidic and quaking, a
  different world underfoot from the open pond-marsh to
  the north. Every step on the
  <ansi fg="itemname">quaking-ground</ansi> sends a slight
  tremor through the living mat; the whole surface moves
  together as one piece. Water shows in every depression as
  a dark tea-coloured pool — the
  <ansi fg="itemname">acid-water</ansi> of true bog, stained
  by the sphagnum and undrinkable, famously preserving
  anything that sinks into it. A thick
  <ansi fg="itemname">sphagnum-carpet</ansi> dominates the
  ground in every direction, deeper and wetter than the
  moss at the hummock — bright green at the surface, darker
  beneath, holding water like a soaked cloth. The south
  carries a different air, somehow drier.
