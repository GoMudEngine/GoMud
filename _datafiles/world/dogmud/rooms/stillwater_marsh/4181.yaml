roomid: 4181
zone: Stillwater Marsh
title: Reed Beds
description: >
  The cattails fall away and the largest
  <ansi fg="itemname">reed-beds</ansi> in the zone take over
  entirely — an acre or more of head-high marsh-reed pressing
  in on the trail from every angle, green and yellow-green in
  alternating bands where old growth meets new. The
  <ansi fg="itemname">wind-rustle</ansi> is constant and loud
  here, a high continuous sound that fills the air whenever
  any breeze moves through, drowning out the subtler sounds
  of the marsh behind it. The
  <ansi fg="itemname">mud-bottom</ansi> below the track is
  soft enough that boots leave deep prints, and off the trail
  the ground disappears into standing water within a few paces
  — invisible beneath the reed stems. There is a
  <ansi fg="itemname">lost-feel</ansi> to this stretch; the
  visual sameness of the reed-wall in every direction makes
  the trail feel thinner than it is, and ten paces into the
  bed without a landmark would take considerable effort to
  undo.
