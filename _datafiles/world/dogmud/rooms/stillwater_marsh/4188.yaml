roomid: 4188
zone: Stillwater Marsh
title: Shrimp Shallows
description: >
  South of Heron Marsh the pond floor rises until the water is
  knee-deep and clear as glass — a wide stretch of
  <ansi fg="itemname">shallows</ansi> where the bottom shows as
  rippled pale sand between dark mats of
  <ansi fg="itemname">water-weeds</ansi>. Schools of
  <ansi fg="itemname">skitter-shrimp</ansi> move through the
  shallows in brief silver flashes, nearly invisible when still,
  bright when they scatter — their translucent shells catching
  light for a moment before they find new cover. Shed shells
  drift up from the sand and rock slowly on the surface. The
  foragers wade slowly here, harvesting the shells the shrimp
  leave behind after moulting. Sometimes the dark flat shape
  of a <ansi fg="itemname">turtle-shape</ansi> rests on the
  sand-bottom beneath the weeds — a snapping turtle that has
  learned the shrimp concentrate here, waiting with the patience
  particular to large reptiles.
