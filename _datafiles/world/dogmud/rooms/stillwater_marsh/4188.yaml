nouns:
  shallows: |
    Clear water perhaps knee-deep, extending in every direction
    from this hub of the marsh's lower row — the bottom visible
    as rippled pale sand interspersed with dark weed-mats. The
    shallows are warm in summer sun and full of life; in winter
    the water is bracingly cold and the shrimp slower.
  skitter shrimp: |
    Small translucent shrimp dart in flickering schools through
    the shallows — almost invisible in still water, briefly
    visible as silver flashes when they move. They moult
    regularly, leaving behind shed shells that the Stillwater
    foragers collect; the shells dry well and are traded east
    for use in dyes and medicines.
  turtle shape: |
    The dark flattened shape of a snapping turtle resting on
    the sand-bottom beneath the weed-mats — sometimes present,
    sometimes a tussock instead. Hard to distinguish from above
    until it moves, which it does without warning. The foragers
    wade carefully here and give the south edge a wide berth.
  water weed: |
    Strands of dark green water-weed grow in mats from the pale
    sand — shrimp hide here between forays, the snapping turtle
    stalks among them. The weed is slick underfoot and a reason
    to wade slowly.
  water weeds: |
    Strands of dark green water-weed grow in mats from the pale
    sand — shrimp hide here between forays, the snapping turtle
    stalks among them. The weed is slick underfoot and a reason
    to wade slowly.
