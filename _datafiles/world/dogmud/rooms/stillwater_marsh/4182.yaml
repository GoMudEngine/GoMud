roomid: 4182
zone: Stillwater Marsh
title: Willow Grove
description: >
  The trail ends here. Six or seven grey-barked
  <ansi fg="itemname">willows</ansi> form a small grove at the
  last piece of solid ground on this spur, their trunks leaning
  out over standing water at angles that suggest the ground
  beneath them has been settling for decades. The
  <ansi fg="itemname">willow-bark</ansi> is finely furrowed and
  greyish, bitter to the touch, the kind the Stillwater healer
  uses for her stronger pain-medicines. A
  <ansi fg="itemname">leaf-shimmer</ansi> moves through the
  canopy in any passing breeze — the willow leaves are narrow
  and silvery on their undersides, and when the wind finds them
  the whole grove flashes briefly pale before settling. The
  <ansi fg="itemname">trail-end</ansi> is unmarked; the last
  plank-foot is simply lost in the mud where the willows take
  over, and the air here is noticeably cooler than the open
  reed-beds behind — damper, stiller, with the faint green
  smell of wet bark. There is nothing further west you can
  reach today.
biome: water
