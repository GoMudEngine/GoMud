nouns:
  willow: |
    A grey-barked marsh-willow, its trunk leaning over the
    standing water at the grove's edge, the same species the
    Stillwater healer harvests for stronger pain-medicines than
    the common marsh herbs provide. The bark is finely furrowed
    and bitter to the tongue.
  willows: |
    Six or seven grey-barked marsh-willows form a small grove
    at the trail's end, leaning out over standing water at
    angles that suggest the ground beneath has been settling
    for decades. The same species the Stillwater healer
    harvests for stronger pain-medicines.
  willow-bark: |
    The bark is greyish and finely furrowed — bitter to the
    tongue and known to ease aches and reduce fevers when
    properly prepared. The healer in Stillwater pays well for
    a clean strip harvested at the right time of year.
  leaf-shimmer: |
    The willow leaves are narrow and silvery on their
    undersides; in any breeze the grove shimmers as the leaves
    turn, the canopy flashing briefly pale before the wind
    drops and the leaves settle green again.
  trail-end: |
    The trail simply ends here — the last plank-foot lost in
    the mud where the willows take over and nothing has bothered
    to walk further west. There is nothing west of here you can
    reach today.
idlemessages:
- willow-leaves shimmer briefly silver in a passing breeze
