roomid: 4191
zone: Stillwater Marsh
title: Mossy Hummock
description: >
  South of the Iron Seep the marsh lifts briefly into a
  <ansi fg="itemname">hummock</ansi> — a low mound of
  compressed peat rising a hand's height above the standing
  water, a few paces of dryish ground among the reeds.
  Thick <ansi fg="itemname">sphagnum-moss</ansi> carpets
  every surface, a vivid green underfoot after the dark
  water, soft and slightly spongy under the boot. Scattered
  across the moss are small dark
  <ansi fg="itemname">droppings</ansi> where the marsh-rats
  nest above the waterline — they have used this hummock for
  longer than anyone can say. A network of packed
  <ansi fg="itemname">rat-trails</ansi> leads away in every
  direction, tiny worn paths in the moss where small feet
  have gone back and forth through all weather.
