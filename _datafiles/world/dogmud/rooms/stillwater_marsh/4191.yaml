nouns:
  hummock: |
    A small raised mound of peat-and-moss perhaps twice a
    person's stride across, rising a hand's height above the
    surrounding water — the closest thing to dry ground in
    this part of the marsh. The peat underneath is old and
    firm; foragers sometimes eat lunch here to escape the
    water.
  sphagnum moss: |
    Bright green sphagnum moss carpets the hummock in every
    direction — soft enough to sit on, holding water like a
    sponge. Healers prize it for wound-dressing: it is
    naturally clean and its acidity discourages rot.
  droppings: |
    Small dark marsh-rat droppings scatter the hummock's
    surface — the rats nest here above the standing water,
    using the dry peat as a base between their runs into
    the surrounding marsh.
  rat trail: |
    A small worn path pressed into the sphagnum by
    countless small fast feet — the marsh-rats travel the
    same routes through the cover day after day until the
    paths are packed smooth.
  rat trails: |
    Small worn paths pressed into the sphagnum by countless
    small fast feet — the marsh-rats travel the same routes
    through the cover day after day until the paths are
    packed smooth.
idlemessages:
