roomid: 4185
zone: Stillwater Marsh
title: Otter Slide
description: >
  West of the open pond the bank steepens briefly, a short dark
  rise of peaty earth that is the only real elevation in the marsh
  interior. Worn smooth into the bank-face is an
  <ansi fg="itemname">otter-slide</ansi> — a polished groove of
  hard mud curving from the crest down into the water, used so
  often the surface has gone slick and dark. A thin
  <ansi fg="itemname">fur-musk</ansi> hangs around the slide-mouth,
  not unpleasant to those who know what they are smelling — river
  otter, distinctive and close. Wet
  <ansi fg="itemname">water-tracks</ansi> lead from the slide's
  lower end a few paces along the bank-edge, webbed prints pressed
  clear in the mud before vanishing into the water. Whether the
  otter is here or gone is something the tracks alone cannot settle.
