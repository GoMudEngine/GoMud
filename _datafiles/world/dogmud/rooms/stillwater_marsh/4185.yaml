nouns:
  otter slide: |
    A polished groove of hard mud curves from the bank-top down into
    the water — the otter's launching path, used so often the surface
    has gone slick and bright underneath. The slide is a body-length
    long, worn smooth by repeated use, the edges still soft and dark
    where the bank has not been compressed.
  bank: |
    A short steep bank of dark peaty earth — the only real elevation
    in the marsh interior here, perhaps a body's height above the
    water's surface. The peat holds the bank's shape well; the
    bank-face is firm underfoot where it has been packed by the
    otter's comings and goings.
  fur musk: |
    A thin musky animal smell hangs around the slide and the
    bank-mouth — river otter, a warm oily scent that catches in
    the throat briefly before the marsh-smell swallows it again.
    Not unpleasant to those who know it; unmistakable once you do.
  water track: |
    Wet paw-prints lead from the base of the slide a few paces
    along the bank-edge before disappearing into the water —
    webbed, four-toed, pressed clear in the soft mud. Fresh enough
    to show the individual toe-pads. The otter came through here
    recently.
  water tracks: |
    Wet paw-prints lead from the base of the slide a few paces
    along the bank-edge before disappearing into the water —
    webbed, four-toed, pressed clear in the soft mud. Fresh enough
    to show the individual toe-pads. The otter came through here
    recently.
