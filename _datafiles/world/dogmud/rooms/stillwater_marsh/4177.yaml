roomid: 4177
zone: Stillwater Marsh
title: Marsh Track
description: >
  West of the footbridge the cultivated edge of Stillwater falls
  away within a dozen paces, the plank-track of the bridge giving
  over to a <ansi fg="itemname">board-trail</ansi> of split cedar
  laid two-wide across soft ground. The planks sway a little underfoot
  and the gaps between them show dark <ansi fg="itemname">marsh-water</ansi>
  — peaty-brown, still, knee-deep at most — standing in every hollow
  off the trail's edges. Dense stands of
  <ansi fg="itemname">reeds</ansi> rise either side, their pale
  seed-heads barely moving in the southerly wind even as the smell
  of peat and cold wet earth arrives plainly on it. Somewhere east
  the <ansi fg="itemname">creek-sound</ansi> of the millstream
  continues — a familiar murmur that already feels farther away
  than it should.
