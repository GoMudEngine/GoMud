roomid: 4184
zone: Stillwater Marsh
title: Heron Marsh
description: >
  The reed-trails open suddenly into a wide shallow
  <ansi fg="itemname">open-pond</ansi> — thirty paces across, the
  water clear enough to see pale weed bowing on the bottom where
  the current barely moves. It is the first real open sky in the
  zone; the long sightlines feel strange after the closed trails
  east of here. Round grass
  <ansi fg="itemname">tussocks</ansi> rise from the shallows like
  small green islands, each one a private platform for whatever is
  using it. The <ansi fg="itemname">sky-reflection</ansi> on the
  pond's surface is near-perfect when the wind drops, clouds in
  the water indistinguishable from clouds above. A set of fresh
  three-toed <ansi fg="itemname">heron-track</ansi> marks the
  east mud edge — the grey heron works this pond, though whether
  it is here today is another matter.
