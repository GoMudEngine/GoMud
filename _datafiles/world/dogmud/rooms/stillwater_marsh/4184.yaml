nouns:
  reed trails: |
    The narrow trails through the reed-beds east of here — the same
    board-and-mud paths that brought you in through Cattail Bend.
    From the open pond they read as dark gaps in a wall of green,
    closing off any view back the way you came.
  open pond: |
    A wide shallow pond perhaps thirty paces across, the water
    clear enough to see the pale-weed mat on the bottom and small
    fish holding in the current. This is the first real open water
    in the zone — the cattails and reed-trails east of here leave
    no room for a view. The pond feeds west to where Otter Slide
    meets the bank and drains slowly south toward the Black Pool.
  tussock: |
    Round grass-tussocks rise from the pond's shallow bottom like
    small green islands — a heron's stalking ground, a frog's
    hideaway, a useful landmark when the reflection fools the eye.
    Each tussock is a tight knot of sedge-grass, the stems dense
    enough to stand on if you do not mind wet boots.
  tussocks: |
    Round grass-tussocks rise from the pond's shallow bottom like
    small green islands — a heron's stalking ground, a frog's
    hideaway, a useful landmark when the reflection fools the eye.
    Each tussock is a tight knot of sedge-grass, the stems dense
    enough to stand on if you do not mind wet boots.
  heron track: |
    Three-toed prints mark the soft mud at the pond's east edge,
    each toe pressed clean and deep — fresh enough they have not
    filled with water yet. The grey heron is a regular visitor
    here and fishes the shallows near the tussocks. Whether it
    is working the pond at this moment is a separate question.
  sky reflection: |
    When the wind drops the pond's surface becomes a near-perfect
    mirror — clouds in the water the same shade and shape as
    clouds above, the tussocks reflected upside-down between them.
    A passing reed-warbler moving across the surface belongs to two
    skies at once until a ripple breaks it apart.
idlemessages:
- a heron call drifts across the pond from somewhere unseen
