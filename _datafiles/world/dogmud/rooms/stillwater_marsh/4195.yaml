roomid: 4195
zone: Stillwater Marsh
title: Far Bog Heart
description: >
  The bog gives out entirely here. The quaking mat
  narrows to a band perhaps two paces wide and then the
  ground rises sharply onto a dry
  <ansi fg="itemname">upland-shoulder</ansi> — firm
  underfoot for the first time since the marshland entry,
  the change as abrupt as a threshold. Open sky replaces
  the close marsh canopy; the
  <ansi fg="itemname">pale-grass</ansi> of the steppe
  bends in a constant south wind, the same pale tan grass
  the Dustwalk shows in its drier stretches. The
  <ansi fg="itemname">south-horizon</ansi> is unbroken —
  treeless, windswept, a long pale line where upland
  grass meets sky. The Dustwalk is somewhere out there.
  You do not go that way today. Looking back north,
  the <ansi fg="itemname">marsh-edge</ansi> is immediate
  and dramatic: green wet bog stopping, dry pale grass
  beginning, a line the land has held for longer than
  Stillwater has stood.
biome: swamp
