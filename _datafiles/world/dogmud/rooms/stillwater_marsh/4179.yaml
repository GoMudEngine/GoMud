roomid: 4179
zone: Stillwater Marsh
title: Mill Creek Source
description: >
  The board-trail bends north along the creek's actual upstream reach,
  and here the water is different from the sluice pond below — narrower,
  no deeper than a hand's breadth in the channel, running clear and quick
  over a bed of <ansi fg="itemname">flat-stones</ansi> dark as old iron.
  The <ansi fg="itemname">shallow-creek</ansi> speaks steadily, a low
  riffling note against the marsh's general stillness. Along both banks
  <ansi fg="itemname">watercress</ansi> grows in dense low mats, the
  leaves pungent and peppery even from arm's length. The
  <ansi fg="itemname">peat-bank</ansi> on either side is springy
  underfoot where you step off the boards, holding the shape of a boot
  long after you've moved on. This is where the millstream begins — or
  near enough to it that the creek above barely deserves the name.
