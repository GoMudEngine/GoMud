roomid: 4190
zone: Stillwater Marsh
title: Black Pool
description: >
  North of the Clam Beds the marsh floor drops without warning
  into a small deep hollow — the <ansi fg="itemname">black-pool</ansi>,
  perhaps three paces across, its <ansi fg="itemname">dark-water</ansi>
  the colour of strong tea and its bottom invisible regardless of
  the light above. Cool air rises off the surface even in summer,
  a degree or two colder than the surrounding marsh. The
  <ansi fg="itemname">peat-rim</ansi> at the pool's edge is thick
  and soft — foragers work it from the rim with long poles, reaching
  down to where they believe the bottom to be. Somewhere in the
  depths there is a <ansi fg="itemname">mussel-bed</ansi>, visible
  only as a darker patch in the dark water when the angle is right —
  the particular freshwater mussels that occasionally produce the
  Stillwater black pearl, rare enough that a single find changes a
  forager's season entirely.
