nouns:
  bend: |
    The trail makes a sharp swing west here, pressed around a dense
    stand of cattails that extends too far into the water to go
    straight. From the bend you can see the open water of Heron
    Marsh just a short distance west, the first real widening in
    the zone.
  cattail: |
    A second stand of cattails here, less uniform than the Cattail
    Verge to the north — the seed-heads are older and many have
    already split, shedding white fluff that settles on the trail
    and on the water's surface in small drifts. The stalks are
    shorter here, knee-to-waist height rather than head-high.
  cattails: |
    A second stand of cattails here, less uniform than the Cattail
    Verge to the north — the seed-heads are older and many have
    already split, shedding white fluff that settles on the trail
    and on the water's surface in small drifts. The stalks are
    shorter here, knee-to-waist height rather than head-high.
  frog-spawn: |
    Two shallow pools off the trail's east edge hold overlapping
    masses of frog-spawn — clear jelly dimpled with dark spots,
    dozens of egg-masses piled together in the still water. The
    bullfrogs have been busy this season; the pools are thick with
    it, and the smell is faintly sweet and faintly wrong.
  trail-board: |
    The boards at the bend are the oldest section of the boardwalk
    — pale and warped, replaced piece by piece over the years when
    they rotted through. One end has lifted from the peat underneath,
    rocking slightly underfoot, but the plank itself holds.
