roomid: 4183
zone: Stillwater Marsh
title: Cattail Bend
description: >
  South of Marsh Track the <ansi fg="itemname">board-trail</ansi>
  swings sharply west here, forced around a dense stand of
  <ansi fg="itemname">cattails</ansi> whose seed-heads are already
  breaking open — white fluff drifting low across the planks in
  any breath of air. The air is heavier here than at the entry,
  closer and wetter, as though the marsh has been holding it still
  all morning. Off the trail's east edge a pair of shallow
  <ansi fg="itemname">frog-spawn</ansi> pools sit motionless in
  the peat-shadow, the jelly mass so thick it almost crowds the
  surface. The <ansi fg="itemname">trail-boards</ansi> at the
  bend are older than those north of here — warped and pale,
  lifted a finger's breadth at one end where the peat has
  shifted under them, but still sound enough to cross.
