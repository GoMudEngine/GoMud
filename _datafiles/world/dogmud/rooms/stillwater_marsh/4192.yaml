roomid: 4192
zone: Stillwater Marsh
title: Dragonfly Glade
description: >
  A small open clearing in the marsh where the reeds pull
  back around a still shallow pool, leaving a pocket of
  open air above dark water. The pocket belongs to the
  <ansi fg="itemname">dragonflies</ansi> — more here than
  anywhere else in the marsh, hunting in constant low
  arcs over the surface, their wings carrying a continuous
  fine buzz that underlies everything else. The
  <ansi fg="itemname">iridescence</ansi> of their bodies
  catches whatever light filters through the clouds above:
  metallic blue, copper, dark green, shifting angle to
  angle. They work the <ansi fg="itemname">hunt-pool</ansi>
  as precise territory, intercepting anything small that
  crosses the open water. The
  <ansi fg="itemname">mosquito-thinning</ansi> is immediate
  and noticeable — the biting is lighter here than anywhere
  else in the zone, a welcome relief.
