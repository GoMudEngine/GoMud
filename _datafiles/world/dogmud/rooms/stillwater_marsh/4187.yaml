roomid: 4187
zone: Stillwater Marsh
title: Iron Seep
description: >
  South of Cattail Bend the marsh narrows to a single broad
  <ansi fg="itemname">iron-seep</ansi> — water rising slow and
  cold from the peat, spreading across the rock shelf before
  draining south. The air carries a faint iron-tang here, the
  same smell as a freshly-worked forge but cooler and lower to
  the ground. Dark heavy <ansi fg="itemname">lake-iron</ansi>
  nodules cluster on the seep's bottom like dark beads scattered
  by a careless hand, visible through the thin sheet of water
  above them. Every stone the seep has touched bears a stripe of
  <ansi fg="itemname">rust-stains</ansi> — orange fading to brown,
  strong enough to identify the seep's reach from a distance.
  The <ansi fg="itemname">mineral-water</ansi> itself is clear
  enough to drink but leaves the inside of a flask the colour of
  old blood; the foragers say small amounts do no harm.
