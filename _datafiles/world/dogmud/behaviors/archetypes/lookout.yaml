# lookout archetype
#
# Stationed watcher. When a packmate is hurt or the lookout itself is
# hurt, it first calls for help — bringing in packmates from adjacent
# rooms via the callforhelp command — and then engages the attacker
# via the existing attack action (which reads ctx.Event.UserId and
# sets Aggro).
#
# Example users: bandit scouts watching the road, city watch sentries,
# posted guards. Distinguished from `generic_fighter` by the
# callforhelp-first behavior.
#
# Spec: docs/superpowers/specs/2026-04-22-pack-tactics-revamp-design.md

tree:
  type: selector
  children:
    # NEW: panic-flee at critical HP (absorbs the inline tactic
    # `health_below:25 → flee` from chunk 2.6 migration).
    - type: sequence
      event: mob_hurt
      children:
        - type: condition
          check: mob_health_below
          percent: 25
        - type: action
          do: flee

    # NEW (chunk 2.8): early-warning scan on idle. If a hostile is
    # sighted in an adjacent room, set SoftTarget and call for help
    # before they walk in.
    - type: sequence
      event: mob_idle
      children:
        - type: action
          do: try_scan
          hostile_only: true
        - type: action
          do: command
          cmd: callforhelp

    # NEW: ambush only if I outmatch the entering player.
    # target_power_ratio_above: self_power / target_power > value.
    # value=1.0 means self is strictly stronger than target.
    - type: sequence
      event: player_enter
      children:
        - type: condition
          check: target_power_ratio_above
          value: 1.0
        - type: action
          do: attack

    - type: sequence
      event: packmate_hurt
      children:
        - type: action
          do: command
          cmd: callforhelp
        - type: action
          do: attack

    - type: sequence
      event: mob_hurt
      children:
        - type: action
          do: command
          cmd: callforhelp
        - type: action
          do: attack

    # ── heard_callforhelp: when a packmate in an adjacent room calls
    #    for help, the lookout navigates toward them.
    - type: action
      event: heard_callforhelp
      do: go_to_caller_room

    # chunk 4.4: strategic goal pursuit (after patrol/callforhelp step)
    - type: action
      event: mob_idle
      do: try_goal_planner

default_goals:
  - type: survival
    priority: 80
