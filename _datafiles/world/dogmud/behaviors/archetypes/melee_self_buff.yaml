# melee_self_buff archetype
#
# A melee specialist who maintains self-buffs first, attacks otherwise.
# Reused by vampire, air elemental, fire elemental, plus any future
# melee-specialist mobs that opt in via behavior_archetype: melee_self_buff
# on their mob YAML.
#
# On packmate_hurt (a same-room routine-matched packmate was attacked):
#   engage the attacker via the existing attack action (sets Aggro from
#   ctx.Event.UserId). Self-buffs fire on the next mob_combat_round.
#
# Decision flow per mob_combat_round:
#   1. Try to cast the best self_offense buff (highest base_folds × cost)
#      that isn't already active and the mob can afford
#   2. Fall through: try self_defense
#   3. Fall through: selector fails -> engine reports handled=false ->
#      the legacy combat loop runs its combatcommands/attack this round
#
# The cast_best_in_category action self-gates on the shared special-move
# cooldown, so the mob naturally alternates between cast rounds and
# attack rounds instead of trying to cast every round.

tree:
  type: selector
  children:
    # ── packmate_hurt: engage the attacker ───────────────────────
    - type: action
      event: packmate_hurt
      do: attack

    # ── mob_combat_round: original cascade (unchanged) ───────────
    - type: selector
      event: mob_combat_round
      children:
        - type: action
          do: cast_best_in_category
          category: self_offense
          target: self

        - type: action
          do: cast_best_in_category
          category: self_defense
          target: self

default_goals:
  - type: survival
    priority: 80
