# leader archetype
#
# Pack leader. On packmate_hurt or mob_hurt, rally or warcry to buff
# packmates (command_best_of fires the first ready one — CommandIsReady
# skips if the buff is already active), then engage the attacker via
# the existing attack action.
#
# Shares most offensive intent with tank_taunter but without the
# signature taunt — a leader commands support rather than drawing
# focus themselves.
#
# Applies to bandit chiefs, wolf alphas, sergeant-style mobs.
#
# Spec: docs/superpowers/specs/2026-04-22-pack-tactics-revamp-design.md

tree:
  type: selector
  children:
    # NEW: panic-flee at critical HP (absorbs the inline tactic
    # `health_below:25 → flee` from chunk 2.6 migration).
    - type: sequence
      event: mob_hurt
      children:
        - type: condition
          check: mob_health_below
          percent: 25
        - type: action
          do: flee

    - type: sequence
      event: packmate_hurt
      children:
        - type: action
          do: command_best_of
          cmds: [rally, warcry]
        - type: action
          do: attack

    - type: sequence
      event: mob_hurt
      children:
        - type: action
          do: command_best_of
          cmds: [rally, warcry]
        - type: action
          do: attack

    # NEW (chunk 2.8): chase a fleeing target via active tracking.
    # When aggro target is no longer in the room, the scan/track
    # chain finds them in adjacent rooms and follows. The
    # mob_is_tracking gate keeps the chase alive across ticks.
    - type: sequence
      event: mob_idle
      children:
        - type: action
          do: try_scan
          hostile_only: true
        - type: action
          do: try_track
          target_from: soft_target
        - type: action
          do: move_toward_tracked

    - type: sequence
      event: mob_idle
      children:
        - type: condition
          check: mob_is_tracking
        - type: action
          do: move_toward_tracked
