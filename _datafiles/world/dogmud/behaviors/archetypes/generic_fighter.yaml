tree:
  type: selector
  children:
  - type: sequence
    event: mob_hurt
    children:
    - type: condition
      check: mob_health_below
      percent: 25
    - type: action
      do: flee
  - type: action
    event: packmate_hurt
    do: attack
  - type: action
    event: heard_callforhelp
    do: go_to_caller_room
  - type: selector
    event: mob_combat_round
    children:
    - type: action
      do: try_special_move
    - type: sequence
      children:
      - type: condition
        check: target_is_casting
      - type: action
        do: command_best_of
        cmds: bash,trip
    - type: sequence
      children:
      - type: condition
        check: target_not_standing
      - type: action
        do: command_best_of
        cmds: kick
    - type: action
      do: command_best_of
      cmds: bash
    - type: sequence
      children:
      - type: decorator
        mod: invert
        child:
          type: condition
          check: multiple_enemies
      - type: action
        do: command_best_of
        cmds: grapple
    - type: action
      do: command_best_of
      cmds: trip
  - type: action
    event: mob_idle
    do: try_goal_planner
default_goals:
- type: survival
  priority: 80
