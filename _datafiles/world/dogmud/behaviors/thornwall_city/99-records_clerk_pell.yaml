# Records Clerk Pell — Behavior Tree
# Handles: player_give for Quest 6 (bridge report) and Quest 9
# (tithe ledger redirect to Olen).
# Pell accepts item 31 for Q6, redirects item 29 to Olen for Q9.
# All conversation handled by dialogue YAML.

tree:
  type: selector
  children:

    # ── GIVE: bridge report (item 31), Q6 active — file it ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: item_matches
          item_id: 31
        - type: condition
          check: player_has_quest
          quest: "6-start"
        - type: condition
          check: player_missing_quest
          quest: "6-report"
        - type: action
          do: say
          text: A maintenance report from the bridge keeper at Watchers Crossing. Let me see that.
        - type: action
          do: say
          text: >-
            Damage assessments, repair projections... this is thorough.
            I will file it with the magistrate. Reference number 4-7-12-B.
            Return to Harn and tell him it has been filed.
        - type: action
          do: grant_quest
          quest: "6-report"

    # ── GIVE: bridge report (item 31), already filed ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: item_matches
          item_id: 31
        - type: condition
          check: player_has_quest
          quest: "6-report"
        - type: action
          do: say
          text: The report has already been filed. Reference number 4-7-12-B.
        - type: action
          do: return_item

    # ── GIVE: bridge report (item 31), no active quest ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: item_matches
          item_id: 31
        - type: action
          do: say
          text: I do not accept unsolicited documents. File a request first.
        - type: action
          do: return_item

    # ── GIVE: tithe ledger (item 29), Q9 active — redirect to Olen ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: item_matches
          item_id: 29
        - type: condition
          check: player_has_quest
          quest: "9-start"
        - type: condition
          check: player_missing_quest
          quest: "9-end"
        - type: action
          do: say
          text: The tithe ledger? I filed the copy. This is the original.
        - type: action
          do: say
          text: >-
            I am a clerk, not an auditor. Take it to Priest Olen at the
            temple -- he is the one who requested the investigation.
            He needs to see these numbers, not me.
        - type: action
          do: return_item

    # ── GIVE: tithe ledger (item 29), no Q9 — reject ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: item_matches
          item_id: 29
        - type: action
          do: say
          text: A tithe ledger? I have no open request for this. File a form first.
        - type: action
          do: return_item

    # ── GIVE: any other item — bureaucratic rejection ──
    - type: sequence
      event: player_give
      children:
        - type: action
          do: say
          text: >-
            If you need something filed, state its purpose.
            I do not accept random documents.
        - type: action
          do: return_item
