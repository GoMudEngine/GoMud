# The Awakening Pool (5200) — movement gate for the un-Opened.
#
# A player without quest token 30-end cannot leave this room: every
# movement command is intercepted and answers with the exact next step.
# This is the hard floor of the newbie funnel — no reading, no luck,
# no timing required; the only way forward IS the taught command.
# Opened players (30-end) pass through completely untouched.
#
# Narrator text (send_user_text), not mob_say: the block must hold even
# in the freak case Hadwen is absent, and the pool itself doing the
# holding is true to the room.
#
# NOTE for cutover (chunk 10): every pre-existing character lacks
# 30-end, so veterans entering the coulee would be trapped here until
# they do the rite once. Cutover must ship a migration granting 30-end
# (lore: anyone with mutations is already Opened) — tracked in the
# build plan.

tree:
  type: selector
  children:

    # ── BLOCK MOVEMENT: the un-Opened stay at the pool ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [north, south, east, west, n, s, e, w, up, down, u, d, go]
        - type: condition
          check: player_missing_quest
          quest: "30-end"
        - type: action
          do: send_user_text
          text: >-
            The pool's stillness holds you where you stand -- not
            unkindly, the way a hand on a shoulder holds. The rite
            comes first. Say <ansi fg="command">ask hadwen begin</ansi>
            when you are ready, and the whole coulee opens with you.
        - type: action
          do: intercept
