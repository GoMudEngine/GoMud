# Market Street — Room 108
# Merchant Adela (mob 63) teaches buy/sell/inventory/equip.
# Sub-steps: shopping_arrive -> shopping_buy -> shopping_equip

tree:
  type: selector
  children:

    # ── ROOM ENTER: first arrival after mutation step ──
    - type: sequence
      event: room_enter
      children:
        - type: condition
          check: player_has_quest
          quest: "1-mutation"
        - type: condition
          check: player_missing_quest
          quest: "1-shopping_arrive"
        - type: condition
          check: mob_in_room
          mob_id: 63
        - type: action
          do: mob_emote
          mob_id: 63
          text: looks up from the counter as you approach.
          delay: 1.0
        - type: action
          do: mob_say
          mob_id: 63
          text: New arrival. Good. Let me show you how this works.
          delay: 2.0
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            Type <ansi fg="command">list</ansi> to see what I carry.
            Every merchant in Gaius uses the same command.
          delay: 3.5
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            When you find something you want, type
            <ansi fg="command">buy [item name]</ansi>. You can buy
            a sharp stick for three gold, a cotton shirt for three,
            or a small red potion for five.
          delay: 5.5
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            The Academy gave you a small stipend when you arrived.
            It should cover at least one purchase.
          delay: 7.0
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            Go ahead. Type <ansi fg="command">list</ansi>, then
            <ansi fg="command">buy</ansi> something.
          delay: 8.5
        - type: action
          do: grant_quest
          quest: "1-shopping_arrive"

    # ── ROOM COMMAND: buy detected ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [buy]
        - type: condition
          check: player_has_quest
          quest: "1-shopping_arrive"
        - type: condition
          check: player_missing_quest
          quest: "1-shopping_buy"
        - type: condition
          check: mob_in_room
          mob_id: 63
        - type: action
          do: mob_say
          mob_id: 63
          text: Good choice. Now put it to use.
          delay: 0.5
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            Type <ansi fg="command">inventory</ansi> -- or just
            <ansi fg="command">i</ansi> -- to see what you are
            carrying.
          delay: 2.0
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            Weapons: type <ansi fg="command">wield [weapon]</ansi>.
            Armor and clothing: type
            <ansi fg="command">wear [item]</ansi>. To take
            something off, type
            <ansi fg="command">remove [item]</ansi>.
          delay: 3.5
        - type: action
          do: mob_say
          mob_id: 63
          text: Go ahead. Equip what you bought.
          delay: 5.0
        - type: action
          do: grant_quest
          quest: "1-shopping_buy"

    # ── ROOM COMMAND: equip/wield/wear detected ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [equip, wield, wear]
        - type: condition
          check: player_has_quest
          quest: "1-shopping_buy"
        - type: condition
          check: player_missing_quest
          quest: "1-shopping_equip"
        - type: condition
          check: mob_in_room
          mob_id: 63
        - type: action
          do: mob_say
          mob_id: 63
          text: That is commerce. Simple enough.
          delay: 0.5
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            I also buy things. If you have something you do not
            need, type <ansi fg="command">sell [item]</ansi> while
            you are here.
          delay: 2.0
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            One more thing: type <ansi fg="command">status</ansi>
            to see your full character sheet -- stats, health,
            stamina, everything.
          delay: 3.5
        - type: action
          do: mob_say
          mob_id: 63
          text: >-
            The Combat Trainer is in the Training Yard. From Town
            Square, go north then east.
          delay: 5.0
        - type: action
          do: grant_quest
          quest: "1-shopping_equip"

    # ── ROOM COMMAND: talk ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [talk]
        - type: condition
          check: mob_in_room
          mob_id: 63
        - type: selector
          children:
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-shopping_buy"
                - type: condition
                  check: player_missing_quest
                  quest: "1-shopping_equip"
                - type: action
                  do: mob_say
                  mob_id: 63
                  text: >-
                    You bought it. Now put it on. Type
                    <ansi fg="command">wield [weapon]</ansi> or
                    <ansi fg="command">wear [armor]</ansi>.
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-shopping_arrive"
                - type: condition
                  check: player_missing_quest
                  quest: "1-shopping_buy"
                - type: action
                  do: mob_say
                  mob_id: 63
                  text: >-
                    Type <ansi fg="command">list</ansi> to see what
                    I have, then
                    <ansi fg="command">buy [item]</ansi>.
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-shopping_equip"
                - type: action
                  do: mob_say
                  mob_id: 63
                  text: >-
                    Need something? Type
                    <ansi fg="command">list</ansi> to see what I
                    have.
            - type: action
              do: mob_say
              mob_id: 63
              text: >-
                Come back after you have spoken with the Priest in
                the Academy Hall.
