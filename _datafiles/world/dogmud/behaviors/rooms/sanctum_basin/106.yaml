# West Meadow — Room 106
# Wilderness Guide Fen (mob 54) teaches foraging and tracking.
# Sub-steps: wilderness_arrive -> wilderness_forage -> wilderness_track

tree:
  type: selector
  children:

    # ── ROOM ENTER: first arrival after alchemy trial ──
    - type: sequence
      event: room_enter
      children:
        - type: condition
          check: player_has_quest
          quest: "1-alchemy_craft"
        - type: condition
          check: player_missing_quest
          quest: "1-wilderness_arrive"
        - type: condition
          check: mob_in_room
          mob_id: 54
        - type: action
          do: mob_emote
          mob_id: 54
          text: straightens up from examining a patch of scrub.
          delay: 1.0
        - type: action
          do: mob_say
          mob_id: 54
          text: >-
            Survival in the open country is about reading what is
            already there.
          delay: 2.0
        - type: action
          do: mob_say
          mob_id: 54
          text: >-
            You do not fight the desert. You learn its logic. Water
            collects where the basalt dips. Shelter is where the
            largest outcrops cluster.
          delay: 3.5
        - type: action
          do: mob_say
          mob_id: 54
          text: >-
            The grey-green brush here -- desert sage. Edible,
            medicinal if prepared correctly.
          delay: 5.0
        - type: action
          do: mob_say
          mob_id: 54
          text: >-
            Try it now. Type <ansi fg="command">forage</ansi> and
            the land will give you what it has.
          delay: 6.5
        - type: action
          do: grant_quest
          quest: "1-wilderness_arrive"

    # ── ROOM COMMAND: forage attempt ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [forage]
        - type: condition
          check: player_has_quest
          quest: "1-wilderness_arrive"
        - type: condition
          check: player_missing_quest
          quest: "1-wilderness_forage"
        - type: condition
          check: mob_in_room
          mob_id: 54
        - type: action
          do: mob_emote
          mob_id: 54
          text: nods once.
          delay: 0.5
        - type: action
          do: mob_say
          mob_id: 54
          text: Good. Not always much -- but something.
          delay: 1.5
        - type: action
          do: mob_say
          mob_id: 54
          text: >-
            Tracking is the same principle. Something passed here.
            The ground tells you when, how heavy, and how fast, if
            you know the language.
          delay: 3.0
        - type: action
          do: mob_say
          mob_id: 54
          text: >-
            Type <ansi fg="command">track</ansi> to read it.
          delay: 4.5
        - type: action
          do: grant_quest
          quest: "1-wilderness_forage"

    # ── ROOM COMMAND: track attempt ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [track]
        - type: condition
          check: player_has_quest
          quest: "1-wilderness_forage"
        - type: condition
          check: player_missing_quest
          quest: "1-wilderness_track"
        - type: condition
          check: mob_in_room
          mob_id: 54
        - type: action
          do: mob_emote
          mob_id: 54
          text: studies you for a moment, then nods.
          delay: 0.5
        - type: action
          do: mob_say
          mob_id: 54
          text: You are reading it. That is the start.
          delay: 1.5
        - type: action
          do: mob_say
          mob_id: 54
          text: >-
            One more thing. In the open, being seen is a choice.
            Type <ansi fg="command">sneak</ansi> before you move
            and you become harder to notice.
          delay: 3.0
        - type: action
          do: mob_say
          mob_id: 54
          text: >-
            The Elder is above the Alchemist, at the Observatory.
            Go.
          delay: 4.5
        - type: action
          do: grant_quest
          quest: "1-wilderness_track"

    # ── ROOM COMMAND: talk ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [talk]
        - type: condition
          check: mob_in_room
          mob_id: 54
        - type: selector
          children:
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-wilderness_forage"
                - type: condition
                  check: player_missing_quest
                  quest: "1-wilderness_track"
                - type: action
                  do: mob_say
                  mob_id: 54
                  text: >-
                    Something passed through here. Type
                    <ansi fg="command">track</ansi> to read it.
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-wilderness_arrive"
                - type: condition
                  check: player_missing_quest
                  quest: "1-wilderness_forage"
                - type: action
                  do: mob_say
                  mob_id: 54
                  text: >-
                    The land has something for you. Type
                    <ansi fg="command">forage</ansi>.
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-wilderness_track"
                - type: action
                  do: mob_say
                  mob_id: 54
                  text: >-
                    The Elder is waiting at the Observatory. North
                    through the Alchemist, then up.
            - type: action
              do: mob_say
              mob_id: 54
              text: Come back when the Alchemist has spoken with you.
