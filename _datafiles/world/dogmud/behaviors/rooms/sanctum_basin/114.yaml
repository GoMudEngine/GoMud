# Training Yard — Room 114
# Combat Trainer (mob 51) gives combat instruction.
# Sub-steps: combat_arrive -> combat_defeat
# Quest advancement on dummy death is handled in
# behaviors/tutorial/58-training_dummy.yaml (mob_die event).

tree:
  type: selector
  children:

    # ── ROOM ENTER: first arrival after equip step ──
    - type: sequence
      event: room_enter
      children:
        - type: condition
          check: player_has_quest
          quest: "1-shopping_equip"
        - type: condition
          check: player_missing_quest
          quest: "1-combat_arrive"
        - type: condition
          check: mob_in_room
          mob_id: 51
        - type: action
          do: mob_say
          mob_id: 51
          text: You are here for combat training.
          delay: 1.0
        - type: action
          do: mob_say
          mob_id: 51
          text: >-
            The fundamentals are simple: close distance, maintain
            balance, apply force. Everything else is variation.
          delay: 2.5
        - type: action
          do: mob_say
          mob_id: 51
          text: >-
            The training dummy is an easy opponent. It will not
            overwhelm you.
          delay: 4.0
        - type: action
          do: mob_say
          mob_id: 51
          text: >-
            Defeat it. Use
            <ansi fg="command">attack dummy</ansi> to start the
            fight. Do not stop until it falls.
          delay: 5.5
        - type: action
          do: mob_emote
          mob_id: 51
          text: watches with arms folded, the faintest smile on their face.
          delay: 6.5
        - type: action
          do: grant_quest
          quest: "1-combat_arrive"

    # ── ROOM IDLE: dummy is taking damage — trainer comments once ──
    - type: sequence
      event: room_idle
      children:
        - type: condition
          check: players_in_room
        - type: condition
          check: mob_in_room
          mob_id: 65
        - type: condition
          check: state_equals
          key: trainer_commented
          value: ""
        - type: condition
          check: mob_in_room
          mob_id: 51
        - type: decorator
          mod: random
          percent: 40
          child:
            type: sequence
            children:
              - type: action
                do: mob_emote
                mob_id: 51
                text: lets out a short laugh.
                delay: 0.5
              - type: action
                do: mob_say
                mob_id: 51
                text: >-
                  I may have understated what the dummy is capable
                  of. Keep going.
                delay: 1.5
              - type: action
                do: mob_say
                mob_id: 51
                text: >-
                  While you are at it -- combat is not just
                  striking. Try <ansi fg="command">kick</ansi>,
                  <ansi fg="command">grapple</ansi>, or
                  <ansi fg="command">trip</ansi> to mix it up.
                delay: 3.5
              - type: action
                do: mob_say
                mob_id: 51
                text: >-
                  If you had a shield,
                  <ansi fg="command">bash</ansi> is also available
                  -- shield work comes later. For now, get it on
                  the ground.
                delay: 5.0
              - type: action
                do: mob_say
                mob_id: 51
                text: >-
                  One more thing. Not every fight is won with a
                  blade. Try <ansi fg="command">taunt</ansi> -- a
                  sharp tongue can break an opponent as surely as
                  a sharp edge.
                delay: 7.0
              - type: action
                do: set_state
                key: trainer_commented
                value: "true"

    # ── ROOM IDLE: dummy is gone — reset trainer_commented flag ──
    - type: sequence
      event: room_idle
      children:
        - type: decorator
          mod: invert
          child:
            type: condition
            check: mob_in_room
            mob_id: 65
        - type: condition
          check: state_equals
          key: trainer_commented
          value: "true"
        - type: action
          do: set_state
          key: trainer_commented
          value: ""

    # ── ROOM COMMAND: talk ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [talk]
        - type: condition
          check: mob_in_room
          mob_id: 51
        - type: selector
          children:
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-combat_arrive"
                - type: condition
                  check: player_missing_quest
                  quest: "1-combat_defeat"
                - type: action
                  do: mob_say
                  mob_id: 51
                  text: >-
                    Defeat the training dummy. Type
                    <ansi fg="command">attack dummy</ansi> to
                    start the fight.
            - type: action
              do: mob_say
              mob_id: 51
              text: >-
                Keep practicing. The body learns through
                repetition, not instruction.
