# Observatory — Room 116
# Elder Saris (mob 55) explains spellcasting, player casts on the
# Chrysalis Echo (mob 112).
# Sub-steps: magic_arrive -> magic_cast

tree:
  type: selector
  children:

    # ── ROOM ENTER: first arrival after wilderness trial ──
    - type: sequence
      event: room_enter
      children:
        - type: condition
          check: player_has_quest
          quest: "1-wilderness_track"
        - type: condition
          check: player_missing_quest
          quest: "1-magic_arrive"
        - type: condition
          check: mob_in_room
          mob_id: 55
        - type: action
          do: mob_emote
          mob_id: 55
          text: turns from the sighting device without haste.
          delay: 1.0
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            The old records call them the Witnesses -- three moons,
            each on a different cycle. Swiftmoon turns in under
            five days. The Wanderer takes ten. The Eye takes
            twenty-one.
          delay: 2.0
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            Spellcasting begins with precision. Form a clear image
            of what you want to be true. Not a wish. Not a hope.
            An image. Hold it precisely.
          delay: 4.5
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            Then bifurcate it. Split your inner vision into two
            identical copies and hold both simultaneously. Then
            split again. Four. Eight.
          delay: 7.0
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            Each doubling is a fold. Simple effects require only
            a few folds. Complex ones require many more.
          delay: 9.0
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            The more you cast, the more patterns crystallize in
            your mind. New spells emerge from practice -- not from
            books or teachers.
          delay: 11.0
        - type: action
          do: mob_say
          mob_id: 55
          text: "You already carry the seed of one pattern: Conviction Spike."
          delay: 13.0
        - type: action
          do: mob_emote
          mob_id: 55
          text: gestures toward the faintly shimmering figure nearby.
          delay: 14.5
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            That is a Chrysalis Echo -- a harmless remnant of a
            past Awakening. I keep it here for practice.
          delay: 15.5
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            Try your spell on it. Type
            <ansi fg="command">cast conviction-spike echo</ansi>.
          delay: 17.0
        - type: action
          do: grant_quest
          quest: "1-magic_arrive"

    # ── ROOM COMMAND: cast attempt ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [cast, conviction-spike]
        - type: condition
          check: player_has_quest
          quest: "1-magic_arrive"
        - type: condition
          check: player_missing_quest
          quest: "1-magic_cast"
        - type: condition
          check: mob_in_room
          mob_id: 55
        - type: action
          do: mob_emote
          mob_id: 55
          text: watches the air settle after the discharge.
          delay: 0.5
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            There. You felt it -- the pattern forming, the
            bifurcation holding.
          delay: 2.0
        - type: action
          do: mob_say
          mob_id: 55
          text: Cast often. More patterns will crystallize with practice.
          delay: 3.5
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            The last thing standing between you and the south gate
            is the cave system below. The Aberrant at the back does
            not respond to reason.
          delay: 5.0
        - type: action
          do: mob_say
          mob_id: 55
          text: >-
            If you have questions about this world, the Chrysalis,
            the moons, the Fold -- <ansi fg="command">ask</ansi>
            me.
          delay: 6.5
        - type: action
          do: grant_quest
          quest: "1-magic_cast"

    # ── ROOM COMMAND: talk ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [talk]
        - type: condition
          check: mob_in_room
          mob_id: 55
        - type: selector
          children:
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-magic_arrive"
                - type: condition
                  check: player_missing_quest
                  quest: "1-magic_cast"
                - type: action
                  do: mob_say
                  mob_id: 55
                  text: >-
                    The Echo is waiting. Type
                    <ansi fg="command">cast conviction-spike
                    echo</ansi>.
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-cave"
                - type: action
                  do: mob_say
                  mob_id: 55
                  text: >-
                    The Warden waits at the south gate. You have
                    earned the road. If anything is still unclear,
                    <ansi fg="command">ask</ansi>.
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "1-magic_cast"
                - type: action
                  do: mob_say
                  mob_id: 55
                  text: >-
                    The cave is below. The lichen will light your
                    way. The Aberrant waits at the back -- it does
                    not negotiate.
                    <ansi fg="command">Ask</ansi> if you need
                    guidance.
            - type: action
              do: mob_say
              mob_id: 55
              text: >-
                Complete the other trials first. The work matters.
                <ansi fg="command">Ask</ansi> if you have
                questions about this place.
