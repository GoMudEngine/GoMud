# 6467 The Landing — movement gate only. The farewell + handoff (teleport to the
# Awakening Pool 5200 and grant of quest 30) live in quest 28's `end` step, fired
# on `talk dewey`. This tree blocks a plain walk and redirects the player to the
# talk-handoff until the tutorial is complete (28-end).
tree:
  type: selector
  children:
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [north, n, go, south, s, east, e, west, w, up, u, down, d]
        - type: condition
          check: player_missing_quest
          quest: "28-end"
        - type: action
          do: mob_say
          mob_id: 9491
          text: >-
            One step left, and it is not a walk -- type
            <ansi fg="command">talk dewey</ansi> and I will carry you through.
        - type: action
          do: intercept
