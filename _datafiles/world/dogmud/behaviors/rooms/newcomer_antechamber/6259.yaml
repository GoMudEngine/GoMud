# 6259 — gate: must status before leaving north.
#
# Branch 1: player types status/stat/st → mark lesson done + praise.
# Branch 2: movement attempt while lesson not done → nudge + intercept.

tree:
  type: selector
  children:

    # ── Lesson performed: mark done, praise ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [status, stat, st]
        - type: action
          do: set_state
          key: lesson_done
          value: "1"
        - type: action
          do: send_user_text
          text: >-
            That is you, whole on one page. North is open -- type  north.

    # ── Movement before lesson: block with a nudge ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [north, n, go, south, s, east, e, west, w, up, u, down, d]
        - type: condition
          check: state_equals
          key: lesson_done
          value: ""
        - type: action
          do: send_user_text
          text: >-
            First, know yourself. Type  status , then go north.
        - type: action
          do: intercept
