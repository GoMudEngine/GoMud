# 6259 Knowing Yourself — gate: status before leaving north.
# The status branch also plants the progression teaser (paid off in room 5).

tree:
  type: selector
  children:

    # ── Dewey greets on arrival and gives the first instruction (fires once) ──
    - type: sequence
      event: room_enter
      children:
        - type: condition
          check: state_equals
          key: greeted
          value: ""
        - type: action
          do: set_state
          key: greeted
          value: "1"
        - type: action
          do: mob_say
          mob_id: 9491
          delay: 1.0
          text: >-
            This is where you meet yourself. Type
            <ansi fg="command">status</ansi> to read your six stats and the three
            pools beneath them -- health, stamina, and conviction. Knowing
            yourself is the first armor you'll ever wear.

    # ── status lesson ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [status, stat, st, score]
        - type: condition
          check: state_equals
          key: lesson_done
          value: ""
        - type: action
          do: set_state
          key: lesson_done
          value: "1"
        - type: action
          do: mob_say
          mob_id: 9491
          text: >-
            There you are -- all of you, on one page. Those stats and pools
            grow, but not the way you might expect -- no levels, no experience
            to grind. I'll show you how when we spar. For now, the way
            <ansi fg="command">north</ansi> is open.

    # ── movement before lesson: nudge + block ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [north, n, go, south, s, east, e, west, w, up, u, down, d]
        - type: condition
          check: state_equals
          key: lesson_done
          value: ""
        - type: action
          do: mob_say
          mob_id: 9491
          text: >-
            Meet yourself first -- type <ansi fg="command">status</ansi>, then
            go north.
        - type: action
          do: intercept
