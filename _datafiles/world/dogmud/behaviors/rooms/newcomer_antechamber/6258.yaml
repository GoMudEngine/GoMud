# 6258 The Threshold — movement gate only. All lessons + Dewey's voice now live
# in quest 28 (Waking to Gaius): detection via command_issued/room_enter,
# Dewey speaks via the quest's npc_say. This tree's ONLY job is to block a
# premature exit until the room's lesson (28-examined) is done, with a single
# nudge that points the player back at their hint.
tree:
  type: selector
  children:
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [north, n, go, south, s, east, e, west, w, up, u, down, d]
        - type: condition
          check: player_missing_quest
          quest: "28-examined"
        - type: action
          do: mob_say
          mob_id: 9491
          text: >-
            Not through yet -- if you have lost the thread, type
            <ansi fg="command">hint</ansi> and it will point you at the next step.
        - type: action
          do: intercept
