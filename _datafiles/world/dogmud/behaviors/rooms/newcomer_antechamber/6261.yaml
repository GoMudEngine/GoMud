# 6261 — gate: must inventory before leaving north.
#
# Branch 1: player types inventory/inv/i → mark lesson done + praise.
# Branch 2: movement attempt while lesson not done → nudge + intercept.

tree:
  type: selector
  children:

    # ── Lesson performed: mark done, praise ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [get, take, g, inventory, inv, i]
        - type: action
          do: set_state
          key: lesson_done
          value: "1"
        - type: action
          do: send_user_text
          text: >-
            Good -- picked up and counted. North is open -- type  north.

    # ── Movement before lesson: block with a nudge ──
    - type: sequence
      event: room_command
      children:
        - type: condition
          check: command_matches
          commands: [north, n, go, south, s, east, e, west, w, up, u, down, d]
        - type: condition
          check: state_equals
          key: lesson_done
          value: ""
        - type: action
          do: send_user_text
          text: >-
            Take the token first -- type  get token  (or  inv ), then go north.
        - type: action
          do: intercept
