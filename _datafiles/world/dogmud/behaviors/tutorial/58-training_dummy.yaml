# Training Dummy — Behavior Tree
# On death: trainer (mob 51) reacts and grants 1-combat_defeat to killer.

tree:
  type: sequence
  event: mob_die
  children:
    - type: action
      do: respond
      room_text: "<ansi fg=\"mobname\">{source}</ansi> crumbles to dust."
    - type: action
      do: command_mob
      mob_id: 51
      cmd: "say Well done. You have a sense of it now."
    - type: action
      do: command_mob
      mob_id: 51
      cmd: >-
        say The Forge is south of here. Speak with Korvath --
        physical mastery and craft mastery are not separate things.
    - type: action
      do: grant_quest
      quest: "1-combat_defeat"
