# Training Dummy — Sanctum Basin (mob 65)
# On death: Combat Trainer Ren (mob 51) reacts, introduces rally/warcry,
# and advances the tutorial quest.

tree:
  type: sequence
  event: mob_die
  children:
    - type: action
      do: respond
      room_text: "<ansi fg=\"mobname\">{source}</ansi> splinters and collapses."
    - type: action
      do: command_mob
      mob_id: 51
      cmd: "say Well struck. You have the rhythm now."
    - type: action
      do: command_mob
      mob_id: 51
      cmd: >-
        say Next lessons: the shouts. Rally steadies your allies,
        warcry rattles your enemies. Ask me about them when you are ready.
