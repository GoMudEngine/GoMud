# The Quay Agent — mob 9572 — books passage at the North Quay.
# Serves BOTH North Quay routes -- destination word picks the route.
tree:
  type: selector
  children:

    # ── PURCHASE: boarding intent → board_ferry resolves destination,
    # schedule, fare, and movement. Sits FIRST (grant-node-first SOP). ──
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [passage, board, boarding, ticket, fare, ride, sail, stillwater, confluence]
        - type: action
          do: board_ferry
          routes:
            stillwater: stillwater_np_packet
            confluence: confluence_np_barge

    # ── info / greetings ──
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [hello, hi, help, who, what, ferry, boat, packet, barge, agent]
        - type: action
          do: say
          text: I book passage from the North Quay. The Lakewind Packet keeps the crossing to Stillwater and the Broadbeam runs south to the Confluence -- fare settled here, ledger stamped, no exceptions.
        - type: action
          do: say
          text: State your landing when you ask for passage -- Stillwater, or the Confluence. If the vessel is standing off, I will give you her next docking.
        - type: action
          do: send_user_text
          text: '<ansi fg="181">  [Try: ask agent passage stillwater]</ansi>'
