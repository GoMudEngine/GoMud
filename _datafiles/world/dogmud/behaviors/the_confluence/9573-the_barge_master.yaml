# The Barge Master — mob 9573 — books passage at the Confluence Barge Dock.
# Serves BOTH Barge Dock routes -- destination word picks the route.
tree:
  type: selector
  children:

    # ── PURCHASE: boarding intent → board_ferry resolves destination,
    # schedule, fare, and movement. Sits FIRST (grant-node-first SOP). ──
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [passage, board, boarding, ticket, fare, ride, sail, stillwater, plymouth]
        - type: action
          do: board_ferry
          routes:
            stillwater: stillwater_confluence_barge
            plymouth: confluence_np_barge

    # ── info / greetings ──
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [hello, hi, help, who, what, ferry, boat, barge, master]
        - type: action
          do: say
          text: I see passengers onto the water here. The Grey Heron runs up to Stillwater and the Broadbeam runs down to Plymouth -- pay at the plank, walk off at the far end.
        - type: action
          do: say
          text: Tell me where you're bound when you ask for passage -- Stillwater, or Plymouth. If she's out on the river, I'll tell you when the current brings her back.
        - type: action
          do: send_user_text
          text: '<ansi fg="181">  [Try: ask master passage plymouth]</ansi>'
