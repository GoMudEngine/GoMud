    reserve_pct: 0.01
    effects:
      physical_mitigation_bonus: 1
    adjective: shell-traced
    description_suffix: "Faint shell-like patterns emerge across the fabric."
    tier_up_message: ""
  - tier: 1
    reserve_pct: 0.02
    effects:
      physical_mitigation_bonus: 2
