speciesid: 45
name: Automaton
description: A machine of dark alloy and humming light, built by hands that were
  not human and left to keep watch long after its makers were gone. It moves with
  the patient, unbothered certainty of something that does not tire, does not
  fear, and was never alive to begin with.
body_parts: [arms, legs, skin]
mutation_immune: true
size: large
