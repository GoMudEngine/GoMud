speciesid: 31
name: Zombie
description: A rotting corpse reanimated by necromantic energy, driven by a
  mindless hunger. Zombies are ponderous but terrifyingly strong, their decaying
  flesh absorbing punishment that would fell a living creature. They do not stop.
size: medium
unarmedname: fists
selectable: false
tameable: false
angrycommands:
  - emote lurches toward you with a wet, rattling moan.
  - emote reaches for you with fingers dark with rot.
