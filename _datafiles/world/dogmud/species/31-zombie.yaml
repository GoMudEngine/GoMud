  strength:
    base: 130
  dexterity:
    base: 50
  perception:
    base: 40
  vitality:
    base: 200
  willpower:
    base: 15
  charisma:
    base: 5
damage:
  basedamage: 5
  variance: 2
disabledslots: ['neck', 'belt', 'gloves', 'legs', 'feet']
