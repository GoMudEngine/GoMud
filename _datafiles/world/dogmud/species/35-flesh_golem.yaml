speciesid: 35
name: Flesh Golem
description: A massive construct of stitched corpse-parts, the flesh golem is
  the bluntest instrument in a necromancer's arsenal. It does not think; it
  does not feel; it does not stop. What it lacks in speed or cunning it more
  than compensates for with raw, crushing strength and a body that soaks damage
  like a bog soaks rain.
body_parts: [arms, hands, legs, eyes, mouth, skin]
intrinsic_mutations:
  iron-constitution: 1
size: large
unarmedname: fists
selectable: false
tameable: false
angrycommands:
  - emote turns toward you with a grinding of mismatched joints.
  - emote slams one grafted fist into its open palm with a wet crack.
stats:
  strength:
    base: 220
  dexterity:
    base: 65
  perception:
    base: 40
  vitality:
    base: 240
  willpower:
    base: 15
  charisma:
    base: 115
damage:
  basedamage: 8
  variance: 3
disabledslots: ['weapon', 'offhand', 'head', 'neck', 'back',
  'belt', 'gloves', 'ring', 'legs', 'feet']
