mutationid: camo-skin
name: Camo Skin
description: Your skin shifts and blurs, mimicking your surroundings with an unsettling fluidity. You fade from notice — but something about the effect repulses those who see through it.
rarity: 6
requires_body_parts: [skin]
visual: Their outline seems to shimmer and blur, making it difficult to focus on them directly.
conflicts:
  - bioluminescence
  - pheromone-glands
pros:
  - type: stealth_bonus
    value: 20
  - type: dodge_modifier
    value: 15
cons:
  - type: stat_flat
    target: charisma
    value: -20
