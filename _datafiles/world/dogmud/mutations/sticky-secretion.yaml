mutationid: sticky-secretion
name: Sticky Secretion
description: |
  Your skin weeps a clear, adhesive sap that clings to anything that touches
  it. Strike you and your attacker's weapon and hand come away fouled and
  dragging -- every follow-up swing is a little slower, a little clumsier.
rarity: 4
clusters: [weaver]
visual: A faint, glistening film sheens their skin, tacky and slow to let go of anything it touches.
pros:
  - type: reflect_damage
    value: 4
  - type: on_reflect_buff
    value: 110
