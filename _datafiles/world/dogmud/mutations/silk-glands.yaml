mutationid: silk-glands
name: Silk Glands
description: |
  Spinnerets open along your wrists and spine, trailing fine, impossibly strong
  silk wherever you move. It webs the ground around you and fouls the footing of
  anyone who closes in, while you ride your own lines clear of trouble.
rarity: 4
clusters: [trickster, weaver]
visual: Fine, glinting strands of silk drift and cling around them, webbing the ground at their feet.
pros:
  - type: aura_enemy_debuff
    value: 110
  - type: dodge_modifier
    value: 6
