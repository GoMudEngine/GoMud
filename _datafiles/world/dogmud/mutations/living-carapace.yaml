mutationid: living-carapace
name: Living Carapace
description: |
  Your whole body seals inside a thick, living shell that grows and repairs
  itself endlessly. Blows barely reach you, and what does strike the carapace is
  hurled back with a vengeance. Nothing can take you off your feet, and
  everything nearby wants to hit you first.
rarity: 9
max_rank: 1
clusters: [ironhide]
pole: body
prerequisites:
  - id: thick-hide
    min_level: 1
  - id: regrowth
    min_level: 1
visual: A vast, plated carapace of living shell encases them, seams glistening as it flexes and reforms.
pros:
  - type: natural_armor
    value: 20
  - type: reflect_damage
    value: 15
  - type: aggro_magnet
    value: 1.0
  - type: flag
    target: control-immune
    value: 1
