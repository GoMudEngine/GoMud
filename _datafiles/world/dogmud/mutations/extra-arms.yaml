mutationid: extra-arms
name: Extra Arms
description: A second pair of arms has sprouted from your torso, granting you the ability to wield additional weapons. The grotesque sight of four flailing limbs draws hostile attention and unsettles everyone around you.
rarity: 8
max_rank: 1  # connective-tissue bridge: apex-class, binary (no deepen)
clusters: [colossus, ravener]
pole: body
visual: A second pair of arms extends from their torso, moving with surprising coordination.
requires_body_parts: [arms]
pros:
  - type: flag
    target: active-ability
    value: 1
  - type: stat_multiplier
    target: dexterity
    value: 0.05
cons:
  - type: stat_flat
    target: charisma
    value: -28
  - type: aggro_magnet
    target: aggro
    value: 1.0
