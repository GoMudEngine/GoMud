  name: The Core Guardian
  description: |
    The last and worst of the dead guardians, wound about the innermost
    heart of the buried place -- the sealed chamber where the makers kept
    their voices and their records against the ending of all things. It is
    built of the grey material like the rest, but denser, older, lit by a
    cold fire that has never once gone out. It has kept this place through
    an age of dark and silence, and it will spend the whole of that terrible
    patience to keep it from you now. Behind it lies the truth. It is the
    only thing left standing between you and the answer.
