character:
  name: flesh golem
  description: |
    A massive construct of stitched and grafted corpse-parts, standing head
    and shoulders above a tall human. Its body is a patchwork of mismatched
    limbs sewn together with coarse suture and sealed with something dark and
    resinous. It does not think or plan — it simply advances, absorbing
    punishment without slowing, and strikes with the mechanical force of a
    mill wheel.
