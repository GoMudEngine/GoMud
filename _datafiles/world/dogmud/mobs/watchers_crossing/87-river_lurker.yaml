character:
  name: river lurker
  description: |
    A low-slung creature somewhere between a crocodile and an eel,
    armoured in overlapping plates of dark, river-slicked hide. Its body is
    built for ambush -- powerful legs folded beneath it, a flat head dominated
    by a jaw that can unhinge to swallow things larger than seems possible. Its
    eyes are a dull yellow, adapted to the murky water beneath the bridge where
    it lairs. Claw marks on the bridge pilings mark its territory. The river
    lurker is patient, territorial, and thoroughly dangerous at close range.
