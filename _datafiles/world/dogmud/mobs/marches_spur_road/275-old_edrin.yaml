character:
  name: Old Edrin
  description: |
    A stooped old man in threadbare robes, leaning heavily on a
    gnarled staff. His face is weathered to deep creases, his hair
    white and wild, his eyes milky and unfocused. He seems barely
    aware of his surroundings, muttering to himself about herbs and
    drying times. His hands shake slightly. His robes are patched
    and stained with reagent spills. He looks like what he appears
    to be -- an old hermit living alone in the grasslands, too far
    gone to be dangerous. But the chrysalis resin patches on his
    cottage walls are precisely applied. The jars in his shelves
    are arranged with a system. And his staff, for all its gnarled
    ugliness, hums faintly when the light catches it wrong.
  speciesid: 1
  level: 1
  gold: 50
