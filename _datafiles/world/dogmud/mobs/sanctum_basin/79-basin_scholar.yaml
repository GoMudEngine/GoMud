character:
  name: basin scholar
  description: |
    A lean, sharp-featured woman in practical traveling clothes, her
    fingers stained with charcoal and ink. A leather satchel at her hip bulges with
    rolled papers, specimen jars, and small tools of academic inquiry. She carries
    herself with the particular restlessness of someone who would rather be in the
    field than at a desk. Her eyes are quick and cataloguing -- the eyes of someone
    who looks at living things and sees specimens first and people second. She is
    attached to the Chrysalis research initiative but operates independently, funded
    by Thornwall's natural philosophy guild.
