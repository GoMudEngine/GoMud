character:
  name: Cave Troll
  description: 'Whatever this creature once was, little remains to mark it as human. Layers of calcite-gray growths have fused across its hunched frame like plates of living stone, cracking and reforming with each labored breath. Its face is a ruin of overgrown bone and hardened tissue — the jaw distended, the eyes reduced to deep-set glints beneath a shelf of ridged cartilage. It stands half again as tall as a grown man, its limbs thick and uneven, fingers fused into blunt clubs ofite and keratin. A sour, mineral stink clings to it like cave damp.'
