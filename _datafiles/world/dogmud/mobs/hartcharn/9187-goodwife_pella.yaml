character:
  name: Goodwife Pella
  description: |
    A broad-shouldered woman in her middle years who moves through the
    residential lanes with the unhurried ownership of someone who has
    lived here all her life. She knows every family on the lane and
    has opinions about all of them. Her irises are a flat, milky grey
    -- Chrysalis-changed -- with almost no visible color at distance,
    and catch lamplight like tarnished coin when she turns to look
    at you directly.
