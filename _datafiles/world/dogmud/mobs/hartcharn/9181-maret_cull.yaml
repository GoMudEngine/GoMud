character:
  name: Maret Cull
  description: |
    The Coachman's Rest is the biggest building in Hartcharn besides
    the coach yard, and Maret Cull is the reason it runs at all. She
    is a lean woman in her early forties, brisk in motion and
    economical in speech, with short dark hair and the permanent
    slight frown of someone running calculations. She keeps two
    ledgers -- one for guests and one for the kitchen -- and has
    never confused an entry in either. Her hands are her most
    remarkable feature: the fingers are slightly longer than they
    should be, with a faint extra joint visible at each knuckle,
    giving them an almost arachnid dexterity that is useful for
    quartering invoices and subtly unsettling to those who shake
    hands without warning. A Chrysalis touch she neither hides nor
    discusses.
