character:
  name: Severin Pell
  description: |
    Severin Pell occupies a small booth at the edge of the coach yard,
    hemmed in by route boards, fare tables, and a stack of ledgers that
    would reach his shoulder if he ever let it. He is slight, precise,
    and unhurried in the way that people who process large volumes of
    transactions learn to be: every stamp, every ruling, every spoken
    fare is deliberate. He wears ink stains on three fingers of his
    right hand as a permanent mark of office. Look closely at his eyes
    and the strangeness becomes apparent -- his pupils are not round
    but faintly hexagonal, six-sided and neat, as though geometry
    itself has taken up residence in his irises. It is a Chrysalis
    drift he never mentions. It does make him very good at reading
    small print.
