activitylevel: 12
character:
  name: Ondine
  description: |
    Ondine keeps a store that is smaller than it looks and contains
    more than seems possible: road tar and hard candy, lamp oil and
    winter stockings, maps of the northern road and waxed thread for
    sail-mending, in case you happen to need it. She is a tidy woman
    in her late thirties with a shopkeeper's eye for weight and
    measure. In full daylight she looks entirely ordinary. Step into
    her back storeroom before she lights the lamps and you will notice
    a faint tracery of blue-green light along the veins of her hands
    and forearms -- a bioluminescent Chrysalis touch that she finds
    useful for reading labels in the dark and mildly embarrassing at
    everything else. She has learned to keep the curtains drawn when
    she works late.
