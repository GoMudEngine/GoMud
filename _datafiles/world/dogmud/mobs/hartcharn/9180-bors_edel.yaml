activitylevel: 9
character:
  name: Bors Edel
  description: |
    A broad, patient man in his forties who has worked the south gate
    long enough that he has stopped counting seasons. He is not unkind,
    merely practiced at the art of looking at arrivals until they
    explain themselves. He wears a magistrate's badge on a leather cord
    and carries a spear that is more staff than weapon at this point.
    His brow and jaw carry a faint but unmistakable ridging under the
    skin -- a creep of Chrysalis that has given him the permanent look
    of a man wearing a helmet he cannot remove. He has never mentioned
    it, and the townsfolk stopped noticing years ago.
