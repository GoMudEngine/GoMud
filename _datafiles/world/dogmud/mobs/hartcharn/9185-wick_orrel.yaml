character:
  name: Wick Orrel
  description: |
    The Tap and Trough is the older, rougher of Hartcharn's two
    drinking establishments, which is another way of saying it is
    where the locals go. Wick Orrel has kept it for fifteen years and
    knows everything that has happened in this town for most of that
    time, because very little happens in Hartcharn without someone
    eventually telling someone else about it at his bar. He is a lean,
    watchful man of about fifty with a face like a fist and the
    unhurried manner of someone who has seen every variety of trouble
    arrive through that door and is no longer impressed by any of it.
    The skin at his temples and across his scalp carries a deep
    violet-black discoloration that never fades, and his ears come to
    a faint upward point -- a paired Chrysalis drift that has left him
    with hearing sharp enough to follow two conversations at opposite
    ends of the bar simultaneously. He uses this more than he admits.
