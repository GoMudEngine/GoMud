character:
  name: arena champion
  description: >-
    The arena champion is everything the pit produces at its
    best and worst: a fighter of terrible skill, shaped into
    something barely human by years of surviving what killed
    everyone else. Towering, unhurried. The tower shield on
    one arm is as much a weapon as the dark-iron warhammer
    in the other hand. There are no wasted movements, no
    theatrics. Just the absolute certainty of a creature
    that has never been beaten in this room.
