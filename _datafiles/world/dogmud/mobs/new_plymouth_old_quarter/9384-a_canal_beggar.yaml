activitylevel: 2
character:
  name: A Canal Beggar
  description: |
    The beggar has found the driest point of the
    canal-side ledge and arranged themselves in it
    with the economy of someone who has done this
    many times and knows exactly how much space they
    occupy. A clay cup sits on the flags in front
    of their feet — not held out, not announced, just
    present. They do not ask. Whatever asking there
    was has been concluded, some time ago, and what
    replaced it is this: sitting, watching the still
    water, wearing the cold at this depth with the
    practiced endurance of someone who has learned
    that it does not get better and does not get
    worse, only continues.
