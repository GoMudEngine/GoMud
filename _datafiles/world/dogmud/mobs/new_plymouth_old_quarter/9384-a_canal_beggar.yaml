idlecommands:
  - 'emote sits with the back against the old stone wall and
    the knees drawn up, a clay cup between the feet on the
    ledge. The cup has been there a long time. It contains
    very little.'
  - ''
  - 'emote watches the canal water with an expression that
    has passed through several stages of feeling and arrived
