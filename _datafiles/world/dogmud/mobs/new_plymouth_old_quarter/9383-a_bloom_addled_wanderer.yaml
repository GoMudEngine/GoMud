character:
  name: A Bloom-Addled Wanderer
  description: |
    The veining at the temples and jaw is copper-bright
    against pale skin — the Bloom's specific signature,
    worn here openly, without the concealment you see
    above ground. The eyes are wide and fixed at a
    middle distance that does not correspond to anything
    present in the buried street. The wanderer moves
    without apparent destination, navigating by some
    internal map that does not match the quarter's
    geometry. The clothes are not new and have been
    worn a long time without particular attention.
    Whatever the wanderer had before the Bloom, the
    evidence of it has been used up. What remains is
    the wandering.
