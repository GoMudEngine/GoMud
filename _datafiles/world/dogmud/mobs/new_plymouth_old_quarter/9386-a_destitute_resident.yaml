character:
  name: A Destitute Resident
  description: |
    The resident has claimed a section of the canal-side
    ledge that is dry enough and arranged a few
    belongings against the wall behind them — a rolled
    coat, a clay cup, a length of rope that may have
    had a use at some point. The face carries the
    specific expression of someone who has been in this
    quarter long enough that the cold and the damp and
    the permanent dark have become background rather
    than event. They are not well. They are not in
    immediate danger of anything worse than what
    already applies. This is a distinction they make.
