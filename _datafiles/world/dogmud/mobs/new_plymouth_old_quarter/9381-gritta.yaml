activitylevel: 8
character:
  name: Gritta
  description: |
    She is a stocky woman of indeterminate years who smells of deep
    water and old clay. Her hands are permanently discolored at the
    knuckles from work in the flooded chambers beneath the Old
    Quarter, and she moves with the slightly forward lean of a person
    perpetually ducking a lintel that is not there. Something in her
    responds to the buried gray stone of this place — not a visible
    change, but a quality of attention, as though the walls are
    speaking at a frequency she alone receives. She has pulled carved
    fragments, broken seals, and worked pieces from the drowned
    chambers below and sent them upward through a chain of contacts
    to people who can read what she can only feel. She does not
    explain what she knows. She explains what the stone tells her,
    which is not the same thing.
