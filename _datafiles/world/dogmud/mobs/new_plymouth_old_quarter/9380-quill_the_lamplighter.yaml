character:
  name: Quill the Lamplighter
  description: |
    He is very thin and very quiet — the kind of person the city
    produces in its lowest reaches, where warmth is tended rather
    than assumed. His eyes are wrong in a way you notice only when
    the light shifts — too wide, too dark, the pupils spread as a
    cat's in deep shadow and slow to contract even in lamplight.
    Long years below have left him adapted to the dark in ways the
    surface cannot undo. He carries an oil can, a wick-trimmer, and
    nothing else. His clothes are clean only relative to everything
    else in the canal quarter. He tends the only warm lights in the
    Old Quarter, and what he sees by those lights, he keeps very
    carefully to himself.
