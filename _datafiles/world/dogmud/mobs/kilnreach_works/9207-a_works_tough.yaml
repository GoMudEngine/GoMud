character:
  name: A Works Tough
  description: |
    A heavy-limbed man who takes up more space than he needs to at the
    bar, scarred in the unarchived way of men who have been in many fights
    and recorded none of them. He does not carry a weapon because he does
    not feel the lack. His hands are the giveaway: the knuckles have
    thickened with sub-dermal bone-spurs that ridge each fist into
    something knobbed and dense, a Chrysalis drift that has quietly
    armoured the instruments he relies on most. He is not hostile unless
    given cause, but the threshold for cause is lower than you might
    assume, and he does not warn twice.
