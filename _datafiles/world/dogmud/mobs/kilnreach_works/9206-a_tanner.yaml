activitylevel: 9
character:
  name: A Tanner
  description: |
    A lean man stained to the elbows with tanbark and something darker
    still, carrying the tannery's reek in his clothes, his hair, and
    probably the marrow of his bones by now. He works with the blank,
    efficient focus of someone who made peace with the smell long ago and
    stopped expecting anyone else to. The skin of his forearms and throat
    has developed a faint iridescence -- not colour, exactly, but a
    quality of the surface itself, a mother-of-pearl shift that moves when
    the light does, as though something beneath the skin has learned to
    reflect differently. Most people are too occupied noticing the smell to
    notice that.
