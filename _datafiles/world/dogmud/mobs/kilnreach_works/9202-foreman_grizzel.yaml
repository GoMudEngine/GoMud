idlecommands:
  - 'emote bellows across the yard at a flagging worker, voice cracking
    like a thrown stone'
  - ''
  - 'emote runs a scarred thumb down a column of figures in a battered
    ledger, lips pressed flat'
  - ''
  - 'emote turns a slow gaze on a man he does not like the look of and
    lets the silence do the work'
  - 'emote spits in the dust at his feet and wipes his mouth with the back
