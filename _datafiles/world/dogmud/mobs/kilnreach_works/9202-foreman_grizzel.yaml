activitylevel: 10
character:
  name: Foreman Grizzel
  description: |
    A broad, iron-shouldered man somewhere past fifty, with burn scars on
    both forearms and the slow, economical movements of someone who has
    been giving orders long enough that he no longer needs to raise his
    voice to be obeyed. His eyes are pale, steady, and evaluative. The
    skin along his brow and the backs of his hands has thickened into
    overlapping scutes -- grey-brown and slightly raised, like bark or
    hardened hide -- a Chrysalis drift he has carried long enough that the
    workers no longer remark on it. He carries a ledger in the crook of
    one arm at all times. The ledger is never wrong.
