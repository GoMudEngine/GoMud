character:
  name: Sela Tapp
  description: |
    A short, square-built woman of indeterminate age, fast with her hands
    and faster with a verdict. She runs the Furnace and Flagon the way a
    good gaoler runs a prison -- with economy, authority, and the quiet
    confidence that she could remove anyone she wanted to. Her forearms are
    ropy with old work and she holds eye contact the way a vice holds a
    bolt. Beneath her upper lids sits a thin translucent membrane, a
    second eyelid that slides across when smoke or kiln-dust gets thick --
    she never blinks quite the way other people do. She has heard every
    grievance the works has to offer, and she has no intention of hearing
    yours twice.
