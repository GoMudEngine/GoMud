activitylevel: 10
character:
  name: A Quarryman
  description: |
    A thickset man furred white from crown to collar with rock-dust, his
    skin so ingrained with powdered stone that scrubbing no longer makes
    much difference. His hands are wide, calloused, and built more like
    tools than limbs -- the hands of a man who has spent his working life
    breaking rock. His fingertips have calcified past ordinary tough skin
    into something closer to horn: thick, grey-ridged slabs where the
    nails should be, ringing faintly when they knock against stone. He
    does not appear to notice. He moves slowly between tasks and quickly
    when speed is needed, and never wastes the difference.
