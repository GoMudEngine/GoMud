character:
  name: A Basalt-Crag Raptor
  description: |
    A large bird of prey, coal-dark from beak to tail-fan, with
    a wingspan that catches the highland updrafts and rides them
    without effort. It nests in the highest basalt crags and
    almost never needs to come down from them. The eyes are
    remarkable -- pale and nearly colorless, fixed with the kind
    of attention that does not miss motion at any distance. When
    it drops from the crags it folds into a near-vertical stoop
    and arrives at the bottom faster than the eye tracks. It
    almost never misses.
