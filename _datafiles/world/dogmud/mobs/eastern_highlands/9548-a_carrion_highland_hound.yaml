  name: A Carrion Highland-Hound
  description: |
    Lean in the way of things that burn through everything they
    eat and are always hungry. The legs are too long for a wolf
    and the skull is wider -- shaped more for running down prey
    across open ground than for timber-country work. The coat
    is rough and patchy, not from sickness but from the speed
    at which this animal moves through conditions -- wet, cold,
    wounded, and on regardless. It has the look of something
    that heals as fast as it is hurt and has never learned to
    stop because of it. It circles you with a dogged, purposeful
    patience that is not patience at all.
