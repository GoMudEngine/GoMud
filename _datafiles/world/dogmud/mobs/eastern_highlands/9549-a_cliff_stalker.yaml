  name: A Cliff-Stalker
  description: |
    A large cat built for vertical country -- longer-limbed than
    most of its kind, with broad, splayed feet shaped for the
    fractured cliff faces of the high reach. The coat is grey-
    black to match the volcanic stone, the same problem the
    ridge-cat solved for the open ridgeline and this animal
    solved for the vertical. At rest on a ledge it could pass
    for a shadow. Moving, it is very fast -- faster than
    anything that size has a right to be, the reflex of
    something that has climbed and dropped and pivoted on sheer
    rock long enough that reaction now lives ahead of intention.
