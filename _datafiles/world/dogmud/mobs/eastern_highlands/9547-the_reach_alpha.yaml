  name: The Reach-Alpha
  description: |
    A bear -- or the scale of one -- that holds the highest
    ground of the reach. It is wrong in the way very large
    animals can be wrong -- too much mass without the slack of
    it, dense through the chest and shoulders in a way that does
    not suggest growth so much as compression. The scars layered
    across its back and muzzle are old, which means many things
    tested it across many seasons and none of them are here to
    describe the outcome. There is a quality to how it stands
    that makes the highland around it read as a room it owns.
    You are standing in that room now.
