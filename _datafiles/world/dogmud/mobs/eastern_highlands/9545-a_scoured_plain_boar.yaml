  name: A Scoured-Plain Boar
  description: |
    A massive animal, slab-shouldered and low, with a hide so
    thick and scarred it has taken on the texture of old bark.
    The bristles along its spine are sparse now -- worn off by
    years of highland wind rather than by any fight. The tusks
    are long and uneven, the asymmetry of things that have been
    used for a long time and do not care about geometry. It roots
    with an unhurried authority, as if the exposed plain belongs
    to it and always has. It has not learned to hurry. It has
    not needed to.
