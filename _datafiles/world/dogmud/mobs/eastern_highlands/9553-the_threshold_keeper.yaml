character:
  name: The Threshold-Keeper
  description: |
    A gaunt, weathered figure who keeps a fire at the foot of the buried
    door — the one person greedy or cursed or broken enough to live off
    the forbidden place, and to have learned how it works. Others come to
    look at the door and go home; she stayed, and stayed, until the dead
    country stopped frightening her and started paying. She has watched
    more than one hopeful soul carry a key up this road and walk in
    through the way she opened. She does not remember all their faces. She
    remembers one -- a driven man, years ago, who went in alone and did
    not come out, and whose daughter she never met. She will open the way
    as deep as your coin buys. She will not tell you to go in. She will
    not tell you not to.
