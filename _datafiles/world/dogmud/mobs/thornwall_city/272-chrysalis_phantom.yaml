character:
  name: Chrysalis Phantom
  description: |
    What stands before you is recognizably human only in the broad
    sense -- two arms, two legs, upright. The details wrong. Its skin
    shifts between colours the way a cuttlefish shifts between patterns:
    not slowly, not smoothly, but in sudden reconfigurations that leave
    your eyes reporting contradictory information about where it is
    standing. Its eyes catch light at angles that eyes should not, pale
    and pupil-wide in the dark, reflecting back colours that are not in
    this room. It moves like liquid poured downhill -- no wasted motion,
    no telegraph, weight committing fully only at the last possible
    instant. The chrysalis mutation has gone deep here. Whatever this
    was before, it is something else now. On each hand, knuckle weapons
    of chrysalis chitin: shaped, fitted, and clearly very used.
