character:
  name: street performer
  description: |
    A wiry figure in a patchwork coat of mismatched fabrics, each patch
    a different colour and texture. The street performer has a quick grin
    and quicker hands -- juggling, sleight of hand, music, and a patter
    of jokes that range from clever to terrible. The performer works the
    central stretch of Main Street, collecting coins in an upturned hat
    and trading in the currency of attention. Behind the showmanship,
    there is a sharpness -- performers survive by reading crowds, and
    this one reads them very well.
