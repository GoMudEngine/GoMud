character:
  name: Whisper
  description: |
    A compact figure seated behind a low table, dressed in dark cloth
    with a hood pulled forward. You cannot see their face clearly. What
    you can see: gloved hands with nimble, deliberate movements; a
    small coded ledger open on the table; and a listening posture that
    suggests they registered every sound you made entering this room
    before you came through the door. Whisper deals in information,
    tools, and discretion -- in that order of value. They speak quietly
    enough that you have to lean in to hear, which means they can see
    your face and you cannot see theirs. This is probably intentional.
