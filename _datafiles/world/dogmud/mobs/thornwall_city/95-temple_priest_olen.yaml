character:
  name: Temple Priest Olen
  description: |
    A tall, thin man with hands perpetually stained with
    ink from the tithe ledgers he maintains. Priest Olen has the distracted
    air of someone whose mind is always on three things at once -- the
    spiritual needs of his congregation, the financial needs of the temple,
    and the uncomfortable place where those two concerns intersect. His
    smile is genuine but brief, and his eyes have the calculating quality
    of an accountant more than the serenity of a holy man. He means well,
    but the temple's debts weigh on him visibly.
