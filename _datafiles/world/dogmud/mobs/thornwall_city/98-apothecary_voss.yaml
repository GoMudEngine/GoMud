character:
  name: apothecary Voss
  description: |
    A small, precise person of indeterminate age, with wire-rimmed
    spectacles and fingers perpetually stained with herbal dyes. Voss
    speaks softly and deliberately, choosing words with the same care
    used to measure doses. The apothecary's knowledge is encyclopedic --
    herbs, minerals, tinctures, poultices -- and is dispensed with a
    clinical detachment that some find reassuring and others find
    unsettling. Voss cares about the work more than the patients, but
    the work is excellent.
