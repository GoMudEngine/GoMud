character:
  name: city beggar
  description: |
    A figure of indeterminate age bundled in layers of threadbare clothing,
    sitting against a wall with a chipped cup for coins. The beggar's eyes
    are surprisingly alert -- sharp and watchful beneath the grime. Beggars
    in Thornwall occupy the gaps between the city's systems, seeing
    everything and being seen by no one. This one knows the streets better
    than the guard patrols and hears more than the records office files.
    Whether any of that knowledge is for sale depends on the asking.
