character:
  name: Torvan Cresk
  description: |
    A man in his middle years with the bearing of an officer and the
    eyes of a merchant. Torvan Cresk is lean and precise in his
    movements, dressed in well-made but practical clothing -- dark
    wool, oiled leather boots, a belt that holds both a fine dagger
    and a set of surveyor's instruments. His face is angular and
    sharp-featured, framed by close-cropped grey hair. He carries
    himself with the quiet authority of someone who is used to being
    obeyed, and the careful watchfulness of someone who knows he has
    enemies. A former city surveyor turned smuggling kingpin, he
    mapped these tunnels and saw opportunity where the city saw
    infrastructure.
