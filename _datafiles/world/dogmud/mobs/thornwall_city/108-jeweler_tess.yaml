character:
  name: jeweler Tess
  description: |
    A wiry woman with sharp eyes and steady hands, Tess wears a leather
    apron fitted with dozens of small pockets holding files, pliers, and
    setting tools. Her fingers are calloused but nimble, and her nails
    are permanently stained with metal polish. A magnifying lens on a
    brass arm hangs from a chain around her neck, ready to be flipped
    up at a moment's notice. She speaks quietly and precisely -- the
    habit of someone who works with very small, very expensive things.
