character:
  name: Chrysalis Skulker
  description: |
    A lean figure wrapped in dark cloth treated with chrysalis resin to
    kill the sheen. Every edge of their clothing is sealed against
    catching light or snagging on stone. The skulker moves in a low,
    rolling crouch, weight always forward, never settling. Their face is
    wrapped below the eyes. What shows above the wrap is alert and
    calculating -- the look of someone who has survived exclusively by
    seeing trouble before trouble sees them. A resin-coated blade hangs
    at one hip. The other hip is empty, but the hand rests near it
    anyway, habit or misdirection.
