character:
  name: fence dealer Siv
  description: |
    A slight figure with a forgettable face -- the kind of person you
    could describe to a guard and they would match half the population.
    Siv operates from a back-alley room with a reinforced door and a
    viewing slot, buying goods without asking questions about provenance.
    The prices are lower than legitimate merchants offer, but the
    transactions are fast and anonymous. Siv is polite, professional,
    and absolutely disinterested in your reasons for selling.
