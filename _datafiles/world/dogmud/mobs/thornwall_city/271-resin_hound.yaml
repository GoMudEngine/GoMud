character:
  name: resin hound
  description: |
    A large, lean dog with a coat thickened and stiffened by repeated
    contact with chrysalis resin -- the compound has bonded to its fur
    in patches, giving it an uneven texture somewhere between leather
    and scale. Its eyes are pale and over-attentive, tracking movement
    with a precision that feels wrong for an animal. The chrysalis
    exposure has heightened something in its senses. It picks up scent
    through walls and detects sound at frequencies that should register
    as silence. It does not bark. It arrives at a dead run, already
    committed, from a direction you did not expect.
