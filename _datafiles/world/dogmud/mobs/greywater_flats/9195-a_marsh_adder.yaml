character:
  name: A Marsh Adder
  description: |
    A thick-bodied adder marked in dark chestnut diamonds on pale brown,
    coiled in the reed roots where the marsh shallows meet the bank. Its
    pupils are vertical slits in any light, its jaw set with the slight
    underbite of a viper bred for striking upward. It hunts by ambush --
    lying motionless until warm-blooded movement comes within range, then
    committing in a single lunge. The venom is not fatal to a healthy adult
    but causes intense pain and dramatic swelling. It will not pursue prey
    that flees; it will not back down from anything already in striking
    distance.
