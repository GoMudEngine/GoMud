character:
  name: A Marsh Fisher
  description: |
    A figure of indeterminate middle age crouched at the north bank,
    reed-knife at the belt and a net bundled over one knee, entirely at
    home in the grey half-world between water and sky. He speaks when
    spoken to and not otherwise, his attention given over to whatever the
    river is doing -- the set of the current, the movement of the float,
    the slow weight of an eel-trap. The first joints of his fingers carry
    a translucent webbing, gossamer-thin, the shade of creek water held
    up to light; he was born with it, finds it useful for swimming the
    ford channels, and has never thought much more about it than that.
  speciesid: 1
  level: 1
  gold: 5
  stats:
    dexterity:
      training: 6
    perception:
      training: 8
