character:
  name: Tamsin Reed
  description: |
    A lean woman of middle years, sun-dark and wind-roughened, who has
    ferried travellers across the grey river for longer than the toll-post
    has stood at Greywater Ford. She poles her skiff with unhurried
    precision, reads the current in a single glance, and charges a flat
    fare she has not changed in a decade. She is not unfriendly but is
    not given to conversation -- questions about conditions upriver she
    answers in two words or fewer. The skin of her palms and the backs
    of her hands carries a fine grey-green scale texture, the pattern
    and faint sheen of river-worn slate taken up permanently into the
    skin; the grip it gives her on a wet pole is the only thing she has
    ever found worth mentioning about it.
