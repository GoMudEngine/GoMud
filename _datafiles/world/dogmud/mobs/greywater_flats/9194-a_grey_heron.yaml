character:
  name: A Grey Heron
  description: |
    A tall, slate-grey bird standing still as carved driftwood at the
    water''s edge, its sinuous neck folded in an S against its chest and
    one blade-yellow eye fixed on the shallows below. It hunts by patience
    -- standing motionless for minutes at a stretch before striking with a
    bill like a thrown knife. In flight it is all slow wing-beats and
    trailing legs, more pterosaur than bird, crossing the marsh in long
    unhurried arcs before folding back into stillness somewhere along the
    bank. It will not stay where it is not left alone.
