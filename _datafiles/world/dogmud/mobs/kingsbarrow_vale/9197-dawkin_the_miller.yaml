character:
  name: Dawkin the Miller
  description: |
    Dawkin the Miller is white with flour from his collar to his boots,
    a permanent condition he has long since stopped contesting. He is a
    big man made bigger by years of sack-work, with forearms like roof
    beams and the slightly remote expression of someone who spends most
    of his day inside a noise. The millwheel has taken the edge off his
    hearing, so he speaks in the measured shout of a man who has learned
    to pitch his voice for the far end of a room. His ears are the tell:
    they have slowly grown cupped and mobile over the years, swiveling
    in small arcs toward whoever is speaking, catching words the wheel
    would otherwise take -- a Chrysalis adjustment so quietly useful
    that his family stopped remarking on it before any of the children
    were old enough to remember them any other way.
