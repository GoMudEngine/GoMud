activitylevel: 8
character:
  name: Parson Ellet
  description: |
    Old Ellet has tended the harvest-church at Kingsbarrow for so long
    that the corn-dolly faith has bent itself slightly to fit him, or
    he has bent to fit it -- it is difficult now to tell which. He is
    slight, white-haired, and pleasantly vague in conversation, the
    kind of man who forgets what he was saying mid-sentence and is
    entirely undisturbed by this. He blesses everything: the planting,
    the cutting, passing carts, children he only half-recognizes. His
    voice carries an odd quality inside the stone church -- a low
    second tone beneath his words, as though two voices are speaking
    in near-perfect unison, a Chrysalis harmonic that settled into him
    some years ago. Parishioners say it sounds like an organ tone. The
    parson calls it a gift and seems to mean it without irony.
