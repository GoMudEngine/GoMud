character:
  name: Brannick Oats
  description: |
    Brannick Oats has kept the Sheaf and Sickle so long that the inn
    smells of him, or he of it -- woodsmoke, yeast, and pulled ale
    woven into his skin like a second apron. He is generously round,
    floury to the elbows most mornings, and possessed of the particular
    warmth of a man who genuinely likes people and has never seen a
    reason to pretend otherwise. Sit within arm's reach of him in cold
    weather and the warmth becomes literal: a gentle, steady heat
    radiates off him as though he contains a permanently banked hearth,
    a Chrysalis drift that arrived so gradually no one in the vale can
    name the year it started. He has never mentioned it. The Sheaf and
    Sickle is simply known as the warmest house in Kingsbarrow, and
    Brannick accepts the compliment without elaboration.
