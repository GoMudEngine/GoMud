character:
  name: Steward Marrow
  description: |
    Steward Marrow runs the Barleywick estate with the clipped efficiency
    of a man who answers to people in the capital and intends to keep
    it that way. He is of middling height, close-cropped, immaculately
    dressed for the countryside, and carries an air of absolute
    administrative authority that the tenant farmers find either
    reassuring or oppressive depending on their situation. He has looked
    exactly this way for twenty years. His hair does not grow -- not
    slower than most men's, but not at all -- and neither does his
    beard, leaving him perpetually the same close-trimmed figure in
    every season, a Chrysalis stillness that has begun to attract
    quiet comment among the longer-tenured farmhands. The factor in
    New Plymouth noted in a letter last year that Marrow appears
    unchanged since his appointment. No one has followed this
    observation to its conclusion aloud.
