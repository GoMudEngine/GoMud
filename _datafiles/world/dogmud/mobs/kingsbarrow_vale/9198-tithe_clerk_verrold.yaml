activitylevel: 9
character:
  name: Tithe-Clerk Verrold
  description: |
    Verrold has occupied the same table in the Great Tithe Barn for
    eleven years, and the barn has come to feel built around him. He
    is thin, dressed in the rust-brown broadcloth of a capital office
    clerk, and carries the precise, joyless manner of a man whose
    entire professional identity rests on the accuracy of his columns.
    He tallies the tenth owed to New Plymouth with an unhurried
    thoroughness that the village farmers have learned not to argue
    with. What unsettles people, if they watch long enough, is his
    hands: they are utterly, inhumanly still. Set a quill against
    paper and the line is a machine's line, without tremor or
    deviation, a Chrysalis-given steadiness he has never mentioned
    and perhaps never thought to question. It makes his ledger-work
    immaculate. It also makes him difficult to look at for long.
