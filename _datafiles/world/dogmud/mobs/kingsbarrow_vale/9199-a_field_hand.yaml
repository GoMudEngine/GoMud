activitylevel: 8
character:
  name: A Field Hand
  description: |
    Sun-darkened to the color of old leather, with the flat, tired eyes
    of someone who has done the same hard work since before he had the
    words to name it. He moves along the crop-rows with a slow economy
    that has shed every unnecessary motion over years of repetition.
    His feet are bare, always -- he has not worn boots since he was a
    boy. The soles have thickened over the years into something layered
    and hard, like softwood worn smooth, a Chrysalis change so gradual
    that no one who has known him long remembers the transition. He
    walks on cut stubble and churned clay without flinching, and the
    estate has not spent a penny on his footwear in a decade.
