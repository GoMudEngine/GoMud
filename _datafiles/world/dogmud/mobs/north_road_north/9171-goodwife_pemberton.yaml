character:
  name: Goodwife Pemberton
  description: |
    A compact, quick-moving woman in her middle years, Pemberton
    runs the Lake and Ladle with the calm authority of someone who
    has never once been caught off-balance by a difficult customer.
    Her hair is black going silver at the temples, pinned back and
    covered with a clean linen cap. Her apron is always spotless
    for the first hour of morning and comprehensively stained by
    the second. She notices everything -- who has been drinking
    since noon, who is quarreling quietly with their travel
    companion, who is watching other people's purses. Her eyes are
    an amber so deep they shade toward copper, with a faint ring
    of gold at the pupil that catches the firelight: a Chrysalis
    touch that she neither hides nor discusses. She gives good
    portions and charges fair prices and expects you to behave
    yourself.
