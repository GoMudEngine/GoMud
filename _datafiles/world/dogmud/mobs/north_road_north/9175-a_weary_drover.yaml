activitylevel: 8
character:
  name: A Weary Drover
  description: |
    A lean, road-burned man resting at the pull-off with his cattle
    browsing the verge around him. He has the particular stillness
    of someone who is tired in a way that goes all the way down --
    not sick, just worn. His staff is taller than he is, worn smooth
    at the grip end, and he leans on it the way most people lean on
    walls. He is happy enough to share road news if you give him a
    moment to organize his thoughts. The backs of his hands and the
    bridge of his nose show a faint, pearlescent sheen in full
    light -- a Chrysalis effect that has laid a thin, tough layer
    over his most sun-exposed skin. It looks like old scar tissue
    until the light hits it right. He does not seem to notice it
    anymore.
