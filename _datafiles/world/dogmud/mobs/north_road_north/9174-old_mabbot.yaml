character:
  name: Old Mabbot
  description: |
    A wiry man of indeterminate age bent slightly forward by a
    truly impressive pack, Mabbot has been walking this stretch of
    road since before the toll-post was built. He has news from
    everywhere and an opinion on all of it, delivered at an unhurried
    pace that suggests he has nowhere particular to be and no
    intention of arriving quickly. His pack contains rope, tinder,
    dried meat, small charms of debatable efficacy, and apparently
    everything else ever lost on a road. His eyes are unusually
    keen for a man who squints so often -- the irises are a pale,
    washed-out gray that catches light in odd angles, a Chrysalis
    shift that has given him something closer to night-adapted
    vision than is strictly normal for a peddler who mostly travels
    in daylight. He finds this useful and does not advertise it.
