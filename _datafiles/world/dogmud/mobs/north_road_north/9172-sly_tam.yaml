character:
  name: Sly Tam
  description: |
    A slight man in a shabby brown coat with too many pockets, Tam
    works the Lake and Ladle's common room with the patience of
    someone who is very good at waiting. He has a warm, easy smile
    he deploys at frequent intervals, and he always seems to be
    heading somewhere just past you. His hands are his tell, if
    you know to watch them -- the pinky and ring finger of each
    hand carry a faint extra crease below the first joint, a
    Chrysalis quirk that gives his grip an eerie exactness.
    Pickpockets trained for years to get what Tam's fingers do
    naturally. He is not dangerous in a fight but he is quick, and
    he is gone before most people realize something is missing.
