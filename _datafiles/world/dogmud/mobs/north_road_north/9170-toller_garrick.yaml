  - 'emote drags the pole back down and secures the rope around the
    bollard cleat.'
  - ''
  - 'emote squints at his toll-board and taps a chalk mark with one
    stubby finger.'
  - 'emote digs in his apron pocket and sorts a handful of coppers,
