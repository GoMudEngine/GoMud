activitylevel: 10
character:
  name: Toller Garrick
  description: |
    A heavyset man somewhere past sixty, Garrick has worked the
    Thornwall tollgate so long that the post seems to have grown
    into him. His leather apron is stained with chalk and road
    grime, and his face carries the permanent squint of someone
    who has spent decades judging whether carts are overloaded.
    He is unhurried, incurious, and not quite honest -- the toll
    on his board has always been a few coppers higher than the
    posted rate, and he collects the difference with the serenity
    of a man who knows the next nearest crossing is a full day's
    walk. The skin on his forearms has taken on a faint grayish
    cast over the years, dry and ridged like old bark -- a subtle
    Chrysalis drift he has never bothered to name or complain
    about. It makes his arms look permanently dusty, which suits
    him fine.
