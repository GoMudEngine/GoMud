character:
  name: a hedgerow bandit
  description: |
    A rough, broad figure crouched in the ditch beside the Mire
    Cutoff, wearing a coat so mud-caked it reads as camouflage.
    The bandit has a fighter's build -- heavy through the shoulders,
    with scarred forearms and hands that look like they have broken
    things many times. A short blade rides at the hip, well-used
    and maintained better than anything else about him. His face
    is weathered past easy age-reading, jaw set in the patient
    expression of someone who has done this before. The veins at
    his temples and forearms stand out in dark cords against pale
    skin -- a Chrysalis effect that has thickened his blood vessels
    and given him an unnerving look of pressure contained just
    below the surface.
