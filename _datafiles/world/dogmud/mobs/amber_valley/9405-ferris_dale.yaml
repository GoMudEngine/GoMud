character:
  name: Ferris Dale
  description: |
    Ferris works the craft-lane, a finisher and a fixer who does the close
    work others bring him -- inlay, fine-stitching, the scribing of patterns
    too small for an ordinary hand. He is young and quick and a little vain,
    with the showman's habit of letting you watch him work. His Blooming is
    made for exactly his trade: his fingertips have hardened into smooth
    pointed caps of horn, and his nails have grown to short curved talons that
    shift colour in the light, honey to amber to near-black, like polished
    tortoiseshell. He uses them as awl and stylus and burnisher all at once,
    needing fewer tools than any man on the lane, and he is not shy about
    flashing them when there's an audience to flash them at.
