character:
  name: Goss Harrow
  description: |
    Goss keeps the valley's general store, a single low room crammed floor to
    rafter with seed and twine, salt and nails, lamp-oil and boot-grease and
    every other thing a farm forgets it needs until the moment it needs it.
    He is a square, deliberate man, slow to speak and slower to be hurried,
    with a memory for prices that goes back further than his ledgers do. From
    each temple rises a short, blunt nub of amber keratin, no longer than a
    thumb-joint -- horns, plainly, though they have stopped growing and serve
    no purpose but to be admired. He keeps them filed smooth and faintly
    polished, and is quietly vain about them in the way of a man who has
    decided to like the hand he was dealt.
