character:
  name: A Sun-Lizard
  description: |
    A heavy-bodied lizard the length of a man's forearm, the colour of the
    sun-baked rubble it lives among, banded in dusty ochre and char-grey so
    that it vanishes the instant it stops moving. It is a creature of the hot
    scrub, sluggish in the cool of dawn and lightning-fast once the stone has
    warmed it, and it does not like things blundering through its basking
    ground. A frill of loose skin at its throat can flare a startling orange
    when it means to threaten, and its bite, while no great danger to a
    healthy traveller, is quick, hard, and meant to make you take your boots
    elsewhere.
