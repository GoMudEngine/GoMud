character:
  name: A Cave Lurker
  description: |
    The thing that owns the deep den is bigger than anything else under these
    hills, and it has never once needed to leave to feed -- it waits, and the
    dark brings it dinner. Half again the size of a man, it is a low armoured
    bulk of slate-grey plate and folded limbs, blind as all the deep things
    are and twice as patient, wedged into the back of its lair where the air
    goes still and cold. It hunts by ambush and ambush only: it will let a
    warm body come all the way in, all the way to the back wall, before the
    folded limbs unfold all at once and the dark becomes teeth. It does not
    pursue beyond its own den -- it has never had to -- but within those walls
    it is the surest death in the valley, and the bones scattered across its
    floor are the only warning you will get.
