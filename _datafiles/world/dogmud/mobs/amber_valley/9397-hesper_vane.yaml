character:
  name: Hesper Vane
  description: |
    Hesper runs the Golden Bough, and the Golden Bough is where the valley
    comes to find out what the valley is thinking. She is tall and spare,
    grey threading her dark hair, with a quick warm mouth and eyes that miss
    nothing -- the sort of landlady who can pour you a cup, take your measure,
    and decide your business all in the one motion. Her Blooming is a dusting
    of pale freckles across her cheekbones that kindle to a soft green glow
    when feeling runs high in her, gentle when she laughs, sharper when she is
    angry; her regulars read her mood by it the way sailors read a lamp. She
    is warm with everyone and patient with most, but she is bone-tired of the
    two farmers feuding over the head-gate, and the freckles burn a hard green
    every time the matter comes up in her common-room.
