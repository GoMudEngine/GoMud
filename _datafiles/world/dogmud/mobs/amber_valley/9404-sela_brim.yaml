character:
  name: Sela Brim
  description: |
    Sela keeps a market stall on the valley square, selling whatever the
    season hands her -- plums and greens now, walnuts and pressed cider come
    autumn. She is brisk and bright and built for the haggle, with a laugh she
    deploys like a closing argument. Her Blooming is the prettiest in the
    market and she knows it: a spray of small living blossoms has opened along
    her collarbone and the slope of her shoulders, real flowers rooted in her
    skin, pale pink and faintly sweet-scented, and they open wider in the sun
    and fold half-shut in the cool of evening. She wears collars cut low to
    show them off, tucks a fresh one behind her ear when one drops, and would
    no more hide them than she'd hide good coin.
