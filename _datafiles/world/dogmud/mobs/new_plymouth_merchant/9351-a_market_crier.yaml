character:
  name: A Market Crier
  description: |
    The market crier works the Central Square from first light to
    midday in a circuit from the proclamation-post to the fountain
    approach, his voice a brass instrument tuned by long practice
    to carry over the crowd without breaking. He does not read from
    notes — the prices and guild notices are in his head, updated
    each morning from the exchange boards, and he delivers them
    without variation or error. He is paid by the guild of recognized
    merchants and is considered neutral infrastructure, which means
    everyone finds him useful and no one particularly likes him.
