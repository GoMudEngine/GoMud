character:
  name: A Moneylender's Clerk
  description: |
    The clerk manages the changers-desk in Coin Alley with the
    contained efficiency of someone who has been doing this long
    enough that the work is automatic and the watching is the real
    job. Ink marks the outer edge of his right hand from wrist to
    knuckle in a pattern left by the same type of pen used the same
    way for years. He handles denomination queries, rate disputes,
    and the occasional difficult customer with a tone that is
    professional, brief, and entirely without warmth. He does not
    advertise the desk and does not need to.
