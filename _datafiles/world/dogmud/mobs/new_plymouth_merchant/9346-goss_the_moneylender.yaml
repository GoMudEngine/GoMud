character:
  name: Goss the Moneylender
  description: |
    Goss the Moneylender works the Exchange's lending desk with the
    flat affect of a man who measures everything in two categories
    — what it costs and what it earns — and is entirely comfortable
    with those being the only two that matter. His Chrysalis-change
    came in the hands, not visibly but functionally. Touch a coin to
    his palm and he tells you its weight, its purity, and its worth
    to the half-grain without scales or assay. He uses this to make
    a point he does not need to make — that nothing crosses his desk
    without his knowing exactly what it is. He holds debts across
    most of the city's districts, including a number of Common Quarter
    residents who had a difficult last winter. He is precise, cold,
    and entirely reasonable, provided reasonable means doing things
    his way.
