character:
  name: Madam Sephe
  description: |
    Madam Sephe runs the Gilt Rest with the composed authority of
    someone who has been making people comfortable for a long time
    and knows exactly how that is done. Her Chrysalis-change is not
    a thing you can locate precisely — it presents as warmth, as
    ease, as the particular sense that you are welcome here
    specifically and she is genuinely glad you came. People tell
    her things they had not intended to tell anyone. She does not
    encourage it. She does not discourage it. She keeps what she
    hears behind the same pleasant expression she offers every
    guest, and she has been keeping things behind it long enough
    that there is probably quite a lot back there. The Gilt Rest
    has a private parlor off the main room for guests who prefer
    their business conducted away from the bar. She is discreet
    about who uses it.
