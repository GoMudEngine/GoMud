character:
  name: Falk the Auctioneer
  description: |
    Falk the Auctioneer runs the Exchange's bidding floor with a
    memory that has never once failed him. Every face that has
    crossed his threshold, every price called in his rooms, every
    lot that changed hands under his gavel — he retains all of it
    with the same unhurried certainty he uses to quote last season's
    sale figures without consulting a ledger. His Chrysalis-change
    is subtle and unsettling in equal measure — he simply does not
    forget. He is well-dressed in a manner that suggests prosperity
    without display, and keeps his prices firm. The Exchange also
    handles property registrations and estate transfers on the
    Square's behalf — a clerical function Falk has performed for
    long enough to know where most of the city's ownership lines
    actually run, as opposed to where the deeds say they do.
