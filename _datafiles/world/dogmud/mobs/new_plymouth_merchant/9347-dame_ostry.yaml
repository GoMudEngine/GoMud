character:
  name: Dame Ostry
  description: |
    Dame Ostry's shop fills one of the better ground-floor spaces in
    the Square, and she occupies it without crowding. The third arm
    is the first thing anyone notices — it grew from her left shoulder
    in the years after her Bloom, a full working limb, slightly longer
    than the other two and habitually in motion when the right two are
    occupied. She does not hide it or explain it. She uses it to hold
    a blade she is examining while the other two hands grade the edge
    and check the balance, which is the obvious use and the one she
    settled on immediately. She deals in steel — finished weapons and
    the raw material that goes into them — and she is relentlessly
    practical about all of it. Halvard the smith in the Crafting
    Quarter sends her his better work. She moves it north to buyers
    who can pay what good steel is worth.
