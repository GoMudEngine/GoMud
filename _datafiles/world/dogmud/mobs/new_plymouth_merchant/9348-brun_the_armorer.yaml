character:
  name: Brun the Armorer
  description: |
    Brun the Armorer is a large man, and the Chrysalis made him
    larger in the ways that count. His skin has hardened over the
    years since his Bloom into something between leather and shale —
    layered and callused, ridged at the joints in a way that catches
    the light like hammered plate. He tests his own chainwork by
    wearing it against bare skin before he sells it, which is a kind
    of quality assurance most armorsmiths cannot offer. He stocks
    chain and leather components alongside finished pieces, and he
    will fit anything he carries. He is not a warm man, but he is
    thorough, and in his line of work thorough is the quality
    that matters.
