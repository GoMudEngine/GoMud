character:
  name: Master Coyne
  description: |
    I keep the Exchange's accounts and I keep them precisely --
    every deposit, every withdrawal, every numbered strongbox
    matched to the name on its lease. I do not raise my voice
    and I do not lose a figure. My coat is grey because grey
    does not show ink, and my hands are steady because thirty
    years behind this counter will make anyone's hands steady
    or put them out of the trade entirely. I have counted more
    of this city's gold than I care to total, and none of it
    has ever gone missing on my watch.
