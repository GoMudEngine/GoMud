activitylevel: 3
character:
  name: A Well-Dressed Customer
  description: |
    The customer moves along the Gilded Walk with the unhurried
    pace of someone who does not need anything urgently and is
    aware that appearing to need nothing urgently is itself a form
    of currency here. His coat is good wool, his boots are clean,
    and neither of these facts is accidental. He considers window
    arrangements with a slight tilt of the head that does not
    commit him to entering, and occasionally does not enter.
    Whatever he is actually here for, browsing is the cover for it.
