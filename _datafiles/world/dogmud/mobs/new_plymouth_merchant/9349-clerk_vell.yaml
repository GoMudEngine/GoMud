character:
  name: Clerk Vell
  description: |
    Clerk Vell processes permit applications, tribute filings, and
    registration queries from a high desk in the Quarter's civic
    office with an air of complete administrative calm. He is young
    to hold the position — mid-twenties at most — and precise in the
    way that people who have been granted institutional authority
    early sometimes become. His Chrysalis-change is small and easily
    dismissed — a seal-shaped birthmark on his right palm, the exact
    impression of an official stamp, in dark ink he was born with
    rather than acquired. He does not use it. He does not need to.
    The desk does his work for him, and the bloodline stands behind
    the desk. The residents of the Quarter are uniformly polite to
    him. They do not have a better option.
