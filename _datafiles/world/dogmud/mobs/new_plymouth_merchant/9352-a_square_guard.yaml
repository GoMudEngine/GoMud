character:
  name: A Square Guard
  description: |
    The guard wears bloodline house-colors over a padded gambeson
    and stands at a position that covers both approaches to the
    square without obviously covering either — the placement is
    deliberate, the posture learned, the attention too consistent
    to be accidental. She is civic muscle operating at the edge of
    bloodline authority, licensed to keep order in this district
    and paid accordingly rather than by the city. She does not
    start trouble. She ends it, with the calm of someone who has
    already calculated where on the street she will have room to
    move if it comes to that.
