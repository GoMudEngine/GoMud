character:
  name: Horst
  description: |
    Horst keeps the gate of the watched house with the patient ease
    of a man who has learned that stillness is its own authority.
    He is neither large nor particularly striking — his power runs
    quieter than that, in the quality of a well-kept coat and the
    way his gaze maps a space and files everything it finds. He
    carries no visible weapon. He shows no Chrysalis-change at all —
    skin plain, hands unmarked, face ordinary in every way that
    matters. In a city where the Bloom touches nearly everyone who
    stays long enough, the absence of mutation is itself a statement.
    Whatever the bloodline selects for in its handlers, Horst was
    positioned before any of it arrived.
