activitylevel: 12
character:
  name: caravan driver Ketil
  description: |
    A lanky, sun-leathered man who has run the Stillwater-Thornwall route
    more times than he can count, which he considers a professional
    achievement and a personal failing in equal measure. He hauls dried
    fish, lake-iron, and the occasional passenger north and south, and he
    knows every inn, bad stretch of road, and shortcut between the two
    towns. Ketil is a practical man who may occasionally have room on his
    wagon for messages or small freight, if the offer is reasonable and the
    cargo does not ask questions.
