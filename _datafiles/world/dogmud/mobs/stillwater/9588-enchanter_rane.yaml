character:
  name: Enchanter Rane
  description: |
    Rane works with the unhurried patience of someone who has burned
    a hand or two learning not to rush the binding. Lake-damp has
    swollen the workshop's timbers, so the door never quite shuts,
    but the enchanting circle at the center of the room stays bone
    dry no matter the weather. Rane's fingers are stained faint
    green from years of handling chrysalis dust, and the enchanter
    talks more to the shards than to visitors -- though visitors
    are welcome to listen in.
