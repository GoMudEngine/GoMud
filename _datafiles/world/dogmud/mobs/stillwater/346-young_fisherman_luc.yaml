character:
  name: young fisherman Luc
  description: |
    A lean young man with sun-darkened skin and paint-chipped boots that
    have seen every weather the lake produces. Luc is not quite twenty and
    has been fishing the shallows since he could hold a rod. He is easy
    company, direct in the manner of someone who has not yet learned to be
    guarded, and genuinely enthusiastic about the lake and its moods. He
    has been keeping to the beach lately rather than the deeper water, which
    he will tell you plainly is because the cave currents have been strange
    and the old fisherman says to watch the tides.
