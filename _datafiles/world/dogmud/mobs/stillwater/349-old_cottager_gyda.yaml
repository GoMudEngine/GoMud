character:
  name: old cottager Gyda
  description: |
    A small, round woman of considerable age who appears to have taken up
    permanent residence on her front porch. Gyda has lived on Cooper's Lane
    for as long as anyone can remember and knows the history of every house
    on it. She is openly curious about strangers and will ask direct questions
    without apology. She also volunteers information freely -- who lives where,
    who was seen talking to whom, and who has been behaving oddly since the
    lake trouble started. Her hearing is sharper than it looks.
