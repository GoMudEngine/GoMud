character:
  name: A Riverway Factor
  description: |
    A Riverway Factor keeps her handcart lashed and ready at the
    pier's edge, waiting on the Grey Heron the way a farmer waits on
    weather. She rides downriver to the Confluence with lake mint and
    freshwater clam packed in damp cloth, and comes back with
    watercress and river mussels before either can spoil. Her ledger
    is a single grease-stained slip she reads by feel more than
    sight, and she has never once missed a sailing.
