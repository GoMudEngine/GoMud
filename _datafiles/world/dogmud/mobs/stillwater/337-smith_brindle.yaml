character:
  name: smith Brindle
  description: |
    A big, quiet man with arms like dock rope and a face that has absorbed
    years of forge heat into a permanent brick-red flush. Brindle inherited
    the smithy from his father and has never wanted to be anywhere else. He
    speaks slowly and rarely, but his work speaks for itself -- clean lines,
    solid welds, nothing fancy. He can work lake-iron nodules pulled from the
    shallows into serviceable blades, which is a rare skill on the North Road.
    There is a half-finished hook-spear on the bench behind him that he keeps
    returning to between other jobs.
