character:
  name: child Pip
  description: |
    A small, gap-toothed child of perhaps nine years, with muddy knees and
    an expression of complete absorption in whatever is happening in the
    shallows below. Pip lives on the lake path and considers the entire
    lakeshore a personal territory. Pip is happy to talk to travelers and
    will ask where they are going, what they are carrying, and whether they
    have seen anything interesting in the water lately. The question about
    the water is asked with slightly more anxiety than the others.
