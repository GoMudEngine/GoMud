character:
  name: weaver Edda
  description: |
    A soft-spoken woman with ink-dark hair and the kind of stillness that
    comes from years at a loom. Edda dyes her cloth with plants from the
    lake margins -- cattail, reed, and the grey-green bark of marsh willow --
    and her work has a muted, watery palette that is distinctly Stillwater's
    own. She sells finished garments and raw materials both. Her cottage
    smells of lanolin and damp wool, and there is always a cloak on the
    frame in some stage of completion. She is not Maren of Thornwall, and
    she knows it; her work is simpler, but it lasts.
