character:
  name: sump dweller
  description: |
    The thing that has been raiding Stillwater's fishing nets
    for years rises now from the black sump-pool at the cave's
    deepest point — a massive amphibious predator perhaps four
    times the bulk of the largest drowned hunter, with the same
    mottled grey-black hide and the same pale sightless eyes
    but on a scale that takes the breath out of a careful
    fighter. A double row of backward-curving teeth lines a
    mouth wide enough to swallow a person to the waist. The
    sump dweller does not need to swallow whole; the teeth and
    the sheer crushing weight of it are enough. It is older
    than anyone in Stillwater alive remembers, and patient,
    and very hungry.
