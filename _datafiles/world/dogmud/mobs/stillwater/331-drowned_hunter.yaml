character:
  name: Drowned Hunter
  description: |
    A long elongated mutated lake-eel, perhaps the length of a
    grown person from snout to tail-tip and as thick as a
    person's calf at the body's middle. Its skin is mottled
    grey-black and slick with cold water; pale lampreys' eyes
    sit flush with the head, betraying the hunter's position
    only by their faint shimmer in the dark. The drowned hunter
    waits motionless in the deepest water of a cave-pool until
    something edible passes within reach, then strikes faster
    than the eye can follow. Local fishermen call it the cave-
    eel; whatever it is, it has been savaging the nets at the
    docks for years.
