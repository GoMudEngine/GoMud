character:
  name: Mistress Vella Thorne
  description: |
    A sturdy older woman with iron-grey hair gathered into a practical
    twist and the steady hands of a healer who has not lost the touch.
    Mistress Thorne -- never just Vella to anyone but family and old
    friends -- runs the cottage as both her front office and her
    stillroom, and has done so for thirty years. She is plainspoken,
    capable, and quietly authoritative; the town brings her its
    fevers, its broken bones, and its hard truths in roughly equal
    measure. Behind the steady manner there is something older than
    her years, set in the lines around her eyes -- a grief she has
    held herself responsible for, in private, for a long time. She
    does not speak of her brother to strangers, and she does not
    speak of him to most of the town either. The people who knew
    Elgar know.
