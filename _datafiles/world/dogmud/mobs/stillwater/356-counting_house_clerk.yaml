character:
  name: counting house clerk
  description: |
    A slight, watchful person in a coat of plain dark wool,
    ink-stained at the right cuff and the left forefinger
    where the pen rests. The counting house clerk works with
    the unhurried precision of someone who has learned that
    a single misplaced figure can ruin a fisherman's season
    or sink a ship-loan. A cord around their neck disappears
    beneath the coat -- the strongbox key, worn close and
    never mentioned. They know the name of every account in
    those pigeonholes, the weight of every pearl-lot that
    has passed across this counter, and roughly how much
    each of Stillwater's boat-owners owes and to whom.
    They do not share this knowledge, but they do not
    pretend not to have it either.
  speciesid: 1
  level: 1
