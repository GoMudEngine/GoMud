character:
  name: miller Bram
  description: |
    A flour-dusted man with a broad back and the satisfied air of someone
    doing a job he enjoys. Bram runs the watermill at the creek's edge,
    grinding grain for the households and the bakehouse. He is cheerful in
    an uncomplicated way, interested in weather and water-flow, and happy
    to explain the mill's workings to anyone who shows curiosity. His flour
    is reliably good. He sells it direct from the mill by the sack, and he
    will also mill grain you bring yourself for a modest fee.
