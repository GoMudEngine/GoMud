character:
  name: storekeeper Wulf
  description: |
    A round-faced man with the unhurried manner of someone who has never
    needed to rush and has no intention of starting. Wulf runs Tinder &
    Tackle as a general store -- a little of everything, most of it useful,
    none of it particularly cheap. He is the kind of merchant who remembers
    exactly what he paid for every item on his shelves and will cheerfully
    tell you if you ask. His store smells of lantern oil, salt, and old rope,
    and there is a cat asleep behind the counter that he swears keeps the
    mice out.
