character:
  name: fishmonger Tov Brann
  description: |
    A compact, quick-eyed man who smells permanently of brine and cold
    water. Tov has worked the lakefront stall since he was old enough to
    carry a crate, and he knows which boats came in full and which came in
    light before the dock master does. His hands never stop -- sorting,
    wrapping, passing coin -- and his patter is cheerful even when the
    catch is poor. He sells freshwater clam and raw fish from the
    morning haul. Business is thin lately, with half the nets coming
    back torn.
