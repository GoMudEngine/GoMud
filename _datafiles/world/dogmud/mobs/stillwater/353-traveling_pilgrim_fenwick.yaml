character:
  name: traveling pilgrim Fenwick
  description: |
    A mild-looking man of uncertain age, wearing travel-stained robes and
    carrying a walking staff worn smooth at the grip. Fenwick is passing
    through Stillwater on a longer pilgrimage -- to what end he is vague, in
    the manner of pilgrims who consider the walking the point. He is educated,
    gentle-spoken, and observant. He notices things about Stillwater that a
    local would not -- the particular quality of the water, the age of the
    buildings, the way the town faces the lake rather than the road. He is
    resting his feet before continuing north.
