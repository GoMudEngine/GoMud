character:
  name: dock master Arn
  description: |
    A weathered man with a sun-scored face and eyes the color of deep water.
    Arn has managed the Stillwater docks for over two decades, keeping the
    boat ledgers, settling disputes over moorings, and knowing which tides
    run where. He is not easily alarmed, which makes his current mood notable
    -- three boats have returned in the past fortnight with nets shredded and
    catches barely half what they should be, and the damage pattern points
    straight to the lake caves. He is looking for someone capable of looking
    into the matter and would pay well to see it resolved.
