character:
  name: caravan guard Marta
  description: |
    A stocky woman with a short-cropped head and the flat watchfulness of
    someone whose job is to notice things before they become problems. Marta
    guards Ketil's wagon on the Thornwall run and has done so for three
    seasons without incident, which she attributes to looking dangerous enough
    to discourage testing. She does not make conversation with strangers but
    will answer direct questions briefly and without rudeness. She keeps an
    eye on the town while they are stopped, which is simply habit.
