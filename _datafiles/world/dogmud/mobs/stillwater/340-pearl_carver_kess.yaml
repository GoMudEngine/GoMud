character:
  name: pearl-carver Kess
  description: |
    A precise woman with small, careful hands and grey-streaked hair wound
    close to her head. Kess came to Stillwater from the coast fourteen years
    ago, drawn by the lake's black pearls, which she considers finer than
    anything the sea yields. She carves and sets them herself, working with
    silver wire and polished stones from the shallows. Her garret smells of
    metal filings and beeswax. She is not unfriendly, but she is economical
    with words and attention, and her eyes return to whatever she is working
    on before you have quite finished speaking.
