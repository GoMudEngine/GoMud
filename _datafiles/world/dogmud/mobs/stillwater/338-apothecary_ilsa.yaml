character:
  name: apothecary Ilsa
  description: |
    A thin woman in her middle years with herb-stained fingers and reading
    spectacles pushed up into greying hair. Ilsa trained under an apothecary
    in Thornwall for seven years before coming back to Stillwater, and she
    has been the town's healer ever since -- treating fevers, setting bones,
    and sending people away with potions she mixes herself from lake plants.
    She is brisk and competent, with the quiet impatience of someone who
    sees too many patients who waited too long to seek help. The lake mint
    she uses in her tonics grows in the shallows, and she has been short of
    it since the cave trouble started.
