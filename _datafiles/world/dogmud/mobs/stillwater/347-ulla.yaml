character:
  name: Ulla
  description: |
    A still, dark-eyed woman past the middle of her years, with the kind
    of contained grief that has calcified into habit. Ulla's husband Voss
    died twelve years ago in circumstances the town accepts without question
    and she has never stopped turning over in her mind. She keeps the
    cottage tidy and the workshop locked. His niece Maren, who weaves in
    Thornwall City, writes occasionally; Ulla answers when she can find the
    words. There is something she knows about her husband's last weeks that
    she has not told anyone -- not the constable, not the priest -- and it
    sits in her like a stone. She would speak of it, if someone asked
    the right questions.
