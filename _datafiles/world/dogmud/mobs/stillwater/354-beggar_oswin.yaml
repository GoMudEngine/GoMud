character:
  name: Beggar Oswin
  description: |
    A thin man with a grey stubble beard and the sunken look of someone
    who has been sleeping rough for a while. Oswin was a fisherman until
    his boat took on water two seasons back and was not worth the repair.
    Since then he has been doing odd jobs and not finding enough of them.
    He is not aggressive and does not beg with drama -- just a hand out,
    a brief moment of eye contact, and acceptance of whatever follows. He
    knows the square and the waterfront well and is happy to talk if
    someone has a spare coin and a moment.
