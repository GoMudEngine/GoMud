character:
  name: constable Drunn
  description: |
    A heavyset man with a short grey beard and the measured movements of
    someone who stopped hurrying decades ago and has not regretted it since.
    Drunn has been Stillwater's sole constable for eleven years and knows
    every face in town, every feud, and most of the gossip. He carries a
    well-worn club at his belt more out of habit than expectation. His real
    concern at the moment is the fishing nets -- three boats have come in
    half-empty since the cave flooding, and the dock master has been bending
    his ear about it daily.
