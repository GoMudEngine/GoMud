character:
  name: temple priest Seren
  description: |
    A calm woman with a round, open face and the unhurried manner of someone
    whose faith is a working tool rather than a performance. Seren came to
    Stillwater eight years ago from a larger temple in Thornwall, assigned to
    this modest posting without complaint, and has stayed because she finds
    the lake town suits her. She tends the altar, hears confessions, and
    handles the occasional healing with equal seriousness. There is a quiet
    grief in her lately -- one of the older fishing families has not been at
    services, and she suspects the trouble on the lake is the reason.
