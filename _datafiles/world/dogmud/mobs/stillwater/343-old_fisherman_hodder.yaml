character:
  name: old fisherman Hodder
  description: |
    A gaunt, rope-armed man with a white beard and knuckles that have been
    broken and set too many times to be fully straight. Hodder mends nets in
    the yard every morning and has been doing it for forty years. He no longer
    takes his own boat out -- a bad season three winters back left him with a
    knee that does not trust cold water -- but he is a fixture of the docks
    and knows the lake better than anyone younger. He mutters observations
    while he works, half to himself and half to whoever happens to be nearby,
    and his observations are usually correct.
