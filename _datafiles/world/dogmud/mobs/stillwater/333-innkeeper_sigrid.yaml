character:
  name: innkeeper Sigrid
  description: |
    A broad-shouldered woman with sun-bleached hair pulled back in a tight
    braid, Sigrid has run the Pike & Lantern since her mother left her the
    keys and moved south. Her hands are always moving -- polishing, stacking,
    setting things right -- and she tracks every person who walks through the
    door with the easy attention of someone who has learned that trouble
    usually announces itself before it acts. She is friendly in the way of
    someone who needs your coin but would also like you to leave promptly.
    There is a watchfulness in her gray eyes that suggests she hears more of
    what is said in her common room than she lets on.
