  - ''
activitylevel: 10
character:
  name: The One Who Came Back
  description: |
    A gaunt man who keeps a small fire burning under the rock
    overhang, though he does not sleep near it. The left sleeve
    of his coat is folded and tied above the wrist -- the hand
    has been gone for years, the wound closed smooth and old. He
    watches the east with the measuring attention of a man who has
    spent a long time watching it and learned to do so from a
    certain distance. He flinches sometimes at sounds that are not
    there. He catches himself and goes very still, the way a man
    goes still when he has already decided something and is waiting
    to see if he is right. His Chrysalis-change lives behind the
    eyes -- an awareness that swings toward a doorway a full breath
    before anyone steps through it, a knowing that runs slightly
    ahead of the moment. He does not talk about what he saw in the
    east. He does not seem to need to.
