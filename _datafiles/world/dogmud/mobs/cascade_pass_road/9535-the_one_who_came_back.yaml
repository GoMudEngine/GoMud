  - 'emote sits with his back to the rock, watching the east road with
    the patience of a man who has looked at it a very long time.'
  - ''
  - 'emote leans forward and feeds a stick into the small fire. He does
    not look at the flame. His eyes stay on the road.'
  - ''
  - 'emote goes very still. The remaining hand closes slowly on his
    knee. After a long moment, whatever it was passes, and he
    breathes again.'
  - ''
  - 'emote opens his mouth as if to say something, stops, and turns
