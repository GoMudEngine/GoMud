  name: The Pass-Apex
  description: |
    A bear -- or the shape of one -- that holds the top of the
    pass. It is too large. Not in the way of big animals, which
    have proportions that still make sense -- but wrongly large,
    as if the frame was built for something heavier than what
    walks on it, and the body filled in regardless. It moves
    without sound for what it weighs. The scars on its shoulders
    and across its muzzle are old and layered, which means many
    things tested it once and did not do so again. Everything
    else on this road gives it the pass. There is something in
    the way it stands -- something in the stillness -- that
    suggests it came down out of the deep highland not because
    it was pushed out, but because it decided to.
