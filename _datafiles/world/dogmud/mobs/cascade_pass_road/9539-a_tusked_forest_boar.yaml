character:
  name: A Tusked Forest-Boar
  description: |
    A massive animal, slab-shouldered and low to the ground, with
    a ridge of coarse black bristles running the length of its
    spine. The tusks are long -- not the neat ivory of something
    young but the old, yellowed, asymmetric things that grow from
    decades of use. Its hide is scarred and thick with old wounds,
    none of which slowed it down. It has the look of an animal
    that has never needed to flee from anything and has not learned
    the motion. When it turns to face you, it does not hurry.
    It has not had to.
