activitylevel: 10
character:
  name: A Weary Woodcutter
  description: |
    A big man, broad through the shoulders, with the look of
    someone whose strength is a byproduct of years of work rather
    than anything he set out to build. His hands are saw-roughened
    and his shirt is dark with old sawdust and sweat. He works the
    pit with the steady, contained economy of a man who knows how
    long the day is and does not hurry it. He does not look up
    often. He does not look east at all. His Chrysalis-change
    packed something extra into the muscle -- a density through
    the tissue that makes him harder to push over, harder to wear
    down, harder to slow than a man that size has any right to be.
