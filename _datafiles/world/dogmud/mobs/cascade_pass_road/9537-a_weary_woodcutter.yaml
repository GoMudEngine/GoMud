  - 'emote draws the saw back in a long, steady pull, setting the
    rhythm and keeping it, the cut moving with the grain.'
  - ''
  - 'emote stops, lifts the back of a hand across his forehead, and
    holds still for a moment before he picks the saw back up.'
  - ''
  - 'emote pulls a flask from his belt, drinks once without looking
