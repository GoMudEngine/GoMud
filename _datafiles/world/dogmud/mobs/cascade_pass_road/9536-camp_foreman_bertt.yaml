activitylevel: 10
character:
  name: Camp-Foreman Bertt
  description: |
    A lean man in a canvas jacket grey with chalk dust, worn to
    the shape of the work rather than the man. He runs the western
    cut with the economy of someone who has been running crews a
    long time and stopped explaining himself even longer ago. His
    orders are quiet and his crew follows them without discussion.
    He glances east sometimes -- toward the deep timber his fallers
    do not work -- with an expression that stops just short of
    unease and never becomes more than that. He does not discuss
    it. His Chrysalis-change toughened something in his core -- he
    works sick, works cold, works past the point where other men
    sit down -- and the way he carries it makes it clear he stopped
    counting that as unusual years ago.
