  name: A Lone Hunter-Wolf
  description: |
    Grey-black through the shoulders, lighter at the flanks -- a
    wolf built for weight rather than speed, though it has both.
    It is large for its kind and lean in the way predators go lean
    when they work alone, all the extra burned off and none of it
    missed. It holds its stretch of deep timber with the quiet
    certainty of something that does not need to explain itself to
    the country it lives in. Its eyes are the color of old ice.
    It watches you without moving, assessing, unbothered by your
    size, in no hurry at all.
