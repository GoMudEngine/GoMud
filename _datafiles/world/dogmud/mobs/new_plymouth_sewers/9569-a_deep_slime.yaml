  name: A Deep Slime
  description: |
    Where its cousins above wear the color of the channels that
    feed them, this one has none at all -- a clear, heavy mass
    the size of a cart, invisible in the dark water until you are
    standing in it. It has never needed color down here. What it
    has instead is the pulse. Deep at its center a soft glow
    beats, swells and fades, swells and fades, slow as a sleeping
    heart, the only light this passage has ever made for itself.
    The old deep grew this thing, and the old deep is patient.
