  name: A Sewer Rat
  description: |
    Big for a rat, sleek with good living, the color of the water
    it works beside. The quarter above feeds a whole nation of
    these, and this one has the unbothered confidence of a citizen
    in its own country. Its tail is the wrong part -- a hand's
    width from the end it forks into two working tips, and both
    halves move on their own, curling and testing the air behind
    it like a second set of whiskers. The Chrysalis reaches even
    here, and the rats wear it as casually as everything else they
    have taken from the city.
