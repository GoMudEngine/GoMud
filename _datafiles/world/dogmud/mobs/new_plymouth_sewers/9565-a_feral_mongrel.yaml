  name: A Feral Mongrel
  description: |
    Dock stock gone wrong -- a rangy, scar-hided dog that came
    down the loose grate after the rats one season and never went
    back up. Hunger has burned it down to wire and appetite, and
    the tunnels have finished whatever the hunger started. Its
    jaw is the part you notice. The hinge of it sits too far back,
    and when it yawns the mouth swings open past any honest dog's
    limit, wide enough to take a forearm whole. It watches you
    with a working dog's attention and none of a working dog's
    loyalties left in it.
