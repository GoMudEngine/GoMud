character:
  items: []
  name: A Gorged Leech
  description: |
    A leech the size of a rolled carpet, grown vast on whatever
    the deep water sends it and pale as everything down here is
    pale -- it has never once seen light and has no eyes to see
    it with. Its skin has gone translucent as wet paper, and
    inside the slack grey body its last meals hang as dark
    suspended shadows, some of them still recognizable in
    outline, none of them worth studying long.
    When it moves, the shadows move a half-beat after it, like
    cargo shifting in a hold.
