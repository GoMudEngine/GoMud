character:
  name: Tam the Tosher
  description: |
    A small, dry, weathered man in oilskin and waders, a sieve
    over one shoulder and a dozen pockets that all hold something.
    He has worked these tunnels longer than most of the quarter
    above has owned its own floors, and he moves through them the
    way a man moves through his own house in the dark. When he
    turns your way the lamplight catches in his eyes and stays
    there -- they gather the glow and give it back in two flat
    green coins, the way a cat's do. Down here that is not a
    curse. He looks at you the way he looks at everything the
    water brings him, deciding without hurry whether you are
    worth picking up.
