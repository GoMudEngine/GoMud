  name: The Old White
  description: |
    A serpent, if the word can stretch that far. It is white the
    way the deep is dark -- absolutely, from blunt scarred snout
    to the last of a length you cannot see the end of, scales
    gone thick and pale as worn ivory. Its eyes are smooth blind
    domes the color of milk, and it has not missed them in a very
    long time. The mouth is the part that keeps growing. Its
    fangs have run on past any serpent's measure, curved ivory
    the length of a forearm, too long now for the jaw to close
    over completely -- so it rests with them showing, patient,
    the way old kings rest wearing their crowns. It was here
    before the city had a name for down. Everything on the shelf
    around it arrived as food.
