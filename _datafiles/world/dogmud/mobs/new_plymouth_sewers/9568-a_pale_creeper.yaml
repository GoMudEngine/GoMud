  name: A Pale Creeper
  description: |
    Something that may once have had a proper animal to be. It is
    long and low and the bloodless white of a thing born in
    absolute dark, skin over its eye-sockets like drumheads, and
    it hunts the old galleries by touch and by the taste of the
    air. It goes on seven limbs -- seven, no two of them the same
    length, jointed where its uneven stride requires rather than
    where any parent shape intended. The stride should stumble
    and never does. It has been down here long enough to make the
    wrongness work.
