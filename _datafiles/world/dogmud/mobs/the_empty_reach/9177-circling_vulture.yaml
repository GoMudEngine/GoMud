character:
  name: Circling Vulture
  description: |
    A heavy-bodied bird with a span of dark, ragged wings wide enough
    to blot a patch of sky. Its bare, red-wrinkled head sits low on a
    hunched neck, and its downward-hooked beak is built for one
    purpose. The circling vulture rides the thermals above the basalt
    flats with a patience that borders on contemptuous, dropping in
    slow spirals whenever it scents something dead or dying below.
    Up close, the smell of carrion clings to it like a second skin.
