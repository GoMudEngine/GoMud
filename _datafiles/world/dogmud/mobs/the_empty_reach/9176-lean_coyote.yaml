character:
  name: Lean Coyote
  description: |
    A gaunt, tawny canine with oversized ears and a narrow muzzle, the
    lean coyote carries itself low to the basalt scrub, wary and
    calculating. Its coat is the color of dry sage and dust -- grey-
    brown, patchy, with darker hackles that rise when it catches a
    scent. Half-domesticated in appearance but wholly wild in intent,
    it watches from beyond easy reach, waiting for the pack to close.
    The Empty Reach has made it lean; hunger has made it bold.
