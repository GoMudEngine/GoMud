character:
  name: The Reach-Touched
  description: |
    Once a traveler, perhaps -- or a homesteader who did not leave in
    time. Now the Empty Reach has claimed him entirely. Sun-cracked
    skin, eyes too bright, fingers working at the air as though coaxing
    shapes only he can see. A strange iridescence plays across his
    forearms and throat where a Chrysalis mutation went untended and
    wild in the solitude -- fractal patterns that shift when he moves,
    beautiful and wrong. He is speaking to someone you cannot see, and
    he does not look at you. That is the last warning you will get.
