character:
  name: Desert Hare
  description: |
    A jackrabbit of exceptional size, long-eared and long-legged,
    shaped by the Empty Reach to be difficult to catch. Its fur is
    pale ash-grey above and white beneath -- bleached camouflage for
    sun-whitened basalt. At rest it is nearly invisible against pale
    lichen and dry stone. When startled it does not simply run; it
    erupts, covering ground in huge, unpredictable bounds that leave
    most predators behind, before vanishing flat against the earth
    once more.
