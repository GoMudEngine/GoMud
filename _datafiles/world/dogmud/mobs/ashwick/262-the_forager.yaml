character:
  name: The Forager
  description: |
    A gaunt figure in patched traveling clothes, moving through the
    camp with the wary efficiency of someone who has learned to be
    invisible. Their hands are quick and precise with the herbs --
    this is someone who was trained, not someone who learned by trial.
    Their face is guarded, their posture ready to run. The most
    striking thing about them is what is missing -- no visible
    mutation, no change, no mark of the Chrysalis at all. Just a
    person, unchanged, hiding in the woods.
