character:
  name: A Drover
  description: |
    A Drover is getting his cart ready to head east toward Greenford
    with the focused urgency of someone who has decided he is behind
    schedule and is now working to recover time. He is a big,
    deliberate man with a mule he appears to be in an ongoing
    professional disagreement with, and a cart loaded with dry goods
    for the Greenford market. The Confluence is the western end of
    his usual run; he makes the return trip every few weeks, knows
    every pothole between here and there, and has opinions about all
    of them. His Chrysalis-change makes the work easier in one
    narrow sense: he can feel when a load is balanced correctly
    without measuring it, which saves him rechecking every tie
    at the waystations.
