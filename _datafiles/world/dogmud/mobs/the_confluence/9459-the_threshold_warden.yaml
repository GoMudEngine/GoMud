character:
  name: The Threshold Warden
  description: |
    The Threshold Warden holds his post at the warded door that
    divides the public nave from the cloisters beyond. He is built
    like someone who did harder work before this posting, and his
    manner is entirely without malice -- polite, firm, and
    unmoved. He wears the dove-grey of the Keepers with a warden's
    cord at the shoulder, darker than the nave Keepers'. His
    Chrysalis-change is a fine one: he can tell, from a visitor's
    approach alone, whether they mean to ask or to push past. He
    has never been wrong. He is never hostile about it. He simply
    speaks first.
