character:
  name: The Passage Agent
  description: |
    The Passage Agent keeps a low camp stool and a dockside crate near
    the passage mooring, apart from the freight barge's own crew. He
    came up through the river trade the slow way -- poling, then
    crewing, then finally minding the passenger side of the business,
    which he claims suits his knees better than his back. He reads the
    current the way river folk do, by the color of it and the pitch of
    the water against the pilings, and he never quotes a crossing time
    he isn't willing to be proven right about. He gets on well enough
    with the crews working the freight side of the dock, though he is
    quick to remind anyone who asks that he answers for the
    passengers, not the cargo.
