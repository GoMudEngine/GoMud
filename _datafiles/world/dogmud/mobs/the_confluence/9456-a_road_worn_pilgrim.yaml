character:
  name: A Road-Worn Pilgrim
  description: |
    A Road-Worn Pilgrim sits against the pilgrim hall wall with
    boots off and feet at rest, in the comfortable aftermath of
    a long road. They have the look of someone who has done this
    before and will do it again -- a regular traveler to the
    temple, for whom the journey is as much the point as the
    destination. The road has left its marks: dust on the cloak,
    wear on the heel, a particular satisfaction in the eyes that
    only comes from arriving.
