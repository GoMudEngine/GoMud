character:
  name: A Student
  description: |
    A Student is in the Inkwell Court with a stack of folios, a pen,
    and a cup of something cold that was warm when the study session
    began. They are one of several students working with the Margin
    this season -- young, earnest, and at the stage of research
    where every secondary source contradicts the previous one and
    this feels like a crisis rather than a condition of scholarship.
    Their Chrysalis-change is unhelpful in their current work but
    will presumably matter later: they do not need much sleep. Four
    hours suffices, leaving them with more study hours than their
    peers and a tendency to argue points at length because they have
    had more time to develop them.
