character:
  name: Sybba the Tavern-keeper
  description: |
    Sybba the Tavern-keeper has run the Quayside since her sister
    gave it up and went inland to raise chickens, which is a longer
    story than Sybba usually tells unless someone buys a second cup.
    She is tall and loose-limbed, with the relaxed watchfulness of
    someone who has learned to read the room without appearing to.
    Every barge crew, every merchant, every pilgrim passing through
    the Landings ends up at her counter eventually, and she
    catalogues them all -- names, cargos, moods, rumors. Her
    Chrysalis-change is social in nature: she never forgets a face.
    Every person she has served she can describe in detail years
    later, a gift that is flattering or unsettling depending on
    whether you have been behaving yourself.
