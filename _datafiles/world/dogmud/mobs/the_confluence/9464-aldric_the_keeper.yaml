character:
  name: Aldric the Keeper
  description: |
    Aldric the Keeper is a tall man in his middle sixties, spare and
    upright, with the stillness of someone who has made a habit of
    not moving until he has decided to. His robes are the pale grey
    of the order's senior rank, immaculate, and the Keeper's seal
    at his throat is old silver, worn smooth. He carries no visible
    burden -- his is the kind of weight that stays in the face, not
    the hands. His Chrysalis-change is unreadable: his eyes are
    the same grey as his robes, and they have looked at you before
    you have finished looking at him.
