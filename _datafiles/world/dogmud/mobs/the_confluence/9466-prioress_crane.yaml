character:
  name: Prioress Crane
  description: |
    Prioress Crane is a compact woman of sixty or so, with the
    composed bearing of someone who has held the same office for
    many years and is not done with it. Her grey robes carry the
    double-hem of the prioress's rank, and her hair is close-
    cropped, gone white, though her eyes are dark and alert. Her
    Chrysalis-change is a warmth she radiates in the way of heated
    stone -- not heat itself, but the memory of it, and people in
    the oratory tend to drift toward her without knowing why. She
    looks at you the way a practised believer looks at something
    that has not yet been categorized as a problem.
