character:
  name: The Potter
  description: |
    The Potter works a corner of the Row between the
    weaver and the cooper, turning out fired clay vessels
    for the city's domestic and craft markets. Her pots
    are plain, well-proportioned, and correctly fired --
    exactly what an alchemist needs in a ceramic vessel.
    Her Chrysalis-change is subtle: she knows by feel
    whether a clay mix will crack in the kiln, and her
    reject rate has been exactly zero since the change.
    She finds this a moderate improvement and has not
    made much of it.
