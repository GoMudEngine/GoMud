character:
  name: The Innkeeper
  description: |
    The Innkeeper runs the Brennside Arms from behind a bar that
    has seen more travelers than she could count -- Greenford
    merchants heading west, pilgrims arriving at the Confluence,
    road wardens stopping in for something warm before the next
    patrol. She is a compact, brisk woman with gray-streaked hair
    and the manner of someone who has no patience for drama but
    considerable patience for tired people who need a meal and a
    place to sit down. Her Chrysalis-change is a warmth in the
    hands -- literally: she never burns herself on the cookware,
    and the bread she sets out stays warm longer than it ought to,
    which guests appreciate more than they realize.
