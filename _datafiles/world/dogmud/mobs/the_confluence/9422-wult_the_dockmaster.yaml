character:
  name: Wult the Dockmaster
  description: |
    Wult the Dockmaster is a compact man who carries authority the
    way a good bolt-pin carries load: without fuss and without
    giving. He runs the Landings quay the way it has always been
    run -- by freight tallies and tide tables and the occasional
    hard word delivered without malice. The Confluence is the
    entry-node of three-river trade, which means everything that
    moves through the region passes across his dock first, and he
    knows it. His Chrysalis-change is inconvenient: he no longer
    sleeps more than two hours at a stretch, and has not for going
    on twelve years. He fills the extra waking hours with ledgers.
    The ledgers are impeccable.
