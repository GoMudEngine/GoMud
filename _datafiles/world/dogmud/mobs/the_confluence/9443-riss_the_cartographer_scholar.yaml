character:
  name: Riss the Cartographer-Scholar
  description: |
    Riss the Cartographer-Scholar works in the Cartographers' Room
    of the Scholars' Quarter with two large drafting boards, a
    collection of historical surveys pinned and weighted around the
    room, and a patience for discrepancy she regards as a professional
    necessity. Her specific interest is in what happens when
    independent surveys of the same area disagree -- how the error
    propagated, where it originated, whether the disagreement records
    a genuine change in the subject rather than a copying fault. The
    junction surveys are her primary work at present. She is the
    Margin member most directly responsible for the fourth-water
    question, and she is careful about terms: it is an open question,
    not a discovery. Her Chrysalis-change is spatial and eidetic. She
    can reproduce any map she has studied with geometric accuracy,
    working from memory, at any scale, without measurable distortion.
    She uses this for verification rather than drafting -- it lets
    her compare a remembered survey against a physical chart without
    needing both on the same table at the same time.
