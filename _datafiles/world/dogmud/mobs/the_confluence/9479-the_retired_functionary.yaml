character:
  name: The Retired Functionary
  description: |
    The Retired Functionary was the Third Clerk of Tolls
    for the Brenn arm for twelve years, then the Senior
    Assessment Clerk for four more, then briefly Acting
    Head of the Quarterly Review before the position was
    abolished and he was retired with a small pension and
    a handshake from the Deputy Registrar. He carries
    this history with the careful precision of a man who
    recorded it all and still has the figures. His
    Chrysalis-change is perfect: he can recall any number
    he has ever written in an official document. This
    would have been enormously useful during his career.
    It is of limited comfort now.
