character:
  name: Ferrick the Chandler
  description: |
    Ferrick the Chandler stocks the things boats need to keep
    running and people need to keep moving: rope in four gauges,
    lamp oil, tallow dips, tinderboxes, waterskins, tar thread,
    and a selection of small ironware sourced from up the Brenn.
    The shop smells of pine tar and lantern-oil and has for as
    long as anyone in the Landings can remember, because Ferrick
    took it from his father who took it from his uncle. His
    Chrysalis-change is useful in the trade: his fingertips can
    read the quality and lay of rope by touch alone -- twist
    tension, fiber separation, grade -- well enough to assess a
    coil from across the counter without unwinding it.
