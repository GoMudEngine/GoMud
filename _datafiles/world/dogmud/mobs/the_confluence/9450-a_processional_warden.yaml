character:
  name: A Processional Warden
  description: |
    A Processional Warden stands at the forecourt gate where the
    road widens into the temple approach. He wears the dove-grey
    of the Keepers with a warden's cord at the shoulder, and he
    has the posture of someone who spent years in a less
    ceremonial post before taking this one. He keeps order at
    the forecourt -- a task that consists mostly of watching
    pilgrims file past and ensuring no one tries to bring a
    cart over the causeway. His Chrysalis-change is minor: a
    heightened sense of tension, crowd or individual, that
    lets him read a space without appearing to. He has not
    needed it here yet. The forecourt has been orderly.
