character:
  name: A Gate Guard
  description: |
    A Gate Guard stands at the east arch in road-warden tabard and
    sturdy boots, with the particular stillness of someone who has
    learned to make hours of standing look effortless. She watches
    the road with alert, unhurried attention — not the tense
    watchfulness of someone expecting trouble, but the practiced
    calm of someone who will recognize it the instant it appears
    and knows exactly what to do next. Her Chrysalis-change is a
    minor thing: she simply does not fatigue from standing, which
    suits her current posting well enough that she has not
    requested a different assignment in three years.
