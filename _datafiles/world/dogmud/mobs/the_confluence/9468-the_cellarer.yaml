character:
  name: The Cellarer
  description: |
    The Cellarer is broad-shouldered and brisk, a man of middling
    years whose Keepers' robes are covered, below the waist, by a
    long apron of undyed linen. He runs the refectory and the
    stores with an attention to detail that other members of the
    order respect and find mildly intimidating. His Chrysalis-
    change -- an exceptionally acute sense of smell -- is, in his
    estimation, a professional asset.
