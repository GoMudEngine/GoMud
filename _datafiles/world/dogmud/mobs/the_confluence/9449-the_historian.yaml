character:
  name: The Historian
  description: |
    The Historian stands near the painted founding account along the
    Hall's south wall, available to those who want the story explained.
    He is a Keeper of middle years, with the practiced patience of
    someone who has answered the same questions ten thousand times and
    still believes the answers matter. His robes are the pale grey of
    the Keepers' order, neatly pressed, and his hands are ink-stained
    in the professional way of a man who has been copying records
    since before the ink mattered. His Chrysalis-change is a small
    one: his memory for text is absolute. He can recite any passage
    he has read, word for word, from any point in his career. He does
    not regard this as unusual. He regards it as useful.
