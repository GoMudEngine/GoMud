character:
  name: The Officiant
  description: |
    The Officiant stands at the crossing where the iron grate lets
    the sound of the three rivers rise into the nave. He is a
    Keeper of middling years, broad-shouldered and unhurried, with
    the settled quality of someone who has presided at ceremonies
    long enough that the ceremony has entered the body. His robes
    are pale grey, pressed with care, and his hands rest in a
    manner that took practice. His Chrysalis-change is subtle: a
    depth of voice that carries in enclosed stone without effort,
    as though the hall itself attends him. He uses it only for
    the rite. In conversation he simply speaks.
