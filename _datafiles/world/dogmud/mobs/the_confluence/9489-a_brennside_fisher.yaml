character:
  name: A Brennside Fisher
  description: |
    A Brennside Fisher works the east landing every morning with
    the early-rising contentment of someone who chose this life
    deliberately and has not regretted it. He is a wiry man with
    the deeply calloused hands of someone who has been hauling
    nets since he was young, and the particular calm of a person
    whose days are organized by tides and currents rather than
    clocks and appointments. The east-bank landing draws less
    traffic than the Long Quay, which suits him: fewer barges
    mean cleaner net runs, and the Brenn current in the morning
    is reliable. His Chrysalis-change is the fisher's gift taken
    one step further -- he can feel where the fish are, a low
    pressure at the edge of his awareness, and he has not come
    home empty-handed since.
