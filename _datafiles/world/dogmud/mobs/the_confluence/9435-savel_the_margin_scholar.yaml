character:
  name: Savel the Margin Scholar
  description: |
    Savel the Margin Scholar has claimed the reading table nearest
    the notation map in the Municipal Hall and shows no sign of
    relinquishing it soon. She is a member of the Margin, the
    Confluence's scholarly society, which she is here representing
    in the particular sense of sitting in front of a very old
    chart and taking precise notes on its annotation sequence.
    She has been doing this, on and off, for two seasons. The
    map has not changed. Her notes have grown considerably. Her
    Chrysalis-change is perceptual: she can distinguish different
    periods of ink and annotation in a document without any
    chemical analysis, reading the layers of addition and
    correction in a single chart the way a geologist reads stone.
    This is directly relevant to her work here. The notation map
    has at least five distinct layers of annotation, which is
    most of what she came to establish.
