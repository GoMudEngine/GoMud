character:
  name: Orvin the Hall-Clerk
  description: |
    Orvin the Hall-Clerk occupies the main receiving desk of the
    Municipal Hall with the settled permanence of a man who has run
    this particular post long enough that the desk has adjusted to
    his habits rather than the other way around. He processes
    registrations, deed inquiries, civic petitions, and the
    administrative volume that a city of the Confluence's size
    generates as a matter of course. He is not unfriendly; he is
    methodically occupied, and the difference has become difficult
    to notice from the outside. The notation chart on the wall
    behind him draws a steady trickle of scholars and curious
    travelers, none of whom he has managed to redirect. His
    Chrysalis-change is practical: he cannot misread an altered
    date or a tampered signature in any document he examines.
    The ink shows him its true age. The municipal auditors
    consider this an asset. Forgers have found it discouraging.
