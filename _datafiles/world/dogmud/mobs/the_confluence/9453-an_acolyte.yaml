character:
  name: An Acolyte
  description: |
    An Acolyte tends the small meditation garden at the side of
    the Hall and sweeps the forecourt stones between the morning
    pilgrims and the evening service. She is young -- eighteen
    at most -- with the careful, deliberate quality of someone
    who has recently decided to be earnest about something and
    is still learning what that costs. Her robes are the
    undyed linen of a first-year Keeper, not yet grey. Her
    Chrysalis-change has not come yet, which she does not
    discuss, and which the senior Keepers say is not unusual
    at her age and is, in any case, not the point.
