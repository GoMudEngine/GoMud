character:
  name: Quist the Elder
  description: |
    Quist the Elder is the nearest thing the Margin has to a head, which
    is to say the others defer to him and he pretends not to notice. He
    is old and stooped, with the squint of a man who has spent fifty
    years reading faded ink by lamplight and is now paying for it — he
    holds everything close to his face and reads the rest from a memory
    that has not failed him yet. His Chrysalis-change is in the eyes:
    the irises have gone a pale silver-grey, and in the right light he
    can still pick out the ghost of an erased line on a palimpsest where
    a younger scholar sees only blank vellum. He has spent the back half
    of his life on a single question that everyone else considers
    settled, and he is too old now to pretend it does not matter.
