character:
  name: Pella the Fish-Trader
  description: |
    Pella the Fish-Trader works the fish slab at the foot of the
    landing stair from before first light until the ice runs out,
    which is to say she is always there and the slab is always
    fresh. She sources from four boats on the Aldren and two on
    the Brenn, and can name the crew and the stretch of water each
    catch came from without checking a label. Her Chrysalis-change
    landed on her sense of smell: she can detect the precise hour
    a fish came out of the water, a fact she considers professionally
    indispensable and mentions only when someone tries to pass off
    a day-old catch as morning-fresh.
