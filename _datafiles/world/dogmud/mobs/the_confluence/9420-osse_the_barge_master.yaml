character:
  name: Osse the Barge Master
  description: |
    Osse the Barge Master is broad across the chest and economical
    with motion, in the way of people who spend their working lives
    on a deck where an unnecessary step can put you in the water.
    The barge is his -- a wide-bellied freight hauler rigged for
    the three-river run -- and he knows every snag and sandbar on
    the Aldren between here and New Plymouth well enough to navigate
    the worst of it in low light, by feel. His Chrysalis-change
    thickened the callus on both palms into something closer to
    horn; he takes a loop of hawser without gloves in weather that
    would skin an ordinary man's hands raw.
