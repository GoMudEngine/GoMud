character:
  name: A Copyist
  description: |
    A Copyist works in the Copyists' Room of the Scholars' Quarter,
    producing accurate reproductions of charts, folios, survey
    documents, and research records for the Margin's scholars and
    for paying commissions from the trade and civic quarters. She
    is a Margin member but her role is more craft than research --
    she thinks of herself as a bridge between the archive and the
    people who need usable working copies of its contents. She does
    not have strong opinions about the fourth-water question herself,
    but she has copied enough of the relevant surveys to have a
    better visual familiarity with the junction notation than most
    of the researchers who study it in text. She knows Tallis the
    Scrivener, who keeps a copy-stall on the Long Quay in the lower
    city; their work overlaps at the edges of the chart trade. Her
    Chrysalis-change is the envy of her colleagues: her hands never
    cramp. She can work for eight hours with a fine pen without
    fatigue or variance in the line, which is a considerable
    professional advantage.
