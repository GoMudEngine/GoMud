character:
  name: The Cooper
  description: |
    The Cooper works the Row's cooperage with the settled
    authority of a man who has made more barrels than he
    can count and has opinions about every one. He makes
    casks, buckets, and general storage vessels -- wood
    for most things, ceramic for what wood won't suit --
    and keeps a stock of clay pots on the shelf for buyers
    who need a sealed container quickly. He has no
    Chrysalis-change that he will admit to, though his
    finished barrels are said to last considerably longer
    than they have any right to.
