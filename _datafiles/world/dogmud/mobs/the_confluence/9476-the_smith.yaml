character:
  name: The Smith
  description: |
    The Smith runs the Row's forge with the steady rhythm
    of a man who has spent decades at the anvil and sees
    no reason to be hurried about it. He makes domestic
    ironwork -- hinges, latches, pot hooks, barrel hoops,
    the hardware a city runs through without noticing --
    and sends customers looking for weapons or armor up
    the Aldren arm. His Chrysalis-change has given his
    arms a faint metallic sheen that he mostly ignores,
    and has made his grip on the hammer somewhat more
    than ordinary.
