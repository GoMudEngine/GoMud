character:
  name: The Sacristan
  description: |
    The Sacristan tends the reliquary alcove off the south nave,
    a compact room whose shelves hold the oldest physical objects
    the Keepers have preserved -- founding-period tools, a
    fragment of the first altar-stone, and one piece whose
    provenance the Keepers date to before the Founding. She
    handles each object with the attentiveness of someone who
    considers the work a form of prayer. Her Chrysalis-change is
    proprioceptive: she knows, without looking, the precise
    position of every object in the reliquary. She has not
    misplaced anything since the change settled.
