character:
  name: A Broadwater Factor
  description: |
    A Broadwater Factor stands beside the barge dock with a handcart
    of river goods bundled against the damp, watching the current for
    the first sign of the Broadbeam's hull. He rides downriver to New
    Plymouth with watercress and river mussels packed fresh off the
    confluence flats, and returns with steel ingot and glass vial and
    copper wire bought cheap off the warehouse row. He has crewed
    enough river trade to know a fair price from a bad one at a
    glance, and rarely needs the slip in his pocket to prove it.
