character:
  name: Tallis the Scrivener
  description: |
    Tallis the Scrivener keeps a copy-stall on the Long Quay where
    he produces charts, navigation records, cargo manifests, and
    whatever other documents the river-trade requires in legible
    and certified form. He is quiet in the way of someone whose
    work requires sustained concentration and who has made peace
    with not being interrupted to make social conversation. His
    main trade is harbor charts and river navigation charts sold
    to boats that need a current copy rather than working from a
    decade-old original. His Chrysalis-change is unremarkable to
    watch: his handwriting does not vary. Every letterform he
    produces is geometrically identical to the last, regardless
    of pen, surface, or conditions. He finds this convenient.
    Copying goes faster when the hand is consistent.
