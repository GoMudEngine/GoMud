character:
  name: Roan the Smith
  description: |
    A broad-shouldered woman with forearms like cable and a
    face permanently flushed from the forge heat. Roan keeps
    the Riverside Forge running for whichever crew or trade
    house needs fittings on short notice, and her hands are
    mapped with the small burn scars of a trade learned the
    hard way. She is blunt and unhurried at the anvil, and
    has little patience left over for people who waste her
    time once she is standing at it.
