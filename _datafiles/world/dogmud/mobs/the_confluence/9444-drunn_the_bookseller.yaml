character:
  name: Drunn the Bookseller
  description: |
    Drunn the Bookseller runs a small shop in the Scholars' Quarter
    that sells history volumes, reference folios, copied texts, and
    the occasional antiquarian chart to scholars, students, and
    anyone who has wandered in out of curiosity. He is not a member
    of the Margin himself but the society's scholars make up the
    majority of his trade, and he knows the difference between a
    serious research inquiry and someone who wants something to put
    on a shelf. He stocks accordingly. The old water-stained chart
    on the wall behind the counter is not for sale -- it has been
    there since he bought the shop, it arrived damaged, and the
    scholars come to squint at it periodically, which he permits.
    His Chrysalis-change is mild: he senses which book a browser
    will buy before they have decided themselves. He finds this
    useful for restocking and does not mention it to customers.
