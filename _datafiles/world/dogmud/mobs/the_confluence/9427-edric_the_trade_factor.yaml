character:
  name: Edric the Trade-Factor
  description: |
    Edric the Trade-Factor works the Long Quay as a broker and
    assessor for several of the larger river-trade houses, which
    means he is the man who stands between the incoming boat and
    the counting house and makes the numbers work. He wears good
    wool and carries a leather document case that has never once
    been set on the ground, and he has the particular stillness
    of someone who processes complex information without needing
    to look busy doing it. His Chrysalis-change is professional
    in character: his memory for prices, weights, and cargo
    manifests has become essentially eidetic. He can recall the
    exact declared value of any shipment he has assessed in the
    past ten years without consulting a ledger. He considers this
    useful and does not mention it unless asked.
