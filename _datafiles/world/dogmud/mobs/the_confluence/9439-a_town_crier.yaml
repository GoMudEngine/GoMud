character:
  name: A Town Crier
  description: |
    A Town Crier moves through Tri-Cross Square in a steady
    circuit, pausing at the four corners to ring his handbell
    and call the day's notices in a voice that carries farther
    than the square requires. He has the measured delivery of
    a man whose job is to be heard, not agreed with -- he reads
    what is posted at the Municipal Hall, rings the bell at
    appropriate intervals, and keeps moving. His Chrysalis-change
    makes the work easier than it was: his voice simply carries.
    On a still morning, the far end of the Long Market can hear
    him clearly when he calls from the hall steps without any
    particular effort on his part. He has not lost a notice
    yet.
