character:
  name: The Riverman's Wife
  description: |
    The Riverman's Wife lives in the Row and keeps the
    household going through the long stretches when her
    husband is out on the river -- which is most weeks
    and most of the year. She is sharp, funny in a dry
    way, and has strong opinions about the price of bread
    and the airs put on by certain people in the Scholars'
    Quarter. Her Chrysalis-change came on gradually: she
    now knows when the weather is turning before any
    cloud appears, which she says is the only useful
    thing the Blooming has done for her, since it means
    she knows when to worry about her husband and when
    not to.
