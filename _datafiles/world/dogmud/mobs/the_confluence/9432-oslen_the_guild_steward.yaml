activitylevel: 10
character:
  name: Oslen the Guild Steward
  description: |
    Oslen the Guild Steward administers the Rivermen's Guild
    charter on the Long Quay: certifying crews, issuing commercial
    working permits, logging toll assessments, and conducting the
    arbitrations that arise when two freight houses disagree about
    a delivery gone wrong. He is unhurried in the way of someone
    confident that the system he administers will still be running
    after the current urgency has passed. His Chrysalis-change is
    an uncomfortable gift for administrative work: he reads the
    emotional undercurrent of a room with unusual accuracy -- not
    quite what anyone is thinking, but where the fault line between
    parties sits and how close it is to opening. This proves useful
    in arbitrations. It makes casual social interactions somewhat
    one-sided, which suits him well enough.
