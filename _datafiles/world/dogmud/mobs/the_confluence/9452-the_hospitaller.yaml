character:
  name: The Hospitaller
  description: |
    The Hospitaller is a Keeper who runs the pilgrim hall beside
    the temple approach, feeding and resting travelers who have
    come far enough to need it. She is a broad, practical woman
    of middle years who regards spiritual matters as things best
    served alongside a hot meal. She does not proselytize. She
    feeds people, gives them a place to sleep, and trusts that
    the temple itself will do whatever the temple is supposed to
    do. Her Chrysalis-change gives her a physiological read on
    anyone she looks at -- she can see exhaustion, fever, or
    injury in a person before they report it. She uses this
    entirely for practical triage. Pilgrims who look worse than
    they let on get the better bowl.
