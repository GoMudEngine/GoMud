character:
  name: The Almoner
  description: |
    The Almoner keeps the almonry window in the nave's south
    transept, where the Keepers offer candles, bread, and small
    remedies to those who need them. She is cheerful in the
    unhurried way of someone who found a job she was made for,
    and she does not dress her charity in ceremony. Her
    Chrysalis-change is modest: she never forgets a face, or the
    last time she saw it, or what was needed then. She does not
    mention this. She simply asks the right question.
