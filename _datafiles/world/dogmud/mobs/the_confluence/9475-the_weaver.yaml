character:
  name: The Weaver
  description: |
    The Weaver keeps her loom going most of the day and
    sells the output across the counter: homespun cloth
    for everyday use and the river-cloth bolt that the
    Confluence is known for -- tighter woven, with the
    slight sheen of linen blended in. She can identify
    a structural flaw in a fabric by feel alone, a
    Chrysalis-change she considers professionally useful
    and otherwise unremarkable. She is brisk in the way
    of someone with a full order book and not much to
    say to people who are not buying.
