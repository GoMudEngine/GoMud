activitylevel: 10
character:
  name: Gett the Weighmaster
  description: |
    Gett the Weighmaster runs the Weighhouse on the Long Quay with
    the meticulous patience of a man whose entire professional value
    is the unimpeachable accuracy of his records. He issues certified
    weight certificates the Rivermen's Guild requires for all
    significant cargo movements, assesses tariff liability on behalf
    of the city, and has filed thirty-seven formal disputes with the
    guild on behalf of the Weighhouse in six years of service. He
    mentions this number without pride or irritation, the way someone
    mentions the height of a bridge -- it is simply a fact of the
    structure. His Chrysalis-change is the appropriate one for his
    work: he has an internal sense of weight accurate to within a
    fraction of a standard measure. He still uses the certified
    scales because the charter requires them, but he knows the answer
    before the beam settles. Three of his fraud catches started with
    a number that felt wrong before he weighed it.
