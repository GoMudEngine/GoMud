character:
  name: The Gate Captain
  description: |
    The Gate Captain stands at the east arch of the Brennside Gate
    with the unhurried authority of someone who has been in charge
    of this threshold long enough to stop finding it interesting
    and start finding it his. He is a solid man in his middle
    years, wearing the road-warden tabard over practical clothing,
    a short sword at his hip more for the look of it than from
    any recent need. The east road to Greenford runs out behind
    him, and he knows every waystation and ford between here and
    there. His Chrysalis-change gave him an unusual stillness: in
    a crowd of moving people he simply does not move unless he
    means to, and travelers find their eyes drawn to him without
    quite knowing why.
