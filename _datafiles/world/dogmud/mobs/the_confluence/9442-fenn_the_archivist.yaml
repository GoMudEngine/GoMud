character:
  name: Fenn the Archivist
  description: |
    Fenn the Archivist is the keeper of the Great Archive in the
    Scholars' Quarter, a position he has held for eighteen years
    and intends to hold for as long as the Margin and his eyesight
    will permit. He knows every item in the archive's collection
    by location, accession date, and condition without consulting
    the register -- the register is for everyone else. He is
    precise, unhurried, and quietly inflexible about proper
    handling: cotton gloves, no unrolled storage, no food, no
    open ink near the primary surveys. Visitors who accept these
    conditions find him helpful. Visitors who do not find him
    implacable. His Chrysalis-change is conservative and useful:
    when he holds a document, he can sense its structural condition
    -- brittleness, hidden water damage, worm-channels inside a
    bound spine -- without unrolling or opening it. This has saved
    several items in the archive from the handling that would have
    destroyed them.
