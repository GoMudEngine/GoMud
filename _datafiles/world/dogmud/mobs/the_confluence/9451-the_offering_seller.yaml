character:
  name: The Offering-Seller
  description: |
    The Offering-Seller runs a tidy stall at the edge of the temple
    approach, selling the small devotional items pilgrims carry to
    the altar. She is not a Keeper -- she is a trader who has been
    working this pitch for nine years and knows exactly what pilgrims
    want, at what price, at which point in their journey. Her stock
    is candles, reed wreaths, and temple incense, sourced from the
    same suppliers the Keepers use for their own ceremonies. This
    is a point of professional pride. She has no Chrysalis-change
    worth mentioning, and she does not expect one. The stall is
    doing fine.
