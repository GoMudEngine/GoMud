character:
  name: Varro the Importer
  description: |
    Varro the Importer operates out of the Spice Quay with the
    permanent air of a man who has seen too many disappointing
    shipments to get excited about anything too quickly. He
    sources salt-cured roe from the Solt's estuary traders, river-
    spice from the hill-country posts, and preserved river fish
    from the same boats that supply the main fish market -- though
    he pays for better cuts and cures them himself when the season
    runs right. His Chrysalis-change is a precision in his sense
    of taste: he can detect adulteration or mislabeling in a spice
    or preserved food without opening the container -- a pressure
    response on his tongue when he handles the package. He has
    sent back three shipments this season on this basis alone.
    Varro does not advertise the ability but does not hide it.
