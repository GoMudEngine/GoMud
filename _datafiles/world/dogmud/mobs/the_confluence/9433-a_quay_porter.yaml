character:
  name: a quay porter
  description: |
    A porter works the Long Quay freight runs -- loading, off-
    loading, shifting cargo between the wharf and the Weighhouse,
    and filling in wherever a piece of freight needs to move from
    where it is to where it needs to be. This one has the build
    of someone who has done this for years: forearms like cable,
    unhurried walk, the careful pivot of a person who moves weight
    for a living and plans not to throw out their back doing it.
    Their Chrysalis-change is a minor one: their sense of balance
    under load is uncanny, steadying a swaying crate on one
    shoulder without looking, adjusting automatically to every
    shift in the weight as if the correction comes before the tilt.
