character:
  name: A Wayfarer
  description: |
    A Wayfarer has arrived at the Travelers' Inn with the road-
    worn look of someone two days out from Greenford: boots scuffed
    to the ankle, a pack that has been repacked several times
    along the way, and the particular tired contentment of someone
    who has made it. She is a compact woman somewhere in her
    thirties, with the self-contained manner of a person accustomed
    to moving alone. Her Chrysalis-change is a subtle thing: she
    always knows which direction is east, not by the sun but by
    something inside her that simply points and is always right.
    She finds this useful on the road and faintly disorienting in
    cities, where east is not always the direction that matters.
