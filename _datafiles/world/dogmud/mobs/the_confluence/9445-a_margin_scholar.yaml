activitylevel: 10
character:
  name: A Margin Scholar
  description: |
    A Margin Scholar is one of the Confluence's researchers, a member
    of the Margin currently engaged in the kind of careful incremental
    inquiry that does not produce quick results and does not aim to.
    He is lodging in the Scholars' Quarter during the current phase
    of his research into the fourth-water question, working through
    secondary accounts and cross-referencing them against the survey
    record in the archive. He is respectful of the temple's official
    account of the junction and does not consider his own research an
    argument against it -- if the official account is right, the
    surveys contain a persistent and peculiar error whose propagation
    history is itself worth documenting. His Chrysalis-change is
    olfactory and peculiar: he can determine the approximate age of
    a document by its ink smell alone, to within a decade or two,
    which is occasionally useful in a research context and otherwise
    just a thing that happens to him.
