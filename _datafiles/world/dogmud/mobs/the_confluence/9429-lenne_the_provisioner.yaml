character:
  name: Lenne the Provisioner
  description: |
    Lenne the Provisioner holds a trade stall in the River Market
    with the organized calm of someone who has answered the same
    questions about rope and waterskins many thousands of times
    and still answers them correctly. She stocks the practical
    middle tier of river-trade goods -- cloth, line, tinder,
    waterskins -- things the big chandlers don't bother with in
    small quantities and the fish market doesn't cover at all.
    Her Chrysalis-change lives in her fingertips: she can detect
    thread-count, weave integrity, and fiber quality in cloth by
    touch without looking, which means she can identify a reblended
    salvage bolt or a rotten-fiber piece before it reaches the
    counter. She has quietly returned more bad cloth than she has
    ever sold. She does not make a fuss about it.
