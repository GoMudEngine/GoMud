character:
  name: Bremm the Innkeeper
  description: |
    Bremm the Innkeeper runs the Three Waters Inn from behind the
    bar with the calm authority of someone who has never once lost
    track of a tab or misremembered a guest's name. He is broad
    through the shoulders, unhurried in manner, and precise in
    his recollection of faces: he will greet a traveler by name
    on their second visit if he met them once two years prior,
    which guests tend to find either flattering or unsettling
    depending on temperament. The Three Waters is the best inn
    in the civic quarter -- well-kept rooms, a reliable kitchen,
    and a common room where the city's administrators have been
    resolving each other's problems over wine for as long as the
    hall across the square has been generating them. His
    Chrysalis-change simply made his natural gift for faces and
    names into something absolute. He has not forgotten a guest
    since.
