character:
  name: Brother Cael
  description: |
    Brother Cael is slight and unhurried, a man of perhaps forty
    with ink-stained fingers and the quiet manner of someone who
    has spent most of his adult life in this room. His grey robes
    are worn at the cuffs in the way of a person who writes more
    than he stands, and his Chrysalis-change -- a fine hatching of
    silver lines across his right hand, like a diagram of a leaf's
    veins -- has made his handwriting exceptionally precise. The
    building-ledger stands open on the reading stand beside him.
    He has the look of a man who has been waiting for someone to
    ask the right question.
