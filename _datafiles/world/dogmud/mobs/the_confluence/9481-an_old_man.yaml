character:
  name: An Old Man
  description: |
    An Old Man has lived in the residential lane long
    enough that he remembers two different registrars,
    the original paving of the street, and the guild
    dispute that split the cooperage circle in his
    father's time. He spends most of his days at the
    well, has opinions about the lane, the city, the
    ferry schedule, and the price of things, and is
    prepared to share them with anyone who slows down
    long enough to hear one.
