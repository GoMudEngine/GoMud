activitylevel: 10
character:
  name: Pellan the Notary
  description: |
    Pellan the Notary works from a narrow office off Civic Lane
    where he handles the sealing and certification of deeds,
    contracts, letters of attestation, and any document requiring
    the municipality's formal witness. He is precise, measured,
    and faintly skeptical of anything that is not properly written
    down and sealed -- which covers most of what people claim to
    him verbally. He takes his office seriously because he has
    witnessed enough property disputes to know what happens when
    the original paperwork is unsigned or ambiguous. His
    Chrysalis-change is quiet and strange: the wax under his
    certified seal remains faintly warm indefinitely -- not hot,
    just perceptibly warmer than the surrounding document.
    Forgeries of his seal run cold. He cannot account for the
    mechanism and has stopped trying. The civic auditors have
    run independent tests. He is correct.
