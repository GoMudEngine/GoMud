character:
  name: Corliss the Shopkeeper
  description: |
    Corliss the Shopkeeper runs the Civic Stores with the practical
    efficiency of someone who has decided that a well-stocked
    shelf and an accurate ledger are the two things standing
    between order and disorder, and who takes both seriously. She
    carries the sundries of urban life -- candles, rope,
    tinderboxes, waterskins, the tri-cities broadsheet -- in
    quantities sized for the municipal district: small enough to
    move quickly, restocked often enough to stay current. Her
    Chrysalis-change is a shopkeeper's gift made precise: she
    can look at any bin or crate and tell you exactly how many
    units it holds without counting. Her inventory has not been
    off by a single item since the change. She considers this
    the most useful thing that has happened to her in several
    years.
