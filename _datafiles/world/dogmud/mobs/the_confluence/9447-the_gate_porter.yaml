character:
  name: The Gate-Porter
  description: |
    The Gate-Porter keeps the entrance to the Scholars' Quarter,
    directing visitors to whichever part of the quarter they are
    looking for and fielding the occasional confused inquiry from
    travelers who expected something more dramatic from the gate.
    He knows every member of the Margin by sight and most of them
    by first name, which is useful when a scholar arrives in the
    early hours wanting archive access and needs to be identified
    without waking anyone. He is not a Margin member himself but
    has been at this gate for eleven years and has absorbed a
    professional familiarity with the quarter's business without
    any particular scholarly interest of his own. His
    Chrysalis-change is subtle: he always knows when someone
    approaching the gate has not been here before, a few seconds
    before they arrive, which helps him have the directions ready.
