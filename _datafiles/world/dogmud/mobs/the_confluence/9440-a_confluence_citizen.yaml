character:
  name: A Confluence Citizen
  description: |
    A Confluence Citizen is crossing Tri-Cross Square today, as
    they do most days, on their way to somewhere else. They carry
    the general air of a person with moderate business in the
    civic district -- a parcel under one arm, an opinion on the
    ferry schedule, a crumbled roll for the pigeons -- and move
    through the square with the comfortable familiarity of someone
    who has been doing this long enough that the pigeons have
    learned their schedule. Their Chrysalis-change is minor and
    they seem largely unbothered by it: small things go right
    for them in unremarkable ways. The coin they drop does not
    roll into the drain. The pigeon they aim for takes the
    bread. They have not thought much about this.
