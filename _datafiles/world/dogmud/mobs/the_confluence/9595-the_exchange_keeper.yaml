activitylevel: 12
character:
  name: The Exchange-Keeper
  description: |
    The Exchange-Keeper minds the Confluence's ledger with
    the same unhurried patience she brings to every other
    part of her day. A lean, grey-eyed woman in a coat gone
    shiny at the elbows, she has counted barge tolls,
    warehouse rents, and pearl-consignment fees for longer
    than most of the tri-city has been trading here. She
    speaks slowly and precisely, as though every sentence
    were itself a ledger entry that might need correcting
    later. She knows what every trade house on the river
    owes and to whom, and keeps that knowledge behind the
    counter along with the strongbox key.
  speciesid: 1
  level: 1
