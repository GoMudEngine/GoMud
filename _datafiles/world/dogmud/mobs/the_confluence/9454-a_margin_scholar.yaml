activitylevel: 10
character:
  name: A Margin Scholar
  description: |
    A Margin Scholar has set up at the base of the temple portico
    stairs with a folio, a brass measuring tool, and the particular
    stillness of someone doing precise work in a place where they
    are not entirely welcome. She is here to copy the symbol above
    the temple doors -- the oldest stonework on the island -- with
    the dimensional accuracy that field measurement permits. She is
    not a Keeper and she is careful not to obstruct the pilgrims.
    The Warden has noted her. She has noted the Warden. Neither has
    said anything that required a response. Her Chrysalis-change
    runs toward geometry: she perceives spatial relationships and
    proportions with an exactness that her brass instruments only
    partially capture. She does not mention this on temple ground.
