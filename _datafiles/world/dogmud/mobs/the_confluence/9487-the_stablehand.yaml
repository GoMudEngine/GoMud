character:
  name: The Stablehand
  description: |
    The Stablehand works the Brennside stable with the quiet
    efficiency of someone who prefers animal company to human
    company and has arranged their working life accordingly. He
    is a young man, broad across the back from hauling feed sacks,
    with the unhurried manner of someone whose pace is set by the
    animals and not the clock. The stable serves road travelers:
    horses ridden in from Greenford, mules that have pulled supply
    carts two days and need water, the occasional ox that has done
    something unforgivable to its owner's nerves along the way.
    His Chrysalis-change is a thing animals sense before people
    do: anxious horses steady when he approaches, and mules --
    notoriously difficult -- follow him with easy docility.
