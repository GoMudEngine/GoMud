character:
  name: Holt the Gate-Warden
  description: |
    Holt the Gate-Warden is a lean man with the weathered look of
    someone who has spent decades standing at a fixed point while
    everything else moved past him -- merchants, pilgrims, freight
    wagons, seasons. He wears a plain river-cloth coat and carries
    a short cudgel at his belt more out of habit than necessity;
    the gate behind him opens onto the Landings quay, and this
    morning he swung it wide for the first time since the autumn
    ice sealed the river. There is quiet satisfaction in how he
    stands. His Chrysalis-change is subtle: his eyes have taken on
    a faint amber cast, and he can pick out movement on the river
    at distances that make barge pilots nervous.
