character:
  name: Birrel the Netmender
  description: |
    Birrel the Netmender runs the small stall at the landing where
    she mends river nets by morning and sells smoked fish and river
    food by afternoon -- a two-trade livelihood that suits her
    perfectly well and generates enough village gossip to keep both
    halves running. She is broad-faced and cheerful, with ink-dark
    fingers from the net-dye on her repair thread, and an opinion
    on everything from the pilgrims to the price of salt. Her
    Chrysalis-change gave her a second set of thumbs, sprouting
    inward from each palm -- she uses all four to work the net
    needle with a speed that leaves people staring, then politely
    pretending they had not been.
