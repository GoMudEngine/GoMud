character:
  name: Nara the Pilgrim
  description: |
    Nara the Pilgrim is road-weary in the honest, physical sense:
    her boots have been resoled once since they set out, her back
    aches from the pack, and she says so. She is traveling south
    with her companion Wess to the Temple of Confluence, and if
    she is not herself a true believer, she is the next best thing
    -- a person who does not require others to explain their belief
    but still wants to understand it. She asks practical questions
    and listens to theological answers with more patience than she
    lets on. Her Chrysalis-change is the kind people joke about:
    her hair grows back in three different colors simultaneously,
    cycling, so that she is always striped in a different mix. She
    has stopped finding it amusing and mostly just ties it back.
