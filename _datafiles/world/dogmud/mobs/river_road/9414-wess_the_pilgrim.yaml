character:
  name: Wess the Pilgrim
  description: |
    Wess the Pilgrim travels south to the Temple of Confluence with
    the road-worn certainty of someone who has been planning this
    journey for a long time and is now, at last, making it. She is
    lean and calloused, with a walking pack that shows its miles and
    a calm face that is not the absence of feeling so much as its
    management. Her faith is not the showy kind -- she does not
    announce herself or seek the company of strangers for their own
    sake, but when asked she speaks of the Confluence temple plainly
    and without embarrassment, as one discusses going home. Her
    Chrysalis-change is a narrow ring of luminescent skin around
    each wrist, barely visible by day, that pulses faintly at night.
    She considers it a sign that she was always meant to walk south.
