character:
  name: Carew the Road Warden
  description: |
    Carew the Road Warden has the build of a man who has spent more
    time in the mud than out of it -- broad through the shoulders,
    with clay still worked into the knees of his boots and a survey
    rod tucked under one arm like a walking staff. He reopened this
    section of road after the spring floods carved it into a ditch,
    and the quiet pride of having done it right is written in the way
    he stands -- weight on both feet, chin slightly raised, watching
    the southbound grade as if it were his own work on display, which
    it is. His Chrysalis-change is modest: the first two fingers of
    his left hand have fused at the base, and he uses the broad flat
    joint to tamp survey stakes with a precision no ordinary hand
    could manage.
