character:
  name: Sedge the Old Fisher
  description: |
    Sedge the Old Fisher has been at this smokehouse longer than
    most of the locals have been alive, and he wears that fact the
    way the smokehouse wears its char -- as something that just
    accumulated, without drama, year by year. He is very old, very
    thin, and very comfortable, with a way of talking about the
    river that makes it sound like a person he has known all his
    life, which is approximately what it is. His Chrysalis-change
    is old enough that no one is sure anymore what it looked like
    when it came: his eyes have gone to a flat river-grey with no
    visible iris, and he sees best in low light, which is useful
    when you tend a smokehouse.
