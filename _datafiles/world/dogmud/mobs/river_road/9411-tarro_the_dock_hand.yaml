character:
  name: Tarro the Dock-hand
  description: |
    Tarro the Dock-hand works the river landing where the Aldren
    barges put in to unload and take on cargo before continuing
    south. He is lean and rope-scarred through the palms, with a
    way of watching the water that looks like idle staring but is
    closer to professional assessment -- he is reading depth and
    current, always. His Chrysalis-change runs along his forearms:
    a faint iridescent scale-pattern, like a fish seen from below,
    that catches the river light when his sleeves are rolled. He
    does not comment on it; around river folk it hardly rates a
    glance.
