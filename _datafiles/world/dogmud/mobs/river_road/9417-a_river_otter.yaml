character:
  name: A River Otter
  description: |
    A sleek brown creature the length of a man's arm, riding the current
    with its paws folded against its chest before rolling belly-up to
    crack something against its stomach. Its eyes are dark and quick, and
    it watches the bank with apparent curiosity before deciding you are
    not interesting enough to bother with. It dives in a smooth arc that
    barely disturbs the surface, resurfaces twenty yards downstream, and
    shakes itself dry on a mossy rock with an air of complete
    indifference.
