character:
  name: A Grey Heron
  description: |
    A tall grey-blue bird standing still as a stake in knee-deep water at
    the river's edge, patient as carved stone. Its neck is coiled back
    against its breast, one amber eye fixed on the shallows below. It
    moves so slowly between positions that a traveller might mistake it
    for a painted carving -- until it strikes, a blur of beak and neck,
    and lifts something silver from the current. Startled, it will unfold
    enormous wings and climb away on slow, heavy wingbeats, legs trailing
    behind it like a bent afterthought.
