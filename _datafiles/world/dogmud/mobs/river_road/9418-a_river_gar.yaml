character:
  name: A River Gar
  description: |
    A long, narrow fish, easily four feet from the tip of its armoured
    bony snout to the ragged trailing edge of its tail, drifting
    motionless in the shallows with all the menace of a waterlogged
    stick. Its jaw is lined with small, backward-curved teeth designed
    not to let go. Its scales carry a faint bioluminescent tinge -- a
    mutation common to the gar of this river-stretch -- and when the
    light catches it just right the thing looks less like a fish and
    more like a blade left sitting in slow current. It will not move
    until something gets close. Then it moves very quickly indeed.
