character:
  name: The Quay Agent
  description: |
    The Quay Agent works from a narrow booth near the passage berth,
    ledger open, a brass stamp within easy reach of his right hand. He
    dresses plainer than the tally-clerks up at the main landing but
    keeps the same close accounting -- every fare entered, every
    sailing initialed, the harbormaster's seal renewed each season
    without being asked twice. He has little patience for haggling and
    less for lateness -- the boats keep the capital's schedule now, not
    the old lake custom, and he intends to see that habit stick. His
    Chrysalis-change left his handwriting untouched but sharpened his
    memory for names -- he rarely asks a returning traveler's business
    twice.
