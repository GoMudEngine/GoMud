idlecommands:
  - 'emote reviews a page in the open ledger on the desk, makes a
    note in the margin, and turns the page without pausing.'
  - ''
  - 'emote stands, crosses to the notice board, reads one entry
    through to the end, and returns to the desk without having
    changed it.'
  - ''
  - 'emote touches two fingers briefly to the side of the throat
    — the double pulse there, perfectly steady, two rhythms
    running in exact parallel — then takes his hand away.'
  - ''
  - 'emote writes without looking up; the pen moves with the
    economy of a man who has been writing reports long enough
    not to think about it.'
activitylevel: 10
character:
  name: Dock Constable
  description: |
    He has organized the desk the way it works rather than the way
    it looks good — the ledger open, the ink to the right, the lamp
    where the page is lit and not the eyes. His face is tired in
    the particular way of someone who has heard a great many
    accounts of events and has developed a private method for
    sorting what to credit. He is fair by practice rather than
    temperament; the temper has been worn level by the work. At
    the throat, where the pulse beats, two beats come instead of
    one — a secondary rhythm, perfectly matched to the first, the
    Chrysalis having given him what the body apparently felt it
    needed. He does not call attention to this. He continues doing
    his job, which is the same constabulary work it was before,
    only now with a second heartbeat keeping the time alongside
    the first.
