activitylevel: 10
character:
  name: Dunmar Wells
  description: |
    Dunmar Wells does not pace — he circulates, and the difference is
    audible in the purposeful economy of each stop. He is a compact man
    of indeterminate middle age with ink-stained hands and the focused
    stillness of someone who has never found the work dull. High on his
    brow, set where a second pair of eyes might be if the body had
    decided to hedge its bets, a third eye rests — amber-irised,
    slightly larger than his others, and it never closes. Not when he
    works. Not in lamplight. Visitors to the warehouse learn quickly not
    to think they can slip something past him when his back is turned.
    His back is never fully turned. Nothing in this warehouse has gone
    missing on his watch. He considers this baseline performance.
