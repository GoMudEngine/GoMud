activitylevel: 7
character:
  name: Teels
  description: |
    A former dockhand -- you can tell by the calluses and the way they
    stand near the water, at ease with the noise and the weight of the
    place even now. The body is mostly intact, but the face has changed:
    drawn tight, the skin around the eyes gone pale, the color not quite
    right. At the left wrist, just visible beneath the cuff, a faint
    tracery of copper lines follows the veins -- the earliest sign of
    something the docks call the Bloom, the bark-skin only beginning,
    the body only starting to rewrite itself from the inside. They hold
    it together well enough that a passing glance would miss it entirely.
    They are not holding it together.
