activitylevel: 14
character:
  name: Dobb
  description: |
    Dobb gives the impression of movement even when standing still. He
    is young, lean, and possessed of an unaffected friendliness that is
    not the performed kind — he simply seems glad to be here, wherever
    here happens to be this hour. His legs are the tell: where anyone
    else would be showing the toll of a day's walking, Dobb's legs are
    not. The calves are unusually corded, the step spring-loaded at
    rest, and he has been observed completing the full city circuit
    without once sitting down to rest. The Chrysalis gave his legs a
    gift they spend every day on the Long Market route. He does not
    seem to find this remarkable. He does not seem to find much of
    anything worth complaining about.
