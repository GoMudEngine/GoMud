activitylevel: 10
character:
  name: Foreman Hewd
  description: |
    He keeps the desk the way a man keeps a desk when he needs
    visitors to see the desk and not the man behind it — neat,
    organized, nothing left out that was not put there deliberately.
    He is middle-aged and carries it well; the kind of face that
    reads as pleasant at a distance and as something else up close.
    What the close read returns is this — his eyes do not blink at
    the rate the room expects. Not rarely, not startlingly, just
    less. He watches without appearing to watch; the intervals
    between blinks are slightly too long, and the blinks, when they
    come, are the kind that close and reopen without settling —
    as though whatever they are resting is not quite rested. Nothing
    about this is comfortable to stand near for very long. He is
    aware of this. He has decided it works in his favor.
