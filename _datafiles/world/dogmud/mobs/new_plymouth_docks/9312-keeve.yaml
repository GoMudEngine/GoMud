activitylevel: 6
character:
  name: Keeve
  description: |
    Keeve runs Aldric's the way a good harbor pilot works a strait
    — with exact knowledge of where the hazards are, minimal
    conversation about it, and a practiced ease that is not the
    same as inattention. He is a lean man of fifty or so, with a
    scar across his upper lip old enough to be simply part of his
    face. In lamplight the scar's edges hold a faint amber glow,
    just perceptible in low light — a Chrysalis trace subtle
    enough that most guests never remark on it, which is how he
    prefers things to go generally. His house takes horses, takes
    people, charges fair rates, and takes no notice of anyone's
    history. He will remember you the next time you arrive
    regardless. He has not once in living memory asked a guest
    their business.
