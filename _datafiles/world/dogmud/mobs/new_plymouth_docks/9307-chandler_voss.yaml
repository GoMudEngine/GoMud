activitylevel: 8
character:
  name: Chandler Voss
  description: |
    Chandler Voss has the look of a man who has spent decades in rooms
    that smell of pitch and oil and rope-tar and who has made his peace
    with it. He is broad-shouldered, economical in his movements, and
    shorter than he appears — the tidiness of his shop makes him seem
    larger than the space. His skin is the most noticeable thing about
    him: a dark, even staining has worked its way below the surface,
    permanent as a dye, and in wet weather water runs off it in clear
    beads without soaking in. He noticed this some years ago, mentioned
    it to his wife, and has not mentioned it since. He knows where every
    item in this chandlery is without looking. He will tell you where
    yours is too, if you tell him what you need.
