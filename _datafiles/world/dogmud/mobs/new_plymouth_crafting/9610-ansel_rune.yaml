character:
  name: Ansel Rune
  description: |
    I read the grain of a chrysalis shard the way another man
    reads a face, and it tells me just as much. My coat carries
    more scorch marks than I would like to admit, mostly from
    workings that went slightly wrong before I understood why.
    I do not talk while I am binding a sigil -- a wandering
    thought at the wrong moment ruins good material and I have
    ruined enough of it already to know better. Ask me for
    something specific and I will tell you exactly what it
    costs and exactly how long it will take. I am not in the
    habit of being wrong about either.
