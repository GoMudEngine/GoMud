character:
  name: Corwin the Tanner
  description: |
    Corwin the Tanner runs the Tannery at the east edge of the Crafting
    Quarter, where the district bleeds into the tannery lanes that run
    south into the Common. He is a solid, unhurried man with leather-
    tough skin — the Chrysalis-change that the work practically asked
    for — dry and close-grained as good hide, resistant to the caustic
    baths and knife-work that would roughen ordinary hands into
    uselessness. He does not apologize for the smell. He has never
    found it worth discussing. Hides come in from the warehouse; he
    cures and cuts them here, and what comes out is as honest as
    anything in the Crafting Quarter. He has no strong opinions about
    most things and several very firm ones about leather.
