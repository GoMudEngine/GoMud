activitylevel: 10
character:
  name: Edda Glass
  description: |
    Edda Glass tends the Glass Kiln as though the work itself is the
    only thing keeping the place from going quiet the way next door
    has gone quiet. She is a lean woman with the deliberate patience
    of someone who has spent years working with things that break,
    forearms mapped with heat-scarred patches in the distinctive
    pattern of old thermal burns, and fingernails gone glass-clear
    — transparent to the bed — from years at the molten gather. Her
    Chrysalis-change gave her the fingernails and a heat tolerance
    that lets her work without heavy gloves when the task demands
    close judgment. She was here when the cooperage complex ran full
    — kilns north, barrel-work south, people she knew moving between
    both. One of those people was named Asha. She does not bring Asha
    up with strangers, and she does not encourage questions about the
    south end of the building.
