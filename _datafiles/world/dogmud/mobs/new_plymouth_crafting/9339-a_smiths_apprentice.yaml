character:
  name: A Smith's Apprentice
  description: |
    The apprentice is soot-darkened at the collar and cuffs in the
    way that several washes have not yet shifted, which is the
    permanent condition of working a forge. He carries coal and
    works the bellows and keeps the yard clear of scale for Halvard,
    who does not explain more than once. He is eager in the manner
    of someone learning a trade that demands competence, not speed,
    and has not quite distinguished between the two.
