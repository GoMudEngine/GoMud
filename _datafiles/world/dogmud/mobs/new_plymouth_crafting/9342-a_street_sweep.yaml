character:
  name: A Street-Sweep
  description: |
    Old enough to remember when Craftwell Square was a loading yard
    and the lane she sweeps was unpaved, the street-sweep works the
    square and the two nearest lanes from morning to afternoon, one
    broom-width at a time. She moves with the methodical progress of
    someone who knows exactly how long it takes and is not in a hurry
    because of it. She talks to the cobbles occasionally. They do
    not argue.
