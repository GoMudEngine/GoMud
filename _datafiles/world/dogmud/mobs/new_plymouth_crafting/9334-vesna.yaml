activitylevel: 10
character:
  name: Vesna
  description: |
    Vesna works the Alchemist's Lab with the focused stillness of
    someone for whom every action has a reason and the reason was
    established hours ago. She is slight and precise, with a measuring
    quality to how she moves through the cluttered space — never
    rushing, never wasting a step. Her Chrysalis-change shows in
    certain lights — a faint iridescent oil-sheen plays across her
    skin, rainbow-edged, shifting as she turns. She has learned not
    to think about it. Her supply comes from the docks warehouse and
    from the foragers who work the surrounding country; she processes
    raw material here and sells finished product to healers and
    apothecaries across the quarter. The largest standing order goes
    to Ysolde in the Common Quarter — salves, primarily, and the
    occasional compound. Vesna finds Ysolde a reliable customer and
    does not ask what she uses the more unusual preparations for.
