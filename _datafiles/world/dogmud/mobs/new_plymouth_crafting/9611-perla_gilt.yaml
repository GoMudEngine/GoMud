character:
  name: Perla Gilt
  description: |
    I have set more gems than I have fingers to count them on,
    and my hands have not once shaken over it. This bench and
    this light are mine -- I chose the window myself for the
    angle of the sun in the morning, which is when the finest
    work gets done. I keep a pocketful of tools I trust and a
    magnifying lens I trust more, and I do not let a piece
    leave this room until the setting is flush enough that a
    fingernail cannot catch on the seam. Bring me stone and
    wire and I will bring you back something worth wearing.
