activitylevel: 10
character:
  name: Orin the Bookseller
  description: |
    Orin the Bookseller runs his stall at the corner where the main
    Crafting Quarter lane turns toward the cooperage district, which
    means he has been watching the shuttered building next door for
    longer than most people in New Plymouth have been paying attention
    to it. He is a quiet, angular man with permanently ink-stained
    eyes — the Chrysalis-change that makes him useful at closing time
    — irises deep with old ink, shifting the way dark water shifts,
    capable of reading in light that would leave anyone else tracing
    shapes. He sells books and maps. Among the maps, he still carries
    the last work of Edvar the cartographer, who occupied the shop
    next door and is no longer here. He is not in a hurry to sell
    those particular maps. He prices them fairly.
