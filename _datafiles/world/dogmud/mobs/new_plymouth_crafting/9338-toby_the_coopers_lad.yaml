character:
  name: Toby the Cooper's Lad
  description: |
    Toby the Cooper's Lad sits on the front step of the Abandoned
    Cooperage or stands near enough to the door that he is always
    between you and it. He is young — not a child, not quite settled
    into a man — with the permanent pink of steam-reddened hands,
    palms and the backs of both, the Chrysalis-change that the
    cooperage's old work burned into him before the place went quiet.
    He does not explain why he is still here. He does not ask you
    why you are here either, but he notices. The padlock on the
    cooperage door is always sound. He checks it regularly. Whatever
    is in there, he takes its safekeeping seriously enough to stand
    in the rain for it.
