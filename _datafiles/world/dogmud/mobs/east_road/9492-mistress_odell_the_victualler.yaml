character:
  name: Mistress Odell the Victualler
  description: |
    Mistress Odell the Victualler runs the hamlet's only provision
    stall from a low table beneath a canvas awning she re-patches
    each spring. She is compact and deliberate, with flour-browned
    wrists from baking before the rest of the hamlet wakes, and a
    habit of watching the road east as if tallying something. Her
    Chrysalis-change settled in her irises: they carry a warm amber
    glow, faint in daylight and unmistakable at dusk, giving her a
    look of quiet unhurried attention even when she is simply
    counting change.
