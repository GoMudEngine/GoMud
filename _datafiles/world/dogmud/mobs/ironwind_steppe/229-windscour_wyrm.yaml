  description: |
    The undisputed lord of the Windscour Caves -- a serpentine
    creature of enormous size, its body thick as a tree trunk and
    covered in scales as hard as armor plate. The windscour wyrm
    has dwelt in the deepest chamber for longer than anyone can
    say, growing slowly in the darkness, feeding on whatever
    wanders too deep. Its scales are dark grey with an iridescent
    sheen, and its eyes -- when open -- are molten gold with
    vertical slit pupils. Deep scars cross its hide, testament
    to battles with challengers long dead. The wyrm regenerates
    damage with unsettling speed, wounds closing before your
    eyes. It is ancient, patient, and supremely dangerous.
