character:
  name: Prairie Viper
  description: |
    A thick-bodied viper with triangular head and vertical-slit
    pupils, its scales patterned in bands of dusty brown and dull
    gold. The prairie viper is venomous -- not fatally so, but
    enough to cause considerable pain and swelling. It hunts by
    ambush, lying motionless in the grass until prey wanders close
    enough to strike. The rattle at the tip of its tail buzzes
    when threatened, a warning that should be heeded.
