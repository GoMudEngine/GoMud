character:
  name: blind stalker
  description: |
    An apex cave predator that hunts in perfect darkness. The blind
    stalker has no eyes -- its skull is smooth where eye sockets
    would be, sealed over by evolution. In their place it has
    developed other senses to a supernatural degree: hearing acute
    enough to track a heartbeat, smell that can follow a trail
    hours old, and skin sensitive to the faintest air current.
    Its body is lean and powerful, covered in smooth, pale skin,
    and it moves with a fluid, terrifying silence. It is patient,
    intelligent, and very, very dangerous.
