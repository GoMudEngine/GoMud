character:
  name: Pale Lurker
  description: |
    A pallid, elongated creature that clings to cave ceilings and
    drops on unsuspecting prey. The pale lurker has lost all
    pigment, its skin a translucent white that shows the dark
    tracery of veins beneath. Its body is flexible and boneless-
    seeming, allowing it to squeeze through impossibly narrow
    gaps. Long, grasping limbs end in adhesive pads, and its
    wide mouth is lined with backward-curving teeth. It hunts
    by patience, remaining motionless for hours until prey
    passes beneath.
