character:
  name: Halix
  description: |
    A weathered man past forty, lean and dust-coloured, dressed
    in layered hides over a long-sleeved linen shirt. His
    boots and trousers carry the fine grey dust of the steppes
    in every seam. A short spear rides easy on his shoulder; a
    broad-bladed steppe-knife hangs at his belt for skinning,
    and the buckles at his waist are kept oiled against the
    wind. He has the unhurried watchfulness of someone who has
    walked these flats long enough to read them like a market
    notice.
