character:
  name: Goblin Scout
  description: |
    A wiry, green-skinned goblin barely three feet tall, dressed in
    scraps of stolen leather and carrying a crude stone knife. The
    goblin scout is the eyes and ears of the steppe-goblin band --
    quick, cautious, and surprisingly sneaky for something that
    smells this bad. Its oversized ears swivel independently, and
    its yellow eyes see well in the dim coulee passages. It will
    flee from a fair fight and try to lead you into an ambush.
