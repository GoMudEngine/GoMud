character:
  name: rock viper
  description: |
    A thick, muscular viper adapted to life among the basalt coulees.
    Its scales are dark grey-brown with a zigzag pattern of black
    diamonds, blending perfectly with the volcanic stone. The rock
    viper is more venomous than its prairie cousin -- its bite
    delivers a potent hemotoxin that causes severe pain and tissue
    damage. It hunts by ambush, lying motionless on warm stone until
    prey passes within striking distance. Larger and more aggressive
    than the prairie viper.
