character:
  name: stone beetle queen
  description: |
    An enormous beetle the size of a pony, her carapace thick
    and ridged like castle fortifications. The stone beetle queen
    is the matriarch of the cave beetle colony, her body encased
    in layers of hardened chitin reinforced with mineral deposits
    absorbed from the cave stone itself. Her mandibles can shear
    through solid rock, and her legs are powerful enough to crush
    stone to gravel. She is slow but incredibly tough, her armored
    body shrugging off blows that would fell lesser creatures. The
    colony defends her with fanatical devotion.
