character:
  name: Coulee Spider
  description: |
    A large spider with a body the size of a clenched fist and
    legs that span nearly a foot. Its carapace is dark and glossy,
    patterned with pale markings that resemble the basalt's mineral
    veins -- natural camouflage for its rocky habitat. The coulee
    spider builds thick, funnel-shaped webs in rock crevices and
    waits motionless for vibrations. Its bite is not deadly but
    causes painful swelling and numbness. Multiple spiders often
    inhabit the same stretch of coulee.
