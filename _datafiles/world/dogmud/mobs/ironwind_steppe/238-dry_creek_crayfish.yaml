character:
  name: Dry Creek Crayfish
  description: |
    A small, reddish-brown crayfish that survives in the muddy
    pools and seeps of the dry creek system. It burrows into wet
    mud during dry spells, waiting out droughts in underground
    chambers. When water is available, it emerges to scavenge
    the creek bed for organic matter. Its pincers are small but
    surprisingly strong, and it waves them defensively at anything
    that disturbs its pool.
