character:
  name: A Townsperson
  description: |
    A quiet man of the Guild Lane going about the middle
    business of a weekday with the settled ease of someone
    who likes where he lives. He is unassuming and unhurried,
    with a coat worn smooth at the elbows and a scarf that
    has been in service since before the cold technically
    started. His Chrysalis-change is in his hands and feet:
    the skin there has become thermally inert -- he registers
    neither cold nor heat in either set of extremities. He
    presses letters closed on candle-sealing wax without
    flinching and works the lane in winter without gloves.
    His children regard this as the single interesting thing
    about him, and he is not certain they are wrong.
