character:
  name: A Neighbor
  description: |
    A long-standing resident of College Row, a man in
    his fifties who keeps the terrace on the west side
    and takes an orderly interest in the state of it.
    He is easy company on a street corner, the kind of
    neighbour who knows who lives where and how long
    they have been there. His Chrysalis-change is in
    his fingertips: they read moisture levels in stone
    and wood and mortar with the accuracy of an
    instrument, giving him an unusually reliable sense
    of where damp is working in and where walls are
    holding sound. He maintains his terrace in excellent
    repair. He has opinions about other people's mortar.
    He keeps these largely to himself.
