character:
  name: A Neighbor
  description: |
    A long-standing resident of College Row, a man in
    his fifties who keeps the terrace on the west side
    and takes an orderly interest in the state of it.
    He is easy company on a street corner, the kind of
    neighbour who knows who lives where and how long
    they have been there. His Chrysalis-change is in
    his peripheral vision: it extends a few degrees
    further than it should, catching movement at the
    edge of sight without the need to turn his head.
    He notices things at the corners of his field of
    view that most people miss entirely, which is
    partly why he knows the row as well as he does.
    He keeps his observations largely to himself.
