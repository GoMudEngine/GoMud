character:
  name: Tibb the Jeweler
  description: |
    A small, precise man with a leather apron fitted out in
    dozens of tiny pockets for files, pliers, and setting-tools.
    Tibb learned the trade from a travelling jeweler who passed
    through Greenford one autumn and never quite continued on
    his way. His nails are permanently stained with polish, and
    a lens on a brass arm hangs from a chain at his neck, ready
    to flip up the moment something interesting crosses the
    bench.
