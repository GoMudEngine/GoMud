character:
  name: A Skeptical Scholar
  description: |
    A senior lecturer in historiography who has spent the
    better part of his career asking why the official account
    of the Founding does not cohere with the source documents,
    a question the university tolerates because he asks it
    with rigour rather than heat. He is sharp-featured and
    long-fingered, with the restlessness of someone who has
    found a problem he cannot let go of. His Chrysalis-change
    is in his fingernails: they grow in a slow spiral, curling
    inward at the tips. He has filed them flat more times than
    he has counted; they return to the spiral within a
    fortnight. He has ceased to explain it to anyone.
