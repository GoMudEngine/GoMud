character:
  name: A Student
  description: |
    A second-year student in his early twenties, pausing in
    the quadrangle for longer than his timetable allows. He
    carries more books than are strictly necessary for the
    day, a habit left from his first term when he was unsure
    what would be needed. His Chrysalis-change is in his
    palms: the skin there does not retain pressure-marks.
    After hours at a desk with a quill his hands carry no
    impression of the work. His classmates have begun to find
    this either enviable or faintly unsettling, depending on
    how often they work through the night.
