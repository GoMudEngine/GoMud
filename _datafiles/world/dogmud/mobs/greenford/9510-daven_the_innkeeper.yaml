character:
  name: Daven the Innkeeper
  description: |
    Daven the Innkeeper has run the Cartographer's Rest for
    twenty years and regards this as the correct length of
    time to know what a traveler needs before they ask: the
    corner settle by the fire, a hot meal, the room on the
    quiet side. He is broad and unhurried, with a warmth
    that comes from professional ease rather than any
    particular sentiment about strangers. His Chrysalis-
    change is in his ears: the outer edge of each has curved
    upward and inward by a fraction, cupping sound the way
    a hand cups water. He hears guests on the stair two
    treads before they arrive at the bar. He has stopped
    being surprised by late arrivals entirely.
