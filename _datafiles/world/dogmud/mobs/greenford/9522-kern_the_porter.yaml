character:
  name: Kern the Porter
  description: |
    Kern the Porter has worked the university gate for seven
    years, a tenure that has left him with a complete working
    knowledge of the campus, its personalities, and its
    visiting hours. He is solid and unhurried, with a lodge
    ledger kept in a meticulous hand and the manner of someone
    who has answered the same questions long enough to have
    made them interesting again. His Chrysalis-change is in
    pattern recognition: he identifies visitors by gait before
    their faces are close enough to read. His lodge log names
    visitors before they speak, which has startled a number of
    returning faculty and delighted precisely none of them.
