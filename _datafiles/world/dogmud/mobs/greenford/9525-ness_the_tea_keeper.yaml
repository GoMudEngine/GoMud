character:
  name: Ness the Tea-Keeper
  description: |
    Ness the Tea-Keeper has run the tea house at the
    end of College Row for eleven years, and she knows
    her regulars by the time they reach the front step.
    Her Chrysalis-change is in her nose: a scent-
    signature recognition that lets her distinguish
    individuals by their personal scent as precisely
    as most people distinguish faces. She knows before
    she looks up who has come in and whether they want
    their usual. She has learned to be easy about this,
    as most people find it unsettling if she greets
    them before the door fully opens. She is warm,
    unhurried, and efficient in the way of someone who
    has done the same good work in the same good place
    for a long time.
