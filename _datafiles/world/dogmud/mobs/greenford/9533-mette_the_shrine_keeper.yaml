character:
  name: Mette the Shrine-Keeper
  description: |
    Mette the Shrine-Keeper has tended the Wayfarer's
    Shrine at the Greenford road margin for nine years,
    which has given her a practical familiarity with
    departure. She is unhurried and quietly warm -- the
    kind of person who does not need conversation to
    fill a silence but welcomes it if it comes. Her
    Chrysalis-change is in her heart: a resting pulse
    of around forty beats per minute that has alarmed
    three physicians and one very thorough apothecary.
    She finds it a convenience. Nothing rattles her
    quickly. She can wait out a storm of feeling in
    the time it takes most people to begin panicking,
    and she has done so at the shrine more than once
    when someone's departure turns difficult. She keeps
    a handkerchief in her left pocket and never
    mentions that she has one.
