character:
  name: Prue the Store-Keeper
  description: |
    Prue the Store-Keeper has run the General Store for twelve
    years with a precision that borders on the affronting --
    everything is in its place, the place has not changed,
    and the suggestion that any of this could be otherwise
    she does not entertain. She is short and neat, with hands
    that move with an economy of motion suggesting every path
    to every shelf has been memorized until it requires no
    thought. Her Chrysalis-change is exactly that: a
    proprioceptive sense of space, a flawless awareness of
    where every item in the store sits in three dimensions.
    She can reach for anything in the dark without error. The
    shelving system is for her customers. She does not need
    it herself.
