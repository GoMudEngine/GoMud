character:
  name: Wren the Ostler
  description: |
    Wren the Ostler runs the coaching stable at the
    west edge of Greenford -- four horses, two coaches,
    and a yard she keeps in better order than most
    people keep their kitchens. She is compact and
    quick, with the particular efficiency of someone
    who has learned that slow work costs more than
    fast work in a stable yard. Her Chrysalis-change
    is in her freckles: they shift subtly in hue with
    the ambient light -- gold in direct sun, a flatter
    grey in cloud -- reading the sky the way a good
    barometer reads pressure. She uses this to judge
    the afternoon weather before committing a horse to
    a long ride west. The horses ignore it entirely,
    which she considers the most useful thing about it.
