character:
  name: Vance the Librarian
  description: |
    Vance the Librarian has managed the public stacks for nine
    years, an occupation suited to his temperament and his
    particular mutation in ways he has never found it necessary
    to articulate. He is even-mannered and soft-spoken, with
    an exact memory for shelf positions and a civil
    disinclination to idle conversation in the stacks. His
    Chrysalis-change is in his tread: his footsteps make no
    sound on stone. He moves through the library without echo
    -- arriving at a shelf, turning a corner, descending the
    step to the lower bay -- without any warning sound at all.
    Regular borrowers have learned to notice the displaced air.
