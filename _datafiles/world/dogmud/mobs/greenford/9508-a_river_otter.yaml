character:
  name: A River Otter
  description: |
    A sleek brown creature the length of a man's arm, working
    the boathouse slip with the ease of something that has
    decided this stretch of the river belongs to it. Its eyes
    are dark and quick; it watches the ramp and the gear-
    shelves with apparent interest before losing interest and
    diving in a smooth arc. It resurfaces somewhere downstream
    and shakes itself dry on a coil of rope with an air of
    complete indifference to having been watched.
