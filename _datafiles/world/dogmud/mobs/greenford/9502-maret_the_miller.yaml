character:
  name: Maret the Miller
  description: |
    Maret the Miller runs the watermill at the landing with a
    methodical precision that extends to everything she touches --
    the sacks are stacked by farm, the flour graded by stone-setting,
    and the millwheel schedule posted on the door in her own clear
    hand. She is square-shouldered and flour-dusted, with a
    permanent fine pallor to her hair from working inside the mill.
    Her Chrysalis-change is in her palms: the skin there has
    hardened to a fine-grained surface like millstone grit, grain-
    sensitive in a way no ordinary hand could manage. She can tell
    flour quality through a sack by touch, and does, routinely,
    to the mild unease of anyone watching.
