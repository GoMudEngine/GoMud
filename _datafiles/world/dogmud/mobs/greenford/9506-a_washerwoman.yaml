character:
  name: A Washerwoman
  description: |
    A capable woman of middle years, working the riverside green
    with a washboard and two large tubs of river water, her
    sleeves rolled above the elbow and her apron soaked to the
    hem. She does not hurry and she does not stop. Her Chrysalis-
    change is in the skin of her hands and forearms: a fine
    smooth texture like river-stone has replaced the ordinary
    surface, entirely water-resistant, never pruning or softening
    no matter how long she works in the cold water. She has
    been washing linen for twenty-two years and considers this
    the most useful thing the Chrysalis has produced in the whole
    of Greenford, herself included.
