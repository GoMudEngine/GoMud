character:
  name: A Barge-Hand
  description: |
    A broad man in river-damp canvas, working the cargo transfer
    from barge to dock with the mechanical efficiency of someone
    paid by the load and not the hour. His arms are unusual: from
    the elbow down they run noticeably long, a Chrysalis-change
    that has made him extraordinarily useful on barge work, where
    the extra reach across the gunwale saves a step and a pivot
    every time. He does not think about this any more than a
    tall man thinks about his height. He thinks about the cargo
    count and whether the timber goes on the south stack or the
    north.
