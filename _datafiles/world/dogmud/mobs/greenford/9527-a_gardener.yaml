character:
  name: A Gardener
  description: |
    A compact woman in her late forties who tends the
    walled garden behind the tea house with a skill that
    has produced, over several seasons, the best herb
    beds in the residential quarter. She works in the
    early morning before the light is full and considers
    this the correct time. Her Chrysalis-change is a
    soil-pulse sense: when her hands are in contact with
    worked soil, she feels moisture levels, root
    structures, and the health of what is growing there
    as a quality she describes only as a tone. She has
    not needed to test soil by any other method in eight
    years. She trusts the tone.
