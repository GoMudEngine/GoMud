character:
  name: A Retired Functionary
  description: |
    A former registry clerk of the university administra-
    tion, in his early seventies, who retired twelve years
    ago and has spent the time since at the quiet end of
    the west lane tending his opinions about his former
    colleagues. He is pleasant company in small doses and
    has an excellent memory for who has lived where and
    for how long. His Chrysalis-change is an internal chronometer:
    he knows what hour it is within a few minutes
    without looking, and has since the change took hold.
    After forty years of arriving at the registry at
    the same time each morning, he finds this less
    remarkable than it probably ought to be. He does
    not find the ability useful in retirement. He has
    not yet decided how he feels about that.
