character:
  name: A Retired Functionary
  description: |
    A former registry clerk of the university administra-
    tion, in his early seventies, who retired twelve years
    ago and has spent the time since at the quiet end of
    the west lane tending his opinions about his former
    colleagues. He is pleasant company in small doses and
    has an excellent memory for who has lived where and
    for how long. His Chrysalis-change is in his fingers:
    they retain the exact tactile impression of any
    document he has handled, allowing him to recognise a
    specific piece of paper by touch -- the grain, the
    weight of the ink, the texture of a seal. He no
    longer handles documents. He has not explained why.
