character:
  name: A Resident
  description: |
    A young woman of the residential quarter, up early
    with a basket and no particular urgency. She has
    lived on College Row for three years, which is long
    enough to know the row's habits but not long enough
    to have strong opinions about them yet. Her
    Chrysalis-change is in her skin: it absorbs early
    morning light with a heightened sensitivity, warming
    her from the first diffuse light before the sun
    clears the horizon. She wakes at dawn without
    prompting. She has come to regard early morning as
    her best time and arranged her life accordingly.
    The basket is for the market; she will be back before
    most of her neighbours are moving.
