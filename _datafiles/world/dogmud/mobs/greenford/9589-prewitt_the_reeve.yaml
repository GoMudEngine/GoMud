character:
  name: Prewitt the Reeve
  description: |
    Prewitt the Reeve keeps the Counting House's books with the
    same unhurried patience he brings to everything else. A
    stout, grey-whiskered man in a coat gone shiny at the
    elbows, he has counted every rent, every grain-tithe, and
    every quarter-rate this town has paid for longer than most
    residents have been alive. He speaks slowly and precisely,
    as though every sentence were itself an entry that might
    need correcting later. He knows who owes what to whom, and
    he keeps that knowledge behind the counter along with the
    strongbox key.
  speciesid: 1
  level: 1
