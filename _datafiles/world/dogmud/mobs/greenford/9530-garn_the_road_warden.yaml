character:
  name: Garn the Road-Warden
  description: |
    Garn the Road-Warden has kept the west gate for
    sixteen years, watching what goes out and what
    comes in. He is a settled man in his mid-forties,
    unhurried and observant, the kind of person who
    knows how to wait without looking like he is
    waiting. His Chrysalis-change is in his neck: an
    extra joint between the second and third cervical
    vertebrae that lets him rotate his head a full
    third further than anyone around him -- well past
    the shoulder, past the usual limit, all the way
    to the road behind without shifting his feet. He
    stopped noticing this years ago. Other people
    sometimes do. He stopped explaining it when he
    realized the explanation unsettled people more
    than the thing itself.
