character:
  name: A Lecturer
  description: |
    A natural philosophy lecturer in her middle years, with
    the chalk-dusty hands and precise diction of someone who
    has explained the same fundamentals many times without
    losing interest in them. She runs a working lecture hall
    the way some people run a kitchen: ordered, efficient,
    and with a clear sense of what is done and what is not.
    Her Chrysalis-change is directional: she feels north as
    a faint persistent pull in her sternum. She gestures
    toward compass points without thinking and is always
    right. Her colleagues discovered this in her second year.
    She has used it in every lecture on spatial reasoning
    since without advertising it directly.
