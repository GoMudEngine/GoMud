character:
  name: Aldo the Smith
  description: |
    A broad-shouldered man with forearms like knotted rope and a
    beard singed short at one corner from a forge accident he
    refuses to explain. Aldo took over the Guild Forge from his
    father and has kept its fire lit every working day since. He
    is unhurried at the anvil and impatient everywhere else, a
    man who trusts steel more than conversation. He makes
    plough-fittings and cart-hardware as readily as blades, and
    takes the same care with both.
