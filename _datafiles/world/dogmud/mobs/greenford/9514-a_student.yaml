character:
  name: A Student
  description: |
    A third-year student in her late twenties, taking the
    Upper Street at a pace that suggests she is late and
    has accepted it. She carries a satchel of considerable
    weight without appearing to notice and a reading-case
    tucked under one arm. Her Chrysalis-change is in her
    eyes: the irises shift from their ordinary brown to a
    pale grey, then to near-silver at the center, when she
    is recalling something precisely -- a passage, a
    diagram, a proof. She does not always notice when it
    happens. Her fellows have learned to give her a moment
    when she goes quiet with that silver look. She is
    usually right about what she is remembering.
