character:
  name: Brennan the Surveyor
  description: |
    Brennan the Surveyor has held the university's survey chair
    for twenty-two years, which means he has outlasted three
    provosts and any number of colleagues who found the eastern
    fieldwork too repetitive to sustain a career. He is spare
    and deliberate, with ink-stained cuffs and the particular
    squint of someone who reads maps in good light and bad.
    His Chrysalis-change is in the soles of his feet: he feels
    the gradient of any surface he walks with a precision no
    instrument he owns can match. He has not carried an
    inclinometer in fifteen years. He walks a slope once and
    knows it.
