character:
  name: A Produce-Seller
  description: |
    A broad-shouldered woman with a market-stall manner --
    brisk, confident, done with unnecessary conversation
    before it starts. She works the Market Cross stall each
    morning with greens and roots from the valley farms,
    laid out in the order that catches the most light and
    fewest flies. Her Chrysalis-change is in her fingertips:
    they read firmness, moisture, and ripeness through
    pressure alone -- a slow press tells her everything a
    produce buyer spends a minute checking by eye. She
    assesses a root in two seconds and is never wrong. She
    does not explain this. The greens are always good;
    customers have learned to trust the fact without asking
    after the reason.
