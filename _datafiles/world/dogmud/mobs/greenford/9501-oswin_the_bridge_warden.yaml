character:
  name: Oswin the Bridge-Warden
  description: |
    Oswin the Bridge-Warden has held the Greenford gate for eleven
    years, a fact he mentions with the quiet satisfaction of someone
    who found the right job early and stayed in it. He is lean and
    weathered, with a leather coat worn smooth at the elbows and a
    toll-ledger perpetually tucked under one arm. His Chrysalis-change
    is subtle: his pupils are split -- a vertical slit overlays the
    natural round so his eyes catch lamplight from two angles at once.
    He works the gate in any weather, day or night, and has not needed
    a torch where the lantern bracket reaches.
