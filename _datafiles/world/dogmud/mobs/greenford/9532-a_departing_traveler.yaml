character:
  name: A Departing Traveler
  description: |
    A woman in her early thirties with a full pack and
    the settled bearing of someone who has made up her
    mind and is now simply executing the decision. She
    is bound west -- New Plymouth, she says, for the
    first time -- and her manner has the careful calm
    of someone who has been planning this long enough
    to stop being nervous about it. Her Chrysalis-
    change is visible on cold mornings: the knuckles
    of both hands glow a very faint amber when the
    temperature drops, barely perceptible in daylight
    but present. She wears her gloves more often than
    the weather requires. The glow has never bothered
    her -- she grew up with it -- but she has learned
    it startles people who notice it unexpectedly, so
    she wraps her hands out of courtesy rather than
    embarrassment.
