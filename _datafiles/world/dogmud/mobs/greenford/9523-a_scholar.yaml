character:
  name: A Scholar
  description: |
    A mid-career scholar in comparative history who has been
    at Greenford long enough to know which bench in the cloister
    walk gets the best of the garden-court light and how long
    to sit there before the cold from the stone makes itself
    felt. He carries a folio and a distracted air, the
    combination of someone who is between ideas and is not
    pretending otherwise. His Chrysalis-change is subtle: in
    full darkness his fingertips emit a very faint luminescence
    -- barely visible, not enough to read by. He found it
    useful once, in the archive during a lamp failure. He has
    not mentioned it to anyone since.
