character:
  name: A Town Crier
  description: |
    A stocky man with a handbell and a satchel, working the
    Market Cross end of the square most mornings with the
    ease of someone whose job has become invisible through
    long habit. He is comfortable with crowds and comfortable
    without them, which is the correct disposition for civic
    work. His Chrysalis-change is in his voice and chest: a
    resonance that places his words clearly in the air
    further than they have any right to carry -- not loud
    so much as penetrating. He has been heard from the far
    end of the square in a fog thick enough to hide him. The
    handbell announces him. The voice is the actual
    instrument.
