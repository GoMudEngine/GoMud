character:
  name: A Fisherman
  description: |
    A stocky man in river-worn clothes sitting at the top of the
    fishing steps with his boots off, heels on the stone above
    the damp line. He has three lines in the water and is watching
    none of them -- the patient indirection of someone who has
    fished this reach long enough to let the lines do the watching
    for him. His Chrysalis-change is the fine webbing between his
    fingers, a thin translucent skin linking the joints that has
    never interfered with his work and has made him, he will tell
    you if you ask, considerably better at feeling where the
    current runs beneath the surface. He does not consider this
    a gift so much as a tool.
