character:
  name: A Grey Heron
  description: |
    A tall grey-blue bird standing stone-still at the river's
    edge, neck coiled back against its breast, one amber eye
    on the shallows below. It could be a carving -- until it
    strikes, a blur of beak and neck so fast the motion barely
    registers, and lifts something silver from the current.
    Disturbed, it opens wings that seem too large for the space
    it was occupying and climbs away on deep, slow wingbeats,
    legs trailing behind it like a bent afterthought.
