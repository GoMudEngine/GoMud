character:
  name: Reth
  description: |
    Reth is a retired surveyor in his middle sixties,
    lean and deliberate, with the unhurried economy of
    someone who spent twenty years working in open
    country. He keeps the cottage spare and the field-
    notes in order. He does not invite company. His
    Chrysalis-change is in his eyes: a close-horizon
    sight that judges distances and proportions at
    range with a precision no instrument matches. He
    could tell you the length of a ridge at two miles
    and be right within a yard. He keeps the curtains
    drawn to a careful gap, not closed. He is watching
    the lane without appearing to.
