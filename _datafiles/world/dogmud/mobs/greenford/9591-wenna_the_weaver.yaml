character:
  name: Wenna the Weaver
  description: |
    A round-faced woman with a measuring cord looped permanently
    around her neck and dye-stains fading in and out along her
    forearms depending on the week's work. Wenna took up the
    Weaver's Loft from her aunt and has never once considered
    doing anything else. She moves between loom and cutting
    table with an unhurried economy, humming under her breath,
    and sells cloth, thread, and garments cut to actually last a
    season of farm work.
