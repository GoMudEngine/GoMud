character:
  name: Aldith the Bookseller
  description: |
    Aldith the Bookseller has run the square's bookshop for
    eighteen years, which means she has shelved, re-shelved,
    and twice rebuilt the stock into a system legible to her
    and only slowly to anyone else. She is slight and ink-
    stained, with reading-glass marks at her temples and a
    permanent lean of the left shoulder from the step-ladder.
    Her Chrysalis-change is in the pads of her fingers: the
    skin there has thinned to a near-translucent quality
    through which she can feel the impressed grain of vellum
    or the depth of a stamped title. She reads bindings in
    the dark by running a fingertip along the spine. She does
    not mention this and expects visitors not to notice.
