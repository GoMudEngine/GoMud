character:
  name: Tess the Archivist
  description: |
    Tess the Archivist has run the university archive for
    fourteen years, which by her accounting is exactly long
    enough to know where everything is and not long enough
    to have stopped minding when things are misplaced. She is
    precise and unhurried, with a card-index system she updates
    in a notational shorthand no one else has fully learned.
    Her Chrysalis-change is in her vision: in low light her
    eyes shift to a near-monochrome, high-contrast mode, the
    faded ink on old paper as legible to her as fresh text in
    daylight. She works the archive by lamplight without
    difficulty. She finds it faintly irritating when visitors
    remark on it.
