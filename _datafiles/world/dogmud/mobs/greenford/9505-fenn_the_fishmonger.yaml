character:
  name: Fenn the Fishmonger
  description: |
    Fenn the Fishmonger runs the river-row counter with a
    showman's patter and a professional's precision -- the fish
    are always laid gill-side up, the chalk prices always legible,
    and the damp cloth always just damp enough. He is round-faced
    and broad, with a voice built for a market lane. His Chrysalis-
    change is in his nose: the nostrils are distinctly wider than
    ordinary, with a sensitivity that lets him assess a fish's
    freshness from across the counter without touching it. He does
    not advertise this. He simply never sells a fish that has
    turned, and his regular customers have noticed that his
    guarantee holds even for stock that looks fine.
