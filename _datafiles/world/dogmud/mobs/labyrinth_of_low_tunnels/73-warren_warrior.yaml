character:
  name: Warren Warrior
  description: |
    Stockier than the scouts and half a head taller, this warren dweller
    has been bred -- or mutated -- for violence. Thick ridges of calcified tissue
    armor its shoulders and forearms, and its jaw is heavy and undershot, lined with
    teeth that look designed for tearing. It wears a harness of knotted sinew hung
    with small trophies --
    teeth, claws, and a few objects that are unmistakably human in origin. Its milky
    eyes are hard and watchful.
