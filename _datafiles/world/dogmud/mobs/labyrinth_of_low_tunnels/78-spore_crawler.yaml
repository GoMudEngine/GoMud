character:
  name: Spore Crawler
  description: |
    A flat, multi-legged creature the size of a large dog, its carapace
    crusted with the same pale fungus that grows on the hollow walls. It moves low
    to the ground on a dozen chitinous legs, mandibles working constantly as it
    grazes on fungal growth. Clusters of spore sacs bulge from its back, swollen
    and taut, ready to burst when the creature is threatened. The spores are
    irritants at best and toxic at worst -- the warren dwellers give these things
    a wide berth despite sharing the same food source.
