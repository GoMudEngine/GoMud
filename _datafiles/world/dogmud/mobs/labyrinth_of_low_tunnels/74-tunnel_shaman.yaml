character:
  name: tunnel shaman
  description: |
    Older than the warriors and scouts, the shaman is marked by mutation
    that trends toward the strange rather than the brutal. One arm is longer than the
    other by several inches, the fingers tapering into delicate, multi-jointed digits
    that move with unnerving precision. Pale fungal growths cluster along its scalp
    like a crown, pulsing faintly with bioluminescence. Its eyes are the same milky
    grey as its kin, but there is something behind them -- a calculating awareness
    that the warriors lack. Clay pots of dried herbs and bundles of cave-grown
    medicinals hang from its harness. When it speaks, its voice is a hoarse whisper,
    halting but deliberate.
