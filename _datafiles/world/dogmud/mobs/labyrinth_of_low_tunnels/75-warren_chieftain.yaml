character:
  name: warren chieftain
  description: |
    The largest of the warren dwellers, though still a head shorter than
    a grown human. The chieftain's mutations are pronounced and old -- calcified
    plates cover its torso like natural armor, and its hands end in thick, blunt
    claws worn smooth from decades of use. Its face retains more humanity than any
    of its kin. The bone structure is recognizably human beneath the ridged brow and
    elongated jaw. Its milky eyes carry a weight that has nothing to do with the
    Chrysalis -- the weight of someone who remembers that their people were once
    something else. Polished stones decorate the harness across its chest.
