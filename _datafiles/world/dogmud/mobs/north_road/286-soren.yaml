character:
  name: Soren
  description: |
    The camp's leader, recognizable by bearing rather than
    insignia. A man in his late thirties with a soldier's
    posture that civilian life has not fully erased. His face
    is lean, scarred along the jaw, and his eyes carry the
    patient calculation of someone who plans three moves ahead.
    A battered ironbound buckler rests within arm's reach at
    all times. He does not look like a common bandit. He looks
    like someone who ended up here by a road that started
    somewhere more respectable.
