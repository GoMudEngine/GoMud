activitylevel: 9
character:
  name: A Wall-Camp Refugee
  description: |
    One of dozens pressed against the wall-camp at the gate approach,
    waiting on a way into the city that may never come. She tends a
    clay pot that is mostly water, keeps herself and a small bundle
    close, and watches the gate with the patience of someone who has
    been doing this longer than she planned. The backs of her hands
    and the skin at her throat have gone faintly translucent in
    patches -- a Chrysalis touch still spreading, the fine-branching
    blue of her veins visible beneath the surface like ink pressed
    behind paper. It has not helped her case at the gate-watch
    inspections. She does not speak of it unless she has to.
