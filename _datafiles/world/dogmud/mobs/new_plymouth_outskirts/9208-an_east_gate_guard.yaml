character:
  name: An East Gate Guard
  description: |
    A guard in the bloodline livery of New Plymouth -- dark tabard
    with a woven-thread sigil at the chest -- standing at the East
    Gate with the practiced immobility of someone who has done this
    shift enough times to stop pretending it is interesting. The
    halberd looks well-maintained. So does the expression of absolute
    boredom. He checks papers with the thoroughness of someone who
    has been fined for not doing so, not because he thinks you look
    suspicious. The Chrysalis has touched him mildly: the skin along
    his jaw and brow carries a faint subdermal ridging, a shallow
    armoring under the surface that gives his face a permanently
    stern cast he has long since stopped noticing. Bloodline-livery
    guards run thick with that particular drift.
