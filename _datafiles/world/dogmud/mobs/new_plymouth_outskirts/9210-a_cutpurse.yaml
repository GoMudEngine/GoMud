character:
  name: A Cutpurse
  description: |
    A slight figure moving through the gate-queue with the unhurried
    ease of someone waiting for a friend. The clothes are nondescript
    -- worn but clean, the colours of dust and shadow. The eyes are
    sharp; they move in a rhythm that has nothing to do with looking
    for a friend. The Chrysalis has given this one unusually pale
    fingertips -- the skin at the pads thin enough that the tendons
    beneath are faintly visible, like cord seen through cheap cloth.
    The touch is nearly unfelt through leather or broadweave. Whether
    that particular drift preceded the profession or followed it is a
    question only they could answer, and they are not inclined to.
