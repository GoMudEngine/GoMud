character:
  name: A Market Hawker
  description: |
    A broad-shouldered man with a voice like a market-bell and a
    tray hung round his neck on a leather harness, loaded with
    goods of questionable provenance. He works the Outer Market
    without a licence plate on his board -- technically a code
    violation, but enforcement at the East Gate approach has been
    patchy since the new gate-captain took post. His most
    noticeable feature, after the voice, is his skin: when the
    sun catches him from the side, the surface of his face and
    hands takes on a faint iridescent shimmer, a Chrysalis drift
    that gives him the momentary look of someone lit from within.
    It is arresting in a crowd. He is aware of this and positions
    himself in the light accordingly. Most people who stop to
    stare end up buying something.
