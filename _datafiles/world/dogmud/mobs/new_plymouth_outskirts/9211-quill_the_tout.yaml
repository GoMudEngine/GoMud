character:
  name: Quill the Tout
  description: |
    A well-kept man in a coat slightly too good for the Outer Market,
    working the gate-queue with the ease of someone who has made
    every useful introduction in this district and several he
    should not have. He sells papers -- travel documents, guild
    certifications, letters of transit rendered in someone else's
    careful hand -- and occasionally information at a premium. The
    smile arrives half a second before he speaks and stays a beat
    after. His pupils are the tell, if you are paying attention:
    slightly ovoid rather than round, the irises ringed faintly in
    amber -- a Chrysalis drift that gives his gaze the quality of
    a lamp seen through smoked glass. People hold his eye a moment
    longer than they intend to. He finds this useful.
