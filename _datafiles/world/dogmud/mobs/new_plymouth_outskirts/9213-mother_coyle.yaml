activitylevel: 12
character:
  name: Mother Coyle
  description: |
    A stout, deliberate woman of somewhere between fifty and seventy,
    Coyle has kept the Broken Gate since the previous landlord drank
    himself out of it and she took the deed in lieu of a debt. She
    asks no questions about names, origins, or travel plans and
    enforces one rule -- no blood on the floor -- with the calm of
    someone who has had to back it before. She does not smile at
    customers unless they are regulars. The skin of her forearms and
    the backs of her hands has hardened over the years to a faint
    pearl-grey, smooth and slightly cooler than flesh should be; she
    wraps them in winter without offering any explanation. It is a
    Chrysalis mark old enough that she has stopped counting the
    seasons since it settled.
