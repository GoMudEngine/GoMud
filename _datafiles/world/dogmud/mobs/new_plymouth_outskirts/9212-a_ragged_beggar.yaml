character:
  name: A Ragged Beggar
  description: |
    A small figure sitting against the stone of the gate apron with
    a cracked ceramic bowl in both hands. The crowd flows past
    without looking. Sometimes the bowl comes back with a coin in
    it. Often it does not. She wears what she owns, which is not
    much, and has the compressed stillness of someone who has been
    conserving everything for a long time. The Chrysalis has been
    unkind in the minor way it sometimes is: her hair has gone
    entirely silver -- not gradually, not with age, but all at
    once, replaced by a fine colourless fuzz that catches the light
    like frost on wire. It is the kind of mutation that costs
    nothing in function and everything in how strangers look at you.
    Most do not look at her at all.
