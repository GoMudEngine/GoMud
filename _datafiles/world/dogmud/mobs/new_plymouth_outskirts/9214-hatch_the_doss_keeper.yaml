character:
  name: Hatch the Doss-Keeper
  description: |
    A slab-built man with a shaved head gone grey at the temples and
    the hard-set expression of someone who has heard every story and
    stopped believing most of them. Hatch keeps the gate-apron
    doss-house, where a copper buys a length of rope to lean against
    for the night and no names are given or asked. He collects coins,
    assigns rope-lengths, and maintains order with the minimum force
    of someone who understands leverage. The fine white hairs on his
    forearms and the backs of his hands stand permanently upright --
    a Chrysalis drift that has given him an animal awareness of air
    movement and the small shifts that mean someone is moving in the
    dark. He knows when a sleeper turns over four beds away and says
    nothing about how he knows.
