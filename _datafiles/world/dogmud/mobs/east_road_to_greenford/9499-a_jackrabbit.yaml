character:
  name: A Jackrabbit
  description: |
    An improbably large-eared rabbit of the plateau verge, built
    for speed over flat open ground in a way that makes it look
    slightly wrong -- the ears too long, the hind legs too big,
    the whole animal coiled as if always about to leave. Its fur
    is pale dust-grey on top and white underneath, good camouflage
    in the dry season stubble. Its Chrysalis-mark is a narrow stripe
    of vivid rust-orange along each ear's inner edge, visible only
    when the ears are raised -- which is most of the time.
