character:
  name: A Well-Woman
  description: |
    A narrow woman with capable arms and a long braid tied back
    from work, managing the hamlet well with the brisk efficiency
    of someone who has been keeping water moving since before most
    of the hamlet was built. She checks the rope daily, knows the
    water table by the sound the bucket makes when it hits, and
    has strong opinions on who uses the well properly and who
    does not. Her Chrysalis-change is in her fingertips: the whorls
    there press a faint blue-grey pigment into anything she touches,
    like charcoal-stained fingerprints that appear and fade over
    the course of a day. She has made her peace with always leaving
    traces of herself behind.
