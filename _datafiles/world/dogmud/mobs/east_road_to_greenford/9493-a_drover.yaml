character:
  name: A Drover
  description: |
    A broad-backed man in a leather hat, road-dusty to the elbows,
    with the patient squint of someone who has spent years walking
    behind animals slower than he is. He is resting his stock on
    the verge before the next push east toward Greenford, and he
    has the look of a man who disapproves of everything, mildly and
    without malice. His Chrysalis-change added an extra knuckle to
    each finger of his right hand, giving those digits an odd jointed
    length that he uses, apparently without thinking, to grip a lead
    rope with unusual steadiness.
