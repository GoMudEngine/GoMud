character:
  name: A Basking Snake
  description: |
    A thick-bodied serpent of the plateau dry-country, a metre
    and a half in length, coiled on a warm flat stone at the
    road's edge in full afternoon heat with an air of complete
    contentment. Its scales are warm umber mottled with darker
    bands that break up its outline against the stone almost
    perfectly. Its Chrysalis-mark is a double row of pale scales
    along its spine, each faintly iridescent in shifting blue-green,
    like a seam of inlaid turquoise running from neck to tail-tip.
    It is not aggressive if left alone and extremely fast if not.
