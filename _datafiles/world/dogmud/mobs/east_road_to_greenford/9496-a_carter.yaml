character:
  name: A Carter
  description: |
    A stocky man with a cart parked across the verge, one wheel
    recently repaired and newly grease-packed, taking a rest at
    the milepost before the next push east. He has the settled
    quality of someone who has been making this route long enough
    that it stopped being interesting and became simply what he
    does. His Chrysalis-change is in his eyes: a secondary
    translucent eyelid, thin as membrane, that slides across each
    eye when he blinks into the road dust -- he uses it without
    thinking, and it gives each blink a faint double-shutter
    quality that strangers find unsettling until they realize what
    it is.
