character:
  name: A Greenford-Bound Scholar
  description: |
    A young woman in travelling clothes that were well-made before
    the road got to them, carrying a satchel visibly heavier than
    she planned for and wearing the expression of someone who
    expected the east road to be more scenic and has revised her
    opinion. She is headed for Greenford and the university there.
    Her Chrysalis-change manifests as faintly luminous freckles
    across both forearms -- tiny cold sparks, visible in shadow and
    invisible in direct sun, that she uses as a reading light on
    late evenings rather than burn a candle.
