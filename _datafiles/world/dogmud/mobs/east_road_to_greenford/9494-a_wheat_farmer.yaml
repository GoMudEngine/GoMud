character:
  name: A Wheat Farmer
  description: |
    A weathered woman in a wide-brimmed hat, standing in the wheat
    row with the patient stillness of someone who has been reading
    the same field for twenty years and does not like what it is
    saying this season. Her boots are cracked at the toe seam and
    she has either not noticed or does not mind. Her Chrysalis-change
    settled across her left shoulder and the side of her neck: a
    patch of bark-textured skin, smooth as birch rind, cool to the
    touch where field-bare skin meets it. She wears her collar open
    and does not hide it.
