character:
  name: A Wheeling Hawk
  description: |
    A broad-winged hawk drifting in wide circles above the plateau
    wheat, riding the heat thermals that rise off bare stone at the
    field edges without apparent effort. Its underside is pale tawny
    barred with brown, and when it banks against the sun the light
    catches a faint iridescent shimmer along its primary feathers --
    a Chrysalis-mark common to the hawks of this plateau, giving
    each feather tip a metallic edge like hammered copper. It watches
    the rows below with absolute concentration that the wheat farmer
    finds flattering until she remembers it is not interested in
    the wheat.
