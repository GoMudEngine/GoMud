character:
  name: crop pest
  description: |
    A fat-bodied rodent the size of a cat, with coarse brown fur and
    oversized front teeth stained orange from root-chewing. Its claws are
    built for digging, and it moves in quick, nervous bursts between the
    mounds of earth that mark its burrows. The crop pest is aggressive when
    cornered but would rather flee -- it is a destroyer of fields, not a
    fighter. The damage it does is cumulative and relentless, one root system
    at a time.
