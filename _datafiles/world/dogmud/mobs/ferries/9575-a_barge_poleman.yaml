idlecommands:
  - 'emote leans hard into the pole, walks it down the deck, and
    hauls it dripping back to the bow for another push.'
  - ''
  - 'say Current is lazy today. Good day for it. Bad day is when
    the river fights you the whole way down.'
  - ''
  - 'emote wipes river mud from his hands onto an already-filthy
    rag and tucks it back through his belt.'
  - ''
  - 'emote checks the pole for cracks along the grain, finds none,
