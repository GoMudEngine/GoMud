character:
  name: A Barge Poleman
  description: |
    A Barge Poleman spends the crossing in a slow, repeating labor,
    setting his pole against the riverbed and walking the deck to
    drive the Heron along. His forearms are corded from the work and
    his boots are permanently damp. He talks in short bursts between
    pushes and falls silent the moment the pole goes back in the
    water.
