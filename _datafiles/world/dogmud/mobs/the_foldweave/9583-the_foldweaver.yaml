  description: |
    The maker of the whole overlong warren -- a spider grown past any
    natural measure, its body broad as a cart and slung low on legs that
    reach clear across the court to the converging cables it rules. Its
    carapace is a dull ancient grey, scarred and layered like the oldest
    silk of the nest-heart, and set across the front of it a bank of
    black eyes takes in the long approach it has watched a thousand times
    before. It has spun for longer than the stone remembers, and in the
    spinning it has learned to fold the space it spins -- so that the
    warren above is one road doubled and doubled into a labyrinth, and
    the court beneath it is only ever an arm's reach wide when it decides
    to close. It does not flee and it does not yield. It has folded the
    whole world down to this floor, and it means to keep you on it.
