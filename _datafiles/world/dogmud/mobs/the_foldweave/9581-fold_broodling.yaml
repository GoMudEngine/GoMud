  description: |
    A half-grown weaver, big as two fists and already carrying the trick
    of the place in its legs -- it spins as it moves, laying a fine trail
    of silk that folds the ground behind it so that a thing it has passed
    finds the way back longer than the way in. Its carapace is banded
    pale and dark, still soft at the joints, and a faint sweetness comes
    off it, the same cold sweetness that hangs over the whole warren. It
    is old enough to hunt and young enough to be reckless about it, and
    it has begun, in a small way, to fold the space around a fight.
