character:
  name: Father Thane
  description: |
    Father Thane manages the Keeper's House intake register with
    the particular precision of someone who knows that orderly
    records are what keeps a house like this from becoming chaos.
    He is a man of middle years with a deliberate, unhurried way
    about him that many visitors mistake at first for coldness —
    until he speaks. His Bloom-change is in the voice — it does
    not compel, does not command, but something in the register
    of it reaches into the anxious part of a person and quiets it.
    Grieving keepers leave his desk calmer than they arrived. New
    arrivals stop fidgeting before they finish their first sentence.
    He uses this without drawing attention to it, the way a man
    uses a tool he has carried long enough to stop noticing.
