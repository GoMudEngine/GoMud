activitylevel: 10
character:
  name: Novice Ept
  description: |
    Novice Ept is young enough that the temple still shows in his
    posture — a faint institutional straightness that has not yet
    softened into genuine ease. He has been a novice for two years
    and has not, in that time, resolved the problem the training
    set for him. His Bloom-change is of the visual kind — he sees
    an old eight-pointed orbital symbol embedded in surfaces he
    looks at long enough. Stonework, wood grain, shadows across a
    plastered wall — the same arrangement of arcs and points, in
    an old style he cannot find in any of the temple's approved
    texts. He is aware that this is not entirely comfortable and
    has stopped mentioning it to the senior keepers, who tell him
    it is not real. He has not stopped seeing it.
