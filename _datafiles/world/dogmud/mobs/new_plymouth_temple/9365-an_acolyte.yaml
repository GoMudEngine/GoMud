character:
  name: An Acolyte
  description: |
    The acolyte is young enough that the incense smoke has taken
    permanent residence in the skin around their eyes — a grey-lavender
    stain of long devotional exposure that gives them a perpetually
    half-dreaming look that is not entirely misleading. They tend the
    censers with the focused attention of someone for whom this task
    is both assigned duty and genuine practice, and they do not rush
    the work or neglect any step of it. The smoke-smell follows them
    out of the court and back into the rest of the precinct.
