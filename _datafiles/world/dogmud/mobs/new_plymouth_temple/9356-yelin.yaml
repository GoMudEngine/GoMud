character:
  name: Yelin
  description: |
    Yelin has been the warden of the Keeper's House for nineteen
    years — longer than most of the keepers he has received have
    been practicing their calling. He is a quietly broad man in
    late middle age, unobtrusive in the way that durable furniture
    is unobtrusive — present, well-placed, doing exactly what it
    was built to do. His Bloom-change came to his hands, which are
    worn smooth at the palms and knuckles the way old prayer-stones
    are worn smooth — not by violence but by long and repeated
    contact with the world. He moves through the hall with the
    settled patience of a man who stopped needing to think about
    where he was going and why a very long time ago. He receives
    visitors, remembers names, and keeps the house in good order.
    He finds this work entirely sufficient.
