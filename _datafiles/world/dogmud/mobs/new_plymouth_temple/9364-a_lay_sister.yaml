character:
  name: A Lay Sister
  description: |
    The lay sister works the almonry in a plain grey robe whose hem
    she has mended twice with thread she keeps in her right-hand
    pocket. She moves behind the distribution counter with the
    efficiency of someone who has learned that briskness and warmth
    are not in opposition — she does not slow to be kind, she is kind
    while moving. Every person who comes to the counter gets both the
    packet and a word spoken directly to them. She does not keep note
    of whether they return tomorrow.
