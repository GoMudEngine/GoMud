character:
  name: Canon Merid
  description: |
    Canon Merid occupies his cell near the Archive entrance with
    the unhurried quality of a man for whom serenity is not a
    practice but a settled fact. He is the senior canon of the
    temple — he grants blessings, oversees the Archive's public
    collection, and mediates between the keepers and the city's
    civil administration. His Bloom-change is subtle and constant
    — a faint luminous quality, barely perceptible, that rings him
    most clearly at dawn and at the end of evening prayer, as
    though the light of those hours remains on him a moment longer
    than it does on everything else. He does not discuss it. He is
    a careful, gracious man who speaks precisely and commits to
    nothing he does not mean to commit to.
