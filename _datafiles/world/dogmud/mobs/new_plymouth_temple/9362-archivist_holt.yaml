character:
  name: Archivist Holt
  description: |
    Archivist Holt stands at the entrance to the Restricted
    Collection with the precise stillness of a man for whom
    standing at an entrance is not a passive activity. He is
    thin, exact, and says very little that does not advance his
    function. His Bloom-change is in the eyes — pale and faintly
    luminous, moving across a room in a quick lateral sweep that
    takes in and catalogs what it finds before most people have
    finished their first look. He knows what is in the Archive
    to the last volume and the last shelf. He answers to two
    offices and will not tell you which two, except in the most
    technical administrative terms, and those terms will not help
    you. The door behind him does not open.
