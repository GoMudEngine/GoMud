character:
  name: A Beggar at the Gate
  description: |
    The beggar at the gate has occupied the alms-bench beside the
    precinct arch long enough that the city and the temple have both
    arrived at an unspoken understanding that this is their position.
    They know every face that regularly crosses the plaza — the market-
    morning pace versus the grief-pace, the returning pilgrim versus
    the first-time arrival — without having been told any of it. What
    they have asked of the world in exchange for keeping this threshold
    is not disclosed. They are patient in the way of someone who has
    stopped counting what patience costs.
