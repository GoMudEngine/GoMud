character:
  name: Scholar Dross
  description: |
    Scholar Dross paces the temple courtyard with the restless
    energy of a man who has worked something out that nobody else
    will admit is worked out. He is a visiting scholar attached to
    the temple by a research grant he uses primarily to argue with
    the senior keepers about the age of the eastern inscription.
    His Bloom-change is the most immediately visible thing about
    him — the cranium has enlarged in the way of extreme intellectual
    elaboration, veined at his brow and forehead, expanding the
    skull in a way that most people notice before they notice
    anything else. He finds this either useful or irrelevant
    depending on whether it has given him a better argument, which
    it usually has. He is loud, precise, and largely ignored by
    everyone with a formal position in the temple, which does not
    slow him down.
