character:
  name: A Pilgrim
  description: |
    The pilgrim arrived this morning after a journey counted in blisters
    rather than miles, carrying their purpose with the inward attention
    of someone who made a decision weeks ago and has been living toward
    it since. Their clothing is road-worn at the hem and around the
    pack-strap line. They move through the temple precinct with the
    careful presence of someone doing something that matters without
    performing that it does — a distinction the precinct's practiced
    inhabitants tend to notice. They will be gone by tomorrow.
