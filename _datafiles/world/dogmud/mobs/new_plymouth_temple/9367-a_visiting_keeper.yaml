character:
  name: A Visiting Keeper
  description: |
    The visiting keeper arrived from a smaller shrine some distance
    from the city, carrying a sealed document case and the travel-worn
    quality of someone who does not regard journeys as events. They
    are lodged in one of the upstairs cells and have taken a numbered
    coat from the rack in the hall below. They speak when spoken to
    and not otherwise, and what they do speak is accurate and unhurried.
    They are here on the business of their own shrine's administration
    and the nature of that business is not theirs to share.
