activitylevel: 12
character:
  name: Marda
  description: |
    Marda runs the cook-stall at the near end of Cookshop Row with
    the brisk assurance of someone who has made the same three meals
    extremely well for a very long time and sees no reason to change
    any of them. She is a solid woman in her middle years, flour on
    her forearms and a permanent redness at the collar from cooking
    over an open fire in all weathers. Her Chrysalis-change is the
    practical kind — her hands do not burn. Full stop. She can lift
    an iron lid from a full boil, press a palm to a searing grill to
    check the heat, wrap a flatbread straight from the clay oven
    without flinching, all of it without gloves or pads or any
    intermediary. She is warm with paying customers and not unkind
    to those who are not, though she does not extend credit. Her
    brother Halvard works a forge across in the Crafting Quarter,
    which she considers a fine thing for him and a reason she had
    better keep the cookshop going, since someone has to eat sensibly.
