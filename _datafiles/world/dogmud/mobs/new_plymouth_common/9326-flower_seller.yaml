character:
  name: Flower Seller
  description: |
    The flower seller has occupied the same spot at the outer rim of
    Carter's Rise long enough that other vendors give her the corner
    without discussion. She is unremarkable in appearance — a working
    woman with a stained apron and ink-callused fingertips from tying
    stem-bundles all day — except that the cut flowers she sells hold
    their color longer than cut flowers have any right to. A stem
    bought from her stall will be crisp and bright the next morning
    and often the morning after that. She does not advertise this.
    Customers notice and come back. She sells out before midday
    regardless.
