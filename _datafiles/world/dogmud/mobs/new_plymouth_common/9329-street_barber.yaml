activitylevel: 10
character:
  name: Street Barber
  description: |
    The barber of Tinker's Lane has set his stool in the widest part
    of the way where the light holds longest and works through customers
    from midmorning to dusk without visible hurry. He is a lean man
    with quiet hands — the specific quiet of hands that have learned
    to be still against their inclination, and are now still absolutely.
    His Chrysalis-change shows only in the work — his hands do not
    tremble under any circumstances. Not the rattle of a passing cart,
    not the lurch of a customer flinching at a shout, not cold nor
    noise nor the near-miss of someone brushing his arm mid-cut. A
    customer in the chair is safer than they would be anywhere else,
    by a margin too fine to name and too real to doubt.
