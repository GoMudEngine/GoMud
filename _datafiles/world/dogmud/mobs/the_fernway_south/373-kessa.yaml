character:
  name: Kessa
  description: |
    A wiry forester woman in her thirties, dressed in oiled
    leathers gone soft with use over a long-sleeved linen
    shirt. Her hair is tied back in a practical braid; pine
    needles cling here and there to the cuffs of her
    trousers. A leather satchel rides at her hip, marked
    with the faint dark stains of a season's foraging. She
    moves through the forest with the unobtrusive
    economy of someone who does not need to think about
    where she is putting her feet.
