character:
  name: Pell
  description: |
    Pell is a packman, one of the road's small wandering traders, bent
    cheerfully under a frame hung with tin goods, ribbon, pins, and the
    hundred little things a valley too far from town runs short of. He walks
    the South Road end to end and back, north today, south tomorrow, never
    still for long. His Blooming is in his throat: he has grown a second set
    of cords, and his voice comes doubled, a low drone humming always under
    the higher line of his speech, so that he seems to harmonise with himself.
    He has learned to use it -- a hawker's call from Pell carries twice as far
    and twice as sweet -- and he is forever a little pleased about it, the way
    a man is pleased with a tool that turned out better than he paid for.
