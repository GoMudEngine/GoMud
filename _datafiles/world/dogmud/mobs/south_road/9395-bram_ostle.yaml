character:
  name: Bram Ostle
  description: |
    Bram keeps the Lake and Ladle, the last good roof before the road tips
    down into the valley proper, and he keeps it the way a careful man keeps
    a boat -- everything stowed, everything to hand. He is round through the
    middle and easy in the face, with the publican's gift of making a
    stranger feel expected. The skin of his hands and forearms has taken on
    a faint pebbled sheen, and water will not wet it: pour a cup over his
    knuckles and it beads and runs straight off, leaving him dry. It makes
    him the envy of every washer in the dale and saves his sleeves besides.
    He hears every rumour that comes up or down the road and forgets none of
    them, though he will only share the ones he judges you can be trusted with.
