character:
  name: Guide Ferrol
  description: |
    Guide Ferrol is New Plymouth's official tour interpreter, which
    means he knows the founding history forward and backward and
    has delivered it so many times that the phrasing has become
    indistinguishable from memory. He is polished and confident in
    the particular way of someone whose confidence has been built
    around a fixed text — certain within its borders, armored by
    the repetition. His Chrysalis-change is a smile: it sits
    at the lower half of his face at what appears to be all times,
    the muscles around his mouth settled into a practiced openness
    that has become structural. The eyes above it are watching you
    evaluate the gap between what his face offers and what his eyes
    do, and the eyes have noticed that you noticed, and the smile
    does not change. He will tell you the founding story with
    genuine pleasure. He will steer you away from the gallery's
    older panels with the same genuine pleasure. The script is
    the script, and Ferrol is very good at the script.
