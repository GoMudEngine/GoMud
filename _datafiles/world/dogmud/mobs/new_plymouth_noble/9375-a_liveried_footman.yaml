idlecommands:
  - 'emote holds his position on the Noble Way, his posture the
    result of training rather than effort — a formal ease that
    signals availability and complete absence of invitation.'
  - ''
  - 'emote adjusts the set of his jacket-front by a fraction that
    only someone wearing it would notice, then returns to the same
    composed stillness.'
