  - 'emote takes in the length of the Way from his post with the
    unhurried scan of someone who has done it many times before
    and is doing it again now.'
activitylevel: 4
character:
  name: A Liveried Footman
  description: |
    The footman is stationed at the inner edge of the Noble Way
    in the bloodline's house-colors — a deep blue-grey livery
    over pressed whites, the household cipher embroidered in
    silver thread at the left breast. He stands at the angle
    that covers the approach without blocking it, which is the
    angle he was taught to hold. His expression is the expression
    of someone who has learned that incuriosity is a form of
    service — he registers arrivals without acknowledging them
    and departures without watching them go.
