activitylevel: 5
character:
  name: Porter Skell
  description: |
    Porter Skell occupies the gatehouse recess in the liveried
    house-colors of the estate block, and the recess might have
    been built for him specifically — he fits it so completely that
    the architecture seems like an extension of his person rather
    than the other way around. He is broad and patient, and he has
    the Chrysalis-change in his stance rather than his skin — a
    density to the way he stands that is not quite natural, as if
    his bones have made some private arrangement with the ground
    beneath them. You would not move him unless he chose to move.
    He is aware of this quality and finds nothing remarkable about
    it. He will tell you that the lane is for residents only in a
    tone that communicates the finality of natural law rather than
    human decision. He is not threatening about this. He is simply
    immovable, which is a different and in some ways more
    discouraging quality.
