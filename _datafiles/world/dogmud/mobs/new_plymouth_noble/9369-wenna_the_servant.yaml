character:
  name: Wenna the Servant
  description: |
    Wenna the Servant works a long day in the Noble Quarter and
    sleeps in a garret that is hers in the same way that the
    borrowed blanket on the bed is hers — provisionally, at
    someone else's sufferance. She is young and slight and carries
    herself with the particular smallness of someone who has
    learned that being unnoticed is a form of safety. The
    Chrysalis-change came to her gently, as far as such things
    go — a faint luminescence, a cold-light quality that surfaces
    at the skin when she is startled badly. Not painful, just
    visible. She has no way to suppress it and has instead
    become very good at not being startled, which in the Noble
    Quarter requires considerable skill. Ask her the wrong kind
    of question and the light shows anyway — a flinch you can
    see from across a room, soft and involuntary, gone in a moment
    but not before you have seen it.
