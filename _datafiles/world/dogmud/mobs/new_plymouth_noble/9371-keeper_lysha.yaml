activitylevel: 7
character:
  name: Keeper Lysha
  description: |
    Keeper Lysha manages the gallery with a particular kind of
    attention — not the attention of a custodian moving dust from
    place to place, but the attention of someone reading a very
    long text very slowly, unwilling to skip the difficult parts.
    She is quiet and deliberate, with the careful quality of
    someone who has learned that what she sees in the older
    paintings is not what the gallery's official purpose asks
    her to see, and has decided to keep seeing it anyway. Her
    Chrysalis-change came on as a sharpening of color perception
    beyond the range of ordinary human sight — she reads pigment
    the way a trained appraiser reads metal, seeing age, origin,
    and the specific hand of a particular period in the saturation
    of a color or the way a varnish has crazed at the edges. In
    the gallery, this makes her extraordinarily good at her work.
    It also means the older paintings between the bloodline
    portraits have told her things she has not been asked to report.
    She is careful about this. She is careful about most things
    that touch the circle she privately holds to.
