character:
  name: A Watched Servant
  description: |
    The servant moves through the service court with the
    practiced efficiency of someone whose value lies in being
    useful before being noticed. She carries the posture of
    downcast attention — eyes at platform level, never at face
    level, a trained arrangement of the body that signals
    neither threat nor idleness. Her clothes are the estate's
    standard-issue grey, clean and pressed. Whatever she is
    going toward, she is going toward it quickly enough that
    she will not be available to speak.
