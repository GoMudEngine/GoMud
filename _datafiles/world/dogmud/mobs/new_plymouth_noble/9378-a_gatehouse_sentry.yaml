character:
  name: A Gatehouse Sentry
  description: |
    The sentry holds the Walk at one of the worn patrol posts,
    his posture the particular stillness of long practice rather
    than discomfort — parade-correct in the bloodline's formal
    ceremonial dress, distinguished from work-dress by silver
    thread at the collar and the polished plate at his breast.
