character:
  name: Steward Caldwin
  description: |
    Steward Caldwin runs the bloodline's city-facing administration
    from behind the long worktable, and the worktable fits him the
    way a post fits a man who selected it himself. He is precise
    and thin, dressed in dark plain cloth with no ornament beyond
    the wax seal on his signet ring, and he carries the quality of
    composure that has been maintained so long it reads as character
    rather than effort. His skin is unmarked. His eyes are ordinary.
    His hands are the hands of someone who has spent twenty years
    moving paper rather than anything heavier. In the Noble Quarter,
    where the Chrysalis has touched nearly every long-term resident
    in some visible way, Caldwin's completeness is itself a thing
    worth noting — a body that arrived before the Bloom and was
    apparently not invited to change. He takes a certain pride in
    this, if pride is the right word for something he wears the way
    he wears the dark cloth — correctly, without explanation. He
    gives you the sense that every question has been heard before
    and that the answers are already sorted into what you will be
    told and what you will not.
