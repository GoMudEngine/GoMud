character:
  name: A Noble Passer-by
  description: |
    The passer-by moves through the Noble Garden at the pace of
    someone for whom arriving on time is a matter of choosing
    when the appointment is. Her coat is good silk with a
    raised-thread pattern at the cuffs — the kind of fabric
    that communicates wealth to those who know fabric. She does
    not look at the garden's plantings, having seen them many
    times, and she does not look at you, for similar reasons.
    The faint quality of disdain she carries is not personal.
    It is categorical.
