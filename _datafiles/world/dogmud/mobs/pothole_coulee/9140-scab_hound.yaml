character:
  name: Scab-Hound
  description: |
    A lean grey dog, ribs visible under a coat gone dull and rough at
    the edges, scarred across the muzzle and shoulder from fights it
    survived by being faster than what hit it. The scab-hound is not
    large enough to be frightening on its own -- that is precisely the
    point. It operates as one note in a chord, working the flanks while
    others press the center, circling wide to cut off retreat while the
    pack reads the target's attention and finds the moment no one is
    watching the edges. The eyes are pale amber and very calm. It has
    done this many times. It will keep circling until something gives,
    and it has learned that something always does.
