character:
  name: Bandit Captain
  description: |
    The captain holds the watch room at the top of the tower and has
    held it long enough that she has stopped thinking of it as theft and
    started thinking of it as administration. She is a tall, heavy-boned
    woman in layered traveling leathers, and she moves through the room
    with the settled authority of someone who has not had to prove a
    point in years because the last person who required proof did not
    recover well. The longsword at her hip is the only piece of her kit
    that is maintained to a professional standard -- the rest is
    practical and well-worn, the armor of someone who values function
    over impression. Her voice carries without effort and her orders
    arrive already settled rather than issued. She is not interested in
    your reasons for being here. She is interested in whether you are a
    problem, and she has already decided you are.
