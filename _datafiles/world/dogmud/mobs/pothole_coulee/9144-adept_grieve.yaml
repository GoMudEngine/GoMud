character:
  name: Adept Grieve
  description: |
    Grieve keeps the ruin the way a caretaker keeps a grave that still
    matters to someone. He is old in the way of people who decided long
    ago not to hurry: deliberate, unstartled, his voice pitched low enough
    that you lean in without meaning to. The observatory was a Folding-house
    once, where adepts read the thin places the way others read weather, and
    he is the last of them who stayed.
    His eyes do not quite agree on where to look. It is not a squint or a
    wandering eye -- it is a faint, constant disagreement, as though each
    eye tracks a slightly different version of the room and he has long
    since stopped trying to reconcile them. When he fixes on you, both
    settle at once, and the attention is total.
    He will teach the first turning of the mind to anyone who asks plainly.
    He does not pretend it is safe, and he does not pretend it is hard.
