character:
  name: Smith Rusk
  description: |
    Rusk runs the Coulee Smithy the way a chisel runs a seam -- without
    ceremony, following what the material gives. She is a broad, low-set
    woman with soot worked so deep into the lines of her hands that it
    reads as a second skin, and she moves between anvil and forge with
    the unhurried economy of someone who learned long ago that haste
    produces scrap. Her voice, when she uses it, comes out rasp-dry
    from years of smoke. From her left wrist to the crook of her elbow
    the skin has thickened and gone the grey-black of slag, as smooth
    and hard as cooled iron -- a slow change she marks by the fact that
    tongs no longer leave burns there. She does not explain it and does
    not seem to consider it worth explaining. She will teach you what
    she knows, but she will not hold your hand while she does it.
