character:
  name: Talus Lurker
  description: |
    The talus lurker is a patient thing, heavy-limbed and low-slung, built
    for the ambush rather than the chase. It is the size of a large dog but
    denser, its hide a mottled pattern of grey and brown that breaks its
    outline against the broken rock in a way that seems almost deliberate.
    It does not announce itself. It waits at the edge of a drop or behind
    the shadow of an overhang until something warm passes within range, and
    then it commits fully and without hesitation. Its jaws are wide and
    its neck is thick, and it has learned through generations of cave living
    that the best outcome comes from taking the target down fast and hard
    before anything else in the dark decides to come and see what the noise
    is about.
