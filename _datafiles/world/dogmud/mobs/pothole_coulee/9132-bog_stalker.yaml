character:
  name: Bog Stalker
  description: |
    Low and wide, built for ground the way a stone is built for ground --
    the bog stalker moves across the poison-swamp margin on thick-muscled
    legs set wide at the shoulder, belly near enough the mud that its
    passage leaves a shallow trough. The hide is a mottled green-brown
    under a crust of actual bog material: dead plant matter, mineral
    staining, the dried remains of things it has eaten worked into the
    crevices of the dorsal scale ridges. It is heavier than it looks and
    faster than anything that heavy should be over the first few body
    lengths. The eyes are amber and wide-set, calibrated for movement.
    It does not pursue, generally. It waits for the ground between you
    and safety to run out.
