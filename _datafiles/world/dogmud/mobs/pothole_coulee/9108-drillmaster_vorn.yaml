character:
  name: Drillmaster Vorn
  description: |
    Vorn runs the drill yard the way a whetstone runs a blade: without
    ceremony, without encouragement, and with exactly as much pressure as
    the steel requires. He is a compact, weathered man built along lines
    that suggest more scar tissue than fat, and he moves through the yard
    with a precision that has long since stopped being deliberate and
    become simply how he occupies space. His voice is low and carries
    further than it has any right to. The skin of his hands and forearms
    has gone the grey of old slate, hard and close-grained as river stone,
    so that the knuckles look carved rather than grown -- the kind of
    change that happens slow enough that the man himself hardly noticed
    until strangers started to. He does not explain the mutation, and no
    one who trains under him thinks to ask twice.
