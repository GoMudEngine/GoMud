character:
  name: Farmhand Bram
  description: |
    Bram does the heavy work of the farmstead and does not resent it --
    a broad, easy young man who measures a good day by what got done and
    sleeps the sleep of someone who earned it. He is friendly in the
    uncomplicated way of people who have never had much reason not to be.
    A second row of small blunt ridges runs down the back of his neck and
    along his spine, visible when he stoops to the work -- knobs of bone
    under the skin, even and deliberate as a row of seed. The Awakening
    left them. He says they ache before rain and are good for nothing
    else, and goes back to forking straw.
