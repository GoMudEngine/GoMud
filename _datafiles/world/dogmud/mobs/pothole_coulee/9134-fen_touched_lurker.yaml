character:
  name: Fen-Touched Lurker
  description: |
    Whatever this was before the poison swamp finished with it, the
    record has been thoroughly revised. The fen-touched lurker is wet
    in the way that things found at the bottom of still water are wet
    -- not wet from rain or crossing, but wet as a condition of being.
    The shape is animal but the proportions are not; the limbs are
    too numerous or too few depending on how you count them, and the
    way it carries its weight shifts mid-motion as though something
    inside is rearranging. The skin -- hide -- whatever the correct
    word is -- has gone the color of deep-water algae, a green so dark
    it reads as black in poor light. It does not bleed visibly. It
    guards the approach to the sunken hollow with a focused territorial
    attention that suggests something worth guarding waits beyond.
    It is fast. It is faster than it looks, and it already looks fast.
