  - ''
character:
  name: Mire Brute
  description: |
    Something that was once a troll has been in the mire long enough
    that the distinction is becoming academic. The mire brute stands
    a full head taller than a large man and twice as wide at the
    shoulders, caked in a continuous layer of swamp mud that has dried
    and cracked and been rewet so many times it has become structural --
    part of the body rather than a covering. Weed and root-tangles are
    woven through the matted hair. The eyes are small and set deep under
    a shelf of brow, but they track movement with an intelligence that
    is mostly focused and entirely hostile. It heals. Wounds that would
    end a fight close over as you watch, the bog-troll constitution
    pulling itself back together with the methodical stubbornness of
    something that has learned injury is temporary. Winning quickly is
    not optional so much as advisable.
