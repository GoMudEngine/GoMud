character:
  name: Elder Wenna
  description: |
    Wenna is the kind of old that has stopped counting and started
    keeping. She runs the outlying farmstead the way she has run it for
    forty years -- by knowing every soul under its roof and most of those
    beyond it, by remembering what was promised and what was owed, by
    being the still point the whole household turns around. She is small
    and unhurried and entirely unbothered by anything a stranger might
    think of her.
    Her eyes have gone the pale gold of dried grass, and they catch the
    low light the way an animal's do at dusk -- a flat bright shine that
    is gone when she turns her head. The Awakening did that, late in her
    life, and she treats it as she treats the weather: a thing that
    happened, neither boasted of nor hidden.
    She will talk to anyone who sits and listens, and she knows the old
    ways of the coulee better than the carved stones do.
