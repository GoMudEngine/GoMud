character:
  name: Fenwalker Falv
  description: |
    Falv lives on a raised hummock at the edge of the deep marsh and does
    not appear to consider this unusual. He is a rough, weathered man who
    moves through boggy ground with the low, unhurried confidence of
    someone who has stopped misjudging it. His camp is spare: a lean-to,
    a fire-ring ringed with flat stones, and a rack of ceramic firepots
    along the near edge that he checks the way another man might check a
    fence line. When something gets too close from the water side he lobs
    one. This is his primary social strategy. Across both hands the skin
    has gone faintly smooth and shed-proof, pale where it stretches over
    the knuckles, and it turns water cleanly the way oilskin does -- a
    change he has accommodated by never mentioning it. He knows the marsh
    better than he knows people and considers this an improvement.
