character:
  name: Herbalist Birna
  description: |
    Birna runs the drying-racks and the brewing corner with the patient
    economy of someone who has learned that rushing a reduction ruins the
    batch. She is a lean, quiet woman who smells of dried fennel and
    mineral pitch, and she has a habit of reading a plant before she
    touches it -- tilting her head, going still, as if listening to
    something beneath the smell. The backs of her hands and forearms carry
    a faint tracery of green-gold veining just under the skin, branching
    like pressed leaves, and the color brightens slightly when she cups
    a living cutting or runs a thumb along a fresh-pulled root. She does
    not comment on it. She will teach you what the marsh gives and what
    it withholds, and she will not pretend the work is simpler than it is.
