character:
  name: Survivor Ovell
  description: |
    Ovell has been in the rock for what feels like days and has stopped
    counting. He was a prospector working a claim in the lower drifts
    when the slope let go, and he is dug half-free now -- upper body
    clear, left leg still pinned somewhere beneath a beam and a yard of
    broken basalt. He is not panicking. He ran out of that some time
    ago and arrived somewhere quieter on the other side of it, a flat
    watchful calm that comes from having decided to survive and having
    no remaining doubt about the decision. His right eye has gone the
    pale silver-white of quartz crystal, cloudless and unmoving, and
    it does not track the same things his left eye does -- it seems to
    fix on the dark without effort, reading the rock. He does not
    mention it. He has other problems.
