character:
  name: Tunnel Brute
  description: |
    The tunnel brute fills this part of the mine the way a boulder fills
    a doorway -- it is not so much standing in the passage as occupying
    it. It is roughly humanoid in silhouette, heavily built through the
    chest and shoulders, with forelimbs that knuckle-walk when it lowers
    itself to charge. The knuckles themselves have hardened over time
    into dense, stone-grey callus -- the skin there has fused with a
    mineral deposit and become something harder than hide, leaving the
    striking surface of each hand as rough and dense as shaped basalt.
    It does not communicate in any recognizable way. It holds the tunnel
    because the tunnel is where it is, and it attacks because something
    has entered the tunnel, and those are the only two facts that appear
    to matter to it.
