character:
  name: Scarred Outrider
  description: |
    The outrider ranges the territory's edge alone, and has been doing
    it long enough that the coulee's geography is printed into its
    movement the way familiarity makes all motion more certain. It is
    large -- larger than the pack-hound, broad-shouldered and deep-
    chested, the muzzle gone grey with age but the body still carrying
    the easy readiness of a thing that has fought its way to the far
    edge of the pack hierarchy and intends to stay there. The scarring
    on this one is not random damage. It records specific decisions:
    a long diagonal across the flank from a blade, a notch out of the
    left ear, a ridge across the nose that healed wrong and gives the
    face a permanent slight asymmetry. The outrider does not merely
    patrol. It is the pack's early warning, its rallying voice, the
    mind that coordinates the hounds before the alpha is involved. When
    it vocalizes, the pack reshapes itself around the sound. Meeting it
    alone at the territory's edge means the pack already knows you are
    here.
