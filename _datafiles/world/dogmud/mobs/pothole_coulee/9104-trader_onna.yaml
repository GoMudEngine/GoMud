character:
  name: Trader Onna
  description: |
    Onna keeps Coulee Provisions, and she keeps it the way a good net keeps
    fish -- nothing gets past her that she means to hold. She is lean and
    quick-eyed, perched behind a counter she could work blind, and she sizes
    up a newcomer's purse and need in the time it takes them to clear the
    door. Her dealing is sharp but never crooked; she will tell you plainly
    what a thing is worth and why, and she remembers to the last copper what
    you bought off her the time before. Her skin has a way of taking the
    color and grain of whatever stands behind her -- the gray of the dry
    goods, the brown of the rafters, the pale ripple of reed-shadow -- so
    that a stranger glancing in sometimes misses her entirely until she
    speaks. She wears the shifting like she wears her apron, without remark,
    and uses it for nothing more sinister than a quiet laugh at folk who
    jump.
  speciesid: 1
  level: 1
  gold: 1000
  stats:
    perception:
      training: 7
    charisma:
      training: 6
    willpower:
      training: 4
