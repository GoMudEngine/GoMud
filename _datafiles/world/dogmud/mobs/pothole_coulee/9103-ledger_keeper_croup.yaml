character:
  name: Ledger-Keeper Croup
  description: |
    Croup keeps the Strongbox House and the great balanced book that runs
    it, and he does both with a dry, exact care that strangers mistake for
    coldness until they need him. He is spare and upright, economical with
    words and with motion, never setting a thing down where it does not
    belong nor an entry where it does not balance. His knuckles are capped
    in polished horn, smooth amber ridges that click faintly against quill
    and lockplate; he uses them to square a stack of coin or tap a tally
    without ever seeming to notice they are not ordinary hands. Behind the
    precision there is a kindness he would deny if asked -- he remembers
    which newcomer arrived with nothing, and the figures in his book quietly
    forgive more than they should. What you set in his keeping will be
    there, to the last coin, when you come back for it.
