character:
  name: Gardener Senna
  description: |
    Senna keeps the kitchen garden, and the garden keeps the farmstead --
    herbs and roots and the green things that turn a hard season
    survivable. She is quiet and quick-fingered and happiest with soil
    under her nails, and she talks to the plants more readily than to
    most people, without embarrassment.
    Where her bare skin touches the earth, faint green traceries spread
    beneath it like frost forming in reverse -- a brief delicate webbing
    up the backs of her hands that fades when she lifts them away. The
    Awakening gave her that, and her growing things have never been
    better for it. She does not question the bargain.
