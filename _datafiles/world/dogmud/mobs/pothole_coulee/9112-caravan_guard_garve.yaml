character:
  name: Caravan Guard Garve
  description: |
    Garve sits like a man who has done a careful accounting of what his
    body will and will not do right now, and has made his peace with the
    list. He is broad-shouldered and road-worn, built for the long work
    of keeping merchant wagons moving through difficult country, and the
    look he gives the bend in the wash is the look of a professional
    calculating odds rather than a frightened man flinching from them.
    His left arm is bound from wrist to elbow in strips of cloth
    darkened at the center -- a clean cut, going by the wrapping, but
    deep enough to take his sword arm out of the conversation for now.
    His eyes catch the light the way an animal's do at the edge of
    firelight, the irises briefly lambent before settling back to
    ordinary brown -- a small change, the kind that happens to some folk
    out on the open road, and one he has long stopped mentioning.
