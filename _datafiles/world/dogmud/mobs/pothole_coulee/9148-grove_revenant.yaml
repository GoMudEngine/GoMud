character:
  name: Grove Revenant
  description: |
    Something walked into the grove once and did not leave so much as stop
    leaving. The grove revenant keeps the shape of whatever it was -- a
    traveller, a forager, the proportions are human enough -- but the
    thinning has been working on it for a long time, and the edits show.
    It moves a half-beat out of time with itself, the body and its
    intentions never quite synchronised, so that watching it is like
    watching a reflection in disturbed water. Its face is turned away no
    matter where you stand. It guards the deep grove with a dull, looping
    persistence, as though it has been told to do this and can no longer
    remember by whom, and cannot stop.
