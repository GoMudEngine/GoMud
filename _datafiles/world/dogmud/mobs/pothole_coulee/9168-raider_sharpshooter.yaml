character:
  name: Raider Sharpshooter
  description: |
    The best bow in the band short of the bowmaster, posted to the high stands
    where the wind is tricky and the shots are long. A full-length hunting bow,
    a quiver kept deliberately full, and the long-sighted patience of someone
    who has made the canyon a killing field many times over. Where the lesser
    raiders sting and run on instinct, this one does it as craft -- reading
    the wind, choosing the ground, opening the distance exactly as fast as you
    try to close it. A real test of whether you have learned to fight a kiter
    instead of merely chasing one.
