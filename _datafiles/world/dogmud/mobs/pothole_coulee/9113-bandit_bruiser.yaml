character:
  name: Bandit Bruiser
  description: |
    The bruiser is wide -- not tall, but built out in a way that makes
    the corridor feel narrower when she is standing in it. Layers of hard
    muscle have settled under a thick pad of scar tissue, and the whole
    is wrapped in a coat of faded leather pieced together from at least
    three different original garments. The bone club she carries is
    old-fashioned and uncomplicated: heavy, dense, iron-banded at the
    striking end, and clearly maintained with more care than the rest of
    her kit combined. She does not look fast. She does not look like she
    needs to be.
