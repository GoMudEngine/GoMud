character:
  name: Bandit Scout
  description: |
    A wiry figure in travel-stained clothes that were chosen more for
    color than warmth -- dull browns and greys that read as shadow
    against the wash rock. The scout keeps low and moves in quick,
    birdlike shifts, always facing out, never putting its back to a
    drop. The short blade at the wrist is plain and well-used, edge
    kept up even if the rest of the kit is not. This one watches more
    than it fights, but it has learned that watching long enough
    usually leads to the same place.
