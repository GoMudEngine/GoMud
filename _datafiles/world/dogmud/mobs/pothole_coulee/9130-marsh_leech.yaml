character:
  name: Marsh Leech
  description: |
    A fat, glistening thing the length of a hand, the color of old bruise --
    purple-black along the dorsal ridge fading to a wet grey-pink at the
    belly. The marsh leech moves through the water in a slow wavelike
    contraction, blind and utterly certain, following warmth and the faint
    electrical trace of a living body the way water follows a crack. Its
    mouth is a circular rasp ringed with small recurved hooks, designed to
    hold as much as to bite. Alone it is more alarming than dangerous, a
    nuisance that leaves a weeping mark where it feeds. The reed beds of
    Pothole Coulee are not known for hosting only one.
