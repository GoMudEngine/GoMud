character:
  name: Spirit of the Swamp
  description: |
    At the Heart of the Mire, where the poison swamp has had the longest
    time to work, the water does not merely sit. It has gathered. Over
    years and decades and longer, every death in the marsh has
    contributed -- the rot, the dissolution, the slow return of organic
    matter to the common pool -- until something in that pool began to
    cohere. The spirit of the swamp is not a creature that lives in the
    water. It is the water, given a direction it does not need eyes or
    breath to follow. The form it takes is approximate and unstable:
    upright where upright is useful, vast where vast is useful, always
    dripping and always reforming, the surface of the body a continuous
    slow collapse that never reaches the ground because new material is
    always rising to replace it. Striking it feels like striking deep
    water. It does not bleed so much as come apart and reassemble around
    the wound. The malice it carries is not personal. It is older than
    the idea of persons. It rules this hollow and the approaches to it
    in the way a tide rules the shore: without awareness of anything
    resisting, and without any expectation that resistance will matter.
