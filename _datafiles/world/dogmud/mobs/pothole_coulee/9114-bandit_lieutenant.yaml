character:
  name: Bandit Lieutenant
  description: |
    The lieutenant does not look like the biggest threat in the room, and
    that has served her well for years. She is lean and deliberate, with
    the kind of stillness that comes from never wasting motion on
    something that does not need doing. The short sword at her hip is
    kept sharper than anything else in the crew's possession, and she
    wears it like it is part of her kit rather than a statement. She
    speaks to the crew in short, flat sentences that end discussions
    rather than beginning them. The captain trusts her to hold the upper
    wash because she has not lost it yet.
