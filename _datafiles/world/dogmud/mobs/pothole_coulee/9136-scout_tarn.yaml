character:
  name: Scout Tarn
  description: |
    Tarn is lean the way drought-wood is lean, stripped of anything the steppe
    does not require. His clothing is the grey-brown of the coulee soil itself,
    stitched in flat seams that catch no light. Sun and wind have worked his
    skin to the texture of cured leather, and old scar tissue traces a diagonal
    line across the left side of his jaw.
    His eyes are the detail that stops you. The irises have gone a deep,
    unbroken amber, the precise colour of a hawk's, and they do not track the
    way a person's eyes ordinarily track — they catch motion at the edge of
    sight before the motion has quite resolved into a shape. When he watches
    the open ground, he sees things there that you do not.
    He does not waste words.
