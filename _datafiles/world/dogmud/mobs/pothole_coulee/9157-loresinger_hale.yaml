character:
  name: Loresinger Hale
  description: |
    Hale keeps the stones the way Wenna keeps the farmstead -- by knowing
    them. He is the coulee folk's rememberer, the one who carries the
    carvings as song so the meaning survives even when the weather takes
    the marks. He is lean and weathered and patient past the point most
    people can follow, and he speaks the way he sings: slowly, leaving
    room around the words.
    When he sings the old lines his voice doubles faintly -- a second,
    lower tone running beneath the first, harmonizing with itself. The
    Awakening folded that into him, and he has made it part of the craft,
    so the songs come out of him already in two voices. It unsettles
    strangers. He no longer notices.
    Ask him about the stones, the folk, or the things the carvings half-
    remember, and he will give you as much as you have patience to take.
