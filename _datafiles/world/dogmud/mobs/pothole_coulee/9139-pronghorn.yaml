character:
  name: Pronghorn
  description: |
    A pronghorn of the high steppe, rust-and-cream against the pale rock, with
    hollow pronged horns and eyes set wide on the skull to catch movement in
    nearly a full circle. It stands very still when uncertain — not the frozen
    stillness of hiding, but the alert stillness of something already calculating
    its exit — and when it decides to go it goes fast, faster than anything
    that size has a right to be, in a smooth ground-eating stride that opens
    the distance between itself and a threat with quiet efficiency.
    The meat is good. Getting close enough to take a clean shot is the work.
