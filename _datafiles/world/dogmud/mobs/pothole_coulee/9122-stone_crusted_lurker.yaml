character:
  name: Stone-Crusted Lurker
  description: |
    This is a talus lurker that has been in the deep part of the mine
    longer than is normal for its kind, and the rock has begun to keep
    it. The hide across the shoulders, haunches, and the top of the wide
    skull has fused with the basalt deposit in the walls -- a slow
    accretion of mineral, dark grey and rough-textured, that has built up
    in overlapping plates thick enough to turn a blade. The creature is
    still recognizable as what it was, broadly -- the same low-slung
    build, the same wide ambush stance -- but it is heavier now, slower
    to start and harder to stop. The eyes have gone completely pale,
    white as quartz, and the ambient light of the drift does nothing to
    them. It finds its targets through vibration and heat. Something
    about the deepest part of the mine has agreed with it.
