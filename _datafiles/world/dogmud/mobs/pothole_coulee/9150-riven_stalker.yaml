character:
  name: Riven Stalker
  description: |
    Of all the things the thinning has made out here, the riven stalker is
    the one that hunts. Whatever animal it began as has been refolded past
    recognition: the limbs are too many and hinge the wrong way, the spine
    runs at an angle the eye keeps trying to correct, and it moves across
    the floating, fractured ground with a horrible sureness, as though the
    broken geometry of the scabland is the only place it has ever felt at
    home. It tracks by something other than sight -- it has no eyes that
    hold still long enough to be sure -- and it is patient, and it is fast,
    and it has learned that prey on this ground tends to fall through the
    gaps if you only wait.
