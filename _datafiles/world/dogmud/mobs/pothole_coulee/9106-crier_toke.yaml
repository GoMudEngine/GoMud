character:
  name: Crier Toke
  description: |
    Toke is the town's voice, and he comes by the work honestly, for he was
    born with twice the means to do it. He stands the square from first light
    to last, reading the notice-post, gathering the day's word off every
    traveler and gossip that crosses the slabs, and giving it all back louder
    than he got it. Below his proper mouth sits a second, set low at the
    throat, and it is the loud one -- it carries the call across the square
    while the upper mouth shapes the smaller talk, so that he can hail a
    newcomer and finish a sentence to someone else in the same breath. He
    means no harm and keeps no secrets worth keeping; ask him anything and he
    has likely already told three other people. He has news for you before
    you have thought to want it, and a grin for the asking.
