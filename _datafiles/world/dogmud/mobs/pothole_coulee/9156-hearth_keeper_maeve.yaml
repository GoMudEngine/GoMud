character:
  name: Hearth-Keeper Maeve
  description: |
    Maeve keeps the longhouse -- the fire, the food, the small daily
    accounts of who is owed and who is fed. She is brisk and warm in
    roughly equal measure, the sort who will press a bowl into your hands
    before she has decided whether she trusts you, and decide afterward.
    The fire holds no fear for her, because the Awakening took her sense
    of heat entirely. She banks the coals bare-handed, lifts pots off the
    flame without a cloth, tests the oven by reaching into it. The skin of
    her hands is unmarked -- whatever the change did, it did inward, and
    she has turned a frightening thing into simply the reason she is best
    suited to the hearth.
