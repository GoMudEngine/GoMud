character:
  name: Unbound Fold
  description: |
    Closer to the thinnest place, the folds stop being scenery and start
    being will. The unbound fold is a knot of the thinning that has
    gathered enough coherence to act on purpose -- a standing crease in the
    world, vaguely upright, its surface a slow churn of angles that refuse
    to resolve. It does not strike with limbs. It strikes with the place
    itself, folding the space between you until the harm arrives without
    anything seeming to cross the gap. It guards the approach to the
    Unfolded the way a lesser flame guards a greater one: not out of
    loyalty, but because it is made of the same thing, and is drawn to
    stand near it.
