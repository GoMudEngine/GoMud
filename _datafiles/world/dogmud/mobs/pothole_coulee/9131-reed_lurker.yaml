character:
  name: Reed Lurker
  description: |
    In still water, among reeds that move in the same slow rhythm, the
    reed lurker is invisible. The banded olive-and-black scales were made
    for this -- not evolved for it in any natural sense, but arrived at
    over many generations of the marsh selecting for the things that
    survived. It is long, heavier than it looks, and it strikes without
    any preliminary tension or warning posture that a person could learn
    to read. The strike is simply there, where no strike was a moment
    before. A pair of waterlogged boots on the bank nearby suggests that
    something that came through here before you did not finish the
    crossing, or at least not with both boots on. The water here is
    shallow enough to stand in. The reed lurker does not particularly care.
