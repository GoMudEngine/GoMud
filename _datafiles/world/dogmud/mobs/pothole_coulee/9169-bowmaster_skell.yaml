spawnmutations: [chameleon-skin, compound-eyes]
character:
  name: Bowmaster Skell
  description: |
    The man who holds the overlook, and through it the whole climb. Skell is
    long and spare, dressed in layered bluff-grey that breaks his outline
    against the stone, and he carries a tall, dark hunting bow as though it
    weighs nothing. He is the reason the bluff band can sit above the coulee
    and tax everything that moves through it: nothing reaches the top of the
    stair that he has not already had three clean shots at.
    He does not boast and he does not hurry. He fights the way the whole band
    aspires to and only he has mastered -- always moving, always at distance,
    trading the high ground stride by stride and making you pay in blood and
    breath for every yard you take back. To beat him you must do the thing the
    terraces have been teaching since the first straw butt: reach out across
    the gap and put a shot exactly where it has to go, before he opens the
    distance again.
