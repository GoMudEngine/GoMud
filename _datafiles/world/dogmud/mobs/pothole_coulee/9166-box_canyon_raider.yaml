character:
  name: Box Canyon Raider
  description: |
    A seasoned member of the bluff band, left to anchor the deep canyon where
    the slot narrows toward the climb. This is no skirmisher: a long, notched
    blade, a scarred leather harness, and the unhurried confidence of someone
    who has held this ground a while and buried the ones who tried to take it.
    He lets the slingers do the stinging out front; his job is to make sure
    nothing that gets past them reaches the overlook stair on its feet.
