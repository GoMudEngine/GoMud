character:
  name: Raider Slinger
  description: |
    A scrawny outrider from the band that holds the upper bluffs, posted low
    to pick off anything that wanders into the canyon. The sling is a length
    of plaited cord and a worn leather cradle, cheap and deadly in a practiced
    hand, and this one has clearly thrown a great many stones. He keeps to
    the ledges and the high ground, content to sting from a distance and slip
    away before anything can close -- a coward's craft, and an effective one.
