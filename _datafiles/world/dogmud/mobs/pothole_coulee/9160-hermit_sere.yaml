character:
  name: Hermit Sere
  description: |
    No one sent Sere to keep the old shrine. The hermit simply stayed,
    long enough ago that the farmstead folk speak of the shrine and the
    hermit as one thing. Sere tends a place older than the standing
    stones, older than the tradition Hale sings, and seems to feel the
    weight of that without being crushed by it -- the steady, worn calm
    of someone who has made peace with not understanding.
    The skin at Sere's temples has gone faintly translucent, the pale
    shape of the skull showing through like a lamp behind oiled paper.
    It is worst here, near the shrine; the folk say the thin old place
    works on whoever stays in it, and the hermit is what staying looks
    like. Sere does not mind being looked at. Sere has been looking at
    much stranger things.
    The hermit knows the shrine holds something it does not understand,
    and will point a patient seeker toward it without pretending to know
    what it is.
