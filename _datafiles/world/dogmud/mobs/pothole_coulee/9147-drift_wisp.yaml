character:
  name: Drift-Wisp
  description: |
    A loose handful of the grove that has come unstuck from itself. The
    drift-wisp is barely a body -- a smear of dim light and drifting motes,
    roughly person-high, that holds together out of habit rather than
    structure. Where the veil has thinned the most, small pieces of the
    world stop agreeing to stay put, and this is what that looks like once
    it has gathered enough of itself to move. It does not seem to want
    anything. It drifts toward warmth and movement the way smoke leans
    toward a draught, and where it touches, the skin goes briefly numb and
    strange, as if that part of you had also forgotten where it was meant
    to be.
