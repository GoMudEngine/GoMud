character:
  name: Bluff Marksman
  description: |
    One of the band's true shooters, holding the perches that ring the upper
    overlook. A compact crossbow, well kept and oiled, and a case of bolts
    worn at the hip where the hand finds it without looking. This one has
    learned the lesson the whole band lives by: never let the fight come to
    you. He shoots, steps back, shoots again, trading ground for distance,
    and counts on a closing enemy to tire and bleed before the gap ever
    closes. Pinning him means out-shooting him, or being quick enough to make
    the retreat cost more than it buys.
