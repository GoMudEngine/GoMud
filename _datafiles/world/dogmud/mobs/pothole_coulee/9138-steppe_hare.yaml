character:
  name: Steppe Hare
  description: |
    A dust-coloured hare of the open scabland, all outsized ears and coiled
    haunches, crouched against the pale ground in a stillness that it can
    abandon in an instant. The fur is a mottled grey-brown that reads as
    gravel from a dozen paces, and it holds that posture — rigid, listening
    — until the moment it decides the threat is too close. Then it is gone,
    a low streak of motion cutting hard angles across the rock until it
    vanishes into a fold of earth.
    Following one is the first lesson the steppe teaches about patience.
