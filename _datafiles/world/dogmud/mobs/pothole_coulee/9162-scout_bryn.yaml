character:
  name: Scout Bryn
  description: |
    Bryn keeps to the canyon the way some people keep to a doorway -- half in,
    half ready to be gone. He is wiry and weathered, dressed in the dust-grey
    of the bluffs, and he speaks low even when there is no one to overhear,
    because in the box canyon sound carries and he has learned to give it
    nothing.
    His mutation shows only when he turns his head sharply: for a held breath
    his outline blurs and doubles, as though a second Bryn a step behind is
    still catching up to the first. He has used it to live through more raider
    ambushes than he will admit. He watches the upper overlook with the flat,
    measuring patience of a man who has decided the band up there will have to
    be answered, and is only waiting on the right hand to do it.
