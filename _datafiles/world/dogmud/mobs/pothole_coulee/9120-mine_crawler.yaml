character:
  name: Mine Crawler
  description: |
    The mine crawler is a pallid, many-legged thing that has found the
    worked tunnels to its liking -- the dark, the damp, the confined
    passages that limit what a prey animal can do when it runs. Its body
    is long and segmented, white as old bone, with legs enough to cling
    to ceiling or wall with equal ease. The eyes are gone, or nearly so,
    reduced to pale smudges that may still sense light at the near-distance
    but serve mostly as vestigial landmarks. Everything else has sharpened
    in their place -- the antennae read vibration through stone, and it
    can locate a walking target through the rock before the target has
    any reason to suspect it is not alone in the tunnel. It is not fast
    in a straight line. It does not need to be.
