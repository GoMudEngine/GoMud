character:
  name: Fold-Echo
  description: |
    Out on the reality-thin scabland, where the world comes apart in
    earnest, even violence leaves a residue. A fold-echo is the print of
    something that happened here and refuses to finish happening -- a death,
    a struggle, a crossing -- folded back on itself until it stands up and
    repeats. It is more solid than the grove-things, because the scabland
    has more of itself to spare, but it is no more whole: an outline that
    keeps a half-step of after-image trailing behind it, an attack that
    lands a beat before the blow. Striking it feels less like fighting a
    creature than like interrupting a memory that does not want to be
    interrupted.
