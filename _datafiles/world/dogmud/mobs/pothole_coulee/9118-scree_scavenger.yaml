character:
  name: Scree Scavenger
  description: |
    A flat-bodied creature the color of grey shale, no longer than a
    forearm, that picks its way across the loose rock on six jointed
    legs. The scree scavenger feeds on whatever the slope turns up --
    crushed insects, mineral deposits, the organic residue of slower
    things -- and it is very good at not being seen until it has decided
    to be seen. The claws are small and sharp, the bite negligible on
    its own, but there is rarely only one of them. It moves in the quick
    darting shifts of something that has no individual courage and does
    not need any.
