character:
  name: Stone-Blooded Beast
  description: |
    At the bottom of the mine, past the drifts and the rubble and the
    ordinary dark, something has made a den. The stone-blooded beast is
    not what it was when it first came down here -- that thing, whatever
    cave creature it began as, has been subsumed by a slow and total
    transformation that the miners may have started and certainly did not
    intend. The basalt has grown into it as much as onto it. The hide is
    no longer visible under the mineral crust; what shows instead is a
    living geology, dark grey-black plates jointed by seams of dull
    amber, thick as flagstone at the shoulder and brow, thinning toward
    the joints to allow movement at the cost of looking wrong. The eyes
    are gone. The mass of the creature fills the den passage wall to wall.
    Its breathing is audible through the rock before you see it, a slow
    grinding rhythm like a millstone turning. It does not react to pain
    in any normal way. It reacts to the presence of a threat by becoming
    very, very focused on removing it.
