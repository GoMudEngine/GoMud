character:
  name: Pack-Hound
  description: |
    The pack-hound is bigger than the common scab-hound by a head and
    broader across the chest, its coat a darker grey that has a slight
    coarseness to it, like wire brushed the wrong way. The scarring on
    this one is older and thicker -- a record of engagements it pressed
    rather than avoided. It runs at the front of the pack not because it
    was put there but because it is the kind of animal that moves toward
    things rather than away from them, and that tendency has been
    reinforced by the pack organizing itself around it. While the
    scab-hounds work the edges and cut off the exits, the pack-hound
    hammers the center of attention and keeps it there. It is not
    subtle. It does not need to be. The flankers will close while you
    are focused on this one, and this one knows it.
