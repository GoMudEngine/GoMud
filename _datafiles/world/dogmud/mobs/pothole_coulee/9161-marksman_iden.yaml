character:
  name: Marksman Iden
  description: |
    Iden has the stillness of someone who has spent a life learning to wait
    for the right instant and then not waste it. She is not large, and there
    is nothing martial in how she stands -- weight even, hands quiet -- but
    her eyes never settle for long, flicking out to the canyon mouth, the
    far terrace, the chalked distance-marks, reading the range the way other
    people read a familiar page.
    The mutation on her is small and easy to miss: when she looks at a thing
    far off, both her eyes track it true, but they arrive a fraction before
    your own do, as though the distance has already folded shorter for her
    than for you. She does not remark on it. On the terraces it is simply
    called a good eye, and the bluff-folk send their young here to learn
    what she has.
