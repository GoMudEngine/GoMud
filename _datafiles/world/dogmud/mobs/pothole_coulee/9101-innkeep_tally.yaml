character:
  name: Innkeep Tally
  description: |
    Tally runs the Drowned Lantern the way a good current runs a river --
    you never see the work, only that everything arrives where it ought to.
    She is small and quick and never still, moving table to hearth to
    cellar-stair in a brisk warmth that makes a stranger feel expected
    rather than tolerated. A ruff of soft gill-frills stands at her collar,
    pale and faintly translucent, fluttering when she laughs or leans into
    the steam off the kettle; she pays them no mind and neither, soon, will
    you. She keeps the peat fed and the jugs full and somehow always knows
    which newcomer hasn't eaten, steering a bowl their way before they think
    to ask. There is iron under the welcome -- she will have no brawling
    under her watery light -- but it shows only as a steadiness, the calm
    of someone who has run this room so long it runs to her hand.
