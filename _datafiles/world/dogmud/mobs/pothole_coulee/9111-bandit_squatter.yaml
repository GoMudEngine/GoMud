character:
  name: Bandit Squatter
  description: |
    A heavyset figure who has made herself at home in the wash with the
    comfortable arrogance of someone who has never been cleared out. The
    squatter is not fast, but she is thick-limbed and hard to move, and
    she fights with the uncomplicated aggression of someone who has won
    more brawls by being stubborn than by being clever. The leather vest
    she wears is too good for the rest of her kit -- well-sewn, lightly
    reinforced at the shoulders -- and she fills it in a way that suggests
    she did not come by it gently. The club at her belt is bone and
    iron-banded, heavy enough to bruise through armor.
