character:
  name: Farmer Ferd
  description: |
    Ferd is old enough to know better and stubborn enough not to act on
    it. The quarrel with young Garrow is half his fault and he knows it,
    but knowing a thing and giving way on it are different muscles, and
    his have stiffened with age. He would take a graceful way out if one
    were offered -- he is tired of standing on the green being glared at --
    but he will not be the first to bend.
    One of his eyes has clouded to a flat milky white, and he sees through
    it better than through the clear one -- shapes at distance, movement
    in the dark, the things a farmer's good eye misses. The Awakening's
    doing. He keeps the clouded eye turned toward whatever matters most,
    which today is the young fool across the green.
