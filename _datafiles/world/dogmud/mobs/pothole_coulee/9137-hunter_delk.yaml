character:
  name: Hunter Delk
  description: |
    Delk is built like the steppe wants people built — not tall, not heavy,
    just durable. His camp is the rough kind: a low frame-tent of stitched
    hides, a fire ring circled with flat stones, a curing rack stretched with
    a recent kill. Everything in it has a use and is in its place.
    His hands are the first thing you notice. The skin across the backs of
    them has gone thick and almost waxy, the kind of hide that sheds a briar
    scratch the way bark sheds rain. The same texture runs up his forearms
    to the elbow. He does not seem aware of it. He works with those hands
    without pause — scraping, tying, sharpening — and the tools in them look
    like extensions of the fingers rather than separate objects.
    He will teach what he knows to someone who asks straight and listens
    straight. He does not teach twice.
