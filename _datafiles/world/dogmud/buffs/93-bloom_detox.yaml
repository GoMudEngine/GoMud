buffid: 93
name: Bloom Detox
description: The purge is doing its work -- convulsions, sweating, a burning
  in the gut and behind the eyes. Your body is fighting the Bloom out of itself
  the fast way, and the fast way is not kind.
triggerrate: 1 round
triggercount: 50
statmods:
  healthrecovery: -2
  staminarecovery: -2
  convictionrecovery: -2
  strength: -12
  dexterity: -12
  perception: -12
  vitality: -12
  willpower: -12
  charisma: -12
start_user_text: "The purge takes hold at once -- your body heaves and shakes,
  a deep cold sweat breaking across your skin as the compounds fight their way
  out. It is brutal. It is fast. And it is working."
end_user_text: The worst of the purge passes. You are wrung out and hollow,
  but the Bloom's grip on you has slipped.
