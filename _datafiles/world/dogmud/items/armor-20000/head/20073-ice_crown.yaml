namesimple: crown
description: >-
  A circlet of translucent elemental ice that refuses to melt,
  its spires carved into sharp geometric teeth. A faint cold
  mist drifts from the surface. The air around the wearer's
  head grows noticeably cooler and smells of deep winter.
  Those nearby can sometimes see their breath. Conviction and
  spells both feel more precise with this on — something about
  the cold clarifies intent.
