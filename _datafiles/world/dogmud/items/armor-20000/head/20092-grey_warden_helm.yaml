name: Grey Warden Helm
namesimple: helm
vendor_categories:
- blacksmithing
description: >-
  A smooth grey helm with no crest and no plume, its narrow eye-slit
  set into a face that shows nothing back. Worn, the world outside
  seems to arrive a fraction clearer and quieter, as though the helm
  itself were listening on the wearer's behalf. It was taken from one
  of the fallen guardians of the deep ways and sits with an unsettling
  lightness, cold at the brow long after the wearer has warmed the
  rest.
