namesimple: cloak
description: A long quilted cloak of close-woven linen lined with
  loose cattail down, finished with a horn toggle and a soft hood.
  Light as held breath across the shoulders, warm out of all
  proportion to its weight, and quiet — the down soaks up the
  rustle of cloth on cloth. Lake-folk wear them under their
  outerwear in the cold months; trappers swear by them for the
  long hours of stillness a hide demands.
