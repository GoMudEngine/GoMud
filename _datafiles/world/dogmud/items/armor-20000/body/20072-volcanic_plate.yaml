name: volcanic plate
namesimple: plate
description: >-
  A breastplate of fused basalt and cooled magma, its surface
  cross-hatched with deep stress cracks that glow a dull orange
  from within. Impossibly heavy for its size yet fitted by some
  elemental force to the wearer's frame. The heat it radiates
  is uncomfortable but not harmful. Whatever smithed this did
  not use conventional tools.
