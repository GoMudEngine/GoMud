itemid: 20077
name: Hunter-eel Scale Vest
vendor_categories:
- tailoring
namesimple: vest
description: >-
  A close-fitting vest of overlapping scales taken from a drowned
  hunter — the dark slip-skin of the cave-eel, mottled grey and
  black, light enough that it might be mistaken for thick cloth
  and supple enough to bend with the wearer's smallest motion.
  The scales overlap loose, not locked plate, so a knife-arm
  swings unhindered and a lockpick's fingers stay free. The
  surface is unsettlingly slick — water beads off it, and so do
  many things a wearer would rather have slip past. Cave-divers
  who can afford one prefer it under their outerwear when they
  expect to need their hands free.
