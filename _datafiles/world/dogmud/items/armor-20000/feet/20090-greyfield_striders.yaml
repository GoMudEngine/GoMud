description: >-
  A pair of high-laced boots in a military cut, the hide tanned
  grey-green and worked until the grain is barely visible. The
  soles are triple-layered and set with cross-cut grooves that
  grip loose stone without catching on debris. The outer leather
  shows long wear and no failure at any seam. A faint oil smell
  clings to the inner lining -- pleasant if peculiar. They fit
  with unsettling precision, as if made for the wearer alone.
