description: >-
  Close-fitting gloves woven through with the long grey thread of the
  buried place, so fine the grey shows only as a faint sheen across the
  knuckles. They weigh almost nothing and drink a cool stillness from
  the air, yet they turn an edge like a mailed gauntlet and leave the
  fingers quick and sure. Whoever wove them worked a strength into the
  cloth that the hand can feel but the eye cannot find.
