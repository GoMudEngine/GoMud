namesimple: buckler
description: >
  A round buckler of layered hardwood, its rim reinforced with
  a band of dark iron scored by years of hard use. The grip is
  wrapped in sweat-stained leather, shaped to the hand of
  someone who held it through a great many fights. The iron rim
  is dented in places where it caught blows meant for the body
  behind it. Battered, but maintained — someone valued this
  above everything else in camp.
