description: >-
  A plate of scabbed, mineral-crusted chitin, its joints wrong in
  ways that unsettle the eye before the mind can say why. Prised
  from something that grew too far beneath the city to see
  daylight, it stays warm long after the creature it came from has
  gone cold, and the warmth does not fade with handling. Tailors
  say it takes a needle strangely, as if it still remembers being
  part of something alive.
