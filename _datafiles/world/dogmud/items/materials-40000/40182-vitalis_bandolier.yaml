itemid: 40182
name: Vitalis Bandolier
namesimple: bandolier
description: >-
  A bandolier of supple chrysalis membrane, night-dark and faintly
  warm, strung with rosettes of still-glass that never stop their
  slow turning. Four cradles ring the wearer's chest, each holding
  a potion suspended at the single held breath of its perfection --
  never souring, never dimming, kept as if time itself lost interest
  in it. Wear it long enough and the potions' quiet shimmer begins
  to answer the wearer's own pulse, until the two rhythms fold into
  one and it grows hard to say which is keeping the other's time.
