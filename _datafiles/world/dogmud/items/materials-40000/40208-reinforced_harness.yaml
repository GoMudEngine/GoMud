description: >-
  A chest-worn harness of layered, cured leather stitched over
  webbing and doubled straps, every seam sewn twice until nothing
  in it can flex. It was built to answer a load rather than absorb
  it -- bolt a cradle to its frame and the leather holds true, no
  creak, no give, no shifting weight settling wrong across the
  shoulders. Simple work, honestly done, meant to disappear under
  whatever it is asked to carry.
