description: >-
  A light pack-frame of forged strut and pinned joint, welded thin
  and tested cruel, stronger for its weight than any honest smith
  would admit is possible. Every brace meets its neighbor at an
  angle that should buckle and does not. Strap a load to it and
  the frame carries the weight somewhere other than your back,
  though nobody who has built one can quite explain where.
