itemid: 40186
name: Thornwall Harness
namesimple: harness
description: >-
  Riveted spike-plates run the length of cured hide, every barb
  angled inward toward the wearer's own ribs -- a promise, not an
  accident. Deep gouges score the leather where something already
  tried its luck against it and came away worse for the trying.
  Wearing it reads less like armor than a threat display: a warning
  laid out in iron and hide for anything that thinks about closing
  the distance. Whatever wraps around this wearer regrets it before
  the second breath.
