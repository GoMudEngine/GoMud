description: >-
  A matched ring of cut gems, each faceted to the same angle as
  its neighbors, tuned until set together they hold a single chord
  rather than six separate notes. Strung or set in sequence, the
  gems focus what passes through them into one clean line of
  sound, refusing to let the chord fray at the edges. Jewelers
  tune them by ear, not by eye.
