itemid: 40188
name: Zephyr Treads
namesimple: treads
description: >-
  Boots of pale, wind-cured leather, soles inlaid with a bright vein
  of quicksilver that never sits quite still. Windlace cording laces
  ankle to heel, pulled taut enough to hum in a breeze. Lift a foot
  and the air seems to catch a half-beat behind, reluctant to let go,
  and a faint scent of storm and open sky clings to the leather no
  matter how long they sit shut in a footlocker. Whoever wore them
  first was not walking so much as arguing with the wind and winning.
