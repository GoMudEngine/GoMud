description: >-
  Enchanted ankle-bindings, woven from cord too fine to trust with
  the eye, that pull faintly at the wearer a half-beat ahead of
  whatever wind is moving. Laced tight, they seem to lean forward
  on their own, urging the step that follows before it is fully
  taken. Loosen them and the lean goes with them, patient, waiting
  to be worn again.
