itemid: 40183
name: The Blackrazor
namesimple: blackrazor
description: >-
  A greatsword longer than a tall man, its edge a black glass that
  takes in the light and returns none of it. The blade is knapped
  from volcanic obsidian and laid over a darker core, quenched in a
  cold the smiths will not name. It is a masterwork, and the papers
  that came with it were very nearly in order. Held in both hands it
  weighs more than its make allows, and the grip stays warm at any
  hour -- warm, and faintly working, the way a throat is warm. It
  has been fed before. It means to be fed again.
