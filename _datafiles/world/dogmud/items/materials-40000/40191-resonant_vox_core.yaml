description: >-
  A fist-sized node of the grey material, warm at its center in a
  way nothing else about it explains. Tap it, and it answers -- not
  an echo, but a reply, pitched a half-step wrong and a shade too
  loud. Torn whole from the ruined chest of a warden that no longer
  needed it, the thing still resonates when a room falls silent, as
  though listening for whatever it used to answer to.
