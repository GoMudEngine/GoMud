description: >-
  An alchemical quench-bath, cloudy and mineral-sharp, that leaves
  whatever metal passes through it proof against rot and rust for
  good. Steel dipped once emerges duller in shine but somehow more
  itself, as though the quench had stripped away every flaw that
  time might have found later. Smiths keep it capped tight --
  exposed to open air too long, its potency thins.
