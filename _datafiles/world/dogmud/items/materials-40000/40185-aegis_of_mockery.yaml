itemid: 40185
name: Aegis of Mockery
namesimple: aegis
description: >-
  A tall wall of a shield, broad enough to lose a man behind and
  battered enough to prove that many have tried. Set into the boss is
  a knob of clouded amber, wound about with fine wire, and it seems
  always on the point of clearing its throat. A resonance lacquer
  sheets the face in a dull, humming gloss that catches every jeer
  and flings it clear across a field, so that no foe goes long
  without an audience for his failings. Its dents are legion, each
  one a story it will happily tell you, and none of them a story of
  the shield giving ground.
