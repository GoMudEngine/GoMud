description: >-
  A rosette of hardened marsh-glass, its petals fused smooth as
  though blown rather than grown. It is found only where the marsh
  goes utterly still, in black pools no current ever stirs, and it
  turns slowly on its own axis when held -- a patient half-turn
  with every few breaths, long after the hand around it has gone
  quiet. No one has ever caught it mid-turn; it is only ever seen
  paused, or already somewhere else.
