itemid: 40042
name: herbalism recipe page
namesimple: recipe
description: A single page torn from a notebook, covered in
  neat handwriting -- the careful script of someone young who
  was learning to be precise. It describes a technique for
  extracting fever-bark essence in a clay reduction, with
  annotations in a second, older hand correcting the
  proportions and adding notes like "patience" and "lower
  heat, longer time." A teacher's corrections on a student's
  work. The technique described is sound -- studying it
  clarifies something you have been working toward in your
  own practice.
type: object
subtype: usable
