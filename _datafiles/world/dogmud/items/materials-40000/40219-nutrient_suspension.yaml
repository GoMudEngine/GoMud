description: >-
  A cloudy suspension, thick and faintly sweet, brewed to keep a
  hungering crystal fed without ever waking it fully. A few drops
  through the lattice and whatever stirs inside settles again,
  quiescent, patient, fed just enough to stay fed. Alchemists who
  work with it never taste it themselves -- it is not brewed for
  a mouth.
