name: Thick Predator-Pelt
namesimple: pelt
description: >
  A heavy pelt stripped from one of the hunters that hold the high
  forest above the vale — the fur long and coarse and dark, layered
  deep against a cold the low country never feels. Worked and cured
  it makes a hide that turns a fang or a thorn and sheds weather
  besides. The high-country trappers who might once have wanted it
  stopped coming this way a long while ago.
