description: >-
  A fine enchanted cage of silver wire, wound tight in overlapping
  rings that hum faintly when nothing else is near enough to
  notice. It was made to hold a living thing that feeds -- not to
  starve it, only to keep its hunger pointed inward, contained,
  patient. The wire never quite goes cold, and neither does
  whatever sits behind it.
