description: A mottled grey-black hide stripped from a drowned hunter — the mutated lake-eel that lurks the cave-pools beneath Stillwater. The skin is unusually thick and has a slick rubbery quality even when dry; the slip-defense it lends to a finished piece of armor is the reason cave-divers risk the harvest. Smells faintly of cold mineral water and old fish.
