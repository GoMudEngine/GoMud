name: Stillwater black pearl
namesimple: pearl
description: A small dark pearl from the deepest sump-pools of the Stillwater lake caves — perfectly round, the colour of old slate, with a deep blue-grey lustre that catches the light strangely from any angle. The boldest cave-divers bring back perhaps one a season; most are too small or too damaged to carve. This one is whole and right. Mother Vasse the pearl-carver in town pays well for one of these, and the finished piece costs more again.
