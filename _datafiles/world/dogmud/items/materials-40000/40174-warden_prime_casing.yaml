description: >-
  The outer shell of the great warden that guarded the inner ways --
  a curved plate of the grey material as broad as a shield, scored
  by whatever finally brought the thing down and yet unbroken through.
  It rings, low and long, when struck, a note that hangs in the air
  after it should have died. Heavier than iron and colder, it carries
  the memory of every blow it turned. Only the finest work is worthy
  of it, and only a master could hope to shape it.
