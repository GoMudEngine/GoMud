description: >-
  A fragment torn from something larger -- pale grey and heavier
  than it looks, the surface smooth in a way stone never quite is
  and cold in a way iron seldom stays. The edges show a break, not
  a cut, as if the thing it came from had never been worked by any
  hammer this world knows. No smith in the lowlands knows what to
  do with it, but every smith who has held it has held it longer
  than intended.
