description: >-
  The dense heartwood-thorn drawn from the core of a Fernway
  ironwood, harder than forged iron and darker than the tree that
  grew it. Fernway ironwoods grow slow and mean, throwing thorns
  the length of a forearm, but only the oldest trunks harbor a
  heart-thorn like this one, grown inward instead of out. Worked
  into cloth or leather it lends an edge of that same stubborn
  hardness, resisting long after everything around it has given
  way.
