itemid: 40189
name: Staff of the Hollow Choir
namesimple: staff
description: >-
  A conductor-core stave crowned with a ring of choir-focus gems,
  hollowed straight through so a voice-box of resonant chrysalis-
  glass can hum a chord pitched just below hearing. Casting through
  it does not feel like drawing power so much as being sung through
  -- the wood carries the note, and you are only where it passes.
  When another's conviction falters nearby, the hollow throat drinks
  the failing note and hands it to you as your own, warm and
  borrowed. It never feeds from the same throat twice in close
  succession, as though it remembers exactly whom it drank from last.
