description: >-
  A lacquer that dries to a dull, faintly humming sheen, never
  quite going still even long after it has cured hard. Coat a
  hollow body with it and sound that enters comes out larger than
  it went in, thrown far past anything its size should carry. It
  smells of resin and something underneath the resin, a note that
  never quite finishes ringing.
