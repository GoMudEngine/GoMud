description: A massive curved tooth from the sump dweller — longer than a fishing knife, thick as a thumb at the base, the enamel a yellowed bone-white shading to almost-black at the root. The edges are still sharp enough to draw blood from a careless touch. A trophy worth carrying back; the constabulary in Stillwater will take one as proof the cave bounty has been collected, and the smith will pay a fair price for the rest.
