name: Oracle Shard
namesimple: shard
vendor_categories:
- enchanting
description: >-
  A sliver broken from one of the tall speaking-stones that murmur
  in the deep galleries. Held to the ear it gives back a faint
  patient hum, the tail-end of a voice reciting something in an
  order it has never once forgotten. The surface is smooth as still
  water and holds no scratch. Whatever record it keeps, it keeps
  gladly -- and a careful maker can coax a little of that certainty
  into a finished piece.
