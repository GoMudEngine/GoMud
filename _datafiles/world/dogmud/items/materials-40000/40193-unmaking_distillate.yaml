name: Unmaking Distillate
namesimple: distillate
vendor_categories:
- alchemy
description: >-
  A slim phial of solvent, thinner than water and greyer than
  smoke, that never quite settles still inside the glass. A drop
  laid on skin does not burn -- it simply undoes, patiently,
  whatever the Chrysalis wrote into the flesh beneath it.
  Alchemists who distill it speak of it as a sister to the greater
  Catalyst of Unmaking, cut from the same recipe but gentler, meant
  for smaller mercies.
