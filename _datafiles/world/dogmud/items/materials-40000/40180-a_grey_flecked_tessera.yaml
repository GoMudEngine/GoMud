itemid: 40180
name: A Grey-Flecked Tessera
namesimple: tessera
not_salable: true
description: >-
  A thumb-sized tile, cut true and once fitted into stonework far
  older than the sewers built around it. Pried loose long ago, it was
  lost to the silt of a deep pool-chamber and lay there until
  something with a taste for buried things stirred it back to the
  surface. One face carries a fleck of a gray material that is
  neither stone nor metal -- cold to the touch, and without a single
  tool mark anywhere on it.
