itemid: 17
name: road token
namesimple: token
description: A flat disc of fired clay, stamped with the eye-and-tower seal of the
  road wardens. It marks the bearer as someone who has rendered service to the wardens
  and earned their recognition. The clay is surprisingly heavy for its size, and the
  stamp is crisp and official. Carrying one is said to ease passage through warden
  checkpoints and patrolled territories.
type: object
subtype: holdable
