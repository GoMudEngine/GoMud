name: Letter of Introduction
not_salable: true
namesimple: letter
description: >
  A folded parchment sealed with a blob of brown wax bearing
  a merchant's mark — two crossed wagon wheels. The letter
  introduces the bearer as someone who rendered service to the
  caravan and recommends favorable trading terms. The handwriting
  is practical and legible, the kind of hand that writes invoices
  all day.
