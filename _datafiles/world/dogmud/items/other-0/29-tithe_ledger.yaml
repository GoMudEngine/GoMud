namesimple: ledger
description: A slim leather-bound book containing the temple's tithe records -- who
  paid, how much, and when. A careful examination reveals discrepancies on both sides.
  Several merchants have clearly been under-reporting their income to reduce tithe
  obligations, and the temple's own expenditure records show purchases that do not
  match the inventory. Both parties are cheating, in different ways and for different
  reasons.
