description: >-
  A haft of the grey material as long as a forearm, ending in three
  jointed grey cords that hang heavy and never quite go still. Swung,
  they move a half-beat late, as if reluctant, and land with a weight
  far past their size. It was taken from one of the guardians that
  once kept the deep ways -- an arm made to strike and strike and
  never tire. It answers a strong hand well, though it never seems to
  answer gladly.
