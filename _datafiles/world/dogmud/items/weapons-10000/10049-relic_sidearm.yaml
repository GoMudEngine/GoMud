description: >-
  A compact grey device that fits the hand as if measured for it, with
  a short throat and a grip worn smooth by some earlier bearer. Feed it
  a charge and press the small sunken stud and it spits a hard mote
  faster than the eye can follow, with a cough of cold air and no
  flame at all. It was pried from the vault where the buried place kept
  the tools of those who came before -- a killing thing, patient and
  precise, that has forgotten nothing of its work.
