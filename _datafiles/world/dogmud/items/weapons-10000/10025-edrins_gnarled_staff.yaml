itemid: 10025
name: Edrin's gnarled staff
namesimple: staff
description: >
  A length of ancient hardwood so twisted by age and chrysalis
  exposure that it seems to have grown rather than been carved.
  The wood is dark as iron, warm to the touch, and hums at a
  frequency just below hearing. Faint sigils are burned into
  the grain -- not carved, burned, as if the wood itself chose
  to display them. Both ends are capped in chrysalis-hardened
  resin that glows faintly amber. It is heavier than it looks
  and balanced for someone who knows exactly how to use it.
type: weapon
hands: 2
subtype: staff
