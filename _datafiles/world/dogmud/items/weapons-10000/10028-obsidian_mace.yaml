itemid: 10028
name: obsidian mace
namesimple: mace
description: >-
  A dense mace carved from a single mass of volcanic obsidian,
  the head a knot of razor-edged nodes fused by immense heat.
  It carries a residual warmth that never leaves — the stone
  remembers the magma it was born in. The grip is wound in
  dried sinew that smells faintly of brimstone. It is brutally
  effective at both crushing and cutting in the same swing.
