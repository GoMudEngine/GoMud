name: Ironhorn Warbow
namesimple: bow
vendor_categories:
- blacksmithing
description: >-
  A composite longbow strung with twisted sinew, its limbs built
  from black horn laminated over a core of worked wood and backed
  with strips of dense cured hide. The horn has aged to near-ebony
  and holds a curve no living bowyer has managed to replicate.
  Steel nocks cap each tip and the riser is wrapped in something
  darker than leather. The draw is punishing and the release is
  clean, and the arrows it throws go farther and harder than the
  bow has any right to manage.
