name: Elgar's Hook-spear
vendor_categories:
- blacksmithing
namesimple: spear
description: >-
  A long-shafted hook-spear of refined lake-iron, finished by hands
  that knew exactly what the original carver had wanted. The leaf-blade
  is keener than common stock, the back-curving hook polished smooth
  from waiting on a smith's bench too long. A small fish-sigil is
  burned into the underside of the leather grip — Stillwater-born,
  Stillwater-finished. The spear feels alive in the hand, like it has
  been waiting to be carried.
