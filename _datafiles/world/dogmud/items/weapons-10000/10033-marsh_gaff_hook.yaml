namesimple: gaff hook
description: >
  A short-shafted lake-fisher's gaff with a back-curving steel hook
  set into a worn ash handle, the wood darkened and oil-cured by
  decades of marsh damp. The hook's point is kept needle-bright
  with a small whetstone in the satchel-pocket of every forager
  who carries one. It is a working tool first — for landing a
  large pike or pulling a sunken trap up from the lake-bottom —
  but the hook bites a marsh rat or a bog adder cleanly enough
  when the work calls for it.
