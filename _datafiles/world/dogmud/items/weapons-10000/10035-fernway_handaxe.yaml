namesimple: handaxe
description: >
  A short woodcutter's handaxe with a forged iron head and a
  hickory haft about the length of a forearm, the helve worn
  smooth and a little oily from years of use. The blade is kept
  ground to a working edge — keen enough to cut a foraging stake
  in two strokes, heavy enough to drop a feral hare or break a
  badger's spine without fuss. A leather thong looped through
  the butt-cap lets it ride at the hip without snagging.
