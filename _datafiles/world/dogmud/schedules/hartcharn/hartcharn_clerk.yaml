id: hartcharn_clerk
description: "Bank clerk Osric Vane's daily routine: minds the strongbox by day, sleeps in the strongbox room by night."
segments:
  - start: 6
    end: 22
    target_room: 6454
    activity: ""
    idlecommands:
      - emote opens the ledger and squares its corners on the counter.
      - emote counts a small stack of coin, twice, before writing it down.
      - say The strongbox stays locked until I say otherwise.
  - start: 22
    end: 6
    target_room: 6454
    activity: sleeping
    idlecommands:
      - emote is slumped over the ledger, breathing slow and even.
      - emote mutters a column of figures in his sleep.
