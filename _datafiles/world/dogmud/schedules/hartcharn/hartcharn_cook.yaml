id: hartcharn_cook
description: "Cook Gerta Crook's daily routine: tends the fire by day, sleeps in the cookhouse by night."
segments:
  - start: 6
    end: 22
    target_room: 6459
    activity: craft
    idlecommands:
      - emote stirs the kettle over the fire, tasting from a wooden spoon.
      - emote chops root vegetables with quick, practiced strokes.
      - say This batch of stew needs another turn on the coals.
