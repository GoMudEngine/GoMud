id: gf_warden
description: "Oswin tends the Greenford gate through the long road-hours, keeps a
  quieter watch as evening thins out travelers, then sleeps in the gatehouse alcove
  with one ear still on the bridge."
segments:
  - start: 6
    end: 21
    target_room: 6278
    activity: ""
    idlecommands:
      - emote flips to a fresh page in the toll-ledger and marks something down
        with a stub of chalk, then tucks it back under his arm.
      - say Greenford gate. Open from first light. You are through -- welcome.
      - emote checks the draw-bar fitting with two fingers, testing the pivot,
        then straightens with a small approving nod.
      - say Eleven years on this gate and the river has never once stopped me
        opening it. I find that a fine arrangement.
      - emote leans against the gate-post and watches the road for a moment,
        pupils narrowing to their characteristic slit against the afternoon glare,
        then relaxes and returns his attention to the ledger.
  - start: 21
    end: 23
    target_room: 6278
    activity: ""
    idlecommands:
      - emote sets the lantern in the bracket above the gate and adjusts the
        angle until the light falls clean across the road, then steps back to
        check the spread.
      - say Road thins out at this hour. Sensible travelers are already across
        and eating. I do not mind the quiet.
      - emote draws a slow line under the last entry in the ledger, marks the
        column total, and closes the book for the evening.
  - start: 23
    end: 6
    target_room: 6278
    activity: ""
    idlecommands:
      - emote stands in the gatehouse doorway and watches the empty road, the
        lantern behind him casting long light across the bridge stones.
      - say Night crossing is quiet. As it should be.
      - emote turns a slow circuit of the gate -- draw-bar, lantern bracket,
        ledger on the shelf -- then returns to the post and settles in to wait.
      - emote pulls the cloak closer and studies the far end of the bridge
        until satisfied nothing stirs there, then relaxes against the gate-post.
