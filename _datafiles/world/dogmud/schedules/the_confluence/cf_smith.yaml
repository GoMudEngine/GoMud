id: cf_smith
description: "The Smith works the forge through the day and sleeps by the banked
  fire at night."
segments:
  - start: 6
    end: 21
    target_room: 6239
    activity: ""
    idlecommands:
      - emote brings the hammer down in a steady ring, turning the work a
        quarter-turn between each blow.
      - say Mind the sparks. And mind the floor -- everything in here is either
        hot or was hot an hour ago.
      - emote plunges a finished piece into the slack-tub, and steam climbs the
        wall in a sheet.
  - start: 21
    end: 6
    target_room: 6239
    activity: sleeping
    idlecommands:
      - emote sleeps on a cot by the banked forge, the coals ticking quietly
        down through the night.
