id: new_plymouth_crafting_enchanter
description: "Ansel Rune's daily routine: the circle by day, the loft above it by night."
segments:
  - start: 6
    end: 22
    target_room: 6465
    activity: ""
    idlecommands:
      - emote re-chalks the enchanting circle before the first working of the day.
      - emote sorts a tray of chrysalis shard by grain and color.
      - say Mind the circle, it is not finished drying.
  - start: 22
    end: 6
    target_room: 6465
    activity: sleeping
    idlecommands:
      - emote sleeps on a cot at the edge of the workroom, the circle dark and cold.
      - emote mutters a half-finished sigil in his sleep and falls still again.
