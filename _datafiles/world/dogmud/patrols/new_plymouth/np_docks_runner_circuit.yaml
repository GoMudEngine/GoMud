id: np_docks_runner_circuit
description: "Dobb's daily delivery loop — load sea-imports at the Docks depot, then run them out to the Crafting Quarter's artisan vendors and back. A looping import circuit (engine generalization, 2026-06-22)."
loop_shape: strict
max_path_retries: 40
waypoints:
  # Depot/load stop is zero-dwell on purpose: a zero-dwell waypoint emits its
  # arrival event via the WantsAdvance path, which fires even at the patrol's
  # spawn waypoint. A non-zero dwell here would be skipped on the very first lap
  # (patrol_dwell_remaining starts at 0 on spawn), so the runner would set out
  # empty. Zero-dwell makes the sea-import load fire reliably on every lap.
  - { room: 5506, dwell_rounds: 0, arrival_event: np_runner_depot }
  - { room: 5709, dwell_rounds: 3, arrival_event: np_runner_vendor }
  - { room: 5711, dwell_rounds: 3, arrival_event: np_runner_vendor }
  - { room: 5713, dwell_rounds: 3, arrival_event: np_runner_vendor }
  - { room: 5706, dwell_rounds: 3, arrival_event: np_runner_vendor }
  - { room: 5715, dwell_rounds: 3, arrival_event: np_runner_vendor }
  - { room: 5717, dwell_rounds: 3, arrival_event: np_runner_vendor }
  # On east through the Crafting->Merchant seam into the Central Square (a
  # visible transit through the great market — the heart of the moving economy),
  # then the Merchant arms row. Ostry/Brun stock the same base/overlap/thornwall
  # materials already in the import manifest, so no manifest change is needed.
  - { room: 5802, dwell_rounds: 4, arrival_event: np_runner_vendor }
  - { room: 5810, dwell_rounds: 3, arrival_event: np_runner_vendor }
  - { room: 5812, dwell_rounds: 3, arrival_event: np_runner_vendor }
  # Branch up the Processional into the Noble Quarter to Modiste Aurel's atelier
  # (cloth from Nessa) — delivers thread 40012 / cloth strip 40007 (both in the
  # import manifest). Off the Long Market spine; the path is validated reachable.
  - { room: 6010, dwell_rounds: 3, arrival_event: np_runner_vendor }
  # On east to the temple gate plaza — the Long Market's eastern terminus. A
  # visible transit stop completing the spine Docks->Crafting->Merchant->Temple;
  # no vendor there, so the np_runner_vendor event delivers nothing (harmless).
  - { room: 5903, dwell_rounds: 4, arrival_event: np_runner_vendor }
