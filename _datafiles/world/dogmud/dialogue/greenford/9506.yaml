mobid: 9506
zone: Greenford
defaultMood: friendly
greetings:
  - text: "Don't mind me -- I'm here most mornings. The river water's cold
      enough to do the job properly, which is the most you can ask of it."
    moods: ["friendly"]
patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    responses:
      - "Day to you. You'll want to step back from the tubs if you don't
        want river-water on your boots."
  - keywords: ["stone", "old", "marker", "carving"]
    responses:
      - "Old thing. Been here longer than the buildings. The riverfolk leave
        mint at the base. Nobody organized it. It just happens."
  - keywords: [""]
    responses:
      - "I can talk and wash at the same time. Ask what you need."
tree:
  root:
    text: "I've done the washing for half the river district for fifteen years.
      The green's the right place for it -- close to the water, the elm
      gives shade by midmorning, and the stone there doesn't bother anyone
      while I work. Ask me what you want to know. I'm not going anywhere
      until the linen's done, and the linen takes a while."
    hints: "You could ask about the laundry work and who she washes for, about
      the river and what the water is like here, or about the folk in town
      and how the riverfront lives."
  nodes:
    - id: laundry
      triggers: ["laundry", "wash", "linen", "clothes", "clean", "scrub",
        "rinse"]
      text: "University linen mostly -- the scholars generate a remarkable
        quantity of it, given how little attention they seem to pay to
        anything that isn't a book. Ink stains, candle-wax, river-mud on
        the cuffs where they've been walking the bank thinking through
        something. I've got good at ink. River water and a proper scrub
        gets most of it; the rest I tell them is a permanent feature and
        they should write it off. Some of them are relieved. I also do
        linen for the river-row families and the barge crews when they're
        in long enough. No preference -- coin's coin and linen's linen."
      hints: "You could ask about the river and the water she works in, or
        about the folk in town and the riverfront life."
    - id: river
      triggers: ["river", "water", "bank", "cold", "current", "stone", "level"]
      text: "Cold. Even in summer this river runs cold -- comes down from the
        uplands and doesn't warm up enough by the time it reaches here to
        make any difference to the washing. My hands have been in this water
        more hours than I can count, and the change I've got -- the skin on
        my hands, it doesn't suffer for it, never prunes, never cracks --
        is about the only good thing I can say on the subject of the river's
        temperature. The washing's good for it though. Cold water sets linen
        better than warm and holds the color longer. So I'm not complaining.
        Just observing."
      hints: "You could ask about the laundry and who she washes for, or
        about the folk in town and the river district."
    - id: town
      triggers: ["town", "folk", "people", "local", "greenford", "life",
        "who", "live"]
      text: "River district's its own sort -- fishers, mill workers, barge
        crews, the chandler and Fenn with his fish. We're not the university
        people; they're uphill and we're down here, and that's fine. They
        come down for fish and flour and we go up for the market days, and
        the two halves of the town rub along without much trouble. The
        riverfolk know the river and the scholars know their books, and
        there's enough traffic between them to keep everybody fed and
        reasonably informed. It's a decent life. I've lived worse
        elsewhere and I stay here because it suits me."
      hints: "You could ask about the laundry and the work, or about the
        river and the cold water."
