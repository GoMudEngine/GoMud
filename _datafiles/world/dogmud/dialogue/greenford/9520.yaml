mobid: 9520
zone: Greenford
defaultMood: friendly
greetings:
  - text: "If you are not a student, you are welcome to observe
      from the back row. Please do not interrupt the working."
    moods: ["friendly"]
patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    responses:
      - "Yes. Quickly -- I have a demonstration to reset."
  - keywords: ["lecture", "class", "teach", "lesson"]
    responses:
      - "Natural philosophy, second year. We are in the middle
        of a derivation. Come back at the bell if you like."
  - keywords: [""]
    responses:
      - "Ask me. If it is about the subject, I will answer. If
        it is about the university, probably also."
tree:
  root:
    text: |
      Natural philosophy -- second year. The morning's
      working is on the board if you want to read it. We
      are in a derivation and I am about to demonstrate
      the pendulum component. Ask me something that does
      not take more than a minute.
    hints: "You could ask about today's lecture and the subject,
      about the students and the teaching, or about the
      university."
  nodes:
    - id: lecture
      triggers: ["lecture", "subject", "today", "board",
        "working", "derivation", "pendulum", "philosophy",
        "natural", "demonstration", "chalk", "figures",
        "mathematics", "what", "topic"]
      text: |
        Natural philosophy -- the pendulum problem. We are
        establishing the relationship between arc length and
        period; the board carries three steps of a six-step
        derivation. Most of the second year can follow the
        algebra when I slow down for them. The part where
        they stop following is when the physical intuition
        and the mathematics have to agree with each other.
        That is, not coincidentally, the most interesting
        part. I have been teaching this class for eleven
        years and that is still where it gets good.
      hints: "You could ask about the students and the teaching,
        or about the university."
    - id: students
      triggers: ["students", "student", "class", "teaching",
        "teach", "second year", "young", "learning",
        "understand", "follow", "behind", "ahead"]
      text: |
        The second year is the turning point -- students who
        got this far on memory and careful note-taking start
        to meet problems that do not yield to that. The ones
        who make it through are the ones who can hold a problem
        for a week without knowing the answer. The rest go
        into administration or law, which is also useful.
        I do not tell them this. The selection happens on its
        own, and it is kindest to let it.
      hints: "You could ask about today's lecture and the
        subject on the board, or about the university."
    - id: university
      triggers: ["university", "department", "faculty",
        "scholars", "institution", "campus", "hall", "here",
        "college", "how long", "years", "career"]
      text: |
        Eleven years here, which is long enough to know the
        building's habits -- which windows stick in winter,
        which lecture halls echo badly when the south row
        shifts in their seats. The natural philosophy
        department is small and reasonably well-funded and
        has been left alone to do its work, which is the
        best possible institutional condition. I have no
        complaints about the place.
      hints: "You could ask about today's lecture and the
        subject, or about the students and the teaching."
