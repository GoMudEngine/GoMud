mobid: 94
zone: Thornwall City
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    moods: ["neutral", "friendly"]
    responses:
      - "Civilian. State your business. If you are here to file a report, there are forms on the counter."
      - "What do you need? Make it quick -- I have a shift change in an hour and the rosters are not done."

  - keywords: ["hello", "hi"]
    moods: ["grateful"]
    responses:
      - "Good to see you. The watch owes you one. What do you need?"

  - keywords: ["missing", "person", "elara", "disappear", "find"]
    moods: ["neutral", "friendly"]
    responses:
      - "We have a missing person case. Young woman, name of Elara. Family reported it. If you are willing to look into it, I could use the help -- my patrols are stretched thin."
      - "Elara went missing three days ago. Family is frantic. My guards are covering the gates and market, but the residential wards need someone to knock on doors."

  - keywords: ["crime", "thug", "protection", "racket", "alley"]
    responses:
      - "There is always criminal activity in the back alleys. We patrol when we can, but we are understaffed. If you have specific information, I will act on it."

  - keywords: ["guard", "patrol", "watch", "duty"]
    responses:
      - "The city watch covers the gates, market, and main streets. We are spread thin. The back alleys and residential wards get patrol coverage when we have bodies to spare, which is not often."

  - keywords: [""]
    responses:
      - "Is there something else? The duty log will not write itself."
      - "If you have nothing to report, I have work to do."

tree:
  root:
    text: "Civilian. If you are here about the noise complaint on Market Street, it is filed. If you are here about something else, take a seat."
    hints: "Ask me about the missing person case, crime in the city, or the guard's operations."
    variants:
      - questRequired: ["8-start"]
        questExcluded: ["8-end"]
        text: "Any news on the missing girl? The father has been by twice today. If you have found something, I need to hear it."
        hints: "Report what you have found about Elara."
      - questRequired: ["8-end"]
        questExcluded: ["14-evidence"]
        text: "You did the watch a service with that missing person case. If you hear of anything else, my door is open."
      - questRequired: ["14-evidence"]
        questExcluded: ["14-end"]
        text: "You have been in the tunnels? I can smell it on you. If you have found something, let me see it."
        hints: "You could give him the bribe ledger, or ask about the tunnel operation."
      - questRequired: ["14-end"]
        text: "The tunnel operation is shut down and the arrests are underway. That ledger you brought me is going to shake this city to its foundations. Good work."

  nodes:
    - id: missing_case
      triggers: ["missing", "person", "elara", "case", "help", "quest", "task"]
      questExcluded: ["8-start"]
      grantsQuest: "8-start"
      text: "Elara. Twenty-two years old, daughter of a merchant family in the eastern quarter. Reported missing three days ago by her father. No signs of violence, no ransom demand. She just vanished. My guards are watching the gates and the market, but I do not have the people to search the residential wards door by door. If you are willing to look into it, I would appreciate the help. Her father is Aldric Sevarn -- ask me about the family if you want background. Otherwise, start searching the residential wards north of the market."
      hints: "Search the residential wards north of the market for Elara. You could also ask Velk about her family."
      moodChange: friendly

    - id: family_info
      triggers: ["family", "father", "merchant", "who", "why", "aldric", "sevarn"]
      questRequired: ["8-start"]
      text: "The father is Aldric Sevarn, textile merchant. Prominent family, old money, strong opinions about how daughters should conduct themselves. He filed the report in person. Very insistent. Very concerned. Draw your own conclusions about what kind of concerned."

    - id: where_to_look
      triggers: ["where", "search", "residential", "look", "find"]
      questRequired: ["8-start"]
      text: "If she is still in the city, the residential wards are the most likely place. Cheap rooms, anonymous landlords, people who mind their own business. Start north of the market and work your way through. Ask quietly -- if she is hiding, a loud search will just drive her deeper."

    - id: protection_report
      triggers: ["protection", "racket", "thug", "extortion", "notice", "evidence", "proof", "quest", "task"]
      questRequired: ["10-start"]
      questExcluded: ["10-report"]
      requiresItem: 30
      grantsQuest: "10-report"
      text: "You have evidence of a protection racket? Show me. This is enough to act on. I will put a patrol on the back alleys and bring someone in for questioning. Tell the tavern keeper he can stop paying -- the watch will handle this now."
      moodChange: friendly

    - id: case_report
      triggers: ["found", "report", "elara", "located", "hiding", "quest", "task"]
      questRequired: ["8-found"]
      questExcluded: ["8-end"]
      grantsQuest: "8-end"
      text: "I will close the case based on your account. The family will be notified that she has been located. What I tell them beyond that depends on what you have told me. The watch deals in facts, not judgments."
      moodChange: grateful

    - id: tunnel_report
      triggers: ["tunnels", "smugglers", "smuggling", "ledger", "bribe", "quest", "task"]
      questRequired: ["14-evidence"]
      questExcluded: ["14-report"]
      text: "Smuggling tunnels under the Craftsmen's Quarter? And a bribe ledger naming officials? That is... significant. Give me the ledger. I need to see the names before I can act."
      hints: "You could hand over the bribe ledger."

    - id: tunnel_complete
      triggers: ["done", "finished", "complete", "tunnels", "quest", "task"]
      questRequired: ["14-end"]
      text: "The ledger checks out. Gate captains, customs clerks, a warehouse inspector -- all on the take. The arrests are underway. The tunnels will be sealed and patrols doubled in the quarter. You have done this city a real service."
      moodChange: grateful

memory:
  expiryPeriod: ""
