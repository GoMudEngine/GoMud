mobid: 357
zone: Thornwall City

patterns:
  - keywords: [hello, hi, greetings, hail]
    responses:
      - 'Aye. Wagons are checked over. Long road today.'

  - keywords: [road, trip, journey, where, going]
    responses:
      - 'North to Stillwater, then back. Same as always. The bandits on the spur road test us every time, and every time they lose. Keeps the road honest.'

  - keywords: [bandit, bandits, danger, robber]
    responses:
      - 'Fools who think a wagon means easy coin. They learn otherwise. Marta and Lars earn their wages on every run.'

  - keywords: [wagon, supplies, cargo, goods, deliver]
    responses:
      - 'Bulk goods. Things that move better in volume than a shopkeeper can stock alone. Stillwater needs Thornwall iron, Thornwall needs Stillwater pearl. We bridge the difference.'

  - keywords: [marta, lars, crew, guards]
    responses:
      - 'Marta hits like a falling tree. Lars can pin a sparrow at fifty paces. I trust them with my life and have, more than once.'

  - keywords: [""]
    responses:
      - 'Hmh.'
