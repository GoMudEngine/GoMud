mobid: 95
zone: Thornwall City
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    moods: ["neutral", "friendly"]
    responses:
      - "Welcome to the temple. You are here for contemplation, or something more practical?"
      - "Peace be with you. The temple is open to all. How can I help?"

  - keywords: ["hello", "hi"]
    moods: ["grateful"]
    responses:
      - "Ah, welcome back. The temple remembers those who serve it."

  - keywords: ["tithe", "tax", "merchant", "money", "audit", "cheat"]
    moods: ["neutral", "friendly"]
    responses:
      - "The tithes are a matter of concern. Several merchants have been underpaying for months. The temple cannot maintain itself on goodwill alone."
      - "I suspect the market merchants are under-reporting their income to reduce their tithe obligations. The temple's finances are suffering."

  - keywords: ["help", "quest", "task", "work", "investigate"]
    moods: ["neutral", "friendly"]
    responses:
      - "If you are willing, I need someone to look into the tithe discrepancies. Talk to the merchants, find the ledger, see if the numbers match. The truth is all I ask for."

  - keywords: ["temple", "faith", "pray", "worship"]
    responses:
      - "The temple serves the community. We provide contemplation, community gathering, and practical services -- healing, counseling, record-keeping. It is less dramatic than the old stories, but more useful."

  - keywords: [""]
    responses:
      - "The temple is open if you need it. Candles are by the door."
      - "Is there something on your mind? I am listening."

tree:
  root:
    text: "Welcome to the temple. If you are here for contemplation, the nave is open. If you are here for something else... well, there is a matter I could use help with, if you are the helping sort."
    hints: "Ask me about the tithe problem, the temple, or how you could help."
    variants:
      - questRequired: ["9-start"]
        questExcluded: ["9-end"]
        text: "Have you found anything? The tithe ledger should show the discrepancies. Try the Records Office -- clerk Pell keeps copies of all temple filings. I need to see those numbers before I can act."
        hints: "Visit clerk Pell at the Records Office and ask about the tithe ledger. Then bring it back to Olen."
      - questRequired: ["9-end"]
        text: "The audit is underway. Both sides are unhappy, which means we are probably close to the truth. Thank you for bringing it to light."

  nodes:
    - id: tithe_problem
      triggers: ["tithe", "problem", "help", "quest", "task", "ledger", "matter"]
      questExcluded: ["9-start", "9-end"]
      grantsQuest: "9-start"
      text: "The temple collects tithes from the market merchants -- it has for generations. Recently, the payments have dropped. Significantly. Either the merchants have all suddenly become poorer, or they are under-reporting their income. I need someone outside the temple to look into it. Talk to the merchants, find the tithe ledger, compare the numbers. I want the truth, even if it is uncomfortable."
      hints: "Talk to merchants in the market about their tithes, then find the tithe ledger."
      unlocks: ["merchant_side"]
      moodChange: friendly

    - id: merchant_side
      triggers: ["merchant", "market", "their side", "what do they say"]
      requires: ["tithe_problem"]
      text: "The merchants claim the temple inflates its expenses to justify higher tithes. They may not be entirely wrong. The temple has costs -- maintenance, charity, staff. Whether every coin is accounted for as precisely as it should be... that is part of what I need you to find out."

    - id: ledger_return
      triggers: ["ledger", "found", "evidence", "records", "numbers", "quest", "task"]
      questRequired: ["9-start"]
      questExcluded: ["9-end"]
      requiresItem: 29
      grantsQuest: "9-end"
      text: "Both sides. The merchants are under-paying, and our own expense records are... generous. Thank you for your honesty. This will not be pleasant, but it needed to come to light."
      moodChange: grateful

memory:
  expiryPeriod: ""
