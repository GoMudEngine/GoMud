        draw them for curiosity."

  - keywords: ["stock", "buy", "sell", "shard", "paste", "materials"]
    responses:
      - "I keep chrysalis core, shard, binding paste, mutation
        catalyst, and setting on the shelf, along with oak bark for
        ward inscriptions and black pearl for the higher-tier work.
        Ask specifically and I will name the price."

  - keywords: [""]
