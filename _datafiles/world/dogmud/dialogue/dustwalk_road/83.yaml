mobid: 83
zone: Dustwalk Road
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey", "good day"]
    moods: ["neutral", "friendly"]
    responses:
      - "Traveller. You have come from the north? Good -- that means the road behind you is still clear."
      - "Welcome to the post. I am Tessara, road warden for this stretch. What brings you south?"
      - "You look like someone with a purpose. That, or someone who got lost. Either way, you are welcome here."

  - keywords: ["hello", "hi", "greet"]
    moods: ["grateful"]
    responses:
      - "Ah, you again. The road is quieter thanks to your work. What can I do for you?"
      - "Welcome back, friend. The warden post is always open to you."

  - keywords: ["bandit", "bandits", "trouble", "danger", "threat", "south"]
    moods: ["neutral", "friendly"]
    responses:
      - "Bandits, yes. They have been hitting caravans south of here for weeks. I have reported it, but the Watchers have their own problems and reinforcements are slow in coming."
      - "The road south has become dangerous. A group has dug in somewhere in the gullies past the ridgeline. I cannot leave my post to deal with them alone, and they know it."

  - keywords: ["investigate", "help", "quest", "task", "work", "job"]
    moods: ["neutral", "friendly"]
    responses:
      - "If you are willing, I could use someone to scout the bandit camp to the south. I need evidence of their operation -- documents, anything that proves this is organized and not just opportunistic theft. Bring me proof and I can get the Watchers to act."
      - "There is something you could do. Head south past the ridgeline, into the gullies. Find their camp. Bring me anything that shows who they are and what they are planning. I will see it gets to the right people."

  - keywords: ["report", "evidence", "purse", "letter", "documents", "proof"]
    moods: ["neutral", "friendly"]
    responses:
      - "If you have found evidence from the bandit camp, I need to see it. Anything with names, routes, or schedules would be enough to get the Watchers moving."
      - "Documents are what I need. The wardens at Watchers Crossing will not act on rumour -- they need proof on paper."

  - keywords: ["warden", "wardens", "post", "patrol", "duty"]
    responses:
      - "I am one of a handful of road wardens assigned to the routes between Sanctum Basin and the eastern settlements. We keep the roads passable and report what we see. It is thankless work, but necessary."
      - "The warden posts are the only law on these roads. We are too few and too spread out, but we do what we can."

  - keywords: ["watchers", "crossing", "east", "tower", "towers"]
    responses:
      - "Watchers Crossing is the first proper settlement east of here. They maintain the towers and patrol the approaches. If you are heading that way, the eastern fork from the ridgeline will take you there."
      - "The Watchers are better resourced than we wardens are. Stone towers, regular patrols, actual walls. Getting there is the hard part."

  - keywords: ["road", "dustwalk", "travel", "route"]
    responses:
      - "Dustwalk Road connects Sanctum Basin to the eastern territories. It is the only maintained route through this stretch of country, which makes it valuable -- and a target."
      - "The road is old. Older than the wardens, older than the settlements it connects. Someone built it well. We just try to keep it passable."

  - keywords: ["trade", "buy", "sell"]
    responses:
      - "I am a warden, not a merchant. But if you need supplies, Sanctum Basin is north and Watchers Crossing is east."

  - keywords: [""]
    responses:
      - "Speak plainly. I am listening."
      - "Is there something you need? I have reports to write."

tree:
  root:
    text: "Traveller. You have come at an interesting time. The road south has grown dangerous and I could use someone with steady hands. Or you could just be passing through -- either way, you are welcome at the post."
    hints: "Ask me about the bandits, the road, or how you might help."
    variants:
      - questRequired: ["4-start"]
        questExcluded: ["4-end"]
        text: "Any luck at the bandit camp? I need hard evidence -- documents, a purse with identifying marks, anything. Without proof, the Watchers will not move."
        hints: "Find evidence at the bandit camp south of the ridgeline and bring it to Tessara."
      - questRequired: ["4-end"]
        text: "The report went east this morning. The Watchers will have a patrol out within the week, thanks to you. The road is already safer."

  nodes:
    - id: bandits
      triggers: ["bandit", "bandits", "trouble", "danger", "south", "dangerous"]
      text: "A group has set up in the gullies south of the ridgeline. They have been hitting merchant caravans for weeks -- small ones, the kind that cannot afford guards. I have sent reports to Watchers Crossing, but the wardens there have their own concerns. By the time they act, the bandits will have moved on and set up somewhere else."
      hints: "Ask how you could help, or about Watchers Crossing."
      unlocks: ["help_quest", "watchers_info"]

    - id: help_quest
      triggers: ["help", "investigate", "quest", "task", "what can i do", "willing"]
      questExcluded: ["4-start"]
      grantsQuest: "4-start"
      text: "I cannot leave the post. But if you were willing to scout the camp and bring me evidence -- documents, anything with names or schedules -- I could include it in my next report. Hard evidence is what the Watchers need to justify sending a patrol. It would make a real difference."
      hints: "Accept the task and head south past the ridgeline to find the bandit camp."
      moodChange: friendly

    - id: watchers_info
      triggers: ["watchers", "crossing", "east", "towers", "settlement"]
      text: "Watchers Crossing is three leagues that way, give or take. A proper settlement with walls and towers. They patrol the eastern approaches and keep the trade routes open -- when they have the people for it. The eastern fork from the ridgeline will take you there."

    - id: road_info
      triggers: ["road", "dustwalk", "route", "travel", "where"]
      text: "Dustwalk Road runs from Sanctum Basin down through the scrublands to the eastern territories. This post sits roughly in the middle -- north is the plateau, south is open country, east leads to Watchers Crossing. The road is old and well-built, but maintenance has slipped. I do what I can."

    - id: about_tessara
      triggers: ["you", "yourself", "warden", "who are you", "your story", "tessara"]
      text: "I have been walking roads for longer than I care to count. Started as a caravan guard, moved to the wardens when I got tired of protecting someone else's profits. Out here, you protect the road itself -- and everyone on it. It suits me."
      moodChange: friendly

    - id: evidence_return
      triggers: ["evidence", "purse", "letter", "found", "proof", "report", "documents"]
      questRequired: ["4-investigate"]
      questExcluded: ["4-end"]
      text: "If you have found evidence from the bandit camp -- a purse, documents,\
        \ anything with names or schedules -- bring it to me directly. Hand it\
        \ over and I will see it gets into my report."
      hints: "Give the bandit's purse to Tessara to complete the evidence handoff."

memory:
  expiryPeriod: ""
