mobid: 9320
zone: New Plymouth Common
defaultMood: neutral

greetings:
  - text: "I heard you coming from two corners away. You've got a particular
      kind of step."
    moods: ["neutral"]
  - text: "Back again. Good — I was about to sweep past something interesting."
    moods: ["friendly"]

patterns:
  - keywords: ["hello", "hi", "greet", "hey", "morning", "evening"]
    responses:
      - "I know. I heard."
      - "You're earlier than usual."

  - keywords: [""]
    responses:
      - "Say it plainly. I don't have a lot of sweep-time to spare."

tree:
  root:
    text: "Carter's Rise, three years. Before that the tannery streets, two
      more. You want to know what moves through here, I'm your man. What
      is it — the people, the quarter's troubles, or the strange bits I
      keep finding in the gutters?"
    hints: "You could ask Coll about the gossip in the quarter, the grey
      fragments he finds in the gutters, or the troubles weighing on
      the Common folk."

  nodes:
    - id: gossip
      triggers: ["gossip", "news", "who", "word", "quarter", "neighbors",
                 "street", "people", "know", "tell", "what"]
      text: "Half the Common's business happens at this well before the
        first bell. I don't ask questions — I just sweep near enough to
        hear the answers. The Brimming Bowl gets the evening version.
        Between the two of them and what comes through the gutters, I've
        got a reasonably complete picture of who owes who what and why
        three families on Midden Row aren't speaking. You want specifics,
        you'll need to tell me what you're looking for."
      hints: "Coll seems to know the quarter's daily rhythms well. You
        could ask about the grey fragments he keeps finding, or the
        troubles weighing on the Common folk."

    - id: fragments
      triggers: ["fragment", "fragments", "grey", "gray", "stone", "gutter",
                 "gutters", "material", "found", "find", "bits", "pieces",
                 "strange"]
      text: "I've been finding them for two years, now — small pieces, grey
        as old bone but harder, and they don't match anything quarried
        around here. Come up in the gutters mostly, when the rain's been
        heavy. I've got eleven of them in a tin at home. I showed one to
        the old bookseller on the Inkwalk and he got an expression on him
        like he'd heard a rumor confirmed. Wouldn't say what rumor. I've
        been keeping my ear to that particular wall ever since. Walls are
        good for that."
      hints: "Coll's fragments seem to have caught someone's attention.
        The bookseller on the Inkwalk might know more about what they are."
      moodChange: curious

    - id: troubles
      triggers: ["trouble", "troubles", "bloodline", "problem", "problems",
                 "rent", "levy", "tax", "hard", "difficult", "bad", "worse",
                 "city", "domestic", "office", "clerk"]
      text: "The rent went up twice in eighteen months — the bloodline's
        domestic office runs the collecting through a clerk in the Merchant
        Quarter who has a very clean seal and no particular sympathy for
        families that come up short. Mother Brisk on the condemned block
        is keeping four extra people in a space licensed for two and not
        telling anyone about it, and I'm not going to be the one who tells
        anyone about it either. Beyond that — the well's a city asset that
        hasn't been repointed in six years. I know because I can hear the
        water moving through the cracks from street level."
      hints: "The bloodline's reach into the Common Quarter weighs heavily
        here. Coll knows more about the gutters and the walls than he lets on."
      moodChange: cautious
