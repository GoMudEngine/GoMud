mobid: 63
zone: Sanctum Basin
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    responses:
      - "Welcome, traveler! Looking to trade?"
      - "Hello there. Come to do business?"
      - "What brings you to my stall today?"

  # System mention: bartering system
  - keywords: ["barter", "trade", "bargain", "deal", "negotiate", "discount"]
    responses:
      - "I don't just deal in coin. Bring me goods and I'll trade. If you're clever, you'll get a better rate than gold would buy."
      - "Bartering is an art. Some traders add. Some traders cut. I'm fair to those who give me something worth keeping."
      - "You have wares? I might have coin, or I might offer goods for goods. Let's see what you have."
    moodChange: friendly

  # System mention: gossip / information
  - keywords: ["gossip", "news", "rumor", "hear", "story", "tale"]
    responses:
      - "I hear things. Merchants always do. You want to know something? Sit for a drink and I'll tell you what I know."
      - "The roads carry stories the way they carry goods. I've heard tales that would make your hair stand. What's your pleasure?"
      - "Gossip is good for business. It brings people in. It loosens tongues. I hear more truths at my stall than in temples."
    moodChange: friendly

  # System mention: encumbrance / carrying capacity
  - keywords: ["carry", "encumbrance", "load", "heavy", "weight", "burden", "overburdened"]
    responses:
      - "Carrying too much slows you down. Hurts your movement. Makes you sluggish in a fight. Know your limits or pay the price."
      - "A smart traveler knows what they can carry and stops before that point. The difference between a light pack and a heavy one? Survival."
      - "I've seen adventurers collapse under their own gear. The stuff you carry should serve you, not bury you. Stop and sell what you can't use."

  # System mention: shopping / buying
  - keywords: ["buy", "purchase", "sell", "cost", "price", "shop"]
    responses:
      - "I have goods and I have prices. Speak to me about buying or selling and we'll talk numbers."
      - "I'm a merchant. My trade is moving goods between those who have them and those who need them. Fair prices for fair dealings."
    moodChange: friendly

  - keywords: [""]
    responses:
      - "Speak up. I've got other customers waiting."
      - "What do you want? Coin's ticking."

tree:
  root:
    text: "Adela, at your service. I trade in goods and gossip, both of which are currency in the Basin."
    hints: "You could ask about bartering, gossip, encumbrance, or shopping."
