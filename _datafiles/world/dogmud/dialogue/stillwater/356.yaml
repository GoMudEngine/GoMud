mobid: 356
zone: Stillwater
defaultMood: friendly

patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    moods: ["neutral", "friendly"]
    responses:
      - "Welcome to my office, which is this corner of the square. Mind the slate."
      - "Hey. If you are looking for my father, he is over by the wagons looking exhausted. If you are looking for me, you found me."

  - keywords: ["hello", "hi"]
    moods: ["grateful"]
    responses:
      - "You. Sit on the bench. I am between deliveries, which is the closest thing I get to a break."

  - keywords: ["who", "you", "yourself", "lars", "name"]
    responses:
      - "Lars Ketilson. The kid in the caravan crew. I do all the deliveries because, in my father's words, I have working knees. I do not think this is the whole reason but it is the reason he gives."

  - keywords: ["route", "road", "thornwall", "run"]
    responses:
      - "Three days each way, four if the ditch at the second crossing is full. We came in Tuesday. Leaving morning after next, weather holding. I get the layover off, except for the deliveries. Which is most of the layover."

  - keywords: ["father", "dad", "ketil"]
    responses:
      - "He could send Marta to do the deliveries. He does not. The man has a sense of humour about who has working knees."

  - keywords: ["slate", "orders", "list", "deliveries"]
    responses:
      - "Brindle takes lake-iron. Ilsa takes the small bottles. Edda takes thread-spool. Wulf takes everything else. Sigrid pretends she is not on the list because she has a pride thing about it. She is on the list."

  - keywords: [""]
    responses:
      - "Need something? I am right here, at least until the next delivery."
      - "Speak up. I get distracted easily, my father will tell you."

tree:
  root:
    text: "Welcome to my office, which is this corner of the square.
      What can I help with?"
    hints: "You could ask Lars about the caravan, his father, the run
      from Thornwall, or what he is doing here."

  nodes:
    # ============================================================
    # INFO: the caravan run (atmospheric, no cadence)
    # ============================================================
    - id: caravan_run
      triggers: ["caravan", "run", "trip", "route"]
      text: "Three days each way, four if the ditch at the second
        crossing is full. We came in Tuesday. Leaving morning after
        next, weather holding. I get the layover off, except for the
        deliveries. Which is most of the layover. Which means it is
        not really a layover. Which I have pointed out to my father.
        Which he ignored."

    # ============================================================
    # INFO: Thornwall + Maren cross-zone reference
    # ============================================================
    - id: thornwall_city
      triggers: ["thornwall", "city", "maren"]
      text: "Thornwall is bigger than Stillwater. Louder. The market
        goes on for blocks. Maren the weaver's place is on the way
        through; we drop in if we have a letter for her aunt here.
        She always has bread. She is good people. I think she is the
        only reason my father ever smiles on a Thornwall layover."

    # ============================================================
    # INFO: about his father
    # ============================================================
    - id: father_grumble
      triggers: ["father", "dad", "ketil"]
      text: "He runs a tight wagon. I respect that. I respect it less
        when I am running a crate of bottles to the apothecary in the
        rain. But I respect it. He says I will thank him when I am
        running my own wagon. I think the thanks will be late. He has
        already been singled out for sixteen years -- a kind of
        thanks-in-advance has accrued."

    # ============================================================
    # INFO: about Marta
    # ============================================================
    - id: marta_respect
      triggers: ["marta", "guard"]
      text: "I have seen her do things with that sword that I will be
        telling stories about when I am old. She does not talk much.
        I think she likes me. I cannot prove it. She slipped me an
        apple last winter when I was hungry on the road. That counts
        for me."

    # ============================================================
    # INFO: wants a real job
    # ============================================================
    - id: wants_promotion
      triggers: ["promotion", "job", "guard", "fighting", "want",
        "future"]
      text: "I want a guard's pay. I am not going to pretend otherwise.
        My father says I have to grow into it. I have been growing
        for three years. He says it does not happen on a schedule. I
        think he just enjoys the deliveries being done. We are both
        right, probably."

    # ============================================================
    # INFO: the slate-list of orders (foreshadows future system)
    # ============================================================
    - id: slate_orders
      triggers: ["slate", "orders", "list", "deliveries", "stock"]
      text: "Brindle takes lake-iron. Ilsa takes the small bottles.
        Edda takes thread-spool. Wulf takes everything else. Sigrid
        pretends she is not on the list because she has a pride thing
        about it. She is on the list. I write it all down each layover
        even though my father knows it by heart -- in case he ever
        forgets, or in case I have to take over before he is ready
        for me to. The slate is older than I am. He says his father
        kept one too."

memory:
  expiryPeriod: ""
