mobid: 351
zone: Stillwater
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    moods: ["neutral", "friendly"]
    responses:
      - "Welcome. Mind the wagon ruts."
      - "Caravan driver Ketil. State your business or have a sit on the bench."

  - keywords: ["hello", "hi"]
    moods: ["grateful"]
    responses:
      - "Good to see you. Sit. Tea is on, if Lars has not let it go cold."

  - keywords: ["who", "you", "yourself", "ketil"]
    responses:
      - "Ketil. I drive the Stillwater-Thornwall caravan. Have done for sixteen years -- which makes me old for the work and good at it, in roughly equal measure."

  - keywords: ["route", "road", "thornwall", "north", "trip", "run"]
    responses:
      - "Three days each way, four if the ditch at the second crossing is full. Out and back as often as the wagons hold up. Not a fast life, but a steady one. Mostly."

  - keywords: ["wagon", "horses", "hub", "wheel", "repair"]
    responses:
      - "The hub on the lead wagon needs a re-fit. Brindle takes a look at it each layover -- he knows the wagons better than I do, sometimes."

  - keywords: ["weather", "schedule", "leaving", "depart"]
    responses:
      - "Morning after next, weather holding. Lars will spend tomorrow finishing the deliveries. Marta will spend it cleaning the sword she already cleaned twice. I will spend it pretending I am not pretending to nap."

  - keywords: ["lars", "son", "boy", "kid"]
    responses:
      - "He is the youngest hand. Everyone starts at the youngest, including me. He thinks I am singling him out. I am singling him out -- on the same schedule his uncle was singled out and his grandfather before that. He will grow into it."

  - keywords: ["marta", "guard", "fighter"]
    responses:
      - "Marta has saved the caravan twice. I overpay her on purpose. She knows. She does not bring it up."

  - keywords: [""]
    responses:
      - "Speak plainly. The road has burned the patience out of me."
      - "Was there something else?"

tree:
  root:
    text: "Welcome. Mind the wagon ruts. Caravan driver Ketil. State
      your business or sit on the bench."
    hints: "You could ask Ketil about the caravan route, his crew,
      news from Thornwall, or the road."
    variants:
      # Post-quest 20: Voss connection
      - questRequired: ["20-end"]
        text: "I knew Voss in passing -- Maren's uncle, ran a few small
          things north for him before he went into the deep. Glad it is
          settled. Carry the spear well; he would have wanted that one
          to do work."
        hints: "You could ask Ketil about the caravan, his crew, or the
          road."

  nodes:
    # ============================================================
    # INFO: the route (atmospheric — no cadence specified)
    # ============================================================
    - id: route_thornwall
      triggers: ["route", "road", "thornwall", "north", "run", "trip"]
      text: "South to Thornwall, back to Stillwater, repeat until the
        wagons fail or I do. Three days each way, four when the road
        is bad. We carry what the towns ask for -- bottles, thread,
        lake-iron stock, the small things that travel well. Letters
        when there are letters. Not a fast life. A useful one."

    # ============================================================
    # INFO: bandits on the road
    # ============================================================
    - id: road_bandits
      triggers: ["bandits", "raid", "raiders", "soren", "highwayman"]
      text: "There used to be a serious problem on the North Road.
        Quieter now -- Drunn's lot, and a traveller or two who took
        the bounty seriously, cleared the worst of them. Never gone,
        though. We keep a sword on the wagon for a reason."

    # ============================================================
    # INFO: about Lars
    # ============================================================
    - id: lars_kid
      triggers: ["lars", "son", "boy", "kid"]
      text: "He will thank me when he is running his own wagon, which
        will be when I am too old to read the manifests. He thinks I
        make him run errands to spite him. I do not. I make him run
        errands because someone has to and his legs are younger than
        mine. He will grow into it. They all do."

    # ============================================================
    # INFO: about Marta
    # ============================================================
    - id: marta_pro
      triggers: ["marta", "guard", "fighter"]
      text: "Marta has saved the caravan twice. The first time was
        five years ago, three bandits who underestimated her. The
        second time was last summer, four of them who had heard
        about the first time and decided to try anyway. I overpay
        her on purpose. She knows."

    # ============================================================
    # INFO: Maren letter cross-zone reference
    # ============================================================
    - id: maren_letter
      triggers: ["maren", "letter", "letters"]
      text: "Sometimes I carry letters between Maren in Thornwall and
        her aunt Ulla here. I do not open them. The seal is the same
        wax both ways -- they made it as girls together, before
        Maren's uncle Voss came north and married Ulla. I deliver,
        I do not pry."

    # ============================================================
    # INFO: shopkeepers' standing orders (foreshadows future system)
    # ============================================================
    - id: shopkeepers_know_him
      triggers: ["shopkeepers", "orders", "deliveries", "stock",
        "brindle", "ilsa", "edda"]
      text: "I know what each shopkeeper orders without checking the
        slate. Brindle takes lake-iron stock from the Thornwall
        smelters. Ilsa takes the small ground-glass bottles. Edda
        takes thread-spool by the dozen. Wulf takes everything else
        worth carrying. Lars writes the slate down anyway, in case
        I die between runs and someone has to take over. He is not
        as funny as he thinks he is when he says it. He is also not
        wrong."

memory:
  expiryPeriod: ""
