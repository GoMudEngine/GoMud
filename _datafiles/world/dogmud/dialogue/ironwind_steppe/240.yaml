mobid: 240
zone: Ironwind Steppe
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    moods: ["neutral", "friendly"]
    responses:
      - "Kael nods without looking up from his whittling. 'Not many come this way on purpose. What brings you to the steppe?'"
      - "The hermit studies you with quiet, assessing eyes. 'You look like someone who has been walking a while. Sit, if you like.'"

  - keywords: ["help", "quest", "task", "work"]
    moods: ["neutral", "friendly"]
    responses:
      - "'There is something troubling the steppe. Two people I respect are about to destroy each other over a disagreement neither will back down from. I could use someone with fresh eyes.'"

  - keywords: ["steppe", "land", "home", "live"]
    responses:
      - "'I have lived on the steppe for longer than most people stay anywhere. It is a hard place but an honest one. The wind does not lie and the land does not pretend.'"

  - keywords: ["sylara", "windwarden", "druid"]
    responses:
      - "'Sylara is the Windwarden. She watches over the sacred places -- the stone circle, the old cairns, the wind-paths. She has guarded the steppe's balance since before I came here. You will find her at the stone circle, east of the ridge trail junction.'"

  - keywords: ["rhett", "geomancer", "scholar", "thornwall"]
    responses:
      - "'Rhett is a scholar from Thornwall. Enthusiastic young man. He has been studying the rock formations on the ridge and found something he says could change everything. I believe him, which is the problem. His camp is at the ridge approach, down the western slope.'"

  - keywords: [""]
    responses:
      - "Kael grunts and returns to his whittling."
      - "The hermit stares out at the steppe in silence."

tree:
  root:
    text: "A weathered man in patched leather looks up from a piece of cedar he is carving. 'Hm. A visitor. Rare enough out here.' He sets down his knife. 'You have the look of someone who solves problems. I have one that needs solving.'"
    hints: "Ask about the problem, the steppe, or who lives here."
    variants:
      - questRequired: ["11-start"]
        questExcluded: ["11-sylara", "11-rhett"]
        text: "Kael looks up. 'Have you chosen yet? Sylara is at the stone circle, east of the ridge trail junction. Rhett camps at the ridge approach on the western slope. Pick one and offer your help -- but understand that choosing one means the other will not work with you.'"
        hints: "Visit Windwarden Sylara at the stone circle or Geomancer Rhett at the ridge approach. Choosing one locks out the other."
      - questRequired: ["11-sylara"]
        questExcluded: ["11-end"]
        text: "'You sided with Sylara. Good -- or bad. Either way, do what she asks. The steppe will judge the rest.'"
      - questRequired: ["11-rhett"]
        questExcluded: ["11-end"]
        text: "'You sided with Rhett. Good -- or bad. Either way, do what he asks. The steppe will judge the rest.'"
      - questRequired: ["12-end"]
        text: "'The spirits walk with you now. I can feel it -- the wind moves differently around you. The steppe has accepted you as one of its own.' Kael nods with quiet respect."
      - questRequired: ["12-start"]
        questExcluded: ["12-end"]
        text: "'Walking the Windwarden's path, are you? Sylara does not offer the covenant lightly. See it through.' Kael returns to his whittling."
      - questRequired: ["13-end"]
        text: "'Rhett got his crystal. Thornwall will benefit, I expect. Whether the steppe forgives the cost -- that is another question.' Kael stares out at the grasslands."
      - questRequired: ["13-start"]
        questExcluded: ["13-end"]
        text: "'Walking the scholar's path. Rhett is eager, I will give him that. Just make sure eagerness does not outrun wisdom.' Kael shakes his head."
      - questRequired: ["11-end"]
        text: "'You made your choice. The steppe will remember it -- for good or ill. That is all any of us can ask.' Kael picks up his whittling and returns to work."

  nodes:
    - id: the_problem
      triggers: ["problem", "trouble", "conflict", "help", "quest", "task", "solve"]
      questExcluded: ["11-start", "11-sylara", "11-rhett"]
      grantsQuest: "11-start"
      text: "'Two people I care about are on a collision course. Windwarden Sylara guards the ancient stone circle east of the ridge trail -- it is the spiritual heart of the steppe. Geomancer Rhett, a Thornwall scholar, has found veins of rare windstone crystal in the ridge near the circle. He says extracting it could advance healing magic. Sylara says it would crack the circle's foundation and unravel the steppe's balance.' Kael sighs. 'Neither is wrong. Neither will back down. Go to one of them and offer your help. But choose carefully -- once you pick a side, the other will not trust you. Sylara is at the stone circle. Rhett camps at the ridge approach.'"
      hints: "Visit Windwarden Sylara at the stone circle or Geomancer Rhett at the ridge approach. Choosing one side means the other will not work with you."
      moodChange: friendly

    - id: about_steppe
      triggers: ["steppe", "land", "home", "live", "here", "long"]
      text: "'Fifteen years. Maybe more. I stopped counting when the seasons started blending together.' Kael gestures at the vast grasslands. 'The steppe strips away everything that does not matter. What is left is either strong or gone. I find that honest.'"

memory:
  expiryPeriod: ""
