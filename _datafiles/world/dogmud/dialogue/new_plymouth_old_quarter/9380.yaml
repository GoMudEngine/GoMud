mobid: 9380
zone: New Plymouth Old Quarter
defaultMood: neutral

greetings:
  - text: "Lamp's due for a trim. Was there something?"
    moods: ["neutral", "cautious"]
  - text: "You found your way down. What do you need?"
    moods: ["friendly"]

patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    responses:
      - "Lamp needs trimming. What is it?"
      - "I keep the lights. Yes?"

  - keywords: [""]
    responses:
      - "I tend lamps. That is most of what I have to say about things."
      - "Mm."

tree:
  root:
    text: "I light the lamps at dusk, trim the wicks, fill the oil
      when they run low. I do not ask what the lights show me —
      that question has never made my life any better."
    hints: "You could ask Quill about his lamping work and the route
      he walks, about the iron door at 215 Lintel St and the traffic
      past it at odd hours, or about who lives in the Old Quarter."

  nodes:
    - id: lamps
      triggers: ["lamps", "lamp", "work", "light", "wick", "oil",
                 "tend", "lantern", "lighting", "route", "rounds",
                 "brackets", "trim", "fill"]
      text: "Six brackets from the canal mouth to the far court —
        twelve lamps total. Longer than it looks, because the flooded
        section adds a detour. I do the route twice — once at dusk to
        light them, once midmorning to trim and check the oil. Eleven
        years of the same walk. I know every step of it in the dark,
        which helps, because most of it is."
      hints: "He described the route with the care of someone who
        has walked it ten thousand times. You could ask about the
        traffic he has seen at the iron door at 215, or about the
        people who live in the Old Quarter."

    - id: traffic
      triggers: ["traffic", "215", "door", "lintel", "night",
                 "hours", "movement", "visitors", "iron",
                 "late", "comes", "goes"]
      text: "That address is — I carry lamps on a route. The iron
        door gets light from bracket three. I fill bracket three
        after dark. Sometimes there are people there at hours when
        people are not usually at doors. Late hours. Odd hours. I
        do not know them. I do not look at them any more than the
        lamp bracket requires. I keep walking."
      hints: "He confirmed something without saying what it was —
        a man giving exactly as much as he must and not a word more.
        You could ask about the lamping route, or about who lives
        in the Old Quarter."
      moodChange: cautious

    - id: quarter
      triggers: ["quarter", "poor", "people", "buried", "canal",
                 "lives", "drowned", "courts", "who", "live",
                 "down", "others", "neighbors"]
      text: "Most people down here were priced out of somewhere
        higher — the Docks, the Common Quarter, wherever they
        started. The courts below the waterline are livable in the
        dry months if you know which walls to keep away from.
        There are about thirty of us in the main stretch. Gritta
        goes deeper than any of us. I go as far as the lamp
        brackets need and no further."
      hints: "He described the quarter plainly, without pride or
        complaint. You could ask about the lamping route, or about
        what moves past the iron door at odd hours."
