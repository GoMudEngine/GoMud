questid: 1
name: The Sanctum Trials
description: Complete the trials of Sanctum Basin to earn passage to the wider world.
secret: false
linear: true

steps:
  - id: start
    description: "Listen to the Chrysalis Priest's Awakening Rite."
    hint: "Stay in the Academy Hall and listen to the Priest."
  - id: mutation
    description: "Visit Merchant Adela on Market Street and buy equipment. Type hint for directions."
    hint: "Go south from the Academy Hall to Market Street. Type list to see her wares, then buy something."
  - id: shopping_buy
    description: "Equip what you just bought. Type hint if you need help."
    hint: "Type wield [weapon] or wear [armor] to put on your purchase. Type inventory to see what you have."
  - id: shopping_equip
    description: "Defeat the training dummy in the Training Yard. Type hint for directions."
    hint: "From Market Street, go north back to the Academy Hall, then east to the Training Yard. Type attack dummy to fight."
  - id: combat_defeat
    description: "Visit Korvath at The Forge and craft an iron dagger."
    hint: "From the Training Yard, go south to The Forge. Korvath will give you materials. Type craft iron dagger."
  - id: crafting_craft
    description: "Visit Alchemist Yenna and brew a healing salve."
    hint: "From The Forge, go west to Market Street, then west again to Town Square, north to Well Court, then west to the Alchemist's Workshop. Type craft healing salve."
  - id: alchemy_craft
    description: "Visit Wilderness Guide Fen and forage for materials."
    hint: "From the Alchemist's Workshop, go south to the West Meadow. Type forage to search the area."
  - id: wilderness_forage
    description: "Track a creature in the wilderness."
    hint: "Stay in the West Meadow with Guide Fen. Type track to read the signs."
  - id: wilderness_track
    description: "Visit Elder Saris at the Observatory and cast a spell."
    hint: "From the West Meadow, go north to the Alchemist's Workshop, then north again to the Observatory. Type cast conviction-spike echo."
  - id: magic_cast
    description: "Defeat the Aberrant Chrysalis in the cave."
    hint: "From the Observatory, go east to Observatory Path, east to Cave Path, east to Cave Depths, then east to the Boss Cave. Defeat the Aberrant."
  - id: cave
    description: "Report to the Basin Warden at the south gate."
    hint: "Head back west through the caves, then south through Well Court and Town Square to Basin Gate."
  - id: warden
    description: "The Basin Warden is opening the gate. Listen to the final words."
    hint: "Stay and listen to the Basin Warden's farewell."
  - id: end
    description: "The Sanctum Trials are complete. Head south through the gate."
    hint: "Head south through the gate. The world of Gaius awaits you."

rewards:
  gold: 25
  player_message: >-
    The Basin Warden nods with quiet satisfaction.
    The gate swings open. The world of Gaius awaits you.
  skill_info: "map:1"

triggers:
  # ── AWAKENING RITE (Room 113) ─────────────────────────
  - event: room_enter
    room: 113
    conditions:
      missing: [1-start]
    actions:
      - grant: 1-start
      - sequence:
          delay_between: 0
          lock_message: "The Rite is not yet complete. A moment more."
          lines:
            - {speaker: 50, delay: 1, text: "Be still."}
            - {speaker: 50, delay: 2, emote: true, text: "draws a circle in the air with one hand. The chalk diagrams on the walls begin to glow faintly."}
            - {speaker: 50, delay: 4, text: "In Gaius, the body changes through effort and conflict. We call these changes Mutations."}
            - {speaker: 50, delay: 6, emote: true, text: "steps forward and places two fingers lightly on your forehead. The air hums."}
            - {speaker: 50, delay: 8, emote: true, text: "closes their eyes. The glow intensifies, then fades."}
            - {speaker: 50, delay: 10, emote: true, text: "withdraws their hand. The hum fades. Something has changed."}
            - {speaker: 50, delay: 11, text: "It is done. Type <ansi fg=\"command\">mutations</ansi> to see what the change has wrought."}
            - {speaker: 50, delay: 13, text: "You have six trials before the Basin Warden will let you pass. Start with the Merchant -- south of here. Type <ansi fg=\"command\">hint</ansi> if you lose your way."}
          on_complete:
            - give_mutation: true
            - give_gold: 10
            - grant: 1-mutation

  # ── SHOPPING: BUY (Room 108) ──────────────────────────
  - event: command
    command: buy
    room: 108
    conditions:
      has: [1-mutation]
      missing: [1-shopping_buy]
    actions:
      - grant: 1-shopping_buy

  # ── SHOPPING: EQUIP (Room 108) ────────────────────────
  - event: command
    command: equip
    room: 108
    conditions:
      has: [1-shopping_buy]
      missing: [1-shopping_equip]
    actions:
      - grant: 1-shopping_equip

  # ── COMBAT: DEFEAT DUMMY (Room 114) ───────────────────
  - event: mob_death
    mob: 65
    conditions:
      has: [1-shopping_equip]
      missing: [1-combat_defeat]
    actions:
      - grant: 1-combat_defeat

  # ── CRAFTING: FORGE (Room 109) ────────────────────────
  # Uses command trigger, not skill_use — skill_use only fires on
  # success, but the tutorial should advance even on a failed craft.
  - event: command
    command: craft
    room: 109
    conditions:
      has: [1-combat_defeat]
      missing: [1-crafting_craft]
    actions:
      - grant: 1-crafting_craft

  # ── ALCHEMY: BREW (Room 111) ──────────────────────────
  - event: command
    command: craft
    room: 111
    conditions:
      has: [1-crafting_craft]
      missing: [1-alchemy_craft]
    actions:
      - grant: 1-alchemy_craft

  # ── WILDERNESS: FORAGE (Room 106) ─────────────────────
  - event: command
    command: forage
    room: 106
    conditions:
      has: [1-alchemy_craft]
      missing: [1-wilderness_forage]
    actions:
      - grant: 1-wilderness_forage

  # ── WILDERNESS: TRACK (Room 106) ──────────────────────
  - event: command
    command: track
    room: 106
    conditions:
      has: [1-wilderness_forage]
      missing: [1-wilderness_track]
    actions:
      - grant: 1-wilderness_track

  # ── MAGIC: CAST SPELL (Room 116) ──────────────────────
  - event: skill_use
    skill: spellcasting
    room: 116
    conditions:
      has: [1-wilderness_track]
      missing: [1-magic_cast]
    actions:
      - grant: 1-magic_cast

  # ── BOSS CAVE: DEFEAT ABERRANT (Room 120) ─────────────
  - event: mob_death
    mob: 69
    conditions:
      has: [1-magic_cast]
      missing: [1-cave]
    actions:
      - grant: 1-cave

  # ── WARDEN GATE (Room 102) ───────────────────────────
  - event: room_enter
    room: 102
    conditions:
      has: [1-cave]
      missing: [1-warden]
    actions:
      - sequence:
          delay_between: 0
          lines:
            - {speaker: 56, delay: 1, text: "Your record is complete. Six trials, six instructors -- and the cave."}
            - {speaker: 56, delay: 3, text: "The Basin Warden has one function: to ensure that no one leaves Sanctum Basin unprepared. You are prepared."}
            - {speaker: 56, delay: 4, text: "The gate is open. Whatever you find south of here -- remember what you learned in the basin."}
            - {speaker: 56, delay: 6, text: "One last thing: the world is larger than what six instructors can cover. Type <ansi fg=\"command\">help</ansi> to see what documentation is available -- there is more to learn out there than what we teach here."}
            - {speaker: 56, delay: 7, text: "The south road reaches Confluence within a day's walk. Follow the river north from there and you will find New Plymouth -- the largest settlement in this part of Gaius. That is where most people head first."}
            - {speaker: 56, delay: 9, emote: true, text: "steps aside and gestures toward the road south."}
          on_complete:
            - grant: 1-warden
            - grant: 1-end
            - unlock_exits: {room: 102}
