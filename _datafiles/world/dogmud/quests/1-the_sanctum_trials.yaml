questid: 1
name: The Sanctum Trials
description: Complete the trials of Sanctum Basin to earn passage to the wider world.
secret: false
linear: true

steps:
  - id: start
    description: "Begin the Awakening Rite in the Academy Hall."
    hint: "Go to the Academy Hall and speak with the Chrysalis Priest. From Town Square, go north then east."
  - id: mutation
    description: "Survive the Awakening Rite and receive your first mutation."
    hint: "Visit Merchant Adela on Market Street. From Town Square, go south."
  - id: shopping_buy
    description: "Purchase equipment from Merchant Adela."
    hint: "Type list to see what the merchant carries, then buy something you can afford."
  - id: shopping_equip
    description: "Equip your new gear."
    hint: "Type wield or wear to put on what you bought. Type inventory to see what you have."
  - id: combat_defeat
    description: "Defeat the training dummy in the Training Yard."
    hint: "Go to the Training Yard (from Town Square, north then east). Type attack dummy to start the fight."
  - id: crafting_craft
    description: "Forge an item at Korvath's smithy."
    hint: "Visit The Forge south of the Training Yard. Korvath will give you materials. Type craft iron dagger."
  - id: alchemy_craft
    description: "Brew a potion at Alchemist Yenna's workshop."
    hint: "Visit the Alchemist's Workshop west of Well Court. Yenna will give you materials. Type craft healing poultice."
  - id: wilderness_forage
    description: "Forage for materials in the wild."
    hint: "Visit the West Meadow (from Town Square, go west). Type forage to search the area."
  - id: wilderness_track
    description: "Track a creature in the wilderness."
    hint: "While in the West Meadow with Guide Fen, type track to read the signs."
  - id: magic_cast
    description: "Cast a spell at the Observatory."
    hint: "Visit Elder Saris at the Observatory (above the Alchemist). Type cast conviction-spike echo."
  - id: cave
    description: "Defeat the Aberrant Chrysalis in the cave."
    hint: "Go east from the Observatory into the cave tunnels. Find and defeat the Aberrant Chrysalis at the back."
  - id: warden
    description: "Report to the Basin Warden at the south gate."
    hint: "Return to the Basin Warden at Basin Gate, south of Town Square."
  - id: end
    description: "The Sanctum Trials are complete."
    hint: "Head south through the gate. The world of Gaius awaits you."

rewards:
  gold: 25
  player_message: >-
    The Basin Warden nods with quiet satisfaction.
    The gate swings open. The world of Gaius awaits you.
  skill_info: "map:1"

triggers:
  # ── AWAKENING RITE (Room 113) ─────────────────────────
  - event: room_enter
    room: 113
    conditions:
      missing: [1-start]
    actions:
      - grant: 1-start
      - grant: 1-mutation
      - give_mutation: true
      - give_gold: 10
      - sequence:
          delay_between: 0
          lines:
            - {speaker: 50, delay: 1, text: "Be still for a moment."}
            - {speaker: 50, delay: 3, text: "Type <ansi fg=\"command\">look</ansi> at any time to examine your surroundings. Type <ansi fg=\"command\">help</ansi> if you are unsure what commands are available -- there is documentation for most things."}
            - {speaker: 50, delay: 5, text: "You are newly arrived in Gaius. You may not yet understand what that means."}
            - {speaker: 50, delay: 7, text: "The world here is not like any world you have come from. Gaius is made of belief -- belief shapes the land, the creatures, the rules of cause and effect."}
            - {speaker: 50, delay: 9, text: "And it shapes people."}
            - {speaker: 50, delay: 10, text: "The Chrysalis has been cataloguing that shaping for four hundred years. We know what to expect. You may not."}
            - {speaker: 50, delay: 12, text: "The Chrysalis is the name we give to the form between what was and what will be. Every person who has passed through this hall was once standing where you are standing."}
            - {speaker: 50, delay: 15, text: "In Gaius, that becoming is not a metaphor. The body remembers stress, conflict, effort. Over time, it changes. We call these changes Mutations."}
            - {speaker: 50, delay: 17, text: "Every Mutation is the body saying yes to something. Yes to strength, yes to perception, yes to endurance. There are costs -- the Chrysalis does not lie about that -- but a Priest does not dwell on costs. We dwell on what you are becoming."}
            - {speaker: 50, delay: 19, text: "The first Mutation is always a gift -- or a warning. The Chrysalis performs the Awakening Rite to initiate it before the body does something unexpected on its own."}
            - {speaker: 50, delay: 21, emote: true, text: "steps forward and places two fingers lightly on your forehead. The air around you hums very quietly."}
            - {speaker: 50, delay: 23, emote: true, text: "withdraws their hand. The hum fades."}
            - {speaker: 50, delay: 24, text: "It has begun. You will feel the change over time -- in combat, in effort, in moments of stress. It is part of you now."}
            - {speaker: 50, delay: 26, text: "You can type <ansi fg=\"command\">mutations</ansi> at any time to see what the change has wrought."}
            - {speaker: 50, delay: 27, text: "Now. Before you leave this place, you have six trials to complete. Each instructor teaches a different skill."}
            - {speaker: 50, delay: 29, text: "First: visit the Merchant on Market Street, one step south of here. She will show you how commerce works here."}
            - {speaker: 50, delay: 30, text: "After that, find the Combat Trainer in the Training Yard -- go east, just beyond here. Then the Forge to the east, the Alchemist west of the well, the Wilderness Guide in the West Meadow, and finally the Elder at the Observatory above."}
            - {speaker: 50, delay: 32, text: "When all six are done, the Basin Warden at the south gate will let you pass. Type <ansi fg=\"command\">quest</ansi> at any time if you lose your place."}
            - {speaker: 50, delay: 34, text: "There is a map of the wider world set into the floor. Type <ansi fg=\"command\">look mosaic</ansi> to examine it before you leave."}

  # ── SHOPPING: BUY (Room 108) ──────────────────────────
  - event: command
    command: buy
    room: 108
    conditions:
      has: [1-mutation]
      missing: [1-shopping_buy]
    actions:
      - grant: 1-shopping_buy

  # ── SHOPPING: EQUIP (Room 108) ────────────────────────
  - event: command
    command: equip
    room: 108
    conditions:
      has: [1-shopping_buy]
      missing: [1-shopping_equip]
    actions:
      - grant: 1-shopping_equip

  # ── COMBAT: DEFEAT DUMMY (Room 114) ───────────────────
  - event: mob_death
    mob: 65
    conditions:
      has: [1-shopping_equip]
      missing: [1-combat_defeat]
    actions:
      - grant: 1-combat_defeat

  # ── CRAFTING: FORGE (Room 109) ────────────────────────
  - event: skill_use
    skill: blacksmithing
    room: 109
    conditions:
      has: [1-combat_defeat]
      missing: [1-crafting_craft]
    actions:
      - grant: 1-crafting_craft

  # ── ALCHEMY: BREW (Room 111) ──────────────────────────
  - event: skill_use
    skill: alchemy
    room: 111
    conditions:
      has: [1-crafting_craft]
      missing: [1-alchemy_craft]
    actions:
      - grant: 1-alchemy_craft

  # ── WILDERNESS: FORAGE (Room 106) ─────────────────────
  - event: skill_use
    skill: search
    room: 106
    conditions:
      has: [1-alchemy_craft]
      missing: [1-wilderness_forage]
    actions:
      - grant: 1-wilderness_forage

  # ── WILDERNESS: TRACK (Room 106) ──────────────────────
  - event: command
    command: track
    room: 106
    conditions:
      has: [1-wilderness_forage]
      missing: [1-wilderness_track]
    actions:
      - grant: 1-wilderness_track

  # ── MAGIC: CAST SPELL (Room 116) ──────────────────────
  - event: skill_use
    skill: spellcasting
    room: 116
    conditions:
      has: [1-wilderness_track]
      missing: [1-magic_cast]
    actions:
      - grant: 1-magic_cast

  # ── BOSS CAVE: DEFEAT ABERRANT (Room 120) ─────────────
  - event: mob_death
    mob: 69
    conditions:
      has: [1-magic_cast]
      missing: [1-cave]
    actions:
      - grant: 1-cave

  # ── WARDEN GATE (Room 102) ───────────────────────────
  - event: room_enter
    room: 102
    conditions:
      has: [1-cave]
      missing: [1-warden]
    actions:
      - sequence:
          delay_between: 0
          lines:
            - {speaker: 56, delay: 1, text: "Your record is complete. Six trials, six instructors -- and the cave."}
            - {speaker: 56, delay: 3, text: "The Basin Warden has one function: to ensure that no one leaves Sanctum Basin unprepared. You are prepared."}
            - {speaker: 56, delay: 4, text: "The gate is open. Whatever you find south of here -- remember what you learned in the basin."}
            - {speaker: 56, delay: 6, text: "One last thing: the world is larger than what six instructors can cover. Type <ansi fg=\"command\">help</ansi> to see what documentation is available -- there is more to learn out there than what we teach here."}
            - {speaker: 56, delay: 7, text: "The south road reaches Confluence within a day's walk. Follow the river north from there and you will find New Plymouth -- the largest settlement in this part of Gaius. That is where most people head first."}
            - {speaker: 56, delay: 9, emote: true, text: "steps aside and gestures toward the road south."}
          on_complete:
            - grant: 1-warden
            - grant: 1-end
            - unlock_exits: {room: 102}
