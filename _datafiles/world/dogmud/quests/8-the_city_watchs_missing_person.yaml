questid: 8
name: The City Watch's Missing Person
description: Guard Captain Velk needs someone to find a missing citizen named Elara,
  reported by her family. The family wants her returned. Elara wants to stay hidden.
  There is no clean answer.
secret: false

steps:
  - id: start
    description: "Guard Captain Velk at the barracks has asked you to locate a missing
      person -- a young woman named Elara, reported missing by her family. Search the
      residential wards north of the market for any sign of her."
    hint: "From the barracks, go south 1, then east 5 along Main Street, then north
      2 into the Residential Ward. Look for Elara there. Try speaking with her -- she
      may respond to calm, reassuring words."
  - id: found
    description: "You have found Elara hiding in the residential ward. She is running
      from an arranged marriage and does not want to be returned. You must decide what
      to tell the guard captain."
    hint: "Return to Captain Velk at the barracks. From the residential ward, go south
      2, then west 5, then north 1. Report what you found -- the choice of what to
      tell him is yours."
  - id: end
    description: "You reported back to Captain Velk. The case is closed, one way or
      another."

rewards:
  playermessage: "Velk listens to your report without interruption, his expression unreadable. When you finish, he makes a notation in the duty log. 'The case is closed. I will file it accordingly.' He does not ask for details beyond what you offered, and you get the sense that he has seen enough of these cases to know that the paperwork rarely captures the whole truth."
  roommessage: "Velk makes a notation in the duty log and files the report."
  gold: 15
  rep_faction: thornwall_guards
  rep_amount: 15
