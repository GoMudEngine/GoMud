# Quest 44 — First Casting (Pothole Coulee, Spoke E / Folding inner ring, cert)
#
# Token flow:
#   44-start — granted by Adept Grieve's cast_offer node (requires 30-end).
#   44-cast  — command trigger on `cast` in the Star Chamber (5305), where the
#              Practice Mote (9146) hangs as a target.
#   44-end   — granted by Grieve's cast_turnin node (needs 44-cast).
#
# Design: teach the `cast` command. The player casts a spell they already carry
# (conviction-spike) at the practice mote, then returns to Grieve for the Oak
# Staff focus + a spellcasting rank. The `cast` command Notify (added to
# skill.cast.go this chunk) fires 44-cast. New characters start with
# spellcasting rank 1 + conviction-spike, so the beat is reachable cold.

questid: 44
name: First Casting
description: >-
  Adept Grieve keeps the ruined observatory where the Folding-adepts once
  read the thin places, and the first turning of the mind waits in the Star
  Chamber. Cast a spell you already carry at the practice mark there.
secret: false

steps:
  - id: start
    map_target: 5305
    description: >-
      The Star Chamber is where you first turn the mind. Stand there and
      loose a spell you know at the practice mote -- conviction-spike, the
      attack you woke with, will serve. Adept Grieve keeps the observatory.
    hint: >-
      Go north into the Star Chamber. Type cast conviction-spike mote to
      loose your starting attack spell at the practice mote. Then return to
      Adept Grieve and type ask grieve done.
  - id: cast
    map_target: 5303
    description: >-
      You shaped a spell and loosed it at the mark. Return to Grieve in the
      Observatory Hall.
    hint: >-
      Report back to Adept Grieve in the Observatory Hall -- type ask grieve
      done.
  - id: end
    description: >-
      Grieve has named you a caster of the first and smallest sort. North of
      the ruin the grove waits, where a keeper named Orrin teaches the
      holding of a thought under pressure.

rewards:
  skillinfo: "spellcasting:1"
  itemid: 10018
  gold: 15
  playermessage: >-
    Grieve watches the mote take your spell and reknit, and something in his
    mismatched eyes settles. "There. You did not reach for it -- you let it
    go. That is the whole of it." He takes a long staff of pale oak from the
    wall and sets it in your hands; it is light, and the wood seems to lean
    toward the work. "A focus. It will not cast for you, but it will not
    fight you either. Remember the three channels -- the body's force, the
    mind's will, the heart's conviction. You loosed conviction just now.
    Willpower is the stat that shapes a spell, and the more of it you carry,
    the cleaner the fold. North, to the grove. Orrin will teach you to hold
    a casting while the world tries to knock it loose."
  roommessage: "Grieve presses a pale oak staff into the newcomer's hands."

triggers:
  # ── CAST: loose a spell at the practice mote (Star Chamber, 5305) ──────
  - event: command
    command: cast
    room: 5305
    conditions:
      has: ["44-start"]
      missing: ["44-cast"]
    actions:
      - grant: "44-cast"
      - send_text: >-
          Your spell leaves you and breaks against the mote in a flare of
          folded light; the mote draws inward and reknits, unharmed. That is
          casting -- will shaped to a purpose and let go. Return to Grieve in
          the hall below and tell him it is done.
