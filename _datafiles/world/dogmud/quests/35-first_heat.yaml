questid: 35
name: First Heat
description: >-
  The coulee smithy's forge, and Smith Rusk to judge your work. Buy
  an iron ingot and a leather strip from his stall, work them at the
  forge into an iron dagger, and bring the finished blade back to him.
secret: false
linear: true

steps:
  - id: start
    map_target: 5245
    description: "The forge is where iron learns its shape. Buy an iron
      ingot and a leather strip from Smith Rusk's stall, then type craft
      iron dagger at the forge."
    hint: "Type list at Rusk's stall to browse goods. Buy iron
      ingot and buy leather strip, then type craft iron dagger
      while standing at the forge."
  - id: craft
    map_target: 5245
    description: "You worked iron at the forge for the first time
      and turned raw materials into something that did not exist
      before. Bring it back to Rusk."
    hint: "Report to Smith Rusk -- type ask rusk done."
  - id: end
    description: "Rusk has looked the blade over and said nothing
      that was not a compliment. The coulee is your range now --
      head west to the talus slope and find Ovell."

rewards:
  skillinfo: "blacksmithing:1"
  gold: 15
  playermessage: >-
    Rusk takes the dagger and turns it slowly, checking the edge
    with one thumbnail. The grey forearm catches the forge light.
    After a moment he sets it back on the anvil and looks at you
    -- not at the blade, at you -- with the measuring expression
    of a man deciding whether a piece of iron is worth tempering.
    "Straight seam. Weight is forward where it belongs. You did
    not rush the quench." He presses coins into your hand with
    the finality of a door closing. "West path. Talus slope. Find
    Ovell. He pulled himself out of a cave-in and has been waiting
    for someone to notice. Do not make him wait longer."
  roommessage: "Rusk examines the dagger briefly, nods once, and
    presses a few coins into your hand."

triggers:
  # ── CRAFT AT THE FORGE (room 5245) ───────────────────────
  - event: command
    command: craft
    room: 5245
    conditions:
      has: ["35-start"]
      missing: ["35-craft"]
    actions:
      - grant: "35-craft"
      # Fires when crafting BEGINS (the craft command), so it must NOT
      # claim the blade is already in hand -- the forge takes a few rounds
      # (time_rounds: 3) to finish. The wield/inv teaching lives on the
      # recipe's success_message, which fires when the dagger actually
      # appears (recipes/blacksmithing/iron-dagger.yaml).
      - send_text: "You set to work at the forge. Give it a few moments --
          the iron has to take the heat and the shape both. When the
          finished blade is in your hands, bring it back to Rusk."

  # ── TURN IN BY GIVING THE BLADE ──────────────────────────
  # Alternate completion path to the `ask rusk done` dialogue node:
  # a player who does the intuitive thing and physically hands the
  # finished dagger to Rusk completes the quest too. We consume the
  # crafted blade and hand back a clean one so the newbie keeps a
  # weapon to wield (Equals compares UUID, so the returned dagger is
  # a distinct instance and give.go's post-consume RemoveItem is a
  # no-op). consume_item makes give.go take its consume branch, which
  # returns before the generic archetype "hands it back" emote — so
  # the turn-in reads cleanly.
  - event: item_give
    mob: 9116
    item: 10009
    conditions:
      has: ["35-craft"]
      missing: ["35-end"]
    actions:
      - send_text: "Rusk takes the blade, turns it once, checks the
          edge with a thumbnail, and presses it straight back into
          your hand. \"Yours. You made it.\""
      - consume_item: 10009
      - give_item: 10009
      - grant: "35-end"
