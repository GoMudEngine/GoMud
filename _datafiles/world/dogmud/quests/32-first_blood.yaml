questid: 32
name: First Blood
description: A cudgel, a training dummy, and Drillmaster Vorn's Drill Yard --
  learn the four pillars of combat there before you take your bruises
  somewhere they can kill you.
secret: false
linear: true

steps:
  - id: start
    map_target: 5227
    description: "Take your cudgel to the training dummy in the Drill
      Yard and learn by doing. Drillmaster Vorn keeps the yard."
    hint: "Type wield cudgel, then attack dummy to start your first
      fight."
  - id: strike
    map_target: 5227
    description: "You have traded blows with the training dummy and
      lived to tell it. The dummy did not fare as well."
    hint: "The dummy resets after it drops. On a fresh one, LEAD with
      kick dummy or trip dummy -- land the special before the killing blow."
  - id: special
    map_target: 5227
    description: "You landed a special move on the dummy. Kicks and
      trips are tools, not tricks -- use them when the moment is right."
    hint: "Type consider dummy to read your opponent before the next
      round."
  - id: consider
    map_target: 5227
    description: "You sized up the training dummy. Consider tells you
      what you are walking into before you commit."
    hint: "Tune your combat output -- type set combatverbosity full,
      medium, or light."
  - id: verbosity
    map_target: 5227
    description: "You have tuned your combat output. The Drill Yard
      has taught you what it can. Report to Vorn."
    hint: "Tell Vorn you are done -- type ask vorn report."
  - id: end
    description: "Drillmaster Vorn has signed off on your first bout.
      The cudgel has earned its first notch. Head east into the wash
      and find Caravan Guard Garve."

rewards:
  gold: 15
  skillinfo: "weapon-combat:1"
  playermessage: >-
    Vorn turns your performance over in his head for a long moment,
    the way a smith eyes a finished blade for flaws. Then he nods --
    once, short, like it costs him something. "Passable. You did not
    freeze, you did not panic, and you remembered to think between
    swings. That is more than most manage on the first day." He
    presses a few coins into your hand. "Take the east path into
    the wash. Find Garve. He will put that edge to use."
  roommessage: "Vorn nods at you with a gruff, brief approval."

triggers:
  # ── DUMMY DEFEATED (mob 9109) ─────────────────────────
  - event: mob_death
    mob: 9109
    conditions:
      has: ["32-start"]
      missing: ["32-strike"]
    actions:
      - grant: "32-strike"
      - send_text: "The training dummy shudders and goes still. Your
          arms remember the rhythm of it -- weight, angle, follow
          through. Now try something more deliberate: kick dummy or
          trip dummy."

  # ── SPECIAL MOVE: kick (room 5227) ────────────────────
  # command_issued (not command): credit the ATTEMPT, not a landed hit.
  # The dummy (mob 9109) is deliberately fragile (~15 vitality) so the
  # 32-strike kill is quick, which means auto-attack often drops the
  # respawned dummy before a kick/trip can land — leaving the player
  # whiffing "no target" repeatedly. Gating on the typed command teaches
  # the move without fighting the dummy's HP or a lucky crit.
  - event: command_issued
    command: kick
    conditions:
      has: ["32-start"]
      missing: ["32-special"]
    actions:
      - grant: "32-special"

  # ── SPECIAL MOVE: trip (room 5227) ────────────────────
  - event: command_issued
    command: trip
    conditions:
      has: ["32-start"]
      missing: ["32-special"]
    actions:
      - grant: "32-special"

  # ── CONSIDER (room 5227) ──────────────────────────────
  # command_issued: same reasoning as kick/trip — `consider dummy` needs a
  # live target, and the fragile dummy may be dead/mid-respawn when the
  # player types it. Credit the attempt. (combatverbosity below stays on
  # `command`: it is reached via `set combatverbosity`, which fires a
  # logical "combatverbosity" command event by hand — see set.go.)
  - event: command_issued
    command: consider
    conditions:
      has: ["32-start"]
      missing: ["32-consider"]
    actions:
      - grant: "32-consider"

  # ── COMBATVERBOSITY (room 5227) ───────────────────────
  - event: command
    command: combatverbosity
    conditions:
      has: ["32-start"]
      missing: ["32-verbosity"]
    actions:
      - grant: "32-verbosity"
