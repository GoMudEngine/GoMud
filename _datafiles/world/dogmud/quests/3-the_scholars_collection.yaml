questid: 3
name: The Scholar's Collection
description: A basin scholar has asked you to retrieve specimens from the tunnels below. Completing this quest will lock The Warren Compact.
secret: false

steps:
  - id: start
    description: "The basin scholar on the Observatory Path has asked you to retrieve a bone totem and a spore sac from the Labyrinth of Low Tunnels. These specimens will advance her research into Chrysalis mutation patterns."
    hint: "Bone totems can be found in the Carved Niche deep in the warren. Spore sacs drop from spore crawlers in the Fungal Hollow area."
  - id: totem
    description: "You delivered the bone totem. Now find a spore sac -- the swollen sacs on the backs of spore crawlers in the fungal areas of the tunnels."
    hint: "Spore crawlers inhabit the Fungal Hollow and nearby passages."
  - id: sac
    description: "You delivered the spore sac. Now find a bone totem -- the carved figurines kept on communal shelves deeper in the warren."
    hint: "Bone totems can be found in the Carved Niche deep in the warren."
  - id: end
    description: "You have delivered both specimens. The scholar's research will continue."

rewards:
  playermessage: "The scholar's eyes light up as she examines the specimens, turning the bone totem in her ink-stained fingers. She is already cataloguing, already theorizing. Whether the warren's inhabitants would consent to being studied this way does not appear to cross her mind."
  roommessage: "The basin scholar carefully packs the specimens into her satchel, already muttering notes to herself."
  gold: 20
  buffid: 4
