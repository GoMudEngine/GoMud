questid: 9
name: The Temple's Tithe Audit
description: Temple Priest Olen suspects merchants of under-paying their tithes. The
  merchants suspect the temple of inflating expenses. Both are right. Retrieve the
  tithe ledger and decide who sees it.
secret: false

steps:
  - id: start
    map_target: 476  # the Records Office — find the tithe ledger
    description: "Temple Priest Olen has asked you to investigate discrepancies in
      the tithe records. He suspects merchants in the market are under-reporting
      their income to avoid full tithes. Find the tithe ledger in the Records
      Office."
    hint: "Visit the Records Office north of Market Square. Search the shelves
      for the tithe ledger."
  - id: deliver
    map_target: 468  # Temple Priest Olen at the temple
    description: "You have the tithe ledger. Take it to Temple Priest Olen — the
      contents damn both the merchants and the temple."
    hint: "Return to Temple Priest Olen with the tithe ledger."
  - id: end
    description: "The tithe dispute is in other hands now. Neither side is
      entirely clean."

rewards:
  playermessage: "The ledger's contents are damning in both directions. Whoever
    receives it will use it to their advantage, and the other side will suffer
    for it. Or perhaps the public airing of both parties' dishonesty will force
    a more honest arrangement. In Thornwall, optimism is a luxury, but sometimes
    the truth is enough."
  roommessage: "The tithe ledger changes hands, and the balance of power shifts."
  gold: 12
  itemid: 27
  rep_faction: thornwall_citizens
  rep_amount: 15

triggers:
  # Ledger delivery to Olen via give command
  # Pick up the ledger in the Records Office -> advance to the deliver step.
  - event: item_gain
    item: 29
    conditions:
      has: ["9-start"]
      missing: ["9-deliver"]
    actions:
      - grant: "9-deliver"
  - event: item_give
    mob: 95
    item: 29
    conditions:
      has: ["9-deliver"]
      missing: ["9-end"]
    actions:
      - grant: "9-end"
      - npc_say:
          mob: 95
          lines:
            - {delay: 1, text: "Let me see that."}
            - {delay: 3, text: "Both sides. The merchants are under-paying, and
                our own expense records are... generous."}
            - {delay: 5, text: "Thank you for your honesty. This will not be
                pleasant, but it needed to come to light."}
