questid: 11
name: The Windwarden's Dilemma
description: A conflict is brewing on the Ironwind Steppe between a
  druid who guards the ancient stone circle and a Thornwall scholar
  who wants to extract rare crystal from beneath it. You must choose
  a side.
secret: false
steps:
  - id: start
    description: "Hermit Kael has told you about a conflict between
      Windwarden Sylara and Geomancer Rhett. Visit one of them to
      choose a side -- but choosing one means the other will not
      trust you. Sylara camps at the stone circle east of the
      ridge trail. Rhett is at the ridge approach to the northwest."
  - id: sylara
    description: "You have sided with Windwarden Sylara. She needs
      you to retrieve her carved wolf totem from the wolf kill
      ground to the southwest. Search the bone pile there."
  - id: rhett
    description: "You have sided with Geomancer Rhett. He needs
      windstone samples from the crystal veins on the rocky shelf
      to the north. Chip off a few chunks of pale blue crystal."
  - id: end
    description: "You have made your choice and completed the task.
      The consequences remain to be seen."
rewards:
  playermessage: "You have chosen your path. The steppe will
    remember."
  gold: 10
