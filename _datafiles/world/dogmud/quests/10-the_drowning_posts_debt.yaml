questid: 10
name: The Drowning Post's Debt
description: Tavern keeper Marek is being squeezed between city taxes and protection
  money demanded by back-alley thugs. A non-combat quest that opens a future sewer
  dungeon hook through the tavern's cellar.
secret: false

steps:
  - id: start
    description: "Tavern keeper Marek at the Drowning Post gave you a protection
      notice as evidence of the racket squeezing his business. Take it to Guard
      Captain Velk at the barracks."
    hint: "Bring the protection notice to Guard Captain Velk at the city
      barracks."
  - id: report
    description: "Guard Captain Velk has seen the evidence and will act on it.
      Return to Marek with the good news."
    hint: "Go back to the Drowning Post tavern and tell Marek the guard
      will handle the racket."
  - id: end
    description: "Marek's protection problem is in the hands of the city guard.
      The tax debt remains, but at least one boot is off his neck. The cellar,
      however, has its own secrets."

rewards:
  playermessage: "Marek pours you a drink on the house -- the good stuff, from
    the bottle he keeps behind the keg. 'The guard cannot fix the taxes, but at
    least I will not have to pay two masters. That is something.' He glances
    toward the cellar stairs. 'While you were gone, I heard noises down there
    again. Something in the old drainage tunnels beneath the city. I have been
    meaning to look, but...' He trails off. 'Another time, perhaps. For now,
    drink.'"
  roommessage: "Marek pours a drink with visible relief, some of the tension
    leaving his shoulders."
  gold: 10
  itemid: 28

triggers:
  # Notice delivery to Velk via give command
  - event: item_give
    mob: 94
    item: 30
    conditions:
      has: ["10-start"]
      missing: ["10-report"]
    actions:
      - grant: "10-report"
      - npc_say:
          mob: 94
          lines:
            - {delay: 1, text: "A protection notice? Let me see that."}
            - {delay: 3, text: "This is enough to act on. I will put a patrol
                on the back alleys and bring someone in for questioning."}
            - {delay: 5, text: "Tell the tavern keeper he can stop paying. The
                watch will handle this now."}
