questid: 13
name: The Prospector's Gambit
description: You have chosen to help Geomancer Rhett extract windstone
  from the ridge. The crystal could advance healing magic and protect
  Thornwall. Completing this quest locks The Warden's Covenant.
secret: false
steps:
  - id: start
    map_target: -1  # -1: return-to-giver / in-place (start room 3030); Phase 2 split review
    description: "Travel to Geomancer Rhett at the rocky shelf and
      help him begin the windstone extraction."
    hint: "Geomancer Rhett is at the Ridge Approach. From Thornwall's
      eastern gate, go east 7 times to reach him. Tell him you are
      ready to help with the extraction (ask about 'work' or 'gambit')."
  - id: extraction
    map_target: -1  # -1: return-to-giver / in-place (start room 3030); Phase 2 split review
    description: "Assist Rhett with the delicate extraction process.
      The crystal must be removed without shattering."
    hint: "Rhett is at the Ridge Approach (east 7 from Thornwall's
      eastern gate). Tell him you are ready to begin -- say 'ready'
      or 'begin' to start the extraction."
  - id: end
    description: "The extraction is complete. Rhett has the windstone
      he needs."
    hint: "The extraction is complete. Speak with Rhett at the Ridge
      Approach (east 7 from Thornwall's eastern gate) to finish."
rewards:
  playermessage: "Rhett grins broadly, cradling the extracted crystal
    like a newborn. He disappears into his work for hours, and when
    he emerges, he holds a shield of pale blue crystal -- the
    Windstone Aegis, forged in gratitude."
  roommessage: "Rhett emerges from his camp, grinning, and presents
    a shield of pale blue crystal to his companion."
  gold: 15
  itemid: 20053
