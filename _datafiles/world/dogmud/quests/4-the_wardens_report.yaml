questid: 4
name: The Warden's Report
description: Road Warden Tessara needs someone to investigate bandit activity south
  of her post and bring back evidence of their operations.
secret: false

steps:
  - id: start
    map_target: 408  # the Bandit Hollow (search the camp)
    description: "Road Warden Tessara at the Warden's Post on Dustwalk Road has asked\
      \ you to investigate a bandit camp in the gullies to the south. Search the\
      \ abandoned campsite and the hollow beyond for evidence of their operations."
    hint: "Head south from the Warden's Post along the Dustwalk Road to find the\
      \ bandit camp."

  - id: investigate
    map_target: 408  # the Bandit Hollow — find the purse here
    description: "You have reached the bandit camp. Search the Bandit Hollow for\
      \ evidence -- a purse containing incriminating documents should prove the\
      \ scope of their operation."
    hint: "Search the Bandit Hollow for evidence. Look around for anything the\
      \ bandits left behind."

  - id: evidence
    map_target: 405
    description: "You found the bandit's purse containing caravan schedules and\
      \ route information. Return to Road Warden Tessara at the Warden's Post\
      \ with this evidence."
    hint: "Return the bandit's purse to Road Warden Tessara at the Warden's Post\
      \ to the north."

  - id: end
    description: "You have delivered the evidence to Warden Tessara. The road\
      \ wardens will act on this intelligence."

rewards:
  playermessage: "Tessara examines the letter with a grim expression, then folds\
    \ it carefully into her report stack. 'This is exactly what I needed. Names,\
    \ routes, schedules -- the wardens at Watchers Crossing will want to see\
    \ this.' She reaches into a pouch and produces a clay token, pressing it\
    \ into your hand. 'You have earned this. Show it at any warden post and\
    \ you will be treated as a friend.'"
  roommessage: "Tessara nods to herself as she reads through the confiscated\
    \ documents, already composing her report."
  gold: 15
  itemid: 17

# Migrated 2026-07-21 from the legacy inline step-trigger format (type:/roomid:/
# grants: nested under steps), which the questengine does not process at runtime —
# the quest could be started but never advanced. Same chain, questengine format.
triggers:
  # start -> investigate: reach the bandit camp (Bandit Hollow, 408).
  - event: room_enter
    room: 408
    conditions:
      has: ["4-start"]
      missing: ["4-investigate"]
    actions:
      - grant: "4-investigate"

  # investigate -> evidence: pick up the bandit's purse (item 16).
  - event: item_gain
    item: 16
    conditions:
      has: ["4-investigate"]
      missing: ["4-evidence"]
    actions:
      - grant: "4-evidence"

  # evidence -> end: deliver the purse to Road Warden Tessara (mob 83).
  - event: item_give
    mob: 83
    item: 16
    conditions:
      has: ["4-evidence"]
      missing: ["4-end"]
    actions:
      - grant: "4-end"
      - npc_say:
          mob: 83
          lines:
            - {delay: 1, text: "Caravan schedules. Supply routes. This is not petty theft -- someone is feeding them information from inside the trading houses."}
            - {delay: 4, text: "This changes things. You have done good work. The Watchers will act on this."}
