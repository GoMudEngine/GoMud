# Quest 30 — The Awakening (Pothole Coulee hub, mandatory beat)
#
# Token flow:
#   30-start  — granted by Cleric Hadwen's dialogue (ask hadwen rite)
#   30-end    — granted by Hadwen's behavior tree at the close of the
#               rite sequence (behaviors/pothole_coulee/9100-*.yaml),
#               alongside grant_mutation.
# No quest-engine triggers needed; dialogue + btree own the beats.

questid: 30
name: The Awakening
description: Undergo the Awakening Rite at the pool in Pothole Coulee.
secret: false
linear: true

steps:
  - id: start
    description: "Cleric Hadwen will open the pool for you when you say you are ready."
    hint: "Stand at the Awakening Pool and type ask hadwen begin when you are ready."
  - id: end
    description: "The pool has opened you. The change is yours now."
    hint: "Type mutations to see what the pool woke in you. Hadwen can tell you more."

rewards:
  player_message: >-
    Something under your skin settles into place, the way silt settles
    in still water. You are not quite who you were when you arrived.
