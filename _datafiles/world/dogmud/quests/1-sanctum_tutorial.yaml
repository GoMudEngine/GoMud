questid: 1
name: The Sanctum Trials
description: Complete the trials of Sanctum Basin to earn passage to the wider world.
secret: false
steps:
  - id: arrive
    description: Speak with the Chrysalis Greeter in the Academy Hall.
    hint: Find the Academy Hall to the north of Well Court.
  - id: combat
    description: Complete combat training in the Training Yard.
    hint: The Training Yard is east of the Academy Hall.
  - id: crafting
    description: Learn to forge from the Blacksmith in the Forge.
    hint: The Forge is east of Market Street.
  - id: alchemy
    description: Learn basic alchemy from the Alchemist.
    hint: The Alchemist's Workshop is west of Well Court.
  - id: wilderness
    description: Learn foraging and tracking from the Wilderness Guide.
    hint: The Wilderness Guide can be found in the West Meadow.
  - id: magic
    description: Learn the basics of Fold casting from the Elder.
    hint: Elder Saris observes from the Observatory, reached via the western path.
  - id: graduate
    description: Present yourself to the Basin Warden and claim passage.
    hint: Return to the Basin Gate south of Town Square.
rewards:
  playermessage: "The Basin Warden nods with quiet satisfaction. The gate swings open. The world of Gaius awaits you."
  gold: 25
  experience: 500
  skillinfo: "map:1"
