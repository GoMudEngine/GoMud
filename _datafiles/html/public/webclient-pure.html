<!DOCTYPE html>
<html>
<head>
    <title>{{ .CONFIG.Server.MudName }} Web Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'DejaVu Sans Mono', monospace;
            display: flex;
            flex-direction: column;
            background-color: #191310;
            position: relative; /* So absolutely positioned children can be placed relative to <body> */
        }

        /* FLOATING CONNECT BUTTON IN THE CENTER */
        #connect-button {
            position: absolute;
            /* Center in viewport */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;

            padding: 18px 42px;
            font-family: var(--font-serif, Georgia, serif);
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;

            color: var(--vellum, #d9c39e);
            background-color: #4a6b5d;          /* oxidized copper */
            border: 1px solid var(--gold-rule, #c9a86a);
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            text-shadow: 0 1px 2px rgba(0,0,0,0.55);

            /* Flash copper → madder red */
            animation: pulse 1.2s infinite alternate;
        }
        #connect-button:disabled {
            color: var(--text-secondary, #9a8a6a);
            pointer-events: none;
            animation: none;
            background-color: #2a2018;
            border-color: var(--panel-border, #3a2a18);
            cursor: not-allowed;
        }
        @keyframes pulse {
            0%   { background-color: #4a6b5d; }   /* oxidized copper */
            100% { background-color: #8c3b30; }   /* madder root red */
        }

        /* Sound icon — small brass button living inside the session strip */
        #menu-icon {
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 24px;
            text-align: center;
            cursor: pointer;
            color: #3b2a10;
            border: 1px solid #5e431a;
            border-radius: 50%;
            background: radial-gradient(circle at 34% 26%, #f4dd92 0%, #cb9f42 46%, #8a6620 100%);
            box-shadow: 0 2px 3px rgba(0,0,0,0.55),
                        inset 0 1px 1px rgba(255,246,212,0.7),
                        inset 0 -2px 3px rgba(74,52,16,0.55);
            transition: filter .08s ease, transform .08s ease;
        }
        #menu-icon:hover { filter: brightness(1.08); }
        #menu-icon:active {
            transform: translateY(1px);
            box-shadow: 0 1px 1px rgba(0,0,0,0.4),
                        inset 0 2px 4px rgba(74,52,16,0.7),
                        inset 0 -1px 1px rgba(255,246,212,0.4);
        }

        /* The floating menu container */
        #floating-menu {
            position: absolute;
            top: 40px; /* just below the session strip */
            right: 10px;
            width: 450px;
            padding: 10px;
            background-color: #2e2e2e;
            border: 1px solid #444;
            border-radius: 5px;
            display: none; /* hidden by default */
            z-index: 9999;
        }
        #floating-menu h3 {
            color: #fff;
            margin-bottom: 10px;
        }

        .slider-container {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .slider-container label {
            color: #ccc;
            width: 150px;
        }
        .slider-container input[type="range"] {
            flex: 1;
            margin: 0 10px;
        }
        .slider-icon {
            width: 32px;
            text-align: center;
            font-size: 20px;
            color: #ccc;
        }

        /* Mute Checkbox */
        #mute-container {
            margin-bottom: 15px;
            color: #ccc;
            display: flex;
            align-items: center;
        }
        #mute-container label {
            cursor: pointer;
        }
        #mute-container input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2);
            cursor: pointer;
        }

        /* Command input inside cmd panel */
        #command-input {
            flex: 1;
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #3a2a18;
            background-color: #150f0a;
            color: #d2c3a4;
            border-radius: 3px;
            font-family: 'DejaVu Sans Mono', monospace;
        }
        #command-input:focus {
            outline: none;
            border-color: #cb9f42;
        }

        /* Comms panel: stack tabs + send input as a column */
        #panel-chat .dash-panel-body {
            display: flex;
            flex-direction: column;
        }
        #comm-output {
            flex: 1 1 auto;
            min-height: 0;
        }
        #chat-input {
            flex: 0 0 auto;
            margin-top: 5px;
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #3a2a18;
            background-color: #150f0a;
            color: #d2c3a4;
            border-radius: 3px;
            font-family: 'DejaVu Sans Mono', monospace;
            width: 100%;
            box-sizing: border-box;
            caret-color: #cb9f42;
        }
        #chat-input:focus {
            outline: none;
            border-color: #cb9f42;
        }

    </style>

    <link rel="stylesheet" href="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/css/xterm.css" />
    <link rel="stylesheet" href="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/css/gomud.css" />
    <link rel="stylesheet" href="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/css/dashboard.css" />
    <script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/xterm.4.19.0.js"></script>
    <script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/xterm-addon-fit.js"></script>
    <script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/mp3.js"></script>
    <script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/winbox.bundle.min.js"></script>
    <script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/gmcp.js"></script>
    <script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/item-icons.js"></script>
</head>
<body onLoad="init(); return false;">

    <!-- FLOATING MENU - MULTIPLE SLIDERS -->
    <div id="floating-menu">
        <h3>Volume Controls</h3>

        <div id="mute-container">
            <input type="checkbox" id="mute-checkbox" onchange="toggleMuteAll()">
            <label for="mute-checkbox"><span id="mute-icon">🔊</span> Mute All Sound</label>
        </div>

        <div id="sliders-container">
            <!-- Multiple sliders get built here -->
        </div>
    </div>

    <!-- CONNECT BUTTON FLOATED IN CENTER -->
    <button id="connect-button">Connect to {{ .CONFIG.Server.MudName }}</button>

    <!-- DOCKED DASHBOARD GRID (arrangement C) -->
    <div id="dashboard">
      <div id="dash-session">
        <span class="sess-name" id="sess-name">—</span>
        <span class="sess-conn" id="sess-conn">● Connected</span>
        <span class="sess-spacer"></span>
        <div id="menu-icon" onclick="toggleMenu()" title="Toggle sound">🔊</div>
        <button class="brass" id="btn-reconnect" onclick="reconnect()">Reconnect</button>
        <button class="brass" id="btn-reset-layout" onclick="window.Dashboard && Dashboard.resetLayout && Dashboard.resetLayout()">Reset layout</button>
      </div>

      <!-- LEFT column: Map · Vitals · Scene -->
      <div class="dash-col" id="dash-col-left">
        <section class="dash-panel" id="panel-map" data-panel="map">
          <div class="dash-panel-head"><span class="ph-title">Map</span>
            <span class="ph-btns"><span class="ph-btn ph-collapse">▾</span><span class="ph-btn ph-popout">⧉</span></span></div>
          <div class="dash-panel-body"><div id="map-render" style="width:100%;height:100%"></div></div>
        </section>

        <section class="dash-panel" id="panel-vitals" data-panel="vitals">
          <div class="dash-panel-head"><span class="ph-title">Vitals</span>
            <span class="ph-btns"><span class="ph-btn ph-collapse">▾</span><span class="ph-btn ph-popout">⧉</span></span></div>
          <div class="dash-panel-body"><div id="vitals-bars"></div></div>
        </section>

        <section class="dash-panel" id="panel-art" data-panel="art">
          <div class="dash-panel-head"><span class="ph-title">Inventory</span>
            <span class="ph-btns"><span class="ph-btn ph-collapse">▾</span><span class="ph-btn ph-popout">⧉</span></span></div>
          <div class="dash-panel-body">
            <div id="inv-tabs" class="inv-tabs">
              <button class="inv-tab brass active" data-tab="worn">Equipped</button>
              <button class="inv-tab brass" data-tab="bandolier">Bandolier</button>
              <button class="inv-tab brass" data-tab="components">Components</button>
              <button class="inv-tab brass" data-tab="backpack">Backpack</button>
            </div>
            <div id="inv-grid" class="inv-grid"></div>
          </div>
        </section>
      </div>

      <!-- CENTER column: Game Feed · Command -->
      <div class="dash-col" id="dash-col-center">
        <section class="dash-panel" id="panel-feed" data-panel="feed">
          <div class="dash-panel-head"><span class="ph-title">Game</span>
            <span class="ph-btns"><span class="ph-btn ph-popout">⧉</span></span></div>
          <div class="dash-panel-body"><div id="terminal"></div></div>
        </section>

        <section class="dash-panel" id="panel-cmd" data-panel="cmd">
          <div class="dash-panel-body">
            <input type="text" id="command-input" placeholder="Enter command..." style="flex:1">
          </div>
        </section>
      </div>

      <!-- RIGHT column: Comms · Status · Triggers -->
      <div class="dash-col" id="dash-col-right">
        <section class="dash-panel" id="panel-chat" data-panel="chat">
          <div class="dash-panel-head"><span class="ph-title">Comms</span>
            <span class="ph-btns"><span class="ph-btn ph-collapse">▾</span><span class="ph-btn ph-popout">⧉</span></span></div>
          <div class="dash-panel-body">
            <!-- COMM window (tabs) — moved from hidden div into chat panel -->
            <div id="comm-output" class="tabs">
              <div class="tab-buttons">
                <button id="comm-tab-say" class="tab-button active" data-tab="comm-say" data-label="Say" data-unread="0">Say</button>
                <button id="comm-tab-whisper" class="tab-button" data-tab="comm-whisper" data-label="Whisper" data-unread="0">Whisper</button>
                <button id="comm-tab-party" class="tab-button" data-tab="comm-party" data-label="Party" data-unread="0">Party</button>
                <button id="comm-tab-broadcast" class="tab-button" data-tab="comm-broadcast" data-label="Broadcasts" data-unread="0">Broadcasts</button>
              </div>
              <div class="tab-contents">
                <div id="comm-say" class="chat-window say tab-content active"></div>
                <div id="comm-whisper" class="chat-window whisper tab-content"></div>
                <div id="comm-party" class="chat-window party tab-content"></div>
                <div id="comm-broadcast" class="chat-window broadcast tab-content"></div>
              </div>
            </div>
            <input type="text" id="chat-input" placeholder="Say to the room…">
          </div>
        </section>

        <section class="dash-panel" id="panel-status" data-panel="status">
          <div class="dash-panel-head"><span class="ph-title">Status &amp; Conditions</span>
            <span class="ph-btns"><span class="ph-btn ph-collapse">▾</span><span class="ph-btn ph-popout">⧉</span></span></div>
          <div class="dash-panel-body"><div id="status-conditions"></div></div>
        </section>

        <section class="dash-panel dash-slot" id="panel-trig" data-panel="trig">
          <div class="dash-panel-head"><span class="ph-title">Triggers</span>
            <span class="ph-btns"><span class="ph-btn ph-collapse">▾</span><span class="ph-btn ph-popout">⧉</span></span></div>
          <div class="dash-panel-body">Triggers &amp; timers — coming soon</div>
        </section>
      </div>
    </div>

    <script>

        /////////////////////////////////////////////
        //
        // Music/Sound players:
        //
        /////////////////////////////////////////////
        let baseMp3Url = "";
        const MusicPlayer = new MP3Player(false);
        const SoundPlayer = new MP3Player(true);

        /////////////////////////////////////////////
        //
        // Terminal Setup
        //
        /////////////////////////////////////////////
        const term = new window.Terminal({
            cols: 80,
            rows: 60,
            cursorBlink: true,
            fontSize: 20,
            fontFamily: '"IBM Plex Mono", "Courier New", Courier, monospace',
            // Leather palette (harmonized "option B"). Cross-ref gomud.css :root
            // tokens: --panel-bg #201913, warm-dark #191310, --ink-gold #c9a86a,
            // title-gold #e8d2a0, --ink-deep #2b231d.
            theme: {
                background:   '#191310',
                foreground:   '#e0d2b2',
                cursor:       '#e8d2a0',
                cursorAccent: '#191310',
                selection:    'rgba(201,168,106,0.30)',
                black:   '#3a2f25', brightBlack:   '#6b5a48',
                red:     '#d6694e', brightRed:     '#e8745a',
                green:   '#8a9a4e', brightGreen:   '#b3c06a',
                yellow:  '#d9a441', brightYellow:  '#f0cf72',
                blue:    '#6f8fae', brightBlue:    '#93b0c9',
                magenta: '#a8678f', brightMagenta: '#c890b0',
                cyan:    '#5f9a93', brightCyan:    '#84c0b6',
                white:   '#d8c8a8', brightWhite:   '#f2e6c8'
            }
        });
        const fitAddon = new window.FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));

        // Auto-size the font so ~80 columns always fit the feed panel. All MUD
        // content is fixed-80 (room text + the inline ASCII minimap), so if the
        // terminal is < 80 cols it wraps and the minimap misaligns. Shrink the
        // font until >= 80 cols fit; grow it (capped) when there's spare room.
        function resizeTerminal() {
            if (!term || !fitAddon) return;
            var TARGET = 80, MIN_FS = 10, MAX_FS = 20, guard = 0;
            try {
                fitAddon.fit();
                while (term.cols < TARGET && term.getOption('fontSize') > MIN_FS && guard++ < 24) {
                    term.setOption('fontSize', term.getOption('fontSize') - 1);
                    fitAddon.fit();
                }
                while (term.cols > TARGET + 6 && term.getOption('fontSize') < MAX_FS && guard++ < 48) {
                    term.setOption('fontSize', term.getOption('fontSize') + 1);
                    fitAddon.fit();
                    if (term.cols < TARGET) { // grew one step too far — back off
                        term.setOption('fontSize', term.getOption('fontSize') - 1);
                        fitAddon.fit();
                        break;
                    }
                }
            } catch (e) {}
        }
        window.addEventListener('resize', resizeTerminal);
        // Re-fit whenever the feed panel itself changes size (grid reflow,
        // splitters, pop-out) so xterm tracks the bounded box and keeps its
        // row count sane. Without this the terminal can over-size and lag.
        if (window.ResizeObserver) {
            var _feedPanel = document.getElementById('panel-feed');
            if (_feedPanel) {
                var _rafFit = null;
                new ResizeObserver(function () {
                    if (_rafFit) cancelAnimationFrame(_rafFit);
                    _rafFit = requestAnimationFrame(resizeTerminal);
                }).observe(_feedPanel);
            }
        }
        requestAnimationFrame(resizeTerminal); // fit once after first grid paint
        resizeTerminal();

        /////////////////////////////////////////////
        //
        // Misc
        //
        /////////////////////////////////////////////
        let payloadsReceived = 0;
        let totalBytesReceived = 0;
        let payloadsSent = 0;
        let totalBytesSent = 0;
        let commandHistory = [];
        let historyPosition = 0;
        let commandHistoryMaxLength = 30;

        /////////////////////////////////////////////
        //
        // Map renderer — initialized unconditionally at startup
        //
        /////////////////////////////////////////////
        var gr = null;
        (function initMap() {
            var mapOptions = { cellSize: 80, cellMargin: 80, initialZoom: 0.5 };
            gr = new RoomGridSVG('#map-render', mapOptions);
        })();

        /////////////////////////////////////////////
        //
        // GMCP
        //
        /////////////////////////////////////////////
        let GMCPStructs = {};
        let allRooms = {
            currentZoneKey: "",
            roomZones: {},
        };
        let GMCPUpdateHandlers = {
            "Comm": function() {

                var obj = GMCPStructs["Comm"];
                if ( !obj.Channel ) {
                    return;
                }

                // Deliver message directly to the comm-output tabs in #panel-chat
                var channelName = obj.Channel.channel;
                var fromName    = obj.Channel.sender;
                var fromSource  = obj.Channel.source;
                var message     = obj.Channel.text;

                var tab   = document.getElementById("comm-tab-" + channelName);
                var panel = document.getElementById("comm-" + channelName);

                if (!tab || !panel) return;

                if ( tab.classList.contains('active') ) {
                    tab.dataset.unread = 0;
                    tab.innerText = tab.dataset.label;
                } else {
                    tab.dataset.unread = parseInt(tab.dataset.unread) + 1;
                    tab.innerText = tab.dataset.label + "(" + String(tab.dataset.unread) + ")";
                }

                // Build via DOM + textContent (never innerHTML) — fromName/
                // message/fromSource are player-controlled (stored-XSS otherwise).
                var srcClass = String(fromSource || '').replace(/[^a-z0-9_-]/gi, '');
                var p = document.createElement('p');
                var nameSpan = document.createElement('span');
                nameSpan.className = 'text-name ' + srcClass;
                nameSpan.textContent = (fromName != null ? fromName : '');
                var bodySpan = document.createElement('span');
                bodySpan.className = 'text-body ' + srcClass;
                bodySpan.textContent = (message != null ? message : '');
                p.appendChild(nameSpan);
                p.appendChild(document.createTextNode(': '));
                p.appendChild(bodySpan);
                panel.appendChild(p);

                // Trim overflow — cap at 200 messages per channel
                while (panel.childElementCount > 200) {
                    panel.removeChild(panel.firstElementChild);
                }

                // Auto-scroll the active channel
                if (tab.classList.contains('active')) {
                    panel.scrollTop = panel.scrollHeight;
                }

            },
            "Room": function() {

                var obj = GMCPStructs["Room"];
                if ( !obj.Info ) {
                    return;
                }

                if ( obj.Info ) {

                    var coords = obj.Info.coords.split(",");
                    for( var i=0; i<coords.length; i++ ) {
                        coords[i] = coords[i].trim();
                    }
                    var zoneName = coords[0];

                    var zoneKey = zoneName+"/z:"+coords[3];

                    if ( allRooms.currentZoneKey != zoneKey ) {
                        gr.reset();
                        allRooms.currentZoneKey = zoneKey;
                        if( !allRooms.roomZones[zoneKey] || !Array.isArray(allRooms.roomZones[zoneKey]) ) {
                            allRooms.roomZones[zoneKey] = [];
                        }
                        gr.setRooms(allRooms.roomZones[zoneKey]);
                    }

                    var r = {
                        RoomId: obj.Info.num,
                        Text: "",
                        x: parseInt(coords[1]),
                        y: parseInt(coords[2]),
                        z: parseInt(coords[3]),
                        Exits: [],
                    }

                    if ( obj.Info.Contents ) {

                        if ( obj.Info.Contents.Npcs ) {
                            for( var i in obj.Info.Contents.Npcs ) {
                                if ( obj.Info.Contents.Npcs[i].adjectives.indexOf("shop") != -1 ) {
                                    r.Color = "#AFE1AF"
                                    r.Text = "💰";
                                    break;
                                }
                            }
                        }

                    }

                    if ( obj.Info.details ) {

                        if ( obj.Info.details.indexOf("bank") != -1 ) {
                            r.Color = "#56d44a"
                            r.Text = "🏛️";
                        } else if ( obj.Info.details.indexOf("trainer") != -1 ) {
                            r.Color = "#fdd"
                            r.Text = "🧠";
                        } else if ( obj.Info.details.indexOf("storage") != -1 ) {
                            r.Color = "#a88100"
                            r.Text = "🗄️";
                        } else if ( obj.Info.details.indexOf("character") != -1 ) {
                            r.Color = "#757575"
                            r.Text = "👤";
                        }

                    }


                    for (var p in obj.Info.exitsv2 ) {
                        var exitInfo = obj.Info.exitsv2[p];
                        // Only add these rooms if there is no z delta, since it's a 2D rendering.
                        if ( exitInfo.dz == 0 ) {
                            r.Exits.push( { RoomId: exitInfo.num, x: exitInfo.dx+parseInt(coords[1]), y: exitInfo.dy+parseInt(coords[2]), Text: "" } );
                        }
                    }

                    allRooms.roomZones[zoneKey].push(r);
                    gr.addRoom(r);
                    gr.centerOnRoom(r.RoomId);
                }

            },
            "Char":function() {

                var obj = GMCPStructs["Char"];

                if ( obj.Vitals ) {
                    GMCPUpdateHandlers['Char.Vitals']();
                }

                // Populate session strip with character name when available
                if ( obj.Name ) {
                    var sessName = document.getElementById('sess-name');
                    if (sessName) sessName.textContent = obj.Name;
                }

                updateStatusPanel();

                // Refresh inventory panel if inventory data was bundled in this update
                if ( obj.Inventory ) {
                    renderInventory();
                }
            },
            "Char.Conditions": function() {
                updateStatusPanel();
            },
            "Char.Vitals": function() {
                updateVitalsWindow();
            },
            "Party": function() {
                updateVitalsWindow();
            },
            "Party.Vitals": function() {
                updateVitalsWindow();
            },
            "Zone.Map": function() {
                var obj = GMCPStructs["Zone"];
                if ( !obj || !obj.Map ) {
                    return;
                }
                if ( gr && gr.setZoneSnapshot ) {
                    gr.setZoneSnapshot(obj.Map.zone, obj.Map.rooms || [], obj.Map.cz || 0, obj.Map.party || []);
                    // Update map panel title if we can find it
                    var mapTitle = document.querySelector('#panel-map .ph-title');
                    if (mapTitle) mapTitle.textContent = 'Map (' + obj.Map.zone + ')';
                }
            },
            "Char.Inventory": function() {
                renderInventory();
            },
        };

        /////////////////////////////////////////////
        //
        // Inventory Panel
        //
        /////////////////////////////////////////////
        var invActiveTab = "worn";

        // Mutation slot-key prefixes / exact values that get the .mut label tint
        function invSlotIsMutation(slotKey) {
            var sk = slotKey || "";
            return sk.indexOf("extraarm") === 0 ||
                   sk.indexOf("extrawrist") === 0 ||
                   sk === "tail";
        }

        // Append a vertical charge meter to a tile when the item has charges.
        // usesMax > 1 means the item is a charged consumable; render a thin bar
        // on the left edge filled proportionally (anchored bottom = full).
        // Low charge (<= 25%) tints the fill red for at-a-glance urgency.
        function appendChargeMeter(tile, uses, usesMax) {
            if (!usesMax || usesMax <= 1) return;
            var pct = Math.min(100, Math.max(0, (uses / usesMax) * 100));
            var track = document.createElement("div");
            track.className = "inv-charge";
            var fill = document.createElement("div");
            fill.className = "inv-charge-fill";
            fill.style.height = pct + "%";
            if (pct <= 25) {
                fill.style.background = "#b94040"; // low-charge red
            }
            track.title = "Charges: " + uses + " / " + usesMax;
            track.appendChild(fill);
            tile.appendChild(track);
        }

        function renderInventory() {
            var inv = (GMCPStructs["Char"] || {}).Inventory;
            var grid = document.getElementById("inv-grid");
            if (!grid) return;

            // Clear previous content safely
            while (grid.firstChild) { grid.removeChild(grid.firstChild); }

            if (!inv) {
                var msg = document.createElement("div");
                msg.className = "inv-empty-msg";
                msg.textContent = "—";
                grid.appendChild(msg);
                return;
            }

            if (invActiveTab === "worn") {
                var worn = inv.Worn;
                if (!worn || !worn.length) {
                    var msg = document.createElement("div");
                    msg.className = "inv-empty-msg";
                    msg.textContent = "No equipped items.";
                    grid.appendChild(msg);
                    return;
                }
                var wornShown = 0;
                for (var i = 0; i < worn.length; i++) {
                    var entry = worn[i];
                    // Only show slots that actually hold an item — skip empty
                    // slots AND the "blocked" second slot of a two-handed weapon
                    // (both arrive as item:null), so the panel shows just what's
                    // equipped rather than a grid of open slots.
                    if (!entry.item) continue;
                    var item = entry.item;
                    wornShown++;

                    var cell = document.createElement("div");
                    cell.className = "inv-cell";

                    var tile = document.createElement("div");
                    tile.className = "inv-tile";
                    // Icon from trusted local map — innerHTML is safe here
                    var iconSVG = (typeof window.itemIconSVG === "function")
                        ? window.itemIconSVG(item.type, item.subtype)
                        : "";
                    if (iconSVG) tile.innerHTML = iconSVG;
                    tile.title = item.name || "";
                    // Data attributes for Task 8 action menu
                    tile.dataset.handle     = item.handle  || "";
                    tile.dataset.name       = item.name    || "";
                    tile.dataset.type       = item.type    || "";
                    tile.dataset.subtype    = item.subtype || "";
                    tile.dataset.collection = "worn";
                    tile.dataset.slotkey    = entry.slotKey || "";
                    appendChargeMeter(tile, item.uses || 0, item.usesMax || 0);

                    var slab = document.createElement("div");
                    slab.className = "inv-slab" + (invSlotIsMutation(entry.slotKey) ? " mut" : "");
                    slab.textContent = entry.slot || "";

                    cell.appendChild(tile);
                    cell.appendChild(slab);
                    grid.appendChild(cell);
                }
                if (wornShown === 0) {
                    var emptyW = document.createElement("div");
                    emptyW.className = "inv-empty-msg";
                    emptyW.textContent = "No equipped items.";
                    grid.appendChild(emptyW);
                }

            } else {
                // Bandolier / Components / Backpack tabs
                var containerMap = {
                    "bandolier":  { data: inv.Bandolier,    emptyMsg: "No bandolier equipped." },
                    "components": { data: inv.ComponentBag,  emptyMsg: "No component bag equipped." },
                    "backpack":   { data: inv.Backpack,      emptyMsg: "Backpack is empty." },
                };
                var cfg = containerMap[invActiveTab];
                if (!cfg || !cfg.data || !cfg.data.items || !cfg.data.items.length) {
                    var msg = document.createElement("div");
                    msg.className = "inv-empty-msg";
                    msg.textContent = (cfg && cfg.emptyMsg) ? cfg.emptyMsg : "Nothing here.";
                    grid.appendChild(msg);
                    return;
                }
                var rawItems = cfg.data.items;

                // Collapse identical items (same name + uses) into one tile with
                // an xN stack badge. Applies to backpack, bandolier, AND component
                // bag — all hold stackable identical items (potions, materials).
                var stackMap = {}; // key → { item, count }
                var stackOrder = [];
                for (var s = 0; s < rawItems.length; s++) {
                    var ri = rawItems[s];
                    var key = (ri.name || "") + "\x00" + (ri.uses || 0);
                    if (stackMap[key]) {
                        stackMap[key].count++;
                    } else {
                        stackMap[key] = { item: ri, count: 1 };
                        stackOrder.push(key);
                    }
                }
                var displayItems = [];
                for (var k = 0; k < stackOrder.length; k++) {
                    displayItems.push(stackMap[stackOrder[k]]);
                }

                for (var j = 0; j < displayItems.length; j++) {
                    var entry = displayItems[j];
                    var item  = entry.item;
                    var count = entry.count;
                    var cell = document.createElement("div");
                    cell.className = "inv-cell";

                    var tile = document.createElement("div");
                    tile.className = "inv-tile";
                    var iconSVG = (typeof window.itemIconSVG === "function")
                        ? window.itemIconSVG(item.type, item.subtype)
                        : "";
                    if (iconSVG) tile.innerHTML = iconSVG;
                    tile.title = item.name || "";
                    tile.dataset.handle     = item.handle  || "";
                    tile.dataset.name       = item.name    || "";
                    tile.dataset.type       = item.type    || "";
                    tile.dataset.subtype    = item.subtype || "";
                    tile.dataset.collection = invActiveTab;
                    tile.dataset.slotkey    = "";

                    // Charge meter (all container tabs — potions in bandolier have charges)
                    appendChargeMeter(tile, item.uses || 0, item.usesMax || 0);

                    // xN stack badge — any container tab, when N > 1
                    if (count > 1) {
                        var qty = document.createElement("span");
                        qty.className = "inv-qty";
                        qty.textContent = "x" + count;
                        tile.appendChild(qty);
                    }

                    cell.appendChild(tile);
                    grid.appendChild(cell);
                }
            }
        }

        function updateVitalsWindow() {
            var charObj = GMCPStructs["Char"];
            if ( !charObj || !charObj.Vitals ) return;

            // Compute self vitals from exact Char.Vitals data
            var v = charObj.Vitals;
            var selfName = charObj.Name || 'You';

            // Populate session strip name whenever we have it
            if (charObj.Name) {
                var sessName = document.getElementById('sess-name');
                if (sessName) sessName.textContent = charObj.Name;
            }

            var selfHp = Math.max(0, Math.min(100,
                Math.floor(v.hp / v.hp_max * 100)));
            var selfSp = Math.max(0, Math.min(100,
                Math.floor(v.stamina / v.stamina_max * 100)));
            var selfCp = Math.max(0, Math.min(100,
                Math.floor(v.conviction / v.conviction_max * 100)));

            // Current room title for same-room detection
            var selfRoom = '';
            if (GMCPStructs.Room && GMCPStructs.Room.Info) {
                selfRoom = GMCPStructs.Room.Info.name || '';
            }

            // Build ordered member list
            var members = []; // {name, hp, sp, cp, isSelf, isRemote}
            var partyObj = GMCPStructs["Party"];

            var vitals = (partyObj && partyObj.Vitals) ? partyObj.Vitals : {};

            if (partyObj && partyObj.Members && partyObj.Members.length > 0) {
                // Party exists — build ordered list (leader first)
                var leader = partyObj.Leader || '';

                // Leader first
                var ordered = [];
                if (leader) ordered.push(leader);
                for (var i = 0; i < partyObj.Members.length; i++) {
                    var mName = partyObj.Members[i].name;
                    if (mName !== leader) ordered.push(mName);
                }

                // Track which names are party members (vs companions)
                var partyMemberSet = {};
                for (var i = 0; i < ordered.length; i++) {
                    partyMemberSet[ordered[i]] = true;
                }

                // Append companion entries: in Vitals but not in party members
                for (var cName in vitals) {
                    if (!partyMemberSet[cName]) {
                        ordered.push(cName);
                    }
                }

                for (var i = 0; i < ordered.length; i++) {
                    var mName = ordered[i];
                    var isSelf = (mName === selfName);
                    var mVitals = vitals[mName];

                    var mHp, mSp, mCp, mRemote;
                    if (isSelf) {
                        // Use exact local data for self
                        mHp = selfHp;
                        mSp = selfSp;
                        mCp = selfCp;
                        mRemote = false;
                    } else if (mVitals) {
                        mHp = Math.max(0, Math.min(100,
                            mVitals.health || 0));
                        mSp = Math.max(0, Math.min(100,
                            mVitals.stamina || 0));
                        mCp = Math.max(0, Math.min(100,
                            mVitals.conviction || 0));
                        mRemote = (mVitals.location !== selfRoom);
                    } else {
                        mHp = 0; mSp = 0; mCp = 0;
                        mRemote = true;
                    }

                    members.push({
                        name: mName, hp: mHp, sp: mSp,
                        cp: mCp, isSelf: isSelf,
                        isRemote: mRemote
                    });
                }
            } else {
                // Solo — self first
                members.push({
                    name: selfName, hp: selfHp, sp: selfSp,
                    cp: selfCp, isSelf: true, isRemote: false
                });

                // Append any companion entries from Party.Vitals
                for (var cName in vitals) {
                    if (cName === selfName) continue;
                    var cVitals = vitals[cName];
                    var displayName = cVitals.name || cName;
                    if (displayName === selfName) continue;
                    members.push({
                        name: displayName,
                        hp: Math.max(0, Math.min(100, cVitals.health || 0)),
                        sp: Math.max(0, Math.min(100, cVitals.stamina || 0)),
                        cp: Math.max(0, Math.min(100, cVitals.conviction || 0)),
                        isSelf: false,
                        isRemote: (cVitals.location !== selfRoom)
                    });
                }
            }

            // Update DOM — target #vitals-bars inside #panel-vitals
            var container = document.getElementById('vitals-bars');
            var existingRows = container.querySelectorAll('.vitals-row');
            var existingByName = {};
            for (var i = 0; i < existingRows.length; i++) {
                existingByName[existingRows[i].dataset.name] = existingRows[i];
            }

            // Track which names are still valid
            var activeNames = {};
            for (var i = 0; i < members.length; i++) {
                var m = members[i];
                activeNames[m.name] = true;
                var existing = existingByName[m.name];
                if (existing) {
                    updateVitalsRow(existing, m.hp, m.sp, m.cp, m.isRemote);
                    // Update name class
                    var nameEl = existing.querySelector('.vitals-name');
                    if (nameEl) {
                        nameEl.className = 'vitals-name' +
                            (m.isSelf ? ' self' : '');
                    }
                } else {
                    var newRow = createVitalsRow(
                        m.name, m.hp, m.sp, m.cp,
                        m.isSelf, m.isRemote);
                    container.appendChild(newRow);
                }
            }

            // Remove rows for members no longer present
            for (var i = 0; i < existingRows.length; i++) {
                if (!activeNames[existingRows[i].dataset.name]) {
                    existingRows[i].remove();
                }
            }

            // Re-order rows to match members array
            var currentRows = container.querySelectorAll('.vitals-row');
            for (var i = 0; i < members.length; i++) {
                var expectedName = members[i].name;
                if (currentRows[i] &&
                    currentRows[i].dataset.name !== expectedName) {
                    var correctRow = container.querySelector(
                        '.vitals-row[data-name="' + expectedName + '"]');
                    if (correctRow) {
                        container.insertBefore(correctRow, currentRows[i]);
                        currentRows =
                            container.querySelectorAll('.vitals-row');
                    }
                }
            }
        }

        function handleGMCP(objNamespace, objBody) {


            var nameParts = objNamespace.split(".");
            var lastProperty = nameParts.pop();

            var cursor = GMCPStructs;

            for (let propertyName of nameParts) {

                if ( !cursor[propertyName] ) {
                    cursor[propertyName] = {};
                }

                cursor = cursor[propertyName];
            }

            cursor[lastProperty] = objBody;
            nameParts = objNamespace.split(".");
            for ( let i=nameParts.length-1; i>=0; i-- ) {
                var path = nameParts.slice(0, i+1).join(".");
                if ( GMCPUpdateHandlers[path] ) {
                    GMCPUpdateHandlers[path]();
                    return;
                }
            }

            console.log("GMCP (unhandled):", objNamespace, objBody);
        }
        function updateStatusPanel() {
            var container = document.getElementById('status-conditions');
            if (!container) return;

            var charObj = GMCPStructs["Char"] || {};

            // Build HTML into a fragment to replace in one shot
            var html = '';

            // Optional top line: name (Race Class)
            var charName = charObj.Name || '';
            var info = charObj.Info || null;
            if (charName || info) {
                var suffix = '';
                if (info && (info.race || info['class'])) {
                    var parts = [];
                    if (info.race)          parts.push(info.race);
                    if (info['class'])      parts.push(info['class']);
                    if (parts.length)       suffix = ' (' + parts.join(' ') + ')';
                }
                if (charName || suffix) {
                    html += '<div class="status-line">' +
                                escapeHTML(charName) + escapeHTML(suffix) +
                            '</div>';
                }
            }

            // Conditions area
            var conditions = charObj.Conditions || null;
            if (!conditions || !Array.isArray(conditions) || conditions.length === 0) {
                html += '<div class="status-empty">No active conditions.</div>';
            } else {
                html += '<div class="cond-chips">';
                for (var i = 0; i < conditions.length; i++) {
                    var cond = conditions[i];
                    if (!cond) continue;
                    var label    = escapeHTML(cond.type        || '');
                    var tooltip  = escapeHTML(cond.description || '');
                    var duration = escapeHTML(cond.duration    || '');
                    html += '<span class="cond-chip" title="' + tooltip + '">' +
                                label +
                                (duration ? '<span class="cond-dur">' + duration + '</span>' : '') +
                            '</span>';
                }
                html += '</div>';
            }

            container.innerHTML = html;
        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function handleWebclientCommand(cmdString) {
            const cmd = cmdString.substring(0, 9);
            if (cmd === "TEXTMASK:") {
                debugLog(cmdString);
                if (cmdString.substring(9) === "true") {
                    textInput.type = "password";
                } else {
                    textInput.type = "text";

        function reconnect() {
            // Close current socket if open, then trigger a fresh connect
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            // Show the connect button so user can click it, or reconnect immediately
            connectButton.style.display = 'block';
            connectButton.disabled = false;
            connectButton.click();
        }

        connectButton.addEventListener('click', () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
                return;
            }

            var wsProto = location.protocol === 'https:' ? 'wss://' : 'ws://';
            debugLog("Connecting to: " + wsProto+location.host +'/ws');
            socket = new WebSocket(wsProto+location.host +'/ws');

            socket.onopen = function() {
                term.writeln("Connected to the server!");
                term.clear();

                // Hide the button when connected
                connectButton.style.display = 'none';

                // We also disable it right away to prevent double-click confusion
                connectButton.disabled = true;

                // Update session strip connection indicator
                var sessConn = document.getElementById('sess-conn');
                if (sessConn) { sessConn.textContent = '● Connected'; sessConn.style.color = ''; }

                textInput.focus();
            };

            socket.onmessage = function(event) {
                payloadsReceived++;
                totalBytesReceived += event.data.length;

                // Check if it's a webclient command
                if (event.data.length > 9 && event.data.substring(8, 9) === ':') {
                    if (handleWebclientCommand(event.data)) {
                        return;
                    }
                }

                // MSP commands
                if (event.data.length > 9 && event.data.slice(0, 2) === "!!") {

                    // Handle incoming GMCP data
                    if (event.data.slice(0, 7) === "!!GMCP(") {
                        var gmcpPayload = event.data.trim().slice(7, event.data.length - 1).trim()
                        var jsonIndex = 0;

                        if ( gmcpPayload[gmcpPayload.length-1] == "}" ) jsonIndex = gmcpPayload.indexOf("{");
                        else jsonIndex = gmcpPayload.indexOf("[");

                        if ( jsonIndex == -1 ) {
                            return;
                        }
                        gmcpNamespace = gmcpPayload.slice(0, jsonIndex).trim();
                        //gmcpJSON = gmcpPayload.slice(jsonIndex, gmcpPayload.length).trim();
                        gmcpObject = JSON.parse(gmcpPayload.slice(jsonIndex, gmcpPayload.length).trim());

                        handleGMCP(gmcpNamespace, gmcpObject);

                        return;
                    }

                    // Handle music events
                    if (event.data.slice(0, 8) === "!!MUSIC(") {
                        const parts = event.data.slice(8, event.data.length - 1).split(" ");
                        let fileName = parts[0];
                        let obj = {};
                        for (let i = 1; i < parts.length; i++) {
                            const prop = parts[i].split("=");
                            if (prop.length == 2) {
                                obj[prop[0]] = prop[1];
                            }
                        }
                        if (fileName === "Off") {
                            if (obj.U) {
                                baseMp3Url = obj.U;
                                if (baseMp3Url[baseMp3Url.length - 1] !== "/") {
                                    baseMp3Url += "/";
                                }
                            } else {
                                MusicPlayer.stop();
                            }
                        } else {
                            let soundLevel = 1.0;
                            let loopMusic = true;

                            if (obj.L && obj.L !== "-1") {
                                loopMusic = false;
                            }
                            if (obj.V) {
                                soundLevel = Number(obj.V)/100;
                            }

                            if (!MusicPlayer.isPlaying(baseMp3Url + fileName)) {
                                MusicPlayer.play(baseMp3Url + fileName, loopMusic, soundLevel*(sliderValues["music"] / 100));
                            }
                        }

                        return;
                    }

                    // Handle a playersound event
                    if (event.data.slice(0, 8) === "!!SOUND(") {
                        const parts = event.data.slice(8, event.data.length - 1).split(" ");
                        let fileName = parts[0];
                        let obj = {};
                        for (let i = 1; i < parts.length; i++) {
                            const prop = parts[i].split("=");
                            if (prop.length == 2) {
                                obj[prop[0]] = prop[1];
                            }
                        }

                        if (fileName === "Off") {
                            if (obj.U) {
                                baseMp3Url = obj.U;
                                if (baseMp3Url[baseMp3Url.length - 1] !== "/") {
                                    baseMp3Url += "/";
                                }
                            } else {
                                SoundPlayer.stop();
                            }
                        } else {
                            let soundLevel = 1.0;
                            let loopSound = true;

                            if (obj.L && obj.L !== "-1") {
                                loopSound = false;
                            }
                            if (obj.V) {
                                soundLevel = Number(obj.V)/100;
                            }

                            const typeKey = (obj.T || "other").toLowerCase() + " sounds";
                            SoundPlayer.play(baseMp3Url + fileName, false, soundLevel*(sliderValues[typeKey] / 100));
                        }

                        return;
                    }

                }

                // Otherwise, just write to terminal
                term.write(event.data);
            };

            socket.onerror = function(error) {
                term.writeln("Error: " + error.message);
            };

            socket.onclose = function(event) {
                if (event.wasClean) {
                    term.writeln(`Connection closed cleanly, code=${event.code}, reason=${event.reason}`);
                } else {
                    term.writeln("Connection died");
                }
                // Show the button again when disconnected
                connectButton.style.display = 'block';
                connectButton.disabled = false;

                // Update session strip
                var sessConn = document.getElementById('sess-conn');
                if (sessConn) { sessConn.textContent = '○ Disconnected'; sessConn.style.color = '#a06060'; }

                if (textInput.type === "password") {
                    textInput.value = '';
                    textInput.type = "text";
                }
            };
        });

        textInput.addEventListener('keydown', function(event) {
            // Macro support: F-keys
            if (event.key.substring(0, 1) === "F" && event.key.length === 2) {
                let macroNum = event.key.substring(1);
                SendData("=" + macroNum);
                if (event.preventDefault) event.preventDefault();
                return false;
            }

            // ArrowUp / ArrowDown for command history
            if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
                if (event.key === 'ArrowUp') {
                    historyPosition += 1;
                } else {
                    historyPosition -= 1;
                }
                if (historyPosition < 1) historyPosition = 1;
                if (historyPosition > commandHistory.length) historyPosition = commandHistory.length;
                event.target.value = commandHistory[ commandHistory.length - historyPosition ];
            }

            // If input is empty, check for numeric keypad / arrow key shortcuts
            if ( textInput.value.length === 0 && codeShortcuts[event.code] ) {
                SendData(codeShortcuts[event.code]);
                if (event.preventDefault) event.preventDefault();
                return false;
            }

            // ENTER key
            if (event.key === 'Enter') {
                if (event.target.value !== '') {
                    if (textInput.type !== "password") {
                        commandHistory.push(event.target.value);
                        historyPosition = 0;
                        if (commandHistory.length > commandHistoryMaxLength) {
                            commandHistory = commandHistory.slice(commandHistory.length - commandHistoryMaxLength);
                        }
                    }
                }

                if ( event.target.value === "!net" ) {
                    printNetStats();
                    event.target.value = '';
                    return;
                }

                if ( SendData(event.target.value) ) {
                    event.target.value = '';
                } else {
                    term.writeln("Not connected to the server. Did you click the Connect button?");
                }
            }
        });

        function SendData(dataToSend) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                return false;
            }
            payloadsSent++;
            totalBytesSent += dataToSend.length;
            socket.send(dataToSend);
            return true;
        }

        function printNetStats() {
            term.writeln("");
            term.writeln(" Request Ct: " + String(payloadsSent));
            term.writeln(" Bytes Sent: " + String(Math.round(totalBytesSent/1024 * 100) / 100) + "kb");
            term.writeln("Response Ct: " + String(payloadsReceived));
            term.writeln(" Bytes Rcvd: " + String(Math.round(totalBytesReceived/1024 * 100) / 100) + "kb");
            term.writeln("");
        }

        function debugLog(message) {
            if (debugOutput) {
                console.log(message);
            }
        }

        // Keep focus on terminal if user clicks inside
        textOutput.addEventListener('mousedown', () => { isDragging = false; });
        textOutput.addEventListener('mousemove', () => { isDragging = true; });
        textOutput.addEventListener('mouseup', () => {
            const selectedText = window.getSelection().toString();
            if (!isDragging && !selectedText) {
                textInput.focus();
            }
            isDragging = false;
        });

        /////////////////////////////////////////////
        //
        // Volume Sliders + Mute
        //
        /////////////////////////////////////////////

        // 1) Define default sliders (and new ones if needed!)
        const defaultSliders = {
            "music": 75,
            "combat sounds": 75,
            "movement sounds": 75,
            "environment sounds": 75,
            "other sounds": 75,
        };

        // 2) We'll store final slider values
        let sliderValues = { ...defaultSliders };

        // 3) We'll also store unmuted slider values if user checks "Mute"
        let unmutedSliderValues = null;

        // Return speaker icon
        function getSpeakerIcon(value) {
            value = Number(value);
            if (value === 0) {
                return "🔇";
            } else if (value < 33) {
                return "🔈";
            } else if (value < 66) {
                return "🔉";
            } else {
                return "🔊";
            }
        }

        // Build the sliders from sliderValues
        function buildSliders() {
            const container = document.getElementById('sliders-container');
            container.innerHTML = "";

            Object.keys(sliderValues).forEach(function(key) {
                const wrapper = document.createElement('div');
                wrapper.className = "slider-container";

                const label = document.createElement('label');
                label.textContent = key.toLowerCase().split(' ').map(function(word) {
                    return word.charAt(0).toUpperCase() + word.slice(1);
                }).join(' ');

                const slider = document.createElement('input');
                slider.type = "range";
                slider.min = 0;
                slider.max = 100;
                slider.value = sliderValues[key];

                const iconSpan = document.createElement('span');
                iconSpan.className = "slider-icon";
                iconSpan.textContent = getSpeakerIcon(sliderValues[key]);

                // On slider change
                slider.addEventListener('input', function(e) {
                    const val = e.target.value;
                    sliderValues[key] = Number(val);
                    iconSpan.textContent = getSpeakerIcon(val);

                    // Update local storage
                    localStorage.setItem('sliderValues', JSON.stringify(sliderValues));

                    // Update music volume
                    MusicPlayer.setGlobalVolume(sliderValues["music"] / 100);

                    // If user moves any slider up from 0, uncheck Mute
                    const muteCheckbox = document.getElementById('mute-checkbox');
                    if (muteCheckbox.checked && val > 0) {
                        muteCheckbox.checked = false;
                        localStorage.setItem('muteAllSound', JSON.stringify(false));
                        document.getElementById('mute-icon').textContent = "🔊";
                    }
                });

                wrapper.appendChild(label);
                wrapper.appendChild(slider);
                wrapper.appendChild(iconSpan);
                container.appendChild(wrapper);
            });
        }

        // Handle Mute
        function toggleMuteAll() {
            const muteCheckbox = document.getElementById('mute-checkbox');
            const isChecked = muteCheckbox.checked;
            const muteIcon = document.getElementById('mute-icon');

            if (isChecked) {
                // Save the unmuted state
                unmutedSliderValues = { ...sliderValues };
                localStorage.setItem('unmutedSliderValues', JSON.stringify(unmutedSliderValues));

                // Set all to 0
                Object.keys(sliderValues).forEach(key => {
                    sliderValues[key] = 0;
                });
                localStorage.setItem('sliderValues', JSON.stringify(sliderValues));

                buildSliders();

                muteIcon.textContent = "🔇";
                MusicPlayer.setGlobalVolume(0);
                localStorage.setItem('muteAllSound', JSON.stringify(true));
            } else {
                // Restore from unmuted
                const savedUnmuted = localStorage.getItem('unmutedSliderValues');
                if (savedUnmuted) {
                    // Merge defaultSliders just in case new keys appear
                    let loadedUnmuted = JSON.parse(savedUnmuted) || {};
                    loadedUnmuted = { ...defaultSliders, ...loadedUnmuted };
                    unmutedSliderValues = { ...loadedUnmuted };

                    sliderValues = { ...unmutedSliderValues };
                    localStorage.setItem('sliderValues', JSON.stringify(sliderValues));
                }
                buildSliders();

                muteIcon.textContent = "🔊";
                MusicPlayer.setGlobalVolume(sliderValues["music"] / 100);
                localStorage.setItem('muteAllSound', JSON.stringify(false));
            }
        }

        // Show/hide the floating menu
        function toggleMenu() {
            const menu = document.getElementById('floating-menu');
            if (menu.style.display === "none" || menu.style.display === "") {
                menu.style.display = "block";
            } else {
                menu.style.display = "none";
            }
        }

        /////////////////////////////////////////////
        //
        // Initialization
        //
        /////////////////////////////////////////////
        const specialCommands = {
            "!net": "Print out network traffic stats"
        };

        function init() {
            console.log("%cterminal commands:", "font-weight:bold;");
            let longest = 0;
            for (let i in specialCommands) {
                if (i.length > longest) longest = i.length;
            }
            for (let i in specialCommands) {
                console.log("  " + i.padEnd(longest) + " - " + specialCommands[i]);
            }
            console.log("%cconsole commands:", "font-weight:bold;");

            // 1) Load from localStorage, if available
            const savedValues = localStorage.getItem('sliderValues');
            if (savedValues) {
                try {
                    // Merge existing local storage with defaultSliders
                    const loaded = JSON.parse(savedValues);
                    sliderValues = { ...defaultSliders, ...loaded };
                } catch (e) {
                    console.warn("Could not parse saved sliderValues, using defaults.");
                }
            } else {
                // If no localStorage, ensure we set the defaults
                localStorage.setItem('sliderValues', JSON.stringify(sliderValues));
            }

            // 2) Check if we have a "muteAllSound" property
            const savedMute = localStorage.getItem('muteAllSound');
            if (savedMute) {
                try {
                    const isMuted = JSON.parse(savedMute);
                    document.getElementById('mute-checkbox').checked = isMuted;
                } catch (e) {
                    console.warn("Could not parse muteAllSound, ignoring.");
                }
            }

            // 3) Build the sliders
            buildSliders();

            // 4) If currently muted, re-apply zero volumes
            const muteCheckbox = document.getElementById('mute-checkbox');
            const muteIcon = document.getElementById('mute-icon');

            if (muteCheckbox.checked) {
                // Possibly retrieve unmuted values from storage
                const savedUnmuted = localStorage.getItem('unmutedSliderValues');
                if (savedUnmuted) {
                    // Merge defaultSliders here, too
                    try {
                        let loadedUnmuted = JSON.parse(savedUnmuted) || {};
                        unmutedSliderValues = { ...defaultSliders, ...loadedUnmuted };
                    } catch(e) {
                        console.warn("Could not parse unmutedSliderValues.");
                    }
                }
                // Force all current sliders to 0
                Object.keys(sliderValues).forEach(key => {
                    sliderValues[key] = 0;
                });
                localStorage.setItem('sliderValues', JSON.stringify(sliderValues));
                buildSliders();

                muteIcon.textContent = "🔇";
                MusicPlayer.setGlobalVolume(0);
            } else {
                // If not muted, set music volume from slider
                MusicPlayer.setGlobalVolume(sliderValues["music"] / 100);
                muteIcon.textContent = "🔊";
            }

            // 5) Fit the terminal to its new panel container
            resizeTerminal();
        }
    </script>

    <script>
        // on DOM ready — wire comm tab buttons + chat send input
        document.addEventListener('DOMContentLoaded', () => {
            const buttons   = document.querySelectorAll('.tab-button');
            const panels    = document.querySelectorAll('.tab-content');
            const chatInput = document.getElementById('chat-input');

            const channelPlaceholders = {
                'say':       'Say to the room…',
                'whisper':   'Whisper: <name> <message>…',
                'party':     'Party chat…',
                'broadcast': 'Broadcast…'
            };

            // Return the active comm channel name (e.g. "say", "whisper", …)
            function activeCommChannel() {
                var active = document.querySelector('#comm-output .tab-button.active');
                if (!active) return 'say';
                // data-tab is "comm-say", "comm-whisper", etc.
                return active.dataset.tab.replace(/^comm-/, '');
            }

            function updateChatPlaceholder() {
                var ch = activeCommChannel();
                chatInput.placeholder = channelPlaceholders[ch] || (ch + '…');
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                const target = btn.dataset.tab;

                // deactivate all
                buttons.forEach(b => b.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));

                // activate the clicked one and its panel
                btn.classList.add('active');
                btn.dataset.unread = 0;
                btn.innerText = btn.dataset.label;
                document.getElementById(target).classList.add('active');

                // update send-input placeholder for the newly active channel
                updateChatPlaceholder();
                });
            });

            // Send on Enter — read active channel at send time (not captured at setup)
            chatInput.addEventListener('keydown', function(event) {
                if (event.key !== 'Enter') return;
                var text = chatInput.value.trim();
                if (!text) return;
                var ch = activeCommChannel();
                if (SendData(ch + ' ' + text)) {
                    chatInput.value = '';
                }
            });

            // Set initial placeholder (say tab is active by default)
            updateChatPlaceholder();
        });

        // ── Inventory right-click context menu ──────────────────────────────
        // Single shared menu element (created once, reused per open).
        (function() {
            var menu = null;

            function buildMenu() {
                var el = document.createElement("div");
                el.className = "inv-ctx";
                el.style.display = "none";
                document.body.appendChild(el);
                return el;
            }

            function closeMenu() {
                if (!menu) return;
                menu.style.display = "none";
                // Remove per-open listeners
                document.removeEventListener("click",   closeOnOutside, true);
                document.removeEventListener("keydown", closeOnEscape,  true);
                document.removeEventListener("scroll",  closeMenu,      true);
            }

            function closeOnOutside(e) {
                if (menu && !menu.contains(e.target)) closeMenu();
            }
            function closeOnEscape(e) {
                if (e.key === "Escape") closeMenu();
            }

            // Equippable item types — "equip @<handle>" for these
            var EQUIPPABLE_TYPES = {
                weapon: true, offhand: true,
                head: true, neck: true, shoulders: true, body: true,
                back: true, belt: true, gloves: true, wrist: true,
                ring: true, legs: true, feet: true, tail: true,
                componentbag: true
            };

            // Consumable item types → verb
            function consumeVerb(type, subtype) {
                if (type === "potion" || type === "drink" || subtype === "potion" || subtype === "drink") return "drink";
                if (type === "food"   || subtype === "food")   return "eat";
                return null;   // "use" is for items with explicit use-ability — omit generic
            }

            function makeRow(label, isDefault, onAction) {
                var row = document.createElement("div");
                row.className = "ctx-row" + (isDefault ? " ctx-default" : "");
                row.textContent = label;
                row.addEventListener("click", function() {
                    closeMenu();
                    onAction();
                });
                return row;
            }

            function openMenu(e, tile) {
                var handle = tile.dataset.handle;
                if (!handle) return;                   // guard: skip empty tiles
                var name       = tile.dataset.name       || "";
                var type       = (tile.dataset.type      || "").toLowerCase();
                var subtype    = (tile.dataset.subtype   || "").toLowerCase();
                var collection = (tile.dataset.collection || "");

                if (!menu) menu = buildMenu();

                // Clear previous rows
                while (menu.firstChild) menu.removeChild(menu.firstChild);

                // Header — item name as non-interactive label
                if (name) {
                    var hdr = document.createElement("div");
                    hdr.className = "ctx-header";
                    hdr.textContent = name;
                    menu.appendChild(hdr);
                }

                function send(verb) {
                    SendData(verb + " @" + handle);
                }

                // Look (always — default/highlighted)
                menu.appendChild(makeRow("Look", true,  function() { send("look"); }));

                // Identify (always — it's a spell, but @handle-targeted)
                menu.appendChild(makeRow("Identify", false, function() { send("cast identify"); }));

                if (collection === "worn") {
                    // Worn: offer Remove
                    var sep = document.createElement("div");
                    sep.className = "ctx-sep";
                    menu.appendChild(sep);
                    menu.appendChild(makeRow("Remove", false, function() { send("remove"); }));
                } else {
                    // Not worn: offer Equip if equippable
                    if (EQUIPPABLE_TYPES[type]) {
                        var sep2 = document.createElement("div");
                        sep2.className = "ctx-sep";
                        menu.appendChild(sep2);
                        menu.appendChild(makeRow("Equip", false, function() { send("equip"); }));
                    }
                    // Consumable?
                    var cv = consumeVerb(type, subtype);
                    if (cv) {
                        var sep3 = document.createElement("div");
                        sep3.className = "ctx-sep";
                        menu.appendChild(sep3);
                        menu.appendChild(makeRow(
                            cv.charAt(0).toUpperCase() + cv.slice(1), // Drink / Eat
                            false,
                            function() { send(cv); }
                        ));
                    }
                }

                // Drop (always, separator before it)
                var sepDrop = document.createElement("div");
                sepDrop.className = "ctx-sep";
                menu.appendChild(sepDrop);
                menu.appendChild(makeRow("Drop", false, function() { send("drop"); }));

                // Position: clamp to viewport
                menu.style.display = "block";
                var vw = window.innerWidth  || document.documentElement.clientWidth;
                var vh = window.innerHeight || document.documentElement.clientHeight;
                var mw = menu.offsetWidth;
                var mh = menu.offsetHeight;
                var x  = Math.min(e.clientX, vw - mw - 4);
                var y  = Math.min(e.clientY, vh - mh - 4);
                if (x < 0) x = 0;
                if (y < 0) y = 0;
                menu.style.left = x + "px";
                menu.style.top  = y + "px";

                // Attach close listeners
                document.addEventListener("click",   closeOnOutside, true);
                document.addEventListener("keydown", closeOnEscape,  true);
                document.addEventListener("scroll",  closeMenu,      true);
            }

            // Attach via event delegation on the inv-grid container
            document.addEventListener("contextmenu", function(e) {
                var tile = e.target.closest(".inv-tile[data-handle]");
                if (!tile || !tile.dataset.handle) return;
                e.preventDefault();
                openMenu(e, tile);
            });
        })();
        // ── End inventory context menu ───────────────────────────────────────
    </script>
