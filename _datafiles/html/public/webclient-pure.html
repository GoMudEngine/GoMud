    <script>
        // on DOM ready — wire comm tab buttons + chat send input
        document.addEventListener('DOMContentLoaded', () => {
            const buttons   = document.querySelectorAll('.tab-button');
            const panels    = document.querySelectorAll('.tab-content');
            const chatInput = document.getElementById('chat-input');

            const channelPlaceholders = {
                'say':       'Say to the room…',
                'whisper':   'Whisper: <name> <message>…',
                'party':     'Party chat…',
                'broadcast': 'Broadcast…'
            };

            // Return the active comm channel name (e.g. "say", "whisper", …)
            function activeCommChannel() {
                var active = document.querySelector('#comm-output .tab-button.active');
                if (!active) return 'say';
                // data-tab is "comm-say", "comm-whisper", etc.
                return active.dataset.tab.replace(/^comm-/, '');
            }

            function updateChatPlaceholder() {
                var ch = activeCommChannel();
                chatInput.placeholder = channelPlaceholders[ch] || (ch + '…');
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                const target = btn.dataset.tab;

                // deactivate all
                buttons.forEach(b => b.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));

                // activate the clicked one and its panel
                btn.classList.add('active');
                btn.dataset.unread = 0;
                btn.innerText = btn.dataset.label;
                document.getElementById(target).classList.add('active');

                // update send-input placeholder for the newly active channel
                updateChatPlaceholder();
                });
            });

            // Send on Enter — read active channel at send time (not captured at setup)
            chatInput.addEventListener('keydown', function(event) {
                if (event.key !== 'Enter') return;
                var text = chatInput.value.trim();
                if (!text) return;
                var ch = activeCommChannel();
                if (SendData(ch + ' ' + text)) {
                    chatInput.value = '';
                }
            });

            // Set initial placeholder (say tab is active by default)
            updateChatPlaceholder();
        });

        // ── Inventory right-click context menu ──────────────────────────────
        // Single shared menu element (created once, reused per open).
        (function() {
            var menu = null;

            function buildMenu() {
                var el = document.createElement("div");
                el.className = "inv-ctx";
                el.style.display = "none";
                document.body.appendChild(el);
                return el;
            }

            function closeMenu() {
                if (!menu) return;
                menu.style.display = "none";
                // Remove per-open listeners
                document.removeEventListener("click",   closeOnOutside, true);
                document.removeEventListener("keydown", closeOnEscape,  true);
                document.removeEventListener("scroll",  closeMenu,      true);
            }

            function closeOnOutside(e) {
                if (menu && !menu.contains(e.target)) closeMenu();
            }
            function closeOnEscape(e) {
                if (e.key === "Escape") closeMenu();
            }

            // Equippable item types — "equip @<handle>" for these
            var EQUIPPABLE_TYPES = {
                weapon: true, offhand: true,
                head: true, neck: true, shoulders: true, body: true,
                back: true, belt: true, gloves: true, wrist: true,
                ring: true, legs: true, feet: true, tail: true,
                componentbag: true
            };

            // Consumable item types → verb
            function consumeVerb(type, subtype) {
                if (type === "potion" || type === "drink" || subtype === "potion" || subtype === "drink") return "drink";
                if (type === "food"   || subtype === "food")   return "eat";
                return null;   // "use" is for items with explicit use-ability — omit generic
            }

            function makeRow(label, isDefault, onAction) {
                var row = document.createElement("div");
                row.className = "ctx-row" + (isDefault ? " ctx-default" : "");
                row.textContent = label;
                row.addEventListener("click", function() {
                    closeMenu();
                    onAction();
                });
                return row;
            }

            function openMenu(e, tile) {
                var handle = tile.dataset.handle;
                if (!handle) return;                   // guard: skip empty tiles
                var name       = tile.dataset.name       || "";
                var type       = (tile.dataset.type      || "").toLowerCase();
                var subtype    = (tile.dataset.subtype   || "").toLowerCase();
                var collection = (tile.dataset.collection || "");

                if (!menu) menu = buildMenu();

                // Clear previous rows
                while (menu.firstChild) menu.removeChild(menu.firstChild);

                // Header — item name as non-interactive label
                if (name) {
                    var hdr = document.createElement("div");
                    hdr.className = "ctx-header";
                    hdr.textContent = name;
                    menu.appendChild(hdr);
                }

                function send(verb) {
                    SendData(verb + " @" + handle);
                }

                // Look (always — default/highlighted)
                menu.appendChild(makeRow("Look", true,  function() { send("look"); }));

                // Identify (always — it's a spell, but @handle-targeted)
                menu.appendChild(makeRow("Identify", false, function() { send("cast identify"); }));

                if (collection === "worn") {
                    // Worn: offer Remove
                    var sep = document.createElement("div");
                    sep.className = "ctx-sep";
                    menu.appendChild(sep);
                    menu.appendChild(makeRow("Remove", false, function() { send("remove"); }));
                } else {
                    // Not worn: offer Equip if equippable
                    if (EQUIPPABLE_TYPES[type]) {
                        var sep2 = document.createElement("div");
                        sep2.className = "ctx-sep";
                        menu.appendChild(sep2);
                        menu.appendChild(makeRow("Equip", false, function() { send("equip"); }));
                    }
                    // Consumable?
                    var cv = consumeVerb(type, subtype);
                    if (cv) {
                        var sep3 = document.createElement("div");
                        sep3.className = "ctx-sep";
                        menu.appendChild(sep3);
                        menu.appendChild(makeRow(
                            cv.charAt(0).toUpperCase() + cv.slice(1), // Drink / Eat
                            false,
                            function() { send(cv); }
                        ));
                    }
                }

                // Drop (always, separator before it)
                var sepDrop = document.createElement("div");
                sepDrop.className = "ctx-sep";
                menu.appendChild(sepDrop);
                menu.appendChild(makeRow("Drop", false, function() { send("drop"); }));

                // Position: clamp to viewport
                menu.style.display = "block";
                var vw = window.innerWidth  || document.documentElement.clientWidth;
                var vh = window.innerHeight || document.documentElement.clientHeight;
                var mw = menu.offsetWidth;
                var mh = menu.offsetHeight;
                var x  = Math.min(e.clientX, vw - mw - 4);
                var y  = Math.min(e.clientY, vh - mh - 4);
                if (x < 0) x = 0;
                if (y < 0) y = 0;
                menu.style.left = x + "px";
                menu.style.top  = y + "px";

                // Attach close listeners
                document.addEventListener("click",   closeOnOutside, true);
                document.addEventListener("keydown", closeOnEscape,  true);
                document.addEventListener("scroll",  closeMenu,      true);
            }

            // Attach via event delegation on the inv-grid container
            document.addEventListener("contextmenu", function(e) {
                var tile = e.target.closest(".inv-tile[data-handle]");
                if (!tile || !tile.dataset.handle) return;
                e.preventDefault();
                openMenu(e, tile);
            });
        })();
        // ── End inventory context menu ───────────────────────────────────────

        /////////////////////////////////////////////
        //
        // Automation Modal — reusable overlay editor
        //
        /////////////////////////////////////////////
        (function() {
            var _onSave = null;

            // Build the modal DOM once (it lives in the document at all times, hidden)
            var modal    = document.getElementById("auto-modal");
            var scrim    = modal.querySelector(".auto-scrim");
            var bodySlot = modal.querySelector(".auto-modal-body");
            var titleEl  = modal.querySelector(".auto-modal-title");
            var saveBtn  = modal.querySelector(".auto-modal-save");
            var cancelBtn= modal.querySelector(".auto-modal-cancel");

            function doClose() {
                modal.style.display = "none";
                // Clear body slot safely
                while (bodySlot.firstChild) bodySlot.removeChild(bodySlot.firstChild);
                _onSave = null;
            }

            function doSave() {
                if (typeof _onSave === "function") _onSave();
                doClose();
            }

            scrim.addEventListener("click",   doClose);
            cancelBtn.addEventListener("click", doClose);
            saveBtn.addEventListener("click",   doSave);
            document.addEventListener("keydown", function(e) {
                if (e.key === "Escape" && modal.style.display !== "none") doClose();
            });

            // Public API — attached to window so Task 7 code can call it
            window.openAutoModal  = function(title, bodyEl, onSave) {
                titleEl.textContent = title;
                while (bodySlot.firstChild) bodySlot.removeChild(bodySlot.firstChild);
                bodySlot.appendChild(bodyEl);
                _onSave = onSave;
                modal.style.display = "flex";
                // Focus first input/textarea if present
                var first = bodyEl.querySelector("input,textarea,select");
                if (first) { setTimeout(function() { first.focus(); }, 50); }
            };
            window.closeAutoModal = doClose;
        })();

        /////////////////////////////////////////////
        //
        // Automation right-click context menu
        //
        /////////////////////////////////////////////
        (function() {
            var menu = null;

            function buildMenu() {
                var el = document.createElement("div");
                el.className = "auto-ctx";
                el.style.display = "none";
                document.body.appendChild(el);
                return el;
            }

            function closeMenu() {
                if (!menu) return;
                menu.style.display = "none";
                document.removeEventListener("click",   closeOnOutside, true);
                document.removeEventListener("keydown", closeOnEscape,  true);
                document.removeEventListener("scroll",  closeMenu,      true);
            }

            function closeOnOutside(e) {
                if (menu && !menu.contains(e.target)) closeMenu();
            }
            function closeOnEscape(e) {
                if (e.key === "Escape") closeMenu();
            }

            function makeCtxRow(label, isDefault, onAction) {
                var row = document.createElement("div");
                row.className = "ctx-row" + (isDefault ? " ctx-default" : "");
                row.textContent = label;
                row.addEventListener("click", function() {
                    closeMenu();
                    onAction();
                });
                return row;
            }

            function openMenu(e, autoRow) {
                var type = autoRow.dataset.autoType;
                var key  = autoRow.dataset.autoKey;
                var cmd  = autoRow.dataset.autoCmd;
                if (!type || !key) return;

                if (!menu) menu = buildMenu();
                while (menu.firstChild) menu.removeChild(menu.firstChild);

                // Header — key as non-interactive label
                var hdr = document.createElement("div");
                hdr.className = "ctx-header";
                hdr.textContent = key;
                menu.appendChild(hdr);

                // Edit
                menu.appendChild(makeCtxRow("Edit", true, function() {
                    // Dispatched to Task 7 handler
                    if (typeof window.autoEditRow === "function") window.autoEditRow(type, key, cmd);
                }));

                var sep1 = document.createElement("div");
                sep1.className = "ctx-sep";
                menu.appendChild(sep1);

                // Duplicate
                menu.appendChild(makeCtxRow("Duplicate", false, function() {
                    if (typeof window.autoDuplicateRow === "function") window.autoDuplicateRow(type, key, cmd);
                }));

                var sep2 = document.createElement("div");
                sep2.className = "ctx-sep";
                menu.appendChild(sep2);

                // Remove
                menu.appendChild(makeCtxRow("Remove", false, function() {
                    if (typeof window.autoRemoveRow === "function") window.autoRemoveRow(type, key);
                }));

                // Position: clamp to viewport
                menu.style.display = "block";
                var vw = window.innerWidth  || document.documentElement.clientWidth;
                var vh = window.innerHeight || document.documentElement.clientHeight;
                var mw = menu.offsetWidth;
                var mh = menu.offsetHeight;
                var x  = Math.min(e.clientX, vw - mw - 4);
                var y  = Math.min(e.clientY, vh - mh - 4);
                if (x < 0) x = 0;
                if (y < 0) y = 0;
                menu.style.left = x + "px";
                menu.style.top  = y + "px";

                document.addEventListener("click",   closeOnOutside, true);
                document.addEventListener("keydown", closeOnEscape,  true);
                document.addEventListener("scroll",  closeMenu,      true);
            }

            // Delegation on #auto-list — covers both chip and row element types
            document.addEventListener("contextmenu", function(e) {
                var row = e.target.closest(".auto-chip[data-auto-type], .auto-row[data-auto-type]");
                if (!row) return;
                e.preventDefault();
                openMenu(e, row);
            });
        })();
        // ── End automation context menu ──────────────────────────────────────

        /////////////////////////////////////////////
        //
        // Automation Editors — Macro & Alias add/edit/remove/duplicate
        //
        /////////////////////////////////////////////
        (function() {

            // Wire modal ✕ close button (added in modal HTML above)
            var xBtn = document.getElementById("auto-modal-x");
            if (xBtn) xBtn.addEventListener("click", function() {
                if (typeof window.closeAutoModal === "function") window.closeAutoModal();
            });

            // ── Helpers ────────────────────────────────────────────────────

            // Build a labeled field group
            function makeField(labelText, inputEl) {
                var wrap = document.createElement("div");
                wrap.className = "auto-field";
                var lbl = document.createElement("label");
                lbl.textContent = labelText;
                wrap.appendChild(lbl);
                wrap.appendChild(inputEl);
                return wrap;
            }

            // Get the next free macro number (1-9) not already in use
            function nextFreeMacroNum(excludeNum) {
                var a = GMCPStructs["Char"] && GMCPStructs["Char"].Automation;
                var used = {};
                if (a && a.macros) {
                    for (var i = 0; i < a.macros.length; i++) {
                        var n = parseInt((a.macros[i].key || "").replace(/^=/, ""), 10);
                        if (!isNaN(n) && n !== excludeNum) used[n] = true;
                    }
                }
                for (var n = 1; n <= 9; n++) {
                    if (!used[n]) return n;
                }
                return 1; // fallback — all taken, default to 1
            }

            // ── Macro editor ───────────────────────────────────────────────

            function openMacroEditor(prefillNum, prefillCmd) {
                var body = document.createElement("div");
                body.style.cssText = "display:flex;flex-direction:column;gap:10px;";

                var numInput = document.createElement("input");
                numInput.type = "number";
                numInput.min  = "1";
                numInput.max  = "9";
                numInput.value = prefillNum || "";
                numInput.placeholder = "1–9";

                var cmdInput = document.createElement("textarea");
                cmdInput.value = prefillCmd || "";
                cmdInput.placeholder = "e.g. get all;wield sword";
                cmdInput.rows = 3;

                body.appendChild(makeField("Macro Number (1–9)", numInput));
                body.appendChild(makeField("Commands (semicolon-separated)", cmdInput));

                openAutoModal("Macro Editor", body, function() {
                    var num = parseInt(numInput.value, 10);
                    if (isNaN(num) || num < 1 || num > 9) {
                        alert("Please enter a number between 1 and 9.");
                        return;
                    }
                    var cmds = cmdInput.value.trim();
                    // 'set =N commands' — empty cmds string deletes the macro
                    SendData("set =" + num + " " + cmds);
                });
            }

            // ── Alias editor ───────────────────────────────────────────────

            function openAliasEditor(prefillName, prefillCmd) {
                var body = document.createElement("div");
                body.style.cssText = "display:flex;flex-direction:column;gap:10px;";

                var nameInput = document.createElement("input");
                nameInput.type  = "text";
                nameInput.value = prefillName || "";
                nameInput.placeholder = "e.g. kk";

                var cmdInput = document.createElement("input");
                cmdInput.type  = "text";
                cmdInput.value = prefillCmd || "";
                cmdInput.placeholder = "e.g. kick goblin";

                body.appendChild(makeField("Alias Name", nameInput));
                body.appendChild(makeField("Expands To", cmdInput));

                openAutoModal("Alias Editor", body, function() {
                    var name = nameInput.value.trim();
                    if (!name) {
                        alert("Alias name cannot be empty.");
                        return;
                    }
                    var cmd = cmdInput.value.trim();
                    // 'alias name=command' — empty command deletes the alias
                    SendData("alias " + name + "=" + cmd);
                });
            }

            // ── Tick editor ────────────────────────────────────────────────

            function openTickEditor(editingId, prefillName, prefillCmds, prefillInterval, prefillEnabled) {
                var body = document.createElement("div");
                body.style.cssText = "display:flex;flex-direction:column;gap:10px;";

                var nameInput = document.createElement("input");
                nameInput.type  = "text";
                nameInput.value = prefillName || "";
                nameInput.placeholder = "e.g. sip health";

                var cmdsInput = document.createElement("textarea");
                cmdsInput.value = prefillCmds || "";
                cmdsInput.placeholder = "e.g. drink health;drink mana";
                cmdsInput.rows = 3;

                var secsInput = document.createElement("input");
                secsInput.type  = "number";
                secsInput.min   = "1";
                secsInput.value = prefillInterval != null ? String(prefillInterval) : "30";
                secsInput.placeholder = "30";

                // Enabled toggle — a visual .auto-tog that also writes to a hidden checkbox
                var enableWrap = document.createElement("div");
                enableWrap.style.cssText = "display:flex;align-items:center;gap:8px;";
                var enableTog = document.createElement("span");
                var enabledState = (prefillEnabled !== false); // default on for new ticks
                enableTog.className = "auto-tog" + (enabledState ? " on" : "");
                enableTog.style.cursor = "pointer";
                enableTog.addEventListener("click", function() {
                    enabledState = !enabledState;
                    enableTog.classList.toggle("on", enabledState);
                });
                var enableLabel = document.createElement("span");
                enableLabel.textContent = "Enabled";
                enableLabel.style.cssText = "font-family:Georgia,serif;font-size:0.85em;color:#c8b98a;";
                enableWrap.appendChild(enableTog);
                enableWrap.appendChild(enableLabel);

                body.appendChild(makeField("Name", nameInput));
                body.appendChild(makeField("Commands (semicolon-separated)", cmdsInput));
                body.appendChild(makeField("Every N seconds", secsInput));
                body.appendChild(enableWrap);

                var title = editingId ? "Edit Tick" : "New Tick";
                openAutoModal(title, body, function() {
                    var name = nameInput.value.trim();
                    if (!name) {
                        alert("Tick name cannot be empty.");
                        return;
                    }
                    var cmds = cmdsInput.value.trim();
                    var secs = Math.max(1, parseInt(secsInput.value, 10) || 1);
                    SendGMCP("Char.Automation.Set", {
                        kind: "tick",
                        id: editingId || 0,
                        name: name,
                        commands: cmds,
                        intervalSec: secs,
                        enabled: enabledState
                    });
                    // Modal infrastructure calls doClose() after this callback returns
                });
            }

            // Lookup a tick by id from GMCPStructs (returns null if not found)
            function findTick(id) {
                var a = GMCPStructs["Char"] && GMCPStructs["Char"].Automation;
                if (!a || !a.ticks) return null;
                for (var i = 0; i < a.ticks.length; i++) {
                    if (a.ticks[i].id === id) return a.ticks[i];
                }
                return null;
            }

            // Lookup a trigger by id from GMCPStructs (returns null if not found)
            function findTrigger(id) {
                var a = GMCPStructs["Char"] && GMCPStructs["Char"].Automation;
                if (!a || !a.triggers) return null;
                for (var i = 0; i < a.triggers.length; i++) {
                    if (a.triggers[i].id === id) return a.triggers[i];
                }
                return null;
            }

            // ── Trigger editor (progressive if/else builder) ───────────────

            function openTriggerEditor(editingId, prefillName, prefillPattern, prefillCondition, prefillThenCmds, prefillElseCmds, prefillEnabled) {
                var body = document.createElement("div");
                body.style.cssText = "display:flex;flex-direction:column;gap:10px;";

                // Name input
                var nameInput = document.createElement("input");
                nameInput.type = "text";
                nameInput.value = prefillName || "";
                nameInput.placeholder = "e.g. Auto-heal on low HP";
                body.appendChild(makeField("Name", nameInput));

                // Pattern input
                var patInput = document.createElement("input");
                patInput.type = "text";
                patInput.value = prefillPattern || "";
                patInput.placeholder = "e.g. *You are badly wounded* (* becomes $1, $2…)";
                body.appendChild(makeField("When I see (pattern)", patInput));

                // ── Do section ────────────────────────────────────────────────
                var doSection = document.createElement("div");
                doSection.style.cssText = "display:flex;flex-direction:column;gap:6px;border:1px solid #3a2a18;border-radius:4px;padding:8px;";

                var doLabel = document.createElement("div");
                doLabel.textContent = "Do";
                doLabel.style.cssText = "font-family:Georgia,serif;font-size:0.82em;color:#c8b98a;font-weight:bold;margin-bottom:2px;";
                doSection.appendChild(doLabel);

                // Simple ThenCmds textarea (shown when no clause)
                var simpleThenArea = document.createElement("textarea");
                simpleThenArea.value = prefillThenCmds || "";
                simpleThenArea.placeholder = "Commands to run (semicolon-separated, $1 $2… for captures)";
                simpleThenArea.rows = 3;
                doSection.appendChild(simpleThenArea);

                // If/else clause container (hidden by default until "+ Add ▾" clicked)
                var clauseWrap = document.createElement("div");
                clauseWrap.style.display = "none";
                clauseWrap.style.cssText = "display:none;flex-direction:column;gap:6px;border-top:1px solid #3a2a18;padding-top:6px;margin-top:2px;";

                // Source select
                var sourceRow = document.createElement("div");
                sourceRow.style.cssText = "display:flex;align-items:center;gap:6px;flex-wrap:wrap;";
                var ifLabel = document.createElement("span");
                ifLabel.textContent = "If";
                ifLabel.style.cssText = "font-family:Georgia,serif;font-size:0.82em;color:#c8b98a;";
                sourceRow.appendChild(ifLabel);

                var srcSelect = document.createElement("select");
                var srcOptions = [
                    {v:"pool:hp",       l:"my HP %"},
                    {v:"pool:sp",       l:"my SP %"},
                    {v:"pool:cp",       l:"my CP %"},
                    {v:"status:",       l:"my conditions"},
                    {v:"capture:$1",    l:"capture $1"},
                    {v:"capture:$2",    l:"capture $2"},
                    {v:"target:",       l:"my target"},
                    {v:"cooldown:",     l:"an ability cooldown"}
                ];
                srcOptions.forEach(function(o) {
                    var opt = document.createElement("option");
                    opt.value = o.v;
                    opt.textContent = o.l;
                    srcSelect.appendChild(opt);
                });
                sourceRow.appendChild(srcSelect);

                var opSelect = document.createElement("select");
                sourceRow.appendChild(opSelect);

                var valInput = document.createElement("input");
                valInput.type = "text";
                valInput.placeholder = "value";
                valInput.style.cssText = "width:90px;";
                sourceRow.appendChild(valInput);

                clauseWrap.appendChild(sourceRow);

                // Op options per source kind
                var opsByKind = {
                    "pool":     [{v:"below",    l:"below %"}, {v:"above",    l:"above %"}, {v:"equals",  l:"equals %"}],
                    "status":   [{v:"include",  l:"includes"}, {v:"exclude", l:"excludes"}],
                    "capture":  [{v:"equals",   l:"equals"},   {v:"contains",l:"contains"}],
                    "target":   [{v:"oneof",    l:"is one of"}, {v:"notoneof",l:"is not one of"}],
                    "cooldown": [{v:"ready",    l:"is ready"}, {v:"notready",l:"is not ready"}]
                };

                function rebuildOps(kind) {
                    while (opSelect.firstChild) opSelect.removeChild(opSelect.firstChild);
                    var opts = opsByKind[kind] || opsByKind["pool"];
                    opts.forEach(function(o) {
                        var opt = document.createElement("option");
                        opt.value = o.v;
                        opt.textContent = o.l;
                        opSelect.appendChild(opt);
                    });
                    // Update value placeholder
                    if (kind === "pool") {
                        valInput.type = "number";
                        valInput.placeholder = "0–100";
                    } else if (kind === "target") {
                        valInput.type = "text";
                        valInput.placeholder = "goblin, orc (comma list)";
                    } else if (kind === "cooldown") {
                        valInput.type = "text";
                        valInput.placeholder = "ability or command name";
                    } else {
                        valInput.type = "text";
                        valInput.placeholder = "value";
                    }
                }

                srcSelect.addEventListener("change", function() {
                    var parts = srcSelect.value.split(":");
                    rebuildOps(parts[0]);
                });

                // Then / Else textareas (inside clause)
                var thenArea = document.createElement("textarea");
                thenArea.placeholder = "Then: commands (semicolon-separated)";
                thenArea.rows = 2;

                var elseArea = document.createElement("textarea");
                elseArea.placeholder = "Else: commands (optional)";
                elseArea.rows = 2;

                clauseWrap.appendChild(makeField("Then", thenArea));
                clauseWrap.appendChild(makeField("Else (optional)", elseArea));

                // ✕ remove clause button
                var removeClauseBtn = document.createElement("button");
                removeClauseBtn.type = "button";
                removeClauseBtn.textContent = "✕ Remove condition";
                removeClauseBtn.style.cssText = "align-self:flex-start;background:none;border:1px solid #5a3a18;color:#c8b98a;cursor:pointer;border-radius:3px;padding:2px 8px;font-size:0.8em;";
                removeClauseBtn.addEventListener("click", function() {
                    clauseWrap.style.display = "none";
                    addClauseBtn.style.display = "";
                    simpleThenArea.style.display = "";
                });
                clauseWrap.appendChild(removeClauseBtn);

                doSection.appendChild(clauseWrap);

                // "+ Add ▾" button
                var addClauseBtn = document.createElement("button");
                addClauseBtn.type = "button";
                addClauseBtn.textContent = "+ Add condition (if/else)";
                addClauseBtn.style.cssText = "align-self:flex-start;background:none;border:1px solid #5a3a18;color:#c8b98a;cursor:pointer;border-radius:3px;padding:2px 10px;font-size:0.8em;margin-top:2px;";
                addClauseBtn.addEventListener("click", function() {
                    // Move then commands from simple area to the clause then area
                    if (!thenArea.value && simpleThenArea.value) {
                        thenArea.value = simpleThenArea.value;
                    }
                    simpleThenArea.style.display = "none";
                    addClauseBtn.style.display = "none";
                    clauseWrap.style.display = "";
                    clauseWrap.style.cssText = "display:flex;flex-direction:column;gap:6px;border-top:1px solid #3a2a18;padding-top:6px;margin-top:2px;";
                    rebuildOps("pool");
                });
                doSection.appendChild(addClauseBtn);
                body.appendChild(doSection);

                // Enabled toggle
                var enableWrap = document.createElement("div");
                enableWrap.style.cssText = "display:flex;align-items:center;gap:8px;";
                var enableTog = document.createElement("span");
                var enabledState = (prefillEnabled !== false);
                enableTog.className = "auto-tog" + (enabledState ? " on" : "");
                enableTog.style.cursor = "pointer";
                enableTog.addEventListener("click", function() {
                    enabledState = !enabledState;
                    enableTog.classList.toggle("on", enabledState);
                });
                var enableLbl = document.createElement("span");
                enableLbl.textContent = "Enabled";
                enableLbl.style.cssText = "font-family:Georgia,serif;font-size:0.85em;color:#c8b98a;";
                enableWrap.appendChild(enableTog);
                enableWrap.appendChild(enableLbl);
                body.appendChild(enableWrap);

                // Pre-fill from existing condition if provided
                var hasCondition = !!(prefillCondition && prefillCondition.sourceKind);
                if (hasCondition) {
                    var cond = prefillCondition;
                    // Map condition back to source select value
                    var srcVal = cond.sourceKind === "pool"     ? ("pool:" + (cond.sourceKey || "hp"))
                               : cond.sourceKind === "status"   ? "status:"
                               : cond.sourceKind === "capture"  ? ("capture:" + (cond.sourceKey || "$1"))
                               : cond.sourceKind === "target"   ? "target:"
                               : cond.sourceKind === "cooldown" ? "cooldown:"
                               : "pool:hp";
                    srcSelect.value = srcVal;
                    rebuildOps(cond.sourceKind);
                    opSelect.value = cond.op || "";
                    valInput.value = (cond.values && cond.values.length) ? cond.values.join(", ") : "";
                    // Pre-fill then/else
                    thenArea.value  = prefillThenCmds  || "";
                    elseArea.value  = prefillElseCmds  || "";
                    simpleThenArea.value = "";
                    // Show clause, hide simple
                    simpleThenArea.style.display = "none";
                    addClauseBtn.style.display = "none";
                    clauseWrap.style.display = "";
                    clauseWrap.style.cssText = "display:flex;flex-direction:column;gap:6px;border-top:1px solid #3a2a18;padding-top:6px;margin-top:2px;";
                } else {
                    // No condition — simple mode
                    simpleThenArea.value = prefillThenCmds || "";
                    rebuildOps("pool"); // default ops loaded for if clause opens later
                }

                var title = editingId ? "Edit Trigger" : "New Trigger";
                openAutoModal(title, body, function() {
                    var name = nameInput.value.trim();
                    if (!name) { alert("Trigger name cannot be empty."); return; }
                    var pattern = patInput.value.trim();
                    if (!pattern) { alert("Pattern cannot be empty."); return; }

                    var clauseVisible = clauseWrap.style.display !== "none";
                    var condition = null;
                    var finalThenCmds = "";
                    var finalElseCmds = "";

                    if (clauseVisible) {
                        // Build condition from selects
                        var srcParts = srcSelect.value.split(":");
                        var srcKind = srcParts[0];
                        var srcKey  = srcParts[1] || "";
                        var op      = opSelect.value;
                        var rawVal  = valInput.value.trim();
                        var values  = [];
                        if (srcKind === "target") {
                            // comma-separated list
                            values = rawVal.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
                        } else {
                            values = rawVal ? [rawVal] : [];
                        }
                        condition = {
                            sourceKind: srcKind,
                            sourceKey:  srcKey,
                            op:         op,
                            values:     values
                        };
                        finalThenCmds = thenArea.value.trim();
                        finalElseCmds = elseArea.value.trim();
                    } else {
                        // Simple: thenCmds from simple area, no condition, no elseCmds
                        finalThenCmds = simpleThenArea.value.trim();
                        finalElseCmds = "";
                    }

                    SendGMCP("Char.Automation.Set", {
                        kind:      "trigger",
                        id:        editingId || 0,
                        name:      name,
                        pattern:   pattern,
                        condition: condition,
                        thenCmds:  finalThenCmds,
                        elseCmds:  finalElseCmds,
                        enabled:   enabledState
                    });
                });
            }

            // ── Public action handlers (called by context menu + "+ New") ──

            // Edit: open pre-filled editor
            window.autoEditRow = function(type, key, cmd) {
                if (type === "macro") {
                    var num = parseInt(key.replace(/^=/, ""), 10);
                    openMacroEditor(isNaN(num) ? "" : num, cmd);
                } else if (type === "alias") {
                    openAliasEditor(key, cmd);
                } else if (type === "tick") {
                    var tid = parseInt(key, 10);
                    var t = isNaN(tid) ? null : findTick(tid);
                    if (t) {
                        openTickEditor(t.id, t.name, t.commands, t.intervalSec, t.enabled);
                    }
                } else if (type === "trigger") {
                    var trid = parseInt(key, 10);
                    var tr = isNaN(trid) ? null : findTrigger(trid);
                    if (tr) {
                        openTriggerEditor(tr.id, tr.name, tr.pattern, tr.condition || null, tr.thenCmds, tr.elseCmds || "", tr.enabled);
                    }
                }
            };

            // Duplicate: open editor pre-filled with same fields, id=0 (new)
            window.autoDuplicateRow = function(type, key, cmd) {
                if (type === "macro") {
                    var srcNum = parseInt(key.replace(/^=/, ""), 10);
                    var freeNum = nextFreeMacroNum(isNaN(srcNum) ? -1 : srcNum);
                    openMacroEditor(freeNum, cmd);
                } else if (type === "alias") {
                    // Suffix the name with "2" (or increment) to avoid collision
                    var newName = key + "2";
                    openAliasEditor(newName, cmd);
                } else if (type === "tick") {
                    var tid = parseInt(key, 10);
                    var t = isNaN(tid) ? null : findTick(tid);
                    if (t) {
                        // id=0 → server creates new tick
                        openTickEditor(0, t.name, t.commands, t.intervalSec, t.enabled);
                    }
                } else if (type === "trigger") {
                    var trid = parseInt(key, 10);
                    var tr = isNaN(trid) ? null : findTrigger(trid);
                    if (tr) {
                        // id=0 → server creates new trigger
                        openTriggerEditor(0, tr.name, tr.pattern, tr.condition || null, tr.thenCmds, tr.elseCmds || "", tr.enabled);
                    }
                }
            };

            // Remove: send delete command directly (no modal needed)
            window.autoRemoveRow = function(type, key) {
                if (type === "macro") {
                    var num = parseInt(key.replace(/^=/, ""), 10);
                    if (!isNaN(num)) SendData("set =" + num + " ");
                } else if (type === "alias") {
                    SendData("alias " + key + "=");
                } else if (type === "tick") {
                    var tid = parseInt(key, 10);
                    if (!isNaN(tid)) {
                        SendGMCP("Char.Automation.Remove", { kind: "tick", id: tid });
                    }
                } else if (type === "trigger") {
                    var trid = parseInt(key, 10);
                    if (!isNaN(trid)) {
                        SendGMCP("Char.Automation.Remove", { kind: "trigger", id: trid });
                    }
                }
                // Server pushes updated Char.Automation → renderAutomation() fires
            };

            // ── "+ New" button wiring ──────────────────────────────────────
            document.addEventListener("click", function(e) {
                var btn = e.target.closest(".auto-add");
                if (!btn) return;
                if (autoActiveTab === "macros") {
                    openMacroEditor(nextFreeMacroNum(-1), "");
                } else if (autoActiveTab === "aliases") {
                    openAliasEditor("", "");
                } else if (autoActiveTab === "ticks") {
                    openTickEditor(0, "", "", 30, true);
                } else if (autoActiveTab === "triggers") {
                    openTriggerEditor(0, "", "", null, "", "", true);
                }
            });

        })();
        // ── End automation editors ────────────────────────────────────────

    </script>

    <script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/dashboard.js"></script>

</body>
