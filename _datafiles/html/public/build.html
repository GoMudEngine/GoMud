<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOGMud — World Builder</title>
<style>
  :root {
    --leather:   #2b1d12;
    --leather2:  #3a2818;
    --tooled:    #5c4326;
    --gold:      #c9a24b;
    --gold-dim:  #8a7038;
    --parch:     #e7d9b8;
    --ink:       #1c130a;
    --panel:     #241811;
    --danger:    #b5533a;
    --ok:        #6f9a4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--leather);
    color: var(--parch);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 14px;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- toolbar ---- */
  #toolbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px;
    /* Narrow windows (~600px and below) can't fit the brand + mode toggle +
       zone/plane/floor controls + save button on one line. Let the toolbar
       wrap onto extra rows instead of squeezing/truncating its children —
       #toolbar has flex:0 0 auto inside #app's column layout, so a taller
       toolbar just pushes #main (flex:1 1 auto, min-height:0) down/shrinks
       it; it never overlaps the panels below. */
    flex-wrap: wrap; row-gap: 8px;
    padding: 8px 14px;
    background: linear-gradient(#3a2818, #2b1d12);
    border-bottom: 2px solid var(--tooled);
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  #toolbar .brand { font-weight: bold; color: var(--gold); letter-spacing: .5px; white-space: nowrap; flex: 0 0 auto; }
  #toolbar .zone  { color: var(--parch); opacity: .85; }
  #toolbar label  { color: var(--gold-dim); font-size: 12px; }
  #toolbar select, #toolbar button {
    background: var(--panel); color: var(--parch);
    border: 1px solid var(--tooled); border-radius: 4px;
    padding: 4px 8px; font: inherit;
  }
  #toolbar button { cursor: pointer; }
  #toolbar button:hover { border-color: var(--gold); }
  #toolbar .spacer { flex: 1 1 auto; min-width: 0; }
  #mode-toggle {
    display: inline-flex; border: 1px solid var(--tooled); border-radius: 5px; overflow: hidden;
    white-space: nowrap; flex: 0 0 auto;
  }
  #mode-toggle .mode-btn { border: none; border-radius: 0; padding: 5px 12px; background: var(--panel); }
  #mode-toggle .mode-btn.active { background: var(--gold); color: var(--ink); font-weight: bold; }
  /* room-tools is allowed to shrink (unlike its nowrap siblings above) so it
     absorbs the squeeze; once its box is narrower than its own children's
     combined width, its OWN flex-wrap reflows the zone/plane/floor controls
     onto additional lines within that space, rather than the browser
     shrinking an individual <select> down to a sliver of truncated text. */
  #room-tools { display: inline-flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; row-gap: 6px; }
  /* Each label+control group (e.g. "Zone" + its <select> + "+ Zone") wraps
     as one atomic unit, so a line break never strands a label away from the
     control it describes. */
  .tb-field { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; white-space: nowrap; }
  #conn { flex: 0 0 auto; white-space: nowrap; }
  #tb-save { flex: 0 0 auto; }
  /* ---- item list (Items mode) / mob list (Mobs mode) ---- */
  #itemlist { flex: 0 0 auto; width: 340px; overflow-y: auto; background: var(--leather2); border-right: 2px solid var(--tooled); padding: 8px; }
  #moblist { padding: 8px; }
  #zonelist { padding: 8px; }
  /* Full-height drag divider between the left area and the inspector. */
  #gutter { flex: 0 0 7px; cursor: col-resize; background: var(--tooled); opacity: .45; align-self: stretch; }
  #gutter:hover, #gutter.drag { opacity: 1; }
  #gutter::after { content: "⋮"; display: block; text-align: center; color: var(--leather2); font-size: 11px; margin-top: 40vh; }
  #itemlist .filters, #moblist .filters { display: flex; gap: 6px; margin-bottom: 8px; position: sticky; top: 0; background: var(--leather2); padding-bottom: 6px; }
  #itemlist .filters input, #itemlist .filters select, #moblist .filters input, #moblist .filters select { flex: 1 1 auto; min-width: 0; padding: 5px 7px; font: inherit; font-size: 12px; background: var(--ink); color: var(--parch); border: 1px solid var(--tooled); border-radius: 4px; }
  #itemlist .newitem, #moblist .newitem, #zonelist .newitem { width: 100%; margin-bottom: 8px; padding: 7px; background: var(--gold); color: var(--ink); font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
  #itemlist .irow, #moblist .irow, #zonelist .irow { padding: 5px 7px; border-bottom: 1px dotted var(--tooled); cursor: pointer; font-size: 12px; }
  #itemlist .irow:hover, #moblist .irow:hover, #zonelist .irow:hover { background: rgba(201,162,75,.12); }
  #itemlist .irow.sel, #moblist .irow.sel, #zonelist .irow.sel { background: rgba(201,162,75,.22); }
  #itemlist .irow .iid, #moblist .irow .iid { color: var(--gold); font-family: monospace; }
  #itemlist .irow .ity { color: var(--gold-dim); font-size: 10px; }
  #moblist .irow .mzone, #zonelist .irow .mzone { color: var(--gold-dim); font-size: 10px; }
  #moblist .irow .mbadge, #zonelist .irow .mbadge { display: inline-block; font-size: 9px; padding: 1px 5px; margin-left: 4px; border-radius: 8px; border: 1px solid var(--tooled); color: var(--gold-dim); }
  #conn { font-size: 12px; color: var(--gold-dim); }
  #conn.ok    { color: var(--ok); }
  #conn.bad   { color: var(--danger); }

  /* ---- body split ---- */
  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #canvas {
    flex: 1 1 auto; min-width: 0; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse at 30% 20%, #34241680 0%, #00000000 60%),
      var(--leather2);
    border-right: 2px solid var(--tooled);
  }
  #canvas .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--gold-dim); font-style: italic; text-align: center; padding: 20px;
  }
  #inspector {
    flex: 0 0 auto; width: 300px; overflow: auto;
    background: var(--panel); padding: 12px;
  }
  #inspector h2 { margin: 0 0 8px; color: var(--gold); font-size: 15px; }
  #inspector h3 { margin: 14px 0 6px; color: var(--gold-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--tooled); padding-bottom: 3px; }
  #inspector .empty { color: var(--gold-dim); font-style: italic; }
  #inspector label { display: block; margin: 8px 0 2px; font-size: 11px; color: var(--gold-dim); }
  #inspector input[type=text], #inspector textarea, #inspector select {
    width: 100%; padding: 5px 7px; font: inherit; font-size: 13px;
    background: var(--ink); color: var(--parch);
    border: 1px solid var(--tooled); border-radius: 4px;
  }
  #inspector textarea { resize: vertical; min-height: 70px; }
  #inspector input:focus, #inspector textarea:focus, #inspector select:focus { outline: none; border-color: var(--gold); }
  #inspector .row { display: flex; gap: 6px; }
  #inspector .row > * { flex: 1 1 auto; min-width: 0; }
  #inspector .flags label { display: inline-flex; align-items: center; gap: 5px; margin: 4px 10px 4px 0; font-size: 12px; color: var(--parch); }
  #inspector .flags input { width: auto; }
  #inspector .kv { display: flex; gap: 5px; margin: 4px 0; align-items: center; }
  #inspector .kv input { flex: 1 1 auto; }
  #inspector .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
  #inspector .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--ink); border: 1px solid var(--tooled); border-radius: 12px; padding: 2px 8px; font-size: 11px; color: var(--parch); }
  #inspector .chip-rm { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 11px; padding: 0; line-height: 1; }
  #inspector .exit { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px dotted var(--tooled); font-size: 12px; }
  #inspector .exit .grow { flex: 1 1 auto; }
  #inspector .exit .tag { color: var(--gold-dim); font-size: 10px; }
  #inspector button.mini { background: var(--panel); color: var(--parch); border: 1px solid var(--tooled); border-radius: 4px; padding: 2px 7px; font: inherit; font-size: 12px; cursor: pointer; }
  #inspector button.mini:hover { border-color: var(--gold); }
  #inspector button.rm { color: var(--danger); border-color: transparent; padding: 2px 6px; }
  /* Not sticky: a bottom-pinned action bar hid the Component/Bag and Advanced
     sections behind it. The form scrolls to Save/Delete at its natural end. */
  #inspector .save-row { background: var(--panel); padding: 10px 0 4px; margin-top: 14px; border-top: 1px solid var(--tooled); }
  #inspector .save-row button { width: 100%; padding: 8px; background: var(--gold); color: var(--ink); font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
  #inspector .save-row button:disabled { opacity: .45; cursor: default; }
  #addexit { border: 1px solid var(--tooled); border-radius: 5px; padding: 8px; margin-top: 6px; }

  /* ---- login overlay ---- */
  #login {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15,10,5,.86);
  }
  #login .card {
    background: linear-gradient(#3a2818, #241811);
    border: 2px solid var(--tooled); border-radius: 8px;
    padding: 24px 26px; width: 320px;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
  }
  #login h1 { margin: 0 0 4px; color: var(--gold); font-size: 20px; }
  #login p  { margin: 0 0 16px; color: var(--gold-dim); font-size: 12px; }
  #login label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--gold-dim); }
  #login input {
    width: 100%; padding: 7px 9px; font: inherit;
    background: var(--ink); color: var(--parch);
    border: 1px solid var(--tooled); border-radius: 4px;
  }
  #login input:focus { outline: none; border-color: var(--gold); }
  #login button {
    margin-top: 18px; width: 100%; padding: 9px;
    background: var(--gold); color: var(--ink); font: inherit; font-weight: bold;
    border: none; border-radius: 4px; cursor: pointer;
  }
  #login button:disabled { opacity: .5; cursor: default; }
  #login .err { margin-top: 12px; color: var(--danger); font-size: 12px; min-height: 1em; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="brand">⚒ World Builder</span>
    <span id="mode-toggle">
      <button id="tb-mode-rooms" class="mode-btn active">Rooms</button>
      <button id="tb-mode-items" class="mode-btn">Items</button>
      <button id="tb-mode-mobs" class="mode-btn">Mobs</button>
      <button id="tb-mode-zones" class="mode-btn">Zones</button>
    </span>
    <span id="room-tools">
      <span class="tb-field">
        <label for="tb-zone-sel">Zone</label>
        <select id="tb-zone-sel"><option value="">—</option></select>
        <button id="tb-new-zone" title="Create a new zone">+ Zone</button>
      </span>
      <span class="tb-field">
        <label for="tb-plane">Plane</label>
        <select id="tb-plane"><option value="">—</option></select>
      </span>
      <span class="tb-field">
        <label for="tb-floor">Floor</label>
        <button id="tb-floor-dn" title="Down a floor">▼</button>
        <span id="tb-floor" style="min-width:1.5em;text-align:center;">0</span>
        <button id="tb-floor-up" title="Up a floor">▲</button>
      </span>
    </span>
    <div class="spacer"></div>
    <span id="conn">● connecting…</span>
    <button id="tb-save" disabled>Save Room</button>
  </div>
  <div id="main">
    <div id="canvas">
      <div class="placeholder" id="canvas-ph">Waiting for the world map…</div>
    </div>
    <div id="itemlist" style="display:none;"></div>
    <div id="moblist" style="display:none;flex:0 0 320px;overflow-y:auto;background:var(--leather2);border-right:2px solid var(--tooled);"></div>
    <div id="zonelist" style="display:none;flex:0 0 320px;overflow-y:auto;background:var(--leather2);border-right:2px solid var(--tooled);"></div>
    <div id="gutter" title="Drag to resize"></div>
    <aside id="inspector">
      <h2>Inspector</h2>
      <div class="empty" id="insp-empty">Select a room on the map to edit it.</div>
    </aside>
  </div>
</div>

<!-- Login overlay: the page is admin-gated by HTTP Basic-Auth, but the
     WebSocket/GMCP session still needs an in-band character login. Basic-Auth
     credentials aren't exposed to JS, so the admin logs their character in
     once here; the standard username -> password prompt flow is driven off the
     server's TEXTMASK signals. -->
<div id="login">
  <div class="card">
    <h1>World Builder</h1>
    <p>Log in with your admin character to open a build session.</p>
    <form id="login-form" autocomplete="off">
      <label for="lg-user">Character name</label>
      <input id="lg-user" type="text" autocomplete="username" autofocus>
      <label for="lg-pass">Password</label>
      <input id="lg-pass" type="password" autocomplete="current-password">
      <button type="submit" id="lg-btn">Open build session</button>
      <div class="err" id="lg-err"></div>
    </form>
  </div>
</div>

<script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/builder.js"></script>
<script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/items.js"></script>
<script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/mobs.js"></script>
<script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/zones.js"></script>
<script>
"use strict";
(function () {
  // ---- connection + GMCP state -------------------------------------------
  var socket = null;
  var loggedIn = false;
  var creds = { u: "", p: "" };
  var credsReady = false; // set true only once the admin submits the form
  // login phase tracks the server's prompt sequence:
  //   'idle' -> 'await_user' -> 'await_pass' -> 'await_kick'
  var phase = "idle";

  var connEl = document.getElementById("conn");
  function setConn(txt, cls) {
    connEl.textContent = txt;
    connEl.className = cls || "";
  }

  // GMCP snapshot store + hooks.
  window.Builder = window.Builder || {};
  window.Builder.gmcp = {};

  // The editor canvas (builder.js). Instantiated below.
  var canvas = null;
  var pendingCreatedId = 0; // set from Build.Result, consumed on the next Zone.Map

  window.Builder.onZoneMap = function (payload) {
    // Cache the valid biome list for the new-zone / inspector dropdowns.
    if (payload.biomes && payload.biomes.length) window.Builder.biomes = payload.biomes;
    // Populate the zone switcher from the full zone list (builder-only field).
    var zsel = document.getElementById("tb-zone-sel");
    if (zsel && payload.zones && payload.zones.length) {
      zsel.innerHTML = "";
      for (var zi = 0; zi < payload.zones.length; zi++) {
        var zo = document.createElement("option");
        zo.value = payload.zones[zi]; zo.textContent = payload.zones[zi];
        if (payload.zones[zi] === payload.zone) zo.selected = true;
        zsel.appendChild(zo);
      }
    } else if (zsel && payload.zone) {
      zsel.value = payload.zone;
    }
    if (!canvas) return;
    canvas.setSnapshot(payload);
    if (pendingCreatedId) { canvas.afterRefresh(pendingCreatedId); pendingCreatedId = 0; }
  };

  window.Builder.onGMCP = function (ns, obj) {
    var IP = window.Builder.ItemsPanel;
    var MP = window.Builder.MobsPanel;
    var ZP = window.Builder.ZonesPanel;
    // ---- item editor (Items mode) ----
    if (ns === "Build.Items") { if (IP) { IP.render(obj); IP.afterListRefresh(); } return; }
    if (ns === "Build.Item") { if (IP) IP.renderForm(obj); return; }
    if (ns === "Build.Result" && window.Builder.mode === "items") { if (IP) IP.onResult(obj); return; }
    // ---- mob editor (Mobs mode) ----
    if (ns === "Build.Mobs") { if (MP) MP.render(obj); return; }
    if (ns === "Build.Mob") { if (MP) MP.renderForm(obj); return; }
    if (ns === "Build.Result" && window.Builder.mode === "mobs") { if (MP) MP.onResult(obj); return; }
    // Build.Rooms is the test-spawn room picker's per-zone room list
    // (Build.Room.List), routed to the mob panel rather than the room
    // inspector.
    if (ns === "Build.Rooms" && window.Builder.mode === "mobs") { if (MP) MP.onRoomList(obj); return; }
    // ---- zone editor (Zones mode) ----
    if (ns === "Build.Zones") { if (ZP) ZP.renderList(obj); return; }
    if (ns === "Build.Zone")  { if (ZP) ZP.renderDetail(obj); return; }
    if (ns === "Build.Result" && window.Builder.mode === "zones") { if (ZP) ZP.onResult(obj); return; }
    // ---- room editor (Rooms mode) ----
    if (ns === "Build.Result") {
      if (obj && obj.ok) {
        if (creatingZone) { creatingZone = false; clearInspector(); toast("Zone created.", false); }
        else if (deletingRoomId) { deletingRoomId = 0; clearInspector(); toast("Room deleted.", false); }
        else if (inspectorDirtySaving) { inspectorDirtySaving = false; setDirty(false); toast("Saved.", false); }
        else if (refetchRoomId) { var rid = refetchRoomId; refetchRoomId = 0; sendGMCP("Build.Room.Get", { roomId: rid }); toast("Applied.", false); }
        else { if (obj.roomId) pendingCreatedId = obj.roomId; toast("Done.", false); }
      } else {
        var msg = (obj && obj.error) || "Build error";
        if (creatingZone) { creatingZone = false; var fe = document.getElementById("nz-err"); if (fe) fe.textContent = msg; }
        inspectorDirtySaving = false; refetchRoomId = 0; deletingRoomId = 0;
        toast(msg, true);
      }
    } else if (ns === "Build.Room") {
      renderInspector(obj);
    }
  };

  // Selecting a room fetches its full editable detail; deselect clears the form.
  window.Builder.onRoomSelected = function (room) {
    if (!room) { clearInspector(); return; }
    sendGMCP("Build.Room.Get", { roomId: room.num });
  };

  // Floating in-window toast (top-center). Also mirrors to the toolbar conn slot
  // so a glance at the header confirms the last action.
  function toast(msg, isErr) {
    var host = document.getElementById("toast-host");
    if (!host) {
      host = document.createElement("div");
      host.id = "toast-host";
      host.style.cssText = "position:fixed;top:14px;left:50%;transform:translateX(-50%);" +
        "z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;";
      document.body.appendChild(host);
    }
    var t = document.createElement("div");
    t.textContent = (isErr ? "✕ " : "✓ ") + msg;
    t.style.cssText = "font:600 13px/1.4 system-ui,sans-serif;padding:8px 16px;border-radius:6px;" +
      "box-shadow:0 4px 14px rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .18s;max-width:80vw;" +
      "background:" + (isErr ? "#8a1f1f" : "#1f6b34") + ";border:1px solid " + (isErr ? "#c94b4b" : "#3fae63") + ";";
    host.appendChild(t);
    requestAnimationFrame(function () { t.style.opacity = "1"; });
    setTimeout(function () {
      t.style.opacity = "0";
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 250);
    }, isErr ? 4200 : 2400);

    var c = document.getElementById("conn");
    if (c) {
      var prev = c.textContent, prevCls = c.className;
      c.textContent = (isErr ? "✕ " : "✓ ") + msg;
      c.className = isErr ? "bad" : "ok";
      setTimeout(function () { c.textContent = prev; c.className = prevCls; }, 2000);
    }
  }
  window.Builder.toast = toast;

  // Send a client->server GMCP frame as BINARY so the 0xFF IAC byte survives
  // (a text frame would UTF-8-mangle it). Mirrors webclient-pure.html.
  function sendGMCP(pkg, obj) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return false;
    var body = pkg + " " + JSON.stringify(obj);
    var bodyBytes = new TextEncoder().encode(body);
    var frame = new Uint8Array(bodyBytes.length + 5);
    frame[0] = 255; frame[1] = 250; frame[2] = 201;               // IAC SB GMCP
    frame.set(bodyBytes, 3);
    frame[frame.length - 2] = 255; frame[frame.length - 1] = 240; // IAC SE
    socket.send(frame);
    return true;
  }
  window.Builder.sendGMCP = sendGMCP;

  function sendLine(s) {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(s);
  }

  // ---- login state machine, driven by the server's TEXTMASK signals ------
  // The server sends TEXTMASK:false before an unmasked prompt (username, or the
  // "kick them?" y/n) and TEXTMASK:true before the masked password prompt. We
  // never send the username until the admin has submitted the form (credsReady).
  function onTextMask(masked) {
    if (loggedIn) return;
    if (!masked) {
      if (!credsReady) return; // username prompt is waiting; hold for the form
      if (phase === "await_user") {
        sendLine(creds.u);
        phase = "await_pass";
      } else if (phase === "await_kick") {
        // "User is already connected. Kick them?" — take over the session.
        sendLine("y");
      }
    } else { // masked = password prompt
      if (phase === "await_pass") {
        sendLine(creds.p);
        phase = "await_kick";
      } else if (phase === "await_kick") {
        // A second password prompt means the first was rejected.
        loginFailed("Login failed — check your character name and password.");
      }
    }
  }

  function loginSucceeded() {
    if (loggedIn) return;
    loggedIn = true;
    var ov = document.getElementById("login");
    if (ov) ov.style.display = "none";
    setConn("● connected", "ok");
    // The login pushed a fogged Zone.Map; pull the full unfogged builder map.
    sendGMCP("Build.Map.Request", {});
  }

  function loginFailed(msg) {
    phase = "idle";
    var btn = document.getElementById("lg-btn");
    if (btn) btn.disabled = false;
    var err = document.getElementById("lg-err");
    if (err) err.textContent = msg;
  }

  // ---- websocket wiring ---------------------------------------------------
  function connect() {
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    socket = new WebSocket(proto + location.host + "/ws");
    socket.onopen = function () {
      setConn("● authenticating…", "");
      phase = "await_user";
    };
    socket.onclose = function () {
      setConn("● disconnected", "bad");
      if (!loggedIn) loginFailed("Connection closed before login completed.");
    };
    socket.onerror = function () { setConn("● connection error", "bad"); };
    socket.onmessage = onMessage;
  }

  function onMessage(event) {
    var data = event.data;
    if (typeof data !== "string") return; // builder consumes only text + GMCP text frames

    // Copyover reconnect token — ignore (builder sessions don't persist it).
    if (data.indexOf("RELOGTKN:") === 0) return;

    // Webclient control commands are an 8-char tag followed by ':' at index 8.
    if (data.length > 9 && data.charAt(8) === ":") {
      if (data.substring(0, 9) === "TEXTMASK:") {
        onTextMask(data.substring(9).indexOf("true") === 0);
        return;
      }
      // Other webclient commands are irrelevant to the builder.
      return;
    }

    // GMCP frames arrive as  !!GMCP(Namespace {json})
    if (data.slice(0, 7) === "!!GMCP(") {
      var payload = data.trim().slice(7, data.length - 1).trim();
      var jsonIndex = payload.charAt(payload.length - 1) === "}"
        ? payload.indexOf("{")
        : payload.indexOf("[");
      if (jsonIndex === -1) return;
      var ns = payload.slice(0, jsonIndex).trim();
      var obj;
      try { obj = JSON.parse(payload.slice(jsonIndex).trim()); }
      catch (e) { return; }

      window.Builder.gmcp[ns] = obj;
      // Any GMCP push means the login burst has started — we're in the world.
      loginSucceeded();

      if (ns === "Zone.Map") {
        window.Builder.onZoneMap(obj);
      } else {
        window.Builder.onGMCP(ns, obj);
      }
      return;
    }

    // Everything else is login-flow / MOTD text — not needed by the builder.
  }

  // ---- login form ---------------------------------------------------------
  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("lg-user").value.trim();
    var p = document.getElementById("lg-pass").value;
    if (!u || !p) { loginFailed("Enter your character name and password."); return; }
    creds.u = u; creds.p = p; credsReady = true;
    document.getElementById("lg-err").textContent = "";
    document.getElementById("lg-btn").disabled = true;
    if (socket && socket.readyState === WebSocket.OPEN) {
      // The socket has been open since page load, so the username prompt has
      // already arrived (phase 'await_user'); send the name now. If it somehow
      // hasn't, the pending TEXTMASK:false will send it (credsReady is set).
      if (phase === "await_user") {
        sendLine(creds.u);
        phase = "await_pass";
      }
    } else {
      connect();
    }
  });

  // ---- inspector ----------------------------------------------------------
  var insp = document.getElementById("inspector");
  var current = null;             // the Build.Room detail currently loaded
  var dirty = false;
  var inspectorDirtySaving = false; // a Save is in flight (distinguish from create toasts)
  var refetchRoomId = 0;          // re-fetch this room's detail after the next ok result (exit ops)
  var deletingRoomId = 0;         // a room delete is in flight
  var creatingZone = false;       // a Build.Zone.Create is in flight
  var saveBtn = document.getElementById("tb-save");

  function ce(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function setDirty(d) {
    dirty = d;
    if (saveBtn) saveBtn.disabled = !d;
    var s = document.getElementById("insp-save");
    if (s) s.disabled = !d;
  }

  function clearInspector() {
    current = null;
    setDirty(false);
    insp.innerHTML = "";
    insp.appendChild(ce("h2", { text: "Inspector" }));
    insp.appendChild(ce("div", { "class": "empty", text: "Select a room on the map to edit it." }));
  }

  function field(labelText, input) {
    return ce("div", {}, [ce("label", { text: labelText }), input]);
  }

  function textInput(val) { var i = ce("input", { type: "text" }); i.value = val || ""; i.addEventListener("input", function () { setDirty(true); }); return i; }

  function renderInspector(d) {
    current = d;
    insp.innerHTML = "";
    insp.appendChild(ce("h2", { text: "Room #" + d.roomId }));
    insp.appendChild(ce("div", { "class": "tag", "style": "color:var(--gold-dim);font-size:11px;margin-bottom:4px;",
      text: "plane " + d.plane + " · (" + d.x + "," + d.y + "," + d.z + ")" }));

    // Title
    var title = textInput(d.title); insp.appendChild(field("Title", title));
    // Description
    var desc = ce("textarea", {}); desc.value = d.description || ""; desc.addEventListener("input", function () { setDirty(true); });
    insp.appendChild(field("Description", desc));
    // Biome dropdown
    var biome = ce("select", {});
    (d.biomes || []).forEach(function (b) {
      var o = ce("option", { value: b, text: b }); if (b === d.biome) o.selected = true; biome.appendChild(o);
    });
    if (d.biome && (d.biomes || []).indexOf(d.biome) === -1) { var o = ce("option", { value: d.biome, text: d.biome }); o.selected = true; biome.appendChild(o); }
    biome.addEventListener("change", function () { setDirty(true); });
    insp.appendChild(field("Biome", biome));
    // Symbol + legend
    var sym = textInput(d.symbol), leg = textInput(d.legend);
    var symRow = ce("div", { "class": "row" }, [field("Map symbol", sym), field("Legend", leg)]);
    insp.appendChild(symRow);
    // Music
    var music = textInput(d.music); insp.appendChild(field("Music file", music));

    // Flags
    insp.appendChild(ce("h3", { text: "Flags" }));
    var flags = ce("div", { "class": "flags" });
    function flag(name, val) {
      var cb = ce("input", { type: "checkbox" }); cb.checked = !!val; cb.addEventListener("change", function () { setDirty(true); });
      flags.appendChild(ce("label", {}, [cb, ce("span", { text: name })]));
      return cb;
    }
    var fBank = flag("Bank", d.bank), fStore = flag("Storage", d.storage), fPvp = flag("PvP", d.pvp), fChar = flag("Char-room", d.characterRoom);
    insp.appendChild(flags);

    // Nouns
    insp.appendChild(ce("h3", { text: "Nouns" }));
    var nounsBox = ce("div", {});
    function nounRow(k, v) {
      var kk = ce("input", { type: "text", placeholder: "noun" }); kk.value = k || "";
      var vv = ce("input", { type: "text", placeholder: "description" }); vv.value = v || "";
      kk.addEventListener("input", function () { setDirty(true); }); vv.addEventListener("input", function () { setDirty(true); });
      var rm = ce("button", { "class": "mini rm", text: "✕", title: "remove" });
      var row = ce("div", { "class": "kv" }, [kk, vv, rm]);
      rm.addEventListener("click", function () { nounsBox.removeChild(row); setDirty(true); });
      row._k = kk; row._v = vv;
      return row;
    }
    var nn = d.nouns || {};
    Object.keys(nn).forEach(function (k) { nounsBox.appendChild(nounRow(k, nn[k])); });
    insp.appendChild(nounsBox);
    var addNoun = ce("button", { "class": "mini", text: "+ noun" });
    addNoun.addEventListener("click", function () { nounsBox.appendChild(nounRow("", "")); setDirty(true); });
    insp.appendChild(addNoun);

    // Idle messages
    insp.appendChild(ce("h3", { text: "Idle messages" }));
    var idleBox = ce("div", {});
    function idleRow(v) {
      var vv = ce("input", { type: "text", placeholder: "idle message" }); vv.value = v || "";
      vv.addEventListener("input", function () { setDirty(true); });
      var rm = ce("button", { "class": "mini rm", text: "✕" });
      var row = ce("div", { "class": "kv" }, [vv, rm]);
      rm.addEventListener("click", function () { idleBox.removeChild(row); setDirty(true); });
      row._v = vv;
      return row;
    }
    (d.idleMessages || []).forEach(function (m) { idleBox.appendChild(idleRow(m)); });
    insp.appendChild(idleBox);
    var addIdle = ce("button", { "class": "mini", text: "+ message" });
    addIdle.addEventListener("click", function () { idleBox.appendChild(idleRow("")); setDirty(true); });
    insp.appendChild(addIdle);

    // Exits
    renderExits(d);

    // Save + delete row
    var save = ce("button", { id: "insp-save", text: "Save Room", disabled: "disabled" });
    save.addEventListener("click", doSave);
    var del = ce("button", { "class": "mini rm", text: "Delete room", "style": "width:100%;margin-top:6px;padding:6px;" });
    del.addEventListener("click", function () {
      if (!current) return;
      if (window.confirm("Delete room #" + current.roomId + "? This removes it and all exits pointing to it.")) {
        deletingRoomId = current.roomId;
        sendGMCP("Build.Room.Delete", { roomId: current.roomId });
      }
    });
    insp.appendChild(ce("div", { "class": "save-row" }, [save, del]));

    // gather fn for save
    current._gather = function () {
      var nouns = {};
      Array.prototype.forEach.call(nounsBox.children, function (r) {
        var k = r._k.value.trim(); if (k) nouns[k] = r._v.value;
      });
      var idle = [];
      Array.prototype.forEach.call(idleBox.children, function (r) {
        var v = r._v.value.trim(); if (v) idle.push(v);
      });
      return {
        roomId: d.roomId, title: title.value, description: desc.value,
        biome: biome.value, symbol: sym.value, legend: leg.value, music: music.value,
        bank: fBank.checked, storage: fStore.checked, pvp: fPvp.checked, characterRoom: fChar.checked,
        nouns: nouns, idleMessages: idle
      };
    };
    setDirty(false);
  }

  function doSave() {
    if (!current || !current._gather) return;
    inspectorDirtySaving = true;
    sendGMCP("Build.Room.Update", current._gather());
  }

  function renderExits(d) {
    insp.appendChild(ce("h3", { text: "Exits" }));
    var list = ce("div", {});
    (d.exits || []).forEach(function (e) {
      var tag = e.dir ? ("spatial " + e.dir) : "portal";
      var flags = [];
      if (e.secret) flags.push("secret");
      if (e.oneway) flags.push("one-way");
      if (e.lock) flags.push("lock " + e.lock);
      var lbl = ce("span", { "class": "grow", html:
        "<b>" + escapeHtml(e.name) + "</b> → " + e.toRoomId +
        " <span class='tag'>" + tag + (flags.length ? " · " + flags.join(", ") : "") + "</span>" });
      var rm = ce("button", { "class": "mini rm", text: "✕", title: "remove exit" });
      rm.addEventListener("click", function () { refetchRoomId = d.roomId; sendGMCP("Build.Exit.Remove", { roomId: d.roomId, exitName: e.name }); });
      list.appendChild(ce("div", { "class": "exit" }, [lbl, rm]));
    });
    insp.appendChild(list);
    insp.appendChild(buildAddExit(d));
  }

  function buildAddExit(d) {
    var box = ce("div", { id: "addexit" });
    box.appendChild(ce("div", { "style": "font-size:11px;color:var(--gold-dim);margin-bottom:4px;", text: "Add exit" }));

    // kind toggle
    var kind = ce("select", {});
    kind.appendChild(ce("option", { value: "spatial", text: "Spatial (direction)" }));
    kind.appendChild(ce("option", { value: "portal", text: "Portal (named)" }));
    box.appendChild(kind);

    // spatial: direction dropdown limited to open directions with an adjacent room
    var dirSel = ce("select", {});
    var DIRS = window.Builder.BuilderCanvas.DIRS;
    var haveDir = {};
    (d.exits || []).forEach(function (e) { if (e.dir) haveDir[e.dir] = true; });
    var spatialTargets = {};
    for (var dir in DIRS) {
      if (haveDir[dir]) continue;
      var nx = d.x + DIRS[dir][0], ny = d.y + DIRS[dir][1];
      var target = canvas ? canvas.roomIdAt(d.plane, nx, ny, d.z) : 0;
      if (target) { spatialTargets[dir] = target; dirSel.appendChild(ce("option", { value: dir, text: dir + " → " + target })); }
    }
    if (!dirSel.children.length) dirSel.appendChild(ce("option", { value: "", text: "(no adjacent rooms)" }));

    // portal: name + target id (datalist of snapshot rooms)
    var pName = ce("input", { type: "text", placeholder: "exit name e.g. enter inn" });
    var pTarget = ce("input", { type: "text", placeholder: "target room id" });

    // flags
    var fSecret = ce("input", { type: "checkbox" });
    var fOneway = ce("input", { type: "checkbox" });
    var fLock = ce("input", { type: "text", placeholder: "lock diff (0)" }); fLock.style.width = "80px";
    var fMsg = ce("input", { type: "text", placeholder: "exit message (optional)" });

    var spatialWrap = ce("div", {}, [ce("label", { text: "Direction" }), dirSel]);
    var portalWrap = ce("div", {}, [
      ce("label", { text: "Name" }), pName,
      ce("label", { text: "Target room id" }), pTarget
    ]);
    portalWrap.style.display = "none";
    kind.addEventListener("change", function () {
      var sp = kind.value === "spatial";
      spatialWrap.style.display = sp ? "" : "none";
      portalWrap.style.display = sp ? "none" : "";
    });
    box.appendChild(spatialWrap);
    box.appendChild(portalWrap);

    var flagRow = ce("div", { "class": "flags", "style": "margin-top:6px;" }, [
      ce("label", {}, [fSecret, ce("span", { text: "secret" })]),
      ce("label", {}, [fOneway, ce("span", { text: "one-way" })])
    ]);
    box.appendChild(flagRow);
    box.appendChild(ce("div", { "class": "row", "style": "margin-top:4px;" }, [fLock, fMsg]));

    var addBtn = ce("button", { "class": "mini", text: "+ add exit", "style": "margin-top:6px;" });
    addBtn.addEventListener("click", function () {
      var req = { roomId: d.roomId, secret: fSecret.checked, oneway: fOneway.checked,
        lock: parseInt(fLock.value, 10) || 0, message: fMsg.value };
      if (kind.value === "spatial") {
        var dir = dirSel.value;
        if (!dir || !spatialTargets[dir]) { toast("Pick an adjacent direction", true); return; }
        req.dir = dir; req.toRoomId = spatialTargets[dir];
      } else {
        var name = pName.value.trim(); var tid = parseInt(pTarget.value, 10) || 0;
        if (!name || !tid) { toast("Portal needs a name and target id", true); return; }
        req.portalName = name; req.toRoomId = tid;
      }
      refetchRoomId = d.roomId;
      sendGMCP("Build.Exit.Add", req);
    });
    box.appendChild(addBtn);
    return box;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // New-zone form, rendered into the inspector side panel.
  function renderNewZoneForm() {
    insp.innerHTML = "";
    insp.appendChild(ce("h2", { text: "New Zone" }));
    insp.appendChild(ce("div", { "class": "tag", "style": "color:var(--gold-dim);font-size:11px;margin-bottom:6px;",
      text: "Creates a zone on its own plane with one entrance room." }));

    var name = ce("input", { type: "text", placeholder: "e.g. Sunken Crypt" });
    insp.appendChild(field("Zone name", name));

    var biome = ce("select", {});
    biome.appendChild(ce("option", { value: "", text: "(default)" }));
    (window.Builder.biomes || []).forEach(function (b) { biome.appendChild(ce("option", { value: b, text: b })); });
    insp.appendChild(field("Default biome", biome));

    var region = ce("input", { type: "text", placeholder: "e.g. Thornwall Region (optional)" });
    insp.appendChild(field("Region", region));

    var nc = ce("input", { type: "checkbox" });
    var ncWrap = ce("div", { "class": "flags", "style": "margin-top:8px;" }, [
      ce("label", {}, [nc, ce("span", { text: "Non-Cartesian (maze / toroidal — skips grid checks)" })])
    ]);
    insp.appendChild(ncWrap);

    insp.appendChild(ce("div", { id: "nz-err", "class": "err", "style": "color:var(--danger);font-size:12px;min-height:1em;margin-top:8px;" }));

    var create = ce("button", { text: "Create zone" });
    create.addEventListener("click", function () {
      var n = name.value.trim();
      if (n.length < 2) { document.getElementById("nz-err").textContent = "Zone name must be at least 2 characters."; return; }
      document.getElementById("nz-err").textContent = "";
      creatingZone = true;
      sendGMCP("Build.Zone.Create", { name: n, biome: biome.value, region: region.value.trim(), nonCartesian: nc.checked });
    });
    var cancel = ce("button", { "class": "mini", text: "Cancel", "style": "width:100%;margin-top:6px;padding:6px;" });
    cancel.addEventListener("click", clearInspector);
    insp.appendChild(ce("div", { "class": "save-row" }, [create, cancel]));
    name.focus();
  }

  clearInspector();

  // ---- resizable inspector (drag the #gutter divider) --------------------
  // The inspector is the panel authors want wider. In rooms mode the map is the
  // flex filler and the inspector is a fixed, draggable width; in items/mobs/
  // zones mode the list (item list, mob list, or zone list) is the
  // fixed/draggable column and the inspector fills the rest — so the one
  // gutter resizes the inspector in rooms and the visible list otherwise.
  // Items, mobs, and zones share one width value since only one of the three
  // lists is ever visible at a time.
  var inspW = 300, listW = 340;
  function activeListEl() {
    if (window.Builder.mode === "mobs") return document.getElementById("moblist");
    if (window.Builder.mode === "zones") return document.getElementById("zonelist");
    return document.getElementById("itemlist");
  }
  function applyLayout() {
    var isListMode = window.Builder.mode === "items" || window.Builder.mode === "mobs" || window.Builder.mode === "zones";
    var insp = document.getElementById("inspector");
    var itemlistEl = document.getElementById("itemlist");
    var moblistEl = document.getElementById("moblist");
    var zonelistEl = document.getElementById("zonelist");
    if (isListMode) {
      var list = activeListEl();
      list.style.flex = "0 0 auto"; list.style.width = listW + "px";
      insp.style.flex = "1 1 auto"; insp.style.width = "";
    } else {
      insp.style.flex = "0 0 auto"; insp.style.width = inspW + "px";
      itemlistEl.style.flex = ""; itemlistEl.style.width = "";
      moblistEl.style.flex = ""; moblistEl.style.width = "";
      zonelistEl.style.flex = ""; zonelistEl.style.width = "";
    }
  }
  (function wireGutter() {
    var g = document.getElementById("gutter");
    var dragging = false, startX = 0, startW = 0, grow = 1, target = "insp";
    g.addEventListener("pointerdown", function (e) {
      var isListMode = window.Builder.mode === "items" || window.Builder.mode === "mobs" || window.Builder.mode === "zones";
      target = isListMode ? "list" : "insp";
      grow = isListMode ? 1 : -1; // items/mobs: drag right widens the list; rooms: drag left widens the inspector
      startX = e.clientX; startW = isListMode ? listW : inspW;
      dragging = true; g.classList.add("drag"); g.setPointerCapture(e.pointerId); e.preventDefault();
    });
    g.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var w = startW + grow * (e.clientX - startX);
      w = Math.max(220, Math.min(window.innerWidth * 0.7, w));
      if (target === "list") listW = w; else inspW = w;
      applyLayout();
    });
    function end(e) { if (!dragging) return; dragging = false; g.classList.remove("drag"); try { g.releasePointerCapture(e.pointerId); } catch (x) {} }
    g.addEventListener("pointerup", end);
    g.addEventListener("pointercancel", end);
  })();

  // ---- mode toggle (Rooms | Items | Mobs) --------------------------------
  window.Builder.mode = "rooms";
  function setMode(mode) {
    window.Builder.mode = mode;
    var isItems = mode === "items";
    var isMobs = mode === "mobs";
    var isZones = mode === "zones";
    var isRooms = mode === "rooms";
    document.getElementById("canvas").style.display = isRooms ? "" : "none";
    document.getElementById("itemlist").style.display = isItems ? "" : "none";
    document.getElementById("moblist").style.display = isMobs ? "" : "none";
    document.getElementById("zonelist").style.display = isZones ? "" : "none";
    document.getElementById("room-tools").style.display = isRooms ? "" : "none";
    applyLayout();
    var sb = document.getElementById("tb-save"); if (sb) sb.style.display = isRooms ? "" : "none";
    document.getElementById("tb-mode-rooms").classList.toggle("active", isRooms);
    document.getElementById("tb-mode-items").classList.toggle("active", isItems);
    document.getElementById("tb-mode-mobs").classList.toggle("active", isMobs);
    document.getElementById("tb-mode-zones").classList.toggle("active", isZones);
    if (isItems) {
      window.Builder.ItemsPanel.clear();
      sendGMCP("Build.Item.List", {});
    } else if (isMobs) {
      if (window.Builder.MobsPanel) window.Builder.MobsPanel.clear();
      sendGMCP("Build.Mob.List", {});
    } else if (isZones) {
      if (window.Builder.ZonesPanel) window.Builder.ZonesPanel.clear();
      sendGMCP("Build.Zone.List", {});
    } else {
      clearInspector();
    }
  }
  document.getElementById("tb-mode-rooms").addEventListener("click", function () { setMode("rooms"); });
  document.getElementById("tb-mode-items").addEventListener("click", function () { setMode("items"); });
  document.getElementById("tb-mode-mobs").addEventListener("click", function () { setMode("mobs"); });
  document.getElementById("tb-mode-zones").addEventListener("click", function () { setMode("zones"); });
  applyLayout(); // sync initial (rooms) layout

  // ---- canvas + toolbar wiring -------------------------------------------
  var planeSel = document.getElementById("tb-plane");
  var floorEl = document.getElementById("tb-floor");
  var zoneSel = document.getElementById("tb-zone-sel");
  if (saveBtn) saveBtn.addEventListener("click", doSave);
  if (zoneSel) zoneSel.addEventListener("change", function () {
    if (zoneSel.value) { clearInspector(); sendGMCP("Build.Map.Request", { zone: zoneSel.value }); }
  });
  var newZoneBtn = document.getElementById("tb-new-zone");
  if (newZoneBtn) newZoneBtn.addEventListener("click", renderNewZoneForm);

  // Clicking a dimmed foreign (neighbouring-zone) room switches to that zone.
  window.Builder.onZoneJump = function (zoneName) {
    if (!zoneName) return;
    if (zoneSel) zoneSel.value = zoneName;
    clearInspector();
    sendGMCP("Build.Map.Request", { zone: zoneName });
  };

  if (window.Builder.BuilderCanvas) {
    canvas = new window.Builder.BuilderCanvas(document.getElementById("canvas"));
    canvas.onPlanes = function (planes, curPlane, floors, curFloor) {
      // Rebuild the plane dropdown.
      planeSel.innerHTML = "";
      for (var i = 0; i < planes.length; i++) {
        var o = document.createElement("option");
        o.value = String(planes[i]);
        o.textContent = "Plane " + planes[i] + (planes[i] === 0 ? " (overworld)" : "");
        if (planes[i] === curPlane) o.selected = true;
        planeSel.appendChild(o);
      }
      floorEl.textContent = String(curFloor);
    };
    planeSel.addEventListener("change", function () {
      if (canvas) canvas.setPlane(parseInt(planeSel.value, 10) || 0);
    });
    document.getElementById("tb-floor-up").addEventListener("click", function () {
      if (canvas) { canvas.setFloor(canvas.floor + 1); floorEl.textContent = String(canvas.floor); }
    });
    document.getElementById("tb-floor-dn").addEventListener("click", function () {
      if (canvas) { canvas.setFloor(canvas.floor - 1); floorEl.textContent = String(canvas.floor); }
    });
  }

  // Open the socket immediately so the username prompt is waiting by the time
  // the admin submits; the form submit supplies the credentials.
  connect();
})();
</script>
</body>
</html>
