description: "Chunk 6.1 Stillwater town-flavor pass. Observe the newly-authored
  aliveness layers on the Stillwater town NPCs across at least two full game-days:
  9 daily schedules, NPC-to-NPC conversations (4 authored pairs), gossip spreading
  5 seeded facts, and the relationship/knowledge substrate via admin inspectors.
  This is a feel/observation pass, not combat — do NOT attack, steal from, or harm
  any Stillwater NPC (many are quest-critical)."

goals:
  - "Get to Stillwater. The smoketester likely spawns elsewhere; if an admin
    teleport is available (try `goto 4102` or `room 4102`, or `teleport 4102`),
    jump to Lakefront Square (room 4102). Otherwise navigate there on foot. Run
    `time` on arrival and log the current game hour."
  - "Confirm game-time is advancing: run `time` a few times across the session
    (a full game-day is short, ~80s real-time at default RoundsPerDay). Log the
    hours you observe so schedule transitions can be correlated."
  - "SCHEDULES — observe these 9 NPCs moving across the day. Sample each NPC's
    room every minute or so for ~2-3 game-days and confirm they occupy the
    expected rooms per game-hour:
      * Innkeeper Sigrid (333): Pike & Lantern 4103 day/evening, loft 4104 at night (asleep).
      * Barmaid Neva (334): Pike & Lantern 4103, loft 4104 at night.
      * Smith Brindle (337): smithy 4106 by day (craft), tavern 4103 evening (18-22), smithy at night.
      * Temple Priest Seren (344): temple 4123 all day, asleep there at night (21-5).
      * Dock Master Arn (342): docks 4116 by day, promenade 4113 at dusk (17-20), docks at night.
      * Apothecary Ilsa (338): Healer's Alcove 4125 all day (craft morning), asleep there at night.
      * Miller Bram (348): watermill 4135 all day, asleep there at night.
      * Mistress Vella (355): Healer's Cottage 4136 by day, Ilsa's alcove 4125 (9-11), Ulla's Parlor 4137 (16-20), cottage at night.
      * Old Fisherman Hodder (343): net yard 4117, Lakefront Square 4102 (10-13), net yard, asleep there at night."
  - "SLEEP — at night (game hours ~20-6) confirm the scheduled NPCs show as
    asleep in their sleep rooms (sleeping flavor, e.g. 'breathes evenly'). Confirm
    they wake and move when day begins."
  - "CONVERSATIONS — the highest-value check. Stand idle in these rooms during the
    overlap windows and watch for multi-line NPC-to-NPC exchanges (two NPCs
    alternating `say` lines across consecutive rounds):
      * Pike & Lantern 4103 (Sigrid 333 + Neva 334) — daytime.
      * Lakefront Square 4102 (Hodder 343 arrives 10-13, joins stationary Tov 336).
      * Healer's Alcove 4125 (Vella 355 visits Ilsa 338, game hours 9-11).
      * Ulla's Parlor 4137 (Vella 355 visits Ulla 347, game hours 16-20) — the
        intended emotional beat; should be gentle, never names Elgar outright.
    Log any full exchange verbatim. Note which pair and roughly what game hour."
  - "GOSSIP/FACTS — listen for gossipers (Neva 334, Hodder 343, Gyda 349, plus
    Fenwick 353 and Oswin 354) mentioning town news: the failing catch / shredded
    nets, cave creatures in the shallows, the man the lake took twelve years ago,
    the spiral motif, the vanished pearl-divers. Log any gossip lines."
  - "ADMIN SUBSTRATE CHECKS — run these inspectors and log output:
      * `relationship show 347` and `relationship between 347 355` (Ulla/Vella family).
      * `relationship between 333 334` (Sigrid/Neva employer).
      * `relationship show 343` (Hodder's mentorships + friendships).
      * `fact list` (should include the 5 stillwater- facts).
      * `fact awareness 343` (Hodder should know lake-decline, cave-creatures,
        voss-death, pearl-divers-gone).
      * `mob schedule <instId>` for one or two anchors (e.g. Vella, Hodder) to
        confirm the active segment/target-room resolves."
  - "STABILITY — watch for any NPC acquiring a 'lost' adjective, getting stuck in
    one room across a whole day it should have left, or any error/panic text. Flag
    immediately with the game hour and verbatim text."

pass_criteria:
  - "All 9 scheduled NPCs observed in at least their day-work room and their
    night/sleep state across the observation window."
  - "Vella observed visiting BOTH Ilsa's alcove (4125, ~9-11) and Ulla's parlor
    (4137, ~16-20) — the two review-fix co-locations."
  - "Hodder observed at Lakefront Square (4102) during ~10-13, co-located with Tov."
  - "At least one full multi-line NPC-to-NPC conversation observed (any of the 4
    pairs). Bonus: the Ulla/Vella parlor exchange specifically."
  - "At least one gossip line referencing one of the 5 seeded facts observed."
  - "Admin inspectors (`relationship`, `fact`, `mob schedule`) all return valid
    state, not errors."
  - "No NPC stuck/lost; no panic or error text during the session."

notes:
  - "Server runs locally at localhost:55555, freshly booted with chunk 6.1 merged
    to master and instance saves wiped."
  - "Use `set charset` (ASCII) immediately after login per the test-mud SOP."
  - "Game-day is short at default RoundsPerDay (~20 rounds/day), so schedule
    segments flip fast — sample frequently (every ~30-60s real). If an
    `time set <hour>` admin command exists, use it to jump to the windows you want
    to observe (e.g. set ~16 to catch Vella at Ulla's parlor) rather than waiting."
  - "To find a mob's instance id for `mob schedule`, `look <name>` in its room and
    read the admin output, or check `who`."
  - "Stillwater key rooms: 4100 gate, 4102 square, 4103 inn, 4104 loft, 4106
    smithy, 4116 docks, 4113 promenade, 4117 net yard, 4123 temple, 4125 healer's
    alcove, 4135 watermill, 4136 healer's cottage, 4137 Ulla's parlor."
  - "Do NOT attack/steal/harm any Stillwater NPC — observation only."
  - "Report each goal PASS/FAIL/BLOCKED with game-hour timestamps and verbatim log
    excerpts. Save to tools/testing/reports/ with a dated stillwater-town-flavor
    name."
