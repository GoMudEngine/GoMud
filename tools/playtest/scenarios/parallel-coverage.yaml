# 0.3d shared-env concurrency exemplar: one ephemeral server, two actors,
# independent goals (no character interaction required). Prefer this over
# two separate `playtestrun run` invocations when the point is concurrent
# AI connections on one world.

name: parallel-coverage
mode: parallel
summary: >-
  Two testers independently exercise different DOGMud areas/systems at once —
  concurrency + coverage, no interaction expected.
on_actor_stop: continue
budgets:
  wall_clock: 45m
requires:
  max_connections: 20
roster:
  - id: explorer
    personality: feel-tester
    goals: goals/scenarios/parallel-coverage/explorer.yaml
  - id: shopper
    personality: feature-tester
    goals: goals/scenarios/parallel-coverage/shopper.yaml

group_goals:
  - id: concurrency
    do: Both agents play simultaneously for the session.
    verify: >-
      Both ran concurrently with no crash/disconnect; the server accepted two
      AI connections at once (no AI-pool-full rejection).
