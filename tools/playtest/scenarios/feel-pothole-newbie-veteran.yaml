# 0.3d shared-env concurrency + UX coverage for Pothole Coulee. Newbie uses
# creation_flow; veteran uses a seeded mid profile at the Awakening Pool.

name: feel-pothole-newbie-veteran
mode: parallel
summary: >-
  Two feel-testers exercise the Pothole Coulee newbie experience at once: a
  brand-new MUD player judging onboarding clarity, and a completionist veteran
  who methodically works the spokes, repeatables, and the hike-out corridor.
  Concurrency + UX coverage; no interaction expected between them.
on_actor_stop: continue
budgets:
  wall_clock: 45m
requires:
  max_connections: 20
roster:
  - id: newbie
    personality: feel-tester
    goals: goals/scenarios/feel-pothole-newbie-veteran/newbie.yaml
  - id: veteran
    personality: feel-tester
    goals: goals/scenarios/feel-pothole-newbie-veteran/veteran.yaml

group_goals:
  - id: concurrency
    do: Both testers play simultaneously for the session.
    verify: >-
      Both ran concurrently with no crash/disconnect; the server accepted two
      AI connections at once (no AI-pool-full rejection).
