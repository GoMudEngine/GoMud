# DOGMud party commands (verified in internal/usercommands/party.go):
#   Invite: party invite <name>       (leader; auto-creates party if none exists)
#   Accept: party accept              (invitee runs this to join)
#   Decline: party decline
#   List:   party list
#   Chat:   party say <message>
#
# 0.3d: shared ephemeral env via `playtestrun scenario`. Per-actor goals +
# loadouts live under goals/scenarios/party-formation/.

name: party-formation
mode: party
summary: >-
  Two testers form a DOGMud party via 'party invite' / 'party accept' and
  verify shared membership via GMCP + party list.
on_actor_stop: continue
budgets:
  wall_clock: 45m
requires:
  max_connections: 20
roster:
  - id: leader
    personality: feature-tester
    goals: goals/scenarios/party-formation/leader.yaml
  - id: joiner
    personality: feel-tester
    goals: goals/scenarios/party-formation/joiner.yaml

group_goals:
  - id: party-formed
    do: >-
      Leader issues 'party invite <joiner-name>'; joiner runs 'party accept'.
      Coordinate via blackboard: leader waits on 'joiner-ready', signals
      'leader-invited'; joiner waits on 'leader-invited', signals
      'joiner-accepted'.
    verify: >-
      Both agents end in the same party (GMCP PartyUpdated fires / 'party list'
      shows 2 members on both sides). No connection errors or stuck-state.
  - id: party-chat
    do: Leader sends a party chat line after the party forms.
    verify: >-
      Leader's 'party say' does not error; member's event stream shows or
      acknowledges the leader's party message.
