name: "Codegen and Test"
description: "Run go generate, the gofmt/vet gates, and go test"
runs:
  using: "composite"
  steps:
    - run: go generate ./...
      shell: bash

    # The format and vet gates run before the test suite on purpose: they fail
    # in seconds, while `go test -race ./...` takes minutes. Both were
    # previously Makefile-only (`make validate`) and no workflow invoked them,
    # which is how 234 files drifted out of gofmt compliance unnoticed.
    #
    # gofmt -l (report) rather than go fmt (rewrite): CI must not mutate the
    # tree and then pass.
    - name: Check gofmt
      shell: bash
      run: |
        unformatted=$(git ls-files '*.go' | grep -v '^vendor/' | xargs -r gofmt -l)
        if [ -n "$unformatted" ]; then
          echo "::error::These files are not gofmt-clean. Fix with: gofmt -w <file>"
          echo "$unformatted"
          exit 1
        fi
        echo "All tracked Go files are gofmt-clean."

    - name: Run go vet
      shell: bash
      run: go vet ./...

    # Loads every YAML data file through the real boot path (the same
    # loadAllDataFiles main() calls), so malformed content fails CI instead of
    # only surfacing when someone remembers to boot the server before pushing —
    # the manual step in CLAUDE.md's Pre-Push SOP.
    #
    # Its own step, opt-in via env var, and without -race: it takes ~20s and
    # materially longer under the race detector, which buys nothing here since
    # loading is single-threaded. The main suite below skips it automatically
    # because the env var is unset there.
    - name: Data-file boot smoke test
      shell: bash
      env:
        DOGMUD_BOOT_SMOKE: "1"
      run: go test -run TestSmoke_ServerBootsCleanWithRealData -timeout 300s .

    - run: go test -timeout 300s -race -coverprofile=coverage.out ./...
      shell: bash
