---
name: Docker Image

"on":
  workflow_call:
    inputs:
      release_tag:
        description: Stable semver release tag, such as v0.10.0
        required: true
        type: string

concurrency:
  group: docker-package-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # actions/checkout v6.0.3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate stable release tag
        run: |
          set -euo pipefail

          semver_re='^v(0|[1-9][0-9]*)\.'
          semver_re="${semver_re}(0|[1-9][0-9]*)\."
          semver_re="${semver_re}(0|[1-9][0-9]*)$"
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq "$semver_re"; then
            echo "release_tag must be a stable semver tag like v0.10.0" >&2
            exit 1
          fi

      - name: Detect Go version
        id: go-version
        # The Dockerfile build arg follows go.mod through the Makefile helper.
        run: echo "version=$(make go-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.1.0
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to the Container registry ${{ env.REGISTRY }}
        # docker/login-action v4.2.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        # docker/metadata-action v6.1.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}

      - name: Build and push Docker image
        id: push
        # docker/build-push-action v7.2.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          file: ./provisioning/Dockerfile
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-package
          cache-to: type=gha,mode=max,scope=docker-package

      - name: Generate artifact attestation
        # actions/attest-build-provenance v4.1.0
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
